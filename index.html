rselben Nacht montierte sie mit Styke und Valeria zwei schwere Ketten im Dalliance-Tunnel. Danach entdeckte sie im \u003ca href=\"#/artikel/rotes-buch\">roten Buch\u003c/a> einen Absatz, an den sie sich nicht erinnerte.\u003c/p>\n\u003ch2>Der 2. Februar\u003c/h2>\n\u003cp>Bei der Vell-Aktion formte Vesper das Gefecht mit Dancing Darkness, Euphoric Cloud und Witness to Glory. Später erklärte und schrieb sie Nellas Compact, schloss das Siegel als Keeper und erhielt dessen private Resonanz.\u003c/p>\n\u003cp>Ihre Keeper-Rolle macht Nella zu einer Gebundenen unter Styke und Vesper; das Kollektiv bleibt davon unberührt. Vesper und Valeria besitzen weiterhin gemeinsam das Vetorecht bei künftigen Aufnahmen in das Gefolge.\u003c/p>\n\u003ch2>Der 3. Februar\u003c/h2>\n\u003cp>Vesper ritt mit Styke und Valeria nach Aldencross zurück. Sie kaufte schwarze Schuhe mit feinerem Absatz und ein schmales schwarzes Haarband. Bei \u003ca href=\"#/artikel/mirelle\">Mirelle\u003c/a> erhielt sie zwei auf ihren Greifschwanz zugeschnittene Wäschestücke in Rot und dunklem Pflaumenton.\u003c/p>\n\u003cp>Mirelle kam am Abend mit Maßband und Arbeitstasche ins Dalliance und blieb bis zum Schlafen im rückwärtigen Zimmer.\u003c/p>\n\u003ch2>Zwischenstand nach dem 3. Februar\u003c/h2>\u003cp>Nella blieb über den Compact an sie gebunden und war mit Tamsin unterwegs; das psionische Kollektiv umfasste weiterhin nur Vesper und Valeria.\u003c/p>\n\u003ch2>Nachschlagen\u003c/h2>\u003cp>\u003ca href=\"#/artikel/bogen-vesper\">Charakterbogen\u003c/a> / \u003ca href=\"#/artikel/psy-vesper\">Psychologisches Profil\u003c/a> / \u003ca href=\"#/artikel/verse\">Verse\u003c/a> / \u003ca href=\"#/artikel/intim-vesper\">Private Akte\u003c/a>\u003c/p>\u003ch2>Der 6. Februar\u003c/h2>\u003cp>Vespers Arbeiterdeckung hielt. Sie sah Franz und Zack angespannt miteinander, hörte aber kein Wort; am Abend des 6. Februar lebte Zack noch. Später schrieb sie Mirelles persönlichen Compact, schloss den Carnal Seal als Keeper und  ich verantwortlich, was habe ich zugesagt und was kann ich halten? Timeon bleibt ihr wichtig, obwohl sie Stykes Befehl befolgt, nicht zu ihm zurückzukehren.\u003c/p>\n\u003ch2>Der 1. und 2. Februar\u003c/h2>\n\u003cp>Am 1. Februar führte sie auf Stykes Bitte eine private Begegnung und hielt ihn danach fest, als er darum bat. Später besprach sie mit Styke und Zorn ein mögliches reversibles Verwandlungsprojekt; Vesper kennt dieses Vorhaben nicht.\u003c/p>\n\u003cp>Bei Darran Vells Ende kämpfte Valeria an der Front und tötete einen bereits ergebenen Mann. Mit Tamsin legte sie anschließend die falsche Pferdespur. Als Styke Tamsin später sexuelle Gewalt als mögliche Todesstrafe androhte, widersprach Valeria: Wenn Tamsin sterben müsse, dann nicht so und nicht als Strafe des Knotens. Vesper setzte durch, dass eine solche Entscheidung nur gemeinsam mit Styke fallen kann.\u003c/p>\n\u003ch2>Der 3. Februar\u003c/h2>\n\u003cp>Valeria ritt mit Styke und Vesper nach Aldencross zurück und kaufte dunkelblaue, flache Schuhe aus Kalbsleder. \u003ca href=\"#/artikel/mirelle\">Mirelle\u003c/a> begann für sie ein festes Unterzeug unter der Rüstung: dunkles Leinen, weiche Innenseite, doppelte Front und seitliche Schnürung.\u003c/p>\n\u003cp>Am Abend übernahm Valeria vor Vesper und Mirelle sichtbar die Führung über Styke. Aus einer privaten Umkehr wurde damit eine Stellung, die sie auch vor einer neuen Zeugin aussprach und hielt.\u003c/p>\n\u003ch2>Zwischenstand nach dem 3. Februar\u003c/h2>\u003cp>Nach Mirelles erstem gemeinsamen Abend blieben Platte, meisterliches Großschwert und Cloak of Resistance +1 ihre aktuelle Ausrüstung.\u003c/p>\n\u003ch2>Nachschlagen\u003c/h2>\u003cp>\u003ca href=\"#/artikel/bogen-valeria\">Charakterbogen\u003c/a> / \u003ca href=\"#/artikel/psy-valeria\">Psychologisches Profil\u003c/a> / \u003ca href=\"#/artikel/dreierkonstellation\">Dreierkonstellation\u003c/a> / \u003ca href=\"#/artikel/intim-valeria\">Private Akte\u003c/a>\u003c/p>\u003ch2>Der 6. Februar\u003c/h2>\u003cp>Beim Training sprach Valeria aus, dass Stykes frühere Gewalt und ihre heutige Liebe gleichzeitig wahr bleiben. Styke entschuldigte sich für damals; sie nahm die Entschuldigung an, ohne die Vergangenheit zu vergeben oder zu löschen. Beide vereinbarten, dass künftige Zeit zu zweit nicht automatisch dem Trio gehört. Für die Organisation übernahm Valeria die angebotene Rolle als mögliche Feldführerin unter Styke und Vesper.\u003c/p>\n\u003ch2>Stand am 7. Februar\u003c/h2>\u003cp>Valeria überbrachte Hakon die neue Staffel-, Abhol- und Pferdeanweisung. Nach Tamsins erfolgreicher Rückkehr führt Valeria die militärisch-logistische Linie für Tamsins Schutz- und Evakuierungsauftrag im Dalliance.\u003c/p>\u003cp>Mirelle beendete und übergab Valerias Rüstungsunterkleidung nach der letzten Plattenprobe. Für den 8. Februar ist vereinbart, dass Valeria das rote Buch allein und ohne vorherige Hinweise liest.\u003c/p>\u003cp>Styke stellte Valeria ausdrücklich in dieselbe langfristige Zukunft, die er mit Vesper besprach. Er machte ihr keinen Antrag. Valeria will erst sehen, was aus ihnen wird, wenn Balentyne, Thorn und die gegenwärtigen Zwänge hinter ihnen liegen.\u003c/p>","sources":["valeria","live","chronicle","relations"],"status":"Aktuell bis 7. Februar","tags":["Kernfigur","Stufe 5","Frontlinie","Lord’s Dalliance"],"aliases":["Balina","Dame Balina","Sir Balin","Balina von Karfeld"],"group":"inner","initial":"V","text":"Identität und Erscheinung Valeria stammt aus Karfeld. Als Dame Balina war sie mitranische Ritterin und Jägerin gefährlicher Ketzer. Sie ist groß, athletisch und kräftig, mit aschblondem Haar, graublauen Augen, feinen Gesichtszügen und einem leicht schief verheilten Nasenrücken. Balina bleibt in Valeria Mitraglaube und früherer Eid wurden in Thorns Anwesen zerbrochen. Die ritterliche Denkform blieb: Was ist geschehen, wofür bin ich verantwortlich, was habe ich zugesagt und was kann ich halten? Timeon bleibt ihr wichtig, obwohl sie Stykes Befehl bef antwortung begreift, greift er in dessen Entscheidungen ein. Der Streit um \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> zeigt den blinden Fleck: Er schützt Valeria vor einer gefährlichen Rückkehr und beansprucht dabei zugleich Deutung über einen Teil ihres früheren Lebens.\u003c/p>\n\u003ch2>Vesper und Valeria\u003c/h2>\n\u003cp>Mit Vesper bestehen gewachsene Abkürzungen aus Branderscar, Sex, Geheimnissen und gemeinsamem Überleben. Sie darf einen Informationszugang besitzen, den Styke nicht hat, ohne ihn jedes Mal erklären zu müssen.\u003c/p>\n\u003cp>Bei Valeria ist jede Verlässlichkeit mit der Erinnerung an seine Täterschaft verschränkt. Am 31. Januar befolgte sie seinen Befehl und widersprach seinem Anspruch. Am nächsten Morgen führte und hielt sie ihn. Styke erlebte beides als Bindung.\u003c/p>\n\u003ch2>Begehren\u003c/h2>\n\u003cp>Styke ist körperlich direkt und wenig schamhaft. Begehren und Strategie laufen bei Kaitlyn gleichzeitig. Bei Vesper und Valeria erhalten eingehaltene Versprechen, vertauschte Rollen und die seltenen Momente, in denen er nicht entscheidet, besonderes Gewicht.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/styke\">Zur Personenakte\u003c/a> / \u003ca href=\"#/artikel/psy-vesper\">Vespers Profil\u003c/a> / \u003ca href=\"#/artikel/psy-valeria\">Valerias Profil\u003c/a>\u003c/p>\n\u003ch2>Private Akte (18+)\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/intim-styke\">Intimität und persönliche Beziehungen\u003c/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.\u003c/p>","sources":["styke","psy","relations","chronicle"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Handlungsfähigkeit Styke richtet seine Aufmerksamkeit auf Ausgänge, Reichweite, brauchbare Menschen und die Folgen eines Fehlers. Schmerz kann er einordnen; Ohnmacht nicht. Deshalb delegiert er an kompetente Gefährten, solange Zuständigkeit und Loyalität belastbar bleiben. Wort und Folge Versprechen, a in Mitglied des Kollektivs. Mechanik 14 HP, INT 8, Natural Armor Adjustment +3. Bei erfüllten Familiar-Bedingungen verleiht er Vesper +4 Initiative. Vespers Bogen .","links":["bogen-vesper"],"backlinks":["vesper","psy-vesper","tacitus","matilda","scroll","branderscar","abstammungen","story-so-far","zeit-vorgeschichte","zeit-tacitus","zeit-0201","kollektiv","bogen-vesper"],"search":"verse erwachtes reliquiar vespers vertrauter und ein eigenstandiges gegenuber gegenwartig mit der gruppe am schafgehege begleiter magie inner wesen und bindung verse ist ein einzigartiges erwachtes reliquiar mit mannlicher stimme im deutschen gilt er ihm sein er ist mechanisch ein protector familiar in der fiktion aber kein insekt vesper liess ihn bei ihrer ursprunglichen flucht nicht zuruck seine bindung an sie ist personlich und dauerhaft nicht nur ein initiativebonus erinnern ist nicht allwissen er erinnert worte gebete hande und orte aber keine vollstandige eigene lebensgeschichte beim gesprach mit tacitus unterschied er alte erinnerungsfragmente von neuen schlussfolgerungen und erklarte vesper widersprechen zu konnen aktueller stand verse ist mit vesper styke valeria tamsin und nella am alten schafgehege er ist kein mitglied des kollektivs mechanik 14 hp int 8 natural armor adjustment 3 bei erfullten familiar bedingungen verleiht er vesper 4 initiative vespers bogen"},{"id":"zorn","category":"personen","title":"Zorn","summary":"Stykes Psicrystal und Personality Fragment. Mechanischer Helfer, nicht automatisch Teil der Telepathie.","body":"\u003ch2>Stykes kleiner zweiter Blick\u003c/h2>\n\u003cp>Zorn ist Stykes Psicrystal aus \u003cem>Personality Fragment\u003c/em>. Er ist kein zweites Verse, kein Mitglied des Kollektivs und kein allwissender Chronist. Seine Verbindung zu Styke ist enger und schmaler zugleich: ein eigener kleiner Geist, gebunden an den Mann, aus dem er hervorging.\u003c/p>\n\u003cp>Am 1. Februar lag der kopierte Balentyne-Plan bei Styke, und Zorn half, Linien, bekannt e kein mitglied des kollektivs und kein allwissender chronist seine verbindung zu styke ist enger und schmaler zugleich ein eigener kleiner geist gebunden an den mann aus dem er hervorging am 1 februar lag der kopierte balentyne plan bei styke und zorn half linien bekannte raume und hypothesen auseinanderzuhalten spater horte er die gesprache im schankraum mit und konnte die unsichere brauchbarkeit der geruchte mittragen er macht daraus keine wahrheit mechanische anker 17 hp diminutive construct int 9 tactical assistance ist ein int check mit 1 gegen dc 10 defensive aid nutzt seine eigene standard action und gibt bei erfolg styke 2 ac gegen den gewahlten gegner informant unterstutzt passende knowledge all checks pauschal mit 2 details stehen in stykes bogen und der aid recovery referenz","links":["bogen-styke","aid"],"backlinks":["kollektiv","zorn-aid","bogen-styke"]},{"id":"grumblejack","category":"personen","title":"Grumblejack","summary":"Freier Oger und Freund. Sein letzter gesicherter Stand ist Hakons Feldgruppe außerhalb von Aldencross.","body":"\u003ch2>Gemeinsame Geschichte\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> öffneten Grumblejacks Zelle in \u003ca href=\"#/artikel/branderscar\">Branderscar\u003c/a>. Er ging mit ihnen, weil sie ihn fütterten, mit ihm kämpften und Beute teilten. Aus der Fluchtgemeinschaft wurde Freundschaft.\u003c/p>\n\u003ch2>Persönlichkeit und Alltag\u003c/h2>\n\u003cp>Grumblejack ist hungrig, abergläubisch, kampflustig und praktisch klug. Neue Ketten reizen eine alte Wunde. Seine Größe, sein Gewicht und sein Nahrungsbedarf erschweren Unterkunft, Tarnung und Reisen.\u003c/p>\n\u003ch2>Anteil und Aufenthaltsort\u003c/h2>\n\u003cp>Nach \u003ca href=\"#/artikel/freemans-rock\">Freeman's Rock\u003c/a> erhielt er Varnings Kriegspferd \u003ca href=\"#/artikel/varlet\">Varlet\u003c/a> als eigenen Anteil und Packtier. Er befindet sich mit \u003ca href=\"#/artikel/hakon\">Hakon\u003c/a> und den fünf Norspikern im verborgenen Feldlager. Seitdem ging kein neuer Bericht bei Styke ein.\u003c/p>\u003ch2>Letzter gesicherter Bericht\u003c/h2>\u003cp>Hakon, seine fünf weiteren Männer und Grumblejack sind unverletzt und weiterhin mit den sieben erbeuteten Pferden im Feld. Unter dem verschärften Straßendruck bot sich kein sicherer kleiner Angriff. Nella und Tamsin brachen am 3. Februar mit dem neuen Auftrag in ihre Richtung auf; eine Rückmeldung ist in Aldencross noch nicht eingetroffen.\u003c/p>\n\u003ch2>Nachricht am 7. Februar\u003c/h2>\u003cp>Nella brachte ihm zusätzliches Fleisch, ein kleines Fass Dünnbier und Stykes Nachricht: „Seine Freunde haben ihn nicht vergessen.“ Grumblejack antwortete, dass er seine Freunde ebenfalls nicht vergessen habe, und bot ihr Fleisch an.\u003c/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Freund","Feldgruppe"],"aliases":[],"group":"field","text":"Gemeinsame Geschichte Styke und Vesper öffneten Grumblejacks Zelle in Branderscar . Er ging mit ihnen, weil sie ihn fütterten, mit ihm kämpften und Beute teilten. Aus der Fluchtgemeinschaft wurde Freundschaft. Persönlichkeit und Alltag Grumblejack ist hungrig, abergläubisch, kampflustig und praktisch klug. Neue Ketten reizen eine alte Wunde. Seine Größe, sein Gewicht und sein Nahrungsbedarf erschweren Unterkunft, Tarnung und Reisen. Anteil und Aufenthaltsort Nach Freeman's Rock erhielt er Varnings Kriegspferd Varlet als eigenen Anteil und Packtier. Er befindet sich mit Hakon und den fünf Norspikern im verborgenen Feldlager. Seitdem ging kein neuer Bericht bei Styke ein. Letzter gesicherter Bericht Hakon, seine fünf weiteren Männer und Grumblejack sind unverletzt und weiterhin mit den sieben erbeuteten Pferden im Feld. Unter dem verschärften Straßendruck bot sich kein sicherer kleiner Angriff. Nella und Tamsin brachen am 3. Februar mit dem neuen Auftrag in ihre Richtung auf; eine Rückmeldung ist in Aldencross noch nicht eingetroffen. Nachricht am 7. Februar Nella brachte ihm zusätzliches Fleisch, ein kleines Fass Dünnbier und Stykes Nachricht: „Seine Freunde haben ihn nicht vergessen.“ Grumblejack antwortete, dass er seine Freunde ebenfalls nicht vergessen habe, und bot ihr Fleisch an.","links":["styke","vesper","branderscar","freemans-rock","varlet","hakon"],"backlinks":["styke","hakon","sten","ketil","eirik","arved","torvald","varning","varlet","branderscar","abstammungen","feldgruppe","story-so-far","zeit-branderscar","zeit-0126","kollektiv"],"search":"grumblejack freier oger und freund sein letzter gesicherter stand ist hakons feldgruppe ausserhalb von aldencross freund feldgruppe field gemeinsame geschichte styke und vesper offneten grumblejacks zelle in branderscar er ging mit ihnen weil sie ihn futterten mit ihm kampften und beute teilten aus der fluchtgemeinschaft wurde freundschaft personlichkeit und alltag grumblejack ist hungrig aberglaubisch kampflustig und praktisch klug neue ketten reizen eine alte wunde seine grosse sein gewicht und sein nahrungsbedarf erschweren unterkunft tarnung und reisen anteil und aufenthaltsort nach freeman s rock erhielt er varnings kriegspferd varlet als eigenen anteil und packtier er befindet sich mit hakon und den funf norspikern im verborgenen feldlager seitdem ging kein neuer bericht bei styke ein letzter gesicherter bericht hakon seine funf weiteren manner und grumblejack sind unverletzt und weiterhin mit den sieben erbeuteten pferden im feld unter dem verscharften strassendruck bot sich kein sicherer kleiner angriff nella und tamsin brachen am 3 februar mit dem neuen auftrag in ihre richtung auf eine ruckmeldung ist in aldencross noch nicht eingetroffen nachricht am 7 februar nella brachte ihm zusatzliches fleisch ein kleines fass dunnbier und stykes nachricht seine freunde haben ihn nicht vergessen grumblejack antwortete dass er seine freunde ebenfalls nicht vergessen habe und bot ihr fleisch an"},{"id":"hakon","category":"personen","title":"Hakon","summary":"Anführer der sechs angeworbenen Nordmänner; die überarbeiteten Staffel-, Pferde- und Abholbefehle sind angekommen.","body":"\u003ch2>Herkunft und Gruppe\u003c/h2>\u003cp>Hakon verließ Odenkirks Mannschaft mit \u003ca href=\"#/artikel/sten\">Sten\u003c/a>, \u003ca href=\"#/artikel/ketil\">Ketil\u003c/a>, \u003ca href=\"#/artikel/eirik\">Eirik\u003c/a>, \u003ca href=\"#/artikel/arved\">Arved\u003c/a> und \u003ca href=\"#/artikel/torvald\">Torvald\u003c/a>. Zusammen bilden sie eine sechsköpfige Norspiker-Gruppe. \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a> arbeitet mit ihnen, ist aber kein Untergebener.\u003c/p>\n\u003ch2>Geltender Auftrag\u003c/h2>\u003cp>Die Gruppe soll sich erhalten, keine freiwilligen Gefechte beginnen und für Rückhalt, Sicherung und Evakuierung bereitstehen. Grumblejack bleibt mit den sieben erbeuteten Pferden außerhalb Aldencross’.\u003c/p>\n\u003ch2>Befehle vom 7. Februar\u003c/h2>\u003cp>Valeria überbrachte die überarbeitete Anweisung: Die sechsköpfige Gruppe bewegt sich in getrennten Paaren und mit Abstand nach Aldencross. Mirelle soll am 8. Februar nach Prüfung ihres Erkennungszeichens direkt zum Lord’s Dalliance gebracht werden. Falls Kaitlyn dann noch im Mott-Haus ist, gehört auch ihre Abholung zum Auftrag.\u003c/p>\u003cp>Styke, Vesper und Valeria sahen Sten und Ketil als erstes Paar im Dalliance. Weitere Bewegungen gelten erst nach Nachricht oder eigener Beobachtung als bekannt.\u003c/p>","sources":["core","chronicle","live"],"status":"Feldgruppe / neue Befehle erhalten","tags":["Norspiker","Feldgruppe","7. Februar"],"aliases":[],"group":"field","text":"Herkunft und Gruppe Hakon verließ Odenkirks Mannschaft mit Sten , Ketil , Eirik , Arved und Torvald . Zusammen bilden sie eine sechsköpfige Norspiker-Gruppe. Grumblejack arbeitet mit ihnen, ist aber kein Untergebener. Geltender Auftrag Die Gruppe soll sich erhalten, keine freiwilligen Gefechte beginnen und für Rückhalt, Sicherung und Evakuierung bereitstehen. Gr n bisherige rolle und aktueller wissensstand die feldgruppe half bei der operation an freeman s rock und halt sich nun mit grumblejack und den erbeuteten pferden ausserhalb aldencross verborgen hakons geltende auftrage sind gelegenheitsschlage ohne unnotiges risiko und ein treffen zwei tage vor dem hauptangriff eine neue nachricht verwundung oder einzelunternehmung dieser person ist nicht beim kerntrio angekommen das dauerhafte archiv belegt hier keine weiter ausgearbeitete individuelle biographie"},{"id":"tamsin","category":"personen","title":"Tamsin Blackerly","summary":"Gebundene Wächterin; nach der erfolgreichen Rückkehr mit Nella führt sie in der Angriffsnacht Schutz und Evakuierung im Dalliance.","body":"\u003ch2>Die ehemalige Sergeantin\u003c/h2>\u003cp>Tamsin ist die weibliche Kampagnenfassung des korrupten Branderscar-Sergeanten Blackerly. Sie überlebte den Ausbruch und wurde durch einen älteren, härteren Blutpakt an Styke und Vesper gebunden. Bewachung, Sicherheit und praktische Gewalt sind ihre brauchbarsten Fähigkeiten.\u003c/p>\n\u003ch2>Timeon und Darran Vell\u003c/h2>\u003cp>Tamsin brachte \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> sicher zum Familienanwesen. Statt danach zurückzukehren, stieg sie in \u003ca href=\"#/artikel/darran-vell\">Darran Vells\u003c/a> illegales Vieh- und Papiergeschäft ein. Als sie um ihren Anteil fürchtete, stahl sie sein Hauptbuch und bluffte mit einer Abschrift, die nie existierte.\u003c/p>\u003cp>Am 2. Februar zwang Styke im alten Schafgehege eine Einigung. Tamsin gab das Hauptbuch zurück und erhielt 18 Goldstücke sowie einen billigen Silberring. Vesper entzog ihr den erarbeiteten Rang und setzte klare Melde- und Geschäftsregeln.\u003c/p>\n\u003ch2>Nellas Auftrag\u003c/h2>\u003cp>Vom 3. bis 7. Februar stand Tamsin für den Hakon- und Familienauftrag unter \u003ca href=\"#/artikel/nella\">Nellas\u003c/a> begrenzter Einsatzführung. Sie schützte Nella, gab praktische Einwände und brachte sie rechtzeitig sowie ohne Zwischenfall zurück. Mit dem Bericht endete Nellas befristete Führung.\u003c/p>\n\u003ch2>Neuer Auftrag\u003c/h2>\u003cp>Tamsin übernimmt in der Angriffsnacht Schutz und nötigenfalls Evakuierung im Lord’s Dalliance. Für die militärisch-logistische Seite dieses Auftrags führt Valeria. Tamsin bleibt im Gasthaus und gehört nicht zum Zugriff auf Tacitus und Jacobian.\u003c/p>\n\u003ch2>Ausrüstung\u003c/h2>\u003cp>Fighter 3, HP 28/28. Kettenhemd, Valerias altes meisterliches Langschwert, Dolch, Winterkleidung, Silberring und ein unbekannter Rest der 18 gp. \u003ca href=\"#/artikel/intim-tamsin\">Private Akte\u003c/a> · \u003ca href=\"#/artikel/anatomie-tamsin\">Körperakte\u003c/a>\u003c/p>","sources":["tamsin-current","live","chronicle","knot-pact"],"status":"Rehabilitiert / Dalliance-Schutz","tags":["Branderscar","Gebundene","Eskorte","Rehabilitation"],"aliases":["Blackerly","Tomas Blackerly"],"group":"inner","text":"Die ehemalige Sergeantin Tamsin ist die weibliche Kampagnenfassung des korrupten Branderscar-Sergeanten Blackerly. Sie überlebte den Ausbruch und wurde durch einen älteren, härteren Blutpakt an Styke und Vesper gebunden. Bewachung, Sicherheit und praktische Gewalt sind ihre brauchbarsten Fähigkeiten. Timeon und Darran Vell Tamsin brachte Timeon sicher zum Familienanwesen. Statt danach zurückzukehren, stieg sie in Darran Vells illegales Vieh- und Papiergeschäft ein. Als sie um ihren Anteil fürchtete, stahl sie sein Hauptbuch und bluffte mit einer Abschrift, die nie existierte. Am 2. Februar zwang Styke im alten Schafgehege eine Einigung. Tamsin gab das Hauptbuch zurück und erhielt 18 Goldstücke sowie einen billigen Silberring. Vesper entzog ihr den erarbeiteten Rang und setzte klare Melde- und Geschäftsregeln. Nellas Auftrag Vom 3. bis 7. Februar stand Tamsin für den Hakon- und Familienauftrag unter Nellas begrenzter Einsatzführung. Sie schützte Nella, gab praktische Einwände und brachte sie rechtzeitig sowie ohne Zwischenfall zurück. Mit dem Bericht endete Nellas befristete Führung. Neuer Auftrag Tamsin übernimmt in der Angriffsnacht Schutz und nötigenfalls Evakuierung im Lord’s Dalliance. Für die militärisch-logistische Seite dieses Auftrags führt Valeria. Tamsin bleibt im Gasthaus und gehört nicht zum Zugriff auf Tacitus und Jacobian. Ausrüstung Fighter 3, HP 28/28. Kettenhemd, Valerias altes meisterliches Langschwert, Dolch, Winterkleidung, Silberring und ein unbekannter Rest der 18 gp. Private Akte · Körperakte","search":"tamsin blackerly gebundene wachterin nach der erfolgreichen ruckkehr mit nella fuhrt sie in der angriffsnacht schutz und evakuierung im dalliance blackerly tomas blackerly branderscar gebundene eskorte rehabilitation inner die ehemalige sergeantin tamsin ist die weibliche kampagnenfassung des korrupten branderscar sergeanten blackerly sie uberlebte den ausbruch und wurde durch einen alteren harteren blutpakt an styke und vesper gebunden bewachung sicherheit und praktische gewalt sind ihre brauchbarsten fahigkeiten timeon und darran vell tamsin brachte timeon sicher zum familienanwesen statt danach zuruckzukehren stieg sie in darran vells illegales vieh und papiergeschaft ein als sie um ihren anteil furchtete stahl sie sein hauptbuch und bluffte mit einer abschrift die nie existierte am 2 februar zwang styke im alten schafgehege eine einigung tamsin gab das hauptbuch zuruck und erhielt 18 goldstucke sowie einen billigen silberring vesper entzog ihr den erarbeiteten rang und setzte klare melde und geschaftsregeln nellas auftrag vom 3 bis 7 februar stand tamsin fur den hakon und familienauftrag unter nellas begrenzter einsatzfuhrung sie schutzte nella gab praktische einwande und brachte sie rechtzeitig sowie ohne zwischenfall zuruck mit dem bericht endete nellas befristete fuhrung neuer auftrag tamsin ubernimmt in der angriffsnacht schutz und notigenfalls evakuierung im lord s dalliance fur die militarisch logistische seite dieses auftrags fuhrt valeria tamsin bleibt im gasthaus und gehort nicht zum zugriff auf tacitus und jacobian ausrustung fighter 3 hp 28 28 kettenhemd valerias altes meisterliches langschwert dolch winterkleidung silberring und ein unbekannter rest der 18 gp private akte korperakte","links":["timeon","darran-vell","nella","intim-tamsin","anatomie-tamsin"],"backlinks":["branderscar","nessian-knot","spielstand","story-so-far","zeit-branderscar","anatomie-tamsin"]},{"id":"timeon","category":"personen","title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"\u003ch2>Balinas Knappe\u003c/h2>\n\u003cp>Timeon war der junge Knappe von \u003ca href=\"#/artikel/valeria\">Dame Balina\u003c/a> und blieb Mitra zugewandt. Der \u003ca href=\"#/artikel/privatpakt\">Privatpakt\u003c/a> trägt weder seinen Namen noch seine Zusage. Gegenüber \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und dem Knoten überwiegt Furcht.\u003c/p>\n\u003ch2>Erinnerung an Balentyne\u003c/h2>\n\u003cp>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe \u003ca href=\"#/artikel/timeon-karte\">Karte\u003c/a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.\u003c/p>\n\u003ch2>Auf dem Familienhof\u003c/h2>\n\u003cp>Tamsin brachte ihn zum vorgesehenen \u003ca href=\"#/artikel/timeon-hof\">Familienanwesen\u003c/a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.\u003c/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["valeria","privatpakt","styke","timeon-karte","timeon-hof"],"backlinks":["psy-styke","psy-valeria","tamsin","timeon-hof","thorn-manor","mitra","timeon-karte","privatpakt","story-so-far","zeit-ausbildung","zeit-0123","zeit-valeria-rueckkehr","kollektiv"],"search":"timeon valerias fruherer knappe mitranisch verangstigt auf einem familienhof untergebracht und trager einer groben erinnerungskarte knappe sicher untergebracht inner balinas knappe timeon war der junge knappe von dame balina und blieb mitra zugewandt der privatpakt tragt weder seinen namen noch seine zusage gegenuber styke und dem knoten uberwiegt furcht erinnerung an balentyne wahrend der ausbildung berichtete timeon woran er sich aus balentyne erinnerte und zeichnete eine grobe karte sie bildet seinen damaligen wissensstand ab und lasst raume wege und spatere anderungen offen auf dem familienhof tamsin brachte ihn zum vorgesehenen familienanwesen valeria ritt am 31 januar hin und sah selbst dass er dort sicher war sie versprach ihm eine ruckkehr erhielt spater jedoch von styke den befehl den hof nicht erneut aufzusuchen"},{"id":"thorn","category":"personen","title":"Kardinal Adrastus Thorn","summary":"Auftraggeber und weltliche Autorität des Dornpakts. Seine Vergangenheit ist nur in Teilen bekannt.","body":"\u003ch2>Bekannte Stellung\u003c/h2>\n\u003cp>Thorn rekrutierte \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> nach Branderscar, band sie durch den \u003ca href=\"#/artikel/dornpakt\">Pact of Thorns\u003c/a> und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht.\u003c/p>\n\u003ch2>Der Auftrag\u003c/h2>\n\u003cp>Balentyne brechen, \u003ca href=\"#/artikel/havelyn\">Lord Thomas Havelyn\u003c/a> töten und den Weg für \u003ca href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe\u003c/a> öffnen. \u003ca href=\"#/artikel/tiadora\">Tiadora\u003c/a> ist seine gefährliche Botin und Vollstreckerin.\u003c/p>\n\u003ch2>Was über früher bekannt ist\u003c/h2>\n\u003cp>Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. \u003cstrong>Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt.\u003c/strong> Das Wiki ergänzt dazu keine verborgene Quellenbiographie.\u003c/p>\n\u003ch2>Unterschiedliche Bindungen\u003c/h2>\n\u003cp>Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.\u003c/p>\n","sources":["core","chronicle","factions","relations"],"status":"Bestätigt","tags":["Auftraggeber","Pakt"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Bekannte Stellung Thorn rekrutierte Styke und Vesper nach Branderscar, band sie durch den Pact of Thorns und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht. Der Auftrag Balentyne brechen, Lord Thomas Havelyn töten und den Weg für Sakkarot Fire-Axe öffnen. Tiadora ist seine gefährliche Botin und Vollstreckerin. Was über früher bekannt ist Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt. Das Wiki ergänzt dazu keine verborgene Quellenbiographie. Unterschiedliche Bindungen Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.","links":["styke","vesper","dornpakt","havelyn","sakkarot","tiadora"],"backlinks":["story-so-far","zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber und weltliche autoritat des dornpakts seine vergangenheit ist nur in teilen bekannt adrastus thorn cardinal thorn auftraggeber pakt history bekannte stellung thorn rekrutierte styke und vesper nach branderscar band sie durch den pact of thorns und liess sie die neun lektionen sowie rund neunzig tage ausbildung durchlaufen vertrage belohnungen geduld und grausamkeit gehoren zur erlebten form seiner macht der auftrag balentyne brechen lord thomas havelyn toten und den weg fur sakkarot fire axe offnen tiadora ist seine gefahrliche botin und vollstreckerin was uber fruher bekannt ist sakkarot erzahlte styke und vesper dass thorn einst kardinal mitras war sein fruherer name und die genauen umstande seines falls sind ihnen nicht bekannt das wiki erganzt dazu keine verborgene quellenbiographie unterschiedliche bindungen styke und vesper stehen im grosseren dornpakt unter ihm valerias eigener privatpakt benennt dagegen styke und vesper als sterbliche autoritaten thorn ist nicht allein dadurch ihre direkte vertragsautoritat"},{"id":"tiadora","category":"personen","title":"Tiadora","summary":"Thorns infernale Botin. Sie brachte die erste Ausbruchsmöglichkeit nach Branderscar.","body":"\u003ch2>Erlebte Rolle\u003c/h2>\n\u003cp>Tiadora verschaffte \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> die entscheidende Ausbruchsmöglichkeit und blieb später als Botin und Vollstreckerin Thorns präsent. Ihre weibliche, nahezu menschliche Erscheinung ist schön, beherrscht und kalt. Gespielte Vertraulichkeit ist kein verlässlicher Beweis gewöhnlicher Zuneigung.\u003c/p>\n\u003ch2>Kontakt\u003c/h2>\n\u003cp>Das \u003ca href=\"#/artikel/nessian-siegel\">Nessianische Kontaktsiegel\u003c/a> kann für eine ernste Meldung oder einen Missionsbedarf gebrochen werden. Die etablierte Erwartung ist, dass Tiadora gewöhnlich binnen ungefähr ein bis zwei Stunden am Bruchort erscheint. Das ist keine Zusage, jede beliebige Nachricht sofort beantworten zu lassen.\u003c/p>\n\u003ch2>Wissensgrenze\u003c/h2>\n\u003cp>Ihre nicht offengelegten Fähigkeiten, Pläne und gegenwärtigen Tätigkeiten werden nicht als Spielerwissen aus dem Quellenmaterial übernommen.\u003c/p>\n","sources":["core","factions","chronicle"],"status":"Bestätigt","tags":["Botin","Thorn"],"aliases":[],"group":"history","text":"Erlebte Rolle Tiadora verschaffte Styke und Vesper die entscheidende Ausbruchsmöglichkeit und blieb später als Botin und Vollstreckerin Thorns präsent. Ihre weibliche, nahezu menschliche Erscheinung ist schön, beherrscht und kalt. Gespielte Vertraulichkeit ist kein verlässlicher Beweis gewöhnlicher Zuneigung. Kontakt Das Nessianische Kontaktsiegel kann für eine ernste Meldung oder einen Missionsbedarf gebrochen werden. Die etablierte Erwartung ist, dass Tiadora gewöhnlich binnen ungefähr ein bis zwei Stunden am Bruchort erscheint. Das ist keine Zusage, jede beliebige Nachricht sofort beantworten zu lassen. Wissensgrenze Ihre nicht offengelegten Fähigkeiten, Pläne und gegenwärtigen Tätigkeiten werden nicht als Spielerwissen aus dem Quellenmaterial übernommen.","links":["styke","vesper","nessian-siegel"],"backlinks":["thorn","story-so-far","zeit-branderscar"],"search":"tiadora thorns infernale botin sie brachte die erste ausbruchsmoglichkeit nach branderscar botin thorn history erlebte rolle tiadora verschaffte styke und vesper die entscheidende ausbruchsmoglichkeit und blieb spater als botin und vollstreckerin thorns prasent ihre weibliche nahezu menschliche erscheinung ist schon beherrscht und kalt gespielte vertraulichkeit ist kein verlasslicher beweis gewohnlicher zuneigung kontakt das nessianische kontaktsiegel kann fur eine ernste meldung oder einen missionsbedarf gebrochen werden die etablierte erwartung ist dass tiadora gewohnlich binnen ungefahr ein bis zwei stunden am bruchort erscheint das ist keine zusage jede beliebige nachricht sofort beantworten zu lassen wissensgrenze ihre nicht offengelegten fahigkeiten plane und gegenwartigen tatigkeiten werden nicht als spielerwissen aus dem quellenmaterial ubernommen"},{"id":"sakkarot","category":"personen","title":"Sakkarot Fire-Axe","summary":"Anführer des Bugbearheers im Norden. Styke versprach ihm Balentynes Tor.","body":"\u003ch2>Begegnung und Abmachung\u003c/h2>\n\u003cp>Am \u003cstrong>14. Januar 4712 AR\u003c/strong> erhielt Sakkarot Thorns Waffenlieferung. \u003ca href=\"#/artikel/styke\">Styke\u003c/a> versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden.\u003c/p>\n\u003ch2>Geteiltes Wissen\u003c/h2>\n\u003cp>Er enthüllte gegenüber Styke und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a>, dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht.\u003c/p>\n\u003ch2>Zeitdruck\u003c/h2>\n\u003cp>Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist \u003cstrong>kein mit Sakkarot vereinbarter Termin\u003c/strong>. Es wurde ihm dazu noch keine Nachricht geschickt.\u003c/p>\n","sources":["core","chronicle","live","factions"],"status":"Bestätigt","tags":["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"group":"field","text":"Begegnung und Abmachung Am 14. Januar 4712 AR erhielt Sakkarot Thorns Waffenlieferung. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden. Geteiltes Wissen Er enthüllte gegenüber Styke und Vesper , dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht. Zeitdruck Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist kein mit Sakkarot vereinbarter Termin . Es wurde ihm dazu noch keine Nachricht geschickt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far","zeit-0114"],"search":"sakkarot fire axe anfuhrer des bugbearheers im norden styke versprach ihm balentynes tor fire axe feueraxt bugbear verbundeter field begegnung und abmachung am 14 januar 4712 ar erhielt sakkarot thorns waffenlieferung styke versprach ihm personlich balentynes tor zu offnen sakkarot fuhrt das bugbearheer und ist mit thorn uber asmodeus sowie den avernischen ersten knoten verbunden geteiltes wissen er enthullte gegenuber styke und vesper dass thorn fruher ein kardinal mitras war einen alten namen oder den genauen grund seines falls lieferte diese erzahlung nicht zeitdruck die einmonatige operationsfrist seit der lieferungsphase erzeugt druck der im dalliance erwogene angriff in der nacht 8 9 februar ist kein mit sakkarot vereinbarter termin es wurde ihm dazu noch keine nachricht geschickt"},{"id":"bellam","category":"personen","title":"Bellam Barhold","summary":"Wirt des Lord's Dalliance und gut vernetzter Einwohner Aldencross'.","body":"\u003ch2>Stellung im Ort\u003c/h2>\n\u003cp>Bellam betreibt mit seiner Frau \u003ca href=\"#/artikel/alicia\">Alicia\u003c/a> das \u003ca href=\"#/artikel/dalliance\">Lord's Dalliance\u003c/a>, die Unterkunft der Gruppe. Reisende, Handwerker und dienstfreie Soldaten machen sein Gasthaus zu einer wichtigen Quelle gewöhnlichen Ortswissens.\u003c/p>\n\u003ch2>Bisherige Kontakte\u003c/h2>\n\u003cp>Er berichtete von \u003ca href=\"#/artikel/marlowe\">William Marcus Marlowe\u003c/a> und der vorgesehenen Aufführung von \u003cem>The Fall of Amberlyn\u003c/em> in Balentyne. Vor dem normalen Rückkehrfenster betrachtete er Varnings Abwesenheit noch als gewöhnliche Patrouillentätigkeit; der inzwischen bekannte Tod ist ein späterer Stand.\u003c/p>\n\u003cp>Für das Tacitus-Treffen besorgte \u003ca href=\"#/artikel/styke\">Styke\u003c/a> bei ihm Wein. Mara nannte ihn außerdem als mögliche Anlaufstelle für Arbeit. Das hat noch keinen neuen angenommenen Auftrag erzeugt.\u003c/p>\n","sources":["core","dalliance","live"],"status":"Bestätigt","tags":["Dalliance","Wirt"],"aliases":[],"group":"town","text":"Stellung im Ort Bellam betreibt mit seiner Frau Alicia das Lord's Dalliance , die Unterkunft der Gruppe. Reisende, Handwerker und dienstfreie Soldaten machen sein Gasthaus zu einer wichtigen Quelle gewöhnlichen Ortswissens. Bisherige Kontakte Er berichtete von William Marcus Marlowe und der vorgesehenen Aufführung von The Fall of Amberlyn in Balentyne. Vor dem normalen Rückkehrfenster betrachtete er Varnings Abwesenheit noch als gewöhnliche Patrouillentätigkeit; der inzwischen bekannte Tod ist ein späterer Stand. Für das Tacitus-Treffen besorgte Styke bei ihm Wein. Mara nannte ihn außerdem als mögliche Anlaufstelle für Arbeit. Das hat noch keinen neuen angenommenen Auftrag erzeugt.","links":["alicia","dalliance","marlowe","styke"],"backlinks":["alicia"],"search":"bellam barhold wirt des lord s dalliance und gut vernetzter einwohner aldencross dalliance wirt town stellung im ort bellam betreibt mit seiner frau alicia das lord s dalliance die unterkunft der gruppe reisende handwerker und dienstfreie soldaten machen sein gasthaus zu einer wichtigen quelle gewohnlichen ortswissens bisherige kontakte er berichtete von william marcus marlowe und der vorgesehenen auffuhrung von the fall of amberlyn in balentyne vor dem normalen ruckkehrfenster betrachtete er varnings abwesenheit noch als gewohnliche patrouillentatigkeit der inzwischen bekannte tod ist ein spaterer stand fur das tacitus treffen besorgte styke bei ihm wein mara nannte ihn ausserdem als mogliche anlaufstelle fur arbeit da cht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter.\u003c/p>\u003ch2>Am Tor\u003c/h2>\u003cp>Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. \u003ca href=\"#/artikel/captain-barhold\">Captain Barhold\u003c/a> ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.\u003c/p>","sources":["core","chronicle","live"],"status":"Zack getötet / Untersuchung offen","tags":["Balentyne","Captain","Kaitlyn","Duell"],"aliases":["Mott","Franz Mott"],"group":"garrison","text":"Stellung Franz Mott ist Offizier in Balentyne und Kaitlyn Motts Ehemann. Die von Vesper offen ausgelegten Briefe machten Zacks Verhältnis mit Kaitlyn sichtbar. Das Duell Bei erstem Licht am 7. Februar traf Franz Zack außerhalb der Festung. Zack verwundete ihn leicht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter. Am Tor Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. Captain Barhold ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.","links":["captain-barhold"],"backlinks":["kaitlyn","spielstand","story-so-far"],"search":"captain franz mott captain von balentyne totete zack eddarly am 7 februar im duell und wurde anschliessend entwaffnet und zunachst festgesetzt mott franz mott balentyne captain kaitlyn duell garrison stellung franz mott ist offizier in balentyne und kaitlyn motts ehemann die von vesper offen ausgelegten briefe machten zacks verhaltnis mit kaitlyn sichtbar das duell bei erstem licht am 7 februar traf franz zack ausserhalb der festung zack verwundete ihn leicht franz brachte zack mit der hellebarde zu boden und totete ihn mit einem letzten schlag in hals und schulter am tor styke offenbarte genug wissen uber die briefe um franz hinter sich herzuziehen am tor von balentyne alarmierte styke die wachen captain barhold liess franz entwaffnen seine wunde behandeln und ihn zunachst bis zur untersuchung festsetzen die spatere entscheidung der festung ist styke nicht bekannt"},{"id":"kaitlyn","category":"personen","title":"Kaitlyn Mott","summary":"Gebundene im Mott-Haus; am 7. Februar brachte sie die Duellwarnung, erfuhr von Zacks Tod und kehrte für die Untersuchung zurück.","body":"\u003ch2>Die Frau im Mott-Haus\u003c/h2>\u003cp>Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Ihre Ehe mit \u003ca href=\"#/artikel/franz\">Captain Franz Mott\u003c/a> ist arrangiert und lieblos; Franz ist unaufmerksam, aber nicht als körperlich gewalttätiger Ehemann etabliert.\u003c/p>\n\u003ch2>Zack und Styke\u003c/h2>\u003cp>Kaitlyns Beziehung zu \u003ca href=\"#/artikel/zack\">Zack Eddarly\u003c/a> begann lange vor Styke. Am 6. Februar sagte sie ausdrücklich, dass sie Zack geliebt hat. Stykes spätere Bedeutung löscht weder diese Geschichte noch die Aussicht auf Trauer. Styke versprach, ihr den Tod von Zack oder Franz unverzüglich und ohne Beschönigung mitzuteilen.\u003c/p>\n\u003ch2>Der Compact\u003c/h2>\u003cp>Am 5. Februar hörte Kaitlyn die Wahrheit über Aldencross und den Knoten. Sie las den Compact, unterschrieb ihn mit Blut und schloss den Carnal Seal mit Vesper als Keeper. Zwei persönliche Bedingungen gelten: Die Weigerung, eigenhändig zu töten, ist für sich kein Vertragsbruch; während der unmittelbaren Zerstörung Aldencross’ soll Kaitlyn sich verbergen und abwarten.\u003c/p>\n\u003ch2>Eine brauchbare Rolle\u003c/h2>\u003cp>Kaitlyn kennt Familien, Wappen, Empfänge, Etikette, Ruf und die Gesichter des talireanischen Adels. Sie ist keine ausgebildete Einbrecherin oder Feldspionin. Vesper kann ihr verdeckte Arbeit beibringen; Kaitlyn kann dem Knoten dafür beibringen, wie sich Adel tatsächlich bewegt und erinnert.\u003c/p>\n\u003ch2>Rückkehr zum Mott-Haus\u003c/h2>\u003cp>Die neu gekaufte Haarfarbe blieb unbenutzt. Kaitlyn ging am 6. Februar mit natürlichem roten Haar zum Mott-Haus zurück. Vereinbart ist ihre Rückkehr am \u003cstrong>8. Februar\u003c/strong>, früher falls nötig. Was sie dort vorfand, weiß die Gruppe noch nicht.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/intim-kaitlyn\">Private Akte: Hinter der Maske\u003c/a> · \u003ca href=\"#/artikel/anatomie-kaitlyn\">Körperakte\u003c/a>\u003c/p>\n\u003ch2>Der 7. Februar\u003c/h2>\u003cp>Kaitlyn brachte Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte den Knoten bei erstem Licht vor Franz’ Duellforderung. Styke sagte ihr später persönlich, dass Franz Zack getötet hatte, der Tod schnell eintrat und Zack nach dem tödlichen Schlag keine letzten Worte sprach.\u003c/p>\u003cp>Styke sagte: „Du gehörst zu uns jetzt. Wir lassen dich nicht im Stich.“ Kaitlyn antwortete: „Gut. Dann glaube ich dir.“ Danach kehrte sie bewusst in das Mott-Haus zurück, damit Captain Motts Frau dort für die offizielle Untersuchung auffindbar war.\u003c/p>","sources":["core","live"],"status":"Gebunden / im Mott-Haus","tags":["Affäre","Adel","Gebundene","8. Februar"],"aliases":[],"group":"town","text":"Die Frau im Mott-Haus Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Ihre Ehe mit Captain Franz Mott ist arrangiert und lieblos; Franz ist unaufmerksam, aber nicht als körperlich gewalttätiger Ehemann etabliert. Zack und Styke Kaitlyns Beziehung zu Zack Eddarly begann lange vor Styke. Am 6. Februar sagte sie ausdrücklich, dass sie Zack geliebt hat. Stykes spätere Bedeutung löscht weder diese Geschichte noch die Aussicht auf Trauer. Styke versprach, ihr den Tod von Zack oder Franz unverzüglich und ohne Beschönigung mitzuteilen. Der Compact Am 5. Februar hörte Kaitlyn die Wahrheit über Aldencross und den Knoten. Sie las den Compact, unterschrieb ihn mit Blut und schloss den Carnal Seal mit Vesper als Keeper. Zwei persönliche Bedingungen gelten: Die Weigerung, eigenhändig zu töten, ist für sich kein Vertragsbruch; während der unmittelbaren Zerstörung Aldencross’ soll Kaitlyn sich verbergen und abwarten. Eine brauchbare Rolle Kaitlyn kennt Familien, Wappen, Empfänge, Etikette, Ruf und die Gesichter des talireanischen Adels. Sie ist keine ausgebildete Einbrecherin oder Feldspionin. Vesper kann ihr verdeckte Arbeit beibringen; Kaitlyn kann dem Knoten dafür beibringen, wie sich Adel tatsächlich bewegt und erinnert. Rückkehr zum Mott-Haus Die neu gekaufte Haarfarbe blieb unbenutzt. Kaitlyn ging am 6. Februar mit natürlichem roten Haar zum Mott-Haus zurück. Vereinbart ist ihre Rückkehr am 8. Februar , früher falls nötig. Was sie dort vorfand, weiß die Gruppe noch nicht. Private Akte: Hinter der Maske · Körperakte Der 7. Februar Kaitlyn brachte Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte den Knoten bei erstem Licht vor Franz’ Duellforderung. Styke sagte ihr später persönlich, dass Franz Zack getötet hatte, der Tod schnell eintrat und Zack nach dem tödlichen Schlag keine letzten Worte sprach. Styke sagte: „Du gehörst zu uns jetzt. Wir lassen dich nicht im Stich.“ Kaitlyn antwortete: „Gut. Dann glaube ich dir.“ Danach kehrte sie bewusst in das Mott-Haus zurück, damit Captain Motts Frau dort für die offizielle Untersuchung auffindbar war.","search":"kaitlyn mott gebundene im mott haus am 7 februar brachte sie die duellwarnung erfuhr von zacks tod und kehrte fur die untersuchung zuruck affare adel gebundene 8 februar town die frau im mott haus kaitlyn mott ist eine junge talireanische adlige mit rotem haar grunen augen und sicherem hofischem auftreten ihre ehe mit captain franz mott ist arrangiert und lieblos franz ist unaufmerksam aber nicht als korperlich gewalttatiger ehemann etabliert zack und styke kaitlyns beziehung zu zack eddarly :"Captain Zacharias \"Zack\" Eddarly","summary":"Captain Zacharias Eddarly, Kaitlyns langjähriger Freund und Geliebter; am 7. Februar von Franz Mott im Duell getötet.","body":"\u003ch2>Captain und Geliebter\u003c/h2>\u003cp>Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung.\u003c/p>\u003ch2>Tod am 7. Februar\u003c/h2>\u003cp>Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.\u003c/p>","sources":["core","live","chronicle"],"status":"Tot seit 7. Februar","tags":["Balentyne","Captain","Kaitlyn","Tot"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Captain und Geliebter Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung. Tod am 7. Februar Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.","search":"captain zacharias zack eddarly captain zacharias eddarly kaitlyns langjahriger freund und geliebter am 7 februar von franz mott im duell getotet zack zach zacharias eddarly zach eddarly balentyne captain kaitlyn tot garrison captain und geliebter zacharias zack eddarly war offizier in balentyne und kaitlyns langjahriger freund und geliebter vesper identifizierte ihn am 4 februar anhand einer beschreibung tod am 7 februar zack nahm franz motts duellforderung an er traf franz mit dem langschwert und verwundete ihn leicht wurde dann von franz hellebarde zu boden gebracht und durch einen schlag in hals und schulter getotet er starb binnen sekunden und sprach nach dem todlichen treffer keine letzten worte","links":[],"backlinks":["kaitlyn","spielstand","story-so-far","zeit-0201"]},{"id":"donnagin","category":"personen","title":"Father Althus Donnagin","summary":"Balentynes ranghoher Mitra-Kleriker; bekannte Krankenbesuche bieten einen Ansatz, sein Tagesablauf bleibt ungeklärt.","body":"\u003ch2>Bekannte Rolle\u003c/h2>\u003cp>Father Althus Donnagin ist Balentynes ranghoher Mitraner und für Styke die gefährlichste noch unzureichend bekannte Person der Festung.\u003c/p>\n\u003ch2>Krankenbesuche\u003c/h2>\u003cp>Styke hörte von einem Besuch bei einem schwer kranken Kind und einem nächtlichen Ruf zu einer schwierigen Geburt. Mara berichtete außerdem, dass Donnagin sich um ernsthaft kranke Soldaten kümmert. Das ist ein wiederkehrender Ansatz, aber kein fester Fahrplan.\u003c/p>\n\u003ch2>Noch keine Beobachtung\u003c/h2>\u003cp>Valeria sollte seine Mahlzeiten, Gottesdienste, Krankenbesuche und zivilen Kontakte untersuchen. Die Reise zur Tamsin-Suche verdrängte diesen Schritt. Zauber, genauer Tagesablauf und ein sicherer Weg, ihn von Balentyne fortzulocken, bleiben unbekannt.\u003c/p>","sources":["core","live","chronicle"],"status":"Ziel / Routine offen","tags":["Mitra","Kleriker","Balentyne"],"aliases":["Father Donnagin","Althus Donnagin","Donnagin"],"group":"garrison","text":"Bekannte Rolle Father Althus Donnagin ist Balentynes ranghoher Mitraner und für Styke die gefährlichste noch unzureichend bekannte Person der Festung. Krankenbesuche Styke hörte von einem Besuch bei einem schwer kranken Kind und einem nächtlichen Ruf zu einer schwierigen Geburt. Mara berichtete außerdem, dass Donnagin sich um ernsthaft kranke Soldaten kümmert. Das ist ein wiederkehrender Ansatz, aber kein fester Fahrplan. Noch keine Beobachtung Valeria sollte seine Mahlzeiten, Gottesdienste, Krankenbesuche und zivilen Kontakte untersuchen.  sie begleitet.","body":"\u003ch2>Magisterin und Gelehrte\u003c/h2>\u003cp>Tacitus von Morimun ist eine drahtige Frau mittleren Alters mit rotbraunem Haar, kleiner Goldbrille und tintenbefleckten Fingern. Sie dient Balentyne, Talingarde und Mitra; ihre wissenschaftliche Neugier hebt diese Loyalitäten nicht auf.\u003c/p>\n\u003ch2>Verse\u003c/h2>\u003cp>Am 31. Januar befragte sie \u003ca href=\"#/artikel/verse\">Verse\u003c/a> zu Erinnerungen, neuen Urteilen und möglichem Bewusstsein. Vespers heimlich gegebenes Abführmittel beendete das Gespräch, nicht Tacitus’ Interesse.\u003c/p>\n\u003ch2>Abendessen am 8. Februar\u003c/h2>\u003cp>Tacitus hat dem privaten Essen am 8. Februar gegen 20 Uhr im \u003ca href=\"#/artikel/dalliance\">Lord’s Dalliance\u003c/a> zugestimmt, wenn \u003ca href=\"#/artikel/jacobian\">Jacobian\u003c/a> sie begleitet. Auch Jacobian hat zugesagt.\u003c/p>\n\u003ch2>Der Plan des Knotens\u003c/h2>\u003cp>Styke, Vesper und Valeria wollen Tacitus aus dem entscheidenden Kampf nehmen und erst nach Balentynes Fall mit dem Ergebnis konfrontieren. Valeria soll über Verlust und verbliebene Möglichkeiten sprechen, Vesper über Compact, Forschung und Stellung. Verse und Zorn dienen erst danach als konkrete wissenschaftliche Aussicht. Tacitus’ Antwort ist nicht vorweggenommen.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/tacitus-plan\">Operationsplan\u003c/a> · \u003ca href=\"#/artikel/anatomie-tacitus\">Private Körperakte\u003c/a>\u003c/p>","sources":["tacitus-current","live","chronicle"],"status":"Abendessen zugesagt / Rekrutierung ungewiss","tags":["Magierin","Gelehrte","Balentyne","8. Februar"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Magisterin und Gelehrte Tacitus von Morimun ist eine drahtige Frau mittleren Alters mit rotbraunem Haar, kleiner Goldbrille und tintenbefleckten Fingern. Sie dient Balentyne, Talingarde und Mitra; ihre wissenschaftliche Neugier hebt diese Loyalitäten nicht auf. Verse Am 31. Janua mmen operationsplan private korperakte","links":["verse","dalliance","jacobian","tacitus-plan","anatomie-tacitus"],"backlinks":["jacobian","spielstand","story-so-far","zeit-tacitus","anatomie-tacitus"]},{"id":"jacobian","category":"personen","title":"Jacobian Scaramore","summary":"Vermittler und Begleiter von Tacitus; für den 8. Februar gegen 20 Uhr im Dalliance erwartet.","body":"\u003ch2>Bekannte Rolle\u003c/h2>\u003cp>Jacobian betreibt den \u003ca href=\"#/artikel/scroll\">Illuminated Scroll\u003c/a> und ist ein enger persönlicher Freund von \u003ca href=\"#/artikel/tacitus\">Tacitus\u003c/a>. Er vermittelte das erste Gespräch über Verse und war am 31. Januar Gastgeber.\u003c/p>\n\u003ch2>Die Einladung vom 3. Februar\u003c/h2>\u003cp>Nach seiner Rückkehr las Styke Jacobians versiegelte Nachricht und suchte ihn auf. Er lud Tacitus für den 8. Februar gegen 20 Uhr in das Lord’s Dalliance ein, um das Gespräch über Verse fortzusetzen. Jacobian sagte zu, die Einladung weiterzugeben.\u003c/p>\n\u003cp>Eine Antwort von Tacitus ist noch nicht eingetroffen.\u003c/p>\n\u003ch2>Plan für den 8. Februar\u003c/h2>\u003cp>Jacobian soll gemeinsam mit Tacitus lebend überwältigt, gefesselt, geknebelt und getrennt in den verborgenen Gang gebracht werden. Nur Tacitus ist für ein Rekrutierungsangebot vorgesehen; Jacobians spätere Behandlung ist noch nicht entschieden.\u003c/p>","sources":["core","live","chronicle","tacitus-current"],"status":"Termin zugesagt","tags":["Schreiber","Kontakt","Aldencross"],"aliases":["Scaramore","Jacobian"],"group":"town","text":"Bekannte Rolle Jacobian betreibt den Illuminated Scroll und ist ein enger persönlicher Freund von Tacitus . Er vermittelte das erste Gespräch über Verse und war am 31. Januar Gastgeber. Die Einladung vom 3. Februar Nach seiner Rückkehr las Styke Jacobians versiegelte Nachricht und suchte ihn auf. Er lud Tacitus für den 8. Februar gegen 20 Uhr in das Lord’s Dalliance ein, um das Gespräch über Verse fortzusetzen. Jacobian sagte zu, die Einladung weiterzugeben. Eine Antwort von Tacitus ist noch nicht eingetroffen. Plan für den 8. Februar Jacobian soll gemeinsam mit Tacitus lebend überwältigt, gefesselt, geknebelt und getrennt in den verborgenen Gang gebracht werden. Nur Tacitus ist für ein Rekrutierungsangebot vorgesehen; Jacobians spätere Behandlung ist noch nicht entschieden.","links":["scroll","tacitus"],"backlinks":["tacitus","scroll","spielstand","story-so-far","zeit-tacitus"],"search":"jacobian scaramore vermittler und begleiter von tacitus fur den 8 februar gegen 20 uhr im dalliance erwartet scaramore jacobian schreiber kontakt aldencross town bekannte rolle jacobian betreibt den illuminated scroll und ist ein enger personlicher freund von tacitus er vermittelte das erste gesprach uber verse und war am 31 januar gastgeber die einladung vom 3 februar nach seiner ruckkehr las styke jacobians versiegelte nachricht und suchte ihn auf er lud tacitus fur den 8 februar gegen 20 uhr in das lord s dalliance ein um das gesprach uber verse fortzusetzen jacobian sagte zu die einladung weiterzugeben eine antwort von tacitus ist noch nicht eingetroffen plan fur den 8 februar jacobian soll gemeinsam mit tacitus lebend uberwaltigt gefesselt geknebelt und getrennt in den verborgenen gang gebracht werden nur tacitus ist fur ein rekrutierungsangebot vorgesehen jacobians spatere behandlung ist noch nicht entschieden"},{"id":"marlowe","category":"personen","title":"William Marcus Marlowe","summary":"Leiter der Ye Merrie Men. Eine Aufführung in Balentyne ist als kommende Gelegenheit bekannt.","body":"\u003ch2>Bekannte Verbindung\u003c/h2>\n\u003cp>Die reisende Schauspieltruppe \u003ca href=\"#/artikel/merrie-men\">Ye Merrie Men\u003c/a> soll \u003cem>The Fall of Amberlyn\u003c/em> für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar.\u003c/p>\n\u003ch2>Stand der Planung\u003c/h2>\n\u003cp>Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.\u003c/p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offener Hinweis"],"aliases":["Marlowe"],"group":"town","text":"Bekannte Verbindung Die reisende Schauspieltruppe Ye Merrie Men soll The Fall of Amberlyn für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar. Stand der Planung Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.","links":["merrie-men"],"backlinks":["bellam"],"search":"william marcus marlowe leiter der ye merrie men eine auffuhrung in balentyne ist als kommende gelegenheit bekannt marlowe theater offener hinweis town bekannte verbindung die reisende schauspieltruppe ye merrie men soll the fall of amberlyn fur soldaten in balentyne auffuhren bellam erzahlte davon am 27 januar stand der planung dass eine solche auffuhrung kommen soll ist ein etablierter hinweis exaktes datum uhrzeit besetzung zugangskontrolle und bewegungen der truppe sind noch nicht geklart das wiki macht daraus keine bereits verfugbare tarnidentitat oder sichere einlassmoglichkeit"},{"id":"giuseppe","category":"personen","title":"Mama Louisa Giuseppe","summary":"Balentynes Köchin; ihr großer Gemeinschaftseintopf wurde am 1. Februar beobachtet und kehrt am 8. Februar wieder.","body":"\u003ch2>Beobachtete Routine\u003c/h2>\u003cp>Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet.\u003c/p>\n\u003ch2>Der 1. Februar\u003c/h2>\u003cp>Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet.\u003c/p>\n\u003ch2>Der 8. Februar\u003c/h2>\u003cp>Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan\u003c/a> / \u003ca href=\"#/artikel/kueche\">Bekanntes Küchenwissen\u003c/a>\u003c/p>","sources":["chronicle","live","timeline"],"status":"Routine bestätigt","tags":["Küche","Routine","8. Februar"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Der 1. Februar Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet. Der 8. Februar Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan. Eintopf und Sabotageplan / Bekanntes Küchenwissen","links":["eintopf-plan","kueche"],"backlinks":["story-so-far"],"search":"mama louisa giuseppe balentynes kochin ihr grosser gemeinschaftseintopf wurde am 1 februar beobachtet und kehrt am 8 februar wieder mama giuseppe louisa giuseppe giuseppe kuche routine 8 februar town beobachtete routine vesper erfuhr am 30 januar dass mama giuseppe wochentlich einen grossen rindereintopf aus einem gemeinsamen topf fur ungefahr siebzig dienstfreie soldaten zubereitet der 1 februar vesper half bei der ausgabe die kuche war hektisch der gemeinschaftskessel wurde in ihrer gegenwart nicht besonders gepruft der eintopf blieb an diesem tag unangetastet der 8 februar die nachste bekannte gelegenheit fallt auf den 8 februar sechs packchen rattengift liegen im wassermuhlen versteck zugang aufsicht dosis und wirkung sind noch offen giuseppe selbst gehort nicht zum plan eintopf und sabotageplan bekanntes kuchenwissen"},{"id":"varning","category":"personen","title":"Captain Ryan Varning","summary":"Mit seiner sechsköpfigen berittenen Patrouille am 26. Januar bei Freeman's Rock getötet.","body":"\u003ch2>Gesicherter Verlauf\u003c/h2>\n\u003cp>Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; \u003ca href=\"#/artikel/styke\">Styke\u003c/a> tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben.\u003c/p>\n\u003ch2>Nachwirkungen\u003c/h2>\n\u003cp>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen \u003ca href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel\u003c/a>, \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a> erhielt \u003ca href=\"#/artikel/varlet\">Varlet\u003c/a>.\u003c/p>\n\u003cp>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. \u003cstrong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.\u003c/strong>\u003c/p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["styke","varning-schluessel","grumblejack","varlet"],"backlinks":["story-so-far","zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26 januar bei freeman s rock getotet ryan varning varning tot patrouille garrison gesicherter verlauf varning verliess balentyne am 24 januar mit sechs ausgewahlten reitern der knoten klarte ihren lagerplatz auf und griff in der nacht des 26 januar an varning ergab sich schwer verwundet styke totete ihn gemass seiner zuvor festgelegten keine gefangenen anweisung alle sieben patrouillenmitglieder starben nachwirkungen die leichen wurden verborgen der platz bereinigt und sieben pferde erbeutet markante ausrustung blieb in einem versteck ausserhalb aldencross styke behielt einen noch nicht identifizierten schlussel grumblejack erhielt varlet am 29 januar galt die patrouille offen als verspatet und suchreiter brachen auf seit 31 januar ist ihr tod in balentyne bekannt die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"\u003ch2>Eigentum und Ort\u003c/h2>\n\u003cp>Nach Freeman's Rock gab \u003ca href=\"#/artikel/styke\">Styke\u003c/a> das Pferd ausdrücklich \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.\u003c/p>\n\u003cp>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.\u003c/p>\n","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.","links":["styke","grumblejack"],"backlinks":["grumblejack","varning","feldgruppe","story-so-far","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd jetzt grumblejacks eigener anteil und packtier tier feldgruppe field eigentum und ort nach freeman s rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil varlet ist nicht einfach beliebiges gruppeninventar es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe eine spatere verausserung verletzung oder verlegung ist nicht berichtet"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"\u003ch2>Kampagnenfassung\u003c/h2>\n\u003cp>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.\u003c/p>\n\u003ch2>Folgen der Begegnung\u003c/h2>\n\u003cp>Vesper barg \u003ca href=\"#/artikel/verse\">Verse\u003c/a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.\u003c/p>\n\u003cp>\u003cstrong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.\u003c/strong>\u003c/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","vesper","verse"],"backlinks":["branderscar","story-so-far","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin sie uberlebte den angenommenen ausbruch mathias richter richter branderscar historisch history kampagnenfassung matilda ist die weibliche kampagnenkonversion der branderscar vorsteherfigur styke und vesper setzten sie in ihren privatraumen nichttodlich ausser gefecht das archiv setzt sie nicht nachtraglich auf den gedruckten ausgang zuruck folgen der begegnung vesper barg verse aus einem beweisbehalter ihrer bibliothek und verzichtete auf weitere rache an der hilflosen eine moorkarte und richters zauberbuch wurden mitgenommen schwere alchemistische ausrustung blieb zuruck ihr spaterer aufenthaltsort und zustand nach branderscar sind nicht geklart"},{"id":"sambryl","category":"personen","title":"Captain Edward Sambryl","summary":"Talireanischer Patrouillenkapitän aus der Frosthamar-Reise.","body":"\u003ch2>Begegnung auf See\u003c/h2>\n\u003cp>Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten.\u003c/p>\n\u003ch2>Grenze der Rekonstruktion\u003c/h2>\n\u003cp>Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den \u003ca href=\"#/artikel/yutak\">Yutak-Handel\u003c/a> ein und sind nicht automatisch noch im Inventar.\u003c/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Seereise","Historisch"],"aliases":["Edward Sambryl","Sambryl"],"group":"history","text":"Begegnung auf See Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten. Grenze der Rekonstruktion Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den Yutak-Handel ein und sind nicht automatisch noch im Inventar.","links":["yutak"],"backlinks":["story-so-far","zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar reise edward sambryl sambryl seereise historisch history begegnung auf see seine patrouille wurde wahrend der frosthamar reise besiegt sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser einem kurzbogen und pfeilen freigelassen nicht als gefolgsleute behalten grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest beutestucke der patrouille gingen in den yutak handel ein und sind nicht automatisch noch im inventar"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"\u003ch2>Mannschaft und Ende\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/hakon\">Hakon\u003c/a>, \u003ca href=\"#/artikel/sten\">Sten\u003c/a>, \u003ca href=\"#/artikel/ketil\">Ketil\u003c/a>, \u003ca href=\"#/artikel/eirik\">Eirik\u003c/a>, \u003ca href=\"#/artikel/arved\">Arved\u003c/a> und \u003ca href=\"#/artikel/torvald\">Torvald\u003c/a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.\u003c/p>\n\u003cp>Odenkirk starb. Die \u003ca href=\"#/artikel/frosthamar\">Frosthamar\u003c/a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.\u003c/p>\n\u003ch2>Kein automatisches Restinventar\u003c/h2>\n\u003cp>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.\u003c/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Tot","Seereise"],"aliases":["Kargeld Odenkirk","Odenkirk"],"group":"history","text":"Mannschaft und Ende Hakon , Sten , Ketil , Eirik , Arved und Torvald waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand. Odenkirk starb. Die Frosthamar wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren. Kein automatisches Restinventar Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.","links":["hakon","sten","ketil","eirik","arved","torvald","frosthamar"],"backlinks":["story-so-far"],"search":"captain kargeld odenkirk ehemaliger kapitan der frosthamar im akzeptierten verlauf tot kargeld odenkirk odenkirk tot seereise history mannschaft und ende hakon sten ketil eirik arved und torvald waren seine seeleute sie verliessen seine mannschaft und nahmen stykes bezahlung an bevor odenkirks letzter konflikt stattfand odenkirk starb die frosthamar wurde zerstort e vollstandige einzelbiographie oder aktuelle position es begrundet insbesondere keine allwissende sprecherrolle fur alle yutak neue details werden nicht aus seinem namen abgeleitet"},{"id":"elise","category":"personen","title":"Elise Zadaria","summary":"Eigenständige Rivalin und zeitweilige Vertraute aus Thorns Ausbildungsphase.","body":"\u003ch2>Die White Ravens\u003c/h2>\n\u003cp>Elise Zadaria führte während Thorns Ausbildung die \u003ca href=\"#/artikel/white-ravens\">White Ravens\u003c/a>. Zwischen ihr, \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> kam es wiederholt zu Sex und persönlicher Nähe. Befehle an Trak, Trik und Dostan gingen weiterhin von Elise aus.\u003c/p>\n\u003ch2>Die vier Ravens\u003c/h2>\n\u003cp>Trak reagierte eifersüchtig und rivalisierend, Trik provokant und lösungsorientiert, Dostan als ruhiger Schild. \u003ca href=\"#/artikel/frost\">Frost\u003c/a> blieb Elises Vertrauter und Verbindung zum Endless Winter.\u003c/p>\n\u003ch2>Letzter bekannter Stand\u003c/h2>\n\u003cp>Nach der Ausbildung trennten sich die Wege der beiden Knoten. Für den Aldencross-Stand ist kein neuer Aufenthaltsort der White Ravens festgehalten.\u003c/p>\n\u003ch2>Private Akte (18+)\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/intim-elise\">Elise, Styke und Vesper\u003c/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.\u003c/p>","sources":["history"],"status":"Bestätigt","tags":["White Ravens","Historisch"],"aliases":["Zadaria"],"group":"history","text":"Die White Ravens Elise Zadaria führte während Thorns Ausbildung die White Ravens . Zwischen ihr, Styke und Vesper kam es wiederholt zu Sex und persönlicher Nähe. Befehle an Trak, Trik und Dostan gingen weiterhin von Elise aus. Die vier Ravens Trak reagierte eifersüchtig und rivalisierend, Trik provokant und lösungsorientiert, Dostan als ruhiger Schild. Frost blieb Elises Vertrauter und Verbindung zum Endless Winter. Letzter bekan
