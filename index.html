rr","darric-holt"],"campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"aiden-kael","aliases":[],"tags":["Kael","Karte","Caer Bryr","Wandering Friar"],"group":"book2","category":"personen","title":"Aiden Kael","summary":"Verschollener Entdecker, dessen altes Zimmer und physische Karte Vesper in Farholde fand.","body":"<h2>Bekannter Abdruck<\/h2><p>Aiden Kael hinterließ im Wandering Friar ein Zimmer mit Rückständen und eine greifbare Wegkarte in den Caer Bryr. Vesper bezahlte 25 gp offene Kosten und nahm Karte sowie 132 gp an sich.<\/p><h2>Grenze<\/h2><p>Kaels gegenwärtiger Verbleib und sein vollständiges Wissen sind nicht bekannt. Die Karte ist ein Wegträger, kein Beweis dafür, dass Route, Horn oder Gefahren unverändert geblieben sind.<\/p>","sources":["live","transition","chronicle"],"status":"Verschollen / nur über Spuren bekannt","links":[],"text":"Bekannter Abdruck Aiden Kael hinterließ im Wandering Friar ein Zimmer mit Rückständen und eine greifbare Wegkarte in den Caer Bryr. Vesper bezahlte 25 gp offene Kosten und nahm Karte sowie 132 gp an sich. Grenze Kaels gegenwärtiger Verbleib und sein vollständiges Wissen sind nicht bekannt. Die Karte ist ein Wegträger, kein Beweis dafür, dass Route, Horn oder Gefahren unverändert geblieben sind.","search":"aiden kael verschollener entdecker, dessen altes zimmer und physische karte vesper in farholde fand. kael karte caer bryr wandering friar  bekannter abdruck aiden kael hinterliess im wandering friar ein zimmer mit ruckstanden und eine greifbare wegkarte in den caer bryr. vesper bezahlte 25 gp offene kosten und nahm karte sowie 132 gp an sich. grenze kaels gegenwartiger verbleib und sein vollstandiges wissen sind nicht bekannt. die karte ist ein wegtrager, kein beweis dafur, dass route, horn oder gefahren unverandert geblieben sind.","initial":"A","backlinks":[]},{"id":"kaels-karte","aliases":["Kael-Karte"],"tags":["Karte","Aiden Kael","Horn","Caer Bryr"],"group":"items","category":"gegenstaende","title":"Aiden Kaels Karte","summary":"Physische Routekarte zum richtigen Hornsporn; am 24. Februar im Gelände bestätigt.","body":"<h2>Herkunft<\/h2><p>Vesper barg die Karte am 21. Februar im Wandering Friar aus Aiden Kaels früherem Zimmer.<\/p><h2>Bestätigter Nutzen<\/h2><p>Die Karte zeigte den richtigen Sporn und die großen Geländebeziehungen. Gemeinsam mit Vespers Survival-Arbeit führte sie das Kerntrio am 24. Februar zum Horn.<\/p><h2>Grenze<\/h2><p>Sie ist keine Schritt-für-Schritt-Straßenkarte und enthält keine Lösung für Siegel, Bindung, Bewohner oder Gefahren im Inneren.<\/p>","sources":["live","transition"],"status":"Bestätigt · beim Kerntrio","links":[],"text":"Herkunft Vesper barg die Karte am 21. Februar im Wandering Friar aus Aiden Kaels früherem Zimmer. Bestätigter Nutzen Die Karte zeigte den richtigen Sporn und die großen Geländebeziehungen. Gemeinsam mit Vespers Survival-Arbeit führte sie das Kerntrio am 24. Februar zum Horn. Grenze Sie ist keine Schritt-für-Schritt-Straßenkarte und enthält keine Lösung für Siegel, Bindung, Bewohner oder Gefahren im Inneren.","search":"aiden kaels karte physische routekarte zum richtigen hornsporn; am 24. februar im gelande bestatigt. karte aiden kael horn caer bryr kael-karte herkunft vesper barg die karte am 21. februar im wandering friar aus aiden kaels fruherem zimmer. bestatigter nutzen die karte zeigte den richtigen sporn und die grossen gelandebeziehungen. gemeinsam mit vespers survival-arbeit fuhrte sie das kerntrio am 24. februar zum horn. grenze sie ist keine schritt-fur-schritt-strassenkarte und enthalt keine losung fur siegel, bindung, bewohner oder gefahren im inneren.","initial":"A","backlinks":[]},{"id":"caer-bryr","aliases":["Bryr"],"tags":["Wald","Horn von Abaddon","Gerüchte"],"group":"book2","category":"orte","title":"Caer Bryr","summary":"Dichter, nasser Wald südlich Farholdes; das Kerntrio kennt nun eine wiederholbare Route zum Horn.","body":"<h2>Bestätigter Weg<\/h2><p>Kaels Karte zeigt die großen Geländeziehungen und den richtigen Sporn, aber keinen Schritt-für-Schritt-Pfad. Vesper fand am 24. Februar einen längeren Weg über angehobenes, festeres Gelände, der einen gefährlichen nassen Wurzelabschnitt umgeht und wieder auf Kaels Linie zurückführt.<\/p><h2>Mit Pferden<\/h2><p>Die Route ist vorsichtig mit Pferden nutzbar, bleibt aber Waldreise: Bäche, Wurzeln, morastige Stellen und Passagen, auf denen geführt werden muss. Das Trio setzte dauerhafte Landmarken für den Rückweg.<\/p><h2>Weitere Beobachtung<\/h2><p>Alte, unklare Spuren deuten auf etwas ungewöhnlich Großes im Bryr. Mehr lässt sich daraus bislang nicht sicher ableiten.<\/p>","sources":["farholde","live","transition"],"status":"Route zum Horn bestätigt · 24. Februar","links":[],"text":"Bestätigter Weg Kaels Karte zeigt die großen Geländeziehungen und den richtigen Sporn, aber keinen Schritt-für-Schritt-Pfad. Vesper fand am 24. Februar einen längeren Weg über angehobenes, festeres Gelände, der einen gefährlichen nassen Wurzelabschnitt umgeht und wieder auf Kaels Linie zurückführt. Mit Pferden Die Route ist vorsichtig mit Pferden nutzbar, bleibt aber Waldreise: Bäche, Wurzeln, morastige Stellen und Passagen, auf denen geführt werden muss. Das Trio setzte dauerhafte Landmarken für den Rückweg. Weitere Beobachtung Alte, unklare Spuren deuten auf etwas ungewöhnlich Großes im Bryr. Mehr lässt sich daraus bislang nicht sicher ableiten.","search":"caer bryr dichter, nasser wald sudlich farholdes; das kerntrio kennt nun eine wiederholbare route zum horn. wald horn von abaddon geruchte bryr bestatigter weg kaels karte zeigt die grossen gelandeziehungen und den richtigen sporn, aber keinen schritt-fur-schritt-pfad. vesper fand am 24. februar einen langeren weg uber angehobenes, festeres gelande, der einen gefahrlichen nassen wurzelabschnitt umgeht und wieder auf kaels linie zuruckfuhrt. mit pferden die route ist vorsichtig mit pferden nutzbar, bleibt aber waldreise: bache, wurzeln, morastige stellen und passagen, auf denen gefuhrt werden muss. das trio setzte dauerhafte landmarken fur den ruckweg. weitere beobachtung alte, unklare spuren deuten auf etwas ungewohnlich grosses im bryr. mehr lasst sich daraus bislang nicht sicher ableiten.","initial":"C","backlinks":[]},{"id":"westell","aliases":[],"tags":["Farholde","Straße","Caer Bryr"],"group":"book2","category":"orte","title":"Westell","summary":"Landwirtschaftlicher Straßengürtel südlich Farholdes auf dem Weg zum Bryr.","body":"<p>Valerias Erkundung zeigte Westell als gewöhnliche Folge von Höfen, Wegen und bewirtschaftetem Land. Der Ort markiert den Übergang von Farholdes Stadtumfeld zum zunehmend schwierigen Anmarsch auf den Caer Bryr.<\/p>","sources":["farholde","live"],"status":"Am 21. Februar erkundet","links":[],"text":"Valerias Erkundung zeigte Westell als gewöhnliche Folge von Höfen, Wegen und bewirtschaftetem Land. Der Ort markiert den Übergang von Farholdes Stadtumfeld zum zunehmend schwierigen Anmarsch auf den Caer Bryr.","search":"westell landwirtschaftlicher strassengurtel sudlich farholdes auf dem weg zum bryr. farholde strasse caer bryr  valerias erkundung zeigte westell als gewohnliche folge von hofen, wegen und bewirtschaftetem land. der ort markiert den ubergang von farholdes stadtumfeld zum zunehmend schwierigen anmarsch auf den caer bryr.","initial":"W","backlinks":[]},{"id":"bryrwatch","aliases":["The Trident"],"tags":["Posten","Caer Bryr","Farholde"],"group":"book2","category":"orte","title":"Bryrwatch","summary":"Aktiver, durch den Krieg schwächer besetzter Posten am Zugang zum Caer Bryr.","body":"<p>Bryrwatch, auch The Trident, steht am südlichen Übergang zum Wald. Valeria bestätigte am 21. Februar, dass der Posten aktiv ist, seine Besatzung aber geringer wirkt als in Friedenszeiten. Eine konkrete Infiltration fand noch nicht statt.<\/p>","sources":["farholde","live"],"status":"Von außen erkundet","links":[],"text":"Bryrwatch, auch The Trident, steht am südlichen Übergang zum Wald. Valeria bestätigte am 21. Februar, dass der Posten aktiv ist, seine Besatzung aber geringer wirkt als in Friedenszeiten. Eine konkrete Infiltration fand noch nicht statt.","search":"bryrwatch aktiver, durch den krieg schwacher besetzter posten am zugang zum caer bryr. posten caer bryr farholde the trident bryrwatch, auch the trident, steht am sudlichen ubergang zum wald. valeria bestatigte am 21. februar, dass der posten aktiv ist, seine besatzung aber geringer wirkt als in friedenszeiten. eine konkrete infiltration fand noch nicht statt.","initial":"B","backlinks":[]},{"id":"lord-drowningtons-manor","aliases":["Drownington’s Manor","Drownington"],"tags":["Drownington","Ringkampf","Schwarzmarkt","Rubal Thraam"],"group":"current","category":"orte","title":"Lord Drownington’s Manor","summary":"Drowningtons Verbindung aus Schankraum, Bordell, Ringkampf, Schwarzmarkt und Diebeskontakten.","body":"<h2>Öffentliche Funktion<\/h2><p>Das Manor ist kein Adelssitz, sondern ein rauer Knotenpunkt in Drownington. Trinken, Sexarbeit, Wetten, Faustkampf und diskrete Geschäfte liegen nah beieinander.<\/p><h2>Der Besuch am 21. Februar<\/h2><p>Valeria gewann einen unbewaffneten Ringkampf. Danach sprach der Knoten mit dem Besitzer Rubal Thraam. Der Kontakt blieb professionell und begrenzt; daraus entstand weder Freundschaft noch Bündnis.<\/p>","sources":["farholde","rubal","live","chronicle"],"status":"Besucht am 21. Februar","links":[],"text":"Öffentliche Funktion Das Manor ist kein Adelssitz, sondern ein rauer Knotenpunkt in Drownington. Trinken, Sexarbeit, Wetten, Faustkampf und diskrete Geschäfte liegen nah beieinander. Der Besuch am 21. Februar Valeria gewann einen unbewaffneten Ringkampf. Danach sprach der Knoten mit dem Besitzer Rubal Thraam. Der Kontakt blieb professionell und begrenzt; daraus entstand weder Freundschaft noch Bündnis.","search":"lord drownington’s manor drowningtons verbindung aus schankraum, bordell, ringkampf, schwarzmarkt und diebeskontakten. drownington ringkampf schwarzmarkt rubal thraam d ster eindruck rubal thraam ist ein breiter, kahler, vernarbter ehemaliger soldat. er fuhrt lord drownington’s manor und verbindet dort gastbetrieb, ring, schwarzmarkt und kriminelle kontakte. kontakt zum knoten nach valerias sieg kennt rubal die namen und eine grobe berufliche selbstdarstellung. er ware grundsatzlich bereit, riskante oder heisse ware zu beurteilen, wenn ihm risiko und geschichte offengelegt werden. das ist ein moglicher geschaftskontakt, kein verbundeter.","initial":"R","backlinks":[]},{"id":"baron-vandermir","aliases":["Vandermir","Baron Vandermir"],"tags":["Farholde","Vanderhall","22. Februar","Kontakt"],"group":"book2","category":"personen","title":"Baron Arkov Vandermir","summary":"Begrenzter Farholde-Verbündeter; Osrics Familienabsicherung wurde vor dem Umzug bestätigt.","body":"<h2>Das Dinner<\/h2><p>Am 22. Februar gewann der Knoten auf Vanderhall eine begrenzte, geschäftliche Zusammenarbeit. Kaitlyn wurde als Kommunikationsvertreterin eingesetzt.<\/p><h2>Leistungen und Grenzen<\/h2><p>Vandermir kann Warnungen, rechtliche Hilfe, diskrete Marktkontakte und den Calliver-Green-Tunnel bieten. Er erhält das erste Angebot auf verkäufliche Hornfunde zu Marktwert. Ritualwissen und Feldarbeit gehören nicht dazu.<\/p><h2>Angehörigenfrage<\/h2><p>Kaitlyn fragte am 26. Februar nach guter Stadtunterkunft und gewöhnlicher Ausbildung für Angehörige der erwachsenen Fachkräfte. Vor dem Aufbruch am 27. Februar bestätigte sie die vereinbarte Absicherung von Osrics Partnerperson und zwei Kindern.<\/p><h2>Bestätigte Zusage<\/h2><p>Vor dem Aufbruch am 27. Februar berichtete Kaitlyn die organisierte Absicherung von Osrics Familie in Farholde: Unterkunft, Versorgung und Ausbildung der beiden Kinder. Diese konkrete Anfrage ist erledigt.<\/p>","sources":["vandermir","live","transition","farholde"],"status":"Begrenzte Zusammenarbeit · neuer Bericht ausstehend","links":[],"text":"Das Dinner Am 22. Februar gewann der Knoten auf Vanderhall eine begrenzte, geschäftliche Zusammenarbeit. Kaitlyn wurde als Kommunikationsvertreterin eingesetzt. Leistungen und Grenzen Vandermir kann Warnungen, rechtliche Hilfe, diskrete Marktkontakte und den Calliver-Green-Tunnel bieten. Er erhält das erste Angebot auf verkäufliche Hornfunde zu Marktwert. Ritualwissen und Feldarbeit gehören nicht dazu. Angehörigenfrage Kaitlyn fragte am 26. Februar nach guter Stadtunterkunft und gewöhnlicher Ausbildung für Angehörige der erwachsenen Fachkräfte. Vor dem Aufbruch am 27. Februar bestätigte sie die vereinbarte Absicherung von Osrics Partnerperson und zwei Kindern. Bestätigte Zusage Vor dem Aufbruch am 27. Februar berichtete Kaitlyn die organisierte Absicherung von Osrics Familie in Farholde: Unterkunft, Versorgung und Ausbildung der beiden Kinder. Diese konkrete Anfrage ist erledigt.","search":"baron arkov vandermir begrenzter farholde-verbundeter; osrics familienabsicherung wurde vor dem umzug bestatigt. farholde vanderhall 22. februar kontakt vandermir baron vandermir das dinner am 22. februar gewann der knoten auf vanderhall eine begrenzte, geschaftliche zusammenarbeit. kaitlyn wurde als kommunikationsvertreterin eingesetzt. leistungen und grenzen vandermir kann warnungen, rechtliche hilfe, diskrete marktkontakte und den calliver-green-tunnel bieten. er erhalt das erste angebot auf verkaufliche hornfunde zu marktwert. ritualwissen und feldarbeit gehoren nicht dazu. angehorigenfrage kaitlyn fragte am 26. februar nach guter stadtunterkunft und gewohnlicher ausbildung fur angehorige der erwachsenen fachkrafte. vor dem aufbruch am 27. februar bestatigte sie die vereinbarte absicherung von osrics partnerperson und zwei kindern. bestatigte zusage vor dem aufbruch am 27. februar berichtete kaitlyn die organisierte absicherung von osrics familie in farholde: unterkunft, versorgung und ausbildung der beiden kinder. diese konkrete anfrage ist erledigt.","initial":"B","backlinks":[],"campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"knittel","aliases":[],"tags":["Familiar","Ioun Wyrd","Tacitus","Farholde"],"group":"inner","category":"personen","title":"Knittel","summary":"Tacitus’ selbstbenannter Ioun-Wyrd-Familiar; mit ihr seit dem 27. Februar im Horn.","body":"<h2>Erscheinung<\/h2><p>Knittel ist ein winziger schwebender Konstruktkörper: dunkler polierter Kern, schmaler Metallorbit und Splitter aus Obsidian, Quarz und Messing. Sie wird weiblich gelesen und spricht Common.<\/p><h2>Erwachen<\/h2><p>Am 19. Februar schloss Tacitus das zehntägige Projekt ab. Das Wesen antwortete auf die Frage nach seinem Namen: „Knittel. Jetzt schon.“ Eine ihrer ersten Vereinbarungen lautet, dass sie Dinge anders sehen darf als Tacitus.<\/p><h2>Eigene Person<\/h2><p>Knittel ist weder Verse noch Zorn in neuer Form. Ihre Wahrnehmung ist materiell und körpergebunden; in Sprache und Takt zeigt sich eine Neigung zu Reim und Form. Das Hofzimmer in Farholde war ihre bisherige Werkstatt; seit dem 27. Februar ist sie mit Tacitus im Horn.<\/p><h2>Nächste Arbeit<\/h2><p>Valerias Charisma-Stirnreif wurde am 25. Februar übergeben, Stykes +2-Umhang am 26. Februar. Zwei weitere Umhangaufwertungen und drei Amulette bleiben in der bezahlten Reihe. Der Umzug am 27. Februar ersetzt keinen vollen Fertigungstag.<\/p>","sources":["knittel","tacitus-current","chronicle","live"],"status":"Bei Tacitus in Farholde","links":[],"text":"Erscheinung Knittel ist ein winziger schwebender Konstruktkörper: dunkler polierter Kern, schmaler Metallorbit und Splitter aus Obsidian, Quarz und Messing. Sie wird weiblich gelesen und spricht Common. Erwachen Am 19. Februar schloss Tacitus das zehntägige Projekt ab. Das Wesen antwortete auf die Frage nach seinem Namen: „Knittel. Jetzt schon.“ Eine ihrer ersten Vereinbarungen lautet, dass sie Dinge anders sehen darf als Tacitus. Eigene Person Knittel ist weder Verse noch Zorn in neuer Form. Ihre Wahrnehmung ist materiell und körpergebunden; in Sprache und Takt zeigt sich eine Neigung zu Reim und Form. Das Hofzimmer in Farholde war ihre bisherige Werkstatt; seit dem 27. Februar ist sie mit Tacitus im Horn. Nächste Arbeit Valerias Charisma-Stirnreif wurde am 25. Februar übergeben, Stykes +2-Umhang am 26. Februar. Zwei weitere Umhangaufwertungen und drei Amulette bleiben in der bezahlten Reihe. Der Umzug am 27. Februar ersetzt keinen vollen Fertigungstag.","search":"knittel tacitus’ selbstbenannter ioun-wyrd-familiar; mit ihr seit dem 27. februar im horn. familiar ioun wyrd tacitus farholde  erscheinung knittel ist ein winziger schwebender konstruktkorper: dunkler polierter kern, schmaler metallorbit und splitter aus obsidian, quarz und messing. sie wird weiblich gelesen und spricht common. erwachen am 19. februar schloss tacitus das zehntagige projekt ab. das wesen antwortete auf die frage nach seinem namen: „knittel. jetzt schon.“ eine ihrer ersten vereinbarungen lautet, dass sie dinge anders sehen darf als tacitus. eigene person knittel ist weder verse noch zorn in neuer form. ihre wahrnehmung ist materiell und korpergebunden; in sprache und takt zeigt sich eine neigung zu reim und form. das hofzimmer in farholde war ihre bisherige werkstatt; seit dem 27. februar ist sie mit tacitus im horn. nachste arbeit valerias charisma-stirnreif wurde am 25. februar ubergeben, stykes +2-umhang am 26. februar. zwei weitere umhangaufwertungen und drei amulette bleiben in der bezahlten reihe. der umzug am 27. februar ersetzt keinen vollen fertigungstag.","initial":"K","backlinks":["story-so-far","tacitus-familiarprojekt"],"campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"styke-dex-guertel","aliases":["Belt of Incredible Dexterity +2"],"tags":["Crafting","Tacitus","Knittel","2.000 gp"],"group":"active","category":"vorhaben","title":"Stykes Geschicklichkeitsgürtel","summary":"Belt of Incredible Dexterity +2: am 22. Februar von Tacitus und Knittel fertiggestellt und von Styke getragen.","body":"<h2>Fertigstellung<\/h2><p>Tacitus und Knittel vollendeten den Gürtel am 22. Februar. Styke trägt ihn; seine aktuelle Geschicklichkeit beträgt 21.<\/p><h2>Materialrest<\/h2><p>Die gekaufte Cat’s-Grace-Schriftrolle wurde nicht verbraucht und bleibt Eigentum des Knotens.<\/p>","sources":["live","treasury","tacitus-current"],"status":"Fertig · getragen","links":[],"text":"Fertigstellung Tacitus und Knittel vollendeten den Gürtel am 22. Februar. Styke trägt ihn; seine aktuelle Geschicklichkeit beträgt 21. Materialrest Die gekaufte Cat’s-Grace-Schriftrolle wurde nicht verbraucht und bleibt Eigentum des Knotens.","search":"stykes geschicklichkeitsgurtel belt of incredible dexterity +2: am 22. februar von tacitus und knittel fertiggestellt und von styke getragen. crafting tacitus knittel 2.000 gp belt of incredible dexterity +2 fertigstellung tacitus und knittel vollendeten den gurtel am 22. februar. styke tragt ihn; seine aktuelle geschicklichkeit betragt 21. materialrest die gekaufte cat’s-grace-schriftrolle wurde nicht verbraucht und bleibt eigentum des knotens.","initial":"S","backlinks":[]},{"id":"thorn-tonsiegel","aliases":["Tonsiegel"],"tags":["Thorn","Kommunikation","Buch Zwei"],"group":"items","category":"gegenstaende","title":"Thorns tönernes Siegel","summary":"Neues Kommunikationssiegel für den zweiten Auftrag; von Thorn am 20. Februar an Styke übergeben.","body":"<p>Das kleine tönerne Siegel dient als neuer Kommunikationsweg zu Thorn während der Operation in Farholde und am Horn. Es ersetzt keine Befehle, Antworten oder Fristen, die noch nicht tatsächlich übermittelt wurden.<\/p>","sources":["live","transition","chronicle"],"status":"Bei Styke","links":[],"text":"Das kleine tönerne Siegel dient als neuer Kommunikationsweg zu Thorn während der Operation in Farholde und am Horn. Es ersetzt keine Befehle, Antworten oder Fristen, die noch nicht tatsächlich übermittelt wurden.","search":"thorns tonernes siegel neues kommunikationssiegel fur den zweiten auftrag; von thorn am 20. februar an styke ubergeben. thorn kommunikation buch zwei tonsiegel das kleine tonerne siegel dient als neuer kommunikationsweg zu thorn wahrend der operation in farholde und am horn. es ersetzt keine befehle, antworten oder fristen, die noch nicht tatsachlich ubermittelt wurden.","initial":"T","backlinks":[]},{"aliases":[],"links":[],"backlinks":["white-ravens"],"text":"Funktion Styke und Vesper wählten die Graue Möwe am 23. Februar als Wegwerf-Treffpunkt für die ankommenden White Ravens. Sie liegt näher an Corgan’s Landing als der Goldene Reiher und verrät nicht durch gewöhnlichen Besucherverkehr die Unterkunft des Kernhaushalts. Belegung Vier Zimmer für die erste Nacht wurden bezahlt. Elise, Dostan, Trak und Trik können ihre weitere Unterkunft selbst tragen. Die Möwe ist ein plausibles Gasthaus, kein geheimes Hauptquartier.","search":"die graue mowe gewohnliches gasthaus nahe corgan’s landing und vorlaufige farholde-basis des siebten knotens. farholde corgan’s landing white ravens treffpunkt  funktion styke und vesper wahlten die graue mowe am 23. februar als wegwerf-treffpunkt fur die ankommenden white ravens. sie liegt naher an corgan’s landing als der goldene reiher und verrat nicht durch gewohnlichen besucherverkehr die unterkunft des kernhaushalts. belegung vier zimmer fur die erste nacht wurden bezahlt. elise, dostan, trak und trik konnen ihre weitere unterkunft selbst tragen. die mowe ist ein plausibles gasthaus, kein geheimes hauptquartier.","initial":"D","id":"graue-moewe","category":"orte","title":"Die Graue Möwe","summary":"Gewöhnliches Gasthaus nahe Corgan’s Landing und vorläufige Farholde-Basis des Siebten Knotens.","body":"<h2>Funktion<\/h2><p>Styke und Vesper wählten die Graue Möwe am 23. Februar als Wegwerf-Treffpunkt für die ankommenden White Ravens. Sie liegt näher an Corgan’s Landing als der Goldene Reiher und verrät nicht durch gewöhnlichen Besucherverkehr die Unterkunft des Kernhaushalts.<\/p><h2>Belegung<\/h2><p>Vier Zimmer für die erste Nacht wurden bezahlt. Elise, Dostan, Trak und Trik können ihre weitere Unterkunft selbst tragen. Die Möwe ist ein plausibles Gasthaus, kein geheimes Hauptquartier.<\/p>","sources":["chronicle","timeline","farholde"],"status":"Aktiv · Siebter Knoten","tags":["Farholde","Corgan’s Landing","White Ravens","Treffpunkt"]},{"aliases":[],"links":[],"backlinks":[],"text":"Begegnung am Horn Jurak stellte Styke, Vesper und Valeria am 24. Februar vor dem Horn. Sie berichtete vom alten Todeskult und von ihrem heiligen Auftrag, den Ort im Namen des Victors zu schützen. Der Bruch Styke erklärte, dass er in das Horn müsse und die dort gesuchte Krankheit für seinen Schwur bergen wolle. Sein Angebot, dabei Tote zu begrenzen, reichte Jurak nicht. Sie verweigerte den Zugang, und Styke zog Stahl. Ende Vesper und Valeria unterstützten den kurzen Kampf. Als Jurak tödlich verwundet zurückwich, fing Valeria sie ab; Styke beendete den Kampf. Vesper nahm danach kleine Proben von Rinde, Harz und tieferem Holz.","search":"jurak die altere alte huterin des horns, die ihren vom victor erteilten schutzauftrag bis zum tod erfullte. horn von abaddon huterin victor caer bryr  begegnung am horn jurak stellte styke, vesper und valeria am 24. februar vor dem horn. sie berichtete vom alten todeskult und von ihrem heiligen auftrag, den ort im namen des victors zu schutzen. der bruch styke erklarte, dass er in das horn musse und die dort gesuchte krankheit fur seinen schwur bergen wolle. sein angebot, dabei tote zu begrenzen, reichte jurak nicht. sie verweigerte den zugang, und styke zog stahl. ende vesper und valeria unterstutzten den kurzen kampf. als jurak todlich verwundet zuruckwich, fing valeria sie ab; styke beendete den kampf. vesper nahm danach kleine proben von rinde, harz und tieferem holz.","initial":"J","id":"jurak","category":"personen","title":"Jurak die Ältere","summary":"Alte Hüterin des Horns, die ihren vom Victor erteilten Schutzauftrag bis zum Tod erfüllte.","body":"<h2>Begegnung am Horn<\/h2><p>Jurak stellte Styke, Vesper und Valeria am 24. Februar vor dem Horn. Sie berichtete vom alten Todeskult und von ihrem heiligen Auftrag, den Ort im Namen des Victors zu schützen.<\/p><h2>Der Bruch<\/h2><p>Styke erklärte, dass er in das Horn müsse und die dort gesuchte Krankheit für seinen Schwur bergen wolle. Sein Angebot, dabei Tote zu begrenzen, reichte Jurak nicht. Sie verweigerte den Zugang, und Styke zog Stahl.<\/p><h2>Ende<\/h2><p>Vesper und Valeria unterstützten den kurzen Kampf. Als Jurak tödlich verwundet zurückwich, fing Valeria sie ab; Styke beendete den Kampf. Vesper nahm danach kleine Proben von Rinde, Harz und tieferem Holz.<\/p>","sources":["live","chronicle","timeline"],"status":"Tot · 24. Februar 4712 AR","tags":["Horn von Abaddon","Hüterin","Victor","Caer Bryr"]},{"id":"deaths-head-tavern","category":"orte","title":"Death's Head Tavern","summary":"Gemeinschaftsschänke und Grumblejacks neues Zuhause im Horn.","body":"<h2>Erstes Lager · 24./25. Februar<\/h2><p>Hier endete die erste Hornexpedition mit einer vollständigen Nachtruhe und dem damaligen Buchvergleich; das Trio kehrte anschließend nach Farholde zurück.<\/p><h2>Einzug · 27. Februar<\/h2><p>Grumblejack entfernte die Leiche und nahm die Schänke als Zuhause an. Edda servierte das gemeinsame Abendessen und schenkte das erste Bier aus. Wasser ist trinkbar; die geprüften Höhlenpilze sind eine wenig schmackhafte Notreserve.<\/p><h2>Offene Einrichtung<\/h2><p>Haupttisch, Badheizung, passende Tür und weitere Einrichtung sind noch keine fertiggestellten Ergebnisse.<\/p>","sources":["live"],"status":"Bezogen · Aufbau läuft","tags":["Horn","Lager"],"aliases":[],"group":"","initial":"D","text":"Erstes Lager · 24./25. Februar Hier endete die erste Hornexpedition mit einer vollständigen Nachtruhe und dem damaligen Buchvergleich; das Trio kehrte anschließend nach Farholde zurück. Einzug · 27. Februar Grumblejack entfernte die Leiche und nahm die Schänke als Zuhause an. Edda servierte das gemeinsame Abendessen und schenkte das erste Bier aus. Wasser ist trinkbar; die geprüften Höhlenpilze sind eine wenig schmackhafte Notreserve. Offene Einrichtung Haupttisch, Badheizung, passende Tür und weitere Einrichtung sind noch keine fertiggestellten Ergebnisse.","links":[],"backlinks":[],"search":"death's head tavern gemeinschaftsschanke und grumblejacks neues zuhause im horn. horn lager  erstes lager · 24./25. februar hier endete die erste hornexpedition mit einer vollstandigen nachtruhe und dem damaligen buchvergleich; das trio kehrte anschliessend nach farholde zuruck. einzug · 27. februar grumblejack entfernte die leiche und nahm die schanke als zuhause an. edda servierte das gemeinsame abendessen und schenkte das erste bier aus. wasser ist trinkbar; die gepruften hohlenpilze sind eine wenig schmackhafte notreserve. offene einrichtung haupttisch, badheizung, passende tur und weitere einrichtung sind noch keine fertiggestellten ergebnisse.","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"ezra-thrice-damned","category":"personen","title":"Ezra Thrice-Damned","summary":"Der untote Priester des Vierten Knotens wurde am 25. Februar mit allen drei Wraiths vernichtet.","body":"<h2>Begegnung<\/h2><p>Ezra und drei Wraiths wurden im verborgenen Tresor auf Ebene Drei gefunden. Er gestand den Mord an drei Mitgliedern seines Knotens; Kael sei zuvor geflohen.<\/p><h2>Vorläufige Zusammenarbeit<\/h2><p>Ezra erklärte Ritualablauf, Augenfunktionen, Thronworte und den verdeckten Weg zum Sanctum. Seine Aussagen gelten dort als Zeugnis, wo sie noch nicht überprüft wurden. Vertrauen oder Retainerstatus besitzt er nicht.<\/p><h2>Ende der Zusammenarbeit<\/h2><p>Am 25. Februar wurde der vorläufige Nichtangriffsschutz aufgehoben. In normaler Initiative unterdrückte Vesper Ezras Flug und bereitete Stykes Waffe gegen den Untoten vor. Styke vernichtete Ezra in der ersten Runde; alle drei Wraiths folgten im anschließenden Kampf. Die aus C13 geborgenen Dirges bestätigen den Ritualrahmen unabhängig von seinem früheren Zeugnis.<\/p>","sources":["live"],"status":"Vernichtet · 25. Februar","tags":["Untoter","Vierter Knoten","Horn"],"aliases":[],"group":"","initial":"E","text":"Begegnung Ezra und drei Wraiths wurden im verborgenen Tresor auf Ebene Drei gefunden. Er gestand den Mord an drei Mitgliedern seines Knotens; Kael sei zuvor geflohen. Vorläufige Zusammenarbeit Ezra erklärte Ritualablauf, Augenfunktionen, Thronworte und den verdeckten Weg zum Sanctum. Seine Aussagen gelten dort als Zeugnis, wo sie noch nicht überprüft wurden. Vertrauen oder Retainerstatus besitzt er nicht. Ende der Zusammenarbeit Am 25. Februar wurde der vorläufige Nichtangriffsschutz aufgehoben. In normaler Initiative unterdrückte Vesper Ezras Flug und bereitete Stykes Waffe gegen den Untoten vor. Styke vernichtete Ezra in der ersten Runde; alle drei Wraiths folgten im anschließenden Kampf. Die aus C13 geborgenen Dirges bestätigen den Ritualrahmen unabhängig von seinem früheren Zeugnis.","links":[],"backlinks":[],"search":"ezra thrice-damned der untote priester des vierten knotens wurde am 25. februar mit allen drei wraiths vernichtet. untoter vierter knoten horn  begegnung ezra und drei wraiths wurden im verborgenen tresor auf ebene drei gefunden. er gestand den mord an drei mitgliedern seines knotens; kael sei zuvor geflohen. vorlaufige zusammenarbeit ezra erklarte ritualablauf, augenfunktionen, thronworte und den verdeckten weg zum sanctum. seine aussagen gelten dort als zeugnis, wo sie noch nicht uberpruft wurden. vertrauen oder retainerstatus besitzt er nicht. ende der zusammenarbeit am 25. februar wurde der vorlaufige nichtangriffsschutz aufgehoben. in normaler initiative unterdruckte vesper ezras flug und bereitete stykes waffe gegen den untoten vor. styke vernichtete ezra in der ersten runde; alle drei wraiths folgten im anschliessenden kampf. die aus c13 geborgenen dirges bestatigen den ritualrahmen unabhangig von seinem fruheren zeugnis."},{"id":"vexorandian","category":"personen","title":"Vexorandian","summary":"Gebundener Wächter des Horns; nach Wraith- und Schleimbeseitigung unter abwechselndem Ruhe- und Wachauftrag.","body":"<h2>Bindung<\/h2><p>Vexorandian wurde nichttödlich überwältigt. Styke trägt sein vollständiges Namensamulett und besitzt die unmittelbare Befehlsgewalt; Valeria ist durch stehenden Befehl delegiert.<\/p><h2>Wachauftrag<\/h2><p>Der bisherige untere gebaute Zugang bleibt sein anschließender Posten. Während der angeordneten Erholung gilt der Wechsel in der gemeinsamen Wächterkammer; dies hebt die übrigen Beschränkungen nicht auf.<\/p><h2>Erholung nach dem 25. Februar<\/h2><p>Vexorandian erlitt im Wraithkampf drei Punkte direkten Schaden und drei Punkte Konstitutionsentzug. Beide Wächter vernichteten danach die Schleime mit Elektrizitätsatem. Sie sollen in ihrer früheren gemeinsamen Kammer abwechselnd wachen und ruhen, bis natürliche Erholung ausgeschöpft ist, und anschließend die getrennten Eingangsposten wieder aufnehmen. Alle bisherigen Zutritts- und nichttödlichen Festsetzungsregeln gelten weiter. Ein aktueller Heilungsbericht wurde dem Kerntrio nicht übermittelt. Vexors Konstitutionsentzug wird weder durch Ruhe noch durch Lesser Restoration entfernt.<\/p>","sources":["live"],"status":"Gebunden · letzter bekannter Auftrag: Erholung und Wache","tags":["Daemon","Wächter","Gebunden"],"aliases":[],"group":"","initial":"V","text":"Bindung Vexorandian wurde nichttödlich überwältigt. Styke trägt sein vollständiges Namensamulett und besitzt die unmittelbare Befehlsgewalt; Valeria ist durch stehenden Befehl delegiert. Wachauftrag Der bisherige untere gebaute Zugang bleibt sein anschließender Posten. Während der angeordneten Erholung gilt der Wechsel in der gemeinsamen Wächterkammer; dies hebt die übrigen Beschränkungen nicht auf. Erholung nach dem 25. Februar Vexorandian erlitt im Wraithkampf drei Punkte direkten Schaden und drei Punkte Konstitutionsentzug. Beide Wächter vernichteten danach die Schleime mit Elektrizitätsatem. Sie sollen in ihrer früheren gemeinsamen Kammer abwechselnd wachen und ruhen, bis natürliche Erholun ufwertungen."},{"id":"air-grievances","category":"faehigkeiten","title":"Air Grievances","summary":"Demoralize +19; gegen lebende Ziele in der Aura +23.","body":"<h2>Aktueller Wert<\/h2><p>Basis Intimidate +16, Air Grievances +3; die Aura gegen lebende Ziele innerhalb 10 ft fügt +4 hinzu. Kein pauschales +22-Profil. Aura-Command hat Will-SG 19.<\/p>","sources":["valsheet"],"status":"Aktiv · Stufe 7","tags":["Fähigkeit","Valeria"],"aliases":[],"group":"","initial":"A","text":"Aktueller Wert Basis Intimidate +16, Air Grievances +3; die Aura gegen lebende Ziele innerhalb 10 ft fügt +4 hinzu. Kein pauschales +22-Profil. Aura-Command hat Will-SG 19.","links":[],"backlinks":[],"search":"air grievances demoralize +19; gegen lebende ziele in der aura +23. fahigkeit valeria  aktueller wert basis intimidate +16, air grievances +3; die aura gegen lebende ziele innerhalb 10 ft fugt +4 hinzu. kein pauschales +22-profil. aura-command hat will-sg 19.","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"dirges-apollyon","category":"gegenstaende","title":"Dirges of Apollyon","summary":"Die aus C13 geborgene Schrift mit Kappelbrenners konkreten Anweisungen für das 222-Tage-Ritual.","body":"<h2>Bergung und Lesen<\/h2><p>Vesper holte den ledergebundenen Band mit zwei Anwendungen von Gaseous Form aus C13. Styke las die spätere abyssische Handschrift mit seinem Verständnis-/Read-Magic-Helm; Vesper und Valeria waren bei der Auswertung anwesend. Der endgültige Träger nach der Rückkehr wurde nicht erneut festgestellt.<\/p><h2>Gebetsfolge<\/h2><p>666 Gebete an 222 ununterbrochenen Tagen: Supplication to Darkness um Mitternacht, Cursing of the Light bei Sonnenaufgang und Call Across the Void bei Sonnenuntergang. Nach jedem Gebet wird das Silbersiegel mit unheiligem Wasser gewaschen. Ein verpasstes Gebetsfenster setzt den Zähler zurück.<\/p><h2>Drei Opfer<\/h2><p>Das erste Mitternachtsgebet verlangt einen Todespriester oder dessen Nachfahren; das 111. Morgengebet einen wahrhaft Mitragläubigen; das letzte Abendgebet jemanden aus der Blutlinie des Victor. Die Opfer müssen leben, wenn ihr Herz herausgeschnitten und in eine Schale der Statue gelegt wird.<\/p><h2>Die abschließende Bitte<\/h2><p>Vetra-Kali soll nach dem letzten Tag um Mitternacht zurückkehren und das Siegel brechen. Vigilance steht für das Verschonen der Beschwörer, Hatred für die Tears of Achlys und Withering für einen dritten frei gewählten Wunsch. Das beschreibt die Anweisung der Schrift; kein Opfer, Gebetszähler oder endgültiger Handel hat begonnen.<\/p>","sources":["live","chronicle"],"status":"Geborgen · Ritual nicht begonnen","tags":[],"aliases":[],"initial":"D","text":"Bergung und Lesen Vesper holte den ledergebundenen Band mit zwei Anwendungen von Gaseous Form aus C13. Styke las die spätere abyssische Handschrift mit seinem Verständnis-/Read-Magic-Helm; Vesper und Valeria waren bei der Auswertung anwesend. Der endgültige Träger nach der Rückkehr wurde nicht erneut festgestellt. Gebetsfolge 666 Gebete an 222 ununterbrochenen Tagen: Supplication to Darkness um Mitternacht, Cursing of the Light bei Sonnenaufgang und Call Across the Void bei Sonnenuntergang. Nach jedem Gebet wird das Silbersiegel mit unheiligem Wasser gewaschen. Ein verpasstes Gebetsfenster setzt den Zähler zurück. Drei Opfer Das erste Mitternachtsgebet verlangt einen Todespriester oder dessen Nachfahren; das 111. Morgengebet einen wahrhaft Mitragläubigen; das letzte Abendgebet jemanden aus der Blutlinie des Victor. Die Opfer müssen leben, wenn ihr Herz herausgeschnitten und in eine Schale der Statue gelegt wird. Die abschließende Bitte Vetra-Kali soll nach dem letzten Tag um Mitternacht zurückkehren und das Siegel brechen. Vigilance steht für das Verschonen der Beschwörer, Hatred für die Tears of Achlys und Withering für einen dritten frei gewählten Wunsch. Das beschreibt die Anweisung der Schrift; kein Opfer, Gebetszähler oder endgültiger Handel hat begonnen.","links":[],"search":"dirges of apollyon die aus c13 geborgene schrift mit kappelbrenners konkreten anweisungen fur das 222-tage-ritual.   bergung und lesen vesper holte den ledergebundenen band mit zwei anwendungen von gaseous form aus c13. styke las die spatere abyssische handschrift mit seinem verstandnis-/read-magic-helm; vesper und valeria waren bei der auswertung anwesend. der endgultige trager nach der ruckkehr wurde nicht erneut festgestellt. gebetsfolge 666 gebete an 222 ununterbrochenen tagen: supplication to darkness um mitternacht, cursing of the light bei sonnenaufgang und call across the void bei sonnenuntergang. nach jedem gebet wird das silbersiegel mit unheiligem wasser gewaschen. ein verpasstes gebetsfenster setzt den zahler zuruck. drei opfer das erste mitternachtsgebet verlangt einen todespriester oder dessen nachfahren; das 111. morgengebet einen wahrhaft mitraglaubigen; das letzte abendgebet jemanden aus der blutlinie des victor. die opfer mussen leben, wenn ihr herz herausgeschnitten und in eine schale der statue gelegt wird. die abschliessende bitte vetra-kali soll nach dem letzten tag um mitternacht zuruckkehren und das siegel brechen. vigilance steht fur das verschonen der beschworer, hatred fur die tears of achlys und withering fur einen dritten frei gewahlten wunsch. das beschreibt die anweisung der schrift; kein opfer, gebetszahler oder endgultiger handel hat begonnen.","backlinks":["horn-abaddon"]},{"id":"eye-of-vigilance","category":"gegenstaende","title":"Auge der Wachsamkeit","summary":"Vespers geborgenes und aktiviertes Ritualauge: ein gewählter Blickpunkt irgendwo im Horn, auch durch Stein.","body":"<h2>Bergung und Aktivierung<\/h2><p>Vesper identifizierte den grünen Stein aus C13 als Eye of Vigilance. Blut eines intelligenten Wesens aktiviert seine wahre Gestalt; am 25. Februar wurde dafür Zikomos Blut verwendet.<\/p><h2>Erprobte Funktion<\/h2><p>Der Träger kann bewusst einen einzelnen Ort innerhalb des Horns beobachten, auch durch Wände und Stein. Das ist keine gleichzeitige Rundumüberwachung.<\/p><h2>Status<\/h2><p>Vesper besitzt das aktivierte Auge; es ist nicht im Sanctum eingesetzt. Die Dirges verbinden es am Ritualende mit der Bitte, die Beschwörer zu verschonen.<\/p>","sources":["live","chronicle"],"status":"Bei Vesper · aktiv · nicht eingesetzt","tags":[],"aliases":[],"initial":"A","text":"Bergung und Aktivierung Vesper identifizierte den grünen Stein aus C13 als Eye of Vigilance. Blut eines intelligenten Wesens aktiviert seine wahre Gestalt; am 25. Februar wurde dafür Zikomos Blut verwendet. Erprobte Funktion Der Träger kann bewusst einen einzelnen Ort innerhalb des Horns beobachten, auch durch Wände und Stein. Das ist keine gleichzeitige Rundumüberwachung. Status Vesper besitzt das aktivierte Auge; es ist nicht im Sanctum eingesetzt. Die Dirges verbinden es am Ritualende mit der Bitte, die Beschwörer zu verschonen.","links":[],"search":"auge der wachsamkeit vespers geborgenes und aktiviertes ritualauge: ein gewahlter blickpunkt irgendwo im horn, auch durch stein.   bergung und aktivierung vesper identifizierte den grunen stein aus c13 als eye of vigilance. blut eines intelligenten wesens aktiviert seine wahre gestalt; am 25. februar wurde dafur zikomos blut verwendet. erprobte funktion der trager kann bewusst einen einzelnen ort innerhalb des horns beobachten, auch durch wande und stein. das ist keine gleichzeitige rundumuberwachung. status vesper besitzt das aktivierte auge; es ist nicht im sanctum eingesetzt. die dirges verbinden es am ritualende mit der bitte, die beschworer zu verschonen.","backlinks":["horn-abaddon"]},{"id":"horn-aufbau","category":"horn","title":"Aufbau und Umzug zum Horn","summary":"Der erste Zug ist am 27. Februar eingezogen. Vier Fachkräfte beginnen mit Holzarbeiten, Schmiede, Küche und baulicher Untersuchung.","body":"<h2>Erster Einzug<\/h2><p>Am 27. Februar ist der erste Zug von Westell zum Horn gereist. Die vier Fachkräfte wohnen und arbeiten in der eingerichteten Siedlungszone auf Ebene Eins. Ihre ersten Arbeiten und das gemeinsame Abendessen haben begonnen beziehungsweise stattgefunden.<\/p><h2>Die vier Fachkräfte<\/h2><p><a href=\"#/artikel/branna-cole\">Branna Cole<\/a> übernimmt Holzarbeiten und die Rettung von Betten, Türen und Beschlägen. <a href=\"#/artikel/osric-fenlow\">Osric Fenlow<\/a> arbeitet am Kohlelager und am defekten Blasebalg. <a href=\"#/artikel/edda-marr\">Edda Marr<\/a> versorgt Küche und Bierausschank. <a href=\"#/artikel/darric-holt\">Darric Holt<\/a> untersucht die Bausubstanz vor geplanten Veränderungen.<\/p><p>Alle vier haben einen längeren Aufenthalt mit einem Goldstück Tageslohn, Verpflegung und Unterkunft angenommen. Fertige Möbel, eine betriebsbereite Schmiede oder abgeschlossene Umbauten sind noch nicht bestätigt.<\/p><h2>Familien<\/h2><p>Osrics Partnerperson und zwei schulpflichtige Kinder bleiben in Farholde. Kaitlyn organisierte über Vandermir die vereinbarte Unterkunft, Versorgung und Ausbildung; das Ergebnis wurde vor dem Aufbruch berichtet.<\/p><h2>Versorgung<\/h2><p>Das erste gemeinsame Abendessen wurde serviert und das erste Bierfass angestochen. Trinkbares Wasser ist verfügbar. Die Höhlenpilze wurden mit Vesper geprüft und gelten als wenig schmackhafte Notreserve.<\/p><h2>Werkstätten<\/h2><p>Mirelle zieht mit und benötigt ihren trockenen Tischraum. Tacitus und Knittel sind im Hornlabor angekommen. Ihre bezahlte Reihe bleibt offen; der Umzugstag zählt nicht als voller Fertigungstag. Grumblejacks Plattenrüstung, Badheizung, Fernkommunikation und Tresortransport sind offene Projekte.<\/p><h2>Herrschaftsentwurf<\/h2><p>Arbeit, Wache und vereinbarte Dauer stehen Schutz, Lohn, anerkanntem Eigentum und einer Streitstelle gegenüber. Schankarbeit und freiwillige Sexarbeit bleiben getrennt; niemand erhält einen Anspruch auf Sex.<\/p><h2>Verbundene Akten<\/h2><p><a href=\"#/artikel/halthus\">Halthus<\/a> · <a href=\"#/artikel/artephius\">Artephius<\/a> · <a href=\"#/artikel/eye-of-withering\">Auge des Verwelkens<\/a> · <a href=\"#/artikel/carnitheria-rex\">Carnitheria Rex<\/a><\/p>","sources":["live","chronicle","timeline","horn-workforce"],"status":"Einzug erfolgt · Arbeiten begonnen","tags":[],"aliases":[],"initial":"A","text":"Erster Einzug Am 27. Februar ist der erste Zug von Westell zum Horn gereist. Die vier Fachkräfte wohnen und arbeiten in der eingerichteten Siedlungszone auf Ebene Eins. Ihre ersten Arbeiten und das gemeinsame Abendessen haben begonnen beziehungsweise stattgefunden. Die vier Fachkräfte Branna Cole übernimmt Holzarbeiten und die Rettung von Betten, Türen und Beschlägen. Osric Fenlow arbeitet am Kohlelager und am defekten Blasebalg. Edda Marr versorgt Küche und Bierausschank. Darric Holt untersucht die Bausubstanz vor geplanten Veränderungen. Alle vier haben einen längeren Aufenthalt mit einem Goldstück Tageslohn, Verpflegung und Unterkunft angenommen. Fertige Möbel, eine betriebsbereite Schmiede oder abgeschlossene Umbauten sind noch nicht bestätigt. Familien Osrics Partnerperson und zwei schulpflichtige Kinder bleiben in Farholde. Kaitlyn organisierte über Vandermir die vereinbarte Unterkunft, Versorgung und Ausbildung; das Ergebnis wurde vor dem Aufbruch berichtet. Versorgung Das erste gemeinsame Abendessen wurde serviert und das erste Bierfass angestochen. Trinkbares Wasser ist verfügbar. Die Höhlenpilze wurden mit Vesper geprüft und gelten als wenig schmackhafte Notreserve. Werkstätten Mirelle zieht mit und benötigt ihren trockenen Tischraum. Tacitus und Knittel sind im Hornlabor angekommen. Ihre bezahlte Reihe bleibt offen; der Umzugstag zählt nicht als voller Fertigungstag. Grumblejacks Plattenrüstung, Badheizung, Fernkommunikation und Tresortransport sind offene Projekte. Herrschaftsentwurf Arbeit, Wache und vereinbarte Dauer stehen Schutz, Lohn, anerkanntem Eigentum und einer Streitstelle gegenüber. Schankarbeit und freiwillige Sexarbeit bleiben getrennt; niemand erhält einen Anspruch auf Sex. Verbundene Akten Halthus · Artephius · Auge des Verwelkens · Carnitheria Rex" n<\/h2><p>Darric bringt Erfahrung in gewöhnlichen Stein- und Reparaturarbeiten sowie eigene Handwerkzeuge mit. Im Horn hat er erste Bereiche für die bauliche Untersuchung markiert. Die Untersuchung läuft; fertige Umbauten oder abgeschlossene Befunde sind noch nicht bestätigt.<\/p><h2>Weitere Fachkräfte<\/h2><p><a href=\"#/artikel/branna-cole\">Branna Cole<\/a> · <a href=\"#/artikel/osric-fenlow\">Osric Fenlow<\/a> · <a href=\"#/artikel/edda-marr\">Edda Marr<\/a> · <a href=\"#/artikel/horn-aufbau\">Aufbau des Horns<\/a><\/p>","sources":["horn-workforce"],"status":"Bewohner · seit 27. Februar","tags":["Horn","Bewohner","Handwerk","Maurer und Steinhandwerker"],"aliases":[],"group":"horn","initial":"D","campaignStand":"27. Februar 4712 AR · erster Einzug","links":["horn-abaddon","branna-cole","osric-fenlow","edda-marr","horn-aufbau"],"backlinks":["horn-aufbau","branna-cole","osric-fenlow","edda-marr"],"text":"Person Maurer und Steinhandwerker · Mensch · 29 Jahre Darric Holt gehört zu den vier Fachkräften, die am 27. Februar mit dem ersten Zug ins Horn von Abaddon kamen. Vereinbart sind ein längerer Aufenthalt, ein Goldstück Lohn pro Tag sowie Verpflegung und Unterkunft. Erscheinung Darric hat dunkelblondes, zerzaustes Haar, blaue Augen, einen markanten Kiefer und kurzen Bartschatten. Sein Körper ist athletisch, mit breiten Schultern, schmaler Taille und langen Beinen. Sonnengebräunte Haut und heller Steinstaub an Händen und Kleidung prägen seinen Eindruck. Auf seinem Porträt trägt er ein helles Leinenhemd mit offenem Kragen, eine dunkelblaue Wollweste und einen Ledergürtel mit Handwerkzeugen. Sein hübsches Gesicht und das leicht schelmische Lächeln stehen im Kontrast zu Osrics gelassener Reife. Charakter Darric ist anfangs etwas zurückhaltend, wird bei ungewöhnlichen Konstruktionen aber rasch lebhaft. Er möchte zeigen, dass ihm auch größere Arbeiten zuzutrauen sind. Aus Eifer sagt er gelegentlich zu schnell etwas zu und muss sich anschließend genauer festlegen. Kritik t arkvision darkvision 60 ft fur sieben stunden; aktuelle arcane-enlightenment-auswahl. stufe 7 ae · grad 2  aktueller cl-7-wert standard action, beruhrung. ersetzt heute silent image; temporare tagliche auswahl, kein dauerhaft regular bekannter oracle-zauber."},{"id":"stinking-cloud","title":"Stinking Cloud","category":"faehigkeiten","summary":"20-ft-Nebel, sieben Runden; Fort-SG 18 gegen Nauseated.","body":"<h2>Aktueller CL-7-Wert<\/h2><p>Standard Action, Medium 170 ft. Normalen Gift-, Sicht- und Nachwirkungsregeln folgen; täglich flexible AE-Auswahl.<\/p>","status":"Aktiv · Stufe 7","tags":["Stufe 7","AE · Grad 3"],"aliases":[],"sources":["vsheet"],"owner":["Vesper"],"kind":"AE · Grad 3","links":[],"backlinks":["faehigkeiten-register"],"text":"Aktueller CL-7-Wert Standard Action, Medium 170 ft. Normalen Gift-, Sicht- und Nachwirkungsregeln folgen; täglich flexible AE-Auswahl.","search":"stinking cloud 20-ft-nebel, sieben runden; fort-sg 18 gegen nauseated. stufe 7 ae · grad 3  aktueller cl-7-wert standard action, medium 170 ft. normalen gift-, sicht- und nachwirkungsregeln folgen; taglich flexible ae-auswahl."},{"id":"zeit-0227","category":"chronik","title":"Der Haushalt zieht ins Horn","summary":"Einzug, Fachkräfte, Halthus’ Wiederherstellung und das erste gemeinsame Abendessen.","body":"<p>Von Westell zog der Haushalt ins Horn. Die vier Fachkräfte begannen Holz-, Schmiede-, Küchen- und Steinarbeiten; Hakons Männer bezogen die Wächterquartiere. Grumblejack machte die Death’s Head Tavern zu seinem Zuhause. Halthus wurde wiederhergestellt und in Haft genommen, Withering geborgen. Das erste gemeinsame Abendessen und der erste Bierausschank fanden statt.<\/p>","sources":["live","chronicle"],"status":"Historisch · angenommene Ereignisse","tags":["Horn","Einzug"],"aliases":[],"date":"4712-02-27","dateLabel":"27. Februar 4712 AR","links":[],"backlinks":[],"text":"Von Westell zog der Haushalt ins Horn. Die vier Fachkräfte begannen Holz-, Schmiede-, Küchen- und Steinarbeiten; Hakons Männer bezogen die Wächterquartiere. Grumblejack machte die Death’s Head Tavern zu seinem Zuhause. Halthus wurde wiederhergestellt und in Haft genommen, Withering geborgen. Das erste gemeinsame Abendessen und der erste Bierausschank fanden statt.","search":"der haushalt zieht ins horn einzug, fachkrafte, halthus’ wiederherstellung und das erste gemeinsame abendessen. horn einzug  von westell zog der haushalt ins horn. die vier fachkrafte begannen holz-, schmiede-, kuchen- und steinarbeiten; hakons manner bezogen die wachterquartiere. grumblejack machte die death’s head tavern zu seinem zuhause. halthus wurde wiederhergestellt und in haft genommen, withering geborgen. das erste gemeinsame abendessen und der erste bierausschank fanden statt."},{"id":"zeit-0228","category":"chronik","title":"Der erste Morgen im bewohnten Horn","summary":"Nachtruhe abgeschlossen; Aufbau, Rekonstruktion und Ritual bleiben offen.","body":"<h2>Morgen<\/h2><p>Styke, Vesper und Elise sind in der Lustkammer auf Ebene Drei, Valeria in den bestehenden Quartieren auf Zwei. Normale Nachtruhe und Tagesauffrischung sind abgeschlossen. Kein neuer Arbeits-, Forschungs- oder Ritualerfolg ist dadurch entstanden.<\/p>","sources":["live","chronicle"],"status":"Historisch · angenommene Ereignisse","tags":["Horn","Einzug"],"aliases":[],"date":"4712-02-28","dateLabel":"28. Februar 4712 AR","links":[],"backlinks":[],"text":"Morgen Styke, Vesper und Elise sind in der Lustkammer auf Ebene Drei, Valeria in den bestehenden Quartieren auf Zwei. Normale Nachtruhe und Tagesauffrischung sind abgeschlossen. Kein neuer Arbeits-, Forschungs- oder Ritualerfolg ist dadurch entstanden.","search":"der erste morgen im bewohnten horn nachtruhe abgeschlossen; aufbau, rekonstruktion und ritual bleiben offen. horn einzug  morgen styke, vesper und elise sind in der lustkammer auf ebene drei, valeria in den bestehenden quartieren auf zwei. normale nachtruhe und tagesauffrischung sind abgeschlossen. kein neuer arbeits-, forschungs- oder ritualerfolg ist dadurch entstanden."},{"id":"halthus","title":"Halthus","category":"personen","summary":"Wiederhergestellter ehemaliger Kultist; lebend in Tamsins Haft.","body":"<h2>Wiederherstellung<\/h2><p>Am 27. Februar wurde der versteinerte Mann mit seinem richtigen Kopf und einer Portion Steinsalbe wiederhergestellt. Sein Geständnis zum alten Kult und seine Eignung als erstes Ritualopfer sind dem Kerntrio bekannt.<\/p><h2>Aktuelle Haft<\/h2><p>Lebend, entwaffnet und in Hemd und Hose in der Stahlzelle auf Ebene Drei. Tamsin kontrolliert den Zugang, Edda bringt Essen und Wasser. Seine gewöhnliche Ausrüstung liegt bei Tamsin auf Ebene Eins. Kein Opfer ist vollzogen; sein Gehirn ist kein verfügbarer Reparaturbestand.<\/p>","sources":["live","chronicle"],"status":"Aktuell · 28. Februar morgens","tags":["Horn"],"aliases":[],"links":[],"backlinks":["bekannt-unbekannt","offene-spuren","spielstand","horn-abaddon","horn-aufbau"],"campaignStand":"28. Februar 4712 AR · Morgen","group":"horn","text":"Wiederherstellung Am 27. Februar wurde der versteinerte Mann mit seinem richtigen Kopf und einer Portion Steinsalbe wiederhergestellt. Sein Geständnis zum alten Kult und seine Eignung als erstes Ritualopfer sind dem Kerntrio bekannt. Aktuelle Haft Lebend, entwaffnet und in Hemd und Hose in der Stahlzelle auf Ebene Drei. Tamsin kontrolliert den Zugang, Edda bringt Essen und Wasser. Seine gewöhnliche Ausrüstung liegt bei Tamsin auf Ebene Eins. Kein Opfer ist vollzogen; sein Gehirn ist kein verfügbarer Reparaturbestand.","search":"halthus wiederhergestellter ehemaliger kultist; lebend in tamsins haft. horn  wiederherstellung am 27. februar wurde der versteinerte mann mit seinem richtigen kopf und einer portion steinsalbe wiederhergestellt. sein gestandnis zum alten kult und seine eignung als erstes ritualopfer sind dem kerntrio bekannt. aktuelle haft lebend, entwaffnet und in hemd und hose in der stahlzelle auf ebene drei. tamsin kontrolliert den zugang, edda bringt essen und wasser. seine gewohnliche ausrustung liegt bei tamsin auf ebene eins. kein opfer ist vollzogen; sein gehirn ist kein verfugbarer reparaturbestand."},{"id":"artephius","title":"Artephius","category":"horn","summary":"Inaktiver künstlicher Humanoider; beschädigte Linse diagnostiziert, Reparaturteile fehlen.","body":"<h2>Untersuchung am 27. Februar<\/h2><p>Tacitus und Vesper untersuchten den inaktiven Körper und die Pläne im Hornlabor. Die vollständige, gebrochene Linse ist reparierbar. Ein totes Gehirn und das fehlende Mithralzahnrad werden benötigt; das Ersatz-Glasreservoir ist im Labor vorhanden, aber nicht installiert.<\/p><h2>Offene Wiederherstellung<\/h2><p>Das gesicherte Lightning Blood ist bei Tacitus im Labor. Noch keine Komponenteninstallation, kein vollständiger Reparaturtag und keine Aktivierung. Ein kompatibles Gehirn darf nicht aus einer noch lebenden Person als bereits verfügbare Ressource gerechnet werden.<\/p>","sources":["live","chronicle"],"status":"Aktuell · 28. Februar morgens","tags":["Horn"],"aliases":[],"links":[],"backlinks":["bekannt-unbekannt","offene-spuren","spielstand","horn-abaddon","horn-aufbau"],"campaignStand":"28. Februar 4712 AR · Morgen","text":"Untersuchung am 27. Februar Tacitus und Vesper untersuchten den inaktiven Körper und die Pläne im Hornlabor. Die vollständige, gebrochene Linse ist reparierbar. Ein totes Gehirn und das fehlende Mithralzahnrad werden benötigt; das Ersatz-Glasreservoir ist im Labor vorhanden, aber nicht installiert. Offene Wiederherstellung Das gesicherte Lightning Blood ist bei Tacitus im Labor. Noch keine Komponenteninstallation, kein vollständiger Reparaturtag und keine Aktivierung. Ein kompatibles Gehirn darf nicht aus einer noch lebenden Person als bereits verfügbare Ressource gerechnet werden.","search":"artephius inaktiver kunstlicher humanoider; beschadigte linse diagnostiziert, reparaturteile fehlen. horn  untersuchung am 27. februar tacitus und vesper untersuchten den inaktiven korper und die plane im hornlabor. die vollstandige, gebrochene linse ist reparierbar. ein totes gehirn und das fehlende mithralzahnrad werden benotigt; das ersatz-glasreservoir ist im labor vorhanden, aber nicht installiert. offene wiederherstellung das gesicherte lightning blood ist bei tacitus im labor. noch keine komponenteninstallation, kein vollstandiger reparaturtag und keine aktivierung. ein kompatibles gehirn darf nicht aus einer noch lebenden person als bereits verfugbare ressource gerechnet werden."},{"id":"eye-of-withering","title":"Auge des Verwelkens","category":"gegenstaende","summary":"Bei Vesper; geborgen, aber nicht in seine Fassung eingesetzt.","body":"<h2>Besitz und Zustand<\/h2><p>Das Auge wurde am 27. Februar geborgen und ist bei Vesper. Zusammen mit Vigilance bei ihr und Hatred bei Styke sind nun alle drei Augen verfügbar, keines installiert.<\/p><h2>Bekannte Funktion<\/h2><p>Nach dem bekannten Ritualbericht verstärkt Withering ansässige Daemons und Untote; die kombinierte Wirkung hängt von der tatsächlichen Installation ab. Daraus folgt kein bereits aktiver Bonus und kein Ritualbeginn.<\/p>","sources":["live","chronicle"],"status":"Aktuell · 28. Februar morgens","tags":["Horn"],"aliases":[],"links":[],"backlinks":["bekannt-unbekannt","offene-spuren","spielstand","horn-abaddon","horn-aufbau"],"campaignStand":"28. Februar 4712 AR · Morgen","text":"Besitz und Zustand Das Auge wurde am 27. Februar geborgen und ist bei Vesper. Zusammen mit Vigilance bei ihr und Hatred bei Styke sind nun alle drei Augen verfügbar, keines installiert. Bekannte Funktion Nach dem bekannten Ritualbericht verstärkt Withering ansässige Daemons und Untote; die kombinierte Wirkung hängt von der tatsächlichen Installation ab. Daraus folgt kein bereits aktiver Bonus und kein Ritualbeginn.","search":"auge des verwelkens bei vesper; geborgen, aber nicht in seine fassung eingesetzt. horn  besitz und zustand das auge wurde am 27. februar geborgen und ist bei vesper. zusammen mit vigilance bei ihr und hatred bei styke sind nun alle drei augen verfugbar, keines installiert. bekannte funktion nach dem bekannten ritualbericht verstarkt withering ansassige daemons und untote; die kombinierte wirkung hangt von der tatsachlichen installation ab. daraus folgt kein bereits aktiver bonus und kein ritualbeginn."},{"id":"carnitheria-rex","title":"Carnitheria Rex","category":"horn","summary":"Die Rekonstruktion ist vorbereitet; Rex wurde noch nicht gerufen.","body":"<h2>Vorhandene Mittel<\/h2><p>Der schwere Ritualhengst und vorgeschriebenes Ritualmaterial im Wert von 3.000 gp wurden am 26. Februar beschafft. Das Tier lebt und das Material ist unbenutzt.<\/p><h2>Erforderliche Arbeit<\/h2><p>Styke und Zorn benötigen einen tatsächlichen vollen Arbeitstag zur ausführbaren Rekonstruktion. Reise, erste Teilaufgaben und Nachtruhe ersetzen ihn nicht. Keine Beschwörung und kein Rückflug mit Elise haben stattgefunden.<\/p>","sources":["live","chronicle","treasury"],"status":"Aktuell · 28. Februar morgens","tags":["Horn"],"aliases":[],"links":[],"backlinks":["bekannt-unbekannt","offene-spuren","spielstand","horn-abaddon","horn-aufbau"],"campaignStand":"28. Februar 4712 AR · Morgen","text":"Vorhandene Mittel Der schwere Ritualhengst und vorgeschriebenes Ritualmaterial im Wert von 3.000 gp wurden am 26. Februar beschafft. Das Tier lebt und das Material ist unbenutzt. Erforderliche Arbeit Styke und Zorn benötigen einen tatsächlichen vollen Arbeitstag zur ausführbaren Rekonstruktion. Reise, erste Teilaufgaben und Nachtruhe ersetzen ihn nicht. Keine Beschwörung und kein Rückflug mit Elise haben stattgefunden.","search":"carnitheria rex die rekonstruktion ist vorbereitet; rex wurde noch nicht gerufen. horn  vorhandene mittel der schwere ritualhengst und vorgeschriebenes ritualmaterial im wert von 3.000 gp wurden am 26. februar beschafft. das tier lebt und das material ist unbenutzt. erforderliche arbeit styke und zorn benotigen einen tatsachlichen vollen arbeitstag zur ausf
