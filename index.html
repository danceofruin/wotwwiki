el/arved\">Arved</a>, <a href=\"#/artikel/torvald\">Torvald</a> und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.</p>\n","sources":["cultures","history"],"status":"Kampagnenkonversion","tags":["Kultur","Sprache"],"aliases":["Norspik","Ulfen","Skald"],"text":"Kanon der Kampagne Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt. Lebenswelt und Individualität Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz. Hakon , Sten , Ketil , Eirik , Arved , Torvald und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.","links":["arved","eirik","hakon","ketil","sten","torvald"],"backlinks":[],"search":"norspiker nordische seeleute mit ulfen bezug in der kampagnenanpassung kultur sprache norspik ulfen skald kanon der kampagne norspiker werden als ulfen assoziiertes seefahrervolk behandelt norspik bleibt der gebrauchte sprachname und gilt als mit skald verwandt die bezeichnung wird nicht einfach durch ulfen ersetzt lebenswelt und individualitat schiffe sind arbeitsplatz eigentum unterkunft hierarchie und uberlebensraum handel fischfang kriegsfahrt lohnarbeit verwandtschaft und eide konnen nebeneinander stehen begrenztes common ist kein zeichen geringer intelligenz hakon sten ketil eirik arved torvald und odenkirk bleiben individuelle personen mit unterschiedlicher stellung im akzeptierten verlauf","initial":"N"},{"id":"yutak","category":"welt","title":"Yutak","summary":"Nördliche Inselgemeinschaften, mit denen die Gruppe Handel trieb.","body":"<h2>Kulturrahmen</h2>\n<p>Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise.</p>\n<h2>Kontakte statt Pauschalbild</h2>\n<p><a href=\"#/artikel/white-tusk\">White Tusk</a> und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose.</p>\n<h2>Politischer Rahmen</h2>\n<p>Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.</p>\n","sources":["cultures","history","chronicle"],"status":"Allgemeinwissen","tags":["Kultur","Nordreise"],"aliases":[],"text":"Kulturrahmen Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise. Kontakte statt Pauschalbild White Tusk und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose. Politischer Rahmen Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.","links":["white-tusk"],"backlinks":["sambryl"],"search":"yutak nordliche inselgemeinschaften mit denen die gruppe handel trieb kultur nordreise kulturrahmen seewege fischfang jagd haltbare nahrung haute knochen wetterkenntnis und verwandtschaft sind wichtige grundlagen nutzliche werkzeuge metall stoff und gebrauchsguter konnen einen anderen wert haben als bloe sudliche geldpreise kontakte statt pauschalbild white tusk und joseph gehoren zur abgeschlossenen nordreise ihre aufgaben autoritaten und wissen sind nicht identisch der handel brachte die spater in aldencross verkauften elfenbeinlose politischer rahmen das kulturdossier nennt einen alten frieden talingardes mit yutak hauptlingen eine konkrete begegnung bleibt trotzdem von vorherigen erfahrungen bedarf und umgang abhangig","initial":"Y"},{"id":"abstammungen","category":"welt","title":"Abstammungen im bekannten Talingarde","summary":"Die im Kampagnenumfeld wichtigen Abstammungen und ihre Grenzen.","body":"<h2>Aasimar und Tiefling</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. <a href=\"#/artikel/vesper\">Vesper</a> wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich.</p>\n<h2>Menschen, Zwerge und Halblinge</h2>\n<p>Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit.</p>\n<h2>Oger und Burabar</h2>\n<p><a href=\"#/artikel/grumblejack\">Grumblejack</a> bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden.</p>\n<h2>Konstrukte und Tritonen</h2>\n<p><a href=\"#/artikel/verse\">Verse</a> ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. <a href=\"#/artikel/nerianus\">Nerianus</a> besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.</p>","sources":["ancestries","styke","vesper","cultures","verse"],"status":"Weltreferenz","tags":["Abstammungen"],"aliases":["Aasimar","Tiefling","Oger","Zwerg","Halbling","Bugbear","Burabar","Triton","Konstrukt"],"text":"Aasimar und Tiefling Styke ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. Vesper wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich. Menschen, Zwerge und Halblinge Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit. Oger und Burabar Grumblejack bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden. Konstrukte und Tritonen Verse ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. Nerianus besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.","links":["grumblejack","nerianus","styke","verse","vesper"],"backlinks":[],"search":"abstammungen im bekannten talingarde die im kampagnenumfeld wichtigen abstammungen und ihre grenzen abstammungen aasimar tiefling oger zwerg halbling bugbear burabar triton konstrukt aasimar und tiefling styke ist ein hellhautiger aasimar mit eisblauen augen und silbernen hofen vesper wirkt auf den ersten blick menschlich alabasterfarbene haut schwarzes haar mit blauem schimmer keine sichtbaren horner erst ihr langer greifschwanz verrat das asurablut deutlich menschen zwerge und halblinge menschen stellen die mehrheit im bekannten talingarde zwerge gehoren zur alten geschichte des landes und stellen in balentyne unter anderem das technische torhauspersonal halblinge leben in eigenen gemeinschaften und berufen barnabus eisenbauchs trinksitten sind eine personliche gewohnheit oger und burabar grumblejack bringt enorme reichweite kraft gewicht und hunger in jede reiseplanung die bugbears des nordens nennen sich haufig burabar sakkarot hat getrennte stamme durch waffen disziplin und das versprechen eines feldzugs zu einem heer verbunden konstrukte und tritonen verse ist ein erwachtes reliquiarwesen mit beschadigter erinnerung neuen eigenen gedanken und der fahigkeit vesper zu widersprechen nerianus besitzt tritonische wasseranpassung sein wissen stammt aus seiner personlichen erfahrung nicht aus seiner abstammung","initial":"A"},{"id":"golarion","category":"welt","title":"Golarion als Außenwelt","summary":"Die offene Umgebung Talingardes, nicht eine nachträgliche Verlegung der Inselgeschichte.","body":"<h2>Festgelegte Anpassung</h2>\n<p>Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt.</p>\n<h2>Erwähnte Zukunftswünsche</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit <a href=\"#/artikel/vesper\">Vesper</a>. Das ist belegt als <strong>Gespräch und Wunsch</strong>, nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.</p>\n","sources":["localrules","cultures","live"],"status":"Kampagnenkonversion","tags":["Außenwelt"],"aliases":["Absalom","Qadira"],"text":"Festgelegte Anpassung Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt. Erwähnte Zukunftswünsche Styke sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit Vesper . Das ist belegt als Gespräch und Wunsch , nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.","links":["styke","vesper"],"backlinks":["talingarde"],"search":"golarion als auenwelt die offene umgebung talingardes nicht eine nachtragliche verlegung der inselgeschichte auenwelt absalom qadira festgelegte anpassung die kampagne benutzt golarion fur den ursprunglich undefinierten auenraum talingardes eigene geschichte religion krone und institutionen bleiben erhalten exakte meereslage nachste kusten und politische beziehungen sind nicht pauschal gesetzt erwahnte zukunftswunsche styke sprach am 31 januar von einer lebensverlangernden blume in qadira und einer gotterprufung in absalom als moglichen horizonten einer gemeinsamen zukunft mit vesper das ist belegt als gesprach und wunsch nicht als ausgewahlte folgequest oder verifiziertes detail einer solchen reise","initial":"G"},{"id":"nessian-knot","category":"gruppen","title":"Der Nessianische Knoten","summary":"Der Nessische Knoten hat den Hornsporn erreicht; der verteilte Haushalt hält Farholde, Forschung, Handwerk und Logistik.","body":"<h2>Der Nessische Knoten</h2><p>Styke und Vesper führen gemeinsam; Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden. Hakon und seine fünf Männer arbeiten gegen Sold; Grumblejack bleibt freier Freund.</p><h2>Verteilte Operation</h2><p>Styke, Vesper und Valeria sind im Horn. Tacitus und Knittel arbeiten im Goldenen Reiher, Kaitlyn hält die Verbindung zum Siebten Knoten, Tamsin schützt die verstreuten Quartiere, Nella führt Versorgung und Pferde, Hakon sichert Folly und Fracht, Grumblejack bleibt mit Varlet außerhalb der Stadt.</p><h2>Auftrag und Kasse</h2><p>Der Knoten sucht im Horn Vetra-Kali und die Tears of Achlys. Die liquide Reserve beträgt <strong>2.027 gp 5 sp</strong>; 9.500 gp bereits bezahltes Crafting-Material liegen getrennt davon.</p>","sources":["live","chronicle","knot-pact","relations","transition","treasury"],"status":"Aktuell bis 24. Februar 4712 AR · später Vormittag","tags":["Asmodeus","Knoten","Gefolge","Farholde"],"aliases":["Nessian Knot","Nessianischer Knoten"],"text":"Der Nessische Knoten Styke und Vesper führen gemeinsam; Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden. Hakon und seine fünf Männer arbeiten gegen Sold; Grumblejack bleibt freier Freund. Verteilte Operation Styke, Vesper und Valeria sind im Horn. Tacitus und Knittel arbeiten im Goldenen Reiher, Kaitlyn hält die Verbindung zum Siebten Knoten, Tamsin schützt die verstreuten Quartiere, Nella führt Versorgung und Pferde, Hakon sichert Folly und Fracht, Grumblejack bleibt mit Varlet außerhalb der Stadt. Auftrag und Kasse Der Knoten sucht im Horn Vetra-Kali und die Tears of Achlys. Die liquide Reserve beträgt 2.027 gp 5 sp ; 9.500 gp bereits bezahltes Crafting-Material liegen getrennt davon.","links":[],"backlinks":[],"search":"der nessianische knoten der nessische knoten hat den hornsporn erreicht der verteilte haushalt halt farholde forschung handwerk und logistik asmodeus knoten gefolge farholde nessian knot nessianischer knoten der nessische knoten styke und vesper fuhren gemeinsam valeria ist eigenstandige kerngefahrtin und feldfuhrerin tamsin nella kaitlyn mirelle und tacitus sind uber den compact gebunden hakon und seine funf manner arbeiten gegen sold grumblejack bleibt freier freund verteilte operation styke vesper und valeria sind im horn tacitus und knittel arbeiten im goldenen reiher kaitlyn halt die verbindung zum siebten knoten tamsin schutzt die verstreuten quartiere nella fuhrt versorgung und pferde hakon sichert folly und fracht grumblejack bleibt mit varlet auerhalb der stadt auftrag und kasse der knoten sucht im horn vetra kali und die tears of achlys die liquide reserve betragt 2 027 gp 5 sp 9 500 gp bereits bezahltes crafting material liegen getrennt davon","initial":"D"},{"id":"feldgruppe","category":"gruppen","title":"Hakons Feldgruppe","summary":"Hakon und seine fünf Gefährten sind freie bezahlte Männer und sichern Halstyn’s Folly in Farholde.","body":"<h2>Zusammensetzung</h2><p>Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt ein freier Freund außerhalb dieses Soldverhältnisses.</p><h2>Vertrag</h2><p>Seit dem 18. Februar erhält jeder der sechs 1 gp pro Tag sowie gewöhnliche Nahrung und Unterkunft. Hakon besitzt die unmittelbare Führung über seine fünf Männer; eine feste Beutequote wurde nicht vereinbart.</p><h2>Farholde</h2><p>Am 21. Februar bleiben sie auf Halstyn’s Folly und sichern Fracht und Anlegestelle. Grumblejack wartet mit Varlet verborgen außerhalb Farholdes.</p>","sources":["factions","live","core","chronicle","transition"],"status":"Aktiver Vertrag · Farholde","tags":["Verbündete","Bezahlte Männer","Farholde"],"aliases":[],"text":"Zusammensetzung Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt ein freier Freund außerhalb dieses Soldverhältnisses. Vertrag Seit dem 18. Februar erhält jeder der sechs 1 gp pro Tag sowie gewöhnliche Nahrung und Unterkunft. Hakon besitzt die unmittelbare Führung über seine fünf Männer; eine feste Beutequote wurde nicht vereinbart. Farholde Am 21. Februar bleiben sie auf Halstyn’s Folly und sichern Fracht und Anlegestelle. Grumblejack wartet mit Varlet verborgen außerhalb Farholdes.","links":[],"backlinks":[],"search":"hakons feldgruppe hakon und seine funf gefahrten sind freie bezahlte manner und sichern halstyns folly in farholde verbundete bezahlte manner farholde zusammensetzung hakon fuhrt sten ketil eirik arved und torvald grumblejack bleibt ein freier freund auerhalb dieses soldverhaltnisses vertrag seit dem 18 februar erhalt jeder der sechs 1 gp pro tag sowie gewohnliche nahrung und unterkunft hakon besitzt die unmittelbare fuhrung uber seine funf manner eine feste beutequote wurde nicht vereinbart farholde am 21 februar bleiben sie auf halstyns folly und sichern fracht und anlegestelle grumblejack wartet mit varlet verborgen auerhalb farholdes","initial":"H"},{"id":"eisenbauch-crew","category":"gruppen","title":"Eisenbauchs Mannschaft","summary":"Barnabus und zehn Torhausarbeiter; am frühen 9. Februar im Schlaf getötet.","body":"<h2>Die elf Zwerge</h2><p>Barnabus Eisenbauch und zehn Arbeiter wohnten im Dalliance und warteten Balentynes Torhaus. Ihre technischen Informationen halfen bei der Sabotage.</p>\n<h2>Ende</h2><p>Styke und Hakon töteten alle elf am frühen 9. Februar im Schlaf. Die Körper, Werkzeuge, Rüstungen, Waffen und Barnabus’ persönlicher Besitz liegen weiterhin oben. Es wurde nichts geplündert oder verkauft.</p>","sources":["core","live","factions","chronicle"],"status":"Aufgelöst / alle elf tot","tags":["Zwerge","Handwerk"],"aliases":[],"text":"Die elf Zwerge Barnabus Eisenbauch und zehn Arbeiter wohnten im Dalliance und warteten Balentynes Torhaus. Ihre technischen Informationen halfen bei der Sabotage. Ende Styke und Hakon töteten alle elf am frühen 9. Februar im Schlaf. Die Körper, Werkzeuge, Rüstungen, Waffen und Barnabus’ persönlicher Besitz liegen weiterhin oben. Es wurde nichts geplündert oder verkauft.","links":[],"backlinks":[],"search":"eisenbauchs mannschaft barnabus und zehn torhausarbeiter am fruhen 9 februar im schlaf getotet zwerge handwerk die elf zwerge barnabus eisenbauch und zehn arbeiter wohnten im dalliance und warteten balentynes torhaus ihre technischen informationen halfen bei der sabotage ende styke und hakon toteten alle elf am fruhen 9 februar im schlaf die korper werkzeuge rustungen waffen und barnabus personlicher besitz liegen weiterhin oben es wurde nichts geplundert oder verkauft","initial":"E"},{"id":"white-ravens","category":"gruppen","title":"Die White Ravens","summary":"Elise Zadarias Siebter Knoten; seit dem 23. Februar als unabhängige Farholde-Unterstützung aktiv.","body":"<h2>Mitglieder</h2><p><a href=\"#/artikel/elise\">Elise Zadaria</a> führt Tallus „Trak“ Rackburn, Titus „Trik“ Rackburn und <a href=\"#/artikel/dostan\">Dostan Alfson</a>; <a href=\"#/artikel/frost\">Frost</a> ist ihr albino-weißer Rabenvertrauter.</p><h2>Farholde</h2><p>Die vier kamen am 23. Februar auf der Lucky Lady an und bezogen vorläufig vier Zimmer in der <a href=\"#/artikel/graue-moewe\">Grauen Möwe</a>. Ihre Aufgabe liegt zunächst in Beobachtung und Sicherung des Farholde-Rückens.</p><h2>Verhältnis zum Neunten Knoten</h2><p>Kaitlyn ist der vereinbarte Kontakt. Beide Knoten sollen zunächst unabhängig Informationen sammeln und sie nach der Rückkehr des Kerntrios vergleichen.</p><h2>Nach der Rückkehr</h2><p>Das Kerntrio ist wieder in Farholde. Die Übergabe des Hornorts und des neuen Lagebilds an Elise bleibt geplant; kein neuer Bericht belegt sie bereits. Kaitlyn soll danach mitziehen und die Verbindung durch regelmäßige Stadtbesuche halten.</p>","sources":["elise-current","chronicle","timeline"],"status":"Aktiv · Farholde · 24. Februar","tags":["Historisch","Elise"],"aliases":[],"text":"Mitglieder Elise Zadaria führt Tallus „Trak“ Rackburn, Titus „Trik“ Rackburn und Dostan Alfson ; Frost ist ihr albino-weißer Rabenvertrauter. Farholde Die vier kamen am 23. Februar auf der Lucky Lady an und bezogen vorläufig vier Zimmer in der Grauen Möwe . Ihre Aufgabe liegt zunächst in Beobachtung und Sicherung des Farholde-Rückens. Verhältnis zum Neunten Knoten Kaitlyn ist der vereinbarte Kontakt. Beide Knoten sollen zunächst unabhängig Informationen sammeln und sie nach der Rückkehr des Kerntrios vergleichen. Nach der Rückkehr Das Kerntrio ist wieder in Farholde. Die Übergabe des Hornorts und des neuen Lagebilds an Elise bleibt geplant; kein neuer Bericht belegt sie bereits. Kaitlyn soll danach mitziehen und die Verbindung durch regelmäßige Stadtbesuche halten.","links":["dostan","elise","frost","graue-moewe"],"backlinks":["frost","intim-elise","zeit-ausbildung"],"search":"die white ravens elise zadarias siebter knoten seit dem 23 februar als unabhangige farholde unterstutzung aktiv historisch elise mitglieder elise zadaria fuhrt tallus trak rackburn titus trik rackburn und dostan alfson frost ist ihr albino wei er rabenvertrauter farholde die vier kamen am 23 februar auf der lucky lady an und bezogen vorlaufig vier zimmer in der grauen mowe ihre aufgabe liegt zunachst in beobachtung und sicherung des farholde ruckens verhaltnis zum neunten knoten kaitlyn ist der vereinbarte kontakt beide knoten sollen zunachst unabhangig informationen sammeln und sie nach der ruckkehr des kerntrios vergleichen nach der ruckkehr das kerntrio ist wieder in farholde die ubergabe des hornorts und des neuen lagebilds an elise bleibt geplant kein neuer bericht belegt sie bereits kaitlyn soll danach mitziehen und die verbindung durch regelma ige stadtbesuche halten","initial":"D"},{"id":"alerion","category":"gruppen","title":"Die Ritter des Alerion","summary":"Mitranischer Ritterorden und Valerias frühere institutionelle Heimat.","body":"<h2>Öffentliches Bild</h2>\n<p>Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat.</p>\n<h2>Kampagnenbezug</h2>\n<p>Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei <a href=\"#/artikel/styke\">Styke</a>, nicht bei <a href=\"#/artikel/valeria\">Valeria</a>.</p>\n","sources":["common","valeria","valsheet"],"status":"Allgemeinwissen","tags":["Orden","Mitra"],"aliases":[],"text":"Öffentliches Bild Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat. Kampagnenbezug Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei Styke , nicht bei Valeria .","links":["styke","valeria"],"backlinks":[],"search":"die ritter des alerion mitranischer ritterorden und valerias fruhere institutionelle heimat orden mitra offentliches bild der orden soll recht verteidigen schwache schutzen und gerechtigkeit uben nicht nur adlige konnen aufgenommen werden nicht jeder ritter ist ein paladin auch wenn der orden viele hervorgebracht hat kampagnenbezug dame balina gehorte zu dieser ritterlichen welt ihre glaubenskrise hat die fruhere ausbildung und verantwortung nicht ausgeloscht das silberne saphir symbol des ordens befindet sich heute bei styke nicht bei valeria","initial":"D"},{"id":"merrie-men","category":"gruppen","title":"Ye Merrie Men","summary":"Reisende Theatertruppe mit einer angekündigten Festungsaufführung.","body":"<h2>Gelegenheit</h2>\n<p>William Marcus Marlowes Truppe soll <em>The Fall of Amberlyn</em> in Balentyne spielen. Bellams Bericht macht die Aufführung zu einer bekannten möglichen Gelegenheit für legitime Bewegung in die Festung.</p>\n<h2>Noch offen</h2>\n<p>Datum, Uhrzeit, Einlass, Besetzung und Ablauf wurden nicht sicher festgelegt. Ein Termin wird hier nicht aus dem gedruckten Abenteuer als bereits bekannt eingesetzt.</p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offene Gelegenheit"],"aliases":["The Fall of Amberlyn"],"text":"Gelegenheit William Marcus Marlowes Truppe soll The Fall of Amberlyn in Balentyne spielen. Bellams Bericht macht die Aufführung zu einer bekannten möglichen Gelegenheit für legitime Bewegung in die Festung. Noch offen Datum, Uhrzeit, Einlass, Besetzung und Ablauf wurden nicht sicher festgelegt. Ein Termin wird hier nicht aus dem gedruckten Abenteuer als bereits bekannt eingesetzt.","links":[],"backlinks":["marlowe","zeit-0127"],"search":"ye merrie men reisende theatertruppe mit einer angekundigten festungsauffuhrung theater offene gelegenheit the fall of amberlyn gelegenheit william marcus marlowes truppe soll the fall of amberlyn in balentyne spielen bellams bericht macht die auffuhrung zu einer bekannten moglichen gelegenheit fur legitime bewegung in die festung noch offen datum uhrzeit einlass besetzung und ablauf wurden nicht sicher festgelegt ein termin wird hier nicht aus dem gedruckten abenteuer als bereits bekannt eingesetzt","initial":"Y"},{"id":"avernian","category":"gruppen","title":"Der Avernische Erste Knoten","summary":"Sakkarots mit Thorn verbündeter nördlicher Machtblock.","body":"<h2>Bekannter Zusammenhang</h2>\n<p>Sakkarot führt das Bugbearheer im Norden und steht in der aktuellen Operation auf Thorns asmodeischer Seite. Die Waffenlieferung und Stykes Torversprechen verbinden diesen Knoten mit dem Nessianischen.</p>\n<h2>Nicht gleichbedeutend</h2>\n<p>Die Vereinigung der Stämme ist Sakkarots politische Leistung. Aus seiner Bindung wird kein Wissen jedes einzelnen Kriegers über alle Pläne Thorns abgeleitet.</p>\n","sources":["factions","core","cultures"],"status":"Bestätigt","tags":["Sakkarot","Heer"],"aliases":[],"text":"Bekannter Zusammenhang Sakkarot führt das Bugbearheer im Norden und steht in der aktuellen Operation auf Thorns asmodeischer Seite. Die Waffenlieferung und Stykes Torversprechen verbinden diesen Knoten mit dem Nessianischen. Nicht gleichbedeutend Die Vereinigung der Stämme ist Sakkarots politische Leistung. Aus seiner Bindung wird kein Wissen jedes einzelnen Kriegers über alle Pläne Thorns abgeleitet.","links":[],"backlinks":[],"search":"der avernische erste knoten sakkarots mit thorn verbundeter nordlicher machtblock sakkarot heer bekannter zusammenhang sakkarot fuhrt das bugbearheer im norden und steht in der aktuellen operation auf thorns asmodeischer seite die waffenlieferung und stykes torversprechen verbinden diesen knoten mit dem nessianischen nicht gleichbedeutend die vereinigung der stamme ist sakkarots politische leistung aus seiner bindung wird kein wissen jedes einzelnen kriegers uber alle plane thorns abgeleitet","initial":"D"},{"id":"styke-schwert","category":"gegenstaende","title":"Stykes Großschwert +1","summary":"Hauptwaffe, Handwerksbezug und ein kleines Bindeglied zu Barnabus.","body":"<h2>Mechanik</h2>\n<p>Mit <a href=\"#/artikel/the-caged-sun\">The Caged Sun</a>: +10 Angriff, 2d6+7 Schaden, 19-20/x2. Mit standardmäßigem Power Attack: +8, 2d6+13. Temporäre Boni aus Aid, Zeal und Manövern kommen gesondert dazu. Deadly Agility nutzt hier die vereinbarte zweihändige DEX-Schadensregel.</p>\n<h2>Geschichte und aktueller Ort</h2>\n<p>Barnabus respektierte seine Verarbeitung. <a href=\"#/artikel/styke\">Styke</a> hat das Schwert am Morgen des 1. Februar ausdrücklich angelegt. Es ist weder ein gewöhnliches Großschwert noch die Meisterarbeit Valerias.</p>\n","sources":["ssheet","srules","core","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Mechanik Mit The Caged Sun : +10 Angriff, 2d6+7 Schaden, 19-20/x2. Mit standardmäßigem Power Attack: +8, 2d6+13. Temporäre Boni aus Aid, Zeal und Manövern kommen gesondert dazu. Deadly Agility nutzt hier die vereinbarte zweihändige DEX-Schadensregel. Geschichte und aktueller Ort Barnabus respektierte seine Verarbeitung. Styke hat das Schwert am Morgen des 1. Februar ausdrücklich angelegt. Es ist weder ein gewöhnliches Großschwert noch die Meisterarbeit Valerias.","links":["styke","the-caged-sun"],"backlinks":[],"search":"stykes groschwert 1 hauptwaffe handwerksbezug und ein kleines bindeglied zu barnabus styke mechanik mit the caged sun 10 angriff 2d6 7 schaden 19 20 x2 mit standardmaigem power attack 8 2d6 13 temporare boni aus aid zeal und manovern kommen gesondert dazu deadly agility nutzt hier die vereinbarte zweihandige dex schadensregel geschichte und aktueller ort barnabus respektierte seine verarbeitung styke hat das schwert am morgen des 1 februar ausdrucklich angelegt es ist weder ein gewohnliches groschwert noch die meisterarbeit valerias","initial":"S"},{"id":"valeria-schwert","category":"gegenstaende","title":"Valerias Großschwert +1","summary":"Valerias +1-Großschwert; ihre unveränderte Hauptwaffe nach der Hornrückkehr.","body":"<h2>Status</h2><p>Das frühere Meisterarbeits-Großschwert wurde vor dem Hornvorstoß extern auf +1 aufgewertet und wird von Valeria geführt.</p><h2>Stufe 7</h2><p>Normal +12/+7 bei 2d6+7; mit Power Attack +10/+5 bei 2d6+13, jeweils vor Smite, Challenge und vorübergehenden Eigenschaften.</p>","sources":["valsheet"],"status":"Getragen","tags":["Waffe","Valeria","Magisch","Stufe 7"],"aliases":[],"text":"Status Das frühere Meisterarbeits-Großschwert wurde vor dem Hornvorstoß extern auf +1 aufgewertet und wird von Valeria geführt. Stufe 7 Normal +12/+7 bei 2d6+7; mit Power Attack +10/+5 bei 2d6+13, jeweils vor Smite, Challenge und vorübergehenden Eigenschaften.","links":[],"backlinks":[],"search":"valerias gro schwert 1 valerias 1 gro schwert ihre unveranderte hauptwaffe nach der hornruckkehr waffe valeria magisch stufe 7 status das fruhere meisterarbeits gro schwert wurde vor dem hornvorsto extern auf 1 aufgewertet und wird von valeria gefuhrt stufe 7 normal 12 7 bei 2d6 7 mit power attack 10 5 bei 2d6 13 jeweils vor smite challenge und vorubergehenden eigenschaften","initial":"V"},{"id":"mithral-ausruestung","category":"gegenstaende","title":"Mithralkettenhemden und Mithralschild","summary":"Das aktuelle Schutzpaket von Styke und Vesper.","body":"<h2>Styke</h2>\n<p>Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +4, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt.</p>\n<h2>Vesper</h2>\n<p>Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 20, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt.</p>\n","sources":["ssheet","vsheet","live"],"status":"Im Besitz","tags":["Styke / Vesper"],"aliases":[],"text":"Styke Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +4, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt. Vesper Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 20, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt.","links":[],"backlinks":[],"search":"mithralkettenhemden und mithralschild das aktuelle schutzpaket von styke und vesper styke vesper styke magefertigtes mithralkettenhemd rustungsbonus 4 maximale dex 6 acp 0 am aktuellen morgen angelegt vesper magefertigtes mithralkettenhemd und mithral heavy shield ihr dokumentierter ausgerusteter ac wert ist 20 mit sidestep secret ausgerustete regelwerte sind nicht die behauptung dass sie jede arbeitshandlung mit erhobenem schild ausfuhrt","initial":"M"},{"id":"valeria-platte","category":"gegenstaende","title":"Valerias schwarze Dastard-Vollplatte","summary":"Valerias schwarze +1-Dastard-Vollplatte; die scheuernde Achselschnalle wurde am 25. Februar versetzt.","body":"<h2>Die schwarze Rüstung</h2><p>Havelyns +1-Champion-Vollplatte verwandelte sich unter Valerias Hand in eine schwarze infernale <strong>+1 Dastard Full Plate</strong>. Valeria entschied selbst, sie anzulegen.</p>\n<h2>Aktueller Wert</h2><p>Mit der Platte hat Valeria AC 21, Touch 11 und Flat-Footed 20. Gegen dasselbe Ziel, das sie mit Smite Good oder Challenge markiert hat, liefert die Dastard-Eigenschaft zusätzlich +2 profanen AC-Bonus. Mirelles fertige Rüstungsunterkleidung liegt darunter.</p><h2>Sitzkorrektur</h2><p>Styke versetzte die linke Achselschnalle und behandelte die Stelle mit Arnika. Der spätere Sitztest bestätigte, dass sie nicht mehr rieb. Es wurde kein neuer Rüstungsbonus hergestellt.</p>","sources":["valsheet","live"],"status":"An Bord von Halstyn’s Folly","tags":["Valeria"],"aliases":[],"text":"Die schwarze Rüstung Havelyns +1-Champion-Vollplatte verwandelte sich unter Valerias Hand in eine schwarze infernale +1 Dastard Full Plate . Valeria entschied selbst, sie anzulegen. Aktueller Wert Mit der Platte hat Valeria AC 21, Touch 11 und Flat-Footed 20. Gegen dasselbe Ziel, das sie mit Smite Good oder Challenge markiert hat, liefert die Dastard-Eigenschaft zusätzlich +2 profanen AC-Bonus. Mirelles fertige Rüstungsunterkleidung liegt darunter. Sitzkorrektur Styke versetzte die linke Achselschnalle und behandelte die Stelle mit Arnika. Der spätere Sitztest bestätigte, dass sie nicht mehr rieb. Es wurde kein neuer Rüstungsbonus hergestellt.","links":[],"backlinks":[],"search":"valerias schwarze dastard vollplatte valerias schwarze 1 dastard vollplatte die scheuernde achselschnalle wurde am 25 februar versetzt valeria die schwarze rustung havelyns 1 champion vollplatte verwandelte sich unter valerias hand in eine schwarze infernale 1 dastard full plate valeria entschied selbst sie anzulegen aktueller wert mit der platte hat valeria ac 21 touch 11 und flat footed 20 gegen dasselbe ziel das sie mit smite good oder challenge markiert hat liefert die dastard eigenschaft zusatzlich 2 profanen ac bonus mirelles fertige rustungsunterkleidung liegt darunter sitzkorrektur styke versetzte die linke achselschnalle und behandelte die stelle mit arnika der spatere sitztest bestatigte dass sie nicht mehr rieb es wurde kein neuer rustungsbonus hergestellt","initial":"V"},{"id":"cloaks","category":"gegenstaende","title":"Cloaks of Resistance +1","summary":"Die +1-Widerstandsumhänge sind vorhandene Ausrüstung; Stykes Exemplar liegt zur Aufwertung bei Tacitus.","body":"<h2>Träger</h2><p>Vesper und Valeria haben ihre +1-Umhänge. Styke gab seinen am Abend des 25. Februar bei Tacitus ab. Solange er nicht zurückgegeben und angelegt ist, fehlt ihm dessen +1 auf alle Rettungswürfe; auch ein fertiger +2-Umhang ist noch nicht belegt.</p><h2>Kein Doppelbonus</h2>\n<p>Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.</p>\n","sources":["ssheet","vsheet","valsheet"],"status":"Stykes Umhang abgegeben · Aufwertung nicht bestätigt","tags":["Kerntrio"],"aliases":[],"text":"Träger Vesper und Valeria haben ihre +1-Umhänge. Styke gab seinen am Abend des 25. Februar bei Tacitus ab. Solange er nicht zurückgegeben und angelegt ist, fehlt ihm dessen +1 auf alle Rettungswürfe; auch ein fertiger +2-Umhang ist noch nicht belegt. Kein Doppelbonus Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.","links":[],"backlinks":[],"search":"cloaks of resistance 1 die 1 widerstandsumhange sind vorhandene ausrustung stykes exemplar liegt zur aufwertung bei tacitus kerntrio trager vesper und valeria haben ihre 1 umhange styke gab seinen am abend des 25 februar bei tacitus ab solange er nicht zuruckgegeben und angelegt ist fehlt ihm dessen 1 auf alle rettungswurfe auch ein fertiger 2 umhang ist noch nicht belegt kein doppelbonus ein zweites addieren auf die tabellenwerte wurde denselben gegenstand doppelt anrechnen ob ein kleidungsstuck in einer konkreten szene angelegt ist bleibt eine frage des tatsachlichen zustands","initial":"C"},{"id":"stirnreif","category":"gegenstaende","title":"Thorns eiserne Stirnreife","summary":"Thorns eiserne Stirnreife bleiben Tarnhilfen; ihre konkrete Aktivierung folgt der jeweiligen Szene.","body":"<h2>Funktion</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung.</p>\n<h2>Bisheriger Gebrauch</h2>\n<p>Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.</p><h2>Balentyne-Einsatz</h2><p>Styke aktivierte vor dem Balentyne-Einbruch eine Ritterverkleidung und bewegte sich damit durch die Festung. Dieser historische Einsatz beweist keine dauerhaft unverändert aktive Tarnung am heutigen Farholde-Rand.</p>","sources":["live","ssheet","vsheet"],"status":"Styke: Rittertarnung aktiv","tags":["Styke / Vesper"],"aliases":["Circlet","Iron Circlet"],"text":"Funktion Styke und Vesper besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung. Bisheriger Gebrauch Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens. Balentyne-Einsatz Styke aktivierte vor dem Balentyne-Einbruch eine Ritterverkleidung und bewegte sich damit durch die Festung. Dieser historische Einsatz beweist keine dauerhaft unverändert aktive Tarnung am heutigen Farholde-Rand.","links":["styke","vesper"],"backlinks":[],"search":"thorns eiserne stirnreife thorns eiserne stirnreife bleiben tarnhilfen ihre konkrete aktivierung folgt der jeweiligen szene styke vesper circlet iron circlet funktion styke und vesper besitzen thorns eiserne stirnreife sie verandern das au ere erscheinungsbild und erganzen die verschleierung des martialischen eindrucks ihrer ausrustung bisheriger gebrauch styke nutzte die stirnreife bei seinen einkaufen am 31 januar fur wechselnde erscheinungen seither gehort sie weiter zur verfugbaren tarn und infiltrationsausrustung des nessischen knotens balentyne einsatz styke aktivierte vor dem balentyne einbruch eine ritterverkleidung und bewegte sich damit durch die festung dieser historische einsatz beweist keine dauerhaft unverandert aktive tarnung am heutigen farholde rand","initial":"T"},{"id":"alerion-symbol","category":"gegenstaende","title":"Silber-Saphir-Symbol des Alerion","summary":"Valerias früheres Ordenssymbol befindet sich bei Styke.","body":"<h2>Eigentums- und Beziehungsbezug</h2>\n<p>Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei <a href=\"#/artikel/styke\">Styke</a> und nicht in Valerias Ausrüstung.</p>\n<h2>Keine erfundene Funktion</h2>\n<p>Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.</p>\n","sources":["valsheet","ssheet","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Eigentums- und Beziehungsbezug Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei Styke und nicht in Valerias Ausrüstung. Keine erfundene Funktion Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.","links":["styke"],"backlinks":[],"search":"silber saphir symbol des alerion valerias fruheres ordenssymbol befindet sich bei styke styke eigentums und beziehungsbezug das silberne symbol mit saphir gehort zur geschichte der ritterin balina aktuell befindet es sich bei styke und nicht in valerias ausrustung keine erfundene funktion eine zusatzliche magische wirkung oder ein inzwischen vollzogener ruckgabeakt ist nicht etabliert der gegenstand bleibt zugleich erinnerungsstuck und materieller kontinuitatspunkt","initial":"S"},{"id":"nessian-siegel","category":"gegenstaende","title":"Nessianisches Kontaktsiegel","summary":"Verbrauchtes Kontaktsiegel; Tiadora erschien nach Balentynes Fall persönlich im Dalliance.","body":"<h2>Thorns Tonsiegel</h2><p>Styke brach das Siegel, als Balentynes Ergebnis militärisch bereits unumkehrbar schien. Nach dem endgültigen Fall erschien Tiadora im Dalliance.</p><h2>Antwort</h2><p>Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.</p>","sources":["core","factions","live"],"status":"Verbraucht / beantwortet","tags":["Gruppe"],"aliases":[],"text":"Thorns Tonsiegel Styke brach das Siegel, als Balentynes Ergebnis militärisch bereits unumkehrbar schien. Nach dem endgültigen Fall erschien Tiadora im Dalliance. Antwort Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.","links":[],"backlinks":[],"search":"nessianisches kontaktsiegel verbrauchtes kontaktsiegel tiadora erschien nach balentynes fall personlich im dalliance gruppe thorns tonsiegel styke brach das siegel als balentynes ergebnis militarisch bereits unumkehrbar schien nach dem endgultigen fall erschien tiadora im dalliance antwort sie uberbrachte thorns 5 000 gp erfolgszahlung und den befehl sofort zur halstyns folly aufzubrechen das siegel selbst ist verbraucht","initial":"N"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"<h2>Herkunft</h2>\n<p>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt <a href=\"#/artikel/styke\">Styke</a>.</p>\n<h2>Wissensgrenze</h2>\n<p>Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.</p>\n","sources":["chronicle","live"],"status":"Nicht identifiziert","tags":["Styke"],"aliases":[],"text":"Herkunft Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt Styke . Wissensgrenze Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.","links":["styke"],"backlinks":["varning","zeit-0126"],"search":"varnings kleiner schlussel von styke behalten passendes schloss bisher nicht identifiziert styke herkunft beute aus der operation an freeman s rock die auffallige groere ausrustung wurde auerhalb aldencross versteckt den kleinen schlussel behielt styke wissensgrenze zu welchem schloss er gehort ist offen ein abenteuerplan oder gegnerisches inventar liefert dafur keinen automatisch freigeschalteten nutzen","initial":"V"},{"id":"beute-cache","category":"gegenstaende","title":"Versteckte Patrouillenausrüstung","summary":"Varnings Schild, Platte, Lanze und Bogen wurden aus dem Dalliance geborgen und reisen als Knoteneigentum auf der Folly.","body":"<h2>Dokumentierte Stücke</h2><p>+1-Schwerer Stahlschild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen stammen aus Varnings Patrouille.</p><h2>Aktueller Ort</h2><p>Valeria holte den Cache vor dem Angriff zurück. Beim organisierten Aufbruch wurde die tragbare Ausrüstung mit der übrigen Beute auf Halstyn’s Folly verladen.</p>","sources":["chronicle","live"],"status":"An Bord","tags":["Gruppe"],"aliases":[],"text":"Dokumentierte Stücke +1-Schwerer Stahlschild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen stammen aus Varnings Patrouille. Aktueller Ort Valeria holte den Cache vor dem Angriff zurück. Beim organisierten Aufbruch wurde die tragbare Ausrüstung mit der übrigen Beute auf Halstyn’s Folly verladen.","links":[],"backlinks":["zeit-0126"],"search":"versteckte patrouillenausrustung varnings schild platte lanze und bogen wurden aus dem dalliance geborgen und reisen als knoteneigentum auf der folly gruppe dokumentierte stucke 1 schwerer stahlschild meisterarbeits vollplatte meisterarbeits lanze und meisterarbeits kompositkurzbogen stammen aus varnings patrouille aktueller ort valeria holte den cache vor dem angriff zuruck beim organisierten aufbruch wurde die tragbare ausrustung mit der ubrigen beute auf halstyns folly verladen","initial":"V"},{"id":"ketten-beschlaege","category":"gegenstaende","title":"Ketten, Ringe, Nägel und Keile","summary":"Tacitus und Jacobian sind getrennt an den beiden vorbereiteten Wandketten im Tunnel gesichert.","body":"<h2>Installation</h2><p>Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang.</p>\n<p>Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten.</p>\n<h2>Grenze</h2><p>Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt.</p><h2>Aktuelle Verwendung</h2><p>Tacitus und Jacobian wurden nach dem Dinner an die beiden getrennten Wandketten gebracht. Beide sind gefesselt, geknebelt und ihrer erreichbaren Zauberwerkzeuge beraubt. Die Ketten ersetzen weiterhin keinen Wächter; bis zum aktuellen Rand entkam keiner von beiden.</p>","sources":["dalliance","live","chronicle"],"status":"Belegt / zwei Gefangene","tags":["Ketten","Tunnel","Vorbereitung"],"aliases":["Ketten","Beschläge"],"text":"Installation Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang. Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten. Grenze Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt. Aktuelle Verwendung Tacitus und Jacobian wurden nach dem Dinner an die beiden getrennten Wandketten gebracht. Beide sind gefesselt, geknebelt und ihrer erreichbaren Zauberwerkzeuge beraubt. Die Ketten ersetzen weiterhin keinen Wächter; bis zum aktuellen Rand entkam keiner von beiden.","links":[],"backlinks":["intim-requisiten","zeit-0131-tag"],"search":"ketten ringe nagel und keile tacitus und jacobian sind getrennt an den beiden vorbereiteten wandketten im tunnel gesichert ketten tunnel vorbereitung ketten beschlage installation styke vesper und valeria trugen die ketten und beschlage in den tunnel und wahlten eine verbreiterte alte reparaturstelle mehrere biegungen hinter dem kellerzugang zwei getrennte wandketten liegen eng am mauerwerk valeria zog aus mehreren winkeln an beiden ankern sie hielten grenze die stelle dient der korperlichen fixierung eines gewohnlichen menschen komponenten sprache zauberfahigkeiten und magische flucht mussen gesondert beherrscht werden die genaue zahl ubriger nagel und keile ist unbekannt aktuelle verwendung tacitus und jacobian wurden nach dem dinner an die beiden getrennten wandketten gebracht beide sind gefesselt geknebelt und ihrer erreichbaren zauberwerkzeuge beraubt die ketten ersetzen weiterhin keinen wachter bis zum aktuellen rand entkam keiner von beiden","initial":"K"},{"id":"tinkturen","category":"gegenstaende","title":"Die drei gekauften Präparate","summary":"Die drei Präparate vom 31. Januar; die sechs Rattengiftpakete vom 2. Februar werden getrennt geführt.","body":"<h2>Bestätigter Kauf</h2><p>Styke kaufte am 31. Januar eine menschliche Schlaf-/Beruhigungstinktur, ein Abführmittel und ein Tierberuhigungsmittel. Die menschliche Tinktur ist keine verlässliche sofortige Ausschaltung.</p>\n<h2>Verbrauch</h2><p>Vesper gab Tacitus einen Teil des Abführmittels. Die genaue Restmenge ist unbekannt. Das wachsversiegelte Tiermittel mit rotem Faden wurde nicht verwendet.</p>\n<h2>Getrennter Bestand</h2><p>Die sechs am 2. Februar gekauften <a href=\"#/artikel/rattenpoison\">Rattengiftpäckchen</a> sind ein eigener Posten und liegen unbenutzt im Wassermühlen-Versteck.</p>","sources":["live","chronicle"],"status":"Teilweise verbraucht","tags":["Tinkturen","Tacitus","Inventar"],"aliases":["Abführmittel","Schlaftinktur","Pferdemittel","Rattengift"],"text":"Bestätigter Kauf Styke kaufte am 31. Januar eine menschliche Schlaf-/Beruhigungstinktur, ein Abführmittel und ein Tierberuhigungsmittel. Die menschliche Tinktur ist keine verlässliche sofortige Ausschaltung. Verbrauch Vesper gab Tacitus einen Teil des Abführmittels. Die genaue Restmenge ist unbekannt. Das wachsversiegelte Tiermittel mit rotem Faden wurde nicht verwendet. Getrennter Bestand Die sechs am 2. Februar gekauften Rattengiftpäckchen sind ein eigener Posten und liegen unbenutzt im Wassermühlen-Versteck.","links":["rattenpoison"],"backlinks":["zeit-0131-tag"],"search":"die drei gekauften praparate die drei praparate vom 31 januar die sechs rattengiftpakete vom 2 februar werden getrennt gefuhrt tinkturen tacitus inventar abfuhrmittel schlaftinktur pferdemittel rattengift bestatigter kauf styke kaufte am 31 januar eine menschliche schlaf beruhigungstinktur ein abfuhrmittel und ein tierberuhigungsmittel die menschliche tinktur ist keine verlassliche sofortige ausschaltung verbrauch vesper gab tacitus einen teil des abfuhrmittels die genaue restmenge ist unbekannt das wachsversiegelte tiermittel mit rotem faden wurde nicht verwendet getrennter bestand die sechs am 2 februar gekauften rattengiftpackchen sind ein eigener posten und liegen unbenutzt im wassermuhlen versteck","initial":"D"},{"id":"graue-briefe","category":"gegenstaende","title":"Die Briefe mit dem grauen Band","summary":"Gelesene Belege für die Verbindung zwischen Kaitlyn und Zack; nicht gestohlen.","body":"<h2>Fund und Informationsweg</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sah das Bündel am 28. Januar in Kaitlyns Truhe. Am 29. Januar las <a href=\"#/artikel/vesper\">Vesper</a> die Briefe, stellte alles wieder her und berichtete Styke. Dadurch ist die Affäre Kaitlyn/Zack als Spielerwissen belegt.</p>\n<h2>Besitz und Grenzen</h2>  Thorn ist in diesem Dokument kein direkter Vorgesetzter. <a href=\"#/artikel/timeon\">Timeon</a> ist kein Vertragspartner.</p>\n<h2>Der Streit um Timeon</h2>\n<p>Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen.</p>\n<h2>Mechanik</h2>\n<p>Valerias aktueller Stand bleibt <strong>Fighter 5</strong>. Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.</p>","sources":["valeria","relations","live","house"],"status":"Bestätigt","tags":["Vertrag","Valeria"],"aliases":[],"text":"Inhalt Valeria nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. Timeon ist kein Vertragspartner. Der Streit um Timeon Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen. Mechanik Valerias aktueller Stand bleibt Fighter 5 . Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.","links":["styke","timeon","valeria","vesper"],"backlinks":["timeon","zeit-ausbildung"],"search":"valerias privatpakt asmodeus zuerst styke und vesper als sterbliche autoritaten timeon ist kein vertragspartner vertrag valeria inhalt valeria nahm nach der ausbildung einen privaten pakt an asmodeus steht darin an erster stelle styke und vesper sind die sterblichen autoritaten thorn ist in diesem dokument kein direkter vorgesetzter timeon ist kein vertragspartner der streit um timeon am 31 januar befolgte valeria stykes befehl nicht zu timeon zuruckzukehren sie bestritt zugleich dass dieser befehl festlegen konne was ihr noch wichtig ist oder welche pflichten balinas in ihr fortbestehen mechanik valerias aktueller stand bleibt fighter 5 der pakt enthalt keinen bereits vollzogenen klassenwechsel","initial":"V"},{"id":"bekannt-unbekannt","category":"fakten","title":"Was wir wissen. Was nicht.","summary":"Spielerwissen vor Morgengrauen am 27. Februar: Vorbereitungen und Absprachen sind bekannt; Offscreen-Ergebnisse bleiben bis zu einem Bericht ausgespart.","body":"<h2>Sicher bekannt</h2><p>Das Ritual ist unbegonnen. Hatred und Vigilance sind geborgen, Withering fehlt. Der erste Umzug soll bei Sonnenaufgang südlich von Westell beginnen. Elise, Hakon und Grumblejack kennen ihren jeweiligen Teil. Stykes +2-Umhang ist fertig; Tacitus ist im Collective und hat zwei Forschungsfragen angenommen.</p><h2>Noch offen</h2><p>Withering, der kopflose Versteinerte, Artephius, Carnitherias ausführbare Prozedur und die Fernkommunikation. Nellas tatsächliche Einkäufe, Kaitlyns Vandermir-Ergebnis, die spätere Rekrutierung und der aktuelle Wächter-Heilstand wurden Styke vor dem Schlaf nicht berichtet.</p><h2>Wissen braucht einen Träger</h2><p>Elise kennt Hornfund, 222 Tage und Treffpunkt, aber noch nicht den Weg. Valeria hat keinen bestätigten Träger für den genauen Tears-Gegenauftrag. Knittel gehört nicht zum geheimen Forschungskreis. Zorn liest keine Gedanken, sondern erhält nur bewusst gesendete Eindrücke.</p>","sources":["live","transition","farholde"],"status":"Aktuell · 27. Februar vor Morgengrauen","tags":["Wissensstand","Farholde","Offen"],"aliases":[],"text":"Sicher bekannt Das Ritual ist unbegonnen. Hatred und Vigilance sind geborgen, Withering fehlt. Der erste Umzug soll bei Sonnenaufgang südlich von Westell beginnen. Elise, Hakon und Grumblejack kennen ihren jeweiligen Teil. Stykes +2-Umhang ist fertig; Tacitus ist im Collective und hat zwei Forschungsfragen angenommen. Noch offen Withering, der kopflose Versteinerte, Artephius, Carnitherias ausführbare Prozedur und die Fernkommunikation. Nellas tatsächliche Einkäufe, Kaitlyns Vandermir-Ergebnis, die spätere Rekrutierung und der aktuelle Wächter-Heilstand wurden Styke vor dem griffsnacht nicht mehr durchgefuhrt beim einbruch fand das kerntrio donnagin in seinem bereich und totete ihn im kampf der offene ermittlungspunkt ist damit beendet","initial":"D"},{"id":"zack-plan","category":"vorhaben","title":"Zacks Dienstpläne und Identifizierung","summary":"Die Suche nach Zacks Routine wurde vom Duell überholt; Franz tötete ihn am 7. Februar.","body":"<h2>Ergebnis des Arbeiterwegs</h2><p>Vesper gelangte am 1. Februar erneut in Balentyne. Zählung und Begleitung waren strenger als zuvor. Ihre Deckung hielt, doch sie bekam weder einen Dienstplan noch eine sichere Identifizierung Zacks.</p>\n<h2>Weiter offen</h2><p>Sein Verhältnis mit Kaitlyn ist durch die Briefe belegt. Aufenthaltsplan, verwertbare Routine und eine kontrollierte Konfrontation mit Franz sind weiterhin nicht vorbereitet.</p>","sources":["live","chronicle","timeline"],"status":"Durch Duell beendet","tags":["Zack","Kaitlyn","Balentyne"],"aliases":[],"text":"Ergebnis des Arbeiterwegs Vesper gelangte am 1. Februar erneut in Balentyne. Zählung und Begleitung waren strenger als zuvor. Ihre Deckung hielt, doch sie bekam weder einen Dienstplan noch eine sichere Identifizierung Zacks. Weiter offen Sein Verhältnis mit Kaitlyn ist durch die Briefe belegt. Aufenthaltsplan, verwertbare Routine und eine kontrollierte Konfrontation mit Franz sind weiterhin nicht vorbereitet.","links":[],"backlinks":[],"search":"zacks dienstplane und identifizierung die suche nach zacks routine wurde vom duell uberholt franz totete ihn am 7 februar zack kaitlyn balentyne ergebnis des arbeiterwegs vesper gelangte am 1 februar erneut in balentyne zahlung und begleitung waren strenger als zuvor ihre deckung hielt doch sie bekam weder einen dienstplan noch eine sichere identifizierung zacks weiter offen sein verhaltnis mit kaitlyn ist durch die briefe belegt aufenthaltsplan verwertbare routine und eine kontrollierte konfrontation mit franz sind weiterhin nicht vorbereitet","initial":"Z"},{"id":"zwergen-plan","category":"vorhaben","title":"Zwergenroutinen und Torhaus","summary":"Torhaus sabotiert; Barnabus und seine zehn Arbeiter später im Dalliance getötet.","body":"<h2>Torhaus</h2><p>Barnabus’ Wissen über Winden, Dauerwachen und Heißsandabwehr half bei der Vorbereitung. Das Kerntrio zerstörte Ballisten, Steinschütten und Heißsand, öffnete Fallgatter und Zugbrücke und ruinierte die Bedienwerke.</p>\n<h2>Dalliance</h2><p>Barnabus und seine zehn Leute blieben währenddessen unwissende Gäste. Am frühen Morgen töteten Styke und Hakon alle elf im Schlaf. Leichen und Besitz blieben unberührt in den Zimmern.</p>","sources":["live","core"],"status":"Abgeschlossen","tags":["Torhaus","Zwerge"],"aliases":[],"text":"Torhaus Barnabus’ Wissen über Winden, Dauerwachen und Heißsandabwehr half bei der Vorbereitung. Das Kerntrio zerstörte Ballisten, Steinschütten und Heißsand, öffnete Fallgatter und Zugbrücke und ruinierte die Bedienwerke. Dalliance Barnabus und seine zehn Leute blieben währenddessen unwissende Gäste. Am frühen Morgen töteten Styke und Hakon alle elf im Schlaf. Leichen und Besitz blieben unberührt in den Zimmern.","links":[],"backlinks":[],"search":"zwergenroutinen und torhaus torhaus sabotiert barnabus und seine zehn arbeiter spater im dalliance getotet torhaus zwerge torhaus barnabus wissen uber winden dauerwachen und heisandabwehr half bei der vorbereitung das kerntrio zerstorte ballisten steinschutten und heisand offnete fallgatter und zugbrucke und ruinierte die bedienwerke dalliance barnabus und seine zehn leute blieben wahrenddessen unwissende gaste am fruhen morgen toteten styke und hakon alle elf im schlaf leichen und besitz blieben unberuhrt in den zimmern","initial":"Z"},{"id":"angriffsplan","category":"vorhaben","title":"Balentyne: der bedingte Angriffsplan","summary":"Balentyne ist gefallen; Torhaus, Signal und Fire-Axes Sturm führten den ersten Auftrag zum Abschluss.","body":"<h2>Ausgeführter Plan</h2><p>Das Trio drang nach Mitternacht durch den Geheimgang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab.</p>\n<h2>Ergebnis</h2><p>Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt, auch wenn seine Antwort noch aussteht.</p>","sources":["live","chronicle","timeline","clocks-current"],"status":"Abgeschlossen","tags":["8./9. Februar","Hakon","Tunnel","Balentyne","Befehlskette"],"aliases":[],"text":"Ausgeführter Plan Das Trio drang nach Mitternacht durch den Geheimgang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab. Ergebnis Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt, auch wenn seine Antwort noch aussteht.","links":[],"backlinks":[],"search":"balentyne der bedingte angriffsplan balentyne ist gefallen torhaus signal und fire axes sturm fuhrten den ersten auftrag zum abschluss 8 9 februar hakon tunnel balentyne befehlskette ausgefuhrter plan das trio drang nach mitternacht durch den geheimgang ein totete donnagin und havelyn brach die torhausabwehr offnete fallgatter und zugbrucke und zog sich mit dem schatz zuruck danach schossen styke vesper und valeria gemeinsam das rote signal ab ergebnis fire axes heer nutzte das offene tor beim zweiten besuch war die auere verteidigung gebrochen am fruhen morgen erlosch die organisierte gegenwehr balentyne ist gefallen thorns erster auftrag ist erfullt auch wenn seine antwort noch aussteht","initial":"B"},{"id":"offene-spuren","category":"vorhaben","title":"Weitere offene Spuren","summary":"Westell-Aufbruch, Withering, Versteinerter, Artephius, Carnitheria-Rekonstruktion und Tacitus’ neue Forschungsfragen.","body":"<h2>Bei Sonnenaufgang</h2><p>Den Zug südlich von Westell versammeln, echte Berichte einholen und den Weg zum Horn antreten. Elise will den Weg kennenlernen; Hakon und seine fünf Männer sowie Grumblejack mit Varlet sollen dort zusammenkommen.</p><h2>Im Horn</h2><p>Withering finden, den kopflosen Versteinerten und Artephius untersuchen, Vigilance weiter testen. Carnitheria Rex verlangt noch einen vollen Rekonstruktionstag; ein Kaufauftrag allein ruft nichts.</p><h2>Forschung</h2><p>Tacitus prüft quellengetrennt die Tears-Gegenfrage, Stykes psionische Selbstbeobachtung und später die Compact-Grenzen. Es gibt noch keinen Forschungstag, Durchbruch oder fertigen Lösungsweg.</p><h2>Später</h2><p>Botenfedern und dauerhafte Fernkommunikation prüfen; Grumblejacks Rüstung und gemeinsame Jagd; Mirelles endgültiges Geschirr; Tresortransport und weitere Werkstattreihe.</p>","sources":["live","treasury","transition"],"status":"Aktuell · 27. Februar","tags":["Pläne","22. Februar","23. Februar","Farholde"],"aliases":[],"text":"Bei Sonnenaufgang Den Zug südlich von Westell versammeln, echte Berichte einholen und den Weg zum Horn antreten. Elise will den Weg kennenlernen; Hakon und seine fünf Männer sowie Grumblejack mit Varlet sollen dort zusammenkommen. Im Horn Withering finden, den kopflosen Versteinerten und Artephius untersuchen, Vigilance weiter testen. Carnitheria Rex verlangt noch einen vollen Rekonstruktionstag; ein Kaufauftrag allein ruft nichts. Forschung Tacitus prüft quellengetrennt die Tears-Gegenfrage, Stykes psionische Selbstbeobachtung und später die Compact-Grenzen. Es gibt noch keinen Forschungstag, Durchbruch oder fertigen Lösungsweg. Später Botenfedern und dauerhafte Fernkommunikation prüfen; Grumblejacks Rüstung und gemeinsame Jagd; Mirelles endgültiges Geschirr; Tresortransport und weitere Werkstattreihe.","links":[],"backlinks":[ chster fester Punkt</h2><p>Bei Sonnenaufgang soll sich der Zug südlich von Westell hinter den letzten Höfen treffen. Er ist noch nicht versammelt oder aufgebrochen. Ergebnisse von Nellas Beschaffung, Kaitlyns Vandermir-Anfrage und der weiteren Personalsuche sind Styke am aktuellen Rand noch nicht berichtet. <a href=\"#/artikel/horn-aufbau\">Aufbau und Umzug</a></p>","sources":["live","chronicle","timeline","farholde"],"status":"Aktueller Rand · 27. Februar, vor Morgengrauen","tags":["Aktuell","Horn","Nacht","Stufe 7"],"aliases":["Live State"],"text":"Ort und Zeit 27. Februar 4712 AR, etwa 05:00–05:30, Farholde; großes Eckzimmer im Goldenen Reiher. Styke beginnt neben Vesper aufzuwachen. Zorn ist bei ihm, Verse bei Vesper. Noch ist kein Morgengespräch geführt. Der 26. Februar Elise, Hakon und Grumblejack wurden über Hornfund, 222 Tage und den ersten Umzug informiert. Mirelles Anprobe wurde durchgeführt. Tacitus lieferte Stykes +2-Umhang, trat freiwillig dem Collective bei und nahm zwei Forschungsfragen an. Vesper erhielt danach Stykes vollständigen Bericht. Ressourcen Styke 48/48 HP und 16/16 PP; Vesper 38/38 HP, Rod 3/3 und volle Zauberplätze (8/8, 7/7, 5/5) nach abgeschlossener Nachtruhe; Valeria 46/46 HP, Smite 3/3, Challenge 1/1, Touch 9/9, Boon 1/1. Nächster fester Punkt Bei Sonnenaufgang soll sich der Zug südlich von Westell hinter den letzten Höfen treffen. Er ist noch nicht versammelt oder aufgebrochen. Ergebnisse von Nellas Beschaffung, Kaitlyns Vandermir-Anfrage und der weiteren Personalsuche sind Styke am aktuellen Rand noch nicht berichtet. Aufbau und Umzug","search":"aktueller spielstand 27 februar vor morgengrauen styke beginnt neben vesper im goldenen reiher aufzuwachen der westell treffpunkt und der umzug liegen noch vor ihm aktuell horn nacht stufe 7 live state ort und zeit 27 februar 4712 ar etwa 05 00 05 30 farholde gro es eckzimmer im goldenen reiher styke beginnt neben vesper aufzuwachen zorn ist bei ihm verse bei vesper noch ist kein morgengesprach gefuhrt der 26 februar elise hakon und grumblejack wurden uber hornfund 222 tage und den ersten umzug informiert mirelles anprobe wurde durchgefuhrt tacitus lieferte stykes 2 umhang trat freiwillig dem collective bei und nahm zwei forschungsfragen an vesper erhielt danach stykes vollstandigen bericht ressourcen styke 48 48 hp und 16 16 pp vesper 38 38 hp rod 3 3 und volle zauberplatze 8 8 7 7 5 5 nach abgeschlossener nachtruhe valeria 46 46 hp smite 3 3 challenge 1 1 touch 9 9 boon 1 1 nachster fester punkt bei sonnenaufgang soll sich der zug sudlich von westell hinter den letzten hofen treffen er ist noch nicht versammelt oder aufgebrochen ergebnisse von nellas beschaffung kaitlyns vandermir anfrage und der weiteren personalsuche sind styke am aktuellen rand noch nicht berichtet aufbau und umzug","links":["horn-aufbau"],"backlinks":[],"initial":"D","group":"current"},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Von Branderscar über Balentyne und das bereinigte Horn bis zum Morgen des geplanten Umzugs.","body":"<h2>Branderscar und Thorns Schule</h2><p>Styke und Vesper entkamen Branderscar, holten Verse zurück und nahmen Grumblejack mit. Kardinal Adrastus Thorn band sie an seinen Plan, ließ sie ausbilden und stellte den späteren Nessischen Knoten zusammen.</p><h2>Nordfahrt und Balentyne</h2><p>Der Knoten lieferte Sakkarot Fire-Axe Waffen, beseitigte Varnings Patrouille und drang unter ziviler Tarnung in Aldencross und Balentyne ein. In der Nacht zum 9. Februar öffnete die Gruppe die Festung für Fire-Axes Heer. Donnagin und Havelyn starben, das Torhaus fiel und Balentyne wurde erobert.</p><h2>Ein größerer Haushalt</h2><p>Mit Balentynes Fall kamen nicht nur Geld und Ausrüstung: Tacitus nahm den Compact an, Nella, Kaitlyn und Mirelle reisten mit, Tamsin übernahm Sicherheit, Hakon blieb mit fünf Männern im Sold und Grumblejack blieb freier Gefährte. Auf Halstyn’s Folly wurden daraus keine losen Mitfahrer, sondern ein kleiner, hungriger Betrieb.</p><h2>Zehn Tage auf dem Fluss</h2><p>Zwischen dem 9. und 19. Februar finanzierte eine Reihe wechselnder falscher Requisitionen die Reise, ohne zur bloßen Wiederholung zu werden. Nella wuchs in Logistik und Verantwortung; Tamsin erhielt Bezahlung und trainierte Sicherheit; Mirelle plante Grumblejacks Rüstung. Tacitus schloss ihr Familiar-Projekt ab. Am 19. Februar erwachte <a href=\"#/artikel/knittel\">Knittel</a>, benannte sich selbst und Zorn kehrte zu Styke zurück.</p><h2>Der Auftrag im Süden</h2><p>Am 20. Februar erteilte Thorn den zweiten Auftrag: Im Caer Bryr liegt das Horn von Abaddon. Der Knoten soll Vetra-Kali binden, die Tears of Achlys gewinnen und sie zu Thorn bringen. Am 21. Februar erreichte die Gruppe Farholde, zahlte Bellam und Alicia aus und verteilte den Haushalt auf unauffällige Quartiere.</p><h2>Farholde</h2><p>Vesper fand Aiden Kaels Karte. Valeria erkundete den Bryrrand, und der Knoten gewann begrenzte Zusammenarbeit mit Baron Vandermir. Kaitlyn wurde zur Verbindung, während Tacitus und Knittel Stykes Geschicklichkeitsgürtel fertigstellten.</p><h2>Der Siebte Knoten und das Horn</h2><p>Am 23. Februar trafen Elise Zadaria und die White Ravens ein. Die vier externen +1-Aufwertungen und Valerias Stärke-Gürtel wurden fertig. Am nächsten Morgen führte Kaels Karte Styke, Vesper und Valeria zum Horn. Jurak verweigerte den Zugang und fiel im Kampf. In den unteren Höhlen erkannte Vesper fünf verborgene amphibische Kämpfer, bevor deren Hinterhalt begann.</p><h2>Im Horn und zurück</h2><p>Die Erkundung erreichte Tresor und Sanctum; das Kerntrio band die beiden Wächter und ruhte zunächst in der Death’s Head. Am 25. Februar vernichtete es Ezra und dessen drei Wraiths, ließ die Schleime beseitigen und räumte die restlichen Bane-wogs. Vesper barg die Dirges und das Auge der Wachsamkeit aus C13; die Schrift bestätigt den genauen Ritualablauf. Zikomos Versteck brachte 2.300 gp sowie noch unbewerteten Schmuck und Türkise. Am Abend kehrte das Trio nach Farholde zurück. Dort wurden Umzug, Rekrutierung und Werkstätten geplant und Valerias Stirnreif übergeben. Der aktuelle Rand ist Stykes Erwachen bei Kaitlyn am späten Vormittag des 26. Februar; das Hornritual ist weiterhin unbegonnen.</p><h2>Letzter Farholde-Tag</h2><p>Am 26. Februar blieb Kaitlyn am Morgen bewusst bei Styke. Danach legte der Knoten den Umzugstreffpunkt für Sonnenaufgang südlich von Westell fest. Styke und Vesper weihten Elise, Hakon und Grumblejack ein. Mirelle schloss die besondere Anprobe ab; Tacitus lieferte Stykes +2-Umhang, trat dem Collective bei und übernahm eine geheime Gegenfrage zu den Tears sowie eine quellengetrennte Psionik-Untersuchung. Nach Stykes spätem Bericht setzte Vesper eine klare Grenze für künftige tödliche Geheimnisse. Beide schliefen nach ihrer Versöhnung nebeneinander ein. Der neue Rand liegt vor Morgengrauen am 27. Februar; der Umzug ist noch nicht aufgebrochen.</p>","sources":["chronicle","timeline","live","transition","farholde"],"status":"Aktuell bis 24. Februar 4712 AR · später Vormittag","tags":["Rückblick","Buch Eins","Buch Zwei","Farholde"],"aliases":[],"text":"Branderscar und Thorns Schule Styke und Vesper entkamen Branderscar, holten Verse zurück und nahmen Grumblejack mit. Kardinal Adrastus Thorn band sie an seinen Plan, ließ sie ausbilden und stellte den späteren Nessischen Knoten zusammen. Nordfahrt und Balentyne Der Knoten lieferte Sakkarot Fire-Axe Waffen, beseitigte Varnings Patrouille und drang unter ziviler Tarnung in Aldencross und Balentyne ein. In der Nacht zum 9. Februar öffnete die Gruppe die Festung für Fire-Axes Heer. Donnagin und Havelyn starben, das Torhaus fiel und Balentyne wurde erobert. Ein größerer Haushalt Mit Balentynes Fall kamen nicht nur Geld und Ausrüstung: Tacitus nahm den Compact an, Nella, Kaitlyn und Mirelle reisten mit, Tamsin übernahm Sicherheit, Hakon blieb mit fünf Männern im Sold und Grumblejack blieb freier Gefährte. Auf Halstyn’s Folly wurden daraus keine losen Mitf text":"Der Morgen teilt die Gruppe Vesper nimmt Verse und versucht erneut, über den zivilen Arbeitsweg nach Balentyne zu gelangen. Styke bittet sie, nach Zack Eddarly zu sehen, möglichst nach Dienstzuweisung und Gesicht statt nach weiterem Gerücht. Styke bleibt im Dalliance , frühstückt und bringt später Essen zu Valeria . Was zwischen ihnen danach geschieht, hat eine eigene private Akte und gehört nicht in die öffentliche Chronik. Der Morgen endet nicht mit einem neuen Auftrag, sondern mit auseinanderlaufenden Fäden: Vesper in der Festung, Valeria später wieder im Bett, Styke bei Karten, Training und den Stimmen des Gasthauses. Zum späteren 1. Februar .","search":"der fruhe morgen des 1 februar vesper bricht mit verse auf styke bringt valeria fruhstuck der tag offnet mehrere getrennte wege aktueller morgen der morgen teilt die gruppe vesper nimmt verse und versucht erneut uber den zivilen arbeitsweg nach balentyne zu gelangen styke bittet sie nach zack eddarly zu sehen moglichst nach dienstzuweisung und gesicht statt nach weiterem gerucht styke bleibt im dalliance fruhstuckt und bringt spater essen zu valeria was zwischen ihnen danach geschieht hat eine eigene private akte und gehort nicht in die offentliche chronik der morgen endet nicht mit einem neuen auftrag sondern mit auseinanderlaufenden faden vesper in der festung valeria spater wieder im bett styke bei karten training und den stimmen des gasthauses zum spateren 1 februar","links":["dalliance","valeria","verse","vesper","zack","zeit-0201-spaeter"],"backlinks":[],"initial":"D"},{"id":"kollektiv","category":"regeln","title":"Kollektiv und Telepathie","summary":"Bewusste Kommunikation innerhalb von 140 ft, kein gemeinsames allwissendes Bewusstsein.","body":"<h2>Mitglieder</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> ist Ursprung und zählt nicht gegen das Limit von vier willigen Kreaturen. <a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/valeria\">Valeria</a> sind die derzeit bestätigten Mitgli h":"kollektiv und telepathie bewusste kommunikation innerhalb von 140 ft kein gemeinsames allwissendes bewusstsein psionik kommunikation mitglieder styke ist ursprung und zahlt nicht gegen das limit von vier willigen kreaturen vesper und valeria sind die derzeit bestatigten mitglieder zwei platze bleiben frei verse zorn grumblejack timeon und tamsin gehoren nicht automatisch dazu reichweite und wissen aktuell 140 ft von styke ubermittelt wird bewusst gesprochene mentale kommunikation keine automatischen erinnerungen gefuhle sinneseindrucke gedanken oder offscreen berichte der aufbruch vespers meldet daher weder ihre position noch ihren erfolg an styke mechanische anwendungen commitment und weitere zelotfahigkeiten nutzen die gultige verbindung reichweite willige teilnahme und tatsachliche ressourcenausgaben bleiben zu prufen aid und recovery martyrdom und echoes of steel stehen als eigene karten zur verfugung","initial":"K"},{"id":"hausregeln","category":"regeln","title":"Hausregeln und Spielkonventionen","summary":"Die kampagnenspezifischen Abweichungen neben den drei aktuellen Bögen.","body":"<h2>Kontrolle der Figuren</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> bleibt vollständig spielergesteuert. <a href=\"#/artikel/vesper\">Vesper</a> handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. <a href=\"#/artikel/valeria\">Valeria</a> bleibt auch im Kampf ein autonomer GM-geführter DMPC.</p>\n<h2>Stufe und Fortschritt</h2>\n<p>Alle drei sind gegenwärtig Stufe 5. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter <a href=\"#/artikel/buildplanung\">OOC: Buildplanung</a>. Sie ist kein gegenwärtiges Ereignis.</p>\n<h2>Wissensfertigkeiten und Routine</h2>\n<p>Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt.</p>\n<p>Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an.</p>\n<h2>Spezifische Anpassungen</h2>\n<p>Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen drei Powers Known getrennt. Arcane Enlightenment liefert Vesper vier täglich wechselbare temporäre Oracle-Zauber.</p>\n<p>Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. <a href=\"#/artikel/animus\">Animus und Glyphen</a> erläutert die derzeit aktiven Werte.</p>\n<h2>Zahlen, die nicht stillschweigend repariert werden</h2>\n<p>Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Valerias rüstungsabhängige Ride-Berechnung und Stykes drittes Talent bleiben offen. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.</p>\n<h2>Normale Nachterholung</h2><p>Ein normaler abgeschlossener Übergang von Nacht zu Morgen umfasst ruhige Erholung und die gewöhnliche tägliche Auffrischung. Natürliche Heilung wird bis zum HP-Maximum angewandt; PP, Zauberplätze und tägliche Pools werden aufgefüllt. Eine Einschränkung braucht eine konkrete Unterbrechung oder ausdrücklich verkürzte Ruhe. Fehlende Uhrzeiten, Intimität vor dem Schlaf oder ein früher Termin reichen dafür nicht. Permanenter Attributsentzug bleibt bestehen.</p>","sources":["house","localrules","ssheet","vsheet","valsheet"],"status":"Bestätigt","tags":["Hausregel","Spielkontrolle"],"aliases":[],"text":"Kontrolle der Figuren Styke bleibt vollständig spielergesteuert. Vesper handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert
