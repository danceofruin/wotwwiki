3cp>Am letzten Morgenstand schläft \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> im Bett; die Rüstung ist kein angelegter Schlafzustand.\u003c/p>\n","sources":["valsheet","live"],"status":"Im Besitz","tags":["Valeria"],"aliases":[],"text":"Sicherer Regelstand Full-Plate-Rüstungsbonus +9; mit DEX +1 AC 20 ohne geführten Schild, Touch 11, Flat-Footed 19. Der Bogen nennt 20 ft Bewegung in Platte. Offener Punkt Der exakte Meisterarbeits- und Kaufstatus ist nicht vollständig festgelegt. Rüstungsmalus-sensitive Werte wie Ride sollen bei genauer Anwendung abgeglichen werden. Die vorhandenen Zahlen werden nicht stillschweigend neu berechnet. Am letzten Morgenstand schläft Valeria im Bett; die Rüstung ist kein angelegter Schlafzustand.","links":["valeria"],"backlinks":[],"search":"valerias plattenrustung etablierter rustungstyp mit noch offenem kauf meisterarbeitsdetail valeria sicherer regelstand full plate rustungsbonus 9 mit dex 1 ac 20 ohne gefuhrten schild touch 11 flat footed 19 der bogen nennt 20 ft bewegung in platte offener punkt der exakte meisterarbeits und kaufstatus ist nicht vollstandig festgelegt rustungsmalus sensitive werte wie ride sollen bei genauer anwendung abgeglichen werden die vorhandenen zahlen werden nicht stillschweigend neu berechnet am letzten morgenstand schlaft valeria im bett die rustung ist kein angelegter schlafzustand"},{"id":"cloaks","category":"gegenstaende","title":"Cloaks of Resistance +1","summary":"Die aktuellen Widerstandsumhänge sind in den Rettungswürfen eingerechnet.","body":"\u003ch2>Träger\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a>, \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> und \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> besitzen im aktuellen Bogen jeweils einen Cloak of Resistance +1. Der Bonus ist bereits in ihren ausgewiesenen Saves enthalten.\u003c/p>\n\u003ch2>Kein Doppelbonus\u003c/h2>\n\u003cp>Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.\u003c/p>\n","sources":["ssheet","vsheet","valsheet"],"status":"Im Besitz","tags":["Kerntrio"],"aliases":[],"text":"Träger Styke , Vesper und Valeria besitzen im aktuellen Bogen jeweils einen Cloak of Resistance +1. Der Bonus ist bereits in ihren ausgewiesenen Saves enthalten. Kein Doppelbonus Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.","links":["styke","vesper","valeria"],"backlinks":[],"search":"cloaks of resistance 1 die aktuellen widerstandsumhange sind in den rettungswurfen eingerechnet kerntrio trager styke vesper und valeria besitzen im aktuellen bogen jeweils einen cloak of resistance 1 der bonus ist bereits in ihren ausgewiesenen saves enthalten kein doppelbonus ein zweites addieren auf die tabellenwerte wurde denselben gegenstand doppelt anrechnen ob ein kleidungsstuck in einer konkreten szene angelegt ist bleibt eine frage des tatsachlichen zustands"},{"id":"stirnreif","category":"gegenstaende","title":"Thorns eiserne Stirnreife","summary":"Etablierte Tarnhilfe. Eine neue Verkleidung wird nicht durch bloßen Besitz aktiv.","body":"\u003ch2>Funktion\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung.\u003c/p>\n\u003ch2>Bisheriger Gebrauch\u003c/h2>\n\u003cp>Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.\u003c/p>","sources":["live","ssheet","vsheet"],"status":"Im Besitz","tags":["Styke / Vesper"],"aliases":["Circlet","Iron Circlet"],"text":"Funktion Styke und Vesper besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung. Bisheriger Gebrauch Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.","links":["styke","vesper"],"backlinks":[],"search":"thorns eiserne stirnreife etablierte tarnhilfe eine neue verkleidung wird nicht durch blossen besitz aktiv circlet iron circlet styke vesper funktion styke und vesper besitzen thorns eiserne stirnreife sie verandern das aussere erscheinungsbild und erganzen die verschleierung des martialischen eindrucks ihrer ausrustung bisheriger gebrauch styke nutzte die stirnreife bei seinen einkaufen am 31 januar fur wechselnde erscheinungen seither gehort sie weiter zur verfugbaren tarn und infiltrationsausrustung des nessischen knotens"},{"id":"alerion-symbol","category":"gegenstaende","title":"Silber-Saphir-Symbol des Alerion","summary":"Valerias früheres Ordenssymbol befindet sich bei Styke.","body":"\u003ch2>Eigentums- und Beziehungsbezug\u003c/h2>\n\u003cp>Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und nicht in Valerias Ausrüstung.\u003c/p>\n\u003ch2>Keine erfundene Funktion\u003c/h2>\n\u003cp>Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.\u003c/p>\n","sources":["valsheet","ssheet","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Eigentums- und Beziehungsbezug Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei Styke und nicht in Valerias Ausrüstung. Keine erfundene Funktion Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.","links":["styke"],"backlinks":[],"search":"silber saphir symbol des alerion valerias fruheres ordenssymbol befindet sich bei styke styke eigentums und beziehungsbezug das silberne symbol mit saphir gehort zur geschichte der ritterin balina aktuell befindet es sich bei styke und nicht in valerias ausrustung keine erfundene funktion eine zusatzliche magische wirkung oder ein inzwischen vollzogener ruckgabeakt ist nicht etabliert der gegenstand bleibt zugleich erinnerungsstuck und materieller kontinuitatspunkt"},{"id":"nessian-siegel","category":"gegenstaende","title":"Nessianisches Kontaktsiegel","summary":"Noch intakte Kontaktmöglichkeit zu Tiadora für ernste Meldungen.","body":"\u003ch2>Etablierte Anwendung\u003c/h2>\n\u003cp>Das Siegel kann für eine ernsthafte Meldung oder Missionsnotwendigkeit gebrochen werden. Erwartet wird Tiadoras Eintreffen am Bruchort gewöhnlich innerhalb von etwa ein bis zwei Stunden.\u003c/p>\n\u003ch2>Stand\u003c/h2>\n\u003cp>Es ist gemeinsamer Missionsbesitz und nicht als bereits gebrochen verbucht. Der intern erwogene Angriffstermin wurde dadurch noch nicht weitergegeben.\u003c/p>\n","sources":["core","factions","live"],"status":"Im Besitz","tags":["Gruppe"],"aliases":[],"text":"Etablierte Anwendung Das Siegel kann für eine ernsthafte Meldung oder Missionsnotwendigkeit gebrochen werden. Erwartet wird Tiadoras Eintreffen am Bruchort gewöhnlich innerhalb von etwa ein bis zwei Stunden. Stand Es ist gemeinsamer Missionsbesitz und nicht als bereits gebrochen verbucht. Der intern erwogene Angriffstermin wurde dadurch noch nicht weitergegeben.","links":[],"backlinks":["tiadora"],"search":"nessianisches kontaktsiegel noch intakte kontaktmoglichkeit zu tiadora fur ernste meldungen gruppe etablierte anwendung das siegel kann fur eine ernsthafte meldung oder missionsnotwendigkeit gebrochen werden erwartet wird tiadoras eintreffen am bruchort gewohnlich innerhalb von etwa ein bis zwei stunden stand es ist gemeinsamer missionsbesitz und nicht als bereits gebrochen verbucht der intern erwogene angriffstermin wurde dadurch noch nicht weitergegeben"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"\u003ch2>Herkunft\u003c/h2>\n\u003cp>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt \u003ca href=\"#/artikel/styke\">Styke\u003c/a>.\u003c/p>\n\u003ch2>Wissensgrenze\u003c/h2>\n\u003cp>Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.\u003c/p>\n","sources":["chronicle","live"],"status":"Nicht identifiziert","tags":["Styke"],"aliases":[],"text":"Herkunft Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt Styke . Wissensgrenze Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.","links":["styke"],"backlinks":["varning","story-so-far","zeit-0126"],"search":"varnings kleiner schlussel von styke behalten passendes schloss bisher nicht identifiziert styke herkunft beute aus der operation an freeman s rock die auffallige grossere ausrustung wurde ausserhalb aldencross versteckt den kleinen schlussel behielt styke wissensgrenze zu welchem schloss er gehort ist offen ein abenteuerplan oder gegnerisches inventar liefert dafur keinen automatisch freigeschalteten nutzen"},{"id":"beute-cache","category":"gegenstaende","title":"Versteckte Patrouillenausrüstung","summary":"Varnings markante Beute liegt nicht im Dalliance offen herum.","body":"\u003ch2>Dokumentierte Stücke\u003c/h2>\n\u003cp>+1-Schild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen sind außerhalb Aldencross' zwischengelagert. Die sieben Pferde blieben bei Hakons Gruppe.\u003c/p>\n\u003ch2>Keine automatische Verfügbarkeit\u003c/h2>\n\u003cp>Der Cache wird nicht als getragenes Inventar behandelt. Die genaue Position wird in diesem Spielerwiki nicht neu erfunden. Vespers Mithralschild ist nicht Varnings versteckter +1-Schild.\u003c/p>\n","sources":["chronicle","live"],"status":"Ausgelagert","tags":["Gruppe"],"aliases":[],"text":"Dokumentierte Stücke +1-Schild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen sind außerhalb Aldencross' zwischengelagert. Die sieben Pferde blieben bei Hakons Gruppe. Keine automatische Verfügbarkeit Der Cache wird nicht als getragenes Inventar behandelt. Die genaue Position wird in diesem Spielerwiki nicht neu erfunden. Vespers Mithralschild ist nicht Varnings versteckter +1-Schild.","links":[],"backlinks":["story-so-far","zeit-0126"],"search":"versteckte patrouillenausrustung varnings markante beute liegt nicht im dalliance offen herum gruppe dokumentierte stucke 1 schild meisterarbeits vollplatte meisterarbeits lanze und meisterarbeits kompositkurzbogen sind ausserhalb aldencross zwischengelagert die sieben pferde blieben bei hakons gruppe keine automatische verfugbarkeit der cache wird nicht als getragenes inventar behandelt die genaue position wird in diesem spielerwiki nicht neu erfunden vespers mithralschild ist nicht varnings versteckter 1 schild"},{"id":"ketten-beschlaege","category":"gegenstaende","title":"Ketten, Ringe, Nägel und Keile","summary":"Zwei schwere Ketten wurden sehr spät am 1. Februar im Dalliance-Tunnel verankert.","body":"\u003ch2>Installation\u003c/h2>\u003cp>Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang.\u003c/p>\n\u003cp>Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten.\u003c/p>\n\u003ch2>Grenze\u003c/h2>\u003cp>Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt.\u003c/p>","sources":["dalliance","live","chronicle"],"status":"Im Tunnel installiert","tags":["Ketten","Tunnel","Vorbereitung"],"aliases":["Ketten","Beschläge"],"text":"Installation Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang. Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten. Grenze Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt.","links":[],"backlinks":["zeit-0131-tag","intim-requisiten"],"search":"ketten ringe nagel und keile zwei schwere ketten wurden sehr spat am 1 februar im dalliance tunnel verankert ketten beschlage ketten tunnel vorbereitung installation styke vesper und valeria trugen die ketten und beschlage in den tunnel und wahlten eine verbreiterte alte reparaturstelle mehrere biegungen hinter dem kellerzugang zwei getrennte wandketten liegen eng am mauerwerk valeria zog aus mehreren winkeln an beiden ankern sie hielten grenze die stelle dient der korperlichen fixierung eines gewohnlichen menschen komponenten sprache zauberfahigkeiten und magische flucht mussen gesondert beherrscht werden die genaue zahl ubriger nagel und keile ist unbekannt"},{"id":"tinkturen","category":"gegenstaende","title":"Die drei gekauften Präparate","summary":"Die drei Präparate vom 31. Januar; die sechs Rattengiftpakete vom 2. Februar werden getrennt geführt.","body":"\u003ch2>Bestätigter Kauf\u003c/h2>\u003cp>Styke kaufte am 31. Januar eine menschliche Schlaf-/Beruhigungstinktur, ein Abführmittel und ein Tierberuhigungsmittel. Die menschliche Tinktur ist keine verlässliche sofortige Ausschaltung.\u003c/p>\n\u003ch2>Verbrauch\u003c/h2>\u003cp>Vesper gab Tacitus einen Teil des Abführmittels. Die genaue Restmenge ist unbekannt. Das wachsversiegelte Tiermittel mit rotem Faden wurde nicht verwendet.\u003c/p>\n\u003ch2>Getrennter Bestand\u003c/h2>\u003cp>Die sechs am 2. Februar gekauften \u003ca href=\"#/artikel/rattenpoison\">Rattengiftpäckchen\u003c/a> sind ein eigener Posten und liegen unbenutzt im Wassermühlen-Versteck.\u003c/p>","sources":["live","chronicle"],"status":"Teilweise verbraucht","tags":["Tinkturen","Tacitus","Inventar"],"aliases":["Abführmittel","Schlaftinktur","Pferdemittel","Rattengift"],"text":"Bestätigter Kauf Styke kaufte am 31. Januar eine menschliche Schlaf-/Beruhigungstinktur, ein Abführmittel und ein Tierberuhigungsmittel. Die menschliche Tinktur ist keine verlässliche sofortige Ausschaltung. Verbrauch Vesper gab Tacitus einen Teil des Abführmittels. Die genaue Restmenge ist unbekannt. Das wachsversiegelte Tiermittel mit rotem Faden wurde nicht verwendet. Getrennter Bestand Die sechs am 2. Februar gekauften Rattengiftpäckchen sind ein eigener Posten und liegen unbenutzt im Wassermühlen-Versteck.","links":["rattenpoison"],"backlinks":["zeit-0131-tag"],"search":"die drei gekauften praparate die drei praparate vom 31 januar die sechs rattengiftpakete vom 2 februar werden getrennt gefuhrt abfuhrmittel schlaftinktur pferdemittel rattengift tinkturen tacitus inventar bestatigter kauf styke kaufte am 31 januar eine menschliche schlaf beruhigungstinktur ein abfuhrmittel und ein tierberuhigungsmittel die menschliche tinktur ist keine verlassliche sofortige ausschaltung verbrauch vesper gab tacitus einen teil des abfuhrmittels die genaue restmenge ist unbekannt das wachsversiegelte tiermittel mit rotem faden wurde nicht verwendet getrennter bestand die sechs am 2 februar gekauften rattengiftpackchen sind ein eigener posten und liegen unbenutzt im wassermuhlen versteck"},{"id":"graue-briefe","category":"gegenstaende","title":"Die Briefe mit dem grauen Band","summary":"Gelesene Belege für die Verbindung zwischen Kaitlyn und Zack; nicht gestohlen.","body":"\u003ch2>Fund und Informationsweg\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> sah das Bündel am 28. Januar in Kaitlyns Truhe. Am 29. Januar las \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> die Briefe, stellte alles wieder her und berichtete Styke. Dadurch ist die Affäre Kaitlyn/Zack als Spielerwissen belegt.\u003c/p>\n\u003ch2>Besitz und Grenzen\u003c/h2>\n\u003cp>Die Briefe wurden zurückgelegt. Sie sind nicht Teil des mitgeführten Gruppeninventars. Exakte Zustellwege und wiederkehrende Termine wurden dadurch nicht vollständig bekannt.\u003c/p>\n","sources":["chronicle","core","relations"],"status":"Gelesen / zurückgelegt","tags":["Kaitlyn"],"aliases":["Graues Band","Liebesbriefe"],"text":"Fund und Informationsweg Styke sah das Bündel am 28. Januar in Kaitlyns Truhe. Am 29. Januar las Vesper die Briefe, stellte alles wieder her und berichtete Styke. Dadurch ist die Affäre Kaitlyn/Zack als Spielerwissen belegt. Besitz und Grenzen Die Briefe wurden zurückgelegt. Sie sind nicht Teil des mitgeführten Gruppeninventars. Exakte Zustellwege und wiederkehrende Termine wurden dadurch nicht vollständig bekannt.","links":["styke","vesper"],"backlinks":["zeit-0129"],"search":"die briefe mit dem grauen band gelesene belege fur die verbindung zwischen kaitlyn und zack nicht gestohlen graues band liebesbriefe kaitlyn fund und informationsweg styke sah das bundel am 28 januar in kaitlyns truhe am 29 januar las vesper die briefe stellte alles wieder her und berichtete styke dadurch ist die affare kaitlyn zack als spielerwissen belegt besitz und grenzen die briefe wurden zuruckgelegt sie sind nicht teil des mitgefuhrten gruppeninventars exakte zustellwege und wiederkehrende termine wurden dadurch nicht vollstandig bekannt"},{"id":"barnabus-karte","category":"gegenstaende","title":"Kopie von Barnabus' Vermessungskarte","summary":"Dokumentierter Gruppenbesitz; aktueller Träger nicht bestimmt.","body":"\u003ch2>Gesichert\u003c/h2>\n\u003cp>Der aktuelle Live-Stand verzeichnet eine kopierte Vermessungskarte Barnabus Eisenbauchs als Gruppenbesitz.\u003c/p>\n\u003ch2>Grenzen\u003c/h2>\n\u003cp>Ein genauer aktueller Träger ist nicht festgelegt. Das Wiki erfindet keine Zeichnung und keine zusätzlichen Raumdetails aus dem bloßen Kartentitel. Torhausinformationen stehen nur in dem Umfang bereit, in dem \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> sie wirklich berichtet hat.\u003c/p>\n","sources":["live"],"status":"Kopie vorhanden","tags":["Gruppe"],"aliases":[],"text":"Gesichert Der aktuelle Live-Stand verzeichnet eine kopierte Vermessungskarte Barnabus Eisenbauchs als Gruppenbesitz. Grenzen Ein genauer aktueller Träger ist nicht festgelegt. Das Wiki erfindet keine Zeichnung und keine zusätzlichen Raumdetails aus dem bloßen Kartentitel. Torhausinformationen stehen nur in dem Umfang bereit, in dem Valeria sie wirklich berichtet hat.","links":["valeria"],"backlinks":[],"search":"kopie von barnabus vermessungskarte dokumentierter gruppenbesitz aktueller trager nicht bestimmt gruppe gesichert der aktuelle live stand verzeichnet eine kopierte vermessungskarte barnabus eisenbauchs als gruppenbesitz grenzen ein genauer aktueller trager ist nicht festgelegt das wiki erfindet keine zeichnung und keine zusatzlichen raumdetails aus dem blossen kartentitel torhausinformationen stehen nur in dem umfang bereit in dem valeria sie wirklich berichtet hat"},{"id":"timeon-karte","category":"gegenstaende","title":"Timeons Erinnerungskarte","summary":"Grobe Balentyne-Skizze aus persönlicher Erinnerung und Gehörtem.","body":"\u003ch2>Herkunft\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> half in der Ausbildungsphase, eine grobe Erinnerungskarte und einen begrenzten Bericht zu Balentyne zu erstellen.\u003c/p>\n\u003ch2>Verwendbarkeit\u003c/h2>\n\u003cp>Die Skizze ist unvollständig und nicht garantiert aktuell. Sie ist keine Rechtfertigung, alle verborgenen Räume oder heutigen Wachposten zu kennen. Eine genaue aktuelle Lagerstelle ist nicht sicher verzeichnet.\u003c/p>\n","sources":["core","relations","balentyne"],"status":"Begrenzte Erinnerung","tags":["Gruppe"],"aliases":[],"text":"Herkunft Timeon half in der Ausbildungsphase, eine grobe Erinnerungskarte und einen begrenzten Bericht zu Balentyne zu erstellen. Verwendbarkeit Die Skizze ist unvollständig und nicht garantiert aktuell. Sie ist keine Rechtfertigung, alle verborgenen Räume oder heutigen Wachposten zu kennen. Eine genaue aktuelle Lagerstelle ist nicht sicher verzeichnet.","links":["timeon"],"backlinks":["timeon"],"search":"timeons erinnerungskarte grobe balentyne skizze aus personlicher erinnerung und gehortem gruppe herkunft timeon half in der ausbildungsphase eine grobe erinnerungskarte und einen begrenzten bericht zu balentyne zu erstellen verwendbarkeit die skizze ist unvollstandig und nicht garantiert aktuell sie ist keine rechtfertigung alle verborgenen raume oder heutigen wachposten zu kennen eine genaue aktuelle lagerstelle ist nicht sicher verzeichnet"},{"id":"exorzisten-buch","category":"gegenstaende","title":"Der Exorzisten-Reisebericht","summary":"Stykes alter Mitranischer Reisebericht eines Exorzisten; Kaitlyn brachte ihn am 7. Februar ins Dalliance zurück.","body":"\u003ch2>Erwerb und Verwendung\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus.\u003c/p>\n\u003ch2>Nicht verwechseln\u003c/h2>\n\u003cp>Das ist \u003cstrong>nicht Vespers rotes Buch\u003c/strong>. Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen.\u003c/p>\n\n\u003ch2>Rückkehr am 7. Februar\u003c/h2>\u003cp>Kaitlyn brachte das Buch bei ihrer morgendlichen Duellwarnung mit ins Dalliance. Es liegt wieder beim Knoten und gehört nicht mehr zum offenen Mott-Haus-Risiko.\u003c/p>","sources":["chronicle","live"],"status":"Im Besitz des Knotens","tags":["Styke"],"aliases":[],"text":"Erwerb und Verwendung Styke kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus. Nicht verwechseln Das ist nicht Vespers rotes Buch . Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen. Rückkehr am 7. Februar Kaitlyn brachte das Buch bei ihrer morgendlichen Duellwarnung mit ins Dalliance. Es liegt wieder beim Knoten und gehört nicht mehr zum offenen Mott-Haus-Risiko.","links":["styke"],"backlinks":["zeit-0128"],"search":"der exorzisten reisebericht stykes alter mitranischer reisebericht eines exorzisten kaitlyn brachte ihn am 7 februar ins dalliance zuruck styke erwerb und verwendung styke kaufte es am 28 januar bei jacobian es diente auch der deckgeschichte mit der kaitlyn ihn ins haus liess der letzte ausdrucklich genannte ablageort ist der vordere tisch im mott haus nicht verwechseln das ist nicht vespers rotes buch stykes eigentum am reisebericht beweist nicht dass er ihn wieder eingepackt hat eine spatere abholung ist nicht angenommen ruckkehr am 7 februar kaitlyn brachte das buch bei ihrer morgendlichen duellwarnung mit ins dalliance es liegt wieder beim knoten und gehort nicht mehr zum offenen mott haus risiko"},{"id":"rotes-buch","category":"gegenstaende","title":"Vespers rotes Buch","summary":"Mindestens vier sichtbare Textänderungen, eine starke Aura über dem ganzen Band und eine Prosahistorie aus der möglichen Stimme des Buches.","body":"\u003ch2>Das sichtbare Buch\u003c/h2>\u003cp>Vesper besaß das rote Buch bereits auf der Frosthamar. Der offen lesbare Stoff behandelt Augenbinden, Sinnesentzug, weiche Fesseln, Befehle, Warten, Verweigerung und weiblich geführten Machtwechsel.\u003c/p>\u003ch2>Vier beobachtete Veränderungen\u003c/h2>\u003cp>Seit der Nacht zum 2. Februar wurden mindestens vier Veränderungen oder Erweiterungen des Textes beobachtet. In der Nacht zum 7. Februar erschien ein Absatz über Präzision und Spannung, der auffällig zu Mirelles Arbeit vom Vorabend passte. Vesper kopierte ihn wortgetreu.\u003c/p>\u003cp>Am Abend des 7. Februar prüften Styke, Vesper und Valeria eine spätere Passage absichtlich: Styke blieb Zuschauer, während Vesper und Valeria einander wählten. Unmittelbar danach stand am früheren Absatzende eine neue Zeile. Zorn bestätigte, dass sie zuvor nicht dort gestanden hatte. Damit ist eine Reaktion auf Erlebtes sehr wahrscheinlich.\u003c/p>\u003ch2>Magische Untersuchung\u003c/h2>\u003cp>Die starke Aura liegt über dem ganzen Buch. Vesper erkannte Divination, Illusion und eine tiefere unbestimmte Komponente. \u003cem>Identify\u003c/em> verbrauchte einen Zauberplatz des 1. Grades, lieferte aber weder Eigenschaften noch Befehlswörter und bewies keine bestimmte Artefaktklasse.\u003c/p>\u003ch2>Nächster Test\u003c/h2>\u003cp>Der aktuelle Seitenstand soll wortgetreu gesichert werden; das ist noch nicht als erledigt bestätigt. Valeria soll am 8. Februar allein und ohne vorbereitende Hinweise lesen.\u003c/p>\u003ch2>Die Stimme zwischen den Seiten\u003c/h2>\u003cp>\u003ca href=\"#/artikel/zwischen-den-seiten\">Zwischen meinen Seiten\u003c/a> erzählt das bisherige Erwachen als Prosahistorie aus der möglichen Wahrnehmung des Buches.\u003c/p>","sources":["redbook-current","vesper","live"],"status":"Stirring / eindeutig magisch","tags":["Vesper","Calistria","Magie","Veränderter Text","Vier Änderungen"],"aliases":[],"text":"Das sichtbare Buch Vesper besaß das rote Buch bereits auf der Frosthamar. Der offen lesbare Stoff behandelt Augenbinden, Sinnesentzug, weiche Fesseln, Befehle, Warten, Verweigerung und weiblich geführten Machtwechsel. Vier beobachtete Veränderungen Seit der Nacht zum 2. Februar wurden mindestens vier Veränderungen oder Erweiterungen des Textes beobachtet. In der Nacht zum 7. Februar erschien ein Absatz über Präzision und Spannung, der auffällig zu Mirelles Arbeit vom Vorabend passte. Vesper kopierte ihn wortgetreu. Am Abend des 7. Februar prüften Styke, Vesper und Valeria eine spätere Passage absichtlich: Styke blieb Zuschauer, während Vesper und Valeria einander wählten. Unmittelbar danach stand am früheren Absatzende eine neue Zeile. Zorn bestätigte, dass sie zuvor nicht dort gestanden hatte. Damit ist eine Reaktion auf Erlebtes sehr wahrscheinlich. Magische Untersuchung Die starke Aura liegt über dem ganzen Buch. Vesper erkannte Divination, Illusion und eine tiefere unbestimmte Komponente. Identify verbrauchte einen Zauberplatz des 1. Grades, lieferte aber weder Eigenschaften noch Befehlswörter und bewies keine bestimmte Artefaktklasse. Nächster Test Der aktuelle Seitenstand soll wortgetreu gesichert werden; das ist noch nicht als erledigt bestätigt. Valeria soll am 8. Februar allein und ohne vorbereitende Hinweise lesen. Die Stimme zwischen den Seiten Zwischen meinen Seiten erzählt das bisherige Erwachen als Prosahistorie aus der möglichen Wahrnehmung des Buches.","links":["zwischen-den-seiten"],"backlinks":["vesper","spielstand"],"search":"vespers rotes buch mindestens vier sichtbare textanderungen eine starke aura uber dem ganzen band und eine prosahistorie aus der moglichen stimme des buches vesper calistria magie veranderter text vier anderungen das sichtbare buch vesper besass das rote buch bereits auf der frosthamar der offen lesbare stoff behandelt augenbinden sinnesentzug weiche fesseln befehle warten verweigerung und weiblich gefuhrten machtwechsel vier beobachtete veranderungen seit der nacht zum 2 februar wurden mindestens vier veranderungen oder erweiterungen des textes beobachtet in der nacht zum 7 februar erschien ein absatz uber prazision und spannung der auffallig zu mirelles arbeit vom vorabend passte vesper kopierte ihn wortgetreu am abend des 7 februar pruften styke vesper und valeria eine spatere passage absichtlich styke blieb zuschauer wahrend vesper und valeria einander wahlten unmittelbar danach stand am fruheren absatzende eine neue zeile zorn bestatigte dass sie zuvor nicht dort gestanden hatte damit ist eine reaktion auf erlebtes sehr wahrscheinlich magische untersuchung die starke aura liegt uber dem ganzen buch vesper erkannte divination illusion und eine tiefere unbestimmte komponente identify verbrauchte einen zauberplatz des 1 grades lieferte aber weder eigenschaften noch befehlsworter und bewies keine bestimmte artefaktklasse nachster test der aktuelle seitenstand soll wortgetreu gesichert werden das ist noch nicht als erledigt bestatigt valeria soll am 8 februar allein und ohne vorbereitende hinweise lesen die stimme zwischen den seiten zwischen meinen seiten erzahlt das bisherige erwachen als prosahistorie aus der moglichen wahrnehmung des buches"},{"id":"weiches-seil","category":"gegenstaende","title":"Das weiche Seil","summary":"Weiches Fesselseil aus dem Zimmerbestand, klar getrennt von der für den Tunnel gekauften Eisenware.","body":"\u003ch2>Zimmerbestand\u003c/h2>\n\u003cp>Styke, Vesper und Valeria besitzen weiches Seil für private Fesselspiele. Es gehörte schon vor dem Einkauf vom 31. Januar zu ihrer Ausrüstung und lag in der Nacht zum 1. Februar zusammen mit Vespers rotem Buch und der Augenbinde bereit.\u003c/p>\n\u003ch2>Getrennt von der Tunnelhardware\u003c/h2>\n\u003cp>Die später gekauften Ketten, Eisenringe, Nägel und Keile sind schweres Material für den geplanten Verwahrpunkt im Tunnel. Das weiche Seil gehört zum Zimmerbestand; sein letzter genauer Ablageplatz wurde nicht protokolliert.\u003c/p>\n\u003ch2>Private Akte (18+)\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/intim-requisiten\">Rotes Buch, Seil und Augenbinden\u003c/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.\u003c/p>","sources":["live","relations"],"status":"Im Besitz","tags":["Gruppe"],"aliases":[],"text":"Zimmerbestand Styke, Vesper und Valeria besitzen weiches Seil für private Fesselspiele. Es gehörte schon vor dem Einkauf vom 31. Januar zu ihrer Ausrüstung und lag in der Nacht zum 1. Februar zusammen mit Vespers rotem Buch und der Augenbinde bereit. Getrennt von der Tunnelhardware Die später gekauften Ketten, Eisenringe, Nägel und Keile sind schweres Material für den geplanten Verwahrpunkt im Tunnel. Das weiche Seil gehört zum Zimmerbestand; sein letzter genauer Ablageplatz wurde nicht protokolliert. Private Akte (18+) Rotes Buch, Seil und Augenbinden . Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.","links":["intim-requisiten"],"backlinks":[],"search":"das weiche seil weiches fesselseil aus dem zimmerbestand klar getrennt von der fur den tunnel gekauften eisenware gruppe zimmerbestand styke vesper und valeria besitzen weiches seil fur private fesselspiele es gehorte schon vor dem einkauf vom 31 januar zu ihrer ausrustung und lag in der nacht zum 1 februar zusammen mit vespers rotem buch und der augenbinde bereit getrennt von der tunnelhardware die spater gekauften ketten eisenringe nagel und keile sind schweres material fur den geplanten verwahrpunkt im tunnel das weiche seil gehort zum zimmerbestand sein letzter genauer ablageplatz wurde nicht protokolliert private akte 18 rotes buch seil und augenbinden der private teil ist nach der einmaligen altersfreigabe in dieses dossier eingebunden"},{"id":"abendkleider","category":"gegenstaende","title":"Die Kleider vom 30. Januar","summary":"Weinrote Wolle für Vesper, dunkelblaue Wolle für Valeria.","body":"\u003ch2>Einkauf\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> und  Styke besorgte bei Bellam Wein und brachte ihn zum Tacitus-Treffen. Jacobian sagte nach den Beschwerden, er werde Tacitus dieselbe Flasche nicht noch einmal servieren. Eine Analyse oder Entsorgung ist nicht belegt. Duftöl Das vor dem Kaitlyn-Besuch gekaufte Öl wurde für die beabsichtigte Duftspur verwendet. Preis, Restmenge und heutiger Träger sind nicht exakt gesichert. Dass Franz daraus bereits die gewünschte Schlussfolgerung zog, ist unbekannt.","links":["styke"],"backlinks":[],"search":"wein und duftol vom 31 januar tatsachliche beschaffungen mit getrennten verwendungszwecken verschiedene wein styke besorgte bei bellam wein und brachte ihn zum tacitus treffen jacobian sagte nach den beschwerden er werde tacitus dieselbe flasche nicht noch einmal servieren eine analyse oder entsorgung ist nicht belegt duftol das vor dem kaitlyn besuch gekaufte ol wurde fur die beabsichtigte duftspur verwendet preis restmenge und heutiger trager sind nicht exakt gesichert dass franz daraus bereits die gewunschte schlussfolgerung zog ist unbekannt"},{"id":"dornpakt","category":"fakten","title":"Der Dornpakt","summary":"Angenommene Bindung von Styke und Vesper an Thorns Verschwörung.","body":"\u003ch2>Gesicherte Bedeutung\u003c/h2>\n\u003cp>Thorn rekrutierte \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt.\u003c/p>\n\u003ch2>Nicht mit jedem anderen Pakt gleichsetzen\u003c/h2>\n\u003cp>Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.\u003c/p>\n","sources":["chronicle","core","relations"],"status":"Bestätigt","tags":["Vertrag"],"aliases":["Pact of Thorns"],"text":"Gesicherte Bedeutung Thorn rekrutierte Styke und Vesper nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt. Nicht mit jedem anderen Pakt gleichsetzen Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far"],"search":"der dornpakt angenommene bindung von styke und vesper an thorns verschworung pact of thorns vertrag gesicherte bedeutung thorn rekrutierte styke und vesper nach branderscar und band sie durch den pact of thorns im infernalen autoritatsrahmen steht asmodeus uber thorn der als weltlicher vorgesetzter und auftraggeber wirkt nicht mit jedem anderen pakt gleichsetzen valerias privater vertrag und tamsins blutpakt sind eigene bindungen ihre teilnehmer und hierarchien durfen nicht zusammengezogen werden ein nicht vorliegender vertragsvolltext wird hier nicht aus gedachtnis erganzt"},{"id":"privatpakt","category":"fakten","title":"Valerias Privatpakt","summary":"Asmodeus zuerst, Styke und Vesper als sterbliche Autoritäten. Timeon ist kein Vertragspartner.","body":"\u003ch2>Inhalt\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> ist kein Vertragspartner.\u003c/p>\n\u003ch2>Der Streit um Timeon\u003c/h2>\n\u003cp>Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen.\u003c/p>\n\u003ch2>Mechanik\u003c/h2>\n\u003cp>Valerias aktueller Stand bleibt \u003cstrong>Fighter 5\u003c/strong>. Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.\u003c/p>","sources":["valeria","relations","live","house"],"status":"Bestätigt","tags":["Vertrag","Valeria"],"aliases":[],"text":"Inhalt Valeria nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. Timeon ist kein Vertragspartner. Der Streit um Timeon Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen. Mechanik Valerias aktueller Stand bleibt Fighter 5 . Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.","links":["valeria","styke","vesper","timeon"],"backlinks":["timeon","story-so-far","zeit-ausbildung"],"search":"valerias privatpakt asmodeus zuerst styke und vesper als sterbliche autoritaten timeon ist kein vertragspartner vertrag valeria inhalt valeria nahm nach der ausbildung einen privaten pakt an asmodeus steht darin an erster stelle styke und vesper sind die sterblichen autoritaten thorn ist in diesem dokument kein direkter vorgesetzter timeon ist kein vertragspartner der streit um timeon am 31 januar befolgte valeria stykes befehl nicht zu timeon zuruckzukehren sie bestritt zugleich dass dieser befehl festlegen konne was ihr noch wichtig ist oder welche pflichten balinas in ihr fortbestehen mechanik valerias aktueller stand bleibt fighter 5 der pakt enthalt keinen bereits vollzogenen klassenwechsel"},{"id":"bekannt-unbekannt","category":"fakten","title":"Was wir wissen. Was nicht.","summary":"Spielerwissen am Ende des 7. Februar: Duell, Rückkehr, Tarnprüfung, Feldbefehl und Buchbefunde sind bekannt; spätere Festungsentscheidungen bleiben verborgen.","body":"\u003ch2>Bekannt\u003c/h2>\u003cul>\u003cli>Zack ist tot; Styke sah das gesamte Duell und berichtete Kaitlyn.\u003c/li>\u003cli>Captain Barhold entwaffnete Franz und begann eine Untersuchung. Die Dalliance-Tarnung wurde geprüft und hielt.\u003c/li>\u003cli>Nella und Tamsin kehrten erfolgreich zurück. Tamsin führt Schutz und Evakuierung im Dalliance.\u003c/li>\u003cli>Hakon erhielt die neuen Befehle. Sten und Ketil wurden als erstes Paar gesehen.\u003c/li>\u003cli>Mirelles letzte Maßarbeiten sind fertig.\u003c/li>\u003cli>Das rote Buch ist eindeutig magisch; mindestens vier Textänderungen wurden beobachtet.\u003c/li>\u003c/ul>\u003ch2>Nicht bekannt\u003c/h2>\u003cul>\u003cli>Barholds spätere Entscheidung über Franz und die weiteren öffentlichen Folgen.\u003c/li>\u003cli>Kaitlyns spätere Lage im Mott-Haus, bis eine Nachricht oder Begegnung sie offenlegt.\u003c/li>\u003cli>Ob und wann weitere Nordmänner nach Sten und Ketil eingetroffen sind.\u003c/li>\u003cli>Die genaue Natur, Herkunft und vollständige Wirkung des roten Buchs.\u003c/li>\u003cli>Jacobians endgültige Behandlung nach dem geplanten Zugriff.\u003c/li>\u003c/ul>","sources":["live","timeline","clocks-current","mirelle"],"status":"Aktueller Wissensstand","tags":["Spielerwissen","7. Februar","Offene Fragen"],"aliases":[],"text":"Bekannt Zack ist tot; Styke sah das gesamte Duell und berichtete Kaitlyn. Captain Barhold entwaffnete Franz und begann eine Untersuchung. Die Dalliance-Tarnung wurde geprüft und hielt. Nella und Tamsin kehrten erfolgreich zurück. Tamsin führt Schutz und Evakuierung im Dalliance. Hakon erhielt die neuen Befehle. Sten und Ketil wurden als erstes Paar gesehen. Mirelles letzte Maßarbeiten sind fertig. Das rote Buch ist eindeutig magisch; mindestens vier Textänderungen wurden beobachtet. Nicht bekannt Barholds spätere Entscheidung über Franz und die weiteren öffentlichen Folgen. Kaitlyns spätere Lage im Mott-Haus, bis eine Nachricht oder Begegnung sie offenlegt. Ob und wann weitere Nordmänner nach Sten und Ketil eingetroffen sind. Die genaue Natur, Herkunft und vollständige Wirkung des roten Buchs. Jacobians endgültige Behandlung nach dem geplanten Zugriff.","links":[],"backlinks":[],"search":"was wir wissen was nicht spielerwissen am ende des 7 februar duell ruckkehr tarnprufung feldbefehl und buchbefunde sind bekannt spatere festungsentscheidungen bleiben verborgen spielerwissen 7 februar offene fragen bekannt zack ist tot styke sah das gesamte duell und berichtete kaitlyn captain barhold entwaffnete franz und begann eine untersuchung die dalliance tarnung wurde gepruft und hielt nella und tamsin kehrten erfolgreich zuruck tamsin fuhrt schutz und evakuierung im dalliance hakon erhielt die neuen befehle sten und ketil wurden als erstes paar gesehen mirelles letzte massarbeiten sind fertig das rote buch ist eindeutig magisch mindestens vier textanderungen wurden beobachtet nicht bekannt barholds spatere entscheidung uber franz und die weiteren offentlichen folgen kaitlyns spatere lage im mott haus bis eine nachricht oder begegnung sie offenlegt ob und wann weitere nordmanner nach sten und ketil eingetroffen sind die genaue natur herkunft und vollstandige wirkung des roten buchs jacobians endgultige behandlung nach dem geplanten zugriff"},{"id":"mott-plan","category":"vorhaben","title":"Mott, Eddarly und Kaitlyn","summary":"Die Briefe führten zum Duell: Zack ist tot, Franz wurde zunächst festgesetzt und Kaitlyn ist für die Untersuchung ins Mott-Haus zurückgekehrt.","body":"\u003ch2>Die gesetzte Spur\u003c/h2>\u003cp>Vesper inszenierte am 5. Februar einen Einbruch und ließ die echten Briefe zwischen Kaitlyn und Zack so zurück, dass Franz sie finden konnte.\u003c/p>\u003ch2>Der sichtbare Ausgang\u003c/h2>\u003cp>Franz forderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung.\u003c/p>\u003ch2>Kaitlyn\u003c/h2>\u003cp>Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte.\u003c/p>\u003ch2>Offen\u003c/h2>\u003cp>Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.\u003c/p>","sources":["live","relations","core"],"status":"Zack tot / Franz unter Untersuchung","tags":["Intrige","Kaitlyn","Franz","Zack","Duell"],"aliases":[],"text":"Die gesetzte Spur Vesper inszenierte am 5. Februar einen Einbruch und ließ die echten Briefe zwischen Kaitlyn und Zack so zurück, dass Franz sie finden konnte. Der sichtbare Ausgang Franz forderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung. Kaitlyn Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte. Offen Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.","links":[],"backlinks":[],"search":"mott eddarly und kaitlyn die briefe fuhrten zum duell zack ist tot franz wurde zunachst festgesetzt und kaitlyn ist fur die untersuchung ins mott haus zuruckgekehrt intrige kaitlyn franz zack duell die gesetzte spur vesper inszenierte am 5 februar einen einbruch und liess die echten briefe zwischen kaitlyn und zack so zuruck dass franz sie finden konnte der sichtbare ausgang franz forderte zack zum duell styke sah am 7 februar wie zack franz leicht verwundete und franz ihn anschliessend mit der hellebarde totete styke lockte franz an balentynes tor captain barhold entwaffnete ihn und begann eine untersuchung kaitlyn styke hielt sein versprechen und berichtete kaitlyn selbst von zacks tod sie kehrte danach ins mott haus zuruck damit die festung sie dort als captain motts frau finden konnte offen die spatere entscheidung uber franz und die weiteren offentlichen folgen sind dem knoten noch nicht bekannt"},{"id":"tacitus-plan","category":"vorhaben","title":"Tacitus: Kontakt und mögliche Entführung","summary":"Tacitus und Jacobian werden am 8. Februar gegen 20 Uhr erwartet; beide sollen lebend, getrennt und ohne Alarm festgesetzt werden.","body":"\u003ch2>Termin\u003c/h2>\u003cp>Tacitus kommt am 8. Februar gegen 20 Uhr nur in Begleitung Jacobians zum Lord’s Dalliance. Jacobian hat zugesagt.\u003c/p>\u003ch2>Aktueller Plan\u003c/h2>\u003cp>Der Knoten plant einen Zugriff unter \u003cem>Silence\u003c/em>. Beide Gäste sollen lebend überwältigt, gefesselt, geknebelt, getrennt und zum vorbereiteten Fesselpunkt im verborgenen Gang gebracht werden. Zwei gewöhnliche Wandketten sind dort montiert.\u003c/p>\u003cp>Tamsin bleibt beim Schutz des Dalliance und gehört nicht zum Zugriff. Nur Tacitus ist derzeit für ein späteres Rekrutierungsangebot vorgesehen. Was mit Jacobian geschieht, ist noch offen; er wird nicht als öffentliches Druckmittel gegen Tacitus eingeplant.\u003c/p>","sources":["live","chronicle","tacitus-current","dalliance"],"status":"Termin fest / Zugriff geplant","tags":["Tacitus","Jacobian","8. Februar","Silence","Lebende Gefangennahme"],"aliases":[],"text":"Termin Tacitus kommt am 8. Februar gegen 20 Uhr nur in Begleitung Jacobians zum Lord’s Dalliance. Jacobian hat zugesagt. Aktueller Plan Der Knoten plant einen Zugriff unter Silence . Beide Gäste sollen lebend überwältigt, gefesselt, geknebelt, getrennt und zum vorbereiteten Fesselpunkt im verborgenen Gang gebracht werden. Zwei gewöhnliche Wandketten sind dort montiert. Tamsin bleibt beim Schutz des Dalliance und gehört nicht zum Zugriff. Nur Tacitus ist derzeit für ein späteres Rekrutierungsangebot vorgesehen. Was mit Jacobian geschieht, ist noch offen; er wird nicht als öffentliches Druckmittel gegen Tacitus e erhin ungeklärt.\u003c/p>\u003ch2>Mirelle\u003c/h2>\u003cp>Mirelles Erkennungszeichen liegt noch bei Styke und muss Hakon erreichen. Die Abholung führt direkt zum Lord’s Dalliance.\u003c/p>\u003ch2>Tacitus und Jacobian\u003c/h2>\u003cp>Das Abendessen beginnt am 8. Februar gegen 20 Uhr. Raum, \u003cem>Silence\u003c/em>, Zugriff, Fesselung, Trennung und Transport in den Gang müssen vorbereitet werden.\u003c/p>\u003ch2>Rotes Buch\u003c/h2>\u003cp>Der aktuelle Seitenstand soll noch wortgetreu gesichert werden. Valeria liest am 8. Februar allein und unvorbereitet.\u003c/p>\u003ch2>Balentyne\u003c/h2>\u003cp>Der gewählte Haupttermin bleibt die Nacht vom 8. auf den 9. Februar. Der Zugang und die Sicherheitslage müssen am 8. Februar anhand tatsächlicher Beobachtungen neu beurteilt werden.\u003c/p>","sources":["live","chronicle","timeline","clocks-current","mirelle"],"status":"Aufgaben für den 8. Februar","tags":["8. Februar","Gift","Mirelle","Tacitus","Balentyne","Rotes Buch"],"aliases":[],"text":"Wassermühlen-Versteck Sechs Giftpakete, Balentyne-Unterlagen und kompromittierendes Material müssen rechtzeitig zurückgeholt werden. Dosis und Großkesselwirkung des Rattengifts sind weiterhin ungeklärt. Mirelle Mirelles Erkennungszeichen liegt noch bei Styke und muss Hakon erreichen. Die Abholung führt direkt zum Lord’s Dalliance. Tacitus und Jacobian Das Abendessen beginnt am 8. Februar gegen 20 Uhr. Raum, Silence , Zugriff, Fesselung, Trennung und Transport in den Gang müssen vorbereitet werden. Rotes Buch Der aktuelle Seitenstand soll noch wortgetreu gesichert werden. Valeria liest am 8. Februar allein und unvorbereitet. Balentyne Der gewählte Haupttermin bleibt die Nacht vom 8. auf den 9. Februar. Der Zugang und die Sicherheitslage müssen am 8. Februar anhand tatsächlicher Beobachtungen neu beurteilt werden.","links":[],"backlinks":[],"search":"weitere offene spuren die verbleibenden aufgaben fur den 8 februar cache zuruckholen mirelle zeichen ubergeben tacitus abendessen vorbereiten und balentyne angreifen 8 februar gift mirelle tacitus balentyne rotes buch wassermuhlen versteck sechs giftpakete balentyne unterlagen und kompromittierendes material mussen rechtzeitig zuruckgeholt werden dosis und grosskesselwirkung des rattengifts sind weiterhin ungeklart mirelle mirelles erkennungszeichen liegt noch bei styke und muss hakon erreichen die abholung fuhrt direkt zum lord s dalliance tacitus und jacobian das abendessen beginnt am 8 februar gegen 20 uhr raum silence zugriff fesselung trennung und transport in den gang mussen vorbereitet werden rotes buch der aktuelle seitenstand soll noch wortgetreu gesichert werden valeria liest am 8 februar allein und unvorbereitet balentyne der gewahlte haupttermin bleibt die nacht vom 8 auf den 9 februar der zugang und die sicherheitslage mussen am 8 februar anhand tatsachlicher beobachtungen neu beurteilt werden"},{"id":"spielstand","category":"fakten","title":"Der aktuelle Spielstand","summary":"7. Februar, späte Nacht vor Mitternacht: Zack ist tot, Nella und Tamsin sind zurück, die Feldgruppe ist in Bewegung und das rote Buch hat auf einen bewussten Test reagiert.","body":"\u003ch2>Ort und Zeit\u003c/h2>\u003cp>\u003cstrong>7. Februar 4712 AR, späte Nacht vor Mitternacht.\u003c/strong> \u003ca href=\"#/artikel/styke\">Styke\u003c/a>, \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a>, \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> und \u003ca href=\"#/artikel/nella\">Nella\u003c/a> schlafen im großen rückwärtigen Zimmer des \u003ca href=\"#/artikel/dalliance\">Lord’s Dalliance\u003c/a>. Verse ist bei Vesper; Zorn lag zuletzt bei dem roten Buch und den Notizen auf dem Tisch. Der 8. Februar ist noch nicht erreicht und tägliche Ressourcen sind noch nicht erneuert.\u003c/p>\n\u003ch2>Was der Tag gebracht hat\u003c/h2>\u003cul>\u003cli>\u003ca href=\"#/artikel/franz\">Franz Mott\u003c/a> tötete \u003ca href=\"#/artikel/zack\">Zack Eddarly\u003c/a> im Duell. Styke lenkte Franz bis ans Tor von Balentyne; \u003ca href=\"#/artikel/captain-barhold\">Captain Barhold\u003c/a> entwaffnete ihn und eröffnete eine Untersuchung.\u003c/li>\u003cli>Styke berichtete \u003ca href=\"#/artikel/kaitlyn\">Kaitlyn\u003c/a> persönlich von Zacks Tod. Danach kehrte sie ins Mott-Haus zurück, damit die Festung sie dort für die Untersuchung finden konnte.\u003c/li>\u003cli>\u003ca href=\"#/artikel/nella\">Nella\u003c/a> und \u003ca href=\"#/artikel/tamsin\">Tamsin\u003c/a> kehrten ohne Zwischenfall zurück. Nellas Schwester und ihr Mann sind für das unmittelbare Gefahrenfenster mehrere Stunden weiter südlich untergebracht.\u003c/li>\u003cli>Valeria überbrachte Hakon die neuen Befehle. Sten und Ketil wurden als erstes Paar seiner Männer im Dalliance gesehen.\u003c/li>\u003cli>\u003ca href=\"#/artikel/mirelles-auftraege\">Mirelles letzte Maßarbeiten\u003c/a> sind fertig und ausgeliefert.\u003c/li>\u003cli>Das \u003ca href=\"#/artikel/rotes-buch\">rote Buch\u003c/a> zeigte eine starke Aura über den ganzen Band und reagierte nach einem bewussten Test mit einer weiteren Textzeile.\u003c/li>\u003c/ul>\n\u003ch2>Der 8. Februar\u003c/h2>\u003cp>Offen sind das Zurückholen von Gift und Unterlagen aus dem \u003ca href=\"#/artikel/wassermuehlen-versteck\">Wassermühlen-Versteck\u003c/a>, Mirelles Erkennungszeichen für Hakon, das Abendessen mit \u003ca href=\"#/artikel/tacitus\">Tacitus\u003c/a> und \u003ca href=\"#/artikel/jacobian\">Jacobian\u003c/a>, Valerias alleinige Buchlektüre und die Hauptaktion gegen Balentyne in der Nacht zum 9. Februar.\u003c/p>","sources":["live","chronicle","timeline","clocks-current","dalliance","mirelle"],"status":"Aktueller Snapshot","tags":["7. Februar","Lord’s Dalliance","Duell","Rotes Buch","Angriffsvorbereitung"],"aliases":[],"text":"Ort und Zeit 7. Februar 4712 AR, späte Nacht vor Mitternacht. Styke , Vesper , Valeria und Nella schlafen im großen rückwärtigen Zimmer des Lord’s Dalliance . Verse ist bei Vesper; Zorn lag zuletzt bei dem roten Buch und den Notizen auf dem Tisch. Der 8. Februar ist noch nicht erreicht und tägliche Ressourcen sind noch nicht erneuert. Was der Tag gebracht hat Franz Mott tötete Zack Eddarly im Duell. Styke lenkte Franz bis ans Tor von Balentyne; Captain Barhold entwaffnete ihn und eröffnete eine Untersuchung. Styke berichtete Kaitlyn persönlich von Zacks Tod. Danach kehrte sie ins Mott-Haus zurück, damit die Festung sie dort für die Untersuchung finden konnte. Nella und Tamsin kehrten ohne Zwischenfall zurück. Nellas Schwester und ihr Mann sind für das unmittelbare Gefahrenfenster mehrere Stunden weiter südlich untergebracht. Valeria überbrachte Hakon die neuen Befehle. Sten und Ketil wurden als erstes Paar seiner Männer im Dalliance gesehen. Mirelles letzte Maßarbeiten sind fertig und ausgeliefert. Das rote Buch zeigte eine starke Aura über den ganzen Band und reagierte nach einem bewussten Test mit einer weiteren Textzeile. Der 8. Februar Offen sind das Zurückholen von Gift und Unterlagen aus dem Wassermühlen-Versteck , Mirelles Erkennungszeichen für Hakon, das Abendessen mit Tacitus und Jacobian , Valerias alleinige Buchlektüre und die Hauptaktion gegen Balentyne in der Nacht zum 9. Februar.","search":"der aktuelle spielstand 7 februar spate nacht vor mitternacht zack ist tot nella und tamsin sind zuruck die feldgruppe ist in bewegung und das rote buch hat auf einen bewussten test reagiert 7 februar lord s dalliance duell rotes buch angriffsvorbereitung ort und zeit 7 februar 4712 ar spate nacht vor mitternacht styke vesper valeria und nella schlafen im grossen ruckwartigen zimmer des lord s dalliance verse ist bei vesper zorn lag zuletzt bei dem roten buch und den notizen auf dem tisch der 8 februar ist noch nicht erreicht und tagliche ressourcen sind noch nicht erneuert was der tag gebracht hat franz mott totete zack eddarly im duell styke lenkte franz bis ans tor von balentyne captain barhold entwaffnete ihn und eroffnete eine untersuchung styke berichtete kaitlyn personlich von zacks tod danach kehrte sie ins mott haus zuruck damit die festung sie dort fur die untersuchung finden konnte nella und tamsin kehrten ohne zwischenfall zuruck nellas schwester und ihr mann sind fur das unmittelbare gefahrenfenster mehrere stunden weiter sudlich untergebracht valeria uberbrachte hakon die neuen befehle sten und ketil wurden als erstes paar seiner manner im dalliance gesehen mirelles letzte massarbeiten sind fertig und ausgeliefert das rote buch zeigte eine starke aura uber den ganzen band und reagierte nach einem bewussten test mit einer weiteren textzeile der 8 februar offen sind das zuruckholen von gift und unterlagen aus dem wassermuhlen versteck mirelles erkennungszeichen fur hakon das abendessen mit tacitus und jacobian valerias alleinige buchlekture und die hauptaktion gegen balentyne in der nacht zum 9 februar","links":["styke","vesper","valeria","nella","dalliance","franz","zack","captain-barhold","kaitlyn","tamsin","mirelles-auftraege","rotes-buch","wassermuehlen-versteck","tacitus","jacobian"],"backlinks":["bogen-styke","bogen-vesper","bogen-valeria"]},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Von Branderscar bis zur späten Nacht des 7. Februar: Der Knoten steht einen Tag vor der Hauptaktion gegen Balentyne.","body":"\u003ch2>I. Die Verurteilten von Branderscar\u003c/h2>\n\u003cp>Die Geschichte begann für \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in \u003ca href=\"#/artikel/branderscar\">Branderscar\u003c/a>. Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, \u003ca href=\"#/artikel/verse\">Verse\u003c/a> zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/tiadora\">Tiadora\u003c/a> öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten \u003ca href=\"#/artikel/verse\">Verse\u003c/a> zurück und befreiten \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a>. Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl \u003ca href=\"#/artikel/tamsin\">Tamsin Blackerly\u003c/a> als auch \u003ca href=\"#/artikel/matilda\">Matilda Richter\u003c/a> die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet.\u003c/p>\n\u003ch2>II. Thorns Haus und der Knoten\u003c/h2>\n\u003cp>Der Weg führte zu \u003ca href=\"#/artikel/thorn\">Adrastus Thorn\u003c/a>. Der \u003ca href=\"#/artikel/dornpakt\">Pakt der Dornen\u003c/a>, die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen.\u003c/p>\n\u003cp>Dame Balina und ihr junger Knappe \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen.\u003c/p>\n\u003cp>Aus derselben Frau wurde \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a>. Sie nahm später einen \u003ca href=\"#/artikel/privatpakt\">Privatpakt\u003c/a> an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> blieb außerhalb dieses Pakts. \u003ca href=\"#/artikel/elise\">Elise Zadaria\u003c/a> führte ihre \u003ca href=\"#/artikel/white-ravens\">White Ravens\u003c/a> währenddessen über eine getrennte Befehlskette.\u003c/p>\n\u003ch2>III. Die Fahrt nach Norden\u003c/h2>\n\u003cp>Auf der \u003ca href=\"#/artikel/frosthamar\">Frosthamar\u003c/a> wurde die Verschwörung praktisch: Waffen mussten zu \u003ca href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe\u003c/a> gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter \u003ca href=\"#/artikel/sambryl\">Edward Sambryl\u003c/a>. Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit \u003ca href=\"#/artikel/white-tusk\">White Tusk\u003c/a> und den \u003ca href=\"#/artikel/yutak\">Yutak\u003c/a> brachte Handel und wertvolles Elfenbein.\u003c/p>\n\u003cp>Am \u003cstrong>14. Januar 4712 AR\u003c/strong> erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/odenkirk\">Kargeld Odenkirk\u003c/a> starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. \u003ca href=\"#/artikel/hakon\">Hakon\u003c/a>, \u003ca href=\"#/artikel/sten\">Sten\u003c/a>, \u003ca href=\"#/artikel/ketil\">Ketil\u003c/a>, \u003ca href=\"#/artikel/eirik\">Eirik\u003c/a>, \u003ca href=\"#/artikel/arved\">Arved\u003c/a> und \u003ca href=\"#/artikel/torvald\">Torvald\u003c/a> hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a> als freiem Freund.\u003c/p>\n\u003ch2>IV. Unter fremdem Dach\u003c/h2>\n\u003cp>Am \u003cstrong>23. Januar\u003c/strong> kamen Styke, Vesper und \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> als freie Händler aus dem Norden nach \u003ca href=\"#/artikel/aldencross\">Aldencross\u003c/a>. Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im \u003ca href=\"#/artikel/dalliance\">Lord's Dalliance\u003c/a> wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/mara\">Mara Fenner\u003c/a> und \u003ca href=\"#/artikel/ellyn\">Ellyn Reed\u003c/a>, früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung.\u003c/p>\n\u003ch2>V. Freeman's Rock\u003c/h2>\n\u003cp>Captain \u003ca href=\"#/artikel/varning\">Ryan Varning\u003c/a> verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete \u003ca href=\"#/artikel/freemans-rock\">Freeman's Rock\u003c/a> und bereitete einen Hinterhalt vor. In der Nacht des \u003cstrong>26. Januar\u003c/strong> formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an.\u003c/p>\n\u003cp>Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem \u003ca href=\"#/artikel/beute-cache\">Versteck\u003c/a> außerhalb Aldencross. Varnings kleiner \u003ca href=\"#/artikel/varning-schluessel\">Schlüssel\u003c/a> blieb bei Styke; \u003ca href=\"#/artikel/varlet\">Varlet\u003c/a> wurde Grumblejacks eigener Anteil.\u003c/p>\n\u003cp>Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt.\u003c/p>\n\u003ch2>VI. Türen, Briefe und Gewohnheiten\u003c/h2>\n\u003cp>Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm.\u003c/p>\n\u003cp>In der Nacht \u003cstrong>27./28. Januar\u003c/strong> entdeckten Styke und Vesper den \u003ca href=\"#/artikel/tunnel\">Zwergengang\u003c/a> unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet.\u003c/p>\n\u003cp>Am \u003cstrong>28. Januar\u003c/strong> vermittelte \u003ca href=\"#/artikel/jacobian\">Jacobian Scaramore\u003c/a> einen Kontakt zur Magisterin \u003ca href=\"#/artikel/tacitus\">Tacitus\u003c/a>. Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig.\u003c/p>\n\u003cp>Am selben Tag begann Stykes heimliche Affäre mit \u003ca href=\"#/artikel/kaitlyn\">Kaitlyn Mott\u003c/a>. Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu \u003ca href=\"#/artikel/zack\">Zack Eddarly\u003c/a> fest. Kaitlyns Ehe mit \u003ca href=\"#/artikel/franz\">Franz Mott\u003c/a> wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch.\u003c/p>\n\u003ch2>VII. Das Netz wird dichter\u003c/h2>\n\u003cp>Vespers Arbeitstage am \u003cstrong>29. und 30. Januar\u003c/strong> lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. \u003ca href=\"#/artikel/giuseppe\">Mama Giuseppe\u003c/a> kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen.\u003c/p>\n\u003cp>Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst.\u003c/p>\n\u003cp>Zwischen diesen Unternehmungen blieb das gemeinsame Leben widersprüchlich. Valeria sagte, sie könne Styke und Vesper immer noch hassen und zugleich manchmal wirklich neben ihnen sein wollen. Sie plante wieder über den gleichen Abend hinaus. Der Satz beschrieb ihren gegenwärtigen Widerspruch genauer als jedes Bekenntnis.\u003c/p>\n\u003ch2>VIII. Der 31. Januar\u003c/h2>\n\u003cp>Nun war Varnings Tod in Balentyne bekannt. Zivile Arbeiter mussten mit strengeren Absprachen und Begleitung rechnen. Styke kaufte unter wechselnder Verkleidung Ketten und Beschläge, beschaffte verschiedene Arzneipräparate, Wein und Duftöl. Rattengift kaufte er nicht.\u003c/p>\n\u003cp>Kaitlyn erhielt ein ungleiches persönliches Zukunftsangebot. Styke stellte sich vor, sie könne aus eigenem Interesse eine Konfrontation zwischen Franz und Zack fördern und später soziale Kenntnisse für den Knoten einbringen. Das blieb seine Einschätzung. Sie versprach weder Mitarbeit noch Loyalität; die angekündigte Nachricht mit Treffpunkt und Zeit wurde noch nicht gesandt.\u003c/p>\n\u003cp>Um \u003cstrong>20 Uhr\u003c/strong> trafen Styke, Vesper und Verse Tacitus bei Jacobian. Verse sprach über unvollständige Erinnerungen, neue eigene Gedanken und die Möglichkeit, Vesper zu widersprechen. Das Gespräch zeigte mehr als ein reizvolles magisches Objekt. Während einer Ablenkung gab Vesper verdeckt Abführmittel in Tacitus' einzelnes Glas. Die Magisterin musste das Gespräch vorzeitig verlassen. Sie wurde nicht entführt. Jacobian wollte eine etwaige Fortsetzung vermitteln, aber kein zweiter Termin stand fest.\u003c/p>\n\u003cp>Valeria kam sehr spät zurück. Sie hatte \u003ca href=\"#/artikel/timeon-hof\">Timeons sicheren Aufenthaltsort\u003c/a> persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria.\u003c/p>\n\u003cp>Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht \u003cstrong>8./9. Februar\u003c/strong>, abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an \u003ca href=\"#/artikel/hakon\">Hakon\u003c/a> oder Sakkarot übermittelt.\u003c/p>\n\u003ch2>IX. Der frühe Morgen des 1. Februar\u003c/h2>\n\u003cp>Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu.\u003c/p>\n\u003ch2>X. Der 1. Februar\u003c/h2>\n\u003cp>Vespers Arbeiterdeckung hielt auch unter verschärfter Zählung. Sie half bei Giuseppes Eintopf, fand aber weder Zack noch Donnagin. Am Abend präzisierte die Gruppe den Plan für den 8./9. Februar. Vesper und Valeria erhielten gemeinsam das Vetorecht über neue Gefolgsleute.\u003c/p>\n\u003cp>Sehr spät montierten Styke, Vesper und Valeria zwei schwere Ketten im Tunnel. Zurück im Zimmer fand Vesper im roten Buch einen Absatz, den sie nicht kannte.\u003c/p>\n\u003ch2>XI. Die Suche nach Tamsin\u003c/h2>\n\u003cp>Am 2. Februar kaufte Styke Rattengift, dann ritten die drei nach Süden. Im namenlosen Mühlenbezirk fanden sie Tamsins Spur bei Darran Vell. Tamsin hatte Timeon sicher abgeliefert, war danach aber für eigenes Geld in Darrans kriminelles Geschäft eingestiegen.\u003c/p>\n\u003cp>Styke erzwang zunächst eine Einigung. Vesper entzog Tamsin ihren Rang und setzte sie auf die unterste Stufe des Haushalts zurück. Danach holte die Gruppe Nella aus dem Gasthaus und zeigte ihr, was hinter der Händlerdecke lag.\u003c/p>\n\u003ch2>XII. Vells Ende und Nellas Anfang\u003c/h2>\n\u003cp>Darran Vell und vier seiner Leute starben in der Byre. Nella sah die Tötung unterlegener Männer, erbrach sich, widersprach Styke und blieb dennoch. Im alten Schafgehege hörte sie den Compact of the Bound, setzte ihr Blut darunter und wurde als Gebundene in den Knoten aufgenommen.\u003c/p>\n\u003cp>Ihr erster Auftrag verbindet Hakon mit ihrer eigenen Familie. Bis 7. Februar steht Tamsin unter Nellas begrenzter Einsatzführung und muss sie zugleich beschützen. Der 2. Februar endet im engen Nachtlager. Am Morgen trennen sich ihre Wege.\u003c/p>\n\u003ch2>XIII. Der 3. Februar\u003c/h2>\n\u003cp>Am Morgen trennten sich die Wege. Nella und Tamsin ritten mit Stykes Nachricht, Vorräten und der Frist bis zum 7. Februar zu Hakon und danach in Richtung von Nellas Familie. Styke, Vesper und Valeria kehrten nach Aldencross zurück.\u003c/p>\n\u003cp>Styke verkaufte drei Pferde aus Darran Vells Bestand für 120 gp. Über Jacobian lud er Tacitus für den 8. Februar ins Dalliance ein. Eine neue Wetttafel gab dem Mott-Gerücht erstmals einen öffentlichen Namen: Zack Eddarly, bislang ohne Beweis.\u003c/p>\n\u003cp>Bei der Schneiderin \u003ca href=\"#/artikel/mirelle\">Mirelle\u003c/a> kaufte die Gruppe vier Wäschestücke und begann zwei Maßarbeiten. Mirelle kam am Abend ins rückwärtige Zimmer und blieb nach Essen, Wein und Anproben bei Styke, Vesper und Valeria. Am folgenden Morgen begann die nächste Phase.\u003c/p>\u003ch2>XIV. Der 4. Februar\u003c/h2>\u003cp>Mirelle verließ nach Frühstück und Nachwirkung das Dalliance. Jacobian überbrachte Tacitus’ Zusage für das Essen am 8. Februar, unter der Bedingung, dass er sie begleitet. Vesper hielt ihre Arbeiterdeckung in Balentyne und konnte Zack endlich sicher identifizieren.\u003c/p>\n\u003ch2>XV. Der 5. Februar\u003c/h2>\u003cp>Styke führte Kaitlyn verkleidet aus Aldencross zu einer verlassenen Wassermühle. Dort offenbarte er Branderscar, seine Liebe zu Vesper und den bevorstehenden Untergang der Stadt. Währenddessen setzte Vesper im Mott-Haus die echten Zack-Briefe offen. Kaitlyn kehrte später mit Styke ins Dalliance zurück, las den Compact und wurde Gebundene.\u003c/p>\n\u003ch2>XVI. Der 6. Februar\u003c/h2>\u003cp>Styke kaufte Bücher, Haarfarbe und zwei Schriftrollen. Kaitlyn lehnte die Färbung ab und ging mit Rückkehrtermin 8. Februar zum Mott-Haus. Vesper sah Franz und Zack bei einem angespannten Gespräch und später Zack lebend. Nach Ladenschluss führte Mirelle die Anproben fort, erfuhr vom bevorstehenden Fall Aldencross’, verhandelte eine genaue Handwerksklausel und schloss den Compact. Spätabends legte der Knoten Führung, Schutzaufgaben, Hakons Vorlauf und den Tacitus-Plan fest. Styke, Vesper und Valeria schlafen im Dalliance; dort liegt der aktuelle Rand.\u003c/p>\n\u003ch2>XVII. Der 7. Februar\u003c/h2>\u003cp>Am ersten Licht tötete Franz Mott Zack Eddarly im Duell. Styke brachte Franz bis an Balentynes Tor, wo Captain Barhold ihn entwaffnete und eine Untersuchung begann. Kaitlyn erfuhr Zacks Ende direkt von Styke und kehrte anschließend ins Mott-Haus zurück.\u003c/p>\u003cp>Nella und Tamsin schlossen ihren Auftrag erfolgreich ab. Hakon erhielt die neuen Befehle, Sten und Ketil erschienen als erstes Paar im Dalliance, Mirelles letzte Maßarbeiten wurden fertig und das rote Buch bestätigte mit einer vierten beobachteten Textänderung, dass es sehr wahrscheinlich auf Erlebtes reagiert.\u003c/p>","sources":["chronicle","timeline","live","relations","nella","tamsin-current"],"status":"Bis zum 7. Februar","tags":["Rückblick","Gesamtkampagne","6. Februar"],"aliases":[],"text":"I. Die Verurteilten von Branderscar Die Geschichte begann für Styke und Vesper nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in Branderscar . Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, Verse zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt. Tiadora öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten Verse zurück und befreiten Grumblejack . Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl Tamsin Blackerly als auch Matilda Richter die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet. II. Thorns Haus und der Knoten Der Weg führte zu Adrastus Thorn . Der Pakt der Dornen , die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen. Dame Balina und ihr junger Knappe Timeon gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen. Aus derselben Frau wurde Valeria . Sie nahm später einen Privatpakt an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. Timeon blieb außerhalb dieses Pakts. Elise Zadaria führte ihre White Ravens währenddessen über eine getrennte Befehlskette. III. Die Fahrt nach Norden Auf der Frosthamar wurde die Verschwörung praktisch: Waffen mussten zu Sakkarot Fire-Axe gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter Edward Sambryl . Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit White Tusk und den Yutak brachte Handel und wertvolles Elfenbein. Am 14. Januar 4712 AR erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt. Kargeld Odenkirk starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. Hakon , Sten , Ketil , Eirik , Arved und Torvald hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit Grumblejack als freiem Freund. IV. Unter fremdem Dach Am 23. Januar kamen Styke, Vesper und Valeria als freie Händler aus dem Norden nach Aldencross . Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im Lord's Dalliance wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags. Mara Fenner und Ellyn Reed , früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung. V. Freeman's Rock Captain Ryan Varning verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete Freeman's Rock und bereitete einen Hinterhalt vor. In der Nacht des 26. Januar formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an. Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem Versteck außerhalb Aldencross. Varnings kleiner Schlüssel blieb bei Styke; Varlet wurde Grumblejacks eigener Anteil. Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt. VI. Türen, Briefe und Gewohnheiten Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm. In der Nacht 27./28. Januar entdeckten Styke und Vesper den Zwergengang unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet. Am 28. Januar vermittelte Jacobian Scaramore einen Kontakt zur Magisterin Tacitus . Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig. Am selben Tag begann Stykes heimliche Affäre mit Kaitlyn Mott . Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu Zack Eddarly fest. Kaitlyns Ehe mit Franz Mott wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch. VII. Das Netz wird dichter Vespers Arbeitstage am 29. und 30. Januar lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. Mama Giuseppe kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen. Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst. Zwischen diesen Unternehmungen blieb das gemeinsame Leben n Licht tötete Franz Mott Zack Eddarly im Duell. Styke brachte Franz bis an Balentynes Tor, wo Captain Barhold ihn entwaffnete und eine Untersuchung begann. Kaitlyn erfuhr Zacks Ende direkt von Styke und kehrte anschließend ins Mott-Haus zurück. Nella und Tamsin schlossen ihren Auftrag erfolgreich ab. Hakon erhielt die neuen Befehle, Sten und Ketil erschienen als erstes Paar im Dalliance, Mirelles letzte Maßarbeiten wurden fertig und das rote Buch bestätigte mit einer vierten beobachteten Textänderung, dass es sehr wahrscheinlich auf Erlebtes reagiert.","search":"die geschichte bisher von branderscar bis zur spaten nacht des 7 februar der knoten steht einen tag vor der hauptaktion gegen balentyne ruckblick gesamtkampagne 6 februar i die verurteilten von branderscar die geschichte begann fur styke und vesper nicht mit einem auftrag den rechtschaffene abenteurer hatten ablehnen konnen sie waren gefangene in branderscar vespers geschichte fuhrte dorthin uber ein kirchliches archiv ein erwachtes reliquiar und ihre weigerung verse zuruckzulassen dame balina von karfeld war an ihrer gefangennahme beteiligt tiadora offnete eine moglichkeit zur flucht styke und vesper nutzten sie holten verse zuruck und befreiten grumblejack der oger ging als freier gefahrte nicht als beute in unserer kampagne uberlebten sowohl tamsin blackerly als auch matilda richter die auseinandersetzungen tamsins spatere rolle erwuchs aus einem blutpakt richter wurde nicht durch eine gedruckte standardfassung nachtraglich getotet ii thorns haus und der knoten der weg fuhrte zu adrastus thorn der pakt der dornen die neun lektionen und etwa neunzig tage ausbildung machten aus der flucht eine dauerhafte verstrickung thorn war auftraggeber und autoritat aber nicht das selbstlose ziel der bindung zwischen styke und vesper beide sprachen davon ihn zu uberleben und macht fur eine eigene gemeinsame zukunft zu gewinnen dame balina und ihr junger knappe timeon gerieten im umfeld dieser prufungen in gefangenschaf
