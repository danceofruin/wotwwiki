ian legt das treffen auf 31 januar 20 uhr valeria gewinnt beim trinken mit barnabus torhausinformationen die sie noch nicht nuchtern berichtet mara berichtet von winterkrankheiten spater vertieft sich die personliche vertrautheit zwischen mara und dem trio ohne missionswissen oder rekrutierung"},{"id":"zeit-0131-tag","category":"chronik","title":"Varnings Tod wird bekannt","summary":"Strengere Sicherheit, Besorgungen und ein noch nicht angenommenes Angebot.","body":"\u003cp>Mara berichtet von der bestätigten Todesnachricht und strengerem Zivilzugang. \u003ca href=\"#/artikel/styke\">Styke\u003c/a> besorgt \u003ca href=\"#/artikel/ketten-beschlaege\">Ketten und Beschläge\u003c/a>, \u003ca href=\"#/artikel/tinkturen\">drei Präparate\u003c/a>, Wein und Duftöl. Rattengift fehlt weiterhin. Er besucht Kaitlyn, hinterlässt eine Duftspur und spricht ein ungleiches Zukunftsangebot aus. Eine zugesagte Zusammenarbeit oder Einladung mit Zeit und Ort existiert noch nicht.\u003c/p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-31T10","dateLabel":"31. Januar, tagsüber","text":"Mara berichtet von der bestätigten Todesnachricht und strengerem Zivilzugang. Styke besorgt Ketten und Beschläge , drei Präparate , Wein und Duftöl. Rattengift fehlt weiterhin. Er besucht Kaitlyn, hinterlässt eine Duftspur und spricht ein ungleiches Zukunftsangebot aus. Eine zugesagte Zusammenarbeit oder Einladung mit Zeit und Ort existiert noch nicht.","links":["styke","ketten-beschlaege","tinkturen"],"backlinks":[],"search":"varnings tod wird bekannt strengere sicherheit besorgungen und ein noch nicht angenommenes angebot aldencross mara berichtet von der bestatigten todesnachricht und strengerem zivilzugang styke besorgt ketten und beschlage drei praparate wein und duftol rattengift fehlt weiterhin er besucht kaitlyn hinterlasst eine duftspur und spricht ein ungleiches zukunftsangebot aus eine zugesagte zusammenarbeit oder einladung mi  timeon sicher angetroffen und keine brauchbare spur zu tamsin gefunden styke beendet die suche und untersagt ihre ruckkehr zu timeon valeria akzeptiert die handlungsvorgabe nicht die ausloschung ihrer fruheren bindungen sie berichtet von winden besetzung und sandabwehr im torhaus donnagins routine wird ihr nachster schwerpunkt der 8 9 februar ist ein bedingter angriffsplan nicht bereits eine ubermittelte absprache mit der feldgruppe gemeinsame nahe und fursorge folgen dann schlaf die ketten werden nicht montiert"},{"id":"zeit-0201","category":"chronik","title":"Der frühe Morgen des 1. Februar","summary":"Vesper bricht mit Verse auf; Styke bringt Valeria Frühstück. Der Tag öffnet mehrere getrennte Wege.","body":"\u003ch2>Der Morgen teilt die Gruppe\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> nimmt \u003ca href=\"#/artikel/verse\">Verse\u003c/a> und versucht erneut, über den zivilen Arbeitsweg nach Balentyne zu gelangen. Styke bittet sie, nach \u003ca href=\"#/artikel/zack\">Zack Eddarly\u003c/a> zu sehen, möglichst nach Dienstzuweisung und Gesicht statt nach weiterem Gerücht.\u003c/p>\n\u003cp>Styke bleibt im \u003ca href=\"#/artikel/dalliance\">Dalliance\u003c/a>, frühstückt und bringt später Essen zu \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a>. Was zwischen ihnen danach geschieht, hat eine eigene private Akte und gehört nicht in die öffentliche Chronik.\u003c/p>\n\u003cp>Der Morgen endet nicht mit einem neuen Auftrag, sondern mit auseinanderlaufenden Fäden: Vesper in der Festung, Valeria später wieder im Bett, Styke bei Karten, Training und den Stimmen des Gasthauses.\u003c/p>\n\u003cp>\u003ca href=\"#/artikel/zeit-0201-spaeter\">Zum späteren 1. Februar\u003c/a>.\u003c/p>","sources":["live","chronicle"],"status":"Bestätigt","tags":["Aktueller Morgen"],"aliases":[],"date":"4712-02-01","dateLabel":"1. Februar, früher Morgen","text":"Der Morgen teilt die Gruppe Vesper nimmt Verse und versucht erneut, über den zivilen Arbeitsweg nach Balentyne zu gelangen. Styke bittet sie, nach Zack Eddarly zu sehen, möglichst nach Dienstzuweisung und Gesicht statt nach weiterem Gerücht. Styke bleibt im Dalliance , frühstückt und bringt später Essen zu Valeria . Was zwischen ihnen danach geschieht, hat eine eigene private Akte und gehört nicht in die öffentliche Chronik. Der Morgen endet nicht mit einem neuen Auftrag, sondern mit auseinanderlaufenden Fäden: Vesper in der Festung, Valeria später wieder im Bett, Styke bei Karten, Training und den Stimmen des Gasthauses. Zum späteren 1. Februar .","search":"der fruhe morgen des 1 februar vesper bricht mit verse auf styke bringt valeria fruhstuck der tag offnet mehrere getrennte wege aktueller morgen der morgen teilt die gruppe vesper nimmt verse und versucht erneut uber den zivilen arbeitsweg nach balentyne zu gelangen styke bittet sie nach zack eddarly zu sehen moglichst nach dienstzuweisung und gesicht statt nach weiterem gerucht styke bleibt im dalliance fruhstuckt und bringt spater essen zu valeria was zwischen ihnen danach geschieht hat eine eigene private akte und gehort nicht in die offentliche chronik der morgen endet nicht mit einem neuen auftrag sondern mit auseinanderlaufenden faden vesper in der festung valeria spater wieder im bett styke bei karten training und den stimmen des gasthauses zum spateren 1 februar","links":["vesper","verse","zack","dalliance","valeria","zeit-0201-spaeter"],"backlinks":[]},{"id":"kollektiv","category":"regeln","title":"Kollektiv und Telepathie","summary":"Bewusste Kommunikation innerhalb von 140 ft, kein gemeinsames allwissendes Bewusstsein.","body":"\u003ch2>Mitglieder\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> ist Ursprung und zählt nicht gegen das Limit von vier willigen Kreaturen. \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> und \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> sind die derzeit bestätigten Mitglieder. Zwei Plätze bleiben frei. \u003ca href=\"#/artikel/verse\">Verse\u003c/a>, \u003ca href=\"#/artikel/zorn\">Zorn\u003c/a>, \u003ca href=\"#/artikel/grumblejack\">Grumblejack\u003c/a>, \u003ca href=\"#/artikel/timeon\">Timeon\u003c/a> und Tamsin gehören nicht automatisch dazu.\u003c/p>\n\u003ch2>Reichweite und Wissen\u003c/h2>\n\u003cp>Aktuell \u003cstrong>140 ft von Styke\u003c/strong>. Übermittelt wird bewusst gesprochene mentale Kommunikation. Keine automatischen Erinnerungen, Gefühle, Sinneseindrücke, Gedanken oder Offscreen-Berichte. Der Aufbruch Vespers meldet daher weder ihre Position noch ihren Erfolg an Styke.\u003c/p>\n\u003ch2>Mechanische Anwendungen\u003c/h2>\n\u003cp>Commitment und weitere Zelotfähigkeiten nutzen die gültige Verbindung. Reichweite, willige Teilnahme und tatsächliche Ressourcenausgaben bleiben zu prüfen. \u003ca href=\"#/artikel/aid\">Aid und Recovery\u003c/a>, \u003ca href=\"#/artikel/martyrdom\">Martyrdom\u003c/a> und \u003ca href=\"#/artikel/echoes\">Echoes of Steel\u003c/a> stehen als eigene Karten zur Verfügung.\u003c/p>\n","sources":["house","ssheet","live"],"status":"Bestätigt","tags":["Psionik","Kommunikation"],"aliases":[],"text":"Mitglieder Styke ist Ursprung und zählt nicht gegen das Limit von vier willigen Kreaturen. Vesper und Valeria sind die derzeit bestätigten Mitglieder. Zwei Plätze bleiben frei. Verse , Zorn , Grumblejack , Timeon und Tamsin gehören nicht automatisch dazu. Reichweite und Wissen Aktuell 140 ft von Styke . Übermittelt wird bewusst gesprochene mentale Kommunikation. Keine automatischen Erinnerungen, Gefühle, Sinneseindrücke, Gedanken oder Offscreen-Berichte. Der Aufbruch Vespers meldet daher weder ihre Position noch ihren Erfolg an Styke. Mechanische Anwendungen Commitment und weitere Zelotfähigkeiten nutzen die gültige Verbindung. Reichweite, willige Teilnahme und tatsächliche Ressourcenausgaben bleiben zu prüfen. Aid und Recovery , Martyrdom und Echoes of Steel stehen als eigene Karten zur Verfügung.","links":["styke","vesper","valeria","verse","zorn","grumblejack","timeon","a usammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt.\u003c/p>\n\u003cp>Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an.\u003c/p>\n\u003ch2>Spezifische Anpassungen\u003c/h2>\n\u003cp>Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen drei Powers Known getrennt. Arcane Enlightenment liefert Vesper vier täglich wechselbare temporäre Oracle-Zauber.\u003c/p>\n\u003cp>Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. \u003ca href=\"#/artikel/animus\">Animus und Glyphen\u003c/a> erläutert die derzeit aktiven Werte.\u003c/p>\n\u003ch2>Zahlen, die nicht stillschweigend repariert werden\u003c/h2>\n\u003cp>Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Valerias rüstungsabhängige Ride-Berechnung und Stykes drittes Talent bleiben offen. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.\u003c/p>\n","sources":["house","localrules","ssheet","vsheet","valsheet"],"status":"Bestätigt","tags":["Hausregel","Spielkontrolle"],"aliases":[],"text":"Kontrolle der Figuren Styke bleibt vollständig spielergesteuert. Vesper handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. Valeria bleibt auch im Kampf ein autonomer GM-geführter DMPC. Stufe und Fortschritt Alle drei sind gegenwärtig Stufe 5. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter OOC: Buildplanung . Sie ist kein gegenwärtiges Ereignis. Wissensfertigkeiten und Routine Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt. Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an. Spezifische Anpassungen Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen drei Powers Known getrennt. Arcane Enlightenment liefert Vesper vier täglich wechselbare temporäre Oracle-Zauber. Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. Animus und Glyphen erläutert die derzeit aktiven Werte. Zahlen, die nicht stillschweigend repariert werden Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Valerias rüstungsabhängige Ride-Berechnung und Stykes drittes Talent bleiben offen. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.","links":["styke","vesper","valeria","buildplanung","animus"],"backlinks":[],"search":"hausregeln und spielkonventionen die kampagnenspezifischen abweichungen neben den drei aktuellen bogen hausregel spielkontrolle kontrolle der figuren styke bleibt vollstandig spielergesteuert vesper handelt ausserhalb strukturierter initiative autonom ihre entscheidungen und begrenzten ressourcen im kampf steuert der spieler valeria bleibt auch im kampf ein autonomer gm gefuhrter dmpc stufe und fortschritt alle drei sind gegenwartig stufe 5 die bereits besprochene zukunftige gruppen buildplanung steht getrennt unter ooc buildplanung sie ist kein gegenwartiges ereignis wissensfertigkeiten und routine knowledge all fasst die wissensgebiete auf den entsprechend gefuhrten bogen zusammen valerias geerbter fertigkeitsblock ist noch nicht vollstandig in diese form umgerechnet die belegten werte werden nicht heimlich neu verteilt legales take 10 hat bei unbedrangter routine vorrang keine wurfe nur damit uberhaupt gewurfelt wird stykes power attack ist standardmassig an spezifische anpassungen deadly agility funktioniert bei styke mit dem zweihandigen grossschwert und dem festgelegten dex multiplikator das kollektiv ist bewusste kommunikation stykes grad 0 talente sind von seinen drei powers known getrennt arcane enlightenment liefert vesper vier taglich wechselbare temporare oracle zauber vespers radiant dawn training entwickelt sich nach dem bezahlten einstieg automatisch entlang der martial training linie ihr zusatzliches animus glyph paket ist begrenzt und keine zweite volle initiatorprogression animus und glyphen erlautert die derzeit aktiven werte zahlen die nicht stillschweigend repariert werden die hp der aktuellen bogen gelten obwohl altere aussagen zur globalen hp formel nicht luckenlos dazu passen valerias rustungsabhangige ride berechnung und stykes drittes talent bleiben offen keine fremde regelversion ersetzt hier ohne beschluss einen kampagnenwert"},{"id":"buildplanung","category":"regeln","title":"OOC: bereits besprochene Buildplanung","summary":"Ausdrücklich keine aktive Klassenänderung und kein vorweggenommenes Story-Ereignis.","body":"\u003ch2>Status dieses Eintrags\u003c/h2>\n\u003cp>Diese Planung stand bereits auf den vorherigen Spielerbögen. Sie wird hier getrennt geführt, damit gegenwärtige Charakterwerte nicht mit zukünftigen Möglichkeiten verwechselt werden. Sie ist \u003cstrong>OOC-Metawissen\u003c/strong>, kein Beweis über künftige Entscheidungen der Figuren.\u003c/p>\n\u003ch2>Der nächste Gruppenmeilenstein\u003c/h2>\n\u003cp>Der nächste nominelle Aufstieg auf Stufe 6 wird einmalig durch einen Gruppenmeilenstein ersetzt: \u003ca href=\"#/artikel/styke\">Styke\u003c/a> und \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> bleiben Stufe 5, \u003ca href=\"#/artikel/valeria\">Valeria\u003c/a> wird ein vollwertiges dauerhaftes Kern-DMPC-Mitglied und bleibt ebenfalls Stufe 5. Danach gilt wieder die weitere vereinbarte Meilensteinprogression.\u003c/p>\n\u003ch2>Valeria\u003c/h2>\n\u003cp>Die besprochene Richtung ist ein stufenneutraler Rebuild zu \u003cstrong>Antipaladin 5, Lord of Darkness, Asmodeus\u003c/strong>. Er ist nicht aktiv. Ein echter angenommener Story-Trigger und Valerias bindende Entscheidung sind Voraussetzung; weder Gefangenschaft noch Intimität oder bloße Terminplanung ersetzen diesen Moment. Bis dahin gelten ausschließlich Fighter-5-Werte. Ein vollständiger neuer Antipaladin-Statblock wird hier nicht vorweggenommen.\u003c/p>\n\u003ch2>Styke\u003c/h2>\n\u003cp>Awakened Blade ist das Buildziel ab einem tatsächlichen späteren Aufstieg auf Charakterstufe 6. Acrobatics 5 und Autohypnosis 4 sind im aktuellen Bogen dafür gesetzt. Das Ziel verleiht noch keine Prestige-Klassenfähigkeiten.\u003c/p>\n","sources":["house","localrules","ssheet","valeria"],"status":"OOC / inaktiv","tags":["Buildplanung"],"aliases":[],"text":"Status dieses Eintrags Diese Planung stand bereits auf den vorherigen Spielerbögen. Sie wird hier getrennt geführt, damit gegenwärtige Charakterwerte nicht mit zukünftigen Möglichkeiten verwechselt werden. Sie ist OOC-Metawissen , kein Beweis über künftige Entscheidungen der Figuren. Der nächste Gruppenmeilenstein Der nächste nominelle Aufstieg auf Stufe 6 wird einmalig durch einen Gruppenmeilenstein ersetzt: Styke und Vesper bleiben Stufe 5, Valeria wird ein vollwertiges dauerhaftes Kern-DMPC-Mitglied und bleibt ebenfalls Stufe 5. Danach gilt wieder die weitere vereinbarte Meilensteinprogression. Valeria Die besprochene Richtung ist ein stufenneutraler Rebuild zu Antipaladin 5, Lord of Darkness, Asmodeus . Er ist nicht aktiv. Ein echter angenommener Story-Trigger und Valerias bindende Entscheidung sind Voraussetzung; weder Gefangenschaft noch Intimität oder bloße Terminplanung ersetzen diesen Moment. Bis dahin gelten ausschließlich Fighter-5-Werte. Ein vollständiger neuer Antipaladin-Statblock wird hier nicht vorweggenommen. Styke Awakened Blade ist das Buildziel ab einem tatsächlichen späteren Aufstieg auf Charakterstufe 6. Acrobatics 5 und Autohypnosis 4 sind im aktuellen Bogen dafür gesetzt. Das Ziel verleiht noch keine Prestige-Klassenfähigkeiten.","links":["styke","vesper","valeria"],"backlinks":["hausregeln","bogen-styke","bogen-valeria"],"search":"ooc bereits besprochene buildplanung ausdrucklich keine aktive klassenanderung und kein vorweggenommenes story ereignis buildplanung status dieses eintrags diese planung stand bereits auf den vorherigen spielerbogen sie wird hier getrennt gefuhrt damit gegenwartige charakterwerte nicht mit zukunftigen moglichkeiten verwechselt werden sie ist ooc metawissen kein beweis uber kunftige entscheidungen der figuren der nachste gruppenmeilenstein der nachste nominelle aufstieg auf stufe 6 wird einmalig durch einen gruppenmeilenstein ersetzt styke und vesper bleiben stufe 5 valeria wird ein vollwertiges dauerhaftes kern dmpc mitglied und bleibt ebenfalls stufe 5 danach gilt wieder die weitere vereinbarte meilensteinprogression valeria die besprochene richtung ist ein stufenneutraler rebuild zu antipaladin 5 lord of darkness asmodeus er ist nicht aktiv ein echter angenommener story trigger und valerias bindende entscheidung sind voraussetzung weder gefangenschaft noch intimitat oder blosse terminplanung ersetzen diesen moment bis dahin gelten ausschliesslich fighter 5 werte ein vollstandiger neuer antipaladin statblock wird hier nicht vorweggenommen styke awakened blade ist das buildziel ab einem tatsachlichen spateren aufstieg auf charakterstufe 6 acrobatics 5 und autohypnosis 4 sind im aktuellen bogen dafur gesetzt das ziel verleiht noch keine prestige klassenfahigkeiten"},{"id":"arcane-enlightenment","category":"regeln","title":"Arcane Enlightenment","summary":"Vier täglich wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known.","body":"\u003cp>\u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar.\u003c/p>\n\u003ch2>Standardauswahl\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/dancing-darkness\">Dancing Darkness\u003c/a>, \u003ca href=\"#/artikel/silent-image\">Silent Image\u003c/a>, \u003ca href=\"#/artikel/euphoric-cloud\">Euphoric Cloud\u003c/a> und \u003ca href=\"#/artikel/ashen-path\">Ashen Path\u003c/a>. Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.\u003c/p>\n","sources":["vsheet","house","localrules"],"status":"Bestätigt","tags":["Vesper","Zauber"],"aliases":[],"text":"Vesper kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar. Standardauswahl Dancing Darkness , Silent Image , Euphoric Cloud und Ashen Path . Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.","links":["vesper","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"backlinks":["detect-magic","create-water","purify-food-drink","read-magic","guidance","enhanced-diplomacy","obscuring-mist","protection-from-evil","air-bubble","remove-sickness","cure-light-wounds","unnatural-lust","identify","delay-poison","lesser-restoration","cure-moderate-wounds","tongues","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"search":"arcane enlightenment vier taglich wahlbare sorcerer wizard zauber als temporare oracle spells known vesper zauber vesper kann beim taglichen auffrischen mit lore spirit vier passende sorcerer wizard zauber wahlen in der kampagnenfassung gelten sie fur diesen tag als temporare oracle spells known und werden spontan uber ihre normalen oracle slots und cha gewirkt gegenwartig sind nur zaubergrade bis 2 wirkbar standardauswahl dancing darkness silent image euphoric cloud und ashen path die auswahl ist keine weitere unabhangige slotreserve ein tageswechsel der auswahl und tatsachlich verbleibende slots werden nicht von dieser website adjudiziert"},{"id":"animus","category":"regeln","title":"Animus, Essence und Martial Glyphs","summary":"Vespers aktuelles Zusatzpaket: virtueller Rang 1, IL 6, CHA +4.","body":"\u003ch2>Animus\u003c/h2>\n\u003cp>Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält \u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> \u003cstrong>5 Animus\u003c/strong>, zu Beginn jedes weiteren eigenen Zuges \u003cstrong>+1\u003c/strong>. Am Rundenende gibt es \u003cstrong>+1\u003c/strong>, falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende.\u003c/p>\n\u003ch2>Glyphen anwenden\u003c/h2>\n\u003cp>Kosten \u003cstrong>1 Animus\u003c/strong>. Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite \u003cstrong>40 ft\u003c/strong>, Dauer \u003cstrong>5 Runden\u003c/strong>, DC \u003cstrong>17\u003c/strong>. Erneute Anwendung stapelt und verlängert denselben Glyphen nicht.\u003c/p>\n\u003ch2>Bekannte Glyphen\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/elemental-shield\">Elemental Shield\u003c/a>, \u003ca href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade\u003c/a>, \u003ca href=\"#/artikel/ghost-armor\">Ghost Armor\u003c/a>, \u003ca href=\"#/artikel/deflective-armor\">Deflective Armor\u003c/a> und \u003ca href=\"#/artikel/shadowmeld\">Shadowmeld\u003c/a>.\u003c/p>\n\u003ch2>Essence ist etwas anderes\u003c/h2>\n\u003cp>Vesper besitzt \u003cstrong>2 Essence\u003c/strong>, Kapazität \u003cstrong>1\u003c/strong> pro Receptacle. Standardmäßig liegt 1 in \u003ca href=\"#/artikel/spoils-of-war\">Spoils of War\u003c/a>, der zweite Punkt ist für \u003ca href=\"#/artikel/witness-to-glory\">Witness to Glory\u003c/a> vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.\u003c/p>\n","sources":["vsheet","vrules","localrules"],"status":"Bestätigt","tags":["Vesper","Glyph","Essence"],"aliases":[],"text":"Animus Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält Vesper 5 Animus , zu Beginn jedes weiteren eigenen Zuges +1 . Am Rundenende gibt es +1 , falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende. Glyphen anwenden Kosten 1 Animus . Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 40 ft , Dauer 5 Runden , DC 17 . Erneute Anwendung stapelt und verlängert denselben Glyphen nicht. Bekannte Glyphen Elemental Shield , Ghost Eating Blade , Ghost Armor , Deflective Armor und Shadowmeld . Essence ist etwas anderes Vesper besitzt 2 Essence , Kapazität 1 pro Receptacle. Standardmäßig liegt 1 in Spoils of War , der zweite Punkt ist für Witness to Glory vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.","links":["vesper","elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld","spoils-of-war","witness-to-glory"],"backlinks":["hausregeln","elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld"],"search":"animus essence und martial glyphs vespers aktuelles zusatzpaket virtueller rang 1 il 6 cha 4 vesper glyph essence animus ausserhalb eines kampfes kein ausgebbarer pool zu beginn ihres ersten eigenen zuges erhalt vesper 5 animus zu beginn jedes weiteren eigenen zuges 1 am rundenende gibt es 1 falls sie in dieser runde mindestens ein manover initiiert hat der pool besteht bis eine minute nach begegnungsende glyphen anwenden kosten 1 animus anwendung als swift action oder hochstens einmal pro runde als free action nach einem treffer mit einem martial strike ein gewohnlicher treffer genugt nicht reichweite 40 ft dauer 5 runden dc 17 erneute anwendung stapelt und verlangert denselben glyphen nicht bekannte glyphen elemental shield ghost eating blade ghost armor deflective armor und shadowmeld essence ist etwas anderes vesper besitzt 2 essence kapazitat 1 pro receptacle standardmassig liegt 1 in spoils of war der zweite punkt ist fur witness to glory vorgesehen in einem verbrauchten manover bleibt essence bis zu dessen recovery gebunden umlagern kostet grundsatzlich eine swift action ein vorgesehener einsatz ist keine automatische erlaubnis eine spielerressource auszugeben"},{"id":"aid","category":"faehigkeiten","title":"Aid / Compartmentalized Aid","summary":"Move Action, gegnerspezifischer Angriffsbonus und Recovery bis zu drei Manöver.","body":"\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> nutzt seine \u003cstrong>Move Action\u003c/strong> zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners \u003cstrong>+4 auf seine Angriffe gegen dieses Ziel\u003c/strong> bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel.\u003c/p>\n\u003cp>Die Anwendung stellt sofort bis zu \u003cstrong>3 geeignete verbrauchte vorbereitete Manöver\u003c/strong> wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.\u003c/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Styke nutzt seine Move Action zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners +4 auf seine Angriffe gegen dieses Ziel bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel. Die Anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete Manöver wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.","links":["styke"],"backlinks":["zorn","kollektiv","bogen-styke"],"search":"aid compartmentalized aid move action gegnerspezifischer angriffsbonus und recovery bis zu drei manover styke klassenfahigkeit styke nutzt seine move action zur selbsthilfe gegen einen benannten gegner bei gultigem aid ergebnis gilt durch helpful harrying partners 4 auf seine angriffe gegen dieses ziel bis zum beginn seines nachsten zuges kein allgemeines 4 gegen jedes ziel die anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete manover wieder her selbst wenn der aid versuch misslingt im selben eigenen zug gerade initiierte manover sind fur diese anwendung ausgeschlossen aid aus einer anderen aktionsquelle lost diese recovery nicht aus der etablierte kampfmotor aktiviert zeal"},{"id":"zeal","category":"faehigkeiten", 03c/td>\n\u003ctd>Ohne Rüstung / Mithralkettenhemd + \u003ca href=\"#/artikel/the-caged-sun\">The Caged Sun\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Touch AC\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>14 / 15\u003c/strong>\u003c/td>\n\u003ctd>Ohne / mit The Caged Sun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Flat-Footed\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>10 / 15\u003c/strong>\u003c/td>\n\u003ctd>Ohne Rüstung / Mithralkettenhemd + The Caged Sun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Initiative\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+6\u003c/strong>\u003c/td>\n\u003ctd>+4 DEX, +2 Gemeinsamer Impuls\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Speed\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>30 ft\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>BAB\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+4\u003c/strong>\u003c/td>\n\u003ctd>Zelot 4 + Psion 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CMB\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+6 / +7\u003c/strong>\u003c/td>\n\u003ctd>ohne / mit The Caged Sun\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CMD\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>20 / 21\u003c/strong>\u003c/td>\n\u003ctd>ohne / mit The Caged Sun\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>Rettungswürfe\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Save\u003c/th>\n\u003cth style=\"text-align:right\">Total mit The Caged Sun\u003c/th>\n\u003cth style=\"text-align:right\">Ohne The Caged Sun\u003c/th>\n\u003cth style=\"text-align:right\">Basis\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Fortitude\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+6\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">+5\u003c/td>\n\u003ctd style=\"text-align:right\">+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reflex\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">+6\u003c/td>\n\u003ctd style=\"text-align:right\">+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Will\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+8\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">+7\u003c/td>\n\u003ctd style=\"text-align:right\">+6\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cem>Cloak of Resistance +1 ist eingerechnet. Immortal Spark gibt zusätzlich +2 gegen Todeseffekte. Carnal Frailty gibt -2 gegen sexuelle Ablenkung, Verführung und vergleichbare Effekte.\u003c/em>\u003c/p>\n\u003chr/>\n\u003ch2>Angriffe\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Angriff\u003c/th>\n\u003cth style=\"text-align:right\">Treffer\u003c/th>\n\u003cth style=\"text-align:right\">Schaden\u003c/th>\n\u003cth style=\"text-align:right\">Kritisch\u003c/th>\n\u003cth style=\"text-align:right\">Reichweite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>+1 Großschwert\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+10\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>2d6+7\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">19-20/x2\u003c/td>\n\u003ctd style=\"text-align:right\">Nahkampf\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>+1 Großschwert, Power Attack\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+8\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>2d6+13\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">19-20/x2\u003c/td>\n\u003ctd style=\"text-align:right\">Nahkampf\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/suns-gleam\">Sun's Gleam\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9 Ranged Touch\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>1d6+3 Force\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">-\u003c/td>\n\u003ctd style=\"text-align:right\">30 ft\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Waffenlos\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">1d3+2 nonlethal\u003c/td>\n\u003ctd style=\"text-align:right\">x2\u003c/td>\n\u003ctd style=\"text-align:right\">Nahkampf\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cem>Angriffswerte enthalten The Caged Sun. Ohne die Haltung jeweils -1. Das +1-Großschwert liefert +1 Angriff und +1 Schaden. Bei BAB +4 gibt Power Attack -2 Angriff und mit einer zweihändig geführten Waffe +6 Schaden. Deadly Agility funktioniert per Hausregel mit dem Großschwert und verwendet den zweihändigen Schadensmultiplikator, hier +6 DEX-Schaden.\u003c/em>\u003c/p>\n\u003chr/>\n\u003ch2>Fertigkeiten\u003c/h2>\n\u003cp>\u003cstrong>Neue Ränge durch Psion 1:\u003c/strong> 4.\u003cbr/>\n\u003cstrong>Gesamtränge:\u003c/strong> 28.\u003cbr/>\nFür den Awakened-Blade-Einstieg wurde ein zuvor gesetzter Stealth-Rang nach Autohypnosis verschoben; die vier neuen Ränge gehen in Acrobatics +2 und Autohypnosis +2.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Skill\u003c/th>\n\u003cth style=\"text-align:right\">Ranks\u003c/th>\n\u003cth style=\"text-align:right\">Total\u003c/th>\n\u003cth>Notiz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Acrobatics\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>Voraussetzung Awakened Blade erfüllt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Autohypnosis\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>4\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit; Voraussetzung erfüllt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Craft (Weapons)\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Diplomacy\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">1\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Intimidate\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">3\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+11\u003c/strong>\u003c/td>\n\u003ctd>inkl. Trait\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Knowledge (All)\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>Duett-Hausregel; deckt Knowledge (martial/psionics)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Perception\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">4\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stealth\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>3\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+10\u003c/strong>\u003c/td>\n\u003ctd>Mithralkettenhemd ACP 0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cem>Informant-Psicrystal unterstützt passende Knowledge-(All)-Checks pauschal mit +2.\u003c/em>\u003c/p>\n\u003chr/>\n\u003ch2>Talente\u003c/h2>\n\u003ch3>Reguläre und zusätzliche Talente\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Extra Conviction\u003c/strong>: Personality Fragment.\u003c/li>\n\u003cli>\u003cstrong>Power Attack\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Deadly Agility\u003c/strong>: Hausregel erlaubt Großschwert.\u003c/li>\n\u003cli>\u003cstrong>Advanced Study\u003c/strong>: lernt \u003cstrong>\u003ca href=\"#/artikel/chains-of-doubt\">Chains of Doubt\u003c/a>\u003c/strong> und \u003cstrong>\u003ca href=\"#/artikel/reflective-blade-style\">Reflective Blade Style\u003c/a>\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Extra Readied Maneuver\u003c/strong>: durch Retraining des alten Stufe-1-Talents \u003cstrong>Unlocked Talent\u003c/strong>; +1 vorbereitetes Manöver.\u003c/li>\n\u003c/ul>\n\u003ch3>Bonus- und gewonnene Talente\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Psionic Body\u003c/strong>: Psion-1-Bonusfeat. Aktuell zwei psionische Talente, daher insgesamt \u003cstrong>+4 HP\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Combat Reflexes\u003c/strong>: über Combat Conviction.\u003c/li>\n\u003cli>\u003cstrong>Psionic Meditation\u003c/strong>: über Psionic Conviction.\u003c/li>\n\u003cli>\u003cstrong>Harrying Partners\u003c/strong>: Teamwork-Talent über Targeting Array, von Styke und Psicrystal geteilt.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Zelot 4\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/zeal\">Zeal +1\u003c/a>:\u003c/strong> Ein getroffener Strike gibt den Collective-Mitgliedern 1 Runde +1 Moralbonus auf Angriffe.\u003c/li>\n\u003cli>\u003cstrong>Collective:\u003c/strong> bis zu 4 willige Kreaturen, 140 ft; Styke zählt nicht gegen das Limit.\u003c/li>\n\u003cli>\u003cstrong>Telepathy:\u003c/strong> Kommunikation innerhalb des Collective.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/aid\">Compartmentalized Aid\u003c/a>:\u003c/strong> Aid Another auf sich selbst als Move Action; aktiviert Zeal und stellt bis zu 3 geeignete verbrauchte Manöver wieder her.\u003c/li>\n\u003cli>\u003cstrong>Commitment:\u003c/strong> Aid Another auf Collective-Mitglieder innerhalb der Collective-Reichweite.\u003c/li>\n\u003cli>\u003cstrong>Burning Contemplation:\u003c/strong> CHA statt WIS für Voraussetzungen psionischer Talente.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/martyrdom\">Martyrdom\u003c/a>:\u003c/strong> bis zu 20 Schaden von einem willigen Collective-Mitglied übernehmen; bis zu 4 PP zur Reduktion um 3 Schaden pro PP, mindestens 1 Schaden bleibt.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/echoes\">Echoes of Steel\u003c/a>:\u003c/strong> bei einem Manöver mindestens 1 Grad unter dem höchsten verfügbaren Grad kann Styke PP in Höhe des Manövergrades ausgeben und einem Collective-Mitglied eine Nutzung innerhalb 1 Minute verleihen. Bei IL 5 und Grad-3-Zugang sind damit Manöver bis Grad 2 übertragbar. Nur ein Echo gleichzeitig.\u003c/li>\n\u003cli>\u003cstrong>Mission, Protection:\u003c/strong> \u003ca href=\"#/artikel/living-bastion\">Living Bastion\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>Living Bastion:\u003c/strong> solange psionisch fokussiert +5 ft Reach. Fokus kann aufgegeben werden, um Schaden eines Verbündeten innerhalb Reach nach DR/Resistance zu halbieren; pro Kreatur einmal pro Runde.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Psion 1, Egoist\u003c/h2>\n\u003cp>\u003cstrong>Manifester Level:\u003c/strong> 1\u003cbr/>\n\u003cstrong>Maximaler Power-Grad:\u003c/strong> 1\u003cbr/>\n\u003cstrong>Powers Known:\u003c/strong> 3\u003c/p>\n\u003ch3>Power Points\u003c/h3>\n\u003cp>\u003cstrong>11 PP / Tag gesamt\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>8 PP aus dem bisherigen Zelot-Pool nach Wegfall von Unlocked Talent.\u003c/li>\n\u003cli>+2 Basis-PP aus Psion 1.\u003c/li>\n\u003cli>+1 Bonus-PP aus INT 14 für Psion 1.\u003c/li>\n\u003c/ul>\n\u003ch3>Psionische Talente (Grad 0, aktueller Git-Stand)\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/empathy\">Empathy\u003c/a>:\u003c/strong> akzeptiertes Talent; bei aktiver Manifestation und Konzentration aktuelle Oberflächenemotionen, keine Gedanken, Motive, Erinnerungen oder Fakten.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/conceal-thoughts\">Conceal Thoughts\u003c/a>:\u003c/strong> akzeptiertes Talent; 1 Stunde bei ML 1, +10 Circumstance auf Bluff gegen Sense Motive zur Erkennung wahrer Absichten. Sichere Nichtkampf-Routineerneuerung ist vereinbart.\u003c/li>\n\u003cli>\u003cstrong>Drittes Talent: offen.\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>Diese Talente zählen nicht gegen die drei Powers Known. Der ältere Anhang führte zusätzlich Detect Psionics und Far Hand. Der aktuell abgerufene Git-Bogen und die Hausregeln bestätigen diese zusätzlichen Einträge nicht; sie werden nicht stillschweigend als aktive Kräfte übernommen.\u003c/p>\n\u003ch3>Powers Known\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/minor-metamorphosis\">Minor Metamorphosis\u003c/a>\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/defensive-precognition\">Defensive Precognition\u003c/a>\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/offensive-precognition\">Offensive Precognition\u003c/a>\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Path of War\u003c/h2>\n\u003cp>\u003cstrong>Initiator Level:\u003c/strong> \u003cstrong>5\u003c/strong> nach der festgelegten Duett-/Build-Progression\u003cbr/>\n\u003cstrong>Initiating Attribute:\u003c/strong> CHA +3\u003cbr/>\n\u003cstrong>Manöver bekannt:\u003c/strong> \u003cstrong>9\u003c/strong>\u003cbr/>\n\u003cstrong>Manöver vorbereitet:\u003c/strong> \u003cstrong>5\u003c/strong>\u003cbr/>\n\u003cstrong>Haltungen bekannt:\u003c/strong> 2\u003c/p>\n\u003ch3>Standardvorbereitung\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/rapid-strike\">Rapid Strike\u003c/a>\u003c/strong>\u003c li>\n\u003cli>\u003cstrong>Combat Reflexes:\u003c/strong> bis zu 4 zusätzliche AoOs pro Runde.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Personality Fragment: Psicrystal\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Wert\u003c/th>\n\u003cth style=\"text-align:right\">Stufe 5\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Typ\u003c/td>\n\u003ctd style=\"text-align:right\">Diminutive Construct\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Psionische Klassenstufe des Meisters\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BAB\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+5\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HP\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>17\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>STR / DEX / INT\u003c/td>\n\u003ctd style=\"text-align:right\">1 / 15 / 9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AC\u003c/td>\n\u003ctd style=\"text-align:right\">16\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Touch / Flat-Footed\u003c/td>\n\u003ctd style=\"text-align:right\">16 / 14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saves\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>Fort +4 / Ref +5 / Will +6\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tactical Assistance\u003c/td>\n\u003ctd style=\"text-align:right\">INT -1 gegen DC 10\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aid-Bonus\u003c/td>\n\u003ctd style=\"text-align:right\">+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Knowledge-Unterstützung\u003c/td>\n\u003ctd style=\"text-align:right\">+2 pauschal\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>Ausrüstung\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>+1 Großschwert\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Maßgefertigtes Mithralkettenhemd\u003c/strong>: Armor +4, Max DEX +6, ACP 0.\u003c/li>\n\u003cli>\u003cstrong>Thorns eiserner Stirn /td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/remove-sickness\">Remove Sickness\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>neu Stufe 5\u003c/strong>\u003c/td>\n\u003ctd>unterdrückt die Auswirkungen von Krankheit, Übelkeit und sickened nach Zaubertext\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/cure-light-wounds\">Cure Light Wounds\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Oracle Cure Spell\u003c/td>\n\u003ctd>\u003cstrong>1d8+5\u003c/strong> Heilung\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Unnatural Lust\u003c/strong>\u003c/td>\n\u003ctd>Curse Bonus\u003c/td>\n\u003ctd>erzwungener körperlicher Annäherungsdrang\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/identify\">Identify\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Lore Spirit / Mystery\u003c/td>\n\u003ctd>magische Gegenstände identifizieren\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>Zauber des 2. Grades\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Zauber\u003c/th>\n\u003cth>Herkunft\u003c/th>\n\u003cth>Kurzfunktion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/delay-poison\">Delay Poison\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>regulär\u003c/td>\n\u003ctd>unterdrückt Giftwirkung\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/lesser-restoration\">Lesser Restoration\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>neu Stufe 5\u003c/strong>\u003c/td>\n\u003ctd>behebt passende Ability-Damage-/Zustandseffekte nach Zaubertext\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/cure-moderate-wounds\">Cure Moderate Wounds\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Oracle Cure Spell\u003c/td>\n\u003ctd>\u003cstrong>2d8+5\u003c/strong> Heilung\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/tongues\">Tongues\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Lore Spirit\u003c/td>\n\u003ctd>Sprachen verstehen und sprechen\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch3>Arcane Enlightenment, aktuelle Standardauswahl\u003c/h3>\n\u003cul>\n\u003cli>\u003ca href=\"#/artikel/dancing-darkness\">Dancing Darkness\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/artikel/silent-image\">Silent Image\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/artikel/euphoric-cloud\">Euphoric Cloud\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/artikel/ashen-path\">Ashen Path\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>\u003cem>Diese vier Zauber sind temporäre Oracle Spells Known und können bei der täglichen Auffrischung neu gewählt werden.\u003c/em>\u003c/p>\n\u003chr/>\n\u003ch2>Fertigkeiten\u003c/h2>\n\u003cp>\u003cstrong>Skill Ranks pro Level:\u003c/strong> 4 Oracle +2 INT +1 FCB = 7.\u003cbr/>\n\u003cstrong>Gesamtränge auf Stufe 5:\u003c/strong> 35.\u003c/p>\n\u003cp>Die sieben neuen Ränge gehen in Disable Device, Diplomacy, Knowledge (All), Perception, Spellcraft, Stealth und \u003cstrong>Bluff\u003c/strong>. Sense Motive bleibt bewusst auf 2 Ranks.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Skill\u003c/th>\n\u003cth style=\"text-align:right\">Ability\u003c/th>\n\u003cth style=\"text-align:right\">Ranks\u003c/th>\n\u003cth style=\"text-align:right\">Total\u003c/th>\n\u003cth>Notiz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Bluff\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">CHA\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>1\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+5\u003c/strong>\u003c/td>\n\u003ctd>neuer Rang auf Stufe 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Disable Device\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">CHA\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+12\u003c/strong>\u003c/td>\n\u003ctd>Mithral Heavy Shield ACP 0; Trapfinding\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Diplomacy\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">CHA\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+12\u003c/strong>\u003c/td>\n\u003ctd>mit Enhanced Diplomacy situativ +14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Heal\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">WIS\u003c/td>\n\u003ctd style=\"text-align:right\">1\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+8\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Knowledge (All)\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">CHA\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+12\u003c/strong>\u003c/td>\n\u003ctd>Lore Keeper; erfüllt auch Knowledge (martial)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Perception\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">WIS\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>keine Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Sense Motive\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">WIS\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>2\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Spellcraft\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">INT\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+10\u003c/strong>\u003c/td>\n\u003ctd>Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stealth\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">CHA\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>5\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+12\u003c/strong>\u003c/td>\n\u003ctd>Mithral Heavy Shield ACP 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Survival\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">WIS\u003c/td>\n\u003ctd style=\"text-align:right\">1\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+5\u003c/strong>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>Path of War, Martial Training II, Radiant Dawn\u003c/h2>\n\u003cp>\u003cstrong>Initiator Level:\u003c/strong> \u003cstrong>6\u003c/strong>\u003cbr/>\n\u003cstrong>Initiation Modifier:\u003c/strong> \u003cstrong>CHA +4\u003c/strong>\u003cbr/>\n\u003cstrong>Recovery:\u003c/strong> Full-Round Action\u003cbr/>\n\u003cstrong>Essence Pool:\u003c/strong> \u003cstrong>2\u003c/strong>\u003cbr/>\n\u003cstrong>Essence Capacity:\u003c/strong> \u003cstrong>1\u003c/strong> pro Receptacle\u003cbr/>\n\u003cstrong>Close Range:\u003c/strong> \u003cstrong>40 ft\u003c/strong>\u003c/p>\n\u003ch3>Sun's Gleam\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Angriff:\u003c/strong> +5 Ranged Touch.\u003c/li>\n\u003cli>\u003cstrong>Schaden:\u003c/strong> 1d6+4 Force.\u003c/li>\n\u003cli>\u003cstrong>Reichweite:\u003c/strong> 40 ft.\u003c/li>\n\u003cli>Kann in geeigneten Radiant-Dawn-Strikes als Fernkampfangriff verwendet werden.\u003c/li>\n\u003c/ul>\n\u003ch3>Bekannte Manöver\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Manöver\u003c/th>\n\u003cth>Typ\u003c/th>\n\u003cth style=\"text-align:right\">Standard vorbereitet?\u003c/th>\n\u003cth>Effekt / Rolle\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/bolster\">Bolster\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Counter\u003c/td>\n\u003ctd style=\"text-align:right\">Nein\u003c/td>\n\u003ctd>Verbündeter erhält DR 4/- für 1 Runde; mit 1 Essence DR 5/-\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/staunching-strike\">Staunching Strike\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Strike\u003c/td>\n\u003ctd style=\"text-align:right\">Nein\u003c/td>\n\u003ctd>Treffer + Heilung; Reserveoption, falls Spoils/Cure nicht reichen\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/witness-to-glory\">Witness to Glory\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Counter\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>Ja\u003c/strong>\u003c/td>\n\u003ctd>nach Initiativeermittlung bevorzugt auf \u003ca href=\"#/artikel/styke\">Styke\u003c/a>; \u003cstrong>+4 Initiative und 6 Temp HP\u003c/strong>, mit 1 Essence \u003cstrong>+5 Initiative und 8 Temp HP\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>\u003ca href=\"#/artikel/decree-of-torment\">Decree of Torment\u003c/a>\u003c/strong>\u003c/td>\n\u003ctd>Strike\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>Ja\u003c/strong>\u003c/td>\n\u003ctd>markiert einen starken Gegner mit Torment-Brands; Styke kann die Marken über seine vielen Treffer für Combat Maneuvers wie Trip, Disarm oder Dirty Trick nutzen\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Standard Readied:\u003c/strong> \u003cstrong>Witness to Glory, Decree of Torment\u003c/strong>.\u003c/p>\n\u003cp>\u003cem>Bei Bedarf können zwischen Begegnungen Bolster oder Staunching Strike neu vorbereitet werden, sofern Zeit für die normale Martial-Training-Vorbereitung/Recovery besteht.\u003c/em>\u003c/p>\n\u003ch3>Stance: Spoils of War\u003c/h3>\n\u003cp>\u003cstrong>Standardstance:\u003c/strong> \u003cstrong>\u003ca href=\"#/artikel/spoils-of-war\">Spoils of War\u003c/a>\u003c/strong> mit \u003cstrong>1 Essence investiert\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>Ohne Essence heilt der erste passende Treffer eines Verbündeten pro Runde bei IL 6 um \u003cstrong>7 HP\u003c/strong>.\u003c/li>\n\u003cli>Mit 1 Essence steigt dies auf \u003cstrong>9 HP\u003c/strong>.\u003c/li>\n\u003cli>Der zweite Essence-Punkt bleibt standardmäßig für \u003cstrong>Witness to Glory\u003c/strong> verfügbar.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Animus- und Martial-Glyph-Paket, virtueller Rang 1\u003c/h2>\n\u003cp>\u003cstrong>Virtueller Animus-Rang:\u003c/strong> 1\u003cbr/>\n\u003cstrong>Animus zu Beginn des ersten eigenen Zuges:\u003c/strong> \u003cstrong>5\u003c/strong>\u003cbr/>\n\u003cstrong>Weitere Züge:\u003c/strong> +1 Animus zu Beginn jedes eigenen Zuges.\u003cbr/>\n\u003cstrong>Zusätzlich:\u003c/strong> +1 Animus am Rundenende, wenn Vesper in dieser Runde mindestens ein Manöver initiiert hat.\u003cbr/>\n\u003cstrong>Glyph-Kosten:\u003c/strong> 1 Animus.\u003cbr/>\n\u003cstrong>Glyph-Reichweite:\u003c/strong> \u003cstrong>40 ft\u003c/strong>.\u003cbr/>\n\u003cstrong>Glyph-Dauer:\u003c/strong> \u003cstrong>5 Runden\u003c/strong>.\u003cbr/>\n\u003cstrong>Glyph-DC:\u003c/strong> \u003cstrong>17\u003c/strong>.\u003c/p>\n\u003cp>Ein Glyph kann als Swift Action gewirkt werden oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Mehrfache Anwendungen desselben Glyphs stapeln sich nicht und verlängern die Dauer nicht.\u003c/p>\n\u003ch3>Bekannte Basic Glyphs\u003c/h3>\n\u003col>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/elemental-shield\">Elemental Shield\u003c/a>\u003c/strong>: Energy Resistance \u003cstrong>6\u003c/strong> gegen Vespers aktives Element.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade\u003c/a>\u003c/strong>: Waffen des Verbündeten erhalten \u003cem>ghost touch\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/ghost-armor\">Ghost Armor\u003c/a>\u003c/strong>: Rüstung und Schild des Verbündeten erhalten \u003cem>ghost touch\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/deflective-armor\">Deflective Armor\u003c/a>\u003c/strong>: Natural Armor steigt bei IL 6 um \u003cstrong>+3\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>\u003ca href=\"#/artikel/shadowmeld\">Shadowmeld\u003c/a>\u003c/strong>: \u003cstrong>20% Concealment / Miss Chance\u003c/strong> gegen Gegner.\u003c/li>\n\u003c/ol>\n\u003chr/>\n\u003ch2>Familiar: Verse\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Wert\u003c/th>\n\u003cth style=\"text-align:right\">Stufe 5\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>HP\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>14\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Intelligence\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>8\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natural Armor Adjustment\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+3\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Initiativebonus für Vesper\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+4\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Verse verwendet weiterhin den Protector Archetype mit Bodyguard und Combat Reflexes entsprechend den etablierten Kampagnenregeln.\u003c/p>\n\u003chr/>\n\u003ch2>Traits &amp; Drawback\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>High Theft:\u003c/strong> +1 Trait-Bonus auf Reflex.\u003c/li>\n\u003cli>\u003cstrong>Schattenwebers Intuition:\u003c/strong> Trapfinding; CHA statt DEX für Disable Device und Stealth; beide Klassenfertigkeiten.\u003c/li>\n\u003cli>\u003cstrong>Reactionary:\u003c/strong> +2 Initiative.\u003c/li>\n\u003cli>\u003cstrong>Stykes Lehre:\u003c/strong> automatische Radiant-Dawn-Martial-Training-Progression ohne weitere Feat-Steuer.\u003c/li>\n\u003cli>\u003cstrong>Hedonistic:\u003c/strong> bei Nichterfüllung der etablierten täglichen Bedingung Fortitude DC 20; Fehlschlag verursacht 4 Stunden fatigued.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Ausrüstung\u003c/h2>\n\u003cul>\n\u003cli>Dolch.\u003c/li>\n\u003cli>Maßgefertigtes Mithralkettenhemd, Armor +4, Max DEX +6, ACP 0.\u003c/li>\n\u003cli>Mithral Heavy Shield, Shield +2, ACP 0.\u003c/li>\n\u003cli>Thieves' Tools.\u003c/li>\n\u003cli>Thorns eiserner Stirnreif, getragen.\u003c/li>\n\u003cli>Verse, aktiv.\u003c/li>\n\u003cli>\u003cstrong>Cloak of Resistance +1:\u003c/strong> getragen; der Resistance-Bonus ist in Vespers Saves eingerechnet.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>Standard-Kampferöffnung\u003c/h2>\n\u003cul>\n\u003cli>Vesper würfelt normalerweise \u003cstrong>Initiative +12\u003c/strong>, solange Verse aktiv ist.\u003c/li>\n\u003cli>\u003cstrong>Witness to Glory\u003c/strong> ist vorbereitet und mit dem freien Essence-Punkt bevorzugt für Styke vorgesehen.\u003c/li>\n\u003cli>\u003cstrong>Spoils of War\u003c/strong> läuft als Standardstance mit 1 Essence.\u003c/li>\n\u003cli>Je nach Lage kann Vesper vor Stykes Zug Zauber, Glyphs oder Decree of Torment zur Vorbereitung des Schlachtfelds einsetzen.\u003c/li>\n\u003cli>Standard Readied bleiben \u003cstrong>Witness to Glory + Decree of Torment\u003c/strong>; Heilung läuft primär über Spoils of War und Cure-Spells.\u003c/li>\n\u003c/ul>\n","sources":["vsheet","vrules","live"],"status":"Bestätigt","tags":["Vesper","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Vesper","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Vesper , kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der aktuelle Spielstand hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen. Die Quellenhinweise benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das Fähigkeitenregister ergänzt alle belegten Regelkarten. Vesper - Charakterbogen Stufe 5 Klasse: Oracle (Spirit Guide) 5 Rasse: Tiefling (Asura-Spawn) Mystery: Lore Curse: Uncontainable Allure Gesinnung: Neutral, mit Tendenz zu Böse Level: 5 Geschlecht: Weiblich Alter: 22 Familiar: Verse Attribute Attribut Wert Mod Notiz STR 11 +0 DEX 14 +2 Initiative und CMD CON 10 +0 INT 14 +2 Arcane Enlightenment bis Zaubergrad 4 vorbereitet WIS 18 +4 Perception, Heal, Sense Motive CHA 18 +4 Zauber, AC, Reflex, Knowledge, Stealth, Disable Device, Initiation Kampfwerte Wert Total Notiz HP 28 / 28 23 auf Stufe 4 +5 Oracle 5 AC 14 / 20 Ohne Ausrüstung / Mithralkettenhemd + Mithral Heavy Shield Touch AC 14 Sidestep Secret, CHA statt DEX Flat-Footed 10 / 16 Ohne / mit Rüstung und Schild Initiative +8 / +12 +2 DEX, +2 Reactionary, +4 Improved Initiative; +4 zusätzlich durch Verse Speed 30 ft BAB +3 CMB +3 CMD 15 Melee +3 Dolch 1d4, 19-20/x2 Spell Save DC 14 / 15 / 16 Orisons / Grad 1 / Grad 2 Concentration +9 Oracle 5 + CHA 4 Rettungswürfe Save Total Basis Modifikator / Misc Fortitude +2 +1 CON +0, Resistance +1 Reflex +7 +1 CHA +4, High Theft +1, Resistance +1 Will +9 +4 WIS +4, Resistance +1 Talente Extra Revelation . Verse Familiar : mechanisch Wasp Familiar, Protector Archetype; +4 Initiative für Vesper, solange die Familiar-Bedingungen erfüllt sind. Martial Training I -&gt; II, Radiant Dawn : automatische Progression über Stykes Lehre ; Stufe 5 schaltet den zweiten Martial-Training-Schritt ohne neuen Feat-Slot frei. Improved Initiative : reguläres Stufe-5-Talent; +4 Initiative. Oracle 5, Spirit Guide / Lore Oracle Spellcasting über CHA. Curse, Uncontainable Allure : -4 Intimidate; Unnatural Lust als Bonuszauber gemäß vorhandenem Kampagnenbogen. Lore Mystery : Knowledge-Skills als Klassenfertigkeiten. Sidestep Secret : CHA statt DEX auf AC und Reflex. Lore Keeper : CHA statt INT auf Knowledge. Bonded/Wandering Spirit : tägliche Spirit-Wahl. Lore Spirit + Arcane Enlightenment : vier täglich neu wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known, derzeit bis Grad 2 wirkbar. Spirit Magic : aktiv. Spellcasting Casting Ability: CHA +4 Zauberplätze Grad 1: 7 / Tag Zauberplätze Grad 2: 5 / Tag Orisons: beliebig oft Orisons Detect Magic Create Water Purify Food and Drink Read Magic Guidance Enhanced Diplomacy Zauber des 1. Grades Zauber Herkunft Kurzfunktion Obscuring Mist regulär Sicht- und Raumkontrolle Protection from Evil regulär Schutz gegen böse Kreaturen und bestimmte mentale Kontrolle Air Bubble regulär Atemluft Remove Sickness neu Stufe 5 unterdrückt die Auswirkungen von Krankheit, Übelkeit und sickened nach Zaubertext Cure Light Wounds Oracle Cure Spell 1d8+5 Heilung Unnatural Lust Curse Bonus erzwungener körperlicher Annäherungsdrang Identify Lore Spirit / Mystery magische Gegenstände identifizieren Zauber des 2. Grades Zauber Herkunft Kurzfunktion Delay Poison regulär unterdrückt Giftwirkung Lesser Restoration neu Stufe 5 behebt passende Ability-Damage-/Zustandseffekte nach Zaubertext Cure Moderate Wounds Oracle Cure Spell 2d8+5 Heilung Tongues Lore Spirit Sprachen verstehen und sprechen Arcane Enlightenment, aktuelle Standardauswahl Dancing Darkness Silent Image Euphoric Cloud Ashen Path Diese vier Zauber sind temporäre Oracle Spells Known und können bei der täglichen Auffrischung neu gewählt werden. Fertigkeiten Skill Ranks pro Level: 4 Oracle +2 INT +1 FCB = 7. Gesamtränge auf Stufe 5: 35. Die sieben neuen Ränge gehen in Disable Device, Diplomacy, Knowledge (All), Perception, Spellcraft, Stealth und Bluff . Sense Motive bleibt bewusst auf 2 Ranks. Skill Ability Ranks Total Notiz Bluff CHA 1 +5 neuer Rang auf Stufe 5 Disable Device CHA 5 +12 Mithral Heavy Shield ACP 0; Trapfinding Diplomacy CHA 5 +12 mit Enhanced Diplomacy situativ +14 Heal WIS 1 +8 Klassenfertigkeit Knowledge (All) CHA 5 +12 Lore Keeper; erfüllt auch Knowledge (martial) Perception WIS 5 +9 keine Klassenfertigkeit Sense Motive WIS 2 +9 Klassenfertigkeit Spellcraft INT 5 +10 Klassenfertigkeit Stealth CHA 5 +12 Mithral Heavy Shield ACP 0 Survival WIS 1 +5 Path of War, Martial Training II, Radiant Dawn Initiator Level: 6 Initiation Modifier: CHA +4 Recovery: Full-Round Action Essence Pool: 2 Essence Capacity: 1 pro Receptacle Close Range: 40 ft Sun's Gleam Angriff: +5 Ranged Touch. Schaden: 1d6+4 Force. Reichweite: 40 ft. Kann in geeigneten Radiant-Dawn-Strikes als Fernkampfangriff verwendet werden. Bekannte Manöver Manöver Typ Standard vorbereitet? Effekt / Rolle Bolster Counter Nein Verbündeter erhält DR 4/- für 1 Runde; mit 1 Essence DR 5/- Staunching Strike Strike Nein Treffer + Heilung; Reserveoption, falls Spoils/Cure nicht reichen Witness to Glory Counter Ja nach Initiativeermittlung bevorzugt auf Styke ; +4 Initiative und 6 Temp HP , mit 1 Essence +5 Initiative und 8 Temp HP Decree of Torment Strike Ja markiert einen starken Gegner mit Torment-Brands; Styke kann die Marken über seine vielen Treffer für Combat Maneuvers wie Trip, Disarm oder Dirty Trick nutzen Standard Readied: Witness to Glory, Decree of Torment . Bei Bedarf können zwischen Begegnungen Bolster oder Staunching Strike neu vorbereitet werden, sofern Zeit für die normale Martial-Training-Vorbereitung/Recovery besteht. Stance: Spoils of War Standardstance: Spoils of War mit 1 Essence investiert . Ohne Essence heilt der erste passende Treffer eines Verbündeten pro Runde bei IL 6 um 7 HP . Mit 1 Essence steigt dies auf 9 HP . Der zweite Essence-Punkt bleibt standardmäßig für Witness to Glory verfügbar. Animus- und Martial-Glyph-Paket, virtueller Rang 1 Virtueller Animus-Rang: 1 Animus zu Beginn des ersten eigenen Zuges: 5 Weitere Züge: +1 Animus zu Beginn jedes eigenen Zuges. Zusätzlich: +1 Animus am Rundenende, wenn Vesper in dieser Runde mindestens ein Manöver initiiert hat. Glyph-Kosten: 1 Animus. Glyph-Reichweite: 40 ft . Glyph-Dauer: 5 Runden . Glyph-DC: 17 . Ein Glyph kann als Swift Action gewirkt werden oder höchstens einmal pro Runde als Free Actio gkeiten-register\">Fähigkeitenregister\u003c/a> ergänzt alle belegten Regelkarten.\u003c/p>\n\u003ch1>Valeria - Charakterbogen Stufe 5\u003c/h1>\n\u003cp>\u003cstrong>Frühere Identität:\u003c/strong> Dame Balina von Karfeld\u003cbr/>\n\u003cstrong>Quellenkonversion:\u003c/strong> Sir Balin von Karfeld -&gt; Dame Balina von Karfeld -&gt; Valeria; eine durchgehende Person\u003cbr/>\n\u003cstrong>Klasse:\u003c/strong> Fighter 5\u003cbr/>\n\u003cstrong>Volk:\u003c/strong> Mensch\u003cbr/>\n\u003cstrong>Herkunft:\u003c/strong> Karfeld, Talingarde\u003cbr/>\n\u003cstrong>Level:\u003c/strong> 5\u003cbr/>\n\u003cstrong>Geschlecht:\u003c/strong> Weiblich\u003cbr/>\n\u003cstrong>Gesinnung:\u003c/strong> aktuell nicht verbindlich neu festgelegt; Quellenursprung war LG\u003cbr/>\n\u003cstrong>Sprache:\u003c/strong> Common\u003c/p>\n\u003chr/>\n\u003ch2>Attribute\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Attribut\u003c/th>\n\u003cth style=\"text-align:right\">Wert\u003c/th>\n\u003cth style=\"text-align:right\">Mod\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>STR\u003c/td>\n\u003ctd style=\"text-align:right\">18\u003c/td>\n\u003ctd style=\"text-align:right\">+4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEX\u003c/td>\n\u003ctd style=\"text-align:right\">12\u003c/td>\n\u003ctd style=\"text-align:right\">+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CON\u003c/td>\n\u003ctd style=\"text-align:right\">16\u003c/td>\n\u003ctd style=\"text-align:right\">+3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INT\u003c/td>\n\u003ctd style=\"text-align:right\">10\u003c/td>\n\u003ctd style=\"text-align:right\">+0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WIS\u003c/td>\n\u003ctd style=\"text-align:right\">14\u003c/td>\n\u003ctd style=\"text-align:right\">+2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CHA\u003c/td>\n\u003ctd style=\"text-align:right\">10\u003c/td>\n\u003ctd style=\"text-align:right\">+0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>Kampfwerte\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Wert\u003c/th>\n\u003cth style=\"text-align:right\">Aktueller sicherer Stand\u003c/th>\n\u003cth>Notiz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>HP\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>42 / 42\u003c/strong>\u003c/td>\n\u003ctd>HP-Stand unverändert; Erholung siehe aktuellen Spielstand\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Initiative\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+1\u003c/strong>\u003c/td>\n\u003ctd>DEX +1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Speed\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>20 ft\u003c/strong>\u003c/td>\n\u003ctd>in Plattenrüstung\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>BAB\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+5\u003c/strong>\u003c/td>\n\u003ctd>Fighter 5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CMB\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd>BAB +5, STR +4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CMD\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>20\u003c/strong>\u003c/td>\n\u003ctd>10 + BAB 5 + STR 4 + DEX 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>AC\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>20\u003c/strong>*\u003c/td>\n\u003ctd>10 +9 Platte +1 DEX, ohne geführten Schild\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Touch AC\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>11\u003c/strong>\u003c/td>\n\u003ctd>10 +1 DEX\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Flat-Footed AC\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>19\u003c/strong>*\u003c/td>\n\u003ctd>10 +9 Platte\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>* Der aktuelle Kampagnenstand setzt Plattenrüstung und ein \u003cstrong>Masterwork-Großschwert\u003c/strong>. Die Quelle führte ursprünglich masterwork full plate plus heavy steel shield. Der Schild ist \u003cstrong>nicht\u003c/strong> als aktuelle Ausrüstung etabliert. Der genaue Kauf-/Masterwork-Status der aktuellen Platte ist nicht vollständig festgelegt; der Rüstungsbonus der Full Plate bleibt davon unberührt.\u003c/p>\n\u003ch3>Rettungswürfe\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Save\u003c/th>\n\u003cth style=\"text-align:right\">Total\u003c/th>\n\u003cth>Herleitung\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Fortitude\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+8\u003c/strong>\u003c/td>\n\u003ctd>Base +4, CON +3, Resistance +1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Reflex\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+3\u003c/strong>\u003c/td>\n\u003ctd>Base +1, DEX +1, Resistance +1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Will\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+6\u003c/strong>\u003c/td>\n\u003ctd>Base +1, WIS +2, Iron Will +2, Resistance +1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Bravery +1:\u003c/strong> zusätzlich +1 gegen Furchteffekte.\u003c/p>\n\u003chr/>\n\u003ch2>Angriffe\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Angriff\u003c/th>\n\u003cth style=\"text-align:right\">Treffer\u003c/th>\n\u003cth style=\"text-align:right\">Schaden\u003c/th>\n\u003cth style=\"text-align:right\">Kritisch\u003c/th>\n\u003cth style=\"text-align:right\">Reichweite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Masterwork-Großschwert\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+11\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>2d6+7\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">19-20/x2\u003c/td>\n\u003ctd style=\"text-align:right\">Nahkampf\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Masterwork-Großschwert, Power Attack\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+9\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>2d6+13\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">19-20/x2\u003c/td>\n\u003ctd style=\"text-align:right\">Nahkampf\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cem>Herleitung: BAB +5, STR +4, Weapon Training (Heavy Blades) +1 und Masterwork +1 auf Angriff. Zweihändiger STR-Schaden +6, dazu +1 Schaden durch Weapon Training. Power Attack gibt bei BAB +5 mit einer zweihändig geführten Waffe -2 Angriff und +6 Schaden.\u003c/em>\u003c/p>\n\u003chr/>\n\u003ch2>Fighter 5\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Bravery +1\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Armor Training 1\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Weapon Training (Heavy Blades) +1\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>OOC-Buildplanung\u003c/h2>\n\u003cp>Die bereits besprochene zukünftige Planung steht \u003ca href=\"#/artikel/buildplanung\">in einem getrennten Eintrag\u003c/a>. Aktuell gelten ausschließlich Fighter-5-Werte.\u003c/p>\n\u003chr/>\n\u003ch2>Talente\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Cleave\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Iron Will\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Power Attack\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Step Up\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Weapon Focus (longsword)\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Weapon Specialization (longsword)\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Die beiden Longsword-Talente stammen aus dem ursprünglichen Fighter-5-Statblock. Sie greifen nur, wenn Valeria tatsächlich ein Longsword benutzt; sie werden nicht automatisch auf ihre derzeit offene zweihändige Waffe übertragen.\u003c/p>\n\u003chr/>\n\u003ch2>Fertigkeiten\u003c/h2>\n\u003cp>Die folgenden Totale stammen aus dem ursprünglichen Fighter-5-Statblock und bleiben als sichere Fähigkeitsbasis erhalten, soweit keine aktuelle Ausrüstungsänderung einen Armor-Check-Penalty-sensitive Skill verändert:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Skill\u003c/th>\n\u003cth style=\"text-align:right\">Total\u003c/th>\n\u003cth>Notiz\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Intimidate\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+5\u003c/strong>\u003c/td>\n\u003ctd>Quellenwert\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Knowledge (nobility)\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+1\u003c/strong>\u003c/td>\n\u003ctd>inkl. Child of the Temple\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Knowledge (religion)\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+8\u003c/strong>\u003c/td>\n\u003ctd>inkl. Child of the Temple; Klassenfertigkeit\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Ride\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>*\u003c/td>\n\u003ctd>Quellenwert; aktuelle ACP-Abhängigkeit nicht neu verifiziert\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Survival\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+7\u003c/strong>\u003c/td>\n\u003ctd>Quellenwert\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Perception\u003c/strong>\u003c/td>\n\u003ctd style=\"text-align:right\">\u003cstrong>+2\u003c/strong>\u003c/td>\n\u003ctd>aus WIS +2, keine eigenen Ränge im Quellenstatblock ausgewiesen\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>* Da der genaue Masterwork-/ACP-Status der aktuellen Platte offen ist, sollte Ride vor einem relevanten Check gegen die endgültige Rüstungsausrüstung neu abgeglichen werden.\u003c/p>\n\u003chr/>\n\u003ch2>Trait\u003c/h2>\n\u003cp>\u003cstrong>Child of the Temple:\u003c/strong> +1 Trait-Bonus auf Knowledge (nobility) und Knowledge (religion); Knowledge (religion) ist Klassenfertigkeit.\u003c/p>\n\u003chr/>\n\u003ch2>Aktuelle Ausrüstung\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Plattenrüstung\u003c/strong>; genaue Kauf-/Masterwork-Details nicht vollständig fixiert.\u003c/li>\n\u003cli>\u003cstrong>Masterwork-Großschwert\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Cloak of Resistance +1\u003c/strong>; getragen und in den Saves eingerechnet.\u003c/li>\n\u003cli>Das frühere \u003cstrong>silberne Saphir-Symbol der Ritter des Alerion\u003c/strong> befindet sich bei \u003ca href=\"#/artikel/styke\">Styke\u003c/a>, nicht bei Valeria.\u003c/li>\n\u003cli>Alte Quellengegenstände wie Longsword, Dagger, Heavy Steel Shield, Potion of \u003ca href=\"#/artikel/cure-light-wounds\">Cure Light Wounds\u003c/a> und der ursprüngliche komplette Ausrüstungssatz kehren nicht automatisch zurück.\u003c/li>\n\u003c/ul>\n","sources":["valsheet","valeria","localrules","live"],"status":"Bestätigt","tags":["Valeria","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Valeria","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Valeria , kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der aktuelle Spielstand hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen. Die Quellenhinweise benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das Fähigkeitenregister ergänzt alle belegten Regelkarten. Valeria - Charakterbogen Stufe 5 Frühere Identität: Dame Balina von Karfeld Quellenkonversion: Sir Balin von Karfeld -&gt; Dame Balina von Karfeld -&gt; Valeria; eine durchgehende Person Klasse: Fig sprünglichen Fighter-5-Statblock. Sie greifen nur, wenn Valeria tatsächlich ein Longsword benutzt; sie werden nicht automatisch auf ihre derzeit offene zweihändige Waffe übertragen. Fertigkeiten Die folgenden Totale stammen aus dem ursprünglichen Fighter-5-Statblock und bleiben als sichere Fähigkeitsbasis erhalten, soweit keine aktuelle Ausrüstungsänderung einen Armor-Check-Penalty-sensitive Skill verändert: Skill Total Notiz Intimidate +5 Quellenwert Knowledge (nobility) +1 inkl. Child of the Temple Knowledge (religion) +8 inkl. Child of the Temple; Klassenfertigkeit Ride +7 * Quellenwert; aktuelle ACP-Abhängigkeit nicht neu verifiziert Survival +7 Quellenwert Perception +2 aus WIS +2, keine eigenen Ränge im Quellenstatblock ausgewiesen * Da der genaue Masterwork-/ACP-Status der aktuellen Platte offen ist, sollte Ride vor einem relevanten Check gegen die endgültige Rüstungsausrüstung neu abgeglichen werden. Trait Child of the Temple: +1 Trait-Bonus auf Knowledge (nobility) und Knowledge (religion); Knowledge (religion) ist Klassenfertigkeit. Aktuelle Ausrüstung Plattenrüstung ; genaue Kauf-/Masterwork-Details nicht vollständig fixiert. Masterwork-Großschwert . Cloak of Resistance +1 ; getragen und in den Saves eingerechnet. Das frühere silberne Saphir-Symbol der Ritter des Alerion befindet sich bei Styke , nicht bei Valeria. Alte Quellengegenstände wie Longsword, Dagger, Heavy Steel Shield, Potion of Cure Light Wounds und der ursprüngliche komplette Ausrüstungssatz kehren nicht automatisch zurück.","links":["valeria","spielstand","redaktion","faehigkeiten-register","buildplanung","styke","cure-light-wounds"],"backlinks":["valeria"],"search":"valeria charakterbogen stufe 5 attribute kampfwerte fertigkeiten talente klassenfahigkeiten ausrustung und alle verfugbaren zauber und manoverlisten valeria stufe 5 vollstandiger bogen leseschlussel dies ist der vollstandige verfugbare stufe 5 bogen von valeria kein automatisch fortgeschriebener kampftracker permanente werte au
