yn liess styke am 28 januar unter der buch deckgeschichte herein und deutete fur den 29 januar eine offene hintertur an das ist kein dauerhaft offenes haus dass wahrend des ersten langen besuchs keine weitere haushaltsperson wahrgenommen wurde beweist nicht dass es niemals personal gibt offener gegenstandsverbleib der exorzisten reisebericht wurde am 28 januar auf dem vorderen tisch abgelegt eine spatere mitnahme ist nicht belegt","initial":"D"},{"id":"st-alden","category":"orte","title":"St. Alden","summary":"Bekannter Orientierungspunkt für die Lage des Mott-Hauses.","body":"<h2>Gesicherter Ortsbezug<\/h2>\n<p>Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung.<\/p>\n<h2>Keine erfundene Besichtigung<\/h2>\n<p>Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.<\/p>\n","sources":["aldencross","chronicle"],"status":"Ortsbezug","tags":["Aldencross"],"aliases":[],"parent":"aldencross","text":"Gesicherter Ortsbezug Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung. Keine erfundene Besichtigung Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.","links":[],"backlinks":[],"search":"st alden bekannter orientierungspunkt fur die lage des mott hauses aldencross gesicherter ortsbezug das mott haus liegt hinter st alden die schmale gasse am kuchengarten fuhrt in diese richtung keine erfundene besichtigung im hier ausgewerteten kampagnenstand ist kein vollstandiger innenraum personalplan oder gesonderter besuch ausgearbeitet der eintrag halt den tatsachlich bekannten ortsbezug fest","initial":"S"},{"id":"wash-shed","category":"orte","title":"Der Waschschuppen","summary":"Ort der privaten Begegnung mit Mara und Ellyn am 23. Januar.","body":"<h2>Der 23. Januar<\/h2>\n<p>Nach dem Kennenlernen bei den Wagenhöfen gingen <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/mara\">Mara<\/a> und <a href=\"#/artikel/ellyn\">Ellyn<\/a> für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver.<\/p>\n<h2>Der Ort danach<\/h2>\n<p>Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.<\/p>","sources":["chronicle","relations"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Waschhütte"],"parent":"aldencross","text":"Der 23. Januar Nach dem Kennenlernen bei den Wagenhöfen gingen Styke , Mara und Ellyn für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver. Der Ort danach Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.","links":["styke","mara","ellyn"],"backlinks":["ellyn","mara"],"search":"der waschschuppen ort der privaten begegnung mit mara und ellyn am 23 januar waschhutte aldencross der 23 januar nach dem kennenlernen bei den wagenhofen gingen styke mara und ellyn fur einige private stunden in den waschschuppen mara gab anfangs das tempo vor ellyn wurde im verlauf aktiver der ort danach der waschschuppen blieb ein gewohnlicher arbeitsraum dort lagert keine ausrustung des knotens und fur spatere treffen wurde nichts vorbereitet","initial":"D"},{"id":"freemans-rock","category":"orte","title":"Freeman's Rock","summary":"Erkundeter Lagerplatz und Schauplatz des Hinterhalts auf Varnings Patrouille.","body":"<h2>Die Vorbereitung<\/h2>\n<p>Vom 24. bis 26. Januar kundschafteten <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/vesper\">Vesper<\/a>, <a href=\"#/artikel/valeria\">Valeria<\/a> und <a href=\"#/artikel/hakon\">Hakon<\/a> das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung.<\/p>\n<h2>Die Nacht des 26. Januar<\/h2>\n<p>Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt.<\/p>\n<h2>Spuren und Folgen<\/h2>\n<p>Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.<\/p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":["Freemans Rock"],"parent":"borderlands","text":"Die Vorbereitung Vom 24. bis 26. Januar kundschafteten Styke , Vesper , Valeria und Hakon das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung. Die Nacht des 26. Januar Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt. Spuren und Folgen Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.","links":["styke","vesper","valeria","hakon"],"backlinks":["story-so-far","zeit-0124"],"search":"freeman s rock erkundeter lagerplatz und schauplatz des hinterhalts auf varnings patrouille freemans rock grenzland die vorbereitung vom 24 bis 26 januar kundschafteten styke vesper valeria und hakon das gebiet aus der rest der feldgruppe blieb ungefahr einen halben kilometer entfernt wald und fluchtwege waren teil der vorbereitung die nacht des 26 januar vesper formte das kampfgebiet mit nebel dunkelheit und unterstutzender sichtmagie styke griff von der landeinwartigen fluchtseite an alle sieben patrouillenmitglieder starben keine verbundeten verluste sind festgestellt spuren und folgen leichen wurden begraben der ort bereinigt und die spur der erbeuteten pferde zu verschleiern versucht diese massnahmen garantierten nicht dass die tat unentdeckt blieb seit 31 januar kennt balentyne den tod der patrouille welche einzelspuren gefunden wurden weiss styke nicht vollstandig","initial":"F"},{"id":"tyburn","category":"orte","title":"Tyburn","summary":"Bekannter Wasserweg im Umfeld von Balentyne.","body":"<h2>Bedeutung für den Spielstand<\/h2>\n<p>Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne.<\/p>\n<h2>Begrenzter Karteneintrag<\/h2>\n<p>Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.<\/p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":[],"parent":"borderlands","text":"Bedeutung für den Spielstand Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne. Begrenzter Karteneintrag Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.","links":[],"backlinks":["kueche"],"search":"tyburn bekannter wasserweg im umfeld von balentyne grenzland bedeutung fur den spielstand vespers erkundung bestatigte dass gewohnliches wasser fur die festung aus dem tyburn geholt wird das torhaus nutzt daneben eine separate kleinere zisterne begrenzter karteneintrag es werden keine unbeobachteten uferwege bewachungsplane oder genauen entfernungen erganzt die versorgungsfunktion ist bekannt eine vollstandige wasserkarte liegt damit nicht vor","initial":"T"},{"id":"timeon-hof","category":"orte","title":"Timeons sicherer Aufenthaltsort","summary":"Vorgesehenes Familienanwesen, am 31. Januar von Valeria persönlich überprüft.","body":"<h2>Gesicherter Stand<\/h2>\n<p>Tamsin lieferte <a href=\"#/artikel/timeon\">Timeon<\/a> an diesem geeigneten Familienanwesen ab. <a href=\"#/artikel/valeria\">Valeria<\/a> bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin.<\/p>\n<h2>Nicht ausgearbeitet<\/h2>\n<p>Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.<\/p>\n","sources":["live","core","relations"],"status":"Bekannt","tags":["Umland"],"aliases":[],"parent":"borderlands","text":"Gesicherter Stand Tamsin lieferte Timeon an diesem geeigneten Familienanwesen ab. Valeria bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin. Nicht ausgearbeitet Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.","links":["timeon","valeria"],"backlinks":["story-so-far","timeon"],"search":"timeons sicherer aufenthaltsort vorgesehenes familienanwesen am 31 januar von valeria personlich uberpruft umland gesicherter stand tamsin lieferte timeon an diesem geeigneten familienanwesen ab valeria bestatigte seine sicherheit am 31 januar sie fand danach keine belastbare spur zu tamsin nicht ausgearbeitet ein neuer hofname exakte adresse plan oder verlasslich vermessene route werden hier nicht erfunden valeria hatte timeon zugesagt wiederzukommen akzeptierte anschliessend aber stykes ruckkehrverbot","initial":"T"},{"id":"branderscar","category":"orte","title":"Branderscar","summary":"Gefängnis und Ausgangspunkt der gemeinsamen Flucht.","body":"<h2>Angenommene Geschichte<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> entkamen gemeinsam, bargen <a href=\"#/artikel/verse\">Verse<\/a> und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack<\/a>. <a href=\"#/artikel/tamsin\">Tamsin Blackerly<\/a> überlebte und wurde später paktgebunden. <a href=\"#/artikel/matilda\">Matilda Richter<\/a> wurde nichttödlich überwältigt und überlebte ebenfalls.<\/p>\n<h2>Gegen die Verwechslung<\/h2>\n<p><a href=\"#/artikel/valeria\">Valeria<\/a> beziehungsweise Dame Balina war <strong>keine Branderscar-Gefangene<\/strong>. Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung.<\/p>\n<h2>Rückblick, kein aktueller Lageplan<\/h2>\n<p>Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.<\/p>\n","sources":["chronicle","history"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Angenommene Geschichte Styke und Vesper entkamen gemeinsam, bargen Verse und befreiten Grumblejack . Tamsin Blackerly überlebte und wurde später paktgebunden. Matilda Richter wurde nichttödlich überwältigt und überlebte ebenfalls. Gegen die Verwechslung Valeria beziehungsweise Dame Balina war keine Branderscar-Gefangene . Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung. Rückblick, kein aktueller Lageplan Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.","links":["styke","vesper","verse","grumblejack","tamsin","matilda","valeria"],"backlinks":["story-so-far","zeit-branderscar"],"search":"branderscar gefangnis und ausgangspunkt der gemeinsamen flucht fruhere stationen angenommene geschichte styke und vesper entkamen gemeinsam bargen verse und befreiten grumblejack tamsin blackerly uberlebte und wurde spater paktgebunden matilda richter wurde nichttodlich uberwaltigt und uberlebte ebenfalls gegen die verwechslung valeria beziehungsweise dame balina war keine branderscar gefangene ihre gefangennahme gehort zu thorns spaterer prufungs und ausbildungsumgebung ruckblick kein aktueller lageplan die flucht ist abgeschlossen das wiki schreibt aus dem veroffentlichten abenteuer keine ungesehenen raume geheimnisse oder spateren schicksale nachtraglich in die kampagne","initial":"B"},{"id":"thorn-manor","category":"orte","title":"Thorns Anwesen","summary":"Ort von Rekrutierung, Dornpakt, Neun Lektionen und langer Ausbildung.","body":"<h2>Ausbildungsphase<\/h2>\n<p>Nach der Flucht rekrutierte Thorn <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a>. Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus.<\/p>\n<h2>Balina und Timeon<\/h2>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon<\/a> gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen <a href=\"#/artikel/valeria\">Valeria<\/a> und einen eigenen Privatpakt an.<\/p>\n<h2>Datierung<\/h2>\n<p>Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.<\/p>","sources":["chronicle","history","relations"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":["Thorns Herrenhaus","Nine Lessons","Neun Lektionen"],"parent":"talingarde","text":"Ausbildungsphase Nach der Flucht rekrutierte Thorn Styke und Vesper . Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus. Balina und Timeon Dame Balina und ihr junger Knappe Timeon gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen Valeria und einen eigenen Privatpakt an. Datierung Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.","links":["styke","vesper","timeon","valeria"],"backlinks":["zeit-ausbildung"],"search":"thorns anwesen ort von rekrutierung dornpakt neun lektionen und langer ausbildung thorns herrenhaus nine lessons neun lektionen fruhere stationen ausbildungsphase nach der flucht rekrutierte thorn styke und vesper rund neunzig tage ausbildung die neun lektionen und der dornpakt gehoren zu dieser station die white ravens um elise trainierten als zweiter knoten im selben haus balina und timeon dame balina und ihr junger knappe timeon gerieten wahrend dieser phase in gefangenschaft balina wurde schwer misshandelt und konditioniert spater nahm sie den namen valeria und einen eigenen privatpakt an datierung die chronik uberliefert fur diese phase relative ausbildungstage aber keine vollstandige folge absoluter kalenderdaten","initial":"T"},{"id":"frosthamar","category":"orte","title":"Frosthamar","summary":"Das Schiff der nördlichen Waffenlieferung. Nach Odenkirks Tod zerstört.","body":"<h2>Reise und Begegnungen<\/h2>\n<p>Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor.<\/p>\n<h2>Ende des Schiffs<\/h2>\n<p>Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört.<\/p>\n<h2>Inventargrenze<\/h2>\n<p>Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.<\/p>\n","sources":["chronicle","history"],"status":"Historisch / zerstört","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Reise und Begegnungen Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor. Ende des Schiffs Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört. Inventargrenze Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.","links":[],"backlinks":["odenkirk","story-so-far"],"search":"frosthamar das schiff der nordlichen waffenlieferung nach odenkirks tod zerstort fruhere stationen reise und begegnungen die nordreise verband den knoten mit sakkarot der patrouille unter edward sambryl und den yutak elfenbein und der narwalzahn gingen aus dem handel hervor ende des schiffs sechs seeleute verliessen odenkirks mannschaft und nahmen stykes dienst an odenkirk starb das schiff wurde nach bergung tragbarer wertsachen und thorns zahlung zerstort inventargrenze die frosthamar ist kein noch verfugbares transportmittel ihr fruheres deck vorrate und beutestucke gelten nicht automatisch als heutiges eigentum der gruppe","initial":"F"},{"id":"talingarde","category":"welt","title":"Talingarde","summary":"Isoliertes Inselkönigreich, beherrscht von Haus Darius und öffentlich geprägt durch Mitra.","body":"<h2>Öffentliches Selbstbild<\/h2>\n<p>Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse.<\/p>\n<h2>Herrschaft und Religion<\/h2>\n<p><a href=\"#/artikel/darius\">Haus Darius<\/a> regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt.<\/p>\n<h2>Die sechs Großräume<\/h2>\n<p>Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die <a href=\"#/artikel/watch-wall\">Watch Wall<\/a> sichert die nördlichen Zugänge.<\/p>\n<h2>Kampagnenanpassung<\/h2>\n<p>Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird <a href=\"#/artikel/golarion\">Golarion<\/a> verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.<\/p>\n","sources":["common","cultures","localrules"],"status":"Allgemeinwissen","tags":["Setting","Insel"],"aliases":[],"text":"Öffentliches Selbstbild Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse. Herrschaft und Religion Haus Darius regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt. Die sechs Großräume Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die Watch Wall sichert die nördlichen Zugänge. Kampagnenanpassung Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird Golarion verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.","links":["darius","watch-wall","golarion"],"backlinks":[],"search":"talingarde isoliertes inselkonigreich beherrscht von haus darius und offentlich gepragt durch mitra setting insel offentliches selbstbild talingarde versteht sich als reich von recht ordnung und gute priester pflegen kranke ritter sollen schwache schutzen die krone und die kirche stutzen einander das spielerhandout beschreibt dieses selbstbild aus sicht eines gewohnlichen einwohners es ist kein bericht uber alle verborgenen machtverhaltnisse herrschaft und religion haus darius regiert unter konig markadian v dem tapferen mitra pragt das offentliche leben die verehrung asmodeus ist verboten und mit dem feuertod bedroht andere nichtbose religionen sind technisch nicht gleichermassen verboten gesellschaftlich aber stark zuruckgedrangt die sechs grossraume cambrian ports heartland borderlands caer bryr savage north und die inseln der yutak der suden ist gemassigter der norden kalt und vielfach verschneit die watch wall sichert die nordlichen zugange kampagnenanpassung talingarde bleibt in geschichte und institutionen talingarde als ausserer weltraum wird golarion verwendet ohne exakte lage nachste kuste oder diplomatische beziehungen bereits festzuschreiben","initial":"T"},{"id":"mitra","category":"welt","title":"Mitra","summary":"Herr des Lichts: Heilung, Güte und Führung im öffentlichen Glauben Talingardes.","body":"<h2>Öffentliche Glaubenswelt<\/h2>\n<p>Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden.<\/p>\n<h2>Personen und Institutionen<\/h2>\n<p>Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. <a href=\"#/artikel/valeria\">Valeria<\/a> wurde als Mitra-Ritterin geprägt, <a href=\"#/artikel/timeon\">Timeon<\/a> hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis.<\/p>\n<h2>Gegnerbild<\/h2>\n<p>Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.<\/p>\n","sources":["common","core","valeria"],"status":"Allgemeinwissen","tags":["Religion"],"aliases":[],"text":"Öffentliche Glaubenswelt Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden. Personen und Institutionen Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. Valeria wurde als Mitra-Ritterin geprägt, Timeon hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis. Gegnerbild Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.","links":["valeria","timeon"],"backlinks":[],"search":"mitra herr des lichts heilung gute und fuhrung im offentlichen glauben talingardes religion offentliche glaubenswelt mitra wird als konig heiler oder lebendige flamme dargestellt licht heilung gute und fuhrung gehoren zum offentlich bekannten glaubensbild seine kirche ist in den orten des reiches prasent und eng mit haus darius verbunden personen und institutionen father donnagin vertritt diesen glauben im aktuellen festungsumfeld valeria wurde als mitra ritterin gepragt timeon halt an seiner eigenen mitranischen orientierung fest der hochkardinal heisst nach dem allgemeinen spielerwissen vitallian von estyllis gegnerbild asmodeus gilt als erzfeind dass dieses verhaltnis politisch und rechtlich tief in talingarde reicht macht nicht jeden einzelnen priester zur gleichen personlichkeit","initial":"M"},{"id":"asmodeus","category":"welt","title":"Asmodeus","summary":"Herr der Neun Höllen, verbotener Gott und oberste Bindung in den Pakten des Knotens.","body":"<h2>Öffentlich bekannte Geschichte<\/h2>\n<p>Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor.<\/p>\n<h2>Heutige Gefahr<\/h2>\n<p>Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen.<\/p>\n<h2>Kampagnenbezug<\/h2>\n<p>Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.<\/p>\n","sources":["common","relations","factions","house"],"status":"Allgemeinwissen","tags":["Religion","Pakte"],"aliases":[],"text":"Öffentlich bekannte Geschichte Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor. Heutige Gefahr Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen. Kampagnenbezug Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.","links":[],"backlinks":[],"search":"asmodeus herr der neun hollen verbotener gott und oberste bindung in den pakten des knotens religion pakte offentlich bekannte geschichte asmodeus gehorte vor der herrschaft der darius zum talireanischen pantheon gefurchtet und respektiert markadian iv der eiferer verbot den glauben und liess tempel und fuhrende geistliche verfolgen das allgemeine spielerwissen verortet die grossen sauberungen etwa zwanzig jahre zuvor heutige gefahr offentliche asmodeus verehrung ist eine todliche rechtliche gefahr sie unterscheidet sich im recht des reiches von bloss gesellschaftlich missbilligten nichtbosen nebenreligionen kampagnenbezug thorn der dornpakt und der avernische knoten stehen im asmodeischen rahmen valerias privatpakt benennt asmodeus als hochste instanz aber der pakt allein verleiht ihr keine nicht vorhandenen klassenfahigkeiten","initial":"A"},{"id":"darius","category":"welt","title":"Haus Darius und die Krone","summary":"Die öffentlich bekannte Herrscherfamilie Talingardes.","body":"<h2>Gegenwärtige Herrschaft<\/h2>\n<p>Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet.<\/p>\n<h2>Historische Eckpunkte<\/h2>\n<p>Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens.<\/p>\n<h2>Politischer Rahmen<\/h2>\n<p>Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.<\/p>\n","sources":["common","cultures"],"status":"Allgemeinwissen","tags":["Adel","Geschichte"],"aliases":["Markadian","Bellinda","Lucinda","Vitallian","Haus Barca","Tamberlyn"],"text":"Gegenwärtige Herrschaft Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet. Historische Eckpunkte Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens. Politischer Rahmen Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.","links":[],"backlinks":["talingarde"],"search":"haus darius und die krone die offentlich bekannte herrscherfamilie talingardes markadian bellinda lucinda vitallian haus barca tamberlyn adel geschichte gegenwartige herrschaft markadian v genannt der tapfere ist konig seine tochter bellinda ist nach dem allgemeinen spielerhandout zwanzig und unverheiratet konigin lucinda starb bei der geburt markadian heiratete nicht wieder daraus werden keine verborgenen familiengeheimnisse abgeleitet historische eckpunkte markadian i der sieger begrundete die dynastie und besiegte das fruhere haus barca bei tamberlyn seine offentliche erinnerung lebt in denkmalern fort markadian iv der eiferer steht fur die verfolgung des asmodeus glaubens politischer rahmen haus darius und die kirche mitras tragen gemeinsam die offentliche ordnung herkunft rang haushalt und beziehungen sind wichtige soziale grossen aber kein ersatz fur individuell bekannte loyalitaten","initial":"H"},{"id":"watch-wall","category":"welt","title":"Die Watch Wall","summary":"Zwölf Festungen an Talingardes nördlicher Grenze.","body":"<h2>Öffentlich bekannter Zweck<\/h2>\n<p>Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze.<\/p>\n<h2>Aktueller Kampagnenausschnitt<\/h2>\n<p>Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.<\/p>\n","sources":["common","balentyne","live"],"status":"Allgemeinwissen","tags":["Grenze","Festungen"],"aliases":[],"text":"Öffentlich bekannter Zweck Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze. Aktueller Kampagnenausschnitt Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.","links":[],"backlinks":["talingarde"],"search":"die watch wall zwolf festungen an talingardes nordlicher grenze grenze festungen offentlich bekannter zweck die zwolf grenzfestungen kontrollieren die zugange aus dem savage north sie sollen das reich gegen uberfalle und grossere einfalle schutzen markadian v verdankt seinen beinamen nach dem allgemeinen wissen der verteidigung dieser grenze aktueller kampagnenausschnitt balentyne ist der erreichte schauplatz die gruppe kennt weder automatisch die inneren plane der anderen festungen noch ihren gegenwartigen sicherheitszustand der auftrag verlangt hier eine bresche fur sakkarots heer","initial":"D"},{"id":"borderlands","category":"welt","title":"Die Borderlands","summary":"Grenzland aus Militärversorgung, Landwirtschaft, Wäldern und harten Wintern.","body":"<h2>Alltag<\/h2>\n<p>Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut.<\/p>\n<h2>Lokale Verflechtung<\/h2>\n<p>Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle.<\/p>\n<h2>Tarnung<\/h2>\n<p>Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.<\/p>\n","sources":["cultures","aldencross"],"status":"Allgemeinwissen","tags":["Region","Kultur"],"aliases":[],"text":"Alltag Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut. Lokale Verflechtung Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle. Tarnung Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.","links":[],"backlinks":[],"search":"die borderlands grenzland aus militarversorgung landwirtschaft waldern und harten wintern region kultur alltag zwischen heartland und savage north pragen patrouillen alte zwergenbauten hofe wald see und flussverkehr den alltag winter sind streng fruhjahre nass schlamm und nebel vertraut lokale verflechtung im umfeld aldencross kennen arbeiter fuhrleute soldaten und handwerker viele gesichter und routinen dienst ehe handel reparaturen und verluste verbinden ort und festung das ist praktische ortskenntnis keine kenntnis aller befehle tarnung route beruf gerat sprache und burgen entscheiden wie ein fremder eingeordnet wird ein plausibler nordhandler kann weniger auffallen als jemand der vorgibt seit jahren zur lokalen arbeiterschaft zu gehoren","initial":"D"},{"id":"regionen","category":"welt","title":"Regionen und Städte Talingardes","summary":"Überblick über die bekannte Insel, ohne verborgene Abenteuerorte freizuschalten.","body":"<h2>Cambrian Ports<\/h2>\n<p>Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von <a href=\"#/artikel/styke\">Styke<\/a> genannten Lehrmeisters Zarik erwähnt.<\/p>\n<h2>Heartland<\/h2>\n<p>Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben.<\/p>\n<h2>Caer Bryr<\/h2>\n<p>Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen.<\/p>\n<h2>Savage North<\/h2>\n<p>Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen.<\/p>\n<h2>Inseln der Yutak<\/h2>\n<p>Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. <a href=\"#/artikel/white-tusk\">White Tusk<\/a> und Joseph sind individuelle Kontakte, nicht das gesamte Volk.<\/p>\n","sources":["common","cultures","history"],"status":"Allgemeinwissen","tags":["Geographie"],"aliases":["Matharyn","Ghastenhall","Daveryn","Caer Bryr","Iraen","Heartland","Savage North","Cambrian Ports"],"text":"Cambrian Ports Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von Styke genannten Lehrmeisters Zarik erwähnt. Heartland Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben. Caer Bryr Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen. Savage North Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen. Inseln der Yutak Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. White Tusk und Joseph sind individuelle Kontakte, nicht das gesamte Volk.","links":["styke","white-tusk"],"backlinks":[],"search":"regionen und stadte talingardes uberblick uber die bekannte insel ohne verborgene abenteuerorte freizuschalten matharyn ghastenhall daveryn caer bryr iraen heartland savage north cambrian ports geographie cambrian ports matharyn ghastenhall und daveryn sind die grossen urbanen zentren an der bucht von cambria regierung reichtum gelehrsamkeit schiffahrt theater und handwerk konzentrieren sich hier starker daveryn wurde im spiel auch als herkunftsort des von styke genannten lehrmeisters zarik erwahnt heartland besiedeltes ackerland dorfer marktstrassen verwaltete walder pfarrleben und landritter jahreszeit vorrate und lokale pflichten pragen das leben caer bryr grosser waldraum der iraen deren gemeinschaften weitgehend ausserhalb effektiver darischer herrschaft und der alltaglichen krone mitra verwaltung stehen kontakte konnen handel distanz und konflikt umfassen savage north kalter norden jenseits der gesicherten grenzzugange die sudlichen erzahlungen uber seine bewohner sind keine vollstandige neutrale beschreibung sakkarots vereintes heer ist eine politische leistung nicht der selbstverstandliche zustand aller nordlichen gruppen inseln der yutak nordliche inselgemeinschaften mit starkem bezug zu seefahrt jagd fischfang und tausch white tusk und joseph sind individuelle kontakte nicht das gesamte volk","initial":"R"},{"id":"norspiker","category":"welt","title":"Norspiker","summary":"Nordische Seeleute mit Ulfen-Bezug in der Kampagnenanpassung.","body":"<h2>Kanon der Kampagne<\/h2>\n<p>Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt.<\/p>\n<h2>Lebenswelt und Individualität<\/h2>\n<p>Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz.<\/p>\n<p><a href=\"#/artikel/hakon\">Hakon<\/a>, <a href=\"#/artikel/sten\">Sten<\/a>, <a href=\"#/artikel/ketil\">Ketil<\/a>, <a href=\"#/artikel/eirik\">Eirik<\/a>, <a href=\"#/artikel/arved\">Arved<\/a>, <a href=\"#/artikel/torvald\">Torvald<\/a> und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.<\/p>\n","sources":["cultures","history"],"status":"Kampagnenkonversion","tags":["Kultur","Sprache"],"aliases":["Norspik","Ulfen","Skald"],"text":"Kanon der Kampagne Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt. Lebenswelt und Individualität Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz. Hakon , Sten , Ketil , Eirik , Arved , Torvald und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.","links":["hakon","sten","ketil","eirik","arved","torvald"],"backlinks":[],"search":"norspiker nordische seeleute mit ulfen bezug in der kampagnenanpassung norspik ulfen skald kultur sprache kanon der kampagne norspiker werden als ulfen assoziiertes seefahrervolk behandelt norspik bleibt der gebrauchte sprachname und gilt als mit skald verwandt die bezeichnung wird nicht einfach durch ulfen ersetzt lebenswelt und individualitat schiffe sind arbeitsplatz eigentum unterkunft hierarchie und uberlebensraum handel fischfang kriegsfahrt lohnarbeit verwandtschaft und eide konnen nebeneinander stehen begrenztes common ist kein zeichen geringer intelligenz hakon sten ketil eirik arved torvald und odenkirk bleiben individuelle personen mit unterschiedlicher stellung im akzeptierten verlauf","initial":"N"},{"id":"yutak","category":"welt","title":"Yutak","summary":"Nördliche Inselgemeinschaften, mit denen die Gruppe Handel trieb.","body":"<h2>Kulturrahmen<\/h2>\n<p>Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise.<\/p>\n<h2>Kontakte statt Pauschalbild<\/h2>\n<p><a href=\"#/artikel/white-tusk\">White Tusk<\/a> und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose.<\/p>\n<h2>Politischer Rahmen<\/h2>\n<p>Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.<\/p>\n","sources":["cultures","history","chronicle"],"status":"Allgemeinwissen","tags":["Kultur","Nordreise"],"aliases":[],"text":"Kulturrahmen Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise. Kontakte statt Pauschalbild White Tusk und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose. Politischer Rahmen Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.","links":["white-tusk"],"backlinks":["sambryl","story-so-far"],"search":"yutak nordliche inselgemeinschaften mit denen die gruppe handel trieb kultur nordreise kulturrahmen seewege fischfang jagd haltbare nahrung haute knochen wetterkenntnis und verwandtschaft sind wichtige grundlagen nutzliche werkzeuge metall stoff und gebrauchsguter konnen einen anderen wert haben als blosse sudliche geldpreise kontakte statt pauschalbild white tusk und joseph gehoren zur abgeschlossenen nordreise ihre aufgaben autoritaten und wissen sind nicht identisch der handel brachte die spater in aldencross verkauften elfenbeinlose politischer rahmen das kulturdossier nennt einen alten frieden talingardes mit yutak hauptlingen eine konkrete begegnung bleibt trotzdem von vorherigen erfahrungen bedarf und umgang abhangig","initial":"Y"},{"id":"abstammungen","category":"welt","title":"Abstammungen im bekannten Talingarde","summary":"Die im Kampagnenumfeld wichtigen Abstammungen und ihre Grenzen.","body":"<h2>Aasimar und Tiefling<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. <a href=\"#/artikel/vesper\">Vesper<\/a> wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich.<\/p>\n<h2>Menschen, Zwerge und Halblinge<\/h2>\n<p>Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit.<\/p>\n<h2>Oger und Burabar<\/h2>\n<p><a href=\"#/artikel/grumblejack\">Grumblejack<\/a> bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden.<\/p>\n<h2>Konstrukte und Tritonen<\/h2>\n<p><a href=\"#/artikel/verse\">Verse<\/a> ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. <a href=\"#/artikel/nerianus\">Nerianus<\/a> besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.<\/p>","sources":["ancestries","styke","vesper","cultures","verse"],"status":"Weltreferenz","tags":["Abstammungen"],"aliases":["Aasimar","Tiefling","Oger","Zwerg","Halbling","Bugbear","Burabar","Triton","Konstrukt"],"text":"Aasimar und Tiefling Styke ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. Vesper wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich. Menschen, Zwerge und Halblinge Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit. Oger und Burabar Grumblejack bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden. Konstrukte und Tritonen Verse ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. Nerianus besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.","links":["styke","vesper","grumblejack","verse","nerianus"],"backlinks":[],"search":"abstammungen im bekannten talingarde die im kampagnenumfeld wichtigen abstammungen und ihre grenzen aasimar tiefling oger zwerg halbling bugbear burabar triton konstrukt abstammungen aasimar und tiefling styke ist ein hellhautiger aasimar mit eisblauen augen und silbernen hofen vesper wirkt auf den ersten blick menschlich alabasterfarbene haut schwarzes haar mit blauem schimmer keine sichtbaren horner erst ihr langer greifschwanz verrat das asurablut deutlich menschen zwerge und halblinge menschen stellen die mehrheit im bekannten talingarde zwerge gehoren zur alten geschichte des landes und stellen in balentyne unter anderem das technische torhauspersonal halblinge leben in eigenen gemeinschaften und berufen barnabus eisenbauchs trinksitten sind eine personliche gewohnheit oger und burabar grumblejack bringt enorme reichweite kraft gewicht und hunger in jede reiseplanung die bugbears des nordens nennen sich haufig burabar sakkarot hat getrennte stamme durch waffen disziplin und das versprechen eines feldzugs zu einem heer verbunden konstrukte und tritonen verse ist ein erwachtes reliquiarwesen mit beschadigter erinnerung neuen eigenen gedanken und der fahigkeit vesper zu widersprechen nerianus besitzt tritonische wasseranpassung sein wissen stammt aus seiner personlichen erfahrung nicht aus seiner abstammung","initial":"A"},{"id":"golarion","category":"welt","title":"Golarion als Außenwelt","summary":"Die offene Umgebung Talingardes, nicht eine nachträgliche Verlegung der Inselgeschichte.","body":"<h2>Festgelegte Anpassung<\/h2>\n<p>Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt.<\/p>\n<h2>Erwähnte Zukunftswünsche<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit <a href=\"#/artikel/vesper\">Vesper<\/a>. Das ist belegt als <strong>Gespräch und Wunsch<\/strong>, nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.<\/p>\n","sources":["localrules","cultures","live"],"status":"Kampagnenkonversion","tags":["Außenwelt"],"aliases":["Absalom","Qadira"],"text":"Festgelegte Anpassung Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt. Erwähnte Zukunftswünsche Styke sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit Vesper . Das ist belegt als Gespräch und Wunsch , nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.","links":["styke","vesper"],"backlinks":["talingarde"],"search":"golarion als aussenwelt die offene umgebung talingardes nicht eine nachtragliche verlegung der inselgeschichte absalom qadira aussenwelt festgelegte anpassung die kampagne benutzt golarion fur den ursprunglich undefinierten aussenraum talingardes eigene geschichte religion krone und institutionen bleiben erhalten exakte meereslage nachste kusten und politische beziehungen sind nicht pauschal gesetzt erwahnte zukunftswunsche styke sprach am 31 januar von einer lebensverlangernden blume in qadira und einer gotterprufung in absalom als moglichen horizonten einer gemeinsamen zukunft mit vesper das ist belegt als gesprach und wunsch nicht als ausgewahlte folgequest oder verifiziertes detail einer solchen reise","initial":"G"},{"id":"nessian-knot","category":"gruppen","title":"Der Nessianische Knoten","summary":"Der Knoten reist als wachsender Haushalt nach Süden; Schutz, Forschung, Handwerk und Logistik sind verteilt.","body":"<h2>Der Nessische Knoten<\/h2><p>Styke und Vesper führen den Knoten gemeinsam. Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden; Hakon und seine fünf Gefährten dienen gegen Sold; Grumblejack bleibt freier Freund.<\/p><h2>Auf Halstyn’s Folly<\/h2><p>Der erste Auftrag ist erfüllt. Der gesamte gewählte Haushalt reist mit sechs Pferden und geborgener Ausrüstung nach Süden. Tamsin führt die Sicherheit, Nella Logistik und Betriebsfonds, Kaitlyn die vorläufige Menschen-und-Besitz-Linie, Tacitus Forschung und Mirelle ihr Handwerk.<\/p><h2>Kasse<\/h2><p>Die liquide gemeinsame Reserve beträgt <strong>17.271 gp<\/strong>. Gewöhnliche Einnahmen der Requisitionsfahrten werden getrennt als Betriebsfonds für Haushalt, Lohn, Pferde, Reparaturen und Ersatz geführt.<\/p>","sources":["live","chronicle","knot-pact","relations"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Asmodeus","Knoten","Gefolge","Befehlskette"],"aliases":["Nessian Knot","Nessianischer Knoten"],"text":"Der Nessische Knoten Styke und Vesper führen den Knoten gemeinsam. Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden; Hakon und seine fünf Gefährten dienen gegen Sold; Grumblejack bleibt freier Freund. Auf Halstyn’s Folly Der erste Auftrag ist erfüllt. Der gesamte gewählte Haushalt reist mit sechs Pferden und geborgener Ausrüstung nach Süden. Tamsin führt die Sicherheit, Nella Logistik und Betriebsfonds, Kaitlyn die vorläufige Menschen-und-Besitz-Linie, Tacitus Forschung und Mirelle ihr Handwerk. Kasse Die liquide gemeinsame Reserve beträgt 17.271 gp . Gewöhnliche Einnahmen der Requisitionsfahrten werden getrennt als Betriebsfonds für Haushalt, Lohn, Pferde, Reparaturen und Ersatz geführt.","links":[],"backlinks":[],"search":"der nessianische knoten der knoten reist als wachsender haushalt nach suden schutz forschung handwerk und logistik sind verteilt nessian knot nessianischer knoten asmodeus knoten gefolge befehlskette der nessische knoten styke und vesper fuhren den knoten gemeinsam valeria ist eigenstandige kerngefahrtin und feldfuhrerin tamsin nella kaitlyn mirelle und tacitus sind uber den compact gebunden hakon und seine funf gefahrten dienen gegen sold grumblejack bleibt freier freund auf halstyn s folly der erste auftrag ist erfullt der gesamte gewahlte haushalt reist mit sechs pferden und geborgener ausrustung nach suden tamsin fuhrt die sicherheit nella logistik und betriebsfonds kaitlyn die vorlaufige menschen und besitz linie tacitus forschung und mirelle ihr handwerk kasse die liquide gemeinsame reserve betragt 17 271 gp gewohnliche einnahmen der requisitionsfahrten werden getrennt als betriebsfonds fur haushalt lohn pferde reparaturen und ersatz gefuhrt","initial":"D"},{"id":"feldgruppe","category":"gruppen","title":"Hakons Feldgruppe","summary":"Hakon und seine fünf Gefährten reisen mit Grumblejack, sechs Pferden und dem Knotenhaushalt auf Halstyn’s Folly.","body":"<h2>Zusammensetzung<\/h2><p>Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt freier Freund; sein Pferd Varlet ist eines der sechs Tiere an Bord.<\/p><h2>Auf der Flussfahrt<\/h2><p>Hakon übernahm beim Beladen die Fachführung. Die Norspiker helfen mit Pferden, Fracht, Wachen und den Säcken der Requisitionsfahrten. Ihre längerfristige Stellung nach der Reise bleibt offen.<\/p><h2>Bezahlung<\/h2><p>Der Angriffsnachtbonus von 300 gp wurde bereits gezahlt. Gewöhnlicher Unterhalt und Lohn werden während der Fahrt aus dem Betriebsfonds getragen.<\/p>","sources":["factions","live","core"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Verbündete","Feldarbeit","7. Februar"],"aliases":[],"text":"Zusammensetzung Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt freier Freund; sein Pferd Varlet ist eines der sechs Tiere an Bord. Auf der Flussfahrt Hakon übernahm beim Beladen die Fachführung. Die Norspiker helfen mit Pferden, Fracht, Wachen und den Säcken der Requisitionsfahrten. Ihre längerfristige Stellung nach der Reise bleibt offen. Bezahlung Der Angriffsnachtbonus von 300 gp wurde bereits gezahlt. Gewöhnlicher Unterhalt und Lohn werden während der Fahrt aus dem Betriebsfonds getragen.","links":[],"backlinks":[],"search":"hakons feldgruppe hakon und seine funf gefahrten reisen mit grumblejack sechs pferden und dem knotenhaushalt auf halstyn s folly verbundete feldarbeit 7 februar zusammensetzung hakon fuhrt sten ketil eirik arved und torvald grumblejack bleibt freier freund sein pferd varlet ist eines der sechs tiere an bord auf der flussfahrt hakon ubernahm beim beladen die fachfuhrung die norspiker helfen mit pferden fracht wachen und den sacken der requisitionsfahrten ihre langerfristige stellung nach der reise bleibt offen bezahlung der angriffsnachtbonus von 300 gp wurde bereits gezahlt gewohnlicher unterhalt und lohn werden wahrend der fahrt aus dem betriebsfonds getragen","initial":"H"},{"id":"eisenbauch-crew","category":"gruppen","title":"Eisenbauchs Mannschaft","summary":"Barnabus und zehn Torhausarbeiter; am frühen 9. Februar im Schlaf getötet.","body":"<h2>Die elf Zwerge<\/h2><p>Barnabus Eisenbauch und zehn Arbeiter wohnten im Dalliance und warteten Balentynes Torhaus. Ihre technischen Informationen halfen bei der Sabotage.<\/p>\n<h2>Ende<\/h2><p>Styke und Hakon töteten alle elf am frühen 9. Februar im Schlaf. Die Körper, Werkzeuge, Rüstungen, Waffen und Barnabus’ persönlicher Besitz liegen weiterhin oben. Es wurde nichts geplündert oder verkauft.<\/p>","sources":["core","live","factions","chronicle"],"status":"Aufgelöst / alle elf tot","tags":["Zwerge","Handwerk"],"aliases":[],"text":"Die elf Zwerge Barnabus Eisenbauch und zehn Arbeiter wohnten im Dalliance und warteten Balentynes Torhaus. Ihre technischen Informationen halfen bei der Sabotage. Ende Styke und Hakon töteten alle elf am frühen 9. Februar im Schlaf. Die Körper, Werkzeuge, Rüstungen, Waffen und Barnabus’ persönlicher Besitz liegen weiterhin oben. Es wurde nichts geplündert oder verkauft.","links":[],"backlinks":[],"search":"eisenbauchs mannschaft barnabus und zehn torhausarbeiter am fruhen 9 februar im schlaf getotet zwerge handwerk die elf zwerge barnabus eisenbauch und zehn arbeiter wohnten im dalliance und warteten balentynes torhaus ihre technischen informationen halfen bei der sabotage ende styke und hakon toteten alle elf am fruhen 9 februar im schlaf die korper werkzeuge rustungen waffen und barnabus personlicher besitz liegen weiterhin oben es wurde nichts geplundert oder verkauft","initial":"E"},{"id":"white-ravens","category":"gruppen","title":"Die White Ravens","summary":"Elise Zadarias eigene Gruppe aus der Ausbildungsphase.","body":"<h2>Bekannte Mitglieder und Beziehungen<\/h2>\n<p><a href=\"#/artikel/elise\">Elise Zadaria<\/a>, Tallus Trak Rackburn, Titus Trik Rackburn, <a href=\"#/artikel/dostan\">Dostan Alfson<\/a> und Elises Begleiter <a href=\"#/artikel/frost\">Frost<\/a> gehören zum historischen Rahmen. Trak und Trik sind unterschiedliche Brüder.<\/p>\n<h2>Verhältnis zum Kerntrio<\/h2>\n<p>Persönliche und intime Nähe zwischen Elise, <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> erzeugte keine Übernahme ihrer Gefolgsleute. Elise hielt daran fest, dass die White Ravens ihre eigenen Leute sind.<\/p>\n<h2>Gegenwart<\/h2>\n<p>Die genaue Position nach der Ausbildung ist im aktuellen Kampagnenarchiv offen. Daraus wird keine künftige Hilfe oder Feindschaft vorgeschrieben.<\/p>\n","sources":["history"],"status":"Bestätigt","tags":["Historisch","Elise"],"aliases":[],"text":"Bekannte Mitglieder und Beziehungen Elise Zadaria , Tallus Trak Rackburn, Titus Trik Rackburn, Dostan Alfson und Elises Begleiter Frost gehören zum historischen Rahmen. Trak und Trik sind unterschiedliche Brüder. Verhältnis zum Kerntrio Persönliche und intime Nähe zwischen Elise, Styke und Vesper erzeugte keine Übernahme ihrer Gefolgsleute. Elise hielt daran fest, dass die White Ravens ihre eigenen Leute sind. Gegenwart Die genaue Position nach der Ausbildung ist im aktuellen Kampagnenarchiv offen. Daraus wird keine künftige Hilfe oder Feindschaft vorgeschrieben.","links":["elise","dostan","frost","styke","vesper"],"backlinks":["dostan","elise","frost","intim-elise","story-so-far","trak","trik","zeit-ausbildung"],"search":"die white ravens elise zadarias eigene gruppe aus der ausbildungsphase historisch elise bekannte mitglieder und beziehungen elise zadaria tallus trak rackburn titus trik rackburn dostan alfson und elises begleiter frost gehoren zum historischen rahmen trak und trik sind unterschiedliche bruder verhaltnis zum kerntrio personliche und intime nahe zwischen elise styke und vesper erzeugte keine ubernahme ihrer gefolgsleute elise hielt daran fest dass die white ravens ihre eigenen leute sind gegenwart die genaue position nach der ausbildung ist im aktuellen kampagnenarchiv offen daraus wird keine kunftige hilfe oder feindschaft vorgeschrieben","initial":"D"},{"id":"alerion","category":"gruppen","title":"Die Ritter des Alerion","summary":"Mitranischer Ritterorden und Valerias frühere institutionelle Heimat.","body":"<h2>Öffentliches Bild<\/h2>\n<p>Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat.<\/p>\n<h2>Kampagnenbezug<\/h2>\n<p>Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei <a href=\"#/artikel/styke\">Styke<\/a>, nicht bei <a href=\"#/artikel/valeria\">Valeria<\/a>.<\/p>\n","sources":["common","valeria","valsheet"],"status":"Allgemeinwissen","tags":["Orden","Mitra"],"aliases":[],"text":"Öffentliches Bild Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat. Kampagnenbezug Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei Styke , nicht bei Valeria .","links":["styke","valeria"],"backlinks":[],"search":"die ritter des alerion mitranischer ritterorden und valerias fruhere institutionelle heimat orden mitra offentliches bild der orden soll recht verteidigen schwache schutzen und gerechtigkeit uben nicht nur adlige konnen aufgenommen werden nicht jeder ritter ist ein paladin auch wenn der orden viele hervorgebracht hat kampagnenbezug dame balina gehorte zu dieser ritterlichen welt ihre glaubenskrise hat die fruhere ausbildung und verantwortung nicht ausgeloscht das silberne saphir symbol des ordens befindet sich heute bei styke nicht bei valeria","initial":"D"},{"id":"merrie-men","category":"gruppen","title":"Ye Merrie Men","summary":"Reisende Theatertruppe mit einer angekündigten Festungsaufführung.","body":"<h2>Gelegenheit<\/h2>\n<p>William Marcus Marlowes Truppe soll <em>The Fall of Amberlyn<\/em> in Balentyne spielen. Bellams Bericht macht die Aufführung zu einer bekannten möglichen Gelegenheit für legitime Bewegung in die Festung.<\/p>\n<h2>Noch offen<\/h2>\n<p>Datum, Uhrzeit, Einlass, Besetzung und Ablauf wurden nicht sicher festgelegt. Ein Termin wird hier nicht aus dem gedruckten Abenteuer als bereits bekannt eingesetzt.<\/p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theat liance.<\/p><h2>Antwort<\/h2><p>Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.<\/p>","sources":["core","factions","live"],"status":"Verbraucht / beantwortet","tags":["Gruppe"],"aliases":[],"text":"Thorns Tonsiegel Styke brach das Siegel, als Balentynes Ergebnis militärisch bereits unumkehrbar schien. Nach dem endgültigen Fall erschien Tiadora im Dalliance. Antwort Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.","links":[],"backlinks":[],"search":"nessianisches kontaktsiegel verbrauchtes kontaktsiegel tiadora erschien nach balentynes fall personlich im dalliance gruppe thorns tonsiegel styke brach das siegel als balentynes ergebnis militarisch bereits unumkehrbar schien nach dem endgultigen fall erschien tiadora im dalliance antwort sie uberbrachte thorns 5 000 gp erfolgszahlung und den befehl sofort zur halstyn s folly aufzubrechen das siegel selbst ist verbraucht","initial":"N"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"<h2>Herkunft<\/h2>\n<p>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt <a href=\"#/artikel/styke\">Styke<\/a>.<\/p>\n<h2>Wissensgrenze<\/h2>\n<p>Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.<\/p>\n","sources":["chronicle","live"],"status":"Nicht identifiziert","tags":["Styke"],"aliases":[],"text":"Herkunft Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt Styke . Wissensgrenze Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches  holte den cache vor dem angriff zuruck beim organisierten aufbruch wurde die tragbare ausrustung mit der ubrigen beute auf halstyn s folly verladen","initial":"V"},{"id":"ketten-beschlaege","category":"gegenstaende","title":"Ketten, Ringe, Nägel und Keile","summary":"Tacitus und Jacobian sind getrennt an den beiden vorbereiteten Wandketten im Tunnel gesichert.","body":"<h2>Installation<\/h2><p>Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang.<\/p>\n<p>Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten.<\/p>\n<h2>Grenze<\/h2><p>Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt.<\/p><h2>Aktuelle Verwendung<\/h2><p>Tacitus und Jacobian wurden nach dem Dinner an die beiden getrennten Wandketten gebracht. Beide sind gefesselt, geknebelt und ihrer erreichbaren Zauberwerkzeuge beraubt. Die Ketten ersetzen weiterhin keinen Wächter; bis zum aktuellen Rand entkam keiner von beiden.<\/p>","sources":["dalliance","live","chronicle"],"status":"Belegt / zwei Gefangene","tags":["Ketten","Tunnel","Vorbereitung"],"aliases":["Ketten","Beschläge"],"text":"Installation Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang. Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten. Grenze Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt. Aktuelle Verwendung Tacitus und Jacobian wurden nach dem Dinner an die tiert aktuell. Sie ist keine Rechtfertigung, alle verborgenen Räume oder heutigen Wachposten zu kennen. Eine genaue aktuelle Lagerstelle ist nicht sicher verzeichnet.","links":["timeon"],"backlinks":["timeon"],"search":"timeons erinnerungskarte grobe balentyne skizze aus personlicher erinnerung und gehortem gruppe herkunft timeon half in der ausbildungsphase eine grobe erinnerungskarte und einen begrenzten bericht zu balentyne zu erstellen verwendbarkeit die skizze ist unvollstandig und nicht garantiert aktuell sie ist keine rechtfertigung alle verborgenen raume oder heutigen wachposten zu kennen eine genaue aktuelle lagerstelle ist nicht sicher verzeichnet","initial":"T"},{"id":"exorzisten-buch","category":"gegenstaende","title":"Der Exorzisten-Reisebericht","summary":"Stykes alter Mitranischer Reisebericht eines Exorzisten; Kaitlyn brachte ihn am 7. Februar ins Dalliance zurück.","body":"<h2>Erwerb und Verwendung<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus.<\/p>\n<h2>Nicht verwechseln<\/h2>\n<p>Das ist <strong>nicht Vespers rotes Buch<\/strong>. Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen.<\/p>\n\n<h2>Rückkehr am 7. Februar<\/h2><p>Kaitlyn brachte das Buch bei ihrer morgendlichen Duellwarnung mit ins Dalliance. Es liegt wieder beim Knoten und gehört nicht mehr zum offenen Mott-Haus-Risiko.<\/p>","sources":["chronicle","live"],"status":"Im Besitz des Knotens","tags":["Styke"],"aliases":[],"text":"Erwerb und Verwendung Styke kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus. Nicht verwechseln Das ist nicht Vespers rotes Buch . Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen. Rückkehr am 7. Februar Kaitlyn brachte das Buch bei ihrer morgendlichen Duellwarnung mit ins Dalliance. Es liegt wieder beim Knoten und gehört nicht mehr zum offenen Mott-Haus-Risiko.","links":["styke"],"backlinks":["zeit-0128"],"search":"der exorzisten reisebericht stykes alter mitranischer reisebericht eines exorzisten kaitlyn brachte ihn am 7 februar ins dalliance zuruck styke erwerb und verwendung styke kaufte es am 28 januar bei jacobian es diente auch der deckgeschichte mit der kaitlyn ihn ins haus liess der letzte ausdrucklich genannte ablageort ist der vordere tisch im mott haus nicht verwechseln das ist nicht vespers rotes buch stykes eigentum am reisebericht beweist nicht dass er ihn wieder eingepackt hat eine spatere abholung ist nicht angenommen ruckkehr am 7 februar kaitlyn brachte das buch bei ihrer morgendlichen duellwarnung mit ins dalliance es liegt wieder beim knoten und gehort nicht mehr zum offenen mott haus risiko","initial":"D"},{"id":"rotes-buch","category":"gegenstaende","title":"Vespers rotes Buch","summary":"Vier sichtbare Textänderungen, starke Magie über dem ganzen Band und ein unveränderter Solo-Test mit Valeria; Tacitus schlug Langzeitvergleich vor.","body":"<h2>Das sichtbare Buch<\/h2><p>Vesper besaß das rote Buch bereits auf der Frosthamar. Der offen lesbare Stoff behandelt Augenbinden, Sinnesentzug, weiche Fesseln, Befehle, Warten, Verweigerung und weiblich geführten Machtwechsel.<\/p><h2>Vier beobachtete Veränderungen<\/h2><p>Seit der Nacht zum 2. Februar wurden mindestens vier Veränderungen oder Erweiterungen des Textes beobachtet. In der Nacht zum 7. Februar erschien ein Absatz über Präzision und Spannung, der auffällig zu Mirelles Arbeit passte. Vesper kopierte ihn wortgetreu.<\/p><p>Am Abend des 7. Februar prüften Styke, Vesper und Valeria eine spätere Passage absichtlich: Styke blieb Zuschauer, während Vesper und Valeria einander wählten. Unmittelbar danach stand am früheren Absatzende eine neue Zeile. Zorn bestätigte, dass sie zuvor nicht dort gestanden hatte.<\/p><h2>Magische Untersuchung<\/h2><p>Die starke Aura liegt über dem ganzen Buch. Vesper erkannte Divination, Illusion und eine tiefere unbestimmte Komponente. <em>Identify<\/em> lieferte weder Eigenschaften noch Befehlswörter und bewies keine bestimmte Artefaktklasse.<\/p><h2>Vergleich am 8. Februar<\/h2><p>Vesper sicherte den aktuellen Seitenstand wortgetreu. Valeria las das Buch danach allein, ohne Vespers Stimme und ohne vorherige Hinweise auf erwartete Stellen. Dabei erschien keine neue Zeile und kein sichtbarer Text änderte sich.<\/p><h2>Tacitus’ Vorschlag<\/h2><p>Nach ihrer Gefangennahme durfte Tacitus das Buch und die Abschriften unter Aufsicht untersuchen. Sie schlug einen langfristigen Vergleich identischer Seitenstände vor und sagte, sie wolle den Band wiedersehen, falls sie überlebt. Herkunft, Bewusstsein und vollständige Kräfte bleiben offen.<\/p><h2>Die Stimme zwischen den Seiten<\/h2><p><a href=\"#/artikel/zwischen-den-seiten\">Zwischen meinen Seiten<\/a> erzählt das bisherige Erwachen als Prosahistorie aus der möglichen Wahrnehmung des Buches.<\/p>","sources":["redbook-current","vesper","live"],"status":"Stirring / Vergleich läuft","tags":["Vesper","Calistria","Magie","Veränderter Text","Vier Änderungen"],"aliases":[],"text":"Das sichtbare Buch Vesper besaß das rote Buch bereits auf der Frosthamar. Der offen lesbare Stoff behandelt Augenbinden, Sinnesentzug, weiche Fesseln, Befehle, Warten, Verweigerung und weiblich geführten Machtwechsel. Vier beobachtete Veränderungen Seit der Nacht zum 2. Februar wurden mindestens vier Veränderungen oder Erweiterungen des Textes beobachtet. In der Nacht zum 7. Februar erschien ein Absatz über Präzision und Spannung, der auffällig zu Mirelles Arbeit passte. Vesper kopierte ihn wortgetreu. Am Abend des 7. Februar prüften Styke, Vesper und Valeria eine spätere Passage absichtlich: Styke blieb Zuschauer, während Vesper und Valeria einander wählten. Unmittelbar danach stand am früheren Absatzende eine neue Zeile. Zorn bestätigte, dass sie zuvor nicht dort gestanden hatte. Magische Untersuchung Die starke Aura liegt über dem ganzen Buch. Vesper erkannte Divination, Illusion und eine tiefere unbestimmte Komponente. Identify lieferte weder Eigenschaften noch Befehlswörter und bewies keine bestimmte Artefaktklasse. Vergleich am 8. Februar Vesper sicherte den aktuellen Seitenstand wortgetreu. Valeria las das Buch danach allein, ohne Vespers Stimme und ohne vorherige Hinweise auf erwartete Stellen. Dabei erschien keine neue Zeile und kein sichtbarer Text änderte sich. Tacitus’ Vorschlag Nach ihrer Gefangennahme durfte Tacitus das Buch und die Abschriften unter Aufsicht untersuchen. Sie schlug einen langfristigen Vergleich identischer Seitenstände vor und sagte, sie wolle den Band wiedersehen, falls sie überlebt. Herkunft, Bewusstsein und vollständige Kräfte bleiben offen. Die Stimme zwischen den Seiten Zwischen meinen Seiten erzählt das bisherige Erwachen als Prosahistorie aus der möglichen Wahrnehmung des Buches.","links":["zwischen-den-seiten"],"backlinks":["vesper"],"search":"vespers rotes buch vier sichtbare textanderungen starke magie uber dem ganzen band und ein unveranderter solo test mit valeria tacitus schlug langzeitvergleich vor vesper calistria magie veranderter text vier anderungen das sichtbare buch vesper besass das rote buch bereits auf der frosthamar der offen lesbare stoff behandelt augenbinden sinnesentzug weiche fesseln befehle warten verweigerung und weiblich gefuhrten machtwechsel vier beobachtete veranderungen seit der nacht zum 2 februar wurden mindestens vier veranderungen oder erweiterungen des textes beobachtet in der nacht zum 7 februar erschien ein absatz uber prazision und spannung der auffallig zu mirelles arbeit passte vesper kopierte ihn wortgetreu am abend des 7 februar pruften styke vesper und valeria eine spatere passage absichtli bildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. Timeon ist kein Vertragspartner. Der Streit um Timeon Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen. Mechanik Valerias aktueller Stand bleibt Fighter 5 . Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.","links":["valeria","styke","vesper","timeon"],"backlinks":["story-so-far","timeon","zeit-ausbildung"],"search":"valerias privatpakt asmodeus zuerst styke und vesper als sterbliche autoritaten timeon ist kein vertragspartner vertrag valeria inhalt valeria nahm nach der ausbildung einen privaten pakt an asmodeus steht darin an erster stelle styke und vesper sind die sterblichen autoritaten thorn ist in diesem dokument kein direkter vorgesetzter timeon ist kein vertragspartner der streit um timeon am 31 januar befolgte valeria stykes befehl nicht zu timeon zuruckzukehren sie bestritt zugleich dass dieser befehl festlegen konne was ihr noch wichtig ist oder welche pflichten balinas in ihr fortbestehen mechanik valerias aktueller stand bleibt fighter 5 der pakt enthalt keinen bereits vollzogenen klassenwechsel","initial":"V"},{"id":"bekannt-unbekannt","category":"fakten","title":"Was wir wissen. Was nicht.","summary":"Spielerwissen am 12. Februar: Balentyne ist gefallen, der Haushalt fährt nach Süden; nächster Auftrag und mehrere persönliche Fäden bleiben offen.","body":"<h2>Bekannt<\/h2><ul><li>Balentyne ist gefallen und Buch Eins abgeschlossen.<\/li><li>Der gesamte gewählte Haushalt reist mit sechs Pferden auf Halstyn’s Folly nach Süden.<\/li><li>Die liquide Knotenkasse beträgt 17.271 gp; gewöhnliche Requisitionserlöse bilden einen getrennten Betriebsfonds.<\/li><li>Tacitus nahm den Compact an und arbeitet am dritten vo el belegt nur Samuel Havelyns Namen, Rang und Verwandtschaft. Ursprung, Bewusstsein und vollständige Kräfte des roten Buches.","links":[],"backlinks":[],"search":"was wir wissen was nicht spielerwissen am 12 februar balentyne ist gefallen der haushalt fahrt nach suden nachster auftrag und mehrere personliche faden bleiben offen spielerwissen 7 februar offene fragen bekannt balentyne ist gefallen und buch eins abgeschlossen der gesamte gewahlte haushalt reist mit sechs pferden auf halstyn s folly nach suden die liquide knotenkasse betragt 17 271 gp gewohnliche requisitionserlose bilden einen getrennten betriebsfonds tacitus nahm den compact an und arbeitet am dritten vollen tag ihres zehntagigen familiar projekts tiadoras falsche ritter sollen krone kirche und orden diskreditieren zwei requisitionsnachte wurden durchgefuhrt valerias alleinige lekture veranderte das rote buch nicht herkunft und volle natur bleiben unbekannt nicht bekannt thorns nachster auftrag und das genaue ende der flussfahrt hakons entscheidung uber die zeit nach der reise jacobian scaramores weiterer weg nach seiner freilassung franz motts spateres schicksal der zustand des verlassenen dalliance und der einzelnen hauser in aldencross ob samuel havelyn und kardinal thorn dieselbe person sind die familienbibel belegt nur samuel havelyns namen rang und verwandtschaft ursprung bewusstsein und vollstandige krafte des roten buches","initial":"W"},{"id":"mott-plan","category":"vorhaben","title":"Mott, Eddarly und Kaitlyn","summary":"Die Briefe führten zum Duell: Zack ist tot, Franz wurde zunächst festgesetzt und Kaitlyn ist für die Untersuchung ins Mott-Haus zurückgekehrt.","body":"<h2>Die gesetzte Spur<\/h2><p>Vesper inszenierte am 5. Februar einen Einbruch und ließ die echten Briefe zwischen Kaitlyn und Zack so zurück, dass Franz sie finden konnte.<\/p><h2>Der sichtbare Ausgang<\/h2><p>Franz forderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung.<\/p><h2>Kaitlyn<\/h2><p>Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte.<\/p><h2>Offen<\/h2><p>Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.<\/p>","sources":["live","relations","core"],"status":"Zack tot / Franz unter Untersuchung","tags":["Intrige","Kaitlyn","Franz","Zack","Duell"],"aliases":[],"text":"Die gesetzte Spur Vesper inszenierte am 5. Februar einen Einbruch und ließ die echten Briefe zwischen Kaitlyn und Zack so zurück, dass Franz sie finden konnte. Der sichtbare Ausgang Franz forderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung. Kaitlyn Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte. Offen Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.","links":[],"backlinks":[],"search":"mott eddarly und kaitlyn die briefe fuhrten zum duell zack ist tot franz wurde zunachst festgesetzt und kaitlyn ist fur die untersuchung ins mott haus zuruckgekehrt intrige kaitlyn franz zack duell die gesetzte spur vesper inszenierte am 5 februar einen einbruch und liess die echten briefe zwischen kaitlyn und zack so zuruck dass franz sie finden konnte der sichtbare ausgang franz forderte zack zum duell styke sah am 7 februar wie zack franz leicht verwundete und franz ihn anschliessend mit der hellebarde totete styke lockte franz an balentynes tor captain barhold entwaffnete ihn und begann eine untersuch
