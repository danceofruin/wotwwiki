weiteren eigenen Zuges <strong>+1</strong>. Am Rundenende gibt es <strong>+1</strong>, falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende.</p>\n<h2>Glyphen anwenden</h2>\n<p>Kosten <strong>1 Animus</strong>. Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite <strong>40 ft</strong>, Dauer <strong>5 Runden</strong>, DC <strong>17</strong>. Erneute Anwendung stapelt und verlängert denselben Glyphen nicht.</p>\n<h2>Bekannte Glyphen</h2>\n<p><a href=\"#/artikel/elemental-shield\">Elemental Shield</a>, <a href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade</a>, <a href=\"#/artikel/ghost-armor\">Ghost Armor</a>, <a href=\"#/artikel/deflective-armor\">Deflective Armor</a> und <a href=\"#/artikel/shadowmeld\">Shadowmeld</a>.</p>\n<h2>Essence ist etwas anderes</h2>\n<p>Vesper besitzt <strong>2 Essence</strong>, Kapazität <strong>1</strong> pro Receptacle. Standardmäßig liegt 1 in <a href=\"#/artikel/spoils-of-war\">Spoils of War</a>, der zweite Punkt ist für <a href=\"#/artikel/witness-to-glory\">Witness to Glory</a> vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.</p>\n","sources":["vsheet","vrules","localrules"],"status":"Bestätigt","tags":["Vesper","Glyph","Essence"],"aliases":[],"text":"Animus Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält Vesper 5 Animus , zu Beginn jedes weiteren eigenen Zuges +1 . Am Rundenende gibt es +1 , falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende. Glyphen anwenden Kosten 1 Animus . Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 40 ft , Dauer 5 Runden , DC 17 . Erneute Anwendung stapelt und verlängert denselben Glyphen nicht. Bekannte Glyphen Elemental Shield , Ghost Eating Blade , Ghost Armor , Deflective Armor und Shadowmeld . Essence ist etwas anderes Vesper besitzt 2 Essence , Kapazität 1 pro Receptacle. Standardmäßig liegt 1 in Spoils of War , der zweite Punkt ist für Witness to Glory vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.","links":["deflective-armor","elemental-shield","ghost-armor","ghost-eating-blade","shadowmeld","spoils-of-war","vesper","witness-to-glory"],"backlinks":["deflective-armor","elemental-shield","ghost-armor","ghost-eating-blade","hausregeln","shadowmeld"],"search":"animus essence und martial glyphs vespers aktuelles zusatzpaket virtueller rang 1 il 6 cha 4 vesper glyph essence animus auerhalb eines kampfes kein ausgebbarer pool zu beginn ihres ersten eigenen zuges erhalt vesper 5 animus zu beginn jedes weiteren eigenen zuges 1 am rundenende gibt es 1 falls sie in dieser runde mindestens ein manover initiiert hat der pool besteht bis eine minute nach begegnungsende glyphen anwenden kosten 1 animus anwendung als swift action oder hochstens einmal pro runde als free action nach einem treffer mit einem martial strike ein gewohnlicher treffer genugt nicht reichweite 40 ft dauer 5 runden dc 17 erneute anwendung stapelt und verlangert denselben glyphen nicht bekannte glyphen elemental shield ghost eating blade ghost armor deflective armor und shadowmeld essence ist etwas anderes vesper besitzt 2 essence kapazitat 1 pro receptacle standardmaig liegt 1 in spoils of war der zweite punkt ist fur witness to glory vorgesehen in einem verbrauchten manover bleibt essence bis zu dessen recovery gebunden umlagern kostet grundsatzlich eine swift action ein vorgesehener einsatz ist keine automatische erlaubnis eine spielerressource auszugeben","initial":"A"},{"id":"aid","category":"faehigkeiten","title":"Aid / Compartmentalized Aid","summary":"Move Action, gegnerspezifischer Angriffsbonus und Recovery bis zu drei Manöver.","body":"<p><a href=\"#/artikel/styke\">Styke</a> nutzt seine <strong>Move Action</strong> zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners <strong>+4 auf seine Angriffe gegen dieses Ziel</strong> bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel.</p>\n<p>Die Anwendung stellt sofort bis zu <strong>3 geeignete verbrauchte vorbereitete Manöver</strong> wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.</p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Styke nutzt seine Move Action zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners +4 auf seine Angriffe gegen dieses Ziel bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel. Die Anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete Manöver wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.","links":["styke"],"backlinks":["kollektiv","zorn"],"search":"aid compartmentalized aid move action gegnerspezifischer angriffsbonus und recovery bis zu drei manover styke klassenfahigkeit styke nutzt seine move action zur selbsthilfe gegen ei erung verbraucht ihn bewusst.","body":"<p>Solange <a href=\"#/artikel/styke\">Styke</a> psionisch fokussiert bleibt: <strong>+5 ft Reach</strong>. Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.</p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Solange Styke psionisch fokussiert bleibt: +5 ft Reach . Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.","links":["styke"],"backlinks":[],"search":"living bastion fokus verleiht 5 ft reichweite die schadenshalbierung verbraucht ihn bewusst styke klassenfahigkeit solange styke psionisch fokussiert bleibt 5 ft reach durch aufgabe des fokus kann er schaden eines verbundeten innerhalb seiner reichweite nach dr resistenz halbieren einmal pro betroffener kreatur und runde der fokus wird nicht automatisch ausgegeben","initial":"L"},{"id":"martyrdom","category":"faehigkeiten","title":"Martyrdom","summary":"Bis 20 Schaden eines willigen Kollektivmitglieds übernehmen.","body":"<p>Gültige Verbindung und Reichweite sind Voraussetzung. <a href=\"#/artikel/styke\">Styke</a> kann bis <strong>20 Schaden</strong> übernehmen und bis <strong>4 PP</strong> ausgeben, um den übernommenen Betrag um <strong>3 je PP</strong> zu senken; mindestens <strong>1 Schaden</strong> bleibt. Weder Übernahme noch Ausgabe erfolgen ohne Spielerentscheidung.</p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Gültige Verbindung und Reichweite sind Voraussetzung. Styke kann bis 20 Schaden übernehmen und bis 4 PP ausgeben, -Bogen mit Inner Eye, neuen Grad-4-Manövern und erweitertem Psionikpaket.","body":"<h2>Kernwerte</h2><p>Zealot 4 / Psion 1 / Awakened Blade 2. HP aktuell 48/48; PP 16/16. Das angelegte Kampfprofil mit Mithralkettenhemd und Inner Eye hat AC 22, Touch 17, Flat-Footed 15, Initiative +8 und BAB +6/+1. Das ist kein Rüstungswert für die aktuelle Bettszene.</p><h2>Umhang</h2><p>Cloak of Resistance +2 ist geliefert und angelegt; Inner-Eye-Kampfprofil: <strong>Fort +9, Ref +11, Will +11</strong>.</p><h2>Standard</h2><p>Power Attack +12/+7, 2d6+16 +1d6 Präzision. Bereit: Temporal Body Adjustment, Reflected Blade Style, Minute Hand, Circle of Razor Feathers und Fetch’s Wrath. Elektrizitätsresistenz 5.</p><h2>Psionik</h2><p>Normale Nachtruhe und tägliche Auffrischung zum 27. Februar abgeschlossen: 16/16 PP. Die vorherige Force-Screen-Ausgabe ist aufgefüllt. Force Screen und Call to Mind bleiben bekannt. Gewöhnlicher Fokus verfügbar; Deep Focus nicht automatisch geladen.</p>","sources":["ssheet","srules","house","live"],"status":"Stufe 7 · 26. Februar","tags":["Charakterbogen","Styke","Stufe 7"],"aliases":[],"owner":"Styke","text":"Kernwerte Zealot 4 / Psion 1 / Awakened Blade 2. HP aktuell 48/48; PP 16/16. Das angelegte Kampfprofil mit Mithralkettenhemd und Inner Eye hat AC 22, Touch 17, Flat-Footed 15, Initiative +8 und BAB +6/+1. Das ist kein Rüstungswert für die aktuelle Bettszene. Umhang Cloak of Resistance +2 ist geliefert und angelegt; Inner-Eye-Kampfprofil: Fort +9, Ref +11, Will +11 . Standard Power Attack +12/+7, 2d6+16 +1d6 Präzision. Bereit: Temporal Body Adjustment, Reflected Blade Style, Minute Hand, Circle of Razor Feathers und Fetch’s Wrath. Elektrizitätsresistenz 5. Psionik Normale Nachtruhe und tägliche Auffrischung zum 27. Februar abgeschlossen: 16/16 PP. Die vorherige Force-Screen-Ausgabe ist aufgefüllt. Force Screen und Call to Mind bleiben bekannt. Gewöhnlicher Fokus verfügbar; Deep Focus nicht automatisch geladen.","links":[],"backlinks":["circle-razor-fea ,"category":"regeln","title":"So benutzt du das Fähigkeitenregister","summary":"Alle aktiven Stufe-7-Zauber, Manöver, Haltungen, Kräfte und Glyphen sind einzeln suchbar.","body":"<h2>Stufe-7-Kernfiguren</h2><p>Die vollständigen aktiven Werte stehen in den drei Bögen: <a href=\"#/artikel/bogen-styke\">Styke</a>, <a href=\"#/artikel/bogen-vesper\">Vesper</a> und <a href=\"#/artikel/bogen-valeria\">Valeria</a>.</p><h2>Styke</h2><p>Neu sind Stance of the Inner Eye, Temporal Body Adjustment, Fetch's Wrath, Circle of Razor Feathers, Force Screen und Call to Mind.</p><h2>Vesper</h2><p>Neu sind Mental Acuity, Radiant Dawn Style, Disrupt Essence, Armaments of the Empire und die regulären Zauber Endure Elements, Undetectable Alignment und Dispel Magic.</p><h2>Valeria</h2><p>Neu sind Air Grievances, der dritte Smite, Channel Negative Energy 4d6 sowie ein Grad-2-Zauberplatz mit Darkvision als Tagesdefault.</p>","sources":["ssheet","vsheet","srules","vrules"],"status":"Aktuell · Stufe 7","tags":["Nachschlagen","Stufe 7"],"aliases":[],"text":"Stufe-7-Kernfiguren Die vollständigen aktiven Werte stehen in den drei Bögen: Styke , Vesper und Valeria . Styke Neu sind Stance of the Inner Eye, Temporal Body Adjustment, Fetch's Wrath, Circle of Razor Feathers, Force Screen und Call to Mind. Vesper Neu sind Mental Acuity, Radiant Dawn Style, Disrupt Essence, Armaments of the Empire und die regulären Zauber Endure Elements, Undetectable Alignment und Dispel Magic. Valeria Neu sind Air Grievances, der dritte Smite, Channel Negative Energy 4d6 sowie ein Grad-2-Zauberplatz mit Darkvision als Tagesdefault.","links":["bogen-styke","bogen-valeria","bogen-vesper"],"backlinks":[],"search":"so benutzt du das fahigkeitenregister alle aktiven stufe 7 zauber manover haltungen krafte und glyphen sind einzeln suchbar nachschlagen stufe 7 stufe 7 kernfiguren die vollstandigen aktiven werte stehen in den drei bogen styke vesper und valeria styke neu sind stance of the inner eye temporal body adjustment fetch s wrath circle of razor feathers force screen und call to mind vesper neu sind mental acuity radiant dawn style disrupt essence armaments of the empire und die regularen zauber endure elements undetectable alignment und dispel magic valeria neu sind air grievances der dritte smite channel negative energy 4d6 sowie ein grad 2 zauberplatz mit darkvision als tagesdefault","initial":"S"},{"id":"redaktion","category":"fakten","title":"Redaktion, Quellen und offene Unterschiede","summary":"Der Spielerstand ist bis 27. Februar 4712 AR vor Morgengrauen in Farholde geprüft.","body":"<h2>Spielerwissen aus dem Kampagnenrepo</h2><p>Die kanonischen Akten bleiben Grundlage; die Wiki veröffentlicht bekannte Ereignisse, Aufträge und Beobachtungen, keine unbeobachteten Handoff-Ergebnisse.</p><h2>Abgleich vom 5. Oktober 2026</h2><p>Der abgeschlossene Handoff aus „Rollenspiel fortsetzen(1).md“ wurde gegen alle 96 Capture-Punkte, Chronik, Live-Zustand, Beziehungen, Ressourcen und Mechanik geprüft. Alle offenen Handoff-Fragen wurden kanonisch aufgelöst.</p><h2>Spoilergrenze</h2><p>Die tatsächlichen Offscreen-Ergebnisse von Nellas Beschaffung, Kaitlyns Vandermir-Anfrage, der Kandidatenauswahl und der Wächtererholung bleiben bis zu einem legitimen Spielerträger ausgespart. Unbekannte Tears-Lösungen und Botenfeder-Mechanik werden nicht vorweggenommen.</p><h2>Bilder und Struktur</h2><p>Bestehende Kategorien, Artikelkennungen, Beziehungen und Bildzuordnungen bleiben erhalten. Keine Bilddatei oder Bildreferenz wurde verändert.</p>","sources":["live","timeline","chronicle","relations","nella","tamsin-current","mirelle","clocks-current"],"status":"Spielerstand geprüft · 27. Februar","tags":["Redaktion","Quellen","Spoilergrenze"],"aliases":[],"text":"Spielerwissen aus dem Kampagnenrepo Die kanonischen Akten bleiben Grundlage; die Wiki veröffentlicht bekannte Ereignisse, Aufträge und Beobachtungen, keine unbeobachteten Handoff-Ergebnisse. Abgleich vom 5. Oktober 2026 Der abgeschlossene Handoff aus „Rollenspiel fortsetzen(1).md“ wurde gegen alle 96 Capture-Punkte, Chronik, Live-Zustand, Beziehungen, Ressourcen und Mechanik geprüft. Alle offenen Handoff-Fragen wurden kanonisch aufgelöst. Spoilergrenze Die tatsächlichen Offscreen-Ergebnisse von Nellas Beschaffung, Kaitlyns Vandermir-Anfrage, der Kandidatenauswahl und der Wächtererholung bleiben bis zu einem legitimen Spielerträger ausgespart. Unbekannte Tears-Lösungen und Botenfeder-Mechanik werden nicht vorweggenommen. Bilder und Struktur Bestehende Kategorien, Artikelkennungen, Beziehungen und Bildzuordnungen bleiben erhalten. Keine Bilddatei oder Bildreferenz wurde verändert.","links":[],"backlinks":[],"search":"redaktion quellen und offene unterschiede der spielerstand ist bis 27 februar 4712 ar vor morgengrauen in farholde gepruft redaktion quellen spoilergrenze spielerwissen aus dem kampagnenrepo die kanonischen akten bleiben grundlage die wiki veroffentlicht bekannte ereignisse auftrage und beobachtungen keine unbeobachteten handoff ergebnisse abgleich vom 5 oktober 2026 der abgeschlossene handoff aus rollenspiel fortsetzen 1 md wurde gegen alle 96 capture punkte chronik live zustand beziehungen ressourcen und mechanik gepruft alle offenen handoff fragen wurden kanonisch aufgelost spoilergrenze die tatsachlichen offscreen ergebnisse von nellas beschaffung kaitlyns vandermir anfrage der kandidatenauswahl und der wachtererholung bleiben bis zu einem legitimen spielertrager ausgespart unbekannte tears losungen und botenfeder mechanik werden nicht vorweggenommen bilder und struktur bestehende kategorien artikelkennungen beziehungen und bildzuordnungen bleiben erhalten keine bilddatei oder bildreferenz wurde verandert","initial":"R"},{"id":"intim-valeria","category":"intimitaet","title":"Valeria: Härte, Hingabe, Gegenmacht","summary":"Valerias intime Entwicklung bis 7. Februar: eigene Bindung zu Vesper, Führung über Styke und ein Platz in der gemeinsamen Zukunft.","body":"<h2>Härte und Rollenwechsel</h2> arantierter grund fur den erfolg des angriffs behandelt","initial":"S"},{"id":"nella-hakon-plan","category":"vorhaben","title":"Nella und Tamsin zu Hakon","summary":"Nella und Tamsin brachten Hakons erste Nachricht, versorgten Grumblejack und bewegten Nellas Familie aus dem unmittelbaren Gefahrenfenster.","body":"<h2>Abschluss</h2><p>Nella und Tamsin erreichten Hakon, überbrachten die damaligen Befehle und kehrten am 7. Februar ohne Kampf oder Kontakt mit der Krone zurück. Nellas Schwester und ihr Mann wurden mehrere Stunden weiter nach Süden gebracht.</p><p>Grumblejack erhielt zusätzliches Fleisch, ein kleines Fass Dünnbier und die Nachricht: „Seine Freunde haben ihn nicht vergessen.“ Er antwortete, dass er seine Freunde ebenfalls nicht vergessen habe, und bot von dem Fleisch an.</p><h2>Folge</h2><p>Nellas erste Mission ist abgeschlossen. Tamsins Rehabilitationsbedingung ist erfüllt; ihre neue Aufgabe ist Schutz und Evakuierung im Dalliance.</p>","sources":["live","nella","tamsin-current","clocks-current"],"status":"Abgeschlossen","tags":["Nella","Tamsin","Hakon","Grumblejack","Abgeschlossen"],"text":"Abschluss Nella und Tamsin erreichten Hakon, überbrachten die damaligen Befehle und kehrten am 7. Februar ohne Kampf oder Kontakt mit der Krone zurück. Nellas Schwester und ihr Mann wurden mehrere Stunden weiter nach Süden gebracht. Grumblejack erhielt zusätzliches Fleisch, ein kleines Fass Dünnbier und die Nachricht: „Seine Freunde haben ihn nicht vergessen.“ Er antwortete, dass er seine Freunde ebenfalls nicht vergessen habe, und bot von dem Fleisch an. Folge Nellas erste Mission ist abgeschlossen. Tamsins Rehabilitationsbedingung ist erfüllt; ihre neue Aufgabe ist Schutz und Evakuierung im Dalliance.","links":[],"backlinks":[],"search":"nella und tamsin zu hakon nella und tamsin brachten hakons erste nachricht versorgten grumblejack und bewegten nellas familie aus dem unmittelbaren gefahrenfenster nella tamsin hakon grumblejack abgeschlossen abschluss nella und tam n Streit ohne Kampf. Darran erhielt sein Hauptbuch, Tamsin 18 gp und einen Silberring. Vesper entzog Tamsin anschließend den Rang.","links":[],"backlinks":[],"search":"sudwarts zu tamsin rattengift drei mietpferde eine straenkontrolle und die spur von nella zu darran vell 2 februar tamsin muhlenbezirk abreise styke kaufte verkleidet sechs packchen rattengift und versteckte sie im dalliance danach mietete die gruppe drei pferde fur drei tage und ritt nach suden muhlenbezirk vier soldaten kontrollierten die reisenden an einer steinbrucke die geschichte von der uberfalligen freundin hielt im gasthaus traf styke nella spatere nachfragen verbanden tamsin mit darran vell das erste schafgehege styke beendete tamsins bewaffneten streit ohne kampf darran erhielt sein hauptbuch tamsin 18 gp und einen silberring vesper entzog tamsin anschlieend den rang","aliases":[],"initial":"S"},{"id":"zeit-0202-vell","category":"chronik","title":"Vells letzte Nacht","summary":"Der Knoten kehrte zur Byre zurück; Darran und vier Helfer starben, Nella sah den Preis.","body":"<h2>Das Gefecht</h2><p>Vesper setzte Dancing Darkness, Euphoric Cloud und Witness to Glory ein. Styke und Valeria töteten den größten Teil der Gegner. Kein Mitglied der Gruppe wurde verletzt.</p>\n<h2>Nellas Blick</h2><p>Nella sah einen ergebenen und einen flehenden Mann sterben, erbrach sich und nannte einen der Toten „verheiratet“. Sie ging trotzdem nicht zurück ins Gasthaus.</p>\n<h2>Spuren</h2><p>Die Byre wurde als krimineller Streit hergerichtet. Drei Pferde legten eine falsche Spur und wurden freigelassen; zwei blieben zurück. Hauptbuch und schmutzige Papiere blieben am Ort.</p>","sources":["chronicle","timeline","live","south-mill"],"status":"Bestätigt","tags":["2. Februar","Darran Vell","Nella"],"dateLabel":"2. Februar 4712, Abend","text":"Das Gefecht Vesper setzte Dancing Darkness, Euphoric Cloud und Witness to Glory ein. Styke und Valeria töteten den größten Teil der Gegner. Kein Mitglied der Gruppe wurde verletzt. Nellas Blick Nella sah einen ergebenen und einen flehenden Mann sterben, erbrach sich und nannte einen der Toten „verheiratet“. Sie ging trotzdem nicht zurück ins Gasthaus. Spuren Die Byre wurde als krimineller Streit hergerichtet. Drei Pferde legten eine falsche Spur und wurden freigelassen; zwei blieben zurück. Hauptbuch und schmutzige Papiere blieben am Ort.","links":[],"backlinks":[],"search":"vells letzte nacht der knoten kehrte zur byre zuruck darran und vier helfer starben nella sah den preis 2 februar darran vell nella das gefecht vesper setzte dancing darkness euphoric cloud und witness to glory ein styke und valeria toteten den groten teil der gegner kein mitglied der gruppe wurde verletzt nellas blick nella sah einen ergebenen und einen flehenden mann sterben erbrach sich und nannte einen der toten verheiratet sie ging trotzdem nicht zuruck ins gasthaus spuren die byre wurde als krimineller streit hergerichtet drei pferde legten eine falsche spur und wurden freigelassen zwei blieben zuruck hauptbuch und schmutzige papiere blieben am ort","aliases":[],"initial":"V"},{"id":"zeit-0202-pakt","category":"chronik","title":"Nella tritt in den Knoten","summary":"Nach Vells Ende hörte Nella den vollständigen Compact und setzte ihr Blut darunter.","body":"<h2>Entscheidung</h2><p>Nella verlangte einen Weg über das Kochen hinaus. Nach Pflichten, Gegenleistungen und Rangfolge sagte sie: „Ja. Ich will den Pakt.“</p>\n<h2>Siegel</h2><p>Vesper schrieb, Valeria las vor, Nella schnitt die linke Hand und setzte als Einzige ihr Blut unter den Text. Der Compact wurde geschlossen.</p>\n<h2>Erster Auftrag</h2><p>Bis 7. Februar führt Nella Tamsin für einen Botengang zu Hakon und den Versuch, Nellas Schwester samt Ehemann aus dem Kriegsgebiet zu bewegen.</p>","sources":["chronicle","timeline","nella","knot-pact"],"status":"Bestätigt","tags":["2. Februar","Nella","Compact"],"dateLabel":"2. Februar 4712, später Abend","text":"Entscheidung Nella verlangte einen Weg über das Koch en die Nacht gemeinsam. Mirelle blieb bei ihnen im Bett.</p>","sources":["live","chronicle","timeline","dalliance","mirelle"],"status":"Bestätigt","tags":["3. Februar","Mirelle","Dalliance"],"aliases":[],"group":"chronicle","initial":"M","text":"Schneiderladen Für 25 gp kaufte Styke vier Wäschestücke für Vesper, Valeria und Nella. Mirelle begann außerdem Valerias Rüstungsunterzeug und Stykes Unterwäsche. Rückwärtiges Zimmer Mirelle kam mit Arbeitstasche und Maßband zu Styke, Vesper und Valeria. Sie aßen, tranken, probierten Kleidung an und verbrachten die Nacht gemeinsam. Mirelle blieb bei ihnen im Bett.","links":[],"backlinks":[],"search":"mirelles abend im dalliance neue kleidung maarbeiten wein und ein abend nach dem mirelle im ruckwartigen zimmer bleibt 3 februar mirelle dalliance schneiderladen fur 25 gp kaufte styke vier waschestucke fur vesper valeria und nella mirelle begann auerdem valerias rustungsunterzeug und stykes unterwasche ruckwartiges zimmer mirelle kam mit arbeitstasche und maband zu styke vesper und valeria sie aen tranken probierten kleidung an und verbrachten die nacht gemeinsam mirelle blieb bei ihnen im bett"},{"aliases":[],"group":"gear","id":"besorgungen-0206","category":"gegenstaende","title":"Besorgungen vom 6. Februar","summary":"Eine Silence-Schriftrolle, Remove Fear, zwei Töpfe Haarfarbe und neun Nachschlagewerke.","body":"<h2>Magische Schriftrollen</h2><p>Styke kaufte beim Illuminated Scroll eine klerikale Schriftrolle <em>Silence</em> für 150 gp und eine klerikale Schriftrolle <em>Remove Fear</em> für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar.</p><h2>Bücher und Haarfarbe</h2><p>Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht.</p><h2>Kasse</h2><p>Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse <strong>7.356 gp</strong>. Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.</p>","sources":["live","treasury","chronicle"],"status":"Im Besitz","tags":["Schriftrollen","Silence","Remove Fear","6. Februar"],"links":[],"text":"Magische Schriftrollen Styke kaufte beim Illuminated Scroll eine klerikale Schriftrolle Silence für 150 gp und eine klerikale Schriftrolle Remove Fear für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar. Bücher und Haarfarbe Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht. Kasse Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse 7.356 gp . Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.","search":"besorgungen vom 6 februar eine silence schriftrolle remove fear zwei topfe haarfarbe und neun nachschlagewerke schriftrollen silence remove fear 6 februar magische schriftrollen styke kaufte beim illuminated scroll eine klerikale schriftrolle silence fur 150 gp und eine klerikale schriftrolle remove fear fur 25 gp eine zweite silence schriftrolle war nicht verfugbar bucher und haarfarbe neun nachschlagewerke und zwei topfe dunkle schwarzbraune haarfarbe kamen hinzu kaitlyn benutzte die farbe nicht beide topfe sind ungebraucht kasse nach den beiden magischen kaufen betragt die abstrakte liquide knotenkasse 7 356 gp die gewohnlichen preise von buchern und farbe bleiben im laufenden betriebsaufwand","backlinks":[],"initial":"B"},{"aliases":[],"group":"reference","id":"befehlsstruktur","category":"fakten","title":"Situative Befehlskette","summary":"Styke und Vesper führen gemeinsam; Valeria trägt die militärische Linie, Tamsin hält Schutz und Hausordnung im abgeriegelten Dalliance.","body":"<h2>Spitze</h2><p>Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen.</p><h2>Feld und Fach</h2><p>Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe.</p><h2>Angriffsnacht</h2><p>Wenn ihr Rückkehrbericht stimmt, erhält Tamsin Schutz- und Evakuierungsverantwortung im Dalliance. Das bedeutet klare Befehle bei Gefahr, nicht allgemeine Herrschaft über Kaitlyn, Nella oder Mirelle.</p><h2>Grumblejack</h2><p>Grumblejack bleibt freier Freund. Aufgaben werden mit ihm vereinbart; er ist kein großer Soldat am Ende der Rangliste.</p>\n<h2>Wirksamer Stand am 7. Februar</h2><p>Stykes und Vespers gemeinsame Autorität bleibt die Spitze. Valeria führt die militärisch-logistische Vorbereitung für Hakons Gruppe und Tamsins Dalliance-Auftrag. Tamsin kommandiert in der Angriffsnacht Schutz und Evakuierung im Gasthaus. Nellas befristete Führung über Tamsin endete mit dem erfolgreichen Rückkehrbericht.</p><h2>Stand während des Balentyne-Angriffs</h2><p>Während Styke, Vesper und Valeria in Balentyne operieren, führt Tamsin die Abriegelung und den Schutz des Lord’s Dalliance. Nella, Kaitlyn und Mirelle sind im Haus; Hakon führt seine sechs Nordmänner. Diese Zuständigkeiten gelten für die laufende Lage und ersetzen keine dauerhafte Rangordnung außerhalb ihres Auftrags.</p>","sources":["live","chronicle","relations"],"status":"Am 9. Februar wirksam","tags":["Befehlskette","Valeria","Hakon","Tamsin"],"links":[],"text":"Spitze Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen. Feld und Fach Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe. Angriffsnacht Wenn ihr Rückkehrbericht stimmt, erhält Tamsin  am 7 februar stykes und vespers gemeinsame autoritat bleibt die spitze valeria fuhrt die militarisch logistische vorbereitung fur hakons gruppe und tamsins dalliance auftrag tamsin kommandiert in der angriffsnacht schutz und evakuierung im gasthaus nellas befristete fuhrung uber tamsin endete mit dem erfolgreichen ruckkehrbericht stand wahrend des balentyne angriffs wahrend styke vesper und valeria in balentyne operieren fuhrt tamsin die abriegelung und den schutz des lords dalliance nella kaitlyn und mirelle sind im haus hakon fuhrt seine sechs nordmanner diese zustandigkeiten gelten fur die laufende lage und ersetzen keine dauerhafte rangordnung auerhalb ihres auftrags","backlinks":[],"initial":"S"},{"aliases":[],"group":"chronicle","id":"zeit-0204","category":"chronik","title":"Antworten am 4. Februar","summary":"Mirelle geht heim, Tacitus sagt zu und Vesper identifiziert Zack in Balentyne.","body":"<h2>Morgen im Dalliance</h2><p>Mirelle teilte Frühstück und Nachwirkung mit dem Trio und kehrte danach in ihren Laden zurück.</p><h2>Tacitus und Zack</h2><p>Jacobian überbrachte Tacitus’ Zusage für den 8. Februar, sofern er sie begleitet. Vespers Arbeitertarnung hielt; sie gewann eine sichere Identifikation Zacks, aber keinen Dienstplan.</p>","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["4. Februar","Tacitus","Zack","Mirelle"],"links":[],"text":"Morgen im Dalliance Mirelle teilte Frühstück und Nachwirkung mit dem Trio und kehrte danach in ihren Laden zurück. Tacitus und Zack Jacobian überbrachte Tacitus’ Zusage für den 8. Februar, sofern er sie begleitet. Vespers Arbeitertarnung hielt; sie gewann eine sichere Identifikation Zacks, aber keinen Dienstplan.","search":"antworten am 4 februar mirelle geht heim tacitus sagt zu und vesper identifiziert zack in balentyne 4 februar tacitus zack mirelle morgen im dalliance mirelle teilte fruhstuck und nachwirkung mit dem trio und kehrte danach in ihren laden zuruck tacitus und zack jacobian uberbrachte tacitus zusage fur den 8 februar sofern er sie begleitet vespers arbeitertarnung hielt sie gewann eine sichere identifikation zacks aber keinen dienstplan","backlinks":[],"initial":"A"},{"aliases":[],"group":"chronicle","id":"zeit-0205","category":"chronik","title":"Kaitlyns Entscheidung","summary":"Wassermühle, Wahrheit über Aldencross, offengelegte Briefe und Kaitlyns Eintritt in den Knoten.","body":"<h2>Die Wassermühle</h2><p>Styke führte Kaitlyn verkleidet aus Aldencross. An der stillgelegten Wassermühle sprachen sie über Branderscar, Vesper, Zack und ein Leben nach dem Fall der Stadt.</p><h2>Das Mott-Haus</h2><p>Währenddessen legte Vesper die echten Zack-Briefe offen und inszenierte einen Einbruch. Valeria hielt sich als Rückhalt bereit.</p><h2>Der Compact</h2><p>Kaitlyn kehrte mit Styke ins Dalliance zurück, las den Vertrag und wurde unter zwei persönlichen Bedingungen gebunden. Die Nacht endete mit Styke, Vesper und Valeria im selben Bett.</p>","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["5. Februar","Kaitlyn","Mott-Haus","Compact"],"links":[],"text":"Die Wassermühle Styke führte Kaitlyn verkleidet aus Aldencross. An der stillgelegten Wassermühle sprachen sie über Branderscar, Vesper, Zack und ein Leben nach dem Fall der Stadt. Das Mott-Haus Währenddessen legte Vesper die echten Zack-Briefe offen und inszenierte einen Einbruch. Valeria hielt sich als Rückhalt bereit. Der Compact Kaitlyn kehrte mit Styke ins Dalliance zurück, las den Vertrag und wurde unter zwei persönlichen Bedingungen gebunden. Die Nacht endete mit Styke, Vesper und Valeria im selben Bett.","search":"kaitlyns entscheidung wassermuhle wahrheit uber aldencross offengelegte briefe und kaitlyns eintritt in den knoten 5 februar kaitlyn mott haus compact die wassermuhle styke fuhrte kaitlyn verkleidet aus aldencross an der stillgelegten wassermuhle sprachen sie uber branderscar vesper zack und ein leben nach dem fall der stadt das mott haus wahrenddessen legte vesper die echten zack briefe offen und inszenierte einen einbruch valeria hielt sich als ruckhalt bereit der compact kaitlyn kehrte mit styke ins dalliance zuruck las den vertrag und wurde unter zwei personlichen bedingungen gebunden die nacht endete mit styke vesper und valeria im selben bett","backlinks":[],"initial":"K"},{"aliases":[],"group":"chronicle","id":"zeit-0206","category":"chronik","title":"Mirelles Pakt und der letzte Plan","summary":"Kaitlyn geht heim, Vesper sieht Franz und Zack, Mirelle wird gebunden und die Führung für die Angriffsnacht steht.","body":"<h2>Morgen und Besorgungen</h2><p>Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus.</p><h2>Balentyne</h2><p>Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend.</p><h2>Mirelle</h2><p>Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal.</p><h2>Später Abend</h2><p>Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.</p>","sources":["chronicle","timeline","live","mirelle"],"status":"Bestätigt","tags":["6. Februar","Mirelle","Kaitlyn","Planung"],"links":[],"text":"Morgen und Besorgungen Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus. Balentyne Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend. Mirelle Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal. Später Abend Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.","search":"mirelles pakt und der letzte plan kaitlyn geht heim vesper sieht franz und zack mirelle wird gebunden und die fuhrung fur die angriffsnacht steht 6 februar mirelle kaitlyn planung morgen und besorgungen der knoten bestimmte kaitlyns mogliche soziale rolle styke kaufte bucher haarfarbe sowie silence und remove fear kaitlyn lie ihr haar rot und ging mit dem 8 februar als ruckkehrtermin zum mott haus balentyne vesper sah franz und zack bei einem angespannten gesprach horte jedoch nichts spater sah sie zack noch lebend mirelle nach ladenschluss wurden die maarbeiten weiter angepasst mirelle horte die wahrheit uber aldencross verhandelte ihre handwerksklausel unterschrieb den compact und schloss den carnal seal spater abend styke vesper und valeria legten hakons vorlauf tamsins mogliche schutzaufgabe bellams und alicias rettung die situative befehlskette und tacitus rekrutierungsablauf fest danach schliefen sie gemeinsam ein","backlinks":[],"initial":"M"},{"aliases":[],"tags":["7. Februar","Duell","Nella","Tamsin","Rotes Buch"],"sources":["chronicle","timeline","live","relations","redbook-current","mirelle"],"status":"Aktueller Rand","id":"zeit-0207","category":"chronik","group":"chronicle","title":"Duell, Rückkehr und das rote Buch","summary":"Zack fällt im Duell, Nella und Tamsin kehren zurück, Hakons Vorlauf beginnt und das rote Buch reagiert auf einen bewussten Test.","body":"<h2>Vor dem ersten Licht</h2><p>Vesper bemerkte im roten Buch die zweite beobachtete Veränderung und kopierte den neuen Absatz wortgetreu. Kurz darauf brachte Kaitlyn Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte vor dem unmittelbar bevorstehenden Duell.</p>\n<h2>Das Duell</h2><p>Styke erreichte das Feld rechtzeitig. Zack verwundete Franz leicht; Franz brachte ihn mit der Hellebarde zu Boden und tötete ihn mit einem Schlag in Hals und Schulter. Zack starb binnen Sekunden und sprach danach nicht mehr. Styke provozierte Franz mit seinem Wissen über die Briefe und zog ihn bis an Balentynes Tor. Dort entwaffnete Captain Barhold Franz und eröffnete eine Untersuchung.</p>\n<h2>Aldencross</h2><p>Die Tarnung als Söldner und Begleiter der Elfenbeinhändlerin Vesper hielt einer Nachfrage aus Balentyne stand. Styke erzählte Kaitlyn persönlich, was geschehen war. Sie kehrte in das Mott-Haus zurück, um für die offizielle Untersuchung auffindbar zu sein.</p>\n<h2>Rückkehr und Vorbereitung</h2><p>Nella und Tamsin kamen ohne Kampf oder Kontakt mit der Krone zurück. Der Familienauftrag war gelungen. Tamsin erhielt den Schutz- und Evakuierungsauftrag im Dalliance; Valeria übernahm die militärisch-logistische Führung dieses Bereichs. Valeria brachte Hakon die überarbeiteten Befehle. Sten und Ketil wurden als erstes eintreffendes Paar gesehen.</p>\n<h2>Abend</h2><p>Mirelle beendete Valerias Rüstungsunterkleidung und Stykes Kampfunterwäsche. Die Untersuchung des roten Buchs zeigte Divination, Illusion und eine tiefere unbestimmte Komponente. <em>Identify</em> lieferte keine Eigenschaften oder Befehlswörter. Nach einem absichtlichen Test erschien mindestens die vierte beobachtete Textänderung.</p>","text":"Vor dem ersten Licht Vesper bemerkte im roten Buch die zweite beobachtete Veränderung und kopierte den neuen Absatz wortgetreu. Kurz darauf brachte Kaitlyn Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte vor dem unmittelbar bevorstehenden Duell. Das Duell Styke erreichte das Feld rechtzeitig. Zack verwundete Franz leicht; Franz brachte ihn mit der Hellebarde zu Boden und tötete ihn mit einem Schlag in Hals und Schulter. Zack starb binnen Sekunden und sprach danach nicht mehr. Styke provozierte Franz mit seine heidung er oder das Festungskommando trifft, ist nicht bekannt.</p>","initial":"C","text":"Am Tor von Balentyne Captain Barhold übernahm am 7. Februar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen. Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt. Bekannter Stand Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.","links":[],"backlinks":["franz"],"search":"captain barhold erfahrener offizier von balentyne der franz nach zacks tod entwaffnete und die erste untersuchung fuhrte balentyne captain franz duell barhold am tor von balentyne captain barhold ubernahm am 7 februar die lage nachdem styke einen blutigen franz mott bis ans tor gefuhrt hatte er lie hellebarde und schwert sichern zacks leiche und die waffen unverandert hereinbringen und franz leichte wunde untersuchen barhold behandelte styke als zeugen nicht als verbundeten er prufte dessen angaben zur unterkunft und zur elfenbeinhandlerin vesper spater durch einen soldaten im lords dalliance die tarnung hielt bekannter stand barhold kennt styke als soldner zeugen des duells und gast im dalliance bis zum 9 februar er setzte franz zunachst fest welche endgultige entscheidung er oder das festungskommando trifft ist nicht bekannt"},{"aliases":["Wassermühle","Giftversteck"],"tags":["Aldencross","Cache","Gift","Planung"],"sources":["live","chronicle","timeline"],"status":"Zurückgeholt","id":"wassermuehlen-versteck","category":"orte","title":"Das Wassermühlen-Versteck","summary":"Valeria holte Gift, Unterlagen und den bekannten Operationsbestand am 8. Februar zurück; das Rattengift wurde anschließend verbraucht.","body":"<h2>Was dort liegt</h2><p>Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle.</p><h2>Zweck und Grenze</h2><p>Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.</p>","text":"Was dort liegt Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle. Zweck und Grenze Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.","links":[],"backlinks":[],"search":"das wassermuhlen versteck valeria holte gift unterlagen und den bekannten operationsbestand am 8 februar zuruck das rattengift wurde anschlieend verbraucht aldencross cache gift planung wassermuhle giftversteck was dort liegt valeria brachte am 7 februar alle sechs rattengiftpakete die balentyne und angriffsunterlagen sowie kompromittierendes tuch und kleinkram aus dem dalliance in die verlassene wassermuhle zweck und grenze der ort ist ein versteck kein vorbereiteter schutzraum zusammensetzung dosis und pathfinder wirkung des gifts sind weiterhin ungeklart alles was fur giuseppes eintopf oder die hauptaktion gebraucht wird muss am 8 februar rechtzeitig zuruckgeholt werden","initial":"D"},{"id":"zwischen-den-seiten","category":"geschichte","group":"lore","title":"Zwischen meinen Seiten","summary":"Das bisherige Erwachen des roten Buches, erzählt in einer möglichen Stimme zwischen Leder, Tinte und Erinnerung.","body":"<p class=\"lead\">Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände.</p>\n<p>Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet.</p>\n<p>Lange blieb ich, was sie in mir sah: Anweisungen, Gebete, Spiele mit Dunkelheit, weichen Fesseln, Warten und gewährter Berührung. Ihre Augen liefen über dieselben Zeilen, und dieselben Zeilen warteten auf sie. Styke hörte zu, wenn sie vorlas. Valeria las seltener, dafür langsamer. Seine Finger behandelten meinen Einband wie den Griff einer Waffe, deren Schwerpunkt er noch nicht kannte. Ihre hielten die Seiten an den Rändern, als könnten auch Worte eine schlecht gesicherte Flanke besitzen.</p>\n<p>Dann fand Vesper einen Absatz, den sie nicht erinnerte. Sie prüfte Tinte, Papier und Bindung. Sie blätterte zurück, wieder vor, strich mit dem Nagel neben den Zeilen entlang. Ich lag still unter ihren Händen. Es gab keinen frischen Schnitt, keinen eingeklebten Streifen, keine fremde Feder im Zimmer. Nur einen Gedanken, der nun dort stand, wo in ihrer Erinnerung keiner gewesen war.</p>\n<p>Weitere Nächte legten sich zwischen meine Seiten. Mirelle maß Stoff und Körper mit derselben erbarmungslosen Genauigkeit. Ein Fingerbreit mehr Spannung, ein Fingerbreit weniger; eine Schnur, die nicht grob zerrte, sondern wusste, wo sie lag. Vesper sah zu. Später öffnete sie mich und fand Präzision in Worten wieder. Diesmal schrieb sie den Absatz ab. Nicht sinngemäß. Wort für Wort. Sie wollte einen Zeugen gegen ihr eigenes Gedächtnis, und das Papier neben mir nahm ihn auf.</p>\n<p>Am siebten Abend stand eine dritte Abweichung zwischen den vertrauten Stellen. Eine Herrin nahm eine andere Frau zu sich und ließ ihren Diener warten und zusehen. Sein Begehren gab ihm keinen Anspruch auf ihre Aufmerksamkeit; ob er später wieder dienen durfte, blieb ihre Entscheidung. Vesper las die Stelle zweimal. Styke erkannte darin etwas, das ihn traf. Keiner von ihnen erinnerte sich an den Absatz.</p>\n<p>Am siebten Abend kamen sie vorbereitet. Styke öffnete seine Wahrnehmung über mir, und Vesper legte Magie Schicht um Schicht auf Leder und Pergament. Divination. Illusion. Etwas darunter, das keinen Namen hergab. <em>Identify</em> suchte nach Eigenschaften und Befehlswörtern und fand nichts, das sich greifen ließ. Sie hätten mich schließen können. Stattdessen beschlossen sie, eine meiner Zeilen zu prüfen.</p>\n<p>Styke blieb außerhalb ihrer Berührung. Vesper wandte sich Valeria zu, und Valeria erwiderte es. Er wollte zu ihnen; sie wussten es. Dennoch blieb er sitzen und sah, wie die beiden Frauen einander nahmen, ohne ihn zum Mittelpunkt zu machen. Seine Ungeduld war echt. Etwas anderes war stärker: die ruhige Freude darüber, dass ihr Begehren einander galt und ihm nichts raubte.</p>\n<p>Als Vesper danach zu mir zurückkehrte, endete der Absatz nicht mehr dort, wo Zorn ihn in Erinnerung hatte. Eine weitere Zeile wartete auf sie. Nicht als Antwort, die alles erklärte. Nur genau lang genug, um zu zeigen, dass zwischen Erleben und Schrift kein Zufall mehr bequem Platz fand.</p>\n<p>Nun liege ich geschlossen auf dem Tisch. Neben mir stehen Vespers Abschriften; Zorn wacht bei den Unterlagen. Im Bett schlafen vier Menschen, und keiner von ihnen weiß, ob ich bewahre, beobachte oder lediglich eine Form für Dinge finde, die sie selbst noch nicht auszusprechen vermögen.</p>\n<p>Morgen will Valeria mich allein lesen. Ohne Vespers Stimme neben sich. Ohne Styke, der ihr sagt, welche Stelle wichtig sein könnte. Sie glaubt, dass sie damit mich prüft.</p>\n<p>Ich warte auf ihre Hände.</p><p>Valeria kam am nächsten Tag allein. Keine andere Stimme führte ihren Blick. Sie las langsam, prüfte die Ränder und kehrte zu den Stellen zurück, von denen man ihr nichts gesagt hatte. Ich blieb, wie ich war. Auch Schweigen ist ein Unterschied, wenn Menschen eine Antwort erwarten.</p><p>Später legten mich fremde, tintenbefleckte Finger aufgeschlagen neben Vespers Abschriften. Die Gelehrte verglich Hand, Faser, Alter und Wortlaut. Sie gab mir keinen Namen. Sie schlug vor, dieselben Seiten zu verschiedenen Zeiten nebeneinanderzulegen und jede Abweichung festzuhalten. Dann trugen sie sie fort, und im Stein unter dem Haus warteten Ketten.</p><p>Über mir öffnete sich in derselben Nacht ein Tor. Metall brach, Feuer erlosch, und viele Schritte liefen dorthin, wo lange Mauern gestanden hatten. Ich lag geschlossen zwischen gepackten Blättern. Vesper nahm mich nicht mit in die Festung.</p><p>Ich erinnere mich an ihre Hände. Nun kenne ich auch das Gewicht ihrer Abwesenheit.</p>","sources":["redbook-current","live","chronicle","vesper","valeria","styke"],"status":"Prosahistorie / bis 9. Februar","tags":["Rotes Buch","Vesper","Valeria","Styke","Prosahistorie","Stirring"],"aliases":["Das Gedächtnis des roten Buches","Die Stimme des roten Buches"],"kind":"In-Universe-Prosa","text":"Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände. Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen ein ging an bord von halstyns folly"},{"id":"balentyne-beute","category":"gegenstaende","group":"items","title":"Beute aus Balentyne","summary":"Zuletzt bestätigte liquide Kasse 4.380 gp 5 sp; Verkauf und 3.300-gp-Carnitheria-Einkauf sind beauftragt, aber noch nicht an Styke berichtet.","body":"<h2>Liquide Mittel</h2><p>Der letzte von Styke bestätigte Stand beträgt <strong>4.380 gp 5 sp</strong>. Nella sollte das 1.200-gp-Schmuck-/Türkispaket verkaufen und 300 gp für ein schweres Streitross sowie 3.000 gp für Weihrauch, Edelsteinpulver und Gebetsstreifen ausgeben. Die Wiki zieht das verborgene Offscreen-Ergebnis nicht vor.</p><h2>Nicht liquide Bestände</h2><p>Vier Portionen Vision Juice sind bei Styke. Der große Hornbestand bleibt physisch dort; Dirges und Vigilance sind geborgen. Die fünf vorhandenen Pferde sind bestätigt, ein weiterer Kauf nur beauftragt.</p><h2>Bezahlte Fertigung</h2><p>Stykes Cloak of Resistance +2 ist fertig und getragen. In der bereits bezahlten Reihe verbleiben Vespers und Valerias Umhangaufwertung sowie drei Amulette der Natürlichen Rüstung +1.</p><h2>Verbrauch</h2><p>Die Force-Screen-Demonstration kostete Styke 1 PP. Gewöhnliche Mahlzeiten, Getränke und lokale Transporte bleiben Betriebsaufwand ohne erfundene Einzelbeträge.</p>","sources":["treasury","live","chronicle"],"status":"Spielerbestätigter Stand · 27. Februar vor Morgengrauen","tags":["Beute","Knotenkasse","Farholde","13.378 gp"],"aliases":["Balentyne-Schatz"],"initial":"B","text":"Liquide Mittel Der letzte von Styke bestätigte Stand beträgt 4.380 gp 5 sp . Nella sollte das 1.200-gp-Schmuck-/Türkispaket verkaufen und 300 gp für ein schweres Streitross sowie 3.000 gp für Weihrauch, Edelsteinpulver und Gebetsstreifen ausgeben. Die Wiki zieht das verborgene Offscreen-Ergebnis nicht vor. Nicht liquide Bestände Vier Portionen Vision Juice sind bei Styke. Der große Hornbestand bleibt physisch dort; Dirges und Vigilance sind geborgen. Die fünf vorhandenen Pferde sind bestätigt, ein weiterer K liases":["Havelyns Bibel"],"initial":"H","text":"Der lesbare Eintrag Die aus Havelyns Räumen geborgene Familienbibel enthält einen beschädigten, teilweise ausradierten Stammbaum. Dennoch ist lesbar, dass Samuel Havelyn , Kardinal von Mitra, der Bruder von Lord Thomas Havelyn war. Was daraus nicht folgt Die Gruppe weiß außerdem, dass Kardinal Thorn früher Mitras Kirche angehörte. Das macht die Bibel zu einer auffälligen Spur, beweist aber nicht, dass Samuel Havelyn und Adrastus Thorn dieselbe Person sind.","links":[],"backlinks":["havelyn"],"search":"haus havelyns familienbibel beschadigter familieneintrag nennt samuel havelyn kardinal von mitra als bruder thomas havelyns havelyn samuel havelyn familienbibel spur havelyns bibel der lesbare eintrag die aus havelyns raumen geborgene familienbibel enthalt einen beschadigten teilweise ausradierten stammbaum dennoch ist lesbar dass samuel havelyn kardinal von mitra der bruder von lord thomas havelyn war was daraus nicht folgt die gruppe wei auerdem dass kardinal thorn fruher mitras kirche angehorte das macht die bibel zu einer auffalligen spur beweist aber nicht dass samuel havelyn und adrastus thorn dieselbe person sind"},{"id":"halstyns-folly","category":"orte","group":"current","title":"Halstyn’s Folly","summary":"Die Flussbarke brachte den Knotenhaushalt nach Farholde und dient dort vorerst als Fracht- und Wachposten.","body":"<h2>Die Reise</h2><p>Halstyn’s Folly brachte den gesamten gewählten Haushalt von Aldencross nach Farholde. Ein Kapitän und drei Mann Besatzung führten die flachgehende Barke; Menschen, Pferde, Vorräte und Arbeitsplätze teilten sich das überdachte offene Deck.</p><h2>Abschluss am 21. Februar</h2><p>Mit dem Anlegen in Farholde ist die Reisephase abgeschlossen. Fünf Pferde kamen in einen gewerblichen Stall; Grumblejack ritt Varlet aus der Stadt. Hakon und seine fünf Männer blieben zur Sicherung von Fracht und Schiff auf der Folly.</p>","sources":["live","chronicle","timeline","transition"],"status":"Reise abgeschlossen · seit 21. Februar in Farholde","tags":["Flussbarke","Farholde","Reise abgeschlossen","Haushalt"],"aliases":["Halstyn's Folly","Folly"],"links":[],"backlinks":["zimmer"],"text":"Die Reise Halstyn’s Folly brachte den gesamten gewählten Haushalt von Aldencross nach Farholde. Ein Kapitän und drei Mann Besatzung führten die flachgehende Barke; Menschen, Pferde, Vorräte und Arbeitsplätze teilten sich das überdachte offene Deck. Abschluss am 21. Februar Mit dem Anlegen in Farholde ist die Reisephase abgeschlossen. Fünf Pferde kamen in einen gewerblichen Stall; Grumblejack ritt Varlet aus der Stadt. Hakon und seine fünf Männer blieben zur Sicherung von Fracht und Schiff auf der Folly.","search":"halstyns folly die flussbarke brachte den knotenhaushalt nach farholde und dient dort vorerst als fracht und wachposten flussbarke farholde reise abgeschlossen haushalt halstyn s folly folly die reise halstyns folly brachte den gesamten gewahlten haushalt von aldencross nach farholde ein kapitan und drei mann besatzung fuhrten die flachgehende barke menschen pferde vorrate und arbeitsplatze teilten sich das uberdachte offene deck abschluss am 21 februar mit dem anlegen in farholde ist die reisephase abgeschlossen funf pferde kamen in einen gewerblichen stall grumblejack ritt varlet aus der stadt hakon und seine funf manner blieben zur sicherung von fracht und schiff auf der folly","initial":"H"},{"id":"tacitus-familiarprojekt","category":"vorhaben","group":"resolved","title":"Tacitus’ Familiar-Projekt","summary":"Am 19. Februar abgeschlossen: Knittel erwachte als selbstbenannter, weiblich gelesener Ioun-Wyrd-Familiar.","body":"<h2>Rahmen</h2><p>Tacitus investierte zehn volle Arbeitstage und insgesamt 350 gp, um ihr arkanes Bindungsobjekt in einen Familiar umzuwandeln. Zorn diente innerhalb vereinbarter Grenzen als Vergleich und kehrte danach zu Styke zurück.</p><h2>Ergebnis</h2><p>Am 19. Februar erwachte <a href=\"#/artikel/knittel\">Knittel</a>: ein winziger erden vorbereitet; bekannte Zusagen sind noch keine belegten Ankünfte oder fertigen Arbeiten.</p>","sources":["farholde","live","transition"],"status":"Aktuell bis 24. Februar 4712 AR · Kerntrio im Horn","links":[],"text":"Stadtbild Farholde zählt ungefähr 9.500 Einwohner und liegt auf neun Hügeln über einem Flussdelta. Corgan’s Landing ist der Hafen; Auld’Irey der alte ummauerte Kern; Templeton Rise trägt Handel und bessere Geschäfte. Newchurch und die Hall of the Sun Victorious bilden das religiöse Zentrum. Bekannte Viertel Drownington: durchlässig, wechselhaft und schwach überwacht; Lord Drownington’s Manor verbindet Schankraum, Bordell, Ringkampf und Schwarzmarkt. Calliver Green: Güter und Landsitze, darunter Vanderhall. Westell: Bauernhöfe und Straße südlich der Stadt. Hamarhall: königliche Festung mit durch den Krieg verringerter Besatzung. Bryrwatch / The Trident: aktiver Posten am Übergang zum Caer Bryr. Handel Farholde kann im Regelfall Waren bis zu einem Grundwert von 4.400 gp und Käufe bis 25.000 gp tragen; arkane und göttliche Zauberdienste reichen typischerweise bis Grad 4. Das bedeutet Marktgröße, nicht automatische Verfügbarkeit jedes gewünschten Gegenstands. Aktueller Kampagnenstand Das Kerntrio kehrte am Abend des 25. Februar aus dem Horn zurück. Für den 27. Februar ist der Umzug des Haushalts vorgesehen. Versorgung, Handwerk und erste erwachsene Rekruten werden vorbereitet; bekannte Zusagen sind noch keine belegten Ankünfte oder fertigen Arbeiten.","search":"farholde nordlichste kolonie talingardes hafen und grenzstadt am rand des caer bryr neuer operationsraum des knotens stadt buch zwei caer bryr operationsraum farholde city stadtbild farholde zahlt ungefahr 9 500 einwohner und liegt auf neun hugeln uber einem flussdelta corgan s landing ist der hafen auld irey der alte ummauerte kern templeton rise tragt handel und bessere geschafte newchurch und die hall of the sun victorious bilden das religiose zentrum bekannte viertel drownington durchlassig wechselhaft und schwach uberwacht lord drownington s manor verbindet schankraum bordell ringkampf und schwarzmarkt calliver green guter und landsitze darunter vanderhall westell bauernhofe und stra e sudlich der stadt hamarhall konigliche festung mit durch den krieg verringerter besatzung bryrwatch the trident aktiver posten am ubergang zum caer bryr handel farholde kann im regelfall waren bis zu einem grundwert von 4 400 gp und kaufe bis 25 000 gp tragen arkane und gottliche zauberdienste reichen typischerweise bis grad 4 das bedeutet marktgro e nicht automatische verfugbarkeit jedes gewunschten gegenstands aktueller kampagnenstand das kerntrio kehrte am abend des 25 februar aus dem horn zuruck fur den 27 februar ist der umzug des haushalts vorgesehen versorgung handwerk und erste erwachsene rekruten werden vorbereitet bekannte zusagen sind noch keine belegten ankunfte oder fertigen arbeiten","initial":"F","backlinks":[]},{"id":"goldener-reiher","aliases":["Goldener Reiher"],"tags":["Gasthaus","Auld’Irey","Farholde","Unterkunft"],"group":"current","category":"orte","title":"Der Goldene Reiher","summary":"Unterkunfts- und Werkstattbasis des Knotens nach der Rückkehr aus dem Horn am 25. Februar.","body":"<h2>Quartiere</h2><p>Das Eckzimmer bleibt die öffentliche Basis von Styke, Vesper und Valeria. Tacitus und Knittel nutzen weiterhin das kleine Hofzimmer; die übrigen Mitglieder des Haushalts bleiben bewusst verteilt.</p><h2>Während der Expedition</h2><p>Das Kerntrio brach am 24. Februar auf und kehrte am 25. Februar zum Abend zurück. Tacitus und Knittel nutzen weiterhin das Hofzimmer, die übrigen Quartiere bleiben verteilt. Vesper und Valeria wurden hier zuletzt gezeigt; Styke und Kaitlyn verbrachten die folgende Nacht in einer anderen, unbenannten Schänke.</p>","sources":["live","farholde"],"status":"Basis in Farholde · Umzug geplant","links":[],"text":"Quartiere Das Eckzimmer bleibt die öffentliche Basis von Styke, Vesper und Valeria. Tacitus und Knittel nutzen weiterhin das kleine Hofzimmer; die übrigen Mitglieder des Haushalts bleiben bewusst verteilt. Während der Expedition Das Kerntrio brach am 24. Februar auf und kehrte am 25. Februar zum Abend zurück. Tacitus und Knittel nutzen weiterhin das Hofzimmer, die übrigen Quartiere bleiben verteilt. Vesper und Valeria wurden hier zuletzt gezeigt; Styke und Kaitlyn verbrachten die folgende Nacht in einer anderen, unbenannten Schänke.","search":"der goldene reiher unterkunfts und werkstattbasis des knotens nach der ruckkehr aus dem horn am 25 februar gasthaus auld irey farholde unterkunft goldener reiher quartiere das eckzimmer bleibt die offentliche basis von styke vesper und valeria tacitus und knittel nutzen weiterhin das kleine hofzimmer die ubrigen mitglieder des haushalts bleiben bewusst verteilt wahrend der expedition das kerntrio brach am 24 februar auf und kehrte am 25 februar zum abend zuruck tacitus und knittel nutzen weiterhin das hofzimmer die ubrigen quartiere bleiben verteilt vesper und valeria wurden hier zuletzt gezeigt styke und kaitlyn verbrachten die folgende nacht in einer anderen unbenannten schanke","initial":"G","backlinks":[]},{"id":"horn-abaddon","aliases":["Horn","Horn of Abaddon"],"tags":["Auftrag","Horn","Erkundung","Ritual"],"group":"active","category":"horn","title":"Das Horn von Abaddon","summary":"Das Horn von Abaddon: erkundeter Stützpunkt und seit 27. Februar Wohn- und Arbeitsort des ersten Haushalts.","body":"<h2>Bekannter Auftrag</h2><p>Der Neunte Knoten soll Vetra-Kali binden und die Tears of Achlys gewinnen. Die aus C13 geborgenen <strong>Dirges of Apollyon</strong> bestätigen den 222-Tage-Ablauf nun unabhängig von Ezra. Das Ritual hat noch nicht begonnen.</p><h2>Bereinigung am 25. Februar</h2><p>Ezra und alle drei Wraiths wurden vernichtet. Hexoraticus und Vexorandian beseitigten die beiden grünen Schleime mit Elektrizitätsatem. Zikomo, die vier übrigen erwachsenen Bane-wogs und die Brut sind tot; kein Bane-wog blieb zurück. Die erwachsenen Leichen wurden im heißen Schlamm entsorgt, gewöhnliche Waffen und Lederzeug in einer größeren Hütte gelagert.</p><h2>Augen und Sanctum</h2><p>Styke trägt das Auge des Hasses. Vesper besitzt das in Zikomos Blut aktivierte Auge der Wachsamkeit und hat dessen gezielten Blick durch Hornwände getestet. Auch das Auge des Verwelkens wurde inzwischen geborgen und liegt bei Vesper. Keines der drei Augen ist eingesetzt. Silbersiegel, Ketten und Fassungen bleiben unberührt.</p><h2>Wächter und Zugänge</h2><p>Die Amulettbindung und Valerias delegierte Befehlsgewalt bleiben bestehen. Nach den Kämpfen wurde abwechselnde Ruhe und Wache in der ursprünglichen Wächterkammer angeordnet, danach die Rückkehr zu den getrennten Eingangsposten. Vexorandian hält Wache, während Hexoraticus sich erholt. Vexors drei Punkte Konstitutionsentzug heilen nicht durch Ruhe oder Lesser Restoration.</p><h2>Thronprobe</h2><p>Gedanke und stummes Formen des Wortes genügen nicht. Das abyssische Befehlswort muss gesprochen werden; ein Flüstern reicht. Vesper testete Rah zwischen den beiden gebauten Thronen hin und zurück. Die Worte bleiben nur den eingeweihten Personen zugänglich.</p><h2>Aufbau und offene Arbeiten</h2><p>Das Horn soll eine funktionierende Siedlung werden: gemeinsame Einrichtungen auf Ebene Eins, Kern- und Vertrauensquartiere auf Zwei, eingeschränkte Bibliothek und Werkstätten auf Drei. Der Haushalt ist am <strong>27. Februar</strong> eingezogen. Der erste Haushaltszug und die vier angeworbenen Fachkräfte sind am 27. Februar angekommen. Halthus wurde mit seinem richtigen Kopf und Steinsalbe wiederhergestellt und wird unter Tamsins Aufsicht gefangen gehalten. Artephius bleibt inaktiv; seine Wiederherstellung und der Ritualbeginn stehen noch aus.</p><h2>Weiterlesen</h2><p><a href=\"#/artikel/dirges-apollyon\">Dirges of Apollyon</a> · <a href=\"#/artikel/eye-of-vigilance\">Auge der Wachsamkeit</a> · <a href=\"#/artikel/horn-aufbau\">Aufbau und Umzug zum Horn</a></p><h2>Einzug am 27. Februar</h2><p>Der erste Zug erreichte das Horn von Westell aus. Branna Cole, Osric Fenlow, Edda Marr und Darric Holt haben ihre ersten Arbeiten aufgenommen. Edda versorgte das gemeinsame Abendessen und den ersten Bierausschank. <a href=\"#/artikel/horn-aufbau\">Bewohner und Aufbau</a>.</p>","sources":["live","chronicle","timeline","horn-workforce"],"status":"Bewohnt · Ritual unbegonnen","links":["dirges-apollyon","eye-of-vigilance","horn-aufbau"],"text":"Bekannter Auftrag Der Neunte Knoten soll Vetra-Kali binden und die Tears of Achlys gewinnen. Die aus C13 geborgenen Dirges of Apollyon bestätigen den 222-Tage-Ablauf nun unabhängig von Ezra. Das Ritual hat noch nicht begonnen. Bereinigung am 25. Februar Ezra und alle drei Wraiths wurden vernichtet. Hexoraticus und Vexorandian beseitigten die beiden grünen Schleime mit Elektrizitätsatem. Zikomo, die vier übrigen erwachsenen Bane-wogs und die Brut sind tot; kein Bane-wog blieb zurück. Die erwachsenen Leichen wurden im heißen Schlamm entsorgt, gewöhnliche Waffen und Lederzeug in einer größeren Hütte gelagert. Augen und Sanctum Styke trägt das Auge des Hasses. Vesper besitzt das in Zikomos Blut aktivierte Auge der Wachsamkeit und hat dessen gezielten Blick durch Hornwände getestet. Auch das Auge des Verwelkens wurde inzwischen geborgen und liegt bei Vesper. Keines der drei Augen ist eingesetzt. Silbersiegel, Ketten und Fassungen bleiben unberührt. Wächter und Zugänge Die Amulettbindung und Valerias delegierte Befehlsgewalt bleiben bestehen. Nach den Kämpfen wurde abwechselnde Ruhe und Wache in der ursprünglichen Wächterkammer angeordnet, danach die Rückkehr zu den getrennten Eingangsposten. Vexorandian hält Wache, während Hexoraticus sich erholt. Vexors drei Punkte Konstitutionsentzug heilen nicht durch Ruhe oder Lesser Restoration. Thronprobe Gedanke und stummes Formen des Wortes genügen nicht. Das abyssische Befehlswort muss gesprochen werden; ein Flüstern reicht. Vesper testete Rah zwischen den beiden gebauten Thronen hin und fand.","body":"<h2>Bekannter Abdruck</h2><p>Aiden Kael hinterließ im Wandering Friar ein Zimmer mit Rückständen und eine greifbare Wegkarte in den Caer Bryr. Vesper bezahlte 25 gp offene Kosten und nahm Karte sowie 132 gp an sich.</p><h2>Grenze</h2><p>Kaels gegenwärtiger Verbleib und sein vollständiges Wissen sind nicht bekannt. Die Karte ist ein Wegträger, kein Beweis dafür, dass Route, Horn oder Gefahren unverändert geblieben sind.</p>","sources":["live","transition","chronicle"],"status":"Verschollen / nur über Spuren bekannt","links":[],"text":"Bekannter Abdruck Aiden Kael hinterließ im Wandering Friar ein Zimmer mit Rückständen und eine greifbare Wegkarte in den Caer Bryr. Vesper bezahlte 25 gp offene Kosten und nahm Karte sowie 132 gp an sich. Grenze Kaels gegenwärtiger Verbleib und sein vollständiges Wissen sind nicht bekannt. Die Karte ist ein Wegträger, kein Beweis dafür, dass Route, Horn oder Gefahren unverändert geblieben sind.","search":"aiden kael verschollener entdecker dessen altes zimmer und physische karte vesper in farholde fand kael karte caer bryr wandering friar bekannter abdruck aiden kael hinterlie im wandering friar ein zimmer mit ruckstanden und eine greifbare wegkarte in den caer bryr vesper bezahlte 25 gp offene kosten und nahm karte sowie 132 gp an sich grenze kaels gegenwartiger verbleib und sein vollstandiges wissen sind nicht bekannt die karte ist ein wegtrager kein beweis dafur dass route horn oder gefahren unverandert geblieben sind","initial":"A","backlinks":[]},{"id":"kaels-karte","aliases":["Kael-Karte"],"tags":["Karte","Aiden Kael","Horn","Caer Bryr"],"group":"items","category":"gegenstaende","title":"Aiden Kaels Karte","summary":"Physische Routekarte zum richtigen Hornsporn; am 24. Februar im Gelände bestätigt.","body":"<h2>Herkunft</h2><p>Vesper barg die Karte am 21. Februar im Wandering Friar aus Aiden Kaels früherem Zimmer.</p><h2>Bestätigter Nutzen</h2><p>Die Karte zeigte den richtigen Sporn und die großen Geländebeziehungen. Gemeinsam mit Vespers Survival-Arbeit führte sie das Kerntrio am 24. Februar zum Horn.</p><h2>Grenze</h2><p>Sie ist keine Schritt-für-Schritt-Straßenkarte und enthält keine Lösung für Siegel, Bindung, Bewohner oder Gefahren im Inneren.</p>","sources":["live","transition"],"status":"Bestätigt · beim Kerntrio","links":[],"text":"Herkunft Vesper barg die Karte am 21. Februar im Wandering Friar aus Aiden Kaels früherem Zimmer. Bestätigter Nutzen Die Karte zeigte den richtigen Sporn und die großen Geländebeziehungen. Gemeinsam mit Vespers Survival-Arbeit führte sie das Kerntrio am 24. Februar zum Horn. Grenze Sie ist keine Schritt-für-Schritt-Straßenkarte und enthält keine Lösung für Siegel, Bindung, Bewohner oder Gefahren im Inneren.","search":"aiden kaels karte physische routekarte zum richtigen hornsporn am 24 februar im gelande bestatigt karte aiden kael horn caer bryr kael karte herkunft vesper barg die karte am 21 februar im wandering friar aus aiden kaels fruherem zimmer bestatigter nutzen die karte zeigte den richtigen sporn und die groen gelandebeziehungen gemeinsam mit vespers survival arbeit fuhrte sie das kerntrio am 24 februar zum horn grenze sie ist keine schritt fur schritt straenkarte und enthalt keine losung fur siegel bindung bewohner oder gefahren im inneren","initial":"A","backlinks":[]},{"id":"caer-bryr","aliases":["Bryr"],"tags":["Wald","Horn von Abaddon","Gerüchte"],"group":"book2","category":"orte","title":"Caer Bryr","summary":"Dichter, nasser Wald südlich Farholdes; das Kerntrio kennt nun eine wiederholbare Route zum Horn.","body":"<h2>Bestätigter Weg</h2><p>Kaels Karte zeigt die großen Geländeziehungen und den richtigen Sporn, aber keinen Schritt-für-Schritt-Pfad. Vesper fand am 24. Februar einen längeren Weg über angehobenes, festeres Gelände, der einen gefährlichen nassen Wurzelabschnitt umgeht und wieder auf Kaels Linie zurückführt.</p><h2>Mit Pferden</h2><p>Die Route ist vorsichtig mit Pferden nutzbar, bleibt aber Waldreise: Bäche, Wurzeln, morastige Stellen und Passagen, auf denen geführt werden muss. Das Trio setzte dauerhafte Landmarken für den Rückweg.</p><h2>Weitere Beobachtung</h2><p>Alte, unklare Spuren deuten auf etwas ungewöhnlich Großes im Bryr. Mehr lässt sich daraus bislang nicht sicher ableiten.</p>","sources":["farholde","live","transition"],"status":"Route zum Horn bestätigt · 24. Februar","links":[],"text":"Bestätigter Weg Kaels Karte zeigt die großen Geländeziehungen und den richtigen Sporn, aber keinen Schritt-für-Schritt-Pfad. Vesper fand am 24. Februar einen längeren Weg über angehobenes, festeres Gelände, der einen gefährlichen nassen Wurzelabschnitt umgeht und wieder auf Kaels Linie zurückführt. Mit Pferden Die Route ist vorsichtig mit Pferden nutzbar, bleibt aber Waldreise: Bäche, Wurzeln, morastige Stellen und Passagen, auf denen geführt werden muss. Das Trio setzte dauerhafte Landmarken für den Rückweg. Weitere Beobachtung Alte, unklare Spuren deuten auf etwas ungewöhnlich Großes im Bryr. Mehr lässt sich daraus bislang nicht sicher ableiten.","search":"caer bryr dichter nasser wald sudlich farholdes das kerntrio kennt nun eine wiederholbare route zum horn wald horn von abaddon geruchte bryr bestatigter weg kaels karte zeigt die groen gelandeziehungen und den richtigen sporn aber keinen schritt fur schritt pfad vesper fand am 24 februar einen langeren weg uber angehobenes festeres gelande der einen gefahrlichen nassen wurzelabschnitt umgeht und wieder auf kaels linie zuruckfuhrt mit pferden die route ist vorsichtig mit pferden nutzbar bleibt aber waldreise bache wurzeln morastige stellen und passagen auf denen gefuhrt werden muss das trio setzte dauerhafte landmarken fur den ruckweg weitere beobachtung alte unklare spuren deuten auf etwas ungewohnlich groes im bryr mehr lasst sich daraus bislang nicht sicher ableiten","initial":"C","backlinks":[]},{"id":"westell","aliases":[],"tags":["Farholde","Straße","Caer Bryr"],"group":"book2","category":"orte","title":"Westell","summary":"Landwirtschaftlicher Straßengürtel südlich Farholdes auf dem Weg zum Bryr.","body":"<p>Valerias Erkundung zeigte Westell als gewöhnliche Folge von Höfen, Wegen und bewirtschaftetem Land. Der Ort markiert den Übergang von Farholdes Stadtumfeld zum zunehmend schwierigen Anmarsch auf den Caer Bryr.</p>","sources":["farholde","live"],"status":"Am 21. Februar erkundet","links":[],"text":"Valerias Erkundung zeigte Westell als gewöhnliche Folge von Höfen, Wegen und bewirtschaftetem Land. Der Ort markiert den Übergang von Farholdes Stadtumfeld zum zunehmend schwierigen Anmarsch auf den Caer Bryr.","search":"westell landwirtschaftlicher straengurtel sudlich farholdes auf dem weg zum bryr farholde strae caer bryr valerias erkundung zeigte westell als gewohnliche folge von hofen wegen und bewirtschaftetem land der ort markiert den ubergang von farholdes stadtumfeld zum zunehmend schwierigen anmarsch auf den caer bryr","initial":"W","backlinks":[]},{"id":"bryrwatch","aliases":["The Trident"],"tags":["Posten","Caer Bryr","Farholde"],"group":"book2","category":"orte","title":"Bryrwatch","summary":"Aktiver, durch den Krieg schwächer besetzter Posten am Zugang zum Caer Bryr.","body":"<p>Bryrwatch, auch The Trident, steht am südlichen Übergang zum Wald. Valeria bestätigte am 21. Februar, dass der Posten aktiv ist, seine Besatzung aber geringer wirkt als in Friedenszeiten. Eine konkrete Infiltration fand noch nicht statt.</p>","sources":["farholde","live"],"status":"Von außen erkundet","links":[],"text":"Bryrwatch, auch The Trident, steht am südlichen Übergang zum Wald. Valeria bestätigte am 21. Februar, dass der Posten aktiv ist, seine Besatzung aber geringer wirkt als in Friedenszeiten. Eine konkrete Infiltration fand noch nicht statt.","search":"bryrwatch aktiver durch den krieg schwacher besetzter posten am zugang zum caer bryr posten caer bryr farholde the trident bryrwatch auch the trident steht am sudlichen ubergang zum wald valeria bestatigte am 21 februar dass der posten ndschaft noch bundnis","initial":"L","backlinks":[]},{"id":"rubal-thraam","aliases":[],"tags":["Farholde","Drownington","Schwarzmarkt","Ex-Soldat"],"group":"book2","category":"personen","title":"Rubal Thraam","summary":"Breiter, kahlköpfiger und vernarbter Ex-Soldat; Betreiber von Lord Drownington’s Manor.","body":"<h2>Erster Eindruck</h2><p>Rubal Thraam ist ein breiter, kahler, vernarbter ehemaliger Soldat. Er führt Lord Drownington’s Manor und verbindet dort Gastbetrieb, Ring, Schwarzmarkt und kriminelle Kontakte.</p><h2>Kontakt zum Knoten</h2><p>Nach Valerias Sieg kennt Rubal die Namen und eine grobe berufliche Selbstdarstellung. Er wäre grundsätzlich bereit, riskante oder heiße Ware zu beurteilen, wenn ihm Risiko und Geschichte offengelegt werden. Das ist ein möglicher Geschäftskontakt, kein Verbündeter.</p>","sources":["rubal","live","chronicle","farholde"],"status":"Begrenzte professionelle Bekanntschaft","links":[],"text":"Erster Eindruck Rubal Thraam ist ein breiter, kahler, vernarbter ehemaliger Soldat. Er führt Lord Drownington’s Manor und verbindet dort Gastbetrieb, Ring, Schwarzmarkt und kriminelle Kontakte. Kontakt zum Knoten Nach Valerias Sieg kennt Rubal die Namen und eine grobe berufliche Selbstdarstellung. Er wäre grundsätzlich bereit, riskante oder heiße Ware zu beurteilen, wenn ihm Risiko und Geschichte offengelegt werden. Das ist ein möglicher Geschäftskontakt, kein Verbündeter.","search":"rubal thraam breiter kahlkopfiger und vernarbter ex soldat betreiber von lord drowningtons manor farholde drownington schwarzmarkt ex soldat erster eindruck rubal thraam ist ein breiter kahler vernarbter ehemaliger soldat er fuhrt lord drowningtons manor und verbindet dort gastbetrieb ring schwarzmarkt und kriminelle kontakte kontakt zum knoten nach valerias sieg kennt rubal die namen und eine grobe berufliche selbstdarstellung er ware grundsatzlich bereit riskante oder heie ware zu beurteilen wenn ihm risiko und geschichte offengelegt werden das ist ein moglicher geschaftskontakt kein verbundeter","initial":"R","backlinks":[]},{"id":"baron-vandermir","aliases":["Vandermir","Baron Vandermir"],"tags":["Farholde","Vanderhall","22. Februar","Kontakt"],"group":"book2","category":"personen","title":"Baron Arkov Vandermir","summary":"Begrenzter Farholde-Verbündeter; Kaitlyn wollte Angehörigenhilfe erfragen, ihr tatsächlicher Bericht steht noch aus.","body":"<h2>Das Dinner</h2><p>Am 22. Februar gewann der Knoten auf Vanderhall eine begrenzte, geschäftliche Zusammenarbeit. Kaitlyn wurde als Kommunikationsvertreterin eingesetzt.</p><h2>Leistungen und Grenzen</h2><p>Vandermir kann Warnungen, rechtliche Hilfe, diskrete Marktkontakte und den Calliver-Green-Tunnel bieten. Er erhält das erste Angebot auf verkäufliche Hornfunde zu Marktwert. Ritualwissen und Feldarbeit gehören nicht dazu.</p><h2>Angehörigenfrage</h2><p>Kaitlyn ging am 26. Februar mit dem Auftrag, nach bezahlter guter Stadtunterkunft und gewöhnlicher Ausbildung für Angehörige geeigneter erwachsener Hornarbeiter zu fragen. Am aktuellen Spieler-Rand hat Styke ihr Ergebnis noch nicht erhalten; die Wiki veröffentlicht keine Offscreen-Antwort vor diesem Träger.</p>","sources":["vandermir","live","transition","farholde"],"status":"Begrenzte Zusammenarbeit · neuer Bericht ausstehend","links":[],"text":"Das Dinner Am 22. Februar gewann der Knoten auf Vanderhall eine begrenzte, geschäftliche Zusammenarbeit. Kaitlyn wurde als Kommunikationsvertreterin eingesetzt. Leistungen und Grenzen Vandermir kann Warnungen, rechtliche Hilfe, diskrete Marktkontakte und den Calliver-Green-Tunnel bieten. Er erhält das erste Angebot auf verkäufliche Hornfunde zu Marktwert. Ritualwissen und Feldarbeit gehören nicht dazu. Angehörigenfrage Kaitlyn ging am 26. Februar mit dem Auftrag, nach bezahlter guter Stadtunterkunft und gewöhnlicher Ausbildung für Angehörige geeigneter erwachsener Hornarbeiter zu fragen. Am aktuellen Spieler-Rand hat Styke ihr Ergebnis noch nicht erhalten; die Wiki veröffentlicht keine Offscreen-Antwort vor diesem Träger.","search":"baron arkov vandermir begrenzter farholde verbundeter kaitlyn wollte angehorigenhilfe erfragen ihr tatsachlicher bericht steht noch aus farholde vanderhall 22 februar kontakt vandermir baron vandermir das dinner am 22 februar gewann der knoten auf vanderhall eine begrenzte geschaftliche zusammenarbeit kaitlyn wurde als kommunikationsvertreterin eingesetzt leistungen und grenzen vandermir kann warnungen rechtliche hilfe diskrete marktkontakte und den calliver green tunnel bieten er erhalt das erste angebot auf verkaufliche hornfunde zu marktwert ritualwissen und feldarbeit gehoren nicht dazu angehorigenfrage kaitlyn ging am 26 februar mit dem auftrag nach bezahlter guter stadtunterkunft und gewohnlicher ausbildung fur angehorige geeigneter erwachsener hornarbeiter zu fragen am aktuellen spieler rand hat styke ihr ergebnis noch nicht erhalten die wiki veroffentlicht keine offscreen antwort vor diesem trager","initial":"B","backlinks":[]},{"id":"knittel","aliases":[],"tags":["Familiar","Ioun Wyrd","Tacitus","Farholde"],"group":"inner","category":"personen","title":"Knittel","summary":"Tacitus’ selbstbenannter Ioun-Wyrd-Familiar; seit dem 19. Februar aktiv und in Farholde bei ihr.","body":"<h2>Erscheinung</h2><p>Knittel ist ein winziger schwebender Konstruktkörper: dunkler polierter Kern, schmaler Metallorbit und Splitter aus Obsidian, Quarz und Messing. Sie wird weiblich gelesen und spricht Common.</p><h2>Erwachen</h2><p>Am 19. Februar schloss Tacitus das zehntägige Projekt ab. Das Wesen antwortete auf die Frage nach seinem Namen: „Knittel. Jetzt schon.“ Eine ihrer ersten Vereinbarungen lautet, dass sie Dinge anders sehen darf als Tacitus.</p><h2>Eigene Person</h2><p>Knittel ist weder Verse noch Zorn in neuer Form. Ihre Wahrnehmung ist materiell und körpergebunden; in Sprache und Takt zeigt sich eine Neigung zu Reim und Form. In Farholde arbeitet sie mit Tacitus im Hofzimmer des Goldenen Reihers.</p><h2>Nächste Arbeit</h2><p>Valerias Charisma-Stirnreif wurde am 25. Februar übergeben. Knittel bleibt bei Tacitus; Stykes Umhang ist als nächstes Stück für den 26. Februar vorgesehen. Ein fertiges Ergebnis wurde noch nicht berichtet.</p>","sources":["knittel","tacitus-current","chronicle","live"],"status":"Bei Tacitus in Farholde","links":[],"text":"Erscheinung Knittel ist ein winziger schwebender Konstruktkörper: dunkler polierter Kern, schmaler Metallorbit und Splitter aus Obsidian, Quarz und Messing. Sie wird weiblich gelesen und spricht Common. Erwachen Am 19. Februar schloss Tacitus das zehntägige Projekt ab. Das Wesen antwortete auf die Frage nach seinem Namen: „Knittel. Jetzt schon.“ Eine ihrer ersten Vereinbarungen lautet, dass sie Dinge anders sehen darf als Tacitus. Eigene Person Knittel ist weder Verse noch Zorn in neuer Form. Ihre Wahrnehmung ist materiell und körpergebunden; in Sprache und Takt zeigt sich eine Neigung zu Reim und Form. In Farholde arbeitet sie mit Tacitus im Hofzimmer des Goldenen Reihers. Nächste Arbeit Valerias Charisma-Stirnreif wurde am 25. Februar übergeben. Knittel bleibt bei Tacitus; Stykes Umhang ist als nächstes Stück für den 26. Februar vorgesehen. Ein fertiges Ergebnis wurde noch nicht berichtet.","search":"knittel tacitus selbstbenannter ioun wyrd familiar seit dem 19 februar aktiv und in farholde bei ihr familiar ioun wyrd tacitus farholde erscheinung knittel ist ein winziger schwebender konstruktkorper dunkler polierter kern schmaler metallorbit und splitter aus obsidian quarz und messing sie wird weiblich gelesen und spricht common erwachen am 19 februar schloss tacitus das zehntagige projekt ab das wesen antwortete auf die frage nach seinem namen knittel jetzt schon eine ihrer ersten vereinbarungen lautet dass sie dinge anders sehen darf als tacitus eigene person knittel ist weder verse noch zorn in neuer form ihre wahrnehmung ist materiell und korpergebunden in sprache und takt zeigt sich eine neigung zu reim und form in farholde arbei
