le der Bevölkerung nach Süden und Westen fliehen. Balentyne ist inzwischen gefallen. Wie viele Menschen noch im Ort sind und wie die einzelnen Straßen, Häuser und Läden jetzt aussehen, hat das Kerntrio am aktuellen Rand noch nicht selbst festgestellt.","links":[],"backlinks":["story-so-far"],"search":"aldencross offener marktort unter balentyne grosse teile der bevolkerung fliehen wahrend des bugbearangriffs nach suden und westen aldencross grenzort sudlich der watch wall aldencross liegt unmittelbar sudlich von balentyne und lebte von garnison handel und reisenden die bisherigen tarnungen einkaufe beziehungen und mott ereignisse spielten hier letzter direkter blick wahrend fire axe balentyne sturmte sahen styke vesper und valeria grosse teile der bevolkerung nach suden und westen fliehen balentyne ist inzwischen gefallen wie viele menschen noch im ort sind und wie die einzelnen strassen hauser und laden jetzt aussehen hat das kerntrio am aktuellen rand noch nicht selbst festgestellt","initial":"A"},{"id":"dalliance","category":"orte","title":"Lord's Dalliance","summary":"Frühere Basis des Knotens in Aldencross; Bellam, Alicia und der gesamte gewählte Haushalt haben das Haus verlassen.","body":"<h2>Gasthaus und Operationszentrum<\/h2><p>Das Lord’s Dalliance war Unterkunft, Planungsraum und Zugang zum Geheimgang nach Balentyne. Bellam bleibt Eigentümer; Stykes früherer Satz „unser Haus“ war kein rechtlicher Besitzwechsel.<\/p><h2>Abreise<\/h2><p>Nach Balentynes Fall verließ der gesamte gewählte Haushalt das Dalliance und ging an Bord von Halstyn’s Folly. Bellam und Alicia nahmen erreichbaren persönlichen Besitz mit. Nella, Tamsin, Mirelle, Kaitlyn, Hakon, die Norspiker, Grumblejack und sechs Pferde reisten ebenfalls ab.<\/p><h2>Wissensstand<\/h2><p>Seit der Abreise besitzt die Gruppe keinen belastbaren Bericht über das Gebäude. Sein späterer Zustand wird deshalb nicht vorweggenommen.<\/p>","sources":["dalliance","live","chronicle","mirelle"],"status":"Verlassen am 9. Februar","tags":["Aldencross","Tunnel","Basis","Evakuierung"],"aliases":["Lords Dalliance","Dalliance","The Lord's Dalliance"],"parent":"aldencross","text":"Gasthaus und Operationszentrum Das Lord’s Dalliance war Unterkunft, Planungsraum und Zugang zum Geheimgang nach Balentyne. Bellam bleibt Eigentümer; Stykes früherer Satz „unser Haus“ war kein rechtlicher Besitzwechsel. Abreise Nach Balentynes Fall verließ der gesamte gewählte Haushalt das Dalliance und ging an Bord von Halstyn’s Folly. Bellam und Alicia nahmen erreichbaren persönlichen Besitz mit. Nella, Tamsin, Mirelle, Kaitlyn, Hakon, die Norspiker, Grumblejack und sechs Pferde reisten ebenfalls ab. Wissensstand Seit der Abreise besitzt die Gruppe keinen belastbaren Bericht über das Gebäude. Sein späterer Zustand wird deshalb nicht vorweggenommen.","search":"lord s dalliance fruhere basis des knotens in aldencross bellam alicia und der gesamte gewahlte haushalt haben das haus verlassen lords dalliance dalliance the lord s dalliance aldencross tunnel basis evakuierung gasthaus und operationszentrum das lord s dalliance war unterkunft planungsraum und zugang zum geheimgang nach balentyne bellam bleibt eigentumer stykes fruherer satz unser haus war kein rechtlicher besitzwechsel abreise nach balentynes fall verliess der gesamte gewahlte haushalt das dalliance und ging an bord von halstyn s folly bellam und alicia nahmen erreichbaren personlichen besitz mit nella tamsin mirelle kaitlyn hakon die norspiker grumblejack und sechs pferde reisten ebenfalls ab wissensstand seit der abreise besitzt die gruppe keinen belastbaren bericht uber das gebaude sein spaterer zustand wird deshalb nicht vorweggenommen","links":[],"backlinks":["story-so-far","zeit-0123","zeit-0201"],"initial":"L"},{"id":"zimmer","category":"orte","title":"Das rückwärtige Zimmer","summary":"Das rückwärtige Zimmer diente als Schlaf-, Dinner- und Bindungsraum; der Haushalt verließ es beim Aufbruch.","body":"<h2>Das alte Knot-Zimmer<\/h2><p>Der große obere Raum des Dalliance diente dem Kerntrio als Schlaf- und Planungsraum. Hier schlief Kaitlyn kurz bei Styke ein; später las und unterschrieb Tacitus den Compact und wurde gebunden.<\/p><h2>Abreise<\/h2><p>Am 9. Februar wurde der erreichbare persönliche Besitz für den Aufbruch geordnet. Der gesamte gewählte Haushalt verließ das Haus und ging an Bord von <a href=\"#/artikel/halstyns-folly\">Halstyn’s Folly<\/a>. Seitdem gibt es keinen neuen direkten Bericht aus dem Zimmer.<\/p>","sources":["live","dalliance","mirelle","clocks-current"],"status":"Historischer Schauplatz; am 9. Februar verlassen","tags":["Aldencross","7. Februar","Lord’s Dalliance"],"aliases":[],"parent":"dalliance","text":"Das alte Knot-Zimmer Der große obere Raum des Dalliance diente dem Kerntrio als Schlaf- und Planungsraum. Hier schlief Kaitlyn kurz bei Styke ein; später las und unterschrieb Tacitus den Compact und wurde gebunden. Abreise Am 9. Februar wurde der erreichbare persönliche Besitz für den Aufbruch geordnet. Der gesamte gewählte Haushalt verließ das Haus und ging an Bord von Halstyn’s Folly . Seitdem gibt es keinen neuen direkten Bericht aus dem Zimmer.","links":["halstyns-folly"],"backlinks":[],"search":"das ruckwartige zimmer das ruckwartige zimmer diente als schlaf dinner und bindungsraum der haushalt verliess es beim aufbruch aldencross 7 februar lord s dalliance das alte knot zimmer der grosse obere raum des dalliance diente dem kerntrio als schlaf und planungsraum hier schlief kaitlyn kurz bei styke ein spater las und unterschrieb tacitus den compact und wurde gebunden abreise am 9 februar wurde der erreichbare personliche besitz fur den aufbruch geordnet der gesamte gewahlte haushalt verliess das haus und ging an bord von halstyn s folly seitdem gibt es keinen neuen direkten bericht aus dem zimmer","initial":"D"},{"id":"tunnel","category":"orte","title":"Der Geheimgang","summary":"Alter Zwergengang zwischen Dalliance und Balentyne; das Trio kehrt hindurch zurück, Tacitus und Jacobian sind an den Wandketten gesichert.","body":"<h2>Entdeckung in der Nacht 27./28. Januar<\/h2>\n<p><a href=\"#/artikel/vesper\">Vesper<\/a> führte die Suche, <a href=\"#/artikel/styke\">Styke<\/a> half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an.<\/p>\n<h2>Tatsächlich gesehene Gegenseite<\/h2>\n<p>Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her.<\/p>\n<h2>Was weiterhin fehlt<\/h2>\n<p>Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route.<\/p>\n<h2>Gegenwärtige Nutzung<\/h2><p>Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noch eine geprüfte magische Sicherung. Der Gang bleibt zugleich möglicher Zugang und Rückzugsweg.<\/p>\n<h2>Die Nacht zum 9. Februar<\/h2><p>Der Gang wurde zum tatsächlichen Ein- und Rückzugsweg des Angriffs. Tacitus und Jacobian wurden mehrere Biegungen tief an den beiden Wandketten befestigt. Später passierte das Kerntrio sie auf dem Weg nach Balentyne und erneut beim zweiten Gang. Aktuell kehren Styke, Vesper und Valeria mit der zweiten Beute durch den Tunnel zum Dalliance zurück.<\/p>","sources":["dalliance","balentyne","chronicle","live"],"status":"Aktueller Ort / Gefangenenpunkt","tags":["Aldencross"],"aliases":["Geheimtunnel","Zwergentunnel","Kellertunnel"],"parent":"dalliance","text":"Entdeckung in der Nacht 27./28. Januar Vesper führte die Suche, Styke half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an. Tatsächlich gesehene Gegenseite Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her. Was weiterhin fehlt Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route. Gegenwärtige Nutzung Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noch eine geprüfte magische Sicherung. Der Gang bleibt zugleich möglicher Zugang und Rückzugsweg. Die Nacht zum 9. Februar Der Gang wurde zum tatsächlichen Ein- und Rückzugsweg des Angriffs. Tacitus und Jacobian wurden mehrere Biegungen tief an den beiden Wandketten befestigt. Später passierte das Kerntrio sie auf dem Weg nach Balentyne und erneut beim zweiten Gang. Aktuell kehren Styke, Vesper und Valeria mit der zweiten Beute durch den Tunnel zum Dalliance zurück.","links":["vesper","styke"],"backlinks":["story-so-far","zeit-tunnel"],"search":"der geheimgang alter zwergengang zwischen dalliance und balentyne das trio kehrt hindurch zuruck tacitus und jacobian sind an den wandketten gesichert geheimtunnel zwergentunnel kellertunnel aldencross entdeckung in der nacht 27 28 januar vesper fuhrte die suche styke half sie offneten die verborgene tur hinter den kellervorraten mit einem verdeckten stein der enge gewundene gang steigt uber annahernd eine meile zur festung an tatsachlich gesehene gegenseite die ferne zwergentur liess sich vom gang aus einen spalt offnen dahinter lag ein stiller vorratsraum mit haltbaren rationen und wasserfassern styke und vesper gingen nicht vollstandig hinein sie kehrten ohne beobachteten alarm zuruck schlossen beide turen und stellten die tarnung im keller wieder her was weiterhin fehlt verkehr im raum nutzer wachrhythmus und bedienung von der raumseite sind nicht sicher bekannt aus einem ruhigen beobachtungsmoment folgt keine dauerhaft unbewachte route gegenwartige nutzung zwei gewohnliche wandketten sind im gang verankert sie bilden den geplanten fesselpunkt fur tacitus und jacobian ersetzen aber weder bewachung noch eine geprufte magische sicherung der gang bleibt zugleich moglicher zugang und ruckzugsweg die nacht zum 9 februar der gang wurde zum tatsachlichen ein und ruckzugsweg des angriffs tacitus und jacobian wurden mehrere biegungen tief an den beiden wandketten befestigt spater passierte das kerntrio sie auf dem weg nach balentyne und erneut beim zweiten gang aktuell kehren styke vesper und valeria mit der zweiten beute durch den tunnel zum dalliance zuruck","initial":"D"},{"id":"balentyne","category":"orte","title":"Balentyne","summary":"Gefallene Grenzfestung und abgeschlossener erster Auftrag des Nessischen Knotens.","body":"<h2>Die Grenzfestung<\/h2><p>Balentyne bewachte die Watch Wall. In der Nacht zum 9. Februar drangen Styke, Vesper und Valeria durch den Geheimgang ein, töteten Donnagin und Havelyn, nahmen den Schatz und schalteten die Torhausabwehr aus. Fallgatter und Zugbrücke standen offen, als das rote Signal aufstieg.<\/p>\n<h2>Fall<\/h2><p>Fire-Axes Heer stürmte durch das offene Tor. Die organisierte Verteidigung brach am frühen Morgen zusammen. Balentyne ist gefallen und Thorns erster Auftrag erfüllt; das Kerntrio erreichte Stufe 6.<\/p>","sources":["balentyne","live","chronicle","timeline"],"status":"Gefallen am 9. Februar","tags":["Festung","Watch Wall","8./9. Februar"],"aliases":["Watchtower Balentyne","Festung"],"parent":"watch-wall","text":"Die Grenzfestung Balentyne bewachte die Watch Wall. In der Nacht zum 9. Februar drangen Styke, Vesper und Valeria durch den Geheimgang ein, töteten Donnagin und Havelyn, nahmen den Schatz und schalteten die Torhausabwehr aus. Fallgatter und Zugbrücke standen offen, als das rote Signal aufstieg. Fall Fire-Axes Heer stürmte durch das offene Tor. Die organisierte Verteidigung brach am frühen Morgen zusammen. Balentyne ist gefallen und Thorns erster Auftrag erfüllt; das Kerntrio erreichte Stufe 6.","links":[],"backlinks":["zeit-0114"],"search":"balentyne gefallene grenzfestung und abgeschlossener erster auftrag des nessischen knotens watchtower balentyne festung festung watch wall 8 9 februar die grenzfestung balentyne bewachte die watch wall in der nacht zum 9 februar drangen styke vesper und valeria durch den geheimgang ein toteten donnagin und havelyn nahmen den schatz und schalteten die torhausabwehr aus fallgatter und zugbrucke standen offen als das rote signal aufstieg fall fire axes heer sturmte durch das offene tor die organisierte verteidigung brach am fruhen morgen zusammen balentyne ist gefallen und thorns erster auftrag erfullt das kerntrio erreichte stufe 6","initial":"B"},{"id":"torhaus","category":"orte","title":"Balentynes Torhaus","summary":"Ballisten, Steinschütten und Heißsandabwehr zerstört; Fallgatter und Zugbrücke geöffnet und die Bedienwerke ruiniert.","body":"<h2>Informationsweg<\/h2>\n<p>Barnabus erzählte <a href=\"#/artikel/valeria\">Valeria<\/a> beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios.<\/p>\n<h2>Bekannte Einzelheiten<\/h2>\n<p>Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten.<\/p>\n<h2>Offene Grenzen<\/h2>\n<p>Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.<\/p>\n<h2>Sabotage am 9. Februar<\/h2><p>Das Kerntrio erreichte Mechanismenebene und Dach ohne allgemeinen Alarm. Styke und Valeria machten beide Ballisten und beide Steinschütten unbrauchbar; Vesper löschte die Heißsandfeuer und verwandelte den Vorrat in nassen Schlamm. Danach öffneten sie Fallgatter und Zugbrücke und zerstörten beide Bedienwerke. Eine einfache Rückstellung ist nicht möglich.<\/p>","sources":["live","core","chronicle"],"status":"Sabotiert / Tor offen","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Informationsweg Barnabus erzählte Valeria beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an Styke und Vesper weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios. Bekannte Einzelheiten Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten. Offene Grenzen Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses. Sabotage am 9. Februar Das Kerntrio erreichte Mechanismenebene und Dach ohne allgemeinen Alarm. Styke und Valeria machten beide Ballisten und beide Steinschütten unbrauchbar; Vesper löschte die Heißsandfeuer und verwandelte den Vorrat in nassen Schlamm. Danach öffneten sie Fallgatter und Zugbrücke und zerstörten beide Bedienwerke. Eine einfache Rückstellung ist nicht möglich.","links":["valeria","styke","vesper"],"backlinks":["zeit-valeria-rueckkehr"],"search":"balentynes torhaus ballisten steinschutten und heisssandabwehr zerstort fallgatter und zugbrucke geoffnet und die bedienwerke rui Mama Giuseppes Eintopf<\/h2>\n<p>Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen.<\/p>\n<h2>Krankheit<\/h2>\n<p>Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.<\/p>\n<h2>Ausführung am 8. Februar<\/h2><p>Vespers Arbeiterdeckung hielt ein letztes Mal. Sie gab alle sechs Päckchen in den großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen. Sie ging, bevor eine Wirkung sichtbar wurde. Das Spielerwissen enthält daher keine sichere Zahl Erkrankter und keinen Nachweis, dass das Gift die spätere Verteidigung schwächte.<\/p>","sources":["chronicle","live","core"],"status":"Eintopf vergiftet / Wirkung unbestätigt","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Beobachtete Abläufe Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. Vesper sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert. Wasser Gewöhnliches Wasser kommt aus dem Tyburn . Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen. Mama Giuseppes Eintopf Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen. Krankheit Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalte e verteidigung schwachte","initial":"K"},{"id":"scroll","category":"orte","title":"Illuminated Scroll","summary":"Jacobian Scaramores Arbeits- und Schriftladen; Ort des Tacitus-Gesprächs.","body":"<h2>Funktion in der Kampagne<\/h2>\n<p>Hier arbeitet <a href=\"#/artikel/jacobian\">Jacobian Scaramore<\/a> mit Schriftstücken, Büchern, Konten und magischen Fragen. <a href=\"#/artikel/styke\">Styke<\/a> suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht.<\/p>\n<h2>Die Briefkette<\/h2>\n<p>Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am <strong>31. Januar um 20 Uhr<\/strong>, nach Ladenschluss und mit Jacobian als anwesendem Gastgeber.<\/p>\n<h2>Letztes Ereignis<\/h2>\n<p>Das Gespräch über <a href=\"#/artikel/verse\">Verse<\/a> endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.<\/p>\n","sources":["core","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["The Illuminated Scroll","Buchladen","Scaramores Laden"],"parent":"aldencross","text":"Funktion in der Kampagne Hier arbeitet Jacobian Scaramore mit Schriftstücken, Büchern, Konten und magischen Fragen. Styke suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht. Die Briefkette Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am 31. Januar um 20 Uhr , nach Ladenschluss und mit Jacobian als anwesendem Gastgeber. Letztes Ereignis Das Gespräch über Verse endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.","links":["jacobian","styke","verse"],"backlinks":[],"search":"illuminated scroll jacobian scaramores arbeits und
