ler stand antipaladin 7 mit 46 46 hp smite 3 3 challenge 1 1 touch of corruption 9 9 und fiendish boon 1 1 der am abend des 25 februar gelieferte charisma stirnreif 2 ist angelegt cha 22 initiative 6 fort 12 ref 10 will 12 touch sg 19 styke versetzte die scheuernde achselschnalle und behandelte die stelle beim anschlie enden sitztest scheuerte sie nicht mehr valeria ging zuletzt zum goldenen reiher zuruck ihr spaterer rekrutierungsfortschritt ist nicht berichtet charakterbogen"},{"id":"psy-styke","category":"profile","title":"Psychologisches Profil: Styke","summary":"Wirksamkeit, vertragliche Moral und die Grenze zwischen Schutz und Anspruch.","body":"<h2>Handlungsfähigkeit</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> richtet seine Aufmerksamkeit auf Ausgänge, Reichweite, brauchbare Menschen und die Folgen eines Fehlers. Schmerz kann er einordnen; Ohnmacht nicht. Deshalb delegiert er an kompetente Gefährten, solange Zuständigkeit und Loyalität belastbar bleiben.</p>\n<h2>Wort und Folge</h2>\n<p>Versprechen, angenommene Bindung, konkrete Verantwortung, die eigenen Leute und die Mission bilden seine Moral. Am Freeman's Rock tötete er den kapitulierenden Varning, weil er zuvor keine Gefangenen festgelegt hatte. Dieselbe Konsequenz lässt ihn einen Verbündeten schützen oder eine zugesagte Last tragen.</p>\n<p>Unzuverlässigkeit trifft ihn stärker als offener Widerspruch. Eine harte Gegenmeinung kann er verarbeiten; ein gebrochenes Wort zerstört seine Berechnung der nächsten Folgen.</p>\n<h2>Angst, Wut und Schuld</h2>\n<p>Angst wird taktisch: Wie weit ist der Ausgang, wer ist verletzlich, welche Ressource bleibt? Tiefe Wut macht ihn leise und konkret. Er droht eher mit einer Handlung als mit einer Rede über seinen Status.</p>\n<p>Schuld verarbeitet er als Arbeit. Reparieren, bewachen, Grenzen einhalten und jemanden in die eigene Planung aufnehmen fallen ihm leichter als ein Bekenntnis. Darin liegen Fürsorge und Vermeidung dicht beieinander.</p>\n<h2>Schutz und Anspruch</h2>\n<p>Wenn Styke einen Menschen als eigene Verantwortung begreift, greift er in dessen Entscheidungen ein. Der Streit um <a href=\"#/artikel/timeon\">Timeon</a> zeigt den blinden Fleck: Er schützt Valeria vor einer gefährlichen Rückkehr und beansprucht dabei zugleich Deutung über einen Teil ihres früheren Lebens.</p>\n<h2>Vesper und Valeria</h2>\n<p>Mit Vesper bestehen gewachsene Abkürzungen aus Branderscar, Sex, Geheimnissen und gemeinsamem Überleben. Sie darf einen Informationszugang besitzen, den Styke nicht hat, ohne ihn jedes Mal erklären zu müssen.</p>\n<p>Bei Valeria ist jede Verlässlichkeit mit der Erinnerung an seine Täterschaft verschränkt. Am 31. Januar befolgte sie seinen Befehl und widersprach seinem Anspruch. Am nächsten Morgen führte und hielt sie ihn. Styke erlebte beides als Bindung.</p>\n<h2>Begehren</h2>\n<p>Styke ist körperlich direkt und wenig schamhaft. Begehren und Strategie laufen bei Kaitlyn gleichzeitig. Bei Vesper und Valeria erhalten eingehaltene Versprechen, vertauschte Rollen und die seltenen Momente, in denen er nicht entscheidet, besonderes Gewicht.</p>\n<p><a href=\"#/artikel/styke\">Zur Personenakte</a> / <a href=\"#/artikel/psy-vesper\">Vespers Profil</a> / <a href=\"#/artikel/psy-valeria\">Valerias Profil</a></p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-styke\">Intimität und persönliche Beziehungen</a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.</p>","sources":["styke","psy","relations","chronicle"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Handlungsfähigkeit Styke richtet seine Aufmerksamkeit auf Ausgänge, Reichweite, brauchbare Menschen und die Folgen eines Fehlers. Schmerz kann er einordnen; Ohnmacht nicht. Deshalb delegiert er an kompetente Gefährten, solange Zuständigkeit und Loyalität belastbar bleiben. Wort und Folge Versprechen, angenommene Bindung, konkrete Verantwortung, die eigenen Leute und die Mission bilden se ernehmen. Schöne Erklärungen überzeugen sie weniger als ein gehaltenes Wort.</p>\n<p>Das zeigte der Streit um <a href=\"#/artikel/timeon\">Timeon</a>. Sie befolgte Stykes Befehl, nicht zum Hof zurückzukehren, bestritt ihm aber das Recht, ihre frühere Verantwortung umzudeuten. Der Auftrag galt; ihre Bindung an Timeon ebenfalls.</p>\n<h2>Stimme und Reaktion</h2>\n<p>Valeria spricht direkt und in vollständigen Sätzen. Wut macht sie förmlicher. Scham macht sie knapp. Fürsorge erscheint als Frühstück, Wärme, ein Verband, gepflegte Ausrüstung oder eine Last, die sie übernimmt, bevor jemand darum bittet.</p>\n<p>Angst übersetzt sie in Menschen, Positionen, Ausgänge und Material. Erschöpfung nimmt ihr diese Gewohnheit nicht; am aktuellen Stand schläft sie nach langem Ritt und einer noch längeren Nacht schlicht weiter.</p>\n<h2>Styke</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> war Täter und wurde später zu einer berechenbaren Größe. Er hielt einzelne Versprechen, schützte Timeons Aufenthaltsort und vertraute ihr am Morgen des 1. Februar die Führung über seinen eigenen Körper an. Valeria antwortete darauf nicht mit Vergebung, sondern indem sie ihn nachher festhielt.</p>\n<h2>Vesper</h2>\n<p>Bei <a href=\"#/artikel/vesper\">Vesper</a> liegen Schuld und Vertrautheit noch enger beieinander. Respekt, Konkurrenz, Begehren und Misstrauen tauchen oft im selben Gespräch auf. In der Nacht zum 1. Februar wurden beide erstmals direkt miteinander intim; anschließend reinigte Vesper sie und blieb bei ihr.</p>\n<h2>Sexualität und Härte</h2>\n<p>Valeria verlangt Intensität nicht als feste Rolle, sondern in konkreten Nächten. Am 27. Januar beteiligte sie sich an Vespers Experiment mit Augenbinde und Fesseln. In der Nacht zum 1. Februar forderte sie beim Analverkehr mit Styke mehr Härte. Am folgenden Morgen übernahm sie selbst Kontrolle, Demütigung und Schmerz.</p>\n<p>Ihre koitale Inkontinenz war lange mit Scham besetzt. Seit Styke offen aussprach, dass ihn gerade diese Reaktion erregt, v r Stand Verse ist bei Vesper auf dem Rückweg durch den Tunnel. Er ist kein Mitglied des Kollektivs. Mechanik 14 HP, INT 8, Natural Armor Adjustment +3. Bei erfüllten Familiar-Bedingungen verleiht er Vesper +4 Initiative. Vespers Bogen .","links":["bogen-vesper"],"backlinks":["abstammungen","branderscar","kollektiv","matilda","psy-vesper","scroll","zeit-0201","zeit-tacitus","zeit-vorgeschichte"],"search":"verse erwachtes reliquiar und vespers eigenstandiger gefahrte dinnerforschung trennte alte erinnerungsschicht und heutiges denken ohne seinen ursprung zu losen begleiter magie wesen und bindung verse ist ein einzigartiges erwachtes reliquiar mit mannlicher stimme im deutschen gilt er ihm sein er ist mechanisch ein protector familiar in der fiktion aber kein insekt vesper lie ihn bei ihrer ursprunglichen flucht nicht zuruck seine bindung an sie ist personlich und dauerhaft erinnern ist nicht allwissen er erinnert worte gebete hande und orte aber keine vollstandige eigene lebensgeschichte beim dinner am 8 februar half tacitus einen alteren kirchlichen erinnerungs und wissenstrager von verses gegenwartiger eigenstandiger denk und personlichkeitsschicht zu unterscheiden eine verbindung zu vespers wissensgebundener magie ist erkennbar aber ursache und herkunft sind nicht geklart das neue inventar verse und zorn begannen eine schriftliche trennung zwischen altem nicht selbst erworbenem wissen unsicheren erinnerungsfragmenten personlichen erinnerungen seit vespers hand und heutigen schlussfolgerungen das ist eine arbeitsmethode keine fertige biographie aktueller stand verse ist bei vesper auf dem ruckweg durch den tunnel er ist kein mitglied des kollektivs mechanik 14 hp int 8 natural armor adjustment 3 bei erfullten familiar bedingungen verleiht er vesper 4 initiative vespers bogen","initial":"V"},{"id":"zorn","category":"personen","title":"Zorn","summary":"Stykes Psicrystal und Personality Fragment. Mechanischer Helfer, nicht automatisch Teil der Telepathie.","body":"<h2>Stykes kleiner zweiter Blick</h2>\n<p>Zorn ist Stykes Psicrystal aus <em>Personality Fragment</em>. Er ist kein zweites Verse, kein Mitglied des Kollektivs und kein allwissender Chronist. Seine Verbindung zu Styke ist enger und schmaler zugleich: ein eigener kleiner Geist, gebunden an den Mann, aus dem er hervorging.</p>\n<p>Am 1. Februar lag der kopierte Balentyne-Plan bei Styke, und Zorn half, Linien, bekannte Räume und Hypothesen auseinanderzuhalten. Später hörte er die Gespräche im Schankraum mit und konnte die unsichere Brauchbarkeit der Gerüchte mittragen. Er macht daraus keine Wahrheit.</p>\n<h2>Mechanische Anker</h2>\n<p>17 HP, Diminutive Construct, INT 9. Tactical Assistance ist ein INT-Check mit -1 gegen DC 10. Defensive Aid nutzt seine eigene Standard Action und gibt bei Erfolg Styke +2 AC gegen den gewählten Gegner. Informant unterstützt passende Knowledge-(All)-Checks pauschal mit +2.</p>\n<p>Details stehen in <a href=\"#/artikel/bogen-styke\">Stykes Bogen</a> und der <a href=\"#/artikel/aid\">Aid-/Recovery-Referenz</a>.</p><h2>Der 8. und 9. Februar</h2><p>Zorn half beim Dinner, Verses Erinnerungen nach Herkunft und Sicherheit zu ordnen. Das gemeinsam begonnene Inventar trennt altes Wissen, unsichere Bilder, persönliche Erinnerungen und spätere Schlüsse. Im Balentyne-Einsatz blieb Zorn bei Styke; aktuell sitzt er wieder in der gepolsterten Tasche auf dem Rückweg durch den Tunnel.</p>","sources":["ssheet","srules","live"],"status":"Bestätigt","tags":["Begleiter","Psionik"],"aliases":[],"group":"inner","text":"Stykes kleiner zweiter Blick Zorn ist Stykes Psicrystal aus Personality Fragment . Er ist kein zweites Verse, kein Mitglied des Kollektivs und kein allwissender Chronist. Seine Verbindung zu Styke ist enger und schmaler zugleich: ein eigener kleiner Geist, gebunden an den Mann, aus dem er hervorging. Am 1. Februar lag der kopierte Balentyne-Plan bei Styke, und Zorn half, Linien, bekannte Räume und Hypothesen auseinanderzuhalten. Später hörte er die ody":"<h2>Rolle</h2><p>Tamsin führt Zugänge, Wachen, Schlafordnung und Marschsicherheit. Ihr erster Farholde-Bericht benannte Rubal Thraam als Zentrum des Drownington-Schwarzmarkts und den auffällig spielenden Hafenbeamten Mallory Ritkin.</p><h2>Ausrüstung und Auftrag</h2><p>Donnagins +1-Brustplatte, Varnings +1-Schwerer Schild und der +1-Umhang bleiben ihre Ausrüstung. Nach der Rückkehr des Kerntrios wurde sie für den kleinen ersten Rekrutierungsgang mit Vesper, Valeria und Kaitlyn eingeplant. Schreiner, Schmied und Küche stehen zuerst; das Ergebnis ist dem Spieler noch nicht berichtet.</p><h2>Notfallgrenze</h2><p>Die einwöchige Rückzugsermächtigung für einen ausgebliebenen Hornkontakt ist durch die tatsächliche Rückkehr am 25. Februar erledigt; sie läuft nicht weiter als neue Frist.</p>","sources":["tamsin-current","live","chronicle","treasury"],"status":"Haushaltssicherheit · Rekrutierung beauftragt","tags":["Sicherheit","Gebundene","Farholde","Bericht ausstehend"],"aliases":["Blackerly","Tomas Blackerly"],"group":"inner","text":"Rolle Tamsin führt Zugänge, Wachen, Schlafordnung und Marschsicherheit. Ihr erster Farholde-Bericht benannte Rubal Thraam als Zentrum des Drownington-Schwarzmarkts und den auffällig spielenden Hafenbeamten Mallory Ritkin. Ausrüstung und Auftrag Donnagins +1-Brustplatte, Varnings +1-Schwerer Schild und der +1-Umhang bleiben ihre Ausrüstung. Nach der Rückkehr des Kerntrios wurde sie für den kleinen ersten Rekrutierungsgang mit Vesper, Valeria und Kaitlyn eingeplant. Schreiner, Schmied und Küche stehen zuerst; das Ergebnis ist dem Spieler noch nicht berichtet. Notfallgrenze Die einwöchige Rückzugsermächtigung für einen ausgebliebenen Hornkontakt ist durch die tatsächliche Rückkehr am 25. Februar erledigt; sie läuft nicht weiter als neue Frist.","search":"tamsin blackerly sicherheitsverantwortliche des knotenhaushalts arbeitet in farholde unter eigener tarnung und mit regularem sold sicherheit gebundene farholde bericht ausstehend blackerly tomas blackerly rolle tamsin fuhrt zugange wachen schlafordnung und marschsicherheit ihr erster farholde bericht benannte rubal thraam als zentrum des drownington schwarzmarkts und den auffallig spielenden hafenbeamten mallory ritkin ausrustung und auftrag donnagins 1 brustplatte varnings 1 schwerer schild und der 1 umhang bleiben ihre ausrustung nach der ruckkehr des kerntrios wurde sie fur den kleinen ersten rekrutierungsgang mit vesper valeria und kaitlyn eingeplant schreiner schmied und kuche stehen zuerst das ergebnis ist dem spieler noch nicht berichtet notfallgrenze die einwochige ruckzugsermachtigung fur einen ausgebliebenen hornkontakt ist durch die tatsachliche ruckkehr am 25 februar erledigt sie lauft nicht weiter als neue frist","links":[],"backlinks":["anatomie-tamsin","branderscar","zeit-branderscar"],"initial":"T"},{"id":"timeon","category":"personen","title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"<h2>Balinas Knappe</h2>\n<p>Timeon war der junge Knappe von <a href=\"#/artikel/valeria\">Dame Balina</a> und blieb Mitra zugewandt. Der <a href=\"#/artikel/privatpakt\">Privatpakt</a> trägt weder seinen Namen noch seine Zusage. Gegenüber <a href=\"#/artikel/styke\">Styke</a> und dem Knoten überwiegt Furcht.</p>\n<h2>Erinnerung an Balentyne</h2>\n<p>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe <a href=\"#/artikel/timeon-karte\">Karte</a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.</p>\n<h2>Auf dem Familienhof</h2>\n<p>Tamsin brachte ihn zum vorgesehenen <a href=\"#/artikel/timeon-hof\">Familienanwesen</a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.</p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["privatpakt","styke","timeon-hof","timeon-karte","valeria"],"backlinks":["kollektiv","mitra","privatpakt","psy-styke","psy-valeria","thorn-manor","timeon-hof","timeon-karte","zeit-0123","zeit-ausbildung","zeit-valeria-rueckkehr"],"search":"timeon valerias fruherer knappe mitranisch verangstigt auf einem familienhof untergebracht und trager einer groben erinnerungskarte knappe sicher untergebracht balinas knappe timeon war der junge knappe von dame balina und blieb mitra zugewandt der privatpakt tragt weder seinen namen noch seine zusage gegenuber styke und dem knoten uberwiegt furcht erinnerung an balentyne wahrend der ausbildung berichtete timeon woran er sich aus balentyne erinnerte und zeichnete eine grobe karte sie bildet seinen damaligen wissensstand ab und lasst raume wege und spatere anderungen offen auf dem familienhof tamsin brachte ihn zum vorgesehenen familienanwesen valeria ritt am 31 januar hin und sah selbst dass er dort sicher war sie versprach ihm eine ruckkehr erhielt spater jedoch von styke den befehl den hof nicht erneut aufzusuchen","initial":"T"},{"id":"thorn","category":"personen","title":"Kardinal Adrastus Thorn","summary":"Auftraggeber des Dornpakts; erteilte am 20. Februar den Auftrag am Horn von Abaddon.","body":"<h2>Der zweite Auftrag</h2><p>Thorn befahl dem Knoten, im Caer Bryr das Horn von Abaddon zu finden, Markadians silbernes Mitra-Siegel zu brechen, Vetra-Kali Eats-the-Eyes zu rufen und zu binden und die Tears of Achlys zurückzubringen.</p><h2>Was Thorn geliefert hat</h2><p>Er benannte den Auftrag, die Rolle des Vierten und Siebten Knotens und Baron Vandermir als ersten Kontakt in Farholde. Styke erhielt ein neues tönernes Kommunikationssiegel.</p><h2>Grenzen</h2><p>Thorn erklärte ausdrücklich nicht, wie Siegel und Bindung funktionieren. Ein Endtermin wurde dem Knoten nicht genannt. Seine verborgene Vergangenheit und Absichten bleiben außerhalb des Spielerwissens.</p>","sources":["live","chronicle","transition","core"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Auftraggeber","Dornpakt","Horn von Abaddon","Buch Zwei"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Der zweite Auftrag Thorn befahl dem Knoten, im Caer Bryr das Horn von Abaddon zu finden, Markadians silbernes Mitra-Siegel zu brechen, Vetra-Kali Eats-the-Eyes zu rufen und zu binden und die Tears of Achlys zurückzubringen. Was Thorn geliefert hat Er benannte den Auftrag, die Rolle des Vierten und Siebten Knotens und Baron Vandermir als ersten Kontakt in Farholde. Styke erhielt ein neues tönernes Kommunikationssiegel. Grenzen Thorn erklärte ausdrücklich nicht, wie Siegel und Bindung funktionieren. Ein Endtermin wurde dem Knoten nicht genannt. Seine verborgene Vergangenheit und Absichten bleiben außerhalb des Spielerwissens.","links":[],"backlinks":["zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber des dornpakts erteilte am 20 februar den auftrag am horn von abaddon auftraggeber dornpakt horn von abaddon buch zwei adrastus thorn cardinal thorn der zweite auftrag thorn befahl dem knoten im caer bryr das horn von abaddon zu finden markadians silbernes mitra siegel zu brechen vetra kali eats the eyes zu rufen und zu binden und die tears of achlys zuruckzubringen was thorn geliefert hat er benannte den auftrag die rolle des vierten und siebten knotens und baron vandermir als ersten kontakt in farholde styke erhielt ein neues tonernes kommunikationssiegel grenzen thorn erklarte ausdrucklich nicht wie siegel und bindung funktionieren ein endtermin wurde dem knoten nicht genannt seine verborgene vergangenheit und absichten bleiben auerhalb des spielerwissens","initial":"K"},{"id":"tiadora","category":"personen","title":"Tiadora","summary":"Thorns infernale Botin; führte den Knoten zu Vandermir und kündigte die Ankunft des Siebten Knotens an.","body":"<h2>Auf der Flussfahrt</h2><p>Tiadora brachte Belohnung und Abreisebefehl, beanspruchte die einzige Kabine der Folly und setzte den propagandistischen Rahmen der falschen Ritteroperationen.</p><h2>Farholde</h2><p>Am 22. Februar führte sie Styke, Vesper, Valeria und Kaitlyn nach Vanderhall. Beim Dinner kündigte sie Elise Zadaria und den Siebten Knoten für den folgenden Tag an. Seitdem hält sie sich zurück; sie lieferte weder die Lösung für Siegel und Bindung noch eine Erklärung des Horninneren.</p>","sources":["core","live","chronicle","transition"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Thorn","Botin","Farholde","Vandermir"],"aliases":[],"group":"history","text":"Auf der Flussfahrt Tiadora brachte Belohnung und Abreisebefehl, beanspruchte die einzige Kabine der Folly und setzte den propagandistischen Rahmen der falschen Ritteroperationen. Farholde Am 22. Februar führte sie Styke, Vesper, Valeria und Kaitlyn nach Vanderhall. Beim Dinner kündigte sie Elise Zadaria und den Siebten Knoten für den folgenden Tag an. Seitdem hält sie sich zurück; sie lieferte weder die Lösung für Siegel und Bindung noch eine Erklärung des Horninneren.","links":[],"backlinks":["zeit-branderscar"],"search":"tiadora thorns infernale botin fuhrte den knoten zu vandermir und kundigte die ankunft des siebten knotens an thorn botin farholde vandermir auf der flussfahrt tiadora brachte belohnung und abreisebefehl beanspruchte die einzige kabine der folly und setzte den propagandistischen rahmen der falschen ritteroperationen farholde am 22 februar fuhrte sie styke vesper valeria und kaitlyn nach vanderhall beim dinner kundigte sie elise zadaria und den siebten knoten fur den folgenden tag an seitdem halt sie sich zuruck sie lieferte weder die losung fur siegel und bindung noch eine erklarung des horninneren","initial":"T"},{"id":"sakkarot","category":"personen","title":"Sakkarot Fire-Axe","summary":"Fire-Axes Heer nahm das rote Signal auf, drang durch das offene Tor ein und war beim letzten direkten Blick klar am Gewinnen.","body":"<h2>Begegnung und Abmachung</h2>\n<p>Am <strong>14. Januar 4712 AR</strong> erhielt Sakkarot Thorns Waffenlieferung. <a href=\"#/artikel/styke\">Styke</a> versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden.</p>\n<h2>Geteiltes Wissen</h2>\n<p>Er enthüllte gegenüber Styke und <a href=\"#/artikel/vesper\">Vesper</a>, dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht.</p>\n<h2>Zeitdruck</h2>\n<p>Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist <strong>kein mit Sakkarot vereinbarter Termin</strong>. Es wurde ihm dazu noch keine Nachricht geschickt.</p>\n<h2>Die Nacht des Signals</h2><p>Styke, Vesper und Valeria schossen das vereinbarte rote Signal gemeinsam nahe dem Dalliance ab. Etwa eine Stunde später lief Fire-Axes erste große Welle durch das bereits offene Tor. Beim späteren Blick vom Festungsdach war sein Heer tief im Inneren und sichtbar am Gewinnen.</p>","sources":["core","chronicle","live","factions"],"status":"Angriff auf Balentyne läuft","tags":["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"gro ktivs und Verbindung zwischen dem Neunten und Siebten Knoten.","body":"<h2>Verantwortung in Farholde</h2><p>Styke nahm Kaitlyn am 22. Februar in sein Kollektiv auf und setzte sie beim Vandermir-Dinner als Kommunikationsvertreterin des Knotens ein. Vandermir akzeptierte ihre Stimme als Kontaktweg.</p><h2>White Ravens</h2><p>Beim Treffen in der Grauen Möwe wurde Kaitlyn dem Siebten Knoten als Verbindung vorgestellt. Sie beobachtete alle vier Ravens. Traks wiederholte Blicke behandelt sie nur als mögliche Öffnung, nicht als Beweis für eine Absicht.</p><h2>Aktueller Auftrag</h2><p>Am 25. Februar berichtete Kaitlyn: keine Vandermir-Warnung, keine Nachfrage nach dem Knoten und kein direkter Trak-Vorstoß oder brauchbare Offenlegung. Sie beobachtet weiter. Nach Übergabe von Hornort und Lagebild an Elise will sie mitziehen, Rekrutierung und innere Sicherheit unterstützen und für Vandermir-/Raven-Kontakte regelmäßig nach Farholde zurückkehren. Die Übergabe ist noch nicht als geschehen bekannt.</p><h2>26. Februar</h2><p>Kaitlyn ist spätvormittags bereits wach und halb angekleidet im unbenannten Schankenzimmer bei Styke. Ihre geplante Nachfrage zu guten Stadtunterkünften und Ausbildung für Angehörige erwachsener Rekruten hat noch kein berichtetes Ergebnis. Ihre privaten Aufzeichnungen umfassen inzwischen sechs Seiten; sie will Styke später daraus vorlesen.</p>","sources":["kaitlyn","live","chronicle","relations"],"status":"Bei Styke · Hornumzug nach Lageübergabe vereinbart","tags":["Gebundene","Vertraute","Farholde","Silken Veil"],"aliases":[],"group":"town","text":"Verantwortung in Farholde Styke nahm Kaitlyn am 22. Februar in sein Kollektiv auf und setzte sie beim Vandermir-Dinner als Kommunikationsvertreterin des Knotens ein. Vandermir akzeptierte ihre Stimme als Kontaktweg. White Ravens Beim Treffen in der Grauen Möwe wurde Kaitlyn dem Siebten Knoten als Verbindung vorgestellt. Sie beobachtete alle vier Ravens. Traks wiederholte Blicke behandelt sie nur als mögliche Öffnung uten stadtunterkunften und ausbildung fur angehorige erwachsener rekruten hat noch kein berichtetes ergebnis ihre privaten aufzeichnungen umfassen inzwischen sechs seiten sie will styke spater daraus vorlesen","links":[],"backlinks":["anatomie-kaitlyn","intim-kaitlyn","intim-kaitlyn-korruption"],"initial":"K"},{"id":"zack","category":"personen","title":"Captain Zacharias \"Zack\" Eddarly","summary":"Captain Zacharias Eddarly, Kaitlyns langjähriger Freund und Geliebter; am 7. Februar von Franz Mott im Duell getötet.","body":"<h2>Captain und Geliebter</h2><p>Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung.</p><h2>Tod am 7. Februar</h2><p>Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.</p>","sources":["core","live","chronicle"],"status":"Tot seit 7. Februar","tags":["Balentyne","Captain","Kaitlyn","Tot"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Captain und Geliebter Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung. Tod am 7. Februar Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.","search":"captain zacharias zack eddarly captain zacharias eddarly kaitlyns langjahriger freund und geliebter am 7 februar von franz mott im duell getotet balentyne captain kaitlyn tot zack zach zacharias eddarly zach eddarly captain und geliebter zacharias zack eddarly war offizier in balentyne und kaitlyns langjahriger freund und geliebter vesper identifizierte ihn am 4 februar anhand einer beschreibung tod am 7 februar zack nahm franz motts duellforderung an er traf franz mit dem langschwert und verwundete ihn leicht wurde dann von franz hellebarde zu boden gebracht und durch einen schlag in hals und schulter getotet er starb binnen sekunden und sprach nach dem todlichen treffer keine letzten worte","links":[],"backlinks":["zeit-0201"],"initial":"C"},{"id":"donnagin","category":"personen","title":"Father Althus Donnagin","summary":"Balentynes ranghoher Mitra-Kleriker; im Schrein von Styke und Valeria getötet.","body":"<h2>Bekannte Rolle</h2><p>Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur.</p><h2>Tod im Schrein</h2><p>Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt.</p><h2>Valerias Abschied</h2><p>Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.</p>","sources":["core","live","chronicle"],"status":"Tot seit 9. Februar","tags":["Mitra","Kleriker","Balentyne"],"aliases":["Father Donnagin","Althus Donnagin","Donnagin"],"group":"garrison","text":"Bekannte Rolle Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur. Tod im Schrein Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt. Valerias Abschied Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.","search":"father althus donnagin balentynes ranghoher mitra kleriker im schrein von styke und valeria getotet mitra kleriker balentyne father donnagin althus donnagin donnagin bekannte rolle father althus donnagin war balentynes ranghoher mitraner berichte uber krankenbesuche eine schwierige geburt und die versorgung ernsthaft erkrankter soldaten zeichneten ihn als pflichtbewussten priester nicht als karikatur tod im schrein styke vesper und valeria fanden ihn nach mitternacht im klerikerbereich donnagin starb im kampf gegen styke und valeria ein junger akolyth wurde lebend uberwaltigt gebunden und geknebelt valerias abschied valeria half ihn zu toten ohne ihr fruheres urteil uber ihn umzuschreiben danach schloss sie donnagin die augen und sagte sinngema der personliche teil musse spater kommen seine 1 brustplatte schlussel und sein silbernes mitra symbol wurden geborgen","links":[],"backlinks":[],"initial":"F"},{"id":"havelyn","category":"personen","title":"Lord Thomas Havelyn","summary":"Ehemaliger Kommandant Balentynes; in seinen oberen Räumen von Styke getötet.","body":"<h2>Kommandant Balentynes</h2><p>Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod.</p><h2>Tod in den oberen Räumen</h2><p>Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn.</p><h2>Geborgene Hinterlassenschaft</h2><p>Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die <a href=\"#/artikel/havelyn-bibel\">Familienbibel</a> geborgen.</p>","sources":["core","balentyne","live"],"status":"Tot seit 9. Februar","tags":["Kommandant","Balentyne"],"aliases":["Thomas Havelyn","Havelyn"],"group":"garrison","text":"Kommandant Balentynes Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod. Tod in den oberen Räumen Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn. Geborgene Hinterlassenschaft Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die Familienbibel geborgen.","links":["havelyn-bibel"],"backlinks":[],"search":"lord thomas havelyn ehemaliger kommandant balentynes in seinen oberen raumen von styke getotet kommandant balentyne thomas havelyn havelyn kommandant balentynes lord thomas havelyn kommandierte balentyne und herrschte uber aldencross thorns auftrag verlangte ausdrucklich seinen tod tod in den oberen raumen das kerntrio erreichte havelyn ohne allgemeinen alarm er hatte zeit fur kurze magische vorbereitung aber nicht fur seine vollplatte sein schwerster schlag gegen vesper wurde grotenteils von styke ubernommen danach totete styke ihn geborgene hinterlassenschaft vesper tragt havelyns headband of alluring charisma 2 seine gespeicherte vollplatte verwandelte sich unter valerias hand in eine schwarze 1 dastard vollplatte ballinger ist nach dem ende der gottlichen bindung ein meisterarbeits langschwert auerdem wurden meisterarbeits dolch stahlschild hauptschlussel und die familienbibel geborgen","initial":"L"},{"id":"tacitus","category":"personen","title":"Magisterin Tacitus von Morimun","summary":"Gebundene Magisterin: lieferte Stykes +2-Umhang, trat dem Collective bei und übernahm zwei ergebnisoffene Forschungsfragen.","body":"<h2>Fertiger Umhang</h2><p>Tacitus und Knittel schlossen Stykes Cloak of Resistance +1 auf +2 am 26. Februar ab; Tacitus übergab ihn persönlich. In der bezahlten Reihe bleiben zwei Umhangaufwertungen und drei Amulette. Kein zweiter Gegenstand begann an diesem Tag.</p><h2>Eigene Haltung</h2><p>Tacitus sagte Styke offen, dass sie ihn nicht besonders mag und Balentyne sowie ihre Entführung nicht auslöscht. Zugleich respektiert sie ihn, verlässt sich in manchen Dingen auf ihn und will schwierige Arbeit, gute Mittel, eigenes Urteil und Verantwortung durch Kompetenz.</p><h2>Collective</h2><p>Sie trat freiwillig Stykes Collective bei, nachdem dessen Grenze geklärt war: keine passiven Gedanken, Erinnerungen oder Gefühle. Damit sind Vesper, Valeria, Kaitlyn und Tacitus die vier freiwilligen Mitglieder.</p><h2>Geheime Gegenfrage</h2><p>Styke legte Tacitus seine Absicht offen, Thorn keine unterschiedslose Tears-Seuche zu überlassen. Tacitus nahm die ergebnisoffene Forschungsfrage an. Vesper wurde später eingeweiht; Valeria erhielt den genauen Auftrag noch nicht, Knittel gehört nicht zum geheimen Kreis.</p><h2>Psionik</h2><p>Tacitus beobachtete Force Screen ohne Wort, Geste oder Material und trennte Stykes Selbst-Umschreibungsfrage von jeder späteren Übertragung auf andere. Zorn soll flüchtige Eindrücke nach bewusster Übermittlung dokumentieren. Es gibt noch keinen Durchbruch.</p><h2>Weitere Arbeit</h2><p>Artephius, Compact-Auslegung, Fernkommunikation und die Werkstattverlegung bleiben offene Untersuchungen.</p>","sources":["tacitus-current","live","chronicle","knittel","treasury"],"status":"Aktiv · Forschung begonnen · kein Ergebnis","tags":["Magisterin","Gebundene","Forschung","Handwerk","Farholde"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Fertiger Umhang Tacitus und Knittel schlossen Stykes Cloak of Resistance +1 auf +2 am 26. Februar ab; Tacitus übergab ihn persönlich. In der bezahlten Reihe bleiben zwei Umhangaufwertungen und drei Amulette. Kein zweiter Gegenstand begann an diesem Tag. Eigene Haltung Tacitus sagte Styke offen, dass sie ihn nicht besonders mag und Balentyne sowie ihre Entführung nicht auslöscht. Zugleich respektiert sie ihn, verlässt sich in manchen Dingen auf ihn und will schwierige Arbeit, gute Mittel, eigenes Urteil und Verantwortung durch Kompetenz. Collective Sie trat freiwillig Stykes Collective bei, nachdem dessen Grenze geklärt war: keine passiven Gedanken, Erinnerungen oder Gefühle. Damit sind Vesper, Valeria, Kaitlyn und Tacitus die vier freiwilligen Mitglieder. Geheime Gegenfrage Styke legte Tacitus seine Absicht offen, Thorn keine unterschiedslose Tears-Seuche zu überlassen. Tacitus nahm die ergebnisoffene Forschungsfrage an. Vesper wurde später eingeweiht; Valeria erhielt den genauen Auftrag noch nicht, Knittel gehört nicht zum geheimen Kreis. Psionik Tacitus beobachtete Force Screen ohne Wort, Geste oder Material und trennte Stykes Selbst-Umschreibungsfrage von jeder späteren Übertragung auf andere. Zorn soll flüchtige Eindrücke nach bewusster Übermittlung dokumentieren. Es gibt noch keinen Durchbruch. Weitere Arbeit Artephius, Compact-Auslegung, Fernkommunikation und die Werkstattverlegung bleiben offene Untersuchungen.","search":"magisterin tacitus von morimun gebundene magisterin lieferte stykes 2 umhang trat dem collective bei und ubernahm zwei ergebnisoffene forschungsfragen magisterin gebundene forschung handwerk farholde tacitus of morimun tacitus von morimun tacitus fertiger umhang tacitus und knittel schlossen stykes cloak of resistance 1 auf 2 am 26 februar ab tacitus ubergab ihn personlich in der bezahlten reihe bleiben zwei umhangaufwertungen und drei amulette kein zweiter gegenstand begann an diesem tag eigene haltung tacitus sagte styke offen dass sie ihn nicht besonders mag und balentyne sowie ihre entfuhrung nicht ausloscht zugleich respektiert sie ihn verlasst sich in manchen dingen auf ihn und will schwierige arbeit gute mittel eigenes urteil und verantwortung durch kompetenz collective sie trat freiwillig stykes collective bei nachdem dessen grenze geklart war keine passiven gedanken erinnerungen oder gefuhle damit sind vesper valeria kaitlyn und tacitus die vier freiwilligen mitglieder geheime gegenfrage styke legte tacitus seine absicht offen thorn keine unterschiedslose tears seuche zu uberlassen tacitus nahm die ergebnisoffene forschungsfrage an vesper wurde spater eingeweiht valeria erhielt den genauen auftrag noch nicht knittel gehort nicht zum geheimen kreis psionik tacitus beobachtete force screen ohne wort geste oder material und trennte stykes selbst umschreibungsfrage von jeder spateren ubertragung auf andere zorn soll fluchtige eindrucke nach bewusster ubermittlung dokumentieren es gibt noch keinen durchbruch weitere arbeit artephius compact auslegung fernkommunikation und die werkstattverlegung bleiben offene untersuchungen","links":[],"backlinks":["anatomie-tacitus","zeit-tacitus"],"initial":"M"},{"id":"jacobian","category":"personen","title":"Jacobian Scaramore","summary":"Tacitus’ enger Freund; am 9. Februar mit Proviant und einem Pferd freigelassen.","body":"<h2>Buchhändler und Freund</h2><p>Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts.</p>\n<h2>Freilassung</h2><p>Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance.</p>\n<p>Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.</p>","sources":["core","live","chronicle","tacitus-current"],"status":"Am 9. Februar freigelassen; weiterer Weg unbekannt","tags":["Schreiber","Kontakt","Aldencross"],"aliases":["Scaramore","Jacobian"],"group":"town","text":"Buchhändler und Freund Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts. Freilassung Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance. Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.","links":[],"backlinks":["scroll","zeit-tacitus"],"search":"jacobian scaramore tacitus enger freund am 9 februar mit proviant und einem pferd freigelassen schreiber kontakt aldencross scaramore jacobian buchhandler und freund jacobian scaramore betrieb den illuminated scroll und war tacitus enger freund er vermittelte die gesprache uber verse und begleitete sie am 8 februar ins dalliance vom knoten compact und asmodeus wusste er vor seiner gefangennahme nichts freilassung am fruhen 9 februar lie styke ihn der alten zeiten willen frei jacobian erhielt gewohnliche sichere kleidung essen wasser und eines der sieben erbeuteten pferde gefahrliche ausrustung bekam er nicht zuruck tacitus verabschiedete sich von ihm lehnte seine bitte mitzukommen ab und blieb fur ihre eigene entscheidung im dalliance jacobian ritt lebend ab sein weiterer weg ist dem knoten nicht bekannt","initial":"J"},{"id":"marlowe","category":"personen","title":"William Marcus Marlowe","summary":"Leiter der Ye Merrie Men. Eine Aufführung in Balentyne ist als kommende Gelegenheit bekannt.","body":"<h2>Bekannte Verbindung</h2>\n<p>Die reisende Schauspieltruppe <a href=\"#/artikel/merrie-men\">Ye Merrie Men</a> soll <em>The Fall of Amberlyn</em> für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar.</p>\n<h2>Stand der Planung</h2>\n<p>Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.</p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offener Hinweis"],"aliases":["Marlowe"],"group":"town","text":"Bekannte Verbindung Die reisende Schauspieltruppe Ye Merrie Men soll The Fall of Amberlyn für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar. Stand der Planung Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.","links":["merrie-men"],"backlinks":[],"search":"william marcus marlowe leiter der ye merrie men eine auffuhrung in balentyne ist als kommende gelegenheit bekannt theater offener hinweis marlowe bekannte verbindung die reisende schauspieltruppe ye merrie men soll the fall of amberlyn fur soldaten in balentyne auffuhren bellam erzahlte davon am 27 januar stand der planung dass eine solche auffuhrung kommen soll ist ein etablierter hinweis exaktes datum uhrzeit besetzung zugangskontrolle und bewegungen der truppe sind noch nicht geklart das wiki macht daraus keine bereits verfugbare tarnidentitat oder sichere einlassmoglichkeit","initial":"W"},{"id":"giuseppe","category":"personen","title":"Mama Louisa Giuseppe","summary":"Balentynes Köchin; Vesper gab alle sechs Rattengiftpäckchen in ihren großen Gemeinschaftseintopf und sah die Ausgabe beginnen.","body":"<h2>Beobachtete Routine</h2><p>Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet.</p>\n<h2>Der 1. Februar</h2><p>Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet.</p>\n<h2>Der 8. Februar</h2><p>Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan.</p>\n<p><a href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan</a> / <a href=\"#/artikel/kueche\">Bekanntes Küchenwissen</a></p><h2>Der 8. Februar</h2><p>Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher.</p>","sources":["chronicle","live","timeline"],"status":"Eintopf am 8. Februar vergiftet","tags":["Küche","Routine","8. Februar"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Der 1. Februar Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet. Der 8. Februar Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan. Eintopf und Sabotageplan / Bekanntes Küchenwissen Der 8. Februar Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher.","links":["eintopf-plan","kueche"],"backlinks":[],"search":"mama louisa giuseppe balentynes kochin vesper gab alle sechs rattengiftpackchen in ihren groen gemeinschaftseintopf und sah die ausgabe beginnen kuche routine 8 februar mama giuseppe louisa giuseppe giuseppe beobachtete routine vesper erfuhr am 30 januar dass mama giuseppe wochentlich einen groen rindereintopf aus einem gemeinsamen topf fur ungefahr siebzig dienstfreie soldaten zubereitet der 1 februar vesper half bei der ausgabe die kuche war hektisch der gemeinschaftskessel wurde in ihrer gegenwart nicht besonders gepruft der eintopf blieb an diesem tag unangetastet der 8 februar die nachste bekannte gelegenheit fallt auf den 8 februar sechs packchen rattengift liegen im wassermuhlen versteck zugang aufsicht dosis und wirkung sind noch offen giuseppe selbst gehort nicht zum plan eintopf und sabotageplan bekanntes kuchenwissen der 8 februar vesper gelangte erneut uber den zivilen arbeiterweg in die kuche und gab alle sechs kleinen rattengiftpackchen in den groen eintopf sie bemerkte dabei keinen zeugen und sah die ausgabe beginnen eine konkrete wirkung beobachtete sie nicht spatere folgen kennt der knoten nicht sicher","initial":"M"},{"id":"varning","category":"personen","title":"Captain Ryan Varning","summary":"Mit seiner sechsköpfigen berittenen Patrouille am 26. Januar bei Freeman's Rock getötet.","body":"<h2>Gesicherter Verlauf</h2>\n<p>Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; <a href=\"#/artikel/styke\">Styke</a> tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben.</p>\n<h2>Nachwirkungen</h2>\n<p>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen <a href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel</a>, <a href=\"#/artikel/grumblejack\">Grumblejack</a> erhielt <a href=\"#/artikel/varlet\">Varlet</a>.</p>\n<p>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. <strong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.</strong></p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["grumblejack","styke","varlet","varning-schluessel"],"backlinks":["zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26 januar bei freeman s rock getotet tot patrouille ryan varning varning gesicherter verlauf varning verlie balentyne am 24 januar mit sechs ausgewahlten reitern der knoten klarte ihren lagerplatz auf und griff in der nacht des 26 januar an varning ergab sich schwer verwundet styke totete ihn gema seiner zuvor festgelegten keine gefangenen anweisung alle sieben patrouillenmitglieder starben nachwirkungen die leichen wurden verborgen der platz bereinigt und sieben pferde erbeutet markante ausrustung blieb in einem versteck auerhalb aldencross styke behielt einen noch nicht identifizierten schlussel grumblejack erhielt varlet am 29 januar galt die patrouille offen als verspatet und suchreiter brachen auf seit 31 januar ist ihr tod in balentyne bekannt die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht","initial":"C"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"<h2>Eigentum und Ort</h2>\n<p>Nach Freeman's Rock gab <a href=\"#/artikel/styke\">Styke</a> das Pferd ausdrücklich <a href=\"#/artikel/grumblejack\">Grumblejack</a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.</p>\n<p>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.</p>\n","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.","links":["grumblejack","styke"],"backlinks":["varning","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd jetzt grumblejacks eigener anteil und packtier tier feldgruppe eigentum und ort nach freeman s rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil varlet ist nicht einfach beliebiges gruppeninventar es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe eine spatere verauerung verletzung oder verlegung ist nicht berichtet","initial":"V"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"<h2>Kampagnenfassung</h2>\n<p>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.</p>\n<h2>Folgen der Begegnung</h2>\n<p>Vesper barg <a href=\"#/artikel/verse\">Verse</a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.</p>\n<p><strong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.</strong></p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","verse","vesper"],"backlinks":["branderscar","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin sie uberlebte den angenommenen ausbruch branderscar historisch mathias richter richter kampagnenfassung matilda ist die weibliche kampagnenkonversion der branderscar vorsteherfigur styke und vesper setzten sie in ihren privatraumen nichttodlich auer gefecht das archiv setzt sie nicht nachtraglich auf den gedruckten ausgang zuruck folgen der begegnung vesper barg verse aus einem beweisbehalter ihrer bibliothek und verzichtete auf weitere rache an der hilflosen eine moorkarte und richters zauberbuch wurden mitgenommen schwere alchemistische ausrustung blieb zuruck ihr spaterer aufenthaltsort und zustand nach branderscar sind nicht geklart","initial":"M"},{"id":"sambryl","category":"personen","title":"Captain Edward Sambryl","summary":"Talireanischer Patrouillenkapitän aus der Frosthamar-Reise.","body":"<h2>Begegnung auf See</h2>\n<p>Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten.</p>\n<h2>Grenze der Rekonstruktion</h2>\n<p>Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den <a href=\"#/artikel/yutak\">Yutak-Handel</a> ein und sind nicht automatisch noch im Inventar.</p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Seereise","Historisch"],"aliases":["Edward Sambryl","Sambryl"],"group":"history","text":"Begegnung auf See Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten. Grenze der Rekonstruktion Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den Yutak-Handel ein und sind nicht automatisch noch im Inventar.","links":["yutak"],"backlinks":["zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar reise seereise historisch edward sambryl sambryl begegnung auf see seine patrouille wurde wahrend der frosthamar reise besiegt sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser einem kurzbogen und pfeilen freigelassen nicht als gefolgsleute behalten grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest beutestucke der patrouille gingen in den yutak handel ein und sind nicht automatisch noch im inventar","initial":"C"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"<h2>Mannschaft und Ende</h2>\n<p><a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.</p>\n<p>Odenkirk starb. Die <a href=\"#/artikel/frosthamar\">Frosthamar</a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.</p>\n<h2>Kein automatisches Restinventar</h2>\n<p>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.</p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Tot","Seereise"],"aliases":["Kargeld Odenkirk","Odenkirk"],"group":"history","text":"Mannschaft und Ende Hakon , Sten , Ketil , Eirik , Arved und Torvald waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand. Odenkirk starb. Die Frosthamar wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren. Kein automatisches Restinventar Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.","links":["arved","eirik","frosthamar","hakon","ketil","sten","torvald"],"backlinks":[],"search":"captain kargeld odenkirk ehemaliger kapitan der frosthamar im akzeptierten verlauf tot tot seereise kargeld odenkirk odenkirk mannschaft und ende hakon sten ketil eirik arved und torvald waren seine seeleute sie verlieen seine mannschaft und nahmen stykes bezahlung an bevor odenkirks letzter konflikt stattfand odenkirk starb die frosthamar wurde zerstort nachdem tragbare wertgegenstande und thorns zahlung geborgen waren kein automatisches restinventar seine meisterarbeits axt wurfaxte kleine silberfigur dreizack whisky und andere beute sind an den spateren verkaufs und inventarverlauf gebunden das historische vorkommen eines gegenstands beweist nicht seinen heutigen besitz","initial":"C"},{"id":"white-tusk","category":"personen","title":"White Tusk","summary":"Yutak-Anführer aus der Nordreise. Handel und ein wertvoller Narwalzahn blieben in Erinnerung.","body":"<h2>Handel im Norden</h2>\n<p>White Tusk führte die Yutak, denen die Gruppe während der Nordreise begegnete. Er nahm erbeutete Patrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde.</p>\n<h2>Nachgeschichte</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.</p>","sources":["history","chronicle"],"status":"Bestätigt","tags":["Yutak","Handel","Historisch"],"aliases":[],"group":"history","text":"Handel im Norden White Tusk führte die Yutak, denen die Gruppe während der Nordreise begegnete. Er nahm erbeutete Patrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde. Nachgeschichte Vesper verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.","links":["vesper"],"backlinks":["joseph","regionen","yutak","zeit-seereise"],"search":"white tusk yutak anfuhrer aus der nordreise handel und ein wertvoller narwalzahn blieben in erinnerung yutak handel historisch handel im norden white tusk fuhrte die yutak denen die gruppe wahrend der nordreise begegnete er nahm erbeutete patrouillenausrustung und gab dafur walrosselfenbein im wert von 1 200 gp spater kam sein narwalzahn hinzu der in aldencross mit 2 000 gp bewertet wurde nachgeschichte vesper verkaufte beide lose am 23 januar fur insgesamt 3 200 gp fur white tusk ist seit dem handel keine weitere begegnung oder verpflichtung gegenuber dem knoten festgehalten","initial":"W"},{"id":"joseph","category":"personen","title":"Joseph Calls-Fire-From-Water","summary":"Yutak-Kontakt der nördlichen Begegnung und des Handels.","body":"<h2>Dokumentierter Platz in der Reise</h2>\n<p>Joseph gehört zur Begegnung und zum Austausch mit den Yutak während der Nordreise. Er ist von <a href=\"#/artikel/white-tusk\">White Tusk</a> zu unterscheiden.</p>\n<h2>Begrenztes Dossier</h2>\n<p>Das dauerhafte Archiv liefert hier keine vollständige Einzelbiographie oder aktuelle Position. Es begründet insbesondere keine allwissende Sprecherrolle für alle Yutak. Neue Details werden nic cht etabliert","initial":"L"},{"id":"aldencross","category":"orte","title":"Aldencross","summary":"Offener Marktort unter Balentyne; große Teile der Bevölkerung fliehen während des Bugbearangriffs nach Süden und Westen.","body":"<h2>Grenzort südlich der Watch Wall</h2><p>Aldencross liegt unmittelbar südlich von Balentyne und lebte von Garnison, Handel und Reisenden. Die bisherigen Tarnungen, Einkäufe, Beziehungen und Mott-Ereignisse spielten hier.</p>\n<h2>Letzter direkter Blick</h2><p>Während Fire-Axe Balentyne stürmte, sahen Styke, Vesper und Valeria große Teile der Bevölkerung nach Süden und Westen fliehen. Balentyne ist inzwischen gefallen. Wie viele Menschen noch im Ort sind und wie die einzelnen Straßen, Häuser und Läden jetzt aussehen, hat das Kerntrio am aktuellen Rand noch nicht selbst festgestellt.</p>","sources":["aldencross","chronicle","live"],"status":"Am 9. Februar verlassen; kein neuer direkter Bericht","tags":["Aldencross"],"aliases":[],"parent":"talingarde","text":"Grenzort südlich der Watch Wall Aldencross liegt unmittelbar südlich von Balentyne und lebte von Garnison, Handel und Reisenden. Die bisherigen Tarnungen, Einkäufe, Beziehungen und Mott-Ereignisse spielten hier. Letzter direkter Blick Während Fire-Axe Balentyne stürmte, sahen Styke, Vesper und Valeria große Teile der Bevölkerung nach Süden und Westen fliehen. Balentyne ist inzwischen gefallen. Wie viele Menschen noch im Ort sind und wie die einzelnen Straßen, Häuser und Läden jetzt aussehen, hat das Kerntrio am aktuellen Rand noch nicht selbst festgestellt.","links":[],"backlinks":[],"search":"aldencross offener marktort unter balentyne groe teile der bevolkerung fliehen wahrend des bugbearangriffs nach suden und westen aldencross grenzort sudlich der watch wall aldencross liegt unmittelbar sudlich von balentyne und lebte von garnison handel und reisenden die bisherigen tarnungen einkaufe beziehungen und mott ereignisse spielten hier letzter direkter blick wahrend fire axe balentyne stur des Dalliance diente dem Kerntrio als Schlaf- und Planungsraum. Hier schlief Kaitlyn kurz bei Styke ein; später las und unterschrieb Tacitus den Compact und wurde gebunden. Abreise Am 9. Februar wurde der erreichbare persönliche Besitz für den Aufbruch geordnet. Der gesamte gewählte Haushalt verließ das Haus und ging an Bord von Halstyn’s Folly . Seitdem gibt es keinen neuen direkten Bericht aus dem Zimmer.","links":["halstyns-folly"],"backlinks":[],"search":"das ruckwartige zimmer das ruckwartige zimmer diente als schlaf dinner und bindungsraum der haushalt verlie es beim aufbruch aldencross 7 februar lords dalliance das alte knot zimmer der groe obere raum des dalliance diente dem kerntrio als schlaf und planungsraum hier schlief kaitlyn kurz bei styke ein spater las und unterschrieb tacitus den compact und wurde gebunden abreise am 9 februar wurde der erreichbare personliche besitz fur den aufbruch geordnet der gesamte gewahlte haushalt verlie das haus und ging an bord von halstyns folly seitdem gibt es keinen neuen direkten bericht aus dem zimmer","initial":"D"},{"id":"tunnel","category":"orte","title":"Der Geheimgang","summary":"Alter Zwergengang zwischen Dalliance und Balentyne; das Trio kehrt hindurch zurück, Tacitus und Jacobian sind an den Wandketten gesichert.","body":"<h2>Entdeckung in der Nacht 27./28. Januar</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> führte die Suche, <a href=\"#/artikel/styke\">Styke</a> half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an.</p>\n<h2>Tatsächlich gesehene Gegenseite</h2>\n<p>Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her.</p>\n<h2>Was weiterhin fehlt</h2>\n<p>Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route.</p>\n<h2>Gegenwärtige Nutzung</h2><p>Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noch eine geprüfte magische Sicherung. Der Gang bleibt zugleich möglicher Zugang und Rückzugsweg.</p>\n<h2>Die Nacht zum 9. Februar</h2><p>Der Gang wurde zum tatsächlichen Ein- und Rückzugsweg des Angriffs. Tacitus und Jacobian wurden mehrere Biegungen tief an den beiden Wandketten befestigt. Später passierte das Kerntrio sie auf dem Weg nach Balentyne und erneut beim zweiten Gang. Aktuell kehren Styke, Vesper und Valeria mit der zweiten Beute durch den Tunnel zum Dalliance zurück.</p>","sources":["dalliance","balentyne","chronicle","live"],"status":"Aktueller Ort / Gefangenenpunkt","tags":["Aldencross"],"aliases":["Geheimtunnel","Zwergentunnel","Kellertunnel"],"parent":"dalliance","text":"Entdeckung in der Nacht 27./28. Januar Vesper führte die Suche, Styke half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an. Tatsächlich gesehene Gegenseite Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her. Was weiterhin fehlt Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route. Gegenwärtige Nutzung Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noc zweiten gang aktuell kehren styke vesper und valeria mit der zweiten beute durch den tunnel zum dalliance zuruck","initial":"D"},{"id":"balentyne","category":"orte","title":"Balentyne","summary":"Gefallene Grenzfestung und abgeschlossener erster Auftrag des Nessischen Knotens.","body":"<h2>Die Grenzfestung</h2><p>Balentyne bewachte die Watch Wall. In der Nacht zum 9. Februar drangen Styke, Vesper und Valeria durch den Geheimgang ein, töteten Donnagin und Havelyn, nahmen den Schatz und schalteten die Torhausabwehr aus. Fallgatter und Zugbrücke standen offen, als das rote Signal aufstieg.</p>\n<h2>Fall</h2><p>Fire-Axes Heer stürmte durch das offene Tor. Die organisierte Verteidigung brach am frühen Morgen zusammen. Balentyne ist gefallen und Thorns erster Auftrag erfüllt; das Kerntrio erreichte Stufe 6.</p>","sources":["balentyne","live","chronicle","timeline"],"status":"Gefallen am 9. Februar","tags":["Festung","Watch Wall","8./9. Februar"],"aliases":["Watchtower Balentyne","Festung"],"parent":"watch-wall","text":"Die Grenzfestung Balentyne bewachte die Watch Wall. In der Nacht zum 9. Februar drangen Styke, Vesper und Valeria durch den Geheimgang ein, töteten Donnagin und Havelyn, nahmen den Schatz und schalteten die Torhausabwehr aus. Fallgatter und Zugbrücke standen offen, als das rote Signal aufstieg. Fall Fire-Axes Heer stürmte durch das offene Tor. Die organisierte Verteidigung brach am frühen Morgen zusammen. Balentyne ist gefallen und Thorns erster Auftrag erfüllt; das Kerntrio erreichte Stufe 6.","links":[],"backlinks":["zeit-0114"],"search":"balentyne gefallene grenzfestung und abgeschlossener erster auftrag des nessischen knotens festung watch wall 8 9 februar watchtower balentyne festung die grenzfestung balentyne bewachte die watch wall in der nacht zum 9 februar drangen styke vesper und valeria durch den geheimgang ein toteten donnagin und havelyn nahmen den schatz und schalteten die torhausabwehr aus fallgatter und zugbrucke standen offen als das rote signal aufstieg fall fire axes heer sturmte durch das offene tor die organisierte verteidigung brach am fruhen morgen zusammen balentyne ist gefallen und thorns erster auftrag erfullt das kerntrio erreichte stufe 6","initial":"B"},{"id":"torhaus","category":"orte","title":"Balentynes Torhaus","summary":"Ballisten, Steinschütten und Heißsandabwehr zerstört; Fallgatter und Zugbrücke geöffnet und die Bedienwerke ruiniert.","body":"<h2>Informationsweg</h2>\n<p>Barnabus erzählte <a href=\"#/artikel/valeria\">Valeria</a> beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios.</p>\n<h2>Bekannte Einzelheiten</h2>\n<p>Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten.</p>\n<h2>Offene Grenzen</h2>\n<p>Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.</p>\n<h2>Sabotage am 9. Februar</h2><p>Das Kerntrio erreichte Mechanismenebene und Dach ohne allgemeinen Alarm. Styke und Valeria machten beide Ballisten und beide Steinschütten unbrauchbar; Vesper löschte die Heißsandfeuer und verwandelte den Vorrat in nassen Schlamm. Danach öffneten sie Fallgatter und Zugbrücke und zerstörten beide Bedienwerke. Eine einfache Rückstellung ist nicht möglich.</p>","sources":["live","core","chronicle"],"status":"Sabotiert / Tor offen","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Informationsweg Barnabus erzählte Valeria beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an Styke und Vesper weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios. Bekannte Einzelheiten Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten. Offene Grenzen Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses. Sabotage am 9. Februar Das Kerntrio erreichte Mechanismenebene und Dach ohne allgemeinen Alarm. Styke und Valeria machten beide Ballisten und beide Steinschütten unbrauchbar; Vesper löschte die Heißsandfeuer und verwandelte den Vorrat in nassen Schlamm. Danach öffneten sie Fallgatter und Zugbrücke und zerstörten beide Bedienwerke. Eine einfache Rückstellung ist nicht möglich.","links":["styke","valeria","vesper"],"backlinks":["zeit-valeria-rueckkehr"],"search":"balentynes torhaus ballisten steinschutten und heisandabwehr zerstort fallgatter und zugbrucke geoffnet und die bedienwerke ruiniert balentyne informationsweg barnabus erzahlte valeria beim trinken am 30 januar einzelheiten sie gab diese spat am 31 januar an styke und vesper weiter es handelt sich um einen gehorten inzwischen geteilten bericht nicht um eine vollstandige eigene besichtigung des trios bekannte einzelheiten das zweite geschoss ist die mechanismenebene getrennte winden bedienen fallgatter und zugbrucke vier wachen sind dort durchgehend eingesetzt vier zwergeningenieure arbeiten tagsuber dort heisandabwehr wird auf dieser ebene unterhalten offene grenzen kein akuter konstruktionsfehler wurde bekannt genaue alarm ablose schlaf und meldeablaufe bleiben untersuchungsziele eine separate kleinere zisterne gehort zum bekannten wassersystem des torhauses sabotage am 9 februar das kerntrio erreichte mechanismenebene und dach ohne allgemeinen alarm styke und valeria machten beide ballisten und beide steinschutten unbrauchbar vesper loschte die heisandfeuer und verwandelte den vorrat in nassen schlamm danach offneten sie fallgatter und zugbrucke und zerstorten beide bedienwerke eine einfache ruckstellung ist nicht moglich","initial":"B"},{"id":"kueche","category":"orte","title":"Küche und Versorgung Balentynes","summary":"Vesper brachte am 8. Februar alle sechs Rattengiftpäckchen in den Gemeinschaftseintopf und verließ Balentyne vor sichtbarer Wirkung.","body":"<h2>Beobachtete Abläufe</h2>\n<p>Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. <a href=\"#/artikel/vesper\">Vesper</a> sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert.</p>\n<h2>Wasser</h2>\n<p>Gewöhnliches Wasser kommt aus dem <a href=\"#/artikel/tyburn\">Tyburn</a>. Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen.</p>\n<h2>Mama Giuseppes Eintopf</h2>\n<p>Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen.</p>\n<h2>Krankheit</h2>\n<p>Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.</p>\n<h2>Ausführung am 8. Februar</h2><p>Vespers Arbeiterdeckung hielt ein letztes Mal. Sie gab alle sechs Päckchen in den großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen. Sie ging, bevor eine Wirkung sichtbar wurde. Das Spielerwissen enthält daher keine sichere Zahl Erkrankter und keinen Nachweis, dass das Gift die spätere Verteidigung schwächte.</p>","sources":["chronicle","live","core"],"status":"Eintopf vergiftet / Wirkung unbestätigt","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Beobachtete Abläufe Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. Vesper sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert. Wasser Gewöhnliches Wasser kommt aus dem Tyburn . Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen. Mama Giuseppes Eintopf Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen. Krankheit Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert. Ausführung am 8. Februar Vespers Arbeiterdeckung hielt ein letztes Mal. Sie gab alle sechs Päckchen in den großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen. Sie ging, bevor eine Wirkung sichtbar wurde. Das Spielerwissen enthält daher keine sichere Zahl Erkrankter und keinen Nachweis, dass das Gift die spätere Verteidigung schwächte.","links":["tyburn","vesper"],"backlinks":["giuseppe"],"search":"kuche und versorgung balentynes vesper brachte am 8 februar alle sechs rattengiftpackchen in den gemeinschaftseintopf und verlie balentyne vor sichtbarer wirkung balentyne beobachtete ablaufe die kuche ist fast standig in betrieb die vorratskammer wird haufig nachgefullt und enthalt ungefahr ein bis zwei tage ref=\"#/artikel/verse\">Verse</a> endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.</p>\n","sources":["core","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["The Illuminated Scroll","Buchladen","Scaramores Laden"],"parent":"aldencross","text":"Funktion in der Kampagne Hier arbeitet Jacobian Scaramore mit Schriftstücken, Büchern, Konten und magischen Fragen. Styke suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht. Die Briefkette Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am 31. Januar um 20 Uhr , nach Ladenschluss und mit Jacobian als anwesendem Gastgeber. Letztes Ereignis Das Gespräch über Verse endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.","links":["jacobian","styke","verse"],"backlinks":[],"search":"illuminated scroll jacobian scaramores arbeits und schriftladen ort des tacitus gesprachs aldencross the illuminated scroll buchladen scaramores laden funktion in der kampagne hier arbeitet jacobian scaramore mit schriftstucken buchern konten und magischen fragen styke suchte am 28 januar einen sachkundigen fur vespers erwachtes reliquiar und kaufte einen gebrauchten exorzisten reisebericht die briefkette jacobian schrieb tacitus einen versiegelten personlichen brief ihre antwort fuhrte zum treffen am 31 januar um 20 uhr nach ladenschluss und mit jacobian als anwesendem gastgeber letztes ereignis das gesprach uber verse endete wegen tacitus beschwerden fruh der benutzte abort und jacobians sorge um die weinflasche sind bestandteil dieser begegnung ein zweiter termin ist noch nicht vereinbart","initial":"I"},{"id":"mott-haus","category":"orte","title":"Das Haus der Motts","summary":"Wohlhabender zweigeschossiger Offiziershaushalt hinter St. Alden.","body":"<h2>Beobachteter Aufbau</h2>\n<p>Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden.</p>\n<h2>Schlafzimmer und Truhe</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band.</p>\n<h2>Zugang ist situationsgebunden</h2>\n<p>Kaitlyn ließ Styke am 28. Januar unter der Buch-Deckgeschichte herein und deutete für den 29. Januar eine öffene Hintertür an. Das ist kein dauerhaft offenes Haus. Dass während des ersten langen Besuchs keine weitere Haushaltsperson wahrgenommen wurde, beweist nicht, dass es niemals Personal gibt.</p>\n<h2>Offener Gegenstandsverbleib</h2>\n<p>Der Exorzisten-Reisebericht wurde am 28. Januar auf dem vorderen Tisch abgelegt. Eine spätere Mitnahme ist nicht belegt.</p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Mott house","Küchengarten"],"parent":"aldencross","text":"Beobachteter Aufbau Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden. Schlafzimmer und Truhe Styke sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band. Zugang ist situationsgebunden Kaitlyn ließ Styke am
