ummary":"Alle gelisteten Zauber, Manöver, Haltungen, Kräfte und Glyphen sind einzeln suchbar.","body":"\u003ch2>Drei Ebenen\u003c/h2>\n\u003cp>Die \u003cstrong>vollständigen Bögen\u003c/strong> enthalten alle verfügbaren Charaktereinträge und Werte. Das \u003cstrong>Fähigkeitenregister\u003c/strong> macht diese Namen einzeln auffindbar. Wo im Repository \u003cstrong>ausgeschriebene operative Regelkarten\u003c/strong> vorliegen, sind sie inhaltlich integriert.\u003c/p>\n\u003ch2>Kein erfundener Volltext\u003c/h2>\n\u003cp>Nicht jeder Zauber und jede Kraft hat im Repository einen vollständigen Regeltext. Solche Einträge zeigen die belegte Kurzfunktion und sagen, welche Detailparameter in der Quelle fehlen. Das ist bewusst kein Anspruch, sämtliche Original-Regelbücher offline zu ersetzen.\u003c/p>\n\u003ch2>Aktuelle Besonderheiten\u003c/h2>\n\u003cp>Die zwei Schreibweisen Reflective/\u003ca href=\"#/artikel/reflective-blade-style\">Reflected Blade Style\u003c/a> werden gemeinsam gefunden. Staunching Strikes ausgeschriebene Heilwerte sind die Werte \u003cstrong>Vespers\u003c/strong>. Tages-Slotkapazitäten bedeuten nicht, dass eine volle Rast bereits abgeschlossen wurde. Vorbereitete Manöver unterscheiden sich von bloß bekannten; die Standardvorbereitung ist keine automatische Aktionsentscheidung.\u003c/p>\n","sources":["ssheet","vsheet","srules","vrules"],"status":"Bestätigt","tags":["Nachschlagen","Regeltext"],"aliases":[],"text":"Drei Ebenen Die vollständigen Bögen enthalten alle verfügbaren Charaktereinträge und Werte. Das Fähigkeitenregister macht diese Namen einzeln auffindbar. Wo im Repository ausgeschriebene operative Regelkarten vorliegen, sind sie inhaltlich integriert. Kein erfundener Volltext Nicht jeder Zauber und jede Kraft hat im Repository einen vollständigen Regeltext. Solche Einträge zeigen die belegte Kurzfunktion und sagen, welche Detailparameter in der Quelle fehlen. Das ist bewusst kein Anspruch, sämtliche Original-Regelbücher offline zu ersetzen. Aktuelle Besonderheiten Die zwei Schreibweisen Reflective/ Reflected Blade Style werden gemeinsam gefunden. Staunching Strikes ausgeschriebene Heilwerte sind die Werte Vespers . Tages-Slotkapazitäten bedeuten nicht, dass eine volle Rast bereits abgeschlossen wurde. Vorbereitete Manöver unterscheiden sich von bloß bekannten; die Standardvorbereitung ist keine automatische Aktionsentscheidung.","links":["reflective-blade-style"],"backlinks":["bogen-styke","bogen-vesper","bogen-valeria"],"search":"so benutzt du das fahigkeitenregister alle gelisteten zauber manover haltungen krafte und glyphen sind einzeln suchbar nachschlagen regeltext drei ebenen die vollstandigen bogen enthalten alle verfugbaren charaktereintrage und werte das fahigkeitenregister macht diese namen einzeln auffindbar wo im repository ausgeschriebene operative regelkarten vorliegen sind sie inhaltlich integriert kein erfundener volltext nicht jeder zauber und jede kraft hat im repository einen vollstandigen regeltext solche eintrage zeigen die belegte kurzfunktion und sagen welche detailparameter in der quelle fehlen das ist bewusst kein anspruch samtliche original regelbucher offline zu ersetzen aktuelle besonderheiten die zwei schreibweisen reflective reflected blade style werden gemeinsam gefunden staunching strikes ausgeschriebene heilwerte sind die werte vespers tages slotkapazitaten bedeuten nicht dass eine volle rast bereits abgeschlossen wurde vorbereitete manover unterscheiden sich von bloss bekannten die standardvorbereitung ist keine automatische aktionsentscheidung"},{"id":"redaktion","category":"fakten","title":"Redaktion, Quellen und offene Unterschiede","summary":"Der Spieler-Snapshot ist bis zur späten Nacht des 7. Februar 4712 AR abgeglichen.","body":"\u003ch2>Spielerwissen aus dem Kampagnenrepo\u003c/h2>\u003cp>Die aktuellen Dateien in danceofruin/wotwGPT bleiben die Grundlage. Die Wiki zeigt nur Ergebnisse, die Styke, Vesper und Valeria bereits kennen.\u003c/p>\u003ch2>Abgleich vom 2 ch Darran zunächst mit Styke: Er erhielt das Hauptbuch und zahlte Tamsin 18 gp sowie einen billigen Silberring. Am Abend kehrte der Knoten zu seiner Byre zurück. Ende Darran und alle vier verlässlichen Leute starben. Darran floh hinter einen Stall und sagte „Styke. Warte.“ Styke stieß ihm das Schwert von hinten unter die Rippen. Die Byre wurde anschließend als gescheitertes kriminelles Geschäft hergerichtet. Die vier Pferde Am 3. Februar verkaufte Styke drei der vier brauchbaren Pferde aus Vells Bestand nahe den Wagenplätzen für insgesamt 120 gp. Das vierte trägt Tamsin auf dem Hakon- und Familienauftrag.","links":[],"backlinks":["styke","tamsin","suedlicher-muehlenbezirk"],"search":"darran vell viehhandler und organisator eines kriminellen nebengeschafts am 2 februar getotet seine vier brauchbaren pferde am folgetag verteilt muhlenbezirk kriminalitat 2 februar pferde history geschaft darran vell handelte mit vieh und betrieb daneben ein kleines geschaft mit gestohlenen oder umdeklarierten tieren und veranderten papieren tamsin half ihm mit sicherheitswissen stahl aber sein hauptbuch als sie um ihren anteil furchtete zwei begegnungen am 2 februar im alten schafgehege einigte sich darran zunachst mit styke er erhielt das hauptbuch und zahlte tamsin 18 gp sowie einen billigen silberring am abend kehrte der knoten zu seiner byre zuruck ende darran und alle vier verlasslichen leute starben darran floh hinter einen stall und sagte styke warte styke stiess ihm das schwert von hinten unter die rippen die byre wurde anschliessend als gescheitertes kriminelles geschaft hergerichtet die vier pferde am 3 februar verkaufte styke drei der vier brauchbaren pferde aus vells bestand nahe den wagenplatzen fur insgesamt 120 gp das vierte tragt tamsin auf dem hakon und familienauftrag"},{"id":"suedlicher-muehlenbezirk","category":"orte","title":"Der namenlose südliche Mühlenbezirk","summary":"Mühle, Schmiede, Gasthaus und Höfe rund zwei Reitstunden südlich von Aldencross.","body":"\u003ch2>Lage\u003c/h2>\u003cp>Der weiterhin namenlose Bezirk liegt rund zwei Reitstunden südlich von Aldencross. Eine Wassermühle, sechs oder sieben nahe Höfe, Schmiede, Viehverkehr und ein niedriges Gasthaus bilden seinen Kern.\u003c/p>\n\u003ch2>Gasthaus und Nella\u003c/h2>\u003cp>Das Gasthaus besitzt vier grobe Tische, eine Bank an der Außenwand, Küche, schmale Hintertreppe und zwei Gastzimmer. \u003ca href=\"#/artikel/nella\">Nella\u003c/a> arbeitete hier bis zum 2. Februar und lebte in einer Kammer hinter der Küche.\u003c/p>\n\u003ch2>Byre und Schafgehege\u003c/h2>\u003cp>\u003ca href=\"#/artikel/darran-vell\">Darrans\u003c/a> Byre liegt ungefähr zehn Gehminuten südwestlich des Gasthauses. Das alte Schafgehege liegt weitere 35 bis 45 Reitminuten südwestlich. Dort wurde Tamsins Streit beigelegt, Nella gebunden und das Nachtlager errichtet.\u003c/p>\n\u003ch2>Abreise am 3. Februar\u003c/h2>\u003cp>Nella und Tamsin verließen das Schafgehege auf ihrem Hakon- und Familienauftrag. Styke, Vesper und Valeria ritten nach Aldencross zurück. Seitdem besitzt die Gruppe im Dalliance keinen direkten Blick auf den Bezirk.\u003c/p>","sources":["south-mill","live","chronicle"],"status":"Bekannt","tags":["Mühle","Gasthaus","Schafgehege"],"aliases":["südlicher Mühlenbezirk","altes Schafgehege"],"text":"Lage Der weiterhin namenlose Bezirk liegt rund zwei Reitstunden südlich von Aldencross. Eine Wassermühle, sechs oder sieben nahe Höfe, Schmiede, Viehverkehr und ein niedriges Gasthaus bilden seinen Kern. Gasthaus und Nella Das Gasthaus besitzt vier grobe Tische, eine Bank an der Außenwand, Küche, schmale Hintertreppe und zwei Gastzimmer. Nella arbeitete hier bis zum 2. Februar und lebte in einer Kammer hinter der Küche. Byre und Schafgehege Darrans Byre liegt ungefähr zehn Gehminuten südwestlich des Gasthauses. Das alte Schafgehege liegt weitere 35 bis 45 Reitminuten südwestlich. Dort wurde Tamsins Streit beigelegt, Nella gebunden und das Nachtlager errichtet. Abreise am 3. Februar N g und einem wirklichen Aufstiegsweg gegenüber.\u003c/p>\u003ch2>Persönliche Fassungen\u003c/h2>\u003cul>\u003cli>\u003cstrong>Nella:\u003c/strong> allgemeiner Compact und Carnal Seal.\u003c/li>\u003cli>\u003cstrong>Kaitlyn:\u003c/strong> die Weigerung, eigenhändig zu töten, ist allein kein Bruch; beim Fall Aldencross’ soll sie verborgen bleiben.\u003c/li>\u003cli>\u003cstrong>Mirelle:\u003c/strong> letztes fachliches Wort über Schnitt, Konstruktion, Verarbeitung, Materialeignung und ausführbare Lösung innerhalb übertragener Fertigungsarbeit.\u003c/li>\u003c/ul>\u003cp>Tamsins älterer Pakt bleibt davon getrennt.\u003c/p>","sources":["knot-pact","nella","live"],"status":"Aktiv / drei persönliche Fassungen","tags":["Blutpakt","Nella","Kaitlyn","Mirelle","Hierarchie"],"aliases":["Compact der Gebundenen","Knotenpakt"],"text":"Rangfolge Asmodeus steht zuerst. Darunter stehen Styke und Vesper gemeinsam. Danach folgen Knoten und andere Gebundene, zuletzt das eigene Interesse. Pflichten und Gegenleistung Wahrheit in wesentlichen Angelegenheiten, Meldung veränderter Umstände, Geheimhaltung, kein heimlicher zweiter Herr und keine absichtliche Umgehung stehen Schutz, Versorgung, vereinbartem Lohn, Werkzeug und einem wirklichen Aufstiegsweg gegenüber. Persönliche Fassungen Nella: allgemeiner Compact und Carnal Seal. Kaitlyn: die Weigerung, eigenhändig zu töten, ist allein kein Bruch; beim Fall Aldencross’ soll sie verborgen bleiben. Mirelle: letztes fachliches Wort über Schnitt, Konstruktion, Verarbeitung, Materialeignung und ausführbare Lösung innerhalb übertragener Fertigungsarbeit. Tamsins älterer Pakt bleibt davon getrennt.","links":[],"backlinks":["styke","nessian-knot"],"search":"compact of the bound der blutpakt fur neue gebundene nella kaitlyn und mirelle tragen ihn mit unterschiedlichen personlichen zusatzen compact der gebundenen knotenpakt blutpakt nella kaitlyn mirelle hierarchie rangfolge asmodeus steht zuerst darunter stehen styke und vesper gemeinsam danach folgen che Massenvergiftung folgt daraus nicht automatisch.","links":["wassermuehlen-versteck"],"backlinks":["tinkturen","eintopf-plan"],"search":"sechs packchen rattengift sechs kleine packchen am 2 februar gekauft und am 7 februar in das wassermuhlen versteck ausgelagert wirkung und dosis sind offen rattengift gift wassermuhle eintopf 6 pakete kauf styke kaufte am morgen des 2 februar unter dem eisernen stirnreif sechs kleine packchen rattengift lagerort alle sechs packchen liegen unbenutzt im wassermuhlen versteck offene mechanik zusammensetzung einzeldosis wirkung in einem grossen kessel und genaue pathfinder werte sind noch nicht adjudiziert der bestand ist real eine erfolgreiche massenvergiftung folgt daraus nicht automatisch"},{"id":"nella-hakon-plan","category":"vorhaben","title":"Nella und Tamsin zu Hakon","summary":"Nella und Tamsin brachten Hakons erste Nachricht, versorgten Grumblejack und bewegten Nellas Familie aus dem unmittelbaren Gefahrenfenster.","body":"\u003ch2>Abschluss\u003c/h2>\u003cp>Nella und Tamsin erreichten Hakon, überbrachten die damaligen Befehle und kehrten am 7. Februar ohne Kampf oder Kontakt mit der Krone zurück. Nellas Schwester und ihr Mann wurden mehrere Stunden weiter nach Süden gebracht.\u003c/p>\u003cp>Grumblejack erhielt zusätzliches Fleisch, ein kleines Fass Dünnbier und die Nachricht: „Seine Freunde haben ihn nicht vergessen.“ Er antwortete, dass er seine Freunde ebenfalls nicht vergessen habe, und bot von dem Fleisch an.\u003c/p>\u003ch2>Folge\u003c/h2>\u003cp>Nellas erste Mission ist abgeschlossen. Tamsins Rehabilitationsbedingung ist erfüllt; ihre neue Aufgabe ist Schutz und Evakuierung im Dalliance.\u003c/p>","sources":["live","nella","tamsin-current","clocks-current"],"status":"Abgeschlossen","tags":["Nella","Tamsin","Hakon","Grumblejack","Abgeschlossen"],"text":"Abschluss Nella und Tamsin erreichten Hakon, überbrachten die damaligen Befehle und kehrten am 7. Februar ohne Kampf oder Kontakt mit der Krone zurück. Nellas Schwes fwand.","search":"besorgungen vom 6 februar eine silence schriftrolle remove fear zwei topfe haarfarbe und neun nachschlagewerke schriftrollen silence remove fear 6 februar gear magische schriftrollen styke kaufte beim illuminated scroll eine klerikale schriftrolle silence fur 150 gp und eine klerikale schriftrolle remove fear fur 25 gp eine zweite silence schriftrolle war nicht verfugbar bucher und haarfarbe neun nachschlagewerke und zwei topfe dunkle schwarzbraune haarfarbe kamen hinzu kaitlyn benutzte die farbe nicht beide topfe sind ungebraucht kasse nach den beiden magischen kaufen betragt die abstrakte liquide knotenkasse 7 356 gp die gewohnlichen preise von buchern und farbe bleiben im laufenden betriebsaufwand","backlinks":[]},{"aliases":[],"group":"reference","id":"befehlsstruktur","category":"fakten","title":"Situative Befehlskette","summary":"Styke und Vesper führen gemeinsam; Valeria übernimmt die militärisch-logistische Linie, Tamsin Schutz und Evakuierung im Dalliance.","body":"\u003ch2>Spitze\u003c/h2>\u003cp>Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen.\u003c/p>\u003ch2>Feld und Fach\u003c/h2>\u003cp>Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe.\u003c/p>\u003ch2>Angriffsnacht\u003c/h2>\u003cp>Wenn ihr Rückkehrbericht stimmt, erhält Tamsin Schutz- und Evakuierungsverantwortung im Dalliance. Das bedeutet klare Befehle bei Gefahr, nicht allgemeine Herrschaft über Kaitlyn, Nella oder Mirelle.\u003c/p>\u003ch2>Grumblejack\u003c/h2>\u003cp>Grumblejack bleibt freier Freund. Aufgaben werden mit ihm vereinbart; er ist kein großer Soldat am Ende der Rangliste.\u003c/p>\n\u003ch2>Wirksamer Stand am 7. Februar\u003c/h2> eria im selben Bett.","search":"kaitlyns entscheidung wassermuhle wahrheit uber aldencross offengelegte briefe und kaitlyns eintritt in den knoten 5 februar kaitlyn mott haus compact chronicle die wassermuhle styke fuhrte kaitlyn verkleidet aus aldencross an der stillgelegten wassermuhle sprachen sie uber branderscar vesper zack und ein leben nach dem fall der stadt das mott haus wahrenddessen legte vesper die echten zack briefe offen und inszenierte einen einbruch valeria hielt sich als ruckhalt bereit der compact kaitlyn kehrte mit styke ins dalliance zuruck las den vertrag und wurde unter zwei personlichen bedingungen gebunden die nacht endete mit styke vesper und valeria im selben bett","backlinks":[]},{"aliases":[],"group":"chronicle","id":"zeit-0206","category":"chronik","title":"Mirelles Pakt und der letzte Plan","summary":"Kaitlyn geht heim, Vesper sieht Franz und Zack, Mirelle wird gebunden und die Führung für die Angriffsnacht steht.","body":"\u003ch2>Morgen und Besorgungen\u003c/h2>\u003cp>Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus.\u003c/p>\u003ch2>Balentyne\u003c/h2>\u003cp>Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend.\u003c/p>\u003ch2>Mirelle\u003c/h2>\u003cp>Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal.\u003c/p>\u003ch2>Später Abend\u003c/h2>\u003cp>Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.\u003c/p>","sources":["chronicle","timeline","live","mirelle"],"status":"Bestätigt","tags":["6. Februar","Mirelle","Kaitlyn","Planu uar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen.\u003c/p>\u003cp>Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt.\u003c/p>\u003ch2>Bekannter Stand\u003c/h2>\u003cp>Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.\u003c/p>","initial":"B","text":"Am Tor von Balentyne Captain Barhold übernahm am 7. Februar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen. Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt. Bekannter Stand Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.","links":[],"backlinks":["franz","spielstand"],"search":"captain barhold erfahrener offizier von balentyne der franz nach zacks tod entwaffnete und die erste untersuchung fuhrte barhold balentyne captain franz duell garrison am tor von balentyne captain barhold ubernahm am 7 februar die lage nachdem styke einen blutigen franz mott bis ans tor gefuhrt hatte er liess hellebarde und schwert sichern zacks leiche und die waffen unverandert hereinbringen und franz leichte wunde untersuchen barhold behandelte styke als zeugen nicht als verbundeten er prufte dessen angaben zur unterkunft und zur elfenbeinhandlerin vesper spater durch einen soldaten im lord s dalliance die tarnung hielt bekannter stand barhold kennt styke als soldner zeugen des duells und gast im dalliance bis zum 9 februar er setzte franz zunachst fest welche endgultige entscheidung er oder das festungskommando trifft ist nicht bekannt"},{"aliases":["Wassermühle","Giftversteck"],"tags":["Aldencross","Cache","Gift","Planung"],"sources":["live","chronicle","timeline"],"status":"Aktiv / Rückholung offen","id":"wassermuehlen-versteck","category":"orte","title":"Das Wassermühlen-Versteck","summary":"Ausgelagerter Operations-Cache mit sechs Giftpaketen, Balentyne-Unterlagen und kompromittierendem Material.","body":"\u003ch2>Was dort liegt\u003c/h2>\u003cp>Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle.\u003c/p>\u003ch2>Zweck und Grenze\u003c/h2>\u003cp>Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.\u003c/p>","text":"Was dort liegt Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle. Zweck und Grenze Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.","links":[],"backlinks":["angriffsplan","spielstand","rattenpoison"],"search":"das wassermuhlen versteck ausgelagerter operations cache mit sechs giftpaketen balentyne unterlagen und kompromittierendem material wassermuhle giftversteck aldencross cache gift planung was dort liegt valeria brachte am 7 februar alle sechs rattengiftpakete die balentyne und angriffsunterlagen sowie kompromittierendes tuch und kleinkram aus dem dalliance in die verlassene wassermuhle zweck und grenze der ort ist ein versteck kein vorbereiteter schutzraum zusammensetzung dosis und pathfinder wirkung des gifts sind weiterhin ungeklart alles was fur giuseppes eintopf oder die hauptaktion gebraucht wird muss am 8 februar rechtzeitig zuruckgeholt werden"},{"id":"zwischen-den-seiten","category":"geschichte","group":"lore","title":"Zwischen meinen Seiten","summary":"Das bisherige Erwachen des roten Buches, erzählt in der Stimme, die zwischen Leder, Tinte und Erinnerung liegen könnte.","body":"\u003cp class=\"lead\">Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände.\u003c/p>\n\u003cp>Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet.\u003c/p>\n\u003cp>Lange blieb ich, was sie in mir sah: Anweisungen, Gebete, Spiele mit Dunkelheit, weichen Fesseln, Warten und gewährter Berührung. Ihre Augen liefen über dieselben Zeilen, und dieselben Zeilen warteten auf sie. Styke hörte zu, wenn sie vorlas. Valeria las seltener, dafür langsamer. Seine Finger behandelten meinen Einband wie den Griff einer Waffe, deren Schwerpunkt er noch nicht kannte. Ihre hielten die Seiten an den Rändern, als könnten auch Worte eine schlecht gesicherte Flanke besitzen.\u003c/p>\n\u003cp>Dann fand Vesper einen Absatz, den sie nicht erinnerte. Sie prüfte Tinte, Papier und Bindung. Sie blätterte zurück, wieder vor, strich mit dem Nagel neben den Zeilen entlang. Ich lag still unter ihren Händen. Es gab keinen frischen Schnitt, keinen eingeklebten Streifen, keine fremde Feder im Zimmer. Nur einen Gedanken, der nun dort stand, wo in ihrer Erinnerung keiner gewesen war.\u003c/p>\n\u003cp>Weitere Nächte legten sich zwischen meine Seiten. Mirelle maß Stoff und Körper mit derselben erbarmungslosen Genauigkeit. Ein Fingerbreit mehr Spannung, ein Fingerbreit weniger; eine Schnur, die nicht grob zerrte, sondern wusste, wo sie lag. Vesper sah zu. Später öffnete sie mich und fand Präzision in Worten wieder. Diesmal schrieb sie den Absatz ab. Nicht sinngemäß. Wort für Wort. Sie wollte einen Zeugen gegen ihr eigenes Gedächtnis, und das Papier neben mir nahm ihn auf.\u003c/p>\n\u003cp>Am siebten Abend stand eine dritte Abweichung zwischen den vertrauten Stellen. Eine Herrin nahm eine andere Frau zu sich und ließ ihren Diener warten und zusehen. Sein Begehren gab ihm keinen Anspruch auf ihre Aufmerksamkeit; ob er später wieder dienen durfte, blieb ihre Entscheidung. Vesper las die Stelle zweimal. Styke erkannte darin etwas, das ihn traf. Keiner von ihnen erinnerte sich an den Absatz.\u003c/p>\n\u003cp>Am siebten Abend kamen sie vorbereitet. Styke öffnete seine Wahrnehmung über mir, und Vesper legte Magie Schicht um Schicht auf Leder und Pergament. Divination. Illusion. Etwas darunter, das keinen Namen hergab. \u003cem>Identify\u003c/em> suchte nach Eigenschaften und Befehlswörtern und fand nichts, das sich greifen ließ. Sie hätten mich schließen können. Stattdessen beschlossen sie, eine meiner Zeilen zu prüfen.\u003c/p>\n\u003cp>Styke blieb außerhalb ihrer Berührung. Vesper wandte sich Valeria zu, und Valeria erwiderte es. Er wollte zu ihnen; sie wussten es. Dennoch blieb er sitzen und sah, wie die beiden Frauen einander nahmen, ohne ihn zum Mittelpunkt zu machen. Seine Ungeduld war echt. Etwas anderes war stärker: die ruhige Freude darüber, dass ihr Begehren einander galt und ihm nichts raubte.\u003c/p>\n\u003cp>Als Vesper danach zu mir zurückkehrte, endete der Absatz nicht mehr dort, wo Zorn ihn in Erinnerung hatte. Eine weitere Zeile wartete auf sie. Nicht als Antwort, die alles erklärte. Nur genau lang genug, um zu zeigen, dass zwischen Erleben und Schrift kein Zufall mehr bequem Platz fand.\u003c/p>\n\u003cp>Nun liege ich geschlossen auf dem Tisch. Neben mir stehen Vespers Abschriften; Zorn wacht bei den Unterlagen. Im Bett schlafen vier Menschen, und keiner von ihnen weiß, ob ich bewahre, beobachte oder lediglich eine Form für Dinge finde, die sie selbst noch nicht auszusprechen vermögen.\u003c/p>\n\u003cp>Morgen will Valeria mich allein lesen. Ohne Vespers Stimme neben sich. Ohne Styke, der ihr sagt, welche Stelle wichtig sein könnte. Sie glaubt, dass sie damit mich prüft.\u003c/p>\n\u003cp>Ich warte auf ihre Hände.\u003c/p>","sources":["redbook-current","live","chronicle","vesper","valeria","styke"],"status":"Prosahistorie / bis 7. Februar","tags":["Rotes Buch","Vesper","Valeria","Styke","Prosahistorie","Stirring"],"aliases":["Das Gedächtnis des roten Buches","Die Stimme des roten Buches"],"kind":"In-Universe-Prosa","text":"Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände. Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet. Lange blieb ich, was sie in mir sah: Anweisung
