summary":"Attribute, Kampfwerte, Fertigkeiten, Talente, Klassenfähigkeiten, Ausrüstung und alle verfügbaren Zauber- und Manöverlisten.","body":"<h2>Leseschlüssel</h2>\n<p>Dies ist der vollständige verfügbare Stufe-5-Bogen von <a href=\"#/artikel/valeria\">Valeria</a>, kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der <a href=\"#/artikel/spielstand\">aktuelle Spielstand</a> hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen.</p>\n<p>Die <a href=\"#/artikel/redaktion\">Quellenhinweise</a> benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das <a href=\"#/artikel/faehigkeiten-register\">Fähigkeitenregister</a> ergänzt alle belegten Regelkarten.</p>\n<h1>Valeria - Charakterbogen Stufe 5</h1>\n<p><strong>Frühere Identität:</strong> Dame Balina von Karfeld<br/>\n<strong>Quellenkonversion:</strong> Sir Balin von Karfeld -&gt; Dame Balina von Karfeld -&gt; Valeria; eine durchgehende Person<br/>\n<strong>Klasse:</strong> Fighter 5<br/>\n<strong>Volk:</strong> Mensch<br/>\n<strong>Herkunft:</strong> Karfeld, Talingarde<br/>\n<strong>Level:</strong> 5<br/>\n<strong>Geschlecht:</strong> Weiblich<br/>\n<strong>Gesinnung:</strong> aktuell nicht verbindlich neu festgelegt; Quellenursprung war LG<br/>\n<strong>Sprache:</strong> Common</p>\n<hr/>\n<h2>Attribute</h2>\n<table>\n<thead>\n<tr>\n<th>Attribut</th>\n<th style=\"text-align:right\">Wert</th>\n<th style=\"text-align:right\">Mod</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>STR</td>\n<td style=\"text-align:right\">18</td>\n<td style=\"text-align:right\">+4</td>\n</tr>\n<tr>\n<td>DEX</td>\n<td style=\"text-align:right\">12</td>\n<td style=\"text-align:right\">+1</td>\n</tr>\n<tr>\n<td>CON</td>\n<td style=\"text-align:right\">16</td>\n<td style=\"text-align:right\">+3</td>\n</tr>\n<tr>\n<td>INT</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n</tr>\n<tr>\n<td>WIS</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n</tr>\n<tr>\n<td>CHA</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Kampfwerte</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Aktueller sicherer Stand</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HP</strong></td>\n<td style=\"text-align:right\"><strong>42 / 42</strong></td>\n<td>HP-Stand unverändert; Erholung siehe aktuellen Spielstand</td>\n</tr>\n<tr>\n<td><strong>Initiative</strong></td>\n<td style=\"text-align:right\"><strong>+1</strong></td>\n<td>DEX +1</td>\n</tr>\n<tr>\n<td><strong>Speed</strong></td>\n<td style=\"text-align:right\"><strong>20 ft</strong></td>\n<td>in Plattenrüstung</td>\n</tr>\n<tr>\n<td><strong>BAB</strong></td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td>Fighter 5</td>\n</tr>\n<tr>\n<td><strong>CMB</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>BAB +5, STR +4</td>\n</tr>\n<tr>\n<td><strong>CMD</strong></td>\n<td style=\"text-align:right\"><strong>20</strong></td>\n<td>10 + BAB 5 + STR 4 + DEX 1</td>\n</tr>\n<tr>\n<td><strong>AC</strong></td>\n<td style=\"text-align:right\"><strong>20</strong>*</td>\n<td>10 +9 Platte +1 DEX, ohne geführten Schild</td>\n</tr>\n<tr>\n<td><strong>Touch AC</strong></td>\n<td style=\"text-align:right\"><strong>11</strong></td>\n<td>10 +1 DEX</td>\n</tr>\n<tr>\n<td><strong>Flat-Footed AC</strong></td>\n<td style=\"text-align:right\"><strong>19</strong>*</td>\n<td>10 +9 Platte</td>\n</tr>\n</tbody>\n</table>\n<p>* Der aktuelle Kampagnenstand setzt Plattenrüstung und ein <strong>Masterwork-Großschwert</strong>. Die Quelle führte ursprünglich masterwork full plate plus heavy steel shield. Der Schild ist <strong>nicht</strong> als aktuelle Ausrüstung etabliert. Der genaue Kauf-/Masterwork-Status der aktuellen Platte ist nicht vollständig festgelegt; der Rüstungsbonus der Full Plate bleibt davon unberührt.</p>\n<h3>Rettungswürfe</h3>\n<table>\n<thead>\n<tr>\n<th>Save</th>\n<th style=\"text-align:right\">Total</th>\n<th>Herleitung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fortitude</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td>Base +4, CON +3, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Reflex</strong></td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n<td>Base +1, DEX +1, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Will</strong></td>\n<td style=\"text-align:right\"><strong>+6</strong></td>\n<td>Base +1, WIS +2, Iron Will +2, Resistance +1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Bravery +1:</strong> zusätzlich +1 gegen Furchteffekte.</p>\n<hr/>\n<h2>Angriffe</h2>\n<table>\n<thead>\n<tr>\n<th>Angriff</th>\n<th style=\"text-align:right\">Treffer</th>\n<th style=\"text-align:right\">Schaden</th>\n<th style=\"text-align:right\">Kritisch</th>\n<th style=\"text-align:right\">Reichweite</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Masterwork-Großschwert</strong></td>\n<td style=\"text-align:right\"><strong>+11</strong></td>\n<td style=\"text-align:right\"><strong>2d6+7</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n<tr>\n<td><strong>Masterwork-Großschwert, Power Attack</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td style=\"text-align:right\"><strong>2d6+13</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n</tbody>\n</table>\n<p><em>Herleitung: BAB +5, STR +4, Weapon Training (Heavy Blades) +1 und Masterwork +1 auf Angriff. Zweihändiger STR-Schaden +6, dazu +1 Schaden durch Weapon Training. Power Attack gibt bei BAB +5 mit einer zweihändig geführten Waffe -2 Angriff und +6 Schaden.</em></p>\n<hr/>\n<h2>Fighter 5</h2>\n<ul>\n<li><strong>Bravery +1</strong>.</li>\n<li><strong>Armor Training 1</strong>.</li>\n<li><strong>Weapon Training (Heavy Blades) +1</strong>.</li>\n</ul>\n<hr/>\n<h2>OOC-Buildplanung</h2>\n<p>Die bereits besprochene zukünftige Planung steht <a href=\"#/artikel/buildplanung\">in einem getrennten Eintrag</a>. Aktuell gelten ausschließlich Fighter-5-Werte.</p>\n<hr/>\n<h2>Talente</h2>\n<ul>\n<li><strong>Cleave</strong>.</li>\n<li><strong>Iron Will</strong>.</li>\n<li><strong>Power Attack</strong>.</li>\n<li><strong>Step Up</strong>.</li>\n<li><strong>Weapon Focus (longsword)</strong>.</li>\n<li><strong>Weapon Specialization (longsword)</strong>.</li>\n</ul>\n<p>Die beiden Longsword-Talente stammen aus dem ursprünglichen Fighter-5-Statblock. Sie greifen nur, wenn Valeria tatsächlich ein Longsword benutzt; sie werden nicht automatisch auf ihre derzeit offene zweihändige Waffe übertragen.</p>\n<hr/>\n<h2>Fertigkeiten</h2>\n<p>Die folgenden Totale stammen aus dem ursprünglichen Fighter-5-Statblock und bleiben als sichere Fähigkeitsbasis erhalten, soweit keine aktuelle Ausrüstungsänderung einen Armor-Check-Penalty-sensitive Skill verändert:</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Intimidate</strong></td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td>Quellenwert</td>\n</tr>\n<tr>\n<td><strong>Knowledge (nobility)</strong></td>\n<td style=\"text-align:right\"><strong>+1</strong></td>\n<td>inkl. Child of the Temple</td>\n</tr>\n<tr>\n<td><strong>Knowledge (religion)</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td>inkl. Child of the Temple; Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Ride</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong>*</td>\n<td>Quellenwert; aktuelle ACP-Abhängigkeit nicht neu verifiziert</td>\n</tr>\n<tr>\n<td><strong>Survival</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td>Quellenwert</td>\n</tr>\n<tr>\n<td><strong>Perception</strong></td>\n<td style=\"text-align:right\"><strong>+2</strong></td>\n<td>aus WIS +2, keine eigenen Ränge im Quellenstatblock ausgewiesen</td>\n</tr>\n</tbody>\n</table>\n<p>* Da der genaue Masterwork-/ACP-Status der aktuellen Platte offen ist, sollte Ride vor einem relevanten Check gegen die endgültige Rüstungsausrüstung neu abgeglichen werden.</p>\n<hr/>\n<h2>Trait</h2>\n<p><strong>Child of the Temple:</strong> +1 Trait-Bonus auf Knowledge (nobility) und Knowledge (religion); Knowledge (religion) ist Klassenfertigkeit.</p>\n<hr/>\n<h2>Aktuelle Ausrüstung</h2>\n<ul>\n<li><strong>Plattenrüstung</strong>; genaue Kauf-/Masterwork-Details nicht vollständig fixiert.</li>\n<li><strong>Masterwork-Großschwert</strong>.</li>\n<li><strong>Cloak of Resistance +1</strong>; getragen und in den Saves eingerechnet.</li>\n<li>Das frühere <strong>silberne Saphir-Symbol der Ritter des Alerion</strong> befindet sich bei <a href=\"#/artikel/styke\">Styke</a>, nicht bei Valeria.</li>\n<li>Alte Quellengegenstände wie Longsword, Dagger, Heavy Steel Shield, Potion of <a href=\"#/artikel/cure-light-wounds\">Cure Light Wounds</a> und der ursprüngliche komplette Ausrüstungssatz kehren nicht automatisch zurück.</li>\n</ul>\n","sources":["valsheet","valeria","localrules","live"],"status":"Bestätigt","tags":["Valeria","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Valeria","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Valeria , kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der aktuelle Spielstand hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen. Die Quellenhinweise benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das Fähigkeitenregister ergänzt alle belegten Regelkarten. Valeria - Charakterbogen Stufe 5 Frühere Identität: Dame Balina von Karfeld Q zuruck"},{"id":"faehigkeiten-register","category":"regeln","title":"So benutzt du das Fähigkeitenregister","summary":"Alle gelisteten Zauber, Manöver, Haltungen, Kräfte und Glyphen sind einzeln suchbar.","body":"<h2>Drei Ebenen</h2>\n<p>Die <strong>vollständigen Bögen</strong> enthalten alle verfügbaren Charaktereinträge und Werte. Das <strong>Fähigkeitenregister</strong> macht diese Namen einzeln auffindbar. Wo im Repository <strong>ausgeschriebene operative Regelkarten</strong> vorliegen, sind sie inhaltlich integriert.</p>\n<h2>Kein erfundener Volltext</h2>\n<p>Nicht jeder Zauber und jede Kraft hat im Repository einen vollständigen Regeltext. Solche Einträge zeigen die belegte Kurzfunktion und sagen, welche Detailparameter in der Quelle fehlen. Das ist bewusst kein Anspruch, sämtliche Original-Regelbücher offline zu ersetzen.</p>\n<h2>Aktuelle Besonderheiten</h2>\n<p>Die zwei Schreibweisen Reflective/<a href=\"#/artikel/reflective-blade-style\">Reflected Blade Style</a> werden gemeinsam gefunden. Staunching Strikes ausgeschriebene Heilwerte sind die Werte <strong>Vespers</strong>. Tages-Slotkapazitäten bedeuten nicht, dass eine volle Rast bereits abgeschlossen wurde. Vorbereitete Manöver unterscheiden sich von bloß bekannten; die Standardvorbereitung ist keine automatische Aktionsentscheidung.</p>\n","sources":["ssheet","vsheet","srules","vrules"],"status":"Bestätigt","tags":["Nachschlagen","Regeltext"],"aliases":[],"text":"Drei Ebenen Die vollständigen Bögen enthalten alle verfügbaren Charaktereinträge und Werte. Das Fähigkeitenregister macht diese Namen einzeln auffindbar. Wo im Repository ausgeschriebene operative Regelkarten vorliegen, sind sie inhaltlich integriert. Kein erfundener Volltext Nicht jeder Zauber und jede Kraft hat im Repository einen vollständigen Regeltext. Solche Einträge zeigen die belegte Kurzfunktion und sagen, welche Detailparameter in der Quelle fehlen. Das ist bewusst kein Anspruch, sämtliche Original-Regelbücher offline zu ersetzen. Ak  die Kampagne. Verborgene GM-Zustände und zukünftige Abenteuerinhalte wurden nicht in das ausgelieferte Datenpaket übernommen.</p>\n<h2>Sichtbar aufgelöste Unterschiede</h2>\n<p><strong>Spielstand:</strong> Der aktuelle LIVE_STATE steht am frühen Morgen des 1. Februar, mit <a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/verse\">Verse</a> bereits aufgebrochen. Die Zeitleiste endet in ihrer älteren Gegenwartspassage noch beim Einschlafen; einige Ortsakten stehen sogar auf dem 28. Januar. Die Website verwendet für das Jetzt den neueren Live-State, ohne die älteren Akten stillschweigend als aktuelles Geschehen auszugeben.</p>\n<p><strong><a href=\"#/artikel/styke\">Styke</a>:</strong> Helle Haut ist die ausdrücklich korrigierte Fassung. Eine abweichende dunkle Hautbeschreibung in der allgemeinen Abstammungsdatei wird nicht erneut übernommen. Bei Grad-0-Talenten bestätigt das aktuelle Git <a href=\"#/artikel/empathy\">Empathy</a> und <a href=\"#/artikel/conceal-thoughts\">Conceal Thoughts</a> und lässt das dritte offen; die zusätzlichen Namen des älteren hochgeladenen Bogens werden nicht als gesicherte aktive Talente geführt.</p>\n<p><strong>Namen:</strong> <a href=\"#/artikel/mara\">Mara Fenner</a>/Hazel und <a href=\"#/artikel/ellyn\">Ellyn Reed</a>/Sunny sind jeweils dieselbe Figur. <a href=\"#/artikel/copper-server\">Die kupferhaarige Bedienung</a> ist eine gesonderte namenlose Person. <a href=\"#/artikel/valeria\">Valeria</a> und Dame Balina sind dieselbe Frau. Jacobian heißt im aktuellen Repository Scaramore.</p>\n<p><strong>Besitz und Ort:</strong> Das Exorzistenbuch gehört Styke, ist aber zuletzt auf dem Tisch im Mott-Haus belegt. Das rote Buch ist ein anderer Gegenstand. Kettenbesitz ist nicht Kettenmontage; verkaufte Elfenbeinposten sind kein gegenwärtiges Inventar.</p>\n<p><strong>Mechanik:</strong> Reflective und <a href=\"#/artikel/reflective-blade-style\">Reflected Blade Style</a> sind unterschiedliche Schreibweisen der abgeglichenen Karte. Die Stufe-5-Werte bleiben erhalten. Ungeklärte HP-Formel, Valerias Rüstungs-/Ride-Detail und nicht ausgeschriebene Zauberparameter werden nicht eigenmächtig neu berechnet.</p>\n<h2>Profile und Beziehungen</h2>\n<p>Psychologische Profile sind quellengestützte Spielinterpretationen, keine Diagnosen und kein Zugriff auf verborgene gegenwärtige Absichten eines NPC. Eine Affäre ist keine Rekrutierung; ein Verdacht ist keine bewiesene Schuld; ein Plan ist kein Ergebnis. Die Beziehungskarte verwendet keine erfundenen Loyalitätswerte.</p>\n<h2>Aktualisierung</h2>\n<p>Lesestand der Website: <strong>13. September 2026</strong>. Kampagnenstand: <strong>1. Februar 4712 AR, früher Morgen</strong>. Die Seite ist vollständig lokal nutzbar. Jeder Push in den Veröffentlichungszweig löst über GitHub Pages ein neues Deployment aus; Inhalte aus dem privaten Kampagnenrepository werden weiterhin erst nach redaktioneller Prüfung übernommen. Ungefiltertes Spiegeln der GM-Dateien würde den Spoilerschutz aufheben.</p>\n<p>Jeder Artikel nennt seine Quellenakten. Bei privaten oder spoilerhaltigen Rohakten wird nur die Quellenbezeichnung gezeigt, nicht der gesamte Rohinhalt ausgeliefert. Das Quellenregister enthält die beim Abruf gelieferten Blob-Kennungen zur Nachvollziehbarkeit.</p>\n<h2>Gesonderter Nachtrag: Privatbereich (18+)</h2>\n<p>Version 1.1 ergänzt einen Bereich ab 18 mit eigener Altersbestätigung. Der allgemeine Spielstand bleibt beim bisherigen frühen Morgen; datierte Beziehungsnachträge reichen bis zum inzwischen dokumentierten privaten Vormittag. Eine vollständige Synchronisation aller Tagesereignisse ist damit nicht behauptet.</p>\n<p>Die Altersabfrage blendet die zugeordneten Artikel und Verbindungen in der Anwendung aus. Sie ist keine verifizierte Altersprüfung, kein Passwortschutz und keine Verschlüsselung. Der Seitenquelltext und der bearbeitbare Datenbestand enthalten die Texte. Spoilerwissen bleibt weiterhin ausgeschlossen.</p>\n","sources":["live","timeline","house","rela .</p>\n<p><a href=\"#/artikel/intim-tamsin\">Blutpakt und Begehren</a> · <a href=\"#/artikel/tamsin\">öffentliche Akte</a></p>","sources":["intim-tamsin"],"status":"Kanonisch","tags":["Ab 18","Körper & Anatomie","Tamsin"],"aliases":["Tamsin Anatomie","Tamsin Brüste","Tamsin Vulva","Tamsin Rasur"],"adult":true,"owner":["Tamsin"],"kind":"Körper & Anatomie","dateLabel":"Körperakte: 10.09.2026","evidence":"Git-Dokumentation","text":"Kein Ritterkörper Tamsin ist kompakt und robust. Ihre Kraft kommt aus Wachen, Tragen, Kämpfen und einem Leben, in dem der Körper Werkzeug war, nicht aus jahrelangem elitärem Reit- und Rüstungstraining. Sie trägt mehr Weichheit an Taille, Brust, Hüften und Oberschenkeln als Valeria. Brust Ihre Brüste sind groß und schwer, breit auf dem Brustkorb angesetzt, mit deutlich mehr natürlichem Zug nach unten als bei Vesper oder Valeria. Große warm braunrosé Warzenhöfe und vergleichsweise ausgeprägte Brustwarzen geben ihnen einen anderen, gröberen Realismus als Kaitlyns gepflegte Rundung. Rasur Tamsin soll ihre Schamregion rasiert halten. Das heißt nicht, dass sie immer spiegelglatt ist. Wenn Zeit vergangen ist, gehören kurze dunkle Stoppeln, etwas Rasurreizung oder ein nicht ganz perfekter Rand zur normalen Körperlichkeit. Ihr natürlicher Haarwuchs ist dunkelbraun und deutlich dichter als Valerias feines, spärliches Blond. Vulva Die äußeren Labien sind voller; die inneren Labien bleiben in Ruhe eher teilweise sichtbar. Das intime Gewebe ist tiefer rosébraun als die umliegende Haut und dunkelt mit Erregung nach. Tamsins Körper darf kleine Narben, Druckstellen, blaue Flecken, Schweiß und Arbeitsspuren tragen, wenn die Szene sie verursacht hat. Sie ist keine höfisch polierte Statue. Blutpakt und Begehren · öffentliche Akte","search":"tamsin der korper der warterin kompakt kraftig und weicher als valeria schwere brust breite huften und eine rasierte intimzone die gepflegt werden muss tamsin anatomie tamsin bruste tamsin vulva tamsin rasur ab 18 korper an function doSearch(q){const terms=norm(q).split(/\s+/).filter(Boolean),cat=$('#search-category').value;let scored=[];if(terms.length)for(const a of ARTICLES){if(cat&&a.category!==cat)continue;if(!terms.every(t=>a.search.includes(t)))continue;let score=terms.reduce((n,t)=>n+(norm(a.title)===t?90:norm(a.title).includes(t)?35:0)+(a.aliases.some(x=>norm(x).includes(t))?32:0)+(norm(a.summary).includes(t)?12:0),0);scored.push({a,score})}scored.sort((a,b)=>b.score-a.score||a.a.title.localeCompare(b.a.title,'de'));$('#search-count').textContent=scored.length+' Treffer';$('#search-results').innerHTML=!terms.length?'<div class="empty"><h2>Ein Name reicht als Anfang.</h2><p>Zum Beispiel Hazel, Torhaus, Verse, Chains of Doubt oder Eintopf.</p></div>':!scored.length?'<div class="empty"><h2>Kein passender Eintrag</h2><p>Ein k&uuml;rzerer Suchbegriff oder eine andere Schreibweise hilft oft weiter.</p></div>':scored.map(({a})=>{let pos=norm(a.text).indexOf(terms[0]);let start=Math.max(0,pos-85),excerpt=(start?'... ':'')+a.text.slice(start,start+245)+(a.text.length>start+245?' ...':'');return `<article class="search-result"><div class="meta-line"><span class="kicker">${esc(CATS[a.category].title)}</span>${badge(a)}</div><h3><a href="#/artikel/${a.id}">${highlight(a.title,q)}</a></h3><p>${highlight(a.summary,q)}</p>${a.aliases.some(x=>terms.some(t=>norm(x).includes(t)))?`<div class="meta-line">Auch bekannt als: ${a.aliases.map(esc).join(', ')}</div>`:''}<p class="excerpt">${highlight(excerpt,terms[0])}</p></article>`}).join('')}

function graphData(){if(graphPerson){const edges=DATA.edges.filter(e=>e.a===graphPerson||e.b===graphPerson);return {edges,nodes:[...new Set([graphPerson,...edges.flatMap(e=>[e.a,e.b])])]} }const own=ARTICLES.filter(a=>a.group===graphGroup).map(a=>a.id);let edges=DATA.edges.filter(e=>own.includes(e.a)&&own.includes(e.b));let ids=[...new Set(edges.flatMap(e=>[e.a,e.b]))];let extra=DATA.edges.filter(e=>(own.includes(e.a)||own.includes(e.b))&&!edges.includes(e));for(const e of extra){if(ids.length>=16)break;const candidates=[e.a,e.b].filter(id=>!ids.includes(id));if(ids.length+candidates.length<=16){edges.push(e);ids.push(...candidates)}}return{edges,nodes:ids}}
function renderGraph(){const gd=graphData(),nodes=gd.nodes;let pos={};const w=760,h=620,cx=380,cy=294;let center=graphPerson||({inner:'styke',town:'kaitlyn',garrison:'havelyn',field:'hakon',history:'elise'})[graphGroup];if(!nodes.includes(center))center=nodes[0];pos[center]=[cx,cy];const others=nodes.filter(n=>n!==center);others.forEach((id,i)=>{let angle=-Math.PI/2+2*Math.PI*i/Math.max(others.length,1);let radius=others.length>17&&i%2?172:242;pos[id]=[cx+Math.cos(angle)*radius*1.1,cy+Math.sin(angle)*radius]});let out=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Beziehungsnetz mit ${nodes.length} Figuren. Dieselben Verbindungen sind darunter als Text verfuegbar."><title>Beziehungsnetz</title><desc>Aktivierbare Personen-Knoten. Die anschliessende Textliste enthaelt alle sichtbaren Verbindungen.</desc>`;gd.edges.forEach(e=>{if(!pos[e.a]||!pos[e.b])return;let [x1,y1]=pos[e.a],[x2,y2]=pos[e.b];out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="graph-edge ${edgeIsHyp(e)?'hypothesis':'hot'}"><title>${esc(BYID[e.a].title+' / '+BYID[e.b].title+': '+e.label)}</title></line>`});nodes.forEach(id=>{const a=BYID[id],[x,y]=pos[id],short=a.title.replace(/Captain |Dame |Cardinal |Father |Kardinal |Magisterin /g,'');const label=({zack:'Zack Eddarly',havelyn:'Thomas Havelyn',thorn:'Adrastus Thorn',joseph:'Joseph',tiadora:'Tiadora'})[id]||short;let words=label.split(' '), lines=[''];for(const word of words){let k=lines.length-1;if((lines[k]+' '+word).trim().length>15 && lines[k] && lines.length<2)lines.push(word);else lines[k]+=(lines[k]?' ':'')+word;}lines=lines.map(t=>t.length>22?t.slice(0,20)+'\u2026':t);const initial=label.charAt(0);out+=`<g class="graph-node ${id===graphPerson?'selected':''}" data-person="${id}" role="button" tabindex="0" aria-label="${esc(a.title)} in den Mittelpunkt stellen" transform="translate(${x},${y})"><circle r="${id===center?31:23}"/><text class="initial" text-anchor="middle" y="7">${esc(a.initial||initial)}</text><text text-anchor="m function renderGraphSide(){if(!graphPerson){$('#graph-side').innerHTML=`<span class="eyebrow">${esc(GROUPS[graphGroup])}</span><h3>Eine Figur w&auml;hlen.</h3><p>Ein Klick stellt ihre Verbindungen in den Mittelpunkt. Die Auswahl enth&auml;lt nur dokumentierte Achsen, keine erfundenen Sympathie- oder Loyalit&auml;tswerte.</p><p>Nicht jede Linie ist gegenseitiges Vertrauen. Eine Aff&auml;re ist kein B&uuml;ndnis, ein Dienstverh&auml;ltnis keine Freundschaft.</p>`;return}let a=BYID[graphPerson],edges=DATA.edges.filter(e=>e.a===a.id||e.b===a.id);$('#graph-side').innerHTML=`<span class="eyebrow">Im Mittelpunkt</span><h3>${esc(a.title)}</h3>${badge(a)}<p style="margin-top:13px">${esc(a.summary)}</p><a class="button small" href="#/artikel/${a.id}">Charakterakte &ouml;ffnen &#8599;</a><div style="margin-top:20px">${edges.map(e=>{let other=e.a===a.id?e.b:e.a;return `<div class="relation-small"><strong>${at(other)}</strong><p>${esc(e.label)}</p></div>`}).join('')}</div>`}
function renderRelationList(){const gd=graphData(),q=norm($('#relation-query')?.value||'');let edges=($('#relation-scope')?.value==='all'?DATA.edges:gd.edges).filter(e=>!q||norm([BYID[e.a].title,BYID[e.b].title,e.label,e.detail].join(' ')).includes(q));$('#relation-count').textContent=edges.length+' sichtbare Verbindungen';$('#relation-list').innerHTML=edges.map(e=>`<article class="relation-card"><h3>${at(e.a)} <span class="dim">&#8596;</span> ${at(e.b)}</h3><span class="badge ${edgeIsHyp(e)?'uncertain':''}">${esc(e.label)}</span><p>${esc(e.detail)}</p>${e.article&&BYID[e.article]?`<p>${at(e.article,'Ausführlichen Beleg lesen')}</p>`:''}<div class="date-stamp" style="margin-top:9px">${esc(e.status)} &middot; ${esc(DATA.sources[e.source]?.title||'Kampagnendossier')}</div></article>`).join('')||'<div class="empty">Keine Verbindung im gew&auml;hlten Ausschnitt.</div>'}

function download(content,name,type='application/json'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bindNotes(){$('#notebook').oninput=()=>{state.notebook=$('#notebook').value;$('#notebook-status').textContent=persist()?'Lokal gespeichert.':'Nur in dieser Sitzung. Bitte exportieren.'};$('#export-notes').onclick=()=>download(JSON.stringify(notesExport(),null,2),'WotW_meine_Notizen.json');$('#import-notes').onclick=()=>$('#import-file').click();$('#import-file').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>3000000){toast('Sicherung ist zu gross.');return}try{let x=JSON.parse(await f.text());if(x.format!=='wotw-notes-1'||typeof x.notebook!=='string'||!x.notes||typeof x.notes!=='object'||Array.isArray(x.notes)||!Array.isArray(x.favs))throw Error();let n=Object.fromEntries(Object.entries(x.notes).filter(([id,t])=>RAW_BYID[id]&&typeof t==='string'));if(!confirm('Importierte Notizen mit deinen lokalen Notizen zusammenfuehren? Abweichende Texte bleiben beide erhalten.'))return;for(const[id,t]of Object.entries(n)){if(state.notes[id]&&state.notes[id]!==t)state.notes[id]+='\n\n[Importierte Notiz]\n'+t;else state.notes[id]=t}if(x.notebook&&x.notebook!==state.notebook)state.notebook=state.notebook?state.notebook+'\n\n[Importiertes Kampagnenbuch]\n'+x.notebook:x.notebook;state.favs=[...new Set([...state.favs,...x.favs.filter(id=>RAW_BYID[id])])];if(typeof x.adultNotebook==='string'&&x.adultNotebook&&x.adultNotebook!==state.adultNotebook)state.adultNotebook=state.adultNotebook?state.adultNotebook+'\n\n[Importierte private Notiz]\n'+x.adultNotebook:x.adultNotebook;persist();route();toast('Sicherung zusammengefuehrt.')}catch(err){toast('Diese Datei ist keine gueltige WotW-Notizsicherung.')}}}
function sources(){return pageHead('Quellen & Lesestand','Ein Wiki mit nachvollziehbaren Wurzeln.','Die Artikel basieren auf den Kampagnenakten in danceofruin/wotwGPT und den vorhandenen Charakterunterlagen. Das Roharchiv mit GM-Geheimnissen wird nicht mitgeliefert.')+`<div class="panel"><div class="eyebrow">Diese Ausgabe</div><h2 style="margin:12px 0">1. Februar 4712 AR, sp&auml;ter am Tag</h2><p>Abgerufen und redaktionell zusammengestellt am 10. September 2026. ${ARTICLES.length} Eintr&auml;ge, ${DATA.edges.length} Beziehungsachsen. Die Website ist ein statischer Snapshot. Es gibt keinen automatischen GitHub-Abgleich und keine direkte Bearbeitung der Quelldateien.</p><a class="button small" href="#/artikel/redaktion">Quellenkonflikte und Redaktionsentscheidungen</a></div><div class="note">Die Kennungen unten sind <strong>Datei-Blob-SHAs</strong>, keine behaupteten globalen Commit-IDs. Lokale Anh&auml;nge haben keine Git-Blob-Kennung. Die Referenzen dienen dem Abgleich; die Originaldateien enthalten teils gemischtes Spieler- und GM-Wissen und sind nicht Bestandteil dieser Website.</div>${adultUnlocked?'<div class="note">Ab-18-Akten: intime Beziehungsgeschichte bis zum privaten Vormittag des 1. Februar; Körperkontinuität und Kaitlyns wiederhergestellte Entwicklung wurden am 10. September ergänzt.</div>':''}${section('Verwendete Akten')}<div class="grid two">${Object.values(DATA.sources).map(s=>`<article class="card source-card"><h3>${esc(s.title)}</h3><code>${esc(s.path)}</code>${s.sha?`<div class="hash">Blob: ${esc(s.sha)}</div>`:`<div class="hash">${s.kind==='player-clarification'?'Spielerpräzisierung in dieser Unterhaltung':'Bereitgestellter lokaler Anhang'}</div>`}</article>`).join('')}</div><div class="note">Way of the Wicked: Gary McBride / Fire Mountain Games. Pathfinder und die genannten Regelmodule bleiben ihren jeweiligen Urhebern zugeordnet. Dies ist eine private, redaktionelle Kampagnenhilfe, keine offizielle Publikation und keine vollst&auml;ndige Wiedergabe der Abenteuerb&auml;nde.</div>`}
function route(){let raw=location.hash.startsWith('#/')?location.hash.slice(2):'start';let [path,qs]=raw.split('?'),parts=path.split('/'),params=new URLSearchParams(qs||'');let view=parts[0]||'start',id=parts[1],out='';setMenu(false);updateAgeToggle();const restricted=(view==='ab18')||(view==='artikel'&&RAW_BYID[id]?.adult)||(view==='kategorie'&&RAW_DATA.categories[id]?.adult);if(restricted&&!adultUnlocked){showAgeGate(location.hash||'#/ab18');return;}switch(view){case'ab18':out=adultHub();break;case'start':out=home();break;case'artikel':out=article(BYID[id]);break;case'kategorie':out=category(id);break;case'suche':out=searchPage(params.get('q')||'');break;case'chronik':out=timelinePage();break;case'beziehungen':out=relationships(params);break;case'favoriten':out=favorites();break;case'notizen':out=notes();break;case'quellen':out=sources();break;default:out=notFound()}
$('#main').innerHTML=out;let title=view==='artikel'?BYID[id]?.title:view==='kategorie'?CATS[id]?.title:({ab18:'Private Akten (ab 18)',start:'Am Spieltisch',chronik:'Chronik',beziehungen:'Beziehungsatlas',suche:'Suche',favoriten:'Lesezeichen',notizen:'Notizen',quellen:'Quellen'})[view];document.title=(title||'Archiv')+' | Der Nessische Knoten';document.querySelectorAll('.nav-link').forEach(a=>{let active=(view==='artikel'&&RAW_BYID[id]?.adult&&a.dataset.nav==='ab18')||(view==='kategorie'&&id==='intimitaet'&&a.dataset.nav==='ab18')||a.dataset.nav===path||(view==='artikel'&&a.dataset.nav==='kategorie/'+BYID[id]?.category);a.classList.toggle('active',active);active?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
if(view==='ab18')bindAdultHub();bindAgeLock();if(view==='kategorie'&&CATS[id])bindCategory(id);if(view==='suche'){$('#global-search').value=params.get('q')||'';$('#search-category').onchange=()=>doSearch(params.get('q')||'');doSearch(params.get('q')||'')}if(view==='chronik'){$('#phase-filter').onchange=updateTimeline;updateTimeline()}if(view==='beziehungen')bindGraph();if(view==='notizen')bindNotes();if(view==='artikel'&&BYID[id]){const n=$('#article-note');n.oninput=()=>{state.notes[id]=n.value;$('#note-status').textContent=persist()?'Lokal gespeichert.':'Nur in dieser Sitzung. Bitte Notizen exportieren.'};$('#print-btn').onclick=()=>window.print();$('#jump-note').onclick=()=>{$('#article-note-section').scrollIntoView({behavior:'smooth'});n.focus({preventScroll:true})}}
document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;if(state.favs.includes(id))state.favs=state.favs.filter(x=>x!==id);else state.favs.push(id);persist();let on=state.favs.includes(id);b.innerHTML=on?'&#9733; Gespeichert':'&#9734; Lesezeichen';b.classList.toggle('active',on);toast(on?'Lesezeichen gespeichert.':'Lesezeichen entfernt.')});
document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll)?.scrollIntoView({behavior:'smooth'})});window.scrollTo({top:0,left:0,behavior:"instant"})}

function notesExport(){
 const out={format:'wotw-notes-1',exported:new Date().toISOString(),scope:adultUnlocked?'all-unlocked':'public-only',notebook:state.notebook,notes:Object.fromEntries(Object.entries(state.notes).filter(([id])=>BYID[id])),favs:state.favs.filter(id=>BYID[id])};
 if(adultUnlocked)out.adultNotebook=state.adultNotebook;
 return out;
}
function privateBanner(){return '<div class="private-banner"><span><strong>18+</strong> Private Charakterakten</span><div class="actions"><a class="button small" href="#/ab18">Zur \u00dcbersicht</a><button class="button small" data-lock-adult>Wieder sperren</button></div></div>';}
function updateAgeToggle(){const b=$('#age-toggle');b.textContent=adultUnlocked?'18\u2212':'18+';b.setAttribute('aria-label',adultUnlocked?'Erwachsenenbereich wieder sperren':'Erwachsenenbereich \u00f6ffnen');b.title=adultUnlocked?'Ab 18 freigegeben: wieder sperren':'Ab 18: Altersbest\u00e4tigung';b.classList.toggle('active',adultUnlocked);b.onclick=()=>adultUnlocked?lockAdult():location.hash='/ab18';}
function bindAgeLock(){document.querySelectorAll('[data-lock-adult]').forEach(b=>b.onclick=lockAdult);}
function lockAdult(){
 adultUnlocked=false;try{sessionStorage.removeItem(AGE_SESSION);}catch(e){}
 refreshVisibleData();navigation();$('#global-search').value='';
 location.hash='/ab18';route();
 toast('Erwachsenenbereich gesperrt. Private Notizen bleiben gespeichert.');
}
function showAgeGate(target){
 document.title='Altersbest\u00e4tigung | Der Nessische Knoten';
 document.querySelectorAll('.nav-link').forEach(a=>{const on=a.dataset.nav==='ab18';a.classList.toggle('active',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});
 $('#main').innerHTML=`<section id="age-gate" class="age-gate"><div class="age-seal" aria-hidden="true">18</div><div class="eyebrow">Der private Teil des Archivs</div><h1 id="age-title" tabindex="-1">Nur f\u00fcr Erwachsene.</h1><p class="age-intro">Dieser Bereich dokumentiert intime Beziehungen, sexuelle Vorlieben und detaillierte K\u00f6rpermerkmale erwachsener fiktiver Figuren.</p><p class="muted">Er bleibt im Wiki ausgeblendet, bis du dein Alter best\u00e4tigst. Auch Suche, Vorschauen, Lesezeichen und Beziehungsatlas zeigen vorher keine Eintr\u00e4ge aus diesem Bereich.</p><form id="age-form"><label class="age-check" for="age-confirm"><input id="age-confirm" type="checkbox" required><span>Ich bin mindestens 18 Jahre alt und m\u00f6chte diese Inhalte sehen.</span></label><div class="actions age-gate-actions"><button id="age-accept" class="button primary" type="submit" disabled>Erwachsenenbereich \u00f6ffnen</button><a class="button" href="#/start">Ohne Freigabe zur\u00fcck</a></div></form><div class="age-small">Die Best\u00e4tigung gilt f\u00fcr diese Tab-Sitzung und kann jederzeit widerrufen werden. Keine Ausweisdaten, kein Geburtsdatum, keine Serveranfrage.</div><details class="age-tech"><summary>Was die Altersabfrage technisch leistet</summary><p>Dies ist eine lokale Selbstauskunft und Anzeige-Sperre, keine verifizierte Alterspr\u00fcfung, kein Passwortschutz und keine Verschl\u00fcsselung. HTML-Datei und bearbeitbarer Datenbestand enthalten die Texte im Klartext. Sie sind nicht f\u00fcr eine gesch\u00fctzte \u00f6ffentliche Bereitstellung gedacht.</p></details></section>`;
 $('#age-confirm').onchange=()=>{$('#age-accept').disabled=!$('#age-confirm').checked;};
 $('#age-form').onsubmit=e=>{e.preventDefault();if(!$('#age-confirm').checked)return;adultUnlocked=true;try{sessionStorage.setItem(AGE_SESSION,'confirmed');}catch(err){}refreshVisibleData();navigation();const dest=target.startsWith('#/')?target:'#/ab18';if(location.hash===dest)route();else location.hash=dest;toast('Private Akten f\u00fcr diese Sitzung freigegeben.');};
 window.scrollTo({top:0,left:0,behavior:"instant"});$('#age-title').focus({preventScroll:true});
}
function adultHub(){
 const arr=ARTICLES.filter(a=>a.adult),owners=[...new Set(arr.flatMap(a=>a.owner||[]))].sort((a,b)=>a.localeCompare(b,'de')),kinds=[...new Set(arr.map(a=>a.kind))].sort((a,b)=>a.localeCompare(b,'de'));
 return privateBanner()+`<header class="private-hero"><div class="eyebrow">Der Nessische Knoten / Ab 18</div><h1>Die privaten Akten.</h1><p>K\u00f6rper, Begehren, Scham und Macht. ${arr.length} erwachsene Eintr\u00e4ge \u00fcber das, was unter R\u00fcstung, Kleidern und guten Manieren \u00fcbrig bleibt.</p><div class="private-shortcuts">${[['K\u00f6rper & Anatomie','K\u00f6rper & Anatomie'],['Profil','Vorlieben & Erfahrungen'],['Beziehungsachse','Beziehungsachsen'],['Chronik','Intime Chronik']].map(([k,t])=>`<button class="button" data-adult-kind="${esc(k)}">${esc(t)}</button>`).join('')}</div></header><div class="private-notes"><p><strong>Dies ist kein Regelanhang.</strong> Die Akten sind als dunkler privater Codex geschrieben: k\u00f6rperlich, konkret und charakterbezogen. Quellen und Kanongrenzen bleiben im Hintergrund jedes Artikels nachpr\u00fcfbar.</p><p><strong>Stand:</strong> intime Geschichte bis zum privaten Vormittag des 1. Februar 4712 AR; K\u00f6rper- und Kaitlyn-Akten redaktionell am 10. September 2026 erg\u00e4nzt. Der allgemeine Spielstand reicht bis sp\u00e4ter am selben Tag.</p></div><div class="filterbar private-filters"><label class="sr-only" for="adult-query">Private Akten durchsuchen</label><input id="adult-query" type="search" placeholder="Begriff oder Merkmal suchen ..."><label class="sr-only" for="adult-owner">Figur</label><select id="adult-owner"><option value="">Alle Figuren</option>${owners.map(o=>`<option>${esc(o)}</option>`).join('')}</select><label class="sr-only" for="adult-kind">Eintragstyp</label><select id="adult-kind"><option value="">Alle Typen</option>${kinds.map(k=>`<option>${esc(k)}</option>`).join('')}</select><label class="sr-only" for="adult-evidence">Belegart</label><select id="adult-evidence"><option value="">Alle Belegarten</option><option value="git">Nur Git-Dokumentation</option><option value="player">Mit Spielerpr\u00e4zisierung</option></select><button id="adult-reset" class="button small">Filter zur\u00fccksetzen</button><span id="adult-count" class="result-count" aria-live="polite"></span></div><div id="adult-results"></div><section id="adult-notebook-editor" class="panel private-notebook"><div class="eyebrow">Pers\u00f6nlich / nur lokal</div><h2>Meine privaten Notizen</h2><p class="muted">Dieses Notizbuch und Notizen an privaten Artikeln verschwinden beim Sperren aus der Oberfl\u00e4che. Sie werden im Browser unverschl\u00fcsselt gespeichert und \u00e4ndern keine Git-Datei.</p><label class="sr-only" for="adult-notebook">Privates Notizbuch</label><textarea class="note-area" id="adult-notebook" placeholder="Eigene Erg\u00e4nzungen und R\u00fcckfragen ...">${esc(state.adultNotebook)}</textarea><div class="save-status" id="adult-note-status">${storageOK?'Lokale Speicherung bereit.':'Nur diese Sitzung. Bitte exportieren.'}</div><div class="actions"><button class="button small" id="adult-export">Alle Notizen einschlie\u00dflich Ab 18 exportieren</button><a class="button small" href="#/notizen">Sicherung importieren</a></div></section><div class="note">Die Altersabfrage ist eine lokale Anzeige-Sperre. Der Quelltext und das ZIP enthalten unverschl\u00fcsselte Daten. Verborgene Abenteuer- und GM-Geheimnisse geh\u00f6ren weiterhin nicht zu dieser Ausgabe.</div>`;
}
function bindAdultHub(){
 const arr=ARTICLES.filter(a=>a.adult);
 const update=()=>{const terms=norm($('#adult-query').value).split(/\s+/).filter(Boolean),owner=$('#adult-owner').value,kind=$('#adult-kind').value,evidence=$('#adult-evidence').value;const rows=arr.filter(a=>terms.every(t=>a.search.includes(t))&&(!owner||a.owner?.includes(owner))&&(!kind||a.kind===kind)&&(!evidence||((evidence==='player')===a.sources.includes('intim-player'))));$('#adult-count').textContent=rows.length+' von '+arr.length+' Eintr\u00e4gen';$('#adult-results').innerHTML=cards(rows);document.querySelectorAll('[data-adult-kind]').forEach(b=>b.classList.toggle('active',b.dataset.adultKind===kind));};
 ['#adult-query','#adult-owner','#adult-kind','#adult-evidence'].forEach(s=>$(s).addEventListener($(s).tagName==='INPUT'?'input':'change',update));
 document.querySelectorAll('[data-adult-kind]').forEach(b=>b.onclick=()=>{$('#adult-kind').value=b.dataset.adultKind;update();$('#adult-results').scrollIntoView({behavior:'smooth',block:'start'});});
 $('#adult-reset').onclick=()=>{['#adult-query','#adult-owner','#adult-kind','#adult-evidence'].forEach(s=>$(s).value='');update();};
 $('#adult-notebook').oninput=()=>{state.adultNotebook=$('#adult-notebook').value;$('#adult-note-status').textContent=persist()?'Lokal gespeichert.':'Nur diese Sitzung. Bitte exportieren.';};
 $('#adult-export').onclick=()=>download(JSON.stringify(notesExport(),null,2),'WotW_meine_Notizen_mit_Ab18.json');
 update();
}

document.querySelector('.skip').onclick=e=>{e.preventDefault();$('#main').focus()};
window.addEventListener('hashchange',route);route();
