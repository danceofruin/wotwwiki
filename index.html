r projekt charakterbogen psychologisches profil private akte"},{"id":"vesper","category":"charaktere","title":"Vesper","summary":"Stufe-6-Orakel, Infiltratorin und Keeper; reist mit Verse, Buch und Knotenhaushalt auf Halstyn’s Folly.","body":"<h2>Identität und Methode<\/h2><p>Vesper ist eine Asura-Spawn-Tiefling und Orakel mit Lore Mystery. Alabasterhelle Haut, schwarzes Haar mit blauem Schimmer, schlanke Gestalt und ein langer Greifschwanz sind etabliert. Sie sucht den Schlüssel, Namen oder Mechanismus, der eine Lage veränderbar macht.<\/p>\n<h2>Balentyne<\/h2><p>Vesper vergiftete am 8. Februar den großen Eintopf, half Tacitus und Jacobian lautlos zu überwältigen, entschärfte die Falle am Festungsschatz und hielt während des Angriffs Wege mit Illusion, Wolke und Ascheblick offen. Sie machte den heißen Sand unbrauchbar und öffnete Fallgatter und Zugbrücke.<\/p>\n<h2>Keeper und Forscherin<\/h2><p>Vesper schrieb Tacitus’ Compact, schloss den Carnal Seal und erhielt einen begrenzten ersten Siegeleindruck. Tacitus soll mit ihr Verse, <a href=\"#/artikel/rotes-buch\">das rote Buch<\/a> und andere ungewöhnliche Magie untersuchen. Verse und Buch reisen bei ihr.<\/p>\n<h2>Auf dem Fluss<\/h2><p>Vesper trägt Havelyns Headband of Alluring Charisma +2 und besitzt ein eigenes Iron Circlet. Sie nahm an beiden Requisitionsfahrten teil. Am 12. Februar verbringt sie einen Teil des Tages neugierig bei Tacitus und Zorn und zieht sich später mit Verse und einem Buch zurück.<\/p>\n<h2>Aktueller Stand<\/h2><p>Vesper ist Oracle (Spirit Guide) 6 mit 33/33 HP. Der aktuelle Live-Snapshot führt ihre Zauberplätze mit Grad 1: 8/8, Grad 2: 6/6 und Grad 3: 4/4.<\/p>\n<p><a href=\"#/artikel/bogen-vesper\">Charakterbogen<\/a> · <a href=\"#/artikel/psy-vesper\">Psychologisches Profil<\/a> · <a href=\"#/artikel/verse\">Verse<\/a> · <a href=\"#/artikel/intim-vesper\">Private Akte<\/a><\/p>","sources":["vesper","live","chronicle","redbook-current","knot-pact","thread-current"],"status":"Aktuell bis 12. ben wirkliche Teile ihrer Geschichte. Sie liebt Styke, ohne seine frühere Gewalt zu vergeben oder ihre alte Person auszulöschen.<\/p>\n<h2>Balentyne<\/h2><p>Valeria kämpfte gegen Donnagin und Havelyn. Nach Donnagins Tod schloss sie ihm die Augen. Havelyns Rüstung verwandelte sich unter ihrer Hand in eine schwarze infernale +1-Dastard-Vollplatte, die sie aus eigener Entscheidung annahm. Mit Abschluss des ersten Buches wurde ihr Umbau zu Antipaladin 6, Tyrant und Lord of Darkness mit VMC Cavalier im Order of Vengeance wirksam.<\/p>\n<h2>Die erste Requisition<\/h2><p>Valeria trug ihre alte Mitra-Platte und führte die falsche Rittergruppe mit glaubwürdiger Autorität durch das Dorf. Vogt Edran Vale gab Geld und Vorräte heraus; niemand wurde getötet. Im Gespräch danach benannten Valeria und Styke, dass sie einander verändern: Menschen können ohne Vertrag zählen, und Autorität macht eine Handlung nicht automatisch richtig.<\/p>\n<h2>Aktueller Stand<\/h2><p>Valeria hat 40/40 HP. Ihre schwarze +1-Dastard-Vollplatte, die alte Meisterarbeitsplatte, das Meisterarbeits-Großschwert und Mirelles Unterzeug sind an Bord. Am 12. Februar trainiert sie eine Weile, pflegt die Klinge und sitzt später auf einer Kiste, um dem Fluss zuzusehen.<\/p>\n<p><a href=\"#/artikel/bogen-valeria\">Charakterbogen<\/a> · <a href=\"#/artikel/psy-valeria\">Psychologisches Profil<\/a> · <a href=\"#/artikel/intim-valeria\">Private Akte<\/a><\/p>","sources":["valeria","live","chronicle","relations","thread-current"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Kernfigur","Stufe 6","Antipaladin","Feldführung"],"aliases":["Balina","Dame Balina","Sir Balin","Balina von Karfeld"],"group":"inner","initial":"V","text":"Von Balina zu Valeria Valeria ist die frühere Dame Balina von Karfeld. Ihre Mitranische Ausbildung, Donnagin und das Ritterleben bleiben wirkliche Teile ihrer Geschichte. Sie liebt Styke, ohne seine frühere Gewalt zu vergeben oder ihre alte Person auszulöschen. Balentyne Valeria k er Widerspruch. Eine harte Gegenmeinung kann er verarbeiten; ein gebrochenes Wort zerstört seine Berechnung der nächsten Folgen.<\/p>\n<h2>Angst, Wut und Schuld<\/h2>\n<p>Angst wird taktisch: Wie weit ist der Ausgang, wer ist verletzlich, welche Ressource bleibt? Tiefe Wut macht ihn leise und konkret. Er droht eher mit einer Handlung als mit einer Rede über seinen Status.<\/p>\n<p>Schuld verarbeitet er als Arbeit. Reparieren, bewachen, Grenzen einhalten und jemanden in die eigene Planung aufnehmen fallen ihm leichter als ein Bekenntnis. Darin liegen Fürsorge und Vermeidung dicht beieinander.<\/p>\n<h2>Schutz und Anspruch<\/h2>\n<p>Wenn Styke einen Menschen als eigene Verantwortung begreift, greift er in dessen Entscheidungen ein. Der Streit um <a href=\"#/artikel/timeon\">Timeon<\/a> zeigt den blinden Fleck: Er schützt Valeria vor einer gefährlichen Rückkehr und beansprucht dabei zugleich Deutung über einen Teil ihres früheren Lebens.<\/p>\n<h2>Vesper und Valeria<\/h2>\n<p>Mit Vesper bestehen gewachsene Abkürzungen aus Branderscar, Sex, Geheimnissen und gemeinsamem Überleben. Sie darf einen Informationszugang besitzen, den Styke nicht hat, ohne ihn jedes Mal erklären zu müssen.<\/p>\n<p>Bei Valeria ist jede Verlässlichkeit mit der Erinnerung an seine Täterschaft verschränkt. Am 31. Januar befolgte sie seinen Befehl und widersprach seinem Anspruch. Am nächsten Morgen führte und hielt sie ihn. Styke erlebte beides als Bindung.<\/p>\n<h2>Begehren<\/h2>\n<p>Styke ist körperlich direkt und wenig schamhaft. Begehren und Strategie laufen bei Kaitlyn gleichzeitig. Bei Vesper und Valeria erhalten eingehaltene Versprechen, vertauschte Rollen und die seltenen Momente, in denen er nicht entscheidet, besonderes Gewicht.<\/p>\n<p><a href=\"#/artikel/styke\">Zur Personenakte<\/a> / <a href=\"#/artikel/psy-vesper\">Vespers Profil<\/a> / <a href=\"#/artikel/psy-valeria\">Valerias Profil<\/a><\/p>\n<h2>Private Akte (18+)<\/h2>\n<p><a href=\"#/artikel/intim-styke\">Intimität und persö ,"title":"Verse","summary":"Erwachtes Reliquiar und Vespers eigenständiger Gefährte; Dinnerforschung trennte alte Erinnerungsschicht und heutiges Denken, ohne seinen Ursprung zu lösen.","body":"<h2>Wesen und Bindung<\/h2><p>Verse ist ein einzigartiges erwachtes Reliquiar mit männlicher Stimme; im Deutschen gilt er/ihm/sein. Er ist mechanisch ein Protector-Familiar, in der Fiktion aber kein Insekt. Vesper ließ ihn bei ihrer ursprünglichen Flucht nicht zurück. Seine Bindung an sie ist persönlich und dauerhaft.<\/p><h2>Erinnern ist nicht Allwissen<\/h2><p>Er erinnert Worte, Gebete, Hände und Orte, aber keine vollständige eigene Lebensgeschichte. Beim Dinner am 8. Februar half Tacitus, einen älteren kirchlichen Erinnerungs- und Wissensträger von Verses gegenwärtiger, eigenständiger Denk- und Persönlichkeitsschicht zu unterscheiden. Eine Verbindung zu Vespers wissensgebundener Magie ist erkennbar, aber Ursache und Herkunft sind nicht geklärt.<\/p><h2>Das neue Inventar<\/h2><p>Verse und Zorn begannen eine schriftliche Trennung zwischen altem, nicht selbst erworbenem Wissen, unsicheren Erinnerungsfragmenten, persönlichen Erinnerungen seit Vespers Hand und heutigen Schlussfolgerungen. Das ist eine Arbeitsmethode, keine fertige Biographie.<\/p><h2>Aktueller Stand<\/h2><p>Verse ist bei Vesper auf dem Rückweg durch den Tunnel. Er ist kein Mitglied des Kollektivs.<\/p><h2>Mechanik<\/h2><p>14 HP, INT 8, Natural Armor Adjustment +3. Bei erfüllten Familiar-Bedingungen verleiht er Vesper +4 Initiative. <a href=\"#/artikel/bogen-vesper\">Vespers Bogen<\/a>.<\/p>","sources":["verse","core","live","vsheet"],"status":"Bei Vesper / aktuelle Forschung","tags":["Begleiter","Magie"],"aliases":[],"group":"inner","text":"Wesen und Bindung Verse ist ein einzigartiges erwachtes Reliquiar mit männlicher Stimme; im Deutschen gilt er/ihm/sein. Er ist mechanisch ein Protector-Familiar, in der Fiktion aber kein Insekt. Vesper ließ ihn bei ihrer ursprünglichen Flucht nicht zurück. Seine Bindung an s dem gesamten Haushalt nach Süden und organisiert Schutz und Wachen unter den beengten Bedingungen des offenen Decks.<\/p><h2>Ausrüstung<\/h2><p>Fighter 3, 28/28 HP; Kettenhemd, Valerias altes meisterliches Langschwert, Dolch, Winterkleidung und Silberring.<\/p>","sources":["tamsin-current","live","chronicle","knot-pact"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Branderscar","Gebundene","Eskorte","Rehabilitation"],"aliases":["Blackerly","Tomas Blackerly"],"group":"inner","text":"Die ehemalige Sergeantin Tamsins stärkste Fähigkeiten bleiben Bewachung, Zugänge, Ordnung und praktische Gewalt. Nach ihrem erfolgreichen Auftrag mit Nella führte sie das Dalliance durch die Angriffsnacht. Sicherheitsbereich Styke übertrug ihr danach dauerhaft die Sicherheit des Knotens: Wachen, Türen und Zugänge, körperlicher Schutz, Marschordnung und Schlafsicherheit. Diese Befugnis ersetzt keine Fachzuständigkeit. Auf der Folly folgen Schiff und Ladung Hakons Erfahrung, Magie Tacitus und Vesper, Handwerk Mirelle und die Buchhaltung Nella. An Bord Tamsin reist mit dem gesamten Haushalt nach Süden und organisiert Schutz und Wachen unter den beengten Bedingungen des offenen Decks. Ausrüstung Fighter 3, 28/28 HP; Kettenhemd, Valerias altes meisterliches Langschwert, Dolch, Winterkleidung und Silberring.","search":"tamsin blackerly gebundene wachterin und dauerhafte sicherheitsverantwortliche des reisenden knotenhaushalts blackerly tomas blackerly branderscar gebundene eskorte rehabilitation inner die ehemalige sergeantin tamsins starkste fahigkeiten bleiben bewachung zugange ordnung und praktische gewalt nach ihrem erfolgreichen auftrag mit nella fuhrte sie das dalliance durch die angriffsnacht sicherheitsbereich styke ubertrug ihr danach dauerhaft die sicherheit des knotens wachen turen und zugange korperlicher schutz marschordnung und schlafsicherheit diese befugnis ersetzt keine fachzustandigkeit auf der folly folgen schiff und ladung hakons erfahrung magie tacitus und vesper handwerk mirelle und die buchhaltung nella an bord tamsin reist mit dem gesamten haushalt nach suden und organisiert schutz und wachen unter den beengten bedingungen des offenen decks ausrustung fighter 3 28 28 hp kettenhemd valerias altes meisterliches langschwert dolch winterkleidung und silberring","links":[],"backlinks":["anatomie-tamsin","branderscar","story-so-far","zeit-branderscar"],"initial":"T"},{"id":"timeon","category":"personen","title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"<h2>Balinas Knappe<\/h2>\n<p>Timeon war der junge Knappe von <a href=\"#/artikel/valeria\">Dame Balina<\/a> und blieb Mitra zugewandt. Der <a href=\"#/artikel/privatpakt\">Privatpakt<\/a> trägt weder seinen Namen noch seine Zusage. Gegenüber <a href=\"#/artikel/styke\">Styke<\/a> und dem Knoten überwiegt Furcht.<\/p>\n<h2>Erinnerung an Balentyne<\/h2>\n<p>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe <a href=\"#/artikel/timeon-karte\">Karte<\/a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.<\/p>\n<h2>Auf dem Familienhof<\/h2>\n<p>Tamsin brachte ihn zum vorgesehenen <a href=\"#/artikel/timeon-hof\">Familienanwesen<\/a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.<\/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["valeria","privatpakt","styke","timeon-karte","timeon-hof"],"backlinks":["kollektiv","mitra","privatpakt","psy-styke","psy-valeria","story-so-far","thorn-manor","timeon-hof","timeon-karte","zeit-0123","zeit-ausbildung","zeit-valeria-rueckkehr"],"search":"timeon valerias fruherer knappe mitranisch verangstigt auf einem familienhof untergebracht und trager einer groben erinnerungskarte knappe sicher untergebracht inner balinas knappe timeon war der junge knappe von dame balina und blieb mitra zugewandt der privatpakt tragt weder seinen namen noch seine zusage gegenuber styke und dem knoten uberwiegt furcht erinnerung an balentyne wahrend der ausbildung berichtete timeon woran er sich aus balentyne erinnerte und zeichnete eine grobe karte sie bildet seinen damaligen wissensstand ab und lasst raume wege und spatere anderungen offen auf dem familienhof tamsin brachte ihn zum vorgesehenen familienanwesen valeria ritt am 31 januar hin und sah selbst dass er dort sicher war sie versprach ihm eine ruckkehr erhielt spater jedoch von styke den befehl den hof nicht erneut aufzusuchen","initial":"T"},{"id":"thorn","category":"personen","title":"Kardinal Adrastus Thorn","summary":"Auftraggeber und weltliche Autorität des Dornpakts. Seine Vergangenheit ist nur in Teilen bekannt.","body":"<h2>Bekannte Stellung<\/h2>\n<p>Thorn rekrutierte <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> nach Branderscar, band sie durch den <a href=\"#/artikel/dornpakt\">Pact of Thorns<\/a> und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht.<\/p>\n<h2>Der Auftrag<\/h2>\n<p>Balentyne brechen, <a href=\"#/artikel/havelyn\">Lord Thomas Havelyn<\/a> töten und den Weg für <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe<\/a> öffnen. <a href=\"#/artikel/tiadora\">Tiadora<\/a> ist seine gefährliche Botin und Vollstreckerin.<\/p>\n<h2>Was über früher bekannt ist<\/h2>\n<p>Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. <strong>Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt.<\/strong> Das Wiki ergänzt dazu keine verborgene Quellenbiographie.<\/p>\n<h2>Unterschiedliche Bindungen<\/h2>\n<p>Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.<\/p>\n","sources":["core","chronicle","factions","relations"],"status":"Bestätigt","tags":["Auftraggeber","Pakt"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Bekannte Stellung Thorn rekrutierte Styke und Vesper nach Branderscar, band sie durch den Pact of Thorns und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht. Der Auftrag Balentyne brechen, Lord Thomas Havelyn töten und den Weg für Sakkarot Fire-Axe öffnen. Tiadora ist seine gefährliche Botin und Vollstreckerin. Was über früher bekannt ist Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt. Das Wiki ergänzt dazu keine verborgene Quellenbiographie. Unterschiedliche Bindungen Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.","links":["styke","vesper","dornpakt","havelyn","sakkarot","tiadora"],"backlinks":["story-so-far","zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber und weltliche autoritat des dornpakts seine vergangenheit ist nur in teilen bekannt adrastus thorn cardinal thorn auftraggeber pakt history bekannte stellung thorn rekrutierte styke und vesper nach branderscar band sie durch den pact of thorns und liess sie die neun lektionen sowie rund neunzig tage ausbildung durchlaufen vertrage belohnungen geduld und grausamkeit gehoren zur erlebten form seiner macht der auftrag balentyne brechen lord thomas havelyn toten und den weg fur sakkarot fire axe offnen tiadora ist seine gefahrliche botin und vollstreckerin was uber fruher bekannt ist sakkarot erzahlte styke und vesper dass thorn einst kardinal mitras war sein fruherer name und die genauen umstande seines falls sind ihnen nicht bekannt das wiki erganzt dazu keine verborgene quellenbiographie unterschiedliche bindungen styke und vesper stehen im grosseren dornpakt unter ihm valerias eigener privatpakt benennt dagegen styke und vesper als sterbliche autoritaten thorn ist nicht allein dadurch ihre direkte vertragsautoritat","initial":"K"},{"id":"tiadora","category":"personen","title":"Tiadora","summary":"Thorns infernale Botin an Bord der Folly; brachte Belohnung und Abreisebefehl und führt die falschen Ritteroperationen.","body":"<h2>Nach Balentynes Fall<\/h2><p>Tiadora erschien im Dalliance, übergab Thorns 5.000-gp-Erfolgszahlung und befahl den sofortigen Aufbruch zum wartenden Schiff. Auf Halstyn’s Folly beansprucht sie die einzige geschlossene Kabine.<\/p><h2>Falsche Ritter<\/h2><p>In der ersten Nacht ging Tiadora allein in der Gestalt einer Ritterin an Land. Alarm, Schreie und ihre blutige Rückkehr waren für den Knoten sichtbar oder hörbar. Am nächsten Tag erklärte sie offen den Zweck: sichtbare Übergriffe falscher Ritter sollen Unterstützung für Krone, Kirche und Orden beschädigen.<\/p><p>Sie akzeptierte danach Stykes Requisitionsmethode. Beim ersten gemeinsamen Einsatz nahm sie eine weitere Rittergestalt an und transportierte Menschen und Pferde. Eine zweite Requisitionsnacht folgte mit veränderter Deckung. Am 12. Februar bleibt ihre Kabinentür überwiegend geschlossen.<\/p>","sources":["core","factions","chronicle"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Botin","Thorn"],"aliases":[],"group":"history","text":"Nach Balentynes Fall Tiadora erschien im Dalliance, übergab Thorns 5.000-gp-Erfolgszahlung und befahl den sofortigen Aufbruch zum wartenden Schiff. Auf Halstyn’s Folly beansprucht sie die einzige geschlossene Kabine. Falsche Ritter In der ersten Nacht ging Tiadora allein in der Gestalt einer Ritterin an Land. Alarm, Schreie und ihre blutige Rückkehr waren für den Knoten sichtbar oder hörbar. Am nächsten Tag erklärte sie offen den Zweck: sichtbare Übergriffe falscher Ritter sollen Unterstützung für Krone, Kirche und Orden beschädigen. Sie akzeptierte danach Stykes Requisitionsmethode. Beim ersten gemeinsamen Einsatz nahm sie eine weitere Rittergestalt an und transportierte Menschen und Pferde. Eine zweite Requisitionsnacht folgte mit veränderter Deckung. Am 12. Februar bleibt ihre Kabinentür überwiegend geschlossen.","links":[],"backlinks":["story-so-far","thorn","zeit-branderscar"],"search":"tiadora thorns infernale botin an bord der folly brachte belohnung und abreisebefehl und fuhrt die falschen ritteroperationen botin thorn history nach balentynes fall tiadora erschien im dalliance ubergab thorns 5 000 gp erfolgszahlung und befahl den sofortigen aufbruch zum wartenden schiff auf halstyn s folly beansprucht sie die einzige geschlossene kabine falsche ritter in der ersten nacht ging tiadora allein in der gestalt einer ritterin an land alarm schreie und ihre blutige ruckkehr waren fur den knoten sichtbar oder horbar am nachsten tag erklarte sie offen den zweck sichtbare ubergriffe falscher ritter sollen unterstutzung fur krone kirche und orden beschadigen sie akzeptierte danach stykes requisitionsmethode beim ersten gemeinsamen einsatz nahm sie eine weitere rittergestalt an und transportierte menschen und pferde eine zweite requisitionsnacht folgte mit veranderter deckung am 12 februar bleibt ihre kabinentur uberwiegend geschlossen","initial":"T"},{"id":"sakkarot","category":"personen","title":"Sakkarot Fire-Axe","summary":"Fire-Axes Heer nahm das rote Signal auf, drang durch das offene Tor ein und war beim letzten direkten Blick klar am Gewinnen.","body":"<h2>Begegnung und Abmachung<\/h2>\n<p>Am <strong>14. Januar 4712 AR<\/strong> erhielt Sakkarot Thorns Waffenlieferung. <a href=\"#/artikel/styke\">Styke<\/a> versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden.<\/p>\n<h2>Geteiltes Wissen<\/h2>\n<p>Er enthüllte gegenüber Styke und <a href=\"#/artikel/vesper\">Vesper<\/a>, dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht.<\/p>\n<h2>Zeitdruck<\/h2>\n<p>Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist <strong>kein mit Sakkarot vereinbarter Termin<\/strong>. Es wurde ihm dazu noch keine Nachricht geschickt.<\/p>\n<h2>Die Nacht des Signals<\/h2><p>Styke, Vesper und Valeria schossen das vereinbarte rote Signal gemeinsam nahe dem Dalliance ab. Etwa eine Stunde später lief Fire-Axes erste große Welle durch das bereits offene Tor. Beim späteren Blick vom Festungsdach war sein Heer tief im Inneren und sichtbar am Gewinnen.<\/p>","sources":["core","chronicle","live","factions"],"status":"Angriff auf Balentyne läuft","tags":["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"group":"field","text":"Begegnung und Abmachung Am 14. Januar 4712 AR erhielt Sakkarot Thorns Waffenlieferung. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden. Geteiltes Wissen Er enthüllte gegenüber Styke und Vesper , dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht. Zeitdruck Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist kein mit Sakkarot vereinbarter Termin . Es wurde ihm dazu noch keine Nachricht geschickt. Die Nacht des Signals Styke, Vesper und Valeria schossen das vereinbarte rote Signal gemeinsam nahe dem Dalliance ab. Etwa eine Stunde später lief Fire-Axes erste große Welle durch das bereits offene Tor. Beim späteren Blick vom Festungsdach war sein Heer tief im Inneren und sichtbar am Gewinnen.","links":["styke","vesper"],"backlinks":["story-so-far","thorn","zeit-0114"],"search":"sakkarot fire axe fire axes heer nahm das rote signal auf drang durch das offene tor ein und war beim letzten direkten blick klar am gewinnen fire axe feueraxt bugbear verbundeter field begegnung und abmachung am 14 januar 4712 ar erhielt sakkarot thorns waffenlieferung styke versprach ihm personlich balentynes tor zu offnen sakkarot fuhrt das bugbearheer und ist mit thorn uber asmodeus sowie den avernischen ersten knoten verbunden geteiltes wissen er enthullte gegenuber styke und vesper dass thorn fruher ein kardinal mitras war einen alten namen oder den genauen grund seines falls lieferte diese erzahlung nicht zeitdruck die einmonatige operationsfrist seit der lieferungsphase erzeugt druck der im dalliance erwogene angriff in der nacht 8 9 februar ist kein mit sakkarot vereinbarter termin es wurde ihm dazu noch keine nachricht geschickt die nacht des signals styke vesper und valeria schossen das vereinbarte rote signal gemeinsam nahe dem dalliance ab etwa eine stunde spater lief fire axes erste grosse welle durch das bereits offene tor beim spateren blick vom festungsdach war sein heer tief im inneren und sichtbar am gewinnen","initial":"S"},{"id":"bellam","category":"personen","title":"Bellam Barhold","summary":"Wirt des Lord’s Dalliance; reist mit Alicia und persönlichem Besitz auf Halstyn’s Folly.","body":"<h2>Wirt ohne Gasthaus<\/h2><p>Bellam Barhold bleibt Eigentümer des Lord’s Dalliance, ist aber mit Alicia und den geretteten persönlichen Dingen an Bord der Folly. Über den Zustand des verlassenen Hauses besitzt er keinen neuen Bericht.<\/p><h2>Zusage<\/h2><p>Styke versprach Schutz nach Möglichkeit und Hilfe für eine neue Herberge, falls das Dalliance verloren geht. Beim Ausschiffen sollen Bellam und Alicia zusammen 1.500 gp erhalten. Die Zahlung ist vorgemerkt, aber noch nicht erfolgt.<\/p>","sources":["core","dalliance","live"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Dalliance","Wirt"],"aliases":[],"group":"town","text":"Wirt ohne Gasthaus Bellam Barhold bleibt Eigentümer des Lord’s Dalliance, ist aber mit Alicia und den geretteten persönlichen Dingen an Bord der Folly. Über den Zustand des verlassenen Hauses besitzt er keinen neuen Bericht. Zusage Styke versprach Schutz nach Möglichkeit und Hilfe für eine neue Herberge, falls das Dalliance verloren geht. Beim Ausschiffen sollen Bellam und Alicia zusammen 1.500 gp erhalten. Die Zahlung ist vorgemerkt, aber noch nicht erfolgt.","links":[],"backlinks":[],"search":"bellam barhold wirt des lord s dalliance reist mit alicia und personlichem besitz auf halstyn s folly dalliance wirt town wirt ohne gasthaus bellam barhold bleibt eigentumer des lord s dalliance ist aber mit alicia und den geretteten personlichen dingen an bord der folly uber den zustand des verlassenen hauses besitzt er keinen neuen bericht zusage styke versprach schutz nach moglichkeit und hilfe fur eine neue herberge falls das dalliance verloren geht beim ausschiffen sollen bellam und alicia zusammen 1 500 gp erhalten die zahlung ist vorgemerkt aber noch nicht erfolgt","initial":"B"},{"id":"alicia","category":"personen","title":"Alicia Barhold","summary":"Bellams Frau; reist mit ihm und den geretteten persönlichen Dingen auf Halstyn’s Folly.","body":"<h2>An Bord<\/h2><p>Alicia arbeitete mit Bellam im Lord’s Dalliance. Beide verließen Aldencross mit dem Knotenhaushalt und reisen nun auf Halstyn’s Folly nach Süden.<\/p><h2>Offen<\/h2><p>Beim Ausschiffen ist eine gemeinsame Zahlung von 1.500 gp vorgesehen. Eine eigene Bindung an den Knoten oder ein weiteres Reiseziel danach ist nicht festgelegt.<\/p>","sources":["dalliance"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Dalliance"],"aliases":[],"group":"town","text":"An Bord Alicia arbeitete mit Bellam im Lord’s Dalliance. Beide verließen Aldencross mit dem Knotenhaushalt und reisen nun auf Halstyn’s Folly nach Süden. Offen Beim Ausschiffen ist eine gemeinsame Zahlung von 1.500 gp vorgesehen. Eine eigene Bindung an den Knoten oder ein weiteres Reiseziel danach ist nicht festgelegt.","links":[],"backlinks":[],"search":"alicia barhold bellams frau reist mit ihm und den geretteten personlichen dingen auf halstyn s folly dalliance town an bord alicia arbeitete mit bellam im lord s dalliance beide verliessen aldencross mit dem knotenhaushalt und reisen nun auf halstyn s folly nach suden offen beim ausschiffen ist eine gemeinsame zahlung von 1 500 gp vorgesehen eine eigene bindung an den knoten oder ein weiteres reiseziel danach ist nicht festgelegt","initial":"A"},{"id":"barnabus","category":"personen","title":"Barnabus Eisenbauch","summary":"Zwergeningenieur des Torhauses; mit seinen zehn Arbeitern am 9. Februar im Dalliance getötet.","body":"<h2>Zwergeningenieur<\/h2><p>Barnabus Eisenbauch leitete zehn Arbeiter, die im Dalliance wohnten und Balentynes Torhaus warteten. Sein Bericht über getrennte Winden, vier Dauerwachen, Tagesingenieure und Heißsandabwehr half dem Knoten bei der Vorbereitung.<\/p>\n<h2>Ende am 9. Februar<\/h2><p>Während Balentyne fiel, blieben Barnabus und seine zehn Leute oben im Gasthaus. Styke und Hakon töteten alle elf im Schlaf, damit sie nicht in die abgeriegelte Hausoperation geraten. Die Körper und der gesamte Ausrüstungssatz befinden sich weiterhin in ihren Zimmern; nichts davon wurde durchsucht oder in die Knotenkasse aufgenommen.<\/p>","sources":["core","chronicle","live"],"status":"Verstorben am 9. Februar","tags":["Zwerg","Ingenieur","Dalliance"],"aliases":["Eisenbauch","Ironbelly"],"group":"town","text":"Zwergeningenieur Barnabus Eisenbauch leitete zehn Arbeiter, die im Dalliance wohnten und Balentynes Torhaus warteten. Sein Bericht über getrennte Winden, vier Dauerwachen, Tagesingenieure und Heißsandabwehr half dem Knoten bei der Vorbereitung. Ende am 9. Februar Während Balentyne fiel, blieben Barnabus und seine zehn Leute oben im Gasthaus. Styke und Hakon töteten alle elf im Schlaf, damit sie nicht in die abgeriegelte Hausoperation geraten. Die Körper und der gesamte Ausrüstungssatz befinden sich weiterhin in ihren Zimmern; nichts davon wurde durchsucht oder in die Knotenkasse aufgenommen.","links":[],"backlinks":["zarik"],"search":"barnabus eisenbauch zwergeningenieur des torhauses mit seinen zehn arbeitern am 9 februar im dalliance getotet eisenbauch ironbelly zwerg ingenieur dalliance town zwergeningenieur barnabus eisenbauch leitete zehn arbeiter die im dalliance wohnten und balentynes torhaus warteten sein bericht uber getrennte winden vier dauerwachen tagesingenieure und heisssandabwehr half dem knoten bei der vorbereitung ende am 9 februar wahrend balentyne fiel blieben barnabus und seine zehn leute oben im gasthaus styke und hakon toteten alle elf im schlaf damit sie nicht in die abgeriegelte hausoperation geraten die korper und der gesamte ausrustungssatz befinden sich weiterhin in ihren zimmern nichts davon wurde durchsucht oder in die knotenkasse aufgenommen","initial":"B"},{"id":"mara","category":"personen","title":"Mara Fenner","summary":"Zivile Arbeiterin, vertrauter Kontakt und Informationsquelle. Früher von Styke auch Hazel genannt.","body":"<h2>Identität und Alltag<\/h2>\n<p>Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. <strong>Hazel<\/strong> war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person.<\/p>\n<h2>Styke, Ellyn und das hintere Zimmer<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> lernte Mara und <a href=\"#/artikel/ellyn\">Ellyn Reed<\/a> am 23. Januar bei den Wagenhöfen kennen. Am selben Tag folgte die Begegnung im <a href=\"#/artikel/wash-shed\">Waschschuppen<\/a>. Am 30. Januar kam Mara nach ihrer Schicht in das hintere Zimmer des Dalliance und schlief dort mit Styke, Vesper und Valeria.<\/p>\n<h2>Arbeit als Zugang<\/h2>\n<p>Mara und Ellyn stellten <a href=\"#/artikel/vesper\">Vesper<\/a> als tüchtige neue Arbeitskraft vor. So gelangte Vesper am 29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten.<\/p>\n<h2>Letzte Berichte<\/h2>\n<p>Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durchfall lebte noch und stand unter Donnagins Aufsicht. Ungefähr vier oder fünf Reiter sah Mara nach Norden aufbrechen; den Zusammenhang mit Varning vermutete sie.<\/p>\n<h2>Private Akte (18+)<\/h2>\n<p><a href=\"#/artikel/intim-mara\">Der Waschschuppen und das Dalliance<\/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.<\/p><h2>Letzter bestätigter Kontakt<\/h2><p>Valeria erklärte Vespers Abwesenheit mit Krankheit. Mara lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.<\/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Zivilarbeit","Kontakt","Aldencross"],"aliases":["Hazel"],"group":"town","text":"Identität und Alltag Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. Hazel war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person. Styke, Ellyn und das hintere Zimmer Styke lernte Mara und Ellyn Reed am 23. Januar bei den Wagenhöfen kennen. Am selben Tag folgte die Begegnung im Waschschuppen . Am 30. Januar kam Mara nach ihrer Schicht in das hintere Zimmer des Dalliance und schlief dort mit Styke, Vesper und Valeria. Arbeit als Zugang Mara und Ellyn stellten Vesper als tüchtige neue Arbeitskraft vor. So gelangte Vesper am 29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten. Letzte Berichte Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durchfall lebte noch und stand unter Donnagins Aufsicht. Ungefähr vier oder fünf Reiter sah Mara nach Norden aufbrechen; den Zusammenhang mit Varning vermutete sie. Private Akte (18+) Der Waschschuppen und das Dalliance . Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden. Letzter bestätigter Kontakt Valeria erklärte Vespers Abwesenheit mit Krankheit. Mara lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.","links":["styke","ellyn","wash-shed","vesper","intim-mara"],"backlinks":["copper-server","ellyn","intim-mara","story-so-far","wash-shed","zeit-0123"],"search":"mara fenner zivile arbeiterin vertrauter kontakt und informationsquelle fruher von styke auch hazel genannt hazel zivilarbeit kontakt aldencross town identitat und alltag mara fenner lebt in aldencross und arbeitet im umfeld von balentynes wasche und hilfsdiensten hazel war ihr fruherer arbeitsname in den notizen die kupferhaarige bedienung des dalliance ist eine andere person styke ellyn und das hintere zimmer styke lernte mara und ellyn reed am 23 januar bei den wagenhofen kennen am selben tag folgte die begegnung im waschschuppen am 30 januar kam mara nach ihrer schicht in das hintere zimmer des dalliance und schlief dort mit styke vesper und valeria arbeit als zugang mara und ellyn stellten vesper als tuchtige neue arbeitskraft vor so gelangte vesper am 29 und 30 januar in die zivilen arbeitsbereiche balentynes mara kennt den handelsvorwand der gruppe aber weder den angriffsplan noch den nessianischen knoten letzte berichte nach varnings tod berichtete mara von engerer zugangskontrolle und empfahl vesper fruh zu erscheinen ein soldat mit durchfall lebte noch und stand unter donnagins aufsicht ungefahr vier oder funf reiter sah mara nach norden aufbrechen den zusammenhang mit varning vermutete sie private akte 18 der waschschuppen und das dalliance der private teil ist nach der einmaligen altersfreigabe in dieses dossier eingebunden letzter bestatigter kontakt valeria erklarte vespers abwesenheit mit krankheit mara lebt und arbeitet weiter in aldencross neues wissen uber den knoten oder den angriff ist nicht entstanden","initial":"M"},{"id":"ellyn","category":"personen","title":"Ellyn Reed","summary":"Zivile Arbeiterin mit Balentyne-Erfahrung. Sunny ist eine frühere Bezeichnung für sie.","body":"<h2>Arbeit und Bekanntschaft<\/h2>\n<p>Ellyn Reed lebt in Aldencross und übernimmt gelegentlich Hilfs- und Reinigungsarbeiten für Balentyne. <a href=\"#/artikel/styke\">Styke<\/a> lernte sie am 23. Januar zusammen mit <a href=\"#/artikel/mara\">Mara Fenner<\/a> bei den Wagenhöfen kennen. Noch am selben Tag gingen die drei in den <a href=\"#/artikel/wash-shed\">Waschschuppen<\/a>.<\/p>\n<h2>Vespers Arbeitstage<\/h2>\n<p>Ellyn kennt die gewöhnlichen Abläufe der zivilen Arbeiter. Mit Mara stellte sie <a href=\"#/artikel/vesper\">Vesper<\/a> als neue Hilfe vor und verschaffte ihr damit am 29. und 30. Januar einen glaubhaften Arbeitsweg in die Festung.<\/p>\n<p>Ellyn kennt Styke als Händler und Liebhaber. Vom Nessianischen Knoten, dem Tunnel und dem geplanten Angriff auf Balentyne weiß sie nichts. <strong>Sunny<\/strong> ist ihr früherer Arbeitsname in den Notizen.<\/p>\n<h2>Private Akte (18+)<\/h2>\n<p><a href=\"#/artikel/intim-ellyn\">Der Nachmittag im Waschschuppen<\/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.<\/p><h2>Letzter bestätigter Kontakt<\/h2><p>Valeria erklärte Vespers Abwesenheit mit Krankheit. Ellyn lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.<\/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Zivilarbeit","Kontakt"],"aliases":["Sunny"],"group":"town","text":"Arbeit und Bekanntschaft Ellyn Reed lebt in Aldencross und übernimmt gelegentlich Hilfs- und Reinigungsarbeiten für Balentyne. Styke lernte sie am 23. Januar zusammen mit Mara Fenner bei den Wagenhöfen kennen. Noch am selben Tag gingen die drei in den Waschschuppen . Vespers Arbeitstage Ellyn kennt die gewöhnlichen Abläufe der zivilen Arbeiter. Mit Mara stellte sie Vesper als neue Hilfe vor und verschaffte ihr damit am 29. und 30. Januar einen glaubhaften Arbeitsweg in die Festung. Ellyn kennt Styke als Händler und Liebhaber. Vom Nessianischen Knoten, dem Tunnel und dem geplanten Angriff auf Balentyne weiß sie nichts. Sunny ist ihr früherer Arbeitsname in den Notizen. Private Akte (18+) Der Nachmittag im Waschschuppen . Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden. Letzter bestätigter Kontakt Valeria erklärte Vespers Abwesenheit mit Krankheit. Ellyn lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.","links":["styke","mara","wash-shed","vesper","intim-ellyn"],"backlinks":["intim-ellyn","mara","story-so-far","wash-shed","zeit-0123"],"search":"ellyn reed zivile arbeiterin mit balentyne erfahrung sunny ist eine fruhere bezeichnung fur sie sunny zivilarbeit kontakt town arbeit und bekanntschaft ellyn reed lebt in aldencross und uberni durch kein gesichertes Wissen über Kaitlyn oder die Affäre. Ein in einem Testzweig verwendeter Name wurde nicht angenommen. Das Wiki gibt ihr deshalb keinen neuen Eigennamen und behandelt sie nicht als Mara Fenner .","links":["mara"],"backlinks":[],"search":"die kupferhaarige bedienung namentlich nicht festgelegte dalliance bedienung nicht mit mara fenner verwechseln dalliance name unbekannt town akzeptierte begegnung am spaten nachmittag des 28 januar bemerkte sie stykes ruckkehr nach mehreren stunden und nahm tabak und parfum an ihm wahr sie neckte ihn damit dass aldencross ihm offenbar gefalle abgrenzung sie besitzt dadurch kein gesichertes wissen uber kaitlyn oder die affare ein in einem testzweig verwendeter name wurde nicht angenommen das wiki gibt ihr deshalb keinen neuen eigennamen und behandelt sie nicht als mara fenner","initial":"D"},{"id":"franz","category":"personen","title":"Captain Franz Mott","summary":"Tötete Zack im Duell und wurde anschließend entwaffnet und festgesetzt; sein weiteres Schicksal während des Angriffs kennt der Knoten nicht.","body":"<h2>Stellung<\/h2><p>Franz Mott ist Offizier in Balentyne und Kaitlyn Motts Ehemann. Die von Vesper offen ausgelegten Briefe machten Zacks Verhältnis mit Kaitlyn sichtbar.<\/p><h2>Das Duell<\/h2><p>Bei erstem Licht am 7. Februar traf Franz Zack außerhalb der Festung. Zack verwundete ihn leicht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter.<\/p><h2>Am Tor<\/h2><p>Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. <a href=\"#/artikel/captain-barhold\">Captain Barhold<\/a> ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.<\/p>","sources":["core","chronicle","live"],"status":"Nach Festsetzung unbekannt","tags":["Balentyne","Captain","Kaitlyn","Duell"],"aliases":["Mott","Franz Mott"],"group":"garrison","text":"Stellung Franz Mott ist Offizier in Balentyne und Kaitlyn Motts Ehemann. Die von Vesper offen ausgelegten Briefe machten Zacks Verhältnis mit Kaitlyn sichtbar. Das Duell Bei erstem Licht am 7. Februar traf Franz Zack außerhalb der Festung. Zack verwundete ihn leicht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter. Am Tor Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. Captain Barhold ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.","links":["captain-barhold"],"backlinks":["story-so-far"],"search":"captain franz mott totete zack im duell und wurde anschliessend entwaffnet und festgesetzt sein weiteres schicksal wahrend des angriffs kennt der knoten nicht mott franz mott balentyne captain kaitlyn duell garrison stellung franz mott ist offizier in balentyne und kaitlyn motts ehemann die von vesper offen ausgelegten briefe machten zacks verhaltnis mit kaitlyn sichtbar das duell bei erstem licht am 7 februar traf franz zack ausserhalb der festung zack verwundete ihn leicht franz brachte zack mit der hellebarde zu boden und totete ihn mit einem letzten schlag in hals und schulter am tor styke offenbarte genug wissen uber die briefe um franz hinter sich herzuziehen am tor von balentyne alarmierte styke die wachen captain barhold liess franz entwaffnen seine wunde behandeln und ihn zunachst bis zur untersuchung festsetzen die spatere entscheidung der festung ist styke nicht bekannt","initial":"C"},{"id":"kaitlyn","category":"personen","title":"Kaitlyn Mott","summary":"Gebundene Adlige an Bord der Folly; kümmert sich auf der Reise um Menschen, persönlichen Besitz und kleine Spannungen.","body":"<h2>Die Frau aus dem Mott-Haus<\/h2><p>Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Ihre lange Beziehung zu Zack Eddarly endete mit seinem Tod; über Franz’ weiteren Weg besitzt sie weiterhin keinen belastbaren Bericht.<\/p><h2>Der Compact<\/h2><p>Kaitlyn ist seit dem 5. Februar gebunden. Ihre Weigerung, eigenhändig zu töten, ist für sich kein Vertragsbruch. Styke versprach ihr direkten Bescheid, sobald er etwas Verlässliches über Franz erfährt.<\/p><h2>Auf der Reise<\/h2><p>Vesper gab Kaitlyn eine vorläufige Verantwortung für Menschen statt Kisten. Sie hilft Bellam, Alicia und den übrigen Passagieren, persönliche Dinge zu behalten, Abläufe zu verstehen und kleine Reibungen sichtbar zu machen. Das ist echte Arbeit, aber noch kein festes Amt und keine plötzliche Ausbildung zur Spionin.<\/p><p><a href=\"#/artikel/intim-kaitlyn\">Private Akte<\/a> · <a href=\"#/artikel/anatomie-kaitlyn\">Körperakte<\/a><\/p>","sources":["core","live"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Affäre","Adel","Gebundene","8. Februar"],"aliases":[],"group":"town","text":"Die Frau aus dem Mott-Haus Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Ihre lange Beziehung zu Zack Eddarly endete mit seinem Tod; über Franz’ weiteren Weg besitzt sie weiterhin keinen belastbaren Bericht. Der Compact Kaitlyn ist seit dem 5. Februar gebunden. Ihre Weigerung, eigenhändig zu töten, ist für sich kein Vertragsbruch. Styke versprach ihr direkten Bescheid, sobald er etwas Verlässliches über Franz erfährt. Auf der Reise Vesper gab Kaitlyn eine vorläufige Verantwortung für Menschen statt Kisten. Sie hilft Bellam, Alicia und den übrigen Passagieren, persönliche Dinge zu behalten, Abläufe zu verstehen und kleine Reibungen sichtbar zu machen. Das ist echte Arbeit, aber noch kein festes Amt und keine plötzliche Ausbildung zur Spionin. Private Akte · Körperakte","search":"kaitlyn mott gebundene adlige an bord der folly kummert sich auf der reise um menschen personlichen besitz und kleine spannungen affare adel gebundene 8 februar town die frau aus dem mott haus kaitlyn mott ist eine junge talireanische adlige mit rotem haar grunen augen und sicherem hofischem auftreten ihre lange beziehung zu zack eddarly endete mit seinem tod uber franz weiteren weg besitzt sie weiterhin keinen belastbaren bericht der compact kaitlyn ist seit dem 5 februar gebunden ihre weigerung eigenhandig zu toten ist fur sich kein vertragsbruch styke versprach ihr direkten bescheid sobald er etwas verlassliches uber franz erfahrt auf der reise vesper gab kaitlyn eine vorlaufige verantwortung fur menschen statt kisten sie hilft bellam alicia und den ubrigen passagieren personliche dinge zu behalten ablaufe zu verstehen und kleine reibungen sichtbar zu machen das ist echte arbeit aber noch kein festes amt und keine plotzliche ausbildung zur spionin private akte korperakte","links":["intim-kaitlyn","anatomie-kaitlyn"],"backlinks":["anatomie-kaitlyn","intim-kaitlyn","intim-kaitlyn-korruption","story-so-far"],"initial":"K"},{"id":"zack","category":"personen","title":"Captain Zacharias \"Zack\" Eddarly","summary":"Captain Zacharias Eddarly, Kaitlyns langjähriger Freund und Geliebter; am 7. Februar von Franz Mott im Duell getötet.","body":"<h2>Captain und Geliebter<\/h2><p>Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung.<\/p><h2>Tod am 7. Februar<\/h2><p>Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.<\/p>","sources":["core","live","chronicle"],"status":"Tot seit 7. Februar","tags":["Balentyne","Captain","Kaitlyn","Tot"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Captain und Geliebter Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung. Tod am 7. Februar Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.","search":"captain zacharias zack eddarly captain zacharias eddarly kaitlyns langjahriger freund und geliebter am 7 februar von franz mott im duell getotet zack zach zacharias eddarly zach eddarly balentyne captain kaitlyn tot garrison captain und geliebter zacharias zack eddarly war offizier in balentyne und kaitlyns langjahriger freund und geliebter vesper identifizierte ihn am 4 februar anhand einer beschreibung tod am 7 februar zack nahm franz motts duellforderung an er traf franz mit dem langschwert und verwundete ihn leicht wurde dann von franz hellebarde zu boden gebracht und durch einen schlag in hals und schulter getotet er starb binnen sekunden und sprach nach dem todlichen treffer keine letzten worte","links":[],"backlinks":["story-so-far","zeit-0201"],"initial":"C"},{"id":"donnagin","category":"personen","title":"Father Althus Donnagin","summary":"Balentynes ranghoher Mitra-Kleriker; im Schrein von Styke und Valeria getötet.","body":"<h2>Bekannte Rolle<\/h2><p>Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur.<\/p><h2>Tod im Schrein<\/h2><p>Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt.<\/p><h2>Valerias Abschied<\/h2><p>Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.<\/p>","sources":["core","live","chronicle"],"status":"Tot seit 9. Februar","tags":["Mitra","Kleriker","Balentyne"],"aliases":["Father Donnagin","Althus Donnagin","Donnagin"],"group":"garrison","text":"Bekannte Rolle Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur. Tod im Schrein Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt. Valerias Abschied Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.","search":"father althus donnagin balentynes ranghoher mitra kleriker im schrein von styke und valeria getotet father donnagin althus donnagin donnagin mitra kleriker balentyne garrison bekannte rolle father althus donnagin war balentynes ranghoher mitraner berichte uber krankenbesuche eine schwierige geburt und die versorgung ernsthaft erkrankter soldaten zeichneten ihn als pflichtbewussten priester nicht als karikatur tod im schrein styke vesper und valeria fanden ihn nach mitternacht im klerikerbereich donnagin starb im kampf gegen styke und valeria ein junger akolyth wurde lebend uberwaltigt gebunden und geknebelt valerias abschied valeria half ihn zu toten ohne ihr fruheres urteil uber ihn umzuschreiben danach schloss sie donnagin die augen und sagte sinngemass der personliche teil musse spater kommen seine 1 brustplatte schlussel und sein silbernes mitra symbol wurden geborgen","links":[],"backlinks":[],"initial":"F"},{"id":"havelyn","category":"personen","title":"Lord Thomas Havelyn","summary":"Ehemaliger Kommandant Balentynes; in seinen oberen Räumen von Styke getötet.","body":"<h2>Kommandant Balentynes<\/h2><p>Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod.<\/p><h2>Tod in den oberen Räumen<\/h2><p>Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn.<\/p><h2>Geborgene Hinterlassenschaft<\/h2><p>Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die <a href=\"#/artikel/havelyn-bibel\">Familienbibel<\/a> geborgen.<\/p>","sources":["core","balentyne","live"],"status":"Tot seit 9. Februar","tags":["Kommandant","Balentyne"],"aliases":["Thomas Havelyn","Havelyn"],"group":"garrison","text":"Kommandant Balentynes Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod. Tod in den oberen Räumen Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn. Geborgene Hinterlassenschaft Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die Familienbibel geborgen.","links":["havelyn-bibel"],"backlinks":["thorn"],"search":"lord thomas havelyn ehemaliger kommandant balentynes in seinen oberen raumen von styke getotet thomas havelyn havelyn kommandant balentyne garrison kommandant balentynes lord thomas havelyn kommandierte balentyne und herrschte uber aldencross thorns auftrag verlangte ausdrucklich seinen tod tod in den oberen raumen das kerntrio erreichte havelyn ohne allgemeinen alarm er hatte zeit fur kurze magische vorbereitung aber nicht fur seine vollplatte sein schwerster schlag gegen vesper wurde grosstenteils von styke ubernommen danach totete styke ihn geborgene hinterlassenschaft vesper tragt havelyns headband of alluring charisma 2 seine gespeicherte vollplatte verwandelte sich unter valerias hand in eine schwarze 1 dastard vollplatte ballinger ist nach dem ende der gottlichen bindung ein meisterarbeits langschwert ausserdem wurden meisterarbeits dolch stahlschild hauptschlussel und die familienbibel geborgen","initial":"L"},{"id":"tacitus","category":"personen","title":"Magisterin Tacitus von Morimun","summary":"Gebundene Gelehrte an Bord der Folly; arbeitet mit Zorn am dritten vollen Tag ihres Familiar-Projekts.","body":"<h2>Magisterin und Gelehrte<\/h2><p>Tacitus von Morimun ist eine drahtige Frau mittleren Alters mit rotbraunem Haar, kleiner Goldbrille und tintenbefleckten Fingern. Sie diente Balentyne, Talingarde und Mitra. Diese Vergangenheit wurde durch ihre Niederlage nicht zu einer Verkleidung.<\/p><h2>Bindung und Stellung<\/h2><p>Nach Balentynes Fall blieb Tacitus trotz Jacobians Angebot. Sie nahm den Compact an und wurde eine Gebundene unter Styke und Vesper. Ihr Zauberbuch, ihre Brille und <a href=\"#/artikel/heart-all-flame\">The Heart of All Flame<\/a> wurden ihr zurückgegeben. Sie übernimmt Plankritik, Forschung an ungewöhnlicher Magie und die Entwicklung der magischen Ausrüstung des Knotens.<\/p><h2>Familiar-Projekt<\/h2><p>Auf der Folly verwarf Tacitus den bloßen Tausch ihres Feuerballstabs gegen einen Ring. Sie arbeitet stattdessen mit Zorn an einer selbst entwickelten Umstellung ihres arkanen Bandes. Zehn volle Arbeitstage und 350 gp Material sind vorgesehen. Am 12. Februar läuft <a href=\"#/artikel/tacitus-familiarprojekt\">Tag drei<\/a>. Der Feuerballstab bleibt bis zum Abschluss ihr gebundener Gegenstand und Knoteneigentum.<\/p><h2>Persönliche Zusage<\/h2><p>Styke versprach, Tacitus zurückzuholen, falls sie erneut verschleppt wird. Tacitus erklärte, dass sie ihn an dieses Versprechen halten und bei einer rational möglichen Rettung seinerseits ebenfalls mitgehen würde.<\/p><p><a href=\"#/artikel/anatomie-tacitus\">Private Körperakte<\/a><\/p>","sources":["tacitus-current","live","chronicle"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Tacitus","Gebundene","Magierin","Forschung"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Magisterin und Gelehrte Tacitus von Morimun ist eine drahtige Frau mittleren Alters mit rotbraunem Haar, kleiner Goldbrille und tintenbefleckten Fingern. Sie diente Balentyne, Talingarde und Mitra. Diese Vergangenheit wurde durch ihre Niederlage nicht zu einer Verkleidung. Bindung und Stellung Nach Balentynes Fall blieb Tacitus trotz Jacobians Angebot. Sie nahm den Compact an und wurde eine Gebundene unter Styke und Vesper. Ihr Zauberbuch, ihre Brille und The Heart of All Flame wurden ihr zurückgegeben. Sie übernimmt Plankritik, Forschung an ungewöhnlicher Magie und die Entwicklung der magischen Ausrüstung des Knotens. Familiar-Projekt Auf der Folly verwarf Tacitus den bloßen Tausch ihres Feuerballstabs gegen einen Ring. Sie arbeitet stattdessen mit Zorn an einer selbst entwickelten Umstellung ihres arkanen Bandes. Zehn volle Arbeitstage und 350 gp Material sind vorgesehen. Am 12. Februar läuft Tag drei . Der Feuerballstab bleibt bis zum Abschluss ihr gebundener Gegenstand und Knoteneigentum. Persönliche Zusage Styke versprach, Tacitus zurückzuholen, falls sie erneut verschleppt wird. Tacitus erklärte, dass sie ihn an dieses Versprechen halten und bei einer rational möglichen Rettung seinerseits ebenfalls mitgehen würde. Private Körperakte","search":"magisterin tacitus von morimun gebundene gelehrte an bord der folly arbeitet mit zorn am dritten vollen tag ihres familiar projekts tacitus of morimun tacitus von morimun tacitus tacitus gebundene magierin forschung garrison magisterin und gelehrte tacitus von morimun ist eine drahtige frau mittleren alters mit rotbraunem haar kleiner goldbrille und tintenbefleckten fingern sie diente balentyne talingarde und mitra diese vergangenheit wurde durch ihre niederlage nicht zu einer verkleidung bindung und stellung nach balentynes fall blieb tacitus trotz jacobians angebot sie nahm den compact an und wurde eine gebundene unter styke und vesper ihr zauberbuch ihre brille und the heart of all flame wurden ihr zuruckgegeben sie ubernimmt plankritik forschung an ungewohnlicher magie und die entwicklung der magischen ausrustung des knotens familiar projekt auf der folly verwarf tacitus den blossen tausch ihres feuerballstabs gegen einen ring sie arbeitet stattdessen mit zorn an einer selbst entwickelten umstellung ihres arkanen bandes zehn volle arbeitstage und 350 gp material sind vorgesehen am 12 februar lauft tag drei der feuerballstab bleibt bis zum abschluss ihr gebundener gegenstand und knoteneigentum personliche zusage styke versprach tacitus zuruckzuholen falls sie erneut verschleppt wird tacitus erklarte dass sie ihn an dieses versprechen halten und bei einer rational moglichen rettung seinerseits ebenfalls mitgehen wurde private korperakte","links":["heart-all-flame","tacitus-familiarprojekt","anatomie-tacitus"],"backlinks":["anatomie-tacitus","spielstand","story-so-far","styke","zeit-tacitus"],"initial":"M"},{"id":"jacobian","category":"personen","title":"Jacobian Scaramore","summary":"Tacitus’ enger Freund; am 9. Februar mit Proviant und einem Pferd freigelassen.","body":"<h2>Buchhändler und Freund<\/h2><p>Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts.<\/p>\n<h2>Freilassung<\/h2><p>Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance.<\/p>\n<p>Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.<\/p>","sources":["core","live","chronicle","tacitus-current"],"status":"Am 9. Februar freigelassen; weiterer Weg unbekannt","tags":["Schreiber","Kontakt","Aldencross"],"aliases":["Scaramore","Jacobian"],"group":"town","text":"Buchhändler und Freund Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts. Freilassung Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance. Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.","links":[],"backlinks":["scroll","story-so-far","zeit-tacitus"],"search":"jacobian scaramore tacitus enger freund am 9 februar mit proviant und einem pferd freigelassen scaramore jacobian schreiber kontakt aldencross town buchhandler und freund jacobian scaramore betrieb h":"william marcus marlowe leiter der ye merrie men eine auffuhrung in balentyne ist als kommende gelegenheit bekannt marlowe theater offener hinweis town bekannte verbindung die reisende schauspieltruppe ye merrie men soll the fall of amberlyn fur soldaten in balentyne auffuhren bellam erzahlte davon am 27 januar stand der planung dass eine solche auffuhrung kommen soll ist ein etablierter hinweis exaktes datum uhrzeit besetzung zugangskontrolle und bewegungen der truppe sind noch nicht geklart das wiki macht daraus keine bereits verfugbare tarnidentitat oder sichere einlassmoglichkeit","initial":"W"},{"id":"giuseppe","category":"personen","title":"Mama Louisa Giuseppe","summary":"Balentynes Köchin; Vesper gab alle sechs Rattengiftpäckchen in ihren großen Gemeinschaftseintopf und sah die Ausgabe beginnen.","body":"<h2>Beobachtete Routine<\/h2><p>Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet.<\/p>\n<h2>Der 1. Februar<\/h2><p>Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet.<\/p>\n<h2>Der 8. Februar<\/h2><p>Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan.<\/p>\n<p><a href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan<\/a> / <a href=\"#/artikel/kueche\">Bekanntes Küchenwissen<\/a><\/p><h2>Der 8. Februar<\/h2><p>Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher.<\/p>","sources":["chronicle","live","timeline"],"status":"Eintopf am 8. Februar vergiftet","tags":["Küche","Routine","8. Februar"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Der 1. Februar Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet. Der 8. Februar Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan. Eintopf und Sabotageplan / Bekanntes Küchenwissen Der 8. Februar Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher.","links":["eintopf-plan","kueche"],"backlinks":["story-so-far"],"search":"mama louisa giuseppe balentynes kochin vesper gab alle sechs rattengiftpackchen in ihren grossen gemeinschaftseintopf und sah die ausgabe beginnen mama giuseppe louisa giuseppe giuseppe kuche routine 8 februar town beobachtete routine vesper erfuhr am 30 januar dass mama giuseppe wochentlich einen grossen rindereintopf aus einem gemeinsamen topf fur ungefahr siebzig dienstfreie soldaten zubereitet der 1 februar vesper half bei der ausgabe die kuche war hektisch der gemeinschaftskessel wurde in ihrer gegenwart nicht besonders gepruft der eintopf blieb an diesem tag unangetastet der 8 februar die nachste bekannte gelegenheit fallt auf den 8 februar sechs packchen rattengift liegen im wassermuhlen versteck zugang aufsicht dosis und wirkung sind noch offen giuseppe selbst gehort nicht zum plan eintopf und sabotageplan bekanntes kuchenwissen der 8 februar vesper gelangte erneut uber den zivilen arbeiterweg in die kuche und gab alle sechs kleinen rattengiftpackchen in den grossen eintopf sie bemerkte dabei keinen zeugen und sah die ausgabe beginnen eine konkrete wirkung beobachtete sie nicht spatere folgen kennt der knoten nicht sicher","initial":"M"},{"id":"varning","category":"personen","title":"Captain Ryan Varning","summary":"Mit seiner sechsköpfigen berittenen Patrouille am 26. Januar bei Freeman's Rock getötet.","body":"<h2>Gesicherter Verlauf<\/h2>\n<p>Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; <a href=\"#/artikel/styke\">Styke<\/a> tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben.<\/p>\n<h2>Nachwirkungen<\/h2>\n<p>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen <a href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel<\/a>, <a href=\"#/artikel/grumblejack\">Grumblejack<\/a> erhielt <a href=\"#/artikel/varlet\">Varlet<\/a>.<\/p>\n<p>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. <strong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.<\/strong><\/p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["styke","varning-schluessel","grumblejack","varlet"],"backlinks":["story-so-far","zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26 januar bei freeman s rock getotet ryan varning varning tot patrouille garrison gesicherter verlauf varning verliess balentyne am 24 januar mit sechs ausgewahlten reitern der knoten klarte ihren lagerplatz auf und griff in der nacht des 26 januar an varning ergab sich schwer verwundet styke totete ihn gemass seiner zuvor festgelegten keine gefangenen anweisung alle sieben patrouillenmitglieder starben nachwirkungen die leichen wurden verborgen der platz bereinigt und sieben pferde erbeutet markante ausrustung blieb in einem versteck ausserhalb aldencross styke behielt einen noch nicht identifizierten schlussel grumblejack erhielt varlet am 29 januar galt die patrouille offen als verspatet und suchreiter brachen auf seit 31 januar ist ihr tod in balentyne bekannt die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht","initial":"C"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"<h2>Eigentum und Ort<\/h2>\n<p>Nach Freeman's Rock gab <a href=\"#/artikel/styke\">Styke<\/a> das Pferd ausdrücklich <a href=\"#/artikel/grumblejack\">Grumblejack<\/a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.<\/p>\n<p>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.<\/p>\n","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.","links":["styke","grumblejack"],"backlinks":["story-so-far","varning","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd jetzt grumblejacks eigener anteil und packtier tier feldgruppe field eigentum und ort nach freeman s rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil varlet ist nicht einfach beliebiges gruppeninventar es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe eine spatere verausserung verletzung oder verlegung ist nicht berichtet","initial":"V"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"<h2>Kampagnenfassung<\/h2>\n<p>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.<\/p>\n<h2>Folgen der Begegnung<\/h2>\n<p>Vesper barg <a href=\"#/artikel/verse\">Verse<\/a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.<\/p>\n<p><strong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.<\/strong><\/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","vesper","verse"],"backlinks":["branderscar","story-so-far","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin sie uberlebte den angenommenen ausbruch mathias richter richter branderscar historisch history kampagnenfassung matilda ist die weibliche kampagnenkonversion der branderscar vorsteherfigur styke und vesper setzten sie in ihren privatraumen nichttodlich ausser gefecht das archiv setzt sie nicht nachtraglich auf den gedruckten ausgang zuruck folgen der begegnung vesper barg verse aus einem beweisbehalter ihrer bibliothek und verzichtete auf weitere rache an der hilflosen eine moorkarte und richters zauberbuch wurden mitgenommen schwere alchemistische ausrustung blieb zuruck ihr spaterer aufenthaltsort und zustand nach branderscar sind nicht geklart","initial":"M"},{"id":"sambryl","category":"personen","title":"Captain Edward Sambryl","summary":"Talireanischer Patrouillenkapitän aus der Frosthamar-Reise.","body":"<h2>Begegnung auf See<\/h2>\n<p>Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten.<\/p>\n<h2>Grenze der Rekonstruktion<\/h2>\n<p>Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den <a href=\"#/artikel/yutak\">Yutak-Handel<\/a> ein und sind nicht automatisch noch im Inventar.<\/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Seereise","Historisch"],"aliases":["Edward Sambryl","Sambryl"],"group":"history","text":"Begegnung auf See Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten. Grenze der Rekonstruktion Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den Yutak-Handel ein und sind nicht automatisch noch im Inventar.","links":["yutak"],"backlinks":["story-so-far","zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar reise edward sambryl sambryl seereise historisch history begegnung auf see seine patrouille wurde wahrend der frosthamar reise besiegt sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser einem kurzbogen und pfeilen freigelassen nicht als gefolgsleute behalten grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest beutestucke der patrouille gingen in den yutak handel ein und sind nicht automatisch noch im inventar","initial":"C"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"<h2>Mannschaft und Ende<\/h2>\n<p><a href=\"#/artikel/hakon\">Hakon<\/a>, <a href=\"#/artikel/sten\">Sten<\/a>, <a href=\"#/artikel/ketil\">Ketil<\/a>, <a href=\"#/artikel/eirik\">Eirik<\/a>, <a href=\"#/artikel/arved\">Arved<\/a> und <a href=\"#/artikel/torvald\">Torvald<\/a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.<\/p>\n<p>Odenkirk starb. Die <a href=\"#/artikel/frosthamar\">Frosthamar<\/a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.<\/p>\n<h2>Kein automatisches Restinventar<\/h2>\n<p>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.<\/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Tot","Seereise"],"aliases":["Kargeld Odenkirk","Odenkirk"],"group":"history","text":"Mannschaft und Ende Hakon , Sten , Ketil , Eirik , Arved und Torvald waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand. Odenkirk starb. Die Frosthamar wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren. Kein automatisches Restinventar Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.","links":["hakon","sten","ketil","eirik","arved","torvald","frosthamar"],"backlinks":["story-so-far"],"search":"captain kargeld odenkirk ehemaliger kapitan der frosthamar im akzeptierten verlauf tot kargeld odenkirk odenkirk tot seereise history mannschaft und ende hakon sten ketil eirik arved und torvald waren seine seeleute sie verliessen seine mannschaft und nahmen stykes bezahlung an bevor odenkirks letzter konflikt stattfand odenkirk starb die frosthamar wurde zerstort nachdem tragbare wertgegenstande und thorns zahlung geborgen waren kein automatisches restinventar seine meisterarbeits axt wurfaxte kleine silberfigur dreizack whisky und andere beute sind an den spateren verkaufs und inventarverlauf gebunden das his
