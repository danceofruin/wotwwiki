doras Eintreffen am Bruchort gewöhnlich innerhalb von etwa ein bis zwei Stunden. Stand Es ist gemeinsamer Missionsbesitz und nicht als bereits gebrochen verbucht. Der intern erwogene Angriffstermin wurde dadurch noch nicht weitergegeben.","links":[],"backlinks":["tiadora"],"search":"nessianisches kontaktsiegel noch intakte kontaktmoglichkeit zu tiadora fur ernste meldungen gruppe etablierte anwendung das siegel kann fur eine ernsthafte meldung oder missionsnotwendigkeit gebrochen werden erwartet wird tiadoras eintreffen am bruchort gewohnlich innerhalb von etwa ein bis zwei stunden stand es ist gemeinsamer missionsbesitz und nicht als bereits gebrochen verbucht der intern erwogene angriffstermin wurde dadurch noch nicht weitergegeben"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"<h2>Herkunft</h2>\n<p>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt <a href=\"#/artikel/styke\">Styke</a>.</p>\n<h2>Wissensgrenze</h2>\n<p>Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.</p>\n","sources":["chronicle","live"],"status":"Nicht identifiziert","tags":["Styke"],"aliases":[],"text":"Herkunft Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt Styke . Wissensgrenze Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.","links":["styke"],"backlinks":["varning","story-so-far","zeit-0126"],"search":"varnings kleiner schlussel von styke behalten passendes schloss bisher nicht identifiziert styke herkunft beute aus der operation an freeman s rock die auffallige grossere ausrustung wurde ausserhalb aldencross versteckt den kleinen schlussel behielt styke wissensgrenze zu welchem schloss er gehort ist offen ein abenteuerplan oder gegnerisches inventar liefert dafur keinen automatisch freigeschalteten nutzen"},{"id":"beute-cache","category":"gegenstaende","title":"Versteckte Patrouillenausrüstung","summary":"Varnings markante Beute liegt nicht im Dalliance offen herum.","body":"<h2>Dokumentierte Stücke</h2>\n<p>+1-Schild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen sind außerhalb Aldencross' zwischengelagert. Die sieben Pferde blieben bei Hakons Gruppe.</p>\n<h2>Keine automatische Verfügbarkeit</h2>\n<p>Der Cache wird nicht als getragenes Inventar behandelt. Die genaue Position wird in diesem Spielerwiki nicht neu erfunden. Vespers Mithralschild ist nicht Varnings versteckter +1-Schild.</p>\n","sources":["chronicle","live"],"status":"Ausgelagert","tags":["Gruppe"],"aliases":[],"text":"Dokumentierte Stücke +1-Schild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen sind außerhalb Aldencross' zwischengelagert. Die sieben Pferde blieben bei Hakons Gruppe. Keine automatische Verfügbarkeit Der Cache wird nicht als getragenes Inventar behandelt. Die genaue Position wird in diesem Spielerwiki nicht neu erfunden. Vespers Mithralschild ist nicht Varnings versteckter +1-Schild.","links":[],"backlinks":["story-so-far","zeit-0126"],"search":"versteckte patrouillenausrustung varnings markante beute liegt nicht im dalliance offen herum gruppe dokumentierte stucke 1 schild meisterarbeits vollplatte meisterarbeits lanze und meisterarbeits kompositkurzbogen sind ausserhalb aldencross zwischengelagert die sieben pferde blieben bei hakons gruppe keine automatische verfugbarkeit der cache wird nicht als getragenes inventar behandelt die genaue position wird in diesem spielerwiki nicht neu erfunden vespers mithralschild ist nicht varnings versteckter 1 schild"},{"id":"ketten-beschlaege","category":"gegenstaende","title":"Ketten, Ringe, Nägel und Keile","summary":"Am 31. Januar gekauft, aber noch nicht im Tunnel installiert.","body":"<h2>Vorhandenes Material</h2>\n<p>Zwei schwere Kettenlängen, massive geschlossene Eisenringe mit flachen Montageplatten, lange geschmiedete Nägel beziehungsweise Spieße und zwei kurze Eisenkeile.</p>\n<h2>Erklärter Zweck und Stand</h2>\n<p>Die Gruppe erwägt einen Verwahrpunkt im Tunnel. Die Ausrüstung wurde gekauft; eine Montage oder belastbare Raumprüfung fand nicht statt. Auch der vergangene Nachtwechsel hat die Arbeit nicht automatisch erledigt.</p>\n","sources":["live"],"status":"Gekauft / nicht montiert","tags":["Gruppe"],"aliases":["Ketten","Beschläge"],"text":"Vorhandenes Material Zwei schwere Kettenlängen, massive geschlossene Eisenringe mit flachen Montageplatten, lange geschmiedete Nägel beziehungsweise Spieße und zwei kurze Eisenkeile. Erklärter Zweck und Stand Die Gruppe erwägt einen Verwahrpunkt im Tunnel. Die Ausrüstung wurde gekauft; eine Montage oder belastbare Raumprüfung fand nicht statt. Auch der vergangene Nachtwechsel hat die Arbeit nicht automatisch erledigt.","links":[],"backlinks":["zeit-0131-tag","intim-requisiten"],"search":"ketten ringe nagel und keile am 31 januar gekauft aber noch nicht im tunnel installiert ketten beschlage gruppe vorhandenes material zwei schwere kettenlangen massive geschlossene eisenringe mit flachen montageplatten lange geschmiedete nagel beziehungsweise spiesse und zwei kurze eisenkeile erklarter zweck und stand die gruppe erwagt einen verwahrpunkt im tunnel die ausrustung wurde gekauft eine montage oder belastbare raumprufung fand nicht statt auch der vergangene nachtwechsel hat die arbeit nicht automatisch erledigt"},{"id":"tinkturen","category":"gegenstaende","title":"Die drei gekauften Präparate","summary":"Spielinventar: Schlaf-/Beruhigungstinktur, Abführmittel und Tierberuhigungsmittel.","body":"<h2>Bestätigter Kauf</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> kaufte am 31. Januar drei verschiedene Präparate unter einer Deckgeschichte. Die menschliche Tinktur ist keine zuverlässige sofortige Ausschaltung. Ein Teil des Abführmittels wurde Tacitus gegeben; die genaue Restmenge ist unbekannt. Das Tierpräparat ist ein kleines wachsversiegeltes Gefäß mit rotem Faden.</p>\n<h2>Nicht gleichsetzen</h2>\n<p>Die drei Mittel sind weder austauschbar noch als sichere automatische Mechanik festgelegt. Das Tiermittel wurde im Spiel als unberechenbar gefährlich beschrieben, besonders im Zusammenhang mit Alkohol. Es wurde bei Tacitus nicht verwendet.</p>\n<h2>Bestandsgrenze</h2>\n<p>Rattengift ist <strong>noch nicht gekauft</strong>. Genaue Preise, aktuelle Restmengen und eine exakte Dosismechanik sind nicht festgelegt. Dieser Eintrag dokumentiert ausschließlich fiktives Kampagneninventar und liefert keine reale Anwendungsvorschrift.</p>\n","sources":["live"],"status":"Teilweise verbraucht","tags":["Gruppe"],"aliases":["Abführmittel","Schlaftinktur","Pferdemittel","Rattengift"],"text":"Bestätigter Kauf Styke kaufte am 31. Januar drei verschiedene Präparate unter einer Deckgeschichte. Die menschliche Tinktur ist keine zuverlässige sofortige Ausschaltung. Ein Teil des Abführmittels wurde Tacitus gegeben; die genaue Restmenge ist unbekannt. Das Tierpräparat ist ein kleines wachsversiegeltes Gefäß mit rotem Faden. Nicht gleichsetzen Die drei Mittel sind weder austauschbar noch als sichere automatische Mechanik festgelegt. Das Tiermittel wurde im Spiel als unberechenbar gefährlich beschrieben, besonders im Zusammenhang mit Alkohol. Es wurde bei Tacitus nicht verwendet. Bestandsgrenze Rattengift ist noch nicht gekauft . Genaue Preise, aktuelle Restmengen und eine exakte Dosismechanik sind nicht festgelegt. Dieser Eintrag dokumentiert ausschließlich fiktives Kampagneninventar und liefert keine reale Anwendungsvorschrift.","links":["styke"],"backlinks":["zeit-0131-tag"],"search":"die drei gekauften praparate spielinventar schlaf beruhigungstinktur abfuhrmittel und tierberuhigungsmittel abfuhrmittel schlaftinktur pferdemittel rattengift gruppe bestatigter kauf styke kaufte am 31 januar drei verschiedene praparate unter einer deckgeschichte die menschliche tinktur ist keine zuverlassige sofortige ausschaltung ein teil des abfuhrmittels wurde tacitus gegeben die genaue restmenge ist unbekannt das tierpraparat ist ein kleines wachsversiegeltes gefass mit rotem faden nicht gleichsetzen die drei mittel sind weder austauschbar noch als sichere automatische mechanik festgelegt das tiermittel wurde im spiel als unberechenbar gefahrlich beschrieben besonders im zusammenhang mit alkohol es wurde bei tacitus nicht verwendet bestandsgrenze rattengift ist noch nicht gekauft genaue preise aktuelle restmengen und eine exakte dosismechanik sind nicht festgelegt dieser eintrag dokumentiert ausschliesslich fiktives kampagneninventar und liefert keine reale anwendungsvorschrift"},{"id":"graue-briefe","category":"gegenstaende","title":"Die Briefe mit dem grauen Band","summary":"Gelesene Belege für die Verbindung zwischen Kaitlyn und Zack; nicht gestohlen.","body":"<h2>Fund und Informationsweg</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sah das Bündel am 28. Januar in Kaitlyns Truhe. Am 29. Januar las <a href=\"#/artikel/vesper\">Vesper</a> die Briefe, stellte alles wieder her und berichtete Styke. Dadurch ist die Affäre Kaitlyn/Zack als Spielerwissen belegt.</p>\n<h2>Besitz und Grenzen</h2>\n<p>Die Briefe wurden zurückgelegt. Sie sind nicht Teil des mitgeführten Gruppeninventars. Exakte Zustellwege und wiederkehrende Termine wurden dadurch nicht vollständig bekannt.</p>\n","sources":["chronicle","core","relations"],"status":"Gelesen / zurückgelegt","tags":["Kaitlyn"],"aliases":["Graues Band","Liebesbriefe"],"text":"Fund und Informationsweg Styke sah das Bündel am 28. Januar in Kaitlyns Truhe. Am 29. Januar las Vesper die Briefe, stellte alles wieder her und berichtete Styke. Dadurch ist die Affäre Kaitlyn/Zack als Spielerwissen belegt. Besitz und Grenzen Die Briefe wurden zurückgelegt. Sie sind nicht Teil des mitgeführten Gruppeninventars. Exakte Zustellwege und wiederkehrende Termine wurden dadurch nicht vollständig bekannt.","links":["styke","vesper"],"backlinks":["kaitlyn","zeit-0129"],"search":"die briefe mit dem grauen band gelesene belege fur die verbindung zwischen kaitlyn und zack nicht gestohlen graues band liebesbriefe kaitlyn fund und informationsweg styke sah das bundel am 28 januar in kaitlyns truhe am 29 januar las vesper die briefe stellte alles wieder her und berichtete styke dadurch ist die affare kaitlyn zack als spielerwissen belegt besitz und grenzen die briefe wurden zuruckgelegt sie sind nicht teil des mitgefuhrten gruppeninventars exakte zustellwege und wiederkehrende termine wurden dadurch nicht vollstandig bekannt"},{"id":"barnabus-karte","category":"gegenstaende","title":"Kopie von Barnabus' Vermessungskarte","summary":"Dokumentierter Gruppenbesitz; aktueller Träger nicht bestimmt.","body":"<h2>Gesichert</h2>\n<p>Der aktuelle Live-Stand verzeichnet eine kopierte Vermessungskarte Barnabus Eisenbauchs als Gruppenbesitz.</p>\n<h2>Grenzen</h2>\n<p>Ein genauer aktueller Träger ist nicht festgelegt. Das Wiki erfindet keine Zeichnung und keine zusätzlichen Raumdetails aus dem bloßen Kartentitel. Torhausinformationen stehen nur in dem Umfang bereit, in dem <a href=\"#/artikel/valeria\">Valeria</a> sie wirklich berichtet hat.</p>\n","sources":["live"],"status":"Kopie vorhanden","tags":["Gruppe"],"aliases":[],"text":"Gesichert Der aktuelle Live-Stand verzeichnet eine kopierte Vermessungskarte Barnabus Eisenbauchs als Gruppenbesitz. Grenzen Ein genauer aktueller Träger ist nicht festgelegt. Das Wiki erfindet keine Zeichnung und keine zusätzlichen Raumdetails aus dem bloßen Kartentitel. Torhausinformationen stehen nur in dem Umfang bereit, in dem Valeria sie wirklich berichtet hat.","links":["valeria"],"backlinks":[],"search":"kopie von barnabus vermessungskarte dokumentierter gruppenbesitz aktueller trager nicht bestimmt gruppe gesichert der aktuelle live stand verzeichnet eine kopierte vermessungskarte barnabus eisenbauchs als gruppenbesitz grenzen ein genauer aktueller trager ist nicht festgelegt das wiki erfindet keine zeichnung und keine zusatzlichen raumdetails aus dem blossen kartentitel torhausinformationen stehen nur in dem umfang bereit in dem valeria sie wirklich berichtet hat"},{"id":"timeon-karte","category":"gegenstaende","title":"Timeons Erinnerungskarte","summary":"Grobe Balentyne-Skizze aus persönlicher Erinnerung und Gehörtem.","body":"<h2>Herkunft</h2>\n<p><a href=\"#/artikel/timeon\">Timeon</a> half in der Ausbildungsphase, eine grobe Erinnerungskarte und einen begrenzten Bericht zu Balentyne zu erstellen.</p>\n<h2>Verwendbarkeit</h2>\n<p>Die Skizze ist unvollständig und nicht garantiert aktuell. Sie ist keine Rechtfertigung, alle verborgenen Räume oder heutigen Wachposten zu kennen. Eine genaue aktuelle Lagerstelle ist nicht sicher verzeichnet.</p>\n","sources":["core","relations","balentyne"],"status":"Begrenzte Erinnerung","tags":["Gruppe"],"aliases":[],"text":"Herkunft Timeon half in der Ausbildungsphase, eine grobe Erinnerungskarte und einen begrenzten Bericht zu Balentyne zu erstellen. Verwendbarkeit Die Skizze ist unvollständig und nicht garantiert aktuell. Sie ist keine Rechtfertigung, alle verborgenen Räume oder heutigen Wachposten zu kennen. Eine genaue aktuelle Lagerstelle ist nicht sicher verzeichnet.","links":["timeon"],"backlinks":["timeon"],"search":"timeons erinnerungskarte grobe balentyne skizze aus personlicher erinnerung und gehortem gruppe herkunft timeon half in der ausbildungsphase eine grobe erinnerungskarte und einen begrenzten bericht zu balentyne zu erstellen verwendbarkeit die skizze ist unvollstandig und nicht garantiert aktuell sie ist keine rechtfertigung alle verborgenen raume oder heutigen wachposten zu kennen eine genaue aktuelle lagerstelle ist nicht sicher verzeichnet"},{"id":"exorzisten-buch","category":"gegenstaende","title":"Der Exorzisten-Reisebericht","summary":"Gebrauchtes mitranisches Reisebuch mit Aasimar-Kapitel; letzter sicherer Ort im Mott-Haus.","body":"<h2>Erwerb und Verwendung</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus.</p>\n<h2>Nicht verwechseln</h2>\n<p>Das ist <strong>nicht Vespers rotes Buch</strong>. Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen.</p>\n","sources":["chronicle","live"],"status":"Letzter Ort: Mott-Haus","tags":["Styke"],"aliases":[],"text":"Erwerb und Verwendung Styke kaufte es am 28. Januar bei Jacobian. Es diente auch der Deckgeschichte, mit der Kaitlyn ihn ins Haus ließ. Der letzte ausdrücklich genannte Ablageort ist der vordere Tisch im Mott-Haus. Nicht verwechseln Das ist nicht Vespers rotes Buch . Stykes Eigentum am Reisebericht beweist nicht, dass er ihn wieder eingepackt hat. Eine spätere Abholung ist nicht angenommen.","links":["styke"],"backlinks":["zeit-0128"],"search":"der exorzisten reisebericht gebrauchtes mitranisches reisebuch mit aasimar kapitel letzter sicherer ort im mott haus styke erwerb und verwendung styke kaufte es am 28 januar bei jacobian es diente auch der deckgeschichte mit der kaitlyn ihn ins haus liess der letzte ausdrucklich genannte ablageort ist der vordere tisch im mott haus nicht verwechseln das ist nicht vespers rotes buch stykes eigentum am reisebericht beweist nicht dass er ihn wieder eingepackt hat eine spatere abholung ist nicht angenommen"},{"id":"rotes-buch","category":"gegenstaende","title":"Vespers rotes Buch","summary":"Privates Buch über intime Praktiken, zum Alltag des Paares gehörig.","body":"<h2>Zimmerbestand</h2>\n<p>Vespers kleines rotes Buch liegt gewöhnlich bei der privaten Zimmerausrüstung. Es enthält Material zu intimen Praktiken und diente mehrfach als Ausgangspunkt für gemeinsame Experimente.</p>\n<h2>Die Nacht zum 1. Februar</h2>\n<p>Das Buch lag offen, als Styke Vesper die Führung überließ. Augenbinde und weiches Seil gehörten zur selben Begegnung. Welche konkrete Seite Vesper benutzte, ist in der Chronik nicht überliefert.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-requisiten\">Rotes Buch, Seil und Augenbinden</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["live","vesper","relations"],"status":"Im Besitz","tags":["Vesper"],"aliases":[],"text":"Zimmerbestand Vespers kleines rotes Buch liegt gewöhnlich bei der privaten Zimmerausrüstung. Es enthält Material zu intimen Praktiken und diente mehrfach als Ausgangspunkt für gemeinsame Experimente. Die Nacht zum 1. Februar Das Buch lag offen, als Styke Vesper die Führung überließ. Augenbinde und weiches Seil gehörten zur selben Begegnung. Welche konkrete Seite Vesper benutzte, ist in der Chronik nicht überliefert. Private Akte (18+) Rotes Buch, Seil und Augenbinden . Der Nachtrag erscheint nach Altersbestätigung.","links":["intim-requisiten"],"backlinks":[],"search":"vespers rotes buch privates buch uber intime praktiken zum alltag des paares gehorig vesper zimmerbestand vespers kleines rotes buch liegt gewohnlich bei der privaten zimmerausrustung es enthalt material zu intimen praktiken und diente mehrfach als ausgangspunkt fur gemeinsame experimente die nacht zum 1 februar das buch lag offen als styke vesper die fuhrung uberliess augenbinde und weiches seil gehorten zur selben begegnung welche konkrete seite vesper benutzte ist in der chronik nicht uberliefert private akte 18 rotes buch seil und augenbinden der nachtrag erscheint nach altersbestatigung"},{"id":"weiches-seil","category":"gegenstaende","title":"Das weiche Seil","summary":"Weiches Fesselseil aus dem Zimmerbestand, klar getrennt von der für den Tunnel gekauften Eisenware.","body":"<h2>Zimmerbestand</h2>\n<p>Styke, Vesper und Valeria besitzen weiches Seil für private Fesselspiele. Es gehörte schon vor dem Einkauf vom 31. Januar zu ihrer Ausrüstung und lag in der Nacht zum 1. Februar zusammen mit Vespers rotem Buch und der Augenbinde bereit.</p>\n<h2>Getrennt von der Tunnelhardware</h2>\n<p>Die später gekauften Ketten, Eisenringe, Nägel und Keile sind schweres Material für den geplanten Verwahrpunkt im Tunnel. Das weiche Seil gehört zum Zimmerbestand; sein letzter genauer Ablageplatz wurde nicht protokolliert.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-requisiten\">Rotes Buch, Seil und Augenbinden</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["live","relations"],"status":"Im Besitz","tags":["Gruppe"],"aliases":[],"text":"Zimmerbestand Styke, Vesper und Valeria besitzen weiches Seil für private Fesselspiele. Es gehörte schon vor dem Einkauf vom 31. Januar zu ihrer Ausrüstung und lag in der Nacht zum 1. Februar zusammen mit Vespers rotem Buch und der Augenbinde bereit. Getrennt von der Tunnelhardware Die später gekauften Ketten, Eisenringe, Nägel und Keile sind schweres Material für den geplanten Verwahrpunkt im Tunnel. Das weiche Seil gehört zum Zimmerbestand; sein letzter genauer Ablageplatz wurde nicht protokolliert. Private Akte (18+) Rotes Buch, Seil und Augenbinden . Der Nachtrag erscheint nach Altersbestätigung.","links":["intim-requisiten"],"backlinks":[],"search":"das weiche seil weiches fesselseil aus dem zimmerbestand klar getrennt von der fur den tunnel gekauften eisenware gruppe zimmerbestand styke vesper und valeria besitzen weiches seil fur private fesselspiele es gehorte schon vor dem einkauf vom 31 januar zu ihrer ausrustung und lag in der nacht zum 1 februar zusammen mit vespers rotem buch und der augenbinde bereit getrennt von der tunnelhardware die spater gekauften ketten eisenringe nagel und keile sind schweres material fur den geplanten verwahrpunkt im tunnel das weiche seil gehort zum zimmerbestand sein letzter genauer ablageplatz wurde nicht protokolliert private akte 18 rotes buch seil und augenbinden der nachtrag erscheint nach altersbestatigung"},{"id":"abendkleider","category":"gegenstaende","title":"Die Kleider vom 30. Januar","summary":"Weinrote Wolle für Vesper, dunkelblaue Wolle für Valeria.","body":"<h2>Einkauf</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/valeria\">Valeria</a> kauften <a href=\"#/artikel/vesper\">Vesper</a> ein dunkles weinrotes Abendkleid und einen Kamm aus dunklem Horn für den Tacitus-Kontakt. Valeria wählte ein schlichtes dunkelblaues Wollkleid und zwei dunkle Metallhaarnadeln.</p>\n<h2>Kein Kredit aus einem Scherz</h2>\n<p>Der spätere Scherz gegenüber Mara, Vesper arbeite das Kleid ab, begründete keine echte Schuld oder einen neuen Vertrag.</p>\n","sources":["chronicle","live"],"status":"Im Besitz","tags":["Vesper / Valeria"],"aliases":[],"text":"Einkauf Styke und Valeria kauften Vesper ein dunkles weinrotes Abendkleid und einen Kamm aus dunklem Horn für den Tacitus-Kontakt. Valeria wählte ein schlichtes dunkelblaues Wollkleid und zwei dunkle Metallhaarnadeln. Kein Kredit aus einem Scherz Der spätere Scherz gegenüber Mara, Vesper arbeite das Kleid ab, begründete keine echte Schuld oder einen neuen Vertrag.","links":["styke","valeria","vesper"],"backlinks":["zeit-0130"],"search":"die kleider vom 30 januar weinrote wolle fur vesper dunkelblaue wolle fur valeria vesper valeria einkauf styke und valeria kauften vesper ein dunkles weinrotes abendkleid und einen kamm aus dunklem horn fur den tacitus kontakt valeria wahlte ein schlichtes dunkelblaues wollkleid und zwei dunkle metallhaarnadeln kein kredit aus einem scherz der spatere scherz gegenuber mara vesper arbeite das kleid ab begrundete keine echte schuld oder einen neuen vertrag"},{"id":"elfenbein","category":"gegenstaende","title":"Verkauftes Elfenbein und Narwalzahn","summary":"Beide Yutak-Lose wurden am 23. Januar für 3.200 gp verkauft.","body":"<h2>Herkunft und Werte</h2>\n<p>Der Handel mit den Yutak brachte Walrosselfenbein mit 1.200 gp Wert und White Tusks Narwalzahn mit 2.000 gp Wert. <a href=\"#/artikel/vesper\">Vesper</a> verkaufte beides in Aldencross.</p>\n<h2>Inventarfolge</h2>\n<p>Das ist kein noch verfügbarer Trophäenbestand. Die Summe dokumentiert den damaligen Verkauf, nicht das heutige nach allen Ausgaben verbleibende Gruppengeld.</p>\n","sources":["history","chronicle"],"status":"Verkauft","tags":["Historischer Besitz"],"aliases":["Narwalzahn","Walrosselfenbein"],"text":"Herkunft und Werte Der Handel mit den Yutak brachte Walrosselfenbein mit 1.200 gp Wert und White Tusks Narwalzahn mit 2.000 gp Wert. Vesper verkaufte beides in Aldencross. Inventarfolge Das ist kein noch verfügbarer Trophäenbestand. Die Summe dokumentiert den damaligen Verkauf, nicht das heutige nach allen Ausgaben verbleibende Gruppengeld.","links":["vesper"],"backlinks":["zeit-0123"],"search":"verkauftes elfenbein und narwalzahn beide yutak lose wurden am 23 januar fur 3 200 gp verkauft narwalzahn walrosselfenbein historischer besitz herkunft und werte der handel mit den yutak brachte walrosselfenbein mit 1 200 gp wert und white tusks narwalzahn mit 2 000 gp wert vesper verkaufte beides in aldencross inventarfolge das ist kein noch verfugbarer trophaenbestand die summe dokumentiert den damaligen verkauf nicht das heutige nach allen ausgaben verbleibende gruppengeld"},{"id":"wein-duftoel","category":"gegenstaende","title":"Wein und Duftöl vom 31. Januar","summary":"Tatsächliche Beschaffungen mit getrennten Verwendungszwecken.","body":"<h2>Wein</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> besorgte bei Bellam Wein und brachte ihn zum Tacitus-Treffen. Jacobian sagte nach den Beschwerden, er werde Tacitus dieselbe Flasche nicht noch einmal servieren. Eine Analyse oder Entsorgung ist nicht belegt.</p>\n<h2>Duftöl</h2>\n<p>Das vor dem Kaitlyn-Besuch gekaufte Öl wurde für die beabsichtigte Duftspur verwendet. Preis, Restmenge und heutiger Träger sind nicht exakt gesichert. Dass Franz daraus bereits die gewünschte Schlussfolgerung zog, ist unbekannt.</p>\n","sources":["live","core"],"status":"Verwendet / Rest offen","tags":["Verschiedene"],"aliases":[],"text":"Wein Styke besorgte bei Bellam Wein und brachte ihn zum Tacitus-Treffen. Jacobian sagte nach den Beschwerden, er werde Tacitus dieselbe Flasche nicht noch einmal servieren. Eine Analyse oder Entsorgung ist nicht belegt. Duftöl Das vor dem Kaitlyn-Besuch gekaufte Öl wurde für die beabsichtigte Duftspur verwendet. Preis, Restmenge und heutiger Träger sind nicht exakt gesichert. Dass Franz daraus bereits die gewünschte Schlussfolgerung zog, ist unbekannt.","links":["styke"],"backlinks":[],"search":"wein und duftol vom 31 januar tatsachliche beschaffungen mit getrennten verwendungszwecken verschiedene wein styke besorgte bei bellam wein und brachte ihn zum tacitus treffen jacobian sagte nach den beschwerden er werde tacitus dieselbe flasche nicht noch einmal servieren eine analyse oder entsorgung ist nicht belegt duftol das vor dem kaitlyn besuch gekaufte ol wurde fur die beabsichtigte duftspur verwendet preis restmenge und heutiger trager sind nicht exakt gesichert dass franz daraus bereits die gewunschte schlussfolgerung zog ist unbekannt"},{"id":"dornpakt","category":"fakten","title":"Der Dornpakt","summary":"Angenommene Bindung von Styke und Vesper an Thorns Verschwörung.","body":"<h2>Gesicherte Bedeutung</h2>\n<p>Thorn rekrutierte <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt.</p>\n<h2>Nicht mit jedem anderen Pakt gleichsetzen</h2>\n<p>Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.</p>\n","sources":["chronicle","core","relations"],"status":"Bestätigt","tags":["Vertrag"],"aliases":["Pact of Thorns"],"text":"Gesicherte Bedeutung Thorn rekrutierte Styke und Vesper nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt. Nicht mit jedem anderen Pakt gleichsetzen Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far"],"search":"der dornpakt angenommene bindung von styke und vesper an thorns verschworung pact of thorns vertrag gesicherte bedeutung thorn rekrutierte styke und vesper nach branderscar und band sie durch den pact of thorns im infernalen autoritatsrahmen steht asmodeus uber thorn der als weltlicher vorgesetzter und auftraggeber wirkt nicht mit jedem anderen pakt gleichsetzen valerias privater vertrag und tamsins blutpakt sind eigene bindungen ihre teilnehmer und hierarchien durfen nicht zusammengezogen werden ein nicht vorliegender vertragsvolltext wird hier nicht aus gedachtnis erganzt"},{"id":"privatpakt","category":"fakten","title":"Valerias Privatpakt","summary":"Asmodeus zuerst, Styke und Vesper als sterbliche Autoritäten. Timeon ist kein Vertragspartner.","body":"<h2>Inhalt</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. <a href=\"#/artikel/timeon\">Timeon</a> ist kein Vertragspartner.</p>\n<h2>Der Streit um Timeon</h2>\n<p>Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen.</p>\n<h2>Mechanik</h2>\n<p>Valerias aktueller Stand bleibt <strong>Fighter 5</strong>. Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.</p>","sources":["valeria","relations","live","house"],"status":"Bestätigt","tags":["Vertrag","Valeria"],"aliases":[],"text":"Inhalt Valeria nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. Timeon ist kein Vertragspartner. Der Streit um Timeon Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen. Mechanik Valerias aktueller Stand bleibt Fighter 5 . Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.","links":["valeria","styke","vesper","timeon"],"backlinks":["valeria","timeon","story-so-far","zeit-ausbildung"],"search":"valerias privatpakt asmodeus zuerst styke und vesper als sterbliche autoritaten timeon ist kein vertragspartner vertrag valeria inhalt valeria nahm nach der ausbildung einen privaten pakt an asmodeus steht darin an erster stelle styke und vesper sind die sterblichen autoritaten thorn ist in diesem dokument kein direkter vorgesetzter timeon ist kein vertragspartner der streit um timeon am 31 januar befolgte valeria stykes befehl nicht zu timeon zuruckzukehren sie bestritt zugleich dass dieser befehl festlegen konne was ihr noch wichtig ist oder welche pflichten balinas in ihr fortbestehen mechanik valerias aktueller stand bleibt fighter 5 der pakt enthalt keinen bereits vollzogenen klassenwechsel"},{"id":"bekannt-unbekannt","category":"fakten","title":"Was wir wissen. Was nicht.","summary":"Die wichtigsten Trennlinien zwischen Ereignis, Bericht, Gerücht und Absicht.","body":"<h2>Bestätigt</h2>\n<p>Varning und sechs Reiter sind tot; Balentyne weiß inzwischen davon. Der Geheimgang wurde auf beiden Seiten einen Spalt weit überprüft. <a href=\"#/artikel/timeon\">Timeon</a> wurde von <a href=\"#/artikel/valeria\">Valeria</a> sicher angetroffen. Tacitus wurde getroffen, aber nicht entführt. Kaitlyns Verbindung mit Zack wurde durch Briefe belegt.</p>\n<h2>Noch kein Ergebnis</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> ist am 1. Februar zur Festung unterwegs; Zulassung und Zack-Informationen sind offen. Valerias Donnagin-Auftrag ist noch nicht ausgeführt. Ketten sind gekauft, nicht installiert. Rattengift ist nicht gekauft. Ein zweites Tacitus-Treffen ist nicht vereinbart.</p>\n<h2>Keine bekannten Gewissheiten</h2>\n<p>Tamsins Verbleib, Franz' genaue Reaktion, die kompletten Suchergebnisse zu Varning, die Wachroutinen des Tunnelraums und Kaitlyns Bereitschaft zur Mitarbeit sind ungeklärt.</p>\n<h2>Keine geräuscharme Umwandlung von Plan in Kanon</h2>\n<p>Der 8./9. Februar ist die bevorzugte bedingte Angriffsplanung, nicht ein unverrückbarer Termin. <a href=\"#/artikel/hakon\">Hakon</a> und Sakkarot haben ihn noch nicht erhalten. Die Theateraufführung ist ein Hinweis ohne feststehenden Zeitpunkt.</p>\n","sources":["live","chronicle","core"],"status":"Bestätigt","tags":["Wissensstand","Schnellreferenz"],"aliases":[],"text":"Bestätigt Varning und sechs Reiter sind tot; Balentyne weiß inzwischen davon. Der Geheimgang wurde auf beiden Seiten einen Spalt weit überprüft. Timeon wurde von Valeria sicher angetroffen. Tacitus wurde getroffen, aber nicht entführt. Kaitlyns Verbindung mit Zack wurde durch Briefe belegt. Noch kein Ergebnis Vesper ist am 1. Februar zur Festung unterwegs; Zulassung und Zack-Informationen sind offen. Valerias Donnagin-Auftrag ist noch nicht ausgeführt. Ketten sind gekauft, nicht installiert. Rattengift ist nicht gekauft. Ein zweites Tacitus-Treffen ist nicht vereinbart. Keine bekannten Gewissheiten Tamsins Verbleib, Franz' genaue Reaktion, die kompletten Suchergebnisse zu Varning, die Wachroutinen des Tunnelraums und Kaitlyns Bereitschaft zur Mitarbeit sind ungeklärt. Keine geräuscharme Umwandlung von Plan in Kanon Der 8./9. Februar ist die bevorzugte bedingte Angriffsplanung, nicht ein unverrückbarer Termin. Hakon und Sakkarot haben ihn noch nicht erhalten. Die Theateraufführung ist ein Hinweis ohne feststehenden Zeitpunkt.","links":["timeon","valeria","vesper","hakon"],"backlinks":[],"search":"was wir wissen was nicht die wichtigsten trennlinien zwischen ereignis bericht gerucht und absicht wissensstand schnellreferenz bestatigt varning und sechs reiter sind tot balentyne weiss inzwischen davon der geheimgang wurde auf beiden seiten einen spalt weit uberpruft timeon wurde von valeria sicher angetroffen tacitus wurde getroffen aber nicht entfuhrt kaitlyns verbindung mit zack wurde durch briefe belegt noch kein ergebnis vesper ist am 1 februar zur festung unterwegs zulassung und zack informationen sind offen valerias donnagin auftrag ist noch nicht ausgefuhrt ketten sind gekauft nicht installiert rattengift ist nicht gekauft ein zweites tacitus treffen ist nicht vereinbart keine bekannten gewissheiten tamsins verbleib franz genaue reaktion die kompletten suchergebnisse zu varning die wachroutinen des tunnelraums und kaitlyns bereitschaft zur mitarbeit sind ungeklart keine gerauscharme umwandlung von plan in kanon der 8 9 februar ist die bevorzugte bedingte angriffsplanung nicht ein unverruckbarer termin hakon und sakkarot haben ihn noch nicht erhalten die theaterauffuhrung ist ein hinweis ohne feststehenden zeitpunkt"},{"id":"mott-plan","category":"vorhaben","title":"Mott, Eddarly und Kaitlyn","summary":"Gerüchte und Duftspur laufen; eine Konfrontation ist nicht bestätigt.","body":"<h2>Gesicherte Ausgangslage</h2>\n<p>Kaitlyn ist mit Franz verheiratet und unterhält eine durch Briefe belegte Affäre mit Zack. <a href=\"#/artikel/styke\">Styke</a> ist seit dem 28. Januar ein weiterer heimlicher Geliebter.</p>\n<h2>Bisher unternommen</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> streute vage Gerüchte, ohne Kaitlyn oder Zack zu nennen. Styke hinterließ am 31. Januar absichtlich eine Duftspur. Er sprach mit Kaitlyn über ihre Ehe und ein mögliches Leben fort von Aldencross.</p>\n<h2>Absicht</h2>\n<p>Die Gruppe hofft auf Misstrauen und eine Franz/Zack-Konfrontation. Styke erwägt eine spätere soziale Rolle Kaitlyns im Knoten, <strong>falls sie wirklich mitarbeitet</strong>. Das ist weder ihr Plan noch ein Beitritt.</p>\n<h2>Offen</h2>\n<p>Ihre Antwort auf das ungleiche Zukunftsangebot, die noch nicht versandte Einladung, Franz' Reaktion und der nicht offengelegte Ersatzplan Stykes. Kein Duell und keine Tötung sind als Ergebnis verbucht.</p>\n","sources":["live","relations","core"],"status":"Offener Plan","tags":["Intrige"],"aliases":[],"text":"Gesicherte Ausgangslage Kaitlyn ist mit Franz verheiratet und unterhält eine durch Briefe belegte Affäre mit Zack. Styke ist seit dem 28. Januar ein weiterer heimlicher Geliebter. Bisher unternommen Vesper streute vage Gerüchte, ohne Kaitlyn oder Zack zu nennen. Styke hinterließ am 31. Januar absichtlich eine Duftspur. Er sprach mit Kaitlyn über ihre Ehe und ein mögliches Leben fort von Aldencross. Absicht Die Gruppe hofft auf Misstrauen und eine Franz/Zack-Konfrontation. Styke erwägt eine spätere soziale Rolle Kaitlyns im Knoten, falls sie wirklich mitarbeitet . Das ist weder ihr Plan noch ein Beitritt. Offen Ihre Antwort auf das ungleiche Zukunftsangebot, die noch nicht versandte Einladung, Franz' Reaktion und der nicht offengelegte Ersatzplan Stykes. Kein Duell und keine Tötung sind als Ergebnis verbucht.","links":["styke","vesper"],"backlinks":["intim-kaitlyn"],"search":"mott eddarly und kaitlyn geruchte und duftspur laufen eine konfrontation ist nicht bestatigt intrige gesicherte ausgangslage kaitlyn ist mit franz verheiratet und unterhalt eine durch briefe belegte affare mit zack styke ist seit dem 28 januar ein weiterer heimlicher geliebter bisher unternommen vesper streute vage geruchte ohne kaitlyn oder zack zu nennen styke hinterliess am 31 januar absichtlich eine duftspur er sprach mit kaitlyn uber ihre ehe und ein mogliches leben fort von aldencross absicht die gruppe hofft auf misstrauen und eine franz zack konfrontation styke erwagt eine spatere soziale rolle kaitlyns im knoten falls sie wirklich mitarbeitet das ist weder ihr plan noch ein beitritt offen ihre antwort auf das ungleiche zukunftsangebot die noch nicht versandte einladung franz reaktion und der nicht offengelegte ersatzplan stykes kein duell und keine totung sind als ergebnis verbucht"},{"id":"tacitus-plan","category":"vorhaben","title":"Tacitus: Kontakt und mögliche Entführung","summary":"Ein echtes Fachgespräch hat stattgefunden. Die feindliche Folgeoption ist bislang nur Planung.","body":"<h2>Erreicht</h2>\n<p>Jacobian vermittelte und begleitete das Treffen am 31. Januar. <a href=\"#/artikel/verse\">Verse</a> zeigte eigenständiges Denken. Vespers verdeckte Gabe ins einzelne Glas führte zum frühen Abbruch, nicht zur Gefangennahme.</p>\n<h2>Nächster Informationsweg</h2>\n<p>Jacobian will melden, ob und wann Tacitus das Gespräch fortsetzen möchte. Eine zweite Einladung ist nicht garantiert. Ihr akademisches Interesse ist kein Beleg für Untreue gegenüber der Festung.</p>\n<h2>Voraussetzungen der diskutierten Folgeoption</h2>\n<p>Die Gruppe erwägt eine spätere Entführung bei geeigneter Gelegenheit. Der Tunnel ist nicht als fertiger Verwahrort vorbereitet; die Ketten sind nicht montiert. Ein konkreter Zugriff ist noch nicht ausgeführt.</p>\n","sources":["live","core","chronicle"],"status":"Offener Plan","tags":["Magie","Infiltration"],"aliases":[],"text":"Erreicht Jacobian vermittelte und begleitete das Treffen am 31. Januar. Verse zeigte eigenständiges Denken. Vespers verdeckte Gabe ins einzelne Glas führte zum frühen Abbruch, nicht zur Gefangennahme. Nächster Informationsweg Jacobian will melden, ob und wann Tacitus das G =\"#/artikel/styke\">Styke</a> betrachtet den ranghohen Heiler als größte unbekannte Bedrohung der geplanten Operation. Bisher ist insbesondere seine Fürsorge für kranke Soldaten bekannt.</p>\n<h2>Erklärter Ansatz</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> will über gewöhnliche soziale und religiöse Fragen seine Mahlzeiten, Dienste, Krankenbesuche, nächtlichen Rufe, Kontakte und Wege verstehen. Ihre mitranische Prägung soll diese Fragen glaubwürdig machen.</p>\n<h2>Stand</h2>\n<p>Sie schläft am aktuellen Morgen noch. Kein neuer Bericht, kein fertiger Tagesplan und keine geheime Zauberliste sind dadurch entstanden.</p>\n","sources":["live","core"],"status":"Noch nicht ausgeführt","tags":["Ermittlung","Valeria"],"aliases":[],"text":"Warum dieser Schwerpunkt Styke betrachtet den ranghohen Heiler als größte unbekannte Bedrohung der geplanten Operation. Bisher ist insbesondere seine Fürsorge für kranke Soldaten bekannt. Erklärter Ansatz Valeria will über gewöhnliche soziale und religiöse Fragen seine Mahlzeiten, Dienste, Krankenbesuche, nächtlichen Rufe, Kontakte und Wege verstehen. Ihre mitranische Prägung soll diese Fragen glaubwürdig machen. Stand Sie schläft am aktuellen Morgen noch. Kein neuer Bericht, kein fertiger Tagesplan und keine geheime Zauberliste sind dadurch entstanden.","links":["styke","valeria"],"backlinks":[],"search":"donnagins gewohnheiten ermitteln valerias wichtigste geplante recherche nach dem schlaf ermittlung valeria warum dieser schwerpunkt styke betrachtet den ranghohen heiler als grosste unbekannte bedrohung der geplanten operation bisher ist insbesondere seine fursorge fur kranke soldaten bekannt erklarter ansatz valeria will uber gewohnliche soziale und religiose fragen seine mahlzeiten dienste krankenbesuche nachtlichen rufe kontakte und wege verstehen ihre mitranische pragung soll diese fragen glaubwurdig machen stand sie schlaft am aktuellen morgen noch kein neuer bericht kein fertiger tagesplan und keine geheime zauberliste sind dadurch entstanden"},{"id":"zack-plan","category":"vorhaben","title":"Zacks Dienstpläne und Identifizierung","summary":"Frischer Auftrag an Vesper am Morgen des 1. Februar.","body":"<h2>Angenommener Austausch</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> bat <a href=\"#/artikel/vesper\">Vesper</a> vor ihrem Aufbruch, bei erfolgreichem Einlass Zacks Dienstpläne und eine Beschreibung zu beschaffen. Sie sagte zu, sich nach den Einteilungen umzusehen, und würde ihn möglichst gern selbst gezeigt bekommen.</p>\n<h2>Aktueller Stand</h2>\n<p>Vesper und <a href=\"#/artikel/verse\">Verse</a> sind aufgebrochen. Eintritt, Dokumentenzugang, Sichtung und Rückmeldung bleiben offen. Das Wiki macht aus einer Absicht keinen bereits verfügbaren Plan.</p>\n","sources":["live"],"status":"Unterwegs / Ergebnis offen","tags":["Vesper","Zack"],"aliases":[],"text":"Angenommener Austausch Styke bat Vesper vor ihrem Aufbruch, bei erfolgreichem Einlass Zacks Dienstpläne und eine Beschreibung zu beschaffen. Sie sagte zu, sich nach den Einteilungen umzusehen, und würde ihn möglichst gern selbst gezeigt bekommen. Aktueller Stand Vesper und Verse sind aufgebrochen. Eintritt, Dokumentenzugang, Sichtung und Rückmeldung bleiben offen. Das Wiki macht aus einer Absicht keinen bereits verfügbaren Plan.","links":["styke","vesper","verse"],"backlinks":[],"search":"zacks dienstplane und identifizierung frischer auftrag an vesper am morgen des 1 februar vesper zack angenommener austausch styke bat vesper vor ihrem aufbruch bei erfolgreichem einlass zacks dienstplane und eine beschreibung zu beschaffen sie sagte zu sich nach den einteilungen umzusehen und wurde ihn moglichst gern selbst gezeigt bekommen aktueller stand vesper und verse sind aufgebrochen eintritt dokumentenzugang sichtung und ruckmeldung bleiben offen das wiki macht aus einer absicht keinen bereits verfugbaren plan"},{"id":"zwergen-plan","category":"vorhaben","title":"Zwergenroutinen und Torhaus","summary":"Bisher gewonnene Mechanikinformation ist nicht dasselbe wie eine abgeschlossene Ausfallplanung.","body":"<h2>Bekannt</h2>\n<p>Barnabus plus zehn Arbeiter wohnen im Dalliance. Das zweite Torhausgeschoss enthält getrennte Winden für Brücke und Gatter; dort sind vier Wachen und tagsüber vier Ingenieure.</p>\n<h2>Geplant</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> will unauffällig Schlaf-, Trink-, Zimmer-, Melde- und Alarmroutinen kennenlernen. Die spätere Ausschaltung am Angriffsabend wurde diskutiert, um eine frühzeitige Entdeckung zu vermeiden.</p>\n<h2>Offene Unsicherheit</h2>\n<p>Das Tierpräparat ist kein zuverlässiger Schlafschalter. Weder eine ausgeführte Gabe noch ein erfolgreicher Zugriff oder eine strukturelle Schwachstelle ist festgestellt.</p>\n","sources":["live","core"],"status":"Offener Plan","tags":["Torhaus","Zwerge"],"aliases":[],"text":"Bekannt Barnabus plus zehn Arbeiter wohnen im Dalliance. Das zweite Torhausgeschoss enthält getrennte Winden für Brücke und Gatter; dort sind vier Wachen und tagsüber vier Ingenieure. Geplant Valeria will unauffällig Schlaf-, Trink-, Zimmer-, Melde- und Alarmroutinen kennenlernen. Die spätere Ausschaltung am Angriffsabend wurde diskutiert, um eine frühzeitige Entdeckung zu vermeiden. Offene Unsicherheit Das Tierpräparat ist kein zuverlässiger Schlafschalter. Weder eine ausgeführte Gabe noch ein erfolgreicher Zugriff oder eine strukturelle Schwachstelle ist festgestellt.","links":["valeria"],"backlinks":[],"search":"zwergenroutinen und torhaus bisher gewonnene mechanikinformation ist nicht dasselbe wie eine abgeschlossene ausfallplanung torhaus zwerge bekannt barnabus plus zehn arbeiter wohnen im dalliance das zweite torhausgeschoss enthalt getrennte winden fur brucke und gatter dort sind vier wachen und tagsuber vier ingenieure geplant valeria will unauffallig schlaf trink zimmer melde und alarmroutinen kennenlernen die spatere ausschaltung am angriffsabend wurde diskutiert um eine fruhzeitige entdeckung zu vermeiden offene unsicherheit das tierpraparat ist kein zuverlassiger schlafschalter weder eine ausgefuhrte gabe noch ein erfolgreicher zugriff oder eine strukturelle schwachstelle ist festgestellt"},{"id":"angriffsplan","category":"vorhaben","title":"Balentyne: der bedingte Angriffsplan","summary":"Bevorzugt ist die Nacht 8./9. Februar, abhängig vom Erfolg der Vorbereitungen.","body":"<h2>Ziel</h2>\n<p>Balentyne brechen, <a href=\"#/artikel/havelyn\">Lord Thomas Havelyn</a> töten und das Tor beziehungsweise den Weg für Sakkarot öffnen. Ein bestimmter Ablauf ist noch nicht vollständig beschlossen.</p>\n<h2>Zeit und Kommunikation</h2>\n<p>Die Gruppe bevorzugt den Angriff nach der Eintopfgelegenheit am 8. Februar. Hakons bestehende Vereinbarung lautet: Treffen zwei Tage vorher. Daraus ergibt sich <strong>ungefähr 6. Februar</strong>, falls der Plan bestehen bleibt. Dies ist der Trefftermin, nicht automatisch der Tag, an dem erst eine Nachricht losgeschickt werden sollte.</p>\n<p><a href=\"#/artikel/valeria\">Valeria</a> schlug vor, bis 5. Februar den Boten und Weg zu entscheiden, und bot sich nach Erholung als Reiterin an. Niemand wurde beauftragt oder entsandt. <a href=\"#/artikel/hakon\">Hakon</a> und Sakkarot kennen den intern erwogenen Termin noch nicht.</p>\n<h2>Abhängigkeiten</h2>\n<p>Zugang zur Versorgung, Donnagins Rolle, die Magisterin, Torhausbesetzung, Zwergenroutinen, innere Sicherheitsreaktionen und ein belastbarer Kommunikationsweg. Keiner dieser Punkte ist durch die bloße Auflistung erledigt.</p>\n","sources":["live","timeline"],"status":"Bedingte Planung","tags":["8./9. Februar","Hakon","Sakkarot"],"aliases":[],"text":"Ziel Balentyne brechen, Lord Thomas Havelyn töten und das Tor beziehungsweise den Weg für Sakkarot öffnen. Ein bestimmter Ablauf ist noch nicht vollständig beschlossen. Zeit und Kommunikation Die Gruppe bevorzugt den Angriff nach der Eintopfgelegenheit am 8. Februar. Hakons bestehende Vereinbarung lautet: Treffen zwei Tage vorher. Daraus ergibt sich ungefähr 6. Februar , falls der Plan bestehen bleibt. Dies ist der Trefftermin, nicht automatisch der Tag, an dem erst eine Nachricht losgeschickt werden sollte. Valeria schlug vor, bis 5. Februar den Boten und Weg zu entscheiden, und bot sich nach Erholung als Reiterin an. Niemand wurde beauftragt oder entsandt. Hakon und Sakkarot kennen den intern erwogenen Termin noch nicht. Abhängigkeiten Zugang zur Versorgung, Donnagins Rolle, die Magisterin, Torhausbesetzung, Zwergenroutinen, innere Sicherheitsreaktionen und ein belastbarer Kommunikationsweg. Keiner dieser Punkte ist durch die bloße Auflistung erledigt.","links":["havelyn","valeria","hakon"],"backlinks":[],"search":"balentyne der bedingte angriffsplan bevorzugt ist die nacht 8 9 februar abhangig vom erfolg der vorbereitungen 8 9 februar hakon sakkarot ziel balentyne brechen lord thomas havelyn toten und das tor beziehungsweise den weg fur sakkarot offnen ein bestimmter ablauf ist noch nicht vollstandig beschlossen zeit und kommunikation die gruppe bevorzugt den angriff nach der eintopfgelegenheit am 8 februar hakons bestehende vereinbarung lautet treffen zwei tage vorher daraus ergibt sich ungefahr 6 februar falls der plan bestehen bleibt dies ist der trefftermin nicht automatisch der tag an dem erst eine nachricht losgeschickt werden sollte valeria schlug vor bis 5 februar den boten und weg zu entscheiden und bot sich nach erholung als reiterin an niemand wurde beauftragt oder entsandt hakon und sakkarot kennen den intern erwogenen termin noch nicht abhangigkeiten zugang zur versorgung donnagins rolle die magisterin torhausbesetzung zwergenroutinen innere sicherheitsreaktionen und ein belastbarer kommunikationsweg keiner dieser punkte ist durch die blosse auflistung erledigt"},{"id":"offene-spuren","category":"vorhaben","title":"Weitere offene Spuren","summary":"Tamsin, die Aufführung und unbestätigte Gerüchte.","body":"<h2>Tamsin</h2>\n<p><a href=\"#/artikel/timeon\">Timeon</a> ist sicher überprüft. Tamsin bleibt abwesend, ohne belastbare Spur oder Nachricht. Die aktive Suche wurde beendet. Ihr weiteres Schicksal ist nicht festgelegt.</p>\n<h2>Theater</h2>\n<p>Ye Merrie Men und <em>The Fall of Amberlyn</em> sind als kommende Aufführung bekannt; Zeitpunkt und Einlassablauf fehlen.</p>\n<h2>Nicht bewiesene Hebel</h2>\n<p>Die Taschendiebstahlgeschichte mit Verweis auf <a href=\"#/artikel/marel\">Marel</a> ist ein Gerücht. Die Justin-/Bischofsspur lieferte keine verwertbare Information. Ein fehlgeschlagener Ermittlungsansatz ist kein Beweis, dass die vermutete Schuld existiert.</p>\n","sources":["live","core","chronicle"],"status":"Ungeklärt","tags":["Tamsin","Gerüchte","Theater"],"aliases":[],"text":"Tamsin Timeon ist sicher überprüft. Tamsin bleibt abwesend, ohne belastbare Spur oder Nachricht. Die aktive Suche wurde beendet. Ihr weiteres Schicksal ist nicht festgelegt. Theater Ye Merrie Men und The Fall of Amberlyn sind als kommende Aufführung bekannt; Zeitpunkt und Einlassablauf fehlen. Nicht bewiesene Hebel Die Taschendiebstahlgeschichte mit Verweis auf Marel ist ein Gerücht. Die Justin-/Bischofsspur lieferte keine verwertbare Information. Ein fehlgeschlagener Ermittlungsansatz ist kein Beweis, dass die vermutete Schuld existiert.","links":["timeon","marel"],"backlinks":[],"search":"weitere offene spuren tamsin die auffuhrung und unbestatigte geruchte tamsin geruchte theater tamsin timeon ist sicher uberpruft tamsin bleibt abwesend ohne belastbare spur oder nachricht die aktive suche wurde beendet ihr weiteres schicksal ist nicht festgelegt theater ye merrie men und the fall of amberlyn sind als kommende auffuhrung bekannt zeitpunkt und einlassablauf fehlen nicht bewiesene hebel die taschendiebstahlgeschichte mit verweis auf marel ist ein gerucht die justin bischofsspur lieferte keine verwertbare information ein fehlgeschlagener ermittlungsansatz ist kein beweis dass die vermutete schuld existiert"},{"id":"spielstand","category":"fakten","title":"Der aktuelle Spielstand","summary":"1. Februar 4712 AR, später am Tag. Styke sitzt im Dalliance; Vesper und Verse sind noch in Balentyne, Valeria ruht oben.","body":"<h2>Wo der Tag gerade steht</h2>\n<p>Der Wintertag ist bereits weit gelaufen. Im <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> brennen die Lampen gegen das sinkende Licht, und Styke sitzt noch im Schankraum. Er hat gegessen, Valeria oben versorgt, mit <a href=\"#/artikel/zorn\">Zorn</a> den kopierten Balentyne-Plan studiert, im Hof trainiert und danach lange mit Gästen gesprochen. Aus den Gesprächen blieben Gerüchte, keine Gewissheiten.</p>\n<p><a href=\"#/artikel/valeria\">Valeria</a> wurde zuletzt oben im gemeinsamen Zimmer gesehen. Nach dem privaten Vormittag, Waschen und etwas Ruhe schlief sie wieder ein. Ihre Untersuchung zu <a href=\"#/artikel/donnagin\">Donnagin</a> ist noch nicht erfolgt.</p>\n<p><a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/verse\">Verse</a> sind seit dem Morgen in Richtung Balentyne fort. Bis zu diesem Snapshot ist weder eine Rückkehr noch eine Nachricht über Zacks Dienstplan bei Styke angekommen.</p>\n<h2>Was Styke heute gehört hat</h2>\n<p>Ein älterer Gast berichtete von zwei berittenen Soldaten, die außerhalb des Ortes nach bewaffneten Reisenden, Feuerstellen abseits der Straße und ungewöhnlichem Nachtverkehr fragten. Eisenbauchs Leute klagen über schärfere Zählungen und Fragen nach Werkzeug. Frauen aus dem Ort erzählen von gestrichenen Heimwegen, zusätzlichen Diensten und Wäsche, die nun eher am Eingang abgeholt wird. Das ergibt das Bild einer nervöser werdenden Festung, nicht das eines vollständigen Lockdowns.</p>\n<p>Über <a href=\"#/artikel/zack\">Zack Eddarly</a> fiel ein brauchbares Bild ab: groß, gutaussehend, gepflegt, galant, unverheiratet, einer jener Männer, die sich Namen merken. Ein sicherer heutiger Aufenthaltsort oder Dienstplan wurde daraus nicht.</p>\n<p>Zu <a href=\"#/artikel/donnagin\">Father Donnagin</a> blieben die großen Geschichten widersprüchlich. Verlässlicher waren kleine Erinnerungen: ein schwer krankes Kind im Müllerhaushalt, eine schwierige Geburt beim Fuhrmann. Er hat in der Vergangenheit auf ernste zivile Not reagiert. Das ist eine Gewohnheitsspur, kein garantierter Köder.</p>\n<h2>Ressourcen und harte Grenzen</h2>\n<p><strong>Styke:</strong> 34/34 HP, 11/11 PP, psionischer Fokus verfügbar. <strong>Vesper:</strong> 28/28 HP. <strong>Valeria:</strong> 42/42 HP. Kein neuer mechanischer Schaden, keine neue Erschöpfung und keine neue Ressourcenauffrischung wurden ausgespielt.</p>\n<p>Die gekauften Ketten, Ringe, Nägel und Keile sind noch nicht im Tunnel montiert. Rattengift wurde nicht gekauft. Tacitus ist frei; eine zweite Einladung ist nicht eingetroffen. Der Angriff in der Nacht vom 8. auf den 9. Februar bleibt eine interne, bedingte Präferenz und wurde Hakon oder Sakkarot nicht übermittelt.</p>\n<div class=\"note\"><strong>Aktueller Rand:</strong> Der nächste spielbare Augenblick liegt nach Stykes Gesprächen im Schankraum. Niemand ist danach neu eingetreten, niemand hat ihn gerufen, und der Tag ist noch nicht in die Nacht gesprungen.</div>","sources":["live","relations"],"status":"Aktueller Snapshot","tags":["Startpunkt","1. Februar","Ressourcen"],"aliases":[],"text":"Wo der Tag gerade steht Der Wintertag ist bereits weit gelaufen. Im Lord's Dalliance brennen die Lampen gegen das sinkende Licht, und Styke sitzt noch im Schankraum. Er hat gegessen, Valeria oben versorgt, mit Zorn den kopierten Balentyne-Plan studiert, im Hof trainiert und danach lange mit Gästen gesprochen. Aus den Gesprächen blieben Gerüchte, keine Gewissheiten. Valeria wurde zuletzt oben im gemeinsamen Zimmer gesehen. Nach dem privaten Vormittag, Waschen und etwas Ruhe schlief sie wieder ein. Ihre Untersuchung zu Donnagin ist noch nicht erfolgt. Vesper und Verse sind seit dem Morgen in Richtung Balentyne fort. Bis zu diesem Snapshot ist weder eine Rückkehr noch eine Nachricht über Zacks Dienstplan bei Styke angekommen. Was Styke heute gehört hat Ein älterer itus ist frei eine zweite einladung ist nicht eingetroffen der angriff in der nacht vom 8 auf den 9 februar bleibt eine interne bedingte praferenz und wurde hakon oder sakkarot nicht ubermittelt aktueller rand der nachste spielbare augenblick liegt nach stykes gesprachen im schankraum niemand ist danach neu eingetreten niemand hat ihn gerufen und der tag ist noch nicht in die nacht gesprungen","links":["dalliance","zorn","valeria","donnagin","vesper","verse","zack"],"backlinks":["bogen-styke","bogen-vesper","bogen-valeria"]},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Branderscar bis zum späteren 1. Februar 4712 AR: Flucht, Bindungen, Balentyne und ein Ort, der langsam nervös wird.","body":"<h2>I. Die Verurteilten von Branderscar</h2>\n<p>Die Geschichte begann für <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in <a href=\"#/artikel/branderscar\">Branderscar</a>. Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, <a href=\"#/artikel/verse\">Verse</a> zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt.</p>\n<p><a href=\"#/artikel/tiadora\">Tiadora</a> öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten <a href=\"#/artikel/verse\">Verse</a> zurück und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack</a>. Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl <a href=\"#/artikel/tamsin\">Tamsin Blackerly</a> als auch <a href=\"#/artikel/matilda\">Matilda Richter</a> die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet.</p>\n<h2>II. Thorns Haus und der Knoten</h2>\n<p>Der Weg führte zu <a href=\"#/artikel/thorn\">Adrastus Thorn</a>. Der <a href=\"#/artikel/dornpakt\">Pakt der Dornen</a>, die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen.</p>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon</a> gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen.</p>\n<p>Aus derselben Frau wurde <a href=\"#/artikel/valeria\">Valeria</a>. Sie nahm später einen <a href=\"#/artikel/privatpakt\">Privatpakt</a> an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. <a href=\"#/artikel/timeon\">Timeon</a> blieb außerhalb dieses Pakts. <a href=\"#/artikel/elise\">Elise Zadaria</a> führte ihre <a href=\"#/artikel/white-ravens\">White Ravens</a> währenddessen über eine getrennte Befehlskette.</p>\n<h2>III. Die Fahrt nach Norden</h2>\n<p>Auf der <a href=\"#/artikel/frosthamar\">Frosthamar</a> wurde die Verschwörung praktisch: Waffen mussten zu <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe</a> gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter <a href=\"#/artikel/sambryl\">Edward Sambryl</a>. Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit <a href=\"#/artikel/white-tusk\">White Tusk</a> und den <a href=\"#/artikel/yutak\">Yutak</a> brachte Handel und wertvolles Elfenbein.</p>\n<p>Am <strong>14. Januar 4712 AR</strong> erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt.</p>\n<p><a href=\"#/artikel/odenkirk\">Kargeld Odenkirk</a> starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. <a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit <a href=\"#/artikel/grumblejack\">Grumblejack</a> als freiem Freund.</p>\n<h2>IV. Unter fremdem Dach</h2>\n<p>Am <strong>23. Januar</strong> kamen Styke, Vesper und <a href=\"#/artikel/valeria\">Valeria</a> als freie Händler aus dem Norden nach <a href=\"#/artikel/aldencross\">Aldencross</a>. Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags.</p>\n<p><a href=\"#/artikel/mara\">Mara Fenner</a> und <a href=\"#/artikel/ellyn\">Ellyn Reed</a>, früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung.</p>\n<h2>V. Freeman's Rock</h2>\n<p>Captain <a href=\"#/artikel/varning\">Ryan Varning</a> verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete <a href=\"#/artikel/freemans-rock\">Freeman's Rock</a> und bereitete einen Hinterhalt vor. In der Nacht des <strong>26. Januar</strong> formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an.</p>\n<p>Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem <a href=\"#/artikel/beute-cache\">Versteck</a> außerhalb Aldencross. Varnings kleiner <a href=\"#/artikel/varning-schluessel\">Schlüssel</a> blieb bei Styke; <a href=\"#/artikel/varlet\">Varlet</a> wurde Grumblejacks eigener Anteil.</p>\n<p>Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt.</p>\n<h2>VI. Türen, Briefe und Gewohnheiten</h2>\n<p>Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm.</p>\n<p>In der Nacht <strong>27./28. Januar</strong> entdeckten Styke und Vesper den <a href=\"#/artikel/tunnel\">Zwergengang</a> unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet.</p>\n<p>Am <strong>28. Januar</strong> vermittelte <a href=\"#/artikel/jacobian\">Jacobian Scaramore</a> einen Kontakt zur Magisterin <a href=\"#/artikel/tacitus\">Tacitus</a>. Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig.</p>\n<p>Am selben Tag begann Stykes heimliche Affäre mit <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott</a>. Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu <a href=\"#/artikel/zack\">Zack Eddarly</a> fest. Kaitlyns Ehe mit <a href=\"#/artikel/franz\">Franz Mott</a> wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch.</p>\n<h2>VII. Das Netz wird dichter</h2>\n<p>Vespers Arbeitstage am <strong>29. und 30. Januar</strong> lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. <a href=\"#/artikel/giuseppe\">Mama Giuseppe</a> kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen.</p>\n<p>Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst.</p>\n<p>Zwischen diesen Unternehmungen blieb das gemeinsame Leben widersprüchlich. Valeria sagte, sie könne Styke und Vesper immer noch hassen und zugleich manchmal wirklich neben ihnen sein wollen. Sie plante wieder über den gleichen Abend hinaus. Der Satz beschrieb ihren gegenwärtigen Widerspruch genauer als jedes Bekenntnis.</p>\n<h2>VIII. Der 31. Januar</h2>\n<p>Nun war Varnings Tod in Balentyne bekannt. Zivile Arbeiter mussten mit strengeren Absprachen und Begleitung rechnen. Styke kaufte unter wechselnder Verkleidung Ketten und Beschläge, beschaffte verschiedene Arzneipräparate, Wein und Duftöl. Rattengift kaufte er nicht.</p>\n<p>Kaitlyn erhielt ein ungleiches persönliches Zukunftsangebot. Styke stellte sich vor, sie könne aus eigenem Interesse eine Konfrontation zwischen Franz und Zack fördern und später soziale Kenntnisse für den Knoten einbringen. Das blieb seine Einschätzung. Sie versprach weder Mitarbeit noch Loyalität; die angekündigte Nachricht mit Treffpunkt und Zeit wurde noch nicht gesandt.</p>\n<p>Um <strong>20 Uhr</strong> trafen Styke, Vesper und Verse Tacitus bei Jacobian. Verse sprach über unvollständige Erinnerungen, neue eigene Gedanken und die Möglichkeit, Vesper zu widersprechen. Das Gespräch zeigte mehr als ein reizvolles magisches Objekt. Während einer Ablenkung gab Vesper verdeckt Abführmittel in Tacitus' einzelnes Glas. Die Magisterin musste das Gespräch vorzeitig verlassen. Sie wurde nicht entführt. Jacobian wollte eine etwaige Fortsetzung vermitteln, aber kein zweiter Termin stand fest.</p>\n<p>Valeria kam sehr spät zurück. Sie hatte <a href=\"#/artikel/timeon-hof\">Timeons sicheren Aufenthaltsort</a> persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria.</p>\n<p>Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht <strong>8./9. Februar</strong>, abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an <a href=\"#/artikel/hakon\">Hakon</a> oder Sakkarot übermittelt.</p>\n<h2>IX. Der frühe Morgen des 1. Februar</h2>\n<p>Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu.</p>\n<h2>X. Der Tag beginnt zurückzureden</h2>\n<p>Im Laufe des 1. Februar kamen keine großen Enthüllungen. Stattdessen jene kleinen Veränderungen, aus denen eine belagerte Ordnung besteht: berittene Fragen auf den Straßen, strengere Zählungen, gestrichene Heimwege, zusätzliche Dienste, priorisierte Hufeisen. Balentyne hatte noch keinen Namen für seinen Feind, aber es begann, die Ränder der eigenen Welt härter anzufassen.</p>\n<p>Styke gewann ein brauchbares öffentliches Bild von Zack Eddarly und hörte zwei alte Geschichten, in denen Donnagin nachts oder im Winter zu ernsthaft kranken Zivilisten kam. Er blieb im Dalliance. Vesper und Verse waren noch in der Festung, Valeria oben. Die Ketten waren unmontiert, Tacitus frei, Kaitlyns nächste Nachricht ungesandt.</p>\n<p>Der Krieg ist noch nicht ausgebrochen. Aber Aldencross beginnt bereits, anders zu atmen.</p>","sources":["chronicle","timeline","live","relations"],"status":"Bestätigt","tags":["Rückblick","Gesamtkampagne"],"aliases":[],"text":"I. Die Verurteilten von Branderscar Die Geschichte begann für Styke und Vesper nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in Branderscar . Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, Verse zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt. Tiadora öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten Verse zurück und befreiten Grumblejack . Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl Tamsin Blackerly als auch Matilda Richter die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet. II. Thorns Haus und der Knoten Der Weg führte zu Adrastus Thorn . Der Pakt der Dornen , die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen. Dame Balina und ihr junger Knappe Timeon gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen. Aus derselben Frau wurde Valeria . Sie nahm später einen Privatpakt an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. Timeon blieb außerhalb dieses Pakts. Elise Zadaria führte ihre White Ravens währenddessen über eine getrennte Befehlskette. III. Die Fahrt nach Norden Auf der Frosthamar wurde die Verschwörung praktisch: Waffen mussten zu Sakkarot Fire-Axe gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter Edward Sambryl . Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit White Tusk und den Yutak brachte Handel und wertvolles Elfenbein. Am 14. Januar 4712 AR erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt. Kargeld Odenkirk starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. Hakon , Sten , Ketil , Eirik , Arved und Torvald hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit Grumblejack als freiem Freund. IV. Unter fremdem Dach Am 23. Januar kamen Styke, Vesper und Valeria als freie Händler aus dem Norden nach Aldencross . Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im Lord's Dalliance wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags. Mara Fenner und Ellyn Reed , früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung. V. Freeman's Rock Captain Ryan Varning verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete Freeman's Rock und bereitete einen Hinterhalt vor. In der Nacht des 26. Januar formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an. Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem Versteck außerhalb Aldencross. Varnings kleiner Schlüssel blieb bei Styke; Varlet wurde Grumblejacks eigener Anteil. Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt. VI. Türen, Briefe und Gewohnheiten Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm. In der Nacht 27./28. Januar entdeckten Styke und Vesper den Zwergengang unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet. Am 28. Januar vermittelte Jacobian Scaramore einen Kontakt zur Magisterin Tacitus . Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig. Am selben Tag begann Stykes heimliche Affäre mit Kaitlyn Mott . Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu Zack Eddarly fest. Kaitlyns Ehe mit Franz Mott wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausg e"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-24","dateLabel":"24. Januar","text":"Ryan Varning bricht mit sechs Reitern auf. Styke , Vesper , Valeria und Hakon beginnen die Erkundung bei Freeman's Rock . Die übrige Feldgruppe bleibt bei der Vorbereitung räumlich getrennt.","links":["varning","styke","vesper","valeria","hakon","freemans-rock"],"backlinks":[],"search":"varning reitet aus der captain und sechs ausgesuchte reiter verlassen balentyne aldencross ryan varning bricht mit sechs reitern auf styke vesper valeria und hakon beginnen die erkundung bei freeman s rock die ubrige feldgruppe bleibt bei der vorbereitung raumlich getrennt"},{"id":"zeit-0125","category":"chronik","title":"Vorbereitung des Hinterhalts","summary":"Die Erkundung und Vorbereitung werden fortgesetzt.","body":"<p>Der gesicherte Zeitanker ist die fortgesetzte Erkundung und Hinterhaltsvorbereitung. Ein zusätzliches Ereignis oder eine neue Begegnung wird aus der knappen Notiz nicht erfunden.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-25","dateLabel":"25. Januar","text":"Der gesicherte Zeitanker ist die fortgesetzte Erkundung und Hinterhaltsvorbereitung. Ein zusätzliches Ereignis oder eine neue Begegnung wird aus der knappen Notiz nicht erfunden.","links":[],"backlinks":[],"search":"vorbereitung des hinterhalts die erkundung und vorbereitung werden fortgesetzt aldencross der gesicherte zeitanker ist die fortgesetzte erkundung und hinterhaltsvorbereitung ein zusatzliches ereignis oder eine neue begegnung wird aus der knappen notiz nicht erfunden"},{"id":"zeit-0126","category":"chronik","title":"Der Hinterhalt","summary":"Alle sieben Mitglieder der Patrouille sterben. Die Pferde werden mitgenommen.","body":"<p><a href=\"#/artikel/vesper\">Vesper</a> setzt <a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud</a>, <a href=\"#/artikel/dancing-darkness\">Dancing Darkness</a>, Darkvision und <a href=\"#/artikel/ashen-path\">Ashen Path</a> ein. <a href=\"#/artikel/styke\">Styke</a> greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt.</p>\n<p>Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird <a href=\"#/artikel/beute-cache\">außerhalb der Stadt versteckt</a>, der <a href=\"#/artikel/varning-schluessel\">Schlüssel</a> bleibt bei Styke. <a href=\"#/artikel/varlet\">Varlet</a> geht an <a href=\"#/artikel/grumblejack\">Grumblejack</a>.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-26","dateLabel":"26. Januar, Nacht","text":"Vesper setzt Euphoric Cloud , Dancing Darkness , Darkvision und Ashen Path ein. Styke greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt. Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird außerhalb der Stadt versteckt , der Schlüssel bleibt bei Styke. Varlet geht an Grumblejack .","links":["vesper","euphoric-cloud","dancing-darkness","ashen-path","styke","beute-cache","varning-schluessel","varlet","grumblejack"],"backlinks":[],"search":"der hinterhalt alle sieben mitglieder der patrouille sterben die pferde werden mitgenommen aldencross vesper setzt euphoric cloud dancing darkness darkvision und ashen path ein styke greift von der landwartigen fluchtrichtung an varning ergibt sich verwundet und wird unter der vorab gesetzten vorgabe getotet alle sieben patrouillenmitglieder sterben keine eigene verwundung oder eigener verlust ist hier festgestellt die toten werden verborgen spuren bearbeitet und sieben pferde abgefuhrt markante ausrustung wird ausserhalb der stadt versteckt der schlussel bleibt bei styke varlet geht an grumblejack"},{"id":"zeit-0127","category":"chronik","title":"Rückkehr und Zwergenspuren","summary":"Ruhe im Dalliance, Theaterhinweis und noch kein brauchbarer Erpressungshebel.","body":"<p>Vor Sonnenaufgang kehrt das Trio zurück. Varning gilt noch nicht als überfällig. Bellam berichtet von <a href=\"#/artikel/merrie-men\">Ye Merrie Men</a>. <a href=\"#/artikel/vesper\">Vesper</a> findet in Barnabus' Zimmer Arbeitsunterlagen, aber keine kompromittierenden Belege. <a href=\"#/artikel/valeria\">Valeria</a> spricht mit den Arbeitern. <a href=\"#/artikel/styke\">Styke</a> knüpft einen handwerklichen Kontakt zu Barnabus. Eine Taschendiebstahlgeschichte verweist auf <a href=\"#/artikel/marel\">Marel</a>, bleibt aber unbestätigt.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-27","dateLabel":"27. Januar","text":"Vor Sonnenaufgang kehrt das Trio zurück. Varning gilt noch nicht als überfällig. Bellam berichtet von Ye Merrie Men . Vesper findet in Barnabus' Zimmer Arbeitsunterlagen, aber keine kompromittierenden Belege. Valeria spricht mit den Arbeitern. Styke knüpft einen handwerklichen Kontakt zu Barnabus. Eine Taschendiebstahlgeschichte verweist auf Marel , bleibt aber unbestätigt.","links":["merrie-men","vesper","valeria","styke","marel"],"backlinks":[],"search":"ruckkehr und zwergenspuren ruhe im dalliance theaterhinweis und noch kein brauchbarer erpressungshebel aldencross vor sonnenaufgang kehrt das trio zuruck varning gilt noch nicht als uberfallig bellam berichtet von ye merrie men vesper findet in barnabus zimmer arbeitsunterlagen aber keine kompromittierenden belege valeria spricht mit den arbeitern styke knupft einen handwerklichen kontakt zu barnabus eine taschendiebstahlgeschichte verweist auf marel bleibt aber unbestatigt"},{"id":"zeit-tunnel","category":"chronik","title":
