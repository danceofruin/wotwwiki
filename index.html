nicht geschehen. Kein Topf wurde als bereits manipuliert etabliert. Benötigtes Material und Zugang am 8. Februar sind offen; Giuseppe ist keine Verbündete.</p>\n<p><a href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan</a> / <a href=\"#/artikel/kueche\">Bekanntes Küchenwissen</a></p>\n","sources":["chronicle","live"],"status":"Berichtet","tags":["Küche","Routine"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Die nächste Gelegenheit ist im akzeptierten Spiel auf 1. Februar , die folgende auf 8. Februar festgelegt. Was der Plan nicht beweist Der Knoten erwägt die Mahlzeit als Sabotageansatz. Am aktuellen Morgen ist der heutige Eintopf noch nicht geschehen. Kein Topf wurde als bereits manipuliert etabliert. Benötigtes Material und Zugang am 8. Februar sind offen; Giuseppe ist keine Verbündete. Eintopf und Sabotageplan / Bekanntes Küchenwissen","links":["vesper","eintopf-plan","kueche"],"backlinks":["story-so-far"],"search":"mama louisa giuseppe bekannte kochin des wochentlichen gemeinsamen rindereintopfs in balentyne mama giuseppe louisa giuseppe giuseppe kuche routine town beobachtete routine vesper erfuhr am 30 januar dass mama giuseppe wochentlich einen grossen rindereintopf aus einem gemeinsamen topf fur ungefahr siebzig dienstfreie soldaten zubereitet die nachste gelegenheit ist im akzeptierten spiel auf 1 februar die folgende auf 8 februar festgelegt was der plan nicht beweist der knoten erwagt die mahlzeit als sabotageansatz am aktuellen morgen ist der heutige eintopf noch nicht geschehen kein topf wurde als bereits manipuliert etabliert benotigtes material und zugang am 8 februar sind offen giuseppe ist keine verbundete eintopf und sabotageplan bekanntes kuchenwissen"},{"id":"varning","category":"personen","title":"Captain Ryan Varning","summary":"Mit seiner sechsköpfigen berittenen Patrouille am 26. Januar bei Freeman's Rock getötet.","body":"<h2>Gesicherter Verlauf</h2>\n<p>Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; <a href=\"#/artikel/styke\">Styke</a> tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben.</p>\n<h2>Nachwirkungen</h2>\n<p>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen <a href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel</a>, <a href=\"#/artikel/grumblejack\">Grumblejack</a> erhielt <a href=\"#/artikel/varlet\">Varlet</a>.</p>\n<p>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. <strong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.</strong></p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["styke","varning-schluessel","grumblejack","varlet"],"backlinks":["story-so-far","zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26 januar bei freeman s rock getotet ryan varning varning tot patrouille garrison gesicherter verlauf varning verliess balentyne am 24 januar mit sechs ausgewahlten reitern der knoten klarte ihren lagerplatz auf und griff in der nacht des 26 januar an varning ergab sich schwer verwundet styke totete ihn gemass seiner zuvor festgelegten keine gefangenen anweisung alle sieben patrouillenmitglieder starben nachwirkungen die leichen wurden verborgen der platz bereinigt und sieben pferde erbeutet markante ausrustung blieb in einem versteck ausserhalb aldencross styke behielt einen noch nicht identifizierten schlussel grumblejack erhielt varlet am 29 januar galt die patrouille offen als verspatet und suchreiter brachen auf seit 31 januar ist ihr tod in balentyne bekannt die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"<h2>Eigentum und Ort</h2>\n<p>Nach Freeman's Rock gab <a href=\"#/artikel/styke\">Styke</a> das Pferd ausdrücklich <a href=\"#/artikel/grumblejack\">Grumblejack</a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.</p>\n<p>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.</p>\n","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.","links":["styke","grumblejack"],"backlinks":["grumblejack","varning","feldgruppe","story-so-far","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd jetzt grumblejacks eigener anteil und packtier tier feldgruppe field eigentum und ort nach freeman s rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil varlet ist nicht einfach beliebiges gruppeninventar es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe eine spatere verausserung verletzung oder verlegung ist nicht berichtet"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"<h2>Kampagnenfassung</h2>\n<p>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.</p>\n<h2>Folgen der Begegnung</h2>\n<p>Vesper barg <a href=\"#/artikel/verse\">Verse</a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.</p>\n<p><strong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.</strong></p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","vesper","verse"],"backlinks":["verse","branderscar","story-so-far","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin sie uberlebte den angenommenen ausbruch mathias richter richter branderscar historisch history kampagnenfassung matilda ist die weibliche kampagnenkonversion der branderscar vorsteherfigur styke und vesper setzten sie in ihren privatraumen nichttodlich ausser gefecht das archiv setzt sie nicht nachtraglich auf den gedruckten ausgang zuruck folgen der begegnung vesper barg verse aus einem beweisbehalter ihrer bibliothek und verzichtete auf weitere rache an der hilflosen eine moorkarte und richters zauberbuch wurden mitgenommen schwere alchemistische ausrustung blieb zuruck ihr spaterer aufenthaltsort und zustand nach branderscar sind nicht geklart"},{"id":"sambryl","category":"personen","title":"Captain Edward Sambryl","summary":"Talireanischer Patrouillenkapitän aus der Frosthamar-Reise.","body":"<h2>Begegnung auf See</h2>\n<p>Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten.</p>\n<h2>Grenze der Rekonstruktion</h2>\n<p>Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den <a href=\"#/artikel/yutak\">Yutak-Handel</a> ein und sind nicht automatisch noch im Inventar.</p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Seereise","Historisch"],"aliases":["Edward Sambryl","Sambryl"],"group":"history","text":"Begegnung auf See Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten. Grenze der Rekonstruktion Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den Yutak-Handel ein und sind nicht automatisch noch im Inventar.","links":["yutak"],"backlinks":["story-so-far","zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar reise edward sambryl sambryl seereise historisch history begegnung auf see seine patrouille wurde wahrend der frosthamar reise besiegt sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser einem kurzbogen und pfeilen freigelassen nicht als gefolgsleute behalten grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest beutestucke der patrouille gingen in den yutak handel ein und sind nicht automatisch noch im inventar"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"<h2>Mannschaft und Ende</h2>\n<p><a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.</p>\n<p>Odenkirk starb. Die <a href=\"#/artikel/frosthamar\">Frosthamar</a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.</p>\n<h2>Kein automatisches Restinventar</h2>\n<p>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.</p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Tot","Seereise"],"aliases":["Kargeld Odenkirk","Odenkirk"],"group":"history","text":"Mannschaft und Ende Hakon , Sten , Ketil , Eirik , Arved und Torvald waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand. Odenkirk starb. Die Frosthamar wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren. Kein automatisches Restinventar Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.","links":["hakon","sten","ketil","eirik","arved","torvald","frosthamar"],"backlinks":["hakon","story-so-far"],"search":"captain kargeld odenkirk ehemaliger kapitan der frosthamar im akzeptierten verlauf tot kargeld odenkirk odenkirk tot seereise history mannschaft und ende hakon sten ketil eirik arved und torvald waren seine seeleute sie verliessen seine mannschaft und nahmen stykes bezahlung an bevor odenkirks letzter konflikt stattfand odenkirk starb die frosthamar wurde zerstort nachdem tragbare wertgegenstande und thorns zahlung geborgen waren kein automatisches restinventar seine meisterarbeits axt wurfaxte kleine silberfigur dreizack whisky und andere beute sind an den spateren verkaufs und inventarverlauf gebunden das historische vorkommen eines gegenstands beweist nicht seinen heutigen besitz"},{"id":"white-tusk","category":"personen","title":"White Tusk","summary":"Yutak-Anführer aus der Nordreise. Handel und ein wertvoller Narwalzahn blieben in Erinnerung.","body":"<h2>Handel im Norden</h2>\n<p>White Tusk führte die Yutak, denen die Gruppe während der Nordreise begegnete. Er nahm erbeutete Patrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde.</p>\n<h2>Nachgeschichte</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.</p>","sources":["history","chronicle"],"status":"Bestätigt","tags":["Yutak","Handel","Historisch"],"aliases":[],"group":"history","text":"Handel im Norden White Tusk führte die Yutak, denen die Gruppe während der Nordreise begegnete. Er nahm erbeutete Patrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde. Nachgeschichte Vesper verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.","links":["vesper"],"backlinks":["joseph","regionen","yutak","story-so-far","zeit-seereise"],"search":"white tusk yutak anfuhrer aus der nordreise handel und ein wertvoller narwalzahn blieben in erinnerung yutak handel historisch history handel im norden white tusk fuhrte die yutak denen die gruppe wahrend der nordreise begegnete er nahm erbeutete patrouillenausrustung und gab dafur walrosselfenbein im wert von 1 200 gp spater kam sein narwalzahn hinzu der in aldencross mit 2 000 gp bewertet wurde nachgeschichte vesper verkaufte beide lose am 23 januar fur insgesamt 3 200 gp fur white tusk ist seit dem handel keine weitere begegnung oder verpflichtung gegenuber dem knoten festgehalten"},{"id":"joseph","category":"personen","title":"Joseph Calls-Fire-From-Water","summary":"Yutak-Kontakt der nördlichen Begegnung und des Handels.","body":"<h2>Dokumentierter Platz in der Reise</h2>\n<p>Joseph gehört zur Begegnung und zum Austausch mit den Yutak während der Nordreise. Er ist von <a href=\"#/artikel/white-tusk\">White Tusk</a> zu unterscheiden.</p>\n<h2>Begrenztes Dossier</h2>\n<p>Das dauerhafte Archiv liefert hier keine vollständige Einzelbiographie oder aktuelle Position. Es begründet insbesondere keine allwissende Sprecherrolle für alle Yutak. Neue Details werden nicht aus seinem Namen abgeleitet.</p>\n","sources":["history"],"status":"Bestätigt","tags":["Yutak","Historisch"],"aliases":["Joseph","Calls-Fire-From-Water"],"group":"history","text":"Dokumentierter Platz in der Reise Joseph gehört zur Begegnung und zum Austausch mit den Yutak während der Nordreise. Er ist von White Tusk zu unterscheiden. Begrenztes Dossier Das dauerhafte Archiv liefert hier keine vollständige Einzelbiographie oder aktuelle Position. Es begründet insbesondere keine allwissende Sprecherrolle für alle Yutak. Neue Details werden nicht aus seinem Namen abgeleitet.","links":["white-tusk"],"backlinks":[],"search":"joseph calls fire from water yutak kontakt der nordlichen begegnung und des handels joseph calls fire from water yutak historisch history dokumentierter platz in der reise joseph gehort zur begegnung und zum austausch mit den yutak wahrend der nordreise er ist von white tusk zu unterscheiden begrenztes dossier das dauerhafte archiv liefert hier keine vollstandige einzelbiographie oder aktuelle position es begrundet insbesondere keine allwissende sprecherrolle fur alle yutak neue details werden nicht aus seinem namen abgeleitet"},{"id":"elise","category":"personen","title":"Elise Zadaria","summary":"Eigenständige Rivalin und zeitweilige Vertraute aus Thorns Ausbildungsphase.","body":"<h2>Die White Ravens</h2>\n<p>Elise Zadaria führte während Thorns Ausbildung die <a href=\"#/artikel/white-ravens\">White Ravens</a>. Zwischen ihr, <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> kam es wiederholt zu Sex und persönlicher Nähe. Befehle an Trak, Trik und Dostan gingen weiterhin von Elise aus.</p>\n<h2>Die vier Ravens</h2>\n<p>Trak reagierte eifersüchtig und rivalisierend, Trik provokant und lösungsorientiert, Dostan als ruhiger Schild. <a href=\"#/artikel/frost\">Frost</a> blieb Elises Vertrauter und Verbindung zum Endless Winter.</p>\n<h2>Letzter bekannter Stand</h2>\n<p>Nach der Ausbildung trennten sich die Wege der beiden Knoten. Für den Aldencross-Stand ist kein neuer Aufenthaltsort der White Ravens festgehalten.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-elise\">Elise, Styke und Vesper</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["history"],"status":"Bestätigt","tags":["White Ravens","Historisch"],"aliases":["Zadaria"],"group":"history","text":"Die White Ravens Elise Zadaria führte während Thorns Ausbildung die White Ravens . Zwischen ihr, Styke und Vesper kam es wiederholt zu Sex und persönlicher Nähe. Befehle an Trak, Trik und Dostan gingen weiterhin von Elise aus. Die vier Ravens Trak reagierte eifersüchtig und rivalisierend, Trik provokant und lösungsorientiert, Dostan als ruhiger Schild. Frost blieb Elises Vertrauter und Verbindung zum Endless Winter. Letzter bekannter Stand Nach der Ausbildung trennten sich die Wege der beiden Knoten. Für den Aldencross-Stand ist kein neuer Aufenthaltsort der White Ravens festgehalten. Private Akte (18+) Elise, Styke und Vesper . Der Nachtrag erscheint nach Altersbestätigung.","links":["white-ravens","styke","vesper","frost","intim-elise"],"backlinks":["trak","trik","dostan","frost","white-ravens","story-so-far","intim-elise"],"search":"elise zadaria eigenstandige rivalin und zeitweilige vertraute aus thorns ausbildungsphase zadaria white ravens historisch history die white ravens elise zadaria fuhrte wahrend thorns ausbildung die white ravens zwischen ihr styke und vesper kam es wiederholt zu sex und personlicher nahe befehle an trak trik und dostan gingen weiterhin von elise aus die vier ravens trak reagierte eifersuchtig und rivalisierend trik provokant und losungsorientiert dostan als ruhiger schild frost blieb elises vertrauter und verbindung zum endless winter letzter bekannter st s. Hier lebt die Gruppe seit dem 23. Januar unter Tarnung.","body":"<h2>Gestalt und Lage</h2>\n<p>Aldencross ist eine offene Marktstadt nahe der Watch Wall, <strong>keine ummauerte Stadt mit Südtor</strong>. Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne.</p>\n<h2>Wirtschaft und Gesellschaft</h2>\n<p>Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern.</p>\n<h2>Die Gruppe im Ort</h2>\n<p>Seit 23. Januar dient das <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> als Unterkunft. Der <a href=\"#/artikel/scroll\">Illuminated Scroll</a>, das <a href=\"#/artikel/mott-haus\">Mott-Haus</a>, das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte.</p>\n<h2>Aktueller Druck</h2>\n<p>Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.</p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":[],"parent":"talingarde","text":"Gestalt und Lage Aldencross ist eine offene Marktstadt nahe der Watch Wall, keine ummauerte Stadt mit Südtor . Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne. Wirtschaft und Gesellschaft Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern. Die Gruppe im Ort Seit 23. Januar dient das Lord's Dalliance als Unterkunft. Der Illuminated Scroll , das Mott-Haus , das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte. Aktueller Druck Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.","links":["dalliance","scroll","mott-haus"],"backlinks":["havelyn","story-so-far"],"search":"aldencross offener marktort unterhalb balentynes hier lebt die gruppe seit dem 23 januar unter tarnung aldencross gestalt und lage aldencross ist eine offene marktstadt nahe der watch wall keine ummauerte stadt mit sudtor das ortsdossier nennt etwa 1 800 einwohner und eine enge verbindung zur ungefahr eine meile entfernt auf hoherem grund liegenden festung balentyne wirtschaft und gesellschaft soldaten reisende konigliche arbeiten und nordhandel machen den ort vergleichsweise geordnet und wohlhabend nahrung brennstoff hufeisen reparaturen wasche pferde und tagelohnarbeit verbinden fast jede familie mit der festung fremde handler sind plausibel behauptete ortsansassigkeit kann an gegenseitigem erkennen scheitern die gruppe im ort seit 23 januar dient das lord s dalliance als unterkunft der illuminated scroll das mott haus das zivile arbeitsnetz um mara und ellyn und barnabus mannschaft sind wichtige kontakte aktueller druck varnings tod ist seit dem 31 januar in balentyne bekannt der zivile zugang wurde enger kontrolliert die stadt bleibt bewohnt und geschaftig sie ist keine leere missionskulisse"},{"id":"dalliance","category":"orte","title":"Lord's Dalliance","summary":"Gasthaus, Unterkunft, gesellschaftlicher Knotenpunkt und Ausgang des entdeckten Geheimgangs.","body":"<h2>Haus und Menschen</h2>\n<p>Bellam und <a href=\"#/artikel/alicia\">Alicia Barhold</a> betreiben Aldencross' wichtigste Herberge. Essen, Rauch, starker Alkohol, dienstfreie Soldaten, Fuhrleute und Gerüchte liegen hier dichter beieinander als irgendwo sonst im Ort. Die frühere Bordelltradition lebt in diskreten Zimmerbesuchen fort.</p>\n<h2>Das hintere Zimmer</h2>\n<p><a href=\"#/artikel/styke\">Styke</a>, <a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/valeria\">Valeria</a> bewohnen ein großes rückwärtiges Zimmer im Obergeschoss. Es ist Schlafplatz, Planungsraum, Waffenablage und inzwischen ein Ort mit zu viel gemeinsamer Geschichte für vier Wände.</p>\n<p>Am späteren 1. Februar ruht Valeria dort. Vesper und Verse sind noch fort. Styke sitzt unten im Schankraum.</p>\n<h2>Keller und Tunnel</h2>\n<p>Hinter den Vorräten liegt die verdeckte Zwergentür zum <a href=\"#/artikel/tunnel\">Geheimgang nach Balentyne</a>. Die gekauften Ketten, Ringe, Nägel und Keile liegen als Material bereit; im Gang ist davon noch nichts montiert.</p>\n<h2>Gerüchte als Wetter</h2>\n<p>Am 1. Februar hörte Styke hier von Straßenbefragungen, strengeren Zählungen, ausgefallenen Heimwegen und kleinen Vorratskäufen. Kein einzelner Satz ergab ein Lagebild. Zusammen klangen sie wie eine Festung, die ihre Türen enger zog.</p>","sources":["dalliance","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Lords Dalliance","Dalliance","The Lord's Dalliance"],"parent":"aldencross","text":"Haus und Menschen Bellam und Alicia Barhold betreiben Aldencross' wichtigste Herberge. Essen, Rauch, starker Alkohol, dienstfreie Soldaten, Fuhrleute und Gerüchte liegen hier dichter beieinander als irgendwo sonst im Ort. Die frühere Bordelltradition lebt in diskreten Zimmerbesuchen fort. Das hintere Zimmer Styke , Vesper und Valeria bewohnen ein großes rückwärtiges Zimmer im Obergeschoss. Es ist Schlafplatz, Planungsraum, Waffenablage und inzwischen ein Ort mit zu viel gemeinsamer Geschichte für vier Wände. Am späteren 1. Februar ruht Valeria dort. Vesper und Verse sind noch fort. Styke sitzt unten im Schankraum. Keller und Tunnel Hinter den Vorräten liegt die verdeckte Zwergentür zum Geheimgang nach Balentyne . Die gekauften Ketten, Ringe, Nägel und Keile liegen als Material bereit; im Gang ist davon noch nichts montiert. Gerüchte als Wetter Am 1. Februar hörte Styke hier von Straßenbefragungen, strengeren Zählungen, ausgefallenen Heimwegen und kleinen Vorratskäufen. Kein einzelner Satz ergab ein Lagebild. Zusammen klangen sie wie eine Festung, die ihre Türen enger zog.","search":"lord s dalliance gasthaus unterkunft gesellschaftlicher knotenpunkt und ausgang des entdeckten geheimgangs lords dalliance dalliance the lord s dalliance aldencross haus und menschen bellam und alicia barhold betreiben aldencross wichtigste herberge essen rauch starker alkohol dienstfreie soldaten fuhrleute und geruchte liegen hier dichter beieinander als irgendwo sonst im ort die fruhere bordelltradition lebt in diskreten zimmerbesuchen fort das hintere zimmer styke vesper und valeria bewohnen ein grosses ruckwartiges zimmer im obergeschoss es ist schlafplatz planungsraum waffenablage und inzwischen ein ort mit zu viel gemeinsamer geschichte fur vier wande am spateren 1 februar ruht valeria dort vesper und verse sind noch fort styke sitzt unten im schankraum keller und tunnel hinter den vorraten liegt die verdeckte zwergentur zum geheimgang nach balentyne die gekauften ketten ringe nagel und keile liegen als material bereit im gang ist davon noch nichts montiert geruchte als wetter am 1 februar horte styke hier von strassenbefragungen strengeren zahlungen ausgefallenen heimwegen und kleinen vorratskaufen kein einzelner satz ergab ein lagebild zusammen klangen sie wie eine festung die ihre turen enger zog","links":["alicia","styke","vesper","valeria","tunnel"],"backlinks":["styke","bellam","alicia","aldencross","spielstand","story-so-far","zeit-0123","zeit-0201"]},{"id":"zimmer","category":"orte","title":"Das rückwärtige Zimmer","summary":"Privater Stützpunkt des Trios im Obergeschoss des Dalliance.","body":"<h2>Dauerhaft etabliert</h2>\n<p>Das große rückwärtige Mietzimmer ist Unterkunft und privater Besprechungsraum. Die drei teilen dort Bett, Alltagsgegenstände und Ausrüstung. Das weiche Seil und Vespers rotes Buch sind etablierter Besitz.</p>\n<h2>Aktueller Morgen</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> hat sich gewaschen und das Fenster zum Lüften geöffnet. Ein späteres Schließen wurde nicht erklärt. <a href=\"#/artikel/valeria\">Valeria</a> liegt zuletzt beobachtet schlafend im Bett. Bettwäsche muss gewechselt werden; der Wechsel wurde noch nicht vollzogen. <a href=\"#/artikel/vesper\">Vesper</a> nahm <a href=\"#/artikel/verse\">Verse</a> bei der Abreise vom Tisch mit.</p>\n<h2>Noch nicht erledigte Vorbereitung</h2>\n<p>Die am 31. Januar gekauften Ketten und Beschläge liegen weiter als Ausrüstung bereit. Wiederholte Absichten, sie nachts einzubauen, ersetzen keine gespielte Montage.</p>\n","sources":["live","dalliance"],"status":"Bekannt","tags":["Aldencross"],"aliases":[],"parent":"dalliance","text":"Dauerhaft etabliert Das große rückwärtige Mietzimmer ist Unterkunft und privater Besprechungsraum. Die drei teilen dort Bett, Alltagsgegenstände und Ausrüstung. Das weiche Seil und Vespers rotes Buch sind etablierter Besitz. Aktueller Morgen Styke hat sich gewaschen und das Fenster zum Lüften geöffnet. Ein späteres Schließen wurde nicht erklärt. Valeria liegt zuletzt beobachtet schlafend im Bett. Bettwäsche muss gewechselt werden; der Wechsel wurde noch nicht vollzogen. Vesper nahm Verse bei der Abreise vom Tisch mit. Noch nicht erledigte Vorbereitung Die am 31. Januar gekauften Ketten und Beschläge liegen weiter als Ausrüstung bereit. Wiederholte Absichten, sie nachts einzubauen, ersetzen keine gespielte Montage.","links":["styke","valeria","vesper","verse"],"backlinks":[],"search":"das ruckwartige zimmer privater stutzpunkt des trios im obergeschoss des dalliance aldencross dauerhaft etabliert das grosse ruckwartige mietzimmer ist unterkunft und privater besprechungsraum die drei teilen dort bett alltagsgegenstande und ausrustung das weiche seil und vespers rotes buch sind etablierter besitz aktueller morgen styke hat sich gewaschen und das fenster zum luften geoffnet ein spateres schliessen wurde nicht erklart valeria liegt zuletzt beobachtet schlafend im bett bettwasche muss gewechselt werden der wechsel wurde noch nicht vollzogen vesper nahm verse bei der abreise vom tisch mit noch nicht erledigte vorbereitung die am 31 januar gekauften ketten und beschlage liegen weiter als ausrustung bereit wiederholte absichten sie nachts einzubauen ersetzen keine gespielte montage"},{"id":"tunnel","category":"orte","title":"Der Geheimgang","summary":"Entdeckter alter Zwergengang zwischen Dalliance-Keller und einem Vorratsraum Balentynes.","body":"<h2>Entdeckung in der Nacht 27./28. Januar</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> führte die Suche, <a href=\"#/artikel/styke\">Styke</a> half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an.</p>\n<h2>Tatsächlich gesehene Gegenseite</h2>\n<p>Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her.</p>\n<h2>Was weiterhin fehlt</h2>\n<p>Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route.</p>\n<h2>Gegenwärtige Nutzungsidee</h2>\n<p>Der Gang könnte später als Zugang und womöglich Verwahrort dienen. Der Kauf von Ketten hat ihn noch nicht in ein fertiges Verlies verwandelt.</p>\n","sources":["dalliance","balentyne","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Geheimtunnel","Zwergentunnel","Kellertunnel"],"parent":"dalliance","text":"Entdeckung in der Nacht 27./28. Januar Vesper führte die Suche, Styke half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an. Tatsächlich gesehene Gegenseite Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her. Was weiterhin fehlt Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route. Gegenwärtige Nutzungsidee Der Gang könnte später als Zugang und womöglich Verwahrort dienen. Der Kauf von Ketten hat ihn noch nicht in ein fertiges Verlies verwandelt.","links":["vesper","styke"],"backlinks":["dalliance","story-so-far","zeit-tunnel"],"search":"der geheimgang entdeckter alter zwergengang zwischen dalliance keller und einem vorratsraum balentynes geheimtunnel zwergentunnel kellertunnel aldencross entdeckung in der nacht 27 28 januar vesper fuhrte die suche styke half sie offneten die verborgene tur hinter den kellervorraten mit einem verdeckten stein der enge gewundene gang steigt uber annahernd eine meile zur festung an tatsachlich gesehene gegenseite die ferne zwergentur liess sich vom gang aus einen spalt offnen dahinter lag ein stiller vorratsraum mit haltbaren rationen und wasserfassern styke und vesper gingen nicht vollstandig hinein sie kehrten ohne beobachteten alarm zuruck schlossen beide turen und stellten die tarnung im keller wieder her was weiterhin fehlt verkehr im raum nutzer wachrhythmus und bedienung von der raumseite sind nicht sicher bekannt aus einem ruhigen beobachtungsmoment folgt keine dauerhaft unbewachte route gegenwartige nutzungsidee der gang konnte spater als zugang und womoglich verwahrort dienen der kauf von ketten hat ihn noch nicht in ein fertiges verlies verwandelt"},{"id":"balentyne","category":"orte","title":"Balentyne","summary":"Festung der Watch Wall, ziviler Arbeitsort und Ziel des Nessianischen Knotens.","body":"<h2>Öffentliche Festung</h2>\n<p>Der befestigte Wachtturmkomplex liegt etwa eine Meile oberhalb von Aldencross. <a href=\"#/artikel/havelyn\">Lord Thomas Havelyn</a> ist Kommandant und zugleich Herr des Ortes. Die Garnison umfasst nach bekanntem Überblick ungefähr hundert Wachen zuzüglich Offizieren, Geistlichen, Spezialisten und zivilem Personal; ihre volle aktuelle Bereitschaft ist nicht bekannt.</p>\n<h2>Personen und Schnittstellen</h2>\n<p><a href=\"#/artikel/franz\">Franz Mott</a>, <a href=\"#/artikel/zack\">Zack Eddarly</a>, <a href=\"#/artikel/donnagin\">Father Donnagin</a> und <a href=\"#/artikel/tacitus\">Magisterin Tacitus</a> sind bekannte Funktionsträger. Varning und seine sechs Reiter wurden von der Gruppe getötet. Arbeiter aus Aldencross kochen, reinigen, tragen und waschen in der Festung.</p>\n<h2>Erschlossenes Wissen</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> arbeitete am 29. und 30. Januar mit den Zivilkräften. Untere Laufwege, Küche, Vorräte, Speiseraum, Kasernenbereiche und Wasserwege sind in begrenztem Umfang erkundet. Dazu kommen Timeons unvollständige Erinnerungskarte, der entdeckte Tunnel und Valerias Bericht über die <a href=\"#/artikel/torhaus\">Mechanismenebene des Torhauses</a>.</p>\n<h2>Aktuell keine Eintrittsgarantie</h2>\n<p>Seit Varnings Tod bekannt wurde, werden zivile Bewegungen strenger erfasst und begleitet. Vespers Abreise am 1. Februar bestätigt noch keine neue Zulassung. Ein vergangener Arbeitstag oder eine Tarnung machen nicht jede künftige Bewegung ungefährdet.</p>\n<h2>Kartengrenze</h2>\n<p>Dieses Wiki zeigt keine versteckten Raumpläne, Begegnungen oder Wachposten aus dem Abenteuer. Eine grobe Erinnerung, ein Blick durch eine Tür und zwei Arbeitstage sind kein vollständiger Festungsplan.</p>\n","sources":["balentyne","live","chronicle"],"status":"Bekannt","tags":["Watch Wall"],"aliases":["Watchtower Balentyne","Festung"],"parent":"watch-wall","text":"Öffentliche Festung Der befestigte Wachtturmkomplex liegt etwa eine Meile oberhalb von Aldencross. Lord Thomas Havelyn ist Kommandant und zugleich Herr des Ortes. Die Garnison umfasst nach bekanntem Überblick ungefähr hundert Wachen zuzüglich Offizieren, Geistlichen, Spezialisten und zivilem Personal; ihre volle aktuelle Bereitschaft ist nicht bekannt. Personen und Schnittstellen Franz Mott , Zack Eddarly , Father Donnagin und Magisterin Tacitus sind bekannte Funktionsträger. Varning und seine sechs Reiter wurden von der Gruppe getötet. Arbeiter aus Aldencross kochen, reinigen, tragen und waschen in der Festung. Erschlossenes Wissen Vesper arbeitete am 29. und 30. Januar mit den Zivilkräften. Untere Laufwege, Küche, Vorräte, Speiseraum, Kasernenbereiche und Wasserwege sind in begrenztem Umfang erkundet. Dazu kommen Timeons unvollständige Erinnerungskarte, der entdeckte Tunnel und Valerias Bericht über die Mechanismenebene des Torhauses . Aktuell keine Eintrittsgarantie Seit Varnings Tod bekannt wurde, werden zivile Bewegungen strenger erfasst und begleitet. Vespers Abreise am 1. Februar bestätigt noch keine neue Zulassung. Ein vergangener Arbeitstag oder eine Tarnung machen nicht jede künftige Bewegung ungefährdet. Kartengrenze Dieses Wiki zeigt keine versteckten Raumpläne, Begegnungen oder Wachposten aus dem Abenteuer. Eine grobe Erinnerung, ein Blick durch eine Tür und zwei Arbeitstage sind kein vollständiger Festungsplan.","links":["havelyn","franz","zack","donnagin","tacitus","vesper","torhaus"],"backlinks":["vesper","franz","havelyn","zeit-0114"],"search":"balentyne festung der watch wall ziviler arbeitsort und ziel des nessianischen knotens watchtower balentyne festung watch wall offentliche festung der befestigte wachtturmkomplex liegt etwa eine meile oberhalb v ücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten.</p>\n<h2>Offene Grenzen</h2>\n<p>Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.</p>\n","sources":["live","core","chronicle"],"status":"Berichtet","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Informationsweg Barnabus erzählte Valeria beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an Styke und Vesper weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios. Bekannte Einzelheiten Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten. Offene Grenzen Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.","links":["valeria","styke","vesper"],"backlinks":["balentyne","zeit-valeria-rueckkehr"],"search":"balentynes torhaus mechanismen wachen und ingenieure nach valerias weitergegebenem bericht balentyne informationsweg barnabus erzahlte valeria beim trinken am 30 januar einzelheiten sie gab diese spat am 31 januar an styke und vesper weiter es handelt sich um einen gehorten inzwischen geteilten bericht nicht um eine vollstandige eigene besichtigung des trios bekannte einzelheiten das zweite geschoss ist die mechanismenebene getrennte winden bedienen fallgatter und zugbrucke vier wachen sind dort durchgehend eingesetzt vier zwergeningenieure arbeiten tagsuber dort heisssandabwehr wird auf dieser ebene unterhalten offene grenzen kein akuter konstruktionsfehler wurde bekannt genaue alarm ablose schlaf und meldeablaufe bleiben untersuchungsziele eine separate kleinere zisterne gehort zum bekannten wassersystem des torhauses"},{"id":"kueche","category":"orte","title":"Küche und Versorgung Balentynes","summary":"Vespers zivile Arbeitstage lieferten reales, aber begrenztes Versorgungswissen.","body":"<h2>Beobachtete Abläufe</h2>\n<p>Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. <a href=\"#/artikel/vesper\">Vesper</a> sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert.</p>\n<h2>Wasser</h2>\n<p>Gewöhnliches Wasser kommt aus dem <a href=\"#/artikel/tyburn\">Tyburn</a>. Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen.</p>\n<h2>Mama Giuseppes Eintopf</h2>\n<p>Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen.</p>\n<h2>Krankheit</h2>\n<p>Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.</p>\n","sources":["chronicle","live","core"],"status":"Bekannt","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Beobachtete Abläufe Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. Vesper sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert. Wasser Gewöhnliches Wasser kommt aus dem Tyburn . Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen. Mama Giuseppes Eintopf Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen. Krankheit Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.","links":["vesper","tyburn"],"backlinks":["giuseppe"],"search":"kuche und versorgung balentynes vespers zivile arbeitstage lieferten reales aber begrenztes versorgungswissen balentyne beobachtete ablaufe die kuche ist fast standig in betrieb die vorratskammer wird haufig nachgefullt und enthalt ungefahr ein bis zwei tage verpflegung vesper sah bei dem von ihr beobachteten materialfluss keinen sichtbaren vorkoster oder giftprufvorgang das ist keine zusicherung jede lieferung werde niemals kontrolliert wasser gewohnliches wasser kommt aus dem tyburn das torhaus besitzt eine gesonderte kleinere zisterne beide wege werden nicht zu einem einzigen allumfassenden versorgungspunkt zusammengezogen mama giuseppes eintopf der wochentliche gemeinsame rindereintopf erreicht ungefahr siebzig dienstfreie soldaten 1 und 8 februar sind die nachsten belegten termine zuganglichkeit und bewachung am gewahlten tag bleiben offen krankheit mara beschrieb gewohnliche winterkrankheiten und einen durchfallfall schlimmere falle werden donnagin zugetragen personen mit darmbeschwerden werden von kuchenarbeit fernzuhalten versucht der knoten hat keine absichtliche infektion als ausgefuhrt etabliert"},{"id":"scroll","category":"orte","title":"Illuminated Scroll","summary":"Jacobian Scaramores Arbeits- und Schriftladen; Ort des Tacitus-Gesprächs.","body":"<h2>Funktion in der Kampagne</h2>\n<p>Hier arbeitet <a href=\"#/artikel/jacobian\">Jacobian Scaramore</a> mit Schriftstücken, Büchern, Konten und magischen Fragen. <a href=\"#/artikel/styke\">Styke</a> suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht.</p>\n<h2>Die Briefkette</h2>\n<p>Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am <strong>31. Januar um 20 Uhr</strong>, nach Ladenschluss und mit Jacobian als anwesendem Gastgeber.</p>\n<h2>Letztes Ereignis</h2>\n<p>Das Gespräch über <a href=\"#/artikel/verse\">Verse</a> endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.</p>\n","sources":["core","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["The Illuminated Scroll","Buchladen","Scaramores Laden"],"parent":"aldencross","text":"Funktion in der Kampagne Hier arbeitet Jacobian Scaramore mit Schriftstücken, Büchern, Konten und magischen Fragen. Styke suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht. Die Briefkette Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am 31. Januar um 20 Uhr , nach Ladenschluss und mit Jacobian als anwesendem Gastgeber. Letztes Ereignis Das Gespräch über Verse endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.","links":["jacobian","styke","verse"],"backlinks":["tacitus","jacobian","aldencross"],"search":"illuminated scroll jacobian scaramores arbeits und schriftladen ort des tacitus gesprachs the illuminated scroll buchladen scaramores laden aldencross funktion in der kampagne hier arbeitet jacobian scaramore mit schriftstucken buchern konten und magischen fragen styke suchte am 28 januar einen sachkundigen fur vespers erwachtes reliquiar und kaufte einen gebrauchten exorzisten reisebericht die briefkette jacobian schrieb tacitus einen versiegelten personlichen brief ihre antwort fuhrte zum treffen am 31 januar um 20 uhr nach ladenschluss und mit jacobian als anwesendem gastgeber letztes ereignis das gesprach uber verse endete wegen tacitus beschwerden fruh der benutzte abort und jacobians sorge um die weinflasche sind bestandteil dieser begegnung ein zweiter termin ist noch nicht vereinbart"},{"id":"mott-haus","category":"orte","title":"Das Haus der Motts","summary":"Wohlhabender zweigeschossiger Offiziershaushalt hinter St. Alden.","body":"<h2>Beobachteter Aufbau</h2>\n<p>Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden.</p>\n<h2>Schlafzimmer und Truhe</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band.</p>\n<h2>Zugang ist situationsgebunden</h2>\n<p>Kaitlyn ließ Styke am 28. Januar unter der Buch-Deckgeschichte herein und deutete für den 29. Januar eine öffene Hintertür an. Das ist kein dauerhaft offenes Haus. Dass während des ersten langen Besuchs keine weitere Haushaltsperson wahrgenommen wurde, beweist nicht, dass es niemals Personal gibt.</p>\n<h2>Offener Gegenstandsverbleib</h2>\n<p>Der Exorzisten-Reisebericht wurde am 28. Januar auf dem vorderen Tisch abgelegt. Eine spätere Mitnahme ist nicht belegt.</p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Mott
