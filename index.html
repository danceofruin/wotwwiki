ang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab.<\/p>\n<h2>Ergebnis<\/h2><p>Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt, auch wenn seine Antwort noch aussteht.<\/p>","sources":["live","chronicle","timeline","clocks-current"],"status":"Abgeschlossen","tags":["8./9. Februar","Hakon","Tunnel","Balentyne","Befehlskette"],"aliases":[],"text":"Ausgeführter Plan Das Trio drang nach Mitternacht durch den Geheimgang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab. Ergebnis Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt, auch wenn seine Antwort noch aussteht.","links":[],"backlinks":[],"search":"balentyne der bedingte angriffsplan balentyne ist gefallen torhaus signal und fire axes sturm fuhrten den ersten auftrag zum abschluss 8 9 februar hakon tunnel balentyne befehlskette ausgefuhrter plan das trio drang nach mitternacht durch den geheimgang ein totete donnagin und havelyn brach die torhausabwehr offnete fallgatter und zugbrucke und zog sich mit dem schatz zuruck danach schossen styke vesper und valeria gemeinsam das rote signal ab ergebnis fire axes heer nutzte das offene tor beim zweiten besuch war die aussere verteidigung gebrochen am fruhen morgen erlosch die organisierte gegenwehr balentyne ist gefallen thorns erster auftrag ist erfullt auch wenn seine antwort noch aussteht","initial":"B"},{"id":"offene-spuren","category":"vorhaben","title":"Weitere ons wunsche bezahlung und stellung nach der reise bellams und alicias 1 500 gp auszahlung beim ausschiffen thorns nachster auftrag tiadora hat ihn noch nicht erteilt was aus franz wurde kaitlyn besitzt weiterhin keinen belastbaren bericht bestand die liquide knotenkasse betragt 17 271 gp sechs pferde der balentyne schatz und barnabus tragbare ausrustung sind an bord gewohnliche requisitionsbeute wird als betriebsfonds gefuhrt","initial":"W"},{"id":"spielstand","category":"fakten","title":"Der aktuelle Spielstand","summary":"12. Februar, später Nachmittag: Der gesamte Haushalt reist auf Halstyn’s Folly; Nella sitzt mit Styke am offenen Deck.","body":"<h2>Ort und Zeit<\/h2><p><strong>12. Februar 4712 AR, später Nachmittag.<\/strong> <a href=\"#/artikel/halstyns-folly\">Halstyn’s Folly<\/a> arbeitet sich durch Nebel und Winterkälte weiter nach Süden. Styke und <a href=\"#/artikel/nella\">Nella<\/a> sitzen mit Blechbechern an der offenen Seite des überdachten Decks. Nella hat gerade ausgesprochen, dass ihr nicht das Speckzählen, sondern die wachsende Verantwortung für den Haushalt gefällt.<\/p>\n<h2>Der reisende Haushalt<\/h2><p>Styke, Vesper, Valeria, Tacitus, Tamsin, Nella, Kaitlyn, Mirelle, Hakon und seine fünf Gefährten, Grumblejack, Bellam, Alicia und sechs Pferde sind an Bord. Tiadora nutzt die einzige Kabine; alle anderen leben und schlafen auf dem überdachten offenen Deck. Kisten, Tuch und Seile geben dem Kerntrio einen halbprivaten Schlafplatz.<\/p>\n<h2>Arbeit auf der Reise<\/h2><p><a href=\"#/artikel/tacitus\">Tacitus<\/a> arbeitet mit Zorn am dritten vollen Tag ihres <a href=\"#/artikel/tacitus-familiarprojekt\">Familiar-Projekts<\/a>. Tamsin führt die Sicherheit. Nella hält Vorräte, Geldbewegungen und laufende Ausgaben zusammen. Kaitlyn kümmert sich vor allem um Menschen und persönlichen Besitz. Mirelle hat Grumblejack zweimal vermessen und entwickelt Polsterung und Bewegungsanforderungen für seine künftige Plattenrüstung.<\/p>\n<h2>Geld und Vorräte<\/h2><p>Die liquide Knotenkasse beträgt <strong>17.271 gp<\/strong>. Thorns 5.000-gp-Erfolgszahlung ist enthalten. Gewöhnliches Geld, Silber, Vorräte, Öl und Alkohol aus den wiederholten <a href=\"#/artikel/requisitionsfahrten\">Requisitionsfahrten<\/a> bilden einen Betriebsfonds für Haushalt, Lohn, Pferde und Ersatzmaterial und werden nicht einzeln als Abenteurerschatz bepreist.<\/p>\n<h2>Offener Horizont<\/h2><p>Balentyne und Buch Eins sind abgeschlossen. Die Barke fährt nach Farholde, doch Thorn hat den nächsten Auftrag noch nicht erteilt. Für Bellam und Alicia sind 1.500 gp beim Ausschiffen vorgemerkt. Styke will gegen Ende der Reise mit Hakon über die Zukunft seiner Gruppe sprechen.<\/p>","sources":["live","chronicle","timeline","clocks-current","dalliance","mirelle","thread-current"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["12. Februar","Halstyn’s Folly","Flussfahrt","Nella","Tacitus-Projekt"],"aliases":[],"text":"Ort und Zeit 12. Februar 4712 AR, später Nachmittag. Halstyn’s Folly arbeitet sich durch Nebel und Winterkälte weiter nach Süden. Styke und Nella sitzen mit Blechbechern an der offenen Seite des überdachten Decks. Nella hat gerade ausgesprochen, dass ihr nicht das Speckzählen, sondern die wachsende Verantwortung für den Haushalt gefällt. Der reisende Haushalt Styke, Vesper, Valeria, Tacitus, Tamsin, Nella, Kaitlyn, Mirelle, Hakon und seine fünf Gefährten, Grumblejack, Bellam, Alicia und sechs Pferde sind an Bord. Tiadora nutzt die einzige Kabine; alle anderen leben und schlafen auf dem überdachten offenen Deck. Kisten, Tuch und Seile geben dem Kerntrio einen halbprivaten Schlafplatz. Arbeit auf der Reise Tacitus arbeitet mit Zorn am dritten vollen Tag ihres Familiar-Projekts . Tamsin führt die Sicherheit. Nella hält Vorräte, Geldbewegungen und laufende Ausgaben zusammen. Kaitlyn kümmert sich vor allem um Menschen und persönlichen Besitz. Mirelle hat Grumblejack zweimal vermessen und entwickelt Polsterung und Bewegungsanforderungen für lung ist enthalten gewohnliches geld silber vorrate ol und alkohol aus den wiederholten requisitionsfahrten bilden einen betriebsfonds fur haushalt lohn pferde und ersatzmaterial und werden nicht einzeln als abenteurerschatz bepreist offener horizont balentyne und buch eins sind abgeschlossen die barke fahrt nach farholde doch thorn hat den nachsten auftrag noch nicht erteilt fur bellam und alicia sind 1 500 gp beim ausschiffen vorgemerkt styke will gegen ende der reise mit hakon uber die zukunft seiner gruppe sprechen","links":["halstyns-folly","nella","tacitus","tacitus-familiarprojekt","requisitionsfahrten"],"backlinks":[],"initial":"D"},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Von Branderscar bis zur Fahrt auf Halstyn’s Folly: Balentyne ist gefallen, der Haushalt zieht geschlossen nach Süden.","body":"<h2>I. Die Verurteilten von Branderscar<\/h2>\n<p>Die Geschichte begann für <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in <a href=\"#/artikel/branderscar\">Branderscar<\/a>. Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, <a href=\"#/artikel/verse\">Verse<\/a> zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt.<\/p>\n<p><a href=\"#/artikel/tiadora\">Tiadora<\/a> öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten <a href=\"#/artikel/verse\">Verse<\/a> zurück und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack<\/a>. Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl <a href=\"#/artikel/tamsin\">Tamsin Blackerly<\/a> als auch <a href=\"#/artikel/matilda\">Matilda Richter<\/a> die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet.<\/p>\n<h2>II. Thorns Haus und der Knoten<\/h2>\n<p>Der Weg führte zu <a href=\"#/artikel/thorn\">Adrastus Thorn<\/a>. Der <a href=\"#/artikel/dornpakt\">Pakt der Dornen<\/a>, die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen.<\/p>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon<\/a> gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen.<\/p>\n<p>Aus derselben Frau wurde <a href=\"#/artikel/valeria\">Valeria<\/a>. Sie nahm später einen <a href=\"#/artikel/privatpakt\">Privatpakt<\/a> an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. <a href=\"#/artikel/timeon\">Timeon<\/a> blieb außerhalb dieses Pakts. <a href=\"#/artikel/elise\">Elise Zadaria<\/a> führte ihre <a href=\"#/artikel/white-ravens\">White Ravens<\/a> währenddessen über eine getrennte Befehlskette.<\/p>\n<h2>III. Die Fahrt nach Norden<\/h2>\n<p>Auf der <a href=\"#/artikel/frosthamar\">Frosthamar<\/a> wurde die Verschwörung praktisch: Waffen mussten zu <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe<\/a> gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter <a href=\"#/artikel/sambryl\">Edward Sambryl<\/a>. Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit <a href=\"#/artikel/white-tusk\">White Tusk<\/a> und den <a href=\"#/artikel/yutak\">Yutak<\/a> brachte Handel und wertvolles Elfenbein.<\/p>\n<p>Am <strong>14. Januar 4712 AR<\/strong> erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt.<\/p>\n<p><a href=\"#/artikel/odenkirk\">Kargeld Odenkirk<\/a> starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. <a href=\"#/artikel/hakon\">Hakon<\/a>, <a href=\"#/artikel/sten\">Sten<\/a>, <a href=\"#/artikel/ketil\">Ketil<\/a>, <a href=\"#/artikel/eirik\">Eirik<\/a>, <a href=\"#/artikel/arved\">Arved<\/a> und <a href=\"#/artikel/torvald\">Torvald<\/a> hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit <a href=\"#/artikel/grumblejack\">Grumblejack<\/a> als freiem Freund.<\/p>\n<h2>IV. Unter fremdem Dach<\/h2>\n<p>Am <strong>23. Januar<\/strong> kamen Styke, Vesper und <a href=\"#/artikel/valeria\">Valeria<\/a> als freie Händler aus dem Norden nach <a href=\"#/artikel/aldencross\">Aldencross<\/a>. Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im <a href=\"#/artikel/dalliance\">Lord's Dalliance<\/a> wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags.<\/p>\n<p><a href=\"#/artikel/mara\">Mara Fenner<\/a> und <a href=\"#/artikel/ellyn\">Ellyn Reed<\/a>, früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung.<\/p>\n<h2>V. Freeman's Rock<\/h2>\n<p>Captain <a href=\"#/artikel/varning\">Ryan Varning<\/a> verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete <a href=\"#/artikel/freemans-rock\">Freeman's Rock<\/a> und bereitete einen Hinterhalt vor. In der Nacht des <strong>26. Januar<\/strong> formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an.<\/p>\n<p>Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem <a href=\"#/artikel/beute-cache\">Versteck<\/a> außerhalb Aldencross. Varnings kleiner <a href=\"#/artikel/varning-schluessel\">Schlüssel<\/a> blieb bei Styke; <a href=\"#/artikel/varlet\">Varlet<\/a> wurde Grumblejacks eigener Anteil.<\/p>\n<p>Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt.<\/p>\n<h2>VI. Türen, Briefe und Gewohnheiten<\/h2>\n<p>Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm.<\/p>\n<p>In der Nacht <strong>27./28. Januar<\/strong> entdeckten Styke und Vesper den <a href=\"#/artikel/tunnel\">Zwergengang<\/a> unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet.<\/p>\n<p>Am <strong>28. Januar<\/strong> vermittelte <a href=\"#/artikel/jacobian\">Jacobian Scaramore<\/a> einen Kontakt zur Magisterin <a href=\"#/artikel/tacitus\">Tacitus<\/a>. Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig.<\/p>\n<p>Am selben Tag begann Stykes heimliche Affäre mit <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott<\/a>. Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu <a href=\"#/artikel/zack\">Zack Eddarly<\/a> fest. Kaitlyns Ehe mit <a href=\"#/artikel/franz\">Franz Mott<\/a> wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch.<\/p>\n<h2>VII. Das Netz wird dichter<\/h2>\n<p>Vespers Arbeitstage am <strong>29. und 30. Januar<\/strong> lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. <a href=\"#/artikel/giuseppe\">Mama Giuseppe<\/a> kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen.<\/p>\n<p>Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst.<\/p>\n<p>Zwischen diesen Unternehmungen blieb das gemeinsame Leben widersprüchlich. Valeria sagte, sie könne Styke und Vesper immer noch hassen und zugleich manchmal wirklich neben ihnen sein wollen. Sie plante wieder über den gleichen Abend hinaus. Der Satz beschrieb ihren gegenwärtigen Widerspruch genauer als jedes Bekenntnis.<\/p>\n<h2>VIII. Der 31. Januar<\/h2>\n<p>Nun war Varnings Tod in Balentyne bekannt. Zivile Arbeiter mussten mit strengeren Absprachen und Begleitung rechnen. Styke kaufte unter wechselnder Verkleidung Ketten und Beschläge, beschaffte verschiedene Arzneipräparate, Wein und Duftöl. Rattengift kaufte er nicht.<\/p>\n<p>Kaitlyn erhielt ein ungleiches persönliches Zukunftsangebot. Styke stellte sich vor, sie könne aus eigenem Interesse eine Konfrontation zwischen Franz und Zack fördern und später soziale Kenntnisse für den Knoten einbringen. Das blieb seine Einschätzung. Sie versprach weder Mitarbeit noch Loyalität; die angekündigte Nachricht mit Treffpunkt und Zeit wurde noch nicht gesandt.<\/p>\n<p>Um <strong>20 Uhr<\/strong> trafen Styke, Vesper und Verse Tacitus bei Jacobian. Verse sprach über unvollständige Erinnerungen, neue eigene Gedanken und die Möglichkeit, Vesper zu widersprechen. Das Gespräch zeigte mehr als ein reizvolles magisches Objekt. Während einer Ablenkung gab Vesper verdeckt Abführmittel in Tacitus' einzelnes Glas. Die Magisterin musste das Gespräch vorzeitig verlassen. Sie wurde nicht entführt. Jacobian wollte eine etwaige Fortsetzung vermitteln, aber kein zweiter Termin stand fest.<\/p>\n<p>Valeria kam sehr spät zurück. Sie hatte <a href=\"#/artikel/timeon-hof\">Timeons sicheren Aufenthaltsort<\/a> persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria.<\/p>\n<p>Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht <strong>8./9. Februar<\/strong>, abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an <a href=\"#/artikel/hakon\">Hakon<\/a> oder Sakkarot übermittelt.<\/p>\n<h2>IX. Der frühe Morgen des 1. Februar<\/h2>\n<p>Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu.<\/p>\n<h2>X. Der 1. Februar<\/h2>\n<p>Vespers Arbeiterdeckung hielt auch unter verschärfter Zählung. Sie half bei Giuseppes Eintopf, fand aber weder Zack noch Donnagin. Am Abend präzisierte die Gruppe den Plan für den 8./9. Februar. Vesper und Valeria erhielten gemeinsam das Vetorecht über neue Gefolgsleute.<\/p>\n<p>Sehr spät montierten Styke, Vesper und Valeria zwei schwere Ketten im Tunnel. Zurück im Zimmer fand Vesper im roten Buch einen Absatz, den sie nicht kannte.<\/p>\n<h2>XI. Die Suche nach Tamsin<\/h2>\n<p>Am 2. Februar kaufte Styke Rattengift, dann ritten die drei nach Süden. Im namenlosen Mühlenbezirk fanden sie Tamsins Spur bei Darran Vell. Tamsin hatte Timeon sicher abgeliefert, war danach aber für eigenes Geld in Darrans kriminelles Geschäft eingestiegen.<\/p>\n<p>Styke erzwang zunächst eine Einigung. Vesper entzog Tamsin ihren Rang und setzte sie auf die unterste Stufe des Haushalts zurück. Danach holte die Gruppe Nella aus dem Gasthaus und zeigte ihr, was hinter der Händlerdecke lag.<\/p>\n<h2>XII. Vells Ende und Nellas Anfang<\/h2>\n<p>Darran Vell und vier seiner Leute starben in der Byre. Nella sah die Tötung unterlegener Männer, erbrach sich, widersprach Styke und blieb dennoch. Im alten Schafgehege hörte sie den Compact of the Bound, setzte ihr Blut darunter und wurde als Gebundene in den Knoten aufgenommen.<\/p>\n<p>Ihr erster Auftrag verbindet Hakon mit ihrer eigenen Familie. Bis 7. Februar steht Tamsin unter Nellas begrenzter Einsatzführung und muss sie zugleich beschützen. Der 2. Februar endet im engen Nachtlager. Am Morgen trennen sich ihre Wege.<\/p>\n<h2>XIII. Der 3. Februar<\/h2>\n<p>Am Morgen trennten sich die Wege. Nella und Tamsin ritten mit Stykes Nachricht, Vorräten und der Frist bis zum 7. Februar zu Hakon und danach in Richtung von Nellas Familie. Styke, Vesper und Valeria kehrten nach Aldencross zurück.<\/p>\n<p>Styke verkaufte drei Pferde aus Darran Vells Bestand für 120 gp. Über Jacobian lud er Tacitus für den 8. Februar ins Dalliance ein. Eine neue Wetttafel gab dem Mott-Gerücht erstmals einen öffentlichen Namen: Zack Eddarly, bislang ohne Beweis.<\/p>\n<p>Bei der Schneiderin <a href=\"#/artikel/mirelle\">Mirelle<\/a> kaufte die Gruppe vier Wäschestücke und begann zwei Maßarbeiten. Mirelle kam am Abend ins rückwärtige Zimmer und blieb nach Essen, Wein und Anproben bei Styke, Vesper und Valeria. Am folgenden Morgen begann die nächste Phase.<\/p><h2>XIV. Der 4. Februar<\/h2><p>Mirelle verließ nach Frühstück und Nachwirkung das Dalliance. Jacobian überbrachte Tacitus’ Zusage für das Essen am 8. Februar, unter der Bedingung, dass er sie begleitet. Vesper hielt ihre Arbeiterdeckung in Balentyne und konnte Zack endlich sicher identifizieren.<\/p>\n<h2>XV. Der 5. Februar<\/h2><p>Styke führte Kaitlyn verkleidet aus Aldencross zu einer verlassenen Wassermühle. Dort offenbarte er Branderscar, seine Liebe zu Vesper und den bevorstehenden Untergang der Stadt. Währenddessen setzte Vesper im Mott-Haus die echten Zack-Briefe offen. Kaitlyn kehrte später mit Styke ins Dalliance zurück, las den Compact und wurde Gebundene.<\/p>\n<h2>XVI. Der 6. Februar<\/h2><p>Styke kaufte Bücher, Haarfarbe und zwei Schriftrollen. Kaitlyn lehnte die Färbung ab und ging mit Rückkehrtermin 8. Februar zum Mott-Haus. Vesper sah Franz und Zack bei einem angespannten Gespräch und später Zack lebend. Nach Ladenschluss führte Mirelle die Anproben fort, erfuhr vom bevorstehenden Fall Aldencross’, verhandelte eine genaue Handwerksklausel und schloss den Compact. Spätabends legte der Knoten Führung, Schutzaufgaben, Hakons Vorlauf und den Tacitus-Plan fest. Styke, Vesper und Valeria schlafen im Dalliance; dort liegt der aktuelle Rand.<\/p>\n<h2>XVII. Der 7. Februar<\/h2><p>Am ersten Licht tötete Franz Mott Zack Eddarly im Duell. Styke brachte Franz bis an Balentynes Tor, wo Captain Barhold ihn entwaffnete und eine Untersuchung begann. Kaitlyn erfuhr Zacks Ende direkt von Styke und kehrte anschließend ins Mott-Haus zurück.<\/p><p>Nella und Tamsin schlossen ihren Auftrag erfolgreich ab. Hakon erhielt die neuen Befehle, Sten und Ketil erschienen als erstes Paar im Dalliance, Mirelles letzte Maßarbeiten wurden fertig und das rote Buch bestätigte mit einer vierten beobachteten Textänderung, dass es sehr wahrscheinlich auf Erlebtes reagiert.<\/p><h2>XVIII. Der 8. Februar<\/h2><p>Vesper brachte alle sechs Rattengiftpäckchen unbemerkt in Mama Giuseppes großen Eintopf und sah die Ausgabe beginnen, ohne eine Wirkung abzuwarten. Hakon bestätigte, dass alle sechs Nordmänner Aldencross erreicht hatten. Er holte Mirelle samt tragbarer Werkstattausrüstung ins Dalliance; Kaitlyn kam selbst zurück und begann unter Tamsins Führung mit ihrer ersten Beobachtungsaufgabe.<\/p><p>Beim Dinner mit Tacitus und Jacobian gewann das Gespräch über Verse echte Substanz: ein älterer kirchlicher Erinnerungsträger lag unter seinem heutigen, eigenständigen Denken. Nach Stykes Signal legte Vesper <em>Silence<\/em> über den Zugriff. Beide Gäste wurden lebend überwältigt, entwaffnet und später an die vorbereiteten Tunnelketten gebracht. Valerias alleinige Lektüre des roten Buches erzeugte keine neue Zeile.<\/p><h2>XIX. Die Nacht zum 9. Februar<\/h2><p>Nach Mitternacht drangen Styke, Vesper und Valeria durch den Geheimgang in Balentyne ein. Donnagin und Havelyn starben, ebenso zweiundzwanzig weitere Verteidiger. Vesper öffnete und entschärfte den Festungsschatz. Valeria legte Havelyns zu schwarzer +1-Dastard-Vollplatte verwandelte Rüstung an; Vesper trug fortan seinen Stirnreif der anziehenden Ausstrahlung.<\/p><p>Das Trio zerstörte Ballisten, Steinschütten und Heißsandabwehr, öffnete Fallgatter und Zugbrücke und ruinierte die Bedienwerke. Nach dem ersten Rückzug wurde das rote Signal abgeschossen. Fire-Axes Heer stürmte durch das offene Tor.<\/p><p>Beim zweiten Gang sahen die drei den äußeren Widerstand gebrochen und Bugbears tief in der Festung. Zugleich flohen große Teile Aldencross’ nach Süden und Westen. Styke nannte sie „Unser Land. Unsere Leute“ und ließ bewusst genug Verteidiger am Leben, um den Zivilisten Zeit zu erkaufen. Das Trio barg weitere Rüstung und Waffen und kehrte durch den Tunnel zum Dalliance zurück. Wenig später war Balentynes endgültiger Fall bestätigt.<\/p><h2>XX. Der 9. Februar: Sieg und Abreise<\/h2><p>Tiadora brachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zum wartenden Schiff aufzubrechen. Auf ihre Frage, wer mitkomme, antwortete Styke: „Alle.“ Hakon und Nella ordneten Fracht, Menschen und sechs Pferde so, dass der gesamte gewählte Haushalt an Bord der <a href=\"#/artikel/halstyns-folly\">Halstyn’s Folly<\/a> Platz fand. Jacobian blieb frei und zog getrennt weiter.<\/p><p>Tamsin erhielt dauerhaft den Sicherheitsbereich des Knotens. Nella führte Hauptbuch und Versorgung, Kaitlyn übernahm auf der Reise Verantwortung für Menschen und persönlichen Besitz, Mirelle rettete ihre tragbare Handwerksarbeit. Bellam und Alicia gingen mit an Bord.<\/p>\n<h2>XXI. Die ersten Nächte auf dem Fluss<\/h2><p>In der ersten Nacht verließ Tiadora die Barke allein in der Gestalt einer Ritterin. Alarm, Schreie und Hunde waren vom Schiff aus zu hören; sie kehrte mit Blut und Schlamm zurück. Am nächsten Morgen erklärte sie den Zweck: falsche Ritter sollten Krone, Kirche und Alerionorden in den Augen der Bevölkerung beschädigen.<\/p><p>Styke schlug stattdessen eine glaubwürdige außerordentliche Requisition vor. Valeria führte den ersten gemeinsamen Einsatz in ihrer alten Mitra-Rüstung; Styke, Vesper und Tiadora trugen andere Gesichter. Vogt Edran Vale gab Geld und Vorräte heraus. Seine Tochter behielt die als Druckmittel benutzte Silberkette, Vesper hinterließ eine falsche amtliche Quittung, und niemand wurde getötet. Eine zweite Requisitionsnacht brachte weitere Vorräte und gewöhnliches Geld für den laufenden Haushalt.<\/p>\n<h2>XXII. Der 12. Februar<\/h2><p>Tacitus arbeitet mit Zorn am dritten vollen Tag ihres Familiar-Projekts. Valeria hat das Großschwert bewegt und gepflegt, statt zwölf Reisetage mit zwölf Tagen Bereitschaft zu verwechseln. Nella setzt sich am späten Nachmittag ohne Ledger neben Styke, reicht ihm schlechtes Bier und spricht aus, was sich verändert hat: Die Arbeit ist alltäglich, aber Menschen kommen zu ihr, wenn etwas fehlt, und immer öfter hat sie eine Antwort.<\/p>","sources":["chronicle","timeline","live","relations","nella","tamsin-current","thread-current"],"status":"Bis zum 12. Februar","tags":["Rückblick","Gesamtkampagne","6. Februar"],"aliases":[],"text":"I. Die Verurteilten von Branderscar Die Geschichte begann für Styke und Vesper nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in Branderscar . Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, Verse zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt. Tiadora öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten Verse zurück und befreiten Grumblejack . Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl Tamsin Blackerly als auch Matilda Richter die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet. II. Thorns Haus und der Knoten Der Weg führte zu Adrastus Thorn . Der Pakt der Dornen , die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen. Dame Balina und ihr junger Knappe Timeon gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen. Aus derselben Frau wurde Valeria . Sie nahm später einen Privatpakt an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. Timeon blieb außerhalb dieses Pakts. Elise Zadaria führte ihre White Ravens währenddessen über eine getrennte Befehlskette. III. Die Fahrt nach Norden Auf der Frosthamar wurde die Verschwörung praktisch: Waffen mussten zu Sakkarot Fire-Axe gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter Edward Sambryl . Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit White Tusk und den Yutak brachte Handel und wertvolles Elfenbein. Am 14. Januar 4712 AR erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt. Kargeld Odenkirk starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. Hakon , Sten , Ketil , Eirik , Arved und Torvald hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit Grumblejack als freiem Freund. IV. Unter fremdem Dach Am 23. Januar kamen Styke, Vesper und Valeria als freie Händler aus dem Norden nach Aldencross . Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im Lord's Dalliance wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags. Mara Fenner und Ellyn Reed , früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung. V. Freeman's Rock Captain Ryan Varning verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete Freeman's Rock und bereitete einen Hinterhalt vor. In der Nacht des 26. Januar formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an. Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem Versteck außerhalb Aldencross. Varnings kleiner Schlüssel blieb bei Styke; Varlet wurde Grumblejacks eigener Anteil. Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt. VI. Türen, Briefe und Gewohnheiten Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm. In der Nacht 27./28. Januar entdeckten Styke und Vesper den Zwergengang unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet. Am 28. Januar vermittelte Jacobian Scaramore einen Kontakt zur Magisterin Tacitus . Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig. Am selben Tag begann Stykes heimliche Affäre mit Kaitlyn Mott . Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu Zack Eddarly fest. Kaitlyns Ehe mit Franz Mott wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch. VII. Das Netz wird dichter Vespers Arbeitstage am 29. und 30. Januar lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. Mama Giuseppe kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen. Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst. Zwischen diesen Unternehmungen blieb das gemeinsame Leben widersprüchlich. Valeria sagte, sie könne Styke und Vesper immer noch hassen und zugleich manchmal wirklich neben ihnen sein wollen. Sie plante wieder über den gleichen Abend hinaus. Der Satz beschrieb ihren gegenwärtigen Widerspruch genauer als jedes Bekenntnis. VIII. Der 31. Januar Nun war Varnings Tod in Balentyne bekannt. Zivile Arbeiter mussten mit strengeren Absprachen und Begleitung rechnen. Styke kaufte unter wechselnder Verkleidung Ketten und Beschläge, beschaffte verschiedene Arzneipräparate, Wein und Duftöl. Rattengift kaufte er nicht. Kaitlyn erhielt ein ungleiches persönliches Zukunftsangebot. Styke stellte sich vor, sie könne aus eigenem Interesse eine Konfrontation zwischen Franz und Zack fördern und später soziale Kenntnisse für den Knoten einbringen. Das blieb seine Einschätzung. Sie versprach weder Mitarbeit noch Loyalität; die angekündigte Nachricht mit Treffpunkt und Zeit wurde noch nicht gesandt. Um 20 Uhr trafen Styke, Vesper und Verse Tacitus bei Jacobian. Verse sprach über unvollständige Erinnerungen, neue eigene Gedanken und die Möglichkeit, Vesper zu widersprechen. Das Gespräch zeigte mehr als ein reizvolles magisches Objekt. Während einer Ablenkung gab Vesper verdeckt Abführmittel in Tacitus' einzelnes Glas. Die Magisterin musste das Gespräch vorzeitig verlassen. Sie wurde nicht entführt. Jacobian wollte eine etwaige Fortsetzung vermitteln, aber kein zweiter Termin stand fest. Valeria kam sehr spät zurück. Sie hatte Timeons sicheren Aufenthaltsort persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria. Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht 8./9. Februar , abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an Hakon oder Sakkarot übermittelt. IX. Der frühe Morgen des 1. Februar Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu. X. Der 1. Februar Vespers Arbeiterdeckung hielt auch unter verschärfter Zählung. Sie half bei Giuseppes Eintopf, fand aber weder Zack noch Donnagin. Am Abend präzisierte die Gruppe den Plan für den 8./9. Februar. Vesper und Valeria erhielten gemeinsam das Vetorecht über neue Gefolgsleute. Sehr spät montierten Styke, Vesper und Valeria zwei schwere Ketten im Tunnel. Zurück im Zimmer fand Vesper im roten Buch einen Absatz, den sie nicht kannte. XI. Die Suche nach Tamsin Am 2. Februar kaufte Styke Rattengift, dann ritten die drei nach Süden. Im namenlosen Mühlenbezirk fanden sie Tamsins Spur bei Darran Vell. Tamsin hatte Timeon sicher abgeliefert, war danach aber für eigenes Geld in Darrans kriminelles Geschäft eingestiegen. Styke erzwang zunächst eine Einigung. Vesper entzog Tamsin ihren Rang und setzte sie auf die unterste Stufe des Haushalts zurück. Danach holte die Gruppe Nella aus dem Gasthaus und zeigte ihr, was hinter der Händlerdecke lag. XII. Vells Ende und Nellas Anfang Darran Vell und vier seiner Leute starben in der Byre. Nella sah die Tötung unterlegener Männer, erbrach sich, widersprach Styke und blieb dennoch. Im alten Schafgehege hörte sie den Compact of the Bound, setzte ihr Blut darunter und wurde als Gebundene in den Knoten aufgenommen. Ihr erster Auftrag verbindet Hakon mit ihrer eigenen Familie. Bis 7. Februar steht Tamsin unter Nellas begrenzter Einsatzführung und muss sie zugleich beschützen. Der 2. Februar endet im engen Nachtlager. Am Morgen trennen sich ihre Wege. XIII. Der 3. Februar Am Morgen trennten sich die Wege. Nella und Tamsin ritten mit Stykes Nachricht, Vorräten und der Frist bis zum 7. Februar zu Hakon und danach in Richtung von Nellas Familie. Styke, Vesper und Valeria kehrten nach Aldencross zurück. Styke verkaufte drei Pferde aus Darran Vells Bestand für 120 gp. Über Jacobian lud er Tacitus für den 8. Februar ins Dalliance ein. Eine neue Wetttafel gab dem Mott-Gerücht erstmals einen öffentlichen Namen: Zack Eddarly, bislang ohne Beweis. Bei der Schneiderin Mirelle kaufte die Gruppe vier Wäschestücke und begann zwei Maßarbeiten. Mirelle kam am Abend ins rückwärtige Zimmer und blieb nach Essen, Wein und Anproben bei Styke, Vesper und Valeria. Am folgenden Morgen begann die nächste Phase. XIV. Der 4. Februar Mirelle verließ nach Frühstück und Nachwirkung das Dalliance. Jacobian überbrachte Tacitus’ Zusage für das Essen am 8. Februar, unter der Bedingung, dass er sie begleitet. Vesper hielt ihre Arbeiterdeckung in Balentyne und konnte Zack endlich sicher identifizieren. XV. Der 5. Februar Styke führte Kaitlyn verkleidet aus Aldencross zu einer verlassenen Wassermühle. Dort offenbarte er Branderscar, seine Liebe zu Vesper und den bevorstehenden Untergang der Stadt. Währenddessen setzte Vesper im Mott-Haus die echten Zack-Briefe offen. Kaitlyn kehrte später mit Styke ins Dalliance zurück, las den Compact und wurde Gebundene. XVI. Der 6. Februar Styke kaufte Bücher, Haarfarbe und zwei Schriftrollen. Kaitlyn lehnte die Färbung ab und ging mit Rückkehrtermin 8. Februar zum Mott-Haus. Vesper sah Franz und Zack bei einem angespannten Gespräch und später Zack lebend. Nach Ladenschluss führte Mirelle die Anproben fort, erfuhr vom bevorstehenden Fall Aldencross’, verhandelte eine genaue Handwerksklausel und schloss den Compact. Spätabends legte der Knoten Führung, Schutzaufgaben, Hakons Vorlauf und den Tacitus-Plan fest. Styke, Vesper und Valeria schlafen im Dalliance; dort liegt der aktuelle Rand. XVII. Der 7. Februar Am ersten Licht tötete Franz Mott Zack Eddarly im Duell. Styke brachte Franz bis an Balentynes Tor, wo Captain Barhold ihn entwaffnete und eine Untersuchung begann. Kaitlyn erfuhr Zacks Ende direkt von Styke und kehrte anschließend ins Mott-Haus zurück. Nella und Tamsin schlossen ihren Auftrag erfolgreich ab. Hakon erhielt die neuen Befehle, Sten und Ketil erschienen als erstes Paar im Dalliance, Mirelles letzte Maßarbeiten wurden fertig und das rote Buch bestätigte mit einer vierten beobachteten Textänderung, dass es sehr wahrscheinlich auf Erlebtes reagiert. XVIII. Der 8. Februar Vesper brachte alle sechs Rattengiftpäckchen unbemerkt in Mama Giuseppes großen Eintopf und sah die Ausgabe beginnen, ohne eine Wirkung abzuwarten. Hakon bestätigte, dass alle sechs Nordmänner Aldencross erreicht hatten. Er holte Mirelle samt tragbarer Werkstattausrüstung ins Dalliance; Kaitlyn kam selbst zurück und begann unter Tamsins Führung mit ihrer ersten Beobachtungsaufgabe. Beim Dinner mit Tacitus und Jacobian gewann das Gespräch über Verse echte Substanz: ein älterer kirchlicher Erinnerungsträger lag unter seinem heutigen, eigenständigen Denken. Nach Stykes Signal legte Vesper Silence über den Zugriff. Beide Gäste wurden lebend überwältigt, entwaffnet und später an die vorbereiteten Tunnelketten gebracht. Valerias alleinige Lektüre des roten Buches erzeugte keine neue Zeile. XIX. Die Nacht zum 9. Februar Nach Mitternacht drangen Styke, Vesper und r zusatzliches animus glyph paket ist begrenzt und keine zweite volle initiatorprogression animus und glyphen erlautert die derzeit aktiven werte zahlen die nicht stillschweigend repariert werden die hp der aktuellen bogen gelten obwohl altere aussagen zur globalen hp formel nicht luckenlos dazu passen valerias rustungsabhangige ride berechnung und stykes drittes talent bleiben offen keine fremde regelversion ersetzt hier ohne beschluss einen kampagnenwert","initial":"H"},{"id":"buildplanung","category":"regeln","title":"OOC: bereits besprochene Buildplanung","summary":"Ausdrücklich keine aktive Klassenänderung und kein vorweggenommenes Story-Ereignis.","body":"<h2>Aktiver Stand nach Balentyne<\/h2><p>Der Stufenaufstieg ist vollzogen. Diese Seite beschreibt deshalb keine bloße Zukunftsplanung mehr.<\/p>\n<ul><li><strong>Styke:<\/strong> Zelot 4 / Psion 1 / Awakened Blade 1; Deep Focus und Situational Awareness sind aktiv.<\/li><li><strong>Vesper:<\/strong> Oracle (Spirit Guide) 6; Zaubergrad 3, Martial- und Glyph-Paket auf Stufe 6.<\/li><li><strong>Valeria:<\/strong> Antipaladin 6, Tyrant + Lord of Darkness, VMC Cavalier (Order of Vengeance).<\/li><\/ul>\n<h2>Noch zukünftige Käufe<\/h2><p>Der Belt of Incredible Dexterity +2 für Styke, der Lesser Metamagic Rod of Extend für Vesper und die +1-Aufwertung von Valerias Meisterarbeits-Großschwert sind noch nicht gekauft. Sie dürfen nicht in aktuelle Werte eingerechnet werden.<\/p>","sources":["house","localrules","ssheet","valeria"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Buildplanung"],"aliases":[],"text":"Aktiver Stand nach Balentyne Der Stufenaufstieg ist vollzogen. Diese Seite beschreibt deshalb keine bloße Zukunftsplanung mehr. Styke: Zelot 4 / Psion 1 / Awakened Blade 1; Deep Focus und Situational Awareness sind aktiv. Vesper: Oracle (Spirit Guide) 6; Zaubergrad 3, Martial- und Glyph-Paket auf Stufe 6. Valeria: Antipaladin 6, Tyrant + Lord of Darkness, VMC Cavalier (Order of Vengeance). Noch zukünftige Käufe Der Belt of Incredible Dexterity +2 für Styke, der Lesser Metamagic Rod of Extend für Vesper und die +1-Aufwertung von Valerias Meisterarbeits-Großschwert sind noch nicht gekauft. Sie dürfen nicht in aktuelle Werte eingerechnet werden.","links":[],"backlinks":["hausregeln"],"search":"ooc bereits besprochene buildplanung ausdrucklich keine aktive klassenanderung und kein vorweggenommenes story ereignis buildplanung aktiver stand nach balentyne der stufenaufstieg ist vollzogen diese seite beschreibt deshalb keine blosse zukunftsplanung mehr styke zelot 4 psion 1 awakened blade 1 deep focus und situational awareness sind aktiv vesper oracle spirit guide 6 zaubergrad 3 martial und glyph paket auf stufe 6 valeria antipaladin 6 tyrant lord of darkness vmc cavalier order of vengeance noch zukunftige kaufe der belt of incredible dexterity 2 fur styke der lesser metamagic rod of extend fur vesper und die 1 aufwertung von valerias meisterarbeits grossschwert sind noch nicht gekauft sie durfen nicht in aktuelle werte eingerechnet werden","initial":"O"},{"id":"arcane-enlightenment","category":"regeln","title":"Arcane Enlightenment","summary":"Vier täglich wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known.","body":"<p><a href=\"#/artikel/vesper\">Vesper<\/a> kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar.<\/p>\n<h2>Standardauswahl<\/h2>\n<p><a href=\"#/artikel/dancing-darkness\">Dancing Darkness<\/a>, <a href=\"#/artikel/silent-image\">Silent Image<\/a>, <a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud<\/a> und <a href=\"#/artikel/ashen-path\">Ashen Path<\/a>. Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.<\/p>\n","sources":["vsheet","house","localrules"],"status":"Bestätigt","tags":["Vesper","Zauber"],"aliases":[],"text":"Vesper kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar. Standardauswahl Dancing Darkness , Silent Image , Euphoric Cloud und Ashen Path . Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.","links":["vesper","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"backlinks":["air-bubble","ashen-path","create-water","cure-light-wounds","cure-moderate-wounds","dancing-darkness","delay-poison","detect-magic","enhanced-diplomacy","euphoric-cloud","guidance","identify","lesser-restoration","obscuring-mist","protection-from-evil","purify-food-drink","read-magic","remove-sickness","silent-image","tongues","unnatural-lust"],"search":"arcane enlightenment vier taglich wahlbare sorcerer wizard zauber als temporare oracle spells known vesper zauber vesper kann beim taglichen auffrischen mit lore spirit vier passende sorcerer wizard zauber wahlen in der kampagnenfassung gelten sie fur diesen tag als temporare oracle spells known und werden spontan uber ihre normalen oracle slots und cha gewirkt gegenwartig sind nur zaubergrade bis 2 wirkbar standardauswahl dancing darkness silent image euphoric cloud und ashen path die auswahl ist keine weitere unabhangige slotreserve ein tageswechsel der auswahl und tatsachlich verbleibende slots werden nicht von dieser website adjudiziert","initial":"A"},{"id":"animus","category":"regeln","title":"Animus, Essence und Martial Glyphs","summary":"Vespers aktuelles Zusatzpaket: virtueller Rang 1, IL 6, CHA +4.","body":"<h2>Animus<\/h2>\n<p>Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält <a href=\"#/artikel/vesper\">Vesper<\/a> <strong>5 Animus<\/strong>, zu Beginn jedes weiteren eigenen Zuges <strong>+1<\/strong>. Am Rundenende gibt es <strong>+1<\/strong>, falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende.<\/p>\n<h2>Glyphen anwenden<\/h2>\n<p>Kosten <strong>1 Animus<\/strong>. Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite <strong>40 ft<\/strong>, Dauer <strong>5 Runden<\/strong>, DC <strong>17<\/strong>. Erneute Anwendung stapelt und verlängert denselben Glyphen nicht.<\/p>\n<h2>Bekannte Glyphen<\/h2>\n<p><a href=\"#/artikel/elemental-shield\">Elemental Shield<\/a>, <a href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade<\/a>, <a href=\"#/artikel/ghost-armor\">Ghost Armor<\/a>, <a href=\"#/artikel/deflective-armor\">Deflective Armor<\/a> und <a href=\"#/artikel/shadowmeld\">Shadowmeld<\/a>.<\/p>\n<h2>Essence ist etwas anderes<\/h2>\n<p>Vesper besitzt <strong>2 Essence<\/strong>, Kapazität <strong>1<\/strong> pro Receptacle. Standardmäßig liegt 1 in <a href=\"#/artikel/spoils-of-war\">Spoils of War<\/a>, der zweite Punkt ist für <a href=\"#/artikel/witness-to-glory\">Witness to Glory<\/a> vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.<\/p>\n","sources":["vsheet","vrules","localrules"],"status":"Bestätigt","tags":["Vesper","Glyph","Essence"],"aliases":[],"text":"Animus Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält Vesper 5 Animus , zu Beginn jedes weiteren eigenen Zuges +1 . Am Rundenende gibt es +1 , falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende. Glyphen anwenden Kosten 1 Animus . Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 40 ft , Dauer 5 Runden , DC 17 . Erneute Anwendung stapelt und verlängert denselben Glyphen nicht. Bekannte Glyphen Elemental Shield , Ghost Eating Blade , Ghost Armor , Deflective Armor und Shadowmeld . Essence ist etwas anderes Vesper besitzt 2 Essence , Kapazität 1 pro Receptacle. Standardmäßig liegt 1 in Spoils of War , der zweite Punkt ist für Witness to Glory vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.","links":["vesper","elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld","spoils-of-war","witness-to-glory"],"backlinks":["deflective-armor","elemental-shield","ghost-armor","ghost-eating-blade","hausregeln","shadowmeld"],"search":"animus essence und martial glyphs vespers aktuelles zusatzpaket virtueller rang 1 il 6 cha 4 vesper glyph essence animus ausserhalb eines kampfes kein ausgebbarer pool zu beginn ihres ersten eigenen zuges erhalt vesper 5 animus zu beginn jedes weiteren eigenen zuges 1 am rundenende gibt es 1 falls sie in dieser runde mindestens ein manover initiiert hat der pool besteht bis eine minute nach begegnungsende glyphen anwenden kosten 1 animus anwendung als swift action oder hochstens einmal pro runde als free action nach einem treffer mit einem martial strike ein gewohnlicher treffer genugt nicht reichweite 40 ft dauer 5 runden dc 17 erneute anwendung stapelt und verlangert denselben glyphen nicht bekannte glyphen elemental shield ghost eating blade ghost armor deflective armor und shadowmeld essence ist etwas anderes vesper besitzt 2 essence kapazitat 1 pro receptacle standardmassig liegt 1 in spoils of war der zweite punkt ist fur witness to glory vorgesehen in einem verbrauchten manover bleibt essence bis zu dessen recovery gebunden umlagern kostet grundsatzlich eine swift action ein vorgesehener einsatz ist keine automatische erlaubnis eine spielerressource auszugeben","initial":"A"},{"id":"aid","category":"faehigkeiten","title":"Aid / Compartmentalized Aid","summary":"Move Action, gegnerspezifischer Angriffsbonus und Recovery bis zu drei Manöver.","body":"<p><a href=\"#/artikel/styke\">Styke<\/a> nutzt seine <strong>Move Action<\/strong> zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners <strong>+4 auf seine Angriffe gegen dieses Ziel<\/strong> bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel.<\/p>\n<p>Die Anwendung stellt sofort bis zu <strong>3 geeignete verbrauchte vorbereitete Manöver<\/strong> wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Styke nutzt seine Move Action zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners +4 auf seine Angriffe gegen dieses Ziel bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel. Die Anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete Manöver wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.","links":["styke"],"backlinks":["kollektiv","zorn"],"search":"aid compartmentalized aid move action gegnerspezifischer angriffsbonus und recovery bis zu drei manover styke klassenfahigkeit styke nutzt seine move action zur selbsthilfe gegen einen benannten gegner bei gultigem aid ergebnis gilt durch helpful harrying partners 4 auf seine angriffe gegen dieses ziel bis zum beginn seines nachsten zuges kein allgemeines 4 gegen jedes ziel die anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete manover wieder her selbst wenn der aid versuch misslingt im selben eigenen zug gerade initiierte manover sind fur diese anwendung ausgeschlossen aid aus einer anderen aktionsquelle lost diese recovery nicht aus der etablierte kampfmotor aktiviert zeal","initial":"A"},{"id":"zeal","category":"faehigkeiten","title":"Zeal +1","summary":"Moralbonus auf Angriffe im Kollektiv für eine Runde.","body":"<p>Ein Treffer mit einem Martial Strike aktiviert <strong>+1 Moral auf Angriffswürfe<\/strong> für Kollektivmitglieder für <strong>1 Runde<\/strong>. Ein bloßer gewöhnlicher Angriff löst dies nicht selbst aus. Die akzeptierte Aid-Anwendung aktiviert Zeal ebenfalls. Beginn und Ablauf müssen im Kampf getrennt geführt werden.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Ein Treffer mit einem Martial Strike aktiviert +1 Moral auf Angriffswürfe für Kollektivmitglieder für 1 Runde . Ein bloßer gewöhnlicher Angriff löst dies nicht selbst aus. Die akzeptierte Aid-Anwendung aktiviert Zeal ebenfalls. Beginn und Ablauf müssen im Kampf getrennt geführt werden.","links":[],"backlinks":[],"search":"zeal 1 moralbonus auf angriffe im kollektiv fur eine runde styke klassenfahigkeit ein treffer mit einem martial strike aktiviert 1 moral auf angriffswurfe fur kollektivmitglieder fur 1 runde ein blosser gewohnlicher angriff lost dies nicht selbst aus die akzeptierte aid anwendung aktiviert zeal ebenfalls beginn und ablauf mussen im kampf getrennt gefuhrt werden","initial":"Z"},{"id":"living-bastion","category":"faehigkeiten","title":"Living Bastion","summary":"Fokus verleiht +5 ft Reichweite; die Schadenshalbierung verbraucht ihn bewusst.","body":"<p>Solange <a href=\"#/artikel/styke\">Styke<\/a> psionisch fokussiert bleibt: <strong>+5 ft Reach<\/strong>. Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Solange Styke psionisch fokussiert bleibt: +5 ft Reach . Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.","links":["styke"],"backlinks":[],"search":"living bastion fokus verleiht 5 ft reichweite die schadenshalbierung verbraucht ihn bewusst styke klassenfahigkeit solange styke psionisch fokussiert bleibt 5 ft reach durch aufgabe des fokus kann er schaden eines verbundeten innerhalb seiner reichweite nach dr resistenz halbieren einmal pro betroffener kreatur und runde der fokus wird nicht automatisch ausgegeben","initial":"L"},{"id":"martyrdom","category":"faehigkeiten","title":"Martyrdom","summary":"Bis 20 Schaden eines willigen Kollektivmitglieds übernehmen.","body":"<p>Gültige Verbindung und Reichweite sind Voraussetzung. <a href=\"#/artikel/styke\">Styke<\/a> kann bis <strong>20 Schaden<\/strong> übernehmen und bis <strong>4 PP<\/strong> ausgeben, um den übernommenen Betrag um <strong>3 je PP<\/strong> zu senken; mindestens <strong>1 Schaden<\/strong> bleibt. Weder Übernahme noch Ausgabe erfolgen ohne Spielerentscheidung.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähi  und private bilder wurden bei diesem standabgleich nicht verandert","initial":"R"},{"id":"intim-valeria","category":"intimitaet","title":"Valeria: Härte, Hingabe, Gegenmacht","summary":"Valerias intime Entwicklung bis 7. Februar: eigene Bindung zu Vesper, Führung über Styke und ein Platz in der gemeinsamen Zukunft.","body":"<h2>Härte und Rollenwechsel<\/h2>\n<p>Valerias sexuelle Geschichte mit Styke und Vesper begann während der Gefangenschaft in Thorns Anwesen mit Gewalt, Zwang und Konditionierung. Die späteren Nächte tragen diese Erinnerung mit, selbst wenn Valeria heute eigene Forderungen stellt.<\/p>\n<p>Am 74. Ausbildungstag verbrachte sie einen privaten Abend mit Fesselung und Shibari. Am 27. Januar beteiligte sie sich an Vespers Experiment mit Augenbinde, Fesseln und kontrollierter Berührung. In der Nacht 27./28. Januar verlangte sie die zuvor besprochene Härte.<\/p>\n<p>Spät am 31. Januar beziehungsweise früh am 1. Februar hatte sie <strong>harten Analverkehr<\/strong> mit Styke und forderte währenddessen mehr Intensität.<\/p>\n<h2>Die Scham wechselte ihre Bedeutung<\/h2>\n<p>Valerias koitale Inkontinenz war lange ein Ort von Scham. Styke sagte ihr offen, dass ihn gerade ihr Urin erregte. Am 30. Januar gestand Valeria, dass seine Reaktion sie selbst stark erregte und dass sie genau das an sich hasste.<\/p>\n<h2>Der Morgen mit Styke<\/h2>\n<p>Am 1. Februar bat Styke sie, die Führung zu übernehmen. Valeria lenkte Kontrolle, verbale Erniedrigung, Schmerz und Körperflüssigkeitsspiel. Danach bat er sie, ihn festzuhalten. Sie hielt ihn und sagte, sie werde ihm mitteilen, wenn sie dieses Gewicht nicht tragen könne.<\/p>\n<h2>Die Nacht mit Vesper<\/h2>\n<p>Vesper und Valeria wurden in derselben Nacht direkt miteinander intim. Vesper blieb bei ihr, als Valerias Körper erneut die Kontrolle verlor, reinigte sie anschließend und hielt sie. Am nächsten Morgen erinnerte Valeria sich besonders daran, dass Vesper dabei keine Erklärung verlangte.<\/p>\n<p><a href=\"#/artikel/anatomie-valeria\">Körper unter dem Harnisch<\/a> · <a href=\"#/artikel/intim-styke-valeria\">Gegenbewegung mit Styke<\/a> · <a href=\"#/artikel/intim-vesper-valeria\">Vesper und Valeria<\/a><\/p>\n<h2>Die Nacht zum 4. Februar<\/h2><p>Vor Vesper und Mirelle nahm Valeria die dominante Stellung sichtbar ein. Sie ließ Styke knien, „Herrin“ sagen und ihren dunkelblauen Schuh küssen, hielt ihn in Orgasmusverweigerung und stellte seine Reaktionen vor den beiden Frauen aus.<\/p>\n<p>Ihre eigene Erregung und Harnreaktion blieben dabei ebenso sichtbar. Mirelle sah weder eine makellose Rolle noch eine bloße Vorführung, sondern Valeria zugleich beschämt, erregt und entschlossen. Valeria hielt die Führung trotzdem bis zu Stykes spätem Orgasmus.<\/p><h2>Der 6. Februar<\/h2><p>Beim Training und danach entstand ein neuer privater Raum zwischen Valeria und Styke. Er entschuldigte sich für die frühere Gewalt. Valeria nahm die Entschuldigung an, ohne zu vergeben oder zu vergessen, und sprach zugleich ihre heutige Liebe aus. Beide beschlossen, dass künftige Zeit zu zweit nicht automatisch dem Trio gehört.<\/p><p>Beim späteren Bad half Valeria Kaitlyn, Stykes Reaktionen zu lesen und das Tempo zu halten. Am Abend gab ihr Stiefel Mirelles weicher Schnürung den Gegendruck; beim Carnal Seal führte sie Mirelle gemeinsam mit Vesper.<\/p>\n<h2>Der 7. Februar<\/h2><p>Valeria und Vesper wählten beim Buchtest einander, während Styke nicht eingriff. Später führte Valeria Styke mit kurzen Befehlen; er sagte ihr ausdrücklich, dass er die Verantwortung in dieser Lage an sie abgeben will.<\/p><p>Styke stellte Valeria in das langfristige Leben, das er sich mit Vesper vorstellt. Valeria verlangte keinen sofortigen Namen und keinen Antrag. Für sie entscheidet sich die Form dieser Zukunft erst, wenn die gegenwärtige Mission und ihre Zwänge vorbei sind.<\/p>","sources":["intim-valeria","intim-relations","intim-chronicle","intim-mirelle"],"status":"Kanonisch / Stand 7. Februar","tags":["Ab 18","Valeria", r nicht so groß oder schwer wie bei Tamsin. Die Warzenhöfe sind klein bis mittelgroß in warmem Rosébraun; die Brustwarzen etwas dunkler.<\/p>\n<h2>Intimbehaarung und Vulva<\/h2>\n<p>Ihr Schamhaar ist rötlich-braun, mäßig dicht und gewöhnlich sauber gekürzt. Ein kurzer ordentlicher Bewuchs liegt über dem Mons, die Ränder sind gepflegt.<\/p>\n<p>Die Vulva ist weich und rund in der äußeren Form, mit volleren äußeren Labien. Die inneren Labien sind in Ruhe mäßig sichtbar und etwas dunkler rosébraun als die umgebende Haut.<\/p>\n<p><a href=\"#/artikel/intim-kaitlyn\">Hinter der Maske<\/a> · <a href=\"#/artikel/kaitlyn\">öffentliche Akte<\/a><\/p>","sources":["intim-kaitlyn","intim-core-anatomy"],"status":"Kanonisch","tags":["Ab 18","Körper & Anatomie","Kaitlyn"],"aliases":["Kaitlyn Anatomie","Kaitlyn Brüste","Kaitlyn Vulva","Kaitlyn Schamhaar"],"adult":true,"owner":["Kaitlyn"],"kind":"Körper & Anatomie","dateLabel":"Körperakte: 10.09.2026","evidence":"Git-Dokumentation","text":"Die Schönheit, die Aldencross kennt Kaitlyn ist jung und auffallend schön, mit rotem Haar und grünen Augen . Ihr Körper wirkt weich gepflegt und gesellschaftlich verwöhnt: weniger Sehne und Drill als bei Valeria, mehr Haut und Rundung. Silhouette Sie ist durchschnittlich groß, mit schmaler Taille und volleren Hüften und Oberschenkeln. Am Unterbauch bleibt natürliche Weichheit. Brust Ihre Brüste sind mittelvoll und rundlicher als Vespers Tropfenform. Die Fülle sitzt besonders tief und zur Mitte, weich und beweglich, aber nicht so groß oder schwer wie bei Tamsin. Die Warzenhöfe sind klein bis mittelgroß in warmem Rosébraun; die Brustwarzen etwas dunkler. Intimbehaarung und Vulva Ihr Schamhaar ist rötlich-braun, mäßig dicht und gewöhnlich sauber gekürzt. Ein kurzer ordentlicher Bewuchs liegt über dem Mons, die Ränder sind gepflegt. Die Vulva ist weich und rund in der äußeren Form, mit volleren äußeren Labien. Die inneren Labien sind in Ruhe mäßig sichtbar und etwas dunkler rosébraun als die umgebende t","aliases":[],"initial":"V"},{"id":"zeit-0202-pakt","category":"chronik","title":"Nella tritt in den Knoten","summary":"Nach Vells Ende hörte Nella den vollständigen Compact und setzte ihr Blut darunter.","body":"<h2>Entscheidung<\/h2><p>Nella verlangte einen Weg über das Kochen hinaus. Nach Pflichten, Gegenleistungen und Rangfolge sagte sie: „Ja. Ich will den Pakt.“<\/p>\n<h2>Siegel<\/h2><p>Vesper schrieb, Valeria las vor, Nella schnitt die linke Hand und setzte als Einzige ihr Blut unter den Text. Der Compact wurde geschlossen.<\/p>\n<h2>Erster Auftrag<\/h2><p>Bis 7. Februar führt Nella Tamsin für einen Botengang zu Hakon und den Versuch, Nellas Schwester samt Ehemann aus dem Kriegsgebiet zu bewegen.<\/p>","sources":["chronicle","timeline","nella","knot-pact"],"status":"Bestätigt","tags":["2. Februar","Nella","Compact"],"dateLabel":"2. Februar 4712, später Abend","text":"Entscheidung Nella verlangte einen Weg über das Kochen hinaus. Nach Pflichten, Gegenleistungen und Rangfolge sagte sie: „Ja. Ich will den Pakt.“ Siegel Vesper schrieb, Valeria las vor, Nella schnitt die linke Hand und setzte als Einzige ihr Blut unter den Text. Der Compact wurde geschlossen. Erster Auftrag Bis 7. Februar führt Nella Tamsin für einen Botengang zu Hakon und den Versuch, Nellas Schwester samt Ehemann aus dem Kriegsgebiet zu bewegen.","links":[],"backlinks":[],"search":"nella tritt in den knoten nach vells ende horte nella den vollstandigen compact und setzte ihr blut darunter 2 februar nella compact entscheidung nella verlangte einen weg uber das kochen hinaus nach pflichten gegenleistungen und rangfolge sagte sie ja ich will den pakt siegel vesper schrieb valeria las vor nella schnitt die linke hand und setzte als einzige ihr blut unter den text der compact wurde geschlossen erster auftrag bis 7 februar fuhrt nella tamsin fur einen botengang zu hakon und den versuch nellas schwester samt ehemann aus dem kriegsgebiet zu bewegen","aliases":[],"initial":"N"},{"id":"zeit-0202-nacht"," <\/em> für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar.<\/p><h2>Bücher und Haarfarbe<\/h2><p>Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht.<\/p><h2>Kasse<\/h2><p>Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse <strong>7.356 gp<\/strong>. Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.<\/p>","sources":["live","treasury","chronicle"],"status":"Im Besitz","tags":["Schriftrollen","Silence","Remove Fear","6. Februar"],"links":[],"text":"Magische Schriftrollen Styke kaufte beim Illuminated Scroll eine klerikale Schriftrolle Silence für 150 gp und eine klerikale Schriftrolle Remove Fear für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar. Bücher und Haarfarbe Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht. Kasse Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse 7.356 gp . Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.","search":"besorgungen vom 6 februar eine silence schriftrolle remove fear zwei topfe haarfarbe und neun nachschlagewerke schriftrollen silence remove fear 6 februar gear magische schriftrollen styke kaufte beim illuminated scroll eine klerikale schriftrolle silence fur 150 gp und eine klerikale schriftrolle remove fear fur 25 gp eine zweite silence schriftrolle war nicht verfugbar bucher und haarfarbe neun nachschlagewerke und zwei topfe dunkle schwarzbraune haarfarbe kamen hinzu kaitlyn benutzte die farbe nicht beide topfe sind ungebraucht kasse nach den beiden magischen kaufen betragt die abstrakte liquide knotenkasse 7 356 gp die gewohnlichen preise von buchern und farbe bleiben im laufenden betriebsaufwand","backlinks":[],"initial":"B"},{"aliases":[],"group":"reference","id":"befehlsstruktur","category":"fakten","title":"Situative Befehlskette","summary":"Styke und Vesper führen gemeinsam; Valeria trägt die militärische Linie, Tamsin hält Schutz und Hausordnung im abgeriegelten Dalliance.","body":"<h2>Spitze<\/h2><p>Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen.<\/p><h2>Feld und Fach<\/h2><p>Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe.<\/p><h2>Angriffsnacht<\/h2><p>Wenn ihr Rückkehrbericht stimmt, erhält Tamsin Schutz- und Evakuierungsverantwortung im Dalliance. Das bedeutet klare Befehle bei Gefahr, nicht allgemeine Herrschaft über Kaitlyn, Nella oder Mirelle.<\/p><h2>Grumblejack<\/h2><p>Grumblejack bleibt freier Freund. Aufgaben werden mit ihm vereinbart; er ist kein großer Soldat am Ende der Rangliste.<\/p>\n<h2>Wirksamer Stand am 7. Februar<\/h2><p>Stykes und Vespers gemeinsame Autorität bleibt die Spitze. Valeria führt die militärisch-logistische Vorbereitung für Hakons Gruppe und Tamsins Dalliance-Auftrag. Tamsin kommandiert in der Angriffsnacht Schutz und Evakuierung im Gasthaus. Nellas befristete Führung über Tamsin endete mit dem erfolgreichen Rückkehrbericht.<\/p><h2>Stand während des Balentyne-Angriffs<\/h2><p>Während Styke, Vesper und Valeria in Balentyne operieren, führt Tamsin die Abriegelung und den Schutz des Lord’s Dalliance. Nella, Kaitlyn und Mirelle sind im Haus; Hakon führt seine sechs Nordmänner. Diese Zuständigkeiten gelten für die laufende Lage und ersetzen keine dauerhafte Rangordnung außerhalb ihres Auftrags.<\/p>","sources":["live","chronicle","relations"],"status":"Am 9. Februar wirksam","tags":["Befehlskette","Valeria","Hakon","Tamsin"],"links":[],"text":"Spitze Styke und Vesper stehen gemeinsam und gle n Vertrag und wurde unter zwei persönlichen Bedingungen gebunden. Die Nacht endete mit Styke, Vesper und Valeria im selben Bett.","search":"kaitlyns entscheidung wassermuhle wahrheit uber aldencross offengelegte briefe und kaitlyns eintritt in den knoten 5 februar kaitlyn mott haus compact chronicle die wassermuhle styke fuhrte kaitlyn verkleidet aus aldencross an der stillgelegten wassermuhle sprachen sie uber branderscar vesper zack und ein leben nach dem fall der stadt das mott haus wahrenddessen legte vesper die echten zack briefe offen und inszenierte einen einbruch valeria hielt sich als ruckhalt bereit der compact kaitlyn kehrte mit styke ins dalliance zuruck las den vertrag und wurde unter zwei personlichen bedingungen gebunden die nacht endete mit styke vesper und valeria im selben bett","backlinks":[],"initial":"K"},{"aliases":[],"group":"chronicle","id":"zeit-0206","category":"chronik","title":"Mirelles Pakt und der letzte Plan","summary":"Kaitlyn geht heim, Vesper sieht Franz und Zack, Mirelle wird gebunden und die Führung für die Angriffsnacht steht.","body":"<h2>Morgen und Besorgungen<\/h2><p>Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus.<\/p><h2>Balentyne<\/h2><p>Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend.<\/p><h2>Mirelle<\/h2><p>Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal.<\/p><h2>Später Abend<\/h2><p>Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.<\/p>","sources":["chronicle","timeline","live","mirelle"],"status":"Bestätigt","tags":["6. Februar","Mirelle","Kaitlyn","Planung"],"links":[],"text":"Morgen und Besorgungen Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus. Balentyne Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend. Mirelle Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal. Später Abend Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.","search":"mirelles pakt und der letzte plan kaitlyn geht heim vesper sieht franz und zack mirelle wird gebunden und die fuhrung fur die angriffsnacht steht 6 februar mirelle kaitlyn planung chronicle morgen und besorgungen der knoten bestimmte kaitlyns mogliche soziale rolle styke kaufte bucher haarfarbe sowie silence und remove fear kaitlyn liess ihr haar rot und ging mit dem 8 februar als ruckkehrtermin zum mott haus balentyne vesper sah franz und zack bei einem angespannten gesprach horte jedoch nichts spater sah sie zack noch lebend mirelle nach ladenschluss wurden die massarbeiten weiter angepasst mirelle horte die wahrheit uber aldencross verhandelte ihre handwerksklausel unterschrieb den compact und schloss den carnal seal spater abend styke vesper und valeria legten hakons vorlauf tamsins mogliche schutzaufgabe bellams und alicias rettung die situative befehlskette und tacitus rekrutierungsablauf fest danach schliefen sie gemeinsam ein","backlinks":[],"initial":"M"},{"aliases":[],"tags":["7. Februar","Duell","Nella","Tamsin","Rotes Buch"],"sources":["chronicle","timeline","live","relations","redbook-current","mirelle"],"status":"Aktueller Rand","id":"zeit-0207","category":"chronik","group":"chronicle","title":"Duell, Rückkehr und das rote Buch","summary":"Zack fällt im Duell, Nella und Tamsin kehren zurück, Hakons Vorlauf beginnt und das rote Buch reagiert auf einen bewussten Test.","body":"<h2>Vor dem ersten Licht<\/h2><p>Vesper bemerkte im roten Buch die zweite beobachtete Veränderung und kopierte den neuen Absatz wortgetreu. Kurz darauf brachte Kaitlyn Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte vor dem unmittelbar bevorstehenden Duell.<\/p>\n<h2>Das Duell<\/h2><p>Styke erreichte das Feld rechtzeitig. Zack verwundete Franz leicht; Franz brachte ihn mit der Hellebarde zu Boden und tötete ihn mit einem Schlag in Hals und Schulter. Zack starb binnen Sekunden und sprach danach nicht mehr. Styke provozierte Franz mit seinem Wissen über die Briefe und zog ihn bis an Balentynes Tor. Dort entwaffnete Captain Barhold Franz und eröffnete eine Untersuchung.<\/p>\n<h2>Aldencross<\/h2><p>Die Tarnung als Söldner und Begleiter der Elfenbeinhändlerin Vesper hielt einer Nachfrage aus Balentyne stand. Styke erzählte Kaitlyn persönlich, was geschehen war. Sie kehrte in das Mott-Haus zurück, um für die offizielle Untersuchung auffindbar zu sein.<\/p>\n<h2>Rückkehr und Vorbereitung<\/h2><p>Nella und Tamsin kamen ohne Kampf oder Kontakt mit der Krone zurück. Der Familienauftrag war gelungen. Tamsin erhielt den Schutz- und Evakuierungsauftrag im Dalliance; Valeria übernahm die militärisch-logistische Führung dieses Bereichs. Valeria brachte Hakon die überarbeiteten Befehle. Sten und Ketil wurden als erstes eintreffendes Paar gesehen.<\/p>\n<h2>Abend<\/h2><p>Mirelle beendete Valerias Rüstungsunterkleidung und Stykes Kampfunterwäsche. Die Untersuchung des roten Buchs zeigte Divination, Illusion und eine tiefere unbestimmte Komponente. <em>Identify<\/em> lieferte keine Eigenschaften oder Befehlswörter. Nach einem absichtlichen Test erschien mindestens die vierte beobachtete Textänderung.<\/p>","text":"Vor dem ersten Licht Vesper bemerkte im roten Buch die zweite beobachtete Veränderung und kopierte den neuen Absatz wortgetreu. Kurz darauf brachte Kaitlyn Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte vor dem unmittelbar bevorstehenden Duell. Das Duell Styke erreichte das Feld rechtzeitig. Zack verwundete Franz leicht; Franz brachte ihn mit der Hellebarde zu Boden und tötete ihn mit einem Schlag in Hals und Schulter. Zack starb binnen Sekunden und sprach danach nicht mehr. Styke provozierte Franz mit seinem Wissen über die Briefe und zog ihn bis an Balentynes Tor. Dort entwaffnete Captain Barhold Franz und eröffnete eine Untersuchung. Aldencross Die Tarnung als Söldner und Begleiter der Elfenbeinhändlerin Vesper hielt einer Nachfrage aus Balentyne stand. Styke erzählte Kaitlyn persönlich, was geschehen war. Sie kehrte in das Mott-Haus zurück, um für die offizielle Untersuchung auffindbar zu sein. Rückkehr und Vorbereitung Nella und Tamsin kamen ohne Kampf oder Kontakt mit der Krone zurück. Der Familienauftrag war gelungen. Tamsin erhielt den Schutz- und Evakuierungsauftrag im Dalliance; Valeria übernahm die militärisch-logistische Führung dieses Bereichs. Valeria brachte Hakon die überarbeiteten Befehle. Sten und Ketil wurden als erstes eintreffendes Paar gesehen. Abend Mirelle beendete Valerias Rüstungsunterkleidung und Stykes Kampfunterwäsche. Die Untersuchung des roten Buchs zeigte Divination, Illusion und eine tiefere unbestimmte Komponente. Identify lieferte keine Eigenschaften oder Befehlswörter. Nach einem absichtlichen Test erschien mindestens die vierte beobachtete Textänderung.","links":[],"backlinks":[],"search":"duell ruckkehr und das rote buch zack fallt im duell nella und tamsin kehren zuruck hakons vorlauf beginnt und das rote buch reagiert auf einen bewussten test 7 februar duell nella tamsin rotes buch chronicle vor dem ersten licht vesper bemerkte im roten buch die zweite beobachtete veranderung und kopierte
