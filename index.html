s zu Donnagin ist dadurch nicht bewiesen.","links":[],"backlinks":[],"search":"sir justin name aus einer erfolglos verfolgten skandalspur justin unbestatigt town vorhandener hinweis ein gerucht um einen gefallenen bischof und sir justin wurde in verbindung mit der suche nach einem hebel gegen donnagin verfolgt ergebnis vespers nachforschungen brachten keine brauchbare erpressungsgrundlage eine tatsachliche schuld konkrete rolle oder beziehung justins zu donnagin ist dadurch nicht bewiesen"},{"id":"zarik","category":"personen","title":"Zarik aus Daveryn","summary":"Von Styke als früherer Schmiedelehrmeister genannt.","body":"<h2>Aussage im Spiel</h2>\n<p>Beim Gespräch über sein Großschwert sagte <a href=\"#/artikel/styke\">Styke</a> <a href=\"#/artikel/barnabus\">Barnabus Eisenbauch</a>, Zarik aus Daveryn habe ihn zwei Winter lang unterrichtet.</p>\n<h2>Belegart</h2>\n<p>Gesichert ist diese Aussage und der daraus entstandene berufliche Gesprächsansatz. Ein persönlicher Auftritt, aktuelle Lebensumstände oder eine unabhängig rekonstruierte Lebensgeschichte Zariks sind nicht vorhanden.</p>\n","sources":["core","chronicle"],"status":"Stykes Aussage","tags":["Handwerk","Erwähnt"],"aliases":[],"group":"history","text":"Aussage im Spiel Beim Gespräch über sein Großschwert sagte Styke Barnabus Eisenbauch , Zarik aus Daveryn habe ihn zwei Winter lang unterrichtet. Belegart Gesichert ist diese Aussage und der daraus entstandene berufliche Gesprächsansatz. Ein persönlicher Auftritt, aktuelle Lebensumstände oder eine unabhängig rekonstruierte Lebensgeschichte Zariks sind nicht vorhanden.","links":["styke","barnabus"],"backlinks":[],"search":"zarik aus daveryn von styke als fruherer schmiedelehrmeister genannt handwerk erwahnt history aussage im spiel beim gesprach uber sein grossschwert sagte styke barnabus eisenbauch zarik aus daveryn habe ihn zwei winter lang unterrichtet belegart gesichert ist diese aussage und der daraus entstandene berufliche gesprachsansatz ein personlicher auftritt aktuelle lebensumstande oder eine unabhangig rekonstruierte lebensgeschichte zariks sind nicht vorhanden"},{"id":"arienne","category":"personen","title":"Lady Arienne Valewood","summary":"Name auf Kaitlyns wiederholt gelesenem Buch Briefe aus der Ferne.","body":"<h2>Bekannt durch einen Gegenstand</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> erfuhr am 28. Januar, dass Kaitlyn wiederholt <em>Briefe aus der Ferne - Lady Arienne Valewood</em> liest.</p>\n<h2>Nicht weiter geklärt</h2>\n<p>Der Name ist als Buchbezug bekannt. Eine persönliche Begegnung, eine ausgearbeitete Biographie der Autorin oder eine Verbindung zur laufenden Intrige sind nicht etabliert.</p>\n","sources":["chronicle"],"status":"Erwähnt","tags":["Buch","Kaitlyn"],"aliases":[],"group":"history","text":"Bekannt durch einen Gegenstand Styke erfuhr am 28. Januar, dass Kaitlyn wiederholt Briefe aus der Ferne - Lady Arienne Valewood liest. Nicht weiter geklärt Der Name ist als Buchbezug bekannt. Eine persönliche Begegnung, eine ausgearbeitete Biographie der Autorin oder eine Verbindung zur laufenden Intrige sind nicht etabliert.","links":["styke"],"backlinks":[],"search":"lady arienne valewood name auf kaitlyns wiederholt gelesenem buch briefe aus der ferne buch kaitlyn history bekannt durch einen gegenstand styke erfuhr am 28 januar dass kaitlyn wiederholt briefe aus der ferne lady arienne valewood liest nicht weiter geklart der name ist als buchbezug bekannt eine personliche begegnung eine ausgearbeitete biographie der autorin oder eine verbindung zur laufenden intrige sind nicht etabliert"},{"id":"aldencross","category":"orte","title":"Aldencross","summary":"Offener Marktort unterhalb Balentynes. Hier lebt die Gruppe seit dem 23. Januar unter Tarnung.","body":"<h2>Gestalt und Lage</h2>\n<p>Aldencross ist eine offene Marktstadt nahe der Watch Wall, <strong>keine ummauerte Stadt mit Südtor</strong>. Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne.</p>\n<h2>Wirtschaft und Gesellschaft</h2>\n<p>Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern.</p>\n<h2>Die Gruppe im Ort</h2>\n<p>Seit 23. Januar dient das <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> als Unterkunft. Der <a href=\"#/artikel/scroll\">Illuminated Scroll</a>, das <a href=\"#/artikel/mott-haus\">Mott-Haus</a>, das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte.</p>\n<h2>Aktueller Druck</h2>\n<p>Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.</p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":[],"parent":"talingarde","text":"Gestalt und Lage Aldencross ist eine offene Marktstadt nahe der Watch Wall, keine ummauerte Stadt mit Südtor . Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne. Wirtschaft und Gesellschaft Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern. Die Gruppe im Ort Seit 23. Januar dient das Lord's Dalliance als Unterkunft. Der Illuminated Scroll , das Mott-Haus , das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte. Aktueller Druck Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.","links":["dalliance","scroll","mott-haus"],"backlinks":["havelyn","story-so-far"],"search":"aldencross offener marktort unterhalb balentynes hier lebt die gruppe seit dem 23 januar unter tarnung aldencross gestalt und lage aldencross ist eine offene marktstadt nahe der watch wall keine ummauerte stadt mit sudtor das ortsdossier nennt etwa 1 800 einwohner und eine enge verbindung zur ungefahr eine meile entfernt auf hoherem grund liegenden festung balentyne wirtschaft und gesellschaft soldaten reisende konigliche arbeiten und nordhandel machen den ort vergleichsweise geordnet und wohlhabend nahrung brennstoff hufeisen reparaturen wasche pferde und tagelohnarbeit verbinden fast jede familie mit der festung fremde handler sind plausibel behauptete ortsansassigkeit kann an gegenseitigem erkennen scheitern die gruppe im ort seit 23 januar dient das lord s dalliance als unterkunft der illuminated scroll das mott haus das zivile arbeitsnetz um mara und ellyn und barnabus mannschaft sind wichtige kontakte aktueller druck varnings tod ist seit dem 31 januar in balentyne bekannt der zivile zugang wurde enger kontrolliert die stadt bleibt bewohnt und geschaftig sie ist keine leere missionskulisse"},{"id":"dalliance","category":"orte","title":"Lord's Dalliance","summary":"Aldencrosser Gasthaus, Unterkunft des Knotens, Ort der neuen Wetttafel und Ausgang des präparierten Geheimgangs.","body":"<h2>Haus und Zimmer</h2><p>Bellam und Alicia Barhold betreiben Aldencross’ wichtigste Herberge. Styke, Vesper und Valeria halten weiterhin das große rückwärtige Zimmer im Obergeschoss. Vier Päckchen <a href=\"#/artikel/rattenpoison\">Rattengift</a> sind dort versteckt.</p>\n<h2>Wetttafel im Schankraum</h2><p>Am 3. Februar entstand aus dem Gerücht über eine rothaarige verheiratete Frau eine offene Wette. Styke schrieb Zacharias „Zack“ Eddarlys Namen an die Tafel, obwohl Bellam keinen Beleg für ihn hatte. Daneben steht ein nicht näher benannter Priester, markiert mit einer Mitra-Sonne. Bellam schuldet Styke für jedes volle Goldstück, das während seiner Mithilfe in den Topf kommt, einen Whisky. Die genaue Höhe des Topfes ist nicht festgehalten.</p>\n<h2>Keller und Tunnel</h2><p>Hinter den Vorräten liegt die verdeckte Zwergentür zum <a href=\"#/artikel/tunnel\">Geheimgang nach Balentyne</a>. Zwei schwere Wandketten sind mehrere Biegungen tief im Gang verankert. Sie halten einen gewöhnlichen Menschen, blockieren jedoch weder Sprache noch Zauberei.</p>\n<h2>Nacht zum 4. Februar</h2><p>Styke, Vesper, Valeria und <a href=\"#/artikel/mirelle\">Mirelle</a> schlafen im rückwärtigen Zimmer. Mirelle brachte am Abend ihre Arbeitstasche für Anproben und Maßnehmen mit.</p>","sources":["dalliance","live","chronicle","mirelle"],"status":"Basis gehalten / aktueller Ort","tags":["Aldencross","Tunnel","Basis","Wetttafel"],"aliases":["Lords Dalliance","Dalliance","The Lord's Dalliance"],"parent":"aldencross","text":"Haus und Zimmer Bellam und Alicia Barhold betreiben Aldencross’ wichtigste Herberge. Styke, Vesper und Valeria halten weiterhin das große rückwärtige Zimmer im Obergeschoss. Vier Päckchen Rattengift sind dort versteckt. Wetttafel im Schankraum Am 3. Februar entstand aus dem Gerücht über eine rothaarige verheiratete Frau eine offene Wette. Styke schrieb Zacharias „Zack“ Eddarlys Namen an die Tafel, obwohl Bellam keinen Beleg für ihn hatte. Daneben steht ein nicht näher benannter Priester, markiert mit einer Mitra-Sonne. Bellam schuldet Styke für jedes volle Goldstück, das während seiner Mithilfe in den Topf kommt, einen Whisky. Die genaue Höhe des Topfes ist nicht festgehalten. Keller und Tunnel Hinter den Vorräten liegt die verdeckte Zwergentür zum Geheimgang nach Balentyne . Zwei schwere Wandketten sind mehrere Biegungen tief im Gang verankert. Sie halten einen gewöhnlichen Menschen, blockieren jedoch weder Sprache noch Zauberei. Nacht zum 4. Februar Styke, Vesper, Valeria und Mirelle schlafen im rückwärtigen Zimmer. Mirelle brachte am Abend ihre Arbeitstasche für Anproben und Maßnehmen mit.","search":"lord s dalliance aldencrosser gasthaus unterkunft des knotens ort der neuen wetttafel und ausgang des praparierten geheimgangs lords dalliance dalliance the lord s dalliance aldencross tunnel basis wetttafel haus und zimmer bellam und alicia barhold betreiben aldencross wichtigste herberge styke vesper und valeria halten weiterhin das grosse ruckwartige zimmer im obergeschoss vier packchen rattengift sind dort versteckt wetttafel im schankraum am 3 februar entstand aus dem gerucht uber eine rothaarige verheiratete frau eine offene wette styke schrieb zacharias zack eddarlys namen an die tafel obwohl bellam keinen beleg fur ihn hatte daneben steht ein nicht naher benannter priester markiert mit einer mitra sonne bellam schuldet styke fur jedes volle goldstuck das wahrend seiner mithilfe in den topf kommt einen whisky die genaue hohe des topfes ist nicht festgehalten keller und tunnel hinter den vorraten liegt die verdeckte zwergentur zum geheimgang nach balentyne zwei schwere wandketten sind mehrere biegungen tief im gang verankert sie halten einen gewohnlichen menschen blockieren jedoch weder sprache noch zauberei nacht zum 4 februar styke vesper valeria und mirelle schlafen im ruckwartigen zimmer mirelle brachte am abend ihre arbeitstasche fur anproben und massnehmen mit","links":["rattenpoison","tunnel","mirelle"],"backlinks":["bellam","alicia","aldencross","zimmer","spielstand","story-so-far","zeit-0123","zeit-0201"]},{"id":"zimmer","category":"orte","title":"Das rückwärtige Zimmer","summary":"Privater Stützpunkt des Trios im Obergeschoss des Dalliance; in der Nacht zum 4. Februar schläft Mirelle dort mit ihnen.","body":"<h2>Gemeinsamer Rückzugsort</h2><p>Das große rückwärtige Mietzimmer im <a href=\"#/artikel/dalliance\">Lord’s Dalliance</a> dient Styke, Vesper und Valeria als Unterkunft und privater Besprechungsraum. Bett, Alltagsgegenstände und ein Teil ihrer Ausrüstung werden dort gemeinsam verwahrt.</p>\n<h2>Stand in der Nacht zum 4. Februar</h2><p>Styke, Vesper, Valeria und <a href=\"#/artikel/mirelle\">Mirelle</a> liegen nach Abendessen, Anproben und einer langen gemeinsamen Nacht im Zimmer. Die zwei Tunnelketten sind montiert; vier Packungen Rattengift liegen verborgen. Die beiden Aldencrosser Mietpferde müssen ungefähr am 5. Februar zurückgegeben oder verlängert werden.</p>","sources":["live","dalliance","mirelle","clocks-current"],"status":"Aktueller Ort","tags":["Aldencross","Mirelle"],"aliases":[],"parent":"dalliance","text":"Gemeinsamer Rückzugsort Das große rückwärtige Mietzimmer im Lord’s Dalliance dient Styke, Vesper und Valeria als Unterkunft und privater Besprechungsraum. Bett, Alltagsgegenstände und ein Teil ihrer Ausrüstung werden dort gemeinsam verwahrt. Stand in der Nacht zum 4. Februar Styke, Vesper, Valeria und Mirelle liegen nach Abendessen, Anproben und einer langen gemeinsamen Nacht im Zimmer. Die zwei Tunnelketten sind montiert; vier Packungen Rattengift liegen verborgen. Die beiden Aldencrosser Mietpferde müssen ungefähr am 5. Februar zurückgegeben oder verlängert werden.","links":["styke","valeria","vesper","verse","dalliance","mirelle"],"backlinks":[],"search":"das ruckwartige zimmer privater stutzpunkt des trios im obergeschoss des dalliance in der nacht zum 4 februar schlaft mirelle dort mit ihnen aldencross mirelle gemeinsamer ruckzugsort das grosse ruckwartige mietzimmer im lord s dalliance dient styke vesper und valeria als unterkunft und privater besprechungsraum bett alltagsgegenstande und ein teil ihrer ausrustung werden dort gemeinsam verwahrt stand in der nacht zum 4 februar styke vesper valeria und mirelle liegen nach abendessen anproben und einer langen gemeinsamen nacht im zimmer die zwei tunnelketten sind montiert vier packungen rattengift liegen verborgen die beiden aldencrosser mietpferde mussen ungefahr am 5 februar zuruckgegeben oder verlangert werden"},{"id":"tunnel","category":"orte","title":"Der Geheimgang","summary":"Entdeckter alter Zwergengang zwischen Dalliance-Keller und einem Vorratsraum Balentynes.","body":"<h2>Entdeckung in der Nacht 27./28. Januar</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> führte die Suche, <a href=\"#/artikel/styke\">Styke</a> half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an.</p>\n<h2>Tatsächlich gesehene Gegenseite</h2>\n<p>Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her.</p>\n<h2>Was weiterhin fehlt</h2>\n<p>Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route.</p>\n<h2>Gegenwärtige Nutzungsidee</h2>\n<p>Der Gang könnte später als Zugang und womöglich Verwahrort dienen. Der Kauf von Ketten hat ihn noch nicht in ein fertiges Verlies verwandelt.</p>\n","sources":["dalliance","balentyne","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Geheimtunnel","Zwergentunnel","Kellertunnel"],"parent":"dalliance","text":"Entdeckung in der Nacht 27./28. Januar Vesper führte die Suche, Styke half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an. Tatsächlich gesehene Gegenseite Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her. Was weiterhin fehlt Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route. Gegenwärtige Nutzungsidee Der Gang könnte später als Zugang und womöglich Verwahrort dienen. Der Kauf von Ketten hat ihn noch nicht in ein fertiges Verlies verwandelt.","links":["vesper","styke"],"backlinks":["dalliance","story-so-far","zeit-tunnel"],"search":"der geheimgang entdeckter alter zwergengang zwischen dalliance keller und einem vorratsraum balentynes geheimtunnel zwergentunnel kellertunnel aldencross entdeckung in der nacht 27 28 januar vesper fuhrte die suche styke half sie offneten die verborgene tur hinter den kellervorraten mit einem verdeckten stein der enge gewundene gang steigt uber annahernd eine meile zur festung an tatsachlich gesehene gegenseite die ferne zwergentur liess sich vom gang aus einen spalt offnen dahinter lag ein stiller vorratsraum mit haltbaren rationen und wasserfassern styke und vesper gingen nicht vollstandig hinein sie kehrten ohne beobachteten alarm zuruck schlossen beide turen und stellten die tarnung im keller wieder her was weiterhin fehlt verkehr im raum nutzer wachrhythmus und bedienung von der raumseite sind nicht sicher bekannt aus einem ruhigen beobachtungsmoment folgt keine dauerhaft unbewachte route gegenwartige nutzungsidee der gang konnte spater als zugang und womoglich verwahrort dienen der kauf von ketten hat ihn noch nicht in ein fertiges verlies verwandelt"},{"id":"balentyne","category":"orte","title":"Balentyne","summary":"Winterliche Grenzfestung unter verschärfter Wachsamkeit; der Angriff ist für die Nacht 8./9. Februar vorgesehen.","body":"<h2>Bekannte Festung</h2><p>Balentyne liegt rund eine Meile oberhalb Aldencross an der Watch Wall. Lord Thomas Havelyn kommandiert etwa hundert Wachen samt Offizieren, Priestern, Magierin, Spezialisten und zivilen Arbeitskräften.</p>\n<h2>Varnings Tod</h2><p>Captain Ryan Varning und sechs Reiter starben am 26. Januar am Freeman's Rock. Seit der öffentlichen Bestätigung am 31. Januar wurden Zivilisten strenger gezählt und begleitet, Heimwege gekürzt und Straßen kontrolliert. Die Verantwortlichen sind bislang nicht identifiziert.</p>\n<h2>Ziviler Zugang</h2><p>Vesper arbeitete am 29., 30. Januar und 1. Februar innerhalb der Festung. Am 1. Februar hielt ihre Deckung trotz verschärfter Kontrolle. Sie half beim gewöhnlichen Eintopf und sah keine besondere Prüfung des Gemeinschaftskessels. Einen sicheren Blick auf Zack oder Donnagin erhielt sie nicht.</p>\n<h2>Tunnel und Torhaus</h2><p>Der Geheimgang vom Dalliance endet in einem Vorratsraum mit haltbaren Lebensmitteln und Wasserfässern. Die Gruppe kennt außerdem Barnabus' Torhausangaben: getrennte Winden für Zugbrücke und Fallgatter, vier ständige Wachen, vier Zwergeningenieure tagsüber und Heißsandvorrichtungen.</p>\n<h2>Nächste Frist</h2><p>Der derzeitige Plan setzt den großen Eintopf am 8. Februar und den Angriff in der Nacht zum 9. Februar zusammen. Nella und Tamsin brachen am 3. Februar mit dem neuen Auftrag zur Feldgruppe auf; eine Rückmeldung ist noch nicht eingetroffen.</p>","sources":["balentyne","live","chronicle","timeline"],"status":"Ziel / erhöhte Sicherheit","tags":["Festung","Watch Wall","8./9. Februar"],"aliases":["Watchtower Balentyne","Festung"],"parent":"watch-wall","text":"Bekannte Festung Balentyne liegt rund eine Meile oberhalb Aldencross an der Watch Wall. Lord Thomas Havelyn kommandiert etwa hundert Wachen samt Offizieren, Priestern, Magierin, Spezialisten und zivilen Arbeitskräften. Varnings Tod Captain Ryan Varning und sechs Reiter starben am 26. Januar am Freeman's Rock. Seit der öffentlichen Bestätigung am 31. Januar wurden Zivilisten strenger gezählt und begleitet, Heimwege gekürzt und Straßen kontrolliert. Die Verantwortlichen sind bislang nicht identifiziert. Ziviler Zugang Vesper arbeitete am 29., 30. Januar und 1. Februar innerhalb der Festung. Am 1. Februar hielt ihre Deckung trotz verschärfter Kontrolle. Sie half beim gewöhnlichen Eintopf und sah keine besondere Prüfung des Gemeinschaftskessels. Einen sicheren Blick auf Zack oder Donnagin erhielt sie nicht. Tunnel und Torhaus Der Geheimgang vom Dalliance endet in einem Vorratsraum mit haltbaren Lebensmitteln und Wasserfässern. Die Gruppe kennt außerdem Barnabus' Torhausangaben: getrennte Winden für Zugbrücke und Fallgatter, vier ständige Wachen, vier Zwergeningenieure tagsüber und Heißsandvorrichtungen. Nächste Frist Der derzeitige Plan setzt den großen Eintopf am 8. Februar und den Angriff in der Nacht zum 9. Februar zusammen. Nella und Tamsin brachen am 3. Februar mit dem neuen Auftrag zur Feldgruppe auf; eine Rückmeldung ist noch nicht eingetroffen.","links":[],"backlinks":["franz","havelyn","zeit-0114"],"search":"balentyne winterliche grenzfestung unter verscharfter wachsamkeit der angriff ist fur die nacht 8 9 februar vorgesehen watchtower balentyne festung festung watch wall 8 9 februar bekannte festung balentyne liegt rund eine meile oberhalb aldencross an der watch wall lord thomas havelyn kommandiert etwa hundert wachen samt offizieren priestern magierin spezialisten und zivilen arbeitskraften varnings tod captain ryan varning und sechs reiter starben am 26 januar am freeman s rock seit der offentlichen bestatigung am 31 januar wurden zivilisten strenger gezahlt und begleitet heimwege gekurzt und strassen kontrolliert die verantwortlichen sind bislang nicht identifiziert ziviler zugang vesper arbeitete am 29 30 januar und 1 februar innerhalb der festung am 1 februar hielt ihre deckung trotz verscharfter kontrolle sie half beim gewohnlichen eintopf und sah keine besondere prufung des gemeinschaftskessels einen sicheren blick auf zack oder donnagin erhielt sie nicht tunnel und torhaus der geheimgang vom dalliance endet in einem vorratsraum mit haltbaren lebensmitteln und wasserfassern die gruppe kennt ausserdem barnabus torhausangaben getrennte winden fur zugbrucke und fallgatter vier standige wachen vier zwergeningenieure tagsuber und heisssandvorrichtungen nachste frist der derzeitige plan setzt den grossen eintopf am 8 februar und den angriff in der nacht zum 9 februar zusammen nella und tamsin brachen am 3 februar mit dem neuen auftrag zur feldgruppe auf eine ruckmeldung ist noch nicht eingetroffen"},{"id":"torhaus","category":"orte","title":"Balentynes Torhaus","summary":"Mechanismen, Wachen und Ingenieure nach Valerias weitergegebenem Bericht.","body":"<h2>Informationsweg</h2>\n<p>Barnabus erzählte <a href=\"#/artikel/valeria\">Valeria</a> beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios.</p>\n<h2>Bekannte Einzelheiten</h2>\n<p>Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten.</p>\n<h2>Offene Grenzen</h2>\n<p>Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.</p>\n","sources":["live","core","chronicle"],"status":"Berichtet","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Informationsweg Barnabus erzählte Valeria beim Trinken am 30. Januar Einzelheiten. Sie gab diese spät am 31. Januar an Styke und Vesper weiter. Es handelt sich um einen gehörten, inzwischen geteilten Bericht, nicht um eine vollständige eigene Besichtigung des Trios. Bekannte Einzelheiten Das zweite Geschoss ist die Mechanismenebene. Getrennte Winden bedienen Fallgatter und Zugbrücke. Vier Wachen sind dort durchgehend eingesetzt; vier Zwergeningenieure arbeiten tagsüber dort. Heißsandabwehr wird auf dieser Ebene unterhalten. Offene Grenzen Kein akuter Konstruktionsfehler wurde bekannt. Genaue Alarm-, Ablöse-, Schlaf- und Meldeabläufe bleiben Untersuchungsziele. Eine separate kleinere Zisterne gehört zum bekannten Wassersystem des Torhauses.","links":["valeria","styke","vesper"],"backlinks":["zeit-valeria-rueckkehr"],"search":"balentynes torhaus mechanismen wachen und ingenieure nach valerias weitergegebenem bericht balentyne informationsweg barnabus erzahlte valeria beim trinken am 30 januar einzelheiten sie gab diese spat am 31 januar an styke und vesper weiter es handelt sich um einen gehorten inzwischen geteilten bericht nicht um eine vollstandige eigene besichtigung des trios bekannte einzelheiten das zweite geschoss ist die mechanismenebene getrennte winden bedienen fallgatter und zugbrucke vier wachen sind dort durchgehend eingesetzt vier zwergeningenieure arbeiten tagsuber dort heisssandabwehr wird auf dieser ebene unterhalten offene grenzen kein akuter konstruktionsfehler wurde bekannt genaue alarm ablose schlaf und meldeablaufe bleiben untersuchungsziele eine separate kleinere zisterne gehort zum bekannten wassersystem des torhauses"},{"id":"kueche","category":"orte","title":"Küche und Versorgung Balentynes","summary":"Vespers zivile Arbeitstage lieferten reales, aber begrenztes Versorgungswissen.","body":"<h2>Beobachtete Abläufe</h2>\n<p>Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. <a href=\"#/artikel/vesper\">Vesper</a> sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert.</p>\n<h2>Wasser</h2>\n<p>Gewöhnliches Wasser kommt aus dem <a href=\"#/artikel/tyburn\">Tyburn</a>. Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen.</p>\n<h2>Mama Giuseppes Eintopf</h2>\n<p>Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen.</p>\n<h2>Krankheit</h2>\n<p>Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.</p>\n","sources":["chronicle","live","core"],"status":"Bekannt","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Beobachtete Abläufe Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. Vesper sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert. Wasser Gewöhnliches Wasser kommt aus dem Tyburn . Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen. Mama Giuseppes Eintopf Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen. Krankheit Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.","links":["vesper","tyburn"],"backlinks":["giuseppe"],"search":"kuche und versorgung balentynes vespers zivile arbeitstage lieferten reales aber begrenztes versorgungswissen balentyne beobachtete ablaufe die kuche ist fast standig in betrieb die vorratskammer w ,"aliases":["The Illuminated Scroll","Buchladen","Scaramores Laden"],"parent":"aldencross","text":"Funktion in der Kampagne Hier arbeitet Jacobian Scaramore mit Schriftstücken, Büchern, Konten und magischen Fragen. Styke suchte am 28. Januar einen Sachkundigen für Vespers erwachtes Reliquiar und kaufte einen gebrauchten Exorzisten-Reisebericht. Die Briefkette Jacobian schrieb Tacitus einen versiegelten persönlichen Brief. Ihre Antwort führte zum Treffen am 31. Januar um 20 Uhr , nach Ladenschluss und mit Jacobian als anwesendem Gastgeber. Letztes Ereignis Das Gespräch über Verse endete wegen Tacitus' Beschwerden früh. Der benutzte Abort und Jacobians Sorge um die Weinflasche sind Bestandteil dieser Begegnung. Ein zweiter Termin ist noch nicht vereinbart.","links":["jacobian","styke","verse"],"backlinks":["jacobian","aldencross"],"search":"illuminated scroll jacobian scaramores arbeits und schriftladen ort des tacitus gesprachs the illuminated scroll buchladen scaramores laden aldencross funktion in der kampagne hier arbeitet jacobian scaramore mit schriftstucken buchern konten und magischen fragen styke suchte am 28 januar einen sachkundigen fur vespers erwachtes reliquiar und kaufte einen gebrauchten exorzisten reisebericht die briefkette jacobian schrieb tacitus einen versiegelten personlichen brief ihre antwort fuhrte zum treffen am 31 januar um 20 uhr nach ladenschluss und mit jacobian als anwesendem gastgeber letztes ereignis das gesprach uber verse endete wegen tacitus beschwerden fruh der benutzte abort und jacobians sorge um die weinflasche sind bestandteil dieser begegnung ein zweiter termin ist noch nicht vereinbart"},{"id":"mott-haus","category":"orte","title":"Das Haus der Motts","summary":"Wohlhabender zweigeschossiger Offiziershaushalt hinter St. Alden.","body":"<h2>Beobachteter Aufbau</h2>\n<p>Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden.</p>\n<h2>Schlafzimmer und Truhe</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band.</p>\n<h2>Zugang ist situationsgebunden</h2>\n<p>Kaitlyn ließ Styke am 28. Januar unter der Buch-Deckgeschichte herein und deutete für den 29. Januar eine öffene Hintertür an. Das ist kein dauerhaft offenes Haus. Dass während des ersten langen Besuchs keine weitere Haushaltsperson wahrgenommen wurde, beweist nicht, dass es niemals Personal gibt.</p>\n<h2>Offener Gegenstandsverbleib</h2>\n<p>Der Exorzisten-Reisebericht wurde am 28. Januar auf dem vorderen Tisch abgelegt. Eine spätere Mitnahme ist nicht belegt.</p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Mott house","Küchengarten"],"parent":"aldencross","text":"Beobachteter Aufbau Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden. Schlafzimmer und Truhe Styke sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band. Zugang ist situationsgebunden Kaitlyn ließ Styke am 28. Januar unter der Buch-Deckgeschichte herein und deutete für den 29. Januar eine öffene Hintertür an. Das ist kein dauerhaft offenes Haus. Dass während des ersten langen Besuchs keine weitere Haushaltsperson wahrgenommen wurde, beweist nicht, dass es niemals Personal gibt. Offener Gegenstandsverbleib Der Exorzisten-Reisebericht wurde am 28. Januar auf dem vorderen Tisch abgelegt. Eine spätere Mitnahme ist nicht belegt.","links":["styke"],"backlinks":["franz","aldencross"],"search":"das haus der motts wohlhabender zweigeschossiger offiziershaushalt hinter st alden mott house kuchengarten aldencross beobachteter aufbau verglaste fenster ein vorderer eingang das eheliche schlafzimmer im obergeschoss und ein kleiner kuchengarten mit hinterer tur sind bekannt der ruckwartige ausgang fuhrt in eine schmale gasse richtung st alden schlafzimmer und truhe styke sah ein breites bett zwei truhen stuhle ablagen und zeichen der nutzung durch beide eheleute kaitlyns eigene truhe wird mit einem kleinen messingschlussel geoffnet den sie an einer kette tragt darin lagen unter anderem gute kleider tanzschuhe duftstoff und die briefe mit grauem band zugang ist situationsgebunden kaitlyn liess styke am 28 januar unter der buch deckgeschichte herein und deutete fur den 29 januar eine offene hintertur an das ist kein dauerhaft offenes haus dass wahrend des ersten langen besuchs keine weitere haushaltsperson wahrgenommen wurde beweist nicht dass es niemals personal gibt offener gegenstandsverbleib der exorzisten reisebericht wurde am 28 januar auf dem vorderen tisch abgelegt eine spatere mitnahme ist nicht belegt"},{"id":"st-alden","category":"orte","title":"St. Alden","summary":"Bekannter Orientierungspunkt für die Lage des Mott-Hauses.","body":"<h2>Gesicherter Ortsbezug</h2>\n<p>Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung.</p>\n<h2>Keine erfundene Besichtigung</h2>\n<p>Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.</p>\n","sources":["aldencross","chronicle"],"status":"Ortsbezug","tags":["Aldencross"],"aliases":[],"parent":"aldencross","text":"Gesicherter Ortsbezug Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung. Keine erfundene Besichtigung Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.","links":[],"backlinks":[],"search":"st alden bekannter orientierungspunkt fur die lage des mott hauses aldencross gesicherter ortsbezug das mott haus liegt hinter st alden die schmale gasse am kuchengarten fuhrt in diese richtung keine erfundene besichtigung im hier ausgewerteten kampagnenstand ist kein vollstandiger innenraum personalplan oder gesonderter besuch ausgearbeitet der eintrag halt den tatsachlich bekannten ortsbezug fest"},{"id":"wash-shed","category":"orte","title":"Der Waschschuppen","summary":"Ort der privaten Begegnung mit Mara und Ellyn am 23. Januar.","body":"<h2>Der 23. Januar</h2>\n<p>Nach dem Kennenlernen bei den Wagenhöfen gingen <a href=\"#/artikel/styke\">Styke</a>, <a href=\"#/artikel/mara\">Mara</a> und <a href=\"#/artikel/ellyn\">Ellyn</a> für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver.</p>\n<h2>Der Ort danach</h2>\n<p>Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.</p>","sources":["chronicle","relations"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Waschhütte"],"parent":"aldencross","text":"Der 23. Januar Nach dem Kennenlernen bei den Wagenhöfen gingen Styke , Mara und Ellyn für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver. Der Ort danach Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.","links":["styke","mara","ellyn"],"backlinks":["mara","ellyn"],"search":"der waschschuppen ort der privaten begegnung mit mara und ellyn am 23 januar waschhutte aldencross der 23 januar nach dem kennenlernen bei den wagenhofen gingen styke mara und ellyn fur einige private stunden in den waschschuppen mara gab anfangs das tempo vor ellyn wurde im verlauf aktiver der ort danach der waschschuppen blieb ein gewohnlicher arbeitsraum dort lagert keine ausrustung des knotens und fur spatere treffen wurde nichts vorbereitet"},{"id":"freemans-rock","category":"orte","title":"Freeman's Rock","summary":"Erkundeter Lagerplatz und Schauplatz des Hinterhalts auf Varnings Patrouille.","body":"<h2>Die Vorbereitung</h2>\n<p>Vom 24. bis 26. Januar kundschafteten <a href=\"#/artikel/styke\">Styke</a>, <a href=\"#/artikel/vesper\">Vesper</a>, <a href=\"#/artikel/valeria\">Valeria</a> und <a href=\"#/artikel/hakon\">Hakon</a> das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung.</p>\n<h2>Die Nacht des 26. Januar</h2>\n<p>Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt.</p>\n<h2>Spuren und Folgen</h2>\n<p>Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.</p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":["Freemans Rock"],"parent":"borderlands","text":"Die Vorbereitung Vom 24. bis 26. Januar kundschafteten Styke , Vesper , Valeria und Hakon das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung. Die Nacht des 26. Januar Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt. Spuren und Folgen Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.","links":["styke","vesper","valeria","hakon"],"backlinks":["grumblejack","sten","ketil","eirik","arved","torvald","story-so-far","zeit-0124"],"search":"freeman s rock erkundeter lagerplatz und schauplatz des hinterhalts auf varnings patrouille freemans rock grenzland die vorbereitung vom 24 bis 26 januar kundschafteten styke vesper valeria und hakon das gebiet aus der rest der feldgruppe blieb ungefahr einen halben kilometer entfernt wald und fluchtwege waren teil der vorbereitung die nacht des 26 januar vesper formte das kampfgebiet mit nebel dunkelheit und unterstutzender sichtmagie styke griff von der landeinwartigen fluchtseite an alle sieben patrouillenmitglieder starben keine verbundeten verluste sind festgestellt spuren und folgen leichen wurden begraben der ort bereinigt und die spur der erbeuteten pferde zu verschleiern versucht diese massnahmen garantierten nicht dass die tat unentdeckt blieb seit 31 januar kennt balentyne den tod der patrouille welche einzelspuren gefunden wurden weiss styke nicht vollstandig"},{"id":"tyburn","category":"orte","title":"Tyburn","summary":"Bekannter Wasserweg im Umfeld von Balentyne.","body":"<h2>Bedeutung für den Spielstand</h2>\n<p>Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne.</p>\n<h2>Begrenzter Karteneintrag</h2>\n<p>Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.</p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":[],"parent":"borderlands","text":"Bedeutung für den Spielstand Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne. Begrenzter Karteneintrag Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.","links":[],"backlinks":["kueche"],"search":"tyburn bekannter wasserweg im umfeld von balentyne grenzland bedeutung fur den spielstand vespers erkundung bestatigte dass gewohnliches wasser fur die festung aus dem tyburn geholt wird das torhaus nutzt daneben eine separate kleinere zisterne begrenzter karteneintrag es werden keine unbeobachteten uferwege bewachungsplane oder genauen entfernungen erganzt die versorgungsfunktion ist bekannt eine vollstandige wasserkarte liegt damit nicht vor"},{"id":"timeon-hof","category":"orte","title":"Timeons sicherer Aufenthaltsort","summary":"Vorgesehenes Familienanwesen, am 31. Januar von Valeria persönlich überprüft.","body":"<h2>Gesicherter Stand</h2>\n<p>Tamsin lieferte <a href=\"#/artikel/timeon\">Timeon</a> an diesem geeigneten Familienanwesen ab. <a href=\"#/artikel/valeria\">Valeria</a> bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin.</p>\n<h2>Nicht ausgearbeitet</h2>\n<p>Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.</p>\n","sources":["live","core","relations"],"status":"Bekannt","tags":["Umland"],"aliases":[],"parent":"borderlands","text":"Gesicherter Stand Tamsin lieferte Timeon an diesem geeigneten Familienanwesen ab. Valeria bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin. Nicht ausgearbeitet Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.","links":["timeon","valeria"],"backlinks":["timeon","story-so-far"],"search":"timeons sicherer aufenthaltsort vorgesehenes familienanwesen am 31 januar von valeria personlich uberpruft umland gesicherter stand tamsin lieferte timeon an diesem geeigneten familienanwesen ab valeria bestatigte seine sicherheit am 31 januar sie fand danach keine belastbare spur zu tamsin nicht ausgearbeitet ein neuer hofname exakte adresse plan oder verlasslich vermessene route werden hier nicht erfunden valeria hatte timeon zugesagt wiederzukommen akzeptierte anschliessend aber stykes ruckkehrverbot"},{"id":"branderscar","category":"orte","title":"Branderscar","summary":"Gefängnis und Ausgangspunkt der gemeinsamen Flucht.","body":"<h2>Angenommene Geschichte</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> entkamen gemeinsam, bargen <a href=\"#/artikel/verse\">Verse</a> und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack</a>. <a href=\"#/artikel/tamsin\">Tamsin Blackerly</a> überlebte und wurde später paktgebunden. <a href=\"#/artikel/matilda\">Matilda Richter</a> wurde nichttödlich überwältigt und überlebte ebenfalls.</p>\n<h2>Gegen die Verwechslung</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> beziehungsweise Dame Balina war <strong>keine Branderscar-Gefangene</strong>. Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung.</p>\n<h2>Rückblick, kein aktueller Lageplan</h2>\n<p>Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.</p>\n","sources":["chronicle","history"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Angenommene Geschichte Styke und Vesper entkamen gemeinsam, bargen Verse und befreiten Grumblejack . Tamsin Blackerly überlebte und wurde später paktgebunden. Matilda Richter wurde nichttödlich überwältigt und überlebte ebenfalls. Gegen die Verwechslung Valeria beziehungsweise Dame Balina war keine Branderscar-Gefangene . Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung. Rückblick, kein aktueller Lageplan Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.","links":["styke","vesper","verse","grumblejack","tamsin","matilda","valeria"],"backlinks":["grumblejack","story-so-far","zeit-branderscar"],"search":"branderscar gefangnis und ausgangspunkt der gemeinsamen flucht fruhere stationen angenommene geschichte styke und vesper entkamen gemeinsam bargen verse und befreiten grumblejack tamsin blackerly uberlebte und wurde spater paktgebunden matilda richter wurde nichttodlich uberwaltigt und uberlebte ebenfalls gegen die verwechslung valeria beziehungsweise dame balina war keine branderscar gefangene ihre gefangennahme gehort zu thorns spaterer prufungs und ausbildungsumgebung ruckblick kein aktueller lageplan die flucht ist abgeschlossen das wiki schreibt aus dem veroffentlichten abenteuer keine ungesehenen raume geheimnisse oder spateren schicksale nachtraglich in die kampagne"},{"id":"thorn-manor","category":"orte","title":"Thorns Anwesen","summary":"Ort von Rekrutierung, Dornpakt, Neun Lektionen und langer Ausbildung.","body":"<h2>Ausbildungsphase</h2>\n<p>Nach der Flucht rekrutierte Thorn <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a>. Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus.</p>\n<h2>Balina und Timeon</h2>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon</a> gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen <a href=\"#/artikel/valeria\">Valeria</a> und einen eigenen Privatpakt an.</p>\n<h2>Datierung</h2>\n<p>Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.</p>","sources":["chronicle","history","relations"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":["Thorns Herrenhaus","Nine Lessons","Neun Lektionen"],"parent":"talingarde","text":"Ausbildungsphase Nach der Flucht rekrutierte Thorn Styke und Vesper . Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus. Balina und Timeon Dame Balina und ihr junger Knappe Timeon gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen Valeria und einen eigenen Privatpakt an. Datierung Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.","links":["styke","vesper","timeon","valeria"],"backlinks":["zeit-ausbildung"],"search":"thorns anwesen ort von rekrutierung dornpakt neun lektionen und langer ausbildung thorns herrenhaus nine lessons neun lektionen fruhere stationen ausbildungsphase nach der flucht rekrutierte thorn styke und vesper rund neunzig tage ausbildung die neun lektionen und der dornpakt gehoren zu dieser station die white ravens um elise trainierten als zweiter knoten im selben haus balina und timeon dame balina und ihr junger knappe timeon gerieten wahrend dieser phase in gefangenschaft balina wurde schwer misshandelt und konditioniert spater nahm sie den namen valeria und einen eigenen privatpakt an datierung die chronik uberliefert fur diese phase relative ausbildungstage aber keine vollstandige folge absoluter kalenderdaten"},{"id":"frosthamar","category":"orte","title":"Frosthamar","summary":"Das Schiff der nördlichen Waffenlieferung. Nach Odenkirks Tod zerstört.","body":"<h2>Reise und Begegnungen</h2>\n<p>Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor.</p>\n<h2>Ende des Schiffs</h2>\n<p>Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört.</p>\n<h2>Inventargrenze</h2>\n<p>Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.</p>\n","sources":["chronicle","history"],"status":"Historisch / zerstört","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Reise und Begegnungen Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor. Ende des Schiffs Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört. Inventargrenze Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.","links":[],"backlinks":["hakon","odenkirk","story-so-far"],"search":"frosthamar das schiff der nordlichen waffenlieferung nach odenkirks tod zerstort fruhere stationen reise und begegnungen die nordreise verband den knoten mit sakkarot der patrouille unter edward sambryl und den yutak elfenbein und der narwalzahn gingen aus dem handel hervor ende des schiffs sechs seeleute verliessen odenkirks mannschaft und nahmen stykes dienst an odenkirk starb das schiff wurde nach bergung tragbarer wertsachen und thorns zahlung zerstort inventargrenze die frosthamar ist kein noch verfugbares transportmittel ihr fruheres deck vorrate und beutestucke gelten nicht automatisch als heutiges eigentum der gruppe"},{"id":"talingarde","category":"welt","title":"Talingarde","summary":"Isoliertes Inselkönigreich, beherrscht von Haus Darius und öffentlich geprägt durch Mitra.","body":"<h2>Öffentliches Selbstbild</h2>\n<p>Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse.</p>\n<h2>Herrschaft und Religion</h2>\n<p><a href=\"#/artikel/darius\">Haus Darius</a> regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt.</p>\n<h2>Die sechs Großräume</h2>\n<p>Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die <a href=\"#/artikel/watch-wall\">Watch Wall</a> sichert die nördlichen Zugänge.</p>\n<h2>Kampagnenanpassung</h2>\n<p>Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird <a href=\"#/artikel/golarion\">Golarion</a> verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.</p>\n","sources":["common","cultures","localrules"],"status":"Allgemeinwissen","tags":["Setting","Insel"],"aliases":[],"text":"Öffentliches Selbstbild Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse. Herrschaft und Religion Haus Darius regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt. Die sechs Großräume Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die Watch Wall sichert die nördlichen Zugänge. Kampagnenanpassung Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird Golarion verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.","links":["darius","watch-wall","golarion"],"backlinks":[],"search":"talingarde isoliertes inselkonigreich beherrscht von haus darius und offentlich gepragt durch mitra setting insel offentliches selbstbild talingarde versteht sich als reich von recht ordnung und gute priester pflegen kranke ritter sollen schwache schutzen die krone und die kirche stutzen einander das spielerhandout beschreibt dieses selbstbild aus sicht eines gewohnlichen einwohners es ist kein bericht uber alle verborgenen machtverhaltnisse herrschaft und religion haus darius regiert unter konig markadian v dem tapferen mitra pragt das offentliche leben die verehrung asmodeus ist verboten und mit dem feuertod bedroht andere nichtbose religionen sind technisch nicht gleichermassen verboten gesellschaftlich aber stark zuruckgedrangt die sechs grossraume cambrian ports heartland borderlands caer bryr savage north und die inseln der yutak der suden ist gemassigter der norden kalt und vielfach verschneit die watch wall sichert die nordlichen zugange kampagnenanpassung talingarde bleibt in geschichte und institutionen talingarde als ausserer weltraum wird golarion verwendet ohne exakte lage nachste kuste oder diplomatische beziehungen bereits festzuschreiben"},{"id":"mitra","category":"welt","title":"Mitra","summary":"Herr des Lichts: Heilung, Güte und Führung im öffentlichen Glauben Talingardes.","body":"<h2>Öffentliche Glaubenswelt</h2>\n<p>Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden.</p>\n<h2>Personen und Institutionen</h2>\n<p>Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. <a href=\"#/artikel/valeria\">Valeria</a> wurde als Mitra-Ritterin geprägt, <a href=\"#/artikel/timeon\">Timeon</a> hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis.</p>\n<h2>Gegnerbild</h2>\n<p>Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.</p>\n","sources":["common","core","valeria"],"status":"Allgemeinwissen","tags":["Religion"],"aliases":[],"text":"Öffentliche Glaubenswelt Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden. Personen und Institutionen Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. Valeria wurde als Mitra-Ritterin geprägt, Timeon hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis. Gegnerbild Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.","links":["valeria","timeon"],"backlinks":[],"search":"mitra herr des lichts heilung gute und fuhrung im offentlichen glauben talingardes religion offentliche glaubenswelt mitra wird als konig heiler oder lebendige flamme dargestellt licht heilung gute und fuhrung gehoren zum offentlich bekannten glaubensbild seine kirche ist in den orten des reiches prasent und eng mit haus darius verbunden personen und institutionen father donnagin vertritt diesen glauben im aktuellen festungsumfeld valeria wurde als mitra ritterin gepragt timeon halt an seiner eigenen mitranischen orientierung fest der hochkardinal heisst nach dem allgemeinen spielerwissen vitallian von estyllis gegnerbild asmodeus gilt als erzfeind dass dieses verhaltnis politisch und rechtlich tief in talingarde reicht macht nicht jeden einzelnen priester zur gleichen personlichkeit"},{"id":"asmodeus","category":"welt","title":"Asmodeus","summary":"Herr der Neun Höllen, verbotener Gott und oberste Bindung in den Pakten des Knotens.","body":"<h2>Öffentlich bekannte Geschichte</h2>\n<p>Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor.</p>\n<h2>Heutige Gefahr</h2>\n<p>Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen.</p>\n<h2>Kampagnenbezug</h2>\n<p>Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.</p>\n","sources":["common","relations","factions","house"],"status":"Allgemeinwissen","tags":["Religion","Pakte"],"aliases":[],"text":"Öffentlich bekannte Geschichte Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor. Heutige Gefahr Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen. Kampagnenbezug Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.","links":[],"backlinks":[],"search":"asmodeus herr der neun hollen verbotener gott und oberste bindung in den pakten des knotens religion pakte offentlich bekannte geschichte asmodeus gehorte vor der herrschaft der darius zum talireanischen pantheon gefurchtet und respektiert markadian iv der eiferer verbot den glauben und liess tempel und fuhrende geistliche verfolgen das allgemeine spielerwissen verortet die grossen sauberungen etwa zwanzig jahre zuvor heutige gefahr offentliche asmodeus verehrung ist eine todliche rechtliche gefahr sie unterscheidet sich im recht des reiches von bloss gesellschaftlich missbilligten nichtbosen nebenreligionen kampagnenbezug thorn der dornpakt und der avernische knoten stehen im asmodeischen rahmen valerias privatpakt benennt asmodeus als hochste instanz aber der pakt allein verleiht ihr keine nicht vorhandenen klassenfahigkeiten"},{"id":"darius","category":"welt","title":"Haus Darius und die Krone","summary":"Die öffentlich bekannte Herrscherfamilie Talingardes.","body":"<h2>Gegenwärtige Herrschaft</h2>\n<p>Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet.</p>\n<h2>Historische Eckpunkte</h2>\n<p>Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens.</p>\n<h2>Politischer Rahmen</h2>\n<p>Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.</p>\n","sources":["common","cultures"],"status":"Allgemeinwissen","tags":["Adel","Geschichte"],"aliases":["Markadian","Bellinda","Lucinda","Vitallian","Haus Barca","Tamberlyn"],"text":"Gegenwärtige Herrschaft Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet. Historische Eckpunkte Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens. Politischer Rahmen Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.","links":[],"backlinks":["talingarde"],"search":"haus darius und die krone die offentlich bekannte herrscherfamilie talingardes markadian bellinda lucinda vitallian haus barca tamberlyn adel geschichte gegenwartige herrschaft markadian v genannt der tapfere ist konig seine tochter bellinda ist nach dem allgemeinen spielerhandout zwanzig und unverheiratet konigin lucinda starb bei der geburt markadian heiratete nicht wieder daraus werden keine verborgenen familiengeheimnisse abgeleitet historische eckpunkte markadian i der sieger begrundete die dynastie und besiegte das fruhere haus barca bei tamberlyn seine offentliche erinnerung lebt in denkmalern fort markadian iv der eiferer steht fur die verfolgung des asmodeus glaubens politischer rahmen haus darius und die kirche mitras tragen gemeinsam die offentliche ordnung herkunft rang haushalt und beziehungen sind wichtige soziale grossen aber kein ersatz fur individuell bekannte loyalitaten"},{"id":"watch-wall","category":"welt","title":"Die Watch Wall","summary":"Zwölf Festungen an Talingardes nördlicher Grenze.","body":"<h2>Öffentlich bekannter Zweck</h2>\n<p>Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze.</p>\n<h2>Aktueller Kampagnenausschnitt</h2>\n<p>Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.</p>\n","sources":["common","balentyne","live"],"status":"Allgemeinwissen","tags":["Grenze","Festungen"],"aliases":[],"text":"Öffentlich bekannter Zweck Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze. Aktueller Kampagnenausschnitt Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.","links":[],"backlinks":["talingarde"],"search":"die watch wall zwolf festungen an talingardes nordlicher grenze grenze festungen offentlich bekannter zweck die zwolf grenzfestungen kontrollieren die zugange aus dem savage north sie sollen das reich gegen uberfalle und grossere einfalle schutzen markadian v verdankt seinen beinamen nach dem allgemeinen wissen der verteidigung dieser grenze aktueller kampagnenausschnitt balentyne ist der erreichte schauplatz die gruppe kennt weder automatisch die inneren plane der anderen festungen noch ihren gegenwartigen sicherheitszustand der auftrag verlangt hier eine bresche fur sakkarots heer"},{"id":"borderlands","category":"welt","title":"Die Borderlands","summary":"Grenzland aus Militärversorgung, Landwirtschaft, Wäldern und harten Wintern.","body":"<h2>Alltag</h2>\n<p>Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut.</p>\n<h2>Lokale Verflechtung</h2>\n<p>Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle.</p>\n<h2>Tarnung</h2>\n<p>Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.</p>\n","sources":["cultures","aldencross"],"status":"Allgemeinwissen","tags":["Region","Kultur"],"aliases":[],"text":"Alltag Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut. Lokale Verflechtung Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle. Tarnung Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.","links":[],"backlinks":[],"search":"die borderlands grenzland aus militarversorgung landwirtschaft waldern und harten wintern region kultur alltag z ch. <a href=\"#/artikel/white-tusk\">White Tusk</a> und Joseph sind individuelle Kontakte, nicht das gesamte Volk.</p>\n","sources":["common","cultures","history"],"status":"Allgemeinwissen","tags":["Geographie"],"aliases":["Matharyn","Ghastenhall","Daveryn","Caer Bryr","Iraen","Heartland","Savage North","Cambrian Ports"],"text":"Cambrian Ports Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von Styke genannten Lehrmeisters Zarik erwähnt. Heartland Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben. Caer Bryr Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen. Savage North Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen. Inseln der Yutak Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. White Tusk und Joseph sind individuelle Kontakte, nicht das gesamte Volk.","links":["styke","white-tusk"],"backlinks":[],"search":"regionen und stadte talingardes uberblick uber die bekannte insel ohne verborgene abenteuerorte freizuschalten matharyn ghastenhall daveryn caer bryr iraen heartland savage north cambrian ports geographie cambrian ports matharyn ghastenhall und daveryn sind die grossen urbanen zentren an der bucht von cambria regierung reichtum gelehrsamkeit schiffahrt theater und handwerk konzentrieren sich hier starker daveryn wurde im spiel auch als herkunftsort des von styke ge Kampagne Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt. Lebenswelt und Individualität Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz. Hakon , Sten , Ketil , Eirik , Arved , Torvald und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.","links":["hakon","sten","ketil","eirik","arved","torvald"],"backlinks":[],"search":"norspiker nordische seeleute mit ulfen bezug in der kampagnenanpassung norspik ulfen skald kultur sprache kanon der kampagne norspiker werden als ulfen assoziiertes seefahrervolk behandelt norspik bleibt der gebrauchte sprachname und gilt als mit skald verwandt die bezeichnung wird nicht einfach durch ulfen ersetzt lebenswelt und individualitat schiffe sind arbeitsplatz eigentum unterkunft hierarchie und uberlebensraum handel fischfang kriegsfahrt lohnarbeit verwandtschaft und eide konnen nebeneinander stehen begrenztes common ist kein zeichen geringer intelligenz hakon sten ketil eirik arved torvald und odenkirk bleiben individuelle personen mit unterschiedlicher stellung im akzeptierten verlauf"},{"id":"yutak","category":"welt","title":"Yutak","summary":"Nördliche Inselgemeinschaften, mit denen die Gruppe Handel trieb.","body":"<h2>Kulturrahmen</h2>\n<p>Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise.</p>\n<h2>Kontakte statt Pauschalbild</h2>\n<p><a href=\"#/artikel/white-tusk\">White Tusk</a> und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose.</p>\n<h2>Politischer Rahmen</h2>\n<p>Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.</p>\n","sources":["cultures","history","chronicle"],"status":"Allgemeinwissen","tags":["Kultur","Nordreise"],"aliases":[],"text":"Kulturrahmen Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise. Kontakte statt Pauschalbild White Tusk und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose. Politischer Rahmen Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.","links":["white-tusk"],"backlinks":["sambryl","story-so-far"],"search":"yutak nordliche inselgemeinschaften mit denen die gruppe handel trieb kultur nordreise kulturrahmen seewege fischfang jagd haltbare nahrung haute knochen wetterkenntnis und verwandtschaft sind wichtige grundlagen nutzliche werkzeuge metall stoff und gebrauchsguter konnen einen anderen wert haben als blosse sudliche geldpreise kontakte statt pauschalbild white tusk und joseph gehoren zur abgeschlossenen nordreise ihre aufgaben autoritaten und wissen sind nicht identisch der handel brachte die spater in aldencross verkauften elfenbeinlose politischer rahmen das kulturdossier nennt einen alten frieden talingardes mit yutak hauptlingen eine konkrete begegnung bleibt trotzdem von vorherigen erfahrungen bedarf und umgang abhangig"},{"id":"abstammungen","category":"welt","title":"Abstammungen im bekannten Talingarde","summary":"Die im Kampagnenumfeld wichtigen Abstammungen und ihre Grenzen.","body":"<h2>Aasimar und Tiefling</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. <a href=\"#/artikel/vesper\">Vesper</a> wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich.</p>\n<h2>Menschen, Zwerge und Halblinge</h2>\n<p>Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit.</p>\n<h2>Oger und Burabar</h2>\n<p><a href=\"#/artikel/grumblejack\">Grumblejack</a> bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden.</p>\n<h2>Konstrukte und Tritonen</h2>\n<p><a href=\"#/artikel/verse\">Verse</a> ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. <a href=\"#/artikel/nerianus\">Nerianus</a> besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.</p>","sources":["ancestries","styke","vesper","cultures","verse"],"status":"Weltreferenz","tags":["Abstammungen"],"aliases":["Aasimar","Tiefling","Oger","Zwerg","Halbling","Bugbear","Burabar","Triton","Konstrukt"],"text":"Aasimar und Tiefling Styke ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. Vesper wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich. Menschen, Zwerge und
