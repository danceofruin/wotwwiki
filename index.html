ersonalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.</p>\n","sources":["aldencross","chronicle"],"status":"Ortsbezug","tags":["Aldencross"],"aliases":[],"parent":"aldencross","text":"Gesicherter Ortsbezug Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung. Keine erfundene Besichtigung Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.","links":[],"backlinks":[],"search":"st alden bekannter orientierungspunkt fur die lage des mott hauses aldencross gesicherter ortsbezug das mott haus liegt hinter st alden die schmale gasse am kuchengarten fuhrt in diese richtung keine erfundene besichtigung im hier ausgewerteten kampagnenstand ist kein vollstandiger innenraum personalplan oder gesonderter besuch ausgearbeitet der eintrag halt den tatsachlich bekannten ortsbezug fest","initial":"S"},{"id":"wash-shed","category":"orte","title":"Der Waschschuppen","summary":"Ort der privaten Begegnung mit Mara und Ellyn am 23. Januar.","body":"<h2>Der 23. Januar</h2>\n<p>Nach dem Kennenlernen bei den Wagenhöfen gingen <a href=\"#/artikel/styke\">Styke</a>, <a href=\"#/artikel/mara\">Mara</a> und <a href=\"#/artikel/ellyn\">Ellyn</a> für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver.</p>\n<h2>Der Ort danach</h2>\n<p>Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.</p>","sources":["chronicle","relations"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Waschhütte"],"parent":"aldencross","text":"Der 23. Januar Nach dem Kennenlernen bei den Wagenhöfen gingen Styke , Mara und Ellyn für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver. Der Ort d ndschafteten Styke , Vesper , Valeria und Hakon das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung. Die Nacht des 26. Januar Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt. Spuren und Folgen Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.","links":["hakon","styke","valeria","vesper"],"backlinks":["zeit-0124"],"search":"freeman s rock erkundeter lagerplatz und schauplatz des hinterhalts auf varnings patrouille grenzland freemans rock die vorbereitung vom 24 bis 26 januar kundschafteten styke vesper valeria und hakon das gebiet aus der rest der feldgruppe blieb ungefahr einen halben kilometer entfernt wald und fluchtwege waren teil der vorbereitung die nacht des 26 januar vesper formte das kampfgebiet mit nebel dunkelheit und unterstutzender sichtmagie styke griff von der landeinwartigen fluchtseite an alle sieben patrouillenmitglieder starben keine verbundeten verluste sind festgestellt spuren und folgen leichen wurden begraben der ort bereinigt und die spur der erbeuteten pferde zu verschleiern versucht diese manahmen garantierten nicht dass die tat unentdeckt blieb seit 31 januar kennt balentyne den tod der patrouille welche einzelspuren gefunden wurden wei styke nicht vollstandig","initial":"F"},{"id":"tyburn","category":"orte","title":"Tyburn","summary":"Bekannter Wasserweg im Umfeld von Balentyne.","body":"<h2>Bedeutung für den Spielstand</h2>\n<p>Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne.</p>\n<h2>Begrenzter Karteneintrag</h2>\n<p>Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.</p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":[],"parent":"borderlands","text":"Bedeutung für den Spielstand Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne. Begrenzter Karteneintrag Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.","links":[],"backlinks":["kueche"],"search":"tyburn bekannter wasserweg im umfeld von balentyne grenzland bedeutung fur den spielstand vespers erkundung bestatigte dass gewohnliches wasser fur die festung aus dem tyburn geholt wird das torhaus nutzt daneben eine separate kleinere zisterne begrenzter karteneintrag es werden keine unbeobachteten uferwege bewachungsplane oder genauen entfernungen erganzt die versorgungsfunktion ist bekannt eine vollstandige wasserkarte liegt damit nicht vor","initial":"T"},{"id":"timeon-hof","category":"orte","title":"Timeons sicherer Aufenthaltsort","summary":"Vorgesehenes Familienanwesen, am 31. Januar von Valeria persönlich überprüft.","body":"<h2>Gesicherter Stand</h2>\n<p>Tamsin lieferte <a href=\"#/artikel/timeon\">Timeon</a> an diesem geeigneten Familienanwesen ab. <a href=\"#/artikel/valeria\">Valeria</a> bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin.</p>\n<h2>Nicht ausgearbeitet</h2>\n<p>Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.</p>\n","sources":["live","core","relations"],"status":"Bekannt","tags":["Umland"],"aliases":[],"parent":"borderlands","text":"Gesicherter Stand Tamsin lieferte Timeon an diesem geeigneten Familienanwesen ab. Valeria bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin. Nicht ausgearbeitet Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.","links":["timeon","valeria"],"backlinks":["timeon"],"search":"timeons sicherer aufenthaltsort vorgesehenes familienanwesen am 31 januar von valeria personlich uberpruft umland gesicherter stand tamsin lieferte timeon an diesem geeigneten familienanwesen ab valeria bestatigte seine sicherheit am 31 januar sie fand danach keine belastbare spur zu tamsin nicht ausgearbeitet ein neuer hofname exakte adresse plan oder verlasslich vermessene route werden hier nicht erfunden valeria hatte timeon zugesagt wiederzukommen akzeptierte anschlieend aber stykes ruckkehrverbot","initial":"T"},{"id":"branderscar","category":"orte","title":"Branderscar","summary":"Gefängnis und Ausgangspunkt der gemeinsamen Flucht.","body":"<h2>Angenommene Geschichte</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> entkamen gemeinsam, bargen <a href=\"#/artikel/verse\">Verse</a> und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack</a>. <a href=\"#/artikel/tamsin\">Tamsin Blackerly</a> überlebte und wurde später paktgebunden. <a href=\"#/artikel/matilda\">Matilda Richter</a> wurde nichttödlich überwältigt und überlebte ebenfalls.</p>\n<h2>Gegen die Verwechslung</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> beziehungsweise Dame Balina war <strong>keine Branderscar-Gefangene</strong>. Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung.</p>\n<h2>Rückblick, kein aktueller Lageplan</h2>\n<p>Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.</p>\n","sources":["chronicle","history"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Angenommene Geschichte Styke und Vesper entkamen gemeinsam, bargen Verse und befreiten Grumblejack . Tamsin Blackerly überlebte und wurde später paktgebunden. Matilda Richter wurde nichttödlich überwältigt und überlebte ebenfalls. Gegen die Verwechslung Valeria beziehungsweise Dame Balina war keine Branderscar-Gefangene . Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung. Rückblick, kein aktueller Lageplan Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.","links":["grumblejack","matilda","styke","tamsin","valeria","verse","vesper"],"backlinks":["zeit-branderscar"],"search":"branderscar gefangnis und ausgangspunkt der gemeinsamen flucht fruhere stationen angenommene geschichte styke und vesper entkamen gemeinsam bargen verse und befreiten grumblejack tamsin blackerly uberlebte und wurde spater paktgebunden matilda richter wurde nichttodlich uberwaltigt und uberlebte ebenfalls gegen die verwechslung valeria beziehungsweise dame balina war keine branderscar gefangene ihre gefangennahme gehort zu thorns spaterer prufungs und ausbildungsumgebung ruckblick kein aktueller lageplan die flucht ist abgeschlossen das wiki schreibt aus dem veroffentlichten abenteuer keine ungesehenen raume geheimnisse oder spateren schicksale nachtraglich in die kampagne","initial":"B"},{"id":"thorn-manor","category":"orte","title":"Thorns Anwesen","summary":"Ort von Rekrutierung, Dornpakt, Neun Lektionen und langer Ausbildung.","body":"<h2>Ausbildungsphase</h2>\n<p>Nach der Flucht rekrutierte Thorn <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a>. Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus.</p>\n<h2>Balina und Timeon</h2>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon</a> gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen <a href=\"#/artikel/valeria\">Valeria</a> und einen eigenen Privatpakt an.</p>\n<h2>Datierung</h2>\n<p>Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.</p>","sources":["chronicle","history","relations"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":["Thorns Herrenhaus","Nine Lessons","Neun Lektionen"],"parent":"talingarde","text":"Ausbildungsphase Nach der Flucht rekrutierte Thorn Styke und Vesper . Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus. Balina und Timeon Dame Balina und ihr junger Knappe Timeon gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen Valeria und einen eigenen Privatpakt an. Datierung Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.","links":["styke","timeon","valeria","vesper"],"backlinks":["zeit-ausbildung"],"search":"thorns anwesen ort von rekrutierung dornpakt neun lektionen und langer ausbildung fruhere stationen thorns herrenhaus nine lessons neun lektionen ausbildungsphase nach der flucht rekrutierte thorn styke und vesper rund neunzig tage ausbildung die neun lektionen und der dornpakt gehoren zu dieser station die white ravens um elise trainierten als zweiter knoten im selben haus balina und timeon dame balina und ihr junger knappe timeon gerieten wahrend dieser phase in gefangenschaft balina wurde schwer misshandelt und konditioniert spater nahm sie den namen valeria und einen eigenen privatpakt an datierung die chronik uberliefert fur diese phase relative ausbildungstage aber keine vollstandige folge absoluter kalenderdaten","initial":"T"},{"id":"frosthamar","category":"orte","title":"Frosthamar","summary":"Das Schiff der nördlichen Waffenlieferung. Nach Odenkirks Tod zerstört.","body":"<h2>Reise und Begegnungen</h2>\n<p>Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor.</p>\n<h2>Ende des Schiffs</h2>\n<p>Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört.</p>\n<h2>Inventargrenze</h2>\n<p>Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.</p>\n","sources":["chronicle","history"],"status":"Historisch / zerstört","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Reise und Begegnungen Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor. Ende des Schiffs Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört. Inventargrenze Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.","links":[],"backlinks":["odenkirk"],"search":"frosthamar das schiff der nordlichen waffenlieferung nach odenkirks tod zerstort fruhere stationen reise und begegnungen die nordreise verband den knoten mit sakkarot der patrouille unter edward sambryl und den yutak elfenbein und der narwalzahn gingen aus dem handel hervor ende des schiffs sechs seeleute verlieen odenkirks mannschaft und nahmen stykes dienst an odenkirk starb das schiff wurde nach bergung tragbarer wertsachen und thorns zahlung zerstort inventargrenze die frosthamar ist kein noch verfugbares transportmittel ihr fruheres deck vorrate und beutestucke gelten nicht automatisch als heutiges eigentum der gruppe","initial":"F"},{"id":"talingarde","category":"welt","title":"Talingarde","summary":"Isoliertes Inselkönigreich, beherrscht von Haus Darius und öffentlich geprägt durch Mitra.","body":"<h2>Öffentliches Selbstbild</h2>\n<p>Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse.</p>\n<h2>Herrschaft und Religion</h2>\n<p><a href=\"#/artikel/darius\">Haus Darius</a> regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt.</p>\n<h2>Die sechs Großräume</h2>\n<p>Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die <a href=\"#/artikel/watch-wall\">Watch Wall</a> sichert die nördlichen Zugänge.</p>\n<h2>Kampagnenanpassung</h2>\n<p>Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird <a href=\"#/artikel/golarion\">Golarion</a> verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.</p>\n","sources":["common","cultures","localrules"],"status":"Allgemeinwissen","tags":["Setting","Insel"],"aliases":[],"text":"Öffentliches Selbstbild Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse. Herrschaft und Religion Haus Darius regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt. Die sechs Großräume Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die Watch Wall sichert die nördlichen Zugänge. Kampagnenanpassung Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird Golarion verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.","links":["darius","golarion","watch-wall"],"backlinks":[],"search":"talingarde isoliertes inselkonigreich beherrscht von haus darius und offentlich gepragt durch mitra setting insel offentliches selbstbild talingarde versteht sich als reich von recht ordnung und gute priester pflegen kranke ritter sollen schwache schutzen die krone und die kirche stutzen einander das spielerhandout beschreibt dieses selbstbild aus sicht eines gewohnlichen einwohners es ist kein bericht uber alle verborgenen machtverhaltnisse herrschaft und religion haus darius regiert unter konig markadian v dem tapferen mitra pragt das offentliche leben die verehrung asmodeus ist verboten und mit dem feuertod bedroht andere nichtbose religionen sind technisch nicht gleichermaen verboten gesellschaftlich aber stark zuruckgedrangt die sechs groraume cambrian ports heartland borderlands caer bryr savage north und die inseln der yutak der suden ist gemaigter der norden kalt und vielfach verschneit die watch wall sichert die nordlichen zugange kampagnenanpassung talingarde bleibt in geschichte und institutionen talingarde als auerer weltraum wird golarion verwendet ohne exakte lage nachste kuste oder diplomatische beziehungen bereits festzuschreiben","initial":"T"},{"id":"mitra","category":"welt","title":"Mitra","summary":"Herr des Lichts: Heilung, Güte und Führung im öffentlichen Glauben Talingardes.","body":"<h2>Öffentliche Glaubenswelt</h2>\n<p>Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden.</p>\n<h2>Personen und Institutionen</h2>\n<p>Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. <a href=\"#/artikel/valeria\">Valeria</a> wurde als Mitra-Ritterin geprägt, <a href=\"#/artikel/timeon\">Timeon</a> hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis.</p>\n<h2>Gegnerbild</h2>\n<p>Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.</p>\n","sources":["common","core","valeria"],"status":"Allgemeinwissen","tags":["Religion"],"aliases":[],"text":"Öffentliche Glaubenswelt Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden. Personen und Institutionen Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. Valeria wurde als Mitra-Ritterin geprägt, Timeon hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis. Gegnerbild Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.","links":["timeon","valeria"],"backlinks":[],"search":"mitra herr des lichts heilung gute und fuhrung im offentlichen glauben talingardes religion offentliche glaubenswelt mitra wird als konig heiler oder lebendige flamme dargestellt licht heilung gute und fuhrung gehoren zum offentlich bekannten glaubensbild seine kirche ist in den orten des reiches prasent und eng mit haus darius verbunden personen und institutionen father donnagin vertritt diesen glauben im aktuellen festungsumfeld valeria wurde als mitra ritterin gepragt timeon halt an seiner eigenen mitranischen orientierung fest der hochkardinal heit nach dem allgemeinen spielerwissen vitallian von estyllis gegnerbild asmodeus gilt als erzfeind dass dieses verhaltnis politisch und rechtlich tief in talingarde reicht macht nicht jeden einzelnen priester zur gleichen personlichkeit","initial":"M"},{"id":"asmodeus","category":"welt","title":"Asmodeus","summary":"Herr der Neun Höllen, verbotener Gott und oberste Bindung in den Pakten des Knotens.","body":"<h2>Öffentlich bekannte Geschichte</h2>\n<p>Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor.</p>\n<h2>Heutige Gefahr</h2>\n<p>Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen.</p>\n<h2>Kampagnenbezug</h2>\n<p>Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.</p>\n","sources":["common","relations","factions","house"],"status":"Allgemeinwissen","tags":["Religion","Pakte"],"aliases":[],"text":"Öffentlich bekannte Geschichte Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor. Heutige Gefahr Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen. Kampagnenbezug Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.","links":[],"backlinks":[],"search":"asmodeus herr der neun hollen verbotener gott und oberste bindung in den pakten des knotens religion pakte offentlich bekannte geschichte asmodeus gehorte vor der herrschaft der darius zum talireanischen pantheon gefurchtet und respektiert markadian iv der eiferer verbot den glauben und lie tempel und fuhrende geistliche verfolgen das allgemeine spielerwissen verortet die groen sauberungen etwa zwanzig jahre zuvor heutige gefahr offentliche asmodeus verehrung ist eine todliche rechtliche gefahr sie unterscheidet sich im recht des reiches von blo gesellschaftlich missbilligten nichtbosen nebenreligionen kampagnenbezug thorn der dornpakt und der avernische knoten stehen im asmodeischen rahmen valerias privatpakt benennt asmodeus als hochste instanz aber der pakt allein verleiht ihr keine nicht vorhandenen klassenfahigkeiten","initial":"A"},{"id":"darius","category":"welt","title":"Haus Darius und die Krone","summary":"Die öffentlich bekannte Herrscherfamilie Talingardes.","body":"<h2>Gegenwärtige Herrschaft</h2>\n<p>Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet.</p>\n<h2>Historische Eckpunkte</h2>\n<p>Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens.</p>\n<h2>Politischer Rahmen</h2>\n<p>Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.</p>\n","sources":["common","cultures"],"status":"Allgemeinwissen","tags":["Adel","Geschichte"],"aliases":["Markadian","Bellinda","Lucinda","Vitallian","Haus Barca","Tamberlyn"],"text":"Gegenwärtige Herrschaft Markadian V, genannt der Tapfere, ist König. Seine Tochter Bellinda ist nach dem allgemeinen Spielerhandout zwanzig und unverheiratet. Königin Lucinda starb bei der Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet. Historische Eckpunkte Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens. Politischer Rahmen Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.","links":[],"backlinks":["talingarde"],"search":"haus darius und die krone die offentlich bekannte herrscherfamilie talingardes adel geschichte markadian bellinda lucinda vitallian haus barca tamberlyn gegenwartige herrschaft markadian v genannt der tapfere ist konig seine tochter bellinda ist nach dem allgemeinen spielerhandout zwanzig und unverheiratet konigin lucinda starb bei der geburt markadian heiratete nicht wieder daraus werden keine verborgenen familiengeheimnisse abgeleitet historische eckpunkte markadian i der sieger begrundete die dynastie und besiegte das fruhere haus barca bei tamberlyn seine offentliche erinnerung lebt in denkmalern fort markadian iv der eiferer steht fur die verfolgung des asmodeus glaubens politischer rahmen haus darius und die kirche mitras tragen gemeinsam die offentliche ordnung herkunft rang haushalt und beziehungen sind wichtige soziale groen aber kein ersatz fur individuell bekannte loyalitaten","initial":"H"},{"id":"watch-wall","category":"welt","title":"Die Watch Wall","summary":"Zwölf Festungen an Talingardes nördlicher Grenze.","body":"<h2>Öffentlich bekannter Zweck</h2>\n<p>Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze.</p>\n<h2>Aktueller Kampagnenausschnitt</h2>\n<p>Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.</p>\n","sources":["common","balentyne","live"],"status":"Allgemeinwissen","tags":["Grenze","Festungen"],"aliases":[],"text":"Öffentlich bekannter Zweck Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze. Aktueller Kampagnenausschnitt Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.","links":[],"backlinks":["talingarde"],"search":"die watch wall zwolf festungen an talingardes nordlicher grenze grenze festungen offentlich bekannter zweck die zwolf grenzfestungen kontrollieren die zugange aus dem savage north sie sollen das reich gegen uberfalle und groere einfalle schutzen markadian v verdankt seinen beinamen nach dem allgemeinen wissen der verteidigung dieser grenze aktueller kampagnenausschnitt balentyne ist der erreichte schauplatz die gruppe kennt weder automatisch die inneren plane der anderen festungen noch ihren gegenwartigen sicherheitszustand der auftrag verlangt hier eine bresche fur sakkarots heer","initial":"D"},{"id":"borderlands","category":"welt","title":"Die Borderlands","summary":"Grenzland aus Militärversorgung, Landwirtschaft, Wäldern und harten Wintern.","body":"<h2>Alltag</h2>\n<p>Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut.</p>\n<h2>Lokale Verflechtung</h2>\n<p>Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle.</p>\n<h2>Tarnung</h2>\n<p>Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.</p>\n","sources":["cultures","aldencross"],"status":"Allgemeinwissen","tags":["Region","Kultur"],"aliases":[],"text":"Alltag Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut. Lokale Verflechtung Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle. Tarnung Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.","links":[],"backlinks":[],"search":"die borderlands grenzland aus militarversorgung landwirtschaft waldern und harten wintern region kultur alltag zwischen heartland und savage north pragen patrouillen alte zwergenbauten hofe wald see und flussverkehr den alltag winter sind streng fruhjahre nass schlamm und nebel vertraut lokale verflechtung im umfeld aldencross kennen arbeiter fuhrleute soldaten und handwerker viele gesichter und routinen dienst ehe handel reparaturen und verluste verbinden ort und festung das ist praktische ortskenntnis keine kenntnis aller befehle tarnung route beruf gerat sprache und burgen entscheiden wie ein fremder eingeordnet wird ein plausibler nordhandler kann weniger auffallen als jemand der vorgibt seit jahren zur lokalen arbeiterschaft zu gehoren","initial":"D"},{"id":"regionen","category":"welt","title":"Regionen und Städte Talingardes","summary":"Überblick über die bekannte Insel, ohne verborgene Abenteuerorte freizuschalten.","body":"<h2>Cambrian Ports</h2>\n<p>Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von <a href=\"#/artikel/styke\">Styke</a> genannten Lehrmeisters Zarik erwähnt.</p>\n<h2>Heartland</h2>\n<p>Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben.</p>\n<h2>Caer Bryr</h2>\n<p>Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen.</p>\n<h2>Savage North</h2>\n<p>Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen.</p>\n<h2>Inseln der Yutak</h2>\n<p>Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. <a href=\"#/artikel/white-tusk\">White Tusk</a> und Joseph sind individuelle Kontakte, nicht das gesamte Volk.</p>\n","sources":["common","cultures","history"],"status":"Allgemeinwissen","tags":["Geographie"],"aliases":["Matharyn","Ghastenhall","Daveryn","Caer Bryr","Iraen","Heartland","Savage North","Cambrian Ports"],"text":"Cambrian Ports Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von Styke genannten Lehrmeisters Zarik erwähnt. Heartland Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben. Caer Bryr Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen. Savage North Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen. Inseln der Yutak Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. White Tusk und Joseph sind individuelle Kontakte, nicht das gesamte Volk.","links":["styke","white-tusk"],"backlinks":[],"search":"regionen und stadte talingardes uberblick uber die bekannte insel ohne verborgene abenteuerorte freizuschalten geographie matharyn ghastenhall daveryn caer b
