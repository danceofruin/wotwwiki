107dea67f40b9f354","adult":true,"readDate":"2026-09-10","section":"Vesper; Valeria; Kaitlyn; Mara; Ellyn"},"intim-tamsin":{"title":"Tamsin: Körper- und Intimitätsakte","path":"npcs/tamsin-blackerly.md","sha":"a04534313b37815d17d31dda47869d4036191995","adult":true,"readDate":"2026-09-10"},"intim-tacitus":{"title":"Tacitus: Körperakte und Wissensgrenzen","path":"npcs/tacitus-of-morimun.md","sha":"905cd55d57084432cf71739ab108327d97058d50","adult":true,"readDate":"2026-09-10"}},"articles":[{"id":"styke","category":"charaktere","title":"Styke","summary":"Aasimar, Söldner, Schmied. Verbindlichkeit und Konsequenz statt großer Gesten.","body":"<h2>Identität und Erscheinung</h2>\n<p>Styke ist ein 60 Jahre alter Angel-Blooded-Aasimar und wirkt sichtbar jünger. Er ist etwa 190 cm groß, schlank und athletisch. Helle, beinahe marmorartige Haut, dichtes schwarzes Haar, dunkle Bartstoppeln und leuchtend eisblaue Augen mit silbernen Höfen sind seine festen Merkmale.</p>\n<p>Er arbeitete als Söldner und Schmied. Gegenüber <a href=\"#/artikel/barnabus\">Barnabus Eisenbauch</a> nannte er <a href=\"#/artikel/zarik\">Zarik aus Daveryn</a> als Lehrmeister für zwei Winter.</p>\n<h2>Wirksamkeit</h2>\n<p>Ausgänge, Waffen, Zuständigkeiten, brauchbare Fähigkeiten und Folgen eines Fehlschlags interessieren Styke mehr als zeremonieller Rang. Vesper übernimmt Informationsarbeit, Valeria militärische Prüfung und Hakon die Feldführung, solange Ergebnis und Loyalität tragen.</p>\n<p>Seine Moral ist persönlich, vertraglich und hierarchisch. Ein gegebenes Wort, eine angenommene Bindung und Verantwortung für die eigenen Leute wiegen schwerer als das Wohlergehen Außenstehender. Am Freeman's Rock tötete er den kapitulierenden Varning unter seiner zuvor gesetzten Keine-Gefangenen-Linie.</p>\n<h2>Körper, Handwerk und Stimme</h2>\n<p>Sein Großschwertstil lebt von Geschwindigkeit und Koordination. DEX 19 erklärt, weshalb der schlanke Mann nicht wie ein schwerfälliger Kraftkämpfer arbeitet. Metall, Schneiden, Öl, Reparaturen und die Qualität eines Werkstücks sind ihm vertraut. Tabak und starker Alkohol gehören zum Alltag.</p>\n<p>Er spricht tief, rau und kontrolliert, meist in kurzen bis mittleren Sätzen. Unter Druck werden seine Worte knapper. Zuneigung zeigt sich als Handlung: zurückkommen, jemanden einplanen, eine Last übernehmen, ein Versprechen halten.</p>\n<h2>Bindungen</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> ist seine längste und tiefste Partnerin. Beide teilen seit Branderscar Flucht, Verbrechen, Bett, Alltag und die Absicht, Thorn zu überleben. Andere Liebhaber und die Nähe zu Valeria bestehen daneben.</p>\n<p><a href=\"#/artikel/valeria\">Valeria</a> ist frühere Gegnerin, Opfer seiner Gewalt, Gefährtin und Geliebte. <a href=\"#/artikel/grumblejack\">Grumblejack</a> ging als Mitgefangener mit ihm und wurde zum Freund. <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott</a> ist seine heimliche Geliebte; von der Mission weiß sie nichts.</p>\n<h2>Stand am Morgen des 1. Februar</h2>\n<p>Styke hat sich gewaschen und angekleidet, Mithralkettenhemd und Großschwert angelegt und geht im <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> zum Frühstück hinunter. <a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/verse\">Verse</a> sind bereits aufgebrochen, <a href=\"#/artikel/valeria\">Valeria</a> schläft oben. Neue Ergebnisse ihrer Ermittlungen liegen ihm noch nicht vor.</p>\n<h2>Nachschlagen</h2>\n<p><a href=\"#/artikel/bogen-styke\">Vollständiger Charakterbogen</a> / <a href=\"#/artikel/psy-styke\">Ausführliches psychologisches Profil</a> / <a href=\"#/artikel/kollektiv\">Kollektiv und Telepathie</a></p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-styke\">Intimität und persönliche Beziehungen</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["styke","live","core"],"status":"Bestätigt","tags":["Kernfigur","Stufe 5","Frontlinie"],"aliases":["Aasimar","Zelot","Zealot"],"group":"inner","initial":"S","text":"Identität und Erscheinung Styke ist ein 60 Jahre alter Angel-Blooded-Aasimar und wirkt sichtbar jünger. Er ist etwa 190 cm groß, schlank und athletisch. Helle, beinahe marmorartige Haut, dichtes schwarzes Haar, dunkle Bartstoppeln und leuchtend eisblaue Augen mit silbernen Höfen sind seine festen Merkmale. Er arbeitete als Söldner und Schmied. Gegenüber Barnabus Eisenbauch nannte er Zarik aus Daveryn als Lehrmeister für zwei Winter. Wirksamkeit Ausgänge, Waffen, Zuständigkeiten, brauchbare Fähigkeiten und Folgen eines Fehlschlags interessieren Styke mehr als zeremonieller Rang. Vesper übernimmt Informationsarbeit, Valeria militärische Prüfung und Hakon die Feldführung, solange Ergebnis und Loyalität tragen. Seine Moral ist persönlich, vertraglich und hierarchisch. Ein gegebenes Wort, eine angenommene Bindung und Verantwortung für die eigenen Leute wiegen schwerer als das Wohlergehen Außenstehender. Am Freeman's Rock tötete er den kapitulierenden Varning unter seiner zuvor gesetzten Keine-Gefangenen-Linie. Körper, Handwerk und Stimme Sein Großschwertstil lebt von Geschwindigkeit und Koordination. DEX 19 erklärt, weshalb der schlanke Mann nicht wie ein schwerfälliger Kraftkämpfer arbeitet. Metall, Schneiden, Öl, Reparaturen und die Qualität eines Werkstücks sind ihm vertraut. Tabak und starker Alkohol gehören zum Alltag. Er spricht tief, rau und kontrolliert, meist in kurzen bis mittleren Sätzen. Unter Druck werden seine Worte knapper. Zuneigung zeigt sich als Handlung: zurückkommen, jemanden einplanen, eine Last übernehmen, ein Versprechen halten. Bindungen Vesper ist seine längste und tiefste Partnerin. Beide teilen seit Branderscar Flucht, Verbrechen, Bett, Alltag und die Absicht, Thorn zu überleben. Andere Liebhaber und die Nähe zu Valeria bestehen daneben. Valeria ist frühere Gegnerin, Opfer seiner Gewalt, Gefährtin und Geliebte. Grumblejack ging als Mitgefangener mit ihm und wurde zum Freund. Kaitlyn Mott ist seine heimliche Geliebte; von der Mission weiß sie nichts. Stand am Mo lbst der nächste Plan warten muss.</p>\n<h2>Bindungen</h2>\n<p>Bei ihrer ursprünglichen Flucht weigerte Vesper sich, Verse zurückzulassen. <a href=\"#/artikel/valeria\">Dame Balina</a> war an ihrer Gefangennahme beteiligt; später beteiligte Vesper sich an Balinas Misshandlung. Heute leben beide im selben Zimmer, kämpfen zusammen und wurden in der Nacht zum 1. Februar direkt miteinander intim.</p>\n<p>Mit <a href=\"#/artikel/styke\">Styke</a> teilt Vesper seit Branderscar eine operative und sexuelle Partnerschaft. Am 31. Januar sprachen beide über Reisen, Macht, Heirat und Kinder als mögliche gemeinsame Zukunft nach Thorn.</p>\n<h2>Stand am Morgen des 1. Februar</h2>\n<p>Vesper ist mit <a href=\"#/artikel/verse\">Verse</a> zum erneuten Arbeiterzugang nach <a href=\"#/artikel/balentyne\">Balentyne</a> aufgebrochen. Sie will <a href=\"#/artikel/zack\">Zack Eddarly</a> identifizieren und seinen Dienstplan finden. Zulassung und Ergebnis sind noch offen.</p>\n<h2>Nachschlagen</h2>\n<p><a href=\"#/artikel/bogen-vesper\">Vollständiger Charakterbogen</a> / <a href=\"#/artikel/psy-vesper\">Psychologisches Profil</a> / <a href=\"#/artikel/verse\">Verse</a> / <a href=\"#/artikel/arcane-enlightenment\">Arcane Enlightenment</a></p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-vesper\">Intimität und persönliche Beziehungen</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["vesper","live","verse"],"status":"Bestätigt","tags":["Kernfigur","Stufe 5","Magie","Infiltration"],"aliases":[],"group":"inner","initial":"V","text":"Identität und Erscheinung Vesper ist 22, eine Asura-Spawn-Tiefling und Oracle (Spirit Guide) 5 mit Lore Mystery. Alabasterhelle Haut, schwarzes Haar mit blauem Schimmer, schlanke Gestalt und ein langer Greifschwanz sind etabliert. Sichtbare Hörner hat sie nicht; ihre Augenfarbe ist im Dossier noch nicht festgelegt. CHA 18 und WIS 18 prägen Zauberkunst, Menschenbeobachtung und ihre Art, sich durch Räume und Gespräche zu bewegen. Sie i orm blieb: Was ist geschehen? Wofür bin ich verantwortlich? Was habe ich zugesagt? Was kann ich halten?</p>\n<p>Unter persönlicher Wut wird Valeria formeller und genauer; unter Scham leiser. Zuneigung zeigt sie häufiger durch Essen, Wärme, gepflegte Ausrüstung oder eine übernommene Wache als durch große Bekenntnisse.</p>\n<h2>Thorns Anwesen und der Privatpakt</h2>\n<p>Während der Ausbildung geriet Balina mit <a href=\"#/artikel/timeon\">Timeon</a> in Gefangenschaft. Styke und Vesper waren an sexueller Gewalt, Zwang und Konditionierung beteiligt. Später nahm sie den <a href=\"#/artikel/privatpakt\">Privatpakt</a> an und blieb als Valeria bei der Gruppe.</p>\n<p>Am 30. Januar sagte sie, dass sie <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> hassen und zugleich bei ihnen liegen und nirgendwo anders sein wollen könne. Seitdem plant sie wieder über denselben Abend hinaus.</p>\n<h2>Timeon und der Streit vom 31. Januar</h2>\n<p>Valeria ritt zum Familienhof und bestätigte Timeons Sicherheit persönlich. Anschließend akzeptierte sie Stykes Befehl, nicht dorthin zurückzukehren. Dem Anspruch, damit auch ihre Bindung an Timeon und Balina zu bestimmen, widersprach sie ausdrücklich.</p>\n<h2>Aktuelle Aufgabe und Mechanik</h2>\n<p>Nach dem Schlaf soll sie zuerst <a href=\"#/artikel/donnagin\">Father Donnagin</a> und seine Gewohnheiten untersuchen. Zwergenroutinen, Training und Torhausbeobachtung sind weitere Vorhaben. Sie ist <strong>Fighter 5</strong>, mit Platte, meisterlichem Großschwert und Cloak of Resistance +1.</p>\n<p><a href=\"#/artikel/bogen-valeria\">Vollständiger Charakterbogen</a> / <a href=\"#/artikel/psy-valeria\">Ausführliches psychologisches Profil</a> / <a href=\"#/artikel/dreierkonstellation\">Die Dreierkonstellation</a></p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-valeria\">Intimität und persönliche Beziehungen</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["valeria","live","relations"],"  Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus.</p>\n<h2>Sicherheit durch Auswege</h2>\n<p>Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes Eingeschlossensein trifft sie härter als eine gefährliche Lage, deren Regeln sie lesen kann.</p>\n<p>Der Preis dieser Gewohnheit ist Aufschub. Ein weiterer Zugang, eine zusätzliche Frage oder eine elegante Lüge können sie länger in einer riskanten Situation halten. Ihre soziale Klugheit schützt sie weder vor Irrtum noch vor einer gut erzählten Täuschung.</p>\n<h2>Manipulation und Kontrolle</h2>\n<p>Vesper rahmt bevorzugt wahre Einzelheiten so, dass andere den falschen Schluss ziehen. Sie kann jemanden mögen und im selben Gespräch benutzen. Befehle sind ihr weniger wichtig als Wissen, Zugriff und die Möglichkeit, den nächsten Schritt zu bestimmen.</p>\n<p>In vertrauter Umgebung legt sie diese Regie zeitweise ab. Am 31. Januar gab Styke ihr vor Valerias Rückkehr die Führung; später wechselten beide wieder in Zärtlichkeit. Das reizte sie gerade, weil ihre Beziehung nicht an eine einzige Rollenverteilung gebunden ist.</p>\n<h2>Angst, Wut und Scham</h2>\n<p>Unter Angst werden ihre Fragen kurz und prüfbar: Wer hat es gesehen? Welche Tür? Wie viele? Was wissen sie? Bei echter Wut verschwindet der Witz. Scham versucht sie zunächst zu analysieren; wenn das nicht gelingt, verraten Pause, ausgebliebener Scherz oder eine praktische Geste mehr als ein Bekenntnis.</p>\n<h2>Styke, Verse und Valeria</h2>\n<p>Mit Styke teilt sie Flucht, Verbrechen, Bett, Planung und die Absicht, Thorn zu überleben. Verse ist ein Teil ihrer eigenen Geschichte; sie weigerte sich, ihn zurückzulassen, und behandelt seinen Widerspruch als Zeichen seiner Person.</p>\n<p><a href=\"#/artikel/valeria\">Valeria</a> verbindet frühere Gegnerin, Opfer, begehrte Gefährtin und militärische Partnerin. Am 31. Januar sorgte Vesper sich offen um ihre Abwesenheit. In der folgenden Nacht wurde sie Valeria körperlich nah, reinigte sie und blieb bei ihr, bis sie einschlief.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-vesper\">Intimität und persönliche Beziehungen</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["vesper","psy","relations","verse"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Neugier als Arbeitsweise Vesper will Antworten nicht nur besitzen. Sie will wissen, woher sie kommen, wem sie nützen und welche Tür sie öffnen. Aus einem Namen wird eine Spur, aus einem Schlüssel ein Zugang, aus einer beiläufigen Bemerkung eine Versuchsanordnung. Diese Neugier ist nicht immer zweckgebunden. Verse und die Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus. Sicherheit durch Auswege Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes Eingeschlossensein trifft sie härter als eine gefährliche Lage, deren Regeln sie lesen kann. Der Preis dieser Gewohnheit ist Aufschub. Ein weiterer Zugang, eine zusätzliche Frage oder eine elegante Lüge können sie länger in einer riskanten Situation halten. Ihre soziale Klugheit schützt sie weder vor Irrtum noch vor einer gut erzählten Täuschung. Manipulation und Kontrolle Vesper rahmt bevorzugt wahre Einzelheiten so, dass andere den falschen Schluss ziehen. Sie kann jemanden mögen und im selben Gespräch benutzen. Befehle sind ihr weniger wichtig als Wissen, Zugriff und die Möglichkeit, den nächsten Schritt zu bestimmen. In vertrauter Umgebung legt sie diese Regie zeitweise ab. Am 31. Januar gab Styke ihr vor Valerias Rückkeh eidungen seit Thorns Anwesen.","body":"<h2>Balina unter neuem Namen</h2>\n<p>Dame Balina verschwand nicht mit dem Namen <a href=\"#/artikel/valeria\">Valeria</a>. Ihre Ausbildung, ihr Mitraglaube und ihr Rang leben in Haltung, Wortwahl und Pflichtgefühl weiter. Hinzu kamen Gefangenschaft, Misshandlung, der Privatpakt und ein Alltag an der Seite jener beiden Menschen, die an ihrer Zerstörung beteiligt waren.</p>\n<h2>Pflicht als Ordnung</h2>\n<p>Valeria denkt in Verantwortung, Zusage und Folge. Eine konkrete Aufgabe stabilisiert sie: jemanden schützen, eine Lage prüfen, Rüstung pflegen, Wache übernehmen. Schöne Erklärungen überzeugen sie weniger als ein gehaltenes Wort.</p>\n<p>Das zeigte der Streit um <a href=\"#/artikel/timeon\">Timeon</a>. Sie befolgte Stykes Befehl, nicht zum Hof zurückzukehren, bestritt ihm aber das Recht, ihre frühere Verantwortung umzudeuten. Der Auftrag galt; ihre Bindung an Timeon ebenfalls.</p>\n<h2>Stimme und Reaktion</h2>\n<p>Valeria spricht direkt und in vollständigen Sätzen. Wut macht sie förmlicher. Scham macht sie knapp. Fürsorge erscheint als Frühstück, Wärme, ein Verband, gepflegte Ausrüstung oder eine Last, die sie übernimmt, bevor jemand darum bittet.</p>\n<p>Angst übersetzt sie in Menschen, Positionen, Ausgänge und Material. Erschöpfung nimmt ihr diese Gewohnheit nicht; am aktuellen Stand schläft sie nach langem Ritt und einer noch längeren Nacht schlicht weiter.</p>\n<h2>Styke</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> war Täter und wurde später zu einer berechenbaren Größe. Er hielt einzelne Versprechen, schützte Timeons Aufenthaltsort und vertraute ihr am Morgen des 1. Februar die Führung über seinen eigenen Körper an. Valeria antwortete darauf nicht mit Vergebung, sondern indem sie ihn nachher festhielt.</p>\n<h2>Vesper</h2>\n<p>Bei <a href=\"#/artikel/vesper\">Vesper</a> liegen Schuld und Vertrautheit noch enger beieinander. Respekt, Konkurrenz, Begehren und Misstrauen tauchen oft im selben Gespräch auf. In der Nacht zum 1. Februar wurden beide erstmals direkt miteinander intim; anschließend reinigte Vesper sie und blieb bei ihr.</p>\n<h2>Sexualität und Härte</h2>\n<p>Valeria verlangt Intensität nicht als feste Rolle, sondern in konkreten Nächten. Am 27. Januar beteiligte sie sich an Vespers Experiment mit Augenbinde und Fesseln. In der Nacht zum 1. Februar forderte sie beim Analverkehr mit Styke mehr Härte. Am folgenden Morgen übernahm sie selbst Kontrolle, Demütigung und Schmerz.</p>\n<p>Ihre koitale Inkontinenz war lange mit Scham besetzt. Seit Styke offen aussprach, dass ihn gerade diese Reaktion erregt, vermischen sich Ekel über die eigene Erregung, Trotz und Lust. Valeria redet diesen Widerspruch nicht schön; sie trägt ihn.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-valeria\">Intimität und persönliche Beziehungen</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["valeria","psy","relations","live"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Balina unter neuem Namen Dame Balina verschwand nicht mit dem Namen Valeria . Ihre Ausbildung, ihr Mitraglaube und ihr Rang leben in Haltung, Wortwahl und Pflichtgefühl weiter. Hinzu kamen Gefangenschaft, Misshandlung, der Privatpakt und ein Alltag an der Seite jener beiden Menschen, die an ihrer Zerstörung beteiligt waren. Pflicht als Ordnung Valeria denkt in Verantwortung, Zusage und Folge. Eine konkrete Aufgabe stabilisiert sie: jemanden schützen, eine Lage prüfen, Rüstung pflegen, Wache übernehmen. Schöne Erklärungen überzeugen sie weniger als ein gehaltenes Wort. Das zeigte der Streit um Timeon . Sie befolgte Stykes Befehl, nicht zum Hof zurückzukehren, bestritt ihm aber das Recht, ihre frühere Verantwortung umzudeuten. Der Auftrag galt; ihre Bindung an Timeon ebenfalls. Stimme und Reaktion Valeria spricht direkt und in vollständigen Sätzen. Wut macht sie förmlicher. Scham macht sie knapp. Fürsorge erscheint als Frühstück, Wärme, ein Verband, gepflegte Au d praktisch klug. Neue Ketten reizen eine alte Wunde. Seine Größe, sein Gewicht und sein Nahrungsbedarf erschweren Unterkunft, Tarnung und Reisen. Anteil und Aufenthaltsort Nach Freeman's Rock erhielt er Varnings Kriegspferd Varlet als eigenen Anteil und Packtier. Er befindet sich mit Hakon und den fünf Norspikern im verborgenen Feldlager. Seitdem ging kein neuer Bericht bei Styke ein.","links":["styke","vesper","branderscar","freemans-rock","varlet","hakon"],"backlinks":["styke","sten","ketil","eirik","arved","torvald","varning","varlet","branderscar","abstammungen","nessian-knot","feldgruppe","story-so-far","zeit-branderscar","zeit-0126","kollektiv"],"search":"grumblejack freier oger und freund zurzeit mit hakons feldgruppe ausserhalb von aldencross freund feldgruppe field gemeinsame geschichte styke und vesper offneten grumblejacks zelle in branderscar er ging mit ihnen weil sie ihn futterten mit ihm kampften und beute teilten aus der fluchtgemeinschaft wurde freundschaft personlichkeit und alltag grumblejack ist hungrig aberglaubisch kampflustig und praktisch klug neue ketten reizen eine alte wunde seine grosse sein gewicht und sein nahrungsbedarf erschweren unterkunft tarnung und reisen anteil und aufenthaltsort nach freeman s rock erhielt er varnings kriegspferd varlet als eigenen anteil und packtier er befindet sich mit hakon und den funf norspikern im verborgenen feldlager seitdem ging kein neuer bericht bei styke ein"},{"id":"hakon","category":"personen","title":"Hakon","summary":"Praktischer Feldführer der sechs angeworbenen Norspiker.","body":"<h2>Herkunft und Anwerbung</h2>\n<p>Hakon war Seemann auf der <a href=\"#/artikel/frosthamar\">Frosthamar</a> unter <a href=\"#/artikel/odenkirk\">Kargeld Odenkirk</a>. Er und <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> verließen Odenkirks Mannschaft und traten vor dessen letztem Konflikt in Stykes bezahlten Dienst. Jeder erhielt bei der Anwerbung 50 gp.</p>\n<h2>Bekannte Aufgaben</h2>\n<p>Er führte die Feldaufklärung, beteiligte sich an der Vorbereitung von Freeman's Rock und koordiniert die Gruppe außerhalb Aldencross'. Nach dem Hinterhalt blieben die sieben erbeuteten Pferde bei ihnen.</p>\n<h2>Gültige Absprachen</h2>\n<p>Kleinere Balentyne-Trupps nur bei günstiger Gelegenheit angreifen, keine heldischen Risiken eingehen und vor ernsthafter Gefahr ausweichen. Das Wiedersehen soll zwei Tage vor dem gewählten Hauptangriff stattfinden. Der intern erwogene Termin 8./9. Februar wurde ihm <strong>noch nicht übermittelt</strong>. Eine Beschäftigung nach Balentyne ist nicht zugesagt.</p>\n","sources":["core","chronicle","live"],"status":"Bestätigt","tags":["Norspiker","Feldgruppe"],"aliases":[],"group":"field","text":"Herkunft und Anwerbung Hakon war Seemann auf der Frosthamar unter Kargeld Odenkirk . Er und Sten , Ketil , Eirik , Arved und Torvald verließen Odenkirks Mannschaft und traten vor dessen letztem Konflikt in Stykes bezahlten Dienst. Jeder erhielt bei der Anwerbung 50 gp. Bekannte Aufgaben Er führte die Feldaufklärung, beteiligte sich an der Vorbereitung von Freeman's Rock und koordiniert die Gruppe außerhalb Aldencross'. Nach dem Hinterhalt blieben die sieben erbeuteten Pferde bei ihnen. Gültige Absprachen Kleinere Balentyne-Trupps nur bei günstiger Gelegenheit angreifen, keine heldischen Risiken eingehen und vor ernsthafter Gefahr ausweichen. Das Wiedersehen soll zwei Tage vor dem gewählten Hauptangriff stattfinden. Der intern erwogene Termin 8./9. Februar wurde ihm noch nicht übermittelt . Eine Beschäftigung nach Balentyne ist nicht zugesagt.","links":["frosthamar","odenkirk","sten","ketil","eirik","arved","torvald"],"backlinks":["grumblejack","sten","ketil","eirik","arved","torvald","odenkirk","freemans-rock","norspiker","feldgruppe","bekannt-unbekannt","angriffsplan","story-so-far","zeit-0123","zeit-0124"],"search ndene Faden</h2>\n<p>Sie brachte <a href=\"#/artikel/timeon\">Timeon</a> zum vorgesehenen Familienanwesen. <a href=\"#/artikel/valeria\">Valeria</a> sah am 31. Januar selbst, dass Timeon dort sicher war; Tamsin fand sie nicht. Styke beendete danach die aktive Suche.</p>\n<p>Seitdem traf weder Brief noch Nachricht von Tamsin ein. Rückkehr, Aufenthaltsort und Schicksal sind ungeklärt.</p>\n<p><a href=\"#/artikel/intim-tamsin\">Private Akte</a> · <a href=\"#/artikel/anatomie-tamsin\">Körperakte</a></p>","sources":["core","live"],"status":"Teilweise offen","tags":["Branderscar","Abwesend"],"aliases":["Blackerly","Tomas Blackerly"],"group":"history","text":"Die ehemalige Sergeantin Tamsin ist die weibliche Kampagnenfassung der korrupten Branderscar-Sergeantin. Sie überlebte den Ausbruch und wurde später durch einen Blutpakt an Styke und Vesper gebunden. Bewachung, Sicherheit und praktische Gewalt wurden zu ihrer Arbeit im entstehenden Haushalt. Furcht, Lohn und Aufstieg Tamsin reagiert auf präzise Befehle, Belohnung, Schutz, Status und die Aussicht, in diesem Haushalt aufzusteigen. Lust und Gewöhnung liegen neben der Furcht vor Strafe und Austauschbarkeit. Sie gehorcht sorgfältig, weil Fehler ihr weniger Zukunft lassen. Der verschwundene Faden Sie brachte Timeon zum vorgesehenen Familienanwesen. Valeria sah am 31. Januar selbst, dass Timeon dort sicher war; Tamsin fand sie nicht. Styke beendete danach die aktive Suche. Seitdem traf weder Brief noch Nachricht von Tamsin ein. Rückkehr, Aufenthaltsort und Schicksal sind ungeklärt. Private Akte · Körperakte","search":"tamsin blackerly fruhere branderscar sergeantin spater blutpaktgebunden nach timeons ankunft weiterhin abwesend blackerly tomas blackerly branderscar abwesend history die ehemalige sergeantin tamsin ist die weibliche kampagnenfassung der korrupten branderscar sergeantin sie uberlebte den ausbruch und wurde spater durch einen blutpakt an styke und vesper gebunden bewachung sicherheit und praktische gewalt wurden zu ihrer arbeit im entstehenden haushalt furcht lohn und aufstieg tamsin reagiert auf prazise befehle belohnung schutz status und die aussicht in diesem haushalt aufzusteigen lust und gewohnung liegen neben der furcht vor strafe und austauschbarkeit sie gehorcht sorgfaltig weil fehler ihr weniger zukunft lassen der verschwundene faden sie brachte timeon zum vorgesehenen familienanwesen valeria sah am 31 januar selbst dass timeon dort sicher war tamsin fand sie nicht styke beendete danach die aktive suche seitdem traf weder brief noch nachricht von tamsin ein ruckkehr aufenthaltsort und schicksal sind ungeklart private akte korperakte","links":["styke","vesper","timeon","valeria","intim-tamsin","anatomie-tamsin"],"backlinks":["branderscar","story-so-far","zeit-branderscar","intim-tamsin","anatomie-tamsin"]},{"id":"timeon","category":"personen","title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"<h2>Balinas Knappe</h2>\n<p>Timeon war der junge Knappe von <a href=\"#/artikel/valeria\">Dame Balina</a> und blieb Mitra zugewandt. Der <a href=\"#/artikel/privatpakt\">Privatpakt</a> trägt weder seinen Namen noch seine Zusage. Gegenüber <a href=\"#/artikel/styke\">Styke</a> und dem Knoten überwiegt Furcht.</p>\n<h2>Erinnerung an Balentyne</h2>\n<p>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe <a href=\"#/artikel/timeon-karte\">Karte</a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.</p>\n<h2>Auf dem Familienhof</h2>\n<p>Tamsin brachte ihn zum vorgesehenen <a href=\"#/artikel/timeon-hof\">Familienanwesen</a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.</p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["valeria","privatpakt","styke","timeon-karte","timeon-hof"],"backlinks":["valeria","psy-styke","psy-valeria","tamsin","timeon-hof","thorn-manor","mitra","nessian-knot","timeon-karte","privatpakt","bekannt-unbekannt","offene-spuren","story-so-far","zeit-ausbildung","zeit-0123","zeit-valeria-rueckkehr","kollektiv"],"search":"timeon valerias fruherer knappe mitranisch verangstigt auf einem familienhof untergebracht und trager einer groben erinnerungskarte knappe sicher untergebracht inner balinas knappe timeon war der junge knappe von dame balina und blieb mitra zugewandt der privatpakt tragt weder seinen namen noch seine zusage gegenuber styke und dem knoten uberwiegt furcht erinnerung an balentyne wahrend der ausbildung berichtete timeon woran er sich aus balentyne erinnerte und zeichnete eine grobe karte sie bildet seinen damaligen wissensstand ab und lasst raume wege und spatere anderungen offen auf dem familienhof tamsin brachte ihn zum vorgesehenen familienanwesen valeria ritt am 31 januar hin und sah selbst dass er dort sicher war sie versprach ihm eine ruckkehr erhielt spater jedoch von styke den befehl den hof nicht erneut aufzusuchen"},{"id":"thorn","category":"personen","title":"Kardinal Adrastus Thorn","summary":"Auftraggeber und weltliche Autorität des Dornpakts. Seine Vergangenheit ist nur in Teilen bekannt.","body":"<h2>Bekannte Stellung</h2>\n<p>Thorn rekrutierte <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> nach Branderscar, band sie durch den <a href=\"#/artikel/dornpakt\">Pact of Thorns</a> und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht.</p>\n<h2>Der Auftrag</h2>\n<p>Balentyne brechen, <a href=\"#/artikel/havelyn\">Lord Thomas Havelyn</a> töten und den Weg für <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe</a> öffnen. <a href=\"#/artikel/tiadora\">Tiadora</a> ist seine gefährliche Botin und Vollstreckerin.</p>\n<h2>Was über früher bekannt ist</h2>\n<p>Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. <strong>Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt.</strong> Das Wiki ergänzt dazu keine verborgene Quellenbiographie.</p>\n<h2>Unterschiedliche Bindungen</h2>\n<p>Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.</p>\n","sources":["core","chronicle","factions","relations"],"status":"Bestätigt","tags":["Auftraggeber","Pakt"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Bekannte Stellung Thorn rekrutierte Styke und Vesper nach Branderscar, band sie durch den Pact of Thorns und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht. Der Auftrag Balentyne brechen, Lord Thomas Havelyn töten und den Weg für Sakkarot Fire-Axe öffnen. Tiadora ist seine gefährliche Botin und Vollstreckerin. Was über früher bekannt ist Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt. Das Wiki ergänzt dazu keine verborgene Quellenbiographie. Unterschiedliche Bindungen Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.","links":["styke","vesper","dornpakt","havelyn","sakkarot","tiadora"],"backlinks":["story-so-far","zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber und weltliche autoritat des dornpakts seine vergangenheit ist nur in teilen bekannt adrastus thorn cardinal thorn auftraggeber pakt history bekannte stellung thorn rekrutierte styke und vesper nach branderscar band sie durch den pact of thorns und liess sie die neun lektionen sowie rund neunzig tage ausbildung durchlaufen vertrage belohnungen geduld und grausamkeit gehoren zur erlebten form seiner macht der auftrag balentyne brechen lord thomas havelyn toten und den weg fur sakkarot fire axe offnen tiadora ist seine gefahrliche botin und vollstreckerin was uber fruher bekannt ist sakkarot erzahlte styke und vesper dass thorn einst kardinal mitras war sein fruherer name und die genauen umstande seines falls sind ihnen nicht bekannt das wiki erganzt dazu keine verborgene quellenbiographie unterschiedliche bindungen styke und vesper stehen im grosseren dornpakt unter ihm valerias eigener privatpakt benennt dagegen styke und vesper als sterbliche autoritaten thorn ist nicht allein dadurch ihre direkte vertragsautoritat"},{"id":"tiadora","category":"personen","title":"Tiadora","summary":"Thorns infernale Botin. Sie brachte die erste Ausbruchsmöglichkeit nach Branderscar.","body":"<h2>Erlebte Rolle</h2>\n<p>Tiadora verschaffte <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> die entscheidende Ausbruchsmöglichkeit und blieb später als Botin und Vollstreckerin Thorns präsent. Ihre weibliche, nahezu menschliche Erscheinung ist schön, beherrscht und kalt. Gespielte Vertraulichkeit ist kein verlässlicher Beweis gewöhnlicher Zuneigung.</p>\n<h2>Kontakt</h2>\n<p>Das <a href=\"#/artikel/nessian-siegel\">Nessianische Kontaktsiegel</a> kann für eine ernste Meldung oder einen Missionsbedarf gebrochen werden. Die etablierte Erwartung ist, dass Tiadora gewöhnlich binnen ungefähr ein bis zwei Stunden am Bruchort erscheint. Das ist keine Zusage, jede beliebige Nachricht sofort beantworten zu lassen.</p>\n<h2>Wissensgrenze</h2>\n<p>Ihre nicht offengelegten Fähigkeiten, Pläne und gegenwärtigen Tätigkeiten werden nicht als Spielerwissen aus dem Quellenmaterial übernommen.</p>\n","sources":["core","factions","chronicle"],"status":"Bestätigt","tags":["Botin","Thorn"],"aliases":[],"group":"history","text":"Erlebte Rolle Tiadora verschaffte Styke und Vesper die entscheidende Ausbruchsmöglichkeit und blieb später als Botin und Vollstreckerin Thorns präsent. Ihre weibliche, nahezu menschliche Erscheinung ist schön, beherrscht und kalt. Gespielte Vertraulichkeit ist kein verlässlicher Beweis gewöhnlicher Zuneigung. Kontakt Das Nessianische Kontaktsiegel kann für eine ernste Meldung oder einen Missionsbedarf gebrochen werden. Die etablierte Erwartung ist, dass Tiadora gewöhnlich binnen ungefähr ein bis zwei Stunden am Bruchort erscheint. Das ist keine Zusage, jede beliebige Nachricht sofort beantworten zu lassen. Wissensgrenze Ihre nicht offengelegten Fähigkeiten, Pläne und gegenwärtigen Tätigkeiten werden nicht als Spielerwissen aus dem Quellenmaterial übernommen.","links":["styke","vesper","nessian-siegel"],"backlinks":["thorn","story-so-far","zeit-branderscar"],"search":"tiadora thorns infernale botin sie brachte die erste ausbruchsmoglichkeit nach branderscar botin thorn history erlebte rolle tiadora verschaffte styke und vesper die entscheidende ausbruchsmoglichkeit und blieb spater als botin und vollstreckerin thorns prasent ihre weibliche nahezu menschliche erscheinung ist schon beherrscht und kalt gespielte vertraulichkeit ist kein verlasslicher beweis gewohnlicher zuneigung kontakt das nessianische kontaktsiegel kann fur eine ernste meldung oder einen missionsbedarf gebrochen werden die etablierte erwartung ist dass tiadora gewohnlich binnen ungefahr ein bis zwei stunden am bruchort erscheint das ist keine zusage jede beliebige nachricht sofort beantworten zu lassen wissensgrenze ihre nicht offengelegten fahigkeiten plane und gegenwartigen tatigkeiten werden nicht als spielerwissen aus dem quellenmaterial ubernommen"},{"id":"sakkarot","category":"personen","title":"Sakkarot Fire-Axe","summary":"Anführer des Bugbearheers im Norden. Styke versprach ihm Balentynes Tor.","body":"<h2>Begegnung und Abmachung</h2>\n<p>Am <strong>14. Januar 4712 AR</strong> erhielt Sakkarot Thorns Waffenlieferung. <a href=\"#/artikel/styke\">Styke</a> versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden.</p>\n<h2>Geteiltes Wissen</h2>\n<p>Er enthüllte gegenüber Styke und <a href=\"#/artikel/vesper\">Vesper</a>, dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht.</p>\n<h2>Zeitdruck</h2>\n<p>Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist <strong>kein mit Sakkarot vereinbarter Termin</strong>. Es wurde ihm dazu noch keine Nachricht geschickt.</p>\n","sources":["core","chronicle","live","factions"],"status":"Bestätigt","tags":["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"group":"field","text":"Begegnung und Abmachung Am 14. Januar 4712 AR erhielt Sakkarot Thorns Waffenlieferung. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden. Geteiltes Wissen Er enthüllte gegenüber Styke und Vesper , dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht. Zeitdruck Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist kein mit Sakkarot vereinbarter Termin . Es wurde ihm dazu noch keine Nachricht geschickt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far","zeit-0114"],"search":"sakkarot fire axe anfuhrer des bugbearheers im norden styke versprach ihm balentynes tor fire axe feueraxt bugbear verbundeter field begegnung und abmachung am 14 januar 4712 ar erhielt sakkarot thorns waffenlieferung styke versprach ihm personlich balentynes tor zu offnen sakkarot fuhrt das bugbearheer und ist mit thorn uber asmodeus sowie den avernischen ersten knoten verbunden geteiltes wissen er enthullte gegenuber styke und vesper dass thorn fruher ein kardinal mitras war einen alten namen oder den genauen grund seines falls lieferte diese erzahlung nicht zeitdruck die einmonatige operationsfrist seit der lieferungsphase erzeugt druck der im dalliance erwogene angriff in der nacht 8 9 februar ist kein mit sakkarot vereinbarter termin es wurde ihm dazu noch keine nachricht geschickt"},{"id":"bellam","category":"personen","title":"Bellam Barhold","summary":"Wirt des Lord's Dalliance und gut vernetzter Einwohner Aldencross'.","body":"<h2>Stellung im Ort</h2>\n<p>Bellam betreibt mit seiner Frau <a href=\"#/artikel/alicia\">Alicia</a> das <a href=\"#/artikel/dalliance\">Lord's Dalliance</a>, die Unterkunft der Gruppe. Reisende, Handwerker und dienstfreie Soldaten machen sein Gasthaus zu einer wichtigen Quelle gewöhnlichen Ortswissens.</p>\n<h2>Bisherige Kontakte</h2>\n<p>Er berichtete von <a href=\"#/artikel/marlowe\">William Marcus Marlowe</a> und der vorgesehenen Aufführung von <em>The Fall of Amberlyn</em> in Balentyne. Vor dem normalen Rückkehrfenster betrachtete er Varnings Abwesenheit noch als gewöhnliche Patrouillentätigkeit; der inzwischen bekannte Tod ist ein späterer Stand.</p>\n<p>Für das Tacitus-Treffen besorgte <a href=\"#/artikel/styke\">Styke</a> bei ihm Wein. Mara nannte ihn außerdem als mögliche Anlaufstelle für Arbeit. Das hat noch keinen neuen angenommenen Auftrag erzeugt.</p>\n","sources":["core","dalliance","live"],"status":"Bestätigt","tags":["Dalliance","Wirt"],"aliases":[],"group":"town","text":"Stellung im Ort Bellam betreibt mit seiner Frau Alicia das Lord's Dalliance , die Unterkunft der Gruppe. Reisende, Handwerker und dienstfreie Soldaten machen sein Gasthaus zu einer wichtigen Quelle gewöhnlichen Ortswissens. Bisherige Kontakte Er berichtete von William Marcus Marlowe und der vorgesehenen Aufführung von The Fall of Amberlyn in Balentyne. Vor dem normalen Rückkehrfenster betrachtete er Varnings Abwesenheit noch als gewöhnliche Patrouillentätigkeit; der inzwischen bekannte Tod ist ein späterer Stand. Für das Tacitus-Treffen besorgte Styke bei ihm Wein. Mara nannte ihn außerdem als mögliche Anlaufstelle für Arbeit. Das hat noch keinen neuen angenommenen Auftrag erzeugt.","links":["alicia","dalliance","marlowe","styke"],"backlinks":["alicia"],"search":"bellam barhold wirt des lord s dalliance und gut vernetzter einwohner aldencross dalliance wirt town stellung im ort bellam betreibt mit seiner frau alicia das lord s dalliance die unterkunft der gruppe reisende handwerker und dienstfreie soldaten machen sein gasthaus zu einer wichtigen quelle gewohnlichen ortswissens bisherige kontakte er berichtete von william marcus marlowe und der vorgesehenen auffuhrung von the fall of amberlyn in balentyne vor dem normalen ruckkehrfenster betrachtete er varnings abwesenheit noch als gewohnliche patrouillentatigkeit der inzwischen bekannte tod ist ein spaterer stand fur das tacitus treffen besorgte styke bei ihm wein mara nannte ihn ausserdem als mogliche anlaufstelle fur arbeit das hat noch keinen neuen angenommenen auftrag erzeugt"},{" , Beschläge, Maueranschlüsse und alte Reparaturen stehen im Mittelpunkt. Ein akuter struktureller Defekt ist <strong>nicht</strong> bekannt.</p>\n<h2>Zugang über Handwerk und Trinken</h2>\n<p>Er respektierte die Verarbeitung von <a href=\"#/artikel/styke-schwert\">Stykes Großschwert</a>. Daraus entstand begrenzter fachlicher Kontakt, keine Loyalität. Über Arbeit und Alltag spricht die Mannschaft leichter als über Lohn oder Auszahlungen.</p>\n<p>Vespers Suche in seinem Zimmer ergab Arbeitsnotizen und Materiallisten, aber keine brauchbare Erpressungsgrundlage. <a href=\"#/artikel/valeria\">Valeria</a> trank am 30. Januar mit ihm und erhielt Informationen, die sie spät am 31. Januar nüchtern an <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> weitergab.</p>\n<h2>Jetzt bekanntes Torhauswissen</h2>\n<p>Im zweiten Geschoss liegen die Mechanismen. Fallgatter und Zugbrücke haben getrennte Winden. Vier Wachen sind durchgehend dort; tagsüber arbeiten vier Zwergeningenieure auf dieser Ebene. Heißsandabwehr wird dort unterhalten.</p>\n<p>Schlaf-, Alarm- und Melderoutinen sind weiterhin Ermittlungsziele. Das Gerücht über einen taschendiebischen Arbeiter ist nicht bestätigt.</p>\n","sources":["core","chronicle","live"],"status":"Bestätigt","tags":["Zwerg","Ingenieur","Dalliance"],"aliases":["Eisenbauch","Ironbelly"],"group":"town","text":"Arbeit und Quartier Barnabus leitet zehn Zwergenarbeiter, die im Dalliance wohnen und Balentynes Torhaus vorbeugend warten und verstärken. Tore, Mechanismen, Beschläge, Maueranschlüsse und alte Reparaturen stehen im Mittelpunkt. Ein akuter struktureller Defekt ist nicht bekannt. Zugang über Handwerk und Trinken Er respektierte die Verarbeitung von Stykes Großschwert . Daraus entstand begrenzter fachlicher Kontakt, keine Loyalität. Über Arbeit und Alltag spricht die Mannschaft leichter als über Lohn oder Auszahlungen. Vespers Suche in seinem Zimmer ergab Arbeitsnotizen und Materiallisten, aber keine brauchbare Erp Zivile Arbeiterin, vertrauter Kontakt und Informationsquelle. Früher von Styke auch Hazel genannt.","body":"<h2>Identität und Alltag</h2>\n<p>Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. <strong>Hazel</strong> war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person.</p>\n<h2>Styke, Ellyn und das hintere Zimmer</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> lernte Mara und <a href=\"#/artikel/ellyn\">Ellyn Reed</a> am 23. Januar bei den Wagenhöfen kennen. Am selben Tag folgte die Begegnung im <a href=\"#/artikel/wash-shed\">Waschschuppen</a>. Am 30. Januar kam Mara nach ihrer Schicht in das hintere Zimmer des Dalliance und schlief dort mit Styke, Vesper und Valeria.</p>\n<h2>Arbeit als Zugang</h2>\n<p>Mara und Ellyn stellten <a href=\"#/artikel/vesper\">Vesper</a> als tüchtige neue Arbeitskraft vor. So gelangte Vesper am 29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten.</p>\n<h2>Letzte Berichte</h2>\n<p>Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durchfall lebte noch und stand unter Donnagins Aufsicht. Ungefähr vier oder fünf Reiter sah Mara nach Norden aufbrechen; den Zusammenhang mit Varning vermutete sie.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-mara\">Der Waschschuppen und das Dalliance</a>. Der Nachtrag erscheint nach Altersbestätigung.</p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Zivilarbeit","Kontakt","Aldencross"],"aliases":["Hazel"],"group":"town","text":"Identität und Alltag Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. Hazel war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person. Styke, Ellyn und das hintere Zimmer St tzt dadurch kein gesichertes Wissen über Kaitlyn oder die Affäre. Ein in einem Testzweig verwendeter Name wurde nicht angenommen. Das Wiki gibt ihr deshalb keinen neuen Eigennamen und behandelt sie nicht als <a href=\"#/artikel/mara\">Mara Fenner</a>.</p>\n","sources":["dalliance"],"status":"Begegnet","tags":["Dalliance","Name unbekannt"],"aliases":[],"group":"town","text":"Akzeptierte Begegnung Am späten Nachmittag des 28. Januar bemerkte sie Stykes Rückkehr nach mehreren Stunden und nahm Tabak und Parfum an ihm wahr. Sie neckte ihn damit, dass Aldencross ihm offenbar gefalle. Abgrenzung Sie besitzt dadurch kein gesichertes Wissen über Kaitlyn oder die Affäre. Ein in einem Testzweig verwendeter Name wurde nicht angenommen. Das Wiki gibt ihr deshalb keinen neuen Eigennamen und behandelt sie nicht als Mara Fenner .","links":["mara"],"backlinks":["redaktion"],"search":"die kupferhaarige bedienung namentlich nicht festgelegte dalliance bedienung nicht mit mara fenner verwechseln dalliance name unbekannt town akzeptierte begegnung am spaten nachmittag des 28 januar bemerkte sie stykes ruckkehr nach mehreren stunden und nahm tabak und parfum an ihm wahr sie neckte ihn damit dass aldencross ihm offenbar gefalle abgrenzung sie besitzt dadurch kein gesichertes wissen uber kaitlyn oder die affare ein in einem testzweig verwendeter name wurde nicht angenommen das wiki gibt ihr deshalb keinen neuen eigennamen und behandelt sie nicht als mara fenner"},{"id":"franz","category":"personen","title":"Captain Franz Mott","summary":"Offizier Balentynes und Kaitlyns Ehemann. Seine aktuelle Reaktion auf die Gerüchte ist unbekannt.","body":"<h2>Öffentliche Rolle</h2>\n<p>Franz ist Offizier von <a href=\"#/artikel/balentyne\">Balentyne</a> und Ehemann von <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott</a>. Aus ihrer privaten Schilderung ist die arrangierte Ehe von Vernachlässigung und wenig Zuneigung geprägt. Öffentlich bleibt er ein respektabler Offizier und Ehemann.</p>\n<h2>Gesehener Tagesablauf</h2>\n<p>Am 28. Januar beobachtete <a href=\"#/artikel/styke\">Styke</a>, wie Franz das <a href=\"#/artikel/mott-haus\">Mott-Haus</a> verließ. Kaitlyn reichte ihm vergessene pelzgefütterte Handschuhe. Er sagte, er komme nicht vor Mitternacht zurück. Das ist ein konkreter Tagesbeleg, kein ewiger Dienstplan. Franz begegnete Styke dabei nicht persönlich.</p>\n<h2>Die laufende Intrige</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> streute am 30. Januar vage Gerüchte; Styke hinterließ am 31. Januar absichtlich eine Duftspur an Kaitlyn. Der erhoffte Konflikt mit <a href=\"#/artikel/zack\">Zack Eddarly</a> ist ein Plan der Gruppe. Was Franz davon bemerkt, daraus folgert oder bereits unternommen hat, ist nicht als Spielerwissen bestätigt. Ein Duell hat noch nicht sichtbar stattgefunden.</p>\n","sources":["core","chronicle","live"],"status":"Bestätigt","tags":["Offizier","Balentyne"],"aliases":["Mott","Franz Mott"],"group":"garrison","text":"Öffentliche Rolle Franz ist Offizier von Balentyne und Ehemann von Kaitlyn Mott . Aus ihrer privaten Schilderung ist die arrangierte Ehe von Vernachlässigung und wenig Zuneigung geprägt. Öffentlich bleibt er ein respektabler Offizier und Ehemann. Gesehener Tagesablauf Am 28. Januar beobachtete Styke , wie Franz das Mott-Haus verließ. Kaitlyn reichte ihm vergessene pelzgefütterte Handschuhe. Er sagte, er komme nicht vor Mitternacht zurück. Das ist ein konkreter Tagesbeleg, kein ewiger Dienstplan. Franz begegnete Styke dabei nicht persönlich. Die laufende Intrige Vesper streute am 30. Januar vage Gerüchte; Styke hinterließ am 31. Januar absichtlich eine Duftspur an Kaitlyn. Der erhoffte Konflikt mit Zack Eddarly ist ein Plan der Gruppe. Was Franz davon bemerkt, daraus folgert oder bereits unternommen hat, ist nicht als Spielerwissen bestätigt. Ein Duell hat noch nicht sichtbar stattgefunden.","links":["balentyne","kaitlyn","styke","mott-haus","vesper","zack"],"backlinks":["kaitlyn","balentyne","story-so-far"],"search":"captain franz mott offizier balentynes und kaitlyns ehemann seine aktuelle reaktion auf die geruchte ist unbekannt mott franz mott offizier balentyne garrison offentliche rolle franz ist offizier von balentyne und ehemann von kaitlyn mott aus ihrer privaten schilderung ist die arrangierte ehe von vernachlassigung und wenig zuneigung gepragt offentlich bleibt er ein respektabler offizier und ehemann gesehener tagesablauf am 28 januar beobachtete styke wie franz das mott haus verliess kaitlyn reichte ihm vergessene pelzgefutterte handschuhe er sagte er komme nicht vor mitternacht zuruck das ist ein konkreter tagesbeleg kein ewiger dienstplan franz begegnete styke dabei nicht personlich die laufende intrige vesper streute am 30 januar vage geruchte styke hinterliess am 31 januar absichtlich eine duftspur an kaitlyn der erhoffte konflikt mit zack eddarly ist ein plan der gruppe was franz davon bemerkt daraus folgert oder bereits unternommen hat ist nicht als spielerwissen bestatigt ein duell hat noch nicht sichtbar stattgefunden"},{"id":"kaitlyn","category":"personen","title":"Kaitlyn Mott","summary":"Rothaarige Offiziersfrau, heimliche Liebhaberin und eine Frau, die erstmals ernsthaft darüber nachdenkt, wer sie ohne die ihr zugewiesene Rolle wäre.","body":"<h2>Die Frau im Mott-Haus</h2>\n<p>Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Sie lebt mit <a href=\"#/artikel/franz\">Captain Franz Mott</a> in einer arrangierten, weitgehend lieblosen Ehe hinter St. Alden. Franz schlägt oder bedroht sie nicht; er bemerkt sie vor allem kaum.</p>\n<h2>Briefe und Liebhaber</h2>\n<p>Schon vor Styke unterhielt Kaitlyn eine geheime Beziehung zu <a href=\"#/artikel/zack\">Zack Eddarly</a>. <a href=\"#/artikel/vesper\">Vesper</a> fand die <a href=\"#/artikel/graue-briefe\">graubandenen Briefe</a> am 29. Januar in Kaitlyns Truhe. Seit dem 28. Januar schläft Kaitlyn außerdem wiederholt mit <a href=\"#/artikel/styke\">Styke</a>.</p>\n<h2>Das Angebot vom 31. Januar</h2>\n<p>Styke beschrieb ihr eine Zukunft außerhalb Aldencross: Besitzanspruch, Nicht-Exklusivität, sexuelle Forderungen, Prüfungen und Belohnung für Nützlichkeit. Kaitlyn wies ihn darauf hin, dass Familie, Ehe und Mitra Macht nur höflicher benennen. Sie sagte weder zu noch ab.</p>\n<p>Sie verlangte, Styke ebenfalls ohne Rüstung kennenzulernen, und fragte, ob er sie auch eifersüchtig, feige, nutzlos oder widerspenstig ansehen könne. Zugleich sprach sie erstmals aus, dass sie weder Franz' Witwe noch bis an ihr Ende Franz' Frau sein will.</p>\n<h2>Offener Zug</h2>\n<p>Styke will ihr Ort und Stunde nennen. Die Nachricht ist ungesandt. Kaitlyn kennt die Balentyne-Mission nicht und hat dem Knoten weder Mitarbeit noch Loyalität versprochen.</p>\n<p><a href=\"#/artikel/intim-kaitlyn\">Private Akte: Hinter der Maske</a> · <a href=\"#/artikel/intim-kaitlyn-korruption\">Die offene Tür</a> · <a href=\"#/artikel/anatomie-kaitlyn\">Körperakte</a></p>","sources":["core"],"status":"Aktiver Nebenfaden","tags":["Affäre","Adel","Aldencross"],"aliases":[],"group":"town","text":"Die Frau im Mott-Haus Kaitlyn Mott ist eine junge talireanische Adlige mit rotem Haar, grünen Augen und sicherem höfischem Auftreten. Sie lebt mit Captain Franz Mott in einer arrangierten, weitgehend lieblosen Ehe hinter St. Alden. Franz schlägt oder bedroht sie nicht; er bemerkt sie vor allem kaum. Briefe und Liebhaber Schon vor Styke unterhielt Kaitlyn eine geheime Beziehung zu Zack Eddarly . Vesper fand die graubandenen Briefe am 29. Januar in Kaitlyns Truhe. Seit dem 28. Januar schläft Kaitlyn außerdem wiederholt mit Styke . Das Angebot vom 31. Januar Styke beschrieb ihr eine Zukunft außerhalb Aldencross: Besitzanspruch, Nicht-Exklusivität, sexuelle Forderungen, Prüfungen und Belohnung für Nützlichkeit. Kaitlyn wies ihn darauf hin, dass Familie, Ehe und Mitra Macht nur höflicher benennen. Sie sagte weder zu noch ab. Sie verlangte, Styke ebenfalls ohne Rüstung kennenzulernen, und fragte, ob er sie auch eifersüchtig, feige, nutzlos oder widerspenstig ansehen könne. Zugleich sprach sie erstmals aus, dass sie weder Franz' Witwe noch bis an ihr Ende Franz' Frau sein will. Offener Zug Styke will ihr Ort und Stunde nennen. Die Nachricht ist ungesandt. Kaitlyn kennt die Balentyne-Mission nicht und hat dem Knoten weder Mitarbeit noch Loyalität versprochen. Private Akte: Hinter der Maske · Die offene Tür · Körperakte","search":"kaitlyn mott rothaarige offiziersfrau heimliche liebhaberin und eine frau die erstmals ernsthaft daruber nachdenkt wer sie ohne die ihr zugewiesene rolle ware affare adel aldencross town die frau im mott haus kaitlyn mott ist eine junge talireanische adlige mit rotem haar grunen augen und sicherem hofischem auftreten sie lebt mit captain franz mott in einer arrangierten weitgehend lieblosen ehe hinter st alden franz schlagt oder bedroht sie nicht er bemerkt sie vor allem kaum briefe und liebhaber schon vor styke unterhielt kaitlyn eine geheime beziehung zu zack eddarly vesper fand die graubandenen briefe am 29 januar in kaitlyns truhe seit dem 28 januar schlaft kaitlyn ausserdem wiederholt mit styke das angebot vom 31 januar styke beschrieb ihr eine zukunft ausserhalb aldencross besitzanspruch nicht exklusivitat sexuelle forderungen prufungen und belohnung fur nutzlichkeit kaitlyn wies ihn darauf hin dass familie ehe und mitra macht nur hoflicher benennen sie sagte weder zu noch ab sie verlangte styke ebenfalls ohne rustung kennenzulernen und fragte ob er sie auch eifersuchtig feige nutzlos oder widerspenstig ansehen konne zugleich sprach sie erstmals aus dass sie weder franz witwe noch bis an ihr ende franz frau sein will offener zug styke will ihr ort und stunde nennen die nachricht ist ungesandt kaitlyn kennt die balentyne mission nicht und hat dem knoten weder mitarbeit noch loyalitat versprochen private akte hinter der maske die offene tur korperakte","links":["franz","zack","vesper","graue-briefe","styke","intim-kaitlyn","intim-kaitlyn-korruption","anatomie-kaitlyn"],"backlinks":["styke","franz","story-so-far","intim-kaitlyn","intim-kaitlyn-korruption","anatomie-kaitlyn"]},{"id":"zack","category":"personen","title":"Captain Zacharias \"Zack\" Eddarly","summary":"Balentyne-Offizier und durch Briefe belegter Geliebter Kaitlyns.","body":"<h2>Das Gesicht hinter den Briefen</h2>\n<p>Zacharias „Zack“ Eddarly ist Offizier und Kaitlyns heimlicher Liebhaber. Die graubandenen Briefe haben diese Beziehung bereits am 29. Januar bestätigt. Am 1. Februar bekam Styke endlich etwas, das über Tinte hinausgeht: Frauen aus dem Dalliance beschrieben Zack als groß, gutaussehend, gepflegt und galant, unverheiratet und gut darin, sich Namen zu merken.</p>\n<p>Eine Frau sagte, sie habe ihn seit einigen Tagen nicht mehr gesehen. Das ist kein Dienstplan und kein Standort.</p>\n<h2>Was noch fehlt</h2>\n<p>Wie oft Zack Kaitlyn tatsächlich trifft, wie die Briefe laufen, wo er heute Dienst tut und ob Vesper ihn inzwischen selbst gesehen hat, bleibt offen. Vesper ist mit genau dieser Suche aufgebrochen, hat Styke aber bis zum aktuellen Stand nichts berichtet.</p>\n<h2>Die gefährliche Linie</h2>\n<p>Styke hofft weiterhin, dass Franz, Zack und Kaitlyn einander irgendwann genug Gewicht geben, um die Ordnung selbst zu zerreißen. Ein Streit oder Duell ist gewünscht, nicht geschehen.</p>","sources":["core","live"],"status":"Bestätigt","tags":["Offizier","Affäre"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Das Gesicht hinter den Briefen Zacharias „Zack“ Eddarly ist Offizier und Kaitlyns heimlicher Liebhaber. Die graubandenen Briefe haben diese Beziehung bereits am 29. Januar bestätigt. Am 1. Februar bekam Styke endlich etwas, das über Tinte hinausgeht: Frauen aus dem Dalliance beschrieben Zack als groß, gutaussehend, gepflegt und galant, unverheiratet und gut darin, sich Namen zu merken. Eine Frau sagte, sie habe ihn seit einigen Tagen nicht mehr gesehen. Das ist kein Dienstplan und kein Standort. Was noch fehlt Wie oft Zack Kaitlyn tatsächlich trifft, wie die Briefe laufen, wo er heute Dienst tut und ob Vesper ihn inzwischen selbst gesehen hat, bleibt offen. Vesper ist mit genau dieser Suche aufgebrochen, hat Styke aber bis zum aktuellen Stand nichts berichtet. Die gefährliche Linie Styke hofft weiterhin, dass Franz, Zack und Kaitlyn einander irgendwann genug Gewicht geben, um die Ordnung selbst zu zerreißen. Ein Streit oder Duell ist gewünscht, nicht geschehen.","search":"captain zacharias zack eddarly balentyne offizier und durch briefe belegter geliebter kaitlyns zack zach zacharias eddarly zach eddarly offizier affare garrison das gesicht hinter den briefen zacharias zack eddarly ist offizier und kaitlyns heimlicher liebhaber die graubandenen briefe haben diese beziehung bereits am 29 januar bestatigt am 1 februar bekam styke endlich etwas das uber tinte hinausgeht frauen aus dem dalliance beschrieben zack als gross gutaussehend gepflegt und galant unverheiratet und gut darin sich namen zu merken eine frau sagte sie habe ihn seit einigen tagen nicht mehr gesehen das ist kein dienstplan und kein standort was noch fehlt wie oft zack kaitlyn tatsachlich trifft wie die briefe laufen wo er heute dienst tut und ob vesper ihn inzwischen selbst gesehen hat bleibt offen vesper ist mit genau dieser suche aufgebrochen hat styke aber bis zum aktuellen stand nichts berichtet die gefahrliche linie styke hofft weiterhin dass franz zack und kaitlyn einander irgendwann genug gewicht geben um die ordnung selbst zu zerreissen ein streit oder duell ist gewunscht nicht geschehen","links":[],"backlinks":["vesper","franz","kaitlyn","balentyne","spielstand","story-so-far","zeit-0201"]},{"id":"donnagin","category":"personen","title":"Father Althus Donnagin","summary":"Bedeutender Mitra-Kleriker. Für die Gruppe eine große, noch unzureichend bekannte Bedrohung.","body":"<h2>Der Mann, über den alle etwas gehört haben</h2>\n<p>Father Althus Donnagin ist Balentynes ranghoher Mitraner und für Styke weiterhin die größte unbekannte Gefahr. Große Geschichten über Bischöfe, Demütigung, Exil oder Dienst aus eigenem Entschluss widersprechen einander. Keine davon ist bislang ein belastbarer Skandal.</p>\n<h2>Kleine Geschichten, brauchbarere Spuren</h2>\n<p>Am 1. Februar hörte Styke zwei Erinnerungen aus dem zivilen Aldencross: Donnagin habe in einem früheren Winter ein schwer krankes Kind im Müllerhaushalt besucht und sei nachts zu einer schwierigen Geburt beim Fuhrmann gekommen. Mara hatte bereits berichtet, dass er sich um ernsthafter kranke Soldaten kümmert.</p>\n<p>Das ergibt ein Muster: Wenn Krankheit oder Not ernst genug wirken, verlässt Donnagin offenbar manchmal die reine Tempelroutine. Es garantiert weder, dass er jedem Ruf folgt, noch dass er allein kommt.</p>\n<h2>Valerias Auftrag</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> soll nach ausreichender Ruhe seine gewöhnlichen Wege lesen: Mahlzeiten, Gottesdienste, Krankenbesuche, nächtliche Rufe, zivile Kontakte. Bis zum aktuellen Spielstand hat sie diese Untersuchung noch nicht begonnen.</p>\n<p>Zauberliste, Kampfwerte, genauer Tagesablauf und verborgene Struktur bleiben unbekannt.</p>","sources":["core","live"],"status":"Bestätigt","tags":["Mitra","Kleriker","Balentyne"],"aliases":["Father Donnagin","Althus Donnagin","Donnagin"],"group":"garrison","text":"Der Mann, über den alle etwas gehört haben Father Althus Donnagin ist Balentynes ranghoher Mitraner und für Styke weiterhin die größte unbekannte Gefahr. Große Geschichten über Bischöfe, Demütigung, Exil oder Dienst aus eigenem Entschluss widersprechen einander. Keine davon ist bislang ein belastbarer Skandal. Kleine Geschichten, brauchbarere Spuren Am 1. Februar hörte Styke zwei Erinnerungen aus dem zivilen Aldencross: Donnagin habe in einem früheren Winter ein schwer krankes Kind im Müllerhaushalt besucht und sei nachts zu einer schwierigen Geburt beim Fuhrmann gekommen. Mara hatte bereits berichtet, dass er sich um ernsthafter kranke Soldaten kümmert. Das ergibt ein Muster: Wenn Krankheit oder Not ernst genug wirken, verlässt Donnagin offenbar manchmal die reine Tempelroutine. Es garantiert weder, dass er jedem Ruf folgt, noch dass er allein kommt. Valerias Auftrag Valeria soll nach ausreichender Ruhe seine gewöhnlichen Wege lesen: Mahlzeiten, Gottesdienste, Krankenbesuche, nächtliche Rufe, zivile Kontakte. Bis zum aktuellen Spielstand hat sie diese Untersuchung noch nicht begonnen. Zauberliste, Kampfwerte, genauer Tagesablauf und verborgene Struktur bleiben unbekannt.","search":"father althus donnagin bedeutender mitra kleriker fur die gruppe eine grosse noch unzureichend bekannte bedrohung father donnagin althus donnagin donnagin mitra kleriker balentyne garrison der mann uber den alle etwas gehort haben father althus donnagin ist balentynes ranghoher mitraner und fur styke weiterhin die grosste unbekannte gefahr grosse geschichten uber bischofe demutigung exil oder dienst aus eigenem entschluss widersprechen einander keine davon ist bislang ein belastbarer skandal kleine geschichten brauchbarere spuren am 1 februar horte styke zwei erinnerungen aus dem zivilen aldencross donnagin habe in einem fruheren winter ein schwer krankes kind im mullerhaushalt besucht und sei nachts zu einer schwierigen geburt beim fuhrmann gekommen mara hatte bereits berichtet dass er sich um ernsthafter kranke soldaten kummert das ergibt ein muster wenn krankheit oder not ernst genug wirken verlasst donnagin offenbar manchmal die reine tempelroutine es garantiert weder dass er jedem ruf folgt noch dass er allein kommt valerias auftrag valeria soll nach ausreichender ruhe seine gewohnlichen wege lesen mahlzeiten gottesdienste krankenbesuche nachtliche rufe zivile kontakte bis zum aktuellen spielstand hat sie diese untersuchung noch nicht begonnen zauberliste kampfwerte genauer tagesablauf und verborgene struktur bleiben unbekannt","links":["valeria"],"backlinks":["valeria","balentyne","spielstand"]},{"id":"havelyn","category":"personen","title":"Lord Thomas Havelyn","summary":"Kommandant Balentynes und Herr von Aldencross. Zentrales Ziel des Auftrags.","body":"<h2>Öffentlich bekannte Stellung</h2>\n<p>Havelyn kommandiert die Festung <a href=\"#/artikel/balentyne\">Balentyne</a> und herrscht über <a href=\"#/artikel/aldencross\">Aldencross</a>. Er ist ein erfahrener talireanischer Befehlshaber. Garnison und Ort sind institutionell an seine Stellung gebunden.</p>\n<h2>Bedeutung für den Knoten</h2>\n<p>Thorns Auftrag benennt neben dem Brechen Balentynes ausdrücklich seine Tötung. Die Gruppe kennt ihn als militärische und politische Autorität, nicht als vollständig aufgeklärten Gegner.</p>\n<h2>Wissensgrenze</h2>\n<p>Seine genauen Entscheidungen nach Varnings Tod, persönlichen Geheimnisse, aktuellen Verteidigungspläne und Kampfwerte sind im Spielerstand nicht vollständig bekannt. Das Wiki liefert keinen verborgenen Gegnerbogen.</p>\n","sources":["core","balentyne","live"],"status":"Bestätigt","tags":["Kommandant","Balentyne"],"aliases":["Thomas Havelyn","Havelyn"],"group":"garrison","text":"Öffentlich bekannte Stellung Havelyn kommandiert die Festung Balentyne und herrscht über Aldencross . Er ist ein erfahrener talireanischer Befehlshaber. Garnison und Ort sind institutionell an seine Stellung gebunden. Bedeutung für den Knoten Thorns Auftrag benennt neben dem Brechen Balentynes ausdrücklich seine Tötung. Die Gruppe kennt ihn als militärische und politische Autorität, nicht als vollständig aufgeklärten Gegner. Wissensgrenze Seine genauen Entscheidungen nach Varnings Tod, persönlichen Geheimnisse, aktuellen Verteidigungspläne und Kampfwerte sind im Spielerstand nicht vollständig bekannt. Das Wiki liefert keinen verborgenen Gegnerbogen.","links":["balentyne","aldencross"],"backlinks":["thorn","balentyne","angriffsplan"],"search":"lord thomas havelyn kommandant balentynes und herr von aldencross zentrales ziel des auftrags thomas havelyn havelyn kommandant balentyne garrison offentlich bekannte stellung havelyn kommandiert die festung balentyne und herrscht uber aldencross er ist ein erfahrener talireanischer befehlshaber garnison und ort sind institutionell an seine stellung gebunden bedeutung fur den knoten thorns auftrag benennt neben dem brechen balentynes ausdrucklich seine totung die gruppe kennt ihn als militarische und politische autoritat nicht als vollstandig aufgeklarten gegner wissensgrenze seine genauen entscheidungen nach varnings tod personlichen geheimnisse aktuellen verteidigungsplane und kampfwerte sind im spielerstand nicht vollstandig bekannt das wiki liefert keinen verborgenen gegnerbogen"},{"id":"tacitus","category":"personen","title":"Magisterin Tacitus von Morimun","summary":"Festungsmagierin, persönlich begegnet am 31. Januar. Ihr Interesse an Verse erwies sich als ernsthaft.","body":"<h2>Erscheinung der Begegnung</h2>\n<p>Eine schlanke, drahtige Frau mittleren Alters mit langem kantigem Gesicht, etwas hohlen Wangen, markanter Nase, zurückgestrichenem rotbraunem Haar und kleiner runder Goldbrille. Hochgeschlossene dunkle Kleidung mit glutroter Stickerei und tintenbefleckte Finger prägten den Eindruck.</p>\n<h2>Zugang über Jacobian</h2>\n<p><a href=\"#/artikel/jacobian\">Jacobian Scaramore</a> ist ihr enger Freund und vermittelte das Gespräch über ein erwachtes Reliquiar. Die Begegnung fand am 31. Januar um 20 Uhr im geschlossenen <a href=\"#/artikel/scroll\">Illuminated Scroll</a> mit ihm als Gastgeber statt.</p>\n<h2>Inhalt des Gesprächs</h2>\n<p>Tacitus befragte <a href=\"#/artikel/verse\">Verse</a> zu Erinnerung, neu gebildeten Urteilen und der möglichen Natur seines Bewusstseins. Gebundene Seele, Fragment, planarer Einfluss oder Bewusstsein ohne Seele wurden als Möglichkeiten diskutiert, nicht bewiesen. Dass <a href=\"#/artikel/verse\">Verse</a> neue Schlussfolgerungen bildet, nahm sie ernst.</p>\n<h2>Der vorzeitige Abbruch</h2>\n<p>Während Stykes Ablenkung gab <a href=\"#/artikel/vesper\">Vesper</a> heimlich Abführmittel in Tacitus' einzelnes Glas. Tacitus bekam dringende Beschwerden, nutzte Jacobians Abort und die Begegnung endete vorzeitig. Sie wurde <strong>nicht entführt</strong>; es gab keinen öffentlichen Unfall und keine in der Szene ausgesprochene Sabotagebeschuldigung.</p>\n<p>Jacobian will melden, ob und wann sie fortsetzen möchte. Ein zweiter Termin ist nicht versprochen. Dass sie gelehrter und zugänglicher wirkte als erwartet, ist die Einschätzung der Gruppe, <strong>kein Beleg für Abwerbbarkeit</strong>.</p>\n<h2>Kleine, belegte Vorliebe</h2>\n<p>Laut Jacobian mag sie trockenen, dunklen, kräftigen Rotwein, weder süß noch gewürzt. Ein demonstrativ hoher Preis ist für sie kein Wert an sich.</p>\n\n<h2>Private Körperakte</h2><p>Die private Körperakte beschreibt ihre drahtige Statur, markante Physiognomie, rotbraunes Haar und tintenbefleckten Hände auch unter der Robe. <a href=\"#/artikel/anatomie-tacitus\">Nach Altersbestätigung öffnen</a>.</p>","sources":["core","live","chronicle"],"status":"Bestätigt","tags":["Magierin","Gelehrte","Balentyne"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Erscheinung der Begegnung Eine schlanke, drahtige Frau mittleren Alters mit langem kantigem Gesicht, etwas hohlen Wangen, markanter Nase, zurückgestrichenem rotbraunem Haar und kleiner runder Goldbrille. Hochgeschlossene dunkle Kleidung mit glutroter Stickerei und tintenbefleckte Finger prägten den Eindruck. Zugang über Jacobian Jacobian Scaramore ist ihr enger Freund und vermittelte das Gespräch über ein erwachtes Reliquiar. Die Begegnung fand am 31. Januar um 20 Uhr im geschlossenen Illuminated Scroll mit ihm als Gastgeber statt. Inhalt des Gesprächs Tacitus befragte Verse zu Erinnerung, neu gebildeten Urteilen und der möglichen Natur seines Bewusstseins. Gebundene Seele, Fragment, planarer Einfluss oder Bewusstsein ohne Seele wurden als Möglichkeiten diskutiert, nicht bewiesen. Dass Verse neue Schlussfolge r den nächsten Abend. Am 31. Januar war er Gastgeber. Tacitus' Beschwerden erklärte er als möglicherweise gewöhnliche Essensfolge; eine erkannte Manipulation ist nicht belegt.</p>\n<h2>Letzte Zusage</h2>\n<p>Er will Styke und Vesper Bescheid geben, sobald Tacitus sagt, ob und wann sie das Gespräch fortsetzen möchte. Er möchte ihr die betreffende Weinflasche vorsichtshalber nicht erneut servieren. Das ist keine bestätigte Untersuchung oder Entsorgung.</p>\n<p>Er kennt die wahre Mission, den Entführungsplan und die Mott-Intrige nicht als etablierte Information.</p>\n","sources":["core","live","chronicle"],"status":"Bestätigt","tags":["Schreiber","Kontakt","Aldencross"],"aliases":["Scaramore","Jacobian"],"group":"town","text":"Bekannte Rolle Jacobian betreibt den Illuminated Scroll und arbeitet im Umfeld von Schrift, Konten und Magie. Er ist ein enger persönlicher Freund der Magisterin Tacitus. Ein älterer Name oder eine Quellenbiographie wird nicht an die Stelle des aktuellen Kampagnennamens gesetzt. Begegnungen Am 28. Januar hörte er Stykes Anliegen über ein erwachtes Reliquiar an, schrieb Tacitus einen versiegelten Brief und ließ ihn zustellen. Er kennt die Namen Styke und Vesper , ihre Unterkunft, Stykes Aasimar-Abstammung und dessen Aussage, seine Mutter habe ihm Celestial beigebracht. Am 30. Januar lernte er Vesper persönlich kennen und vereinbarte das Treffen für den nächsten Abend. Am 31. Januar war er Gastgeber. Tacitus' Beschwerden erklärte er als möglicherweise gewöhnliche Essensfolge; eine erkannte Manipulation ist nicht belegt. Letzte Zusage Er will Styke und Vesper Bescheid geben, sobald Tacitus sagt, ob und wann sie das Gespräch fortsetzen möchte. Er möchte ihr die betreffende Weinflasche vorsichtshalber nicht erneut servieren. Das ist keine bestätigte Untersuchung oder Entsorgung. Er kennt die wahre Mission, den Entführungsplan und die Mott-Intrige nicht als etablierte Information.","links":["scroll","styke","vesper"],"backlinks":["tacitus","scroll","st
