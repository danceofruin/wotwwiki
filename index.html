ebericht wurde am 28. januar auf dem vorderen tisch abgelegt. eine spatere mitnahme ist nicht belegt. spatere einordnung kaitlyn brachte den exorzisten-reisebericht am 7. februar zuruck ins dalliance. sie gehort inzwischen zum hornhaushalt; uber das spatere schicksal des hauses liegt kein neuer bericht vor.","initial":"D","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"st-alden","category":"orte","title":"St. Alden","summary":"Bekannter Orientierungspunkt für die Lage des Mott-Hauses.","body":"<h2>Gesicherter Ortsbezug<\/h2>\n<p>Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung.<\/p>\n<h2>Keine erfundene Besichtigung<\/h2>\n<p>Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.<\/p>\n","sources":["aldencross","chronicle"],"status":"Ortsbezug","tags":["Aldencross"],"aliases":[],"parent":"aldencross","text":"Gesicherter Ortsbezug Das Mott-Haus liegt hinter St. Alden; die schmale Gasse am Küchengarten führt in diese Richtung. Keine erfundene Besichtigung Im hier ausgewerteten Kampagnenstand ist kein vollständiger Innenraum, Personalplan oder gesonderter Besuch ausgearbeitet. Der Eintrag hält den tatsächlich bekannten Ortsbezug fest.","links":[],"backlinks":[],"search":"st. alden bekannter orientierungspunkt fur die lage des mott-hauses. aldencross  gesicherter ortsbezug das mott-haus liegt hinter st. alden; die schmale gasse am kuchengarten fuhrt in diese richtung. keine erfundene besichtigung im hier ausgewerteten kampagnenstand ist kein vollstandiger innenraum, personalplan oder gesonderter besuch ausgearbeitet. der eintrag halt den tatsachlich bekannten ortsbezug fest.","initial":"S"},{"id":"wash-shed","category":"orte","title":"Der Waschschuppen","summary":"Ort der privaten Begegnung mit Mara und Ellyn am 23. Januar.","body":"<h2>Der 23. Januar<\/h2>\n<p>Nach dem Kennenlernen bei den Wagenhöfen gingen <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/mara\">Mara<\/a> und <a href=\"#/artikel/ellyn\">Ellyn<\/a> für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver.<\/p>\n<h2>Der Ort danach<\/h2>\n<p>Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.<\/p>","sources":["chronicle","relations"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Waschhütte"],"parent":"aldencross","text":"Der 23. Januar Nach dem Kennenlernen bei den Wagenhöfen gingen Styke , Mara und Ellyn für einige private Stunden in den Waschschuppen. Mara gab anfangs das Tempo vor; Ellyn wurde im Verlauf aktiver. Der Ort danach Der Waschschuppen blieb ein gewöhnlicher Arbeitsraum. Dort lagert keine Ausrüstung des Knotens, und für spätere Treffen wurde nichts vorbereitet.","links":["styke","mara","ellyn"],"backlinks":["mara","ellyn"],"search":"der waschschuppen ort der privaten begegnung mit mara und ellyn am 23. januar. aldencross waschhutte der 23. januar nach dem kennenlernen bei den wagenhofen gingen styke , mara und ellyn fur einige private stunden in den waschschuppen. mara gab anfangs das tempo vor; ellyn wurde im verlauf aktiver. der ort danach der waschschuppen blieb ein gewohnlicher arbeitsraum. dort lagert keine ausrustung des knotens, und fur spatere treffen wurde nichts vorbereitet.","initial":"D"},{"id":"freemans-rock","category":"orte","title":"Freeman's Rock","summary":"Erkundeter Lagerplatz und Schauplatz des Hinterhalts auf Varnings Patrouille.","body":"<h2>Die Vorbereitung<\/h2>\n<p>Vom 24. bis 26. Januar kundschafteten <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/vesper\">Vesper<\/a>, <a href=\"#/artikel/valeria\">Valeria<\/a> und <a href=\"#/artikel/hakon\">Hakon<\/a> das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung.<\/p>\n<h2>Die Nacht des 26. Januar<\/h2>\n<p>Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt.<\/p>\n<h2>Spuren und Folgen<\/h2>\n<p>Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.<\/p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":["Freemans Rock"],"parent":"borderlands","text":"Die Vorbereitung Vom 24. bis 26. Januar kundschafteten Styke , Vesper , Valeria und Hakon das Gebiet aus. Der Rest der Feldgruppe blieb ungefähr einen halben Kilometer entfernt. Wald und Fluchtwege waren Teil der Vorbereitung. Die Nacht des 26. Januar Vesper formte das Kampfgebiet mit Nebel, Dunkelheit und unterstützender Sichtmagie. Styke griff von der landeinwärtigen Fluchtseite an. Alle sieben Patrouillenmitglieder starben; keine verbündeten Verluste sind festgestellt. Spuren und Folgen Leichen wurden begraben, der Ort bereinigt und die Spur der erbeuteten Pferde zu verschleiern versucht. Diese Maßnahmen garantierten nicht, dass die Tat unentdeckt blieb. Seit 31. Januar kennt Balentyne den Tod der Patrouille; welche Einzelspuren gefunden wurden, weiß Styke nicht vollständig.","links":["styke","vesper","valeria","hakon"],"backlinks":["zeit-0124"],"search":"freeman's rock erkundeter lagerplatz und schauplatz des hinterhalts auf varnings patrouille. grenzland freemans rock die vorbereitung vom 24. bis 26. januar kundschafteten styke , vesper , valeria und hakon das gebiet aus. der rest der feldgruppe blieb ungefahr einen halben kilometer entfernt. wald und fluchtwege waren teil der vorbereitung. die nacht des 26. januar vesper formte das kampfgebiet mit nebel, dunkelheit und unterstutzender sichtmagie. styke griff von der landeinwartigen fluchtseite an. alle sieben patrouillenmitglieder starben; keine verbundeten verluste sind festgestellt. spuren und folgen leichen wurden begraben, der ort bereinigt und die spur der erbeuteten pferde zu verschleiern versucht. diese massnahmen garantierten nicht, dass die tat unentdeckt blieb. seit 31. januar kennt balentyne den tod der patrouille; welche einzelspuren gefunden wurden, weiss styke nicht vollstandig.","initial":"F"},{"id":"tyburn","category":"orte","title":"Tyburn","summary":"Bekannter Wasserweg im Umfeld von Balentyne.","body":"<h2>Bedeutung für den Spielstand<\/h2>\n<p>Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne.<\/p>\n<h2>Begrenzter Karteneintrag<\/h2>\n<p>Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.<\/p>\n","sources":["chronicle","live"],"status":"Bekannt","tags":["Grenzland"],"aliases":[],"parent":"borderlands","text":"Bedeutung für den Spielstand Vespers Erkundung bestätigte, dass gewöhnliches Wasser für die Festung aus dem Tyburn geholt wird. Das Torhaus nutzt daneben eine separate kleinere Zisterne. Begrenzter Karteneintrag Es werden keine unbeobachteten Uferwege, Bewachungspläne oder genauen Entfernungen ergänzt. Die Versorgungsfunktion ist bekannt; eine vollständige Wasserkarte liegt damit nicht vor.","links":[],"backlinks":["kueche"],"search":"tyburn bekannter wasserweg im umfeld von balentyne. grenzland  bedeutung fur den spielstand vespers erkundung bestatigte, dass gewohnliches wasser fur die festung aus dem tyburn geholt wird. das torhaus nutzt daneben eine separate kleinere zisterne. begrenzter karteneintrag es werden keine unbeobachteten uferwege, bewachungsplane oder genauen entfernungen erganzt. die versorgungsfunktion ist bekannt; eine vollstandige wasserkarte liegt damit nicht vor.","initial":"T"},{"id":"timeon-hof","category":"orte","title":"Timeons sicherer Aufenthaltsort","summary":"Vorgesehenes Familienanwesen, am 31. Januar von Valeria persönlich überprüft.","body":"<h2>Gesicherter Stand<\/h2>\n<p>Tamsin lieferte <a href=\"#/artikel/timeon\">Timeon<\/a> an diesem geeigneten Familienanwesen ab. <a href=\"#/artikel/valeria\">Valeria<\/a> bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin.<\/p>\n<h2>Nicht ausgearbeitet<\/h2>\n<p>Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.<\/p>\n","sources":["live","core","relations"],"status":"Bekannt","tags":["Umland"],"aliases":[],"parent":"borderlands","text":"Gesicherter Stand Tamsin lieferte Timeon an diesem geeigneten Familienanwesen ab. Valeria bestätigte seine Sicherheit am 31. Januar. Sie fand danach keine belastbare Spur zu Tamsin. Nicht ausgearbeitet Ein neuer Hofname, exakte Adresse, Plan oder verlässlich vermessene Route werden hier nicht erfunden. Valeria hatte Timeon zugesagt, wiederzukommen, akzeptierte anschließend aber Stykes Rückkehrverbot.","links":["timeon","valeria"],"backlinks":["timeon"],"search":"timeons sicherer aufenthaltsort vorgesehenes familienanwesen, am 31. januar von valeria personlich uberpruft. umland  gesicherter stand tamsin lieferte timeon an diesem geeigneten familienanwesen ab. valeria bestatigte seine sicherheit am 31. januar. sie fand danach keine belastbare spur zu tamsin. nicht ausgearbeitet ein neuer hofname, exakte adresse, plan oder verlasslich vermessene route werden hier nicht erfunden. valeria hatte timeon zugesagt, wiederzukommen, akzeptierte anschliessend aber stykes ruckkehrverbot.","initial":"T"},{"id":"branderscar","category":"orte","title":"Branderscar","summary":"Gefängnis und Ausgangspunkt der gemeinsamen Flucht.","body":"<h2>Angenommene Geschichte<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> entkamen gemeinsam, bargen <a href=\"#/artikel/verse\">Verse<\/a> und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack<\/a>. <a href=\"#/artikel/tamsin\">Tamsin Blackerly<\/a> überlebte und wurde später paktgebunden. <a href=\"#/artikel/matilda\">Matilda Richter<\/a> wurde nichttödlich überwältigt und überlebte ebenfalls.<\/p>\n<h2>Gegen die Verwechslung<\/h2>\n<p><a href=\"#/artikel/valeria\">Valeria<\/a> beziehungsweise Dame Balina war <strong>keine Branderscar-Gefangene<\/strong>. Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung.<\/p>\n<h2>Rückblick, kein aktueller Lageplan<\/h2>\n<p>Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.<\/p>\n","sources":["chronicle","history"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Angenommene Geschichte Styke und Vesper entkamen gemeinsam, bargen Verse und befreiten Grumblejack . Tamsin Blackerly überlebte und wurde später paktgebunden. Matilda Richter wurde nichttödlich überwältigt und überlebte ebenfalls. Gegen die Verwechslung Valeria beziehungsweise Dame Balina war keine Branderscar-Gefangene . Ihre Gefangennahme gehört zu Thorns späterer Prüfungs- und Ausbildungsumgebung. Rückblick, kein aktueller Lageplan Die Flucht ist abgeschlossen. Das Wiki schreibt aus dem veröffentlichten Abenteuer keine ungesehenen Räume, Geheimnisse oder späteren Schicksale nachträglich in die Kampagne.","links":["styke","vesper","verse","grumblejack","tamsin","matilda","valeria"],"backlinks":["zeit-branderscar"],"search":"branderscar gefangnis und ausgangspunkt der gemeinsamen flucht. fruhere stationen  angenommene geschichte styke und vesper entkamen gemeinsam, bargen verse und befreiten grumblejack . tamsin blackerly uberlebte und wurde spater paktgebunden. matilda richter wurde nichttodlich uberwaltigt und uberlebte ebenfalls. gegen die verwechslung valeria beziehungsweise dame balina war keine branderscar-gefangene . ihre gefangennahme gehort zu thorns spaterer prufungs- und ausbildungsumgebung. ruckblick, kein aktueller lageplan die flucht ist abgeschlossen. das wiki schreibt aus dem veroffentlichten abenteuer keine ungesehenen raume, geheimnisse oder spateren schicksale nachtraglich in die kampagne.","initial":"B"},{"id":"thorn-manor","category":"orte","title":"Thorns Anwesen","summary":"Ort von Rekrutierung, Dornpakt, Neun Lektionen und langer Ausbildung.","body":"<h2>Ausbildungsphase<\/h2>\n<p>Nach der Flucht rekrutierte Thorn <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a>. Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus.<\/p>\n<h2>Balina und Timeon<\/h2>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon<\/a> gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen <a href=\"#/artikel/valeria\">Valeria<\/a> und einen eigenen Privatpakt an.<\/p>\n<h2>Datierung<\/h2>\n<p>Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.<\/p>","sources":["chronicle","history","relations"],"status":"Bekannt","tags":["Frühere Stationen"],"aliases":["Thorns Herrenhaus","Nine Lessons","Neun Lektionen"],"parent":"talingarde","text":"Ausbildungsphase Nach der Flucht rekrutierte Thorn Styke und Vesper . Rund neunzig Tage Ausbildung, die Neun Lektionen und der Dornpakt gehören zu dieser Station. Die White Ravens um Elise trainierten als zweiter Knoten im selben Haus. Balina und Timeon Dame Balina und ihr junger Knappe Timeon gerieten während dieser Phase in Gefangenschaft. Balina wurde schwer misshandelt und konditioniert. Später nahm sie den Namen Valeria und einen eigenen Privatpakt an. Datierung Die Chronik überliefert für diese Phase relative Ausbildungstage, aber keine vollständige Folge absoluter Kalenderdaten.","links":["styke","vesper","timeon","valeria"],"backlinks":["zeit-ausbildung"],"search":"thorns anwesen ort von rekrutierung, dornpakt, neun lektionen und langer ausbildung. fruhere stationen thorns herrenhaus nine lessons neun lektionen ausbildungsphase nach der flucht rekrutierte thorn styke und vesper . rund neunzig tage ausbildung, die neun lektionen und der dornpakt gehoren zu dieser station. die white ravens um elise trainierten als zweiter knoten im selben haus. balina und timeon dame balina und ihr junger knappe timeon gerieten wahrend dieser phase in gefangenschaft. balina wurde schwer misshandelt und konditioniert. spater nahm sie den namen valeria und einen eigenen privatpakt an. datierung die chronik uberliefert fur diese phase relative ausbildungstage, aber keine vollstandige folge absoluter kalenderdaten.","initial":"T"},{"id":"frosthamar","category":"orte","title":"Frosthamar","summary":"Das Schiff der nördlichen Waffenlieferung. Nach Odenkirks Tod zerstört.","body":"<h2>Reise und Begegnungen<\/h2>\n<p>Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor.<\/p>\n<h2>Ende des Schiffs<\/h2>\n<p>Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört.<\/p>\n<h2>Inventargrenze<\/h2>\n<p>Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.<\/p>\n","sources":["chronicle","history"],"status":"Historisch / zerstört","tags":["Frühere Stationen"],"aliases":[],"parent":"talingarde","text":"Reise und Begegnungen Die Nordreise verband den Knoten mit Sakkarot, der Patrouille unter Edward Sambryl und den Yutak. Elfenbein und der Narwalzahn gingen aus dem Handel hervor. Ende des Schiffs Sechs Seeleute verließen Odenkirks Mannschaft und nahmen Stykes Dienst an. Odenkirk starb; das Schiff wurde nach Bergung tragbarer Wertsachen und Thorns Zahlung zerstört. Inventargrenze Die Frosthamar ist kein noch verfügbares Transportmittel. Ihr früheres Deck, Vorräte und Beutestücke gelten nicht automatisch als heutiges Eigentum der Gruppe.","links":[],"backlinks":["odenkirk"],"search":"frosthamar das schiff der nordlichen waffenlieferung. nach odenkirks tod zerstort. fruhere stationen  reise und begegnungen die nordreise verband den knoten mit sakkarot, der patrouille unter edward sambryl und den yutak. elfenbein und der narwalzahn gingen aus dem handel hervor. ende des schiffs sechs seeleute verliessen odenkirks mannschaft und nahmen stykes dienst an. odenkirk starb; das schiff wurde nach bergung tragbarer wertsachen und thorns zahlung zerstort. inventargrenze die frosthamar ist kein noch verfugbares transportmittel. ihr fruheres deck, vorrate und beutestucke gelten nicht automatisch als heutiges eigentum der gruppe.","initial":"F"},{"id":"talingarde","category":"welt","title":"Talingarde","summary":"Isoliertes Inselkönigreich, beherrscht von Haus Darius und öffentlich geprägt durch Mitra.","body":"<h2>Öffentliches Selbstbild<\/h2>\n<p>Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse.<\/p>\n<h2>Herrschaft und Religion<\/h2>\n<p><a href=\"#/artikel/darius\">Haus Darius<\/a> regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt.<\/p>\n<h2>Die sechs Großräume<\/h2>\n<p>Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die <a href=\"#/artikel/watch-wall\">Watch Wall<\/a> sichert die nördlichen Zugänge.<\/p>\n<h2>Kampagnenanpassung<\/h2>\n<p>Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird <a href=\"#/artikel/golarion\">Golarion<\/a> verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.<\/p>\n","sources":["common","cultures","localrules"],"status":"Allgemeinwissen","tags":["Setting","Insel"],"aliases":[],"text":"Öffentliches Selbstbild Talingarde versteht sich als Reich von Recht, Ordnung und Güte. Priester pflegen Kranke, Ritter sollen Schwache schützen, die Krone und die Kirche stützen einander. Das Spielerhandout beschreibt dieses Selbstbild aus Sicht eines gewöhnlichen Einwohners; es ist kein Bericht über alle verborgenen Machtverhältnisse. Herrschaft und Religion Haus Darius regiert unter König Markadian V, dem Tapferen. Mitra prägt das öffentliche Leben. Die Verehrung Asmodeus' ist verboten und mit dem Feuertod bedroht. Andere nichtböse Religionen sind technisch nicht gleichermaßen verboten, gesellschaftlich aber stark zurückgedrängt. Die sechs Großräume Cambrian Ports, Heartland, Borderlands, Caer Bryr, Savage North und die Inseln der Yutak. Der Süden ist gemäßigter, der Norden kalt und vielfach verschneit. Die Watch Wall sichert die nördlichen Zugänge. Kampagnenanpassung Talingarde bleibt in Geschichte und Institutionen Talingarde. Als äußerer Weltraum wird Golarion verwendet, ohne exakte Lage, nächste Küste oder diplomatische Beziehungen bereits festzuschreiben.","links":["darius","watch-wall","golarion"],"backlinks":[],"search":"talingarde isoliertes inselkonigreich, beherrscht von haus darius und offentlich gepragt durch mitra. setting insel  offentliches selbstbild talingarde versteht sich als reich von recht, ordnung und gute. priester pflegen kranke, ritter sollen schwache schutzen, die krone und die kirche stutzen einander. das spielerhandout beschreibt dieses selbstbild aus sicht eines gewohnlichen einwohners; es ist kein bericht uber alle verborgenen machtverhaltnisse. herrschaft und religion haus darius regiert unter konig markadian v, dem tapferen. mitra pragt das offentliche leben. die verehrung asmodeus' ist verboten und mit dem feuertod bedroht. andere nichtbose religionen sind technisch nicht gleichermassen verboten, gesellschaftlich aber stark zuruckgedrangt. die sechs grossraume cambrian ports, heartland, borderlands, caer bryr, savage north und die inseln der yutak. der suden ist gemassigter, der norden kalt und vielfach verschneit. die watch wall sichert die nordlichen zugange. kampagnenanpassung talingarde bleibt in geschichte und institutionen talingarde. als ausserer weltraum wird golarion verwendet, ohne exakte lage, nachste kuste oder diplomatische beziehungen bereits festzuschreiben.","initial":"T"},{"id":"mitra","category":"welt","title":"Mitra","summary":"Herr des Lichts: Heilung, Güte und Führung im öffentlichen Glauben Talingardes.","body":"<h2>Öffentliche Glaubenswelt<\/h2>\n<p>Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden.<\/p>\n<h2>Personen und Institutionen<\/h2>\n<p>Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. <a href=\"#/artikel/valeria\">Valeria<\/a> wurde als Mitra-Ritterin geprägt, <a href=\"#/artikel/timeon\">Timeon<\/a> hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis.<\/p>\n<h2>Gegnerbild<\/h2>\n<p>Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.<\/p>\n","sources":["common","core","valeria"],"status":"Allgemeinwissen","tags":["Religion"],"aliases":[],"text":"Öffentliche Glaubenswelt Mitra wird als König, Heiler oder lebendige Flamme dargestellt. Licht, Heilung, Güte und Führung gehören zum öffentlich bekannten Glaubensbild. Seine Kirche ist in den Orten des Reiches präsent und eng mit Haus Darius verbunden. Personen und Institutionen Father Donnagin vertritt diesen Glauben im aktuellen Festungsumfeld. Valeria wurde als Mitra-Ritterin geprägt, Timeon hält an seiner eigenen mitranischen Orientierung fest. Der Hochkardinal heißt nach dem allgemeinen Spielerwissen Vitallian von Estyllis. Gegnerbild Asmodeus gilt als Erzfeind. Dass dieses Verhältnis politisch und rechtlich tief in Talingarde reicht, macht nicht jeden einzelnen Priester zur gleichen Persönlichkeit.","links":["valeria","timeon"],"backlinks":[],"search":"mitra herr des lichts: heilung, gute und fuhrung im offentlichen glauben talingardes. religion  offentliche glaubenswelt mitra wird als konig, heiler oder lebendige flamme dargestellt. licht, heilung, gute und fuhrung gehoren zum offentlich bekannten glaubensbild. seine kirche ist in den orten des reiches prasent und eng mit haus darius verbunden. personen und institutionen father donnagin vertritt diesen glauben im aktuellen festungsumfeld. valeria wurde als mitra-ritterin gepragt, timeon halt an seiner eigenen mitranischen orientierung fest. der hochkardinal heisst nach dem allgemeinen spielerwissen vitallian von estyllis. gegnerbild asmodeus gilt als erzfeind. dass dieses verhaltnis politisch und rechtlich tief in talingarde reicht, macht nicht jeden einzelnen priester zur gleichen personlichkeit.","initial":"M"},{"id":"asmodeus","category":"welt","title":"Asmodeus","summary":"Herr der Neun Höllen, verbotener Gott und oberste Bindung in den Pakten des Knotens.","body":"<h2>Öffentlich bekannte Geschichte<\/h2>\n<p>Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor.<\/p>\n<h2>Heutige Gefahr<\/h2>\n<p>Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen.<\/p>\n<h2>Kampagnenbezug<\/h2>\n<p>Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.<\/p>\n","sources":["common","relations","factions","house"],"status":"Allgemeinwissen","tags":["Religion","Pakte"],"aliases":[],"text":"Öffentlich bekannte Geschichte Asmodeus gehörte vor der Herrschaft der Darius zum talireanischen Pantheon, gefürchtet und respektiert. Markadian IV, der Eiferer, verbot den Glauben und ließ Tempel und führende Geistliche verfolgen. Das allgemeine Spielerwissen verortet die großen Säuberungen etwa zwanzig Jahre zuvor. Heutige Gefahr Öffentliche Asmodeus-Verehrung ist eine tödliche rechtliche Gefahr. Sie unterscheidet sich im Recht des Reiches von bloß gesellschaftlich missbilligten nichtbösen Nebenreligionen. Kampagnenbezug Thorn, der Dornpakt und der Avernische Knoten stehen im asmodeischen Rahmen. Valerias Privatpakt benennt Asmodeus als höchste Instanz, aber der Pakt allein verleiht ihr keine nicht vorhandenen Klassenfähigkeiten.","links":[],"backlinks":[],"search":"asmodeus herr der neun hollen, verbotener gott und oberste bindung in den pakten des knotens. religion pakte  offentlich bekannte geschichte asmodeus gehorte vor der herrschaft der darius zum talireanischen p r Geburt; Markadian heiratete nicht wieder. Daraus werden keine verborgenen Familiengeheimnisse abgeleitet. Historische Eckpunkte Markadian I, der Sieger, begründete die Dynastie und besiegte das frühere Haus Barca bei Tamberlyn. Seine öffentliche Erinnerung lebt in Denkmälern fort. Markadian IV, der Eiferer, steht für die Verfolgung des Asmodeus-Glaubens. Politischer Rahmen Haus Darius und die Kirche Mitras tragen gemeinsam die öffentliche Ordnung. Herkunft, Rang, Haushalt und Beziehungen sind wichtige soziale Größen, aber kein Ersatz für individuell bekannte Loyalitäten.","links":[],"backlinks":["talingarde"],"search":"haus darius und die krone die offentlich bekannte herrscherfamilie talingardes. adel geschichte markadian bellinda lucinda vitallian haus barca tamberlyn gegenwartige herrschaft markadian v, genannt der tapfere, ist konig. seine tochter bellinda ist nach dem allgemeinen spielerhandout zwanzig und unverheiratet. konigin lucinda starb bei der geburt; markadian heiratete nicht wieder. daraus werden keine verborgenen familiengeheimnisse abgeleitet. historische eckpunkte markadian i, der sieger, begrundete die dynastie und besiegte das fruhere haus barca bei tamberlyn. seine offentliche erinnerung lebt in denkmalern fort. markadian iv, der eiferer, steht fur die verfolgung des asmodeus-glaubens. politischer rahmen haus darius und die kirche mitras tragen gemeinsam die offentliche ordnung. herkunft, rang, haushalt und beziehungen sind wichtige soziale grossen, aber kein ersatz fur individuell bekannte loyalitaten.","initial":"H"},{"id":"watch-wall","category":"welt","title":"Die Watch Wall","summary":"Zwölf Festungen an Talingardes nördlicher Grenze.","body":"<h2>Öffentlich bekannter Zweck<\/h2>\n<p>Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze.<\/p>\n<h2>Aktueller Kampagnenausschnitt<\/h2>\n<p>Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.<\/p>\n","sources":["common","balentyne","live"],"status":"Allgemeinwissen","tags":["Grenze","Festungen"],"aliases":[],"text":"Öffentlich bekannter Zweck Die zwölf Grenzfestungen kontrollieren die Zugänge aus dem Savage North. Sie sollen das Reich gegen Überfälle und größere Einfälle schützen. Markadian V verdankt seinen Beinamen nach dem allgemeinen Wissen der Verteidigung dieser Grenze. Aktueller Kampagnenausschnitt Balentyne ist der erreichte Schauplatz. Die Gruppe kennt weder automatisch die inneren Pläne der anderen Festungen noch ihren gegenwärtigen Sicherheitszustand. Der Auftrag verlangt hier eine Bresche für Sakkarots Heer.","links":[],"backlinks":["talingarde"],"search":"die watch wall zwolf festungen an talingardes nordlicher grenze. grenze festungen  offentlich bekannter zweck die zwolf grenzfestungen kontrollieren die zugange aus dem savage north. sie sollen das reich gegen uberfalle und grossere einfalle schutzen. markadian v verdankt seinen beinamen nach dem allgemeinen wissen der verteidigung dieser grenze. aktueller kampagnenausschnitt balentyne ist der erreichte schauplatz. die gruppe kennt weder automatisch die inneren plane der anderen festungen noch ihren gegenwartigen sicherheitszustand. der auftrag verlangt hier eine bresche fur sakkarots heer.","initial":"D"},{"id":"borderlands","category":"welt","title":"Die Borderlands","summary":"Grenzland aus Militärversorgung, Landwirtschaft, Wäldern und harten Wintern.","body":"<h2>Alltag<\/h2>\n<p>Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut.<\/p>\n<h2>Lokale Verflechtung<\/h2>\n<p>Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle.<\/p>\n<h2>Tarnung<\/h2>\n<p>Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.<\/p>\n","sources":["cultures","aldencross"],"status":"Allgemeinwissen","tags":["Region","Kultur"],"aliases":[],"text":"Alltag Zwischen Heartland und Savage North prägen Patrouillen, alte Zwergenbauten, Höfe, Wald, See- und Flussverkehr den Alltag. Winter sind streng, Frühjahre nass, Schlamm und Nebel vertraut. Lokale Verflechtung Im Umfeld Aldencross' kennen Arbeiter, Fuhrleute, Soldaten und Handwerker viele Gesichter und Routinen. Dienst, Ehe, Handel, Reparaturen und Verluste verbinden Ort und Festung. Das ist praktische Ortskenntnis, keine Kenntnis aller Befehle. Tarnung Route, Beruf, Gerät, Sprache und Bürgen entscheiden, wie ein Fremder eingeordnet wird. Ein plausibler Nordhändler kann weniger auffallen als jemand, der vorgibt, seit Jahren zur lokalen Arbeiterschaft zu gehören.","links":[],"backlinks":[],"search":"die borderlands grenzland aus militarversorgung, landwirtschaft, waldern und harten wintern. region kultur  alltag zwischen heartland und savage north pragen patrouillen, alte zwergenbauten, hofe, wald, see- und flussverkehr den alltag. winter sind streng, fruhjahre nass, schlamm und nebel vertraut. lokale verflechtung im umfeld aldencross' kennen arbeiter, fuhrleute, soldaten und handwerker viele gesichter und routinen. dienst, ehe, handel, reparaturen und verluste verbinden ort und festung. das ist praktische ortskenntnis, keine kenntnis aller befehle. tarnung route, beruf, gerat, sprache und burgen entscheiden, wie ein fremder eingeordnet wird. ein plausibler nordhandler kann weniger auffallen als jemand, der vorgibt, seit jahren zur lokalen arbeiterschaft zu gehoren.","initial":"D"},{"id":"regionen","category":"welt","title":"Regionen und Städte Talingardes","summary":"Überblick über die bekannte Insel, ohne verborgene Abenteuerorte freizuschalten.","body":"<h2>Cambrian Ports<\/h2>\n<p>Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von <a href=\"#/artikel/styke\">Styke<\/a> genannten Lehrmeisters Zarik erwähnt.<\/p>\n<h2>Heartland<\/h2>\n<p>Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben.<\/p>\n<h2>Caer Bryr<\/h2>\n<p>Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen.<\/p>\n<h2>Savage North<\/h2>\n<p>Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen.<\/p>\n<h2>Inseln der Yutak<\/h2>\n<p>Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. <a href=\"#/artikel/white-tusk\">White Tusk<\/a> und Joseph sind individuelle Kontakte, nicht das gesamte Volk.<\/p>\n","sources":["common","cultures","history"],"status":"Allgemeinwissen","tags":["Geographie"],"aliases":["Matharyn","Ghastenhall","Daveryn","Caer Bryr","Iraen","Heartland","Savage North","Cambrian Ports"],"text":"Cambrian Ports Matharyn, Ghastenhall und Daveryn sind die großen urbanen Zentren an der Bucht von Cambria. Regierung, Reichtum, Gelehrsamkeit, Schiffahrt, Theater und Handwerk konzentrieren sich hier stärker. Daveryn wurde im Spiel auch als Herkunftsort des von Styke genannten Lehrmeisters Zarik erwähnt. Heartland Besiedeltes Ackerland, Dörfer, Marktstraßen, verwaltete Wälder, Pfarrleben und Landritter. Jahreszeit, Vorräte und lokale Pflichten prägen das Leben. Caer Bryr Großer Waldraum der Iraen, deren Gemeinschaften weitgehend außerhalb effektiver darischer Herrschaft und der alltäglichen Krone/Mitra-Verwaltung stehen. Kontakte können Handel, Distanz und Konflikt umfassen. Savage North Kalter Norden jenseits der gesicherten Grenzzugänge. Die südlichen Erzählungen über seine Bewohner sind keine vollständige neutrale Beschreibung. Sakkarots vereintes Heer ist eine politische Leistung, nicht der selbstverständliche Zustand aller nördlichen Gruppen. Inseln der Yutak Nördliche Inselgemeinschaften mit starkem Bezug zu Seefahrt, Jagd, Fischfang und Tausch. White Tusk und Joseph sind individuelle Kontakte, nicht das gesamte Volk.","links":["styke","white-tusk"],"backlinks":[],"search":"regionen und stadte talingardes uberblick uber die bekannte insel, ohne verborgene abenteuerorte freizuschalten. geographie matharyn ghastenhall daveryn caer bryr iraen heartland savage north cambrian ports cambrian ports matharyn, ghastenhall und daveryn sind die grossen urbanen zentren an der bucht von cambria. regierung, reichtum, gelehrsamkeit, schiffahrt, theater und handwerk konzentrieren sich hier starker. daveryn wurde im spiel auch als herkunftsort des von styke genannten lehrmeisters zarik erwahnt. heartland besiedeltes ackerland, dorfer, marktstrassen, verwaltete walder, pfarrleben und landritter. jahreszeit, vorrate und lokale pflichten pragen das leben. caer bryr grosser waldraum der iraen, deren gemeinschaften weitgehend ausserhalb effektiver darischer herrschaft und der alltaglichen krone/mitra-verwaltung stehen. kontakte konnen handel, distanz und konflikt umfassen. savage north kalter norden jenseits der gesicherten grenzzugange. die sudlichen erzahlungen uber seine bewohner sind keine vollstandige neutrale beschreibung. sakkarots vereintes heer ist eine politische leistung, nicht der selbstverstandliche zustand aller nordlichen gruppen. inseln der yutak nordliche inselgemeinschaften mit starkem bezug zu seefahrt, jagd, fischfang und tausch. white tusk und joseph sind individuelle kontakte, nicht das gesamte volk.","initial":"R"},{"id":"norspiker","category":"welt","title":"Norspiker","summary":"Nordische Seeleute mit Ulfen-Bezug in der Kampagnenanpassung.","body":"<h2>Kanon der Kampagne<\/h2>\n<p>Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt.<\/p>\n<h2>Lebenswelt und Individualität<\/h2>\n<p>Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz.<\/p>\n<p><a href=\"#/artikel/hakon\">Hakon<\/a>, <a href=\"#/artikel/sten\">Sten<\/a>, <a href=\"#/artikel/ketil\">Ketil<\/a>, <a href=\"#/artikel/eirik\">Eirik<\/a>, <a href=\"#/artikel/arved\">Arved<\/a>, <a href=\"#/artikel/torvald\">Torvald<\/a> und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.<\/p>\n","sources":["cultures","history"],"status":"Kampagnenkonversion","tags":["Kultur","Sprache"],"aliases":["Norspik","Ulfen","Skald"],"text":"Kanon der Kampagne Norspiker werden als Ulfen-assoziiertes Seefahrervolk behandelt. Norspik bleibt der gebrauchte Sprachname und gilt als mit Skald verwandt. Die Bezeichnung wird nicht einfach durch Ulfen ersetzt. Lebenswelt und Individualität Schiffe sind Arbeitsplatz, Eigentum, Unterkunft, Hierarchie und Überlebensraum. Handel, Fischfang, Kriegsfahrt, Lohnarbeit, Verwandtschaft und Eide können nebeneinander stehen. Begrenztes Common ist kein Zeichen geringer Intelligenz. Hakon , Sten , Ketil , Eirik , Arved , Torvald und Odenkirk bleiben individuelle Personen mit unterschiedlicher Stellung im akzeptierten Verlauf.","links":["hakon","sten","ketil","eirik","arved","torvald"],"backlinks":[],"search":"norspiker nordische seeleute mit ulfen-bezug in der kampagnenanpassung. kultur sprache norspik ulfen skald kanon der kampagne norspiker werden als ulfen-assoziiertes seefahrervolk behandelt. norspik bleibt der gebrauchte sprachname und gilt als mit skald verwandt. die bezeichnung wird nicht einfach durch ulfen ersetzt. lebenswelt und individualitat schiffe sind arbeitsplatz, eigentum, unterkunft, hierarchie und uberlebensraum. handel, fischfang, kriegsfahrt, lohnarbeit, verwandtschaft und eide konnen nebeneinander stehen. begrenztes common ist kein zeichen geringer intelligenz. hakon , sten , ketil , eirik , arved , torvald und odenkirk bleiben individuelle personen mit unterschiedlicher stellung im akzeptierten verlauf.","initial":"N"},{"id":"yutak","category":"welt","title":"Yutak","summary":"Nördliche Inselgemeinschaften, mit denen die Gruppe Handel trieb.","body":"<h2>Kulturrahmen<\/h2>\n<p>Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise.<\/p>\n<h2>Kontakte statt Pauschalbild<\/h2>\n<p><a href=\"#/artikel/white-tusk\">White Tusk<\/a> und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose.<\/p>\n<h2>Politischer Rahmen<\/h2>\n<p>Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.<\/p>\n","sources":["cultures","history","chronicle"],"status":"Allgemeinwissen","tags":["Kultur","Nordreise"],"aliases":[],"text":"Kulturrahmen Seewege, Fischfang, Jagd, haltbare Nahrung, Häute, Knochen, Wetterkenntnis und Verwandtschaft sind wichtige Grundlagen. Nützliche Werkzeuge, Metall, Stoff und Gebrauchsgüter können einen anderen Wert haben als bloße südliche Geldpreise. Kontakte statt Pauschalbild White Tusk und Joseph gehören zur abgeschlossenen Nordreise. Ihre Aufgaben, Autoritäten und Wissen sind nicht identisch. Der Handel brachte die später in Aldencross verkauften Elfenbeinlose. Politischer Rahmen Das Kulturdossier nennt einen alten Frieden Talingardes mit Yutak-Häuptlingen. Eine konkrete Begegnung bleibt trotzdem von vorherigen Erfahrungen, Bedarf und Umgang abhängig.","links":["white-tusk"],"backlinks":["sambryl"],"search":"yutak nordliche inselgemeinschaften, mit denen die gruppe handel trieb. kultur nordreise  kulturrahmen seewege, fischfang, jagd, haltbare nahrung, haute, knochen, wetterkenntnis und verwandtschaft sind wichtige grundlagen. nutzliche werkzeuge, metall, stoff und gebrauchsguter konnen einen anderen wert haben als blosse sudliche geldpreise. kontakte statt pauschalbild white tusk und joseph gehoren zur abgeschlossenen nordreise. ihre aufgaben, autoritaten und wissen sind nicht identisch. der handel brachte die spater in aldencross verkauften elfenbeinlose. politischer rahmen das kulturdossier nennt einen alten frieden talingardes mit yutak-hauptlingen. eine konkrete begegnung bleibt trotzdem von vorherigen erfahrungen, bedarf und umgang abhangig.","initial":"Y"},{"id":"abstammungen","category":"welt","title":"Abstammungen im bekannten Talingarde","summary":"Die im Kampagnenumfeld wichtigen Abstammungen und ihre Grenzen.","body":"<h2>Aasimar und Tiefling<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. <a href=\"#/artikel/vesper\">Vesper<\/a> wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich.<\/p>\n<h2>Menschen, Zwerge und Halblinge<\/h2>\n<p>Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit.<\/p>\n<h2>Oger und Burabar<\/h2>\n<p><a href=\"#/artikel/grumblejack\">Grumblejack<\/a> bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden.<\/p>\n<h2>Konstrukte und Tritonen<\/h2>\n<p><a href=\"#/artikel/verse\">Verse<\/a> ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. <a href=\"#/artikel/nerianus\">Nerianus<\/a> besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.<\/p>","sources":["ancestries","styke","vesper","cultures","verse"],"status":"Weltreferenz","tags":["Abstammungen"],"aliases":["Aasimar","Tiefling","Oger","Zwerg","Halbling","Bugbear","Burabar","Triton","Konstrukt"],"text":"Aasimar und Tiefling Styke ist ein hellhäutiger Aasimar mit eisblauen Augen und silbernen Höfen. Vesper wirkt auf den ersten Blick menschlich: alabasterfarbene Haut, schwarzes Haar mit blauem Schimmer, keine sichtbaren Hörner. Erst ihr langer Greifschwanz verrät das Asurablut deutlich. Menschen, Zwerge und Halblinge Menschen stellen die Mehrheit im bekannten Talingarde. Zwerge gehören zur alten Geschichte des Landes und stellen in Balentyne unter anderem das technische Torhauspersonal. Halblinge leben in eigenen Gemeinschaften und Berufen. Barnabus Eisenbauchs Trinksitten sind eine persönliche Gewohnheit. Oger und Burabar Grumblejack bringt enorme Reichweite, Kraft, Gewicht und Hunger in jede Reiseplanung. Die Bugbears des Nordens nennen sich häufig burabar. Sakkarot hat getrennte Stämme durch Waffen, Disziplin und das Versprechen eines Feldzugs zu einem Heer verbunden. Konstrukte und Tritonen Verse ist ein erwachtes Reliquiarwesen mit beschädigter Erinnerung, neuen eigenen Gedanken und der Fähigkeit, Vesper zu widersprechen. Nerianus besitzt tritonische Wasseranpassung; sein Wissen stammt aus seiner persönlichen Erfahrung, nicht aus seiner Abstammung.","links":["styke","vesper","grumblejack","verse","nerianus"],"backlinks":[],"search":"abstammungen im bekannten talingarde die im kampagnenumfeld wichtigen abstammungen und ihre grenzen. abstammungen aasimar tiefling oger zwerg halbling bugbear burabar triton konstrukt aasimar und tiefling styke ist ein hellhautiger aasimar mit eisblauen augen und silbernen hofen. vesper wirkt auf den ersten blick menschlich: alabasterfarbene haut, schwarzes haar mit blauem schimmer, keine sichtbaren horner. erst ihr langer greifschwanz verrat das asurablut deutlich. menschen, zwerge und halblinge menschen stellen die mehrheit im bekannten talingarde. zwerge gehoren zur alten geschichte des landes und stellen in balentyne unter anderem das technische torhauspersonal. halblinge leben in eigenen gemeinschaften und berufen. barnabus eisenbauchs trinksitten sind eine personliche gewohnheit. oger und burabar grumblejack bringt enorme reichweite, kraft, gewicht und hunger in jede reiseplanung. die bugbears des nordens nennen sich haufig burabar. sakkarot hat getrennte stamme durch waffen, disziplin und das versprechen eines feldzugs zu einem heer verbunden. konstrukte und tritonen verse ist ein erwachtes reliquiarwesen mit beschadigter erinnerung, neuen eigenen gedanken und der fahigkeit, vesper zu widersprechen. nerianus besitzt tritonische wasseranpassung; sein wissen stammt aus seiner personlichen erfahrung, nicht aus seiner abstammung.","initial":"A"},{"id":"golarion","category":"welt","title":"Golarion als Außenwelt","summary":"Die offene Umgebung Talingardes, nicht eine nachträgliche Verlegung der Inselgeschichte.","body":"<h2>Festgelegte Anpassung<\/h2>\n<p>Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt.<\/p>\n<h2>Erwähnte Zukunftswünsche<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit <a href=\"#/artikel/vesper\">Vesper<\/a>. Das ist belegt als <strong>Gespräch und Wunsch<\/strong>, nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.<\/p>\n","sources":["localrules","cultures","live"],"status":"Kampagnenkonversion","tags":["Außenwelt"],"aliases":["Absalom","Qadira"],"text":"Festgelegte Anpassung Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt. Erwähnte Zukunftswünsche Styke sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit Vesper . Das ist belegt als Gespräch und Wunsch , nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.","links":["styke","vesper"],"backlinks":["talingarde"],"search":"golarion als aussenwelt die offene umgebung talingardes, nicht eine nachtragliche verlegung der inselgeschichte. aussenwelt absalom qadira festgelegte anpassung die kampagne benutzt golarion fur den ursprunglich undefinierten aussenraum. talingardes eigene geschichte, religion, krone und institutionen bleiben erhalten. exakte meereslage, nachste kusten und politische beziehungen sind nicht pauschal gesetzt. erwahnte zukunftswunsche styke sprach am 31. januar von einer lebensverlangernden blume in qadira und einer gotterprufung in absalom als moglichen horizonten einer gemeinsamen zukunft mit vesper . das ist belegt als gesprach und wunsch , nicht als ausgewahlte folgequest oder verifiziertes detail einer solchen reise.","initial":"G"},{"id":"nessian-knot","category":"gruppen","title":"Der Nessianische Knoten","summary":"Der Nessische Knoten hat den Hornsporn erreicht; der verteilte Haushalt hält Farholde, Forschung, Handwerk und Logistik.","body":"<h2>Der Nessische Knoten<\/h2><p>Styke und Vesper führen gemeinsam; Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden. Hakon und seine fünf Männer arbeiten gegen Sold; Grumblejack bleibt freier Freund.<\/p><h2>Verteilte Operation<\/h2><p>Seit dem 27. Februar lebt der komplette erste Haushaltszug im Horn. Tacitus und Knittel nutzen das Hornlabor, Nella und Edda führen Versorgung, Tamsin die Zugänge, Hakon seine fünf Männer. Kaitlyn hält die vorgesehene Verbindung nach Farholde; Grumblejack wohnt in der Death’s Head Tavern.<\/p><h2>Auftrag und Kasse<\/h2><p>Der Auftrag betrifft Vetra-Kali und die Tears of Achlys. Die liquide Kasse beträgt 2.280 gp 5 sp; weitere 6.000 gp liegen als vorausbezahltes Fertigungsmaterial getrennt. Große untransportierte Tresorbestände sind keine liquide Reserve.<\/p><h2>Heutiger Haushalt und Mittel<\/h2><p>Der Knoten lebt seit dem 27. Februar im Horn. Die liquide Kasse beträgt 2.280 gp 5 sp; weitere 6.000 gp sind vorausbezahltes Fertigungsmaterial. Der große untransportierte Tresorbestand wird getrennt geführt. <a href=\"#/artikel/balentyne-beute\">Beute aus Balentyne<\/a><\/p>","sources":["live","chronicle","knot-pact","relations","transition","treasury"],"status":"Aktuell · 28. Februar morgens","tags":["Asmodeus","Knoten","Gefolge","Farholde"],"aliases":["Nessian Knot","Nessianischer Knoten"],"text":"Der Nessische Knoten Styke und Vesper führen gemeinsam; Valeria ist eigenständige Kerngefährtin und Feldführerin. Tamsin, Nella, Kaitlyn, Mirelle und Tacitus sind über den Compact gebunden. Hakon und seine fünf Männer arbeiten gegen Sold; Grumblejack bleibt freier Freund. Verteilte Operation Seit dem 27. Februar lebt der komplette erste Haushaltszug im Horn. Tacitus und Knittel nutzen das Hornlabor, Nella und Edda führen Versorgung, Tamsin die Zugänge, Hakon seine fünf Männer. Kaitlyn hält die vorgesehene Verbindung nach Farholde; Grumblejack wohnt in der Death’s Head Tavern. Auftrag und Kasse Der Auftrag betrifft Vetra-Kali und die Tears of Achlys. Die liquide Kasse beträgt 2.280 gp 5 sp; weitere 6.000 gp liegen als vorausbezahltes Fertigungsmaterial getrennt. Große untransportierte Tresorbestände sind keine liquide Reserve. Heutiger Haushalt und Mittel Der Knoten lebt seit dem 27. Februar im Horn. Die liquide Kasse beträgt 2.280 gp 5 sp; weitere 6.000 gp sind vorausbezahltes Fertigungsmaterial. Der große untransportierte Tresorbestand wird getrennt geführt. Beute aus Balentyne","links":["balentyne-beute"],"backlinks":[],"search":"der nessianische knoten der nessische knoten hat den hornsporn erreicht; der verteilte haushalt halt farholde, forschung, handwerk und logistik. asmodeus knoten gefolge farholde nessian knot nessianischer knoten der nessische knoten styke und vesper fuhren gemeinsam; valeria ist eigenstandige kerngefahrtin und feldfuhrerin. tamsin, nella, kaitlyn, mirelle und tacitus sind uber den compact gebunden. hakon und seine funf manner arbeiten gegen sold; grumblejack bleibt freier freund. verteilte operation seit dem 27. februar lebt der komplette erste haushaltszug im horn. tacitus und knittel nutzen das hornlabor, nella und edda fuhren versorgung, tamsin die zugange, hakon seine funf manner. kaitlyn halt die vorgesehene verbindung nach farholde; grumblejack wohnt in der death’s head tavern. auftrag und kasse der auftrag betrifft vetra-kali und die tears of achlys. die liquide kas em haushalt um; regelmassige stadtbesuche zur verbindung sind vorgesehen.","initial":"D","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"alerion","category":"gruppen","title":"Die Ritter des Alerion","summary":"Mitranischer Ritterorden und Valerias frühere institutionelle Heimat.","body":"<h2>Öffentliches Bild<\/h2>\n<p>Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat.<\/p>\n<h2>Kampagnenbezug<\/h2>\n<p>Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei <a href=\"#/artikel/styke\">Styke<\/a>, nicht bei <a href=\"#/artikel/valeria\">Valeria<\/a>.<\/p>\n","sources":["common","valeria","valsheet"],"status":"Allgemeinwissen","tags":["Orden","Mitra"],"aliases":[],"text":"Öffentliches Bild Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat. Kampagnenbezug Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei Styke , nicht bei Valeria .","links":["styke","valeria"],"backlinks":[],"search":"die ritter des alerion mitranischer ritterorden und valerias fruhere institutionelle heimat. orden mitra  offentliches bild der orden soll recht verteidigen, schwache schutzen und gerechtigkeit uben. nicht nur adlige konnen aufgenommen werden. nicht jeder ritter ist ein paladin, auch wenn der orden viele hervorgebracht hat. kampagnenbezug dame balina gehorte zu dieser ritterlichen welt. ihre glaubenskrise hat die fruhere ausbildung und verantwortung nicht ausgeloscht. das silberne saphir-symbol des ordens b  stufe 7  status das fruhere meisterarbeits-grossschwert wurde vor dem hornvorstoss extern auf +1 aufgewertet und wird von valeria gefuhrt. stufe 7 normal +12/+7 bei 2d6+7; mit power attack +10/+5 bei 2d6+13, jeweils vor smite, challenge und vorubergehenden eigenschaften.","initial":"V"},{"id":"mithral-ausruestung","category":"gegenstaende","title":"Mithralkettenhemden und Mithralschild","summary":"Das aktuelle Schutzpaket von Styke und Vesper.","body":"<h2>Styke<\/h2>\n<p>Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +5 einschließlich +1-Verzauberung, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt.<\/p>\n<h2>Vesper<\/h2>\n<p>Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 23, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt.<\/p>\n<h2>Stufe-7-Referenz<\/h2><p>Vesper hat mit ihrer aktuellen Ausrüstung AC 23, Touch 15 und Flat-Footed 18. Styke mit Inner Eye AC 22, Touch 17 und Flat-Footed 15. Frühere Zahlen im Beschaffungsbericht sind historische Profile.<\/p>","sources":["ssheet","vsheet","live"],"status":"Im Besitz","tags":["Styke / Vesper"],"aliases":[],"text":"Styke Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +5 einschließlich +1-Verzauberung, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt. Vesper Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 23, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt. Stufe-7-Referenz Vesper hat mit ihrer aktuellen Ausrüstung AC 23, Touch 15 und Flat-Footed 18. Styke mit Inner Eye AC 22, Touch 17 und Flat-Footed 15. Frühere Zahlen im Beschaffungsbericht sind historische Profile.","links":[],"backlinks":[],"search":"mithralkettenhemden und mithralschild das aktuelle schutzpaket von styke und vesper. styke / vesper  styke massgefertigtes mithral ertungen sind noch offen. Der Umzugstag zählt nicht als abgeschlossener Fertigungstag.<\/p>","sources":["ssheet","vsheet","valsheet"],"status":"Stykes Umhang abgegeben · Aufwertung nicht bestätigt","tags":["Kerntrio"],"aliases":[],"text":"Träger Styke trägt seit der Übergabe am 26. Februar Cloak of Resistance +2. Vesper und Valeria tragen +1. Ihre beiden Aufwertungen stehen noch in der bereits bezahlten Reihe. Kein Doppelbonus Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands. Fertigstellung am 26. Februar Stykes Umhang wurde von Tacitus und Knittel auf +2 aufgewertet und ist getragen. Vesper und Valeria tragen weiterhin +1; ihre Aufwertungen sind noch offen. Der Umzugstag zählt nicht als abgeschlossener Fertigungstag.","links":[],"backlinks":[],"search":"cloaks of resistance · +1 und +2 die +1-widerstandsumhange sind vorhandene ausrustung; stykes exemplar liegt zur aufwertung bei tacitus. kerntrio  trager styke tragt seit der ubergabe am 26. februar cloak of resistance +2. vesper und valeria tragen +1. ihre beiden aufwertungen stehen noch in der bereits bezahlten reihe. kein doppelbonus ein zweites addieren auf die tabellenwerte wurde denselben gegenstand doppelt anrechnen. ob ein kleidungsstuck in einer konkreten szene angelegt ist, bleibt eine frage des tatsachlichen zustands. fertigstellung am 26. februar stykes umhang wurde von tacitus und knittel auf +2 aufgewertet und ist getragen. vesper und valeria tragen weiterhin +1; ihre aufwertungen sind noch offen. der umzugstag zahlt nicht als abgeschlossener fertigungstag.","initial":"C","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"stirnreif","category":"gegenstaende","title":"Thorns eiserne Stirnreife","summary":"Thorns eiserne Stirnreife bleiben Tarnhilfen; ihre konkrete Aktivierung folgt der jeweiligen Szene.","body":"<h2>Funktion<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung.<\/p>\n<h2>Bisheriger Gebrauch<\/h2>\n<p>Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.<\/p><h2>Balentyne-Einsatz<\/h2><p>Styke aktivierte vor dem Balentyne-Einbruch eine Ritterverkleidung und bewegte sich damit durch die Festung. Dieser historische Einsatz beweist keine dauerhaft unverändert aktive Tarnung am heutigen Farholde-Rand.<\/p>","sources":["live","ssheet","vsheet"],"status":"Styke: Rittertarnung aktiv","tags":["Styke / Vesper"],"aliases":["Circlet","Iron Circlet"],"text":"Funktion Styke und Vesper besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung. Bisheriger Gebrauch Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens. Balentyne-Einsatz Styke aktivierte vor dem Balentyne-Einbruch eine Ritterverkleidung und bewegte sich damit durch die Festung. Dieser historische Einsatz beweist keine dauerhaft unverändert aktive Tarnung am heutigen Farholde-Rand.","links":["styke","vesper"],"backlinks":[],"search":"thorns eiserne stirnreife thorns eiserne stirnreife bleiben tarnhilfen; ihre konkrete aktivierung folgt der jeweiligen szene. styke / vesper circlet iron circlet funktion styke und vesper besitzen thorns eiserne stirnreife. sie verandern das aussere erscheinungsbild und erganzen die verschleierung des martialischen eindrucks ihrer ausrustung. bisheriger gebrauch styke nutzte die stirnreife bei seinen einkaufen am 31. januar fur wechselnde erscheinungen. seither gehort sie weiter zur verfugbaren tarn- und infiltrationsausrustung des nessischen knotens. balentyne-einsatz styke aktivierte vor dem balentyne-einbruch eine ritterverkleidung und bewegte sich damit durch die festung. dieser historische einsatz beweist keine dauerhaft unverandert aktive tarnung am heutigen farholde-rand.","initial":"T"},{"id":"alerion-symbol","category":"gegenstaende","title":"Silber-Saphir-Symbol des Alerion","summary":"Valerias früheres Ordenssymbol befindet sich bei Styke.","body":"<h2>Eigentums- und Beziehungsbezug<\/h2>\n<p>Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei <a href=\"#/artikel/styke\">Styke<\/a> und nicht in Valerias Ausrüstung.<\/p>\n<h2>Keine erfundene Funktion<\/h2>\n<p>Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.<\/p>\n","sources":["valsheet","ssheet","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Eigentums- und Beziehungsbezug Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei Styke und nicht in Valerias Ausrüstung. Keine erfundene Funktion Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.","links":["styke"],"backlinks":[],"search":"silber-saphir-symbol des alerion valerias fruheres ordenssymbol befindet sich bei styke. styke  eigentums- und beziehungsbezug das silberne symbol mit saphir gehort zur geschichte der ritterin balina. aktuell befindet es sich bei styke und nicht in valerias ausrustung. keine erfundene funktion eine zusatzliche magische wirkung oder ein inzwischen vollzogener ruckgabeakt ist nicht etabliert. der gegenstand bleibt zugleich erinnerungsstuck und materieller kontinuitatspunkt.","initial":"S"},{"id":"nessian-siegel","category":"gegenstaende","title":"Nessianisches Kontaktsiegel","summary":"Verbrauchtes Kontaktsiegel; Tiadora erschien nach Balentynes Fall persönlich im Dalliance.","body":"<h2>Thorns Tonsiegel<\/h2><p>Styke brach das Siegel, als Balentynes Ergebnis militärisch bereits unumkehrbar schien. Nach dem endgültigen Fall erschien Tiadora im Dalliance.<\/p><h2>Antwort<\/h2><p>Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.<\/p>","sources":["core","factions","live"],"status":"Verbraucht / beantwortet","tags":["Gruppe"],"aliases":[],"text":"Thorns Tonsiegel Styke brach das Siegel, als Balentynes Ergebnis militärisch bereits unumkehrbar schien. Nach dem endgültigen Fall erschien Tiadora im Dalliance. Antwort Sie überbrachte Thorns 5.000-gp-Erfolgszahlung und den Befehl, sofort zur Halstyn’s Folly aufzubrechen. Das Siegel selbst ist verbraucht.","links":[],"backlinks":[],"search":"nessianisches kontaktsiegel verbrauchtes kontaktsiegel; tiadora erschien nach balentynes fall personlich im dalliance. gruppe  thorns tonsiegel styke brach das siegel, als balentynes ergebnis militarisch bereits unumkehrbar schien. nach dem endgultigen fall erschien tiadora im dalliance. antwort sie uberbrachte thorns 5.000-gp-erfolgszahlung und den befehl, sofort zur halstyn’s folly aufzubrechen. das siegel selbst ist verbraucht.","initial":"N"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"<h2>Herkunft<\/h2>\n<p>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt <a href=\"#/artikel/styke\">Styke<\/a>.<\/p>\n<h2>Wissensgrenze<\/h2>\n<p>Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.<\/p>\n","sources":["chronicle","live"],"status":"Nicht identifiziert","tags":["Styke"],"aliases":[],"text":"Herkunft Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel behielt Styke . Wissensgrenze Zu welchem Schloss er gehört, ist offen. Ein Abenteuerplan oder gegnerisches Inventar liefert dafür keinen automatisch freigeschalteten Nutzen.","links":["styke"],"backlinks":["varning","zeit-0126"],"search":"varnings kleiner schlussel von styke behalten; passendes schloss bisher nicht identifiziert. styke  herkunft beute aus der operation an freeman's rock. die auffallige grossere ausrustung wurde ausserhalb aldencross' versteckt, den kleinen schlussel behielt styke . wissensgrenze zu welchem schloss er gehort, ist offen. ein abenteuerplan oder gegnerisches inventar liefert dafur keinen automatisch freigeschalteten nutzen.","initial":"V"},{"id":"beute-cache","category":"gegenstaende","title":"Versteckte Patrouillenausrüstung","summary":"Varnings Schild, Platte, Lanze und Bogen wurden aus dem Dalliance geborgen und reisen als Knoteneigentum auf der Folly.","body":"<h2>Dokumentierte Stücke<\/h2><p>+1-Schwerer Stahlschild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen stammen aus Varnings Patrouille.<\/p><h2>Aktueller Ort<\/h2><p>Valeria holte den Cache vor dem Angriff zurück. Beim organisierten Aufbruch wurde die tragbare Ausrüstung mit der übrigen Beute auf Halstyn’s Folly verladen.<\/p>","sources":["chronicle","live"],"status":"An Bord","tags":["Gruppe"],"aliases":[],"text":"Dokumentierte Stücke +1-Schwerer Stahlschild, Meisterarbeits-Vollplatte, Meisterarbeits-Lanze und Meisterarbeits-Kompositkurzbogen stammen aus Varnings Patrouille. Aktueller Ort Valeria holte den Cache vor dem Angriff zurück. Beim organisierten Aufbruch wurde die tragbare Ausrüstung mit der übrigen Beute auf Halstyn’s Folly verladen.","links":[],"backlinks":["zeit-0126"],"search":"versteckte patrouillenausrustung varnings schild, platte, lanze und bogen wurden aus dem dalliance geborgen und reisen als knoteneigentum auf der folly. gruppe  dokumentierte stucke +1-schwerer stahlschild, meisterarbeits-vollplatte, meisterarbeits-lanze und meisterarbeits-kompositkurzbogen stammen aus varnings patrouille. aktueller ort valeria holte den cache vor dem angriff zuruck. beim organisierten aufbruch wurde die tragbare ausrustung mit der ubrigen beute auf halstyn’s folly verladen.","initial":"V"},{"id":"ketten-beschlaege","category":"gegenstaende","title":"Ketten, Ringe, Nägel und Keile","summary":"Tacitus und Jacobian sind getrennt an den beiden vorbereiteten Wandketten im Tunnel gesichert.","body":"<h2>Installation<\/h2><p>Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang.<\/p>\n<p>Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten.<\/p>\n<h2>Grenze<\/h2><p>Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt.<\/p><h2>Aktuelle Verwendung<\/h2><p>Historisch: Tacitus und Jacobian wurden nach dem Dinner am 8. Februar gefesselt und ihrer erreichbaren Zauberwerkzeuge beraubt. Diese Lage endete am 9. Februar mit Jacobians Freilassung und Tacitus’ freiwilliger Entscheidung. Keine fortdauernde Gefangenschaft.<\/p><h2>Historischer Einsatz<\/h2><p>Die Gefangenenlage der Nacht vom 8. auf den 9. Februar ist beendet: Tacitus blieb freiwillig und unterschrieb den Compact, Jacobian wurde freigelassen. Die damaligen Beschläge sind kein aktueller Beleg für fortdauernde Gefangenschaft.<\/p>","sources":["dalliance","live","chronicle"],"status":"Belegt / zwei Gefangene","tags":["Ketten","Tunnel","Vorbereitung"],"aliases":["Ketten","Beschläge"],"text":"Installation Styke, Vesper und Valeria trugen die Ketten und Beschläge in den Tunnel und wählten eine verbreiterte alte Reparaturstelle mehrere Biegungen hinter dem Kellerzugang. Zwei getrennte Wandketten liegen eng am Mauerwerk. Valeria zog aus mehreren Winkeln an beiden Ankern; sie hielten. Grenze Die Stelle dient der körperlichen Fixierung eines gewöhnlichen Menschen. Komponenten, Sprache, Zauberfähigkeiten und magische Flucht müssen gesondert beherrscht werden. Die genaue Zahl übriger Nägel und Keile ist unbekannt. Aktuelle Verwendung Historisch: Tacitus und Jacobian wurden nach dem Dinner am 8. Februar gefesselt und ihrer erreichbaren Zauberwerkzeuge beraubt. Diese Lage endete am 9. Februar mit Jacobians Freilassung und Tacitus’ freiwilliger Entscheidung. Keine fortdauernde Gefangenschaft. Historischer Einsatz Die Gefangenenlage der Nacht vom 8. auf den 9. Februar ist beendet: Tacitus blieb freiwillig und unterschrieb den Compact, Jacobian wurde freigelassen. Die damaligen Beschläge sind kein aktueller Beleg für fortdauernde Gefangenschaft.","links":[],"backlinks":["zeit-0131-tag","intim-requisiten"],"search":"ketten, ringe, nagel und keile tacitus und jacobian sind getrennt an den beiden vorbereiteten wandketten im tunnel gesichert. ketten tunnel vorbereitung ketten beschlage installation styke, vesper und valeria trugen die ketten und beschlage in den tunnel und wahlten eine verbreiterte alte reparaturstelle mehrere biegungen hinter dem kellerzugang. zwei getrennte wandketten liegen eng am mauerwerk. valeria zog aus mehreren winkeln an beiden ankern; sie hielten. grenze die stelle dient der korperlichen fixierung eines gewohnlichen menschen. komponenten, sprache, zauberfahigkeiten und magische flucht mussen gesondert beherrscht werden. die genaue zahl ubriger nagel und keile ist unbekannt. aktuelle verwendung historisch: tacitus und jacobian wurden nach dem dinner am 8. februar gefesselt und ihrer erreichbaren zauberwerkzeuge beraubt. diese lag chst im Mott-Haus.<\/p><h2>Rückkehr am 7. Februar<\/h2><p>Kaitlyn brachte das wiedergeholte Buch am frühen Morgen zusammen mit der Duellwarnung ins Dalliance. Es liegt wieder beim Knoten und ist nicht Vespers roter Band.<\/p>","sources":["chronicle","live"],"status":"Im Besitz des Knotens","tags":["Styke"],"aliases":[],"text":"Erwerb und frühere Ablage Styke kaufte den mitranischen Exorzisten-Reisebericht am 28. Januar bei Jacobian. Er diente seiner Deckgeschichte gegenüber Kaitlyn und blieb zunächst im Mott-Haus. Rückkehr am 7. Februar Kaitlyn brachte das wiedergeholte Buch am frühen Morgen zusammen mit der Duellwarnung ins Dalliance. Es liegt wieder beim Knoten und ist nicht Vespers roter Band.","links":[],"backlinks":["zeit-0128"],"search":"der exorzisten-reisebericht stykes alter mitranischer reisebericht eines exorzisten; kaitlyn brachte ihn am 7. februar ins dalliance zuruck. styke  erwerb und fruhere ablage styke kaufte den mitranischen exorzisten-reisebericht am 28. januar bei jacobian. er diente seiner deckgeschichte gegenuber kaitlyn und blieb zunachst im mott-haus. ruckkehr am 7. februar kaitlyn brachte das wiedergeholte buch am fruhen morgen zusammen mit der duellwarnung ins dalliance. es liegt wieder beim knoten und ist nicht vespers roter band.","initial":"D","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"rotes-buch","category":"gegenstaende","title":"Vespers rotes Buch","summary":"Der rote Calistria-Band verändert sichtbar seinen Text; Herkunft und ungelesene Antwort bleiben offen.","body":"<h2>Das sichtbare Buch<\/h2><p>Vesper besitzt einen unbetitelten roten Calistria-Band über Sinnesentzug, Fesseln, Befehle und Machtwechsel. Frühere sichtbare Änderungen sind datiert und abgeschrieben; der Vergleich am 25. Februar zeigte damals keine weitere Änderung.<\/p><h2>Magische Untersuchung<\/h2><p>Die starke Aura umfasst Divination, Illusion und eine tiefere unbekannte Komponente. Identify ergab weder sichere Herkunft noch Artefaktklasse oder Befehls ht aus Gedächtnis ergänzt.","links":["styke","vesper"],"backlinks":[],"search":"der dornpakt angenommene bindung von styke und vesper an thorns verschworung. vertrag pact of thorns gesicherte bedeutung thorn rekrutierte styke und vesper nach branderscar und band sie durch den pact of thorns. im infernalen autoritatsrahmen steht asmodeus uber thorn, der als weltlicher vorgesetzter und auftraggeber wirkt. nicht mit jedem anderen pakt gleichsetzen valerias privater vertrag und tamsins blutpakt sind eigene bindungen. ihre teilnehmer und hierarchien durfen nicht zusammengezogen werden. ein nicht vorliegender vertragsvolltext wird hier nicht aus gedachtnis erganzt.","initial":"D"},{"id":"privatpakt","category":"fakten","title":"Valerias Privatpakt","summary":"Asmodeus zuerst, Styke und Vesper als sterbliche Autoritäten. Timeon ist kein Vertragspartner.","body":"<h2>Inhalt<\/h2>\n<p><a href=\"#/artikel/valeria\">Valeria<\/a> nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. <a href=\"#/artikel/timeon\">Timeon<\/a> ist kein Vertragspartner.<\/p>\n<h2>Der Streit um Timeon<\/h2>\n<p>Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen.<\/p>\n<h2>Mechanik<\/h2>\n<p>Valeria ist inzwischen <strong>Antipaladin 7 · Tyrant / Lord of Darkness<\/strong>. Der ältere Fighter-5-Stand ist historisch; der aktuelle Klassenstand ist angenommen und aktiv.<\/p>","sources":["valeria","relations","live","house"],"status":"Bestätigt","tags":["Vertrag","Valeria"],"aliases":[],"text":"Inhalt Valeria nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autorität orderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung.<\/p><h2>Kaitlyn<\/h2><p>Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte.<\/p><h2>Offen<\/h2><p>Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.<\/p>","sources":["live","relations","core"],"status":"Historisch · abgeschlossen","tags":["Intrige","Kaitlyn","Franz","Zack","Duell"],"aliases":[],"text":"Die gesetzte Spur Vesper inszenierte am 5. Februar einen Einbruch und ließ die echten Briefe zwischen Kaitlyn und Zack so zurück, dass Franz sie finden konnte. Der sichtbare Ausgang Franz forderte Zack zum Duell. Styke sah am 7. Februar, wie Zack Franz leicht verwundete und Franz ihn anschließend mit der Hellebarde tötete. Styke lockte Franz an Balentynes Tor; Captain Barhold entwaffnete ihn und begann eine Untersuchung. Kaitlyn Styke hielt sein Versprechen und berichtete Kaitlyn selbst von Zacks Tod. Sie kehrte danach ins Mott-Haus zurück, damit die Festung sie dort als Captain Motts Frau finden konnte. Offen Die spätere Entscheidung über Franz und die weiteren öffentlichen Folgen sind dem Knoten noch nicht bekannt.","links":[],"backlinks":[],"search":"mott, eddarly und kaitlyn die briefe fuhrten zum duell: zack ist tot, franz wurde zunachst festgesetzt und kaitlyn ist fur die untersuchung ins mott-haus zuruckgekehrt. intrige kaitlyn franz zack duell  die gesetzte spur vesper inszenierte am 5. februar einen einbruch und liess die echten briefe zwischen kaitlyn und zack so zuruck, dass franz sie finden konnte. der sichtbare ausgang franz forderte zack zum duell. styke sah am 7. februar, wie zack franz leicht verwundete und franz ihn anschliessend mit der  an; jacobian wurde freigelassen. tacitus jacobian 8. februar silence lebende gefangennahme  ausfuhrung nach balentynes bestatigtem fall sprach valeria zuerst uber verlust, dienst und die zerbrochene ordnung. vesper legte danach den wirklichen compact, forschung, mittel und stellung offen. jacobian wurde nicht als geisel benutzt. ergebnis jacobian wurde freigelassen. tacitus blieb, las den gesamten vertrag, unterschrieb in blut und schloss den carnal seal mit vesper als keeper. sie ist vollstandig gebundene und ubernimmt plankritik, forschung an verse und ungewohnlicher magie sowie arbeit an magischer ausrustung.","initial":"T"},{"id":"eintopf-plan","category":"vorhaben","title":"Mama Giuseppe und die Versorgung","summary":"Vesper gab am 8. Februar alle sechs Rattengiftpäckchen in den großen Eintopf; sie beobachtete keine Wirkung.","body":"<h2>Ausführung<\/h2><p>Vesper betrat Balentyne erneut mit Mara und Ellyn über die etablierte Arbeiterdeckung. Sie gab alle sechs kleinen Rattengiftpäckchen in Mama Giuseppes großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen.<\/p><h2>Wissensgrenze<\/h2><p>Vesper verließ die Festung, bevor eine Wirkung sichtbar wurde. Zahl, Stärke und militärische Bedeutung möglicher Erkrankungen sind dem Knoten nicht sicher bekannt. Der spätere Erfolg wird nicht rückwirkend dem Gift zugeschrieben.<\/p>","sources":["live","chronicle","timeline"],"status":"Historisch · abgeschlossen","tags":["Eintopf","Rattengift","8. Februar"],"aliases":[],"text":"Ausführung Vesper betrat Balentyne erneut mit Mara und Ellyn über die etablierte Arbeiterdeckung. Sie gab alle sechs kleinen Rattengiftpäckchen in Mama Giuseppes großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen. Wissensgrenze Vesper verließ die Festung, bevor eine Wirkung sichtbar wurde. Zahl, Stärke und militärische Bedeutung möglicher Erkrankungen sind dem Knoten nicht sicher bekannt. Der spätere Erfolg wird nicht rückwirkend dem Gift zugeschrieben.","links":[],"backlinks":["giuseppe"],"search":"mama giuseppe und die versorgung vesper gab am 8. februar alle sechs rattengiftpackchen in den grossen eintopf; sie beobachtete keine wirkung. eintopf rattengift 8. februar  ausfuhrung vesper betrat balentyne erneut mit mara und ellyn uber die etablierte arbeiterdeckung. sie gab alle sechs kleinen rattengiftpackchen in mama giuseppes grossen eintopf, bemerkte keinen zeugen und sah die ausgabe beginnen. wissensgrenze vesper verliess die festung, bevor eine wirkung sichtbar wurde. zahl, starke und militarische bedeutung moglicher erkrankungen sind dem knoten nicht sicher bekannt. der spatere erfolg wird nicht ruckwirkend dem gift zugeschrieben.","initial":"M"},{"id":"donnagin-plan","category":"vorhaben","title":"Donnagins Gewohnheiten ermitteln","summary":"Die geplante Routinenrecherche wurde nicht mehr ausgeführt; Donnagin starb beim Einbruch am 9. Februar.","body":"<h2>Ursprünglicher Ansatz<\/h2><p>Valeria wollte Donnagins Mahlzeiten, Gottesdienste, Krankenbesuche, Kontakte und Wege über glaubwürdige mitranische Fragen verstehen.<\/p><h2>Ausgang<\/h2><p>Die Recherche wurde vor der Angriffsnacht nicht mehr durchgeführt. Beim Einbruch fand das Kerntrio Donnagin in seinem Bereich und tötete ihn im Kampf. Der offene Ermittlungspunkt ist damit beendet.<\/p>","sources":["live","core"],"status":"Historisch · abgeschlossen","tags":["Ermittlung","Valeria"],"aliases":[],"text":"Ursprünglicher Ansatz Valeria wollte Donnagins Mahlzeiten, Gottesdienste, Krankenbesuche, Kontakte und Wege über glaubwürdige mitranische Fragen verstehen. Ausgang Die Recherche wurde vor der Angriffsnacht nicht mehr durchgeführt. Beim Einbruch fand das Kerntrio Donnagin in seinem Bereich und tötete ihn im Kampf. Der offene Ermittlungspunkt ist damit beendet.","links":[],"backlinks":[],"search":"donnagins gewohnheiten ermitteln die geplante routinenrecherche wurde nicht mehr ausgefuhrt; donnagin starb beim einbruch am 9. februar. ermittlung valeria  ursprunglicher ansatz va
