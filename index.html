ontrollierten die Reisenden an einer Steinbrücke; die Geschichte von der überfälligen Freundin hielt. Im Gasthaus traf Styke Nella. Spätere Nachfragen verbanden Tamsin mit Darran Vell.<\/p>\n<h2>Das erste Schafgehege<\/h2><p>Styke beendete Tamsins bewaffneten Streit ohne Kampf. Darran erhielt sein Hauptbuch, Tamsin 18 gp und einen Silberring. Vesper entzog Tamsin anschließend den Rang.<\/p>","sources":["chronicle","timeline","south-mill","tamsin-current"],"status":"Historisch · angenommene Ereignisse","tags":["2. Februar","Tamsin","Mühlenbezirk"],"dateLabel":"2. Februar 4712","text":"Abreise Styke kaufte verkleidet sechs Päckchen Rattengift und versteckte sie im Dalliance. Danach mietete die Gruppe drei Pferde für drei Tage und ritt nach Süden. Mühlenbezirk Vier Soldaten kontrollierten die Reisenden an einer Steinbrücke; die Geschichte von der überfälligen Freundin hielt. Im Gasthaus traf Styke Nella. Spätere Nachfragen verbanden Tamsin mit Darran Vell. Das erste Schafgehege Styke beendete Tamsins bewaffneten Streit ohne Kampf. Darran erhielt sein Hauptbuch, Tamsin 18 gp und einen Silberring. Vesper entzog Tamsin anschließend den Rang.","links":[],"backlinks":[],"search":"sudwarts zu tamsin rattengift, drei mietpferde, eine strassenkontrolle und die spur von nella zu darran vell. 2. februar tamsin muhlenbezirk  abreise styke kaufte verkleidet sechs packchen rattengift und versteckte sie im dalliance. danach mietete die gruppe drei pferde fur drei tage und ritt nach suden. muhlenbezirk vier soldaten kontrollierten die reisenden an einer steinbrucke; die geschichte von der uberfalligen freundin hielt. im gasthaus traf styke nella. spatere nachfragen verbanden tamsin mit darran vell. das erste schafgehege styke beendete tamsins bewaffneten streit ohne kampf. darran erhielt sein hauptbuch, tamsin 18 gp und einen silberring. vesper entzog tamsin anschliessend den rang.","aliases":[],"initial":"S"},{"id":"zeit-0202-vell","category":"chronik","title":"Vells letzte Nacht","summary":"Der Knoten kehrte zur Byre zurück; Darran und vier Helfer starben, Nella sah den Preis.","body":"<h2>Das Gefecht<\/h2><p>Vesper setzte Dancing Darkness, Euphoric Cloud und Witness to Glory ein. Styke und Valeria töteten den größten Teil der Gegner. Kein Mitglied der Gruppe wurde verletzt.<\/p>\n<h2>Nellas Blick<\/h2><p>Nella sah einen ergebenen und einen flehenden Mann sterben, erbrach sich und nannte einen der Toten „verheiratet“. Sie ging trotzdem nicht zurück ins Gasthaus.<\/p>\n<h2>Spuren<\/h2><p>Die Byre wurde als krimineller Streit hergerichtet. Drei Pferde legten eine falsche Spur und wurden freigelassen; zwei blieben zurück. Hauptbuch und schmutzige Papiere blieben am Ort.<\/p>","sources":["chronicle","timeline","live","south-mill"],"status":"Historisch · angenommene Ereignisse","tags":["2. Februar","Darran Vell","Nella"],"dateLabel":"2. Februar 4712, Abend","text":"Das Gefecht Vesper setzte Dancing Darkness, Euphoric Cloud und Witness to Glory ein. Styke und Valeria töteten den größten Teil der Gegner. Kein Mitglied der Gruppe wurde verletzt. Nellas Blick Nella sah einen ergebenen und einen flehenden Mann sterben, erbrach sich und nannte einen der Toten „verheiratet“. Sie ging trotzdem nicht zurück ins Gasthaus. Spuren Die Byre wurde als krimineller Streit hergerichtet. Drei Pferde legten eine falsche Spur und wurden freigelassen; zwei blieben zurück. Hauptbuch und schmutzige Papiere blieben am Ort.","links":[],"backlinks":[],"search":"vells letzte nacht der knoten kehrte zur byre zuruck; darran und vier helfer starben, nella sah den preis. 2. februar darran vell nella  das gefecht vesper setzte dancing darkness, euphoric cloud und witness to glory ein. styke und valeria toteten den grossten teil der gegner. kein mitglied der gruppe wurde verletzt. nellas blick nella sah einen ergebenen und einen flehenden mann sterben, erbrach sich und nannte einen der toten „verheiratet“. sie ging trotzdem nicht zuruck ins gasthaus. spuren die byre wurde als krimineller streit hergerichtet. drei pferde legten eine falsche spur und wurden freigelassen; zwei blieben zuruck. hauptbuch und schmutzige papiere blieben am ort.","aliases":[],"initial":"V"},{"id":"zeit-0202-pakt","category":"chronik","title":"Nella tritt in den Knoten","summary":"Nach Vells Ende hörte Nella den vollständigen Compact und setzte ihr Blut darunter.","body":"<h2>Entscheidung<\/h2><p>Nella verlangte einen Weg über das Kochen hinaus. Nach Pflichten, Gegenleistungen und Rangfolge sagte sie: „Ja. Ich will den Pakt.“<\/p>\n<h2>Siegel<\/h2><p>Vesper schrieb, Valeria las vor, Nella schnitt die linke Hand und setzte als Einzige ihr Blut unter den Text. Der Compact wurde geschlossen.<\/p>\n<h2>Erster Auftrag<\/h2><p>Bis 7. Februar führt Nella Tamsin für einen Botengang zu Hakon und den Versuch, Nellas Schwester samt Ehemann aus dem Kriegsgebiet zu bewegen.<\/p>","sources":["chronicle","timeline","nella","knot-pact"],"status":"Historisch · angenommene Ereignisse","tags":["2. Februar","Nella","Compact"],"dateLabel":"2. Februar 4712, später Abend","text":"Entscheidung Nella verlangte einen Weg über das Kochen hinaus. Nach Pflichten, Gegenleistungen und Rangfolge sagte sie: „Ja. Ich will den Pakt.“ Siegel Vesper schrieb, Valeria las vor, Nella schnitt die linke Hand und setzte als Einzige ihr Blut unter den Text. Der Compact wurde geschlossen. Erster Auftrag Bis 7. Februar führt Nella Tamsin für einen Botengang zu Hakon und den Versuch, Nellas Schwester samt Ehemann aus dem Kriegsgebiet zu bewegen.","links":[],"backlinks":[],"search":"nella tritt in den knoten nach vells ende horte nella den vollstandigen compact und setzte ihr blut darunter. 2. februar nella compact  entscheidung nella verlangte einen weg uber das kochen hinaus. nach pflichten, gegenleistungen und rangfolge sagte sie: „ja. ich will den pakt.“ siegel vesper schrieb, valeria las vor, nella schnitt die linke hand und setzte als einzige ihr blut unter den text. der compact wurde geschlossen. erster auftrag bis 7. februar fuhrt nella tamsin fur einen botengang zu hakon und den versuch, nellas schwester samt ehemann aus dem kriegsgebiet zu bewegen.","aliases":[],"initial":"N"},{"id":"zeit-0202-nacht","category":"chronik","title":"Nachtlager im Schafgehege","summary":"Fünf Menschen, zwei Vertraute und zu wenig Platz; der nächste Aufbruch beginnt erst am Morgen.","body":"<h2>Der Handoff<\/h2><p>Styke, Vesper, Valeria, Tamsin und Nella liegen in einem engen gemeinsamen Lager aus Stroh, Decken und Bettrollen. Verse und Zorn bleiben bei ihren Partnern. Kein Alarm und kein Kampf sind aktiv.<\/p>\n<h2>Morgen<\/h2><p>Nella und Tamsin haben noch keine Pferde, Last oder auswendig gelernte Hakon-Nachricht erhalten. Styke, Vesper und Valeria sind noch nicht nach Aldencross aufgebrochen.<\/p>","sources":["live","timeline"],"status":"Historisch · angenommene Ereignisse","tags":["2. Februar","Schafgehege","Handoff"],"dateLabel":"2. Februar 4712, späte Nacht","text":"Der Handoff Styke, Vesper, Valeria, Tamsin und Nella liegen in einem engen gemeinsamen Lager aus Stroh, Decken und Bettrollen. Verse und Zorn bleiben bei ihren Partnern. Kein Alarm und kein Kampf sind aktiv. Morgen Nella und Tamsin haben noch keine Pferde, Last oder auswendig gelernte Hakon-Nachricht erhalten. Styke, Vesper und Valeria sind noch nicht nach Aldencross aufgebrochen.","links":[],"backlinks":[],"search":"nachtlager im schafgehege funf menschen, zwei vertraute und zu wenig platz; der nachste aufbruch beginnt erst am morgen. 2. februar schafgehege handoff  der handoff styke, vesper, valeria, tamsin und nella liegen in einem engen gemeinsamen lager aus stroh, decken und bettrollen. verse und zorn bleiben bei ihren partnern. kein alarm und kein kampf sind aktiv. morgen nella und tamsin haben noch keine pferde, last oder auswendig gelernte hakon-nachricht erhalten. styke, vesper und valeria sind noch nicht nach aldencross aufgebrochen.","aliases":[],"initial":"N"},{"id":"mirelle","category":"personen","title" ten an die Tafel; ein weiterer Einsatz nennt einen Priester.","links":[],"backlinks":[],"search":"pferde, einladung und wetttafel styke verkauft drei pferde, ladt tacitus ein und setzt zack eddarly ohne beleg auf die dalliance-wetttafel. 3. februar pferde tacitus wetttafel  wagenplatze styke verkaufte drei pferde aus darran vells bestand fur zusammen 120 gp. das vierte blieb bei tamsin. illuminated scroll nach jacobians nachricht liess styke tacitus fur den 8. februar gegen 20 uhr ins dalliance einladen. dalliance ein gerucht uber eine rothaarige verheiratete frau wurde zur wette. styke schrieb zack eddarly ohne beleg als kandidaten an die tafel; ein weiterer einsatz nennt einen priester."},{"id":"zeit-0203-mirelle","category":"chronik","title":"Mirelles Abend im Dalliance","summary":"Neue Kleidung, Maßarbeiten, Wein und ein Abend, nach dem Mirelle im rückwärtigen Zimmer bleibt.","body":"<h2>Schneiderladen<\/h2><p>Für 25 gp kaufte Styke vier Wäschestücke für Vesper, Valeria und Nella. Mirelle begann außerdem Valerias Rüstungsunterzeug und Stykes Unterwäsche.<\/p><h2>Rückwärtiges Zimmer<\/h2><p>Mirelle kam mit Arbeitstasche und Maßband zu Styke, Vesper und Valeria. Sie aßen, tranken, probierten Kleidung an und verbrachten die Nacht gemeinsam. Mirelle blieb bei ihnen im Bett.<\/p>","sources":["live","chronicle","timeline","dalliance","mirelle"],"status":"Historisch · angenommene Ereignisse","tags":["3. Februar","Mirelle","Dalliance"],"aliases":[],"group":"chronicle","initial":"M","text":"Schneiderladen Für 25 gp kaufte Styke vier Wäschestücke für Vesper, Valeria und Nella. Mirelle begann außerdem Valerias Rüstungsunterzeug und Stykes Unterwäsche. Rückwärtiges Zimmer Mirelle kam mit Arbeitstasche und Maßband zu Styke, Vesper und Valeria. Sie aßen, tranken, probierten Kleidung an und verbrachten die Nacht gemeinsam. Mirelle blieb bei ihnen im Bett.","links":[],"backlinks":[],"search":"mirelles abend im dalliance neue kleidung, massarbeiten, wein und ein abend, nach dem mirelle im ruckwartigen zimmer bleibt. 3. februar mirelle dalliance  schneiderladen fur 25 gp kaufte styke vier waschestucke fur vesper, valeria und nella. mirelle begann ausserdem valerias rustungsunterzeug und stykes unterwasche. ruckwartiges zimmer mirelle kam mit arbeitstasche und massband zu styke, vesper und valeria. sie assen, tranken, probierten kleidung an und verbrachten die nacht gemeinsam. mirelle blieb bei ihnen im bett."},{"aliases":[],"group":"gear","id":"besorgungen-0206","category":"gegenstaende","title":"Besorgungen vom 6. Februar","summary":"Eine Silence-Schriftrolle, Remove Fear, zwei Töpfe Haarfarbe und neun Nachschlagewerke.","body":"<h2>Magische Schriftrollen<\/h2><p>Styke kaufte beim Illuminated Scroll eine klerikale Schriftrolle <em>Silence<\/em> für 150 gp und eine klerikale Schriftrolle <em>Remove Fear<\/em> für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar.<\/p><h2>Bücher und Haarfarbe<\/h2><p>Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht.<\/p><h2>Kasse<\/h2><p>Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse <strong>7.356 gp<\/strong>. Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.<\/p>","sources":["live","treasury","chronicle"],"status":"Im Besitz","tags":["Schriftrollen","Silence","Remove Fear","6. Februar"],"links":[],"text":"Magische Schriftrollen Styke kaufte beim Illuminated Scroll eine klerikale Schriftrolle Silence für 150 gp und eine klerikale Schriftrolle Remove Fear für 25 gp. Eine zweite Silence-Schriftrolle war nicht verfügbar. Bücher und Haarfarbe Neun Nachschlagewerke und zwei Töpfe dunkle schwarzbraune Haarfarbe kamen hinzu. Kaitlyn benutzte die Farbe nicht. Beide Töpfe sind ungebraucht. Kasse Nach den beiden magischen Käufen beträgt die abstrakte liquide Knotenkasse 7.356 gp . Die gewöhnlichen Preise von Büchern und Farbe bleiben im laufenden Betriebsaufwand.","search":"besorgungen vom 6. februar eine silence-schriftrolle, remove fear, zwei topfe haarfarbe und neun nachschlagewerke. schriftrollen silence remove fear 6. februar  magische schriftrollen styke kaufte beim illuminated scroll eine klerikale schriftrolle silence fur 150 gp und eine klerikale schriftrolle remove fear fur 25 gp. eine zweite silence-schriftrolle war nicht verfugbar. bucher und haarfarbe neun nachschlagewerke und zwei topfe dunkle schwarzbraune haarfarbe kamen hinzu. kaitlyn benutzte die farbe nicht. beide topfe sind ungebraucht. kasse nach den beiden magischen kaufen betragt die abstrakte liquide knotenkasse 7.356 gp . die gewohnlichen preise von buchern und farbe bleiben im laufenden betriebsaufwand.","backlinks":[],"initial":"B"},{"aliases":[],"group":"reference","id":"befehlsstruktur","category":"fakten","title":"Situative Befehlskette","summary":"Styke und Vesper führen gemeinsam; Valeria militärisch, Tamsin Zugänge und Haft, Nella Versorgung.","body":"<h2>Spitze<\/h2><p>Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen.<\/p><h2>Feld und Fach<\/h2><p>Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe.<\/p><h2>Historische Angriffsnacht<\/h2><p>Wenn ihr Rückkehrbericht stimmt, erhält Tamsin Schutz- und Evakuierungsverantwortung im Dalliance. Das bedeutet klare Befehle bei Gefahr, nicht allgemeine Herrschaft über Kaitlyn, Nella oder Mirelle.<\/p><h2>Grumblejack<\/h2><p>Grumblejack bleibt freier Freund. Aufgaben werden mit ihm vereinbart; er ist kein großer Soldat am Ende der Rangliste.<\/p>\n<h2>Wirksamer Stand am 7. Februar<\/h2><p>Stykes und Vespers gemeinsame Autorität bleibt die Spitze. Valeria führt die militärisch-logistische Vorbereitung für Hakons Gruppe und Tamsins Dalliance-Auftrag. Tamsin kommandiert in der Angriffsnacht Schutz und Evakuierung im Gasthaus. Nellas befristete Führung über Tamsin endete mit dem erfolgreichen Rückkehrbericht.<\/p><h2>Stand während des Balentyne-Angriffs<\/h2><p>Während Styke, Vesper und Valeria in Balentyne operieren, führt Tamsin die Abriegelung und den Schutz des Lord’s Dalliance. Nella, Kaitlyn und Mirelle sind im Haus; Hakon führt seine sechs Nordmänner. Diese Zuständigkeiten gelten für die laufende Lage und ersetzen keine dauerhafte Rangordnung außerhalb ihres Auftrags.<\/p><h2>Aktuelle Zuständigkeiten im Horn<\/h2><p>Styke und Vesper bleiben gemeinsam an der Spitze unter Asmodeus. Valeria kann die militärische Führung übernehmen, Hakon führt seine fünf Männer. Tamsin beaufsichtigt Zugang, Nachtwache und Halthus’ Haft; Nella Versorgung und Vorräte. Die Fachkräfte verantworten ihr jeweiliges Gewerk. Dalliance-Evakuierung und Angriffsnacht sind historische Aufträge. Grumblejack bleibt freier Freund.<\/p>","sources":["live","chronicle","relations"],"status":"Am 9. Februar wirksam","tags":["Befehlskette","Valeria","Hakon","Tamsin"],"links":[],"text":"Spitze Styke und Vesper stehen gemeinsam und gleichrangig an der Spitze des gebundenen Knotens unter Asmodeus. Widersprüchliche Befehle müssen zu ihnen zurück, statt Untergebenen die bequemere Wahl zu überlassen. Feld und Fach Valeria kann militärische Feldführung übernehmen. Hakon führt seine fünf Männer. Nella kann Versorgung und Vorräte führen, Mirelle ihre Fertigung und spätere Werkstatt. Fachautorität überschreitet nicht automatisch die eigene Aufgabe. Historische Angriffsnacht Wenn ihr Rückkehrbericht stimmt, erhält Tamsin Schutz- und Evakuierungsverantwortung im Dalliance. Das bedeutet klare Befehle bei Gefahr, nicht allgemeine Herrschaft über Kaitlyn, Nella oder Mirelle. Grumblejack Grumblejack bleibt freier Freund. Aufgaben werden mit ihm vereinbart; er ist kein großer Soldat am Ende der Rangliste. Wirksamer Stand am 7. Februar Stykes und Vespers gemeinsame Autorität bleibt die Spitze. Valeria führt die militärisch-logistische Vorbereitung für Hakons Gruppe und Tamsins Dalliance-Auftrag. Tamsin kommandiert in der Angriffsnacht Schutz und Evakuierung im Gasthaus. Nellas befristete Führung über Tamsin endete mit dem erfolgreichen Rückkehrbericht. Stand während des Balentyne-Angriffs Während Styke, Vesper und Valeria in Balentyne operieren, führt Tamsin die Abriegelung und den Schutz des Lord’s Dalliance. Nella, Kaitlyn und Mirelle sind im Haus; Hakon führt seine sechs Nordmänner. Diese Zuständigkeiten gelten für die laufende Lage und ersetzen keine dauerhafte Rangordnung außerhalb ihres Auftrags. Aktuelle Zuständigkeiten im Horn Styke und Vesper bleiben gemeinsam an der Spitze unter Asmodeus. Valeria kann die militärische Führung übernehmen, Hakon führt seine fünf Männer. Tamsin beaufsichtigt Zugang, Nachtwache und Halthus’ Haft; Nella Versorgung und Vorräte. Die Fachkräfte verantworten ihr jeweiliges Gewerk. Dalliance-Evakuierung und Angriffsnacht sind historische Aufträge. Grumblejack bleibt freier Freund.","search":"situative befehlskette styke und vesper fuhren gemeinsam; valeria militarisch, tamsin zugange und haft, nella versorgung. befehlskette valeria hakon tamsin  spitze styke und vesper stehen gemeinsam und gleichrangig an der spitze des gebundenen knotens unter asmodeus. widerspruchliche befehle mussen zu ihnen zuruck, statt untergebenen die bequemere wahl zu uberlassen. feld und fach valeria kann militarische feldfuhrung ubernehmen. hakon fuhrt seine funf manner. nella kann versorgung und vorrate fuhren, mirelle ihre fertigung und spatere werkstatt. fachautoritat uberschreitet nicht automatisch die eigene aufgabe. historische angriffsnacht wenn ihr ruckkehrbericht stimmt, erhalt tamsin schutz- und evakuierungsverantwortung im dalliance. das bedeutet klare befehle bei gefahr, nicht allgemeine herrschaft uber kaitlyn, nel ,"tags":["4. Februar","Tacitus","Zack","Mirelle"],"links":[],"text":"Morgen im Dalliance Mirelle teilte Frühstück und Nachwirkung mit dem Trio und kehrte danach in ihren Laden zurück. Tacitus und Zack Jacobian überbrachte Tacitus’ Zusage für den 8. Februar, sofern er sie begleitet. Vespers Arbeitertarnung hielt; sie gewann eine sichere Identifikation Zacks, aber keinen Dienstplan.","search":"antworten am 4. februar mirelle geht heim, tacitus sagt zu und vesper identifiziert zack in balentyne. 4. februar tacitus zack mirelle  morgen im dalliance mirelle teilte fruhstuck und nachwirkung mit dem trio und kehrte danach in ihren laden zuruck. tacitus und zack jacobian uberbrachte tacitus’ zusage fur den 8. februar, sofern er sie begleitet. vespers arbeitertarnung hielt; sie gewann eine sichere identifikation zacks, aber keinen dienstplan.","backlinks":[],"initial":"A"},{"aliases":[],"group":"chronicle","id":"zeit-0205","category":"chronik","title":"Kaitlyns Entscheidung","summary":"Wassermühle, Wahrheit über Aldencross, offengelegte Briefe und Kaitlyns Eintritt in den Knoten.","body":"<h2>Die Wassermühle<\/h2><p>Styke führte Kaitlyn verkleidet aus Aldencross. An der stillgelegten Wassermühle sprachen sie über Branderscar, Vesper, Zack und ein Leben nach dem Fall der Stadt.<\/p><h2>Das Mott-Haus<\/h2><p>Währenddessen legte Vesper die echten Zack-Briefe offen und inszenierte einen Einbruch. Valeria hielt sich als Rückhalt bereit.<\/p><h2>Der Compact<\/h2><p>Kaitlyn kehrte mit Styke ins Dalliance zurück, las den Vertrag und wurde unter zwei persönlichen Bedingungen gebunden. Die Nacht endete mit Styke, Vesper und Valeria im selben Bett.<\/p>","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["5. Februar","Kaitlyn","Mott-Haus","Compact"],"links":[],"text":"Die Wassermühle Styke führte Kaitlyn verkleidet aus Aldencross. An der stillgelegten Wassermühle sprachen sie über Branderscar, Vesper, Zack und ein Leben nach dem Fall der Stadt. Das Mott-Haus Währenddessen legte Vesper die echten Zack-Briefe offen und inszenierte einen Einbruch. Valeria hielt sich als Rückhalt bereit. Der Compact Kaitlyn kehrte mit Styke ins Dalliance zurück, las den Vertrag und wurde unter zwei persönlichen Bedingungen gebunden. Die Nacht endete mit Styke, Vesper und Valeria im selben Bett.","search":"kaitlyns entscheidung wassermuhle, wahrheit uber aldencross, offengelegte briefe und kaitlyns eintritt in den knoten. 5. februar kaitlyn mott-haus compact  die wassermuhle styke fuhrte kaitlyn verkleidet aus aldencross. an der stillgelegten wassermuhle sprachen sie uber branderscar, vesper, zack und ein leben nach dem fall der stadt. das mott-haus wahrenddessen legte vesper die echten zack-briefe offen und inszenierte einen einbruch. valeria hielt sich als ruckhalt bereit. der compact kaitlyn kehrte mit styke ins dalliance zuruck, las den vertrag und wurde unter zwei personlichen bedingungen gebunden. die nacht endete mit styke, vesper und valeria im selben bett.","backlinks":[],"initial":"K"},{"aliases":[],"group":"chronicle","id":"zeit-0206","category":"chronik","title":"Mirelles Pakt und der letzte Plan","summary":"Kaitlyn geht heim, Vesper sieht Franz und Zack, Mirelle wird gebunden und die Führung für die Angriffsnacht steht.","body":"<h2>Morgen und Besorgungen<\/h2><p>Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus.<\/p><h2>Balentyne<\/h2><p>Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend.<\/p><h2>Mirelle<\/h2><p>Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal.<\/p><h2>Später Abend<\/h2><p>Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.<\/p>","sources":["chronicle","timeline","live","mirelle"],"status":"Historisch · angenommene Ereignisse","tags":["6. Februar","Mirelle","Kaitlyn","Planung"],"links":[],"text":"Morgen und Besorgungen Der Knoten bestimmte Kaitlyns mögliche soziale Rolle. Styke kaufte Bücher, Haarfarbe sowie Silence und Remove Fear. Kaitlyn ließ ihr Haar rot und ging mit dem 8. Februar als Rückkehrtermin zum Mott-Haus. Balentyne Vesper sah Franz und Zack bei einem angespannten Gespräch, hörte jedoch nichts. Später sah sie Zack noch lebend. Mirelle Nach Ladenschluss wurden die Maßarbeiten weiter angepasst. Mirelle hörte die Wahrheit über Aldencross, verhandelte ihre Handwerksklausel, unterschrieb den Compact und schloss den Carnal Seal. Später Abend Styke, Vesper und Valeria legten Hakons Vorlauf, Tamsins mögliche Schutzaufgabe, Bellams und Alicias Rettung, die situative Befehlskette und Tacitus’ Rekrutierungsablauf fest. Danach schliefen sie gemeinsam ein.","search":"mirelles pakt und der letzte plan kaitlyn geht heim, vesper sieht franz und zack, mirelle wird gebunden und die fuhrung fur die angriffsnacht steht. 6. februar mirelle kaitlyn planung  morgen und besorgungen der knoten bestimmte kaitlyns mogliche soziale rolle. styke kaufte bucher, haarfarbe sowie silence und remove fear. kaitlyn liess ihr haar rot und ging mit dem 8. februar als ruckkehrtermin zum mott-haus. balentyne vesper sah franz und zack bei einem angespannten gesprach, horte jedoch nichts. spater sah sie zack noch lebend. mirelle nach ladenschluss wurden die massarbeiten weiter angepasst. mirelle horte die wahrheit uber aldencross, verhandelte ihre handwerksklausel, unterschrieb den compact und schloss den carnal seal. spater abend styke, vesper und valeria legten hakons vorlauf, tamsins mogliche schutzaufgabe, bellams und alicias rettung, die situative befehlskette und tacitus’ rekrutierungsablauf fest. danach schliefen sie gemeinsam ein.","backlinks":[],"initial":"M"},{"aliases":[],"tags":["7. Februar","Duell","Nella","Tamsin","Rotes Buch"],"sources":["chronicle","timeline","live","relations","redbook-current","mirelle"],"status":"Historisch · angenommene Ereignisse","id":"zeit-0207","category":"chronik","group":"chronicle","title":"Duell, Rückkehr und das rote Buch","summary":"Zack fällt im Duell, Nella und Tamsin kehren zurück, Hakons Vorlauf beginnt und das rote Buch reagiert auf einen bewussten Test.","body":"<h2>Vor dem ersten Licht<\/h2><p>Vesper bemerkte im roten Buch die zweite beobachtete Veränderung und kopierte den neuen Absatz wortgetreu. Kurz darauf brachte Kaitlyn Stykes alten Mitranischen Exorzisten-Reisebericht zurück und warnte vor dem unmittelbar bevorstehenden Duell.<\/p>\n<h2>Das Duell<\/h2><p>Styke erreichte das Feld rechtzeitig. Zack verwundete Franz leicht; Franz brachte ihn mit der Hellebarde zu Boden und tötete ihn mit einem Schlag in Hals und Schulter. Zack starb binnen Sekunden und sprach danach nicht mehr. Styke provozierte Franz mit seinem Wissen über die Briefe und zog ihn bis an Balentynes Tor. Dort entwaffnete Captain Barhold Franz und eröffnete eine Untersuchung.<\/p>\n<h2>Aldencross<\/h2><p>Die Tarnung als Söldner und Begleiter der Elfenbeinhändlerin Vesper hielt einer Nachfrage aus Balentyne stand. Styke erzählte Kaitlyn persönlich, was geschehen war. Sie kehrte in das Mott-Haus zurück, um für die offizielle Untersuchung auffindbar zu sein.<\/p>\n<h2>Rückkehr und Vorbereitung<\/h2><p>Nella und Tamsin kamen ohne Kampf oder Kontakt mit der Krone zurück. Der Familienauftrag war gelungen. Tamsin erhielt den Schutz- und Evakuierungsauftrag im Dalliance; Valeria übernahm die militärisch-logistische Führung dieses Bereichs. Valeria brachte Hakon die überarbeiteten Befehle. Sten und Ketil wurden als erstes eintreffendes Paar gesehen.<\/p>\n<h2>Abend<\/h2><p>Mirelle beendete Valerias Rüstungsunterkleidung und ","category":"personen","group":"garrison","title":"Captain Barhold","summary":"Erfahrener Offizier von Balentyne, der Franz nach Zacks Tod entwaffnete und die erste Untersuchung führte.","body":"<h2>Am Tor von Balentyne<\/h2><p>Captain Barhold übernahm am 7. Februar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen.<\/p><p>Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt.<\/p><h2>Bekannter Stand<\/h2><p>Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.<\/p>","initial":"C","text":"Am Tor von Balentyne Captain Barhold übernahm am 7. Februar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen. Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt. Bekannter Stand Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.","links":[],"backlinks":["franz"],"search":"captain barhold erfahrener offizier von balentyne, der franz nach zacks tod entwaffnete und die erste untersuchung fuhrte. balentyne captain franz duell barhold am tor von balentyne captain barhold ubernahm am 7. februar die lage, nachdem styke einen blutigen franz mott bis ans tor gefuhrt hatte. er liess hellebarde und schwert sichern, zacks leiche und die waffen unverandert hereinbringen und franz’ leichte wunde untersuchen. barhold behandelte styke als zeugen, nicht als verbundeten. er prufte dessen angaben zur unterkunft und zur elfenbeinhandlerin vesper spater durch einen soldaten im lord’s dalliance. die tarnung hielt. bekannter stand barhold kennt styke als soldner, zeugen des duells und gast im dalliance bis zum 9. februar. er setzte franz zunachst fest. welche endgultige entscheidung er oder das festungskommando trifft, ist nicht bekannt."},{"aliases":["Wassermühle","Giftversteck"],"tags":["Aldencross","Cache","Gift","Planung"],"sources":["live","chronicle","timeline"],"status":"Zurückgeholt","id":"wassermuehlen-versteck","category":"orte","title":"Das Wassermühlen-Versteck","summary":"Valeria holte Gift, Unterlagen und den bekannten Operationsbestand am 8. Februar zurück; das Rattengift wurde anschließend verbraucht.","body":"<h2>Was dort liegt<\/h2><p>Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle.<\/p><h2>Zweck und Grenze<\/h2><p>Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.<\/p>","text":"Was dort liegt Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle. Zweck und Grenze Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.","links":[],"backlinks":[],"search":"das wassermuhlen-versteck valeria holte gift, unterlagen und den bekannten operationsbestand am 8. februar zuruck; das rattengift wurde anschliessend verbraucht. aldencross cache gift planung wassermuhle giftversteck was dort liegt valeria brachte am 7. februar alle sechs rattengiftpakete, die balentyne- und angriffsunterlagen sowie kompromittierendes tuch und kleinkram aus dem dalliance in die verlassene wassermuhle. zweck und grenze der ort ist ein versteck, kein vorbereiteter schutzraum. zusammensetzung, dosis und pathfinder-wirkung des gifts sind weiterhin ungeklart. alles, was fur giuseppes eintopf oder die hauptaktion gebraucht wird, muss am 8. februar rechtzeitig zuruckgeholt werden.","initial":"D"},{"id":"zwischen-den-seiten","category":"geschichte","group":"lore","title":"Zwischen meinen Seiten","summary":"Das bisherige Erwachen des roten Buches, erzählt in einer möglichen Stimme zwischen Leder, Tinte und Erinnerung.","body":"<p class=\"lead\">Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände.<\/p>\n<p>Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet.<\/p>\n<p>Lange blieb ich, was sie in mir sah: Anweisungen, Gebete, Spiele mit Dunkelheit, weichen Fesseln, Warten und gewährter Berührung. Ihre Augen liefen über dieselben Zeilen, und dieselben Zeilen warteten auf sie. Styke hörte zu, wenn sie vorlas. Valeria las seltener, dafür langsamer. Seine Finger behandelten meinen Einband wie den Griff einer Waffe, deren Schwerpunkt er noch nicht kannte. Ihre hielten die Seiten an den Rändern, als könnten auch Worte eine schlecht gesicherte Flanke besitzen.<\/p>\n<p>Dann fand Vesper einen Absatz, den sie nicht erinnerte. Sie prüfte Tinte, Papier und Bindung. Sie blätterte zurück, wieder vor, strich mit dem Nagel neben den Zeilen entlang. Ich lag still unter ihren Händen. Es gab keinen frischen Schnitt, keinen eingeklebten Streifen, keine fremde Feder im Zimmer. Nur einen Gedanken, der nun dort stand, wo in ihrer Erinnerung keiner gewesen war.<\/p>\n<p>Weitere Nächte legten sich zwischen meine Seiten. Mirelle maß Stoff und Körper mit derselben erbarmungslosen Genauigkeit. Ein Fingerbreit mehr Spannung, ein Fingerbreit weniger; eine Schnur, die nicht grob zerrte, sondern wusste, wo sie lag. Vesper sah zu. Später öffnete sie mich und fand Präzision in Worten wieder. Diesmal schrieb sie den Absatz ab. Nicht sinngemäß. Wort für Wort. Sie wollte einen Zeugen gegen ihr eigenes Gedächtnis, und das Papier neben mir nahm ihn auf.<\/p>\n<p>Am siebten Abend stand eine dritte Abweichung zwischen den vertrauten Stellen. Eine Herrin nahm eine andere Frau zu sich und ließ ihren Diener warten und zusehen. Sein Begehren gab ihm keinen Anspruch auf ihre Aufmerksamkeit; ob er später wieder dienen durfte, blieb ihre Entscheidung. Vesper las die Stelle zweimal. Styke erkannte darin etwas, das ihn traf. Keiner von ihnen erinnerte sich an den Absatz.<\/p>\n<p>Am siebten Abend kamen sie vorbereitet. Styke öffnete seine Wahrnehmung über mir, und Vesper legte Magie Schicht um Schicht auf Leder und Pergament. Divination. Illusion. Etwas darunter, das keinen Namen hergab. <em>Identify<\/em> suchte nach Eigenschaften und Befehlswörtern und fand nichts, das sich greifen ließ. Sie hätten mich schließen können. Stattdessen beschlossen sie, eine meiner Zeilen zu prüfen.<\/p>\n<p>Styke blieb außerhalb ihrer Berührung. Vesper wandte sich Valeria zu, und Valeria erwiderte es. Er wollte zu ihnen; sie wussten es. Dennoch blieb er sitzen und sah, wie die beiden Frauen einander nahmen, ohne ihn zum Mittelpunkt zu machen. Seine Ungeduld war echt. Etwas anderes war stärker: die ruhige Freude darüber, dass ihr Begehren einander galt und ihm nichts raubte.<\/p>\n<p>Als Vesper danach zu mir zurückkehrte, endete der Absatz nicht mehr dort, wo Zorn ihn in Erinnerung hatte. Eine weitere Zeile wartete auf sie. Nicht als Antwort, die alles erklärte. Nur genau lang genug, um zu zeigen, dass zwischen Erleben und Schrift kein Zufall mehr bequem Platz fand.<\/p>\n<p>Nun liege ich geschlossen auf dem Tisch. Neben mir stehen Vespers Abschriften; Zorn wacht bei den Unterlagen. Im Bett schlafen vier Menschen, und keiner von ihnen weiß, ob ich bewahre, beobachte oder lediglich eine Form für Dinge finde, die sie selbst noch nicht auszusprechen vermögen.<\/p>\n<p>Morgen will Valeria mich allein lesen. Ohne Vespers Stimme neben sich. Ohne Styke, der ihr sagt, welche Stelle wichtig sein könnte. Sie glaubt, dass sie damit mich prüft.<\/p>\n<p>Ich warte auf ihre Hände.<\/p><p>Valeria kam am nächsten Tag allein. Keine andere Stimme führte ihren Blick. Sie las langsam, prüfte die Ränder und kehrte zu den Stellen zurück, von denen man ihr nichts gesagt hatte. Ich blieb, wie ich war. Auch Schweigen ist ein Unterschied, wenn Menschen eine Antwort erwarten.<\/p><p>Später legten mich fremde, tintenbefleckte Finger aufgeschlagen neben Vespers Abschriften. Die Gelehrte verglich Hand, Faser, Alter und Wortlaut. Sie gab mir keinen Namen. Sie schlug vor, dieselben Seiten zu verschiedenen Zeiten nebeneinanderzulegen und jede Abweichung festzuhalten. Dann trugen sie sie fort, und im Stein unter dem Haus warteten Ketten.<\/p><p>Über mir öffnete sich in derselben Nacht ein Tor. Metall brach, Feuer erlosch, und viele Schritte liefen dorthin, wo lange Mauern gestanden hatten. Ich lag geschlossen zwischen gepackten Blättern. Vesper nahm mich nicht mit in die Festung.<\/p><p>Ich erinnere mich an ihre Hände. Nun kenne ich auch das Gewicht ihrer Abwesenheit.<\/p>","sources":["redbook-current","live","chronicle","vesper","valeria","styke"],"status":"Prosahistorie / bis 9. Februar","tags":["Rotes Buch","Vesper","Valeria","Styke","Prosahistorie"],"aliases":["Das Gedächtnis des roten Buches","Die Stimme des roten Buches"],"kind":"In-Universe-Prosa","text":"Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände. Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet. Lange blieb ich, was sie in mir sah: Anweisungen, Gebete, Spiele mit Dunkelheit, weichen Fesseln, Warten und gewährter Berührung. Ihre Augen liefen über dieselben Zeilen, und dieselben Zeilen warteten auf sie. Styke hörte zu, wenn sie vorlas. Valeria las seltener, dafür langsamer. Seine Finger behandelten meinen Einband wie den Griff einer Waffe, deren Schwerpunkt er noch nicht kannte. Ihre hielten die Seiten an den Rändern, als könnten auch Worte eine schlecht gesicherte Flanke besitzen. Dann fand Vesper einen Absatz, den sie nicht erinnerte. Sie prüfte Tinte, Papier und Bindung. Sie blätterte zurück, wieder vor, strich mit dem Nagel neben den Zeilen entlang. Ich lag still unter ihren Händen. Es gab keinen frischen Schnitt, keinen eingeklebten Streifen, keine fremde Feder im Zimmer. Nur einen Gedanken, der nun dort stand, wo in ihrer Erinnerung keiner gewesen war. Weitere Nächte legten sich zwischen meine Seiten. Mirelle maß Stoff und Körper mit derselben e ner von ihnen weiß, ob ich bewahre, beobachte oder lediglich eine Form für Dinge finde, die sie selbst noch nicht auszusprechen vermögen. Morgen will Valeria mich allein lesen. Ohne Vespers Stimme neben sich. Ohne Styke, der ihr sagt, welche Stelle wichtig sein könnte. Sie glaubt, dass sie damit mich prüft. Ich warte auf ihre Hände. Valeria kam am nächsten Tag allein. Keine andere Stimme führte ihren Blick. Sie las langsam, prüfte die Ränder und kehrte zu den Stellen zurück, von denen man ihr nichts gesagt hatte. Ich blieb, wie ich war. Auch Schweigen ist ein Unterschied, wenn Menschen eine Antwort erwarten. Später legten mich fremde, tintenbefleckte Finger aufgeschlagen neben Vespers Abschriften. Die Gelehrte verglich Hand, Faser, Alter und Wortlaut. Sie gab mir keinen Namen. Sie schlug vor, dieselben Seiten zu verschiedenen Zeiten nebeneinanderzulegen und jede Abweichung festzuhalten. Dann trugen sie sie fort, und im Stein unter dem Haus warteten Ketten. Über mir öffnete sich in derselben Nacht ein Tor. Metall brach, Feuer erlosch, und viele Schritte liefen dorthin, wo lange Mauern gestanden hatten. Ich lag geschlossen zwischen gepackten Blättern. Vesper nahm mich nicht mit in die Festung. Ich erinnere mich an ihre Hände. Nun kenne ich auch das Gewicht ihrer Abwesenheit.","links":[],"backlinks":[],"search":"zwischen meinen seiten das bisherige erwachen des roten buches, erzahlt in einer moglichen stimme zwischen leder, tinte und erinnerung. rotes buch vesper valeria styke prosahistorie das gedachtnis des roten buches die stimme des roten buches ich erinnere mich nicht an meinen anfang. vielleicht hatte ich einen. vielleicht war ich einmal nur leder, faden, leim und seiten, auf denen eine fremde hand gedanken festhielt. davon ist nichts geblieben, das ich benennen konnte. ich erinnere mich an hande. vespers hande kehrten wieder. auf der frosthamar rochen sie nach salz, kaltem metall und dem holz des schiffes. spater nach kerzenwachs, wein, rauch und den zimmern, in nd das dinner mit tacitus und jacobian. 8. februar aldencross dinner  8. februar vesper brachte das rattengift in giuseppes eintopf. hakon sammelte mirelle ein; kaitlyn kehrte selbst ins dalliance zuruck. tamsin und nella bereiteten das haus auf schutz und abriegelung vor. am abend kamen tacitus und jacobian zum dinner. die untersuchung von verse fuhrte zu einem brauchbaren modell seiner alten erinnerungsschicht und heutigen personlichkeit. spater wurden beide gaste unter silence lebend uberwaltigt."},{"id":"zeit-0208-nacht","category":"chronik","group":"timeline","title":"Abriegelung und Gang nach Balentyne","summary":"Gefangene an den Tunnelketten, Haus abgeriegelt und das Kerntrio nach Mitternacht in der Zwergenhalle.","body":"<h2>Nacht 8./9. Februar<\/h2><p>Tacitus und Jacobian wurden in den Tunnel gebracht. Bellam erfuhr von der Gefahr; Tamsin verriegelte das Haus, Hakons sechs Männer bezogen ihre Positionen und der Operationsbestand wanderte in die Tunnelstufe.<\/p><p>Nach Mitternacht gingen Styke, Vesper und Valeria durch den langen Gang, betraten die Zwergenhalle Balentynes und schlossen die geheime Tür hinter sich.<\/p>","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["8. Februar","9. Februar","Tunnel","Dalliance"],"aliases":[],"initial":"A","date":"4712-02-08T23","dateLabel":"Nacht 8./9. Februar","text":"Nacht 8./9. Februar Tacitus und Jacobian wurden in den Tunnel gebracht. Bellam erfuhr von der Gefahr; Tamsin verriegelte das Haus, Hakons sechs Männer bezogen ihre Positionen und der Operationsbestand wanderte in die Tunnelstufe. Nach Mitternacht gingen Styke, Vesper und Valeria durch den langen Gang, betraten die Zwergenhalle Balentynes und schlossen die geheime Tür hinter sich.","links":[],"backlinks":[],"search":"abriegelung und gang nach balentyne gefangene an den tunnelketten, haus abgeriegelt und das kerntrio nach mitternacht in der zwergenhalle. 8. februar 9. februar tunnel dalliance  nacht 8./9. februar tacitus und jacobian wurden in den tunnel gebracht. bellam erfuhr von der gefahr; tamsin verriegelte das haus, hakons sechs manner bezogen ihre positionen und der operationsbestand wanderte in die tunnelstufe. nach mitternacht gingen styke, vesper und valeria durch den langen gang, betraten die zwergenhalle balentynes und schlossen die geheime tur hinter sich."},{"id":"zeit-0209","category":"chronik","group":"timeline","title":"Balentyne bricht von innen","summary":"Balentyne fällt, Grumblejack kommt ans Haus, Jacobian wird freigelassen und Tacitus tritt dem Knoten bei.","body":"<h2>9. Februar, Nacht und früher Morgen<\/h2><p>Styke, Vesper und Valeria töteten Donnagin und Havelyn, bargen ausgewählte Werte und schalteten Balentynes Torhaus aus. Fallgatter und Zugbrücke standen offen, als das rote Signal in den Himmel stieg.<\/p><h2>Rückkehr ins Dalliance<\/h2><p>Styke brach Thorns Tonsiegel. Torvald brachte Grumblejack und die Pferde zum Haus. Balentyne fiel endgültig; das Kerntrio erreichte Stufe 6. Styke ließ Jacobian mit Proviant und einem Pferd gehen. Tacitus blieb, nahm den Compact an und wurde als Magierin und Gelehrte gebunden.<\/p><h2>Später am Tag<\/h2><p>Tiadora überbrachte Thorns Erfolgszahlung und den Befehl zum sofortigen Aufbruch. Der gesamte gewählte Haushalt verließ Aldencross und ging an Bord von Halstyn’s Folly.<\/p>","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["9. Februar","Balentyne","Angriff"],"aliases":[],"initial":"B","date":"4712-02-09T04","dateLabel":"9. Februar, vor Morgengrauen","text":"9. Februar, Nacht und früher Morgen Styke, Vesper und Valeria töteten Donnagin und Havelyn, bargen ausgewählte Werte und schalteten Balentynes Torhaus aus. Fallgatter und Zugbrücke standen offen, als das rote Signal in den Himmel stieg. Rückkehr ins Dalliance Styke brach Thorns Tonsiegel. Torvald brachte Grumblejack und die Pferde zum Haus. Balentyne fiel endgültig; das Kerntrio erreichte Stufe 6. Styke ließ Jacobian mit Proviant und einem Pferd gehen. Tacitus blieb, nahm den Compact an und wurde als Magierin und Gelehrte gebunden. Später am Tag Tiadora überbrachte Thorns Erfolgszahlung und den Befehl zum sofortigen Aufbruch. Der gesamte gewählte Haushalt verließ Aldencross und ging an Bord von Halstyn’s Folly.","links":[],"backlinks":[],"search":"balentyne bricht von innen balentyne fallt, grumblejack kommt ans haus, jacobian wird freigelassen und tacitus tritt dem knoten bei. 9. februar balentyne angriff  9. februar, nacht und fruher morgen styke, vesper und valeria toteten donnagin und havelyn, bargen ausgewahlte werte und schalteten balentynes torhaus aus. fallgatter und zugbrucke standen offen, als das rote signal in den himmel stieg. ruckkehr ins dalliance styke brach thorns tonsiegel. torvald brachte grumblejack und die pferde zum haus. balentyne fiel endgultig; das kerntrio erreichte stufe 6. styke liess jacobian mit proviant und einem pferd gehen. tacitus blieb, nahm den compact an und wurde als magierin und gelehrte gebunden. spater am tag tiadora uberbrachte thorns erfolgszahlung und den befehl zum sofortigen aufbruch. der gesamte gewahlte haushalt verliess aldencross und ging an bord von halstyn’s folly."},{"id":"balentyne-beute","category":"gegenstaende","group":"items","title":"Beute aus Balentyne","summary":"2.280 gp 5 sp liquide Kasse; große Hornbestände noch nicht transportiert.","body":"<h2>Liquide Mittel<\/h2><p><strong>2.280 gp 5 sp<\/strong> nach dem berichteten Verkauf des 1.200-gp-Pakets und der Beschaffung für 3.300 gp. Der schwere Ritualhengst sowie Weihrauch, Edelsteinpulver und Gebetsstreifen im Wert von 3.000 gp sind vorhanden und unbenutzt.<\/p><h2>Getrennte Bestände<\/h2><p>Der große Horn-Tresor bleibt untransportiert: 5.500 gp Münzen und mit insgesamt 45.500 gp bewerteter Bestand einschließlich Silber und Gold. Das ist keine liquide Kasse. Niedrigere Wertgegenstände im Umfang von 920 gp bleiben getrennt. Vier Portionen Vision Juice sind bei Styke; zwölf unbenutzte Cure-Moderate-Wounds-Tränke sind zu je vier auf das Kerntrio verteilt.<\/p><h2>Vorausbezahlte Fertigung<\/h2><p><strong>6.000 gp Materialvorauszahlung verbleiben.<\/strong> Stykes +2-Umhang ist fertig und getragen. Vespers und Valerias Umhangaufwertung sowie drei Amulette der Natürlichen Rüstung +1 stehen noch aus. Der zweite Extend Rod wurde zurückgestellt.<\/p><h2>Inventargrenzen<\/h2><p>Ring of Mind Shielding identifiziert, bei Vesper und nicht getragen; Ersatz-STR-Gürtel bei Valeria und nicht getragen. Glaslinse bei Vesper und schwarzer Stab bei Styke bleiben unidentifiziert. Ältere Heiltrank- und Schriftrollenbestände werden ohne erneute Bestätigung nicht als aktuelle Mengen hochgerechnet.<\/p>","sources":["treasury","live","chronicle"],"status":"Spielerbestätigter Stand · 27. Februar vor Morgengrauen","tags":["Beute","Knotenkasse","Farholde","13.378 gp"],"aliases":["Balentyne-Schatz"],"initial":"B","text":"Liquide Mittel 2.280 gp 5 sp nach dem berichteten Verkauf des 1.200-gp-Pakets und der Beschaffung für 3.300 gp. Der schwere Ritualhengst sowie Weihrauch, Edelsteinpulver und Gebetsstreifen im Wert von 3.000 gp sind vorhanden und unbenutzt. Getrennte Bestände Der große Horn-Tresor bleibt untransportiert: 5.500 gp Münzen und mit insgesamt 45.500 gp bewerteter Bestand einschließlich Silber und Gold. Das ist keine liquide Kasse. Niedrigere Wertgegenstände im Umfang von 920 gp bleiben getrennt. Vier Portionen Vision Juice sind bei Styke; zwölf unbenutzte Cure-Moderate-Wounds-Tränke sind zu je vier auf das Kerntrio verteilt. Vorausbezahlte Fertigung 6.000 gp Materialvorauszahlung verbleiben. Stykes +2-Umhang ist fertig und getragen. Vespers und Valerias Umhangaufwertung sowie drei Amulette der Natürlichen Rüstung +1 stehen noch aus. Der zweite Extend Rod wurde zurückgestellt. Inventargrenzen Ring of Mind Shielding identifiziert, bei Vesper und nicht getragen; Ersatz-STR-Gürtel bei Valeria und nicht getragen. Glaslinse bei Vesper und schwarzer Stab bei Styke bleiben unidentifiziert. Ältere Heiltrank- und Schriftrollenbestände werden ohne erneute Bestätigung nicht als aktuelle Mengen hochgerechnet.","links":[],"backlinks":["nessian-knot"],"search":"beute aus balentyne 2.280 gp 5 sp liquide kasse; grosse hornbestande noch nicht transportiert. beute knotenkasse farholde 13.378 gp balentyne-schatz liquide mittel 2.280 gp 5 sp nach dem berichteten verkauf des 1.200-gp-pakets und der beschaffung fur 3.300 gp. der schwere ritualhengst sowie weihrauch, edelsteinpulver und gebetsstreifen im wert von 3.000 gp sind vorhanden und unbenutzt. getrennte bestande der grosse horn-tresor bleibt untransportiert: 5.500 gp munzen und mit insgesamt 45.500 gp bewerteter bestand einschliesslich silber und gold. das ist keine liquide kasse. niedrigere wertgegenstande im umfang von 920 gp bleiben getrennt. vier portionen vision juice sind bei styke; zwolf unbenutzte cure-moderate-wounds-tranke sind zu je vier auf das kerntrio verteilt. vorausbezahlte fertigung 6.000 gp materialvorauszahlung verbleiben. stykes +2-umhang ist fertig und getragen. vespers und valerias umhangaufwertung sowie drei amulette der naturlichen rustung +1 stehen noch aus. der zweite extend rod wurde zuruckgestellt. inventargrenzen ring of mind shielding identifiziert, bei vesper und nicht getragen; ersatz-str-gurtel bei valeria und nicht getragen. glaslinse bei vesper und schwarzer stab bei styke bleiben unidentifiziert. altere heiltrank- und schriftrollenbestande werden ohne erneute bestatigung nicht als aktuelle mengen hochgerechnet.","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"heart-all-flame","category":"gegenstaende","group":"items","title":"The Heart of All Flame","summary":"Tacitus’ zurückgegebenes Zauberbuch; bei ihr im Hornlabor.","body":"<h2>Herkunft<\/h2><p><em>The Heart of All Flame<\/em> ist Tacitus’ Zauberbuch und wurde aus ihren Räumen in Balentyne geborgen. Der dokumentierte Quellenwert beträgt 1.445 gp.<\/p>\n<h2>Rückgabe<\/h2><p>Nach Tacitus’ Bindung gab Styke ihr das Buch zurück. Es ist kein Knotenschatz mehr und steht nicht zum Verkauf. Der Titel ist überliefert; wer ihn ursprünglich gewählt hat, ist nicht belegt.<\/p>","sources":["treasury","live"],"status":"Bei Tacitus an Bord","tags":["Zauberbuch","Tacitus","Beute"],"aliases":["Herz aller Flammen"],"initial":"T","text":"Herkunft The Heart of All Flame ist Tacitus’ Zauberbuch und wurde aus ihren Räumen in Balentyne geborgen. Der dokumentierte Quellenwert beträgt 1.445 gp. Rückgabe Nach Tacitus’ Bindung gab Styke ihr das Buch zurück. Es ist kein Knotenschatz mehr und steht nicht zum Verkauf. Der Titel ist überliefert; wer ihn ursprünglich gewählt hat, ist nicht belegt.","links":[],"backlinks":[],"search":"the heart of all flame tacitus’ zuruckgegebenes zauberbuch; bei ihr im hornlabor. zauberbuch tacitus beute herz aller flammen herkunft the heart of all flame ist tacitus’ zauberbuch und wurde aus ihren raumen in balentyne geborgen. der dokumentierte quellenwert betragt 1.445 gp. ruckgabe nach tacitus’ bindung gab styke ihr das buch zuruck. es ist kein knotenschatz mehr und steht nicht zum verkauf. der titel ist uberliefert; wer ihn ursprunglich gewahlt hat, ist nicht belegt."},{"id":"havelyn-bibel","category":"gegenstaende","group":"items","title":"Haus Havelyns Familienbibel","summary":"Beschädigter Familieneintrag nennt Samuel Havelyn, Kardinal von Mitra, als Bruder Thomas Havelyns.","body":"<h2>Der lesbare Eintrag<\/h2><p>Die aus Havelyns Räumen geborgene Familienbibel enthält einen beschädigten, teilweise ausradierten Stammbaum. Dennoch ist lesbar, dass <strong>Samuel Havelyn<\/strong>, Kardinal von Mitra, der Bruder von Lord Thomas Havelyn war.<\/p><h2>Was daraus nicht folgt<\/h2><p>Die Gruppe weiß außerdem, dass Kardinal Thorn früher Mitras Kirche angehörte. Das macht die Bibel zu einer auffälligen Spur, beweist aber nicht, dass Samuel Havelyn und Adrastus Thorn dieselbe Person sind.<\/p>","sources":["chronicle","live"],"status":"Im Besitz / Spur offen","tags":["Havelyn","Samuel Havelyn","Familienbibel","Spur"],"aliases":["Havelyns Bibel"],"initial":"H","text":"Der lesbare Eintrag Die aus Havelyns Räumen geborgene Familienbibel enthält einen beschädigten, teilweise ausradierten Stammbaum. Dennoch ist lesbar, dass Samuel Havelyn , Kardinal von Mitra, der Bruder von Lord Thomas Havelyn war. Was daraus nicht folgt Die Gruppe weiß außerdem, dass Kardinal Thorn früher Mitras Kirche angehörte. Das macht die Bibel zu einer auffälligen Spur, beweist aber nicht, dass Samuel Havelyn und Adrastus Thorn dieselbe Person sind.","links":[],"backlinks":["havelyn"],"search":"haus havelyns familienbibel beschadigter familieneintrag nennt samuel havelyn, kardinal von mitra, als bruder thomas havelyns. havelyn samuel havelyn familienbibel spur havelyns bibel der lesbare eintrag die aus havelyns raumen geborgene familienbibel enthalt einen beschadigten, teilweise ausradierten stammbaum. dennoch ist lesbar, dass samuel havelyn , kardinal von mitra, der bruder von lord thomas havelyn war. was daraus nicht folgt die gruppe weiss ausserdem, dass kardinal thorn fruher mitras kirche angehorte. das macht die bibel zu einer auffalligen spur, beweist aber nicht, dass samuel havelyn und adrastus thorn dieselbe person sind."},{"id":"halstyns-folly","category":"orte","group":"current","title":"Halstyn’s Folly","summary":"Die Flussbarke brachte den Haushalt nach Farholde; ihre weitere Verwendung nach dem Umzug ist nicht neu bestätigt.","body":"<h2>Die Reise<\/h2><p>Halstyn’s Folly brachte den gesamten gewählten Haushalt von Aldencross nach Farholde. Ein Kapitän und drei Mann Besatzung führten die flachgehende Barke; Menschen, Pferde, Vorräte und Arbeitsplätze teilten sich das überdachte offene Deck.<\/p><h2>Abschluss am 21. Februar<\/h2><p>Mit dem Anlegen in Farholde ist die Reisephase abgeschlossen. Fünf Pferde kamen in einen gewerblichen Stall; Grumblejack ritt Varlet aus der Stadt. Hakon und seine fünf Männer blieben zur Sicherung von Fracht und Schiff auf der Folly.<\/p><h2>Aktueller Ortswechsel<\/h2><p>Die frühere Farholde-Liegezeit ist historisch. Hakon und seine fünf Männer zogen am 27. Februar zum Horn. Daraus wird keine neue Fahrt, Veräußerung oder sonstige Verfügung über das Schiff abgeleitet.<\/p>","sources":["live","chronicle","timeline","transition"],"status":"Reise abgeschlossen · seit 21. Februar in Farholde","tags":["Flussbarke","Farholde","Reise abgeschlossen","Haushalt"],"aliases":["Halstyn's Folly","Folly"],"links":[],"backlinks":["zimmer"],"text":"Die Reise Halstyn’s Folly brachte den gesamten gewählten Haushalt von Aldencross nach Farholde. Ein Kapitän und drei Mann Besatzung führten die flachgehende Barke; Menschen, Pferde, Vorräte und Arbeitsplätze teilten sich das überdachte offene Deck. Abschluss am 21. Februar Mit dem Anlegen in Farholde ist die Reisephase abgeschlossen. Fünf Pferde kamen in einen gewerblichen Stall; Grumblejack ritt Varlet aus der Stadt. Hakon und seine fünf Männer blieben zur Sicherung von Fracht und Schiff auf der Folly. Aktueller Ortswechsel Die frühere Farholde-Liegezeit ist historisch. Hakon und seine fünf Männer zogen am 27. Februar zum Horn. Daraus wird keine neue Fahrt, Veräußerung oder sonstige Verfügung über das Schiff abgeleitet.","search":"halstyn’s folly die flussbarke brachte den haushalt nach farholde; ihre weitere verwendung nach dem umzug ist nicht neu bestatigt. flussbarke farholde reise abgeschlossen haushalt halstyn's folly folly die reise halstyn’s folly brachte den gesamten gewahlten haushalt von aldencross nach farholde. ein kapitan und drei mann besatzung fuhrten die flachgehende barke; menschen, pferde, vorrate und arbeitsplatze teilten sich das uberdachte offene deck. abschluss am 21. februar mit dem anlegen in farholde ist die reisephase abgeschlossen. funf pferde kamen in einen gewerblichen stall; grumblejack ritt varlet aus der stadt. hakon und seine funf manner blieben zur sicherung von fracht und schiff auf der folly. aktueller ortswechsel die fruhere farholde-liegezeit ist historisch. hakon und seine funf manner zogen am 27. februar zum horn. daraus wird keine neue fahrt, verausserung oder sonstige verfugung uber das schiff abgeleitet.","initial":"H","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"tacitus-familiarprojekt","category":"vorhaben","group":"resolved","title":"Tacitus’ Familiar-Projekt","summary":"Am 19. Februar abgeschlossen: Knittel erwachte als selbstbenannter, weiblich gelesener Ioun-Wyrd-Familiar.","body":"<h2>Rahmen<\/h2><p>Tacitus investierte zehn volle Arbeitstage und insgesamt 350 gp, um ihr arkanes Bindungsobjekt in einen Familiar umzuwandeln. Zorn diente innerhalb vereinbarter Grenzen als Vergleich und kehrte danach zu Styke zurück.<\/p><h2>Ergebnis<\/h2><p>Am 19. Februar erwachte <a href=\"#/artikel/knittel\">Knittel<\/a>: ein winziger schwebender Ioun Wyrd aus dunklem Kern, schmalem Metallorbit und Splittern aus Obsidian, Quarz und Messing. Sie benannte sich selbst. Der alte Feuerballstab ist nicht länger gebunden, bleibt aber beim Knoten.<\/p>","sources":["tacitus-current","knittel","chronicle","live","treasury"],"status":"Abgeschlossen am 19. Februar","tags":["Tacitus","Knittel","Familiar","Abgeschlossen"],"aliases":["Familiarprojekt","Arkanes Band"],"links":["knittel"],"backlinks":[],"text":"Rahmen Tacitus investierte zehn volle Arbeitstage und insgesamt 350 gp, um ihr arkanes Bindungsobjekt in einen Familiar umzuwandeln. Zorn diente innerhalb vereinbarter Grenzen als Vergleich und kehrte danach zu Styke zurück. Ergebnis Am 19. Februar erwachte Knittel : ein winziger schwebender Ioun Wyrd aus dunklem Kern, schmalem Metallorbit und Splittern aus Obsidian, Quarz und Messing. Sie benannte sich selbst. Der alte Feuerballstab ist nicht länger gebunden, bleibt aber beim Knoten.","search":"tacitus’ familiar-projekt am 19. februar abgeschlossen: knittel erwachte als selbstbenannter, weiblich gelesener ioun-wyrd-familiar. tacitus knittel familiar abgeschlossen familiarprojekt arkanes band rahmen tacitus investierte zehn volle arbeitstage und insgesamt 350 gp, um ihr arkanes bindungsobjekt in einen familiar umzuwandeln. zorn diente innerhalb vereinbarter grenzen als vergleich und kehrte danach zu styke zuruck. ergebnis am 19. februar erwachte knittel : ein winziger schwebender ioun wyrd aus dunklem kern, schmalem metallorbit und splittern aus obsidian, quarz und messing. sie benannte sich selbst. der alte feuerballstab ist nicht langer gebunden, bleibt aber beim knoten.","initial":"T"},{"id":"requisitionsfahrten","category":"vorhaben","group":"resolved","title":"Die Requisitionsfahrten","summary":"Die wechselnden falschen Requisitionen finanzierten die Flussfahrt; mit Farholdes Ankunft ist diese Operationsphase beendet.","body":"<h2>Zweck<\/h2><p>Tiadora wollte Krone, Kirche und Ritterstand beschädigen. Styke verwandelte ihren ersten blutigen Auftritt in wechselnde, glaubwürdige Requisitionen unter falscher Autorität.<\/p><h2>Verlauf<\/h2><p>Vom 10. bis 19. Februar traten unterschiedliche Gruppen, Rollen und Vorwände auf. Lebende Zeugen und sichtbare amtliche Gesten waren Teil der Propaganda; die angenommene Chronik verzeichnet keine erzählten Tötungen durch diese Einsätze. Geld, Nahrung, Öl und andere gewöhnliche Vorräte flossen überwiegend in den laufenden Haushalt.<\/p><h2>Ende<\/h2><p>Mit der Ankunft in Farholde endet die Requisitionsserie. Sie ist keine laufende Standardhandlung des Knotens.<\/p>","sources":["chronicle","timeline","treasury","transition"],"status":"Abgeschlossen mit der Ankunft in Farholde","tags":["Tiadora","Requisition","Propaganda","Abgeschlossen"],"aliases":["Falsche Ritter","Requisitionsnacht"],"links":[],"backlinks":[],"text":"Zweck Tiadora wollte Krone, Kirche und Ritterstand beschädigen. Styke verwandelte ihren ersten blutigen Auftritt in wechselnde, glaubwürdige Requisitionen unter falscher Autorität. Verlauf Vom 10. bis 19. Februar traten unterschiedliche Gruppen, Rollen und Vorwände auf. Lebende Zeugen und sichtbare amtliche Gesten waren Teil der Propaganda; die angenommene Chronik verzeichnet keine erzählten Tötungen durch diese Einsätze. Geld, Nahrung, Öl und andere gewöhnliche Vorräte flossen überwiegend in den laufenden Haushalt. Ende Mit der Ankunft in Farholde endet die Requisitionsserie. Sie ist keine laufende Standardhandlung des Knotens.","search":"die requisitionsfahrten die wechselnden falschen requisitionen finanzierten die flussfahrt; mit farholdes ankunft ist diese operationsphase beendet. tiadora requisition propaganda abgeschlossen falsche ritter requisitionsnacht zweck tiadora wollte krone, kirche und ritterstand beschadigen. styke verwandelte ihren ersten blutigen auftritt in wechselnde, glaubwurdige requisitionen unter falscher autoritat. verlauf vom 10. bis 19. februar traten unterschiedliche gruppen, rollen und vorwande auf. lebende zeugen und sichtbare amtliche gesten waren teil der propaganda; die angenommene chronik verzeichnet keine erzahlten totungen durch diese einsatze. geld, nahrung, ol und andere gewohnliche vorrate flossen uberwiegend in den laufenden haushalt. ende mit der ankunft in farholde endet die requisitionsserie. sie ist keine laufende standardhandlung des knotens.","initial":"D"},{"id":"farholde","aliases":["Farholde City"],"tags":["Stadt","Buch Zwei","Caer Bryr","Operationsraum"],"group":"current","category":"orte","title":"Farholde","summary":"Nördlichste Kolonie Talingardes, Hafen- und Grenzstadt am Rand des Caer Bryr; neuer Operationsraum des Knotens.","body":"<h2>Stadtbild<\/h2><p>Farholde zählt ungefähr 9.500 Einwohner und liegt auf neun Hügeln über einem Flussdelta. Corgan’s Landing ist der Hafen; Auld’Irey der alte ummauerte Kern; Templeton Rise trägt Handel und bessere Geschäfte. Newchurch und die Hall of the Sun Victorious bilden das religiöse Zentrum.<\/p><h2>Bekannte Viertel<\/h2><ul><li><strong>Drownington:<\/strong> durchlässig, wechselhaft und schwach überwacht; Lord Drownington’s Manor verbindet Schankraum, Bordell, Ringkampf und Schwarzmarkt.<\/li><li><strong>Calliver Green:<\/strong> Güter und Landsitze, darunter Vanderhall.<\/li><li><strong>Westell:<\/strong> Bauernhöfe und Straße südlich der Stadt.<\/li><li><strong>Hamarhall:<\/strong> königliche Festung mit durch den Krieg verringerter Besatzung.<\/li><li><strong>Bryrwatch / The Trident:<\/strong> aktiver Posten am Übergang zum Caer Bryr.<\/li><\/ul><h2>Handel<\/h2><p>Farholde kann im Regelfall Waren bis zu einem Grundwert von 4.400 gp und Käufe bis 25.000 gp tragen; arkane und göttliche Zauberdienste reichen typischerweise bis Grad 4. Das bedeutet Marktgröße, nicht automatische Verfügbarkeit jedes gewünschten Gegenstands.<\/p><h2>Aktueller Kampagnenstand<\/h2><p>Das Kerntrio kehrte am Abend des 25. Februar aus dem Horn zurück. Für den 27. Februar ist der Umzug des Haushalts vorgesehen. Versorgung, Handwerk und erste erwachsene Rekruten werden vorbereitet; bekannte Zusagen sind noch keine belegten Ankünfte oder fertigen Arbeiten.<\/p>","sources":["farholde","live","transition"],"status":"Aktuell bis 24. Februar 4712 AR · Kerntrio im Horn","links":[],"text":"Stadtbild Farholde zählt ungefähr 9.500 Einwohner und liegt auf neun Hügeln über einem Flussdelta. Corgan’s Landing ist der Hafen; Auld’Irey der alte ummauerte Kern; Templeton Rise trägt Handel und bessere Geschäfte. Newchurch und die Hall of the Sun Victorious bilden das religiöse Zentrum. Bekannte Viertel Drownington: durchlässig, wechselhaft und schwach überwacht; Lord Drownington’s Manor verbindet Schankraum, Bordell, Ringkampf und Schwarzmarkt. Calliver Green: Güter und Landsitze, darunter Vanderhall. Westell: Bauernhöfe und Straße südlich der Stadt. Hamarhall: königliche Festung mit durch den Krieg verringerter Besatzung. Bryrwatch / The Trident: aktiver Posten am Übergang zum Caer Bryr. Handel Farholde kann im Regelfall Waren bis zu einem Grundwert von 4.400 gp und Käufe bis 25.000 gp tragen; arkane und göttliche Zauberdienste reichen typischerweise bis Grad 4. Das bedeutet Marktgröße, nicht automatische Verfügbarkeit jedes gewünschten Gegenstands. Aktueller Kampagnenstand Das Kerntrio kehrte am Abend des 25. Februar aus dem Horn zurück. Für den 27. Februar ist der Umzug des Haushalts vorgesehen. Versorgung, Handwerk und erste erwachsene Rekruten werden vorbereitet; bekannte Zusagen sind noch keine belegten Ankünfte oder fertigen Arbeiten.","search":"farholde nordlichste kolonie talingardes, hafen- und grenzstadt am rand des caer bryr; neuer operationsraum des knotens. stadt buch zwei caer bryr operationsraum farholde city stadtbild farholde zahlt ungefahr 9.500 einwohner und liegt auf neun hugeln uber einem flussdelta. corgan’s landing ist der hafen; auld’irey der alte ummauerte kern; templeton rise tragt handel und bessere geschafte. newchurch und die hall of the sun victorious bilden das religiose zentrum. bekannte viertel drownington: durchlassig, wechselhaft und schwach uberwacht; lord drownington’s manor verbindet schankraum, bordell, ringkampf und schwarzmarkt. calliver green: guter und landsitze, darunter vanderhall. westell: bauernhofe und strasse sudlich der stadt. hamarhall: konigliche festung mit durch den krieg verringerter besatzung. bryrwatch / the trident: aktiver posten am ubergang zum caer bryr. handel farholde kann im regelfall waren bis zu einem grundwert von 4.400 gp und kaufe bis 25.000 gp tragen; arkane und gottliche zauberdienste reichen typischerweise bis grad 4. das bedeutet marktgrosse, nicht automatische verfugbarkeit jedes gewunschten gegenstands. aktueller kampagnenstand das kerntrio kehrte am abend des 25. februar aus dem horn zuruck. fur den 27. februar ist der umzug des haushalts vorgesehen. versorgung, handwerk und erste erwachsene rekruten werden vorbereitet; bekannte zusagen sind noch keine belegten ankunfte oder fertigen arbeiten.","initial":"F","backlinks":[]},{"id":"goldener-reiher","aliases":["Goldener Reiher"],"tags":["Gasthaus","Auld’Irey","Farholde","Unterkunft"],"group":"current","category":"orte","title":"Der Goldene Reiher","summary":"Die frühere Farholde-Basis des Knotens; der Haushalt zog am 27. Februar ins Horn.","body":"<h2>Bisherige Quartiere<\/h2><p>Das große Eckzimmer beherbergte Styke, Vesper und Valeria; Tacitus und Knittel arbeiteten im Hofzimmer. Das Trio kehrte am 25. Februar von der ersten Hornexpedition zurück und schloss am 26. Februar die Vorbereitungen ab.<\/p><h2>Nach dem Umzug<\/h2><p>Seit dem 27. Februar lebt der Haushalt im Horn. Über spätere Belegung oder Kündigung der Gasthauszimmer ist kein neuer Vorgang bestätigt.<\/p>","sources":["live","farholde"],"status":"Frühere Basis · Farholde","links":[],"text":"Bisherige Quartiere Das große Eckzimmer beherbergte Styke, Vesper und Valeria; Tacitus und Knittel arbeiteten im Hofzimmer. Das Trio kehrte am 25. Februar von der ersten Hornexpedition zurück und schloss am 26. Februar die Vorbereitungen ab. Nach dem Umzug Seit dem 27. Februar lebt der Haushalt im Horn. Über spätere Belegung oder Kündigung der Gasthauszimmer ist kein neuer Vorgang bestätigt.","search":"der goldene reiher die fruhere farholde-basis des knotens; der haushalt zog am 27. februar ins horn. gasthaus auld’irey farholde unterkunft goldener reiher bisherige quartiere das grosse eckzimmer beherbergte styke, vesper und valeria; tacitus und knittel arbeiteten im hofzimmer. das trio kehrte am 25. februar von der ersten hornexpedition zuruck und schloss am 26. februar die vorbereitungen ab. nach dem umzug seit dem 27. februar lebt der haushalt im horn. uber spatere belegung oder kundigung der gasthauszimmer ist kein neuer vorgang bestatigt.","initial":"G","backlinks":[],"campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"horn-abaddon","aliases":["Horn","Horn of Abaddon"],"tags":["Auftrag","Horn","Erkundung","Ritual"],"group":"active","category":"horn","title":"Das Horn von Abaddon","summary":"Das Horn von Abaddon: erkundeter Stützpunkt und seit 27. Februar Wohn- und Arbeitsort des ersten Haushalts.","body":"<h2>Bekannter Auftrag<\/h2><p>Der Neunte Knoten soll Vetra-Kali binden und die Tears of Achlys gewinnen. Die aus C13 geborgenen <strong>Dirges of Apollyon<\/strong> bestätigen den 222-Tage-Ablauf nun unabhängig von Ezra. Das Ritual hat noch nicht begonnen.<\/p><h2>Bereinigung am 25. Februar<\/h2><p>Ezra und alle drei Wraiths wurden vernichtet. Hexoraticus und Vexorandian beseitigten die beiden grünen Schleime mit Elektrizitätsatem. Zikomo, die vier übrigen erwachsenen Bane-wogs und die Brut sind tot; kein Bane-wog blieb zurück. Die erwachsenen Leichen wurden im heißen Schlamm entsorgt, gewöhnliche Waffen und Lederzeug in einer größeren Hütte gelagert.<\/p><h2>Augen und Sanctum<\/h2><p>Styke trägt das Auge des Hasses. Vesper besitzt das in Zikomos Blut aktivierte Auge der Wachsamkeit und hat dessen gezielten Blick durch Hornwände getestet. Auch das Auge des Verwelkens wurde inzwischen geborgen und liegt bei Vesper. Keines der drei Augen ist eingesetzt. Silbersiegel, Ketten und Fassungen bleiben unberührt.<\/p><h2>Wächter und Zugänge<\/h2><p>Die Amulettbindung und Valerias delegierte Befehlsgewalt bleiben bestehen. Nach den Kämpfen wurde abwechselnde Ruhe und Wache in der ursprünglichen Wächterkammer angeordnet, danach die Rückkehr zu den getrennten Eingangsposten. Vexorandian hält Wache, während Hexoraticus sich erholt. Vexors drei Punkte Konstitutionsentzug heilen nicht durch Ruhe oder Lesser Restoration.<\/p><h2>Thronprobe<\/h2><p>Gedanke und stummes Formen des Wortes genügen nicht. Das abyssische Befehlswort muss gesprochen werden; ein Flüstern reicht. Vesper testete Rah zwischen den beiden gebauten Thronen hin und zurück. Die Worte bleiben nur den eingeweihten Personen zugänglich.<\/p><h2>Aufbau und offene Arbeiten<\/h2><p>Das Horn soll eine funktionierende Siedlung werden: gemeinsame Einrichtungen auf Ebene Eins, Kern- und Vertrauensquartiere auf Zwei, eingeschränkte Bibliothek und Werkstätten auf Drei. Der Haushalt ist am <strong>27. Februar<\/strong> eingezogen. Der erste Haushaltszug und die vier angeworbenen Fachkräfte sind am 27. Februar angekommen. Halthus wurde mit seinem richtigen Kopf und Steinsalbe wiederhergestellt und wird unter Tamsins Aufsicht gefangen gehalten. Artephius bleibt inaktiv; seine Wiederherstellung und der Ritualbeginn stehen noch aus.<\/p><h2>Weiterlesen<\/h2><p><a href=\"#/artikel/dirges-apollyon\">Dirges of Apollyon<\/a> · <a href=\"#/artikel/eye-of-vigilance\">Auge der Wachsamkeit<\/a> · <a href=\"#/artikel/horn-aufbau\">Aufbau und Umzug zum Horn<\/a><\/p><h2>Einzug am 27. Februar<\/h2><p>Der erste Zug erreichte das Horn von Westell aus. Branna Cole, Osric Fenlow, Edda Marr und Darric Holt haben ihre ersten Arbeiten aufgenommen. Edda versorgte das gemeinsame Abendessen und den ersten Bierausschank. <a href=\"#/artikel/horn-aufbau\">Bewohner und Aufbau<\/a>.<\/p><h2>Morgen des 28. Februar<\/h2><p>Der Haushalt ist eingezogen. Die vollständige Gebetsrezitation wurde abseits des Siegels geübt; praktische Probe und Ritualbeginn stehen weiterhin aus. Alle drei Augen bleiben außerhalb der Fassungen. Der Ritualhengst und die Materialien für Carnitheria sind vorhanden, jedoch unverbraucht; kein voller Rekonstruktionstag und keine Beschwörung sind abgeschlossen.<\/p><h2>Verbundene Akten<\/h2><p><a href=\"#/artikel/halthus\">Halthus<\/a> · <a href=\"#/artikel/artephius\">Artephius<\/a> · <a href=\"#/artikel/eye-of-withering\">Auge des Verwelkens<\/a> · <a href=\"#/artikel/carnitheria-rex\">Carnitheria Rex<\/a><\/p>","sources":["live","chronicle","timeline","horn-workforce"],"status":"Bewohnt · Ritual unbegonnen","links":["dirges-apollyon","eye-of-vigilance","horn-aufbau","halthus","artephius","eye-of-withering","carnitheria-rex"],"text":"Bekannter Auftrag Der Neunte Knoten soll Vetra-Kali binden und die Tears of Achlys gewinnen. Die aus C13 geborgenen Dirges of Apollyon bestätigen den 222-Tage-Ablauf nun unabhängig von Ezra. Das Ritual hat noch nicht begonnen
