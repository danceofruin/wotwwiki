ns wiederholt gelesenem Buch Briefe aus der Ferne.","body":"\u003ch2>Bekannt durch einen Gegenstand\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/styke\">Styke\u003c/a> erfuhr am 28. Januar, dass Kaitlyn wiederholt \u003cem>Briefe aus der Ferne - Lady Arienne Valewood\u003c/em> liest.\u003c/p>\n\u003ch2>Nicht weiter geklärt\u003c/h2>\n\u003cp>Der Name ist als Buchbezug bekannt. Eine persönliche Begegnung, eine ausgearbeitete Biographie der Autorin oder eine Verbindung zur laufenden Intrige sind nicht etabliert.\u003c/p>\n","sources":["chronicle"],"status":"Erwähnt","tags":["Buch","Kaitlyn"],"aliases":[],"group":"history","text":"Bekannt durch einen Gegenstand Styke erfuhr am 28. Januar, dass Kaitlyn wiederholt Briefe aus der Ferne - Lady Arienne Valewood liest. Nicht weiter geklärt Der Name ist als Buchbezug bekannt. Eine persönliche Begegnung, eine ausgearbeitete Biographie der Autorin oder eine Verbindung zur laufenden Intrige sind nicht etabliert.","links":["styke"],"backlinks":[],"search":"lady arienne valewood name auf kaitlyns wiederholt gelesenem buch briefe aus der ferne buch kaitlyn history bekannt durch einen gegenstand styke erfuhr am 28 januar dass kaitlyn wiederholt briefe aus der ferne lady arienne valewood liest nicht weiter geklart der name ist als buchbezug bekannt eine personliche begegnung eine ausgearbeitete biographie der autorin oder eine verbindung zur laufenden intrige sind nicht etabliert"},{"id":"aldencross","category":"orte","title":"Aldencross","summary":"Offener Marktort unterhalb Balentynes. Hier lebt die Gruppe seit dem 23. Januar unter Tarnung.","body":"\u003ch2>Gestalt und Lage\u003c/h2>\n\u003cp>Aldencross ist eine offene Marktstadt nahe der Watch Wall, \u003cstrong>keine ummauerte Stadt mit Südtor\u003c/strong>. Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne.\u003c/p>\n\u003ch2>Wirtschaft und Gesellschaft\u003c/h2>\n\u003cp>Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern.\u003c/p>\n\u003ch2>Die Gruppe im Ort\u003c/h2>\n\u003cp>Seit 23. Januar dient das \u003ca href=\"#/artikel/dalliance\">Lord's Dalliance\u003c/a> als Unterkunft. Der \u003ca href=\"#/artikel/scroll\">Illuminated Scroll\u003c/a>, das \u003ca href=\"#/artikel/mott-haus\">Mott-Haus\u003c/a>, das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte.\u003c/p>\n\u003ch2>Aktueller Druck\u003c/h2>\n\u003cp>Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.\u003c/p>\n","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":[],"parent":"talingarde","text":"Gestalt und Lage Aldencross ist eine offene Marktstadt nahe der Watch Wall, keine ummauerte Stadt mit Südtor . Das Ortsdossier nennt etwa 1.800 Einwohner und eine enge Verbindung zur ungefähr eine Meile entfernt auf höherem Grund liegenden Festung Balentyne. Wirtschaft und Gesellschaft Soldaten, Reisende, königliche Arbeiten und Nordhandel machen den Ort vergleichsweise geordnet und wohlhabend. Nahrung, Brennstoff, Hufeisen, Reparaturen, Wäsche, Pferde und Tagelohnarbeit verbinden fast jede Familie mit der Festung. Fremde Händler sind plausibel; behauptete Ortsansässigkeit kann an gegenseitigem Erkennen scheitern. Die Gruppe im Ort Seit 23. Januar dient das Lord's Dalliance als Unterkunft. Der Illuminated Scroll , das Mott-Haus , das zivile Arbeitsnetz um Mara und Ellyn und Barnabus' Mannschaft sind wichtige Kontakte. Aktueller Druck Varnings Tod ist seit dem 31. Januar in Balentyne bekannt. Der zivile Zugang wurde enger kontrolliert. Die Stadt bleibt bewohnt und geschäftig; sie ist keine leere Missionskulisse.","links":["dalliance","scroll","mott-haus"],"backlinks":["havelyn","story-so-far"],"search":"aldencross offener marktort unterhalb balentynes hier lebt die gruppe seit dem 23 januar unter tarnung aldencross gestalt und lage aldencross ist eine offene marktstadt nahe der watch wall keine ummauerte stadt mit sudtor das ortsdossier nennt etwa 1 800 einwohner und eine enge verbindung zur ungefahr eine meile entfernt auf hoherem grund liegenden festung balentyne wirtschaft und gesellschaft soldaten reisende konigliche arbeiten und nordhandel machen den ort vergleichsweise geordnet und wohlhabend nahrung brennstoff hufeisen reparaturen wasche pferde und tagelohnarbeit verbinden fast jede familie mit der festung fremde handler sind plausibel behauptete ortsansassigkeit kann an gegenseitigem erkennen scheitern die gruppe im ort seit 23 januar dient das lord s dalliance als unterkunft der illuminated scroll das mott haus das zivile arbeitsnetz um mara und ellyn und barnabus mannschaft sind wichtige kontakte aktueller druck varnings tod ist seit dem 31 januar in balentyne bekannt der zivile zugang wurde enger kontrolliert die stadt bleibt bewohnt und geschaftig sie ist keine leere missionskulisse"},{"id":"dalliance","category":"orte","title":"Lord's Dalliance","summary":"Basis des Knotens in Aldencross; großes Hinterzimmer sowie ein kleines Zweibettzimmer bleiben bis zum 9. Februar gehalten.","body":"\u003ch2>Haus und Zimmer\u003c/h2>\u003cp>Bellam und Alicia Barhold betreiben Aldencross’ wichtigste Herberge. Styke, Vesper und Valeria halten das große rückwärtige Zimmer im Obergeschoss. Sechs Päckchen Rattengift und die neu gekauften Schriftrollen gehören zur aktuellen Operationsausrüstung.\u003c/p>\n\u003ch2>Keller und Tunnel\u003c/h2>\u003cp>Hinter den Vorräten liegt die verdeckte Zwergentür zum \u003ca href=\"#/artikel/tunnel\">Geheimgang nach Balentyne\u003c/a>. Zwei schwere Wandketten sind tief im Gang verankert. Sie halten einen gewöhnlichen Körper, blockieren aber weder Sprache noch Zauberei.\u003c/p>\n\u003ch2>Angriffsnacht\u003c/h2>\u003cp>Bellam und Alicia sollen, wenn möglich, spät gewarnt und durch Keller und Tunnel aus der Bugbear-Gefahr gebracht werden. Gewalt oder Bewusstlosschlagen bleibt nur die Notlösung, falls Alarm oder Weigerung den Schutz unmöglich machen. Die rothaarige Bedienung soll ebenfalls geschützt werden, sofern sie am 8. Februar im Haus ist.\u003c/p>\n\u003ch2>Aktueller Rand\u003c/h2>\u003cp>Styke, Vesper und Valeria schlafen im rückwärtigen Zimmer. Kaitlyn ist zum Mott-Haus gegangen; Mirelle arbeitet in ihrem Laden. Am 7. Februar will die Gruppe nach einem zusätzlichen Zimmer für Hakons Männer fragen.\u003c/p>\n\u003ch2>Stand am 7. Februar\u003c/h2>\u003cp>Das große rückwärtige Obergeschosszimmer bleibt die unmittelbare Basis. Zusätzlich ist bis zum 9. Februar ein kleines Zweibettzimmer für Nella und Tamsin gemietet. Sten und Ketil trafen als erstes sichtbares Paar aus Hakons Gruppe ein.\u003c/p>\u003cp>Tamsin führt in der Angriffsnacht Schutz und Evakuierung im Haus. Bellam und Alicia sollen nach Möglichkeit lebend aus der Gefahrenzone gebracht werden. Mirelle soll nach ihrer Abholung direkt hierher kommen.\u003c/p>","sources":["dalliance","live","chronicle","mirelle"],"status":"Basis gehalten / Schutz vorbereitet","tags":["Aldencross","Tunnel","Basis","Evakuierung"],"aliases":["Lords Dalliance","Dalliance","The Lord's Dalliance"],"parent":"aldencross","text":"Haus und Zimmer Bellam und Alicia Barhold betreiben Aldencross’ wichtigste Herberge. Styke, Vesper und Valeria halten das große rückwärtige Zimmer im Obergeschoss. Sechs Päckchen Rattengift und die neu gekauften Schriftrollen gehören zur aktuellen Operationsausrüstung. Keller und Tunnel Hinter den Vorräten liegt die verdeckte Zwergentür zum Geheimgang nach Balentyne . Zwei schwere Wandketten sind tief im Gang verankert. Sie halten einen gewöhnlichen Körper, blockieren aber weder Sprache noch Zauberei. Angriffsnacht Bellam und Alicia sollen, wenn möglich, spät gewarnt und durch Keller und Tunnel aus der Bugbear-Gefahr gebracht werden. Gewalt oder Bewusstlosschlagen bleibt nur die Notlösung, falls Alarm oder Weigerung den Schutz unmöglich machen. Die rothaarige Bedienung soll ebenfalls geschützt werden, sofern sie am 8. Februar im Haus ist. Aktueller Rand Styke, Vesper und Valeria schlafen im rückwärtigen Zimmer. Kaitlyn ist zum Mott-Haus gegangen; Mirelle arbeitet in ihrem Laden. Am 7. Februar will die Gruppe nach einem zusätzlichen Zimmer für Hakons Männer fragen. Stand am 7. Februar Das große rückwärtige Obergeschosszimmer bleibt die unmittelbare Basis. Zusätzlich ist bis zum 9. Februar ein kleines Zweibettzimmer für Nella und Tamsin gemietet. Sten und Ketil trafen als erstes sichtbares Paar aus Hakons Gruppe ein. Tamsin führt in der Angriffsnacht Schutz und Evakuierung im Haus. Bellam und Alicia sollen nach Möglichkeit lebend aus der Gefahrenzone gebracht werden. Mirelle soll nach ihrer Abholung direkt hierher kommen.","search":"lord s dalliance basis des knotens in aldencross grosses hinterzimmer sowie ein kleines zweibettzimmer bleiben bis zum 9 februar gehalten lords dalliance dalliance the lord s dalliance aldencross tunnel basis evakuierung haus und zimmer bellam und alicia barhold betreiben aldencross wichtigste herberge styke vesper und valeria halten das grosse ruckwartige zimmer im obergeschoss sechs packchen rattengift und die neu gekauften schriftrollen gehoren zur aktuellen operationsausrustung keller und tunnel hinter den vorraten liegt die verdeckte zwergentur zum geheimgang nach balentyne zwei schwere wandketten sind tief im gang verankert sie halten einen gewohnlichen korper blockieren aber weder sprache noch zauberei angriffsnacht bellam und alicia sollen wenn moglich spat gewarnt und durch keller und tunnel aus der bugbear gefahr gebracht werden gewalt oder bewusstlosschlagen bleibt nur die notlosung falls alarm oder weigerung den schutz unmoglich machen die rothaarige bedienung soll ebenfalls geschutzt werden sofern sie am 8 februar im haus ist aktueller rand styke vesper und valeria schlafen im ruckwartigen zimmer kaitlyn ist zum mott haus gegangen mirelle arbeitet in ihrem laden am 7 februar will die gruppe nach einem zusatzlichen zimmer fur hakons manner fragen stand am 7 februar das grosse ruckwartige obergeschosszimmer bleibt die unmittelbare basis zusatzlich ist bis zum 9 februar ein kleines zweibettzimmer fur nella und tamsin gemietet sten und ketil trafen als erstes sichtbares paar aus hakons gruppe ein tamsin fuhrt in der angriffsnacht schutz und evakuierung im haus bellam und alicia sollen nach moglichkeit lebend aus der gefahrenzone gebracht werden mirelle soll nach ihrer abholung direkt hierher kommen","links":["tunnel"],"backlinks":["bellam","alicia","tacitus","aldencross","zimmer","spielstand","story-so-far","zeit-0123","zeit-0201","mirelle"]},{"id":"zimmer","category":"orte","title":"Das rückwärtige Zimmer","summary":"Großer rückwärtiger Stützpunkt; am späten 7. Februar schlafen Styke, Vesper, Valeria und Nella dort.","body":"\u003ch2>Gemeinsamer Rückzugsort\u003c/h2>\u003cp>Das große rückwärtige Zimmer im \u003ca href=\"#/artikel/dalliance\">Lord’s Dalliance\u003c/a> dient Styke, Vesper und Valeria als Unterkunft und Besprechungsraum. Nella schläft am aktuellen Rand ebenfalls dort. Ein kleines Zweibettzimmer für Nella und Tamsin bleibt zusätzlich bis zum 9. Februar gemietet.\u003c/p>\u003ch2>Stand am 7. Februar\u003c/h2>\u003cp>Styke, Vesper, Valeria und Nella schlafen. Verse ist bei Vesper; Zorn lag zuletzt bei dem roten Buch und den Notizen auf dem Tisch. Kaitlyn und Tamsin sind nicht im großen Zimmer. Die Rast hat begonnen, aber der 8. Februar und die tägliche Auffrischung sind noch nicht erreicht.\u003c/p>","sources":["live","dalliance","mirelle","clocks-current"],"status":"Aktueller Ort","tags":["Aldencross","7. Februar","Lord’s Dalliance"],"aliases":[],"parent":"dalliance","text":"Gemeinsamer Rückzugsort Das große rückwärtige Zimmer im Lord’s Dalliance dient Styke, Vesper und Valeria als Unterkunft und Besprechungsraum. Nella schläft am aktuellen Rand ebenfalls dort. Ein kleines Zweibettzimmer für Nella und Tamsin bleibt zusätzlich bis zum 9. Februar gemietet. Stand am 7. Februar Styke, Vesper, Valeria und Nella schlafen. Verse ist bei Vesper; Zorn lag zuletzt bei dem roten Buch und den Notizen auf dem Tisch. Kaitlyn und Tamsin sind nicht im großen Zimmer. Die Rast hat begonnen, aber der 8. Februar und die tägliche Auffrischung sind noch nicht erreicht.","links":["dalliance"],"backlinks":[],"search":"das ruckwartige zimmer grosser ruckwartiger stutzpunkt am spaten 7 februar schlafen styke vesper valeria und nella dort aldencross 7 februar lord s dalliance gemeinsamer ruckzugsort das grosse ruckwartige zimmer im lord s dalliance dient styke vesper und valeria als unterkunft und besprechungsraum nella schlaft am aktuellen rand ebenfalls dort ein kleines zweibettzimmer fur nella und tamsin bleibt zusatzlich bis zum 9 februar gemietet stand am 7 februar styke vesper valeria und nella schlafen verse ist bei vesper zorn lag zuletzt bei dem roten buch und den notizen auf dem tisch kaitlyn und tamsin sind nicht im grossen zimmer die rast hat begonnen aber der 8 februar und die tagliche auffrischung sind noch nicht erreicht"},{"id":"tunnel","category":"orte","title":"Der Geheimgang","summary":"Entdeckter alter Zwergengang zwischen Dalliance-Keller und einem Vorratsraum Balentynes.","body":"\u003ch2>Entdeckung in der Nacht 27./28. Januar\u003c/h2>\n\u003cp>\u003ca href=\"#/artikel/vesper\">Vesper\u003c/a> führte die Suche, \u003ca href=\"#/artikel/styke\">Styke\u003c/a> half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an.\u003c/p>\n\u003ch2>Tatsächlich gesehene Gegenseite\u003c/h2>\n\u003cp>Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her.\u003c/p>\n\u003ch2>Was weiterhin fehlt\u003c/h2>\n\u003cp>Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route.\u003c/p>\n\u003ch2>Gegenwärtige Nutzung\u003c/h2>\u003cp>Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noch eine geprüfte magische Sicherung. Der Gang bleibt zugleich möglicher Zugang und Rückzugsweg.\u003c/p>\n","sources":["dalliance","balentyne","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Geheimtunnel","Zwergentunnel","Kellertunnel"],"parent":"dalliance","text":"Entdeckung in der Nacht 27./28. Januar Vesper führte die Suche, Styke half. Sie öffneten die verborgene Tür hinter den Kellervorräten mit einem verdeckten Stein. Der enge, gewundene Gang steigt über annähernd eine Meile zur Festung an. Tatsächlich gesehene Gegenseite Die ferne Zwergentür ließ sich vom Gang aus einen Spalt öffnen. Dahinter lag ein stiller Vorratsraum mit haltbaren Rationen und Wasserfässern. Styke und Vesper gingen nicht vollständig hinein. Sie kehrten ohne beobachteten Alarm zurück, schlossen beide Türen und stellten die Tarnung im Keller wieder her. Was weiterhin fehlt Verkehr im Raum, Nutzer, Wachrhythmus und Bedienung von der Raumseite sind nicht sicher bekannt. Aus einem ruhigen Beobachtungsmoment folgt keine dauerhaft unbewachte Route. Gegenwärtige Nutzung Zwei gewöhnliche Wandketten sind im Gang verankert. Sie bilden den geplanten Fesselpunkt für Tacitus und Jacobian, ersetzen aber weder Bewachung noch eine geprüfte magische Sicherung. Der Gang bleibt zugleich möglicher Zugang und Rückzugsweg.","links":["vesper","styke"],"backlinks":["dalliance","story-so-far","zeit-tunnel"],"search":"der geheimgang entdeckter alter zwergengang zwischen dalliance keller und einem vorratsraum balentynes geheimtunnel zwergentunnel kellertunnel aldencross entdeckung in der nacht 27 28 januar vesper fuhrte die suche styke half sie offneten die verborgene tur hinter den kellervorraten mit einem verdeckten stein der enge gewundene gang steigt uber annahernd eine meile zur festung an tatsachlich gesehene gegenseite die ferne zwergentur liess sich vom gang aus einen spalt offnen dahinter lag ein stiller vorratsraum mit haltbaren rationen und wasserfassern styke und vesper gingen nicht vollstandig hinein sie kehrten ohne beobachteten alarm zuruck schlossen beide turen und stellten die tarnung im keller wieder her was weiterhin fehlt verkehr im raum nutzer wachrhythmus und bedienung von der raumseite sind nicht sicher bekannt aus einem ruhigen beobachtungsmoment folgt keine dauerhaft unbewachte route gegenwartige nutzung zwei gewohnliche wandketten sind im gang verankert sie bilden den geplanten fesselpunkt fur tacitus und jacobian ersetzen aber weder bewachung noch eine geprufte magische sicherung der gang bleibt zugleich moglicher zugang und ruckzugsweg"},{"id":"balentyne","category":"orte","title":"Balentyne","summary":"Winterliche Grenzfestung unter erhöhter Wachsamkeit; der Angriff bleibt für die Nacht 8./9. Februar vorgesehen.","body":"\u003ch2>Bekannte Festung\u003c/h2>\u003cp>Balentyne liegt rund eine Meile oberhalb Aldencross an der Watch Wall. Lord Thomas Havelyn kommandiert Garnison, Offiziere, Priester, Magisterin, Spezialisten und zivile Arbeitskräfte.\u003c/p>\n\u003ch2>Varnings Tod und ziviler Zugang\u003c/h2>\u003cp>Seit Varnings Tod öffentlich wurde, werden Zivilisten strenger gezählt und begleitet. Vespers Arbeiterdeckung hielt auch am 6. Februar. Sie kann Zack inzwischen erkennen, besitzt aber keinen verlässlichen Dienstplan.\u003c/p>\n\u003ch2>Duell am 7. Februar\u003c/h2>\u003cp>Franz Mott tötete Zack Eddarly außerhalb der Festung im Duell. Captain Barhold entwaffnete Franz am Tor und eröffnete eine Untersuchung. Die spätere Dalliance-Prüfung bestätigte Stykes und Vespers zivile Tarnung.\u003c/p>\n\u003ch2>Tunnel, Eintopf und Termin\u003c/h2>\u003cp>Der Geheimgang vom Dalliance endet bei Vorräten und Wasserfässern. Zwei Ketten sind im Tunnel montiert. Sechs Giftpakete liegen im Wassermühlen-Versteck; Zusammensetzung, Dosis und Regelwirkung im großen Eintopf bleiben offen. Der Hauptangriff ist weiterhin für die Nacht vom 8. auf den 9. Februar geplant.\u003c/p>","sources":["balentyne","live","chronicle","timeline"],"status":"Ziel / Angriff 8.–9. Februar","tags":["Festung","Watch Wall","8./9. Februar"],"aliases":["Watchtower Balentyne","Festung"],"parent":"watch-wall","text":"Bekannte Festung Balentyne liegt rund eine Meile oberhalb Aldencross an der Watch Wall. Lord Thomas Havelyn kommandiert Garnison, Offiziere, Priester, Magisterin, Spezialisten und zivile Arbeitskräfte. Varnings Tod und ziviler Zugang Seit Varnings Tod öffentlich wurde, werden Zivilisten strenger gezählt und begleitet. Vespers Arbeiterdeckung hielt auch am 6. Februar. Sie kann Zack inzwischen erkennen, besitzt aber keinen verlässlichen Dienstplan. Duell am 7. Februar Franz Mott tötete Zack Eddarly außerhalb der Festung im Duell. Captain Barhold entwaffnete Franz am Tor und eröffnete eine Untersuchung. Die spätere Dalliance-Prüfung bestätigte Stykes und Vespers zivile Tarnung. Tunnel, Eintopf und Termin Der Geheimgang vom Dalliance endet bei Vorräten und Wasserfässern. Zwei Ketten sind im Tunnel montiert. Sechs Giftpakete liegen im Wassermühlen-Versteck; Zusammensetzung, Dosis und Regelwirkung im großen Eintopf bleiben offen. Der Hauptangriff ist weiterhin für die Nacht vom 8. auf den 9. Februar geplant.","links":[],"backlinks":["havelyn","zeit-0114"],"search":"balentyne winterliche g
