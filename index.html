mary":"Köchin und Gebundene des Knotens; seit dem Morgen des 3. Februar führt sie den Hakon- und Familienauftrag.","body":"<h2>Aus dem Gasthaus</h2>\n<p>Nella arbeitete im niedrigen Gasthaus des <a href=\"#/artikel/suedlicher-muehlenbezirk\">namenlosen südlichen Mühlenbezirks</a>. Sie bediente den Schankraum, kochte und lebte in einer kleinen Kammer hinter der Küche. Ihre Schwester wohnt mit ihrem Mann auf einem Hof eine kurze Strecke flussabwärts.</p>\n<p>Sie trägt dunkelbraunes Haar meist in einem schweren Zopf, hat dunkle Augen und eine kleine Kerbe durch die linke Braue. Ihre Stärken liegen in Arbeit, Menschenkenntnis, einfachem Rechnen, Vorräten und Versorgung – nicht im Kampf.</p>\n<h2>Der Preis der Straße</h2>\n<p>Am 2. Februar verließ Nella das Gasthaus zunächst für einen Goldtaler am Tag als Köchin. Im alten Schafgehege erfuhr sie von Asmodeus, Branderscar und der Gewaltgeschichte der Gruppe. Danach begleitete sie den Knoten zu Darran Vells Byre.</p>\n<p>Sie sah Darran und vier seiner Leute sterben, darunter zwei bereits unterlegene Männer. Sie erbrach sich, erkannte einen der Toten als verheirateten gelegentlichen Gast und stellte Styke zur Rede. Danach blieb sie: „Ich bin bereit, den Preis anzusehen. Ob ich jeden Teil davon zahlen kann, weiß ich erst, wenn er vor mir liegt.“</p>\n<h2>Der Compact</h2>\n<p>Nella hörte Pflichten, Hierarchie, Schutz, Versorgung, Lohn und den Weg zu größerer Verantwortung, bevor sie sich entschied. Ihr eigener Satz war knapp: „Ja. Ich will den Pakt.“ Vesper schrieb den Vertrag, Valeria las ihn vor und Nella setzte als Einzige ihr Blut darunter.</p>\n<p>Sie ist jetzt vollständig Gebundene unter Styke und Vesper, aber kein Mitglied des Kollektivs. Ihr Ziel ist nicht ein Jahr am Herd: Sie will Bestände führen, Lieferanten beurteilen, Diebstahl und Verlust bemerken und sich bis zu echter Verantwortung hocharbeiten.</p>\n<h2>Erster Auftrag</h2>\n<p>Nella brach am Morgen des 3. Februar mit Tamsin auf. Sie reitet die kleinere graue Mietstute und führt Vorräte sowie Stykes Nachricht für Hakon mit sich. Danach will sie ihre Schwester und deren Mann aus dem künftigen Kriegsgebiet bewegen.</p>\n<p>Bis 7. Februar besitzt sie begrenzte Einsatzgewalt über Tamsin; beide sollen gemeinsam zurückkehren. Seit dem Aufbruch hat die Aldencross-Gruppe keine Nachricht von ihnen.</p>\n<h2>Aktueller Stand</h2><p>Human Commoner 1, HP 3/3, unbewaffnet. Der Schnitt an der linken Hand stammt vom Compact. Nella ist unterwegs und trägt das schwarze Wäschestück von Mirelle noch verpackt bei sich. <a href=\"#/artikel/intim-nella\">Private Akte</a>.</p>","sources":["nella","live","chronicle","knot-pact","south-mill"],"status":"Vollständig gebunden / unterwegs","tags":["Köchin","Gebundene","Logistik","Unterwegs"],"aliases":[],"group":"inner","text":"Aus dem Gasthaus Nella arbeitete im niedrigen Gasthaus des namenlosen südlichen Mühlenbezirks . Sie bediente den Schankraum, kochte und lebte in einer kleinen Kammer hinter der Küche. Ihre Schwester wohnt mit ihrem Mann auf einem Hof eine kurze Strecke flussabwärts. Sie trägt dunkelbraunes Haar meist in einem schweren Zopf, hat dunkle Augen und eine kleine Kerbe durch die linke Braue. Ihre Stärken liegen in Arbeit, Menschenkenntnis, einfachem Rechnen, Vorräten und Versorgung – nicht im Kampf. Der Preis der Straße Am 2. Februar verließ Nella das Gasthaus zunächst für einen Goldtaler am Tag als Köchin. Im alten Schafgehege erfuhr sie von Asmodeus, Branderscar und der Gewaltgeschichte der Gruppe. Danach begleitete sie den Knoten zu Darran Vells Byre. Sie sah Darran und vier seiner Leute sterben, darunter zwei bereits unterlegene Männer. Sie erbrach sich, erkannte einen der Toten als verheirateten gelegentlichen Gast und stellte Styke zur Rede. Danach blieb sie: „Ich bin bereit, den Preis anzusehen. Ob ich jeden Teil davon zahlen kann, weiß ich erst, wenn er vor mir liegt.“ Der Compact Nella hörte Pflichten, Hierarchie, Schutz, Versorgung, Lohn und den Weg zu größerer Verantwortung e, Gasthaus und Höfe rund zwei Reitstunden südlich von Aldencross.","body":"<h2>Lage</h2><p>Der weiterhin namenlose Bezirk liegt rund zwei Reitstunden südlich von Aldencross. Eine Wassermühle, sechs oder sieben nahe Höfe, Schmiede, Viehverkehr und ein niedriges Gasthaus bilden seinen Kern.</p>\n<h2>Gasthaus und Nella</h2><p>Das Gasthaus besitzt vier grobe Tische, eine Bank an der Außenwand, Küche, schmale Hintertreppe und zwei Gastzimmer. <a href=\"#/artikel/nella\">Nella</a> arbeitete hier bis zum 2. Februar und lebte in einer Kammer hinter der Küche.</p>\n<h2>Byre und Schafgehege</h2><p><a href=\"#/artikel/darran-vell\">Darrans</a> Byre liegt ungefähr zehn Gehminuten südwestlich des Gasthauses. Das alte Schafgehege liegt weitere 35 bis 45 Reitminuten südwestlich. Dort wurde Tamsins Streit beigelegt, Nella gebunden und das Nachtlager errichtet.</p>\n<h2>Abreise am 3. Februar</h2><p>Nella und Tamsin verließen das Schafgehege auf ihrem Hakon- und Familienauftrag. Styke, Vesper und Valeria ritten nach Aldencross zurück. Seitdem besitzt die Gruppe im Dalliance keinen direkten Blick auf den Bezirk.</p>","sources":["south-mill","live","chronicle"],"status":"Bekannt","tags":["Mühle","Gasthaus","Schafgehege"],"aliases":["südlicher Mühlenbezirk","altes Schafgehege"],"text":"Lage Der weiterhin namenlose Bezirk liegt rund zwei Reitstunden südlich von Aldencross. Eine Wassermühle, sechs oder sieben nahe Höfe, Schmiede, Viehverkehr und ein niedriges Gasthaus bilden seinen Kern. Gasthaus und Nella Das Gasthaus besitzt vier grobe Tische, eine Bank an der Außenwand, Küche, schmale Hintertreppe und zwei Gastzimmer. Nella arbeitete hier bis zum 2. Februar und lebte in einer Kammer hinter der Küche. Byre und Schafgehege Darrans Byre liegt ungefähr zehn Gehminuten südwestlich des Gasthauses. Das alte Schafgehege liegt weitere 35 bis 45 Reitminuten südwestlich. Dort wurde Tamsins Streit beigelegt, Nella gebunden und das Nachtlager errichtet. Abreise am 3. Februar Nella und Tamsin verli mmary":"Aldencrosser Schneiderin mit eigenem Laden, genauer Hand und einem neuen persönlichen Verhältnis zu Styke, Vesper und Valeria.","body":"<h2>Schneiderin in Aldencross</h2>\n<p>Mirelle ist ungefähr dreißig und führt einen eigenen Schneiderladen in Aldencross. Sie schneidet und steckt selbst ab, liest Haltung und Bewegung beim Maßnehmen und achtet auf Asymmetrie, Griffgewohnheiten und die Stellen, an denen Stoff unter Arbeit oder Rüstung nachgibt.</p>\n<p>Dichtes kastanienbraunes Haar, warme braune Augen, volle Lippen, schmale Taille und kräftige Hüften prägen ihre Erscheinung. Außerhalb des Ladens war sie bislang nur wenige Tagesreisen von Aldencross entfernt.</p>\n<h2>Ein eigener Laden statt einer Ehe</h2>\n<p>Vor Jahren stand Mirelle kurz vor einer Heirat. Der Mann erwartete eine gewöhnliche Ehefrau und wollte ihre Schneiderei zur häuslichen Nebenarbeit machen. Mirelle entschied sich für den Laden. Sie lebt ohne Partner und ohne Kinder.</p>\n<h2>Die Aufträge vom 3. Februar</h2>\n<p>Styke zahlte 25 gp für vier fertige Wäschestücke: Rot und dunkles Pflaume für Vesper, Blau für Valeria und Schwarz für Nella. Vespers Stücke wurden am Greifschwanz angepasst; Nellas schwarzes Stück blieb verpackt.</p>\n<p>Außerdem nahm Mirelle Maße für <a href=\"#/artikel/mirelles-auftraege\">zwei neue Arbeiten</a>: festes Unterzeug unter Valerias Rüstung und dunkle Unterwäsche für Styke.</p>\n<h2>Der Abend im Dalliance</h2>\n<p>Mirelle kam mit Wein, Maßband und Arbeitstasche in das rückwärtige Zimmer. Aus Abendessen und Anproben wurde eine Nacht mit Styke, Vesper und Valeria; am Ende blieb sie bei ihnen im Bett.</p>\n<p>Sie kennt die drei als Kundschaft und Geliebte. Von ihrem Auftrag gegen Balentyne haben sie ihr nichts erzählt.</p>\n<h2>Private Akte (18+)</h2><p><a href=\"#/artikel/intim-mirelle\">Mirelle und das Trio</a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.</p>","sources":["mirelle","live","chronicle","dalliance"],"status":"Ne
