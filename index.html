. der ring of mind shielding ist identifiziert, aber nicht angelegt. die glaslinse bleibt unidentifiziert.","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"valeria","category":"charaktere","title":"Valeria","summary":"Antipaladin 7; im Horn, mit militärischer Führungsverantwortung und aufgefrischten Tagesressourcen.","body":"<h2>Identität<\/h2><p>Valeria von Karfeld ist eine menschliche Antipaladin, ehemalige Ritterin und vollwertige autonome Partnerin des Kerntrios. Ihre schwarze Dastard-Platte, das +1-Großschwert und der Stärke-Gürtel bilden ihr aktuelles Feldprofil.<\/p><h2>Entscheidungen im Horn<\/h2><p>Valeria ließ den alten Mitra-Schrein auf Ebene Zwei aus eigener Entscheidung unversehrt. Bei der Bindung der beiden Wächter prüfte sie ihre delegierte Befehlsgewalt. Touch of Corruption und die Staggered-Cruelty manifestierten sich erstmals sichtbar in echter Anwendung.<\/p><h2>Aktueller Stand<\/h2><p>Valeria ist mit dem ersten Haushaltszug im Horn angekommen und nutzt die bestehenden Quartiere auf Ebene Zwei. Am Morgen des 28. Februar: <strong>46/46 HP; Smite 3/3, Touch of Corruption 9/9, Challenge 1/1, Fiendish Boon 1/1.<\/strong> Ihr Charisma-Stirnreif +2 ist getragen; der Ersatz-STR-Gürtel ist nicht ausgerüstet.<\/p>","sources":["valeria","live","chronicle","farholde","relations"],"status":"Aktuell · 28. Februar morgens","tags":["Kernfigur","Stufe 7","Antipaladin","Horn"],"aliases":["Balina","Dame Balina","Sir Balin","Balina von Karfeld"],"group":"inner","initial":"V","text":"Identität Valeria von Karfeld ist eine menschliche Antipaladin, ehemalige Ritterin und vollwertige autonome Partnerin des Kerntrios. Ihre schwarze Dastard-Platte, das +1-Großschwert und der Stärke-Gürtel bilden ihr aktuelles Feldprofil. Entscheidungen im Horn Valeria ließ den alten Mitra-Schrein auf Ebene Zwei aus eigener Entscheidung unversehrt. Bei der Bindung der beiden Wächter prüfte sie ihre delegierte Befehlsgewalt. Touch of Corruption und die Staggered-Cruelty manifestierte >\n<p><a href=\"#/artikel/styke\">Styke<\/a> richtet seine Aufmerksamkeit auf Ausgänge, Reichweite, brauchbare Menschen und die Folgen eines Fehlers. Schmerz kann er einordnen; Ohnmacht nicht. Deshalb delegiert er an kompetente Gefährten, solange Zuständigkeit und Loyalität belastbar bleiben.<\/p>\n<h2>Wort und Folge<\/h2>\n<p>Versprechen, angenommene Bindung, konkrete Verantwortung, die eigenen Leute und die Mission bilden seine Moral. Am Freeman's Rock tötete er den kapitulierenden Varning, weil er zuvor keine Gefangenen festgelegt hatte. Dieselbe Konsequenz lässt ihn einen Verbündeten schützen oder eine zugesagte Last tragen.<\/p>\n<p>Unzuverlässigkeit trifft ihn stärker als offener Widerspruch. Eine harte Gegenmeinung kann er verarbeiten; ein gebrochenes Wort zerstört seine Berechnung der nächsten Folgen.<\/p>\n<h2>Angst, Wut und Schuld<\/h2>\n<p>Angst wird taktisch: Wie weit ist der Ausgang, wer ist verletzlich, welche Ressource bleibt? Tiefe Wut macht ihn leise und konkret. Er droht eher mit einer Handlung als mit einer Rede über seinen Status.<\/p>\n<p>Schuld verarbeitet er als Arbeit. Reparieren, bewachen, Grenzen einhalten und jemanden in die eigene Planung aufnehmen fallen ihm leichter als ein Bekenntnis. Darin liegen Fürsorge und Vermeidung dicht beieinander.<\/p>\n<h2>Schutz und Anspruch<\/h2>\n<p>Wenn Styke einen Menschen als eigene Verantwortung begreift, greift er in dessen Entscheidungen ein. Der Streit um <a href=\"#/artikel/timeon\">Timeon<\/a> zeigt den blinden Fleck: Er schützt Valeria vor einer gefährlichen Rückkehr und beansprucht dabei zugleich Deutung über einen Teil ihres früheren Lebens.<\/p>\n<h2>Vesper und Valeria<\/h2>\n<p>Mit Vesper bestehen gewachsene Abkürzungen aus Branderscar, Sex, Geheimnissen und gemeinsamem Überleben. Sie darf einen Informationszugang besitzen, den Styke nicht hat, ohne ihn jedes Mal erklären zu müssen.<\/p>\n<p>Bei Valeria ist jede Verlässlichkeit mit der Erinnerung an seine Täterschaft verschränkt. Am 31. Januar befolgte sie seinen Befehl und widersprach seinem Anspruch. Am nächsten Morgen führte und hielt sie ihn. Styke erlebte beides als Bindung.<\/p>\n<h2>Begehren<\/h2>\n<p>Styke ist körperlich direkt und wenig schamhaft. Begehren und Strategie laufen bei Kaitlyn gleichzeitig. Bei Vesper und Valeria erhalten eingehaltene Versprechen, vertauschte Rollen und die seltenen Momente, in denen er nicht entscheidet, besonderes Gewicht.<\/p>\n<p><a href=\"#/artikel/styke\">Zur Personenakte<\/a> / <a href=\"#/artikel/psy-vesper\">Vespers Profil<\/a> / <a href=\"#/artikel/psy-valeria\">Valerias Profil<\/a><\/p>\n<h2>Private Akte (18+)<\/h2>\n<p><a href=\"#/artikel/intim-styke\">Intimität und persönliche Beziehungen<\/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.<\/p>","sources":["styke","psy","relations","chronicle"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Handlungsfähigkeit Styke richtet seine Aufmerksamkeit auf Ausgänge, Reichweite, brauchbare Menschen und die Folgen eines Fehlers. Schmerz kann er einordnen; Ohnmacht nicht. Deshalb delegiert er an kompetente Gefährten, solange Zuständigkeit und Loyalität belastbar bleiben. Wort und Folge Versprechen, angenommene Bindung, konkrete Verantwortung, die eigenen Leute und die Mission bilden seine Moral. Am Freeman's Rock tötete er den kapitulierenden Varning, weil er zuvor keine Gefangenen festgelegt hatte. Dieselbe Konsequenz lässt ihn einen Verbündeten schützen oder eine zugesagte Last tragen. Unzuverlässigkeit trifft ihn stärker als offener Widerspruch. Eine harte Gegenmeinung kann er verarbeiten; ein gebrochenes Wort zerstört seine Berechnung der nächsten Folgen. Angst, Wut und Schuld Angst wird taktisch: Wie weit ist der Ausgang, wer ist verletzlich, welche Ressource bleibt? Tiefe Wut macht ihn leise und konkret. Er droht eher mit einer Handlung als mit einer Rede über seinen Status. Schuld verarbeitet er als Arbeit. Reparieren, bewachen, h der einmaligen altersfreigabe in dieses dossier eingebunden.","initial":"P"},{"id":"psy-vesper","category":"profile","title":"Psychologisches Profil: Vesper","summary":"Neugier, Zugriff und die Menschen, bei denen Vesper ihre Wachsamkeit zeitweise ablegt.","body":"<h2>Neugier als Arbeitsweise<\/h2>\n<p><a href=\"#/artikel/vesper\">Vesper<\/a> will Antworten nicht nur besitzen. Sie will wissen, woher sie kommen, wem sie nützen und welche Tür sie öffnen. Aus einem Namen wird eine Spur, aus einem Schlüssel ein Zugang, aus einer beiläufigen Bemerkung eine Versuchsanordnung.<\/p>\n<p>Diese Neugier ist nicht immer zweckgebunden. <a href=\"#/artikel/verse\">Verse<\/a> und die Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus.<\/p>\n<h2>Sicherheit durch Auswege<\/h2>\n<p>Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes Eingeschlossensein trifft sie härter als eine gefährliche Lage, deren Regeln sie lesen kann.<\/p>\n<p>Der Preis dieser Gewohnheit ist Aufschub. Ein weiterer Zugang, eine zusätzliche Frage oder eine elegante Lüge können sie länger in einer riskanten Situation halten. Ihre soziale Klugheit schützt sie weder vor Irrtum noch vor einer gut erzählten Täuschung.<\/p>\n<h2>Manipulation und Kontrolle<\/h2>\n<p>Vesper rahmt bevorzugt wahre Einzelheiten so, dass andere den falschen Schluss ziehen. Sie kann jemanden mögen und im selben Gespräch benutzen. Befehle sind ihr weniger wichtig als Wissen, Zugriff und die Möglichkeit, den nächsten Schritt zu bestimmen.<\/p>\n<p>In vertrauter Umgebung legt sie diese Regie zeitweise ab. Am 31. Januar gab Styke ihr vor Valerias Rückkehr die Führung; später wechselten beide wieder in Zärtlichkeit. Das reizte sie gerade, weil ihre Beziehung nicht an eine einzige Rollenverteilung gebunden ist.<\/p>\n<h2>Angst, Wut und Scham<\/h2>\n<p>Unter Angst werden ihre Fragen kurz und prüfbar: Wer hat es gesehen? Welche Tür? Wie viele? Was wissen sie? Bei echter Wut verschwindet der Witz. Scham versucht sie zunächst zu analysieren; wenn das nicht gelingt, verraten Pause, ausgebliebener Scherz oder eine praktische Geste mehr als ein Bekenntnis.<\/p>\n<h2>Styke, Verse und Valeria<\/h2>\n<p>Mit Styke teilt sie Flucht, Verbrechen, Bett, Planung und die Absicht, Thorn zu überleben. Verse ist ein Teil ihrer eigenen Geschichte; sie weigerte sich, ihn zurückzulassen, und behandelt seinen Widerspruch als Zeichen seiner Person.<\/p>\n<p><a href=\"#/artikel/valeria\">Valeria<\/a> verbindet frühere Gegnerin, Opfer, begehrte Gefährtin und militärische Partnerin. Am 31. Januar sorgte Vesper sich offen um ihre Abwesenheit. In der folgenden Nacht wurde sie Valeria körperlich nah, reinigte sie und blieb bei ihr, bis sie einschlief.<\/p>\n<h2>Private Akte (18+)<\/h2>\n<p><a href=\"#/artikel/intim-vesper\">Intimität und persönliche Beziehungen<\/a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.<\/p>","sources":["vesper","psy","relations","verse"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Neugier als Arbeitsweise Vesper will Antworten nicht nur besitzen. Sie will wissen, woher sie kommen, wem sie nützen und welche Tür sie öffnen. Aus einem Namen wird eine Spur, aus einem Schlüssel ein Zugang, aus einer beiläufigen Bemerkung eine Versuchsanordnung. Diese Neugier ist nicht immer zweckgebunden. Verse und die Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus. Sicherheit durch Auswege Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes kt ist durch die tatsächliche Rückkehr am 25. Februar erledigt; sie läuft nicht weiter als neue Frist.<\/p><h2>Aktueller Auftrag im Horn<\/h2><p>Tamsin hält den Zugang unter Kontrolle und beaufsichtigt Halthus’ Haft und die Nachtwache. Halthus sitzt lebend und entwaffnet in der Stahlzelle auf Ebene Drei; seine Ausrüstung ist bei Tamsin auf Ebene Eins. Edda bringt Essen und Wasser.<\/p>","sources":["tamsin-current","live","chronicle","treasury"],"status":"Haushaltssicherheit · Rekrutierung beauftragt","tags":["Sicherheit","Gebundene","Farholde","Bericht ausstehend"],"aliases":["Blackerly","Tomas Blackerly"],"group":"inner","text":"Rolle Tamsin führt Zugänge, Wachen, Schlafordnung und Marschsicherheit. Ihr erster Farholde-Bericht benannte Rubal Thraam als Zentrum des Drownington-Schwarzmarkts und den auffällig spielenden Hafenbeamten Mallory Ritkin. Ausrüstung und Auftrag Donnagins +1-Brustplatte, Varnings +1-Schwerer Schild und der +1-Umhang bleiben ihre Ausrüstung. Die Personalsuche ergab die vier inzwischen eingezogenen Fachkräfte. Ihr heutiger Auftrag ist die Zugangssicherung und Halthus’ Haft. Notfallgrenze Die einwöchige Rückzugsermächtigung für einen ausgebliebenen Hornkontakt ist durch die tatsächliche Rückkehr am 25. Februar erledigt; sie läuft nicht weiter als neue Frist. Aktueller Auftrag im Horn Tamsin hält den Zugang unter Kontrolle und beaufsichtigt Halthus’ Haft und die Nachtwache. Halthus sitzt lebend und entwaffnet in der Stahlzelle auf Ebene Drei; seine Ausrüstung ist bei Tamsin auf Ebene Eins. Edda bringt Essen und Wasser.","search":"tamsin blackerly sicherheitsverantwortliche im horn; zugang, nachtwache und halthus’ haft. sicherheit gebundene farholde bericht ausstehend blackerly tomas blackerly rolle tamsin fuhrt zugange, wachen, schlafordnung und marschsicherheit. ihr erster farholde-bericht benannte rubal thraam als zentrum des drownington-schwarzmarkts und den auffallig spielenden hafenbeamten mallory ritkin. ausrustung und auftrag donnagins +1-brustplatte, varnings +1-schwerer schild und der +1-umhang bleiben ihre ausrustung. die personalsuche ergab die vier inzwischen eingezogenen fachkrafte. ihr heutiger auftrag ist die zugangssicherung und halthus’ haft. notfallgrenze die einwochige ruckzugsermachtigung fur einen ausgebliebenen hornkontakt ist durch die tatsachliche ruckkehr am 25. februar erledigt; sie lauft nicht weiter als neue frist. aktueller auftrag im horn tamsin halt den zugang unter kontrolle und beaufsichtigt halthus’ haft und die nachtwache. halthus sitzt lebend und entwaffnet in der stahlzelle auf ebene drei; seine ausrustung ist bei tamsin auf ebene eins. edda bringt essen und wasser.","links":[],"backlinks":["branderscar","zeit-branderscar","anatomie-tamsin"],"initial":"T","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"timeon","category":"personen","title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"<h2>Balinas Knappe<\/h2>\n<p>Timeon war der junge Knappe von <a href=\"#/artikel/valeria\">Dame Balina<\/a> und blieb Mitra zugewandt. Der <a href=\"#/artikel/privatpakt\">Privatpakt<\/a> trägt weder seinen Namen noch seine Zusage. Gegenüber <a href=\"#/artikel/styke\">Styke<\/a> und dem Knoten überwiegt Furcht.<\/p>\n<h2>Erinnerung an Balentyne<\/h2>\n<p>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe <a href=\"#/artikel/timeon-karte\">Karte<\/a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.<\/p>\n<h2>Auf dem Familienhof<\/h2>\n<p>Tamsin brachte ihn zum vorgesehenen <a href=\"#/artikel/timeon-hof\">Familienanwesen<\/a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.<\/p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["valeria","privatpakt","styke","timeon-karte","timeon-hof"],"backlinks":["psy-styke","psy-valeria","timeon-hof","thorn-manor","mitra","timeon-karte","privatpakt","zeit-ausbildung","zeit-0123","zeit-valeria-rueckkehr"],"search":"timeon valerias fruherer knappe: mitranisch, verangstigt, auf einem familienhof untergebracht und trager einer groben erinnerungskarte. knappe sicher untergebracht  balinas knappe timeon war der junge knappe von dame balina und blieb mitra zugewandt. der privatpakt tragt weder seinen namen noch seine zusage. gegenuber styke und dem knoten uberwiegt furcht. erinnerung an balentyne wahrend der ausbildung berichtete timeon, woran er sich aus balentyne erinnerte, und zeichnete eine grobe karte . sie bildet seinen damaligen wissensstand ab und lasst raume, wege und spatere anderungen offen. auf dem familienhof tamsin brachte ihn zum vorgesehenen familienanwesen . valeria ritt am 31. januar hin und sah selbst, dass er dort sicher war. sie versprach ihm eine ruckkehr, erhielt spater jedoch von styke den befehl, den hof nicht erneut aufzusuchen.","initial":"T"},{"id":"thorn","category":"personen","title":"Kardinal Adrastus Thorn","summary":"Auftraggeber des Dornpakts; erteilte am 20. Februar den Auftrag am Horn von Abaddon.","body":"<h2>Der zweite Auftrag<\/h2><p>Thorn befahl dem Knoten, im Caer Bryr das Horn von Abaddon zu finden, Markadians silbernes Mitra-Siegel zu brechen, Vetra-Kali Eats-the-Eyes zu rufen und zu binden und die Tears of Achlys zurückzubringen.<\/p><h2>Was Thorn geliefert hat<\/h2><p>Er benannte den Auftrag, die Rolle des Vierten und Siebten Knotens und Baron Vandermir als ersten Kontakt in Farholde. Styke erhielt ein neues tönernes Kommunikationssiegel.<\/p><h2>Grenzen<\/h2><p>Thorn erklärte ausdrücklich nicht, wie Siegel und Bindung funktionieren. Ein Endtermin wurde dem Knoten nicht genannt. Seine verborgene Vergangenheit und Absichten bleiben außerhalb des Spielerwissens.<\/p>","sources":["live","chronicle","transition","core"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Auftraggeber","Dornpakt","Horn von Abaddon","Buch Zwei"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Der zweite Auftrag Thorn befahl dem Knoten, im Caer Bryr das Horn von Abaddon zu finden, Markadians silbernes Mitra-Siegel zu brechen, Vetra-Kali Eats-the-Eyes zu rufen und zu binden und die Tears of Achlys zurückzubringen. Was Thorn geliefert hat Er benannte den Auftrag, die Rolle des Vierten und Siebten Knotens und Baron Vandermir als ersten Kontakt in Farholde. Styke erhielt ein neues tönernes Kommunikationssiegel. Grenzen Thorn erklärte ausdrücklich nicht, wie Siegel und Bindung funktionieren. Ein Endtermin wurde dem Knoten nicht genannt. Seine verborgene Vergangenheit und Absichten bleiben außerhalb des Spielerwissens.","links":[],"backlinks":["zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber des dornpakts; erteilte am 20. februar den auftrag am horn von abaddon. auftraggeber dornpakt horn von abaddon buch zwei adrastus thorn cardinal thorn der zweite auftrag thorn befahl dem knoten, im caer bryr das horn von abaddon zu finden, markadians silbernes mitra-siegel zu brechen, vetra-kali eats-the-eyes zu rufen und zu binden und die tears of achlys zuruckzubringen. was thorn geliefert hat er benannte den auftrag, die rolle des vierten und siebten knotens und baron vandermir als ersten kontakt in farholde. styke erhielt ein neues tonernes kommunikationssiegel. grenzen thorn erklarte ausdrucklich nicht, wie siegel und bindung funktionieren. ein endtermin wurde dem knoten nicht genannt. seine verborgene vergangenheit und absichten bleiben ausserhalb des spielerwissens.","initial":"K"},{"id":"tiadora","category":"personen","title":"Tiadora","summary":"Thorns infernale Botin; führte den Knoten zu Vandermir und kündigte die Ankunft des Siebten Knotens an.","body":"<h2>Auf der Flussfahrt<\/h2><p>Tiadora brachte Belohnung und Abreisebefehl, beanspruchte die einzige Kabine der Folly und setzte den propagandistischen Rahmen der falschen Ritteroperationen.<\/p><h2>Farholde<\/h2><p>Am 22. Februar führte sie Styke, Vesper, Valeria und Kaitlyn nach Vanderhall. Beim Dinner kündigte sie Elise Zadaria und den Siebten Knoten für den folgenden Tag an. Seitdem hält sie sich zurück; sie lieferte weder die Lösung für Siegel und Bindung noch eine Erklärung des Horninneren.<\/p>","sources":["core","live","chronicle","transition"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Thorn","Botin","Farholde","Vandermir"],"aliases":[],"group":"history","text":"Auf der Flussfahrt Tiadora brachte Belohnung und Abreisebefehl, beanspruchte die einzige Kabine der Folly und setzte den propagandistischen Rahmen der falschen Ritteroperationen. Farholde Am 22. Februar führte sie Styke, Vesper, Valeria und Kaitlyn nach Vanderhall. Beim Dinner kündigte sie Elise Zadaria und den Siebten Knoten für den folgenden Tag an. Seitdem hält sie sich zurück; sie lieferte weder die Lösung für Siegel und Bindung noch eine Erklärung des Horninneren.","links":[],"backlinks":["zeit-branderscar"],"search":"tiadora thorns infernale botin; fuhrte den knoten zu vandermir und kundigte die ankunft des siebten knotens an. thorn botin ["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"group":"field","text":"Begegnung und Abmachung Am 14. Januar 4712 AR erhielt Sakkarot Thorns Waffenlieferung. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden. Geteiltes Wissen Er enthüllte gegenüber Styke und Vesper , dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht. Vor dem Signal · historische Frist Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist kein mit Sakkarot vereinbarter Termin . Es wurde ihm dazu noch keine Nachricht geschickt. Die Nacht des Signals Styke, Vesper und Valeria schossen das vereinbarte rote Signal gemeinsam nahe dem Dalliance ab. Etwa eine Stunde später lief Fire-Axes erste große Welle durch das bereits offene Tor. Beim späteren Blick vom Festungsdach war sein Heer tief im Inneren und sichtbar am Gewinnen.","links":["styke","vesper"],"backlinks":["zeit-0114"],"search":"sakkarot fire-axe fire-axes heer nahm das rote signal auf, drang durch das offene tor ein und war beim letzten direkten blick klar am gewinnen. bugbear verbundeter fire-axe feueraxt begegnung und abmachung am 14. januar 4712 ar erhielt sakkarot thorns waffenlieferung. styke versprach ihm personlich, balentynes tor zu offnen. sakkarot fuhrt das bugbearheer und ist mit thorn uber asmodeus sowie den avernischen ersten knoten verbunden. geteiltes wissen er enthullte gegenuber styke und vesper , dass thorn fruher ein kardinal mitras war. einen alten namen oder den genauen grund seines falls lieferte diese erzahlung nicht. vor dem signal · historische frist die einmonatige operationsfrist seit der lieferungsphase erzeugt druck. der im dalliance erwogene angriff in der nacht 8./9. februar ist kein mit sakkarot vereinbarter termin . es wurde ihm dazu noch keine nachricht geschickt. die nacht des signals styke, vesper und valeria schossen das vereinbarte rote signal gemeinsam nahe dem dalliance ab. etwa eine stunde spater lief fire-axes erste grosse welle durch das bereits offene tor. beim spateren blick vom festungsdach war sein heer tief im inneren und sichtbar am gewinnen.","initial":"S"},{"id":"bellam","category":"personen","title":"Bellam Barhold","summary":"Bellam Barhold erhielt in Farholde den vereinbarten Anteil und verließ die aktive Operation.","body":"<h2>Abschied in Farholde<\/h2><p>Bellam Barhold verließ Aldencross mit Alicia und den geretteten persönlichen Dingen auf Halstyn’s Folly. Am 21. Februar erhielten beide gemeinsam die versprochenen <strong>1.500 gp<\/strong>.<\/p><h2>Außerhalb der Operation<\/h2><p>Bellam und Alicia sind freie Zivilisten und gehören nicht zum Farholde-Haushalt oder zur Hornoperation. Stykes frühere Zusage, ihnen nach Möglichkeit beim Aufbau einer neuen Herberge zu helfen, bleibt bestehen.<\/p>","sources":["core","dalliance","live","treasury","chronicle"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Dalliance","Wirt"],"aliases":[],"group":"town","text":"Abschied in Farholde Bellam Barhold verließ Aldencross mit Alicia und den geretteten persönlichen Dingen auf Halstyn’s Folly. Am 21. Februar erhielten beide gemeinsam die versprochenen 1.500 gp . Außerhalb der Operation Bellam und Alicia sind freie Zivilisten und gehören nicht zum Farholde-Haushalt oder zur Hornoperation. Stykes frühere Zusage, ihnen nach Möglichkeit beim Aufbau einer neuen Herberge zu helfen, bleibt bestehen.","links":[],"backlinks":[],"search":"bellam barhold bellam barhold erhielt in farholde den vereinbarten anteil und verliess die aktive operation. dalliance wirt  abschied in farholde bellam barhold verliess aldencross mit alicia und den geretteten personlichen dingen auf halstyn’s folly. am 21. februar erhielten beide gemeinsam die versprochenen 1.500 gp . ausserhalb der operation bellam und alicia sind freie zivilisten und gehoren nicht zum farholde-haushalt oder zur hornoperation. stykes fruhere zusage, ihnen nach moglichkeit beim aufbau einer neuen herberge zu helfen, bleibt bestehen.","initial":"B"},{"id":"alicia","category":"personen","title":"Alicia Barhold","summary":"Alicia Barhold erhielt in Farholde den vereinbarten Anteil und verließ die aktive Operation.","body":"<h2>Abschied in Farholde<\/h2><p>Alicia verließ Aldencross mit Bellam und den geretteten persönlichen Dingen auf Halstyn’s Folly. Am 21. Februar erhielten beide gemeinsam die versprochenen <strong>1.500 gp<\/strong>.<\/p><h2>Außerhalb der Operation<\/h2><p>Sie ist eine freie Zivilistin und gehört nicht zum Farholde-Haushalt oder zur Hornoperation. Ein neues Reiseziel oder eine eigene Bindung an den Knoten ist nicht festgelegt.<\/p>","sources":["dalliance","live","treasury","chronicle"],"status":"Aktuell bis 24. Februar 4712 AR","tags":["Dalliance"],"aliases":[],"group":"town","text":"Abschied in Farholde Alicia verließ Aldencross mit Bellam und den geretteten persönlichen Dingen auf Halstyn’s Folly. Am 21. Februar erhielten beide gemeinsam die versprochenen 1.500 gp . Außerhalb der Operation Sie ist eine freie Zivilistin und gehört nicht zum Farholde-Haushalt oder zur Hornoperation. Ein neues Reiseziel oder eine eigene Bindung an den Knoten ist nicht festgelegt.","links":[],"backlinks":[],"search":"alicia barhold alicia barhold erhielt in farholde den vereinbarten anteil und verliess die aktive operation. dalliance  abschied in farholde alicia verliess aldencross mit bellam und den geretteten personlichen dingen auf halstyn’s folly. am 21. februar erhielten beide gemeinsam die versprochenen 1.500 gp . ausserhalb der operation sie ist eine freie zivilistin und gehort nicht zum farholde-haushalt oder zur hornoperation. ein neues reiseziel oder eine eigene bindung an den knoten ist nicht festgelegt.","initial":"A"},{"id":"barnabus","category":"personen","title":"Barnabus Eisenbauch","summary":"Zwergeningenieur des Torhauses; mit seinen zehn Arbeitern am 9. Februar im Dalliance getötet.","body":"<h2>Zwergeningenieur<\/h2><p>Barnabus Eisenbauch leitete zehn Arbeiter, die im Dalliance wohnten und Balentynes Torhaus warteten. Sein Bericht über getrennte Winden, vier Dauerwachen, Tagesingenieure und Heißsandabwehr half dem Knoten bei der Vorbereitung.<\/p>\n<h2>Ende am 9. Februar<\/h2><p>Styke und Hakon töteten Barnabus und seine zehn Arbeiter am frühen Morgen im Dalliance. Beim geordneten Abzug wurden 45 gp eingesammelt. Über spätere Vorgänge in den Zimmern oder den restlichen Besitz liegt kein neuer Bericht vor.<\/p><h2>Nach dem 9. Februar<\/h2><p>Barnabus und seine zehn Leute wurden am frühen Morgen im Dalliance getötet; beim Abzug wurden 45 gp eingesammelt. Spätere Vorgänge in den Zimmern sind nicht beobachtet.<\/p>","sources":["core","chronicle","live"],"status":"Verstorben am 9. Februar","tags":["Zwerg","Ingenieur","Dalliance"],"aliases":["Eisenbauch","Ironbelly"],"group":"town","text":"Zwergeningenieur Barnabus Eisenbauch leitete zehn Arbeiter, die im Dalliance wohnten und Balentynes Torhaus warteten. Sein Bericht über getrennte Winden, vier Dauerwachen, Tagesingenieure und Heißsandabwehr half dem Knoten bei der Vorbereitung. Ende am 9. Februar Styke und Hakon töteten Barnabus und seine zehn Arbeiter am frühen Morgen im Dalliance. Beim geordneten Abzug wurden 45 gp eingesammelt. Über spätere Vorgänge in den Zimmern oder den restlichen Besitz liegt kein neuer Bericht vor. Nach dem 9. Februar Barnabus und seine zehn Leute wurden am frühen Morgen im Dalliance getötet; beim Abzug wurden 45 gp eingesammelt. Spätere Vorgänge in den Zimmern sind nicht beobachtet.","links":[],"backlinks":["zarik"],"search":"barnabus eisenbauch zwergeningenieur des torhauses; mit seinen zehn arbeitern am 9. februar im dalliance getotet. zwerg ingenieur dalliance eisenbauch ironbelly zwergeningenieur barnabus eisenbauch leitete zehn arbeiter, die im dalliance wohnten und balentynes torhaus warteten. sein bericht uber getrennte winden, vier dauerwachen, tagesingenieure und heisssandabwehr half dem knoten bei der vorbereitung. ende am 9. februar styke und hakon toteten barnabus und seine zehn arbeiter am fruhen morgen im dalliance. beim geordneten abzug wurden 45 gp eingesammelt. uber spatere vorgange in den zimmern oder den restlichen besitz liegt kein neuer bericht vor. nach dem 9. februar barnabus und seine zehn leute wurden am fruhen morgen im dalliance getotet; beim abzug wurden 45 gp eingesammelt. spatere vorgange in den zimmern sind nicht beobachtet.","initial":"B","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"mara","category":"personen","title":"Mara Fenner","summary":"Zivile Arbeiterin, vertrauter Kontakt und Informationsquelle. Früher von Styke auch Hazel genannt.","body":"<h2>Identität und Alltag<\/h2>\n<p>Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. <strong>Hazel<\/strong> war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person.<\/p>\n<h2>Styke, Ellyn und das hintere Zimmer<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> lernte Mara und <a href=\"#/artikel/ellyn\">Ellyn Reed<\/a> am 23. Januar bei den Wagenhöfen kennen. Am selben Tag folgte die Begegnung im <a href=\"#/artikel/wash-shed\">Waschschuppen<\/a>. Am 30. Januar kam Mara nach ihrer Schicht in das hintere Zimmer des Dalliance und schlief dort mit Styke, Vesper und Valeria.<\/p>\n<h2>Arbeit als Zugang<\/h2>\n<p>Mara und Ellyn stellten <a href=\"#/artikel/vesper\">Vesper<\/a> als tüchtige neue Arbeitskraft vor. So gelangte Vesper am 29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten.<\/p>\n<h2>Letzte Berichte<\/h2>\n<p>Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durc hemann. Die von Vesper offen ausgelegten Briefe machten Zacks Verhältnis mit Kaitlyn sichtbar.<\/p><h2>Das Duell<\/h2><p>Bei erstem Licht am 7. Februar traf Franz Zack außerhalb der Festung. Zack verwundete ihn leicht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter.<\/p><h2>Am Tor<\/h2><p>Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. <a href=\"#/artikel/captain-barhold\">Captain Barhold<\/a> ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.<\/p>","sources":["core","chronicle","live"],"status":"Nach Festsetzung unbekannt","tags":["Balentyne","Captain","Kaitlyn","Duell"],"aliases":["Mott","Franz Mott"],"group":"garrison","text":"Stellung Franz Mott ist Offizier in Balentyne und Kaitlyn Motts Ehemann. Die von Vesper offen ausgelegten Briefe machten Zacks Verhältnis mit Kaitlyn sichtbar. Das Duell Bei erstem Licht am 7. Februar traf Franz Zack außerhalb der Festung. Zack verwundete ihn leicht. Franz brachte Zack mit der Hellebarde zu Boden und tötete ihn mit einem letzten Schlag in Hals und Schulter. Am Tor Styke offenbarte genug Wissen über die Briefe, um Franz hinter sich herzuziehen. Am Tor von Balentyne alarmierte Styke die Wachen. Captain Barhold ließ Franz entwaffnen, seine Wunde behandeln und ihn zunächst bis zur Untersuchung festsetzen. Die spätere Entscheidung der Festung ist Styke nicht bekannt.","links":["captain-barhold"],"backlinks":[],"search":"captain franz mott totete zack im duell und wurde anschliessend entwaffnet und festgesetzt; sein weiteres schicksal wahrend des angriffs kennt der knoten nicht. balentyne captain kaitlyn duell mott franz mott stellung franz mott ist offizier in balentyne und kaitlyn motts ehemann. die von vesper offen ausgelegten briefe machten zacks verhaltnis mit kaitlyn sichtbar. d  Ausbildung für Osrics Partnerperson und zwei Kinder in Farholde. Sie ist mit dem Haushalt im Horn angekommen. Regelmäßige Stadtbesuche für die Verbindung nach Farholde sind vorgesehen; damit ist keine bereits erfolgte Rückreise behauptet.<\/p>","sources":["kaitlyn","live","chronicle","relations"],"status":"Bei Styke · Hornumzug nach Lageübergabe vereinbart","tags":["Gebundene","Vertraute","Farholde","Silken Veil"],"aliases":[],"group":"town","text":"Verantwortung in Farholde Styke nahm Kaitlyn am 22. Februar in sein Kollektiv auf und setzte sie beim Vandermir-Dinner als Kommunikationsvertreterin des Knotens ein. Vandermir akzeptierte ihre Stimme als Kontaktweg. White Ravens Beim Treffen in der Grauen Möwe wurde Kaitlyn dem Siebten Knoten als Verbindung vorgestellt. Sie beobachtete alle vier Ravens. Traks wiederholte Blicke behandelt sie nur als mögliche Öffnung, nicht als Beweis für eine Absicht. Aktueller Auftrag Der Bericht vom 25. Februar enthielt keine Vandermir-Warnung und keinen direkten Trak-Vorstoß. Nach Elises tatsächlicher Begleitung zum Horn lebt Kaitlyn nun mit dem Haushalt dort. Regelmäßige Farholde-Besuche bleiben geplant; neue Kontakte oder Durchbrüche sind nicht behauptet. 26. Februar Kaitlyn begann den Tag bei Styke im unbenannten Schankenzimmer. Ihre Nachfrage zur Angehörigenabsicherung wurde vor der Abreise am 27. Februar als erfolgreich berichtet. Die sechs Seiten ihrer persönlichen Aufzeichnungen sind kein automatisch öffentliches Wissen; ein späteres Vorlesen bleibt ihre Absicht. Familienabsicherung und Umzug Kaitlyn bestätigte vor dem Aufbruch die über Vandermir organisierte Unterkunft, Versorgung und Ausbildung für Osrics Partnerperson und zwei Kinder in Farholde. Sie ist mit dem Haushalt im Horn angekommen. Regelmäßige Stadtbesuche für die Verbindung nach Farholde sind vorgesehen; damit ist keine bereits erfolgte Rückreise behauptet.","search":"kaitlyn mott gebundene vertraute, mitglied des kollektivs und verbindung zwischen dem neunten und Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung.<\/p><h2>Tod am 7. Februar<\/h2><p>Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.<\/p>","sources":["core","live","chronicle"],"status":"Tot seit 7. Februar","tags":["Balentyne","Captain","Kaitlyn","Tot"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Captain und Geliebter Zacharias „Zack“ Eddarly war Offizier in Balentyne und Kaitlyns langjähriger Freund und Geliebter. Vesper identifizierte ihn am 4. Februar anhand einer Beschreibung. Tod am 7. Februar Zack nahm Franz Motts Duellforderung an. Er traf Franz mit dem Langschwert und verwundete ihn leicht, wurde dann von Franz’ Hellebarde zu Boden gebracht und durch einen Schlag in Hals und Schulter getötet. Er starb binnen Sekunden und sprach nach dem tödlichen Treffer keine letzten Worte.","search":"captain zacharias \"zack\" eddarly captain zacharias eddarly, kaitlyns langjahriger freund und geliebter; am 7. februar von franz mott im duell getotet. balentyne captain kaitlyn tot zack zach zacharias eddarly zach eddarly captain und geliebter zacharias „zack“ eddarly war offizier in balentyne und kaitlyns langjahriger freund und geliebter. vesper identifizierte ihn am 4. februar anhand einer beschreibung. tod am 7. februar zack nahm franz motts duellforderung an. er traf franz mit dem langschwert und verwundete ihn leicht, wurde dann von franz’ hellebarde zu boden gebracht und durch einen schlag in hals und schulter getotet. er starb binnen sekunden und sprach nach dem todlichen treffer keine letzten worte.","links":[],"backlinks":["zeit-0201"],"initial":"C"},{"id":"donnagin","category":"personen","title":"Father Althus Donnagin","summary":"Balentynes ranghoher Mitra-Kleriker; im Schrein von Styke und Valeria getötet.","body":"<h2>Bekannte Rolle<\/h2><p>Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur.<\/p><h2>Tod im Schrein<\/h2><p>Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt.<\/p><h2>Valerias Abschied<\/h2><p>Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.<\/p>","sources":["core","live","chronicle"],"status":"Tot seit 9. Februar","tags":["Mitra","Kleriker","Balentyne"],"aliases":["Father Donnagin","Althus Donnagin","Donnagin"],"group":"garrison","text":"Bekannte Rolle Father Althus Donnagin war Balentynes ranghoher Mitraner. Berichte über Krankenbesuche, eine schwierige Geburt und die Versorgung ernsthaft erkrankter Soldaten zeichneten ihn als pflichtbewussten Priester, nicht als Karikatur. Tod im Schrein Styke, Vesper und Valeria fanden ihn nach Mitternacht im Klerikerbereich. Donnagin starb im Kampf gegen Styke und Valeria. Ein junger Akolyth wurde lebend überwältigt, gebunden und geknebelt. Valerias Abschied Valeria half, ihn zu töten, ohne ihr früheres Urteil über ihn umzuschreiben. Danach schloss sie Donnagin die Augen und sagte sinngemäß, der persönliche Teil müsse später kommen. Seine +1-Brustplatte, Schlüssel und sein silbernes Mitra-Symbol wurden geborgen.","search":"father althus donnagin balentynes ranghoher mitra-kleriker; im schrein von styke und valeria getotet. mitra kleriker balentyne father donnagin althus donnagin donnagin bekannte rolle father althus donnagin war balentynes ranghoher mitraner. berichte uber krankenbesuche, eine schwierige geburt und die versorgung ernsthaft erkrankter soldaten zeichneten ihn als pflichtbewussten priester, nicht als karikatur. tod im schrein styke, vesper und valeria fanden ihn nach mitternacht im klerikerbereich. donnagin starb im kampf gegen styke und valeria. ein junger akolyth wurde lebend uberwaltigt, gebunden und geknebelt. valerias abschied valeria half, ihn zu toten, ohne ihr fruheres urteil uber ihn umzuschreiben. danach schloss sie donnagin die augen und sagte sinngemass, der personliche teil musse spater kommen. seine +1-brustplatte, schlussel und sein silbernes mitra-symbol wurden geborgen.","links":[],"backlinks":[],"initial":"F"},{"id":"havelyn","category":"personen","title":"Lord Thomas Havelyn","summary":"Ehemaliger Kommandant Balentynes; in seinen oberen Räumen von Styke getötet.","body":"<h2>Kommandant Balentynes<\/h2><p>Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod.<\/p><h2>Tod in den oberen Räumen<\/h2><p>Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn.<\/p><h2>Geborgene Hinterlassenschaft<\/h2><p>Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die <a href=\"#/artikel/havelyn-bibel\">Familienbibel<\/a> geborgen.<\/p>","sources":["core","balentyne","live"],"status":"Tot seit 9. Februar","tags":["Kommandant","Balentyne"],"aliases":["Thomas Havelyn","Havelyn"],"group":"garrison","text":"Kommandant Balentynes Lord Thomas Havelyn kommandierte Balentyne und herrschte über Aldencross. Thorns Auftrag verlangte ausdrücklich seinen Tod. Tod in den oberen Räumen Das Kerntrio erreichte Havelyn ohne allgemeinen Alarm. Er hatte Zeit für kurze magische Vorbereitung, aber nicht für seine Vollplatte. Sein schwerster Schlag gegen Vesper wurde größtenteils von Styke übernommen; danach tötete Styke ihn. Geborgene Hinterlassenschaft Vesper trägt Havelyns Headband of Alluring Charisma +2. Seine gespeicherte Vollplatte verwandelte sich unter Valerias Hand in eine schwarze +1-Dastard-Vollplatte. Ballinger ist nach dem Ende der göttlichen Bindung ein Meisterarbeits-Langschwert; außerdem wurden Meisterarbeits-Dolch, Stahlschild, Hauptschlüssel und die Familienbibel geborgen.","links":["havelyn-bibel"],"backlinks":[],"search":"lord thomas havelyn ehemaliger kommandant balentynes; in seinen oberen raumen von styke getotet. kommandant balentyne thomas havelyn havelyn kommandant balentynes lord thomas havelyn kommandierte balentyne und herrschte uber aldencross. thorns auftrag verlangte ausdrucklich seinen tod. tod in den oberen raumen das kerntrio erreichte havelyn ohne allgemeinen alarm. er hatte zeit fur kurze magische vorbereitung, aber nicht fur seine vollplatte. sein schwerster schlag gegen vesper wurde grosstenteils von styke ubernommen; danach totete styke ihn. geborgene hinterlassenschaft vesper tragt havelyns headband of alluring charisma +2. seine gespeicherte vollplatte verwandelte sich unter valerias hand in eine schwarze +1-dastard-vollplatte. ballinger ist nach dem ende der gottlichen bindung ein meisterarbeits-langschwert; ausserdem wurden meisterarbeits-dolch, stahlschild, hauptschlussel und die familienbibel geborgen.","initial":"L"},{"id":"tacitus","category":"personen","title":"Magisterin Tacitus von Morimun","summary":"Gebundene Magisterin: lieferte Stykes +2-Umhang, trat dem Collective bei und übernahm zwei ergebnisoffene Forschungsfragen.","body":"<h2>Fertiger Umhang<\/h2><p>Tacitus und Knittel schlossen Stykes Cloak of Resistance +1 auf +2 am 26. Februar ab; Tacitus übergab ihn persönlich. In der bezahlten Reihe bleiben zwei Umhangaufwertungen und drei Amulette. Kein zweiter Gegenstand begann an diesem Tag.<\/p><h2>Eigene Haltung<\/h2><p>Tacitus sagte Styke offen, dass sie ihn nicht besonders mag und Balentyne sowie ihre Entführung nicht auslöscht. Zugleich respektiert sie ihn, verlässt sich in manchen Dingen auf ihn und will schwierige Arbeit, gute Mittel, eigenes Urteil und Verantwortung durch Kompetenz.<\/p><h2>Collective<\/h2><p>Sie trat freiwillig Stykes Collective bei, nachdem dessen Grenze geklärt war: keine passiven Gedanken, Erinnerungen oder Gefühle. Damit sind Vesper, Valeria, Kaitlyn und Tacitus die vier freiwilligen Mitglieder.<\/p><h2>Geheime Gegenfrage<\/h2><p>Styke legte Tacitus seine Absicht offen, Thorn keine unterschiedslose Tears-Seuche zu überlassen. Tacitus nahm die ergebnisoffene Forschungsfrage an. Vesper wurde später eingeweiht; Valeria erhielt den genauen Auftrag noch nicht, Knittel gehört nicht zum geheimen Kreis.<\/p><h2>Psionik<\/h2><p>Tacitus beobachtete Force Screen ohne Wort, Geste oder Material und trennte Stykes Selbst-Umschreibungsfrage von jeder späteren Übertragung auf andere. Zorn soll flüchtige Eindrücke nach bewusster Übermittlung dokumentieren. Es gibt noch keinen Durchbruch.<\/p><h2>Weitere Arbeit<\/h2><p>Tacitus und Knittel sind ins Horn gezogen. Bei Artephius ist die beschädigte, reparierbare Linse diagnostiziert; Mithralzahnrad und totes Gehirn fehlen; das Ersatz-Glasreservoir ist im Labor vorhanden, aber nicht installiert. Lightning Blood befindet sich im Hornlabor. Die volle Wiederherstellung, Compact-Auslegung und Fernkommunikation bleiben offen. Am verkürzten Umzugstag wurde kein voller achtstündiger Forschungs- oder Fertigungstag abgeschlossen.<\/p>","sources":["tacitus-current","live","chronicle","knittel","treasury"],"status":"Aktiv · Forschung begonnen · kein Ergebnis","tags":["Magisterin","Gebundene","Forschung","Handwerk","Farholde"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Fertiger Umhang Tacitus und Knittel schlossen Stykes Cloak of Resistance +1 auf +2 am 26. Februar ab; Tacitus übergab ihn persönlich. In der bezahlten Reihe bleiben zwei Umhangaufwertungen und drei Amulette. Kein zweiter Gegenstand begann an diesem Tag. Eigene Haltung Tacitus sagte Styke offen, dass sie ihn nicht besonders mag und Balentyne sowie ihre Entführung nicht auslöscht. Zugleich respektiert sie ihn, verlässt sich in manchen Dingen auf ihn und will schwierige Arbeit, gute Mittel, eigenes Urteil und Verantwortung durch Kompetenz. Collective Sie trat freiwillig Stykes Collective bei, nachdem dessen Grenze geklärt war: keine passiven Gedanken, Erinnerungen oder Gefühle. Damit sind Vesper, Valeria, Kaitlyn und Tacitus die vier freiwilligen Mitglieder. Geheime Gegenfrage Styke legte Tacitus seine Absicht offen, Thorn keine unterschiedslose Tears-Seuche zu überlassen. Tacitus nahm die ergebnisoffene Forschungsfrage an. Vesper wurde später eingeweiht; Valeria erhielt den genauen Auftrag noch nicht, Knittel gehört nicht zum geheimen Kreis. Psionik Tacitus beobachtete Force Screen ohne Wort, Geste oder Material und trennte Stykes Selbst-Umschreibungsfrage von jeder späteren Übertragung auf andere. Zorn soll flüchtige Eindrücke nach bewusster Übermittlung dokumentieren. Es gibt noch keinen Durchbruch. Weitere Arbeit Tacitus und Knittel sind ins Horn gezogen. Bei Artephius ist die beschädigte, reparierbare Linse diagnostiziert; Mithralzahnrad und totes Gehirn fehlen; das Ersatz-Glasreservoir ist im Labor vorhanden, aber nicht installiert. Lightning Blood befindet sich im Hornlabor. Die volle Wiederherstellung, Compact-Auslegung und Fernkommunikation bleiben offen. Am verkürzten Umzugstag wurde kein voller achtstündiger Forschungs- oder Fertigungstag abgeschlossen.","search":"magisterin tacitus von morimun gebundene magisterin: lieferte stykes +2-umhang, trat dem collective bei und ubernahm zwei ergebnisoffene forschungsfragen. magisterin gebundene forschung handwerk farholde tacitus of morimun tacitus von morimun tacitus fertiger umhang tacitus und knittel schlossen stykes cloak of resistance +1 auf +2 am 26. februar ab; tacitus ubergab ihn personlich. in der bezahlten reihe bleiben zwei umhangaufwertungen und drei amulette. kein zweiter gegenstand begann an diesem tag. eigene haltung tacitus sagte styke offen, dass sie ihn nicht besonders mag und balentyne sowie ihre entfuhrung nicht ausloscht. zugleich respektiert sie ihn, verlasst sich in manchen dingen auf ihn und will schwierige arbeit, gute mittel, eigenes urteil und verantwortung durch kompetenz. collective sie trat freiwillig stykes collective bei, nachdem dessen grenze geklart war: keine passiven gedanken, erinnerungen oder gefuhle. damit sind vesper, valeria, kaitlyn und tacitus die vier freiwilligen mitglieder. geheime gegenfrage styke legte tacitus seine absicht offen, thorn keine unterschiedslose tears-seuche zu uberlassen. tacitus nahm die ergebnisoffene forschungsfrage an. vesper wurde spater eingeweiht; valeria erhielt den genauen auftrag noch nicht, knittel gehort nicht zum geheimen kreis. psionik tacitus beobachtete force screen ohne wort, geste oder material und trennte stykes selbst-umschreibungsfrage von jeder spateren ubertragung auf andere. zorn soll fluchtige eindrucke nach bewusster ubermittlung dokumentieren. es gibt noch keinen durchbruch. weitere arbeit tacitus und knittel sind ins horn gezogen. bei artephius ist die beschadigte, reparierbare linse diagnostiziert; mithralzahnrad und totes gehirn fehlen; das ersatz-glasreservoir ist im labor vorhanden, aber nicht installiert. lightning blood befindet sich im hornlabor. die volle wiederherstellung, compact-auslegung und fernkommunikation bleiben offen. am verkurzten umzugstag wurde kein voller achtstundiger forschungs- oder fertigungstag abgeschlossen.","links":[],"backlinks":["zeit-tacitus","anatomie-tacitus"],"initial":"M","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"jacobian","category":"personen","title":"Jacobian Scaramore","summary":"Tacitus’ enger Freund; am 9. Februar mit Proviant und einem Pferd freigelassen.","body":"<h2>Buchhändler und Freund<\/h2><p>Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts.<\/p>\n<h2>Freilassung<\/h2><p>Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance.<\/p>\n<p>Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.<\/p>","sources":["core","live","chronicle","tacitus-current"],"status":"Am 9. Februar freigelassen; weiterer Weg unbekannt","tags":["Schreiber","Kontakt","Aldencross"],"aliases":["Scaramore","Jacobian"],"group":"town","text":"Buchhändler und Freund Jacobian Scaramore betrieb den Illuminated Scroll und war Tacitus’ enger Freund. Er vermittelte die Gespräche über Verse und begleitete sie am 8. Februar ins Dalliance. Vom Knoten, Compact und Asmodeus wusste er vor seiner Gefangennahme nichts. Freilassung Am frühen 9. Februar ließ Styke ihn „der alten Zeiten willen“ frei. Jacobian erhielt gewöhnliche sichere Kleidung, Essen, Wasser und eines der sieben erbeuteten Pferde. Gefährliche Ausrüstung bekam er nicht zurück. Tacitus verabschiedete sich von ihm, lehnte seine Bitte mitzukommen ab und blieb für ihre eigene Entscheidung im Dalliance. Jacobian ritt lebend ab. Sein weiterer Weg ist dem Knoten nicht bekannt.","links":[],"backlinks":["scroll","zeit-tacitus"],"search":"jacobian scaramore tacitus’ enger freund; am 9. februar mit proviant und einem pferd freigelassen. schreiber kontakt aldencross scaramore jacobian buchhandler und freund jacobian scaramore betrieb den illuminated scroll und war tacitus’ enger freund. er vermittelte die gesprache uber verse und begleitete sie am 8. februar ins dalliance. vom knoten, compact und asmodeus wusste er vor seiner gefangennahme nichts. freilassung am fruhen 9. februar liess styke ihn „der alten zeiten willen“ frei. jacobian erhielt gewohnliche sichere kleidung, essen, wasser und eines der sieben erbeuteten pferde. gefahrliche ausrustung bekam er nicht zuruck. tacitus verabschiedete sich von ihm, lehnte seine bitte mitzukommen ab und blieb fur ihre eigene entscheidung im dalliance. jacobian ritt lebend ab. sein weiterer weg ist dem knoten nicht bekannt.","initial":"J"},{"id":"marlowe","category":"personen","title":"William Marcus Marlowe","summary":"Leiter der Ye Merrie Men; eine früher angekündigte Balentyne-Aufführung, kein aktueller Zugangsplan.","body":"<h2>Bekannte Verbindung<\/h2>\n<p>Die reisende Schauspieltruppe <a href=\"#/artikel/merrie-men\">Ye Merrie Men<\/a> soll <em>The Fall of Amberlyn<\/em> für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar.<\/p>\n<h2>Historischer Plan vor Balentynes Fall<\/h2>\n<p>Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.<\/p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offener Hinweis"],"aliases":["Marlowe"],"group":"town","text":"Bekannte Verbindung Die reisende Schauspieltruppe Ye Merrie Men soll The Fall of Amberlyn für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar. Historischer Plan vor Balentynes Fall Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.","links":["merrie-men"],"backlinks":[],"search":"william marcus marlowe leiter der ye merrie men; eine fruher angekundigte balentyne-auffuhrung, kein aktueller zugangsplan. theater offener hinweis marlowe bekannte verbindung die reisende schauspieltruppe ye merrie men soll the fall of amberlyn fur soldaten in balentyne auffuhren. bellam erzahlte davon am 27. januar. historischer plan vor balentynes fall dass eine solche auffuhrung kommen soll, ist ein etablierter hinweis. exaktes datum, uhrzeit, besetzung, zugangskontrolle und bewegungen der truppe sind noch nicht geklart. das wiki macht daraus keine bereits verfugbare tarnidentitat oder sichere einlassmoglichkeit.","initial":"W"},{"id":"giuseppe","category":"personen","title":"Mama Louisa Giuseppe","summary":"Balentynes Köchin; Vesper gab alle sechs Rattengiftpäckchen in ihren großen Gemeinschaftseintopf und sah die Ausgabe beginnen.","body":"<h2>Beobachtete Routine<\/h2><p>Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet.<\/p>\n<h2>Der 1. Februar<\/h2><p>Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet.<\/p>\n<h2>Der 8. Februar<\/h2><p>Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan.<\/p>\n<p><a href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan<\/a> / <a href=\"#/artikel/kueche\">Bekanntes Küchenwissen<\/a><\/p><h2>Der 8. Februar<\/h2><p>Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher.<\/p><h2>Historischer Abschluss<\/h2><p>Vesper gab am 8. Februar alle sechs Giftpäckchen in den Eintopf und sah die Ausgabe beginnen. Sie verließ Balentyne vor einer sichtbaren Wirkung. Frühere Pläne sind damit erledigt; der spätere Fall der Festung belegt keine bestimmte Zahl vergifteter Soldaten.<\/p>","sources":["chronicle","live","timeline"],"status":"Eintopf am 8. Februar vergiftet","tags":["Küche","Routine","8. Februar"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Der 1. Februar Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet. Der 8. Februar Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Sechs Päckchen Rattengift liegen im Wassermühlen-Versteck; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan. Eintopf und Sabotageplan / Bekanntes Küchenwissen Der 8. Februar Vesper gelangte erneut über den zivilen Arbeiterweg in die Küche und gab alle sechs kleinen Rattengiftpäckchen in den großen Eintopf. Sie bemerkte dabei keinen Zeugen und sah die Ausgabe beginnen. Eine konkrete Wirkung beobachtete sie nicht; spätere Folgen kennt der Knoten nicht sicher. Historischer Abschluss Vesper gab am 8. Februar alle sechs Giftpäckchen in den Eintopf und sah die Ausgabe beginnen. Sie verließ Balentyne vor einer sichtbaren Wirkung. Frühere Pläne sind damit erledigt; der spätere Fall der Festung belegt keine bestimmte Zahl vergifteter Soldaten.","links":["eintopf-plan","kueche"],"backlinks":[],"search":"mama louisa giuseppe balentynes kochin; vesper gab nmitglieder starben.<\/p>\n<h2>Nachwirkungen<\/h2>\n<p>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen <a href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel<\/a>, <a href=\"#/artikel/grumblejack\">Grumblejack<\/a> erhielt <a href=\"#/artikel/varlet\">Varlet<\/a>.<\/p>\n<p>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. <strong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.<\/strong><\/p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["styke","varning-schluessel","grumblejack","varlet"],"backlinks":["zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26. januar bei freeman's rock getotet. tot patrouille ryan varning varning gesicherter verlauf varning verliess balentyne am 24. januar mit sechs ausgewahlten reitern. der knoten klarte ihren lagerplatz auf und griff in der nacht des 26. januar an. varning ergab sich schwer verwundet; styke totete ihn gemass seiner zuvor festgelegten keine-gefangenen-anweisung. alle sieben patrouillenmitglieder starben. nachwirkungen die leichen wurden verborgen, der platz bereinigt und sieben pferde erbeutet. markante ausrustung blieb in einem versteck ausserhalb aldencross'. styke behielt einen noch nicht identifizierten schlussel , grumblejack erhielt varlet . am 29. januar galt die patrouille offen als verspatet und suchreiter brachen auf. seit 31. januar ist ihr tod in balentyne bekannt. die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht.","initial":"C"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"<h2>Eigentum und Ort<\/h2>\n<p>Nach Freeman's Rock gab <a href=\"#/artikel/styke\">Styke<\/a> das Pferd ausdrücklich <a href=\"#/artikel/grumblejack\">Grumblejack<\/a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.<\/p>\n<p>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.<\/p>\n<h2>Nach dem Umzug<\/h2><p>Varlet kam mit Grumblejack zum Horn. Der für Carnitheria beschaffte Hengst ist ein eigenes Ritualtier; Varlet ist nicht dessen Ersatz.<\/p>","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet. Nach dem Umzug Varlet kam mit Grumblejack zum Horn. Der für Carnitheria beschaffte Hengst ist ein eigenes Ritualtier; Varlet ist nicht dessen Ersatz.","links":["styke","grumblejack"],"backlinks":["varning","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd, jetzt grumblejacks eigener anteil und packtier. tier feldgruppe  eigentum und ort nach freeman's rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil. varlet ist nicht einfach beliebiges gruppeninventar. es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe. eine spatere verausserung, verletzung oder verlegung ist nicht berichtet. nach dem umzug varlet kam mit grumblejack zum horn. der fur carnitheria beschaffte hengst ist ein eigenes ritualtier; varlet ist nicht dessen ersatz.","initial":"V","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"<h2>Kampagnenfassung<\/h2>\n<p>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.<\/p>\n<h2>Folgen der Begegnung<\/h2>\n<p>Vesper barg <a href=\"#/artikel/verse\">Verse<\/a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.<\/p>\n<p><strong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.<\/strong><\/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","vesper","verse"],"backlinks":["branderscar","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin. sie uberlebte den angenommenen ausbruch. branderscar historisch mathias richter richter kampagnenfassung matilda ist die weibliche kampagnenkonversion der branderscar-vorsteherfigur. styke und vesper setzten sie in ihren privatraumen nichttodlich ausser gefecht. das archiv setzt sie nicht nachtraglich auf den gedruckten ausgang zuruck. folgen der begegnung vesper barg verse aus einem beweisbehalter ihrer bibliothek und verzichtete auf weitere rache an der hilflosen. eine moorkarte und richters zauberbuch wurden mitgenommen, schwere alchemistische ausrustung blieb zuruck. ihr spaterer aufenthaltsort und zustand nach branderscar sind nicht geklart.","initial":"M"},{"id":"sambryl","category":"personen","title":"Captain Edward Sambryl","summary":"Talireanischer Patrouillenkapitän aus der Frosthamar-Reise.","body":"<h2>Begegnung auf See<\/h2>\n<p>Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten.<\/p>\n<h2>Grenze der Rekonstruktion<\/h2>\n<p>Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den <a href=\"#/artikel/yutak\">Yutak-Handel<\/a> ein und sind nicht automatisch noch im Inventar.<\/p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Seereise","Historisch"],"aliases":["Edward Sambryl","Sambryl"],"group":"history","text":"Begegnung auf See Seine Patrouille wurde während der Frosthamar-Reise besiegt. Sechs Überlebende wurden später an einer abgelegenen Küste mit Wasser, einem Kurzbogen und Pfeilen freigelassen, nicht als Gefolgsleute behalten. Grenze der Rekonstruktion Das historische Dossier belegt den Ausgang der Patrouille, legt aber Sambryls persönliches späteres Schicksal nicht gesondert sicher fest. Beutestücke der Patrouille gingen in den Yutak-Handel ein und sind nicht automatisch noch im Inventar.","links":["yutak"],"backlinks":["zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar-reise. seereise historisch edward sambryl sambryl begegnung auf see seine patrouille wurde wahrend der frosthamar-reise besiegt. sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser, einem kurzbogen und pfeilen freigelassen, nicht als gefolgsleute behalten. grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille, legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest. beutestucke der patrouille gingen in den yutak-handel ein und sind nicht automatisch noch im inventar.","initial":"C"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"<h2>Mannschaft und Ende<\/h2>\n<p><a href=\"#/artikel/hakon\">Hakon<\/a>, <a href=\"#/artikel/sten\">Sten<\/a>, <a href=\"#/artikel/ketil\">Ketil<\/a>, <a href=\"#/artikel/eirik\">Eirik<\/a>, <a href=\"#/artikel/arved\">Arved<\/a> und <a href=\"#/artikel/torvald\">Torvald<\/a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.<\/p>\n<p>Odenkirk starb. Die <a href=\"#/artikel/frosthamar\">Frosthamar<\/a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.<\/p>\n<h2>Kein automatisches Restinventar<\/h2>\n<p>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind atrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde.<\/p>\n<h2>Nachgeschichte<\/h2>\n<p><a href=\"#/artikel/vesper\">Vesper<\/a> verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.<\/p>","sources":["history","chronicle"],"status":"Bestätigt","tags":["Yutak","Handel","Historisch"],"aliases":[],"group":"history","text":"Handel im Norden White Tusk führte die Yutak, denen die Gruppe während der Nordreise begegnete. Er nahm erbeutete Patrouillenausrüstung und gab dafür Walrosselfenbein im Wert von 1.200 gp. Später kam sein Narwalzahn hinzu, der in Aldencross mit 2.000 gp bewertet wurde. Nachgeschichte Vesper verkaufte beide Lose am 23. Januar für insgesamt 3.200 gp. Für White Tusk ist seit dem Handel keine weitere Begegnung oder Verpflichtung gegenüber dem Knoten festgehalten.","links":["vesper"],"backlinks":["joseph","regionen","yutak","zeit-seereise"],"search":"white tusk yutak-anfuhrer aus der nordreise. handel und ein wertvoller narwalzahn blieben in erinnerung. yutak handel historisch  handel im norden white tusk fuhrte die yutak, denen die gruppe wahrend der nordreise begegnete. er nahm erbeutete patrouillenausrustung und gab dafur walrosselfenbein im wert von 1.200 gp. spater kam sein narwalzahn hinzu, der in aldencross mit 2.000 gp bewertet wurde. nachgeschichte vesper verkaufte beide lose am 23. januar fur insgesamt 3.200 gp. fur white tusk ist seit dem handel keine weitere begegnung oder verpflichtung gegenuber dem knoten festgehalten.","initial":"W"},{"id":"joseph","category":"personen","title":"Joseph Calls-Fire-From-Water","summary":"Yutak-Kontakt der nördlichen Begegnung und des Handels.","body":"<h2>Dokumentierter Platz in der Reise<\/h2>\n<p>Joseph gehört zur Begegnung und zum Austausch mit den Yutak während der Nordreise. Er ist von <a ella, tamsin, mirelle, kaitlyn, hakon, die norspiker, grumblejack und sechs pferde reisten ebenfalls ab. wissensstand seit der abreise besitzt die gruppe keinen belastbaren bericht uber das gebaude. sein spaterer zustand wird deshalb nicht vorweggenommen.","links":[],"backlinks":["zeit-0123","zeit-0201"],"initial":"L"},{"id":"zimmer","category":"orte","title":"Das rückwärtige Zimmer","summary":"Das rückwärtige Zimmer diente als Schlaf-, Dinner- und Bindungsraum; der Haushalt verließ es beim Aufbruch.","body":"<h2>Das alte Knot-Zimmer<\/h2><p>Der große obere Raum des Dalliance diente dem Kerntrio als Schlaf- und Planungsraum. Hier schlief Kaitlyn kurz bei Styke ein; später las und unterschrieb Tacitus den Compact und wurde gebunden.<\/p><h2>Abreise<\/h2><p>Am 9. Februar wurde der erreichbare persönliche Besitz für den Aufbruch geordnet. Der gesamte gewählte Haushalt verließ das Haus und ging an Bord von <a href=\"#/artikel/halstyns-folly\">Halstyn’s Folly<\/a>. Seitdem gibt es keinen neuen direkten Bericht aus dem Zimmer.<\/p>","sources":["live","dalliance","mirelle","clocks-current"],"status":"Historischer Schauplatz; am 9. Februar verlassen","tags":["Aldencross","7. Februar","Lord’s Dalliance"],"aliases":[],"parent":"dalliance","text":"Das alte Knot-Zimmer Der große obere Raum des Dalliance diente dem Kerntrio als Schlaf- und Planungsraum. Hier schlief Kaitlyn kurz bei Styke ein; später las und unterschrieb Tacitus den Compact und wurde gebunden. Abreise Am 9. Februar wurde der erreichbare persönliche Besitz für den Aufbruch geordnet. Der gesamte gewählte Haushalt verließ das Haus und ging an Bord von Halstyn’s Folly . Seitdem gibt es keinen neuen direkten Bericht aus dem Zimmer.","links":["halstyns-folly"],"backlinks":[],"search":"das ruckwartige zimmer das ruckwartige zimmer diente als schlaf-, dinner- und bindungsraum; der haushalt verliess es beim aufbruch. aldencross 7. februar lord’s dalliance  das alte knot-zimmer der grosse obere raum des dalliance diente d ernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert.<\/p>\n<h2>Ausführung am 8. Februar<\/h2><p>Vespers Arbeiterdeckung hielt ein letztes Mal. Sie gab alle sechs Päckchen in den großen Eintopf, bemerkte keinen Zeugen und sah die Ausgabe beginnen. Sie ging, bevor eine Wirkung sichtbar wurde. Das Spielerwissen enthält daher keine sichere Zahl Erkrankter und keinen Nachweis, dass das Gift die spätere Verteidigung schwächte.<\/p><h2>Zeitliche Einordnung<\/h2><p>Die Arbeiterwege und das Eintopfprojekt gehören zur Vorbereitung vor Balentynes Fall. Der Giftauftrag wurde am 8. Februar ausgeführt; kein fortbestehender aktueller Küchenauftrag ist bestätigt.<\/p>","sources":["chronicle","live","core"],"status":"Eintopf vergiftet / Wirkung unbestätigt","tags":["Balentyne"],"aliases":[],"parent":"balentyne","text":"Beobachtete Abläufe Die Küche ist fast ständig in Betrieb. Die Vorratskammer wird häufig nachgefüllt und enthält ungefähr ein bis zwei Tage Verpflegung. Vesper sah bei dem von ihr beobachteten Materialfluss keinen sichtbaren Vorkoster- oder Giftprüfvorgang. Das ist keine Zusicherung, jede Lieferung werde niemals kontrolliert. Wasser Gewöhnliches Wasser kommt aus dem Tyburn . Das Torhaus besitzt eine gesonderte kleinere Zisterne. Beide Wege werden nicht zu einem einzigen allumfassenden Versorgungspunkt zusammengezogen. Mama Giuseppes Eintopf Der wöchentliche gemeinsame Rindereintopf erreicht ungefähr siebzig dienstfreie Soldaten. 1. und 8. Februar sind die nächsten belegten Termine. Zugänglichkeit und Bewachung am gewählten Tag bleiben offen. Krankheit Mara beschrieb gewöhnliche Winterkrankheiten und einen Durchfallfall. Schlimmere Fälle werden Donnagin zugetragen; Personen mit Darmbeschwerden werden von Küchenarbeit fernzuhalten versucht. Der Knoten hat keine absichtliche Infektion als ausgeführt etabliert. Ausführung am 8. Februar Vespers Arbeiterdeckung hielt ein letztes Mal. Sie gab alle sechs Päckchen in den großen Eintopf, b category":"orte","title":"Das Haus der Motts","summary":"Wohlhabender zweigeschossiger Offiziershaushalt hinter St. Alden.","body":"<h2>Beobachteter Aufbau<\/h2>\n<p>Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden.<\/p>\n<h2>Schlafzimmer und Truhe<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung durch beide Eheleute. Kaitlyns eigene Truhe wird mit einem kleinen Messingschlüssel geöffnet, den sie an einer Kette trägt. Darin lagen unter anderem gute Kleider, Tanzschuhe, Duftstoff und die Briefe mit grauem Band.<\/p>\n<h2>Zugang ist situationsgebunden<\/h2>\n<p>Kaitlyn ließ Styke am 28. Januar unter der Buch-Deckgeschichte herein und deutete für den 29. Januar eine öffene Hintertür an. Das ist kein dauerhaft offenes Haus. Dass während des ersten langen Besuchs keine weitere Haushaltsperson wahrgenommen wurde, beweist nicht, dass es niemals Personal gibt.<\/p>\n<h2>Offener Gegenstandsverbleib<\/h2>\n<p>Der Exorzisten-Reisebericht wurde am 28. Januar auf dem vorderen Tisch abgelegt. Eine spätere Mitnahme ist nicht belegt.<\/p>\n<h2>Spätere Einordnung<\/h2><p>Kaitlyn brachte den Exorzisten-Reisebericht am 7. Februar zurück ins Dalliance. Sie gehört inzwischen zum Hornhaushalt; über das spätere Schicksal des Hauses liegt kein neuer Bericht vor.<\/p>","sources":["aldencross","chronicle","live"],"status":"Bekannt","tags":["Aldencross"],"aliases":["Mott house","Küchengarten"],"parent":"aldencross","text":"Beobachteter Aufbau Verglaste Fenster, ein vorderer Eingang, das eheliche Schlafzimmer im Obergeschoss und ein kleiner Küchengarten mit hinterer Tür sind bekannt. Der rückwärtige Ausgang führt in eine schmale Gasse Richtung St. Alden. Schlafzimmer und Truhe Styke sah ein breites Bett, zwei Truhen, Stühle, Ablagen und Zeichen der Nutzung d
