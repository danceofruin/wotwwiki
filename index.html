ferden, Vorräten und seinem Auftrag los. In Aldencross verkaufte er drei Pferde aus Darran Vells Bestand für 120 gp und ließ Tacitus über Jacobian für den 8. Februar gegen 20 Uhr ins Dalliance einladen.</p>\n<p>Am Abend brachte er <a href=\"#/artikel/mirelle\">Mirelle</a> zum Essen, Maßnehmen und Trinken ins rückwärtige Zimmer. Sie blieb über Nacht bei Styke, Vesper und Valeria.</p>\n<h2>Stand in der Nacht zum 4. Februar</h2>\n<p>Styke liegt mit Vesper, Valeria und Mirelle im Dalliance. Vier Päckchen Rattengift sind verborgen, die Mietpferde werden um den 5. Februar fällig, und auf Tacitus’ Antwort wartet die Gruppe noch.</p>\n<h2>Nachschlagen</h2><p><a href=\"#/artikel/bogen-styke\">Charakterbogen</a> / <a href=\"#/artikel/psy-styke\">Psychologisches Profil</a> / <a href=\"#/artikel/kollektiv\">Kollektiv</a> / <a href=\"#/artikel/intim-styke\">Private Akte</a></p>","sources":["styke","live","chronicle","relations"],"status":"Aktuell","tags":["Kernfigur","Stufe 5","Frontlinie","Lord’s Dalliance"],"aliases":["Aasimar","Zelot","Zealot"],"group":"inner","initial":"S","text":"Identität und Erscheinung Styke ist ein 60 Jahre alter Angel-Blooded-Aasimar und wirkt sichtbar jünger. Er ist etwa 190 cm groß, schlank und athletisch. Helle, beinahe marmorartige Haut, dichtes schwarzes Haar, dunkle Bartstoppeln und leuchtend eisblaue Augen mit silbernen Höfen sind seine festen Merkmale. Handwerk und Gewalt Er arbeitete als Söldner und Schmied. Ausgänge, Waffen, Zuständigkeiten und die Folgen eines Fehlschlags interessieren ihn mehr als zeremonieller Rang. Sein Großschwertstil lebt von Geschwindigkeit und Koordination; Metall, Schneiden, Öl und die Qualität eines Werkstücks sind ihm vertraut. Am Freeman's Rock tötete er den kapitulierenden Varning. Am 2. Februar erstach er Darran Vell hinter einem Stall und tötete den letzten flehenden Mann aus Vells Gruppe. Seine Linie war in beiden Fällen dieselbe: Wer als feindlicher Träger von Namen, Wegen und Gesichtern zurückbleibt, bleibt  Kollektiv bleibt davon unberührt. Vesper und Valeria besitzen weiterhin gemeinsam das Vetorecht bei künftigen Aufnahmen in das Gefolge.</p>\n<h2>Der 3. Februar</h2>\n<p>Vesper ritt mit Styke und Valeria nach Aldencross zurück. Sie kaufte schwarze Schuhe mit feinerem Absatz und ein schmales schwarzes Haarband. Bei <a href=\"#/artikel/mirelle\">Mirelle</a> erhielt sie zwei auf ihren Greifschwanz zugeschnittene Wäschestücke in Rot und dunklem Pflaumenton.</p>\n<p>Mirelle kam am Abend mit Maßband und Arbeitstasche ins Dalliance und blieb bis zum Schlafen im rückwärtigen Zimmer.</p>\n<h2>Stand in der Nacht zum 4. Februar</h2>\n<p>Vesper ist im Dalliance. Nella bleibt über den Compact an sie gebunden, ist jedoch mit Tamsin unterwegs; das psionische Kollektiv umfasst weiterhin Vesper und Valeria.</p>\n<h2>Nachschlagen</h2><p><a href=\"#/artikel/bogen-vesper\">Charakterbogen</a> / <a href=\"#/artikel/psy-vesper\">Psychologisches Profil</a> / <a href=\"#/artikel/verse\">Verse</a> / <a href=\"#/artikel/intim-vesper\">Private Akte</a></p>","sources":["vesper","live","chronicle","redbook-current","knot-pact"],"status":"Aktuell","tags":["Kernfigur","Stufe 5","Magie","Keeper","Lord’s Dalliance"],"aliases":[],"group":"inner","initial":"V","text":"Identität und Erscheinung Vesper ist 22, eine Asura-Spawn-Tiefling und Oracle (Spirit Guide) 5 mit Lore Mystery. Alabasterhelle Haut, schwarzes Haar mit blauem Schimmer, schlanke Gestalt und ein langer Greifschwanz sind etabliert. Sichtbare Hörner hat sie nicht. Neugier und Methode Vesper sucht, was eine Lage veränderbar macht: Schlüssel, Namen, Seiteneingang, Mechanismus oder glaubwürdige Quelle. Am 1. Februar hielt ihre Arbeiterdeckung unter verschärfter Kontrolle. Sie half beim gewöhnlichen Eintopf, fand aber weder Zacks Dienstplan noch Donnagin. In derselben Nacht montierte sie mit Styke und Valeria zwei schwere Ketten im Dalliance-Tunnel. Danach entdeckte sie im roten Buch einen Absatz, an den sie sich nicht erinnerte. Der 2. Februa Dame Balina von Karfeld unter neuem Namen: Ritterdisziplin, Frontlinie und eine immer selbstverständlicher ausgeübte Autorität im Knoten.","body":"<h2>Identität und Erscheinung</h2>\n<p>Valeria stammt aus Karfeld. Als Dame Balina war sie mitranische Ritterin und Jägerin gefährlicher Ketzer. Sie ist groß, athletisch und kräftig, mit aschblondem Haar, graublauen Augen, feinen Gesichtszügen und einem leicht schief verheilten Nasenrücken.</p>\n<h2>Balina bleibt in Valeria</h2>\n<p>Mitraglaube und früherer Eid wurden in Thorns Anwesen zerbrochen. Die ritterliche Denkform blieb: Was ist geschehen, wofür bin ich verantwortlich, was habe ich zugesagt und was kann ich halten? Timeon bleibt ihr wichtig, obwohl sie Stykes Befehl befolgt, nicht zu ihm zurückzukehren.</p>\n<h2>Der 1. und 2. Februar</h2>\n<p>Am 1. Februar führte sie auf Stykes Bitte eine private Begegnung und hielt ihn danach fest, als er darum bat. Später besprach sie mit Styke und Zorn ein mögliches reversibles Verwandlungsprojekt; Vesper kennt dieses Vorhaben nicht.</p>\n<p>Bei Darran Vells Ende kämpfte Valeria an der Front und tötete einen bereits ergebenen Mann. Mit Tamsin legte sie anschließend die falsche Pferdespur. Als Styke Tamsin später sexuelle Gewalt als mögliche Todesstrafe androhte, widersprach Valeria: Wenn Tamsin sterben müsse, dann nicht so und nicht als Strafe des Knotens. Vesper setzte durch, dass eine solche Entscheidung nur gemeinsam mit Styke fallen kann.</p>\n<h2>Der 3. Februar</h2>\n<p>Valeria ritt mit Styke und Vesper nach Aldencross zurück und kaufte dunkelblaue, flache Schuhe aus Kalbsleder. <a href=\"#/artikel/mirelle\">Mirelle</a> begann für sie ein festes Unterzeug unter der Rüstung: dunkles Leinen, weiche Innenseite, doppelte Front und seitliche Schnürung.</p>\n<p>Am Abend übernahm Valeria vor Vesper und Mirelle sichtbar die Führung über Styke. Aus einer privaten Umkehr wurde damit eine Stellung, die sie auch vor einer neuen Zeugin aussprach und hielt.</p>\n<h2>Stand in der Nacht zum 4. Februar</h2>\n<p>Valeria liegt mit Styke, Vesper und Mirelle im rückwärtigen Zimmer des Dalliance. Fighter 5, HP 42/42; Platte, meisterliches Großschwert und Cloak of Resistance +1 bleiben ihre aktuelle Ausrüstung.</p>\n<h2>Nachschlagen</h2><p><a href=\"#/artikel/bogen-valeria\">Charakterbogen</a> / <a href=\"#/artikel/psy-valeria\">Psychologisches Profil</a> / <a href=\"#/artikel/dreierkonstellation\">Dreierkonstellation</a> / <a href=\"#/artikel/intim-valeria\">Private Akte</a></p>","sources":["valeria","live","chronicle","relations"],"status":"Aktuell","tags":["Kernfigur","Stufe 5","Frontlinie","Lord’s Dalliance"],"aliases":["Balina","Dame Balina","Sir Balin","Balina von Karfeld"],"group":"inner","initial":"V","text":"Identität und Erscheinung Valeria stammt aus Karfeld. Als Dame Balina war sie mitranische Ritterin und Jägerin gefährlicher Ketzer. Sie ist groß, athletisch und kräftig, mit aschblondem Haar, graublauen Augen, feinen Gesichtszügen und einem leicht schief verheilten Nasenrücken. Balina bleibt in Valeria Mitraglaube und früherer Eid wurden in Thorns Anwesen zerbrochen. Die ritterliche Denkform blieb: Was ist geschehen, wofür bin ich verantwortlich, was habe ich zugesagt und was kann ich halten? Timeon bleibt ihr wichtig, obwohl sie Stykes Befehl befolgt, nicht zu ihm zurückzukehren. Der 1. und 2. Februar Am 1. Februar führte sie auf Stykes Bitte eine private Begegnung und hielt ihn danach fest, als er darum bat. Später besprach sie mit Styke und Zorn ein mögliches reversibles Verwandlungsprojekt; Vesper kennt dieses Vorhaben nicht. Bei Darran Vells Ende kämpfte Valeria an der Front und tötete einen bereits ergebenen Mann. Mit Tamsin legte sie anschließend die falsche Pferdespur. Als Styke Tamsin später sexuelle Gewalt als mögliche Todesstrafe androhte, widersprach Valeria: Wenn Tamsin sterben müsse, dann nicht so und nicht als Strafe des Knotens. Vesper setzte durch, dass eine solche Entscheidung nur gemeinsam mit Styke fallen kann. Der 3. Febru , solange Zuständigkeit und Loyalität belastbar bleiben.</p>\n<h2>Wort und Folge</h2>\n<p>Versprechen, angenommene Bindung, konkrete Verantwortung, die eigenen Leute und die Mission bilden seine Moral. Am Freeman's Rock tötete er den kapitulierenden Varning, weil er zuvor keine Gefangenen festgelegt hatte. Dieselbe Konsequenz lässt ihn einen Verbündeten schützen oder eine zugesagte Last tragen.</p>\n<p>Unzuverlässigkeit trifft ihn stärker als offener Widerspruch. Eine harte Gegenmeinung kann er verarbeiten; ein gebrochenes Wort zerstört seine Berechnung der nächsten Folgen.</p>\n<h2>Angst, Wut und Schuld</h2>\n<p>Angst wird taktisch: Wie weit ist der Ausgang, wer ist verletzlich, welche Ressource bleibt? Tiefe Wut macht ihn leise und konkret. Er droht eher mit einer Handlung als mit einer Rede über seinen Status.</p>\n<p>Schuld verarbeitet er als Arbeit. Reparieren, bewachen, Grenzen einhalten und jemanden in die eigene Planung aufnehmen fallen ihm leichter als ein Bekenntnis. Darin liegen Fürsorge und Vermeidung dicht beieinander.</p>\n<h2>Schutz und Anspruch</h2>\n<p>Wenn Styke einen Menschen als eigene Verantwortung begreift, greift er in dessen Entscheidungen ein. Der Streit um <a href=\"#/artikel/timeon\">Timeon</a> zeigt den blinden Fleck: Er schützt Valeria vor einer gefährlichen Rückkehr und beansprucht dabei zugleich Deutung über einen Teil ihres früheren Lebens.</p>\n<h2>Vesper und Valeria</h2>\n<p>Mit Vesper bestehen gewachsene Abkürzungen aus Branderscar, Sex, Geheimnissen und gemeinsamem Überleben. Sie darf einen Informationszugang besitzen, den Styke nicht hat, ohne ihn jedes Mal erklären zu müssen.</p>\n<p>Bei Valeria ist jede Verlässlichkeit mit der Erinnerung an seine Täterschaft verschränkt. Am 31. Januar befolgte sie seinen Befehl und widersprach seinem Anspruch. Am nächsten Morgen führte und hielt sie ihn. Styke erlebte beides als Bindung.</p>\n<h2>Begehren</h2>\n<p>Styke ist körperlich direkt und wenig schamhaft. Begehren und Strategie laufen be r\">Vesper</a> will Antworten nicht nur besitzen. Sie will wissen, woher sie kommen, wem sie nützen und welche Tür sie öffnen. Aus einem Namen wird eine Spur, aus einem Schlüssel ein Zugang, aus einer beiläufigen Bemerkung eine Versuchsanordnung.</p>\n<p>Diese Neugier ist nicht immer zweckgebunden. <a href=\"#/artikel/verse\">Verse</a> und die Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus.</p>\n<h2>Sicherheit durch Auswege</h2>\n<p>Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes Eingeschlossensein trifft sie härter als eine gefährliche Lage, deren Regeln sie lesen kann.</p>\n<p>Der Preis dieser Gewohnheit ist Aufschub. Ein weiterer Zugang, eine zusätzliche Frage oder eine elegante Lüge können sie länger in einer riskanten Situation halten. Ihre soziale Klugheit schützt sie weder vor Irrtum noch vor einer gut erzählten Täuschung.</p>\n<h2>Manipulation und Kontrolle</h2>\n<p>Vesper rahmt bevorzugt wahre Einzelheiten so, dass andere den falschen Schluss ziehen. Sie kann jemanden mögen und im selben Gespräch benutzen. Befehle sind ihr weniger wichtig als Wissen, Zugriff und die Möglichkeit, den nächsten Schritt zu bestimmen.</p>\n<p>In vertrauter Umgebung legt sie diese Regie zeitweise ab. Am 31. Januar gab Styke ihr vor Valerias Rückkehr die Führung; später wechselten beide wieder in Zärtlichkeit. Das reizte sie gerade, weil ihre Beziehung nicht an eine einzige Rollenverteilung gebunden ist.</p>\n<h2>Angst, Wut und Scham</h2>\n<p>Unter Angst werden ihre Fragen kurz und prüfbar: Wer hat es gesehen? Welche Tür? Wie viele? Was wissen sie? Bei echter Wut verschwindet der Witz. Scham versucht sie zunächst zu analysieren; wenn das nicht gelingt, verraten Pause, ausgebliebener Scherz oder eine praktische Geste mehr als ein Bekenntnis.</p>\n<h2>Styke, Verse und Valeria</h2>\n<p>Mit Styke teilt sie Flucht, Verbrechen, Bett, Planung und die Absicht, Thorn zu überleben. Verse ist ein Teil ihrer eigenen Geschichte; sie weigerte sich, ihn zurückzulassen, und behandelt seinen Widerspruch als Zeichen seiner Person.</p>\n<p><a href=\"#/artikel/valeria\">Valeria</a> verbindet frühere Gegnerin, Opfer, begehrte Gefährtin und militärische Partnerin. Am 31. Januar sorgte Vesper sich offen um ihre Abwesenheit. In der folgenden Nacht wurde sie Valeria körperlich nah, reinigte sie und blieb bei ihr, bis sie einschlief.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-vesper\">Intimität und persönliche Beziehungen</a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.</p>","sources":["vesper","psy","relations","verse"],"status":"Spielinterpretation","tags":["Psychologie","Kernfigur"],"aliases":[],"text":"Neugier als Arbeitsweise Vesper will Antworten nicht nur besitzen. Sie will wissen, woher sie kommen, wem sie nützen und welche Tür sie öffnen. Aus einem Namen wird eine Spur, aus einem Schlüssel ein Zugang, aus einer beiläufigen Bemerkung eine Versuchsanordnung. Diese Neugier ist nicht immer zweckgebunden. Verse und die Frage nach erwachtem Bewusstsein interessieren sie auch dort, wo daraus kein unmittelbarer Vorteil entsteht. Gerade deshalb eignete sich seine wirkliche Geschichte als glaubwürdiger Zugang zu Tacitus. Sicherheit durch Auswege Styke sucht eine belastbare Linie; Vesper behält lieber eine zweite Tür offen. Mehrere Quellen, ein Ersatzplan und ein bekannter Rückweg beruhigen sie. Blindes Eingeschlossensein trifft sie härter als eine gefährliche Lage, deren Regeln sie lesen kann. Der Preis dieser Gewohnheit ist Aufschub. Ein weiterer Zugang, eine zusätzliche Frage oder eine elegante Lüge können sie länger in einer riskanten Situation halten. Ihre soziale Klugheit schützt sie weder vor Irrtum noch vor einer gut erzählten Täuschung. M ach zurückzukehren, stieg sie freiwillig in <a href=\"#/artikel/darran-vell\">Darran Vells</a> illegales Vieh- und Papiergeschäft ein. Als sie um ihren Anteil fürchtete, stahl sie sein Hauptbuch und bluffte mit einer Abschrift, die nie existierte.</p>\n<p>Am 2. Februar zwang Styke im alten Schafgehege eine Einigung. Tamsin gab das Hauptbuch zurück und erhielt 18 Goldstücke sowie einen billigen Silberring. Von dem Geld kaufte sie später Vorräte; der Rest ist nicht gezählt.</p>\n<h2>Zurück auf den untersten Rang</h2>\n<p>Vesper ließ Tamsin im kalten Schlamm knien, nahm ihr Gürtel und Schwert ab und entzog ihr den erarbeiteten Status. Eine Prügelstrafe gab es nicht. Tamsin nannte ihren neuen Rang selbst: „Eine Sexsklavin.“ Vesper ergänzte: „Mit Potential.“</p>\n<p>Der alte Pakt wurde um klare Melde- und Geschäftsregeln ergänzt. Wache, Eskorte, Verantwortung für andere, eigener Lohn und spätere Entscheidungsfreiheit bilden ihre mögliche Leiter zurück.</p>\n<h2>Nellas Auftrag</h2>\n<p>Seit dem Morgen des 3. Februar steht Tamsin für den Hakon- und Familienauftrag unter <a href=\"#/artikel/nella\">Nellas</a> begrenzter Einsatzführung. Sie reitet eines der guten Pferde aus Darran Vells Bestand und trägt die Verantwortung für Nellas körperliche Sicherheit.</p>\n<p>Beide sollen bis zum 7. Februar gemeinsam zurückkehren. Die Aldencross-Gruppe kennt ihren gegenwärtigen Ort seit dem Aufbruch nicht.</p>\n<h2>Aktueller Stand</h2><p>Fighter 3, HP 28/28. Kettenhemd, Valerias altes meisterliches Langschwert, Dolch, Winterkleidung, Silberring und ein unbekannter Rest der 18 gp. <a href=\"#/artikel/intim-tamsin\">Private Akte</a> / <a href=\"#/artikel/anatomie-tamsin\">Körperakte</a></p>","sources":["tamsin-current","live","chronicle","knot-pact"],"status":"Gebunden / Eskorte unterwegs","tags":["Branderscar","Gebundene","Eskorte","Unterwegs"],"aliases":["Blackerly","Tomas Blackerly"],"group":"inner","text":"Die ehemalige Sergeantin Tamsin ist die weibliche Kampagnenfassung des korrupte ,"title":"Timeon","summary":"Valerias früherer Knappe: mitranisch, verängstigt, auf einem Familienhof untergebracht und Träger einer groben Erinnerungskarte.","body":"<h2>Balinas Knappe</h2>\n<p>Timeon war der junge Knappe von <a href=\"#/artikel/valeria\">Dame Balina</a> und blieb Mitra zugewandt. Der <a href=\"#/artikel/privatpakt\">Privatpakt</a> trägt weder seinen Namen noch seine Zusage. Gegenüber <a href=\"#/artikel/styke\">Styke</a> und dem Knoten überwiegt Furcht.</p>\n<h2>Erinnerung an Balentyne</h2>\n<p>Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe <a href=\"#/artikel/timeon-karte\">Karte</a>. Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen.</p>\n<h2>Auf dem Familienhof</h2>\n<p>Tamsin brachte ihn zum vorgesehenen <a href=\"#/artikel/timeon-hof\">Familienanwesen</a>. Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.</p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Knappe","Sicher untergebracht"],"aliases":[],"group":"inner","text":"Balinas Knappe Timeon war der junge Knappe von Dame Balina und blieb Mitra zugewandt. Der Privatpakt trägt weder seinen Namen noch seine Zusage. Gegenüber Styke und dem Knoten überwiegt Furcht. Erinnerung an Balentyne Während der Ausbildung berichtete Timeon, woran er sich aus Balentyne erinnerte, und zeichnete eine grobe Karte . Sie bildet seinen damaligen Wissensstand ab und lässt Räume, Wege und spätere Änderungen offen. Auf dem Familienhof Tamsin brachte ihn zum vorgesehenen Familienanwesen . Valeria ritt am 31. Januar hin und sah selbst, dass er dort sicher war. Sie versprach ihm eine Rückkehr, erhielt später jedoch von Styke den Befehl, den Hof nicht erneut aufzusuchen.","links":["valeria","privatpakt","styke","timeon-karte","timeon-hof"],"backlinks":["psy-styke", herer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt.</strong> Das Wiki ergänzt dazu keine verborgene Quellenbiographie.</p>\n<h2>Unterschiedliche Bindungen</h2>\n<p>Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.</p>\n","sources":["core","chronicle","factions","relations"],"status":"Bestätigt","tags":["Auftraggeber","Pakt"],"aliases":["Adrastus Thorn","Cardinal Thorn"],"group":"history","text":"Bekannte Stellung Thorn rekrutierte Styke und Vesper nach Branderscar, band sie durch den Pact of Thorns und ließ sie die Neun Lektionen sowie rund neunzig Tage Ausbildung durchlaufen. Verträge, Belohnungen, Geduld und Grausamkeit gehören zur erlebten Form seiner Macht. Der Auftrag Balentyne brechen, Lord Thomas Havelyn töten und den Weg für Sakkarot Fire-Axe öffnen. Tiadora ist seine gefährliche Botin und Vollstreckerin. Was über früher bekannt ist Sakkarot erzählte Styke und Vesper, dass Thorn einst Kardinal Mitras war. Sein früherer Name und die genauen Umstände seines Falls sind ihnen nicht bekannt. Das Wiki ergänzt dazu keine verborgene Quellenbiographie. Unterschiedliche Bindungen Styke und Vesper stehen im größeren Dornpakt unter ihm. Valerias eigener Privatpakt benennt dagegen Styke und Vesper als sterbliche Autoritäten; Thorn ist nicht allein dadurch ihre direkte Vertragsautorität.","links":["styke","vesper","dornpakt","havelyn","sakkarot","tiadora"],"backlinks":["story-so-far","zeit-ausbildung"],"search":"kardinal adrastus thorn auftraggeber und weltliche autoritat des dornpakts seine vergangenheit ist nur in teilen bekannt adrastus thorn cardinal thorn auftraggeber pakt history bekannte stellung thorn rekrutierte styke und vesper nach branderscar band sie durch den pact of thorns und liess sie die neun lektionen sowie rund neunzig tage ausbildung durchlaufen vertrage belohnungen geduld s Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden.</p>\n<h2>Geteiltes Wissen</h2>\n<p>Er enthüllte gegenüber Styke und <a href=\"#/artikel/vesper\">Vesper</a>, dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht.</p>\n<h2>Zeitdruck</h2>\n<p>Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist <strong>kein mit Sakkarot vereinbarter Termin</strong>. Es wurde ihm dazu noch keine Nachricht geschickt.</p>\n","sources":["core","chronicle","live","factions"],"status":"Bestätigt","tags":["Bugbear","Verbündeter"],"aliases":["Fire-Axe","Feueraxt"],"group":"field","text":"Begegnung und Abmachung Am 14. Januar 4712 AR erhielt Sakkarot Thorns Waffenlieferung. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot führt das Bugbearheer und ist mit Thorn über Asmodeus sowie den Avernischen Ersten Knoten verbunden. Geteiltes Wissen Er enthüllte gegenüber Styke und Vesper , dass Thorn früher ein Kardinal Mitras war. Einen alten Namen oder den genauen Grund seines Falls lieferte diese Erzählung nicht. Zeitdruck Die einmonatige Operationsfrist seit der Lieferungsphase erzeugt Druck. Der im Dalliance erwogene Angriff in der Nacht 8./9. Februar ist kein mit Sakkarot vereinbarter Termin . Es wurde ihm dazu noch keine Nachricht geschickt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far","zeit-0114"],"search":"sakkarot fire axe anfuhrer des bugbearheers im norden styke versprach ihm balentynes tor fire axe feueraxt bugbear verbundeter field begegnung und abmachung am 14 januar 4712 ar erhielt sakkarot thorns waffenlieferung styke versprach ihm personlich balentynes tor zu offnen sakkarot fuhrt das bugbearheer und ist mit thorn uber asmodeus sowie den avernischen ersten knoten verbunden geteiltes wissen er enthullte gegenuber styke inden. Vier Wachen sind durchgehend dort; tagsüber arbeiten vier Zwergeningenieure auf dieser Ebene. Heißsandabwehr wird dort unterhalten.</p>\n<p>Schlaf-, Alarm- und Melderoutinen sind weiterhin Ermittlungsziele. Das Gerücht über einen taschendiebischen Arbeiter ist nicht bestätigt.</p>\n","sources":["core","chronicle","live"],"status":"Bestätigt","tags":["Zwerg","Ingenieur","Dalliance"],"aliases":["Eisenbauch","Ironbelly"],"group":"town","text":"Arbeit und Quartier Barnabus leitet zehn Zwergenarbeiter, die im Dalliance wohnen und Balentynes Torhaus vorbeugend warten und verstärken. Tore, Mechanismen, Beschläge, Maueranschlüsse und alte Reparaturen stehen im Mittelpunkt. Ein akuter struktureller Defekt ist nicht bekannt. Zugang über Handwerk und Trinken Er respektierte die Verarbeitung von Stykes Großschwert . Daraus entstand begrenzter fachlicher Kontakt, keine Loyalität. Über Arbeit und Alltag spricht die Mannschaft leichter als über Lohn oder Auszahlungen. Vespers Suche in seinem Zimmer ergab Arbeitsnotizen und Materiallisten, aber keine brauchbare Erpressungsgrundlage. Valeria trank am 30. Januar mit ihm und erhielt Informationen, die sie spät am 31. Januar nüchtern an Styke und Vesper weitergab. Jetzt bekanntes Torhauswissen Im zweiten Geschoss liegen die Mechanismen. Fallgatter und Zugbrücke haben getrennte Winden. Vier Wachen sind durchgehend dort; tagsüber arbeiten vier Zwergeningenieure auf dieser Ebene. Heißsandabwehr wird dort unterhalten. Schlaf-, Alarm- und Melderoutinen sind weiterhin Ermittlungsziele. Das Gerücht über einen taschendiebischen Arbeiter ist nicht bestätigt.","links":["styke-schwert","valeria","styke","vesper"],"backlinks":["zarik"],"search":"barnabus eisenbauch zwergenmeister mit zehn arbeitern beruflicher kontakt und wichtige quelle zum torhaus eisenbauch ironbelly zwerg ingenieur dalliance town arbeit und quartier barnabus leitet zehn zwergenarbeiter die im dalliance wohnen und balentynes torhaus vorbeugend warten und verstarken tore  29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten.</p>\n<h2>Letzte Berichte</h2>\n<p>Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durchfall lebte noch und stand unter Donnagins Aufsicht. Ungefähr vier oder fünf Reiter sah Mara nach Norden aufbrechen; den Zusammenhang mit Varning vermutete sie.</p>\n<h2>Private Akte (18+)</h2>\n<p><a href=\"#/artikel/intim-mara\">Der Waschschuppen und das Dalliance</a>. Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden.</p><h2>Letzter bestätigter Kontakt</h2><p>Valeria erklärte Vespers Abwesenheit mit Krankheit. Mara lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.</p>","sources":["core","relations","live"],"status":"Bestätigt","tags":["Zivilarbeit","Kontakt","Aldencross"],"aliases":["Hazel"],"group":"town","text":"Identität und Alltag Mara Fenner lebt in Aldencross und arbeitet im Umfeld von Balentynes Wäsche- und Hilfsdiensten. Hazel war ihr früherer Arbeitsname in den Notizen. Die kupferhaarige Bedienung des Dalliance ist eine andere Person. Styke, Ellyn und das hintere Zimmer Styke lernte Mara und Ellyn Reed am 23. Januar bei den Wagenhöfen kennen. Am selben Tag folgte die Begegnung im Waschschuppen . Am 30. Januar kam Mara nach ihrer Schicht in das hintere Zimmer des Dalliance und schlief dort mit Styke, Vesper und Valeria. Arbeit als Zugang Mara und Ellyn stellten Vesper als tüchtige neue Arbeitskraft vor. So gelangte Vesper am 29. und 30. Januar in die zivilen Arbeitsbereiche Balentynes. Mara kennt den Handelsvorwand der Gruppe, aber weder den Angriffsplan noch den Nessianischen Knoten. Letzte Berichte Nach Varnings Tod berichtete Mara von engerer Zugangskontrolle und empfahl Vesper, früh zu erscheinen. Ein Soldat mit Durchfall lebte noch und stand unter Donnagins Aufsicht. Ungefähr vier oder fünf Reiter sah Mara nach Norden aufbrechen; den Zusammenhang mit Varning vermutete sie. Private Akte (18+) Der Waschschuppen und das Dalliance . Der private Teil ist nach der einmaligen Altersfreigabe in dieses Dossier eingebunden. Letzter bestätigter Kontakt Valeria erklärte Vespers Abwesenheit mit Krankheit. Mara lebt und arbeitet weiter in Aldencross; neues Wissen über den Knoten oder den Angriff ist nicht entstanden.","links":["styke","ellyn","wash-shed","vesper","intim-mara"],"backlinks":["ellyn","copper-server","wash-shed","story-so-far","zeit-0123","intim-mara"],"search":"mara fenner zivile arbeiterin vertrauter kontakt und informationsquelle fruher von styke auch hazel genannt hazel zivilarbeit kontakt aldencross town identitat und alltag mara fenner lebt in aldencross und arbeitet im umfeld von balentynes wasche und hilfsdiensten hazel war ihr fruherer arbeitsname in den notizen die kupferhaarige bedienung des dalliance ist eine andere person styke ellyn und das hintere zimmer styke lernte mara und ellyn reed am 23 januar bei den wagenhofen kennen am selben tag folgte die begegnung im waschschuppen am 30 januar kam mara nach ihrer schicht in das hintere zimmer des dalliance und schlief dort mit styke vesper und valeria arbeit als zugang mara und ellyn stellten vesper als tuchtige neue arbeitskraft vor so gelangte vesper am 29 und 30 januar in die zivilen arbeitsbereiche balentynes mara kennt den handelsvorwand der gruppe aber weder den angriffsplan noch den nessianischen knoten letzte berichte nach varnings tod berichtete mara von engerer zugangskontrolle und empfahl vesper fruh zu erscheinen ein soldat mit durchfall lebte noch und stand unter donnagins aufsicht ungefahr vier oder funf reiter sah mara nach norden aufbrechen den zusammenhang mit varning vermutete sie private akte 18 der waschschuppen und das dalliance der private teil ist nach der einmaligen altersfreigabe in dieses dossier eingebunden letzter best alentyne-Offizier und Kaitlyns Ehemann; das Gerücht über eine rothaarige verheiratete Frau nennt inzwischen Zack Eddarly.","body":"<h2>Öffentliche Rolle</h2>\n<p>Franz ist Offizier von <a href=\"#/artikel/balentyne\">Balentyne</a> und Ehemann von <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott</a>. Aus ihrer privaten Schilderung ist die arrangierte Ehe von Vernachlässigung und wenig Zuneigung geprägt. Öffentlich bleibt er ein respektabler Offizier und Ehemann.</p>\n<h2>Gesehener Tagesablauf</h2>\n<p>Am 28. Januar beobachtete <a href=\"#/artikel/styke\">Styke</a>, wie Franz das <a href=\"#/artikel/mott-haus\">Mott-Haus</a> verließ. Kaitlyn reichte ihm vergessene pelzgefütterte Handschuhe. Er sagte, er komme nicht vor Mitternacht zurück. Das ist ein konkreter Tagesbeleg, kein ewiger Dienstplan. Franz begegnete Styke dabei nicht persönlich.</p>\n<h2>Die laufende Intrige</h2>\n<p><a href=\"#/artikel/vesper\">Vesper</a> streute am 30. Januar vage Gerüchte; Styke hinterließ am 31. Januar absichtlich eine Duftspur an Kaitlyn. Der erhoffte Konflikt mit <a href=\"#/artikel/zack\">Zack Eddarly</a> ist ein Plan der Gruppe. Was Franz davon bemerkt, daraus folgert oder bereits unternommen hat, ist nicht als Spielerwissen bestätigt. Ein Duell hat noch nicht sichtbar stattgefunden.</p>\n<h2>Wetttafel vom 3. Februar</h2><p>Im Dalliance steht Zack Eddarly inzwischen ohne Beleg als Kandidat einer Wette über eine rothaarige verheiratete Frau. Was Franz von diesem Gerücht hört oder daraus folgert, ist Styke, Vesper und Valeria noch nicht bekannt.</p>","sources":["core","chronicle","live"],"status":"Aktive Intrige","tags":["Offizier","Balentyne"],"aliases":["Mott","Franz Mott"],"group":"garrison","text":"Öffentliche Rolle Franz ist Offizier von Balentyne und Ehemann von Kaitlyn Mott . Aus ihrer privaten Schilderung ist die arrangierte Ehe von Vernachlässigung und wenig Zuneigung geprägt. Öffentlich bleibt er ein respektabler Offizier und Ehemann. Gesehener Tagesablauf Am 28. Januar beobachtete Styke , wie Franz das Mott-Haus verließ. Kaitlyn reichte ihm vergessene pelzgefütterte Handschuhe. Er sagte, er komme nicht vor Mitternacht zurück. Das ist ein konkreter Tagesbeleg, kein ewiger Dienstplan. Franz begegnete Styke dabei nicht persönlich. Die laufende Intrige Vesper streute am 30. Januar vage Gerüchte; Styke hinterließ am 31. Januar absichtlich eine Duftspur an Kaitlyn. Der erhoffte Konflikt mit Zack Eddarly ist ein Plan der Gruppe. Was Franz davon bemerkt, daraus folgert oder bereits unternommen hat, ist nicht als Spielerwissen bestätigt. Ein Duell hat noch nicht sichtbar stattgefunden. Wetttafel vom 3. Februar Im Dalliance steht Zack Eddarly inzwischen ohne Beleg als Kandidat einer Wette über eine rothaarige verheiratete Frau. Was Franz von diesem Gerücht hört oder daraus folgert, ist Styke, Vesper und Valeria noch nicht bekannt.","links":["balentyne","kaitlyn","styke","mott-haus","vesper","zack"],"backlinks":["kaitlyn","story-so-far"],"search":"captain franz mott balentyne offizier und kaitlyns ehemann das gerucht uber eine rothaarige verheiratete frau nennt inzwischen zack eddarly mott franz mott offizier balentyne garrison offentliche rolle franz ist offizier von balentyne und ehemann von kaitlyn mott aus ihrer privaten schilderung ist die arrangierte ehe von vernachlassigung und wenig zuneigung gepragt offentlich bleibt er ein respektabler offizier und ehemann gesehener tagesablauf am 28 januar beobachtete styke wie franz das mott haus verliess kaitlyn reichte ihm vergessene pelzgefutterte handschuhe er sagte er komme nicht vor mitternacht zuruck das ist ein konkreter tagesbeleg kein ewiger dienstplan franz begegnete styke dabei nicht personlich die laufende intrige vesper streute am 30 januar vage geruchte styke hinterliess am 31 januar absichtlich eine duftspur an kaitlyn der erhoffte konflikt mit zack eddarly ist ein plan der gruppe was franz davon bemerkt daraus folgert oder bereits unternommen hat ist nicht als spielerwissen bestatigt ein Geliebter Kaitlyns; sein genauer Dienstweg bleibt unbekannt.","body":"<h2>Das Gesicht hinter den Briefen</h2><p>Zacharias „Zack“ Eddarly ist Offizier und Kaitlyns heimlicher Liebhaber. Die graubandenen Briefe bestätigten die Beziehung am 29. Januar. Frauen aus dem Dalliance beschrieben ihn als groß, gutaussehend, gepflegt und galant, unverheiratet und gut darin, sich Namen zu merken.</p>\n<h2>Vespers Versuch</h2><p>Vesper suchte am 1. Februar während ihrer Arbeit in Balentyne nach einem Dienstplan oder einer sicheren Sichtung. Die verschärfte Begleitung ließ beides nicht zu.</p>\n<h2>Die gefährliche Linie</h2><p>Styke hofft weiterhin, dass Franz, Zack und Kaitlyn einander genug Gewicht geben, um die Ordnung selbst zu zerreißen. Ein Streit oder Duell ist nicht geschehen; Franz besitzt bislang keinen verlässlichen Namen.</p>","sources":["core","live","chronicle"],"status":"Bestätigt / Routine offen","tags":["Offizier","Affäre","Balentyne"],"aliases":["Zack","Zach","Zacharias Eddarly","Zach Eddarly"],"group":"garrison","text":"Das Gesicht hinter den Briefen Zacharias „Zack“ Eddarly ist Offizier und Kaitlyns heimlicher Liebhaber. Die graubandenen Briefe bestätigten die Beziehung am 29. Januar. Frauen aus dem Dalliance beschrieben ihn als groß, gutaussehend, gepflegt und galant, unverheiratet und gut darin, sich Namen zu merken. Vespers Versuch Vesper suchte am 1. Februar während ihrer Arbeit in Balentyne nach einem Dienstplan oder einer sicheren Sichtung. Die verschärfte Begleitung ließ beides nicht zu. Die gefährliche Linie Styke hofft weiterhin, dass Franz, Zack und Kaitlyn einander genug Gewicht geben, um die Ordnung selbst zu zerreißen. Ein Streit oder Duell ist nicht geschehen; Franz besitzt bislang keinen verlässlichen Namen.","search":"captain zacharias zack eddarly balentyne offizier und durch briefe belegter geliebter kaitlyns sein genauer dienstweg bleibt unbekannt zack zach zacharias eddarly zach eddarly offizier affare balentyne garrison das gesicht hinter d lung gebunden.</p>\n<h2>Bedeutung für den Knoten</h2>\n<p>Thorns Auftrag benennt neben dem Brechen Balentynes ausdrücklich seine Tötung. Die Gruppe kennt ihn als militärische und politische Autorität, nicht als vollständig aufgeklärten Gegner.</p>\n<h2>Wissensgrenze</h2>\n<p>Seine genauen Entscheidungen nach Varnings Tod, persönlichen Geheimnisse, aktuellen Verteidigungspläne und Kampfwerte sind im Spielerstand nicht vollständig bekannt. Das Wiki liefert keinen verborgenen Gegnerbogen.</p>\n","sources":["core","balentyne","live"],"status":"Bestätigt","tags":["Kommandant","Balentyne"],"aliases":["Thomas Havelyn","Havelyn"],"group":"garrison","text":"Öffentlich bekannte Stellung Havelyn kommandiert die Festung Balentyne und herrscht über Aldencross . Er ist ein erfahrener talireanischer Befehlshaber. Garnison und Ort sind institutionell an seine Stellung gebunden. Bedeutung für den Knoten Thorns Auftrag benennt neben dem Brechen Balentynes ausdrücklich seine Tötung. Die Gruppe kennt ihn als militärische und politische Autorität, nicht als vollständig aufgeklärten Gegner. Wissensgrenze Seine genauen Entscheidungen nach Varnings Tod, persönlichen Geheimnisse, aktuellen Verteidigungspläne und Kampfwerte sind im Spielerstand nicht vollständig bekannt. Das Wiki liefert keinen verborgenen Gegnerbogen.","links":["balentyne","aldencross"],"backlinks":["thorn"],"search":"lord thomas havelyn kommandant balentynes und herr von aldencross zentrales ziel des auftrags thomas havelyn havelyn kommandant balentyne garrison offentlich bekannte stellung havelyn kommandiert die festung balentyne und herrscht uber aldencross er ist ein erfahrener talireanischer befehlshaber garnison und ort sind institutionell an seine stellung gebunden bedeutung fur den knoten thorns auftrag benennt neben dem brechen balentynes ausdrucklich seine totung die gruppe kennt ihn als militarische und politische autoritat nicht als vollstandig aufgeklarten gegner wissensgrenze seine genauen entscheidungen nach varnings tod personlichen geheimnisse aktuellen verteidigungsplane und kampfwerte sind im spielerstand nicht vollstandig bekannt das wiki liefert keinen verborgenen gegnerbogen"},{"id":"tacitus","category":"personen","title":"Magisterin Tacitus von Morimun","summary":"Balentynes Magisterin. Ihr Interesse an Verse blieb bestehen; Styke ließ sie für den 8. Februar ins Dalliance einladen.","body":"<h2>Erscheinung</h2><p>Eine schlanke, drahtige Frau mittleren Alters mit langem kantigem Gesicht, etwas hohlen Wangen, markanter Nase, zurückgestrichenem rotbraunem Haar und kleiner runder Goldbrille. Hochgeschlossene dunkle Kleidung mit glutroter Stickerei und tintenbefleckte Finger prägen den Eindruck.</p>\n<h2>Verse im Illuminated Scroll</h2><p>Am 31. Januar befragte Tacitus <a href=\"#/artikel/verse\">Verse</a> zu Erinnerungen, neuen Urteilen und der möglichen Natur seines Bewusstseins. Dass er Schlussfolgerungen bildet, die nicht aus gespeicherten Erinnerungen stammen, nahm sie ernst.</p>\n<h2>Der Abbruch und die Fortsetzung</h2><p>Vesper gab während Stykes Ablenkung heimlich Abführmittel in Tacitus' Glas. Dringende Beschwerden beendeten das Treffen. Tacitus erholte sich und erklärte Jacobian am 2. Februar, dass sie das Gespräch fortsetzen will.</p>\n<h2>Vorliebe und Loyalität</h2><p>Tacitus mag trockenen, dunklen, kräftigen Rotwein. Ihre Neugier auf Verse ändert nichts an ihrer Loyalität zu Talingarde und Mitra.</p>\n<p><a href=\"#/artikel/anatomie-tacitus\">Private Körperakte</a>.</p>\n<h2>Die Einladung</h2><p>Am 3. Februar ließ Styke ihr über Jacobian eine Einladung für den 8. Februar gegen 20 Uhr ins Lord’s Dalliance ausrichten. Tacitus’ Antwort ist der Gruppe noch nicht bekannt.</p>","sources":["tacitus-current","live","chronicle"],"status":"Einladung für 8. Februar offen","tags":["Magierin","Gelehrte","Balentyne"],"aliases":["Tacitus of Morimun","Tacitus von Morimun","Tacitus"],"group":"garrison","text":"Erscheinung Eine schlanke, drahtige Frau mittleren Alters mit langem kantigem Gesicht, etwas hohlen Wangen, markanter Nase, zurückgestrichenem rotbraunem Haar und kleiner runder Goldbrille. Hochgeschlossene dunkle Kleidung mit glutroter Stickerei und tintenbefleckte Finger prägen den Eindruck. Verse im Illuminated Scroll Am 31. Januar befragte Tacitus Verse zu Erinnerungen, neuen Urteilen und der möglichen Natur seines Bewusstseins. Dass er Schlussfolgerungen bildet, die nicht aus gespeicherten Erinnerungen stammen, nahm sie ernst. Der Abbruch und die Fortsetzung Vesper gab während Stykes Ablenkung heimlich Abführmittel in Tacitus' Glas. Dringende Beschwerden beendeten das Treffen. Tacitus erholte sich und erklärte Jacobian am 2. Februar, dass sie das Gespräch fortsetzen will. Vorliebe und Loyalität Tacitus mag trockenen, dunklen, kräftigen Rotwein. Ihre Neugier auf Verse ändert nichts an ihrer Loyalität zu Talingarde und Mitra. Private Körperakte . Die Einladung Am 3. Februar ließ Styke ihr über Jacobian eine Einladung für den 8. Februar gegen 20 Uhr ins Lord’s Dalliance ausrichten. Tacitus’ Antwort ist der Gruppe noch nicht bekannt.","search":"magisterin tacitus von morimun balentynes magisterin ihr interesse an verse blieb bestehen styke liess sie fur den 8 februar ins dalliance einladen tacitus of morimun tacitus von morimun tacitus magierin gelehrte balentyne garrison erscheinung eine schlanke drahtige frau mittleren alters mit langem kantigem gesicht etwas hohlen wangen markanter nase zuruckgestrichenem rotbraunem haar und kleiner runder goldbrille hochgeschlossene dunkle kleidung mit glutroter stickerei und tintenbefleckte finger pragen den eindruck verse im illuminated scroll am 31 januar befragte tacitus verse zu erinnerungen neuen urteilen und der moglichen natur seines bewusstseins dass er schlussfolgerungen bildet die nicht aus gespeicherten erinnerungen stammen nahm sie ernst der abbruch und die fortsetzung vesper gab wahrend stykes ablenkung heimlich abfuhrmittel in tacitus glas dringende beschwerden beendeten d zusetzen. Jacobian sagte zu, die Einladung weiterzugeben. Eine Antwort von Tacitus ist noch nicht eingetroffen.","links":["scroll","tacitus"],"backlinks":["scroll","story-so-far","zeit-tacitus"],"search":"jacobian scaramore schreiber und buchkundiger im illuminated scroll am 3 februar ubernahm er stykes einladung an tacitus scaramore jacobian schreiber kontakt aldencross town bekannte rolle jacobian betreibt den illuminated scroll und ist ein enger personlicher freund von tacitus er vermittelte das erste gesprach uber verse und war am 31 januar gastgeber die einladung vom 3 februar nach seiner ruckkehr las styke jacobians versiegelte nachricht und suchte ihn auf er lud tacitus fur den 8 februar gegen 20 uhr in das lord s dalliance ein um das gesprach uber verse fortzusetzen jacobian sagte zu die einladung weiterzugeben eine antwort von tacitus ist noch nicht eingetroffen"},{"id":"marlowe","category":"personen","title":"William Marcus Marlowe","summary":"Leiter der Ye Merrie Men. Eine Aufführung in Balentyne ist als kommende Gelegenheit bekannt.","body":"<h2>Bekannte Verbindung</h2>\n<p>Die reisende Schauspieltruppe <a href=\"#/artikel/merrie-men\">Ye Merrie Men</a> soll <em>The Fall of Amberlyn</em> für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar.</p>\n<h2>Stand der Planung</h2>\n<p>Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.</p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offener Hinweis"],"aliases":["Marlowe"],"group":"town","text":"Bekannte Verbindung Die reisende Schauspieltruppe Ye Merrie Men soll The Fall of Amberlyn für Soldaten in Balentyne aufführen. Bellam erzählte davon am 27. Januar. Stand der Planung Dass eine solche Aufführung kommen soll, ist ein etablierter Hinweis. Exaktes Datum, Uhrzeit, Besetzung, Zugangskontrolle und Bewegungen der Truppe sind noch nicht geklärt. Das Wiki macht daraus keine bereits verfügbare Tarnidentität oder sichere Einlassmöglichkeit.","links":["merrie-men"],"backlinks":["bellam"],"search":"william marcus marlowe leiter der ye merrie men eine auffuhrung in balentyne ist als kommende gelegenheit bekannt marlowe theater offener hinweis town bekannte verbindung die reisende schauspieltruppe ye merrie men soll the fall of amberlyn fur soldaten in balentyne auffuhren bellam erzahlte davon am 27 januar stand der planung dass eine solche auffuhrung kommen soll ist ein etablierter hinweis exaktes datum uhrzeit besetzung zugangskontrolle und bewegungen der truppe sind noch nicht geklart das wiki macht daraus keine bereits verfugbare tarnidentitat oder sichere einlassmoglichkeit"},{"id":"giuseppe","category":"personen","title":"Mama Louisa Giuseppe","summary":"Balentynes Köchin; ihr großer Gemeinschaftseintopf wurde am 1. Februar beobachtet und kehrt am 8. Februar wieder.","body":"<h2>Beobachtete Routine</h2><p>Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet.</p>\n<h2>Der 1. Februar</h2><p>Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet.</p>\n<h2>Der 8. Februar</h2><p>Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Vier Päckchen Rattengift liegen im Dalliance; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan.</p>\n<p><a href=\"#/artikel/eintopf-plan\">Eintopf und Sabotageplan</a> / <a href=\"#/artikel/kueche\">Bekanntes Küchenwissen</a></p>","sources":["chronicle","live","timeline"],"status":"Routine bestätigt","tags":["Küche","Routine","8. Februar"],"aliases":["Mama Giuseppe","Louisa Giuseppe","Giuseppe"],"group":"town","text":"Beobachtete Routine Vesper erfuhr am 30. Januar, dass Mama Giuseppe wöchentlich einen großen Rindereintopf aus einem gemeinsamen Topf für ungefähr siebzig dienstfreie Soldaten zubereitet. Der 1. Februar Vesper half bei der Ausgabe. Die Küche war hektisch, der Gemeinschaftskessel wurde in ihrer Gegenwart nicht besonders geprüft. Der Eintopf blieb an diesem Tag unangetastet. Der 8. Februar Die nächste bekannte Gelegenheit fällt auf den 8. Februar. Vier Päckchen Rattengift liegen im Dalliance; Zugang, Aufsicht, Dosis und Wirkung sind noch offen. Giuseppe selbst gehört nicht zum Plan. Eintopf und Sabotageplan / Bekanntes Küchenwissen","links":["eintopf-plan","kueche"],"backlinks":["story-so-far"],"search":"mama louisa giuseppe balentynes kochin ihr grosser gemeinschaftseintopf wurde am 1 februar beobachtet und kehrt am 8 februar wieder mama giuseppe louisa giuseppe giuseppe kuche routine 8 februar town beobachtete routine vesper erfuhr am 30 januar dass mama giuseppe wochentlich einen grossen rindereintopf aus einem gemeinsamen topf fur ungefahr siebzig dienstfreie soldaten zubereitet der 1 februar vesper half bei der ausgabe die kuche war hektisch der gemeinschaftskessel wurde in ihrer gegenwart nicht besonders gepruft der eintopf blieb an diesem tag unangetastet der 8 februar die nachste bekannte gelegenheit fallt auf den 8 februar vier packchen rattengift liegen im dalliance zugang aufsicht dosis und wirkung sind noch offen giuseppe selbst gehort nicht zum plan eintopf und sabotageplan bekanntes kuchenwissen"},{"id":"varning","category":"personen","title":"Captain Ryan Varning","summary":"Mit seiner sechsköpfigen berittenen Patrouille am 26. Januar bei Freeman's Rock getötet.","body":"<h2>Gesicherter Verlauf</h2>\n<p>Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; <a href=\"#/artikel/styke\">Styke</a> tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben.</p>\n<h2>Nachwirkungen</h2>\n<p>Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen <a href=\"#/artikel/varning-schluessel\">noch nicht identifizierten Schlüssel</a>, <a href=\"#/artikel/grumblejack\">Grumblejack</a> erhielt <a href=\"#/artikel/varlet\">Varlet</a>.</p>\n<p>Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. <strong>Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.</strong></p>\n","sources":["chronicle","core","live"],"status":"Bestätigt","tags":["Tot","Patrouille"],"aliases":["Ryan Varning","Varning"],"group":"garrison","text":"Gesicherter Verlauf Varning verließ Balentyne am 24. Januar mit sechs ausgewählten Reitern. Der Knoten klärte ihren Lagerplatz auf und griff in der Nacht des 26. Januar an. Varning ergab sich schwer verwundet; Styke tötete ihn gemäß seiner zuvor festgelegten Keine-Gefangenen-Anweisung. Alle sieben Patrouillenmitglieder starben. Nachwirkungen Die Leichen wurden verborgen, der Platz bereinigt und sieben Pferde erbeutet. Markante Ausrüstung blieb in einem Versteck außerhalb Aldencross'. Styke behielt einen noch nicht identifizierten Schlüssel , Grumblejack erhielt Varlet . Am 29. Januar galt die Patrouille offen als verspätet und Suchreiter brachen auf. Seit 31. Januar ist ihr Tod in Balentyne bekannt. Die vollständigen Fundumstände und Ermittlungsberichte kennt Styke nicht.","links":["styke","varning-schluessel","grumblejack","varlet"],"backlinks":["story-so-far","zeit-0124"],"search":"captain ryan varning mit seiner sechskopfigen berittenen patrouille am 26 januar bei freeman s rock getotet ryan varning varning tot patrouille garrison gesicherter verlauf varning verliess balentyne am 24 januar mit sechs ausgewahlten reitern der knoten klarte ihren lagerplatz auf und griff in der nacht des 26 januar an varning ergab sich schwer verwundet styke totete ihn gemass seiner zuvor festgelegten keine gefangenen anweisung alle sieben patrouillenmitglieder starben nachwirkungen die leichen wurden verborgen der platz bereinigt und sieben pferde erbeutet markante ausrustung blieb in einem versteck ausserhalb aldencross styke behielt einen noch nicht identifizierten schlussel grumblejack erhielt varlet am 29 januar galt die patrouille offen als verspatet und suchreiter brachen auf seit 31 januar ist ihr tod in balentyne bekannt die vollstandigen fundumstande und ermittlungsberichte kennt styke nicht"},{"id":"varlet","category":"personen","title":"Varlet","summary":"Varnings ehemaliges Kriegspferd, jetzt Grumblejacks eigener Anteil und Packtier.","body":"<h2>Eigentum und Ort</h2>\n<p>Nach Freeman's Rock gab <a href=\"#/artikel/styke\">Styke</a> das Pferd ausdrücklich <a href=\"#/artikel/grumblejack\">Grumblejack</a> als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar.</p>\n<p>Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.</p>\n","sources":["relations","chronicle","live"],"status":"Bestätigt","tags":["Tier","Feldgruppe"],"aliases":[],"group":"field","text":"Eigentum und Ort Nach Freeman's Rock gab Styke das Pferd ausdrücklich Grumblejack als persönlichen Anteil. Varlet ist nicht einfach beliebiges Gruppeninventar. Es befindet sich mit den übrigen erbeuteten Pferden bei Hakons Feldgruppe. Eine spätere Veräußerung, Verletzung oder Verlegung ist nicht berichtet.","links":["styke","grumblejack"],"backlinks":["grumblejack","varning","feldgruppe","story-so-far","zeit-0126"],"search":"varlet varnings ehemaliges kriegspferd jetzt grumblejacks eigener anteil und packtier tier feldgruppe field eigentum und ort nach freeman s rock gab styke das pferd ausdrucklich grumblejack als personlichen anteil varlet ist nicht einfach beliebiges gruppeninventar es befindet sich mit den ubrigen erbeuteten pferden bei hakons feldgruppe eine spatere verausserung verletzung oder verlegung ist nicht berichtet"},{"id":"matilda","category":"personen","title":"Matilda Richter","summary":"Branderscars Vorsteherin. Sie überlebte den angenommenen Ausbruch.","body":"<h2>Kampagnenfassung</h2>\n<p>Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück.</p>\n<h2>Folgen der Begegnung</h2>\n<p>Vesper barg <a href=\"#/artikel/verse\">Verse</a> aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück.</p>\n<p><strong>Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.</strong></p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Branderscar","Historisch"],"aliases":["Mathias Richter","Richter"],"group":"history","text":"Kampagnenfassung Matilda ist die weibliche Kampagnenkonversion der Branderscar-Vorsteherfigur. Styke und Vesper setzten sie in ihren Privaträumen nichttödlich außer Gefecht. Das Archiv setzt sie nicht nachträglich auf den gedruckten Ausgang zurück. Folgen der Begegnung Vesper barg Verse aus einem Beweisbehälter ihrer Bibliothek und verzichtete auf weitere Rache an der Hilflosen. Eine Moorkarte und Richters Zauberbuch wurden mitgenommen, schwere alchemistische Ausrüstung blieb zurück. Ihr späterer Aufenthaltsort und Zustand nach Branderscar sind nicht geklärt.","links":["styke","vesper","verse"],"backlinks":["branderscar","story-so-far","zeit-branderscar"],"search":"matilda richter branderscars vorsteherin sie uberlebte den angenommenen ausbruch klinks":["story-so-far","zeit-seereise"],"search":"captain edward sambryl talireanischer patrouillenkapitan aus der frosthamar reise edward sambryl sambryl seereise historisch history begegnung auf see seine patrouille wurde wahrend der frosthamar reise besiegt sechs uberlebende wurden spater an einer abgelegenen kuste mit wasser einem kurzbogen und pfeilen freigelassen nicht als gefolgsleute behalten grenze der rekonstruktion das historische dossier belegt den ausgang der patrouille legt aber sambryls personliches spateres schicksal nicht gesondert sicher fest beutestucke der patrouille gingen in den yutak handel ein und sind nicht automatisch noch im inventar"},{"id":"odenkirk","category":"personen","title":"Captain Kargeld Odenkirk","summary":"Ehemaliger Kapitän der Frosthamar. Im akzeptierten Verlauf tot.","body":"<h2>Mannschaft und Ende</h2>\n<p><a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks letzter Konflikt stattfand.</p>\n<p>Odenkirk starb. Die <a href=\"#/artikel/frosthamar\">Frosthamar</a> wurde zerstört, nachdem tragbare Wertgegenstände und Thorns Zahlung geborgen waren.</p>\n<h2>Kein automatisches Restinventar</h2>\n<p>Seine Meisterarbeits-Axt, Wurfäxte, kleine Silberfigur, Dreizack, Whisky und andere Beute sind an den späteren Verkaufs- und Inventarverlauf gebunden. Das historische Vorkommen eines Gegenstands beweist nicht seinen heutigen Besitz.</p>\n","sources":["history","chronicle"],"status":"Bestätigt","tags":["Tot","Seereise"],"aliases":["Kargeld Odenkirk","Odenkirk"],"group":"history","text":"Mannschaft und Ende Hakon , Sten , Ketil , Eirik , Arved und Torvald waren seine Seeleute. Sie verließen seine Mannschaft und nahmen Stykes Bezahlung an, bevor Odenkirks l
