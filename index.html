 Thorn am 20. Februar an Styke übergeben.","body":"<p>Das kleine tönerne Siegel dient als neuer Kommunikationsweg zu Thorn während der Operation in Farholde und am Horn. Es ersetzt keine Befehle, Antworten oder Fristen, die noch nicht tatsächlich übermittelt wurden.</p>","sources":["live","transition","chronicle"],"status":"Bei Styke","links":[],"text":"Das kleine tönerne Siegel dient als neuer Kommunikationsweg zu Thorn während der Operation in Farholde und am Horn. Es ersetzt keine Befehle, Antworten oder Fristen, die noch nicht tatsächlich übermittelt wurden.","search":"thorns tonernes siegel neues kommunikationssiegel fur den zweiten auftrag von thorn am 20 februar an styke ubergeben thorn kommunikation buch zwei tonsiegel das kleine tonerne siegel dient als neuer kommunikationsweg zu thorn wahrend der operation in farholde und am horn es ersetzt keine befehle antworten oder fristen die noch nicht tatsachlich ubermittelt wurden","initial":"T","backlinks":[]},{"aliases":[],"links":[],"backlinks":["white-ravens"],"text":"Funktion Styke und Vesper wählten die Graue Möwe am 23. Februar als Wegwerf-Treffpunkt für die ankommenden White Ravens. Sie liegt näher an Corgan’s Landing als der Goldene Reiher und verrät nicht durch gewöhnlichen Besucherverkehr die Unterkunft des Kernhaushalts. Belegung Vier Zimmer für die erste Nacht wurden bezahlt. Elise, Dostan, Trak und Trik können ihre weitere Unterkunft selbst tragen. Die Möwe ist ein plausibles Gasthaus, kein geheimes Hauptquartier.","search":"die graue mowe gewohnliches gasthaus nahe corgans landing und vorlaufige farholde basis des siebten knotens farholde corgans landing white ravens treffpunkt funktion styke und vesper wahlten die graue mowe am 23 februar als wegwerf treffpunkt fur die ankommenden white ravens sie liegt naher an corgans landing als der goldene reiher und verrat nicht durch gewohnlichen besucherverkehr die unterkunft des kernhaushalts belegung vier zimmer fur die erste nacht wurden bezahlt elise dostan trak und trik konnen ihre weitere unterkunft selbst tragen die mowe ist ein plausibles gasthaus kein geheimes hauptquartier","initial":"D","id":"graue-moewe","category":"orte","title":"Die Graue Möwe","summary":"Gewöhnliches Gasthaus nahe Corgan’s Landing und vorläufige Farholde-Basis des Siebten Knotens.","body":"<h2>Funktion</h2><p>Styke und Vesper wählten die Graue Möwe am 23. Februar als Wegwerf-Treffpunkt für die ankommenden White Ravens. Sie liegt näher an Corgan’s Landing als der Goldene Reiher und verrät nicht durch gewöhnlichen Besucherverkehr die Unterkunft des Kernhaushalts.</p><h2>Belegung</h2><p>Vier Zimmer für die erste Nacht wurden bezahlt. Elise, Dostan, Trak und Trik können ihre weitere Unterkunft selbst tragen. Die Möwe ist ein plausibles Gasthaus, kein geheimes Hauptquartier.</p>","sources":["chronicle","timeline","farholde"],"status":"Aktiv · Siebter Knoten","tags":["Farholde","Corgan’s Landing","White Ravens","Treffpunkt"]},{"aliases":[],"links":[],"backlinks":[],"text":"Begegnung am Horn Jurak stellte Styke, Vesper und Valeria am 24. Februar vor dem Horn. Sie berichtete vom alten Todeskult und von ihrem heiligen Auftrag, den Ort im Namen des Victors zu schützen. Der Bruch Styke erklärte, dass er in das Horn müsse und die dort gesuchte Krankheit für seinen Schwur bergen wolle. Sein Angebot, dabei Tote zu begrenzen, reichte Jurak nicht. Sie verweigerte den Zugang, und Styke zog Stahl. Ende Vesper und Valeria unterstützten den kurzen Kampf. Als Jurak tödlich verwundet zurückwich, fing Valeria sie ab; Styke beendete den Kampf. Vesper nahm danach kleine Proben von Rinde, Harz und tieferem Holz.","search":"jurak die altere alte huterin des horns die ihren vom victor erteilten schutzauftrag bis zum tod erfullte horn von abaddon huterin victor caer bryr begegnung am horn jurak stellte styke vesper und valeria am 24 februar vor dem horn sie berichtete vom alten todeskult und von ihrem heiligen auftrag den ort im namen des victors zu schutzen der bruch styke erklarte dass er in das horn musse und die dort gesuchte krankheit fur seinen schwur bergen wolle sein angebot dabei tote zu begrenzen reichte jurak nicht sie verweigerte den zugang und styke zog stahl ende vesper und valeria unterstutzten den kurzen kampf als jurak todlich verwundet zuruckwich fing valeria sie ab styke beendete den kampf vesper nahm danach kleine proben von rinde harz und tieferem holz","initial":"J","id":"jurak","category":"personen","title":"Jurak die Ältere","summary":"Alte Hüterin des Horns, die ihren vom Victor erteilten Schutzauftrag bis zum Tod erfüllte.","body":"<h2>Begegnung am Horn</h2><p>Jurak stellte Styke, Vesper und Valeria am 24. Februar vor dem Horn. Sie berichtete vom alten Todeskult und von ihrem heiligen Auftrag, den Ort im Namen des Victors zu schützen.</p><h2>Der Bruch</h2><p>Styke erklärte, dass er in das Horn müsse und die dort gesuchte Krankheit für seinen Schwur bergen wolle. Sein Angebot, dabei Tote zu begrenzen, reichte Jurak nicht. Sie verweigerte den Zugang, und Styke zog Stahl.</p><h2>Ende</h2><p>Vesper und Valeria unterstützten den kurzen Kampf. Als Jurak tödlich verwundet zurückwich, fing Valeria sie ab; Styke beendete den Kampf. Vesper nahm danach kleine Proben von Rinde, Harz und tieferem Holz.</p>","sources":["live","chronicle","timeline"],"status":"Tot · 24. Februar 4712 AR","tags":["Horn von Abaddon","Hüterin","Victor","Caer Bryr"]},{"id":"deaths-head-tavern","category":"orte","title":"Death's Head Tavern","summary":"Verlassene Schänke auf Ebene Eins: erstes Hornlager und geplante gemeinsame Schänke der neuen Siedlung.","body":"<h2>Erstes Lager</h2><p>Das Kerntrio schlug hier am 24. Februar sein erstes Nachtlager auf. Die vollständige Ruhe mit abwechselnden Wachen endete am Morgen des 25. Februar; Vespers Buchvergleich ergab keine neue sichtbare Zeile.</p><h2>Künftiger Gebrauch</h2><p>Die Schänke ist für gemeinsames Leben, Bewirtung und einen Haupttisch vorgesehen. Herrichten, Personal, Bad und Versorgung bleiben geplante Arbeiten; noch besteht dort kein fertig bezogener Haushalt. Das Trio kehrte am 25. Februar nach Farholde zurück.</p>","sources":["live"],"status":"Erstes Lager abgeschlossen · Ausbau geplant","tags":["Horn","Lager"],"aliases":[],"group":"","initial":"D","text":"Erstes Lager Das Kerntrio schlug hier am 24. Februar sein erstes Nachtlager auf. Die vollständige Ruhe mit abwechselnden Wachen endete am Morgen des 25. Februar; Vespers Buchvergleich ergab keine neue sichtbare Zeile. Künftiger Gebrauch Die Schänke ist für gemeinsames Leben, Bewirtung und einen Haupttisch vorgesehen. Herrichten, Personal, Bad und Versorgung bleiben geplante Arbeiten; noch besteht dort kein fertig bezogener Haushalt. Das Trio kehrte am 25. Februar nach Farholde zurück.","links":[],"backlinks":[],"search":"death s head tavern verlassene schanke auf ebene eins erstes hornlager und geplante gemeinsame schanke der neuen siedlung horn lager erstes lager das kerntrio schlug hier am 24 februar sein erstes nachtlager auf die vollstandige ruhe mit abwechselnden wachen endete am morgen des 25 februar vespers buchvergleich ergab keine neue sichtbare zeile kunftiger gebrauch die schanke ist fur gemeinsames leben bewirtung und einen haupttisch vorgesehen herrichten personal bad und versorgung bleiben geplante arbeiten noch besteht dort kein fertig bezogener haushalt das trio kehrte am 25 februar nach farholde zuruck"},{"id":"ezra-thrice-damned","category":"personen","title":"Ezra Thrice-Damned","summary":"Der untote Priester des Vierten Knotens wurde am 25. Februar mit allen drei Wraiths vernichtet.","body":"<h2>Begegnung</h2><p>Ezra und drei Wraiths wurden im verborgenen Tresor auf Ebene Drei gefunden. Er gestand den Mord an drei Mitgliedern seines Knotens; Kael sei zuvor geflohen.</p><h2>Vorläufige Zusammenarbeit</h2><p>Ezra erklärte Ritualablauf, Augenfunktionen, Thronworte und den verdeckten Weg zum Sanctum. Seine Aussagen gelten dort als Zeugnis, wo sie noch nicht überprüft wurden. Vertrauen oder Retainerstatus besitzt er nicht.</p><h2>Ende der Zusammenarbeit</h2><p>Am 25. Februar wurde der vorläufige Nichtangriffsschutz aufgehoben. In normaler Initiative unterdrückte Vesper Ezras Flug und bereitete Stykes Waffe gegen den Untoten vor. Styke vernichtete Ezra in der ersten Runde; alle drei Wraiths folgten im anschließenden Kampf. Die aus C13 geborgenen Dirges bestätigen den Ritualrahmen unabhängig von seinem früheren Zeugnis.</p>","sources":["live"],"status":"Vernichtet · 25. Februar","tags":["Untoter","Vierter Knoten","Horn"],"aliases":[],"group":"","initial":"E","text":"Begegnung Ezra und drei Wraiths wurden im verborgenen Tresor auf Ebene Drei gefunden. Er gestand den Mord an drei Mitgliedern seines Knotens; Kael sei zuvor geflohen. Vorläufige Zusammenarbeit Ezra erklärte Ritualablauf, Augenfunktionen, Thronworte und den verdeckten Weg zum Sanctum. Seine Aussagen gelten dort als Zeugnis, wo sie noch nicht überprüft wurden. Vertrauen oder Retainerstatus besitzt er nicht. Ende der Zusammenarbeit Am 25. Februar wurde der vorläufige Nichtangriffsschutz aufgehoben. In normaler Initiative unterdrückte Vesper Ezras Flug und bereitete Stykes Waffe gegen den Untoten vor. Styke vernichtete Ezra in der ersten Runde; alle drei Wraiths folgten im anschließenden Kampf. Die aus C13 geborgenen Dirges bestätigen den Ritualrahmen unabhängig von seinem früheren Zeugnis.","links":[],"backlinks":[],"search":"ezra thrice damned der untote priester des vierten knotens wurde am 25 februar mit allen drei wraiths vernichtet untoter vierter knoten horn begegnung ezra und drei wraiths wurden im verborgenen tresor auf ebene drei gefunden er gestand den mord an drei mitgliedern seines knotens kael sei zuvor geflohen vorlaufige zusammenarbeit ezra erklarte ritualablauf augenfunktionen thronworte und den verdeckten weg zum sanctum seine aussagen gelten dort als zeugnis wo sie noch nicht uberpruft wurden vertrauen oder retainerstatus besitzt er nicht ende der zusammenarbeit am 25 februar wurde der vorlaufige nichtangriffsschutz aufgehoben in normaler initiative unterdruckte vesper ezras flug und bereitete stykes waffe gegen den untoten vor styke vernichtete ezra in der ersten runde alle drei wraiths folgten im anschlie enden kampf die aus c13 geborgenen dirges bestatigen den ritualrahmen unabhangig von seinem fruheren zeugnis"},{"id":"vexorandian","category":"personen","title":"Vexorandian","summary":"Gebundener Wächter des Horns; nach Wraith- und Schleimbeseitigung unter abwechselndem Ruhe- und Wachauftrag.","body":"<h2>Bindung</h2><p>Vexorandian wurde nichttödlich überwältigt. Styke trägt sein vollständiges Namensamulett und besitzt die unmittelbare Befehlsgewalt; Valeria ist durch stehenden Befehl delegiert.</p><h2>Wachauftrag</h2><p>Der bisherige untere gebaute Zugang bleibt sein anschließender Posten. Während der angeordneten Erholung gilt der Wechsel in der gemeinsamen Wächterkammer; dies hebt die übrigen Beschränkungen nicht auf.</p><h2>Erholung nach dem 25. Februar</h2><p>Vexorandian erlitt im Wraithkampf drei Punkte direkten Schaden und drei Punkte Konstitutionsentzug. Beide Wächter vernichteten danach die Schleime mit Elektrizitätsatem. Sie sollen in ihrer früheren gemeinsamen Kammer abwechselnd wachen und ruhen, bis natürliche Erholung ausgeschöpft ist, und anschließend die getrennten Eingangsposten wieder aufnehmen. Alle bisherigen Zutritts- und nichttödlichen Festsetzungsregeln gelten weiter. Ein aktueller Heilungsbericht wurde dem Kerntrio nicht übermittelt. Vexors Konstitutionsentzug wird weder durch Ruhe noch durch Lesser Restoration entfernt.</p>","sources":["live"],"status":"Gebunden · letzter bekannter Auftrag: Erholung und Wache","tags":["Daemon","Wächter","Gebunden"],"aliases":[],"group":"","initial":"V","text":"Bindung Vexorandian wurde nichttödlich überwältigt. Styke trägt sein vollständiges Namensamulett und besitzt die unmittelbare Befehlsgewalt; Valeria ist durch stehenden Befehl delegiert. Wachauftrag Der bis  of Achlys. Das Auge bleibt bei Styke und ist nicht eingesetzt. Status Styke besitzt das Auge. Es ist nicht im Sanctum eingesetzt und kein Ritual hat begonnen.","links":[],"backlinks":[],"search":"auge des hasses eines der drei ritualaugen des horns derzeit bei styke nicht eingesetzt ritual horn auge bekannte funktion ezra erklarte dass das eingesetzte auge mitranische gottliche magie im horn erkennt die dirges bestatigen unabhangig davon seine rolle am ritualende die bitte um die tears of achlys das auge bleibt bei styke und ist nicht eingesetzt status styke besitzt das auge es ist nicht im sanctum eingesetzt und kein ritual hat begonnen"},{"id":"stance-inner-eye","category":"faehigkeiten","title":"Stance of the Inner Eye","summary":"Stykes neue Standardhaltung auf Stufe 7.","body":"<p>Gewährt +2 Insight auf AC, Angriff, Schaden, CMB und Rettungswürfe sowie +1d6 Präzisionsschaden. Die Vorteile entfallen, wenn Styke seinen Geschicklichkeitsbonus auf AC verliert.</p>","sources":["ssheet"],"status":"Aktiv · Stufe 7","tags":["Stance","Styke"],"aliases":[],"group":"","initial":"S","text":"Gewährt +2 Insight auf AC, Angriff, Schaden, CMB und Rettungswürfe sowie +1d6 Präzisionsschaden. Die Vorteile entfallen, wenn Styke seinen Geschicklichkeitsbonus auf AC verliert.","links":["bogen-styke","styke"],"backlinks":[],"search":"stance of the inner eye stykes neue standardhaltung auf stufe 7 stance styke gewahrt 2 insight auf ac angriff schaden cmb und rettungswurfe sowie 1d6 prazisionsschaden die vorteile entfallen wenn styke seinen geschicklichkeitsbonus auf ac verliert"},{"id":"fetchs-wrath","category":"faehigkeiten","title":"Fetch's Wrath","summary":"Grad-4-Strike mit Teleport und +4d6 Schaden.","body":"<p>Styke teleportiert vor oder nach einem Nahkampfangriff bis zu 170 ft. Bei Treffer kommen +4d6 hinzu. Mit Reflected Blade Style wird der Angriff kopiert, nicht der Teleport.</p>","sources":["ssheet"],"status":"Aktiv · Stufe 7","tags":["Manöver","Styke"],"aliases":[],"group":"","initial":"F","text":"Styke teleportiert vor oder nach einem Nahkampfangriff bis zu 170 ft. Bei Treffer kommen +4d6 hinzu. Mit Reflected Blade Style wird der Angriff kopiert, nicht der Teleport.","links":["bogen-styke","styke"],"backlinks":[],"search":"fetch s wrath grad 4 strike mit teleport und 4d6 schaden manover styke styke teleportiert vor oder nach einem nahkampfangriff bis zu 170 ft bei treffer kommen 4d6 hinzu mit reflected blade style wird der angriff kopiert nicht der teleport"},{"id":"circle-razor-feathers","category":"faehigkeiten","title":"Circle of Razor Feathers","summary":"Grad-4-Flächenmanöver von Styke.","body":"<p>30-ft-Burst um Styke; 8d6 profaner Schaden, Reflex SG 17 teilweise. Betroffene Gegner werden auch bei erfolgreichem Rettungswurf kurzzeitig sickened.</p>","sources":["ssheet"],"status":"Aktiv · Stufe 7","tags":["Manöver","Styke"],"aliases":[],"group":"","initial":"C","text":"30-ft-Burst um Styke; 8d6 profaner Schaden, Reflex SG 17 teilweise. Betroffene Gegner werden auch bei erfolgreichem Rettungswurf kurzzeitig sickened.","links":["bogen-styke","styke"],"backlinks":[],"search":"circle of razor feathers grad 4 flachenmanover von styke manover styke 30 ft burst um styke 8d6 profaner schaden reflex sg 17 teilweise betroffene gegner werden auch bei erfolgreichem rettungswurf kurzzeitig sickened"},{"id":"temporal-body-adjustment","category":"faehigkeiten","title":"Temporal Body Adjustment","summary":"Grad-4-Counter gegen einen negativen Zustand.","body":"<p>Unmittelbare Aktion: Styke ignoriert oder beendet einen qualifizierenden negativen Zustand. Tod kann dadurch nicht verhindert werden.</p>","sources":["ssheet"],"status":"Aktiv · Stufe 7","tags":["Counter","Styke"],"aliases":[],"group":"","initial":"T","text":"Unmittelbare Aktion: Styke ignoriert oder beendet einen qualifizierenden negativen Zustand. Tod kann dadurch nicht verhindert werden.","links":["bogen-styke","styke"],"backlinks":[],"search":"temporal body adjustment grad 4 counter gegen einen negativen zustand counter styke unmittelbare aktion styke ignoriert oder beendet einen qualifizierenden negativen zustand tod kann dadurch nicht verhindert werden"},{"id":"disrupt-essence","category":"faehigkeiten","title":"Disrupt Essence","summary":"Vespers neues Grad-3-Radiant-Dawn-Manöver.","body":"<p>Standardangriff über Nahkampf oder Sun's Gleam. Bei einem Treffer kann Vesper bekannte aktivierbare Fähigkeiten, besondere Sinne oder besondere Bewegungsarten zeitweise unterdrücken. Mit 2 Essence betrifft es zwei bekannte Fähigkeiten für sieben Runden; der Rettungswurf beträgt mit Sun's Gleam Will SG 23.</p>","sources":["vsheet"],"status":"Aktiv · Stufe 7","tags":["Manöver","Vesper"],"aliases":[],"group":"","initial":"D","text":"Standardangriff über Nahkampf oder Sun's Gleam. Bei einem Treffer kann Vesper bekannte aktivierbare Fähigkeiten, besondere Sinne oder besondere Bewegungsarten zeitweise unterdrücken. Mit 2 Essence betrifft es zwei bekannte Fähigkeiten für sieben Runden; der Rettungswurf beträgt mit Sun's Gleam Will SG 23.","links":["bogen-vesper","vesper"],"backlinks":["suns-gleam"],"search":"disrupt essence vespers neues grad 3 radiant dawn manover manover vesper standardangriff uber nahkampf oder sun s gleam bei einem treffer kann vesper bekannte aktivierbare fahigkeiten besondere sinne oder besondere bewegungsarten zeitweise unterdrucken mit 2 essence betrifft es zwei bekannte fahigkeiten fur sieben runden der rettungswurf betragt mit sun s gleam will sg 23"},{"id":"armaments-empire","category":"faehigkeiten","title":"Armaments of the Empire","summary":"Vespers neue Standardhaltung; verleiht vorübergehende Waffeneigenschaften.","body":"<p>Standardzuweisung: Stykes Großschwert erhält Vicious, Valerias Großschwert Conductive. Die Eigenschaften bestehen nur durch die Haltung und sind keine dauerhaften Aufwertungen.</p>","sources":["vsheet","level7common"],"status":"Aktiv · Stufe 7","tags":["Stance","Vesper"],"aliases":[],"group":"","initial":"A","text":"Standardzuweisung: Stykes Großschwert erhält Vicious, Valerias Großschwert Conductive. Die Eigenschaften bestehen nur durch die Haltung und sind keine dauerhaften Aufwertungen.","links":["styke","valeria","vesper"],"backlinks":[],"search":"armaments of the empire vespers neue standardhaltung verleiht vorubergehende waffeneigenschaften stance vesper standardzuweisung stykes groschwert erhalt vicious valerias groschwert conductive die eigenschaften bestehen nur durch die haltung und sind keine dauerhaften aufwertungen"},{"id":"air-grievances","category":"faehigkeiten","title":"Air Grievances","summary":"Valerias neue Order-of-Vengeance-Fähigkeit auf Stufe 7.","body":"<p>Valeria erhält +3 auf Demoralisieren. Zusammen mit Aura of Obedience erreicht sie gegen lebende Ziele innerhalb 10 ft einen Gesamtwert von +22.</p>","sources":["valsheet"],"status":"Aktiv · Stufe 7","tags":["Fähigkeit","Valeria"],"aliases":[],"group":"","initial":"A","text":"Valeria erhält +3 auf Demoralisieren. Zusammen mit Aura of Obedience erreicht sie gegen lebende Ziele innerhalb 10 ft einen Gesamtwert von +22.","links":["bogen-valeria","valeria"],"backlinks":[],"search":"air grievances valerias neue order of vengeance fahigkeit auf stufe 7 fahigkeit valeria valeria erhalt 3 auf demoralisieren zusammen mit aura of obedience erreicht sie gegen lebende ziele innerhalb 10 ft einen gesamtwert von 22"},{"id":"dirges-apollyon","category":"gegenstaende","title":"Dirges of Apollyon","summary":"Die aus C13 geborgene Schrift mit Kappelbrenners konkreten Anweisungen für das 222-Tage-Ritual.","body":"<h2>Bergung und Lesen</h2><p>Vesper holte den ledergebundenen Band mit zwei Anwendungen von Gaseous Form aus C13. Styke las die spätere abyssische Handschrift mit seinem Verständnis-/Read-Magic-Helm; Vesper und Valeria waren bei der Auswertung anwesend. Der endgültige Träger nach der Rückkehr wurde nicht erneut festgestellt.</p><h2>Gebetsfolge</h2><p>666 Gebete an 222 ununterbrochenen Tagen: Supplication to Darkness um Mitternacht, Cursing of the Light bei Sonnenaufgang und Call Across the Void bei Sonnenuntergang. Nach jedem Gebet wird das Silbersiegel mit unheiligem Wasser gewaschen. Ein verpasstes Gebetsfenster setzt den Zähler zurück.</p><h2>Drei Opfer</h2><p>Das erste Mitternachtsgebet verlangt einen Todespriester oder dessen Nachfahren; das 111. Morgengebet einen wahrhaft Mitragläubigen; das letzte Abendgebet jemanden aus der Blutlinie des Victor. Die Opfer müssen leben, wenn ihr Herz herausgeschnitten und in eine Schale der Statue gelegt wird.</p><h2>Die abschließende Bitte</h2><p>Vetra-Kali soll nach dem letzten Tag um Mitternacht zurückkehren und das Siegel brechen. Vigilance steht für das Verschonen der Beschwörer, Hatred für die Tears of Achlys und Withering für einen dritten frei gewählten Wunsch. Das beschreibt die Anweisung der Schrift; kein Opfer, Gebetszähler oder endgültiger Handel hat begonnen.</p>","sources":["live","chronicle"],"status":"Geborgen · Ritual nicht begonnen","tags":[],"aliases":[],"initial":"D","text":"Bergung und Lesen Vesper holte den ledergebundenen Band mit zwei Anwendungen von Gaseous Form aus C13. Styke las die spätere abyssische Handschrift mit seinem Verständnis-/Read-Magic-Helm; Vesper und Valeria waren bei der Auswertung anwesend. Der endgültige Träger nach der Rückkehr wurde nicht erneut festgestellt. Gebetsfolge 666 Gebete an 222 ununterbrochenen Tagen: Supplication to Darkness um Mitternacht, Cursing of the Light bei Sonnenaufgang und Call Across the Void bei Sonnenuntergang. Nach jedem Gebet wird das Silbersiegel mit unheiligem Wasser gewaschen. Ein verpasstes Gebetsfenster setzt den Zähler zurück. Drei Opfer Das erste Mitternachtsgebet verlangt einen Todespriester oder dessen Nachfahren; das 111. Morgengebet einen wahrhaft Mitragläubigen; das letzte Abendgebet jemanden aus der Blutlinie des Victor. Die Opfer müssen leben, wenn ihr Herz herausgeschnitten und in eine Schale der Statue gelegt wird. Die abschließende Bitte Vetra-Kali soll nach dem letzten Tag um Mitternacht zurückkehren und das Siegel brechen. Vigilance steht für das Verschonen der Beschwörer, Hatred für die Tears of Achlys und Withering für einen dritten frei gewählten Wunsch. Das beschreibt die Anweisung der Schrift; kein Opfer, Gebetszähler oder endgültiger Handel hat begonnen.","links":[],"search":"dirges of apollyon die aus c13 geborgene schrift mit kappelbrenners konkreten anweisungen fur das 222 tage ritual bergung und lesen vesper holte den ledergebundenen band mit zwei anwendungen von gaseous form aus c13 styke las die spatere abyssische handschrift mit seinem verstandnis read magic helm vesper und valeria waren bei der auswertung anwesend der endgultige trager nach der ruckkehr wurde nicht erneut festgestellt gebetsfolge 666 gebete an 222 ununterbrochenen tagen supplication to darkness um mitternacht cursing of the light bei sonnenaufgang und call across the void bei sonnenuntergang nach jedem gebet wird das silbersiegel mit unheiligem wasser gewaschen ein verpasstes gebetsfenster setzt den zahler zuruck drei opfer das erste mitternachtsgebet verlangt einen todespriester oder dessen nachfahren das 111 morgengebet einen wahrhaft mitraglaubigen das letzte abendgebet jemanden aus der blutlinie des victor die opfer mussen leben wenn ihr herz herausgeschnitten und in eine schale der statue gelegt wird die abschlie ende bitte vetra kali soll nach dem letzten tag um mitternacht zuruckkehren und das siegel brechen vigilance steht fur das verschonen der beschworer hatred fur die tears of achlys und withering fur einen dritten frei gewahlten wunsch das beschreibt die anweisung der schrift kein opfer gebetszahler oder endgultiger handel hat begonnen","backlinks":["horn-abaddon"]},{"id":"eye-of-vigilance","category":"gegenstaende","title":"Auge der Wachsamkeit","summary":"Vespers geborgenes und aktiviertes Ritualauge: ein gewählter Blickpunkt irgendwo im Horn, auch durch Stein.","body":"<h2>Bergung und Aktivierung</h2><p>Vesper identifizierte den grünen Stein aus C13 als Eye of Vigilance. Blut eines intelligenten Wesens aktiviert seine wahre Gestalt; am 25. Februar wurde dafür Zikomos Blut verwendet.</p><h2>Erprobte Funktion</h2><p>Der Träger kann bewusst einen einzelnen Ort innerhalb des Horns beobachten, auch durch Wände und Stein. Das ist keine gleichzeitige Rundumüberwachung.</p><h2>Status</h2><p>Vesper besitzt das aktivierte Auge; es ist nicht im Sanctum eingesetzt. Die Dirges verbinden es am Ritualende mit der Bitte, die Beschwörer zu verschonen.</p>","sources":["live","chronicle"],"status":"Bei Vesper · aktiv · nicht eingesetzt","tags":[],"aliases":[],"initial":"A","text":"Bergung und Aktivierung Vesper identifizierte den grünen Stein aus C13 als Eye of Vigilance. Blut eines intelligenten Wesens aktiviert seine wahre Gestalt; am 25. Februar wurde dafür Zikomos Blut verwendet. Erprobte Funktion Der Träger kann bewusst einen einzelnen Ort innerhalb des Horns beobachten, auch durch Wände und Stein. Das ist keine gleichzeitige Rundumüberwachung. Status Vesper besitzt das aktivierte Auge; es ist nicht im Sanctum eingesetzt. Die Dirges verbinden es am Ritualende mit der Bitte, die Beschwörer zu verschonen.","links":[],"search":"auge der wachsamkeit vespers geborgenes und aktiviertes ritualauge ein gewahlter blickpunkt irgendwo im horn auch durch stein bergung und aktivierung vesper identifizierte den grunen stein aus c13 als eye of vigilance blut eines intelligenten wesens aktiviert seine wahre gestalt am 25 februar wurde dafur zikomos blut verwendet erprobte funktion der trager kann bewusst einen einzelnen ort innerhalb des horns beobachten auch durch wande und stein das ist keine gleichzeitige rundumuberwachung status vesper besitzt das aktivierte auge es ist nicht im sanctum eingesetzt die dirges verbinden es am ritualende mit der bitte die beschworer zu verschonen","backlinks":["horn-abaddon"]},{"id":"horn-aufbau","category":"horn","title":"Aufbau und Umzug zum Horn","summary":"Der erste Zug ist am 27. Februar eingezogen. Vier Fachkräfte beginnen mit Holzarbeiten, Schmiede, Küche und baulicher Untersuchung.","body":"<h2>Erster Einzug</h2><p>Am 27. Februar ist der erste Zug von Westell zum Horn gereist. Die vier Fachkräfte wohnen und arbeiten in der eingerichteten Siedlungszone auf Ebene Eins. Ihre ersten Arbeiten und das gemeinsame Abendessen haben begonnen beziehungsweise stattgefunden.</p><h2>Die vier Fachkräfte</h2><p><a href=\"#/artikel/branna-cole\">Branna Cole</a> übernimmt Holzarbeiten und die Rettung von Betten, Türen und Beschlägen. <a href=\"#/artikel/osric-fenlow\">Osric Fenlow</a> arbeitet am Kohlelager und am defekten Blasebalg. <a href=\"#/artikel/edda-marr\">Edda Marr</a> versorgt Küche und Bierausschank. <a href=\"#/artikel/darric-holt\">Darric Holt</a> untersucht die Bausubstanz vor geplanten Veränderungen.</p><p>Alle vier haben einen längeren Aufenthalt mit einem Goldstück Tageslohn, Verpflegung und Unterkunft angenommen. Fertige Möbel, eine betriebsbereite Schmiede oder abgeschlossene Umbauten sind noch nicht bestätigt.</p><h2>Familien</h2><p>Osrics Partnerperson und zwei schulpflichtige Kinder bleiben in Farholde. Kaitlyn organisierte über Vandermir die vereinbarte Unterkunft, Versorgung und Ausbildung; das Ergebnis wurde vor dem Aufbruch berichtet.</p><h2>Versorgung</h2><p>Das erste gemeinsame Abendessen wurde serviert und das erste Bierfass angestochen. Trinkbares Wasser ist verfügbar. Die Höhlenpilze wurden mit Vesper geprüft und gelten als wenig schmackhafte Notreserve.</p><h2>Werkstätten</h2><p>Mirelle zieht mit und benötigt ihren trockenen Tischraum. Tacitus und Knittel sollen ihre bezahlte Reihe später im Horn fortsetzen. Grumblejacks Plattenrüstung, Badheizung, Fernkommunikation und Tresortransport sind offene Projekte.</p><h2>Herrschaftsentwurf</h2><p>Arbeit, Wache und vereinbarte Dauer stehen Schutz, Lohn, anerkanntem Eigentum und einer Streitstelle gegenüber. Schankarbeit und freiwillige Sexarbeit bleiben getrennt; niemand erhält einen Anspruch auf Sex.</p>","sources":["live","chronicle","timeline","horn-workforce"],"status":"Einzug erfolgt · Arbeiten begonnen","tags":[],"aliases":[],"initial":"A","text":"Erster Einzug Am 27. Februar ist der erste Zug von Westell zum Horn gereist. Die vier Fachkräfte wohnen und arbeiten in der eingerichteten Siedlungszone auf Ebene Eins. Ihre ersten Arbeiten und das gemeinsame Abendessen haben begonnen beziehungsweise stattgefunden. Die vier Fachkräfte Branna Cole übernimmt Holzarbeiten und die Rettung von Betten, Türen und Beschlägen. Osric Fenlow arbeitet am Kohlelager und am defekten Blasebalg. Edda Marr versorgt Küche und Bierausschank. Darric Holt untersucht die Bausubstanz vor geplanten Veränderungen. Alle vier haben einen längeren Aufenthalt mit einem Goldstück Tageslohn, Verpflegung und Unterkunft angenommen. Fertige Möbel, eine betriebsbereite Schmiede oder abgeschlossene Umbauten sind noch nicht bestätigt. Familien Osrics Partnerperson und zwei schulpflichtige Kinder bleiben in Farholde. Kaitlyn organisierte über Vandermir die vereinbarte Unterkunft, Versorgung und Ausbildung; das Ergebnis wurde vor dem Aufbruch berichtet. Versorgung Das erste gemeinsame Abendessen wurde serviert und das erste Bierfass angestochen. Trinkbares Wasser ist verfügbar. Die Höhlenpilze wurden mit Vesper geprüft und gelten als wenig schmackhafte Notreserve. Werkstätten Mirelle zieht mit und benötigt ihren trockenen Tischraum. Tacitus und Knittel sollen ihre bezahlte Reihe später im Horn fortsetzen. Grumblejacks Plattenrüstung, Badheizung, Fernkommunikation und Tresortransport sind offene Projekte. Herrschaftsentwurf Arbeit, Wache und vereinbarte Dauer stehen Schutz, Lohn, anerkanntem Eigentum und einer Streitstelle gegenüber. Schankarbeit und freiwillige Sexarbeit bleiben getrennt; niemand erhält einen Anspruch auf Sex.","links":["branna-cole","darric-holt","edda-marr","osric-fenlow"],"search":"aufbau und umzug zum horn der erste zug ist am n und Tischlerin im Horn von Abaddon; 38 jahre.","body":"<h2>Person</h2><p><strong>Zimmerin und Tischlerin · Mensch · 38 Jahre</strong></p><p>Branna Cole gehört zu den vier Fachkräften, die am 27. Februar mit dem ersten Zug ins <a href=\"#/artikel/horn-abaddon\">Horn von Abaddon</a> kamen. Vereinbart sind ein längerer Aufenthalt, ein Goldstück Lohn pro Tag sowie Verpflegung und Unterkunft.</p><h2>Erscheinung</h2><p>Branna hat üppiges kupferrotes Haar, das sie meist nur locker zusammenbindet. Zwischen den Strähnen bleiben gern Sägespäne hängen; hinter einem Ohr steckt ein Holzstift. Grüne Augen, Sommersprossen und ein voller, frecher Mund geben ihrem Gesicht eine lebendige, reife Schönheit. Große Brüste, eine schmale Taille, runde Hüften und lange Beine prägen ihre Sanduhrfigur. Eine tief ausgeschnittene cremefarbene Bluse, ein eng geschnürtes braunes Ledermieder und ein geschlitzter Arbeitsrock gehören zu ihrem Erscheinungsbild. Die kurze Werkzeugschürze sitzt seitlich auf der Hüfte.</p><h2>Charakter</h2><p>Branna ist gesellig, selbstständig und stolz auf saubere Arbeit. Sie möchte Möbel und Räume schaffen, die benutzt werden und Bestand haben. Bei einem Auftrag fragt sie nach Nutzung und Maßen; bei einem schlecht behandelten Werkstück wird ihr Ton deutlich schärfer. Sie lacht rasch, auch über eigene Fehler, und genießt es, mit einem Blick oder einer Bemerkung jemanden aus dem Konzept zu bringen.</p><h2>Stimme</h2><p>Warm und ein wenig rau, mit einem schnellen Lachen.</p><h2>Arbeit im Horn</h2><p>Ihre ersten Arbeiten im Horn gelten geborgenen Betten, Türen, Beschlägen und brauchbarem Bauholz. Sie prüft, was sich retten und wiederverwenden lässt. Reparaturen und Möbel sind begonnen, aber noch nicht als fertig bestätigt.</p><h2>Weitere Fachkräfte</h2><p><a href=\"#/artikel/osric-fenlow\">Osric Fenlow</a> · <a href=\"#/artikel/edda-marr\">Edda Marr</a> · <a href=\"#/artikel/darric-holt\">Darric Holt</a> · <a href=\"#/artikel/horn-aufbau\">Aufbau des Horns</a></p>","sou sric Fenlow · Darric Holt · Aufbau des Horns","search":"edda marr kochin und brauerin im horn von abaddon erwachsen wirkt mitte dreissig horn bewohner handwerk kochin und brauerin person kochin und brauerin halbelfe erwachsen wirkt mitte dreissig edda marr gehort zu den vier fachkraften die am 27 februar mit dem ersten zug ins horn von abaddon kamen vereinbart sind ein langerer aufenthalt ein goldstuck lohn pro tag sowie verpflegung und unterkunft erscheinung edda hat lange dunkle locken goldbraune haut und bernsteinfarbene augen fein zugespitzte ohren hohe wangenknochen und ein weicher voller mund geben ihr eine deutlich halbelfische schonheit ihre figur ist uppig grosse bruste eine weich geschwungene taille breite huften und volle oberschenkel ein weinrotes mieder rahmt ihre brust die dunne weisse bluse fallt locker von den schultern dazu tragt sie einen geschlitzten rock eine einfach gebundene schurze kleine goldene ohrringe und ein gelbes band zwischen den locken charakter edda ist aufmerksam kontaktfreudig und genussfreudig gutes essen gutes bier und ein angenehmer abend gehoren fur sie zusammen sie merkt sich vorlieben und bringt gesprache leicht in gang lebensmittelverschwendung und achtloses herumkommandieren konnen ihrer freundlichkeit jedoch einen spitzen rand geben neue zutaten wecken ihre neugier sie pruft sie sorgfaltig bevor sie in den topf kommen stimme melodisch und beweglich haufig von einem amusierten unterton begleitet arbeit im horn edda hat bereits das erste gemeinsame abendessen im horn und den ersten bierausschank versorgt mit vesper untersuchte sie die essbaren hohlenpilze sie taugen als wenig schmackhafte notreserve das verfugbare wasser ist trinkbar weitere fachkrafte branna cole osric fenlow darric holt aufbau des horns"},{"id":"darric-holt","category":"horn","kind":"Bewohner","title":"Darric Holt","summary":"Maurer und Steinhandwerker im Horn von Abaddon; 29 jahre.","body":"<h2>Person</h2><p><strong>Maurer und Steinhandwerker · Mensch · 29 Jahre</strong></p><p>Darric Holt gehört zu den vier Fachkräften, die am 27. Februar mit dem ersten Zug ins <a href=\"#/artikel/horn-abaddon\">Horn von Abaddon</a> kamen. Vereinbart sind ein längerer Aufenthalt, ein Goldstück Lohn pro Tag sowie Verpflegung und Unterkunft.</p><h2>Erscheinung</h2><p>Darric hat dunkelblondes, zerzaustes Haar, blaue Augen, einen markanten Kiefer und kurzen Bartschatten. Sein Körper ist athletisch, mit breiten Schultern, schmaler Taille und langen Beinen. Sonnengebräunte Haut und heller Steinstaub an Händen und Kleidung prägen seinen Eindruck. Auf seinem Porträt trägt er ein helles Leinenhemd mit offenem Kragen, eine dunkelblaue Wollweste und einen Ledergürtel mit Handwerkzeugen. Sein hübsches Gesicht und das leicht schelmische Lächeln stehen im Kontrast zu Osrics gelassener Reife.</p><h2>Charakter</h2><p>Darric ist anfangs etwas zurückhaltend, wird bei ungewöhnlichen Konstruktionen aber rasch lebhaft. Er möchte zeigen, dass ihm auch größere Arbeiten zuzutrauen sind. Aus Eifer sagt er gelegentlich zu schnell etwas zu und muss sich anschließend genauer festlegen. Kritik trifft ihn persönlicher als Osric; er bemüht sich, sie praktisch umzusetzen. Unter vertrauten Leuten zeigt sich sein freundlicher, leicht schelmischer Humor. Aufmerksamkeit gefällt ihm, auch wenn er sie gern herunterspielt.</p><h2>Stimme</h2><p>Klar und eher leise; bei Fachfragen merklich lebhafter.</p><h2>Arbeit im Horn</h2><p>Darric bringt Erfahrung in gewöhnlichen Stein- und Reparaturarbeiten sowie eigene Handwerkzeuge mit. Im Horn hat er erste Bereiche für die bauliche Untersuchung markiert. Die Untersuchung läuft; fertige Umbauten oder abgeschlossene Befunde sind noch nicht bestätigt.</p><h2>Weitere Fachkräfte</h2><p><a href=\"#/artikel/branna-cole\">Branna Cole</a> · <a href=\"#/artikel/osric-fenlow\">Osric Fenlow</a> · <a href=\"#/artikel/edda-marr\">Edda Marr</a> · <a href=\"#/artikel/horn-aufbau\">Aufbau des Horns</a></p>","sources":["horn-workforce"],"status":"B elations","status":"Bestätigt"},{"a":"mara","b":"ellyn","kind":"zusammenarbeit","label":"Bekannte Arbeiterinnen","detail":"Beide kennen den Alltag ziviler Arbeit in Balentyne aus eigener begrenzter Erfahrung.","source":"core","status":"Bestätigt"},{"a":"bellam","b":"alicia","kind":"ehe","label":"Ehe und Gasthaus","detail":"Bellam und seine Frau Alicia arbeiten im Lord's Dalliance.","source":"dalliance","status":"Bestätigt"},{"a":"styke","b":"bellam","kind":"alltag","label":"Wirt und geschätzter Bekannter","detail":"Styke warnte Bellam in der Angriffsnacht, versprach Schutz nach Möglichkeit und eine neue Herberge, falls das Dalliance verloren geht und er später dazu in der Lage ist.","source":"core","status":"Bestätigt"},{"a":"barnabus","b":"valeria","kind":"kontakt","label":"Trinkabend und Bericht","detail":"Valeria gewann Informationen über das Torhaus. Das begründet weder Barnabus' Loyalität noch weitere geheim bekannte Schwächen.","source":"core","status":"Bestätigt"},{"a":"barnabus","b":"styke","kind":"kontakt","label":"Handwerklicher Respekt","detail":"Barnabus lobte die Arbeit am Großschwert. Kleiner beruflicher Draht, kein Bündnis.","source":"core","status":"Bestätigt"},{"a":"kaitlyn","b":"franz","kind":"ehe","label":"Arrangierte Ehe","detail":"Aus Kaitlyns erzählter Perspektive lieblos und einengend. Franz ist öffentlich respektabler Offizier.","source":"core","status":"Bestätigt"},{"a":"kaitlyn","b":"zack","kind":"affaere","label":"Bestehende heimliche Affäre","detail":"Vesper las am 29. Januar die Briefe. Die Verbindung bestand schon vor Kaitlyns Begegnung mit Styke.","source":"core","status":"Bestätigt"},{"a":"kaitlyn","b":"styke","kind":"pakt","label":"Gebundene, Geliebte und anvertraute Geschichte","detail":"Am 15. Februar erzählte Styke Kaitlyn als erster Person vollständig vom Silken Veil. Kaitlyn will zu seinen guten Tagen gehören und begann eigene Aufzeichnungen.","source":"kaitlyn","status":"Bestätigt"},{"a":"franz","b":"zack","kind":"konflikt","la
