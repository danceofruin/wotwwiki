 und valeria sind die derzeit bestatigten mitglieder zwei platze bleiben frei verse zorn grumblejack timeon und tamsin gehoren nicht automatisch dazu reichweite und wissen aktuell 140 ft von styke ubermittelt wird bewusst gesprochene mentale kommunikation keine automatischen erinnerungen gefuhle sinneseindrucke gedanken oder offscreen berichte der aufbruch vespers meldet daher weder ihre position noch ihren erfolg an styke mechanische anwendungen commitment und weitere zelotfahigkeiten nutzen die gultige verbindung reichweite willige teilnahme und tatsachliche ressourcenausgaben bleiben zu prufen aid und recovery martyrdom und echoes of steel stehen als eigene karten zur verfugung"},{"id":"hausregeln","category":"regeln","title":"Hausregeln und Spielkonventionen","summary":"Die kampagnenspezifischen Abweichungen neben den drei aktuellen Bögen.","body":"<h2>Kontrolle der Figuren</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> bleibt vollständig spielergesteuert. <a href=\"#/artikel/vesper\">Vesper</a> handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. <a href=\"#/artikel/valeria\">Valeria</a> bleibt auch im Kampf ein autonomer GM-geführter DMPC.</p>\n<h2>Stufe und Fortschritt</h2>\n<p>Alle drei sind gegenwärtig Stufe 5. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter <a href=\"#/artikel/buildplanung\">OOC: Buildplanung</a>. Sie ist kein gegenwärtiges Ereignis.</p>\n<h2>Wissensfertigkeiten und Routine</h2>\n<p>Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt.</p>\n<p>Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an.</p>\n<h2>Spezifische Anpassungen</h2>\n<p>Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen drei Powers Known getrennt. Arcane Enlightenment liefert Vesper vier täglich wechselbare temporäre Oracle-Zauber.</p>\n<p>Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. <a href=\"#/artikel/animus\">Animus und Glyphen</a> erläutert die derzeit aktiven Werte.</p>\n<h2>Zahlen, die nicht stillschweigend repariert werden</h2>\n<p>Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Valerias rüstungsabhängige Ride-Berechnung und Stykes drittes Talent bleiben offen. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.</p>\n","sources":["house","localrules","ssheet","vsheet","valsheet"],"status":"Bestätigt","tags":["Hausregel","Spielkontrolle"],"aliases":[],"text":"Kontrolle der Figuren Styke bleibt vollständig spielergesteuert. Vesper handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. Valeria bleibt auch im Kampf ein autonomer GM-geführter DMPC. Stufe und Fortschritt Alle drei sind gegenwärtig Stufe 5. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter OOC: Buildplanung . Sie ist kein gegenwärtiges Ereignis. Wissensfertigkeiten und Routine Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt. Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an. Spezifische Anpassungen Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen drei Powers Known getrennt. Arcane Enlightenment liefert Vesper vier täglich wechselbare temporäre Oracle-Zauber. Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. Animus und Glyphen erläutert die derzeit aktiven Werte. Zahlen, die nicht stillschweigend repariert werden Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Valerias rüstungsabhängige Ride-Berechnung und Stykes drittes Talent bleiben offen. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.","links":["styke","vesper","valeria","buildplanung","animus"],"backlinks":[],"search":"hausregeln und spielkonventionen die kampagnenspezifischen abweichungen neben den drei aktuellen bogen hausregel spielkontrolle kontrolle der figuren styke bleibt vollstandig spielergesteuert vesper handelt ausserhalb strukturierter initiative autonom ihre entscheidungen und begrenzten ressourcen im kampf steuert der spieler valeria bleibt auch im kampf ein autonomer gm gefuhrter dmpc stufe und fortschritt alle drei sind gegenwartig stufe 5 die bereits besprochene zukunftige gruppen buildplanung steht getrennt unter ooc buildplanung sie ist kein gegenwartiges ereignis wissensfertigkeiten und routine knowledge all fasst die wissensgebiete auf den entsprechend gefuhrten bogen zusammen valerias geerbter fertigkeitsblock ist noch nicht vollstandig in diese form umgerechnet die belegten werte werden nicht heimlich neu verteilt legales take 10 hat bei unbedrangter routine vorrang keine wurfe nur damit uberhaupt gewurfelt wird stykes power attack ist standardmassig an spezifische anpassungen deadly agility funktioniert bei styke mit dem zweihandigen grossschwert und dem festgelegten dex multiplikator das kollektiv ist bewusste kommunikation stykes grad 0 talente sind von seinen drei powers known getrennt arcane enlightenment liefert vesper vier taglich wechselbare temporare oracle zauber vespers radiant dawn training entwickelt sich nach dem bezahlten einstieg automatisch entlang der martial training linie ihr zusatzliches animus glyph paket ist begrenzt und keine zweite volle initiatorprogression animus und glyphen erlautert die derzeit aktiven werte zahlen die nicht stillschweigend repariert werden die hp der aktuellen bogen gelten obwohl altere aussagen zur globalen hp formel nicht luckenlos dazu passen valerias rustungsabhangige ride berechnung und stykes drittes talent bleiben offen keine fremde regelversion ersetzt hier ohne beschluss einen kampagnenwert"},{"id":"buildplanung","category":"regeln","title":"OOC: bereits besprochene Buildplanung","summary":"Ausdrücklich keine aktive Klassenänderung und kein vorweggenommenes Story-Ereignis.","body":"<h2>Status dieses Eintrags</h2>\n<p>Diese Planung stand bereits auf den vorherigen Spielerbögen. Sie wird hier getrennt geführt, damit gegenwärtige Charakterwerte nicht mit zukünftigen Möglichkeiten verwechselt werden. Sie ist <strong>OOC-Metawissen</strong>, kein Beweis über künftige Entscheidungen der Figuren.</p>\n<h2>Der nächste Gruppenmeilenstein</h2>\n<p>Der nächste nominelle Aufstieg auf Stufe 6 wird einmalig durch einen Gruppenmeilenstein ersetzt: <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> bleiben Stufe 5, <a href=\"#/artikel/valeria\">Valeria</a> wird ein vollwertiges dauerhaftes Kern-DMPC-Mitglied und bleibt ebenfalls Stufe 5. Danach gilt wieder die weitere vereinbarte Meilensteinprogression.</p>\n<h2>Valeria</h2>\n<p>Die besprochene Richtung ist ein stufenneutraler Rebuild zu <strong>Antipaladin 5, Lord of Darkness, Asmodeus</strong>. Er ist nicht aktiv. Ein echter angenommener Story-Trigger und Valerias bindende Entscheidung sind Voraussetzung; weder Gefangenschaft noch Intimität oder bloße Terminplanung ersetzen diesen Moment. Bis dahin gelten ausschließlich Fighter-5-Werte. Ein vollständiger neuer Antipaladin-Statblock wird hier nicht vorweggenommen.</p>\n<h2>Styke</h2>\n<p>Awakened Blade ist das Buildziel ab einem tatsächlichen späteren Aufstieg auf Charakterstufe 6. Acrobatics 5 und Autohypnosis 4 sind im aktuellen Bogen dafür gesetzt. Das Ziel verleiht noch keine Prestige-Klassenfähigkeiten.</p>\n","sources":["house","localrules","ssheet","valeria"],"status":"OOC / inaktiv","tags":["Buildplanung"],"aliases":[],"text":"Status dieses Eintrags Diese Planung stand bereits auf den vorherigen Spielerbögen. Sie wird hier getrennt geführt, damit gegenwärtige Charakterwerte nicht mit zukünftigen Möglichkeiten verwechselt werden. Sie ist OOC-Metawissen , kein Beweis über künftige Entscheidungen der Figuren. Der nächste Gruppenmeilenstein Der nächste nominelle Aufstieg auf Stufe 6 wird einmalig durch einen Gruppenmeilenstein ersetzt: Styke und Vesper bleiben Stufe 5, Valeria wird ein vollwertiges dauerhaftes Kern-DMPC-Mitglied und bleibt ebenfalls Stufe 5. Danach gilt wieder die weitere vereinbarte Meilensteinprogression. Valeria Die besprochene Richtung ist ein stufenneutraler Rebuild zu Antipaladin 5, Lord of Darkness, Asmodeus . Er ist nicht aktiv. Ein echter angenommener Story-Trigger und Valerias bindende Entscheidung sind Voraussetzung; weder Gefangenschaft noch Intimität oder bloße Terminplanung ersetzen diesen Moment. Bis dahin gelten ausschließlich Fighter-5-Werte. Ein vollständiger neuer Antipaladin-Statblock wird hier nicht vorweggenommen. Styke Awakened Blade ist das Buildziel ab einem tatsächlichen späteren Aufstieg auf Charakterstufe 6. Acrobatics 5 und Autohypnosis 4 sind im aktuellen Bogen dafür gesetzt. Das Ziel verleiht noch keine Prestige-Klassenfähigkeiten.","links":["styke","vesper","valeria"],"backlinks":["hausregeln","bogen-styke","bogen-valeria"],"search":"ooc bereits besprochene buildplanung ausdrucklich keine aktive klassenanderung und kein vorweggenommenes story ereignis buildplanung status dieses eintrags diese planung stand bereits auf den vorherigen spielerbogen sie wird hier getrennt gefuhrt damit gegenwartige charakterwerte nicht mit zukunftigen moglichkeiten verwechselt werden sie ist ooc metawissen kein beweis uber kunftige entscheidungen der figuren der nachste gruppenmeilenstein der nachste nominelle aufstieg auf stufe 6 wird einmalig durch einen gruppenmeilenstein ersetzt styke und vesper bleiben stufe 5 valeria wird ein vollwertiges dauerhaftes kern dmpc mitglied und bleibt ebenfalls stufe 5 danach gilt wieder die weitere vereinbarte meilensteinprogression valeria die besprochene richtung ist ein stufenneutraler rebuild zu antipaladin 5 lord of darkness asmodeus er ist nicht aktiv ein echter angenommener story trigger und valerias bindende entscheidung sind voraussetzung weder gefangenschaft noch intimitat oder blosse terminplanung ersetzen diesen moment bis dahin gelten ausschliesslich fighter 5 werte ein vollstandiger neuer antipaladin statblock wird hier nicht vorweggenommen styke awakened blade ist das buildziel ab einem tatsachlichen spateren aufstieg auf charakterstufe 6 acrobatics 5 und autohypnosis 4 sind im aktuellen bogen dafur gesetzt das ziel verleiht noch keine prestige klassenfahigkeiten"},{"id":"arcane-enlightenment","category":"regeln","title":"Arcane Enlightenment","summary":"Vier täglich wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known.","body":"<p><a href=\"#/artikel/vesper\">Vesper</a> kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar.</p>\n<h2>Standardauswahl</h2>\n<p><a href=\"#/artikel/dancing-darkness\">Dancing Darkness</a>, <a href=\"#/artikel/silent-image\">Silent Image</a>, <a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud</a> und <a href=\"#/artikel/ashen-path\">Ashen Path</a>. Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.</p>\n","sources":["vsheet","house","localrules"],"status":"Bestätigt","tags":["Vesper","Zauber"],"aliases":[],"text":"Vesper kann beim täglichen Auffrischen mit Lore Spirit vier passende Sorcerer/Wizard-Zauber wählen. In der Kampagnenfassung gelten sie für diesen Tag als temporäre Oracle Spells Known und werden spontan über ihre normalen Oracle-Slots und CHA gewirkt. Gegenwärtig sind nur Zaubergrade bis 2 wirkbar. Standardauswahl Dancing Darkness , Silent Image , Euphoric Cloud und Ashen Path . Die Auswahl ist keine weitere unabhängige Slotreserve. Ein Tageswechsel der Auswahl und tatsächlich verbleibende Slots werden nicht von dieser Website adjudiziert.","links":["vesper","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"backlinks":["detect-magic","create-water","purify-food-drink","read-magic","guidance","enhanced-diplomacy","obscuring-mist","protection-from-evil","air-bubble","remove-sickness","cure-light-wounds","unnatural-lust","identify","delay-poison","lesser-restoration","cure-moderate-wounds","tongues","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"search":"arcane enlightenment vier taglich wahlbare sorcerer wizard zauber als temporare oracle spells known vesper zauber vesper kann beim taglichen auffrischen mit lore spirit vier passende sorcerer wizard zauber wahlen in der kampagnenfassung gelten sie fur diesen tag als temporare oracle spells known und werden spontan uber ihre normalen oracle slots und cha gewirkt gegenwartig sind nur zaubergrade bis 2 wirkbar standardauswahl dancing darkness silent image euphoric cloud und ashen path die auswahl ist keine weitere unabhangige slotreserve ein tageswechsel der auswahl und tatsachlich verbleibende slots werden nicht von dieser website adjudiziert"},{"id":"animus","category":"regeln","title":"Animus, Essence und Martial Glyphs","summary":"Vespers aktuelles Zusatzpaket: virtueller Rang 1, IL 6, CHA +4.","body":"<h2>Animus</h2>\n<p>Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält <a href=\"#/artikel/vesper\">Vesper</a> <strong>5 Animus</strong>, zu Beginn jedes weiteren eigenen Zuges <strong>+1</strong>. Am Rundenende gibt es <strong>+1</strong>, falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende.</p>\n<h2>Glyphen anwenden</h2>\n<p>Kosten <strong>1 Animus</strong>. Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite <strong>40 ft</strong>, Dauer <strong>5 Runden</strong>, DC <strong>17</strong>. Erneute Anwendung stapelt und verlängert denselben Glyphen nicht.</p>\n<h2>Bekannte Glyphen</h2>\n<p><a href=\"#/artikel/elemental-shield\">Elemental Shield</a>, <a href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade</a>, <a href=\"#/artikel/ghost-armor\">Ghost Armor</a>, <a href=\"#/artikel/deflective-armor\">Deflective Armor</a> und <a href=\"#/artikel/shadowmeld\">Shadowmeld</a>.</p>\n<h2>Essence ist etwas anderes</h2>\n<p>Vesper besitzt <strong>2 Essence</strong>, Kapazität <strong>1</strong> pro Receptacle. Standardmäßig liegt 1 in <a href=\"#/artikel/spoils-of-war\">Spoils of War</a>, der zweite Punkt ist für <a href=\"#/artikel/witness-to-glory\">Witness to Glory</a> vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.</p>\n","sources":["vsheet","vrules","localrules"],"status":"Bestätigt","tags":["Vesper","Glyph","Essence"],"aliases":[],"text":"Animus Außerhalb eines Kampfes kein ausgebbarer Pool. Zu Beginn ihres ersten eigenen Zuges erhält Vesper 5 Animus , zu Beginn jedes weiteren eigenen Zuges +1 . Am Rundenende gibt es +1 , falls sie in dieser Runde mindestens ein Manöver initiiert hat. Der Pool besteht bis eine Minute nach Begegnungsende. Glyphen anwenden Kosten 1 Animus . Anwendung als Swift Action oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 40 ft , Dauer 5 Runden , DC 17 . Erneute Anwendung stapelt und verlängert denselben Glyphen nicht. Bekannte Glyphen Elemental Shield , Ghost Eating Blade , Ghost Armor , Deflective Armor und Shadowmeld . Essence ist etwas anderes Vesper besitzt 2 Essence , Kapazität 1 pro Receptacle. Standardmäßig liegt 1 in Spoils of War , der zweite Punkt ist für Witness to Glory vorgesehen. In einem verbrauchten Manöver bleibt Essence bis zu dessen Recovery gebunden. Umlagern kostet grundsätzlich eine Swift Action. Ein vorgesehener Einsatz ist keine automatische Erlaubnis, eine Spielerressource auszugeben.","links":["vesper","elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld","spoils-of-war","witness-to-glory"],"backlinks":["hausregeln","elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld"],"search":"animus essence und martial glyphs vespers aktuelles zusatzpaket virtueller rang 1 il 6 cha 4 vesper glyph essence animus ausserhalb eines kampfes kein ausgebbarer pool zu beginn ihres ersten eigenen zuges erhalt vesper 5 animus zu beginn jedes weiteren eigenen zuges 1 am rundenende gibt es 1 falls sie in dieser runde mindestens ein manover initiiert hat der pool besteht bis eine minute nach begegnungsende glyphen anwenden kosten 1 animus anwendung als swift action oder hochstens einmal pro runde als free action nach einem treffer mit einem martial strike ein gewohnlicher treffer genugt nicht reichweite 40 ft dauer 5 runden dc 17 erneute anwendung stapelt und verlangert denselben glyphen nicht bekannte glyphen elemental shield ghost eating blade ghost armor deflective armor und shadowmeld essence ist etwas anderes vesper besitzt 2 essence kapazitat 1 pro receptacle standardmassig liegt 1 in spoils of war der zweite punkt ist fur witness to glory vorgesehen in einem verbrauchten manover bleibt essence bis zu dessen recovery gebunden umlagern kostet grundsatzlich eine swift action ein vorgesehener einsatz ist keine automatische erlaubnis eine spielerressource auszugeben"},{"id":"aid","category":"faehigkeiten","title":"Aid / Compartmentalized Aid","summary":"Move Action, gegnerspezifischer Angriffsbonus und Recovery bis zu drei Manöver.","body":"<p><a href=\"#/artikel/styke\">Styke</a> nutzt seine <strong>Move Action</strong> zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners <strong>+4 auf seine Angriffe gegen dieses Ziel</strong> bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel.</p>\n<p>Die Anwendung stellt sofort bis zu <strong>3 geeignete verbrauchte vorbereitete Manöver</strong> wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.</p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Styke nutzt seine Move Action zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners +4 auf seine Angriffe gegen dieses Ziel bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel. Die Anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete Manöver wieder her, selbst wenn der Aid-Versuch miss :["vsheet","vrules"],"status":"Bestätigt","tags":["Vesper","Zauber"],"aliases":[],"owner":"Vesper","kind":"Zauber","level":2,"ready":null,"text":"Kampagnenreferenz Berührung, 10 Minuten pro Level. Das Ziel kann magische Sichtbehinderung durch Asche, Rauch, Nebel und ähnliche Verdeckung bis 60 ft durchsehen. Keine zusätzliche Dunkelsicht. Ein Wirken darf auf mehrere berührte Kreaturen aufgeteilt werden, wobei die Dauer gleich verteilt wird, mindestens 10 Minuten je Ziel . Ressourcen Zaubergrad 2 . Vespers Tageskapazität: 7 Slots Grad 1 , 5 Slots Grad 2 . Diese Anzeige ist keine automatische Aussage über heute verbleibende Slots. Vespers vollständiger Bogen / Tägliche arkane Auswahl","links":["bogen-vesper","arcane-enlightenment"],"backlinks":["zeit-0126","arcane-enlightenment","bogen-vesper"],"search":"ashen path durch magische asche rauch und nebel bis 60 ft sehen vesper zauber kampagnenreferenz beruhrung 10 minuten pro level das ziel kann magische sichtbehinderung durch asche rauch nebel und ahnliche verdeckung bis 60 ft durchsehen keine zusatzliche dunkelsicht ein wirken darf auf mehrere beruhrte kreaturen aufgeteilt werden wobei die dauer gleich verteilt wird mindestens 10 minuten je ziel ressourcen zaubergrad 2 vespers tageskapazitat 7 slots grad 1 5 slots grad 2 diese anzeige ist keine automatische aussage uber heute verbleibende slots vespers vollstandiger bogen tagliche arkane auswahl"},{"id":"bogen-styke","category":"boegen","title":"Styke / Charakterbogen Stufe 5","summary":"Attribute, Kampfwerte, Fertigkeiten, Talente, Klassenfähigkeiten, Ausrüstung und alle verfügbaren Zauber- und Manöverlisten.","body":"<h2>Leseschlüssel</h2>\n<p>Dies ist der vollständige verfügbare Stufe-5-Bogen von <a href=\"#/artikel/styke\">Styke</a>, kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der <a href=\"#/artikel/spielstand\">aktuelle Spielstand</a> hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen.</p>\n<p>Die <a href=\"#/artikel/redaktion\">Quellenhinweise</a> benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das <a href=\"#/artikel/faehigkeiten-register\">Fähigkeitenregister</a> ergänzt alle belegten Regelkarten.</p>\n<h1>Styke - Charakterbogen Stufe 5</h1>\n<p><strong>Klasse:</strong> Zelot 4 / Psion (Egoist) 1<br/>\n<strong>Volk:</strong> Aasimar (Angel-Blooded)<br/>\n<strong>Gesinnung:</strong> Rechtschaffen Böse<br/>\n<strong>Level:</strong> 5<br/>\n<strong>Geschlecht:</strong> Männlich<br/>\n<strong>Alter:</strong> 60</p>\n<hr/>\n<h2>Attribute</h2>\n<table>\n<thead>\n<tr>\n<th>Attribut</th>\n<th style=\"text-align:right\">Wert</th>\n<th style=\"text-align:right\">Mod</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>STR</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n<td></td>\n</tr>\n<tr>\n<td>DEX</td>\n<td style=\"text-align:right\">19</td>\n<td style=\"text-align:right\">+4</td>\n<td>Primäres Kampf-Attribut</td>\n</tr>\n<tr>\n<td>CON</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n<td></td>\n</tr>\n<tr>\n<td>INT</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n<td>Psionisches Attribut für Psion-Kräfte</td>\n</tr>\n<tr>\n<td>WIS</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n<td></td>\n</tr>\n<tr>\n<td>CHA</td>\n<td style=\"text-align:right\">17</td>\n<td style=\"text-align:right\">+3</td>\n<td>Zelot-Initiationsattribut</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Kampfwerte</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HP</strong></td>\n<td style=\"text-align:right\"><strong>34 / 34</strong></td>\n<td>27 auf Stufe 4 +3 Psion-HD +4 durch Psionic Body</td>\n</tr>\n<tr>\n<td><strong>AC</strong></td>\n<td style=\"text-align:right\"><strong>14 / 19</strong></td>\n<td>Ohne Rüstung / Mithralkettenhemd + <a href=\"#/artikel/the-caged-sun\">The Caged Sun</a></td>\n</tr>\n<tr>\n<td><strong>Touch AC</strong></td>\n<td style=\"text-align:right\"><strong>14 / 15</strong></td>\n<td>Ohne / mit The Caged Sun</td>\n</tr>\n<tr>\n<td><strong>Flat-Footed</strong></td>\n<td style=\"text-align:right\"><strong>10 / 15</strong></td>\n<td>Ohne Rüstung / Mithralkettenhemd + The Caged Sun</td>\n</tr>\n<tr>\n<td><strong>Initiative</strong></td>\n<td style=\"text-align:right\"><strong>+6</strong></td>\n<td>+4 DEX, +2 Gemeinsamer Impuls</td>\n</tr>\n<tr>\n<td><strong>Speed</strong></td>\n<td style=\"text-align:right\"><strong>30 ft</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>BAB</strong></td>\n<td style=\"text-align:right\"><strong>+4</strong></td>\n<td>Zelot 4 + Psion 1</td>\n</tr>\n<tr>\n<td><strong>CMB</strong></td>\n<td style=\"text-align:right\"><strong>+6 / +7</strong></td>\n<td>ohne / mit The Caged Sun</td>\n</tr>\n<tr>\n<td><strong>CMD</strong></td>\n<td style=\"text-align:right\"><strong>20 / 21</strong></td>\n<td>ohne / mit The Caged Sun</td>\n</tr>\n</tbody>\n</table>\n<h3>Rettungswürfe</h3>\n<table>\n<thead>\n<tr>\n<th>Save</th>\n<th style=\"text-align:right\">Total mit The Caged Sun</th>\n<th style=\"text-align:right\">Ohne The Caged Sun</th>\n<th style=\"text-align:right\">Basis</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fortitude</strong></td>\n<td style=\"text-align:right\"><strong>+6</strong></td>\n<td style=\"text-align:right\">+5</td>\n<td style=\"text-align:right\">+4</td>\n</tr>\n<tr>\n<td><strong>Reflex</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td style=\"text-align:right\">+6</td>\n<td style=\"text-align:right\">+1</td>\n</tr>\n<tr>\n<td><strong>Will</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td style=\"text-align:right\">+7</td>\n<td style=\"text-align:right\">+6</td>\n</tr>\n</tbody>\n</table>\n<p><em>Cloak of Resistance +1 ist eingerechnet. Immortal Spark gibt zusätzlich +2 gegen Todeseffekte. Carnal Frailty gibt -2 gegen sexuelle Ablenkung, Verführung und vergleichbare Effekte.</em></p>\n<hr/>\n<h2>Angriffe</h2>\n<table>\n<thead>\n<tr>\n<th>Angriff</th>\n<th style=\"text-align:right\">Treffer</th>\n<th style=\"text-align:right\">Schaden</th>\n<th style=\"text-align:right\">Kritisch</th>\n<th style=\"text-align:right\">Reichweite</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>+1 Großschwert</strong></td>\n<td style=\"text-align:right\"><strong>+10</strong></td>\n<td style=\"text-align:right\"><strong>2d6+7</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n<tr>\n<td><strong>+1 Großschwert, Power Attack</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td style=\"text-align:right\"><strong>2d6+13</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/suns-gleam\">Sun's Gleam</a></strong></td>\n<td style=\"text-align:right\"><strong>+9 Ranged Touch</strong></td>\n<td style=\"text-align:right\"><strong>1d6+3 Force</strong></td>\n<td style=\"text-align:right\">-</td>\n<td style=\"text-align:right\">30 ft</td>\n</tr>\n<tr>\n<td><strong>Waffenlos</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td style=\"text-align:right\">1d3+2 nonlethal</td>\n<td style=\"text-align:right\">x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n</tbody>\n</table>\n<p><em>Angriffswerte enthalten The Caged Sun. Ohne die Haltung jeweils -1. Das +1-Großschwert liefert +1 Angriff und +1 Schaden. Bei BAB +4 gibt Power Attack -2 Angriff und mit einer zweihändig geführten Waffe +6 Schaden. Deadly Agility funktioniert per Hausregel mit dem Großschwert und verwendet den zweihändigen Schadensmultiplikator, hier +6 DEX-Schaden.</em></p>\n<hr/>\n<h2>Fertigkeiten</h2>\n<p><strong>Neue Ränge durch Psion 1:</strong> 4.<br/>\n<strong>Gesamtränge:</strong> 28.<br/>\nFür den Awakened-Blade-Einstieg wurde ein zuvor gesetzter Stealth-Rang nach Autohypnosis verschoben; die vier neuen Ränge gehen in Acrobatics +2 und Autohypnosis +2.</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th style=\"text-align:right\">Ranks</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Acrobatics</strong></td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>Voraussetzung Awakened Blade erfüllt</td>\n</tr>\n<tr>\n<td><strong>Autohypnosis</strong></td>\n<td style=\"text-align:right\"><strong>4</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td>Klassenfertigkeit; Voraussetzung erfüllt</td>\n</tr>\n<tr>\n<td><strong>Craft (Weapons)</strong></td>\n<td style=\"text-align:right\">4</td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Diplomacy</strong></td>\n<td style=\"text-align:right\">1</td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td>Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Intimidate</strong></td>\n<td style=\"text-align:right\">3</td>\n<td style=\"text-align:right\"><strong>+11</strong></td>\n<td>inkl. Trait</td>\n</tr>\n<tr>\n<td><strong>Knowledge (All)</strong></td>\n<td style=\"text-align:right\">4</td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>Duett-Hausregel; deckt Knowledge (martial/psionics)</td>\n</tr>\n<tr>\n<td><strong>Perception</strong></td>\n<td style=\"text-align:right\">4</td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>Stealth</strong></td>\n<td style=\"text-align:right\"><strong>3</strong></td>\n<td style=\"text-align:right\"><strong>+10</strong></td>\n<td>Mithralkettenhemd ACP 0</td>\n</tr>\n</tbody>\n</table>\n<p><em>Informant-Psicrystal unterstützt passende Knowledge-(All)-Checks pauschal mit +2.</em></p>\n<hr/>\n<h2>Talente</h2>\n<h3>Reguläre und zusätzliche Talente</h3>\n<ul>\n<li><strong>Extra Conviction</strong>: Personality Fragment.</li>\n<li><strong>Power Attack</strong>.</li>\n<li><strong>Deadly Agility</strong>: Hausregel erlaubt Großschwert.</li>\n<li><strong>Advanced Study</strong>: lernt <strong><a href=\"#/artikel/chains-of-doubt\">Chains of Doubt</a></strong> und <strong><a href=\"#/artikel/reflective-blade-style\">Reflective Blade Style</a></strong>.</li>\n<li><strong>Extra Readied Maneuver</strong>: durch Retraining des alten Stufe-1-Talents <strong>Unlocked Talent</strong>; +1 vorbereitetes Manöver.</li>\n</ul>\n<h3>Bonus- und gewonnene Talente</h3>\n<ul>\n<li><strong>Psionic Body</strong>: Psion-1-Bonusfeat. Aktuell zwei psionische Talente, daher insgesamt <strong>+4 HP</strong>.</li>\n<li><strong>Combat Reflexes</strong>: über Combat Conviction.</li>\n<li><strong>Psionic Meditation</strong>: über Psionic Conviction.</li>\n<li><strong>Harrying Partners</strong>: Teamwork-Talent über Targeting Array, von Styke und Psicrystal geteilt.</li>\n</ul>\n<hr/>\n<h2>Zelot 4</h2>\n<ul>\n<li><strong><a href=\"#/artikel/zeal\">Zeal +1</a>:</strong> Ein getroffener Strike gibt den Collective-Mitgliedern 1 Runde +1 Moralbonus auf Angriffe.</li>\n<li><strong>Collective:</strong> bis zu 4 willige Kreaturen, 140 ft; Styke zählt nicht gegen das Limit.</li>\n<li><strong>Telepathy:</strong> Kommunikation innerhalb des Collective.</li>\n<li><strong><a href=\"#/artikel/aid\">Compartmentalized Aid</a>:</strong> Aid Another auf sich selbst als Move Action; aktiviert Zeal und stellt bis zu 3 geeignete verbrauchte Manöver wieder her.</li>\n<li><strong>Commitment:</strong> Aid Another auf Collective-Mitglieder innerhalb der Collective-Reichweite.</li>\n<li><strong>Burning Contemplation:</strong> CHA statt WIS für Voraussetzungen psionischer Talente.</li>\n<li><strong><a href=\"#/artikel/martyrdom\">Martyrdom</a>:</strong> bis zu 20 Schaden von einem willigen Collective-Mitglied übernehmen; bis zu 4 PP zur Reduktion um 3 Schaden pro PP, mindestens 1 Schaden bleibt.</li>\n<li><strong><a href=\"#/artikel/echoes\">Echoes of Steel</a>:</strong> bei einem Manöver mindestens 1 Grad unter dem höchsten verfügbaren Grad kann Styke PP in Höhe des Manövergrades ausgeben und einem Collective-Mitglied eine Nutzung innerhalb 1 Minute verleihen. Bei IL 5 und Grad-3-Zugang sind damit Manöver bis Grad 2 übertragbar. Nur ein Echo gleichzeitig.</li>\n<li><strong>Mission, Protection:</strong> <a href=\"#/artikel/living-bastion\">Living Bastion</a>.</li>\n<li><strong>Living Bastion:</strong> solange psionisch fokussiert +5 ft Reach. Fokus kann aufgegeben werden, um Schaden eines Verbündeten innerhalb Reach nach DR/Resistance zu halbieren; pro Kreatur einmal pro Runde.</li>\n</ul>\n<hr/>\n<h2>Psion 1, Egoist</h2>\n<p><strong>Manifester Level:</strong> 1<br/>\n<strong>Maximaler Power-Grad:</strong> 1<br/>\n<strong>Powers Known:</strong> 3</p>\n<h3>Power Points</h3>\n<p><strong>11 PP / Tag gesamt</strong></p>\n<ul>\n<li>8 PP aus dem bisherigen Zelot-Pool nach Wegfall von Unlocked Talent.</li>\n<li>+2 Basis-PP aus Psion 1.</li>\n<li>+1 Bonus-PP aus INT 14 für Psion 1.</li>\n</ul>\n<h3>Psionische Talente (Grad 0, aktueller Git-Stand)</h3>\n<ul>\n<li><strong><a href=\"#/artikel/empathy\">Empathy</a>:</strong> akzeptiertes Talent; bei aktiver Manifestation und Konzentration aktuelle Oberflächenemotionen, keine Gedanken, Motive, Erinnerungen oder Fakten.</li>\n<li><strong><a href=\"#/artikel/conceal-thoughts\">Conceal Thoughts</a>:</strong> akzeptiertes Talent; 1 Stunde bei ML 1, +10 Circumstance auf Bluff gegen Sense Motive zur Erkennung wahrer Absichten. Sichere Nichtkampf-Routineerneuerung ist vereinbart.</li>\n<li><strong>Drittes Talent: offen.</strong></li>\n</ul>\n<p>Diese Talente zählen nicht gegen die drei Powers Known. Der ältere Anhang führte zusätzlich Detect Psionics und Far Hand. Der aktuell abgerufene Git-Bogen und die Hausregeln bestätigen diese zusätzlichen Einträge nicht; sie werden nicht stillschweigend als aktive Kräfte übernommen.</p>\n<h3>Powers Known</h3>\n<ul>\n<li><strong><a href=\"#/artikel/minor-metamorphosis\">Minor Metamorphosis</a></strong></li>\n<li><strong><a href=\"#/artikel/defensive-precognition\">Defensive Precognition</a></strong></li>\n<li><strong><a href=\"#/artikel/offensive-precognition\">Offensive Precognition</a></strong></li>\n</ul>\n<hr/>\n<h2>Path of War</h2>\n<p><strong>Initiator Level:</strong> <strong>5</strong> nach der festgelegten Duett-/Build-Progression<br/>\n<strong>Initiating Attribute:</strong> CHA +3<br/>\n<strong>Manöver bekannt:</strong> <strong>9</strong><br/>\n<strong>Manöver vorbereitet:</strong> <strong>5</strong><br/>\n<strong>Haltungen bekannt:</strong> 2</p>\n<h3>Standardvorbereitung</h3>\n<ol>\n<li><strong><a href=\"#/artikel/rapid-strike\">Rapid Strike</a></strong></li>\n<li><strong><a href=\"#/artikel/minute-hand\">Minute Hand</a></strong></li>\n<li><strong><a href=\"#/artikel/obsidian-sidestep\">Obsidian Sidestep</a></strong></li>\n<li><strong>Reflective Blade Style</strong></li>\n<li><strong>Chains of Doubt</strong></li>\n</ol>\n<h3>Bekannte Manöver</h3>\n<table>\n<thead>\n<tr>\n<th>Manöver</th>\n<th style=\"text-align:right\">Standard vorbereitet?</th>\n<th>Typ / Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Rapid Strike</strong></td>\n<td style=\"text-align:right\">Ja</td>\n<td>Strike; zwei Nahkampfangriffe gegen dasselbe Ziel</td>\n</tr>\n<tr>\n<td><strong>Minute Hand</strong></td>\n<td style=\"text-align:right\">Ja</td>\n<td>Boost; zusätzlicher Nahkampfangriff mit -2</td>\n</tr>\n<tr>\n<td><strong>Obsidian Sidestep</strong></td>\n<td style=\"text-align:right\">Ja</td>\n<td>Counter; ersetzt einen Save durch Craft (Weapons)</td>\n</tr>\n<tr>\n<td><strong>Reflective Blade Style</strong></td>\n<td style=\"text-align:right\">Ja</td>\n<td>Grad-3-Manöver aus Advanced Study</td>\n</tr>\n<tr>\n<td><strong>Chains of Doubt</strong></td>\n<td style=\"text-align:right\">Ja</td>\n<td>Grad-3-Manöver aus Advanced Study</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/strength-of-hell\">Strength of Hell</a></strong></td>\n<td style=\"text-align:right\">Nein</td>\n<td>Boost; 1 Runde +2 Angriff, +1d6 Schaden auf alle Angriffe, -2 AC</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/ravaging-blow\">Ravaging Blow</a></strong></td>\n<td style=\"text-align:right\">Nein</td>\n<td>Strike; +1d6 profane damage, Ziel shaken</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/staunching-strike\">Staunching Strike</a></strong></td>\n<td style=\"text-align:right\">Nein</td>\n<td>Radiant-Dawn-Strike; Heiloption</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/flash-of-insight\">Flash of Insight</a></strong></td>\n<td style=\"text-align:right\">Nein</td>\n<td>Sleeping-Goddess-Boost; erlaubt Verbündeten erneuten Save gegen laufenden Effekt</td>\n</tr>\n</tbody>\n</table>\n<h3>Haltungen</h3>\n<ul>\n<li><strong>The Caged Sun:</strong> 1 investierte Essence; +1 Angriff, AC, Saves, CMB und CMD. Erhaltene Heilung wird zuerst um +2 erhöht und danach mit x1,5 multipliziert.</li>\n<li><strong><a href=\"#/artikel/black-seraph-glare\">Black Seraph's Glare</a>:</strong> Gegner in 30 ft, die Styke sehen können, gelten entsprechend der Haltung als shaken.</li>\n</ul>\n<hr/>\n<h2>Standard-Kampfmotor</h2>\n<ul>\n<li><strong>Power Attack:</strong> standardmäßig an.</li>\n<li><strong>Ich mache AID:</strong> Move Action Compartmentalized Aid auf Styke selbst. Durch Helpful <strong>+4 Angriff</strong> gegen das gewählte Ziel bis zum Beginn von Stykes nächstem Zug; stellt bis zu 3 geeignete verbrauchte Manöver wieder her und aktiviert Zeal.</li>\n<li><strong><a href=\"#/artikel/zorn\">Zorn</a> / Psicrystal:</strong> verwendet seine eigene Standard Action für Aid Another Defense gegen Stykes aktuellen Gegner; INT -1 gegen DC 10; bei Erfolg +2 AC gegen diesen Gegner über Harrying Partners.</li>\n<li><strong>Living Bastion:</strong> solange Fokus gehalten wird +5 ft Reach.</li>\n<li><strong>Combat Reflexes:</strong> bis zu 4 zusätzliche AoOs pro Runde.</li>\n</ul>\n<hr/>\n<h2>Personality Fragment: Psicrystal</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Stufe 5</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Typ</td>\n<td style=\"text-align:right\">Diminutive Construct</td>\n</tr>\n<tr>\n<td>Psionische Klassenstufe des Meisters</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n</tr>\n<tr>\n<td>BAB</td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n</tr>\n<tr>\n<td>HP</td>\n<td style=\"text-align:right\"><strong>17</strong></td>\n</tr>\n<tr>\n<td>STR / DEX / INT</td>\n<td style=\"text-align:right\">1 / 15 / 9</td>\n</tr>\n<tr>\n<td>AC</td>\n<td style=\"text-align:right\">16</td>\n</tr>\n<tr>\n<td>Touch / Flat-Footed</td>\n<td style=\"text-align:right\">16 / 14</td>\n</tr>\n<tr>\n<td>Saves</td>\n<td style=\"text-align:right\"><strong>Fort +4 / Ref +5 / Will +6</strong></td>\n</tr>\n<tr>\n<td>Tactical Assistance</td>\n<td style=\"text-align:right\">INT -1 gegen DC 10</td>\n</tr>\n<tr>\n<td>Aid-Bonus</td>\n<td style=\"text-align:right\">+2</td>\n</tr>\n<tr>\n<td>Knowledge-Unterstützung</td>\n<td style=\"text-align:right\">+2 pauschal</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Ausrüstung</h2>\n<ul>\n<li><strong>+1 Großschwert</strong>.</li>\n<li><strong>Maßgefertigtes Mithralkettenhemd</strong>: Armor +4, Max DEX +6, ACP 0.</li>\n<li><strong>Thorns eiserner Stirnreif</strong>: getragen; verschleiert das martialische Erscheinungsbild der Rüstung.</li>\n<li><strong>Cloak of Resistance +1</strong>: getragen und in den Saves eingerechnet.</li>\n<li><strong>Silber-Saphir-Symbol der Ritter des Alerion</strong>: gesichert.</li>\n<li><strong>Nessian-Kontaktsiegel</strong>: gemeinsamer Missionsbesitz.</li>\n</ul>\n<hr/>\n<h2>Build-Ziel</h2>\n<p>Siehe <a href=\"#/artikel/buildplanung\">getrennte OOC-Buildplanung</a>. Keine zukünftigen Klassenfähigkeiten sind aktiv.</p>\n","sources":["ssheet","srules","house","live"],"status":"Bestätigt","tags":["Styke","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Styke","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Styke , kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der aktuelle Spielstand hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen. Die Quellenhinweise benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das Fähigkeitenregister ergänzt alle belegten Regelkarten. Styke - Charakterbogen Stufe 5 Klasse: Zelot 4 / Psion (Egoist) 1 Volk: Aasimar (Angel-Blooded) Gesinnung: Rechtschaffen Böse Level: 5 Geschlecht: Männlich Alter: 60 Attribute Attribut Wert Mod Notiz STR 14 +2 DEX 19 +4 Primäres Kampf-Attribut CON 10 +0 INT 14 +2 Psionisches Attribut für Psion-Kräfte WIS 10 +0 CHA 17 +3 Zelot-Initiationsattribut Kampfwerte Wert Total Notiz HP 34 / 34 27 auf Stufe 4 +3 Psion-HD +4 durch Psionic Body AC 14 / 19 Ohne Rüstung / Mithralkettenhemd + The Caged Sun Touch AC 14 / 15 Ohne / mit The Caged Sun Flat-Footed 10 / 15 Ohne Rüstung / Mithralkettenhemd + The Caged Sun Initiative +6 +4 DEX, +2 Gemeinsamer Impuls Speed 30 ft BAB +4 Zelot 4 + Psion 1 CMB +6 / +7 ohne / mit The Caged Sun CMD 20 / 21 ohne / mit The Caged Sun Rettungswürfe Save Total mit The Caged Sun Ohne The Caged Sun Basis Fortitude +6 +5 +4 Reflex +7 +6 +1 Will +8 +7 +6 Cloak of Resistance +1 ist eingerechnet. Immortal Spark gibt zusätzlich +2 gegen Todeseffekte. Carnal Frailty gibt -2 gegen sexuelle Ablenkung, Verführung und vergleichbare Effekte. Angriffe Angriff Treffer Schaden Kritisch Reichweite +1 Großschwert +10 2d6+7 19-20/x2 Nahkampf +1 Großschwert, Power Attack +8 2d6+13 19-20/x2 Nahkampf Sun's Gleam +9 Ranged Touch 1d6+3 Force - 30 ft Waffe gkeiten-register\">Fähigkeitenregister</a> ergänzt alle belegten Regelkarten.</p>\n<h1>Vesper - Charakterbogen Stufe 5</h1>\n<p><strong>Klasse:</strong> Oracle (Spirit Guide) 5<br/>\n<strong>Rasse:</strong> Tiefling (Asura-Spawn)<br/>\n<strong>Mystery:</strong> Lore<br/>\n<strong>Curse:</strong> Uncontainable Allure<br/>\n<strong>Gesinnung:</strong> Neutral, mit Tendenz zu Böse<br/>\n<strong>Level:</strong> 5<br/>\n<strong>Geschlecht:</strong> Weiblich<br/>\n<strong>Alter:</strong> 22<br/>\n<strong>Familiar:</strong> <a href=\"#/artikel/verse\">Verse</a></p>\n<hr/>\n<h2>Attribute</h2>\n<table>\n<thead>\n<tr>\n<th>Attribut</th>\n<th style=\"text-align:right\">Wert</th>\n<th style=\"text-align:right\">Mod</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>STR</td>\n<td style=\"text-align:right\">11</td>\n<td style=\"text-align:right\">+0</td>\n<td></td>\n</tr>\n<tr>\n<td>DEX</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n<td>Initiative und CMD</td>\n</tr>\n<tr>\n<td>CON</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n<td></td>\n</tr>\n<tr>\n<td>INT</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n<td>Arcane Enlightenment bis Zaubergrad 4 vorbereitet</td>\n</tr>\n<tr>\n<td>WIS</td>\n<td style=\"text-align:right\">18</td>\n<td style=\"text-align:right\">+4</td>\n<td>Perception, Heal, Sense Motive</td>\n</tr>\n<tr>\n<td>CHA</td>\n<td style=\"text-align:right\">18</td>\n<td style=\"text-align:right\">+4</td>\n<td>Zauber, AC, Reflex, Knowledge, Stealth, Disable Device, Initiation</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Kampfwerte</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HP</strong></td>\n<td style=\"text-align:right\"><strong>28 / 28</strong></td>\n<td>23 auf Stufe 4 +5 Oracle 5</td>\n</tr>\n<tr>\n<td><strong>AC</strong></td>\n<td style=\"text-align:right\"><strong>14 / 20</strong></td>\n<td>Ohne Ausrüstung / Mithralkettenhemd + Mithral Heavy Shield</td>\n</tr>\n<tr>\n<td><strong>Touch AC</strong></td>\n<td style=\"text-align:right\"><strong>14</strong></td>\n<td>Sidestep Secret, CHA statt DEX</td>\n</tr>\n<tr>\n<td><strong>Flat-Footed</strong></td>\n<td style=\"text-align:right\"><strong>10 / 16</strong></td>\n<td>Ohne / mit Rüstung und Schild</td>\n</tr>\n<tr>\n<td><strong>Initiative</strong></td>\n<td style=\"text-align:right\"><strong>+8 / +12</strong></td>\n<td>+2 DEX, +2 Reactionary, +4 Improved Initiative; +4 zusätzlich durch Verse</td>\n</tr>\n<tr>\n<td><strong>Speed</strong></td>\n<td style=\"text-align:right\">30 ft</td>\n<td></td>\n</tr>\n<tr>\n<td><strong>BAB</strong></td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>CMB</strong></td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>CMD</strong></td>\n<td style=\"text-align:right\"><strong>15</strong></td>\n<td></td>\n</tr>\n<tr>\n<td><strong>Melee</strong></td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n<td>Dolch 1d4, 19-20/x2</td>\n</tr>\n<tr>\n<td><strong>Spell Save DC</strong></td>\n<td style=\"text-align:right\"><strong>14 / 15 / 16</strong></td>\n<td>Orisons / Grad 1 / Grad 2</td>\n</tr>\n<tr>\n<td><strong>Concentration</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>Oracle 5 + CHA 4</td>\n</tr>\n</tbody>\n</table>\n<h3>Rettungswürfe</h3>\n<table>\n<thead>\n<tr>\n<th>Save</th>\n<th style=\"text-align:right\">Total</th>\n<th style=\"text-align:right\">Basis</th>\n<th>Modifikator / Misc</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fortitude</strong></td>\n<td style=\"text-align:right\"><strong>+2</strong></td>\n<td style=\"text-align:right\">+1</td>\n<td>CON +0, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Reflex</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td style=\"text-align:right\">+1</td>\n<td>CHA +4, High Theft +1, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Will</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td style=\"text-align:right\">+4</td>\n<td>WIS +4, Resistance +1</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Talente</h2>\n<ul>\n<li><strong>Extra Revelation</strong>.</li>\n<li><strong>Verse Familiar</strong>: mechanisch Wasp Familiar, Protector Archetype; +4 Initiative für Vesper, solange die Familiar-Bedingungen erfüllt sind.</li>\n<li><strong>Martial Training I -&gt; II, Radiant Dawn</strong>: automatische Progression über <strong>Stykes Lehre</strong>; Stufe 5 schaltet den zweiten Martial-Training-Schritt ohne neuen Feat-Slot frei.</li>\n<li><strong>Improved Initiative</strong>: reguläres Stufe-5-Talent; +4 Initiative.</li>\n</ul>\n<hr/>\n<h2>Oracle 5, Spirit Guide / Lore</h2>\n<ul>\n<li><strong>Oracle Spellcasting</strong> über CHA.</li>\n<li><strong>Curse, Uncontainable Allure</strong>: -4 Intimidate; <em><a href=\"#/artikel/unnatural-lust\">Unnatural Lust</a></em> als Bonuszauber gemäß vorhandenem Kampagnenbogen.</li>\n<li><strong>Lore Mystery</strong>: Knowledge-Skills als Klassenfertigkeiten.</li>\n<li><strong>Sidestep Secret</strong>: CHA statt DEX auf AC und Reflex.</li>\n<li><strong>Lore Keeper</strong>: CHA statt INT auf Knowledge.</li>\n<li><strong>Bonded/Wandering Spirit</strong>: tägliche Spirit-Wahl.</li>\n<li><strong>Lore Spirit + Arcane Enlightenment</strong>: vier täglich neu wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known, derzeit bis Grad 2 wirkbar.</li>\n<li><strong>Spirit Magic</strong>: aktiv.</li>\n</ul>\n<hr/>\n<h2>Spellcasting</h2>\n<p><strong>Casting Ability:</strong> CHA +4<br/>\n<strong>Zauberplätze Grad 1:</strong> <strong>7 / Tag</strong><br/>\n<strong>Zauberplätze Grad 2:</strong> <strong>5 / Tag</strong><br/>\n<strong>Orisons:</strong> beliebig oft</p>\n<h3>Orisons</h3>\n<ul>\n<li><a href=\"#/artikel/detect-magic\">Detect Magic</a></li>\n<li><a href=\"#/artikel/create-water\">Create Water</a></li>\n<li><a href=\"#/artikel/purify-food-drink\">Purify Food and Drink</a></li>\n<li><a href=\"#/artikel/read-magic\">Read Magic</a></li>\n<li><a href=\"#/artikel/guidance\">Guidance</a></li>\n<li><a href=\"#/artikel/enhanced-diplomacy\">Enhanced Diplomacy</a></li>\n</ul>\n<h3>Zauber des 1. Grades</h3>\n<table>\n<thead>\n<tr>\n<th>Zauber</th>\n<th>Herkunft</th>\n<th>Kurzfunktion</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><a href=\"#/artikel/obscuring-mist\">Obscuring Mist</a></strong></td>\n<td>regulär</td>\n<td>Sicht- und Raumkontrolle</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/protection-from-evil\">Protection from Evil</a></strong></td>\n<td>regulär</td>\n<td>Schutz gegen böse Kreaturen und bestimmte mentale Kontrolle</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/air-bubble\">Air Bubble</a></strong></td>\n<td>regulär</td>\n<td>Atemluft</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/remove-sickness\">Remove Sickness</a></strong></td>\n<td><strong>neu Stufe 5</strong></td>\n<td>unterdrückt die Auswirkungen von Krankheit, Übelkeit und sickened nach Zaubertext</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/cure-light-wounds\">Cure Light Wounds</a></strong></td>\n<td>Oracle Cure Spell</td>\n<td><strong>1d8+5</strong> Heilung</td>\n</tr>\n<tr>\n<td><strong>Unnatural Lust</strong></td>\n<td>Curse Bonus</td>\n<td>erzwungener körperlicher Annäherungsdrang</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/identify\">Identify</a></strong></td>\n<td>Lore Spirit / Mystery</td>\n<td>magische Gegenstände identifizieren</td>\n</tr>\n</tbody>\n</table>\n<h3>Zauber des 2. Grades</h3>\n<table>\n<thead>\n<tr>\n<th>Zauber</th>\n<th>Herkunft</th>\n<th>Kurzfunktion</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><a href=\"#/artikel/delay-poison\">Delay Poison</a></strong></td>\n<td>regulär</td>\n<td>unterdrückt Giftwirkung</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/lesser-restoration\">Lesser Restoration</a></strong></td>\n<td><strong>neu Stufe 5</strong></td>\n<td>behebt passende Ability-Damage-/Zustandseffekte nach Zaubertext</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/cure-moderate-wounds\">Cure Moderate Wounds</a></strong></td>\n<td>Oracle Cure Spell</td>\n<td><strong>2d8+5</strong> Heilung</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/tongues\">Tongues</a></strong></td>\n<td>Lore Spirit</td>\n<td>Sprachen verstehen und sprechen</td>\n</tr>\n</tbody>\n</table>\n<h3>Arcane Enlightenment, aktuelle Standardauswahl</h3>\n<ul>\n<li><a href=\"#/artikel/dancing-darkness\">Dancing Darkness</a></li>\n<li><a href=\"#/artikel/silent-image\">Silent Image</a></li>\n<li><a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud</a></li>\n<li><a href=\"#/artikel/ashen-path\">Ashen Path</a></li>\n</ul>\n<p><em>Diese vier Zauber sind temporäre Oracle Spells Known und können bei der täglichen Auffrischung neu gewählt werden.</em></p>\n<hr/>\n<h2>Fertigkeiten</h2>\n<p><strong>Skill Ranks pro Level:</strong> 4 Oracle +2 INT +1 FCB = 7.<br/>\n<strong>Gesamtränge auf Stufe 5:</strong> 35.</p>\n<p>Die sieben neuen Ränge gehen in Disable Device, Diplomacy, Knowledge (All), Perception, Spellcraft, Stealth und <strong>Bluff</strong>. Sense Motive bleibt bewusst auf 2 Ranks.</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th style=\"text-align:right\">Ability</th>\n<th style=\"text-align:right\">Ranks</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Bluff</strong></td>\n<td style=\"text-align:right\">CHA</td>\n<td style=\"text-align:right\"><strong>1</strong></td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td>neuer Rang auf Stufe 5</td>\n</tr>\n<tr>\n<td><strong>Disable Device</strong></td>\n<td style=\"text-align:right\">CHA</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+12</strong></td>\n<td>Mithral Heavy Shield ACP 0; Trapfinding</td>\n</tr>\n<tr>\n<td><strong>Diplomacy</strong></td>\n<td style=\"text-align:right\">CHA</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+12</strong></td>\n<td>mit Enhanced Diplomacy situativ +14</td>\n</tr>\n<tr>\n<td><strong>Heal</strong></td>\n<td style=\"text-align:right\">WIS</td>\n<td style=\"text-align:right\">1</td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td>Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Knowledge (All)</strong></td>\n<td style=\"text-align:right\">CHA</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+12</strong></td>\n<td>Lore Keeper; erfüllt auch Knowledge (martial)</td>\n</tr>\n<tr>\n<td><strong>Perception</strong></td>\n<td style=\"text-align:right\">WIS</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>keine Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Sense Motive</strong></td>\n<td style=\"text-align:right\">WIS</td>\n<td style=\"text-align:right\"><strong>2</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Spellcraft</strong></td>\n<td style=\"text-align:right\">INT</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+10</strong></td>\n<td>Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Stealth</strong></td>\n<td style=\"text-align:right\">CHA</td>\n<td style=\"text-align:right\"><strong>5</strong></td>\n<td style=\"text-align:right\"><strong>+12</strong></td>\n<td>Mithral Heavy Shield ACP 0</td>\n</tr>\n<tr>\n<td><strong>Survival</strong></td>\n<td style=\"text-align:right\">WIS</td>\n<td style=\"text-align:right\">1</td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Path of War, Martial Training II, Radiant Dawn</h2>\n<p><strong>Initiator Level:</strong> <strong>6</strong><br/>\n<strong>Initiation Modifier:</strong> <strong>CHA +4</strong><br/>\n<strong>Recovery:</strong> Full-Round Action<br/>\n<strong>Essence Pool:</strong> <strong>2</strong><br/>\n<strong>Essence Capacity:</strong> <strong>1</strong> pro Receptacle<br/>\n<strong>Close Range:</strong> <strong>40 ft</strong></p>\n<h3>Sun's Gleam</h3>\n<ul>\n<li><strong>Angriff:</strong> +5 Ranged Touch.</li>\n<li><strong>Schaden:</strong> 1d6+4 Force.</li>\n<li><strong>Reichweite:</strong> 40 ft.</li>\n<li>Kann in geeigneten Radiant-Dawn-Strikes als Fernkampfangriff verwendet werden.</li>\n</ul>\n<h3>Bekannte Manöver</h3>\n<table>\n<thead>\n<tr>\n<th>Manöver</th>\n<th>Typ</th>\n<th style=\"text-align:right\">Standard vorbereitet?</th>\n<th>Effekt / Rolle</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong><a href=\"#/artikel/bolster\">Bolster</a></strong></td>\n<td>Counter</td>\n<td style=\"text-align:right\">Nein</td>\n<td>Verbündeter erhält DR 4/- für 1 Runde; mit 1 Essence DR 5/-</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/staunching-strike\">Staunching Strike</a></strong></td>\n<td>Strike</td>\n<td style=\"text-align:right\">Nein</td>\n<td>Treffer + Heilung; Reserveoption, falls Spoils/Cure nicht reichen</td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/witness-to-glory\">Witness to Glory</a></strong></td>\n<td>Counter</td>\n<td style=\"text-align:right\"><strong>Ja</strong></td>\n<td>nach Initiativeermittlung bevorzugt auf <a href=\"#/artikel/styke\">Styke</a>; <strong>+4 Initiative und 6 Temp HP</strong>, mit 1 Essence <strong>+5 Initiative und 8 Temp HP</strong></td>\n</tr>\n<tr>\n<td><strong><a href=\"#/artikel/decree-of-torment\">Decree of Torment</a></strong></td>\n<td>Strike</td>\n<td style=\"text-align:right\"><strong>Ja</strong></td>\n<td>markiert einen starken Gegner mit Torment-Brands; Styke kann die Marken über seine vielen Treffer für Combat Maneuvers wie Trip, Disarm oder Dirty Trick nutzen</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Standard Readied:</strong> <strong>Witness to Glory, Decree of Torment</strong>.</p>\n<p><em>Bei Bedarf können zwischen Begegnungen Bolster oder Staunching Strike neu vorbereitet werden, sofern Zeit für die normale Martial-Training-Vorbereitung/Recovery besteht.</em></p>\n<h3>Stance: Spoils of War</h3>\n<p><strong>Standardstance:</strong> <strong><a href=\"#/artikel/spoils-of-war\">Spoils of War</a></strong> mit <strong>1 Essence investiert</strong>.</p>\n<ul>\n<li>Ohne Essence heilt der erste passende Treffer eines Verbündeten pro Runde bei IL 6 um <strong>7 HP</strong>.</li>\n<li>Mit 1 Essence steigt dies auf <strong>9 HP</strong>.</li>\n<li>Der zweite Essence-Punkt bleibt standardmäßig für <strong>Witness to Glory</strong> verfügbar.</li>\n</ul>\n<hr/>\n<h2>Animus- und Martial-Glyph-Paket, virtueller Rang 1</h2>\n<p><strong>Virtueller Animus-Rang:</strong> 1<br/>\n<strong>Animus zu Beginn des ersten eigenen Zuges:</strong> <strong>5</strong><br/>\n<strong>Weitere Züge:</strong> +1 Animus zu Beginn jedes eigenen Zuges.<br/>\n<strong>Zusätzlich:</strong> +1 Animus am Rundenende, wenn Vesper in dieser Runde mindestens ein Manöver initiiert hat.<br/>\n<strong>Glyph-Kosten:</strong> 1 Animus.<br/>\n<strong>Glyph-Reichweite:</strong> <strong>40 ft</strong>.<br/>\n<strong>Glyph-Dauer:</strong> <strong>5 Runden</strong>.<br/>\n<strong>Glyph-DC:</strong> <strong>17</strong>.</p>\n<p>Ein Glyph kann als Swift Action gewirkt werden oder höchstens einmal pro Runde als Free Action nach einem Treffer mit einem Martial Strike. Mehrfache Anwendungen desselben Glyphs stapeln sich nicht und verlängern die Dauer nicht.</p>\n<h3>Bekannte Basic Glyphs</h3>\n<ol>\n<li><strong><a href=\"#/artikel/elemental-shield\">Elemental Shield</a></strong>: Energy Resistance <strong>6</strong> gegen Vespers aktives Element.</li>\n<li><strong><a href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade</a></strong>: Waffen des Verbündeten erhalten <em>ghost touch</em>.</li>\n<li><strong><a href=\"#/artikel/ghost-armor\">Ghost Armor</a></strong>: Rüstung und Schild des Verbündeten erhalten <em>ghost touch</em>.</li>\n<li><strong><a href=\"#/artikel/deflective-armor\">Deflective Armor</a></strong>: Natural Armor steigt bei IL 6 um <strong>+3</strong>.</li>\n<li><strong><a href=\"#/artikel/shadowmeld\">Shadowmeld</a></strong>: <strong>20% Concealment / Miss Chance</strong> gegen Gegner.</li>\n</ol>\n<hr/>\n<h2>Familiar: Verse</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Stufe 5</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HP</td>\n<td style=\"text-align:right\"><strong>14</strong></td>\n</tr>\n<tr>\n<td>Intelligence</td>\n<td style=\"text-align:right\"><strong>8</strong></td>\n</tr>\n<tr>\n<td>Natural Armor Adjustment</td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n</tr>\n<tr>\n<td>Initiativebonus für Vesper</td>\n<td style=\"text-align:right\"><strong>+4</strong></td>\n</tr>\n</tbody>\n</table>\n<p>Verse verwendet weiterhin den Protector Archetype mit Bodyguard und Combat Reflexes entsprechend den etablierten Kampagnenregeln.</p>\n<hr/>\n<h2>Traits &amp; Drawback</h2>\n<ul>\n<li><strong>High Theft:</strong> +1 Trait-Bonus auf Reflex.</li>\n<li><strong>Schattenwebers Intuition:</strong> Trapfinding; CHA statt DEX für Disable Device und Stealth; beide Klassenfertigkeiten.</li>\n<li><strong>Reactionary:</strong> +2 Initiative.</li>\n<li><strong>Stykes Lehre:</strong> automatische Radiant-Dawn-Martial-Training-Progression ohne weitere Feat-Steuer.</li>\n<li><strong>Hedonistic:</strong> bei Nichterfüllung der etablierten täglichen Bedingung Fortitude DC 20; Fehlschlag verursacht 4 Stunden fatigued.</li>\n</ul>\n<hr/>\n<h2>Ausrüstung</h2>\n<ul>\n<li>Dolch.</li>\n<li>Maßgefertigtes Mithralkettenhemd, Armor +4, Max DEX +6, ACP 0.</li>\n<li>Mithral Heavy Shield, Shield +2, ACP 0.</li>\n<li>Thieves' Tools.</li>\n<li>Thorns eiserner Stirnreif, getragen.</li>\n<li>Verse, aktiv.</li>\n<li><strong>Cloak of Resistance +1:</strong> getragen; der Resistance-Bonus ist in Vespers Saves eingerechnet.</li>\n</ul>\n<hr/>\n<h2>Standard-Kampferöffnung</h2>\n<ul>\n<li>Vesper würfelt normalerweise <strong>Initiative +12</strong>, solange Verse aktiv ist.</li>\n<li><strong>Witness to Glory</strong> ist vorbereitet und mit dem freien Essence-Punkt bevorzugt für Styke vorgesehen.</li>\n<li><strong>Spoils of War</strong> läuft als Standardstance mit 1 Essence.</li>\n<li>Je nach Lage kann Vesper vor Stykes Zug Zauber, Glyphs oder Decree of Torment zur Vorbereitung des Schlachtfelds einsetzen.</li>\n<li>Standard Readied bleiben <strong>Witness to Glory + Decree of Torment</strong>; Heilung läuft primär über Spoils of War und Cure-Spells.</li>\n</ul>\n","sources":["vsheet","vrules","live"],"status":"Bestätigt","tags":["Vesper","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Vesper","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Vesper , kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der aktuelle Spielstand hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen. Die Quellenhinweise benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das Fähigkeitenregister ergänzt alle belegten Regelkarten. Vesper - Charakterbogen Stufe 5 Klasse: Oracle (Spirit Guide) 5 Rasse: Tiefling (Asura-Spawn) Mystery: Lore Curse: Uncontainable Allure Gesinnung: Neutral, mit Tendenz zu Böse Level: 5 Geschlecht: Weiblich Alter: 22 Familiar: Verse Attribute Attribut Wert Mod Notiz STR 11 +0 DEX 14 +2 Initiative und CMD CON 10 +0 INT 14 +2 Arcane Enlightenment bis Zaubergrad 4 vorbereitet WIS 18 +4 Perception, Heal, Sense Motive CHA 18 +4 Zauber, AC, Reflex, Knowledge, Stealth, Disable Device, Initiation Kampfwerte Wert Total Notiz HP 28 / 28 23 auf Stufe 4 +5 Oracle 5 AC 14 / 20 Ohne Ausrüstung / Mithralkettenhemd + Mithral Heavy Shield Touch AC 14 verse aktiv ist witness to glory ist vorbereitet und mit dem freien essence punkt bevorzugt fur styke vorgesehen spoils of war lauft als standardstance mit 1 essence je nach lage kann vesper vor stykes zug zauber glyphs oder decree of torment zur vorbereitung des schlachtfelds einsetzen standard readied bleiben witness to glory decree of torment heilung lauft primar uber spoils of war und cure spells"},{"id":"bogen-valeria","category":"boegen","title":"Valeria / Charakterbogen Stufe 5","summary":"Attribute, Kampfwerte, Fertigkeiten, Talente, Klassenfähigkeiten, Ausrüstung und alle verfügbaren Zauber- und Manöverlisten.","body":"<h2>Leseschlüssel</h2>\n<p>Dies ist der vollständige verfügbare Stufe-5-Bogen von <a href=\"#/artikel/valeria\">Valeria</a>, kein automatisch fortgeschriebener Kampftracker. Permanente Werte, Ausrüstung und Fähigkeiten sind von dynamischem Ressourcenverbrauch zu unterscheiden. Der <a href=\"#/artikel/spielstand\">aktuelle Spielstand</a> hat Vorrang vor älteren Ruhe-/Tragehinweisen im Bogen.</p>\n<p>Die <a href=\"#/artikel/redaktion\">Quellenhinweise</a> benennen bekannte Unterschiede. Einzelne Namen im Bogen sind Kurzreferenzen und keine ausgeschriebenen Original-Zaubertexte. Das <a href=\"#/artikel/faehigkeiten-register\">Fähigkeitenregister</a> ergänzt alle belegten Regelkarten.</p>\n<h1>Valeria - Charakterbogen Stufe 5</h1>\n<p><strong>Frühere Identität:</strong> Dame Balina von Karfeld<br/>\n<strong>Quellenkonversion:</strong> Sir Balin von Karfeld -&gt; Dame Balina von Karfeld -&gt; Valeria; eine durchgehende Person<br/>\n<strong>Klasse:</strong> Fighter 5<br/>\n<strong>Volk:</strong> Mensch<br/>\n<strong>Herkunft:</strong> Karfeld, Talingarde<br/>\n<strong>Level:</strong> 5<br/>\n<strong>Geschlecht:</strong> Weiblich<br/>\n<strong>Gesinnung:</strong> aktuell nicht verbindlich neu festgelegt; Quellenursprung war LG<br/>\n<strong>Sprache:</strong> Common</p>\n<hr/>\n<h2>Attribute</h2>\n<table>\n<thead>\n<tr>\n<th>Attribut</th>\n<th style=\"text-align:right\">Wert</th>\n<th style=\"text-align:right\">Mod</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>STR</td>\n<td style=\"text-align:right\">18</td>\n<td style=\"text-align:right\">+4</td>\n</tr>\n<tr>\n<td>DEX</td>\n<td style=\"text-align:right\">12</td>\n<td style=\"text-align:right\">+1</td>\n</tr>\n<tr>\n<td>CON</td>\n<td style=\"text-align:right\">16</td>\n<td style=\"text-align:right\">+3</td>\n</tr>\n<tr>\n<td>INT</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n</tr>\n<tr>\n<td>WIS</td>\n<td style=\"text-align:right\">14</td>\n<td style=\"text-align:right\">+2</td>\n</tr>\n<tr>\n<td>CHA</td>\n<td style=\"text-align:right\">10</td>\n<td style=\"text-align:right\">+0</td>\n</tr>\n</tbody>\n</table>\n<hr/>\n<h2>Kampfwerte</h2>\n<table>\n<thead>\n<tr>\n<th>Wert</th>\n<th style=\"text-align:right\">Aktueller sicherer Stand</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HP</strong></td>\n<td style=\"text-align:right\"><strong>42 / 42</strong></td>\n<td>HP-Stand unverändert; Erholung siehe aktuellen Spielstand</td>\n</tr>\n<tr>\n<td><strong>Initiative</strong></td>\n<td style=\"text-align:right\"><strong>+1</strong></td>\n<td>DEX +1</td>\n</tr>\n<tr>\n<td><strong>Speed</strong></td>\n<td style=\"text-align:right\"><strong>20 ft</strong></td>\n<td>in Plattenrüstung</td>\n</tr>\n<tr>\n<td><strong>BAB</strong></td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td>Fighter 5</td>\n</tr>\n<tr>\n<td><strong>CMB</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td>BAB +5, STR +4</td>\n</tr>\n<tr>\n<td><strong>CMD</strong></td>\n<td style=\"text-align:right\"><strong>20</strong></td>\n<td>10 + BAB 5 + STR 4 + DEX 1</td>\n</tr>\n<tr>\n<td><strong>AC</strong></td>\n<td style=\"text-align:right\"><strong>20</strong>*</td>\n<td>10 +9 Platte +1 DEX, ohne geführten Schild</td>\n</tr>\n<tr>\n<td><strong>Touch AC</strong></td>\n<td style=\"text-align:right\"><strong>11</strong></td>\n<td>10 +1 DEX</td>\n</tr>\n<tr>\n<td><strong>Flat-Footed AC</strong></td>\n<td style=\"text-align:right\"><strong>19</strong>*</td>\n<td>10 +9 Platte</td>\n</tr>\n</tbody>\n</table>\n<p>* Der aktuelle Kampagnenstand setzt Plattenrüstung und ein <strong>Masterwork-Großschwert</strong>. Die Quelle führte ursprünglich masterwork full plate plus heavy steel shield. Der Schild ist <strong>nicht</strong> als aktuelle Ausrüstung etabliert. Der genaue Kauf-/Masterwork-Status der aktuellen Platte ist nicht vollständig festgelegt; der Rüstungsbonus der Full Plate bleibt davon unberührt.</p>\n<h3>Rettungswürfe</h3>\n<table>\n<thead>\n<tr>\n<th>Save</th>\n<th style=\"text-align:right\">Total</th>\n<th>Herleitung</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fortitude</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td>Base +4, CON +3, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Reflex</strong></td>\n<td style=\"text-align:right\"><strong>+3</strong></td>\n<td>Base +1, DEX +1, Resistance +1</td>\n</tr>\n<tr>\n<td><strong>Will</strong></td>\n<td style=\"text-align:right\"><strong>+6</strong></td>\n<td>Base +1, WIS +2, Iron Will +2, Resistance +1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Bravery +1:</strong> zusätzlich +1 gegen Furchteffekte.</p>\n<hr/>\n<h2>Angriffe</h2>\n<table>\n<thead>\n<tr>\n<th>Angriff</th>\n<th style=\"text-align:right\">Treffer</th>\n<th style=\"text-align:right\">Schaden</th>\n<th style=\"text-align:right\">Kritisch</th>\n<th style=\"text-align:right\">Reichweite</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Masterwork-Großschwert</strong></td>\n<td style=\"text-align:right\"><strong>+11</strong></td>\n<td style=\"text-align:right\"><strong>2d6+7</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n<tr>\n<td><strong>Masterwork-Großschwert, Power Attack</strong></td>\n<td style=\"text-align:right\"><strong>+9</strong></td>\n<td style=\"text-align:right\"><strong>2d6+13</strong></td>\n<td style=\"text-align:right\">19-20/x2</td>\n<td style=\"text-align:right\">Nahkampf</td>\n</tr>\n</tbody>\n</table>\n<p><em>Herleitung: BAB +5, STR +4, Weapon Training (Heavy Blades) +1 und Masterwork +1 auf Angriff. Zweihändiger STR-Schaden +6, dazu +1 Schaden durch Weapon Training. Power Attack gibt bei BAB +5 mit einer zweihändig geführten Waffe -2 Angriff und +6 Schaden.</em></p>\n<hr/>\n<h2>Fighter 5</h2>\n<ul>\n<li><strong>Bravery +1</strong>.</li>\n<li><strong>Armor Training 1</strong>.</li>\n<li><strong>Weapon Training (Heavy Blades) +1</strong>.</li>\n</ul>\n<hr/>\n<h2>OOC-Buildplanung</h2>\n<p>Die bereits besprochene zukünftige Planung steht <a href=\"#/artikel/buildplanung\">in einem getrennten Eintrag</a>. Aktuell gelten ausschließlich Fighter-5-Werte.</p>\n<hr/>\n<h2>Talente</h2>\n<ul>\n<li><strong>Cleave</strong>.</li>\n<li><strong>Iron Will</strong>.</li>\n<li><strong>Power Attack</strong>.</li>\n<li><strong>Step Up</strong>.</li>\n<li><strong>Weapon Focus (longsword)</strong>.</li>\n<li><strong>Weapon Specialization (longsword)</strong>.</li>\n</ul>\n<p>Die beiden Longsword-Talente stammen aus dem ursprünglichen Fighter-5-Statblock. Sie greifen nur, wenn Valeria tatsächlich ein Longsword benutzt; sie werden nicht automatisch auf ihre derzeit offene zweihändige Waffe übertragen.</p>\n<hr/>\n<h2>Fertigkeiten</h2>\n<p>Die folgenden Totale stammen aus dem ursprünglichen Fighter-5-Statblock und bleiben als sichere Fähigkeitsbasis erhalten, soweit keine aktuelle Ausrüstungsänderung einen Armor-Check-Penalty-sensitive Skill verändert:</p>\n<table>\n<thead>\n<tr>\n<th>Skill</th>\n<th style=\"text-align:right\">Total</th>\n<th>Notiz</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Intimidate</strong></td>\n<td style=\"text-align:right\"><strong>+5</strong></td>\n<td>Quellenwert</td>\n</tr>\n<tr>\n<td><strong>Knowledge (nobility)</strong></td>\n<td style=\"text-align:right\"><strong>+1</strong></td>\n<td>inkl. Child of the Temple</td>\n</tr>\n<tr>\n<td><strong>Knowledge (religion)</strong></td>\n<td style=\"text-align:right\"><strong>+8</strong></td>\n<td>inkl. Child of the Temple; Klassenfertigkeit</td>\n</tr>\n<tr>\n<td><strong>Ride</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong>*</td>\n<td>Quellenwert; aktuelle ACP-Abhängigkeit nicht neu verifiziert</td>\n</tr>\n<tr>\n<td><strong>Survival</strong></td>\n<td style=\"text-align:right\"><strong>+7</strong></td>\n<td>Quellenwert</td>\n</tr>\n<tr>\n<td><strong>Perception</strong></td>\n<td style=\"text-align:right\"><strong>+2</strong></td>\n<td>aus WIS +2, keine eigenen Ränge im Quellenstatblock ausgewiesen</td>\n</tr>\n</tbody>\n</table>\n<p>* Da der genaue Masterwork-/ACP-Status der aktuellen Platte offen ist, sollte Ride vor einem relevanten Check gegen die endgültige Rüstungsausrüstung neu abgeglichen werden.</p>\n<hr/>\n<h2>Trait</h2>\n<p><strong>Child of the Temple:</strong> +1 Trait-Bonus auf Knowledge (nobility) und Knowledge (religion); Knowledge (religion) ist Klassenfertigkeit.</p>\n<hr/>\n<h2>Aktuelle Ausrüstung</h2>\n<ul>\n<li><strong>Plattenrüstung</strong>; genaue Kauf-/Masterwork-Details nicht vollständig fixiert.</li>\n<li><strong>Masterwork-Großschwert</strong>.</li>\n<li><strong>Cloak of Resistance +1</strong>; getragen und in den Saves eingerechnet.</li>\n<li>Das frühere <strong>silberne Saphir-Symbol der Ritter des Alerion</strong> befindet sich bei <a href=\"#/artikel/styke\">Styke</a>, nicht bei Valeria.</li>\n<li>Alte Quellengegenstände wie Longsword, Dagger, Heavy Steel Shield, Potion of <a href=\"#/artikel/cure-light-wounds\">Cure Light Wounds</a> und der ursprüngliche komplette Ausrüstungssatz kehren nicht automatisch zurück.</li>\n</ul>\n","sources":["valsheet","valeria","localrules","live"],"status":"Bestätigt","tags":["Valeria","Stufe 5","Vollständiger Bogen"],"aliases":[],"owner":"Valeria","text":"Leseschlüssel Dies ist der vollständige verfügbare Stufe-5-Bogen von Valeria , kein automatisch fort /p>\n<p>Am 74. Ausbildungstag verbrachte sie einen privaten Abend mit Fesselung und Shibari. Am 27. Januar beteiligte sie sich an Vespers Experiment mit Augenbinde, Fesseln und kontrollierter Berührung. In der Nacht 27./28. Januar verlangte sie die zuvor besprochene Härte.</p>\n<p>Spät am 31. Januar beziehungsweise früh am 1. Februar hatte sie <strong>harten Analverkehr</strong> mit Styke und forderte währenddessen mehr Intensität.</p>\n<h2>Die Scham wechselte ihre Bedeutung</h2>\n<p>Valerias koitale Inkontinenz war lange ein Ort von Scham. Styke sagte ihr offen, dass ihn gerade ihr Urin erregte. Am 30. Januar gestand Valeria, dass seine Reaktion sie selbst stark erregte und dass sie genau das an sich hasste.</p>\n<h2>Der Morgen mit Styke</h2>\n<p>Am 1. Februar bat Styke sie, die Führung zu übernehmen. Valeria lenkte Kontrolle, verbale Erniedrigung, Schmerz und Körperflüssigkeitsspiel. Danach bat er sie, ihn festzuhalten. Sie hielt ihn und sagte, sie werde ihm mitteilen, wenn sie dieses Gewicht nicht tragen könne.</p>\n<h2>Die Nacht mit Vesper</h2>\n<p>Vesper und Valeria wurden in derselben Nacht direkt miteinander intim. Vesper blieb bei ihr, als Valerias Körper erneut die Kontrolle verlor, reinigte sie anschließend und hielt sie. Am nächsten Morgen erinnerte Valeria sich besonders daran, dass Vesper dabei keine Erklärung verlangte.</p>\n<p><a href=\"#/artikel/anatomie-valeria\">Körper unter dem Harnisch</a> · <a href=\"#/artikel/intim-styke-valeria\">Gegenbewegung mit Styke</a> · <a href=\"#/artikel/intim-vesper-valeria\">Vesper und Valeria</a></p>\n<h2>Die Nacht zum 4. Februar</h2><p>Vor Vesper und Mirelle nahm Valeria die dominante Stellung sichtbar ein. Sie ließ Styke knien, „Herrin“ sagen und ihren dunkelblauen Schuh küssen, hielt ihn in Orgasmusverweigerung und stellte seine Reaktionen vor den beiden Frauen aus.</p>\n<p>Ihre eigene Erregung und Harnreaktion blieben dabei ebenso sichtbar. Mirelle sah weder eine makellose Rolle noch eine bloße Vorführung, sonde a</h2>\n<p>Die äußeren Labien sind voller; die inneren Labien bleiben in Ruhe eher teilweise sichtbar. Das intime Gewebe ist tiefer rosébraun als die umliegende Haut und dunkelt mit Erregung nach.</p>\n<p>Tamsins Körper darf kleine Narben, Druckstellen, blaue Flecken, Schweiß und Arbeitsspuren tragen, wenn die Szene sie verursacht hat. Sie ist keine höfisch polierte Statue.</p>\n<p><a href=\"#/artikel/intim-tamsin\">Blutpakt und Begehren</a> · <a href=\"#/artikel/tamsin\">öffentliche Akte</a></p>","sources":["intim-tamsin"],"status":"Kanonisch","tags":["Ab 18","Körper & Anatomie","Tamsin"],"aliases":["Tamsin Anatomie","Tamsin Brüste","Tamsin Vulva","Tamsin Rasur"],"adult":true,"owner":["Tamsin"],"kind":"Körper & Anatomie","dateLabel":"Körperakte: 10.09.2026","evidence":"Git-Dokumentation","text":"Kein Ritterkörper Tamsin ist kompakt und robust. Ihre Kraft kommt aus Wachen, Tragen, Kämpfen und einem Leben, in dem der Körper Werkzeug war, nicht aus jahrelangem elitärem Reit- und Rüstungstraining. Sie trägt mehr Weichheit an Taille, Brust, Hüften und Oberschenkeln als Valeria. Brust Ihre Brüste sind groß und schwer, breit auf dem Brustkorb angesetzt, mit deutlich mehr natürlichem Zug nach unten als bei Vesper oder Valeria. Große warm braunrosé Warzenhöfe und vergleichsweise ausgeprägte Brustwarzen geben ihnen einen anderen, gröberen Realismus als Kaitlyns gepflegte Rundung. Rasur Tamsin soll ihre Schamregion rasiert halten. Das heißt nicht, dass sie immer spiegelglatt ist. Wenn Zeit vergangen ist, gehören kurze dunkle Stoppeln, etwas Rasurreizung oder ein nicht ganz perfekter Rand zur normalen Körperlichkeit. Ihr natürlicher Haarwuchs ist dunkelbraun und deutlich dichter als Valerias feines, spärliches Blond. Vulva Die äußeren Labien sind voller; die inneren Labien bleiben in Ruhe eher teilweise sichtbar. Das intime Gewebe ist tiefer rosébraun als die umliegende Haut und dunkelt mit Erregung nach. Tamsins Körper darf kleine Narben, Druckstellen, blaue Flecken, Schweiß ohne Robe</h2>\n<p>Tacitus ist eine schlanke, drahtige Frau mittleren Alters. Ihr langes kantiges Gesicht, die etwas hohlen Wangen, die markante Nase, rotbraunes zurückgestrichenes Haar, kleine Goldbrille und tintenbefleckte Finger machen sie unverwechselbar.</p>\n<p>Unter der hochgeschlossenen Kleidung setzt sich diese Linie fort: schmale Schultern und Hüften, lange Glieder, wenig überschüssiges Fett. Schlüsselbein, Rippen und Sehnen zeichnen sich im richtigen Licht ab, ohne gebrechlich zu wirken.</p>\n<h2>Brust</h2>\n<p>Ihre Brüste sind klein, natürlich etwas tiefer sitzend und von bescheidener Projektion. Im Profil wirken sie weich und leicht konisch bis tropfenförmig. Kleine Warzenhöfe liegen in gedämpftem rötlich-braunem Rosé, die Brustwarzen dunkler und schmal.</p>\n<h2>Intimbehaarung und Vulva</h2>\n<p>Ihr Schamhaar ist naturbelassen rotbraun, bereits mit einzelnen helleren oder grauen Strähnen.</p>\n<p>Die Vulva ist schlank gepolstert. Die äußeren Labien sind schmal, die inneren deutlich sichtbar und leicht asymmetrisch. Die Pigmentierung ist gedämpft rosébraun und an den inneren Geweben dunkler.</p>\n<p><a href=\"#/artikel/tacitus\">öffentliche Akte</a></p>","sources":["intim-tacitus"],"status":"Körper kanonisch / Sexualität offen","tags":["Ab 18","Körper & Anatomie","Tacitus"],"aliases":["Tacitus Anatomie","Tacitus Brüste","Tacitus Vulva"],"adult":true,"owner":["Tacitus"],"kind":"Körper & Anatomie","dateLabel":"Körperakte: 10.09.2026","evidence":"Git-Dokumentation","text":"Die Magierin ohne Robe Tacitus ist eine schlanke, drahtige Frau mittleren Alters. Ihr langes kantiges Gesicht, die etwas hohlen Wangen, die markante Nase, rotbraunes zurückgestrichenes Haar, kleine Goldbrille und tintenbefleckte Finger machen sie unverwechselbar. Unter der hochgeschlossenen Kleidung setzt sich diese Linie fort: schmale Schultern und Hüften, lange Glieder, wenig überschüssiges Fett. Schlüsselbein, Rippen und Sehnen zeichnen sich im richtigen Licht ab, ohne gebrechlich zu
