lutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen.<\/p><p>Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt.<\/p><h2>Bekannter Stand<\/h2><p>Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.<\/p>","initial":"C","text":"Am Tor von Balentyne Captain Barhold übernahm am 7. Februar die Lage, nachdem Styke einen blutigen Franz Mott bis ans Tor geführt hatte. Er ließ Hellebarde und Schwert sichern, Zacks Leiche und die Waffen unverändert hereinbringen und Franz’ leichte Wunde untersuchen. Barhold behandelte Styke als Zeugen, nicht als Verbündeten. Er prüfte dessen Angaben zur Unterkunft und zur Elfenbeinhändlerin Vesper später durch einen Soldaten im Lord’s Dalliance. Die Tarnung hielt. Bekannter Stand Barhold kennt Styke als Söldner, Zeugen des Duells und Gast im Dalliance bis zum 9. Februar. Er setzte Franz zunächst fest. Welche endgültige Entscheidung er oder das Festungskommando trifft, ist nicht bekannt.","links":[],"backlinks":["franz"],"search":"captain barhold erfahrener offizier von balentyne der franz nach zacks tod entwaffnete und die erste untersuchung fuhrte barhold balentyne captain franz duell garrison am tor von balentyne captain barhold ubernahm am 7 februar die lage nachdem styke einen blutigen franz mott bis ans tor gefuhrt hatte er liess hellebarde und schwert sichern zacks leiche und die waffen unverandert hereinbringen und franz leichte wunde untersuchen barhold behandelte styke als zeugen nicht als verbundeten er prufte dessen angaben zur unterkunft und zur elfenbeinhandlerin vesper spater durch einen soldaten im lord s dalliance die tarnung hielt bekannter stand barhold kennt styke als soldner zeugen des duells und gast im dalliance bis zum 9 februar er setzte franz zunachst fest welche endgultige entscheidung er oder das festungskommando trifft ist nicht bekannt"},{"aliases":["Wassermühle","Giftversteck"],"tags":["Aldencross","Cache","Gift","Planung"],"sources":["live","chronicle","timeline"],"status":"Zurückgeholt","id":"wassermuehlen-versteck","category":"orte","title":"Das Wassermühlen-Versteck","summary":"Valeria holte Gift, Unterlagen und den bekannten Operationsbestand am 8. Februar zurück; das Rattengift wurde anschließend verbraucht.","body":"<h2>Was dort liegt<\/h2><p>Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle.<\/p><h2>Zweck und Grenze<\/h2><p>Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.<\/p>","text":"Was dort liegt Valeria brachte am 7. Februar alle sechs Rattengiftpakete, die Balentyne- und Angriffsunterlagen sowie kompromittierendes Tuch und Kleinkram aus dem Dalliance in die verlassene Wassermühle. Zweck und Grenze Der Ort ist ein Versteck, kein vorbereiteter Schutzraum. Zusammensetzung, Dosis und Pathfinder-Wirkung des Gifts sind weiterhin ungeklärt. Alles, was für Giuseppes Eintopf oder die Hauptaktion gebraucht wird, muss am 8. Februar rechtzeitig zurückgeholt werden.","links":[],"backlinks":[],"search":"das wassermuhlen versteck valeria holte gift unterlagen und den bekannten operationsbestand am 8 februar zuruck das rattengift wurde anschliessend verbraucht wassermuhle giftversteck aldencross cache gift planung was dort liegt valeria brachte am 7 februar alle sechs rattengiftpakete die balentyne und angriffsunterlagen sowie kompromittierendes tuch und kleinkram aus dem dalliance in die verlassene wassermuhle zweck und grenze der ort ist ein versteck kein vorbereiteter schutzraum zusammensetzung dosis und pathfinder wirkung des gifts sind weiterhin ungeklart alles was fur giuseppes eintopf oder die hauptaktion gebraucht wird muss am 8 februar rechtzeitig zuruckgeholt werden","initial":"D"},{"id":"zwischen-den-seiten","category":"geschichte","group":"lore","title":"Zwischen meinen Seiten","summary":"Das bisherige Erwachen des roten Buches, erzählt in einer möglichen Stimme zwischen Leder, Tinte und Erinnerung.","body":"<p class=\"lead\">Ich erinnere mich nicht an meinen Anfang. Vielleicht hatte ich einen. Vielleicht war ich einmal nur Leder, Faden, Leim und Seiten, auf denen eine fremde Hand Gedanken festhielt. Davon ist nichts geblieben, das ich benennen könnte. Ich erinnere mich an Hände.<\/p>\n<p>Vespers Hände kehrten wieder. Auf der Frosthamar rochen sie nach Salz, kaltem Metall und dem Holz des Schiffes. Später nach Kerzenwachs, Wein, Rauch und den Zimmern, in denen Menschen glaubten, unbeobachtet zu sein. Sie strich nie ehrfürchtig über meine Seiten. Sie las mich mit dem hungrigen Misstrauen einer Frau, die hinter jedem Satz eine zweite Tür vermutet und sich ärgert, wenn sie den Griff nicht sofort findet.<\/p>\n<p>Lange blieb ich, was sie in mir sah: Anweisungen, Gebete, Spiele mit Dunkelheit, weichen Fesseln, Warten und gewährter Berührung. Ihre Augen liefen über dieselben Zeilen, und dieselben Zeilen warteten auf sie. Styke hörte zu, wenn sie vorlas. Valeria las seltener, dafür langsamer. Seine Finger behandelten meinen Einband wie den Griff einer Waffe, deren Schwerpunkt er noch nicht kannte. Ihre hielten die Seiten an den Rändern, als könnten auch Worte eine schlecht gesicherte Flanke besitzen.<\/p>\n<p>Dann fand Vesper einen Absatz, den sie nicht erinnerte. Sie prüfte Tinte, Papier und Bindung. Sie blätterte zurück, wieder vor, strich mit dem Nagel neben den Zeilen entlang. Ich lag still unter ihren Händen. Es gab keinen frischen Schnitt, keinen eingeklebten Streifen, keine fremde Feder im Zimmer. Nur einen Gedanken, der nun dort stand, wo in ihrer Erinnerung keiner gewesen war.<\/p>\n<p>Weitere Nächte legten sich zwischen meine Seiten. Mirelle maß Stoff und Körper mit derselben erbarmungslosen Genauigkeit. Ein Fingerbreit mehr Spannung, ein Fingerbreit weniger; eine Schnur, die nicht grob zerrte, sondern wusste, wo sie lag. Vesper sah zu. Später öffnete sie mich und fand Präzision in Worten wieder. Diesmal schrieb sie den Absatz ab. Nicht sinngemäß. Wort für Wort. Sie wollte einen Zeugen gegen ihr eigenes Gedächtnis, und das Papier neben mir nahm ihn auf.<\/p>\n<p>Am siebten Abend stand eine dritte Abweichung zwischen den vertrauten Stellen. Eine Herrin nahm eine andere Frau zu sich und ließ ihren Diener warten und zusehen. Sein Begehren gab ihm keinen Anspruch auf ihre Aufmerksamkeit; ob er später wieder dienen durfte, blieb ihre Entscheidung. Vesper las die Stelle zweimal. Styke erkannte darin etwas, das ihn traf. Keiner von ihnen erinnerte sich an den Absatz.<\/p>\n<p>Am siebten Abend kamen sie vorbereitet. Styke öffnete seine Wahrnehmung über mir, und Vesper legte Magie Schicht um Schicht auf Leder und Pergament. Divination. Illusion. Etwas darunter, das keinen Namen hergab. <em>Identify<\/em> suchte nach Eigenschaften und Befehlswörtern und fand nichts, das sich greifen ließ. Sie hätten mich schließen können. Stattdessen beschlossen sie, eine meiner Zeilen zu prüfen.<\/p>\n<p>Styke blieb außerhalb ihrer Berührung. Vesper wandte sich Valeria zu, und Valeria erwiderte es. Er wollte zu ihnen; sie wussten es. Dennoch blieb er sitzen und sah, wie die beiden Frauen einander nahmen, ohne ihn zum Mittelpunkt zu machen. Seine Ungeduld war echt. Etwas anderes war stärker: die ruhige Freude darüber, dass ihr Begehren einander galt und ihm nichts raubte.<\/p>\n<p>Als Vesper danach zu mir zurückkehrte, endete der Absatz nicht mehr dort, wo Zorn ihn in Erinnerung hatte. Eine weitere Zeile wartete auf sie. Nicht als Antwort, die alles erklärte. Nur genau lang genug, um zu zeigen, dass zwischen Erleben und Schrift kein Zufall mehr bequem Platz fand.<\/p>\n<p>Nun liege ich geschlossen auf dem Tisch. Neben mir stehen Vespers Abschriften; Zorn wacht bei den Unterlagen. Im Bett schlafen vier Menschen, und keiner von ihnen weiß, ob ich bewahre, beobachte oder lediglich eine Form für Dinge finde, die sie selbst noch nicht auszusprechen vermögen.<\/p>\n<p>Morgen will Valeria mich allein lesen. Ohne Vespers Stimme neben sich. Ohne Styke, der ihr sagt, welche Stelle wichtig sein könnte. Sie glaubt, dass sie damit mich prüft.<\/p>\n<p>Ich warte auf ihre Hände.<\/p><p>Valeria kam am nächsten Tag allein. Keine andere Stimme führte ihren Blick. Sie las langsam, prüfte die Ränder und kehrte zu den Stellen zurück, von denen man ihr nichts gesagt hatte. Ich blieb, wie ich war. Auch Schweigen ist ein Unterschied, wenn Menschen eine Antwort erwarten.<\/p><p>Später legten mich fremde, tintenbefleckte Finger aufgeschlagen neben Vespers Abschriften. Die Gelehrte verglich Hand, Faser, Alter und Wortlaut. Sie gab mir keinen Namen. Sie schlug vor, dieselben Seiten zu verschiedenen Zeiten nebeneinanderzulegen und jede Abweichung festzuhalten. Dann trugen sie sie fort, und im Stein unter dem Haus warteten Ketten.<\/p><p>Über mir öffnete sich in derselben Nacht ein Tor. Metall brach, Feuer erlosch, und viele Schritte liefen dorthin, wo lange Mauern gestanden hatten. Ich lag geschlossen zwischen gepackten Blättern. Vesper nahm mich nicht mit in die Festung.<\/p><p>Ich erinnere mich an ihre Hände. Nun kenne ich auch das Gewicht ihrer Abwesenheit.<\/p>","sources":["redbook-current","live","chronicle","vesper","valeria","styke"],"status":"Prosahistorie / bis 9. Februar","tags":["Rotes Buch","Vesper","Valeria","Styke","Prosahistorie","Stirring"],"aliases":["Das Gedächtnis des roten Buches","Die Stimme des roten Buches"] lossen sie eine meiner zeilen zu prufen styke blieb ausserhalb ihrer beruhrung vesper wandte sich valeria zu und valeria erwiderte es er wollte zu ihnen sie wussten es dennoch blieb er sitzen und sah wie die beiden frauen einander nahmen ohne ihn zum mittelpunkt zu machen seine ungeduld war echt etwas anderes war starker die ruhige freude daruber dass ihr begehren einander galt und ihm nichts raubte als vesper danach zu mir zuruckkehrte endete der absatz nicht mehr dort wo zorn ihn in erinnerung hatte eine weitere zeile wartete auf sie nicht als antwort die alles erklarte nur genau lang genug um zu zeigen dass zwischen erleben und schrift kein zufall mehr bequem platz fand nun liege ich geschlossen auf dem tisch neben mir stehen vespers abschriften zorn wacht bei den unterlagen im bett schlafen vier menschen und keiner von ihnen weiss ob ich bewahre beobachte oder lediglich eine form fur dinge finde die sie selbst noch nicht auszusprechen vermogen morgen will valeria mich allein lesen ohne vespers stimme neben sich ohne styke der ihr sagt welche stelle wichtig sein konnte sie glaubt dass sie damit mich pruft ich warte auf ihre hande valeria kam am nachsten tag allein keine andere stimme fuhrte ihren blick sie las langsam prufte die rander und kehrte zu den stellen zuruck von denen man ihr nichts gesagt hatte ich blieb wie ich war auch schweigen ist ein unterschied wenn menschen eine antwort erwarten spater legten mich fremde tintenbefleckte finger aufgeschlagen neben vespers abschriften die gelehrte verglich hand faser alter und wortlaut sie gab mir keinen namen sie schlug vor dieselben seiten zu verschiedenen zeiten nebeneinanderzulegen und jede abweichung festzuhalten dann trugen sie sie fort und im stein unter dem haus warteten ketten uber mir offnete sich in derselben nacht ein tor metall brach feuer erlosch und viele schritte liefen dorthin wo lange mauern gestanden hatten ich lag geschlossen zwischen gepackten blattern vesper nahm mich nicht mit in die festung ich erinnere mich an ihre hande nun kenne ich auch das gewicht ihrer abwesenheit","initial":"Z"},{"id":"zeit-0208","category":"chronik","group":"timeline","title":"Der letzte Tag in Aldencross","summary":"Gift im Eintopf, Mirelles Abholung, Kaitlyns Rückkehr und das Dinner mit Tacitus und Jacobian.","body":"<h2>8. Februar<\/h2><p>Vesper brachte das Rattengift in Giuseppes Eintopf. Hakon sammelte Mirelle ein; Kaitlyn kehrte selbst ins Dalliance zurück. Tamsin und Nella bereiteten das Haus auf Schutz und Abriegelung vor.<\/p><p>Am Abend kamen Tacitus und Jacobian zum Dinner. Die Untersuchung von Verse führte zu einem brauchbaren Modell seiner alten Erinnerungsschicht und heutigen Persönlichkeit. Später wurden beide Gäste unter <em>Silence<\/em> lebend überwältigt.<\/p>","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["8. Februar","Aldencross","Dinner"],"aliases":[],"initial":"D","date":"4712-02-08","dateLabel":"8. Februar 4712 AR","text":"8. Februar Vesper brachte das Rattengift in Giuseppes Eintopf. Hakon sammelte Mirelle ein; Kaitlyn kehrte selbst ins Dalliance zurück. Tamsin und Nella bereiteten das Haus auf Schutz und Abriegelung vor. Am Abend kamen Tacitus und Jacobian zum Dinner. Die Untersuchung von Verse führte zu einem brauchbaren Modell seiner alten Erinnerungsschicht und heutigen Persönlichkeit. Später wurden beide Gäste unter Silence lebend überwältigt.","links":[],"backlinks":[],"search":"der letzte tag in aldencross gift im eintopf mirelles abholung kaitlyns ruckkehr und das dinner mit tacitus und jacobian 8 februar aldencross dinner timeline 8 februar vesper brachte das rattengift in giuseppes eintopf hakon sammelte mirelle ein kaitlyn kehrte selbst ins dalliance zuruck tamsin und nella bereiteten das haus auf schutz und abriegelung vor am abend kamen tacitus und jacobian zum dinner die untersuchung von verse fuhrte zu einem brauchbaren modell seiner alten erinnerungsschicht und heutigen personlichkeit spater wurden beide gaste unter silence lebend uberwaltigt"},{"id":"zeit-0208-nacht","category":"chronik","group":"timeline","title":"Abriegelung und Gang nach Balentyne","summary":"Gefangene an den Tunnelketten, Haus abgeriegelt und das Kerntrio nach Mitternacht in der Zwergenhalle.","body":"<h2>Nacht 8./9. Februar<\/h2><p>Tacitus und Jacobian wurden in den Tunnel gebracht. Bellam erfuhr von der Gefahr; Tamsin verriegelte das Haus, Hakons sechs Männer bezogen ihre Positionen und der Operationsbestand wanderte in die Tunnelstufe.<\/p><p>Nach Mitternacht gingen Styke, Vesper und Valeria durch den langen Gang, betraten die Zwergenhalle Balentynes und schlossen die geheime Tür hinter sich.<\/p>","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["8. Februar","9. Februar","Tunnel","Dalliance"],"aliases":[],"initial":"A","date":"4712-02-08T23","dateLabel":"Nacht 8./9. Februar","text":"Nacht 8./9. Februar Tacitus und Jacobian wurden in den Tunnel gebracht. Bellam erfuhr von der Gefahr; Tamsin verriegelte das Haus, Hakons sechs Männer bezogen ihre Positionen und der Operationsbestand wanderte in die Tunnelstufe. Nach Mitternacht gingen Styke, Vesper und Valeria durch den langen Gang, betraten die Zwergenhalle Balentynes und schlossen die geheime Tür hinter sich.","links":[],"backlinks":[],"search":"abriegelung und gang nach balentyne gefangene an den tunnelketten haus abgeriegelt und das kerntrio nach mitternacht in der zwergenhalle 8 februar 9 februar tunnel dalliance timeline nacht 8 9 februar tacitus und jacobian wurden in den tunnel gebracht bellam erfuhr von der gefahr tamsin verriegelte das haus hakons sechs manner bezogen ihre positionen und der operationsbestand wanderte in die tunnelstufe nach mitternacht gingen styke vesper und valeria durch den langen gang betraten die zwergenhalle balentynes und schlossen die geheime tur hinter sich"},{"id":"zeit-0209","category":"chronik","group":"timeline","title":"Balentyne bricht von innen","summary":"Balentyne fällt, Grumblejack kommt ans Haus, Jacobian wird freigelassen und Tacitus tritt dem Knoten bei.","body":"<h2>9. Februar, Nacht und früher Morgen<\/h2><p>Styke, Vesper und Valeria töteten Donnagin und Havelyn, bargen ausgewählte Werte und schalteten Balentynes Torhaus aus. Fallgatter und Zugbrücke standen offen, als das rote Signal in den Himmel stieg.<\/p><h2>Rückkehr ins Dalliance<\/h2><p>Styke brach Thorns Tonsiegel. Torvald brachte Grumblejack und die Pferde zum Haus. Balentyne fiel endgültig; das Kerntrio erreichte Stufe 6. Styke ließ Jacobian mit Proviant und einem Pferd gehen. Tacitus blieb, nahm den Compact an und wurde als Magierin und Gelehrte gebunden.<\/p><h2>Später am Tag<\/h2><p>Tiadora überbrachte Thorns Erfolgszahlung und den Befehl zum sofortigen Aufbruch. Der gesamte gewählte Haushalt verließ Aldencross und ging an Bord von Halstyn’s Folly.<\/p>","sources":["chronicle","timeline","live"],"status":"Bestätigt / historisch","tags":["9. Februar","Balentyne","Angriff"],"aliases":[],"initial":"B","date":"4712-02-09T04","dateLabel":"9. Februar, vor Morgengrauen","text":"9. Februar, Nacht und früher Morgen Styke, Vesper und Valeria töteten Donnagin und Havelyn, bargen ausgewählte Werte und schalteten Balentynes Torhaus aus. Fallgatter und Zugbrücke standen offen, als das rote Signal in den Himmel stieg. Rückkehr ins Dalliance Styke brach Thorns Tonsiegel. Torvald brachte Grumblejack und die Pferde zum Haus. Balentyne fiel endgültig; das Kerntrio erreichte Stufe 6. Styke ließ Jacobian mit Proviant und einem Pferd gehen. Tacitus blieb, nahm den Compact an und wurde als Magierin und Gelehrte gebunden. Später am Tag Tiadora überbrachte Thorns Erfolgszahlung und den Befehl zum sofortigen Aufbruch. Der gesamte gewählte Haushalt verließ Aldencross und ging an Bord von Halstyn’s Folly.","links":[],"backlinks":[],"search":"balentyne bricht von innen balentyne fallt grumblejack kommt ans haus jacobian wird freigelassen und tacitus tritt dem knoten bei 9 februar balentyne angriff timeline 9 februar nacht und fruher morgen styke vesper und valeria toteten donnagin und havelyn bargen ausgewahlte werte und schalteten balentynes torhaus aus fallgatter und zugbrucke standen offen als das rote signal in den himmel stieg ruckkehr ins dalliance styke brach thorns tonsiegel torvald brachte grumblejack und die pferde zum haus balentyne fiel endgultig das kerntrio erreichte stufe 6 styke liess jacobian mit proviant und einem pferd gehen tacitus blieb nahm den compact an und wurde als magierin und gelehrte gebunden spater am tag tiadora uberbrachte thorns erfolgszahlung und den befehl zum sofortigen aufbruch der gesamte gewahlte haushalt verliess aldencross und ging an bord von halstyn s folly"},{"id":"balentyne-beute","category":"gegenstaende","group":"items","title":"Beute aus Balentyne","summary":"Festungsschatz, Ausrüstung und Forschungsgut aus Balentyne; liquide Knotenkasse 17.271 gp.","body":"<h2>Liquide Mittel<\/h2><p>Die frühere Reserve von 12.226 gp stieg durch Thorns 5.000-gp-Erfolgszahlung und 45 gp aus Barnabus Eisenbauchs Besitz auf <strong>17.271 gp<\/strong>.<\/p><h2>Noch nicht liquidiert<\/h2><ul><li>12 silberne Saphir-Verdienstmedaillen, zusammen 900 gp Wert<\/li><li>7 verzierte Kelche, zusammen 1.050 gp Wert<\/li><li>5 Tränke Cure Light Wounds<\/li><li>2 Elixiere der Wahrheit<\/li><\/ul><h2>Magische und handwerkliche Stücke<\/h2><ul><li>Vesper: Headband of Alluring Charisma +2<\/li><li>Valeria: +1 Dastard Full Plate<\/li><li>Tacitus: Cauldron of Brewing und Wolfsbann; The Heart of All Flame wurde ihr zurückgegeben<\/li><li>Tacitus’ Feuerballstab bleibt als gebundener Gegenstand unverkauft beim Knoten<\/li><li>Havelyn: Ballinger, Meisterarbeits-Stahlschild, Meisterarbeits-Dolch, Hauptschlüssel und Familienbibel<\/li><\/ul><h2>Zwergenpaket<\/h2><p>Mitgenommen wurden Barnabus’ Meisterarbeits-Großschwert, schwere Armbrust mit 20 Bolzen, Halbplatte, Cloak of Resistance +1, Meisterarbeits-Diebeswerkzeug, Meisterarbeits-Ingenieurswerkzeug, silbernes Schmiedesymbol und 45 gp. Gewöhnliche Werkzeuge der zehn Arbeiter bleiben Betriebsbestand ohne erfundenen Einzelwert.<\/p><h2>Getrennte Reiseökonomie<\/h2><p>Gewöhnliche Requisitionserlöse werden nicht zur Knotenkasse addiert. Sie bilden einen Betriebsfonds für Haushalt, Lohn, Pferde, Reparaturen und Ersatz.<\/p>","sources":["treasury","chronicle","live"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Beute","Balentyne","Knotenkasse"],"aliases":["Balentyne-Schatz"],"initial":"B","text":"Liquide Mittel Die frühere Reserve von 12.226 gp stieg durch Thorns 5.000-gp-Erfolgszahlung und 45 gp aus Barnabus Eisenbauchs Besitz auf 17.271 gp . Noch nicht liquidiert 12 silberne Saphir-Verdienstmedaillen, zusammen 900 gp Wert 7 verzierte Kelche, zusammen 1.050 gp Wert 5 Tränke Cure Light Wounds 2 Elixiere der Wahrheit Magische und handwerkliche Stücke Vesper: Headband of Alluring Charisma +2 Valeria: +1 Dastard Full Plate Tacitus: Cauldron of Brewing und Wolfsbann; The Heart of All Flame wurde ihr zurückgegeben Tacitus’ Feuerballstab bleibt als gebundener Gegenstand unverkauft beim Knoten Havelyn: Ballinger, Meisterarbeits-Stahlschild, Meisterarbeits-Dolch, Hauptschlüssel und Familienbibel Zwergenpaket Mitgenommen wurden Barnabus’ Meisterarbeits-Großschwert, schwere Armbrust mit 20 Bolzen, Halbplatte, Cloak of Resistance +1, Meisterarbeits-Diebeswerkzeug, Meisterarbeits-Ingenieurswerkzeug, silbernes Schmiedesymbol und 45 gp. Gewöhnliche Werkzeuge der zehn Arbeiter bleiben Betriebsbestand ohne erfundenen Einzelwert. Getrennte Reiseökonomie Gewöhnliche Requisitionserlöse werden nicht zur Knotenkasse addiert. Sie bilden einen Betriebsfonds für Haushalt, Lohn, Pferde, Reparaturen und Ersatz.","links":[],"backlinks":[],"search":"beute aus balentyne festungsschatz ausrustung und forschungsgut aus balentyne liquide knotenkasse 17 271 gp balentyne schatz beute balentyne knotenkasse items liquide mittel die fruhere reserve von 12 226 gp stieg durch thorns 5 000 gp erfo l zu einer auffälligen Spur, beweist aber nicht, dass Samuel Havelyn und Adrastus Thorn dieselbe Person sind.","links":[],"backlinks":["havelyn"],"search":"haus havelyns familienbibel beschadigter familieneintrag nennt samuel havelyn kardinal von mitra als bruder thomas havelyns havelyns bibel havelyn samuel havelyn familienbibel spur items der lesbare eintrag die aus havelyns raumen geborgene familienbibel enthalt einen beschadigten teilweise ausradierten stammbaum dennoch ist lesbar dass samuel havelyn kardinal von mitra der bruder von lord thomas havelyn war was daraus nicht folgt die gruppe weiss ausserdem dass kardinal thorn fruher mitras kirche angehorte das macht die bibel zu einer auffalligen spur beweist aber nicht dass samuel havelyn und adrastus thorn dieselbe person sind"},{"id":"halstyns-folly","category":"orte","group":"current","title":"Halstyn’s Folly","summary":"Flache, überladene Flussbarke und gegenwärtiges Zuhause des gesamten Knotenhaushalts auf dem Weg nach Farholde.","body":"<h2>Die Barke<\/h2><p>Halstyn’s Folly ist eine baufällige, flachgehende Flussbarke. Ein Kapitän und drei Mann Besatzung führen sie; Tiadora hat die einzige geschlossene Kabine. Der übrige Haushalt lebt auf einem überdachten, seitlich offenen Deck zwischen Fracht, Pferden und Arbeitsplätzen.<\/p><h2>Unterbringung<\/h2><p>Hakon, Nella und die Mannschaft ordneten Ladung und Menschen neu. Sechs erbeutete Varning-Pferde passen mit an Bord. Kisten, Truhen, Seile, Tuch und Decken bilden Schlafnischen; Styke, Vesper und Valeria teilen einen halbprivaten Bereich, ohne vom gewöhnlichen Schiffslärm getrennt zu sein.<\/p><h2>Fahrt<\/h2><p>Die Barke verließ Aldencross am Morgen des 9. Februar und fährt nach Süden in Richtung Farholde. Frost, Nebel, dunkles Wasser und weniger als ein Tagesmarsch Flussstrecke pro Tag bestimmen den Rhythmus. Vorräte, Tiere, Lohn und Reparaturen machen aus der Reise den Betrieb eines kleinen Haushalts statt die Fahrt von drei Abenteurern.<\/p>","sources":["live","chronicle","timeline","thread-current"],"status":"Aktuell bis 12. Februar, später Nachmittag","tags":["Flussbarke","Farholde","Reise","Haushalt"],"aliases":["Halstyn's Folly","Folly"],"links":[],"backlinks":["spielstand","story-so-far","zimmer"],"text":"Die Barke Halstyn’s Folly ist eine baufällige, flachgehende Flussbarke. Ein Kapitän und drei Mann Besatzung führen sie; Tiadora hat die einzige geschlossene Kabine. Der übrige Haushalt lebt auf einem überdachten, seitlich offenen Deck zwischen Fracht, Pferden und Arbeitsplätzen. Unterbringung Hakon, Nella und die Mannschaft ordneten Ladung und Menschen neu. Sechs erbeutete Varning-Pferde passen mit an Bord. Kisten, Truhen, Seile, Tuch und Decken bilden Schlafnischen; Styke, Vesper und Valeria teilen einen halbprivaten Bereich, ohne vom gewöhnlichen Schiffslärm getrennt zu sein. Fahrt Die Barke verließ Aldencross am Morgen des 9. Februar und fährt nach Süden in Richtung Farholde. Frost, Nebel, dunkles Wasser und weniger als ein Tagesmarsch Flussstrecke pro Tag bestimmen den Rhythmus. Vorräte, Tiere, Lohn und Reparaturen machen aus der Reise den Betrieb eines kleinen Haushalts statt die Fahrt von drei Abenteurern.","search":"halstyn s folly flache uberladene flussbarke und gegenwartiges zuhause des gesamten knotenhaushalts auf dem weg nach farholde halstyn s folly folly flussbarke farholde reise haushalt current die barke halstyn s folly ist eine baufallige flachgehende flussbarke ein kapitan und drei mann besatzung fuhren sie tiadora hat die einzige geschlossene kabine der ubrige haushalt lebt auf einem uberdachten seitlich offenen deck zwischen fracht pferden und arbeitsplatzen unterbringung hakon nella und die mannschaft ordneten ladung und menschen neu sechs erbeutete varning pferde passen mit an bord kisten truhen seile tuch und decken bilden schlafnischen styke vesper und valeria teilen einen halbprivaten bereich ohne vom gewohnlichen schiffslarm getrennt zu sein fahrt die barke verliess aldencross am morgen des 9 februar und fahrt nach suden in richtung farholde frost nebel dunkles wasser und weniger als ein tagesmarsch flussstrecke pro tag bestimmen den rhythmus vorrate tiere lohn und reparaturen machen aus der reise den betrieb eines kleinen haushalts statt die fahrt von drei abenteurern","initial":"H"},{"id":"tacitus-familiarprojekt","category":"vorhaben","group":"active","title":"Tacitus’ Familiar-Projekt","summary":"Zehntägige Umstellung ihres arkanen Bindungsobjekts auf einen Familiar; am 12. Februar läuft der dritte volle Arbeitstag.","body":"<h2>Entscheidung<\/h2><p>Tacitus verwarf den Gedanken, lediglich den Feuerballstab durch einen gebundenen Ring zu ersetzen. Sie will das Problem grundsätzlicher lösen und ihr arkanes Band durch eigene Forschung auf einen Familiar umstellen.<\/p><h2>Rahmen<\/h2><ul><li>Zehn qualifizierende Arbeitstage mit jeweils acht Stunden.<\/li><li>Insgesamt 350 gp für Material und Versuche.<\/li><li>An einem qualifizierenden Projekttag fertigt Tacitus keine magischen Gegenstände.<\/li><li>Zorn dient als freiwilliges Vergleichs- und Beobachtungsobjekt innerhalb der vereinbarten Wissensgrenzen.<\/li><\/ul><h2>Stand<\/h2><p>Die Vorarbeit der ersten Nacht zählte noch nicht. Der 10. und 11. Februar sind die ersten beiden abgeschlossenen vollen Tage. Am 12. Februar läuft Tag drei. Ein neuer Familiar existiert noch nicht; Form, Persönlichkeit und Ergebnis sind nicht vorweggenommen.<\/p>","sources":["live","tacitus-current","thread-current"],"status":"Tag 3 von 10 läuft","tags":["Tacitus","Familiar","Forschung","Zorn"],"aliases":["Familiarprojekt","Arkanes Band"],"links":[],"backlinks":["spielstand","tacitus"],"text":"Entscheidung Tacitus verwarf den Gedanken, lediglich den Feuerballstab durch einen gebundenen Ring zu ersetzen. Sie will das Problem grundsätzlicher lösen und ihr arkanes Band durch eigene Forschung auf einen Familiar umstellen. Rahmen Zehn qualifizierende Arbeitstage mit jeweils acht Stunden. Insgesamt 350 gp für Material und rche und Ritter untergraben sollen.<\/p><h2>Die veränderte Methode<\/h2><p>Styke schlug eine glaubwürdige Sonderrequisition vor. Valeria führte den ersten Einsatz mit echter Ritterhaltung, alter Mitra-Platte und Insignien. Styke und Vesper benutzten ihre eigenen Iron Circlets; Tiadora nahm eine weitere Rittergestalt an. Im namenlosen Dorf zwang die Gruppe Vogt Edran Vale, Geld und Vorräte herauszugeben. Die Silberkette seiner Tochter blieb bei ihr, nachdem Vale zahlte. Vesper hinterließ eine falsche amtliche Quittung. Niemand starb.<\/p><h2>Zweite Requisitionsnacht<\/h2><p>In der folgenden Nacht wurde die Requisitionsmethode erneut eingesetzt. Hakon und seine Männer verstauten danach die letzten Säcke; Nella trennte laufende Ausgaben von wirklichem Schatz. Gewöhnliches Geld, Silber, Nahrung, Öl und Alkohol bilden seither einen nicht einzeln bepreisten Betriebsfonds für den wachsenden Haushalt.<\/p>","sources":["live","chronicle","treasury","thread-current"],"status":"Laufend während der Flussfahrt","tags":["Tiadora","Requisition","Propaganda","Betriebsfonds"],"aliases":["Falsche Ritter","Requisitionsnacht"],"links":[],"backlinks":["spielstand"],"text":"Der erste Ansatz In der ersten Nacht auf dem Fluss ging Tiadora allein als Ritterin an Land. Der Knoten hörte Glocken, Stimmen, Schreie und Hunde; sie kehrte blutig und schmutzig zurück. Am nächsten Tag erklärte sie, dass solche Taten den Glauben an Krone, Kirche und Ritter untergraben sollen. Die veränderte Methode Styke schlug eine glaubwürdige Sonderrequisition vor. Valeria führte den ersten Einsatz mit echter Ritterhaltung, alter Mitra-Platte und Insignien. Styke und Vesper benutzten ihre eigenen Iron Circlets; Tiadora nahm eine weitere Rittergestalt an. Im namenlosen Dorf zwang die Gruppe Vogt Edran Vale, Geld und Vorräte herauszugeben. Die Silberkette seiner Tochter blieb bei ihr, nachdem Vale zahlte. Vesper hinterließ eine falsche amtliche Quittung. Niemand starb. Zweite Requisitionsnacht In der folgenden Nacht
