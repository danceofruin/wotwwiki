nstrukte und tritonen verse ist ein erwachtes reliquiarwesen mit beschadigter erinnerung neuen eigenen gedanken und der fahigkeit vesper zu widersprechen nerianus besitzt tritonische wasseranpassung sein wissen stammt aus seiner personlichen erfahrung nicht aus seiner abstammung"},{"id":"golarion","category":"welt","title":"Golarion als Außenwelt","summary":"Die offene Umgebung Talingardes, nicht eine nachträgliche Verlegung der Inselgeschichte.","body":"<h2>Festgelegte Anpassung</h2>\n<p>Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt.</p>\n<h2>Erwähnte Zukunftswünsche</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit <a href=\"#/artikel/vesper\">Vesper</a>. Das ist belegt als <strong>Gespräch und Wunsch</strong>, nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.</p>\n","sources":["localrules","cultures","live"],"status":"Kampagnenkonversion","tags":["Außenwelt"],"aliases":["Absalom","Qadira"],"text":"Festgelegte Anpassung Die Kampagne benutzt Golarion für den ursprünglich undefinierten Außenraum. Talingardes eigene Geschichte, Religion, Krone und Institutionen bleiben erhalten. Exakte Meereslage, nächste Küsten und politische Beziehungen sind nicht pauschal gesetzt. Erwähnte Zukunftswünsche Styke sprach am 31. Januar von einer lebensverlängernden Blume in Qadira und einer Götterprüfung in Absalom als möglichen Horizonten einer gemeinsamen Zukunft mit Vesper . Das ist belegt als Gespräch und Wunsch , nicht als ausgewählte Folgequest oder verifiziertes Detail einer solchen Reise.","links":["styke","vesper"],"backlinks":["talingarde"],"search":"golarion als aussenwelt die offene umgebung talingardes nicht eine nachtragliche verlegung der inselgeschichte absalom qadira aussenwelt festgelegte anpassung die kampagne benutzt golarion fur den ursprunglich undefinierten aussenraum talingardes eigene geschichte religion krone und institutionen bleiben erhalten exakte meereslage nachste kusten und politische beziehungen sind nicht pauschal gesetzt erwahnte zukunftswunsche styke sprach am 31 januar von einer lebensverlangernden blume in qadira und einer gotterprufung in absalom als moglichen horizonten einer gemeinsamen zukunft mit vesper das ist belegt als gesprach und wunsch nicht als ausgewahlte folgequest oder verifiziertes detail einer solchen reise"},{"id":"nessian-knot","category":"gruppen","title":"Der Nessianische Knoten","summary":"Der innere Knoten um Styke und Vesper; seit dem 2. Februar gehört Nella als vollständig Gebundene dazu.","body":"<h2>Kern und Rang</h2><p>Asmodeus steht über dem Knoten. Styke und Vesper führen gemeinsam; Valeria gehört zum innersten operativen Dreieck. Das psionische Kollektiv umfasst nur Vesper und Valeria.</p>\n<h2>Gebundene</h2><p>Tamsin steht unter einem älteren, härteren Blutpakt. Nella schloss am 2. Februar den neuen <a href=\"#/artikel/compact-bound\">Compact of the Bound</a>. Beide Verträge bleiben getrennt.</p>\n<h2>Feldgruppe</h2><p>Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt ihr freier Verbündeter. Die Feldgruppe ist unverletzt und wartet außerhalb Aldencross auf neue Befehle.</p>\n<h2>Aufnahme weiterer Leute</h2><p>Vesper und Valeria prüfen künftige Gefolgsleute gemeinsam. Wenn beide eine Person ablehnen, setzt Stykes Begehren diese Entscheidung nicht außer Kraft. Geliebte, bezahlte Hilfe und gebundenes Gefolge sind verschiedene Stellungen.</p>","sources":["live","chronicle","knot-pact","relations"],"status":"Aktiv","tags":["Asmodeus","Knoten","Gefolge"],"aliases":["Nessian Knot","Nessianischer Knoten"],"text":"Kern und Rang Asmodeus steht über dem Knoten. Styke und Vesper führen gemeinsam; Valeria gehört zum innersten operativen Dreieck. Das psionische Kollektiv umfasst nur Vesper und Valeria. Gebundene Tamsin steht unter einem älteren, härteren Blutpakt. Nella schloss am 2. Februar den neuen Compact of the Bound . Beide Verträge bleiben getrennt. Feldgruppe Hakon führt Sten, Ketil, Eirik, Arved und Torvald. Grumblejack bleibt ihr freier Verbündeter. Die Feldgruppe ist unverletzt und wartet außerhalb Aldencross auf neue Befehle. Aufnahme weiterer Leute Vesper und Valeria prüfen künftige Gefolgsleute gemeinsam. Wenn beide eine Person ablehnen, setzt Stykes Begehren diese Entscheidung nicht außer Kraft. Geliebte, bezahlte Hilfe und gebundenes Gefolge sind verschiedene Stellungen.","links":["compact-bound"],"backlinks":[],"search":"der nessianische knoten der innere knoten um styke und vesper seit dem 2 februar gehort nella als vollstandig gebundene dazu nessian knot nessianischer knoten asmodeus knoten gefolge kern und rang asmodeus steht uber dem knoten styke und vesper fuhren gemeinsam valeria gehort zum innersten operativen dreieck das psionische kollektiv umfasst nur vesper und valeria gebundene tamsin steht unter einem alteren harteren blutpakt nella schloss am 2 februar den neuen compact of the bound beide vertrage bleiben getrennt feldgruppe hakon fuhrt sten ketil eirik arved und torvald grumblejack bleibt ihr freier verbundeter die feldgruppe ist unverletzt und wartet ausserhalb aldencross auf neue befehle aufnahme weiterer leute vesper und valeria prufen kunftige gefolgsleute gemeinsam wenn beide eine person ablehnen setzt stykes begehren diese entscheidung nicht ausser kraft geliebte bezahlte hilfe und gebundenes gefolge sind verschiedene stellungen"},{"id":"feldgruppe","category":"gruppen","title":"Hakons Feldgruppe","summary":"Sechs bezahlte Norspiker, ein freier Oger und sieben erbeutete Pferde.","body":"<h2>Zusammensetzung</h2>\n<p><a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a>, dazu <a href=\"#/artikel/grumblejack\">Grumblejack</a>. Die Pferde aus Varnings Patrouille sind bei dieser Gruppe; <a href=\"#/artikel/varlet\">Varlet</a> gehört Grumblejack als eigener Anteil.</p>\n<h2>Geltender Auftrag</h2>\n<p>Kleinere Balentyne-Kräfte nur bei sicherer Gelegenheit angreifen, großen Risiken ausweichen und zwei Tage vor dem gewählten Angriff am vereinbarten Feldpunkt zusammentreffen.</p>\n<h2>Kommunikationsstand</h2>\n<p>Ein konkreter 8./9.-Februar-Angriffstermin ist intern erwogen, aber nicht zugestellt. Kein neuer Feldbericht bestätigt weitere Kämpfe oder Begegnungen mit Suchreitern.</p>\n","sources":["factions","live","core"],"status":"Bestätigt","tags":["Verbündete","Feldarbeit"],"aliases":[],"text":"Zusammensetzung Hakon , Sten , Ketil , Eirik , Arved und Torvald , dazu Grumblejack . Die Pferde aus Varnings Patrouille sind bei dieser Gruppe; Varlet gehört Grumblejack als eigener Anteil. Geltender Auftrag Kleinere Balentyne-Kräfte nur bei sicherer Gelegenheit angreifen, großen Risiken ausweichen und zwei Tage vor dem gewählten Angriff am vereinbarten Feldpunkt zusammentreffen. Kommunikationsstand Ein konkreter 8./9.-Februar-Angriffstermin ist intern erwogen, aber nicht zugestellt. Kein neuer Feldbericht bestätigt weitere Kämpfe oder Begegnungen mit Suchreitern.","links":["hakon","sten","ketil","eirik","arved","torvald","grumblejack","varlet"],"backlinks":[],"search":"hakons feldgruppe sechs bezahlte norspiker ein freier oger und sieben erbeutete pferde verbundete feldarbeit zusammensetzung hakon sten ketil eirik arved und torvald dazu grumblejack die pferde aus varnings patrouille sind bei dieser gruppe varlet gehort grumblejack als eigener anteil geltender auftrag kleinere balentyne krafte nur bei sicherer gelegenheit angreifen grossen risiken ausweichen und zwei tage vor dem gewahlten angriff am vereinbarten feldpunkt zusammentreffen kommunikationsstand ein konkreter 8 9 februar angriffstermin ist intern erwogen aber nicht zugestellt kein neuer feldbericht bestatigt weitere kampfe oder begegnungen mit suchreitern"},{"id":"eisenbauch-crew","category":"gruppen","title":"Eisenbauchs Mannschaft","summary":"Barnabus und zehn Zwergenarbeiter, keine bestätigten Mitverschwörer.","body":"<h2>Tätigkeit</h2>\n<p>Die Mannschaft wohnt im Dalliance und arbeitet an der vorbeugenden Wartung und Verstärkung von Balentynes Torhaus. Vier Ingenieure arbeiten laut Valerias Bericht tagsüber auf der Mechanismenebene.</p>\n<h2>Bekannte Gesprächszugänge</h2>\n<p>Handwerk und Alltag sind zugänglicher als Lohn- und Geldfragen. Barnabus' Stolz beim Trinken wurde als Zugang genutzt. Vespers Zimmersuche fand keine brauchbare Erpressungsgrundlage.</p>\n<h2>Unbekannt</h2>\n<p>Schlaf-, Melde- und Alarmgewohnheiten bleiben zu erforschen. Ein allgemeiner Lohnskandal und der behauptete Taschendiebstahl sind nicht als Tatsachen bestätigt.</p>\n","sources":["core","live","factions","chronicle"],"status":"Bestätigt","tags":["Zwerge","Handwerk"],"aliases":[],"text":"Tätigkeit Die Mannschaft wohnt im Dalliance und arbeitet an der vorbeugenden Wartung und Verstärkung von Balentynes Torhaus. Vier Ingenieure arbeiten laut Valerias Bericht tagsüber auf der Mechanismenebene. Bekannte Gesprächszugänge Handwerk und Alltag sind zugänglicher als Lohn- und Geldfragen. Barnabus' Stolz beim Trinken wurde als Zugang genutzt. Vespers Zimmersuche fand keine brauchbare Erpressungsgrundlage. Unbekannt Schlaf-, Melde- und Alarmgewohnheiten bleiben zu erforschen. Ein allgemeiner Lohnskandal und der behauptete Taschendiebstahl sind nicht als Tatsachen bestätigt.","links":[],"backlinks":[],"search":"eisenbauchs mannschaft barnabus und zehn zwergenarbeiter keine bestatigten mitverschworer zwerge handwerk tatigkeit die mannschaft wohnt im dalliance und arbeitet an der vorbeugenden wartung und verstarkung von balentynes torhaus vier ingenieure arbeiten laut valerias bericht tagsuber auf der mechanismenebene bekannte gesprachszugange handwerk und alltag sind zuganglicher als lohn und geldfragen barnabus stolz beim trinken wurde als zugang genutzt vespers zimmersuche fand keine brauchbare erpressungsgrundlage unbekannt schlaf melde und alarmgewohnheiten bleiben zu erforschen ein allgemeiner lohnskandal und der behauptete taschendiebstahl sind nicht als tatsachen bestatigt"},{"id":"white-ravens","category":"gruppen","title":"Die White Ravens","summary":"Elise Zadarias eigene Gruppe aus der Ausbildungsphase.","body":"<h2>Bekannte Mitglieder und Beziehungen</h2>\n<p><a href=\"#/artikel/elise\">Elise Zadaria</a>, Tallus Trak Rackburn, Titus Trik Rackburn, <a href=\"#/artikel/dostan\">Dostan Alfson</a> und Elises Begleiter <a href=\"#/artikel/frost\">Frost</a> gehören zum historischen Rahmen. Trak und Trik sind unterschiedliche Brüder.</p>\n<h2>Verhältnis zum Kerntrio</h2>\n<p>Persönliche und intime Nähe zwischen Elise, <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> erzeugte keine Übernahme ihrer Gefolgsleute. Elise hielt daran fest, dass die White Ravens ihre eigenen Leute sind.</p>\n<h2>Gegenwart</h2>\n<p>Die genaue Position nach der Ausbildung ist im aktuellen Kampagnenarchiv offen. Daraus wird keine künftige Hilfe oder Feindschaft vorgeschrieben.</p>\n","sources":["history"],"status":"Bestätigt","tags":["Historisch","Elise"],"aliases":[],"text":"Bekannte Mitglieder und Beziehungen Elise Zadaria , Tallus Trak Rackburn, Titus Trik Rackburn, Dostan Alfson und Elises Begleiter Frost gehören zum historischen Rahmen. Trak und Trik sind unterschiedliche Brüder. Verhältnis zum Kerntrio Persönliche und intime Nähe zwischen Elise, Styke und Vesper erzeugte keine Übernahme ihrer Gefolgsleute. Elise hielt daran fest, dass die White Ravens ihre eigenen Leute sind. Gegenwart Die genaue Position nach der Ausbildung ist im aktuellen Kampagnenarchiv offen. Daraus wird keine künftige Hilfe oder Feindschaft vorgeschrieben.","links":["elise","dostan","frost","styke","vesper"],"backlinks":["elise","trak","trik","dostan","frost","story-so-far","zeit-ausbildung","intim-elise"],"search":"die white ravens elise zadarias eigene gruppe aus der ausbildungsphase historisch elise bekannte mitglieder und beziehungen elise zadaria tallus trak rackburn titus trik rackburn dostan alfson und elises begleiter frost gehoren zum historischen rahmen trak und trik sind unterschiedliche bruder verhaltnis zum kerntrio personliche und intime nahe zwischen elise styke und vesper erzeugte keine ubernahme ihrer gefolgsleute elise hielt daran fest dass die white ravens ihre eigenen leute sind gegenwart die genaue position nach der ausbildung ist im aktuellen kampagnenarchiv offen daraus wird keine kunftige hilfe oder feindschaft vorgeschrieben"},{"id":"alerion","category":"gruppen","title":"Die Ritter des Alerion","summary":"Mitranischer Ritterorden und Valerias frühere institutionelle Heimat.","body":"<h2>Öffentliches Bild</h2>\n<p>Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat.</p>\n<h2>Kampagnenbezug</h2>\n<p>Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei <a href=\"#/artikel/styke\">Styke</a>, nicht bei <a href=\"#/artikel/valeria\">Valeria</a>.</p>\n","sources":["common","valeria","valsheet"],"status":"Allgemeinwissen","tags":["Orden","Mitra"],"aliases":[],"text":"Öffentliches Bild Der Orden soll Recht verteidigen, Schwache schützen und Gerechtigkeit üben. Nicht nur Adlige können aufgenommen werden. Nicht jeder Ritter ist ein Paladin, auch wenn der Orden viele hervorgebracht hat. Kampagnenbezug Dame Balina gehörte zu dieser ritterlichen Welt. Ihre Glaubenskrise hat die frühere Ausbildung und Verantwortung nicht ausgelöscht. Das silberne Saphir-Symbol des Ordens befindet sich heute bei Styke , nicht bei Valeria .","links":["styke","valeria"],"backlinks":[],"search":"die ritter des alerion mitranischer ritterorden und valerias fruhere institutionelle heimat orden mitra offentliches bild der orden soll recht verteidigen schwache schutzen und gerechtigkeit uben nicht nur adlige konnen aufgenommen werden nicht jeder ritter ist ein paladin auch wenn der orden viele hervorgebracht hat kampagnenbezug dame balina gehorte zu dieser ritterlichen welt ihre glaubenskrise hat die fruhere ausbildung und verantwortung nicht ausgeloscht das silberne saphir symbol des ordens befindet sich heute bei styke nicht bei valeria"},{"id":"merrie-men","category":"gruppen","title":"Ye Merrie Men","summary":"Reisende Theatertruppe mit einer angekündigten Festungsaufführung.","body":"<h2>Gelegenheit</h2>\n<p>William Marcus Marlowes Truppe soll <em>The Fall of Amberlyn</em> in Balentyne spielen. Bellams Bericht macht die Aufführung zu einer bekannten möglichen Gelegenheit für legitime Bewegung in die Festung.</p>\n<h2>Noch offen</h2>\n<p>Datum, Uhrzeit, Einlass, Besetzung und Ablauf wurden nicht sicher festgelegt. Ein Termin wird hier nicht aus dem gedruckten Abenteuer als bereits bekannt eingesetzt.</p>\n","sources":["core","chronicle","live"],"status":"Berichtet","tags":["Theater","Offene Gelegenheit"],"aliases":["The Fall of Amberlyn"],"text":"Gelegenheit William Marcus Marlowes Truppe soll The Fall of Amberlyn in Balentyne spielen. Bellams Bericht macht die Aufführung zu einer bekannten möglichen Gelegenheit für legitime Bewegung in die Festung. Noch offen Datum, Uhrzeit, Einlass, Besetzung und Ablauf wurden nicht sicher festgelegt. Ein Termin wird hier nicht aus dem gedruckten Abenteuer als bereits bekannt eingesetzt.","links":[],"backlinks":["marlowe","zeit-0127"],"search":"ye merrie men reisende theatertruppe mit einer angekundigten festungsauffuhrung th n wissen jedes einzelnen kriegers uber alle plane thorns abgeleitet"},{"id":"styke-schwert","category":"gegenstaende","title":"Stykes Großschwert +1","summary":"Hauptwaffe, Handwerksbezug und ein kleines Bindeglied zu Barnabus.","body":"<h2>Mechanik</h2>\n<p>Mit <a href=\"#/artikel/the-caged-sun\">The Caged Sun</a>: +10 Angriff, 2d6+7 Schaden, 19-20/x2. Mit standardmäßigem Power Attack: +8, 2d6+13. Temporäre Boni aus Aid, Zeal und Manövern kommen gesondert dazu. Deadly Agility nutzt hier die vereinbarte zweihändige DEX-Schadensregel.</p>\n<h2>Geschichte und aktueller Ort</h2>\n<p>Barnabus respektierte seine Verarbeitung. <a href=\"#/artikel/styke\">Styke</a> hat das Schwert am Morgen des 1. Februar ausdrücklich angelegt. Es ist weder ein gewöhnliches Großschwert noch die Meisterarbeit Valerias.</p>\n","sources":["ssheet","srules","core","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Mechanik Mit The Caged Sun : +10 Angriff, 2d6+7 Schaden, 19-20/x2. Mit standardmäßigem Power Attack: +8, 2d6+13. Temporäre Boni aus Aid, Zeal und Manövern kommen gesondert dazu. Deadly Agility nutzt hier die vereinbarte zweihändige DEX-Schadensregel. Geschichte und aktueller Ort Barnabus respektierte seine Verarbeitung. Styke hat das Schwert am Morgen des 1. Februar ausdrücklich angelegt. Es ist weder ein gewöhnliches Großschwert noch die Meisterarbeit Valerias.","links":["the-caged-sun","styke"],"backlinks":["barnabus"],"search":"stykes grossschwert 1 hauptwaffe handwerksbezug und ein kleines bindeglied zu barnabus styke mechanik mit the caged sun 10 angriff 2d6 7 schaden 19 20 x2 mit standardmassigem power attack 8 2d6 13 temporare boni aus aid zeal und manovern kommen gesondert dazu deadly agility nutzt hier die vereinbarte zweihandige dex schadensregel geschichte und aktueller ort barnabus respektierte seine verarbeitung styke hat das schwert am morgen des 1 februar ausdrucklich angelegt es ist weder ein gewohnliches grossschwert noch die meisterarbeit valerias"},{"id":"valeria-schwert","category":"gegenstaende","title":"Valerias Meisterarbeits-Großschwert","summary":"Aktuelle schwere Waffe. Kein automatisch wiederhergestelltes Langschwert.","body":"<h2>Mechanik</h2>\n<p>+11 Angriff und 2d6+7 Schaden; mit Power Attack +9 und 2d6+13. Weapon Training (Heavy Blades) greift, die geerbten Langschwert-Talente Weapon Focus und Weapon Specialization dagegen nicht.</p>\n<h2>Kontinuität</h2>\n<p>Das Großschwert ist aktuell gesetzt. Ein alter Quellenblock fügt weder das frühere Langschwert noch den alten Schild ohne neues Spiel wieder hinzu.</p>\n","sources":["valsheet"],"status":"Im Besitz","tags":["Valeria"],"aliases":[],"text":"Mechanik +11 Angriff und 2d6+7 Schaden; mit Power Attack +9 und 2d6+13. Weapon Training (Heavy Blades) greift, die geerbten Langschwert-Talente Weapon Focus und Weapon Specialization dagegen nicht. Kontinuität Das Großschwert ist aktuell gesetzt. Ein alter Quellenblock fügt weder das frühere Langschwert noch den alten Schild ohne neues Spiel wieder hinzu.","links":[],"backlinks":[],"search":"valerias meisterarbeits grossschwert aktuelle schwere waffe kein automatisch wiederhergestelltes langschwert valeria mechanik 11 angriff und 2d6 7 schaden mit power attack 9 und 2d6 13 weapon training heavy blades greift die geerbten langschwert talente weapon focus und weapon specialization dagegen nicht kontinuitat das grossschwert ist aktuell gesetzt ein alter quellenblock fugt weder das fruhere langschwert noch den alten schild ohne neues spiel wieder hinzu"},{"id":"mithral-ausruestung","category":"gegenstaende","title":"Mithralkettenhemden und Mithralschild","summary":"Das aktuelle Schutzpaket von Styke und Vesper.","body":"<h2>Styke</h2>\n<p>Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +4, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt.</p>\n<h2>Vesper</h2>\n<p>Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 20, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt.</p>\n","sources":["ssheet","vsheet","live"],"status":"Im Besitz","tags":["Styke / Vesper"],"aliases":[],"text":"Styke Maßgefertigtes Mithralkettenhemd: Rüstungsbonus +4, maximale DEX +6, ACP 0. Am aktuellen Morgen angelegt. Vesper Maßgefertigtes Mithralkettenhemd und Mithral Heavy Shield. Ihr dokumentierter ausgerüsteter AC-Wert ist 20, mit Sidestep Secret. Ausgerüstete Regelwerte sind nicht die Behauptung, dass sie jede Arbeitshandlung mit erhobenem Schild ausführt.","links":[],"backlinks":[],"search":"mithralkettenhemden und mithralschild das aktuelle schutzpaket von styke und vesper styke vesper styke massgefertigtes mithralkettenhemd rustungsbonus 4 maximale dex 6 acp 0 am aktuellen morgen angelegt vesper massgefertigtes mithralkettenhemd und mithral heavy shield ihr dokumentierter ausgerusteter ac wert ist 20 mit sidestep secret ausgerustete regelwerte sind nicht die behauptung dass sie jede arbeitshandlung mit erhobenem schild ausfuhrt"},{"id":"valeria-platte","category":"gegenstaende","title":"Valerias Plattenrüstung","summary":"Etablierter Rüstungstyp, mit noch offenem Kauf-/Meisterarbeitsdetail.","body":"<h2>Sicherer Regelstand</h2>\n<p>Full-Plate-Rüstungsbonus +9; mit DEX +1 AC 20 ohne geführten Schild, Touch 11, Flat-Footed 19. Der Bogen nennt 20 ft Bewegung in Platte.</p>\n<h2>Offener Punkt</h2>\n<p>Der exakte Meisterarbeits- und Kaufstatus ist nicht vollständig festgelegt. Rüstungsmalus-sensitive Werte wie Ride sollen bei genauer Anwendung abgeglichen werden. Die vorhandenen Zahlen werden nicht stillschweigend neu berechnet.</p>\n<p>Am letzten Morgenstand schläft <a href=\"#/artikel/valeria\">Valeria</a> im Bett; die Rüstung ist kein angelegter Schlafzustand.</p>\n","sources":["valsheet","live"],"status":"Im Besitz","tags":["Valeria"],"aliases":[],"text":"Sicherer Regelstand Full-Plate-Rüstungsbonus +9; mit DEX +1 AC 20 ohne geführten Schild, Touch 11, Flat-Footed 19. Der Bogen nennt 20 ft Bewegung in Platte. Offener Punkt Der exakte Meisterarbeits- und Kaufstatus ist nicht vollständig festgelegt. Rüstungsmalus-sensitive Werte wie Ride sollen bei genauer Anwendung abgeglichen werden. Die vorhandenen Zahlen werden nicht stillschweigend neu berechnet. Am letzten Morgenstand schläft Valeria im Bett; die Rüstung ist kein angelegter Schlafzustand.","links":["valeria"],"backlinks":[],"search":"valerias plattenrustung etablierter rustungstyp mit noch offenem kauf meisterarbeitsdetail valeria sicherer regelstand full plate rustungsbonus 9 mit dex 1 ac 20 ohne gefuhrten schild touch 11 flat footed 19 der bogen nennt 20 ft bewegung in platte offener punkt der exakte meisterarbeits und kaufstatus ist nicht vollstandig festgelegt rustungsmalus sensitive werte wie ride sollen bei genauer anwendung abgeglichen werden die vorhandenen zahlen werden nicht stillschweigend neu berechnet am letzten morgenstand schlaft valeria im bett die rustung ist kein angelegter schlafzustand"},{"id":"cloaks","category":"gegenstaende","title":"Cloaks of Resistance +1","summary":"Die aktuellen Widerstandsumhänge sind in den Rettungswürfen eingerechnet.","body":"<h2>Träger</h2>\n<p><a href=\"#/artikel/styke\">Styke</a>, <a href=\"#/artikel/vesper\">Vesper</a> und <a href=\"#/artikel/valeria\">Valeria</a> besitzen im aktuellen Bogen jeweils einen Cloak of Resistance +1. Der Bonus ist bereits in ihren ausgewiesenen Saves enthalten.</p>\n<h2>Kein Doppelbonus</h2>\n<p>Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.</p>\n","sources":["ssheet","vsheet","valsheet"],"status":"Im Besitz","tags":["Kerntrio"],"aliases":[],"text":"Träger Styke , Vesper und Valeria besitzen im aktuellen Bogen jeweils einen Cloak of Resistance +1. Der Bonus ist bereits in ihren ausgewiesenen Saves enthalten. Kein Doppelbonus Ein zweites Addieren auf die Tabellenwerte würde denselben Gegenstand doppelt anrechnen. Ob ein Kleidungsstück in einer konkreten Szene angelegt ist, bleibt eine Frage des tatsächlichen Zustands.","links":["styke","vesper","valeria"],"backlinks":[],"search":"cloaks of resistance 1 die aktuellen widerstandsumhange sind in den rettungswurfen eingerechnet kerntrio trager styke vesper und valeria besitzen im aktuellen bogen jeweils einen cloak of resistance 1 der bonus ist bereits in ihren ausgewiesenen saves enthalten kein doppelbonus ein zweites addieren auf die tabellenwerte wurde denselben gegenstand doppelt anrechnen ob ein kleidungsstuck in einer konkreten szene angelegt ist bleibt eine frage des tatsachlichen zustands"},{"id":"stirnreif","category":"gegenstaende","title":"Thorns eiserne Stirnreife","summary":"Etablierte Tarnhilfe. Eine neue Verkleidung wird nicht durch bloßen Besitz aktiv.","body":"<h2>Funktion</h2>\n<p><a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung.</p>\n<h2>Bisheriger Gebrauch</h2>\n<p>Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.</p>","sources":["live","ssheet","vsheet"],"status":"Im Besitz","tags":["Styke / Vesper"],"aliases":["Circlet","Iron Circlet"],"text":"Funktion Styke und Vesper besitzen Thorns eiserne Stirnreife. Sie verändern das äußere Erscheinungsbild und ergänzen die Verschleierung des martialischen Eindrucks ihrer Ausrüstung. Bisheriger Gebrauch Styke nutzte die Stirnreife bei seinen Einkäufen am 31. Januar für wechselnde Erscheinungen. Seither gehört sie weiter zur verfügbaren Tarn- und Infiltrationsausrüstung des Nessischen Knotens.","links":["styke","vesper"],"backlinks":[],"search":"thorns eiserne stirnreife etablierte tarnhilfe eine neue verkleidung wird nicht durch blossen besitz aktiv circlet iron circlet styke vesper funktion styke und vesper besitzen thorns eiserne stirnreife sie verandern das aussere erscheinungsbild und erganzen die verschleierung des martialischen eindrucks ihrer ausrustung bisheriger gebrauch styke nutzte die stirnreife bei seinen einkaufen am 31 januar fur wechselnde erscheinungen seither gehort sie weiter zur verfugbaren tarn und infiltrationsausrustung des nessischen knotens"},{"id":"alerion-symbol","category":"gegenstaende","title":"Silber-Saphir-Symbol des Alerion","summary":"Valerias früheres Ordenssymbol befindet sich bei Styke.","body":"<h2>Eigentums- und Beziehungsbezug</h2>\n<p>Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei <a href=\"#/artikel/styke\">Styke</a> und nicht in Valerias Ausrüstung.</p>\n<h2>Keine erfundene Funktion</h2>\n<p>Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.</p>\n","sources":["valsheet","ssheet","live"],"status":"Im Besitz","tags":["Styke"],"aliases":[],"text":"Eigentums- und Beziehungsbezug Das silberne Symbol mit Saphir gehört zur Geschichte der Ritterin Balina. Aktuell befindet es sich bei Styke und nicht in Valerias Ausrüstung. Keine erfundene Funktion Eine zusätzliche magische Wirkung oder ein inzwischen vollzogener Rückgabeakt ist nicht etabliert. Der Gegenstand bleibt zugleich Erinnerungsstück und materieller Kontinuitätspunkt.","links":["styke"],"backlinks":[],"search":"silber saphir symbol des alerion valerias fruheres ordenssymbol befindet sich bei styke styke eigentums und beziehungsbezug das silberne symbol mit saphir gehort zur geschichte der ritterin balina aktuell befindet es sich bei styke und nicht in valerias ausrustung keine erfundene funktion eine zusatzliche magische wirkung oder ein inzwischen vollzogener ruckgabeakt ist nicht etabliert der gegenstand bleibt zugleich erinnerungsstuck und materieller kontinuitatspunkt"},{"id":"nessian-siegel","category":"gegenstaende","title":"Nessianisches Kontaktsiegel","summary":"Noch intakte Kontaktmöglichkeit zu Tiadora für ernste Meldungen.","body":"<h2>Etablierte Anwendung</h2>\n<p>Das Siegel kann für eine ernsthafte Meldung oder Missionsnotwendigkeit gebrochen werden. Erwartet wird Tiadoras Eintreffen am Bruchort gewöhnlich innerhalb von etwa ein bis zwei Stunden.</p>\n<h2>Stand</h2>\n<p>Es ist gemeinsamer Missionsbesitz und nicht als bereits gebrochen verbucht. Der intern erwogene Angriffstermin wurde dadurch noch nicht weitergegeben.</p>\n","sources":["core","factions","live"],"status":"Im Besitz","tags":["Gruppe"],"aliases":[],"text":"Etablierte Anwendung Das Siegel kann für eine ernsthafte Meldung oder Missionsnotwendigkeit gebrochen werden. Erwartet wird Tiadoras Eintreffen am Bruchort gewöhnlich innerhalb von etwa ein bis zwei Stunden. Stand Es ist gemeinsamer Missionsbesitz und nicht als bereits gebrochen verbucht. Der intern erwogene Angriffstermin wurde dadurch noch nicht weitergegeben.","links":[],"backlinks":["tiadora"],"search":"nessianisches kontaktsiegel noch intakte kontaktmoglichkeit zu tiadora fur ernste meldungen gruppe etablierte anwendung das siegel kann fur eine ernsthafte meldung oder missionsnotwendigkeit gebrochen werden erwartet wird tiadoras eintreffen am bruchort gewohnlich innerhalb von etwa ein bis zwei stunden stand es ist gemeinsamer missionsbesitz und nicht als bereits gebrochen verbucht der intern erwogene angriffstermin wurde dadurch noch nicht weitergegeben"},{"id":"varning-schluessel","category":"gegenstaende","title":"Varnings kleiner Schlüssel","summary":"Von Styke behalten; passendes Schloss bisher nicht identifiziert.","body":"<h2>Herkunft</h2>\n<p>Beute aus der Operation an Freeman's Rock. Die auffällige größere Ausrüstung wurde außerhalb Aldencross' versteckt, den kleinen Schlüssel be tspur verwendet. Preis, Restmenge und heutiger Träger sind nicht exakt gesichert. Dass Franz daraus bereits die gewünschte Schlussfolgerung zog, ist unbekannt.","links":["styke"],"backlinks":[],"search":"wein und duftol vom 31 januar tatsachliche beschaffungen mit getrennten verwendungszwecken verschiedene wein styke besorgte bei bellam wein und brachte ihn zum tacitus treffen jacobian sagte nach den beschwerden er werde tacitus dieselbe flasche nicht noch einmal servieren eine analyse oder entsorgung ist nicht belegt duftol das vor dem kaitlyn besuch gekaufte ol wurde fur die beabsichtigte duftspur verwendet preis restmenge und heutiger trager sind nicht exakt gesichert dass franz daraus bereits die gewunschte schlussfolgerung zog ist unbekannt"},{"id":"dornpakt","category":"fakten","title":"Der Dornpakt","summary":"Angenommene Bindung von Styke und Vesper an Thorns Verschwörung.","body":"<h2>Gesicherte Bedeutung</h2>\n<p>Thorn rekrutierte <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt.</p>\n<h2>Nicht mit jedem anderen Pakt gleichsetzen</h2>\n<p>Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.</p>\n","sources":["chronicle","core","relations"],"status":"Bestätigt","tags":["Vertrag"],"aliases":["Pact of Thorns"],"text":"Gesicherte Bedeutung Thorn rekrutierte Styke und Vesper nach Branderscar und band sie durch den Pact of Thorns. Im infernalen Autoritätsrahmen steht Asmodeus über Thorn, der als weltlicher Vorgesetzter und Auftraggeber wirkt. Nicht mit jedem anderen Pakt gleichsetzen Valerias privater Vertrag und Tamsins Blutpakt sind eigene Bindungen. Ihre Teilnehmer und Hierarchien dürfen nicht zusammengezogen werden. Ein nicht vorliegender Vertragsvolltext wird hier nicht aus Gedächtnis ergänzt.","links":["styke","vesper"],"backlinks":["thorn","story-so-far"],"search":"der dornpakt angenommene bindung von styke und vesper an thorns verschworung pact of thorns vertrag gesicherte bedeutung thorn rekrutierte styke und vesper nach branderscar und band sie durch den pact of thorns im infernalen autoritatsrahmen steht asmodeus uber thorn der als weltlicher vorgesetzter und auftraggeber wirkt nicht mit jedem anderen pakt gleichsetzen valerias privater vertrag und tamsins blutpakt sind eigene bindungen ihre teilnehmer und hierarchien durfen nicht zusammengezogen werden ein nicht vorliegender vertragsvolltext wird hier nicht aus gedachtnis erganzt"},{"id":"privatpakt","category":"fakten","title":"Valerias Privatpakt","summary":"Asmodeus zuerst, Styke und Vesper als sterbliche Autoritäten. Timeon ist kein Vertragspartner.","body":"<h2>Inhalt</h2>\n<p><a href=\"#/artikel/valeria\">Valeria</a> nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. <a href=\"#/artikel/timeon\">Timeon</a> ist kein Vertragspartner.</p>\n<h2>Der Streit um Timeon</h2>\n<p>Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen.</p>\n<h2>Mechanik</h2>\n<p>Valerias aktueller Stand bleibt <strong>Fighter 5</strong>. Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.</p>","sources":["valeria","relations","live","house"],"status":"Bestätigt","tags":["Vertrag","Valeria"],"aliases":[],"text":"Inhalt Valeria nahm nach der Ausbildung einen privaten Pakt an. Asmodeus steht darin an erster Stelle; Styke und Vesper sind die sterblichen Autoritäten. Thorn ist in diesem Dokument kein direkter Vorgesetzter. Timeon ist kein Vertragspartner. Der Streit um Timeon Am 31. Januar befolgte Valeria Stykes Befehl, nicht zu Timeon zurückzukehren. Sie bestritt zugleich, dass dieser Befehl festlegen könne, was ihr noch wichtig ist oder welche Pflichten Balinas in ihr fortbestehen. Mechanik Valerias aktueller Stand bleibt Fighter 5 . Der Pakt enthält keinen bereits vollzogenen Klassenwechsel.","links":["valeria","styke","vesper","timeon"],"backlinks":["timeon","story-so-far","zeit-ausbildung"],"search":"valerias privatpakt asmodeus zuerst styke und vesper als sterbliche autoritaten timeon ist kein vertragspartner vertrag valeria inhalt valeria nahm nach der ausbildung einen privaten pakt an asmodeus steht darin an erster stelle styke und vesper sind die sterblichen autoritaten thorn ist in diesem dokument kein direkter vorgesetzter timeon ist kein vertragspartner der streit um timeon am 31 januar befolgte valeria stykes befehl nicht zu timeon zuruckzukehren sie bestritt zugleich dass dieser befehl festlegen konne was ihr noch wichtig ist oder welche pflichten balinas in ihr fortbestehen mechanik valerias aktueller stand bleibt fighter 5 der pakt enthalt keinen bereits vollzogenen klassenwechsel"},{"id":"bekannt-unbekannt","category":"fakten","title":"Was wir wissen. Was nicht.","summary":"Der sichere Wissensstand in der Nacht zum 4. Februar: Mirelle ist im Dalliance, Nella und Tamsin sind unterwegs, Tacitus ist eingeladen.","body":"<h2>Sicher</h2><ul><li>Darran Vell und seine vier verlässlichen Leute sind tot; drei seiner Pferde wurden für 120 gp verkauft, das vierte trägt Tamsin.</li><li>Nella und Tamsin brachen am Morgen des 3. Februar mit Pferden, Vorräten und Stykes Auftrag auf.</li><li>Zwei schwere Ketten sind im Dalliance-Tunnel montiert.</li><li>Vier Päckchen Rattengift liegen unbenutzt im Dalliance-Zimmer.</li><li>Tacitus ist über Jacobian für den 8. Februar gegen 20 Uhr ins Dalliance eingeladen.</li><li>Mirelle fertigt zwei neue Maßarbeiten und schläft in dieser Nacht bei Styke, Vesper und Valeria.</li></ul>\n<h2>Offen</h2><ul><li>Die genaue Wirkung des Rattengifts im großen Eintopf.</li><li>Der gegenwärtige Ort von Nella und Tamsin, Hakons Antwort und der Ausgang des Familiengesprächs.</li><li>Tacitus’ Antwort und eine sichere Methode für ihre mögliche Gefangennahme.</li><li>Kaitlyns nächster Treffpunkt.</li><li>Fertigstellung und Preis von Valerias Rüstungsunterzeug und Stykes Unterwäsche.</li><li>Exakte Uhrzeiten und zivile Übergabepunkte für die Angriffsnacht.</li></ul>\n<h2>Fristen</h2><p>Die Mietpferde werden ungefähr am 5. Februar fällig. Nella und Tamsin sollen bis 7. Februar zurückkehren. Tacitus und der Eintopf fallen auf den 8. Februar; der Hauptangriff folgt in der Nacht 8./9. Februar.</p>","sources":["live","timeline","clocks-current","mirelle"],"status":"Aktueller Wissensstand","tags":["Sicher","Offen","Fristen","3. Februar"],"aliases":[],"text":"Sicher Darran Vell und seine vier verlässlichen Leute sind tot; drei seiner Pferde wurden für 120 gp verkauft, das vierte trägt Tamsin. Nella und Tamsin brachen am Morgen des 3. Februar mit Pferden, Vorräten und Stykes Auftrag auf. Zwei schwere Ketten sind im Dalliance-Tunnel montiert. Vier Päckchen Rattengift liegen unbenutzt im Dalliance-Zimmer. Tacitus ist über Jacobian für den 8. Februar gegen 20 Uhr ins Dalliance eingeladen. Mirelle fertigt zwei neue Maßarbeiten und schläft in dieser Nacht bei Styke, Vesper und Valeria. Offen Die genaue Wirkung des Rattengifts im großen Eintopf. Der gegenwärtige Ort von Nella und Tamsin, Hakons Antwort und der Ausgang des Familiengesprächs. Tacitus’ Antwort und eine sichere Methode für ihre mögliche Gefangennahme. Kaitlyns nächster Treffpunkt. Fertigstellung und Preis von Valerias Rüstungsunterzeug und Stykes Unterwäsche. Exakte Uhrzeiten und zivile Übergabepunkte für die Angriffsnacht. Fristen Die Mietpferde werden ungefähr am 5. Februar fällig. Nella und Tamsin sollen bis ar erneut in Balentyne. Zählung und Begleitung waren strenger als zuvor. Ihre Deckung hielt, doch sie bekam weder einen Dienstplan noch eine sichere Identifizierung Zacks.</p>\n<h2>Weiter offen</h2><p>Sein Verhältnis mit Kaitlyn ist durch die Briefe belegt. Aufenthaltsplan, verwertbare Routine und eine kontrollierte Konfrontation mit Franz sind weiterhin nicht vorbereitet.</p>","sources":["live","chronicle","timeline"],"status":"Ergebnislos / weiter offen","tags":["Zack","Kaitlyn","Balentyne"],"aliases":[],"text":"Ergebnis des Arbeiterwegs Vesper gelangte am 1. Februar erneut in Balentyne. Zählung und Begleitung waren strenger als zuvor. Ihre Deckung hielt, doch sie bekam weder einen Dienstplan noch eine sichere Identifizierung Zacks. Weiter offen Sein Verhältnis mit Kaitlyn ist durch die Briefe belegt. Aufenthaltsplan, verwertbare Routine und eine kontrollierte Konfrontation mit Franz sind weiterhin nicht vorbereitet.","links":[],"backlinks":[],"search":"zacks dienstplane und identifizierung vespers arbeiterzugang am 1 februar hielt brachte aber weder zacks dienstplan noch eine sichere sichtung zack kaitlyn balentyne ergebnis des arbeiterwegs vesper gelangte am 1 februar erneut in balentyne zahlung und begleitung waren strenger als zuvor ihre deckung hielt doch sie bekam weder einen dienstplan noch eine sichere identifizierung zacks weiter offen sein verhaltnis mit kaitlyn ist durch die briefe belegt aufenthaltsplan verwertbare routine und eine kontrollierte konfrontation mit franz sind weiterhin nicht vorbereitet"},{"id":"zwergen-plan","category":"vorhaben","title":"Zwergenroutinen und Torhaus","summary":"Bisher gewonnene Mechanikinformation ist nicht dasselbe wie eine abgeschlossene Ausfallplanung.","body":"<h2>Bekannt</h2>\n<p>Barnabus plus zehn Arbeiter wohnen im Dalliance. Das zweite Torhausgeschoss enthält getrennte Winden für Brücke und Gatter; dort sind vier Wachen und tagsüber vier Ingenieure.</p>\n<h2>Geplant</h2>\n<p><a href=\"#/artikel/valeria\">Valeria amsin tragen die Nachricht zur Feldgruppe.","body":"<h2>Termin</h2><p>Sofern Styke und Vesper nichts ändern, beginnt die Hauptaktion in der Nacht vom 8. auf den 9. Februar. Der große Eintopf am 8. Februar soll vorher einen Teil der Garnison schwächen.</p>\n<h2>Hakon und Grumblejack</h2><p>Hakon und seine fünf Männer sollen in getrennten Paaren nach Aldencross kommen. Die sieben erbeuteten Pferde bleiben außerhalb. Erst wenn die Männer stehen, erzeugt Grumblejack an einem von Hakon gewählten abgelegenen Hof eine sichtbare Bedrohung und zieht sich danach zurück.</p>\n<h2>Tunnel und Reserve</h2><p>Hakons Gruppe dient als Reserve, Wache und Evakuierungshilfe am Dalliance-Tunnel. Sie soll nicht eigenmächtig durch Balentyne stürmen. Der Zugang bleibt frei; das ferne Tor ist Notlösung.</p>\n<h2>Zivilisten</h2><p>Mara und Ellyn sollen möglichst vor dem Angriff außerhalb Balentynes bleiben. Kaitlyn benötigt eine vorherige Vereinbarung. Niemand wird während des Angriffs in brennenden Straßen gesucht.</p>\n<h2>Nachricht unterwegs</h2><p>Nella und Tamsin brachen am 3. Februar mit dem für ihren Botengang bestimmten Wortlaut auf. Styke, Vesper und Valeria warten auf ihre Rückkehr oder einen glaubwürdigen Boten, bevor sie Hakons Kenntnis des Termins als bestätigt behandeln.</p>","sources":["live","chronicle","timeline","clocks-current"],"status":"Termin gewählt / Rückmeldung offen","tags":["8./9. Februar","Hakon","Tunnel","Balentyne"],"aliases":[],"text":"Termin Sofern Styke und Vesper nichts ändern, beginnt die Hauptaktion in der Nacht vom 8. auf den 9. Februar. Der große Eintopf am 8. Februar soll vorher einen Teil der Garnison schwächen. Hakon und Grumblejack Hakon und seine fünf Männer sollen in getrennten Paaren nach Aldencross kommen. Die sieben erbeuteten Pferde bleiben außerhalb. Erst wenn die Männer stehen, erzeugt Grumblejack an einem von Hakon gewählten abgelegenen Hof eine sichtbare Bedrohung und zieht sich danach zurück. Tunnel und Reserve Hakons Gruppe dient als Rese ":"vorhaben","title":"Weitere offene Spuren","summary":"Nella und Tamsin unterwegs, Mietpferde fällig, Tacitus eingeladen sowie Kaitlyn, Gift und Mirelles Maßarbeiten offen.","body":"<h2>Nella und Tamsin</h2><p>Seit ihrem Aufbruch am Morgen des 3. Februar fehlt eine Nachricht. Hakon, Nellas Schwester und der Rückweg bleiben für die Aldencross-Gruppe außerhalb des Blicks; Rückkehrfrist ist der 7. Februar.</p>\n<h2>Pferdemiete</h2><p>Die kleinere graue Mietstute ist mit Nella unterwegs, zwei weitere Mietpferde stehen in Aldencross. Die Dreitagesmiete wird ungefähr am 5. Februar fällig.</p>\n<h2>Tacitus und Kaitlyn</h2><p>Tacitus ist für den 8. Februar gegen 20 Uhr eingeladen, hat aber noch nicht geantwortet. Kaitlyn hat weiterhin keinen neuen Treffpunkt erhalten.</p>\n<h2>Mirelles Arbeit</h2><p>Valerias Rüstungsunterzeug und Stykes Unterwäsche sind begonnen; Maße, Abschluss und Preis müssen noch geklärt werden.</p>\n<h2>Mechanische Lücken</h2><p>Dosis und Großkesselwirkung des Rattengifts, sichere Verwahrung einer zauberkundigen Gefangenen und mehrere genaue Angriffsuhrzeiten sind noch nicht adjudiziert.</p>","sources":["live","chronicle","timeline","clocks-current","mirelle"],"status":"Mehrere Fäden offen","tags":["Nella","Tacitus","Kaitlyn","Pferde","Mirelle"],"aliases":[],"text":"Nella und Tamsin Seit ihrem Aufbruch am Morgen des 3. Februar fehlt eine Nachricht. Hakon, Nellas Schwester und der Rückweg bleiben für die Aldencross-Gruppe außerhalb des Blicks; Rückkehrfrist ist der 7. Februar. Pferdemiete Die kleinere graue Mietstute ist mit Nella unterwegs, zwei weitere Mietpferde stehen in Aldencross. Die Dreitagesmiete wird ungefähr am 5. Februar fällig. Tacitus und Kaitlyn Tacitus ist für den 8. Februar gegen 20 Uhr eingeladen, hat aber noch nicht geantwortet. Kaitlyn hat weiterhin keinen neuen Treffpunkt erhalten. Mirelles Arbeit Valerias Rüstungsunterzeug und Stykes Unterwäsche sind begonnen; Maße, Abschluss und Preis müssen noch geklärt werden. Mechanische Lücke Tamsin</a> brachen am Morgen zu Hakon und Nellas Familie auf. Ihre Rückkehrfrist ist der 7. Februar.</li><li>Styke verkaufte drei von Darran Vells Pferden für 120 gp. Das vierte trägt Tamsin.</li><li>Über Jacobian lud Styke <a href=\"#/artikel/tacitus\">Tacitus</a> für den 8. Februar gegen 20 Uhr ins Dalliance ein. Eine Antwort liegt noch nicht vor.</li><li>Vesper und Valeria kauften Schuhe; Vesper zusätzlich ein schmales schwarzes Haarband.</li><li>Bei Mirelle wurden vier fertige Wäschestücke gekauft und zwei Maßarbeiten begonnen.</li><li>Im Schankraum begann eine Wette über eine rothaarige verheiratete Frau. Styke schrieb ohne Beleg Zack Eddarlys Namen an die Tafel.</li></ul>\n<h2>Bestände und Fristen</h2><p>Vier Päckchen Rattengift liegen weiterhin versteckt. Die drei am 2. Februar gemieteten Pferde werden ungefähr am 5. Februar fällig; Nella reitet die kleinere graue Mietstute, zwei Mietpferde stehen bei der Aldencross-Gruppe. Der große Eintopf bleibt für den 8. Februar vorgesehen, der Hauptangriff für die Nacht vom 8. auf den 9. Februar.</p>\n<h2>Unterwegs</h2><p>Nella führt den Hakon- und Familienauftrag, Tamsin schützt sie. Styke, Vesper und Valeria kennen seit dem Aufbruch weder ihren erreichten Ort noch den Ausgang ihrer Gespräche.</p>","sources":["live","chronicle","timeline","clocks-current","dalliance","mirelle"],"status":"Aktueller Snapshot","tags":["3. Februar","Lord’s Dalliance","Mirelle","Nella","Tamsin"],"aliases":[],"text":"Ort und Zeit Nacht vom 3. auf den 4. Februar 4712 AR, ungefähr 23:30 bis 01:00. Styke , Vesper , Valeria und Mirelle liegen nach einem langen Abend im rückwärtigen Zimmer des Lord’s Dalliance . Der genaue Mitternachtswechsel ist nicht festgelegt. Der 3. Februar Nella und Tamsin brachen am Morgen zu Hakon und Nellas Familie auf. Ihre Rückkehrfrist ist der 7. Februar. Styke verkaufte drei von Darran Vells Pferden für 120 gp. Das vierte trägt Tamsin. Über Jacobian lud Styke Tacitus für den 8. Februar gegen 20 Uhr ins Dalliance ein. Eine Antwort liegt noch nicht vor. Vesper und Valeria kauften Schuhe; Vesper zusätzlich ein schmales schwarzes Haarband. Bei Mirelle wurden vier fertige Wäschestücke gekauft und zwei Maßarbeiten begonnen. Im Schankraum begann eine Wette über eine rothaarige verheiratete Frau. Styke schrieb ohne Beleg Zack Eddarlys Namen an die Tafel. Bestände und Fristen Vier Päckchen Rattengift liegen weiterhin versteckt. Die drei am 2. Februar gemieteten Pferde werden ungefähr am 5. Februar fällig; Nella reitet die kleinere graue Mietstute, zwei Mietpferde stehen bei der Aldencross-Gruppe. Der große Eintopf bleibt für den 8. Februar vorgesehen, der Hauptangriff für die Nacht vom 8. auf den 9. Februar. Unterwegs Nella führt den Hakon- und Familienauftrag, Tamsin schützt sie. Styke, Vesper und Valeria kennen seit dem Aufbruch weder ihren erreichten Ort noch den Ausgang ihrer Gespräche.","search":"der aktuelle spielstand nacht vom 3 auf den 4 februar im lord s dalliance nella und tamsin sind unterwegs tacitus ist eingeladen und mirelle schlaft im ruckwartigen zimmer 3 februar lord s dalliance mirelle nella tamsin ort und zeit nacht vom 3 auf den 4 februar 4712 ar ungefahr 23 30 bis 01 00 styke vesper valeria und mirelle liegen nach einem langen abend im ruckwartigen zimmer des lord s dalliance der genaue mitternachtswechsel ist nicht festgelegt der 3 februar nella und tamsin brachen am morgen zu hakon und nellas familie auf ihre ruckkehrfrist ist der 7 februar styke verkaufte drei von darran vells pferden fur 120 gp das vierte tragt tamsin uber jacobian lud styke tacitus fur den 8 februar gegen 20 uhr ins dalliance ein eine antwort liegt noch nicht vor vesper und valeria kauften schuhe vesper zusatzlich ein schmales schwarzes haarband bei mirelle wurden vier fertige waschestucke gekauft und zwei massarbeiten begonnen im schankraum begann eine wette uber eine rothaarige verheiratete frau styke schrieb ohne beleg zack eddarlys namen an die tafel bestande und fristen vier packchen rattengift liegen weiterhin versteckt die drei am 2 februar gemieteten pferde werden ungefahr am 5 februar fallig nella reitet die kleinere graue mietstute zwei mietpferde stehen bei der aldencross gruppe der grosse eintopf bleibt fur den 8 februar vorgesehen der hauptangriff fur die nacht vom 8 auf den 9 februar unterwegs nella fuhrt den hakon und familienauftrag tamsin schutzt sie styke vesper und valeria kennen seit dem aufbruch weder ihren erreichten ort noch den ausgang ihrer gesprache","links":["styke","vesper","valeria","mirelle","dalliance","nella","tamsin","tacitus"],"backlinks":["bogen-styke","bogen-vesper","bogen-valeria"]},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Von Branderscar bis zur Nacht vom 3. auf den 4. Februar: Der Knoten ist nach Aldencross zurückgekehrt, während Nella und Tamsin unterwegs sind.","body":"<h2>I. Die Verurteilten von Branderscar</h2>\n<p>Die Geschichte begann für <a href=\"#/artikel/styke\">Styke</a> und <a href=\"#/artikel/vesper\">Vesper</a> nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in <a href=\"#/artikel/branderscar\">Branderscar</a>. Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, <a href=\"#/artikel/verse\">Verse</a> zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt.</p>\n<p><a href=\"#/artikel/tiadora\">Tiadora</a> öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten <a href=\"#/artikel/verse\">Verse</a> zurück und befreiten <a href=\"#/artikel/grumblejack\">Grumblejack</a>. Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl <a href=\"#/artikel/tamsin\">Tamsin Blackerly</a> als auch <a href=\"#/artikel/matilda\">Matilda Richter</a> die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet.</p>\n<h2>II. Thorns Haus und der Knoten</h2>\n<p>Der Weg führte zu <a href=\"#/artikel/thorn\">Adrastus Thorn</a>. Der <a href=\"#/artikel/dornpakt\">Pakt der Dornen</a>, die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen.</p>\n<p>Dame Balina und ihr junger Knappe <a href=\"#/artikel/timeon\">Timeon</a> gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen.</p>\n<p>Aus derselben Frau wurde <a href=\"#/artikel/valeria\">Valeria</a>. Sie nahm später einen <a href=\"#/artikel/privatpakt\">Privatpakt</a> an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. <a href=\"#/artikel/timeon\">Timeon</a> blieb außerhalb dieses Pakts. <a href=\"#/artikel/elise\">Elise Zadaria</a> führte ihre <a href=\"#/artikel/white-ravens\">White Ravens</a> währenddessen über eine getrennte Befehlskette.</p>\n<h2>III. Die Fahrt nach Norden</h2>\n<p>Auf der <a href=\"#/artikel/frosthamar\">Frosthamar</a> wurde die Verschwörung praktisch: Waffen mussten zu <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe</a> gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter <a href=\"#/artikel/sambryl\">Edward Sambryl</a>. Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit <a href=\"#/artikel/white-tusk\">White Tusk</a> und den <a href=\"#/artikel/yutak\">Yutak</a> brachte Handel und wertvolles Elfenbein.</p>\n<p>Am <strong>14. Januar 4712 AR</strong> erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt.</p>\n<p><a href=\"#/artikel/odenkirk\">Kargeld Odenkirk</a> starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. <a href=\"#/artikel/hakon\">Hakon</a>, <a href=\"#/artikel/sten\">Sten</a>, <a href=\"#/artikel/ketil\">Ketil</a>, <a href=\"#/artikel/eirik\">Eirik</a>, <a href=\"#/artikel/arved\">Arved</a> und <a href=\"#/artikel/torvald\">Torvald</a> hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit <a href=\"#/artikel/grumblejack\">Grumblejack</a> als freiem Freund.</p>\n<h2>IV. Unter fremdem Dach</h2>\n<p>Am <strong>23. Januar</strong> kamen Styke, Vesper und <a href=\"#/artikel/valeria\">Valeria</a> als freie Händler aus dem Norden nach <a href=\"#/artikel/aldencross\">Aldencross</a>. Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im <a href=\"#/artikel/dalliance\">Lord's Dalliance</a> wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags.</p>\n<p><a href=\"#/artikel/mara\">Mara Fenner</a> und <a href=\"#/artikel/ellyn\">Ellyn Reed</a>, früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung.</p>\n<h2>V. Freeman's Rock</h2>\n<p>Captain <a href=\"#/artikel/varning\">Ryan Varning</a> verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete <a href=\"#/artikel/freemans-rock\">Freeman's Rock</a> und bereitete einen Hinterhalt vor. In der Nacht des <strong>26. Januar</strong> formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an.</p>\n<p>Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem <a href=\"#/artikel/beute-cache\">Versteck</a> außerhalb Aldencross. Varnings kleiner <a href=\"#/artikel/varning-schluessel\">Schlüssel</a> blieb bei Styke; <a href=\"#/artikel/varlet\">Varlet</a> wurde Grumblejacks eigener Anteil.</p>\n<p>Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt.</p>\n<h2>VI. Türen, Briefe und Gewohnheiten</h2>\n<p>Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm.</p>\n<p>In der Nacht <strong>27./28. Januar</strong> entdeckten Styke und Vesper den <a href=\"#/artikel/tunnel\">Zwergengang</a> unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet.</p>\n<p>Am <strong>28. Januar</strong> vermittelte <a href=\"#/artikel/jacobian\">Jacobian Scaramore</a> einen Kontakt zur Magisterin <a href=\"#/artikel/tacitus\">Tacitus</a>. Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig.</p>\n<p>Am selben Tag begann Stykes heimliche Affäre mit <a href=\"#/artikel/kaitlyn\">Kaitlyn Mott</a>. Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu <a href=\"#/artikel/zack\">Zack Eddarly</a> fest. Kaitlyns Ehe mit <a href=\"#/artikel/franz\">Franz Mott</a> wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch.</p>\n<h2>VII. Das Netz wird dichter</h2>\n<p>Vespers Arbeitstage am <strong>29. und 30. Januar</strong> lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. <a href=\"#/artikel/giuseppe\">Mama Giuseppe</a> kocht ihren großen Eintopf wöchentlich; die bekannten Chancen lagen am 1. und 8. Februar. Ein getrenntes Wasserreservoir des Torhauses gehörte ebenfalls zum gewonnenen Wissen.</p>\n<p>Vesper streute unbestimmte Mott-Gerüchte, ohne Namen zu nennen. Valeria gewann am Abend des 30. Januar Informationen über die Mechanismen im Torhaus. Mara berichtete von gewöhnlichen Wintererkrankungen und einem Soldaten mit Darmbeschwerden. Donnagin kümmerte sich um schwerere Fälle. Die Gruppe hatte keine eigene Seuche ausgelöst.</p>\n<p>Zwischen diesen Unternehmungen blieb das gemeinsame Leben widersprüchlich. Valeria sagte, sie könne Styke und Vesper immer noch hassen und zugleich manchmal wirklich neben ihnen sein wollen. Sie plante wieder über den gleichen Abend hinaus. Der Satz beschrieb ihren gegenwärtigen Widerspruch genauer als jedes Bekenntnis.</p>\n<h2>VIII. Der 31. Januar</h2>\n<p>Nun war Varnings Tod in Balentyne bekannt. Zivile Arbeiter mussten mit strengeren Absprachen und Begleitung rechnen. Styke kaufte unter wechselnder Verkleidung Ketten und Beschläge, beschaffte verschiedene Arzneipräparate, Wein und Duftöl. Rattengift kaufte er nicht.</p>\n<p>Kaitlyn erhielt ein ungleiches persönliches Zukunftsangebot. Styke stellte sich vor, sie könne aus eigenem Interesse eine Konfrontation zwischen Franz und Zack fördern und später soziale Kenntnisse für den Knoten einbringen. Das blieb seine Einschätzung. Sie versprach weder Mitarbeit noch Loyalität; die angekündigte Nachricht mit Treffpunkt und Zeit wurde noch nicht gesandt.</p>\n<p>Um <strong>20 Uhr</strong> trafen Styke, Vesper und Verse Tacitus bei Jacobian. Verse sprach über unvollständige Erinnerungen, neue eigene Gedanken und die Möglichkeit, Vesper zu widersprechen. Das Gespräch zeigte mehr als ein reizvolles magisches Objekt. Während einer Ablenkung gab Vesper verdeckt Abführmittel in Tacitus' einzelnes Glas. Die Magisterin musste das Gespräch vorzeitig verlassen. Sie wurde nicht entführt. Jacobian wollte eine etwaige Fortsetzung vermitteln, aber kein zweiter Termin stand fest.</p>\n<p>Valeria kam sehr spät zurück. Sie hatte <a href=\"#/artikel/timeon-hof\">Timeons sicheren Aufenthaltsort</a> persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria.</p>\n<p>Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht <strong>8./9. Februar</strong>, abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an <a href=\"#/artikel/hakon\">Hakon</a> oder Sakkarot übermittelt.</p>\n<h2>IX. Der frühe Morgen des 1. Februar</h2>\n<p>Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu.</p>\n<h2>X. Der 1. Februar</h2>\n<p>Vespers Arbeiterdeckung hielt auch unter verschärfter Zählung. Sie half bei Giuseppes Eintopf, fand aber weder Zack noch Donnagin. Am Abend präzisierte die Gruppe den Plan für den 8./9. Februar. Vesper und Valeria erhielten gemeinsam das Vetorecht über neue Gefolgsleute.</p>\n<p>Sehr spät montierten Styke, Vesper und Valeria zwei schwere Ketten im Tunnel. Zurück im Zimmer fand Vesper im roten Buch einen Absatz, den sie nicht kannte.</p>\n<h2>XI. Die Suche nach Tamsin</h2>\n<p>Am 2. Februar kaufte Styke Rattengift, dann ritten die drei nach Süden. Im namenlosen Mühlenbezirk fanden sie Tamsins Spur bei Darran Vell. Tamsin hatte Timeon sicher abgeliefert, war danach aber für eigenes Geld in Darrans kriminelles Geschäft eingestiegen.</p>\n<p>Styke erzwang zunächst eine Einigung. Vesper entzog Tamsin ihren Rang und setzte sie auf die unterste Stufe des Haushalts zurück. Danach holte die Gruppe Nella aus dem Gasthaus und zeigte ihr, was hinter der Händlerdecke lag.</p>\n<h2>XII. Vells Ende und Nellas Anfang</h2>\n<p>Darran Vell und vier seiner Leute starben in der Byre. Nella sah die Tötung unterlegener Männer, erbrach sich, widersprach Styke und blieb dennoch. Im alten Schafgehege hörte sie den Compact of the Bound, setzte ihr Blut darunter und wurde als Gebundene in den Knoten aufgenommen.</p>\n<p>Ihr erster Auftrag verbindet Hakon mit ihrer eigenen Familie. Bis 7. Februar steht Tamsin unter Nellas begrenzter Einsatzführung und muss sie zugleich beschützen. Der 2. Februar endet im engen Nachtlager. Am Morgen trennen sich ihre Wege.</p>\n<h2>XIII. Der 3. Februar</h2>\n<p>Am Morgen trennten sich die Wege. Nella und Tamsin ritten mit Stykes Nachricht, Vorräten und der Frist bis zum 7. Februar zu Hakon und danach in Richtung von Nellas Familie. Styke, Vesper und Valeria kehrten nach Aldencross zurück.</p>\n<p>Styke verkaufte drei Pferde aus Darran Vells Bestand für 120 gp. Über Jacobian lud er Tacitus für den 8. Februar ins Dalliance ein. Eine neue Wetttafel gab dem Mott-Gerücht erstmals einen öffentlichen Namen: Zack Eddarly, bislang ohne Beweis.</p>\n<p>Bei der Schneiderin <a href=\"#/artikel/mirelle\">Mirelle</a> kaufte die Gruppe vier Wäschestücke und begann zwei Maßarbeiten. Mirelle kam am Abend ins rückwärtige Zimmer und blieb nach Essen, Wein und Anproben bei Styke, Vesper und Valeria. Dort liegt der aktuelle Rand.</p>","sources":["chronicle","timeline","live","relations","nella","tamsin-current"],"status":"Bis zum aktuellen Rand","tags":["Rückblick","Gesamtkampagne"],"aliases":[],"text":"I. Die Verurteilten von Branderscar Die Geschichte begann für Styke und Vesper nicht mit einem Auftrag, den rechtschaffene Abenteurer hätten ablehnen können. Sie waren Gefangene in Branderscar . Vespers Geschichte führte dorthin über ein kirchliches Archiv, ein erwachtes Reliquiar und ihre Weigerung, Verse zurückzulassen. Dame Balina von Karfeld war an ihrer Gefangennahme beteiligt. Tiadora öffnete eine Möglichkeit zur Flucht. Styke und Vesper nutzten sie, holten Verse zurück und befreiten Grumblejack . Der Oger ging als freier Gefährte, nicht als Beute. In unserer Kampagne überlebten sowohl Tamsin Blackerly als auch Matilda Richter die Auseinandersetzungen. Tamsins spätere Rolle erwuchs aus einem Blutpakt; Richter wurde nicht durch eine gedruckte Standardfassung nachträglich getötet. II. Thorns Haus und der Knoten Der Weg führte zu Adrastus Thorn . Der Pakt der Dornen , die Neun Lektionen und etwa neunzig Tage Ausbildung machten aus der Flucht eine dauerhafte Verstrickung. Thorn war Auftraggeber und Autorität, aber nicht das selbstlose Ziel der Bindung zwischen Styke und Vesper. Beide sprachen davon, ihn zu überleben und Macht für eine eigene gemeinsame Zukunft zu gewinnen. Dame Balina und ihr junger Knappe Timeon gerieten im Umfeld dieser Prüfungen in Gefangenschaft. Balina war keine weitere Branderscar-Insassin. Ihre Gefangenschaft umfasste schwere Gewalt, sexuellen Missbrauch und Konditionierung, an denen Styke und Vesper beteiligt waren. Die Folgen dieser Zeit reichen bis in den aktuellen Morgen. Aus derselben Frau wurde Valeria . Sie nahm später einen Privatpakt an und blieb bei der Gruppe. Haltung, Pflichtgefühl und die Bindung an Timeon tragen Dame Balina unter dem neuen Namen weiter. Timeon blieb außerhalb dieses Pakts. Elise Zadaria führte ihre White Ravens währenddessen über eine getrennte Befehlskette. III. Die Fahrt nach Norden Auf der Frosthamar wurde die Verschwörung praktisch: Waffen mussten zu Sakkarot Fire-Axe gelangen. Auf der Fahrt traf die Gruppe auf eine talireanische Patrouille unter Edward Sambryl . Sechs Überlebende wurden später mit einfacher Ausrüstung an einer abgelegenen Küste freigelassen. Die Begegnung mit White Tusk und den Yutak brachte Handel und wertvolles Elfenbein. Am 14. Januar 4712 AR erreichten Thorns Waffen Sakkarot. Styke versprach ihm persönlich, Balentynes Tor zu öffnen. Sakkarot erzählte, Thorn sei früher Kardinal Mitras gewesen; ein vollständiges geheimes Vorleben wurde dadurch nicht enthüllt. Kargeld Odenkirk starb, die Frosthamar wurde nach der Bergung tragbarer Werte zerstört. Hakon , Sten , Ketil , Eirik , Arved und Torvald hatten Stykes bezahlten Dienst angenommen. Sie wurden zur heutigen Feldgruppe, zusammen mit Grumblejack als freiem Freund. IV. Unter fremdem Dach Am 23. Januar kamen Styke, Vesper und Valeria als freie Händler aus dem Norden nach Aldencross . Das Elfenbein wurde für insgesamt 3.200 gp verkauft. Ein großes hinteres Zimmer im Lord's Dalliance wurde Unterkunft, Planungsraum und Ort des gemeinsamen Alltags. Mara Fenner und Ellyn Reed , früher Hazel und Sunny genannt, gaben Styke erste brauchbare Informationen über die zivilen Arbeiter Balentynes. Zwischen ihnen und Styke entstand persönliche und sexuelle Vertrautheit. Vom Knoten wussten beide nichts; ihr glaubhafter Arbeitskontakt öffnete Vesper dennoch den Weg in die zivilen Bereiche der Festung. V. Freeman's Rock Captain Ryan Varning verließ Balentyne am 24. Januar mit sechs Reitern. Die Gruppe erkundete Freeman's Rock und bereitete einen Hinterhalt vor. In der Nacht des 26. Januar formte Vesper das Schlachtfeld mit Nebel, Dunkelheit und vorbereiteter Sicht; Styke griff von der landwärtigen Fluchtrichtung an. Varning ergab sich schwer verwundet. Styke tötete ihn unter der zuvor gesetzten Vorgabe, keine Gefangenen zu machen. Alle sieben Patrouillenmitglieder starben. Ein Verlust auf der eigenen Seite wurde nicht festgestellt. Die Leichen wurden verborgen, Spuren bearbeitet und sieben Pferde mitgenommen. Auffällige Ausrüstung blieb in einem Versteck außerhalb Aldencross. Varnings kleiner Schlüssel blieb bei Styke; Varlet wurde Grumblejacks eigener Anteil. Noch war die Patrouille nicht überfällig. Dieser Vorsprung war begrenzt. VI. Türen, Briefe und Gewohnheiten Nach der Rückkehr entstanden mehrere voneinander unabhängige Zugänge. Vesper suchte Barnabus' Zimmer ab, fand aber keine verwertbare Erpressung. Valeria näherte sich den Zwergen über ihre Arbeit und später über Barnabus' Trinkstolz. Styke gewann einen kleinen handwerklichen Draht zu ihm. In der Nacht 27./28. Januar entdeckten Styke und Vesper den Zwergengang unter dem Dalliance. Der enge, gewundene Weg stieg fast eine Meile zur Festung an. Die Tür am Ende wurde nur einen Spalt geöffnet. Vorräte und Wasserfässer waren sichtbar; ein vollständiger Raumplan, Wachwechsel oder die Bedienung von innen wurden nicht erkundet. Am 28. Januar vermittelte Jacobian Scaramore einen Kontakt zur Magisterin Tacitus . Verse war mehr als eine Tarnbehauptung: Seine wirkliche Existenz machte die Frage nach erwachtem Bewusstsein glaubwürdig und für Vesper persönlich wichtig. Am selben Tag begann Stykes heimliche Affäre mit Kaitlyn Mott . Am 29. Januar las Vesper die Briefe in Kaitlyns Truhe und stellte deren bereits bestehende Beziehung zu Zack Eddarly fest. Kaitlyns Ehe mit Franz Mott wurde zu einer möglichen Bruchstelle. Eine mögliche Bruchstelle ist noch kein ausgelöster Zusammenbruch. VII. Das Netz wird dichter Vespers Arbeitstage am 29. und 30. Januar lieferten echte Einblicke in Küche, Vorräte, Wasserwege und zivile Abläufe. Die Küche war nahezu ständig in Betrieb, die Speisekammer wurde häufig aufgefüllt. Mama Giuseppe kocht ihren großen Eintopf wöchentli meons sicheren Aufenthaltsort persönlich überprüft, Tamsin aber nicht gefunden. Styke beendete die Suche und untersagte Valeria die Rückkehr zu Timeon. Sie akzeptierte den konkreten Befehl und widersprach zugleich dem Anspruch, damit bestimmen zu dürfen, was ihr noch wichtig sei. Balina blieb ein Teil von Valeria. Jetzt berichtete sie auch vom zweiten Torhausgeschoss: zwei getrennte Winden, vier ständige Wachen, vier Ingenieure am Tag und die heißen Sandvorrichtungen. Donnagin wurde ihr nächster Schwerpunkt. Die Gruppe bevorzugte einen Angriff in der Nacht 8./9. Februar , abhängig von den vorherigen Schritten. Niemand hatte diesen Termin bereits an Hakon oder Sakkarot übermittelt. IX. Der frühe Morgen des 1. Februar Nach einer langen Nacht brach Vesper mit Verse erneut in Richtung Balentyne auf. Styke brachte Valeria Frühstück, und der Morgen wurde privater, als jede Einsatzbesprechung es vorgesehen hatte. Danach schlief Valeria wieder; Styke wandte sich Karte, Stahl und den Stimmen des Dalliance zu. X. Der 1. Februar Vespers Arbeiterdeckung hielt auch unter verschärfter Zählung. Sie half bei Giuseppes Eintopf, fand aber weder Zack noch Donnagin. Am Abend präzisierte die Gruppe den Plan für den 8./9. Februar. Vesper und Valeria erhielten gemeinsam das Vetorecht über neue Gefolgsleute. Sehr spät montierten Styke, Vesper und Valeria zwei schwere Ketten im Tunnel. Zurück im Zimmer fand Vesper im roten Buch einen Absatz, den sie nicht kannte. XI. Die Suche nach Tamsin Am 2. Februar kaufte Styke Rattengift, dann ritten die drei nach Süden. Im namenlosen Mühlenbezirk fanden sie Tamsins Spur bei Darran Vell. Tamsin hatte Timeon sicher abgeliefert, war danach aber für eigenes Geld in Darrans kriminelles Geschäft eingestiegen. Styke erzwang zunächst eine Einigung. Vesper entzog Tamsin ihren Rang und setzte sie auf die unterste Stufe des Haushalts zurück. Danach holte die Gruppe Nella aus dem Gasthaus und zeigte ihr, was hinter der Händlerdecke lag. XII. Vells Ende und Nellas ateLabel":"Nordfahrt, einzelne Tage offen","text":"Die Seefahrt umfasst die Begegnung mit Sambryls Patrouille , deren sechs Überlebende später freigelassen werden, und den Handel mit White Tusk . Odenkirk stirbt; die Frosthamar wird nach Bergung tragbarer Werte zerstört. Sechs Seeleute treten in Stykes bezahlten Dienst. Diese Sammelstation beansprucht keine zusätzliche genaue Tagesreihenfolge für die undatierten Einzelereignisse.","links":["sambryl","white-tusk"],"backlinks":[],"search":"an bord der frosthamar patrouille yutak handel und die spateren sechs bezahlten gefahrten nordfahrt die seefahrt umfasst die begegnung mit sambryls patrouille deren sechs uberlebende spater freigelassen werden und den handel mit white tusk odenkirk stirbt die frosthamar wird nach bergung tragbarer werte zerstort sechs seeleute treten in stykes bezahlten dienst diese sammelstation beansprucht keine zusatzliche genaue tagesreihenfolge fur die undatierten einzelereignisse"},{"id":"zeit-0114","category":"chronik","title":"Waffen für Fire-Axe","summary":"Die Lieferung erreicht Sakkarot. Styke verspricht Balentynes Tor.","body":"<p>Die Waffenlieferung an <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe</a> ist abgeschlossen. <a href=\"#/artikel/styke\">Styke</a> verspricht, <a href=\"#/artikel/balentyne\">Balentyne</a> zu öffnen. Die angepasste Duettprogression erreicht Stufe 5. Sakkarot berichtet von Thorns früherem Rang als Mitra-Kardinal, ohne dessen ganze Vergangenheit aufzudecken.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Nordfahrt"],"aliases":[],"date":"4712-01-14","dateLabel":"14. Januar 4712","text":"Die Waffenlieferung an Sakkarot Fire-Axe ist abgeschlossen. Styke verspricht, Balentyne zu öffnen. Die angepasste Duettprogression erreicht Stufe 5. Sakkarot berichtet von Thorns früherem Rang als Mitra-Kardinal, ohne dessen ganze Vergangenheit aufzudecken.","links":["sakkarot","styke","balentyne"],"backlinks":[],"search":"waffen fur fire axe die lieferung erreicht sakkarot styke verspricht balentynes tor nordfahrt die waffenlieferung an sakkarot fire axe ist abgeschlossen styke verspricht balentyne zu offnen die angepasste duettprogression erreicht stufe 5 sakkarot berichtet von thorns fruherem rang als mitra kardinal ohne dessen ganze vergangenheit aufzudecken"},{"id":"zeit-0123","category":"chronik","title":"Ankunft in Aldencross","summary":"Unterkunft, Elfenbeinverkauf und zivile Kontakte.","body":"<p>Die drei nehmen Quartier im <a href=\"#/artikel/dalliance\">Lord's Dalliance</a>. <a href=\"#/artikel/vesper\">Vesper</a> verkauft beide <a href=\"#/artikel/elfenbein\">Elfenbeinposten</a> für 3.200 gp. <a href=\"#/artikel/hakon\">Hakon</a> führt die Feldgruppe; Tamsin begleitet <a href=\"#/artikel/timeon\">Timeon</a> zum vorgesehenen Hof. <a href=\"#/artikel/styke\">Styke</a> lernt <a href=\"#/artikel/mara\">Mara</a> und <a href=\"#/artikel/ellyn\">Ellyn</a> kennen. Die Begegnung vermittelt Arbeiterwissen, keine bereits garantierte Infiltration.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-23","dateLabel":"23. Januar","text":"Die drei nehmen Quartier im Lord's Dalliance . Vesper verkauft beide Elfenbeinposten für 3.200 gp. Hakon führt die Feldgruppe; Tamsin begleitet Timeon zum vorgesehenen Hof. Styke lernt Mara und Ellyn kennen. Die Begegnung vermittelt Arbeiterwissen, keine bereits garantierte Infiltration.","links":["dalliance","vesper","elfenbein","hakon","timeon","styke","mara","ellyn"],"backlinks":[],"search":"ankunft in aldencross unterkunft elfenbeinverkauf und zivile kontakte aldencross die drei nehmen quartier im lord s dalliance vesper verkauft beide elfenbeinposten fur 3 200 gp hakon fuhrt die feldgruppe tamsin begleitet timeon zum vorgesehenen hof styke lernt mara und ellyn kennen die begegnung vermittelt arbeiterwissen keine bereits garantierte infiltration"},{"id":"zeit-0124","category":"chronik","title":"Varning reit ss der gesicherte zeitanker ist die fortgesetzte erkundung und hinterhaltsvorbereitung ein zusatzliches ereignis oder eine neue begegnung wird aus der knappen notiz nicht erfunden"},{"id":"zeit-0126","category":"chronik","title":"Der Hinterhalt","summary":"Alle sieben Mitglieder der Patrouille sterben. Die Pferde werden mitgenommen.","body":"<p><a href=\"#/artikel/vesper\">Vesper</a> setzt <a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud</a>, <a href=\"#/artikel/dancing-darkness\">Dancing Darkness</a>, Darkvision und <a href=\"#/artikel/ashen-path\">Ashen Path</a> ein. <a href=\"#/artikel/styke\">Styke</a> greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt.</p>\n<p>Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird <a href=\"#/artikel/beute-cache\">außerhalb der Stadt versteckt</a>, der <a href=\"#/artikel/varning-schluessel\">Schlüssel</a> bleibt bei Styke. <a href=\"#/artikel/varlet\">Varlet</a> geht an <a href=\"#/artikel/grumblejack\">Grumblejack</a>.</p>\n","sources":["chronicle","timeline","live"],"status":"Bestätigt","tags":["Aldencross"],"aliases":[],"date":"4712-01-26","dateLabel":"26. Januar, Nacht","text":"Vesper setzt Euphoric Cloud , Dancing Darkness , Darkvision und Ashen Path ein. Styke greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt. Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird außerhalb der Stadt versteckt , der Schlüssel bleibt bei Styke. Varlet geht an Grumblejack .","links":["vesper","euphoric-cloud","dancing-darkness","ashen-path","styke","beute-cache","varning-schlues
