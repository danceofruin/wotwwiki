sah am 7. februar, wie franz zack im duell totete. die fruhere vorbereitung ist daher kein offener plan mehr. spatere offentliche folgen sind nur soweit tatsachlich berichtet bekannt.","initial":"Z","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"zwergen-plan","category":"vorhaben","title":"Zwergenroutinen und Torhaus","summary":"Torhaus sabotiert; Barnabus und seine zehn Arbeiter später im Dalliance getötet.","body":"<h2>Torhaus<\/h2><p>Barnabus’ Wissen über Winden, Dauerwachen und Heißsandabwehr half bei der Vorbereitung. Das Kerntrio zerstörte Ballisten, Steinschütten und Heißsand, öffnete Fallgatter und Zugbrücke und ruinierte die Bedienwerke.<\/p>\n<h2>Dalliance<\/h2><p>Barnabus und seine zehn Leute blieben währenddessen unwissende Gäste. Am frühen Morgen töteten Styke und Hakon alle elf im Schlaf. Beim Abzug wurden 45 gp eingesammelt und der Kasse zugeführt. Eine spätere Auflösung der Zimmer oder des restlichen Besitzes ist nicht bekannt.<\/p>","sources":["live","core"],"status":"Historisch · abgeschlossen","tags":["Torhaus","Zwerge"],"aliases":[],"text":"Torhaus Barnabus’ Wissen über Winden, Dauerwachen und Heißsandabwehr half bei der Vorbereitung. Das Kerntrio zerstörte Ballisten, Steinschütten und Heißsand, öffnete Fallgatter und Zugbrücke und ruinierte die Bedienwerke. Dalliance Barnabus und seine zehn Leute blieben währenddessen unwissende Gäste. Am frühen Morgen töteten Styke und Hakon alle elf im Schlaf. Beim Abzug wurden 45 gp eingesammelt und der Kasse zugeführt. Eine spätere Auflösung der Zimmer oder des restlichen Besitzes ist nicht bekannt.","links":[],"backlinks":[],"search":"zwergenroutinen und torhaus torhaus sabotiert; barnabus und seine zehn arbeiter spater im dalliance getotet. torhaus zwerge  torhaus barnabus’ wissen uber winden, dauerwachen und heisssandabwehr half bei der vorbereitung. das kerntrio zerstorte ballisten, steinschutten und heisssand, offnete fallgatter und zugbrucke und ruinierte die bedienwerke. dalliance barnabus und seine zehn leute blieben wahrenddessen unwissende gaste. am fruhen morgen toteten styke und hakon alle elf im schlaf. beim abzug wurden 45 gp eingesammelt und der kasse zugefuhrt. eine spatere auflosung der zimmer oder des restlichen besitzes ist nicht bekannt.","initial":"Z","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"angriffsplan","category":"vorhaben","title":"Balentyne: der bedingte Angriffsplan","summary":"Balentyne ist gefallen; Torhaus, Signal und Fire-Axes Sturm führten den ersten Auftrag zum Abschluss.","body":"<h2>Ausgeführter Plan<\/h2><p>Das Trio drang nach Mitternacht durch den Geheimgang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab.<\/p>\n<h2>Ergebnis<\/h2><p>Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt. Tiadora überbrachte am 9. Februar die Belohnung von 5.000 gp und reiste anschließend ab.<\/p>","sources":["live","chronicle","timeline","clocks-current"],"status":"Historisch · abgeschlossen","tags":["8./9. Februar","Hakon","Tunnel","Balentyne","Befehlskette"],"aliases":[],"text":"Ausgeführter Plan Das Trio drang nach Mitternacht durch den Geheimgang ein, tötete Donnagin und Havelyn, brach die Torhausabwehr, öffnete Fallgatter und Zugbrücke und zog sich mit dem Schatz zurück. Danach schossen Styke, Vesper und Valeria gemeinsam das rote Signal ab. Ergebnis Fire-Axes Heer nutzte das offene Tor. Beim zweiten Besuch war die äußere Verteidigung gebrochen; am frühen Morgen erlosch die organisierte Gegenwehr. Balentyne ist gefallen. Thorns erster Auftrag ist erfüllt. Tiadora überbrachte am 9. Februar die Belohnung von 5.000 gp und reiste anschließend ab.","links":[],"backlinks":[],"search":"balentyne: der bedingte angriffsplan balentyne ist gefallen; torhaus, signal und fire-axes sturm fuhrten den ersten auftrag zum abschluss. 8./9. februar hakon tunnel balentyne befehlskette  ausgefuhrter plan das trio drang nach mitternacht durch den geheimgang ein, totete donnagin und havelyn, brach die torhausabwehr, offnete fallgatter und zugbrucke und zog sich mit dem schatz zuruck. danach schossen styke, vesper und valeria gemeinsam das rote signal ab. ergebnis fire-axes heer nutzte das offene tor. beim zweiten besuch war die aussere verteidigung gebrochen; am fruhen morgen erlosch die organisierte gegenwehr. balentyne ist gefallen. thorns erster auftrag ist erfullt. tiadora uberbrachte am 9. februar die belohnung von 5.000 gp und reiste anschliessend ab.","initial":"B","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"offene-spuren","category":"vorhaben","title":"Weitere offene Spuren","summary":"Ritualprobe, Artephius, Carnitheria und Ausbau sind die offenen Arbeiten im Horn.","body":"<h2>Ritual<\/h2><p>Alle drei Augen sind vorhanden. Die vollständige Rezitation wurde eingeübt; praktische Probe und eigentlicher Ritualbeginn bleiben offen. Kein 222-Tage-Zähler läuft.<\/p><h2>Werkstätten und Rekonstruktion<\/h2><p>Artephius benötigt noch fehlende Teile. Carnitherias schwerer Hengst und 3.000 gp Materialien sind da; ein voller Rekonstruktionstag ist noch nicht abgeschlossen, Rex nicht gerufen. Branna, Osric und Darric haben mit ihrem jeweiligen Gewerk begonnen, ohne fertige Möbel, Schmiede oder Umbauten.<\/p><h2>Weitere Vorhaben<\/h2><p>Bezahlte Umhänge und Amulette, Mirelles Geschirr, Grumblejacks Rüstung und gemeinsame Jagd, Badheizung, Botenfedern und Fernkommunikation sowie der Tresortransport. Tears-Gegenforschung und Pact-Fragen bleiben ergebnisoffen. Ein zweiter Extend Rod ist bis zur Verwertung größerer Beute zurückgestellt.<\/p><h2>Verbundene Akten<\/h2><p><a href=\"#/artikel/halthus\">Halthus<\/a> · <a href=\"#/artikel/artephius\">Artephius<\/a> · <a href=\"#/artikel/eye-of-withering\">Auge de botenfedern und fernkommunikation sowie der tresortransport. tears-gegenforschung und pact-fragen bleiben ergebnisoffen. ein zweiter extend rod ist bis zur verwertung grosserer beute zuruckgestellt. verbundene akten halthus · artephius · auge des verwelkens · carnitheria rex","initial":"W","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"spielstand","category":"fakten","title":"Aktueller Spielstand","summary":"28. Februar 4712 AR, morgens im Horn: Haushalt angekommen, alle drei Augen geborgen, Ritual unbegonnen.","body":"<h2>Ort und Zeit<\/h2><p><strong>28. Februar 4712 AR, morgens; genaue Uhrzeit nicht festgestellt.<\/strong> Styke, Vesper und Elise sind in der beschädigten Lustkammer auf Ebene Drei. Valeria nutzt die bestehenden Quartiere auf Ebene Zwei. Das größere gewählte Zimmer ist noch nicht eingerichtet; das alte Himmelbett wurde nicht verlegt.<\/p><h2>Der Einzug am 27. Februar<\/h2><p>Der Zug von Westell erreichte das Horn. Fachkräfte und Hakons Männer bezogen Ebene Eins; Grumblejack die Death’s Head Tavern. Edda versorgte das erste gemeinsame Abendessen. Werkstätten und Ausbau wurden begonnen, aber kein voller Arbeitstag abgeschlossen.<\/p><h2>Ressourcen<\/h2><p>Styke 48/48 HP und 16/16 PP; Vesper 38/38 HP, Rod 3/3 und Zauberplätze 8/8, 7/7, 5/5; Valeria 46/46 HP, Smite 3/3, Challenge 1/1, Touch 9/9, Boon 1/1. Normale Nachtruhe und tägliche Auffrischung sind abgeschlossen. Kasse: 2.280 gp 5 sp; 6.000 gp verbleiben als vorausbezahltes Fertigungsmaterial.<\/p><h2>Horn und Ritual<\/h2><p>Halthus lebt in Tamsins beaufsichtigter Stahlzelle. Alle drei Augen sind geborgen und nicht eingesetzt. Silbersiegel und Ketten sind intakt. Vesper übte die vollständige Rezitation mit beiden Wächtern abseits des Siegels; praktische Probe und Ritualbeginn stehen aus.<\/p><h2>Als Nächstes<\/h2><p>Artephius’ fehlende Teile, Carnitherias Rekonstruktionstag, Ausbau und bezahlte Werkstattreihe. Neue Forschungsergebnisse, fertige Einrichtungen oder ungelesene Buchantworten werden nicht vorweggenommen. <a href=\"#/artikel/horn-aufbau\">Aufbau und Umzug zum Horn<\/a><\/p><h2>Verbundene Akten<\/h2><p><a href=\"#/artikel/halthus\">Halthus<\/a> · <a href=\"#/artikel/artephius\">Artephius<\/a> · <a href=\"#/artikel/eye-of-withering\">Auge des Verwelkens<\/a> · <a href=\"#/artikel/carnitheria-rex\">Carnitheria Rex<\/a><\/p>","sources":["live","chronicle","timeline","farholde"],"status":"Aktuell · 28. Februar morgens","tags":["Aktuell","Horn","Nacht","Stufe 7"],"aliases":["Live State"],"text":"Ort und Zeit 28. Februar 4712 AR, morgens; genaue Uhrzeit nicht festgestellt. Styke, Vesper und Elise sind in der beschädigten Lustkammer auf Ebene Drei. Valeria nutzt die bestehenden Quartiere auf Ebene Zwei. Das größere gewählte Zimmer ist noch nicht eingerichtet; das alte Himmelbett wurde nicht verlegt. Der Einzug am 27. Februar Der Zug von Westell erreichte das Horn. Fachkräfte und Hakons Männer bezogen Ebene Eins; Grumblejack die Death’s Head Tavern. Edda versorgte das erste gemeinsame Abendessen. Werkstätten und Ausbau wurden begonnen, aber kein voller Arbeitstag abgeschlossen. Ressourcen Styke 48/48 HP und 16/16 PP; Vesper 38/38 HP, Rod 3/3 und Zauberplätze 8/8, 7/7, 5/5; Valeria 46/46 HP, Smite 3/3, Challenge 1/1, Touch 9/9, Boon 1/1. Normale Nachtruhe und tägliche Auffrischung sind abgeschlossen. Kasse: 2.280 gp 5 sp; 6.000 gp verbleiben als vorausbezahltes Fertigungsmaterial. Horn und Ritual Halthus lebt in Tamsins beaufsichtigter Stahlzelle. Alle drei Augen sind geborgen und nicht eingesetzt. Silbersiegel und Ketten sind intakt. Vesper übte die vollständige Rezitation mit beiden Wächtern abseits des Siegels; praktische Probe und Ritualbeginn stehen aus. Als Nächstes Artephius’ fehlende Teile, Carnitherias Rekonstruktionstag, Ausbau und bezahlte Werkstattreihe. Neue Forschungsergebnisse, fertige Einrichtungen oder ungelesene Buchantworten werden nicht vorweggenommen. Aufbau und Umzug zum Horn Verbundene Akten Halthus · Artephius · Auge des Verwelkens · Carnitheria Rex","search":"aktueller spielstand 28. februar 4712 ar, morgens im horn: haushalt angekommen, alle drei augen geborgen, ritual unbegonnen. aktuell horn nacht stufe 7 live state ort und zeit 28. februar 4712 ar, morgens; genaue uhrzeit nicht festgestellt. styke, vesper und elise sind in der beschadigten lustkammer auf ebene drei. valeria nutzt die bestehenden quartiere auf ebene zwei. das grossere gewahlte zimmer ist noch nicht eingerichtet; das alte himmelbett wurde nicht verlegt. der einzug am 27. februar der zug von westell erreichte das horn. fachkrafte und hakons manner bezogen ebene eins; grumblejack die death’s head tavern. edda versorgte das erste gemeinsame abendessen. werkstatten und ausbau wurden begonnen, aber kein voller arbeitstag abgeschlossen. ressourcen styke 48/48 hp und 16/16 pp; vesper 38/38 hp, rod 3/3 und zauberplatze 8/8, 7/7, 5/5; valeria 46/46 hp, smite 3/3, challenge 1/1, touch 9/9, boon 1/1. normale nachtruhe und tagliche auffrischung sind abgeschlossen. kasse: 2.280 gp 5 sp; 6.000 gp verbleiben als vorausbezahltes fertigungsmaterial. horn und ritual halthus lebt in tamsins beaufsichtigter stahlzelle. alle drei augen sind geborgen und nicht eingesetzt. silbersiegel und ketten sind intakt. vesper ubte die vollstandige rezitation mit beiden wachtern abseits des siegels; praktische probe und ritualbeginn stehen aus. als nachstes artephius’ fehlende teile, carnitherias rekonstruktionstag, ausbau und bezahlte werkstattreihe. neue forschungsergebnisse, fertige einrichtungen oder ungelesene buchantworten werden nicht vorweggenommen. aufbau und umzug zum horn verbundene akten halthus · artephius · auge des verwelkens · carnitheria rex","links":["horn-aufbau","halthus","artephius","eye-of-withering","carnitheria-rex"],"backlinks":[],"initial":"D","group":"current","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"story-so-far","category":"geschichte","title":"Die Geschichte bisher","summary":"Von Branderscar über Balentyne und das bereinigte Horn bis zum Morgen des geplanten Umzugs.","body":"<h2>Branderscar und Thorns Schule<\/h2><p>Styke und Vesper entkamen Branderscar, holten Verse zurück und nahmen Grumblejack mit. Kardinal Adrastus Thorn band sie an seinen Plan, ließ sie ausbilden und stellte den späteren Nessischen Knoten zusammen.<\/p><h2>Nordfahrt und Balentyne<\/h2><p>Der Knoten lieferte Sakkarot Fire-Axe Waffen, beseitigte Varnings Patrouille und drang unter ziviler Tarnung in Aldencross und Balentyne ein. In der Nacht zum 9. Februar öffnete die Gruppe die Festung für Fire-Axes Heer. Donnagin und Havelyn starben, das Torhaus fiel und Balentyne wurde erobert.<\/p><h2>Ein größerer Haushalt<\/h2><p>Mit Balentynes Fall kamen nicht nur Geld und Ausrüstung: Tacitus nahm den Compact an, Nella, Kaitlyn und Mirelle reisten mit, Tamsin übernahm Sicherheit, Hakon blieb mit fünf Männern im Sold und Grumblejack blieb freier Gefährte. Auf Halstyn’s Folly wurden daraus keine losen Mitfahrer, sondern ein kleiner, hungriger Betrieb.<\/p><h2>Zehn Tage auf dem Fluss<\/h2><p>Zwischen dem 9. und 19. Februar finanzierte eine Reihe wechselnder falscher Requisitionen die Reise, ohne zur bloßen Wiederholung zu werden. Nella wuchs in Logistik und Verantwortung; Tamsin erhielt Bezahlung und trainierte Sicherheit; Mirelle plante Grumblejacks Rüstung. Tacitus schloss ihr Familiar-Projekt ab. Am 19. Februar erwachte <a href=\"#/artikel/knittel\">Knittel<\/a>, benannte sich selbst und Zorn kehrte zu Styke zurück.<\/p><h2>Der Auftrag im Süden<\/h2><p>Am 20. Februar erteilte Thorn den zweiten Auftrag: Im Caer Bryr liegt das Horn von Abaddon. Der Knoten soll Vetra-Kali binden, die Tears of Achlys gewinnen und sie zu Thorn bringen. Am 21. Februar erreichte die Gruppe Farholde, zahlte Bellam und Alicia aus und verteilte den Haushalt auf unauffällige Quartiere.<\/p><h2>Farholde<\/h2><p>Vesper fand Aiden Kaels Karte. Valeria erkundete den Bryrrand, und der Knoten gewann begrenzte Zusammenarbeit mit Baron Vandermir. Kaitlyn wurde zur Verbindung, während Tacitus und Knittel Stykes Geschicklichkeitsgürtel fertigstellten.<\/p><h2>Der Siebte Knoten und das Horn<\/h2><p>Am 23. Februar trafen Elise Zadaria und die White Ravens ein. Die vier externen +1-Aufwertungen und Valerias Stärke-Gürtel wurden fertig. Am nächsten Morgen führte Kaels Karte Styke, Vesper und Valeria zum Horn. Jurak verweigerte den Zugang und fiel im Kampf. In den unteren Höhlen erkannte Vesper fünf verborgene amphibische Kämpfer, bevor deren Hinterhalt begann.<\/p><h2>Im Horn und zurück<\/h2><p>Die Erkundung erreichte Tresor und Sanctum; das Kerntrio band die beiden Wächter und ruhte zunächst in der Death’s Head. Am 25. Februar vernichtete es Ezra und dessen drei Wraiths, ließ die Schleime beseitigen und räumte die restlichen Bane-wogs. Vesper barg die Dirges und das Auge der Wachsamkeit aus C13; die Schrift bestätigt den genauen Ritualablauf. Zikomos Versteck brachte 2.300 gp sowie noch unbewerteten Schmuck und Türkise. Am Abend kehrte das Trio nach Farholde zurück. Dort wurden Umzug, Rekrutierung und Werkstätten geplant und Valerias Stirnreif übergeben. Der aktuelle Rand ist Stykes Erwachen bei Kaitlyn am späten Vormittag des 26. Februar; das Hornritual ist weiterhin unbegonnen.<\/p><h2>Letzter Farholde-Tag<\/h2><p>Am 26. Februar blieb Kaitlyn am Morgen bewusst bei Styke. Danach legte der Knoten den Umzugstreffpunkt für Sonnenaufgang südlich von Westell fest. Styke und Vesper weihten Elise, Hakon und Grumblejack ein. Mirelle schloss die besondere Anprobe ab; Tacitus lieferte Stykes +2-Umhang, trat dem Collective bei und übernahm eine geheime Gegenfrage zu den Tears sowie eine quellengetrennte Psionik-Untersuchung. Nach Stykes spätem Bericht setzte Vesper eine klare Grenze für künftige tödliche Geheimnisse. Beide schliefen nach ihrer Versöhnung nebeneinander ein. Der neue Rand liegt vor Morgengrauen am 27. Februar; der Umzug ist noch nicht aufgebrochen.<\/p><h2>27. Februar · Ein Zuhause im Horn<\/h2><p>Von Westell zog der Haushalt ins Horn. Die vier Fachkräfte begannen Holz-, Schmiede-, Küchen- und Steinarbeiten; Hakons Männer bezogen die Wächterquartiere. Grumblejack machte die Death’s Head Tavern zu seinem Zuhause. Halthus wurde wiederhergestellt und in Haft genommen, Withering geborgen. Das erste gemeinsame Abendessen und der erste Bierausschank fanden statt.<\/p><h2>28. Februar · Der Morgen danach<\/h2><p>Das Kerntrio ist ausgeruht; Styke, Vesper und Elise sind noch in der Lustkammer auf Ebene Drei. Der Haushalt wohnt nun im Horn, doch Werkstätten, Möbel, Artephius und Carnitheria sind noch nicht fertig. Alle drei Augen bleiben außerhalb ihrer Fassungen, der Ritualzähler steht still.<\/p>","sources":["chronicle","timeline","live","transition","farholde"],"status":"Aktuell · 28. Februar morgens","tags":["Rückblick","Buch Eins","Buch Zwei","Farholde"],"aliases":[],"text":"Branderscar und Thorns Schule Styke und Vesper entkamen Branderscar, holten Verse zurück und nahmen Grumblejack mit. Kardinal Adrastus Thorn band sie an seinen Plan, ließ sie ausbilden und stellte den späteren Nessischen Knoten zusammen. Nordfahrt und Balentyne Der Knoten lieferte Sakkarot Fire-Axe Waffen, beseitigte Varnings Patrouille und drang unter ziviler Tarnung in Aldencross und Balentyne ein. In der Nacht zum 9. Februar öffnete die Gruppe die Festung für Fire-Axes Heer. Donnagin und Havelyn starben, das Torhaus fiel und Balentyne wurde erobert. Ein größerer Haushalt Mit Balentynes Fall kamen nicht nur Geld und Ausrüstung: Tacitus nahm den Compact an, Nella, Kaitlyn und Mirelle reisten mit, Tamsin übernahm Sicherheit, Hakon blieb mit fünf Männern im Sold und Grumblejack blieb freier Gefährte. Auf Halstyn’s Folly wurden daraus keine losen Mitfahrer, sondern ein kleiner, hungriger Betrieb. Zehn Tage auf dem Fluss Zwischen dem 9. und 19. Februar finanzierte eine Reihe wechselnder falscher Requisitionen die Reise, ohne zur bloßen Wiederholung zu werden. Nella wuchs in Logistik und Verantwortung; Ta "timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Branderscar"],"aliases":[],"date":"0000-00-02","dateLabel":"Datum nicht fixiert","text":"Branderscar wird zum Beginn der gemeinsamen Flucht. Tiadora vermittelt die Möglichkeit. Tamsin und Matilda überleben die angenommenen Begegnungen. Grumblejack ist freier Gefährte, keine neue Habe. Spätere Geschicke der Zurückgelassenen sind dadurch nicht vollständig bekannt.","links":["branderscar","tiadora","tamsin","matilda","grumblejack"],"backlinks":[],"search":"flucht aus branderscar styke und vesper entkommen, verse wird zuruckgeholt, grumblejack befreit. branderscar  branderscar wird zum beginn der gemeinsamen flucht. tiadora vermittelt die moglichkeit. tamsin und matilda uberleben die angenommenen begegnungen. grumblejack ist freier gefahrte, keine neue habe. spatere geschicke der zuruckgelassenen sind dadurch nicht vollstandig bekannt.","initial":"F"},{"id":"zeit-ausbildung","category":"chronik","title":"Der Pakt und die Neun Lektionen","summary":"Thorn bindet die Gruppe. Balinas späterer Privatpakt gehört in diese Phase.","body":"<p><a href=\"#/artikel/thorn\">Thorn<\/a> rekrutiert <a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a>. Die Ausbildung in <a href=\"#/artikel/thorn-manor\">seinem Anwesen<\/a> umfasst die Neun Lektionen. Balina und <a href=\"#/artikel/timeon\">Timeon<\/a> werden dort gefangen. Balina erleidet schwere Gewalt und Zwang. Später nimmt sie den Namen <a href=\"#/artikel/valeria\">Valeria<\/a> und einen <a href=\"#/artikel/privatpakt\">Privatpakt<\/a> an. <a href=\"#/artikel/white-ravens\">Elise<\/a> führt währenddessen den zweiten Knoten.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Thorns Anwesen"],"aliases":[],"date":"0000-00-03","dateLabel":"Etwa 90 Tage Ausbildung","text":"Thorn rekrutiert Styke und Vesper . Die Ausbildung in seinem Anwesen umfasst die Neun Lektionen. Balina und Timeon werden dort gefangen. Balina erleidet schwere Gewalt und Zwang. Später nimmt sie den Namen Valeria und einen Privatpakt an. Elise führt währenddessen den zweiten Knoten.","links":["thorn","styke","vesper","thorn-manor","timeon","valeria","privatpakt","white-ravens"],"backlinks":[],"search":"der pakt und die neun lektionen thorn bindet die gruppe. balinas spaterer privatpakt gehort in diese phase. thorns anwesen  thorn rekrutiert styke und vesper . die ausbildung in seinem anwesen umfasst die neun lektionen. balina und timeon werden dort gefangen. balina erleidet schwere gewalt und zwang. spater nimmt sie den namen valeria und einen privatpakt an. elise fuhrt wahrenddessen den zweiten knoten.","initial":"D"},{"id":"zeit-seereise","category":"chronik","title":"An Bord der Frosthamar","summary":"Patrouille, Yutak-Handel und die späteren sechs bezahlten Gefährten.","body":"<p>Die Seefahrt umfasst die Begegnung mit <a href=\"#/artikel/sambryl\">Sambryls Patrouille<\/a>, deren sechs Überlebende später freigelassen werden, und den Handel mit <a href=\"#/artikel/white-tusk\">White Tusk<\/a>. Odenkirk stirbt; die Frosthamar wird nach Bergung tragbarer Werte zerstört. Sechs Seeleute treten in Stykes bezahlten Dienst. Diese Sammelstation beansprucht keine zusätzliche genaue Tagesreihenfolge für die undatierten Einzelereignisse.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Nordfahrt"],"aliases":[],"date":"0000-00-04","dateLabel":"Nordfahrt, einzelne Tage offen","text":"Die Seefahrt umfasst die Begegnung mit Sambryls Patrouille , deren sechs Überlebende später freigelassen werden, und den Handel mit White Tusk . Odenkirk stirbt; die Frosthamar wird nach Bergung tragbarer Werte zerstört. Sechs Seeleute treten in Stykes bezahlten Dienst. Diese Sammelstation beansprucht keine zusätzliche genaue Tagesreihenfolge für die undatierten Einzelereignisse.","links":["sambryl","white-tusk"],"backlinks":[],"search":"an bord der frosthamar patrouille, yutak-handel und die spateren sechs bezahlten gefahrten. nordfahrt  die seefahrt umfasst die begegnung mit sambryls patrouille , deren sechs uberlebende spater freigelassen werden, und den handel mit white tusk . odenkirk stirbt; die frosthamar wird nach bergung tragbarer werte zerstort. sechs seeleute treten in stykes bezahlten dienst. diese sammelstation beansprucht keine zusatzliche genaue tagesreihenfolge fur die undatierten einzelereignisse.","initial":"A"},{"id":"zeit-0114","category":"chronik","title":"Waffen für Fire-Axe","summary":"Die Lieferung erreicht Sakkarot. Styke verspricht Balentynes Tor.","body":"<p>Die Waffenlieferung an <a href=\"#/artikel/sakkarot\">Sakkarot Fire-Axe<\/a> ist abgeschlossen. <a href=\"#/artikel/styke\">Styke<\/a> verspricht, <a href=\"#/artikel/balentyne\">Balentyne<\/a> zu öffnen. Die angepasste Duettprogression erreicht Stufe 5. Sakkarot berichtet von Thorns früherem Rang als Mitra-Kardinal, ohne dessen ganze Vergangenheit aufzudecken.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Nordfahrt"],"aliases":[],"date":"4712-01-14","dateLabel":"14. Januar 4712","text":"Die Waffenlieferung an Sakkarot Fire-Axe ist abgeschlossen. Styke verspricht, Balentyne zu öffnen. Die angepasste Duettprogression erreicht Stufe 5. Sakkarot berichtet von Thorns früherem Rang als Mitra-Kardinal, ohne dessen ganze Vergangenheit aufzudecken.","links":["sakkarot","styke","balentyne"],"backlinks":[],"search":"waffen fur fire-axe die lieferung erreicht sakkarot. styke verspricht balentynes tor. nordfahrt  die waffenlieferung an sakkarot fire-axe ist abgeschlossen. styke verspricht, balentyne zu offnen. die angepasste duettprogression erreicht stufe 5. sakkarot berichtet von thorns fruherem rang als mitra-kardinal, ohne dessen ganze vergangenheit aufzudecken.","initial":"W"},{"id":"zeit-0123","category":"chronik","title":"Ankunft in Aldencross","summary":"Unterkunft, Elfenbeinverkauf und zivile Kontakte.","body":"<p>Die drei nehmen Quartier im <a href=\"#/artikel/dalliance\">Lord's Dalliance<\/a>. <a href=\"#/artikel/vesper\">Vesper<\/a> verkauft beide <a href=\"#/artikel/elfenbein\">Elfenbeinposten<\/a> für 3.200 gp. <a href=\"#/artikel/hakon\">Hakon<\/a> führt die Feldgruppe; Tamsin begleitet <a href=\"#/artikel/timeon\">Timeon<\/a> zum vorgesehenen Hof. <a href=\"#/artikel/styke\">Styke<\/a> lernt <a href=\"#/artikel/mara\">Mara<\/a> und <a href=\"#/artikel/ellyn\">Ellyn<\/a> kennen. Die Begegnung vermittelt Arbeiterwissen, keine bereits garantierte Infiltration.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-23","dateLabel":"23. Januar","text":"Die drei nehmen Quartier im Lord's Dalliance . Vesper verkauft beide Elfenbeinposten für 3.200 gp. Hakon führt die Feldgruppe; Tamsin begleitet Timeon zum vorgesehenen Hof. Styke lernt Mara und Ellyn kennen. Die Begegnung vermittelt Arbeiterwissen, keine bereits garantierte Infiltration.","links":["dalliance","vesper","elfenbein","hakon","timeon","styke","mara","ellyn"],"backlinks":[],"search":"ankunft in aldencross unterkunft, elfenbeinverkauf und zivile kontakte. aldencross  die drei nehmen quartier im lord's dalliance . vesper verkauft beide elfenbeinposten fur 3.200 gp. hakon fuhrt die feldgruppe; tamsin begleitet timeon zum vorgesehenen hof. styke lernt mara und ellyn kennen. die begegnung vermittelt arbeiterwissen, keine bereits garantierte infiltration.","initial":"A"},{"id":"zeit-0124","category":"chronik","title":"Varning reitet aus","summary":"Der Captain und sechs ausgesuchte Reiter verlassen Balentyne.","body":"<p><a href=\"#/artikel/varning\">Ryan Varning<\/a> bricht mit sechs Reitern auf. <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/vesper\">Vesper<\/a>, <a href=\"#/artikel/valeria\">Valeria<\/a> und <a href=\"#/artikel/hakon\">Hakon<\/a> beginnen die Erkundung bei <a href=\"#/artikel/freemans-rock\">Freeman's Rock<\/a>. Die übrige Feldgruppe bleibt bei der Vorbereitung räumlich getrennt.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-24","dateLabel":"24. Januar","text":"Ryan Varning bricht mit sechs Reitern auf. Styke , Vesper , Valeria und Hakon beginnen die Erkundung bei Freeman's Rock . Die übrige Feldgruppe bleibt bei der Vorbereitung räumlich getrennt.","links":["varning","styke","vesper","valeria","hakon","freemans-rock"],"backlinks":[],"search":"varning reitet aus der captain und sechs ausgesuchte reiter verlassen balentyne. aldencross  ryan varning bricht mit sechs reitern auf. styke , vesper , valeria und hakon beginnen die erkundung bei freeman's rock . die ubrige feldgruppe bleibt bei der vorbereitung raumlich getrennt.","initial":"V"},{"id":"zeit-0125","category":"chronik","title":"Vorbereitung des Hinterhalts","summary":"Die Erkundung und Vorbereitung werden fortgesetzt.","body":"<p>Der gesicherte Zeitanker ist die fortgesetzte Erkundung und Hinterhaltsvorbereitung. Ein zusätzliches Ereignis oder eine neue Begegnung wird aus der knappen Notiz nicht erfunden.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-25","dateLabel":"25. Januar","text":"Der gesicherte Zeitanker ist die fortgesetzte Erkundung und Hinterhaltsvorbereitung. Ein zusätzliches Ereignis oder eine neue Begegnung wird aus der knappen Notiz nicht erfunden.","links":[],"backlinks":[],"search":"vorbereitung des hinterhalts die erkundung und vorbereitung werden fortgesetzt. aldencross  der gesicherte zeitanker ist die fortgesetzte erkundung und hinterhaltsvorbereitung. ein zusatzliches ereignis oder eine neue begegnung wird aus der knappen notiz nicht erfunden.","initial":"V"},{"id":"zeit-0126","category":"chronik","title":"Der Hinterhalt","summary":"Alle sieben Mitglieder der Patrouille sterben. Die Pferde werden mitgenommen.","body":"<p><a href=\"#/artikel/vesper\">Vesper<\/a> setzt <a href=\"#/artikel/euphoric-cloud\">Euphoric Cloud<\/a>, <a href=\"#/artikel/dancing-darkness\">Dancing Darkness<\/a>, Darkvision und <a href=\"#/artikel/ashen-path\">Ashen Path<\/a> ein. <a href=\"#/artikel/styke\">Styke<\/a> greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt.<\/p>\n<p>Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird <a href=\"#/artikel/beute-cache\">außerhalb der Stadt versteckt<\/a>, der <a href=\"#/artikel/varning-schluessel\">Schlüssel<\/a> bleibt bei Styke. <a href=\"#/artikel/varlet\">Varlet<\/a> geht an <a href=\"#/artikel/grumblejack\">Grumblejack<\/a>.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-26","dateLabel":"26. Januar, Nacht","text":"Vesper setzt Euphoric Cloud , Dancing Darkness , Darkvision und Ashen Path ein. Styke greift von der landwärtigen Fluchtrichtung an. Varning ergibt sich verwundet und wird unter der vorab gesetzten Vorgabe getötet. Alle sieben Patrouillenmitglieder sterben; keine eigene Verwundung oder eigener Verlust ist hier festgestellt. Die Toten werden verborgen, Spuren bearbeitet und sieben Pferde abgeführt. Markante Ausrüstung wird außerhalb der Stadt versteckt , der Schlüssel bleibt bei Styke. Varlet geht an Grumblejack .","links":["vesper","euphoric-cloud","dancing-darkness","ashen-path","styke","beute-cache","varning-schluessel","varlet","grumblejack"],"backlinks":[],"search":"der hinterhalt alle sieben mitglieder der patrouille sterben. die pferde werden mitgenommen. aldencross  vesper setzt euphoric cloud , dancing darkness , darkvision und ashen path ein. styke greift von der landwartigen fluchtrichtung an. varning ergibt sich verwundet und wird unter der vorab gesetzten vorgabe getotet. alle sieben patrouillenmitglieder sterben; keine eigene verwundung oder eigener verlust ist hier festgestellt. die toten werden verborgen, spuren bearbeitet und sieben pferde abgefuhrt. markante ausrustung wird ausserhalb der stadt versteckt , der schlussel bleibt bei styke. varlet geht an grumblejack .","initial":"D"},{"id":"zeit-0127","category":"chronik","title":"Rückkehr und Zwergenspuren","summary":"Ruhe im Dalliance, Theaterhinweis und noch kein brauchbarer Erpressungshebel.","body":"<p>Vor Sonnenaufgang kehrt das Trio zurück. Varning gilt noch nicht als überfällig. Bellam berichtet von <a href=\"#/artikel/merrie-men\">Ye Merrie Men<\/a>. <a href=\"#/artikel/vesper\">Vesper<\/a> findet in Barnabus' Zimmer Arbeitsunterlagen, aber keine kompromittierenden Belege. <a href=\"#/artikel/valeria\">Valeria<\/a> spricht mit den Arbeitern. <a href=\"#/artikel/styke\">Styke<\/a> knüpft einen handwerklichen Kontakt zu Barnabus. Eine Taschendiebstahlgeschichte verweist auf <a href=\"#/artikel/marel\">Marel<\/a>, bleibt aber unbestätigt.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-27","dateLabel":"27. Januar","text":"Vor Sonnenaufgang kehrt das Trio zurück. Varning gilt noch nicht als überfällig. Bellam berichtet von Ye Merrie Men . Vesper findet in Barnabus' Zimmer Arbeitsunterlagen, aber keine kompromittierenden Belege. Valeria spricht mit den Arbeitern. Styke knüpft einen handwerklichen Kontakt zu Barnabus. Eine Taschendiebstahlgeschichte verweist auf Marel , bleibt aber unbestätigt.","links":["merrie-men","vesper","valeria","styke","marel"],"backlinks":[],"search":"ruckkehr und zwergenspuren ruhe im dalliance, theaterhinweis und noch kein brauchbarer erpressungshebel. aldencross  vor sonnenaufgang kehrt das trio zuruck. varning gilt noch nicht als uberfallig. bellam berichtet von ye merrie men . vesper findet in barnabus' zimmer arbeitsunterlagen, aber keine kompromittierenden belege. valeria spricht mit den arbeitern. styke knupft einen handwerklichen kontakt zu barnabus. eine taschendiebstahlgeschichte verweist auf marel , bleibt aber unbestatigt.","initial":"R"},{"id":"zeit-tunnel","category":"chronik","title":"Der Gang unter dem Gasthaus","summary":"Der Weg zur Festung wird bestätigt, der Zielraum nur einen Spalt weit gesehen.","body":"<p><a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/vesper\">Vesper<\/a> öffnen eine verborgene Zwergentür im Dalliance-Keller. Sie folgen dem engen, ansteigenden Gang und öffnen am anderen Ende nur einen Spalt. Rationen und Wasserfässer sind sichtbar. Sie betreten den Raum nicht vollständig, kehren zurück und stellen die Tarnung wieder her. <a href=\"#/artikel/tunnel\">Details und offene Fragen zum Tunnel<\/a>.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-27T23","dateLabel":"Nacht 27./28. Januar","text":"Styke und Vesper öffnen eine verborgene Zwergentür im Dalliance-Keller. Sie folgen dem engen, ansteigenden Gang und öffnen am anderen Ende nur einen Spalt. Rationen und Wasserfässer sind sichtbar. Sie betreten den Raum nicht vollständig, kehren zurück und stellen die Tarnung wieder her. Details und offene Fragen zum Tunnel .","links":["styke","vesper","tunnel"],"backlinks":[],"search":"der gang unter dem gasthaus der weg zur festung wird bestatigt, der zielraum nur einen spalt weit gesehen. aldencross  styke und vesper offnen eine verborgene zwergentur im dalliance-keller. sie folgen dem engen, ansteigenden gang und offnen am anderen ende nur einen spalt. rationen und wasserfasser sind sichtbar. sie betreten den raum nicht vollstandig, kehren zuruck und stellen die tarnung wieder her. details und offene fragen zum tunnel .","initial":"D"},{"id":"zeit-0128","category":"chronik","title":"Scaramores Brief und Kaitlyns Tür","summary":"Der Kontakt zur Magisterin beginnt; Styke und Kaitlyn werden heimliche Liebhaber.","body":"<p>Jacobian schreibt Tacitus einen versiegelten Brief über das Reliquiar. <a href=\"#/artikel/styke\">Styke<\/a> kauft ein <a href=\"#/artikel/exorzisten-buch\">Reisebuch<\/a> und benutzt es als Teil des Besuchsvorwands im Mott-Haus. Franz geht zur Festung und nennt für diesen Tag Mitternacht als früheste Rückkehr.<\/p>\n<p>Kaitlyn lässt Styke ein. Die Affäre beginnt; sie deutet einen erneuten Zugang am folgenden Mittag an. Die grauen Briefe sind noch nicht gelesen. Das Buch bleibt auf dem Tisch im vorderen Zimmer, eine spätere Abholung ist nicht bestätigt.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-28","dateLabel":"28. Januar","text":"Jacobian schreibt Tacitus einen versiegelten Brief über das Reliquiar. Styke kauft ein Reisebuch und benutzt es als Teil des Besuchsvorwands im Mott-Haus. Franz geht zur Festung und nennt für diesen Tag Mitternacht als früheste Rückkehr. Kaitlyn lässt Styke ein. Die Affäre beginnt; sie deutet einen erneuten Zugang am folgenden Mittag an. Die grauen Briefe sind noch nicht gelesen. Das Buch bleibt auf dem Tisch im vorderen Zimmer, eine spätere Abholung ist nicht bestätigt.","links":["styke","exorzisten-buch"],"backlinks":[],"search":"scaramores brief und kaitlyns tur der kontakt zur magisterin beginnt; styke und kaitlyn werden heimliche liebhaber. aldencross  jacobian schreibt tacitus einen versiegelten brief uber das reliquiar. styke kauft ein reisebuch und benutzt es als teil des besuchsvorwands im mott-haus. franz geht zur festung und nennt fur diesen tag mitternacht als fruheste ruckkehr. kaitlyn lasst styke ein. die affare beginnt; sie deutet einen erneuten zugang am folgenden mittag an. die grauen briefe sind noch nicht gelesen. das buch bleibt auf dem tisch im vorderen zimmer, eine spatere abholung ist nicht bestatigt.","initial":"S"},{"id":"zeit-0129","category":"chronik","title":"Ein Arbeitstag und fremde Briefe","summary":"Vesper gelangt nach Balentyne und erkennt Kaitlyns bestehende Affäre mit Zack.","body":"<p><a href=\"#/artikel/vesper\">Vesper<\/a> arbeitet in Balentyne und beobachtet die unteren Versorgungswege. Varning ist nun offen überfällig; eine berittene Suche bricht auf. <a href=\"#/artikel/valeria\">Valeria<\/a> findet keinen entscheidenden Lohn- oder Erpressungshebel.<\/p>\n<p>Während Stykes erneuter Begegnung mit Kaitlyn liest Vesper die <a href=\"#/artikel/graue-briefe\">Briefe mit dem grauen Band<\/a> und legt alles zurück. Die Verbindung zu Zack wird gesichertes Spielerwissen. Tacitus will das Reliquiar-Thema anhören, sofern Jacobian dabei ist.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-29","dateLabel":"29. Januar","text":"Vesper arbeitet in Balentyne und beobachtet die unteren Versorgungswege. Varning ist nun offen überfällig; eine berittene Suche bricht auf. Valeria findet keinen entscheidenden Lohn- oder Erpressungshebel. Während Stykes erneuter Begegnung mit Kaitlyn liest Vesper die Briefe mit dem grauen Band und legt alles zurück. Die Verbindung zu Zack wird gesichertes Spielerwissen. Tacitus will das Reliquiar-Thema anhören, sofern Jacobian dabei ist.","links":["vesper","valeria","graue-briefe"],"backlinks":[],"search":"ein arbeitstag und fremde briefe vesper gelangt nach balentyne und erkennt kaitlyns bestehende affare mit zack. aldencross  vesper arbeitet in balentyne und beobachtet die unteren versorgungswege. varning ist nun offen uberfallig; eine berittene suche bricht auf. valeria findet keinen entscheidenden lohn- oder erpressungshebel. wahrend stykes erneuter begegnung mit kaitlyn liest vesper die briefe mit dem grauen band und legt alles zuruck. die verbindung zu zack wird gesichertes spielerwissen. tacitus will das reliquiar-thema anhoren, sofern jacobian dabei ist.","initial":"E"},{"id":"zeit-0130","category":"chronik","title":"Versorgung, Gerüchte, Verabredung","summary":"Der wöchentliche Eintopf und der Termin mit Tacitus werden konkret.","body":"<p><a href=\"#/artikel/styke\">Styke<\/a> und <a href=\"#/artikel/valeria\">Valeria<\/a> trainieren; Valeria beschreibt ihre widersprüchliche Bindung ohne Vergebung. Sie kaufen die <a href=\"#/artikel/abendkleider\">Kleider und Haarschmuck<\/a>. Vespers zweiter Arbeitstag liefert Wasser- und Küchenwissen sowie die Eintopftermine 1. und 8. Februar. Sie streut namenlose Mott-Gerüchte.<\/p>\n<p>Jacobian legt das Treffen auf 31. Januar, 20 Uhr. Valeria gewinnt beim Trinken mit Barnabus Torhausinformationen, die sie noch nicht nüchtern berichtet. Mara berichtet von Winterkrankheiten. Später vertieft sich die persönliche Vertrautheit zwischen Mara und dem Trio, ohne Missionswissen oder Rekrutierung.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-30","dateLabel":"30. Januar","text":"Styke und Valeria trainieren; Valeria beschreibt ihre widersprüchliche Bindung ohne Vergebung. Sie kaufen die Kleider und Haarschmuck . Vespers zweiter Arbeitstag liefert Wasser- und Küchenwissen sowie die Eintopftermine 1. und 8. Februar. Sie streut namenlose Mott-Gerüchte. Jacobian legt das Treffen auf 31. Januar, 20 Uhr. Valeria gewinnt beim Trinken mit Barnabus Torhausinformationen, die sie noch nicht nüchtern berichtet. Mara berichtet von Winterkrankheiten. Später vertieft sich die persönliche Vertrautheit zwischen Mara und dem Trio, ohne Missionswissen oder Rekrutierung.","links":["styke","valeria","abendkleider"],"backlinks":[],"search":"versorgung, geruchte, verabredung der wochentliche eintopf und der termin mit tacitus werden konkret. aldencross  styke und valeria trainieren; valeria beschreibt ihre widerspruchliche bindung ohne vergebung. sie kaufen die kleider und haarschmuck . vespers zweiter arbeitstag liefert wasser- und kuchenwissen sowie die eintopftermine 1. und 8. februar. sie streut namenlose mott-geruchte. jacobian legt das treffen auf 31. januar, 20 uhr. valeria gewinnt beim trinken mit barnabus torhausinformationen, die sie noch nicht nuchtern berichtet. mara berichtet von winterkrankheiten. spater vertieft sich die personliche vertrautheit zwischen mara und dem trio, ohne missionswissen oder rekrutierung.","initial":"V"},{"id":"zeit-0131-tag","category":"chronik","title":"Varnings Tod wird bekannt","summary":"Strengere Sicherheit, Besorgungen und ein noch nicht angenommenes Angebot.","body":"<p>Mara berichtet von der bestätigten Todesnachricht und strengerem Zivilzugang. <a href=\"#/artikel/styke\">Styke<\/a> besorgt <a href=\"#/artikel/ketten-beschlaege\">Ketten und Beschläge<\/a>, <a href=\"#/artikel/tinkturen\">drei Präparate<\/a>, Wein und Duftöl. Rattengift fehlt weiterhin. Er besucht Kaitlyn, hinterlässt eine Duftspur und spricht ein ungleiches Zukunftsangebot aus. Eine zugesagte Zusammenarbeit oder Einladung mit Zeit und Ort existiert noch nicht.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-31T10","dateLabel":"31. Januar, tagsüber","text":"Mara berichtet von der bestätigten Todesnachricht und strengerem Zivilzugang. Styke besorgt Ketten und Beschläge , drei Präparate , Wein und Duftöl. Rattengift fehlt weiterhin. Er besucht Kaitlyn, hinterlässt eine Duftspur und spricht ein ungleiches Zukunftsangebot aus. Eine zugesagte Zusammenarbeit oder Einladung mit Zeit und Ort existiert noch nicht.","links":["styke","ketten-beschlaege","tinkturen"],"backlinks":[],"search":"varnings tod wird bekannt strengere sicherheit, besorgungen und ein noch nicht angenommenes angebot. aldencross  mara berichtet von der bestatigten todesnachricht und strengerem zivilzugang. styke besorgt ketten und beschlage , drei praparate , wein und duftol. rattengift fehlt weiterhin. er besucht kaitlyn, hinterlasst eine duftspur und spricht ein ungleiches zukunftsangebot aus. eine zugesagte zusammenarbeit oder einladung mit zeit und ort existiert noch nicht.","initial":"V"},{"id":"zeit-tacitus","category":"chronik","title":"Verse vor der Magisterin","summary":"Ein ernsthaftes Gespräch über Bewusstsein endet vorzeitig.","body":"<p><a href=\"#/artikel/tacitus\">Tacitus<\/a> spricht mit <a href=\"#/artikel/styke\">Styke<\/a>, <a href=\"#/artikel/vesper\">Vesper<\/a> und <a href=\"#/artikel/verse\">Verse<\/a> bei <a href=\"#/artikel/jacobian\">Jacobian<\/a>. Verse beschreibt Gedächtnislücken, neue eigene Schlüsse und mögliche Unabhängigkeit. Während Stykes Ablenkung gibt Vesper Abführmittel in Tacitus' einzelnes Glas. Die Beschwerden beenden das Gespräch frühzeitig. Keine Entführung, kein öffentlicher Zwischenfall und kein gesicherter Manipulationsverdacht werden festgestellt. Ein zweiter Termin bleibt offen.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-31T20","dateLabel":"31. Januar, 20 Uhr","text":"Tacitus spricht mit Styke , Vesper und Verse bei Jacobian . Verse beschreibt Gedächtnislücken, neue eigene Schlüsse und mögliche Unabhängigkeit. Während Stykes Ablenkung gibt Vesper Abführmittel in Tacitus' einzelnes Glas. Die Beschwerden beenden das Gespräch frühzeitig. Keine Entführung, kein öffentlicher Zwischenfall und kein gesicherter Manipulationsverdacht werden festgestellt. Ein zweiter Termin bleibt offen.","links":["tacitus","styke","vesper","verse","jacobian"],"backlinks":[],"search":"verse vor der magisterin ein ernsthaftes gesprach uber bewusstsein endet vorzeitig. aldencross  tacitus spricht mit styke , vesper und verse bei jacobian . verse beschreibt gedachtnislucken, neue eigene schlusse und mogliche unabhangigkeit. wahrend stykes ablenkung gibt vesper abfuhrmittel in tacitus' einzelnes glas. die beschwerden beenden das gesprach fruhzeitig. keine entfuhrung, kein offentlicher zwischenfall und kein gesicherter manipulationsverdacht werden festgestellt. ein zweiter termin bleibt offen.","initial":"V"},{"id":"zeit-valeria-rueckkehr","category":"chronik","title":"Valerias Rückkehr","summary":"Timeon ist sicher, Tamsin bleibt verschwunden. Der Torhausbericht erreicht die Gruppe.","body":"<p><a href=\"#/artikel/valeria\">Valeria<\/a> kommt erschöpft, aber unverletzt zurück. Sie hat <a href=\"#/artikel/timeon\">Timeon<\/a> sicher angetroffen und keine brauchbare Spur zu Tamsin gefunden. <a href=\"#/artikel/styke\">Styke<\/a> beendet die Suche und untersagt ihre Rückkehr zu Timeon. Valeria akzeptiert die Handlungsvorgabe, nicht die Auslöschung ihrer früheren Bindungen.<\/p>\n<p>Sie berichtet von Winden, Besetzung und Sandabwehr im <a href=\"#/artikel/torhaus\">Torhaus<\/a>. Donnagins Routine wird ihr nächster Schwerpunkt. Der 8./9. Februar ist ein bedingter Angriffsplan, nicht bereits eine übermittelte Absprache mit der Feldgruppe. Gemeinsame Nähe und Fürsorge folgen, dann Schlaf. Die Ketten werden nicht montiert.<\/p>\n","sources":["chronicle","timeline","live"],"status":"Historisch · angenommene Ereignisse","tags":["Aldencross"],"aliases":[],"date":"4712-01-31T23","dateLabel":"Nacht 31. Januar / 1. Februar","text":"Valeria kommt erschöpft, aber unverletzt zurück. Sie hat Timeon sicher angetroffen und keine brauchbare Spur zu Tamsin gefunden. Styke beendet die Suche und untersagt ihre Rückkehr zu Timeon. Valeria akzeptiert die Handlungsvorgabe, nicht die Auslöschung ihrer früheren Bindungen. Sie berichtet von Winden, Besetzung und Sandabwehr im Torhaus . Donnagins Routine wird ihr nächster Schwerpunkt. Der 8./9. Februar ist ein bedingter Angriffsplan, nicht bereits eine übermittelte Absprache mit der Feldgruppe. Gemeinsame Nähe und Fürsorge folgen, dann Schlaf. Die Ketten werden nicht montiert.","links":["valeria","timeon","styke","torhaus"],"backlinks":[],"search":"valerias ruckkehr timeon ist sicher, tamsin bleibt verschwunden. der torhausbericht erreicht die gruppe. aldencross  valeria kommt erschopft, aber unverletzt zuruck. sie hat timeon sicher angetroffen und keine brauchbare spur zu tamsin gefunden. styke beendet die suche und untersagt ihre ruckkehr zu timeon. valeria akzeptiert die handlungsvorgabe, nicht die ausloschung ihrer fruheren bindungen. sie berichtet von winden, besetzung und sandabwehr im torhaus . donnagins routine wird ihr nachster schwerpunkt. der 8./9. februar ist ein bedingter angriffsplan, nicht bereits eine ubermittelte absprache mit der feldgruppe. gemeinsame nahe und fursorge folgen, dann schlaf. die ketten werden nicht montiert.","initial":"V"},{"id":"zeit-0201","category":"chronik","title":"Der frühe Morgen des 1. Februar","summary":"Vesper bricht mit Verse auf; Styke bringt Valeria Frühstück. Der Tag öffnet mehrere getrennte Wege.","body":"<h2>Der Morgen teilt die Gruppe<\/h2>\n<p><a href=\"#/artikel/vesper\">Vesper<\/a> nimmt <a href=\"#/artikel/verse\">Verse<\/a> und versucht erneut, über den zivilen Arbeitsweg nach Balentyne zu gelangen. Styke bittet sie, nach <a href=\"#/artikel/zack\">Zack Eddarly<\/a> zu sehen, möglichst nach Dienstzuweisung und Gesicht statt nach weiterem Gerücht.<\/p>\n<p>Styke bleibt im <a href=\"#/artikel/dalliance\">Dalliance<\/a>, frühstückt und bringt später Essen zu <a href=\"#/artikel/valeria\">Valeria<\/a>. Was zwischen ihnen danach geschieht, hat eine eigene private Akte und gehört nicht in die öffentliche Chronik.<\/p>\n<p>Der Morgen endet nicht mit einem neuen Auftrag, sondern mit auseinanderlaufenden Fäden: Vesper in der Festung, Valeria später wieder im Bett, Styke bei Karten, Training und den Stimmen des Gasthauses.<\/p>\n<p><a href=\"#/artikel/zeit-0201-spaeter\">Zum späteren 1. Februar<\/a>.<\/p>","sources":["live","chronicle"],"status":"Historisch · angenommene Ereignisse","tags":["Aktueller Morgen"],"aliases":[],"date":"4712-02-01","dateLabel":"1. Februar, früher Morgen","text":"Der Morgen teilt die Gruppe Vesper nimmt Verse und versucht erneut, über den zivilen Arbeitsweg nach Balentyne zu gelangen. Styke bittet sie, nach Zack Eddarly zu sehen, möglichst nach Dienstzuweisung und Gesicht statt nach weiterem Gerücht. Styke bleibt im Dalliance , frühstückt und bringt später Essen zu Valeria . Was zwischen ihnen danach geschieht, hat eine eigene private Akte und gehört nicht in die öffentliche Chronik. Der Morgen endet nicht mit einem neuen Auftrag, sondern mit auseinanderlaufenden Fäden: Vesper in der Festung, Valeria später wieder im Bett, Styke bei Karten, Training und den Stimmen des Gasthauses. Zum späteren 1. Februar .","search":"der fruhe morgen des 1. februar vesper bricht mit verse auf; styke bringt valeria fruhstuck. der tag offnet mehrere getrennte wege. aktueller morgen  der morgen teilt die gruppe vesper nimmt verse und versucht erneut, uber den zivilen arbeitsweg nach balentyne zu gelangen. styke bittet sie, nach zack eddarly zu sehen, moglichst nach dienstzuweisung und gesicht statt nach weiterem gerucht. styke bleibt im dalliance , fruhstuckt und bringt spater essen zu valeria . was zwischen ihnen danach geschieht, hat eine eigene private akte und gehort nicht in die offentliche chronik. der morgen endet nicht mit einem neuen auftrag, sondern mit auseinanderlaufenden faden: vesper in der festung, valeria spater wieder im bett, styke bei karten, training und den stimmen des gasthauses. zum spateren 1. februar .","links":["vesper","verse","zack","dalliance","valeria","zeit-0201-spaeter"],"backlinks":[],"initial":"D"},{"id":"kollektiv","category":"regeln","title":"Kollektiv und Telepathie","summary":"Vier freiwillige Plätze sind belegt: Vesper, Valeria, Kaitlyn und Tacitus.","body":"<h2>Mitglieder<\/h2><p>Styke ist Ursprung und zählt nicht gegen das Limit von vier willigen Kreaturen. <strong>Vesper, Valeria, Kaitlyn und Tacitus<\/strong> sind die bestätigten Mitglieder; kein Platz ist frei. Familiar, Freunde und weitere Gebundene gehören nicht automatisch dazu.<\/p><h2>Reichweite und Wissen<\/h2><p>Die aktuelle Zealot-4-Reichweite beträgt 140 ft von Styke. Übertragen wird nur bewusst gesendete Kommunikation. Keine automatischen Gedanken, Erinnerungen, Gefühle, Sinneseindrücke oder Offscreen-Berichte. Teilnahme bleibt freiwillig.<\/p><h2>Mechanische Anwendungen<\/h2><p><a href=\"#/artikel/aid\">Aid / Compartmentalized Aid<\/a> · <a href=\"#/artikel/martyrdom\">Martyrdom<\/a> · <a href=\"#/artikel/echoes\">Echoes of Steel<\/a>. Die gültige Verbindung und tatsächliche Ressourcenausgabe werden beim Einsatz geprüft.<\/p>","sources":["house","ssheet","live"],"status":"Bestätigt","tags":["Psionik","Kommunikation"],"aliases":[],"text":"Mitglieder Styke ist Ursprung und zählt nicht gegen das Limit von vier willigen Kreaturen. Vesper, Valeria, Kaitlyn und Tacitus sind die bestätigten Mitglieder; kein Platz ist frei. Familiar, Freunde und weitere Gebundene gehören nicht automatisch dazu. Reichweite und Wissen Die aktuelle Zealot-4-Reichweite beträgt 140 ft von Styke. Übertragen wird nur bewusst gesendete Kommunikation. Keine automatischen Gedanken, Erinnerungen, Gefühle, Sinneseindrücke oder Offscreen-Berichte. Teilnahme bleibt freiwillig. Mechanische Anwendungen Aid / Compartmentalized Aid · Martyrdom · Echoes of Steel . Die gültige Verbindung und tatsächliche Ressourcenausgabe werden beim Einsatz geprüft.","links":["aid","martyrdom","echoes"],"backlinks":[],"search":"kollektiv und telepathie vier freiwillige platze sind belegt: vesper, valeria, kaitlyn und tacitus. psionik kommunikation  mitglieder styke ist ursprung und zahlt nicht gegen das limit von vier willigen kreaturen. vesper, valeria, kaitlyn und tacitus sind die bestatigten mitglieder; kein platz ist frei. familiar, freunde und weitere gebundene gehoren nicht automatisch dazu. reichweite und wissen die aktuelle zealot-4-reichweite betragt 140 ft von styke. ubertragen wird nur bewusst gesendete kommunikation. keine automatischen gedanken, erinnerungen, gefuhle, sinneseindrucke oder offscreen-berichte. teilnahme bleibt freiwillig. mechanische anwendungen aid / compartmentalized aid · martyrdom · echoes of steel . die gultige verbindung und tatsachliche ressourcenausgabe werden beim einsatz gepruft.","initial":"K","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"hausregeln","category":"regeln","title":"Hausregeln und Spielkonventionen","summary":"Die kampagnenspezifischen Abweichungen neben den drei aktuellen Bögen.","body":"<h2>Kontrolle der Figuren<\/h2>\n<p><a href=\"#/artikel/styke\">Styke<\/a> bleibt vollständig spielergesteuert. <a href=\"#/artikel/vesper\">Vesper<\/a> handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. <a href=\"#/artikel/valeria\">Valeria<\/a> bleibt auch im Kampf ein autonomer GM-geführter DMPC.<\/p>\n<h2>Stufe und Fortschritt<\/h2>\n<p>Alle drei sind gegenwärtig Stufe 7. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter <a href=\"#/artikel/buildplanung\">OOC: Buildplanung<\/a>. Sie ist kein gegenwärtiges Ereignis.<\/p>\n<h2>Wissensfertigkeiten und Routine<\/h2>\n<p>Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt.<\/p>\n<p>Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an.<\/p>\n<h2>Spezifische Anpassungen<\/h2>\n<p>Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen fünf Powers Known getrennt. Arcane Enlightenment liefert Vesper fünf täglich wechselbare temporäre Oracle-Zauber.<\/p>\n<p>Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. <a href=\"#/artikel/animus\">Animus und Glyphen<\/a> erläutert die derzeit aktiven Werte.<\/p>\n<h2>Zahlen, die nicht stillschweigend repariert werden<\/h2>\n<p>Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Aktuelle Stufe-7-Bögen haben Vorrang vor überholten Stufe-5-Arbeitsnotizen; nicht bestätigte Restfragen werden nicht durch neue Werte aufgefüllt. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert.<\/p>\n<h2>Normale Nachterholung<\/h2><p>Ein normaler abgeschlossener Übergang von Nacht zu Morgen umfasst ruhige Erholung und die gewöhnliche tägliche Auffrischung. Natürliche Heilung wird bis zum HP-Maximum angewandt; PP, Zauberplätze und tägliche Pools werden aufgefüllt. Eine Einschränkung braucht eine konkrete Unterbrechung oder ausdrücklich verkürzte Ruhe. Fehlende Uhrzeiten, Intimität vor dem Schlaf oder ein früher Termin reichen dafür nicht. Permanenter Attributsentzug bleibt bestehen.<\/p>","sources":["house","localrules","ssheet","vsheet","valsheet"],"status":"Bestätigt","tags":["Hausregel","Spielkontrolle"],"aliases":[],"text":"Kontrolle der Figuren Styke bleibt vollständig spielergesteuert. Vesper handelt außerhalb strukturierter Initiative autonom; ihre Entscheidungen und begrenzten Ressourcen im Kampf steuert der Spieler. Valeria bleibt auch im Kampf ein autonomer GM-geführter DMPC. Stufe und Fortschritt Alle drei sind gegenwärtig Stufe 7. Die bereits besprochene zukünftige Gruppen-/Buildplanung steht getrennt unter OOC: Buildplanung . Sie ist kein gegenwärtiges Ereignis. Wissensfertigkeiten und Routine Knowledge (All) fasst die Wissensgebiete auf den entsprechend geführten Bögen zusammen. Valerias geerbter Fertigkeitsblock ist noch nicht vollständig in diese Form umgerechnet; die belegten Werte werden nicht heimlich neu verteilt. Legales Take 10 hat bei unbedrängter Routine Vorrang. Keine Würfe nur, damit überhaupt gewürfelt wird. Stykes Power Attack ist standardmäßig an. Spezifische Anpassungen Deadly Agility funktioniert bei Styke mit dem zweihändigen Großschwert und dem festgelegten DEX-Multiplikator. Das Kollektiv ist bewusste Kommunikation. Stykes Grad-0-Talente sind von seinen fünf Powers Known getrennt. Arcane Enlightenment liefert Vesper fünf täglich wechselbare temporäre Oracle-Zauber. Vespers Radiant-Dawn-Training entwickelt sich nach dem bezahlten Einstieg automatisch entlang der Martial-Training-Linie. Ihr zusätzliches Animus-/Glyph-Paket ist begrenzt und keine zweite volle Initiatorprogression. Animus und Glyphen erläutert die derzeit aktiven Werte. Zahlen, die nicht stillschweigend repariert werden Die HP der aktuellen Bögen gelten, obwohl ältere Aussagen zur globalen HP-Formel nicht lückenlos dazu passen. Aktuelle Stufe-7-Bögen haben Vorrang vor überholten Stufe-5-Arbeitsnotizen; nicht bestätigte Restfragen werden nicht durch neue Werte aufgefüllt. Keine fremde Regelversion ersetzt hier ohne Beschluss einen Kampagnenwert. Normale Nachterholung Ein normaler abgeschlossener Übergang von Nacht zu Morgen umfasst ruhige Erholung und die gewöhnliche tägliche Auffrischung. Natürliche Heilung wird bis zum HP-Maximum angewandt; PP, Zauberplätze und tägliche Pools werden aufgefüllt. Eine Einschränkung braucht eine konkrete Unterbrechung oder ausdrücklich verkürzte Ruhe. Fehlende Uhrzeiten, Intimität vor dem Schlaf oder ein früher Termin reichen dafür nicht. Permanenter Attributsentzug bleibt bestehen.","links":["styke","vesper","valeria","buildplanung","animus"],"backlinks":[],"search":"hausregeln und spielkonventionen die kampagnenspezifischen abweichungen neben den drei aktuellen bogen. hausregel spielkontrolle  kontrolle der figuren styke bleibt vollstandig spielergesteuert. vesp , 5/5.","links":[],"backlinks":["hausregeln"],"search":"ooc: bereits besprochene buildplanung aktive stufe-7-builds; stykes +2-umhang ist angelegt, aktueller pp-stand 16/16. buildplanung stufe 7 ausrustung  aktiver stand styke: zealot 4 / psion 1 / awakened blade 2, inner eye, 16 pp maximal. vesper: oracle 7, mental acuity, essence 4, radiant dawn style und virtual animus adept 3. valeria: antipaladin 7 mit air grievances und cha 22. ausrustung styke tragt nun cloak of resistance +2; seine rettungswurfe sind fort +9, ref +11 und will +11. valerias charisma-stirnreif +2 bleibt angelegt. verbleibende werkstattreihe: zwei umhangaufwertungen und drei amulette. ressourcenrand styke 48/48 hp und 16/16 pp nach abgeschlossener nachtruhe. vesper bleibt bei 38/38 hp; ihre tagliche auffrischung ist abgeschlossen: 8/8, 7/7, 5/5.","initial":"O"},{"id":"arcane-enlightenment","category":"regeln","title":"Arcane Enlightenment","summary":"Fünf täglich wählbare Sorcerer/Wizard-Zauber als temporäre Oracle Spells Known.","body":"<p>Vesper kann beim täglichen Auffrischen mit Lore Spirit fünf passende Sorcerer/Wizard-Zauber wählen. Sie gelten für diesen Tag als temporäre Oracle Spells Known und werden über ihre normalen Oracle-Slots und CHA gewirkt.<\/p><h2>Standardauswahl<\/h2><p>Dancing Darkness, Silent Image, Euphoric Cloud, Ashen Path und Stinking Cloud bilden den allgemeinen Default. Die letzte akzeptierte Feldauswahl ersetzt Silent Image durch Darkvision. Die verfügbaren Plätze sind nach abgeschlossener Nachtruhe und täglicher Auffrischung 8/8, 7/7 und 5/5. Die bisherige Auswahl bleibt bestehen, bis Vesper sie bewusst ändert.<\/p>","sources":["vsheet","house","localrules"],"status":"Aktiv · Stufe 7","tags":["Oracle","Vesper","Tagesauswahl"],"aliases":[],"text":"Vesper kann beim täglichen Auffrischen mit Lore Spirit fünf passende Sorcerer/Wizard-Zauber wählen. Sie gelten für diesen Tag als temporäre Oracle Spells Known und werden über ihre normalen Oracle-Slots und CHA gewirkt. Standardauswahl Dancing Darkness, Silent Image, Euphoric Cloud, Ashen Path und Stinking Cloud bilden den allgemeinen Default. Die letzte akzeptierte Feldauswahl ersetzt Silent Image durch Darkvision. Die verfügbaren Plätze sind nach abgeschlossener Nachtruhe und täglicher Auffrischung 8/8, 7/7 und 5/5. Die bisherige Auswahl bleibt bestehen, bis Vesper sie bewusst ändert.","links":[],"backlinks":["detect-magic","create-water","purify-food-drink","read-magic","guidance","enhanced-diplomacy","obscuring-mist","protection-from-evil","air-bubble","remove-sickness","cure-light-wounds","unnatural-lust","lesser-restoration","cure-moderate-wounds","tongues","dancing-darkness","silent-image","euphoric-cloud","ashen-path"],"search":"arcane enlightenment funf taglich wahlbare sorcerer/wizard-zauber als temporare oracle spells known. oracle vesper tagesauswahl  vesper kann beim taglichen auffrischen mit lore spirit funf passende sorcerer/wizard-zauber wahlen. sie gelten fur diesen tag als temporare oracle spells known und werden uber ihre normalen oracle-slots und cha gewirkt. standardauswahl dancing darkness, silent image, euphoric cloud, ashen path und stinking cloud bilden den allgemeinen default. die letzte akzeptierte feldauswahl ersetzt silent image durch darkvision. die verfugbaren platze sind nach abgeschlossener nachtruhe und taglicher auffrischung 8/8, 7/7 und 5/5. die bisherige auswahl bleibt bestehen, bis vesper sie bewusst andert.","initial":"A"},{"id":"animus","category":"regeln","title":"Animus, Essence und Martial Glyphs","summary":"Vesper: 6 Start-Animus, elf Glyphen, 45 ft Reichweite und Essence 4.","body":"<h2>Animus<\/h2><p>Kein ausgebbarer Pool außerhalb des Kampfes. Zu Beginn des ersten eigenen Zuges 6 Animus, zu Beginn späterer Züge +1; am Rundenende +1, falls Vesper ein Manöver initiiert hat. Der Pool hält bis eine Minute nach Begegnungsende.<\/p><h2>Glyphen anwenden<\/h2><p>Kosten 1 Animus; Swift Action oder höchstens einmal pro Runde Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 45 ft, Dauer 6 Runden, SG 19. Derselbe Glyph stapelt oder erneuert sich nicht.<\/p><h2>Elf bekannte Glyphen<\/h2><p><a href=\"#/artikel/elemental-shield\">Elemental Shield<\/a> · <a href=\"#/artikel/ghost-eating-blade\">Ghost Eating Blade<\/a> · <a href=\"#/artikel/ghost-armor\">Ghost Armor<\/a> · <a href=\"#/artikel/deflective-armor\">Deflective Armor<\/a> · <a href=\"#/artikel/shadowmeld\">Shadowmeld<\/a>; außerdem Elemental Weapon, Evasive Armor, Blinding Blade, Spirit Stride, Illusionary State und Wind Speed.<\/p><h2>Essence<\/h2><p>4 Essence, Kapazität 2 je Receptacle. Standard: 2 Witness to Glory, 2 Disrupt Essence, 0 Armaments of the Empire. Essence in verbrauchten Manövern bleibt bis Recovery gebunden; Umlagern kostet grundsätzlich eine Swift Action.<\/p>","sources":["vsheet","vrules","localrules"],"status":"Bestätigt","tags":["Vesper","Glyph","Essence"],"aliases":[],"text":"Animus Kein ausgebbarer Pool außerhalb des Kampfes. Zu Beginn des ersten eigenen Zuges 6 Animus, zu Beginn späterer Züge +1; am Rundenende +1, falls Vesper ein Manöver initiiert hat. Der Pool hält bis eine Minute nach Begegnungsende. Glyphen anwenden Kosten 1 Animus; Swift Action oder höchstens einmal pro Runde Free Action nach einem Treffer mit einem Martial Strike. Ein gewöhnlicher Treffer genügt nicht. Reichweite 45 ft, Dauer 6 Runden, SG 19. Derselbe Glyph stapelt oder erneuert sich nicht. Elf bekannte Glyphen Elemental Shield · Ghost Eating Blade · Ghost Armor · Deflective Armor · Shadowmeld ; außerdem Elemental Weapon, Evasive Armor, Blinding Blade, Spirit Stride, Illusionary State und Wind Speed. Essence 4 Essence, Kapazität 2 je Receptacle. Standard: 2 Witness to Glory, 2 Disrupt Essence, 0 Armaments of the Empire. Essence in verbrauchten Manövern bleibt bis Recovery gebunden; Umlagern kostet grundsätzlich eine Swift Action.","links":["elemental-shield","ghost-eating-blade","ghost-armor","deflective-armor","shadowmeld"],"backlinks":["hausregeln"],"search":"animus, essence und martial glyphs vesper: 6 start-animus, elf glyphen, 45 ft reichweite und essence 4. vesper glyph essence  animus kein ausgebbarer pool ausserhalb des kampfes. zu beginn des ersten eigenen zuges 6 animus, zu beginn spaterer zuge +1; am rundenende +1, falls vesper ein manover initiiert hat. der pool halt bis eine minute nach begegnungsende. glyphen anwenden kosten 1 animus; swift action oder hochstens einmal pro runde free action nach einem treffer mit einem martial strike. ein gewohnlicher treffer genugt nicht. reichweite 45 ft, dauer 6 runden, sg 19. derselbe glyph stapelt oder erneuert sich nicht. elf bekannte glyphen elemental shield · ghost eating blade · ghost armor · deflective armor · shadowmeld ; ausserdem elemental weapon, evasive armor, blinding blade, spirit stride, illusionary state und wind speed. essence 4 essence, kapazitat 2 je receptacle. standard: 2 witness to glory, 2 disrupt essence, 0 armaments of the empire. essence in verbrauchten manovern bleibt bis recovery gebunden; umlagern kostet grundsatzlich eine swift action.","initial":"A","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"aid","category":"faehigkeiten","title":"Aid / Compartmentalized Aid","summary":"Move Action, gegnerspezifischer Angriffsbonus und Recovery bis zu drei Manöver.","body":"<p><a href=\"#/artikel/styke\">Styke<\/a> nutzt seine <strong>Move Action<\/strong> zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners <strong>+4 auf seine Angriffe gegen dieses Ziel<\/strong> bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel.<\/p>\n<p>Die Anwendung stellt sofort bis zu <strong>3 geeignete verbrauchte vorbereitete Manöver<\/strong> wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Styke nutzt seine Move Action zur Selbsthilfe gegen einen benannten Gegner. Bei gültigem Aid-Ergebnis gilt durch Helpful/Harrying Partners +4 auf seine Angriffe gegen dieses Ziel bis zum Beginn seines nächsten Zuges. Kein allgemeines +4 gegen jedes Ziel. Die Anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete Manöver wieder her, selbst wenn der Aid-Versuch misslingt. Im selben eigenen Zug gerade initiierte Manöver sind für diese Anwendung ausgeschlossen. Aid aus einer anderen Aktionsquelle löst diese Recovery nicht aus. Der etablierte Kampfmotor aktiviert Zeal.","links":["styke"],"backlinks":["kollektiv"],"search":"aid / compartmentalized aid move action, gegnerspezifischer angriffsbonus und recovery bis zu drei manover. styke klassenfahigkeit  styke nutzt seine move action zur selbsthilfe gegen einen benannten gegner. bei gultigem aid-ergebnis gilt durch helpful/harrying partners +4 auf seine angriffe gegen dieses ziel bis zum beginn seines nachsten zuges. kein allgemeines +4 gegen jedes ziel. die anwendung stellt sofort bis zu 3 geeignete verbrauchte vorbereitete manover wieder her, selbst wenn der aid-versuch misslingt. im selben eigenen zug gerade initiierte manover sind fur diese anwendung ausgeschlossen. aid aus einer anderen aktionsquelle lost diese recovery nicht aus. der etablierte kampfmotor aktiviert zeal.","initial":"A"},{"id":"zeal","category":"faehigkeiten","title":"Zeal +1","summary":"Moralbonus auf Angriffe im Kollektiv für eine Runde.","body":"<p>Ein Treffer mit einem Martial Strike aktiviert <strong>+1 Moral auf Angriffswürfe<\/strong> für Kollektivmitglieder für <strong>1 Runde<\/strong>. Ein bloßer gewöhnlicher Angriff löst dies nicht selbst aus. Die akzeptierte Aid-Anwendung aktiviert Zeal ebenfalls. Beginn und Ablauf müssen im Kampf getrennt geführt werden.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Ein Treffer mit einem Martial Strike aktiviert +1 Moral auf Angriffswürfe für Kollektivmitglieder für 1 Runde . Ein bloßer gewöhnlicher Angriff löst dies nicht selbst aus. Die akzeptierte Aid-Anwendung aktiviert Zeal ebenfalls. Beginn und Ablauf müssen im Kampf getrennt geführt werden.","links":[],"backlinks":[],"search":"zeal +1 moralbonus auf angriffe im kollektiv fur eine runde. styke klassenfahigkeit  ein treffer mit einem martial strike aktiviert +1 moral auf angriffswurfe fur kollektivmitglieder fur 1 runde . ein blosser gewohnlicher angriff lost dies nicht selbst aus. die akzeptierte aid-anwendung aktiviert zeal ebenfalls. beginn und ablauf mussen im kampf getrennt gefuhrt werden.","initial":"Z"},{"id":"living-bastion","category":"faehigkeiten","title":"Living Bastion","summary":"Fokus verleiht +5 ft Reichweite; die Schadenshalbierung verbraucht ihn bewusst.","body":"<p>Solange <a href=\"#/artikel/styke\">Styke<\/a> psionisch fokussiert bleibt: <strong>+5 ft Reach<\/strong>. Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.<\/p>\n","sources":["srules"],"status":"Bestätigt","tags":["Styke","Klassenfähigkeit"],"aliases":[],"owner":"Styke","kind":"Klassenfähigkeit","level":null,"ready":null,"text":"Solange Styke psionisch fokussiert bleibt: +5 ft Reach . Durch Aufgabe des Fokus kann er Schaden eines Verbündeten innerhalb seiner Reichweite nach DR/Resistenz halbieren, einmal pro betroffener Kreatur und Runde. Der Fokus wird nicht automatisch ausgegeben.","links":["styke"],"backlinks":[],"search":"living bastion fokus verleiht +5 ft reichweite; die schadenshalbierung verbraucht ihn bewu urde, ist nur die leichte, weiche Rückkehr ihres ohnehin geringen Haarwuchses plausibel.<\/p>\n\n<h2>Vulva<\/h2>\n<p>Ihre äußere Anatomie ist menschlich und eher definiert als üppig. Die äußeren Labien sind schlanker, weniger gepolstert als bei Kaitlyn oder Vesper. Die inneren Labien sind bereits in Ruhe sichtbar und leicht asymmetrisch, eine Seite reicht etwas weiter. Im Ruhezustand bleibt die Farbe hell rosé und vertieft sich mit Erregung.<\/p>\n<h2>Der eine Körperzug, der Geschichte trägt<\/h2>\n<p>Valerias koitale Inkontinenz besteht seit ihrer Zeit vor Thorns Anwesen und war lange mit Scham verbunden. Stykes ausdrückliche Lust an dieser Reaktion verschob ihre Bedeutung; in der Nacht zum 1. Februar trank Vesper den Urin während des Oralverkehrs und hielt Valeria anschließend. Die Reaktion selbst tritt ohne willentliche Kontrolle auf.<\/p>\n\n<p><a href=\"#/artikel/intim-valeria\">Vorlieben und Erfahrungen<\/a> · <a href=\"#/artikel/intim-styke-valeria\">Styke und Valeria<\/a> · <a href=\"#/artikel/intim-vesper-valeria\">Vesper und Valeria<\/a><\/p><h2>Unveränderte Ausgangsform<\/h2><p>Die Beratung mit Tacitus am 25. Februar hat Valerias Körper nicht verändert. Gewünscht ist eine reversible Ergänzung mit vollständiger eigener Empfindung; konkrete Funktion und Methode sind noch unentschieden. <a href=\"#/artikel/intim-projekt\">Privates Vorhaben<\/a><\/p>","category":"intimitaet","adult":true,"kind":"Körper & Anatomie","owner":["Valeria"],"aliases":["Balina Anatomie","Valeria Körper","Valeria Brüste","Valeria Vulva","blondes Schamhaar"],"tags":["Ab 18","Körper & Anatomie","Valeria"],"sources":["intim-valeria","intim-core-anatomy","intim-relations"],"status":"Kanonisch","dateLabel":"Körperakte: Quellenabgleich 10.09.2026","evidence":"Git-Dokumentation","text":"Ein Körper, der Rüstung kennt Valeria ist groß und kräftig, mit der breiten, zweckmäßigen Muskulatur einer Frau, die Jahre im Sattel, unter Platten und hinter einem Großschwert verbracht hat. Ihre Stärke sitz ","initial":"N","campaignStand":"28. Februar 4712 AR · Morgen"},{"id":"intim-nella","category":"intimitaet","title":"Nella: Zwei Begegnungen und ein Siegel","summary":"Siegel, Gruppennähe und Nellas am 25. Februar selbst gewählte Initiative.","body":"<h2>Das Zimmer über dem Gasthaus<\/h2>\n<p>Nella kam nach ihrer Schicht in Stykes gemietetes Zimmer. Beim Sex riss eine Öse ihrer Leinenbluse, außerdem der Seitenbinder ihrer Unterwäsche. Styke kam in ihr und versprach Ersatz für die beschädigte Unterwäsche. Danach wuschen sie sich und Nella kehrte zunächst an ihre Arbeit zurück.<\/p>\n<h2>Der Carnal Seal<\/h2>\n<p>Bei der späteren Aufnahme schnitt Nella die linke Hand auf und setzte ihr Blut unter den Compact. Während der Pakt offenstand, vollzogen Styke und Nella das Siegel mit Vesper als Keeper. Nella kam beim Geschlechtsverkehr; damit schloss sich der Carnal Seal. Er bindet ihre sexuelle Treue einseitig an Styke und die ausdrücklich zugelassenen Personen.<\/p>\n<p>Vesper empfing dabei eine private Resonanz und sagte anschließend: „Du willst wirklich nach oben.“ Nella antwortete: „Hab ich doch gesagt.“<\/p>\n<h2>Späte Nacht<\/h2>\n<p>Im engen Lager half Nella zusammen mit Valeria, Vespers Hüften beim Sex mit Styke im richtigen Winkel zu halten. Tamsin lag mit im Lager. Nellas Scherz über ein künftiges Fünferbett war genau das: ein frecher Satz in einer inzwischen sehr vertrauten Nacht.<\/p>\n<h2>Körperliche Kontinuität<\/h2>\n<p>Schwerer dunkelbrauner Zopf, dunkle Augen, Kerbe in der linken Braue, volle Brüste, schmale Taille und kräftige Rundung an Hüften und Schenkeln. Schwangerschaftsstand: offen; am 2. Februar wurde nichts festgestellt.<\/p>\n<h2>Der 7. Februar<\/h2><p>Nach ihrer Rückkehr schlief Nella mit Styke, Vesper und Valeria. Sie saß gern oben, mochte einen aufmerksamen Partner ohne dauerndes Reden und genoss, dass die beiden Frauen nicht nur zusahen, sondern an der Begegnung teilnahmen.<\/p><p>Nella sagte, dass sie neugierig auf Sex mit einer Frau sei. Sie will selbst fragen, wenn sie sich dafür entscheidet. Aus dem Abend folgt keine festgelegte Paarung; belegt sind ihre Neugier, ihre Sicherheit im Gruppenbett und die genannten Vorlieben.<\/p><h2>21. Februar in Farholde<\/h2><p>Nella wählte erstmals direkt Vesper. Die Begegnung war wechselseitig; Vesper brachte sie zum Höhepunkt, und Nella sagte danach, dass sie eine Wiederholung will. Später blieb Nella im Zimmer, als Valeria Styke führte, und lernte die vertraute Ordnung des Trios nicht aus Erklärungen, sondern aus Blicken, Befehlen und Reaktionen.<\/p><h2>25. Februar: eigene Initiative<\/h2><p>Nach dem gemeinsamen Bad führte Nella Styke auf eigene Initiative und in ihrem eigenen direkten Ton; Vesper und Valeria waren beteiligt. Damit ist ihr Wunsch, selbst zu führen, gelebte Geschichte. Daraus folgt weder eine dauernde Befehlsgewalt noch eine Übernahme von Valerias Rolle.<\/p>","sources":["intim-nella","intim-live","intim-chronicle","knot-pact","redbook-current"],"status":"Dokumentierter Stand bis 25. Februar","tags":["Ab 18","Nella","Carnal Seal"],"aliases":["Nella Intimität"],"adult":true,"kind":"Nebenfigur","owner":["Nella","Styke","Vesper"],"text":"Das Zimmer über dem Gasthaus Nella kam nach ihrer Schicht in Stykes gemietetes Zimmer. Beim Sex riss eine Öse ihrer Leinenbluse, außerdem der Seitenbinder ihrer Unterwäsche. Styke kam in ihr und versprach Ersatz für die beschädigte Unterwäsche. Danach wuschen sie sich und Nella kehrte zunächst an ihre Arbeit zurück. Der Carnal Seal Bei der späteren Aufnahme schnitt Nella die linke Hand auf und setzte ihr Blut unter den Compact. Während der Pakt offenstand, vollzogen Styke und Nella das Siegel mit Vesper als Keeper. Nella kam beim Geschlechtsverkehr; damit schloss sich der Carnal Seal. Er bindet ihre sexuelle Treue einseitig an Styke und die ausdrücklich zugelassenen Personen. Vesper empfing dabei eine private Resonanz und sagte anschließend: „Du willst wirklich nach oben.“ Nella antwortete: „Hab ich doch gesagt.“ S
